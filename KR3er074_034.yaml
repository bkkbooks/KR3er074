body:
  text: 卷之三十四婦人部婦人治法通論保婦人童幼天癸未行之間皆屬少陰天癸既行皆屬厥陰天癸既絕乃屬太陰經也治胎產之病從厥陰者是祖氣生化之原也厥陰與少陽相表裡故治法無犯胃氣及上二焦為三禁不可汗不可下不可利小便若發汗者同傷寒下早之症利大便則脈數而已動於脾利小便則內亡津液胃中枯燥製藥之法能不犯此三禁則榮衛自和而寒熱止矣外則和於榮衛內則調於清便先將此法為初治次後詳而論之見症消息同壞症傷寒為之緩治或小便不利大便秘結或積熱於腸胃之間或已成痿或散血氣而為浮腫蓋產理多門故曰同傷寒壞症如發渴而用白虎氣弱而用黃耆血刺痛而用當歸腹痛而加芍藥以上例症不犯三禁謂產後之久病也若產後暴病又不可拘也如產後熱入血室者用桃仁承氣抵當湯等藥胃堅燥者大承氣不可以泄藥言之產後世人多用烏金四物湯是不分四時之寒熱不分血氣之虛實盲然一概用藥如此而愈加增劇是誤也大抵產病天行則增損柴胡雜症則加減四物又春夏從柴胡秋冬從四物藥性寒熱病症虛實不可不察也四物湯常宜服餌令立四時增損法於後四物湯加減治婦人雜病四物湯見治虛實法春倍川芎一曰春二曰脈弦三曰頭痛夏倍芍藥一曰夏二曰脈洪三曰泄秋倍地黃一曰秋二曰脈澀三曰血虛冬倍當歸一曰冬二曰脈沉三曰寒而不食若臍下虛冷腹痛及腰脊間悶痛宜玄胡六合四物湯四兩玄胡苦楝各一兩炒焦若小腹痛亦用玄胡六合若氣滯經脈故月事頻並臍下多痛宜芍藥六合四物湯四兩芍藥一兩若腹中刺痛惡物不下加當歸芍藥若婦人血虛心痛腹㽲痛不可忍者去地黃加乾薑名四神湯若血崩者加生地黃蒲黃若血藏虛冷崩中去血過多加膠艾若赤白帶下宜香桂六合湯四物湯四兩桂枝香附各五錢若以四物湯為末煉蜜丸如桐子大空心米飲下三四十丸治高年婦人白帶良驗若以四物湯四兩加甘草半兩蜜丸每兩分作八丸酒醋共半盞用溫湯化下名當歸煎去敗血生好血若婦人血積者四物湯加廣朮京三稜桂心乾漆各一兩若婦人筋骨肢節痛及頭痛脈弦憎寒如瘧宜治風六合四物湯四兩羌活防風各一兩若婦人或因傷酒或因產亡血或虛勞五心煩熱者宜四物二連湯四物湯四兩生地黃生黃連胡黃連各一兩若婦人骨蒸加地骨皮牡丹皮若婦人傷寒汗下後飲食減少虛者宜八物湯四物湯四兩黃耆甘草茯苓白朮各一兩凡婦人百病只四物湯加吳茱萸煎若陽藏少使茱萸陰藏多使茱萸無不效者上加減雜病例若保胎氣令人有子四物與縮砂四君子湯各半名八珍湯若妊娠胎動不安下血不止者加艾十葉阿膠五錢蔥白黃耆四物湯加減治妊娠傷寒名六合湯方一十五道方見傷寒部四物湯加減調經方七道見調經部上加減治胎前病例若產後一月內惡物積滯敗血作病或脹或痛胸膈脹悶或發寒熱四肢疼痛加延胡索沒藥香白芷與四物等分為細末淡醋湯或童便調下若血風於產後乘虛發作或產後傷風頭痛發熱百節疼痛加荊芥穗天麻香附石膏藿香各二錢半四物料共一兩中加之水煎服若產後虛勞日久而脈浮疾宜柴胡四物湯川芎熟地當歸芍藥加柴胡人參黃芩甘草半夏曲各三錢上㕮咀水煎服若產婦諸症各隨六經以四物與仲景藥各半服之其效如神海芎歸湯治一切去血過多眩暈悶絕傷胎去血產後崩中去血拔牙去血金瘡去血不止者舉頭欲倒悉能治之當歸川芎各等分上每服五錢水煎服不拘時若產後眩暈加芍藥產後腹痛不可忍加官桂童便酒浸妊娠子死或不死胎動酒水合煎即下未死者即安若虛損腹痛少氣頭眩自汗每服加羊肉一兩生薑十片水煎若臨月服之則縮胎易生若室女婦人心腹㽲痛經水不調水煎服若妊娠胎氣不安產後諸疾酒煎服若難生倒橫子死腹中先用黑豆一大合炒熱與小便合煎服若難產用百草霜香白芷等分童便好醋各一沸湯浸服甚者再服即分娩矣若傷藏毒每服加槐花末五分三日取下血塊即愈若吐血亦服此若血氣上喘下腫空心煎艾湯調下若產後惡血注心迷悶喘急腹痛依前用黑豆加生薑自然汁煎服若產後頭痛加荊芥若崩中漏下失血不止加炒香附每兩入甘草一錢沸湯點服若有白帶者加芍藥半兩乾薑等分米飲調下保諸六合治婦人常病及產後常用之藥治婦人虛勞局方中謂首尾六合如大聖散熟地黃丸是治無熱虛勞也中道藥牡丹煎丸空心食前人參荊芥散臨臥食後是治有熱虛勞也大聖散熟地黃丸人參荊芥散牡丹煎丸並見局方然亦當參考藥味用之丹婦人以血為主血屬陰易於虧欠若非善調攝者不能保全也神仙聚寶丹治血海虛寒虛熱盜汗理宜補養琥珀之燥麝香之散可以用乎面色痿黃肢體浮腫理宜導濕乳香沒藥固可治血可以用乎胎前產後虛實不同逐敗養新攻補難並積塊堅症赤白漏崩宜於彼者必妨於此而欲一方通治可乎世人以其品貴名雅又喜其常服可以安神去邪令人有子殊不知久服者無不有禍自非臟腑能言醫者終不知覺及至變生他病何曾歸咎此丹予侄女形色俱實遲於得子久服此丹癰發於背症候甚危脈散大而澀急以四物湯加減百餘帖而安調經丹經水或紫或黑論經水者陰血也陰必從陽故其色紅稟火色也血為氣之配氣熱則熱氣寒則寒氣升則升氣降則降氣凝則凝氣滯則滯氣清則清氣濁則濁往往見有成塊者氣之凝也將行而痛者氣之滯也來後作痛者氣血俱虛也色淡者亦虛也而有水混之也錯經妄行者氣之亂也紫者氣之熱也黑者熱之甚也今人但見其紫者黑者作痛者成塊者率指為風冷而行溫熱之劑則禍不旋踵矣良由病原論月水諸病皆曰風冷乘之宜其相習而成俗也或曰黑北方水色也紫淡於黑非冷而何予曰經曰亢則害承乃制熱甚者必兼水化所以熱則紫甚則黑也況婦人性執而見鄙嗜欲加倍臟腑厥陽之火無日不起非熱而何若曰風冷必須外得設或有之蓋千百一二者也海四物加黃芩黃連湯治經水如黑豆汁四物湯四兩黃芩黃連各一兩上為末醋糊丸服丹月經黑口渴倦怠形短色黑脈不勻似數黃柏炒黃芩各三錢甘草二錢赤芍藥香附末各半兩上為末醋糊丸白湯下五六十丸永康胡八娘子二十歲二月經事不來忽行小腹痛有塊血紫色白芍藥白朮陳皮各半兩黃芩川芎木通各二錢甘草些炙何孺人氣滯血澀脈不澀經不調或前或後紫色日苦兩大腿外臁麻木有時癢生瘡大便秘滯麻子仁桃仁芍藥各二兩枳殼白朮歸頭威靈仙訶子肉生地陳皮各五錢大黃煅七錢各為末粥丸如桐子大白湯下五六十丸丹經水色淡者氣血俱虛也宜八物湯之類八物者四物四君子也如兼它症隨症加藥樓婦人年四十八因有白帶口渴月經多初血黑色後來血淡倦怠食少臍上急白朮一錢半紅花豆許陳皮一錢木通黃芩各五分縮砂甘草炙各三分枳殼五分白芍藥一錢上煎湯下保和丸三十丸抑青丸二十丸海四物加黃芩白朮湯治經水過多四物湯四兩黃芩白朮各一兩丹經水過多黃芩炒芍藥炒龜板炙各一兩黃柏三錢炒香附二錢半椿樹根皮七錢半上為末酒糊丸空心白湯下五六十丸丹一婦人脈弦而大不數形肥初夏時倦怠月經來時多此稟受弱氣不足攝血故行多白朮一錢半黃耆生陳皮各一錢人參五分甘草三錢炙海四物加葵花湯治經水澀少四物湯四兩葵花一兩一方又加紅花血見愁四物湯加熟地黃當歸湯治經水少而色和四物湯四兩熟地當歸各一兩脈師曰有一婦人來診言經水少不如前者何也師曰曾更下利若汗出小便利者可何以故師曰亡其津液故令經水反少設經下多於前者當所苦困當言恐大便難身無復汗也海四物四兩加玄胡索苦楝檳榔木香各一兩治經事將行臍腹絞痛臨經痛者血澀故也丹抑氣丸臨經之時腹痛以四物湯加玄胡索陳皮牡丹皮甘草痛甚以豆淋酒痛少以童便煮香附入條芩為丸經水將來而痛者四物湯加桃仁香附黃連周壁婦人四十餘月經不調行時腹疼行後又有三四日淋瀝皆穢水口渴面黃倦怠無力白朮一兩歸身尾六錢陳皮七錢黃連三錢木通黃耆生黃芩各二錢甘草一錢炙分八帖下五靈脂丸四十粒食前服仁十三孺人月經不勻血紫色來作痛倦怠惡寒為人性急青皮五錢川芎黃芩牡丹皮茯苓三錢乾薑一錢甘草五分炙分二帖水煎服一婦人二十歲月經不勻來時先呵欠腹隱疼血紫色食少無力白朮四錢黃連陳皮各二錢半牡丹皮二錢木通黃芩人參茱萸一錢半甘草五分炙分四帖水二盞煎取小盞食前服云桂枝桃仁湯治經候前先腹痛不可忍桂枝芍藥生地各二兩桃仁四十個甘草一兩上為粗末每服五錢水二盞姜三片棗一枚同煎去渣溫服垣柴胡丁香湯治婦人年三十歲臨經預先臍腰痛甚則腹中亦痛經縮二三日柴胡一錢半羌活一錢丁香四分全蠍一個洗當歸身一錢生地一分上都作一服水四盞煎至一盞去渣稍熱食前服一婦人三十歲每因浴後必用冷水淋通身又嘗大驚遂患經來時必先少腹大痛口吐涎水然後經行行後又吐水二日其痛直至六七日經水止時方住百藥不效予診其脈寸滑大而弦關尺皆弦大而急尺小於關關小於寸所謂前大後小也遂用香附三兩半夏二兩茯苓黃芩各一兩半枳實玄胡牡丹皮人參當歸白朮桃仁各一兩黃連七錢川楝遠志甘草各半兩桂三錢茱萸一錢半分十五帖水煎入生薑汁兩蜆殼熱服後用熱湯洗浴得微汗乃已忌當風坐臥手足見水並吃生冷服三十帖全愈半年後又因驚憂前病復舉腰腹時痛小便淋痛心惕惕跳驚悸予意其表已解病獨在裡先與灸少衝勞宮崑崙三陰交止悸定痛次用桃仁承氣大下之下後用香附三兩蓬朮當歸身各一兩半三稜玄胡索桂大黃青皮俱醋製青木香茴香滑石木通桃仁各一兩烏藥甘草縮砂檳榔苦楝肉各半兩木香吳茱萸各二錢分作二十帖入新取牛膝濕者二錢生薑五片用荷葉湯煎服服訖漸安丹經過後而作痛者乃虛中有熱所以作痛新荷姐頭痛口乾經行後身痛腰甚痛生地白朮芍藥各一錢芎藭歸身尾各五分黃柏炒甘草炙各三分水少酒煎服本治婦人月經壅滯每發心腹臍㽲痛不可忍及治產後惡露不快血上搶心迷悶不省氣絕欲死者琥珀散京三稜蓬莪朮赤芍藥劉寄奴牡丹皮熟地官桂菊花真蒲黃當歸各一兩上前五味用烏豆一升生薑半斤切片米醋四升同煮豆爛為度焙乾入後五味同為末每服二錢溫酒調下空心食前服一方不用菊花蒲黃用烏藥玄胡索亦佳予家之秘方也若是尋常血氣痛只一服產後血衝心二服便下常服尤佳予前後救人急切不少此藥亦宜多合以救人大交加散治榮衛不和月經湛濁逐散惡血腹痛經血諸疾並皆治之生薑二斤生地二斤二味制白芍藥當歸桂心各一兩紅花炒無惡血不用沒藥另研各半兩蒲黃隔紙炒玄胡索醋紙包煨熱用布擦去皮各一兩上將地黃汁炒生薑滓薑汁炒地黃滓各焙乾用諸藥為細末每服三錢溫酒調下若月經不依常蘇木煎酒調下若腰痛糖酒調下丹瘀血香附醋煮四兩桃仁一兩牡丹皮大黃蒸當歸各一兩川芎紅花各半兩瓦壟子煅醋煮一晝夜二兩上炊餅為丸空心溫酒下三四丸交加地黃丸治婦人經不調血塊氣痞肚腹疼痛生地老薑各一斤玄胡索當歸川芎芍藥各二兩明沒藥木香各一兩桃仁去皮尖人參各兩半香附半斤上為末先以生薑汁浸地黃渣以地黃汁浸生薑渣曬乾皆以汁盡為度共十一味作一處曬乾研為末醋糊為丸空心以薑湯下大交加散治婦人榮衛不通經脈不調腹中撮痛氣多血少結聚為癥產後中風生地生薑各五兩各研取汁上交互取汁浸一夕各炒黃漬汁盡為度末之尋常腹痛酒調下三錢產後尤不可闕丹益母草一名天麻未結子時採一擔以水五斗煮半乾去渣再熬成膏每用半小盞和酒並薑汁放開服之大治汙血及血經不調經不及期者血熱四物湯加黃連肥人不及日數而多痰者血虛有熱南星白朮蒼朮黃連香附川芎作丸婦人患經血紫黑一月兩次行不思食口乾苦時發熱麥門冬當歸身白芍藥陳皮白朮各一兩人參地黃茯苓各半兩木通三錢生甘草一錢上分十二帖食前熱飲下抑青與點各十五仲帶下經水不利小腹滿痛經一月再見者土瓜根散主之亦主陰㿗腫疝土瓜根芍藥桂枝䗪蟲各三分上四味杵為散酒服方寸匕日三服丹經水過期血少川芎當歸人參白朮與痰藥過期淡色者痰多也二陳湯加芎歸過期紫色有塊血熱也必作痛四物湯加香附黃連脈師曰脈微血氣俱虛年少者亡血也乳子下利為可否者此為居經三月一來師曰寸口脈微而澀微則衛氣不足澀則血氣無餘衛不足其息短其形燥血不足其形逆榮衛俱虛言語謬誤趺陽脈浮而澀澀則衛氣虛虛則短氣咽燥而口苦胃氣澀則失液少陰脈微而遲微則無精遲則陰中寒澀則血不來此為居經三月一來問曰婦人妊娠三月師脈之言此婦人非軀今月經當下其脈何類何以別之師曰寸口脈衛浮而大榮反而弱浮大則氣強反弱則少血孤陽獨呼陰不能吸二氣不停衛降榮竭陰為積寒陽為聚熱陽盛不潤經絡不足陰虛陽往一作實故令少血時發灑淅咽燥汗出或溲稠數多唾涎沫此令重虛津液漏泄故知非軀蓄煩滿血月稟一經三月一來陰盛則瀉名曰居經謂右脈浮大左脈反弱也海四物加黃芩湯治經暴下四物湯四兩黃芩如腹痛加黃連一兩夏月不去黃芩經水適來適斷或有往來寒熱者先服小柴胡湯以去其寒熱後以四物湯和之本婦人血脈不調往來寒熱狀如勞倦當歸川芎甘草黃耆官桂去粗皮各一兩熟地白朮白芍藥各二兩柴胡阿膠各半兩上為細末每服五錢棗子一枚水煎空心溫服白湯點服亦得常服不生帶下調血脈養子宮終身無病垣升陽舉經湯治經水不止右尺脈按之空虛是氣血俱脫大寒症輕手其脈數疾舉指弦緊或澀皆陽脫之症陰火亦亡見熱症於口鼻眼或渴此皆陰躁陽欲去也當溫之舉之升之燥之此法大升浮血氣補命門之下脫也諸藥言根近苗處去苗便是柴胡根當歸根白朮黃耆各三錢藁本去土羌活根防風根各二錢紅花白芍藥各五分獨活根錢半桃仁去皮尖研十個細辛六分川芎熟地水中沉者人參去蘆黑附子炮去皮臍甘草梢炙各一錢肉桂去皮夏不用秋冬用五分上為粗末每服二錢水三盞煎至八分空心稍熱服本治婦人病多是月經乍多乍少或前或後時發疼痛醫者一類呼為經病不曾說是陰勝陽是陽勝陰所以服藥少效蓋陰氣乘陽則胞寒氣冷血不運行經所謂天寒地凍水凝成冰故令乍少而在月後若陽氣乘陰則血流散溢經所謂天暑地熱經水沸溢故令乍多而在月前當別其陰陽調其血氣使不相乘以平為期宜紫石英丸紫石英研水飛禹餘糧燒醋淬人參龍骨川烏頭炮桂心桑寄生杜仲炒五味子遠志澤瀉當歸石斛肉蓯蓉酒浸乾薑各二兩川椒牡蠣煅甘草各半兩上為末煉蜜丸如桐子大每服三十丸至五十丸空心食前服竹芩心丸治婦人四十九歲以後天癸當住每月卻行或過多不止用黃芩心枝條者二兩米泔浸七日炙乾又浸又炙如此七次為末醋丸如桐子大每服七十丸空心溫酒送下日進二服本治婦人天癸已過期經脈不勻或三四月不行或一月再至腰腹疼痛素問云七損八益謂女子七數盡而經不依時者血有餘也不可止之但令得依時不腰痛為善宜此當歸散當歸川芎白芍藥炒黃芩炒各一兩白朮半兩上為細末每服二錢酒調下空心食前日三次服即去黃芩加桂枝一兩脈問曰婦人年五十數一朝而清血二三日不止何以治之師曰此婦人前絕生經水不下今反清血此為居經不須治當自止經水下常五日止者五日愈心月經不調陰獨三分此穴大效須待經定為度在足四指間三壯東又法內踝下白肉際青脈上灸隨年壯集又法中極三陰交腎俞氣海心經閉久忽大崩復又斷絕復又大行不調者豐隆六分止血石門五分斷經婦人五旬經斷後再行或多或少或瘀或紅並下腹中氣滿如胎孕天樞中脘氣海各五分立愈甲婦人漏下苦血閉不通逆氣脹血海主之女子胞中痛月水不以時休止天樞主之千金作腹脹腸鳴氣上衝胸小腹脹滿痛引陰中月水至則腰脊痛胞中瘕子門有寒引髕髀水道主之千金引髕髀作大小便不通經閉丹血枯經閉者四物湯加桃仁紅花陰虛經脈久不通小便短澀身疼者四物加蒼朮牛膝陳皮生甘草作湯又用蒼莎丸加蒼耳酒芍藥為丸就煎前藥吞下上丹溪治血枯大法垣經閉不行有三補前人之闕婦人脾胃久虛形體羸弱氣血俱衰而致經水斷絕不行或病中消胃熱善食漸瘦津液不生夫經者血脈津液所化津液既絕為熱所爍肌肉漸瘦時見渴燥血海枯竭病名曰血枯經絕宜瀉胃之燥熱補益氣血經自行矣此症或經適行而有子子亦不安為胎病者有矣此中焦胃熱結也或心包脈洪數躁作時見大便秘澀小便雖清不利而經水閉絕不行此乃血海乾枯宜調血脈除包絡中火邪而經自行矣此下焦胞脈熱結也或因勞心心火上行月事不來者胞脈閉也包脈者屬於心而絡於胞中今氣上迫肺心氣不得下通故月事不來宜安心補血瀉火經自行矣此上焦心肝肺熱結也裴澤之夫人病寒熱月事不至者數年又加喘嗽醫者率以蛤蚧桂附投之曰不然夫人病陰為陽所搏溫劑太過故無益反害投以涼劑涼血和血藥則行矣已而果然潔女子月事不來者先瀉心火血自下也內經曰二陽之病發心脾有不得隱曲故女子不月其傳為風消王注曰大腸胃熱也心脾受之心主血心病則血不流脾主味脾病則主味不化味不化則精不足故其病則不能隱曲脾土已虧則風邪勝而氣愈消也又經曰月事不來者胞脈閉也胞脈屬於心絡於胞中今氣上迫肺心氣不得下通故月事不來先服降心火之劑後服局方中五補丸後以衛生湯治脾養血也局五補丸補諸虛安五臟堅骨髓養精神熟地人參牛膝酒浸去蘆焙乾白茯苓地骨皮各等分上為細末煉蜜丸如桐子大每服三五十丸溫酒下空心服衛生湯當歸白芍藥各二兩黃耆三兩甘草一兩上為末每服半兩水二盞煎至一盞溫服空心如虛者加人參一兩上東垣潔古治血枯之法皆主於補血瀉火也補血者四物之類瀉火者東垣分上中下故火在中則善食消渴治以調胃承氣之類火在下則大小秘澀治以玉燭之類玉燭者四物與調胃承氣等分也火在上則得於勞心治以芩連及三和之類三和者四物涼膈當歸等分也潔古先服降心火之劑者蓋亦芩連三和玉燭之類後服五補衛生者亦補氣之劑也素帝曰有病胸脅支滿者妨於食病至則先聞腥臊臭出清液先唾血四肢清目眩時時前後血病名為何何以得之岐伯曰病名血枯此得之少年時有所大脫血若醉入房中氣竭肝傷故月事衰少不來也帝曰治之奈何岐伯曰以四烏鰂骨一藘茹二味併合之丸以雀卵大如小豆以五丸為後飯飲以鮑魚汁利腸中及傷肝也腹中論王注云烏鰂魚骨主血閉藘茹主散惡血雀卵主血痿鮑魚主瘀血河間宣明論方烏鰂骨藘茹各等分雀卵不拘數和丸小豆大每服五丸至十丸煎鮑魚湯下食後日三服壓以美膳上岐伯河間治血枯之法脈問曰婦人病下利而經水反斷者何也師曰但當止利經自當下勿怪所以利不止而血斷者但下利亡津液故經斷利止津液復經當自下問曰婦人病經水斷一二月而反經來今脈反微澀何也師曰此前月中若當下利故令妨經利止月經當自下此非軀也婦人血下咽乾而不渴其經必斷此榮不足本自有微寒故不引飲渴而引飲者津液得通榮衛自和其經必復下仲婦人之病因虛積冷結氣為諸經水斷絕至有歷年血寒積結胞門寒傷經絡凝堅在上嘔吐涎沫久成肺癰形體損分在中盤結繞臍寒疝或兩脅疼痛與臟相連或結熱中病在關元脈數無瘡肌若魚鱗時著男子非止女身在下未多經候不勻令陰掣痛少腹惡寒或引腰脊下根氣衝氣衝急痛膝脛疼煩奄忽眩冒狀如厥癲或有憂慘悲傷多嗔此皆帶下非有鬼神久則羸瘦脈虛多寒三十六病千變萬端審脈陰陽虛實緊弦行其針藥治危得安其雖同病脈各異源子當辨記勿謂不然丹經候過期不行杜牛膝搗汁大半鍾以玄胡末一錢香附末枳殼末各半錢早調服大萬病丸治經事不來繞臍痛乾漆杵碎炒煙盡牛膝去苗酒浸一宿焙乾一兩上為末以生地黃汁一升入二味藥末銀器內慢火熬可丸即丸如桐子大每服二丸空心米飲或溫酒下療月水不利臍下憋逆氣脹滿欲嘔不得睡憋伴列切急也當歸四錢乾漆三錢炒煙盡上為末煉蜜丸如桐子大空心溫酒下十五丸治月經壅滯臍腹㽲痛當歸玄胡索上為粗末每服三錢姜三片水一鍾半煎至七分去渣稍熱服小腸移熱於大腸為伏瘕為沉全文見診病傳變王注云血澀不利則月事沉滯而不行聖治婦人月水滯澀不快結成瘕塊筋脹大欲死用馬鞭草根苗五斤銼細水五斗煎至一斗去渣別以淨器盛熬成膏食前溫酒調下半匙本草云馬鞭草辛涼破血瘕羅血極膏治婦乾血氣以川大黃為末用釅醋熬成膏子丸如雞頭大每服一丸熱酒化開臨臥溫服大便利一二行後紅脈自下是婦人之仙藥也加當歸頭仲婦人經水不利抵當湯主之亦治男子膀胱滿急有瘀血者方見傷寒上經一節方三首皆治汙血有熱而經閉前一方輕劑後二方重劑也云紅花當歸散治婦人經候不行或積瘀血腰腹疼痛及室女月經不通紅花當歸尾紫葳牛膝甘草蘇木細銼各二兩白芷一兩半赤芍藥八兩劉寄奴五兩桂心一兩半上為細末空心熱酒調三錢服之食前臨臥再服若久血不行濃煎紅花酒下孕婦休服牛膝散治婦人月水不利臍腹㽲痛牛膝一兩桂心赤芍藥桃仁玄胡索當歸牡丹皮川芎木香各七錢半上每服方寸匕為極細末溫酒調下食前溫經湯若經道不通繞臍寒痛脈沉緊宜此及桂枝桃仁湯萬病丸當歸川芎芍藥桂心牡丹皮蓬莪朮各半兩人參甘草牛膝各一兩上㕮咀每服五錢水一盞半去渣溫服桂枝桃仁湯方見調經牡丹皮散治婦人月水不利臍腹疼痛牡丹皮大黃炒各一兩赤芍藥生地黃桃仁當歸桂心赤茯苓白朮各七錢半石葦去毛木香各半兩上㕮咀每服五錢水一盞半生薑三片煎至七分去渣空心溫服本治婦人室女月候不通疼痛或成血瘕通經丸桂心青皮去白大黃炮乾薑川椒川烏蓬莪朮乾漆當歸桃仁各等分上為末先將四錢用米醋熬成膏和餘六錢末成劑臼中杵丸如桐子大曬乾每服二十丸用淡醋湯下加至三十丸溫酒亦得空心食前服上方六首皆治汙血有寒而經閉前四方輕劑後二方重劑也大治月水不通屢試有驗厚朴不以多少薑汁炙香細切濃煎去渣空心服不過三四劑瘥形實氣盛者宜之丹積痰傷經不行夜則妄語栝蔞子一兩黃連半兩吳茱萸十兩桃仁五十個紅曲二錢縮砂三兩山楂末上生薑研炊餅為丸軀脂滿經閉導痰湯加芎連不可服地黃如用薑汁炒導痰湯即二陳加枳實黃連是也楊村婦人年二十餘兩年經閉食少乏力黃連二兩白朮一錢半陳皮滑石各一錢黃芩半兩木通三分桃仁十二個甘草炙些上丹溪治痰結胸腹而經閉之法皆用輕劑導痰降火也經云氣上迫肺則心氣不得下通故月事不來今用連樸之類導痰降火使不上迫於肺故心氣下通而月事來也丹溪治一婦人久瘧食少經閉兩手無脈每日與三花神佑丸十餘粒津咽之月餘食進脈出又半月脈愈又一月經行亦此意也詳見久瘧予嘗體丹溪之意治陳氏婦二十餘歲形肥痞塞不食每日臥至未牌吃一盞薄粥吃粥後必吐水半碗仍復臥經不通三月矣前番曾暗通黑色脈之辰時寸關滑皆有力午後關滑寸不滑詢之因乘怒飲食而然遂以白朮一兩半厚朴黃連枳實各一兩半夏茯苓陳皮山楂人參滑石各八錢縮砂香附桃仁各半兩紅花二錢分作十帖每日服一帖各入薑汁二蜆殼間三日以神佑丸神秘沉香丸微下之至十二日吐止食漸進四十日平復如故又汪氏婦五十餘形瘦亦痞不食吐水經不通以前藥方加參朮歸為君煎熟入竹瀝半盞薑汁服之但不用神佑丸下亦平復若咳嗽寒熱而經閉者當於咳門濕痰條求之子和凡婦人月事不來用茶調散吐之次用玉燭散芎歸湯三和湯桂苓白朮散之類降心火益腎水開胃進食分陰陽利水道之藥也一婦人月事不行寒熱往來口乾頰赤飲食少旦暮間咳一二聲諸醫皆用虻蟲水蛭乾漆硇砂芫青紅娘子沒藥血竭之類惟戴人不然曰古方雖有此法奈病人服之必臍腹發痛飲食不進乃命止藥飲食稍進內經曰二陽之病發心脾心受之則血不流故女子不月既心受積熱宜抑火升水流濕潤燥開胃誘食乃湧出痰一二升下泄水五六行濕水上下皆去血氣自然湍流月事不為水濕所隔自依期而至矣亦不用虻蟲水蛭之類有毒之藥如用之則月經總來小溲反閉他症生矣凡精血不足宜補之以食大忌有毒之藥偏勝而致夭閼多矣一婦人年三十四歲經水不行寒熱往來面色痿黃唇焦頰赤時咳三二聲問其所服之藥黑神散烏金丸四物湯燒肝散鱉甲散建中湯寧肺散針艾千百轉劇家人意倦不欲求治戴人憫之先湧痰五六升午前湧畢午後食進餘症悉除後三日復輕湧之又去痰一二升食益進不數日又下通經散瀉訖一二升後數日去死皮數重小者如麩片大者如葦膜不一月經水自行神氣大康矣月事不來者胞脈閉也胞脈者屬心而絡於胞中今氣上迫肺心氣不得下通故月事不來也全文見水腫胃病見診病息奔條大室女月水不來用雄鼠屎一兩燒存性為細末空心溫酒調下一錢神效海掌中金丸治婦人乾血氣穿山甲炮甘草苦丁香川椒苦葶藶白附子豬牙皂角草烏頭各三錢巴豆一錢全用研上為細末生蔥絞汁和丸彈子大每用一丸新綿包之內陰中一日即白二日即赤三日即血神效仲婦人經水閉不利臟堅癖不止中有乾血下白物礬石丸主之礬石三錢燒杏仁一分上二味末之煉蜜丸棗核大內臟中劇者再納之心經脈不通已有寒熱此穴大效三陰交三分立有效如疼時乃經脈要通也摘經脈不通心術同曲池支溝三里三陰交此四穴壅塞不通則瀉之如虛耗不行則補之集月經斷絕中極三陰交腎俞合谷東又法四滿在丹田傍一寸半心經脈不通變成瘕症飲食如常腹漸大如蠱氣海用針通管去其瀉水惡物陰交取法亦如上去其惡物甲月水不通奔豚泄氣上下引腰脊痛氣穴主之女子不下月水照海主之婦人少腹堅痛月水不通帶脈主之月水不利見血而有身則反敗及乳腫臨泣主之脈師曰有一婦人將一女子年十五所來診言女子年十四時經水自下今經反斷其母言恐怖師曰若是夫人親女必夫人年十四時亦以經水下所以斷此為避年勿怪後當自下腎脈微澀為不月全文見虛實門二陽之病發心脾有不得隱曲女子不月其傳為息奔者死不治全文見診病傳變血崩血崩兼心痛者見心痛門丹紫色成塊者血熱四物加黃連柴胡之類氣虛血虛者皆於四物內加參耆急則治其標白芷湯調百草霜甚者棕櫚灰後用四物加炒乾姜調理因勞者用人參帶升補藥因熱者用黃芩因寒者用炒乾姜丹溪云涎郁胸中清氣不升故經脈壅遏而降下非開涎不足以行氣非氣升則血不能歸隧道此論血泄之義甚明蓋開胸膈濁涎則清氣升清氣升則血歸隧道不崩矣故其症或腹滿如孕或臍腹㽲痛或血結成片或血出則快止則悶或臍上動其治法宜開結痰行滯氣消汙血江氏婦三十五六歲墮胎後血不止食少中滿倦怠不起躁煩六脈沉大而數重取微弦予作怒氣傷肝感動胃氣遂於二陳湯加川芎白朮縮砂二十帖而安仲旋覆花湯治半產漏下脈弦而大旋覆花三兩本草云主留飲結氣蔥十四莖新絳少許上三味以水三升煮取一升頓服之千治婦人崩中下血不止以衣中白魚殭蠶等分為末以井花水服之日三服瘥上三方開痰羅備金散治婦人血崩不止香附子四兩炒當歸尾一兩二錢五靈脂一兩炒上為細末每服五錢醋調空心服立效本治下血不止或成五色崩漏方用香附子舂去皮毛中斷之略炒為末每服二錢用清米飲調下此方徐朝奉傳其內人有是疾遍服藥不效後服此方遂愈須久服為佳亦治產後腹痛大是婦人仙藥常服益血調氣大醋附丸治崩漏帶下積聚癥瘕臍腹㽲痛用香附子不以多少擦去毛用好醋煮出焙碾末醋煮糊為丸如桐子大每服三十丸米飲送下無時婦人數墮胎者此藥尤妙一方用香附子白芷為丸縮砂散治血崩用縮砂仁不以多少於新瓦上炒香為細末米飲調下三錢上四方行滯氣世治血崩用乾荷葉濃煎湯一碗空心服之立愈或調醋炒香附末尤妙云治血崩不止五靈脂二錢炒熟加當歸酒同煎或水酒童便各半盞同煎服一方五靈脂半生半熟為末酒調服一方水煎五靈脂半乾去渣澄清再煎成膏入神麯末為丸如桐子大空心溫酒下二三十丸便止又方鹿茸醋炙當歸各二錢蒲黃半兩炒上三味為末溫酒調下五錢匕日三服仲桂枝茯苓丸治婦人有癥在臍上動下血不止方見胎動下血上四方消汙血垣當歸芍藥湯治婦人經脈漏下不止其色鮮紅時值七月處暑之間先因勞役脾胃虛弱氣短逆自汗不止身熱悶亂惡見飲食亦不思食沉困懶倦四肢無力大便時瀉後復因心氣不足其經脈再下不止惟覺氣下脫其元氣逆上全無惟覺心腹中氣不行氣短則不能言是無力以言非懶語也此藥主之黃耆一錢半白朮蒼朮泔浸去皮當歸身白芍藥各五錢甘草炙生地各三分柴胡二分熟地黃陳皮去白各五分上十味為粗末作二服水煎去渣熱服空心一服之後漸減次日諸症悉去頓喜飲食所以者何蓋氣通而聞飲食之香得平康故也仲婦人陷經漏下黑不解膠薑湯主之即芎歸膠艾湯芎藭阿膠甘草各二兩艾葉當歸各三兩芍藥四兩熟地黃上七味以水五升清酒三升合煮取三升去渣納膠令消盡溫服一升日三服不瘥更作一云加乾薑一兩胡洽治婦胞動無干姜海四物膠艾湯方見婦人門大法條垣益胃升陽湯治血脫益氣古人之法也先補胃氣以助生長故曰陽生陰長諸甘藥為之先務舉世皆以為補氣殊不知甘能生血此陽生陰長之理也故先理胃氣人之一身納穀為寶黃耆二錢人參有嗽者去之神麯炒各一錢半升麻柴胡各五分白朮三錢當歸身酒浸甘草炙陳皮各一錢生黃芩二錢瀉盛暑之伏金肺逆秋涼不用一方用生地上粗末每服三錢或五錢如食添再加之如食減已定三錢內更減之不可多服每服二錢水煎去渣熱服如腹痛每服加白芍藥二分中桂少許如渴口乾加乾葛二分如嗽去人參服不計時候蓋先服此益胃氣升陽湯不止卻服後方柴胡調經湯大舉大升之也宣德侯經歷家人病崩漏醫莫能效切脈之後且以紙疏其症至四十餘種為制調經升陽除濕湯療之明日而十減其八前後五六日良愈調經升陽除濕湯治女子漏下惡血月事不調或暴崩不止多下水漿之物皆由飲食不節或勞傷形體或素有心氣不足因飲酒勞倦致令心火乘脾其人必怠惰嗜臥四肢不收困倦乏力無氣以動氣短上氣逆急上衝其脈緩而弦急按之洪大皆中指下得之脾土受邪也脾主滋榮周身者也心主血血主脈二者受邪病皆在脈脈者血之府也人者脈之神也心不主令胞絡代之故曰心之脈主屬心系心系者胞絡命門之脈也主月事生孕皆由脾胃虛而心胞乘之故漏下血水不調也況脾胃為陰陽之根蒂當除濕去熱益風氣上伸以勝其濕又云火鬱則發之柴胡防風甘草炙藁本升麻各一錢羌活蒼朮黃耆各一錢半獨活五分當歸酒浸五分蔓荊子七分上㕮咀水五大盞煎至一大盞去渣稍熱服空心服藥畢待少時以早膳壓之可一服而已如灸足太陰脾經中血海穴二七壯或三七壯立已此藥乃從權衡之法用風勝濕為胃氣下陷而氣迫於下以救其血之暴崩也若病愈經血惡物已盡主病雖除後必須以黃耆甘草人參當歸之類數服以補之於補氣升陽湯中加和血藥是也若經血氣惡物下之不絕尤宜救其根源治其本經只益脾胃退心火之亢乃治其根蒂也若遇夏月白帶下脫漏不止宜用此湯一服立止柴胡調經湯治經水不止鮮血項筋急腦痛脊骨強痛不思飲食羌活獨活藁本升麻各五分蒼朮一錢柴胡根七分葛根當歸身甘草炙各三分紅花少許上㕮咀作一服水煎去渣稍熱空心服微汗立止一婦人經候黑血凝結成塊左廂有血瘕水瀉不止穀食有時一化有時不化至今歲四月血塊暴下並水注俱作是前後二陰有形之血脫竭於下既久經候尤不調水瀉日見三兩行食罷心煩不快飲食減少甚至瘦弱東垣先生曰夫聖人治病必本四時升降浮沉之理權變之宜若不本四時以順為逆非其治也且治之大法必先歲氣無伐天和無盛盛無虛虛遺人夭殃無致邪無失正絕人長命故聖人云陽盛陰虛下之則愈汗之則死陰盛陽虛汗之則愈下之則死大抵聖人立法各自有義且如升陽或發散之劑是助春夏之陽氣令其上升乃瀉秋冬收藏殞殺寒涼之氣此病是也當用此法治之乃升降浮沉之至理也夫天地之氣以升降浮沉乃從四時如治病逆之則殺人矣故經云順天者昌逆天者亡可不畏哉夫人之身亦有天地四時之氣不可止認在外人體亦同天地也今經漏不止是前陰之氣血已下脫矣水瀉又數年不愈是後陰之氣血又下陷矣後陰者主有形之物也前陰者精氣之門戶俱下竭是病人周身之氣常行秋冬之令陰主殺此等收藏之病是也陽生陰長春夏是也在人身之中令氣升浮者穀氣上行是也既病則周身血氣皆不生長穀氣又不升其肌肉消少是兩儀之氣俱將絕矣既下元二陰俱脫血氣消竭假令當日元是熱症今下焦久脫已化為寒矣此病久沉久降寒濕太勝當急救之瀉寒以熱降濕以燥大升大舉以助長生補養氣血不致偏枯聖人立治之法云濕氣大勝以所勝治之助甲風木上升是也故經云風勝濕是以所勝平之也當調和胃氣次用白朮之類以燥其濕而滋元氣如其不止後用風藥以風勝濕此之謂也此藥便是大舉大升以助春夏二濕之久陷下之至治也又一本云此病次用四物隨濕症加減大獨聖散治婦人血崩不止用防風去蘆不以多少為細末酒煮白麵清調下二錢空心食前日二服更以面作糊酒投之極驗治血崩夏枯草為細末每服二錢米飲調下無時服千治崩中不止芎藭八兩清酒五升煎至二升半分三服不耐者徐徐進之義云芎不可久服令人暴死上大舉大升之劑治崩脈沉弦而洪或沉細而數者皆胃氣下陷也或崩而又久瀉者亦胃氣下陷也故舉之升之其病愈也垣經水漏不住有二補前人之闕婦人脾胃虛損致命門脈沉細而數疾或沉弦而洪大有力寸關脈亦然皆由脾胃有虧下陷於腎與相火相合濕熱下迫經漏不止其色紫黑如夏月腐肉之臭中有白帶者脈必弦細寒作於中有赤帶者其脈洪數病熱明矣必腰痛或臍下痛臨經欲行而先發寒熱往來兩脅急縮兼脾胃症出見或四肢困熱心煩悶不得眠臥心下急宜大補脾胃而升降氣血可一服而愈或先貴而後賤或先富而後貧病名脫營者心氣不足其火大熾旺於血脈之中又致脾胃飲食失節火乘其中形質肌肉顏侶不病者此心病也不形於脈故脾胃飲食不調其症顯矣而經水不時而下或適來適斷暴下不止治當先說惡死之言勸諭令懼死而心不動以大補血氣之藥補養脾胃微加鎮墜心火之藥治其心補陰瀉陽經自止矣痿論云悲哀太甚則胞絡絕胞絡絕則陽氣內動發則心下崩數溲血也故經曰大經空虛發則肌痹傳為脈痿此之謂也丁未年冬郭大方來說其妻經水暴崩不止先曾殞身失血自後一次經數日而來今次不止其人心窄性急多驚以予料之他日必因心氣不足飲食失節得之大方曰容到彼診得掌中寒脈沉細而緩間而沉數九竅微不利四肢無力上喘氣短促口鼻氣皆不調果有心氣不足飲食失節脾胃虛弱之證胃脘當心而痛左脅下急縮有積當臍有動氣腹中鳴下氣大便難諸虛證極多不能盡錄擬先治其本餘證可以皆去與安心定志鎮墜其驚調和脾胃大益元氣補其血脈養其心神以大熱之劑去其冬寒凝在皮膚內少加生地黃去命門相火不令四肢痿弱黃耆當歸人參湯黃耆一錢當歸一錢半人參一錢陳皮五分草豆蔻七分神麯半錢消食去脾胃寒黃連一錢鎮心驚杏仁九個研如泥麻黃一錢不去節表閉汗桂枝半錢必先歲氣無代天和也生地三分去腎火大去冬月相火之旺上為粗末水三大盞先煮麻黃數沸去渣入前藥同煎至一大盞於巳午之前食消盡服之其胃脘痛乃胃上有客寒與大熱藥草豆蔻丸一十五丸其痛立止再與肝之積藥除其積之根源而愈上虛挾積滯而崩嘗治一老婦人血崩不止流流不絕滿床皆血起床不得者三月矣腹滿如孕予作虛挾痰積汙血治之用四物四兩參術各一兩甘草半兩以治虛香附三兩半夏兩半茯苓陳皮枳實縮砂玄胡各一兩以破痰積汙血分二十帖每帖煎加乾荷葉側柏葉湯再煎服之服盡良愈今再不發神效云柏黃散療經血不止黃芩一兩二錢半側柏葉蒲黃各一兩伏龍肝一兩上㕮咀用水二升煎取八合分為二服又方治患崩中不止結作血片如雞肝色碎爛芎藭十二分阿膠青竹茹各八分續斷地榆小薊根各三分當歸六分生地伏龍肝各十一分上用水九盞煮取三盞去渣分作三服衍治婦人血露蠶砂一兩炒伏龍肝半兩阿膠一兩同為末溫酒調空心二三錢以知為度大全名無比散無阿膠羅伏龍肝散治氣血勞傷衝任脈虛經水非時忽然崩下或如豆汁或成血片或五色相雜或赤白相兼臍腹冷痛經久未止令人黃瘦口乾飲食減少四肢無力虛煩驚悸伏龍肝一兩甘草半兩赤石脂一兩芎藭三兩肉桂半兩熟地二兩當歸乾薑各七錢半艾葉二兩微炒麥門冬去心一兩半上件為粗末每服四錢棗二枚水同煎上四方伏龍肝例蓋燥可去濕也前二方去濕熱後二方去寒濕按伏龍肝為止血之聖藥先賢治崩用旋覆花半夏輩治膈間濕痰而崩止者亦是此意大崩中下血不止小腹痛芍藥一兩炒黃柏葉六兩微炒丹溪云柏葉性多燥上水一升煎取六合入酒五合煎取七合空心分為二服一方為細末酒調二錢一方有鹿角膠等分酒調治白帶臍腹痛世牡蠣散治月水不止眾藥不愈者牡蠣火煅研細用醋調成丸再煅過通紅候冷研細出火毒卻用醋調艾末熬成膏和丸如桐子大每服五十丸醋艾湯下素陰虛陽搏謂之崩陰陽別論垣涼血地黃湯治婦人血崩是腎水陰虛不能鎮守胞絡相火故血走而崩也生地半兩黃連三分黃柏二分黃芩一分羌活柴胡知母升麻川芎各二分防風三分藁本二分甘草一分紅花少許歸身五分細辛一分荊芥穗蔓荊子一分上㕮咀都作一服水三大盞煎至一盞去渣稍熱服空心足太陰脾之經中血海二穴在膝臏上內臁白肉際二寸中治女子漏中惡血月事不調逆氣腹脹其脈緩者是也灸三壯足少陰腎之經中陰谷二穴在膝內輔骨後大筋下小筋上按之應手屈膝取之治膝如錐不得屈伸舌縱涎流煩逆溺難少腹急引陰痛股內痛婦人漏下不止腹脹滿不得息小便黃如蠱女子如妊身可灸三壯大小薊湯治崩漏不止色明如水得溫則煩悶者此陽傷於陰令人下血當補其陰脈數疾小者順大者逆小薊莖葉研取汁一盞生地黃汁一盞白朮半兩銼上三件入水一盞煎至一半去渣溫服芎藭酒治崩中晝夜不止醫不能治芎藭一兩生地汁一盞上用酒五盞煮芎藭一盞去渣下地黃汁再煎二三沸分為三服治崩中去血不止大小薊根五兩白茅根三兩上二味細切用酒五升煮取四升去渣分四服丹漏下乃熱兼虛四物加黃連云金華散治血室有熱崩下不止服溫藥不效者延胡索瞿麥穗當歸乾薑牡丹皮各一兩石膏二兩桂心別研為末七錢半蒲黃半兩威靈仙七錢半上為細末每服三錢水一盞半空心溫服日二大治崩中下血黃芩不以多少為細末每服一錢燒秤錘通赤投酒中令沸卻用其酒調服許學士云崩中多用止血補血藥治之陽乘於陰前所謂天暑地熱經水沸溢是也金華散亦妙丹經水多去不能住以三補丸加莎根龜板金毛狗脊三補者芩連柏也子和孟官人母年五十餘血崩一載僉用澤蘭丸黑神散保安丸白薇散補之不效戴人見之曰天癸已盡本不當下血蓋血得熱而流散非寒也夫女子血崩多因大悲哭悲甚則肺葉布心系為之急血不禁而下崩內經曰陰虛陽搏謂之崩陰脈不足陽脈有餘數則內崩血乃下流舉世以虛損治之莫有知其非者可服大劑大劑者黃連解毒湯是也次以香附二兩炒白芍藥二兩焙當歸二兩焙三味同為細末水調下又服檳榔丸不旬日而安垣丁香膠艾湯治崩漏不止蓋心氣不足勞役及飲食不節所得經隔少時其脈兩尺俱弦緊而洪按之無力其證自覺臍下如冰求厚衣被以御其寒白帶白滑之物雖多間下如屋漏水下時有鮮血不多右尺脈時微洪屋漏水多暴下者是急弦脈為寒多而洪脈時見乃熱少合而言之急弦者北方寒水多也洪脈時出者命門胞絡之火也黑物多赤物少合成屋漏水之狀也川芎四分歸身一錢二分生艾葉一錢阿膠六分另後炮入白芍三分熟地三分以瀉大洪脈丁香四分上為細末作一服水二盞煎至五沸去渣入膠艾再上火煎至一大盞空心宿食消盡帶熱服之三服效大治血崩熟艾如雞子大阿膠半兩乾薑一錢上粗末用水五盞先煎艾葉姜至二盞半入膠稍溫分二服空心服又方治崩中不止丁香二兩為細末用酒三升煮取一升空心頓服必效方用丁香百顆酒煎服又方益智炒為細末鹽湯米飲調下世香礬散治血崩香附不以多少極酸醋浸一宿炒焦為灰存性每一兩入白礬末二錢米飲調服空心神妙一法用荷葉湯調尤妙大用香附子去毛炒焦黑存性為細末用極熱酒調下二錢放溫服不過兩服立愈昏迷甚者三錢匕如血山崩不止者亦能解之米飲調亦可許學士云治下血不止或成五色崩漏香附子是婦人仙藥也世婦人血崩不止用檳榔燒灰存性碾末以溫酒調下甚妙大五靈脂散治婦人血山崩諸藥不止者五靈脂炒令煙盡為末每服一錢溫酒調下一法每服三錢水酒童便各半盞煎服名抽刀散琥珀散治崩暴下血赤芍香附子枯荷葉男子發皂莢水洗當歸棕櫚炒焦存性烏紗帽是漆紗頭巾取陽氣先出故也上等分除棕櫚外其餘並用粗片新瓦上煅成黑灰存性三分為細末每服五錢空心童便調下如人行十里再一服七八服即止若產後血去多加米醋京墨麝香少許一法先以五積散加醋煎投一二服次服五靈脂散療經血不止婦人經血正淋漓舊蕊蓮蓬燒作灰熱酒一杯調八字自然安樂更無疑衍黃牛角䚡用尖燒為黑灰微存性治婦人血崩大便血及冷痢白痢大治漏下不止者鹿角燒灰細研食前溫酒調下二錢又方桃仁燒灰研細食前溫酒調下二錢又方亂髮皂角水洗淨燒為細末空心溫酒調下二錢世治血久崩夏枯草燒存性為末空心米飲調下此用灰與前用草不同大荊芥散治婦人崩中不止用好麻油點燈多著燈心就上燒荊芥焦色為細末每服三錢童便調下簡治婦人漏下血不絕槐花蛾不以多少燒作灰細研食前溫酒調二錢匕產寶治崩中不止不問年月遠近用槐耳燒作灰為末以酒服方寸匕大神應散治血崩不止桂心不以多少炒極焦存性為末每服一二錢米飲調下如聖散治血山崩棕櫚烏梅各一兩乾薑一兩五錢並燒過存性上為細末每服二錢烏梅酒調下空心食前服久患不過三服愈治血崩屢效方當歸白芍乾薑棕櫚各等分上各煅存性研為細末醋調以有節朱箸左攪四十九轉食前服又方用棕櫚白礬煅為末酒調二錢服治暴崩下血百草霜二錢狗膽汁一處拌定分作二服當歸酒調下又方京墨為末二錢匕同燒露蜂房為末三指撮酒調服世治血崩用葫蘆去子穰實荊芥穗燒存性飲湯服上二十一方皆燒灰黑藥經云北方黑色入通於腎皆通腎經之藥也夫血者心之色也血見黑即止者由腎水能制心火故也運氣血崩皆屬風火經云少陽司天之政初之氣風勝乃搖候乃大溫其病血崩是也海治崩不定或淋淫經年者白礬溶開成汁一兩沒藥一錢硇砂五分黃丹五分上件將白礬溶開成汁下余藥細末一處攪勻就成丸子如彈子大每用一丸新綿裹定納陰中立效摘經血過多不止並崩中心術同三陰交行間各針訖灸之通里足小指上二寸刺二分灸二七壯桑漏下不止心術摘英同三陰交太衝東胞門不閉漏下惡血不禁氣門在關元傍三寸刺入五分集血崩並漏下中極補子宮二寸半敗血不止三陰交百勞風門中極腎俞膏肓曲池絕骨甲婦人不字陰暴出經水漏然谷主之婦人漏血腹脹滿不得息小便黃陰谷主之千金云漏血少腹痛脹滿如阻體寒熱腹偏腫女子血不通會陰主之女子漏血太衝主之脈問曰五崩何等類師曰白崩者形如涕赤崩者形如絳黃崩者形如爛瓜青崩者形如藍色黑崩者形如衃血也寸口脈弦而大弦則為減大則為芤減則為寒芤則為虛寒虛相搏此名曰革婦人則半產漏下又見諸見血仲寸口脈微而緩微者衛氣疏疏則其膚空緩者胃氣實實則谷消而水化也谷入於胃脈道乃行水入於經其血乃成榮盛則其膚必疏三焦絕經名曰血崩脈診婦人漏血下赤白日下血數升脈急疾者死遲者生診婦人漏下赤白不止脈小虛滑者生大緊實數者死赤白帶丹赤白帶羅先生法或十棗湯或神佑丸或玉燭散皆可用之虛者不可峻攻實者可行血虛加減四物湯氣虛以朮參陳皮間與之赤屬血白屬氣主治燥濕為先濕甚者固腸丸相火動者諸藥中加炒黃柏滑者加龍骨赤石脂滯者加葵花白者治白帶赤者治赤帶性躁者加黃連寒月少加薑附臨機應變先須斷厚味帶下與夢遺同法治之肥人有帶多是濕痰用海石半夏南星炒柏青黛蒼朮川芎瘦人帶病少如有多是熱用炒柏蛤粉滑石川芎青黛樗皮帶漏俱是胃中痰積流下滲膀胱出於大腸小腸宜升提甚者上必用吐以提其氣下用二陳湯加白朮蒼朮仍用丸子治結痰白帶以小胃丹半飢半飽津液下數丸候鬱積行卻服補藥白朮一兩蒼朮半兩紅白葵花二錢半白芍七錢半上蒸餅為丸空心煎四物湯下二十丸陶遵道外姑年七十形瘦善啖白帶食前薑湯吞大補丸五十丸一二次午膳後及臨臥時各與小胃丹十五丸愈大乳香散治赤白帶下草果一個去皮入麝香一小塊用麵餅裹火炮焦黃留性取出和麵用之上為細末每服二錢陳皮飲調下重者三錢丹帶下不止用椒目白芷治白帶用椒目為末米飲調服樗皮丸治赤白帶有濕熱者芍藥五錢良薑三錢燒灰黃柏二錢各炒成灰椿根皮一兩半上為末粥丸每服三五十丸米飲空心吞下赤白帶因濕熱勝而下者蒼朮鹽炒白芍各一兩枳殼三錢椿根皮炒二兩乾薑煨二兩地榆半兩甘草三錢滑石一兩炒上末粥丸米飲下治帶下椿根皮二兩神麯炒麥皮曲炒黃柏各一兩炒芍藥一兩半滑石半兩枳殼半兩蒼朮一兩上為末糊丸桐子大每服五十丸空心固腸丸治濕氣下利大便血白帶去脾胃陳積之後用此以燥下濕亦不曾單用看病作湯使椿根皮為末粥糊為丸此藥性涼而燥須炒用一方加滑石一半治白帶因七情所傷脈數者黃連炒側柏酒蒸黃柏炒各半兩香附醋炒白朮炒各一兩白芷燒存性三錢椿根皮二兩炒白芍一兩木香三錢上為末飯粥為丸米飲湯送下上五方治帶椿皮例涼燥之劑濕熱盛者宜之後一方有黃連香附木香故可治七情所傷大地榆膏治赤白帶下骨立者地榆一斤用水三升煎至一半去渣再煎如稠餳絞淨空心服三合日二服治漏下五色地榆三兩銼用醋一升煮十餘沸去渣稍熱食前服一合千治婦人赤白帶下三葉酸漿草陰乾為末空心溫酒下三錢匕上三方治帶地榆例寒澀之劑亦濕熱盛而滑脫者宜之按三葉酸漿草葉細如萍叢生莖端有三葉俗又名布穀飯布穀者鳩也蓋鳩常食之故又名鳩漿草衍義誤入苦艹躭條即曰三葉酸漿草豈苦艹躭即酸漿歟苦艹躭有子大如金柑味酸可食故亦名酸漿非三葉也三葉酸漿小草布地而生葉皆三瓣惟開黃花其莖葉皆酸者丹白帶龜板炙枳子各二兩黃柏一兩炒白芍七錢半乾薑炒二錢半香附半兩山茱萸苦參樗皮貝母各半兩上為末以酒糊為丸空心下赤白帶龜板二兩酒炙黃柏一兩炒乾薑一錢炒枳子二錢半上酒糊為丸日二服每服七十丸又方治帶下脈數者枸杞根一斤生地五斤上二味以水一斗煮取五升分三服上三方治帶龜扳黃柏地黃例腎水真陰虛者宜之脾傳之腎病名曰疝瘕少腹冤熱而痛出白一名曰蠱當此之時可按可藥全文見診生死王注云出白溲出白液也蓋便濁白帶之類戴人云遺溺閉癃陰痿脬痹精滑白淫男子之疝也血涸不月月罷腰膝上熱足躄嗌乾癃閉少腹有塊或定或移前陰突出後陰痔核皆女子之疝也又云女子不謂之疝而謂之瘕也小腸移熱於大腸為伏瘕為沉全文見診病傳變保赤者熱入小腸白者熱入大腸原其本皆濕熱結於脈故津液湧溢是為赤白帶下本不病結緣五經脈虛結熱屈滯於帶故女子臍下痛陰中綿綿而下也經曰任脈為病男子內結七疝女子帶下瘕聚王注云任脈自胞上過帶脈貫於臍上故男子內結七疝女子帶下帶脈起於季脅章門似束帶狀今濕熱冤結不散故為病也經曰脾傳之腎名曰疝瘕小腸冤結而痛出白一名曰蠱所以為帶下冤結也冤屈也屈滯而病熱不散先以十棗湯下之後服苦楝丸大延胡散調下之熱去濕除病自愈矣十棗湯方見傷寒苦楝丸治婦人赤白帶苦楝碎酒浸茴香炒當歸上等分為末酒糊為丸每服三五十丸空心溫酒下如腰腿疼四物湯四兩加羌活防風各一兩煎湯送下丹治赤白帶下腰痛或少腹痛有熱者樗皮二兩延胡索桃仁側柏葉川楝肉茴香當歸各半兩香附八錢官桂烏藥各三錢麥皮曲一兩炒上末酒糊為丸每服五六十丸神效衍治帶下並腸有敗膿淋露不已腥穢殊甚遂至臍腹更增冷痛此蓋敗膿血所致卒無已期須以此排膿白芷一兩單葉紅蜀葵根二兩白芍藥白礬各半兩礬燒枯另研余為末同以蠟丸如桐子大空肚及飯前米飲下十丸或十五丸候膿盡仍別以補藥佐之垣固真丸治白帶不止臍下冷痛喜干食惡湯飲者方見寒疝帶條本治婦人赤白帶下龍骨半兩舶上硫黃三錢半上為末每服半錢無灰酒調空心服一日三服不問遠年近日盡效大伏龍肝散治婦人赤白帶下久不瘥肌瘦瘁黃棕櫚燒存性伏龍肝屋梁上塵懸長者炒煙盡出火毒上等分研和入龍腦麝香各少許每服二錢酒調醋亦可患十年者半年可安有人經年崩漏不止諸藥不效脈濡微與此伏龍肝散兼白礬丸服之愈白礬丸用白礬四兩附子二兩黃狗頭骨灰四兩為末粥丸桐子大每服三十丸垣補經固真湯白文舉正室白帶常漏久矣諸藥不效診得心包尺脈極微其白帶下流不止叔和脈經云崩中日久為白帶漏下多時骨水枯言崩中者始病血崩久則血少復亡其陽故白滑之物下流不止是本經血海將枯津液復亡枯乾不能滋養筋骨以本部行經為引用為使以大辛甘油膩之藥潤其枯燥而益津液以大辛熱之氣味補其陽道生其血脈以苦寒之藥泄其肺而救上熱傷氣以人參補之以微苦溫之藥為佐而益元氣名曰補經固真湯柴胡甘草各一錢炙乾薑細末二錢橘皮不去白一錢人參二錢郁李仁一錢去皮尖另研如泥白葵花七朵去萼生黃芩一錢細切另入上件除黃芩外以水二大盞煎至一盞七分再入黃芩同煎至一盞去渣空心無宿食熱服之候少時早膳壓之調經補真湯冬後一月微有地泥冰泮其白帶再來陰戶中寒一服立止大進飲食麻黃半錢不去節杏仁三個桂枝少許甘草炙五分良薑一錢黃耆七分人參歸身白朮各五分蒼朮二分澤瀉一錢羌活四分防風二錢柴胡四分獨活藁本各二分升麻根黃芩各五分乾薑二分炮白葵花七朵去萼上除黃芩麻黃外都為粗末先將二味水二盞煎麻黃一味令沸掠去沫入余藥同煎至二盞又再入生黃芩煎至一盞去渣稍熱服空心宿食消盡日高服之一時許可食早膳本治婦人月經不調每行數日不止兼有白帶漸漸瘦瘁飲食少味累年無子地黃丸熟地一兩山茱萸白蕪荑乾薑白芍微炒代赭石醋淬各一兩厚朴白殭蠶上細末煉蜜丸如桐子大每服四五十丸空心酒下日三服此龐老方婦人有白帶是第一等病令人不產育宜急治之此扁鵲過邯鄲聞貴婦人所以專為帶下醫也垣桂附湯治白帶腥臭多悲不樂大寒肉桂一錢附子三錢黃柏知母各五分如少食常飽有時似腹脹加白芍藥半錢如不思飲食加五味子二十個如煩惱面上麻木如蟲行乃胃中元氣極虛加黃耆一錢人參七分炙甘草二分升麻半錢為粗末作一服水二盞煎至一盞法如常食遠熱服海香附六合湯治赤白帶下方見婦人大法條即四物加茴香桂也大治赤白帶下年月深久不瘥白芍二兩乾薑半兩上各炒黃色同為末空心米飲調下二錢日二服垣坐藥龍鹽膏丁香一錢半全蠍五個木香一錢半良薑一錢川烏頭一錢半炮枯礬半錢龍骨茴香歸梢各二錢玄胡五錢炒黃鹽二錢厚朴三錢酒防己紅豆肉桂各二錢木通一錢上為末煉蜜丸如彈子大綿裹留絲在外納陰戶內又方勝陰丹為上藥力小再取三錢內加行性熱藥三柰子川烏大椒各五分柴胡羌活各二錢全蠍三個大蒜破故紙與蒜同焙各一錢升麻二分麝香少許甘松三分白礬二分枯上為細末同前法用制又方回陽丹全蠍升麻各二分草烏頭三分水蛭三個炒虻蟲三個去翅足炒川烏七分大椒五分柴胡七分大蒜破故紙各二錢三柰子蓽茇各五分甘松二分羌活三分枯礬五分炒黃鹽一錢必用之藥去之則不效上為極細末依前制如指尖大用綿裹納陰戶中覺臍下暖為效酒煮當歸丸治㿗疝白帶下疰腳氣腰以下如在冰雪中以火焙炕重厚綿衣蓋上猶冷不任寒之極也面白如枯魚之象肌如刀削消瘦之速也小便不止與白帶長流而不禁固自不知覺面白目青藍如菜色目䀮䀮無所見身重如山行步欹側不能安地腿膝枯細大便秘結口不能言無力之極食不下心下痞煩心懊憹不任其苦面停垢背惡寒小便遺而不知此上中下三陽真氣俱竭故噦嘔不止胃寒之極也其脈沉厥緊而澀按之空虛若脈洪大而澀按之無力猶為中寒之證況按之虛空者乎按之不鼓是為陰寒之極也其空虛乃氣血俱虛之極也當歸一兩茴香半兩黑附子七錢炮製去皮臍良薑七錢上四味銼如麻豆大以好酒一升半同煎煮至酒盡為度炭火焙乾同為極細末入炒黃鹽丁香各半兩全蠍三錢柴胡二錢升麻根木香各一錢苦楝子甘草各半錢炙玄胡索四錢上與前四味藥末同為細末酒煮麵糊為丸如桐子大每服二十丸空心宿食消盡淡醋湯下忌油膩冷物酒面當歸附子湯治臍下冷痛赤白帶下柴胡七分良薑乾薑附子各一錢升麻五分甘草炙六分當歸二錢蠍梢五分炒黃鹽三分黃柏少許上件為粗末用五錢水二盞煎至一盞去渣熱服為丸亦得上炒鹽例東垣回陽丹注云必用炒黃鹽無則不效蓋寒疝之要藥也固真丸治白帶久下不止臍腹冷痛其寒捫之如冰陰中亦然目中溜火上壅視物䀮䀮無所見齒皆惡熱飲痛須得黃連末擦之其痛乃止惟喜干食大惡湯飲此病皆寒濕乘其胞內故喜干而惡濕肝經陰火上溢走於標故上壅而目中溜火腎水侵肝而上溢故目中䀮䀮無所見齒惡熱飲者是少陽陽明經中伏火也當大瀉寒濕以丸藥治之故曰寒在下焦治主宜緩大忌湯散以酒製白石脂白龍骨以枯其濕以炮乾薑大辛熱瀉寒水以黃柏之大寒為因用又為鄉導治法云古者雖有重罪不絕人之後又為之伏其所主先其所因之意又瀉齒中惡熱飲也以柴胡為本經之使以芍藥半錢以導之又恐辛熱之藥太甚損其肝經故微瀉之以當歸身之辛溫大和其血脈此用藥之法備矣白石脂一錢燒赤水飛研細曬乾乾薑炮四錢黃柏酒洗五分柴胡一錢白龍骨二錢酒煮水飛白芍五分當歸三錢酒洗上為細末水煮稀糊為丸如雞頭大每服三十丸空心宿食消盡煎白沸湯放溫送下無令胃中停住待少時以早膳壓之是不令熱藥犯胃忌生冷硬物與酒濕面上石脂龍骨之澀以去脫蓋濕多滑脫者宜之補真潤腸湯治白帶下陰戶中痛控心而急痛身黃皮緩身重如山陰中如冰一名助陽湯防風一錢柴胡一錢二分良薑二錢乾薑一錢陳皮五分白葵花七朵生黃芩五分郁李仁甘草各一錢上為細末銼散只作一服水二盞煎至一盞去渣熱服食前上葵花郁李仁之滑以潤燥蓋枯涸滯著者宜之丹摩腰丹治白帶腹痛方見腰痛門甚效潔治帶下少腹冤結而痛者先以十棗湯下之次服苦楝丸大玄胡散調之是先攻後補之法也丹治結痰白帶先於半飢時以津下小胃丹十餘粒服至鬱積行卻用白朮四物等藥補之亦先攻後補之藥也丹胡安人白帶下月經甚多食少倦怠面黃經中如有血塊者有如筋膜者與參術等補血氣調脾胃後諸症皆退惟帶未止以樗皮丸主之方見濕熱條上法治帶下虛而有熱者若虛而有寒脈微面白不澤無力以言者東垣補經固真湯丁香膠艾湯香桂六合湯是也子和頃頓丘一婦人病帶下連綿不絕白物或來已三載矣命予脈之診其兩手脈俱滑大而有力得六七至常上熱口乾眩暈時嘔酢水余知其實有寒痰在胸中以瓜蒂散吐出冷痰二三升皆酢水也間如黃涎狀如爛膠次以漿粥養其胃氣又次用導水禹功以瀉其下然後以淡劑滲泄之藥利其水道不數日而愈息城李左衙之妻病白帶如水窈漏中綿綿不絕穢臭之氣不可近面黃食減已三年矣諸醫皆云積冷陽起石硫黃薑附之藥重重燥補汙水轉多戴人斷之曰此帶濁水本熱乘太陽經其寒水不禁固故如此也夫水自高而趨下宜先絕其上源乃湧痰三二升次日下沃水斗余行三遍汗出周身至明旦病人云汙已不下矣次用寒涼之劑服及半載產一男仲問曰婦人年五十所病下利數十日不止暮即發熱少腹裡急腹滿手掌煩熱唇口乾燥何也師曰此病屬帶下何以故曾經半產瘀血在少腹不去何以知之其證唇口乾燥故知之當以溫經湯主之吳茱萸三兩當歸芎藭芍藥人參桂枝阿膠牡丹去心生薑甘草各二兩半夏半升麥門冬一升上十二味以水一斗煮取三升分溫三服亦主婦人少腹寒久不受胎兼取崩中去血或月水來過多及至期不來丹赤白帶用五靈脂半生半熟為末酒調服大治白帶下茅花一握炒棕櫚灰三寸嫩蓮葉三葉甘草節一錢上為細末空心酒下方寸匕益母散治帶下赤白惡露下不止益母草開花時採搗為細末空心溫酒二錢日三服香礬散神效方見崩中血見黑止條即醋炒香附灰也丹赤白帶皆屬於血有出於大小腸之分黃荊子炒焦為末米飲調服又方治白帶用白芷以石灰炒去皮茜草少許粥糊丸服大白芷散治赤白帶下白芷一兩海螵蛸二個燒胎髮一團煅上為細末空心溫酒調下二錢山治赤白帶下舊蓮房為末入麝香空心米飲下大治帶下用芍藥炒黑為末每服三錢匕調酒下丹赤白帶用生狗頭骨燒灰存性酒調服或入藥服千治帶下溫水和服雲母末三方寸匕立見神效崔氏四花穴治赤白帶如神取穴法見勞瘵門玉赤白帶中極二寸半赤瀉白補白環俞一寸半瀉六吸補一吸撮又法中極白環俞各五十壯腎俞二寸半灸隨年壯集又法氣海中極白環俞不效取後穴三陽交補多瀉少灸七壯三陰交東又法榮池三分灸三十壯在內踝前後兩邊池中脈一名陰陽穴又法陰陽在足拇指下屈里表頭白肉際是也又法三陰交五分灸交儀二寸灸漏陰在內踝下五分微有動脈是穴刺入一分灸三十壯桑赤帶心術如下赤帶不已漸漸如蠱亦用此法氣海六分中極委中各五分白帶心術如下白帶不已漸漸如蠱亦用此法曲骨承陰各七分中極在兩傍柱骨下六分心婦人得子多變成白水淋漓而下經久身面虛腫陰谷二寸半絕骨二寸半如喘滿魚際透太淵左右共四十九呼治肺經水氣極妙海帶病太陰主之灸章門穴麥粒大各三壯效甲婦人下赤白沃後陰中干痛惡合陰陽少腹䐜堅小便閉曲骨主之女子赤白帶腰腧主之女子赤淫大赫主之女子絕子陰挺出不禁白瀝上窌主之女子赤白瀝心下積脹次窌主之女子赤淫時白氣癃月事少中窌主之女子下蒼汁不禁赤瀝陰中癢痛引少腹控䏚不可俯仰下窌主之女子疝少腹腫赤白淫時多時少蠡溝主之月事不利見赤白而有身及前陰寒行間主之女子疝及少腹腫溏泄癃遺溺陰痛面塵黑目下眥痛太衝主之女子俠臍疝中封主之女子疝瘕按之如以湯沃兩股中小腹腫陰挺出痛經水來下陰中腫或癢漉清汁若葵羹血閉曲泉主之婦人下赤白裡急瘲瘛五樞主之素腎脈小急肝脈小急心脈小急不鼓皆為瘕大奇論王注云小急為寒甚不鼓則血不流血不流而寒薄故血內凝而為瘕也三陽急為瘕三陰急為疝王注云太陽受寒血聚為瘕太陰受寒氣聚為疝脈急者曰疝瘕少腹痛平人氣象論脈師曰婦人帶下六極之病脈浮則為腸鳴腹滿緊則為腹中痛數則為陰中癢痛則生瘡弦則陰疼掣痛婦人帶下脈浮惡寒者不治胎前白帶丹有孕白帶蒼朮三錢白芷二錢黃連炒一錢半黃芩炒二錢黃柏炒一錢半白芍二錢半樗根皮炒一錢半山茱萸二錢半上為末糊丸空心溫酒下五十丸
