body:
  text: 卷之十一肝膽部眩成無己云眩者非眩而見其眩謂眼黑眩也運者運為運轉之運世謂之頭旋是也內經論眩皆屬肝木屬上虛丹溪論眩主於補虛治痰降火仲景治眩亦以痰飲為先也諸風掉眩皆屬於肝全文見診治河掉搖也眩昏亂旋運也風主動故也所謂風氣動而頭目眩運者由風木旺必是金衰不能制木而木復生火風火皆屬陽多為兼化陽主乎動兩動相搏則頭目為之眩運而旋轉故火本動也焰得風則自旋轉人或乘舟車及作環舞而眩運者其動不止而左右紆曲故經曰曲直動搖風之用也眩運而嘔吐者風熱甚故也徇蒙招尤目瞑耳聾下實上虛過在足少陽厥陰甚則入肝全文見治虛實法本治肝厥頭暈清頭目鉤藤散鉤藤陳皮半夏麥門冬茯苓各半兩石膏人參甘菊防風各半兩甘草一分上為粗末每服四錢水一鍾半生薑七片煎至八分溫服治肝厥狀如癇疾不醒嘔吐醒後頭虛運發熱方麻黃鉤藤取皮石膏乾葛半夏曲柴胡甘草枳殼甘菊上為粗末每服四錢水一鍾半生薑三片棗一枚同煎至八分去渣溫服婦人患頭風者十居其半每發必掉眩如在車上蓋因血虛肝有風邪熱故耳素問云徇蒙招搖目眩耳聾下實上虛過在足少陽厥陰甚則歸肝蓋謂此也余常取此方以授人比他藥捷而效速芎藭散川芎一兩當歸三分羌活旋覆花蔓荊子細辛石膏藁本荊芥穗半夏曲炙防風熟地甘草各半兩上為末每服二錢水一大鐘生薑三片同煎至七分去渣溫服不拘時服上甘寒瀉風木羅風痰治驗參政楊公七旬有二有風痰於至元戊辰春忽病頭旋眼黑目不見物心神煩亂兀兀欲吐復不吐心中如懊憹之狀頭偏痛微腫面赤色腮頰亦赤色足胻冷命豫治之余料之此少壯之時喜飲酒久積濕熱於內風痰內作上熱下寒是陰陽不得交通否之象也經云治熱以寒雖良工不敢廢其繩墨而更其道也然而病有遠近治有輕重參政今年高氣弱上熱雖盛豈敢用寒涼之劑損其脾胃經云熱則砭之又云高巔之上射而取之余以三稜針約二十處刺之其血紫黑如露珠之狀少頃頭目便覺清利諸症悉減遂處方云眼黑頭旋虛風內作非天麻不能除天麻苗謂之定風草此草獨不為風所搖故以為君偏頭痛者乃少陽也非柴胡黃芩酒製不能治黃連苦寒酒炒以治上熱又為因用故以為臣橘皮苦辛溫炙甘草甘溫補中益氣為佐生薑半夏辛溫能治風痰茯苓甘草利小便導濕熱引而下行故以為使服之數劑邪氣平生氣復而安矣天麻半夏湯治風痰內作胸膈不利頭旋眼黑兀兀欲吐上熱下寒不得安臥天麻半夏各一錢橘皮去白柴胡七分黃芩酒浸炒甘草炙白茯苓去皮前胡各五分黃連三分上㕮咀作一服水二鍾姜三片煎至一鍾溫服食後忌酒面生冷物垣羌活湯治風熱壅盛上攻頭目昏眩羌活防風黃芩各一兩酒洗柴胡七錢黃連酒煮一兩黃柏酒炒半兩栝蔞酒洗半兩甘草炙七分白茯苓五錢澤瀉六錢上為粗末每服五錢水煎取清食後或先臥通口熱服之日二服上苦寒瀉風木靈筋骨血氣之精而與脈併為目系上屬於腦後出於項中故邪中於項因逢其身之虛其入深則隨眼系以入於腦入於腦則腦轉腦轉則引目系急目系急則目眩以轉矣大惑篇本治一切頭旋本因體虛風邪乘於陽明經上注頭面遂入於腦亦因痰水在於胸膈上犯大寒使陽氣不行痰水結聚上衝於頭目令頭轉旋羚羊角散羚羊角茯神各一兩芎藭防風曰芷半夏湯洗七次各半兩枳殼附子各一分甘草三錢上為粗末每服四錢水一鍾半生薑五分慢火煎至七分去渣不拘時候溫服百一都梁丸治風吹項背頭目昏黑眩痛香白芷大塊者用沸湯泡洗四五次焙乾上為末煉蜜為丸如彈子大每服一丸細嚼用荊芥湯點茶下無大豆紫湯治中風頭眩惡風自吐冷水有汗方見痓門聖治風頭旋用蟬殼二兩微炒為末非時下溫酒一鍾匕針經胃風篇云上虛則眩又五臟生成篇云徇蒙招尤目瞑耳聾下實上虛蓋蒙昏冒也招搖掉也瞑黑眩也皆謂昏冒搖掉眼黑眩屬下實上虛也丹陳客婦人近五十頭痛麻木眩運脈甚虛宜補氣益血去風行濕天麻酒一錢人參半錢白朮一錢黃芩半錢歸身尾酒半錢川芎半錢陳皮半錢甘草炙三分黃耆三分半夏五分生薑三片上作一劑水煎服賈舅因勞役眼眩倦怠頭不爽肚帶溏滑黃耆半錢人參半錢當歸一錢黃柏炒三分白朮一錢酒浸陳皮半錢蔓荊子五粒甘草炙些水煎稍熱飲之醜卯時各一次去枕眠少時巳申時又各一次瘥男子因作勞成病發熱腳痠口苦頭運白朮茯苓黃連川芎半兩白芍藥人參生地陳皮當歸各一兩甘草一錢杜仲炒六兩分十八帖食前熱下抑青丸二十二粒丈夫患熱頭眩脈大而散此是辛苦中來陳皮三錢柴胡三錢人參二錢白朮二錢黃耆三錢木通一錢甘草些分三帖服本治風眩頭運川芎散山茱萸一兩山藥甘菊花人參川芎茯神各半兩為末每服二錢酒調下不拘時候日三服不可誤用野菊花三因芎歸湯治産後去血過多眩運不省及傷胎去血多崩中去血多金瘡去血多拔牙齒去血多不止懸虛心煩眩運頭重目暗舉頭欲倒方見婦人大法條丹頭眩屬氣虛挾痰無痰作眩不得治痰為主挾補氣藥並降火藥濕痰多者用二陳湯痰多因火動者二陳湯加酒芩眩運火動其痰二陳湯加黃芩蒼朮羌活散風行濕水煮金花丸治頭眩方見痰飲丹眩運不可當者大黃三次酒炒乾為末茶調下每服一錢至二錢一男子年七十九歲頭目昏眩而重手足無力吐痰口口相續左手脈散大而緩右手緩而脈大不及於左重按皆無力飲食略減而微渴大便三四日一行衆人皆與風藥至春深必死豫曰此皆大虛證當以補藥作大劑服之衆怒而去余教用人參黃耆當歸身芍藥白朮陳皮濃煎作湯使下連柏丸三十粒如此者服一年半而精力如少壯時連柏丸冬加乾薑少許餘三時皆依本法連柏皆薑汁炒為細末又以薑汁煮糊為丸本治虛風頭旋吐痰涎不已養正丹黑鉛水銀硫黃硃砂各一兩上用鐵盞一隻火上溶鉛成汁次下水銀用柳杖子打勻取下放少時下二味末令冷研為粉用米飲丸或用棗肉丸如梧子大每服三十丸鹽湯下此藥升降陰陽補接真氣非止頭旋而已垣範天騋之內素有脾胃之病時顯煩躁胸中不利大便不通初冬出外而晚歸為寒氣怫鬱悶亂大作火不得伸故也醫疑有熱治以疏風丸大便行而病不減又疑藥力少復加七八十丸下兩行前症仍不減復添吐逆食不能停痰唾稠黏湧出不止眼黑頭旋噁心煩悶氣短促上喘無力不欲言心神顛倒兀兀不止目不敢開如在風雲中頭苦痛如裂身重如山四肢厥冷不得安臥豫謂前症乃胃氣已損復下兩次則重損其胃而痰厥頭痛作矣制半夏白朮天麻湯治之而愈天麻五分半夏湯洗一錢半人參五分白朮一錢蒼朮五分橘皮黃耆澤瀉白茯苓各五分神麯一錢炒大麥糵一錢半乾薑三分黃柏二分上件㕮咀每服半兩水二盞煎至一盞去渣帶熱服食前此頭痛苦甚謂之足太陰痰厥頭疼非半夏不能療眼黑頭旋風虛內作非天麻不能除其苗為定風草亦治內風之神藥也內風者虛風是也黃耆甘溫瀉火補元氣人參甘溫瀉火補中益氣二術俱甘苦溫除濕補中益氣澤瀉茯苓利小便導濕橘皮苦溫益氣調中升陽神麯消食蕩胃中滯氣大麥糵寬中助胃氣乾薑辛熱以滌中寒黃柏苦大寒酒洗以主冬天少火在泉發躁也上氣虛挾痰眩運余嘗治一人臥則稍輕但舉足則頭旋眼黑以天麻半夏茯苓陳皮白附殭蠶參耆草歸生薑黃芩煎湯服之五六日愈蓋仿此方加減之也濟芎術湯治胃中濕痰眩運嘔逆頭重不食川芎半夏酒洗白朮各一兩甘草炙半兩上㕮咀每服四錢水一盞生薑七片煎服不拘時一方有附子桂心無半夏嚴旋覆花湯治中脘伏痰嘔逆眩運旋覆花半夏橘紅乾薑各一兩檳榔人參甘草白朮各半兩上銼碎每服一兩姜水煎服仲卒嘔吐心下痞膈間有水眩悸者半夏加茯苓湯主之方見嘔吐假令瘦人臍下有悸吐涎沫而頭眩此水也五苓散主之方見傷寒子和青黛散搐鼻取涎治眩神效方見頭痛頭風眩運可用獨聖散吐之吐訖可用清上辛涼之藥防風通聖散加半夏等味仲景云此痰結胸中而致也通聖散見癇獨聖散瓜蒂不以多少鬱金各等分上為細末每服一錢或二錢虀汁調下服之用雞翎探吐河間搜風丸治邪氣上逆風熱上攻頭目眩運大小便結滯人參茯苓各半兩滑石二兩藿香二錢半乾薑白礬生各一兩蛤粉二兩南星大黃黃芩各二兩牽牛四兩薄荷半兩半夏一兩寒水石一兩上為末滴水丸小豆大每十丸生薑湯下加至二十丸日三服仲白朮附子湯治風虛頭重眩苦極不知食味暖肌補中益精氣白朮二兩附子一兩半炮去皮甘草一兩炙上三味銼每五錢姜五片棗一枚水鍾半煎至七分去渣溫服本治體虛有風外受虛濕身如在空中二生散生附子去皮臍生南星各等分上二味㕮咀每服四大錢水一鍾生薑十片慢火煎至八分去渣服戊午年豫在新安有此疾名醫傳授此方三服愈仲心下有支飲其人苦冒眩澤瀉白朮主之短氣倚息形如腫為支飲用澤瀉五兩白朮二兩以水二升煮一升分溫再服運氣眩有二一曰風助肝盛眩經云厥陰司天之政風行太虛雲物搖動目轉耳鳴三之氣風乃時舉民病掉眩又云厥陰司天客勝則耳鳴掉眩又云厥陰之勝耳鳴頭眩又云厥陰之復筋骨掉眩治以諸涼是也二曰濕邪傷腎眩經云太陰司天濕淫所勝頭項腰背痛而眩治以苦熱是也河神妙散搐鼻治頭目昏眩偏正頭痛方見頭痛門腦為髓之海其輸上在於其蓋下在風府髓海不足則腦轉耳鳴脛酸眩冒目無所見全文見針灸蓋者百會穴也補百會風府二穴則眩愈上氣不足頭為之苦傾目為之眩補足外踝下留之全文見針灸邪在腎肩背頭項痛時眩取湧泉崑崙視有血者盡取之全文見針灸怪穴頭目眩運至陰標金門申脈桑風池神庭內風池通玄同金門瀉三里補心頭暈怕寒些少風寒則目暗僵仆不分冬夏常用綿帽包日夜不離一去帽即發百會惺惺一分恐上星風池二寸半主頭大熱豐隆二寸半桑頭熱上囟風門攢竹百會甲風眩善嘔煩滿神庭主之如顏色青者上星主之取上星者先取譩嘻後取天牖風池如頭痛顏青者囟會主之風眩引頷痛上星主之先取譩嘻後取天牖風池風眩目瞑惡風寒面赤腫前頂主之風眩目眩顱上痛後頂主之風眩驚手脘痛泄風汗出至腰陽谷主之腦風目瞑頭痛風眩目痛腦空主之風逆暴四肢腫濕則唏然寒飢則煩心飽則眩大都主之頭眩目痛至陰主之丹左手脈數熱多脈澀有死血右手脈實痰積脈大必有久病癲癇癲癇即頭眩也痰在膈間則眩微不僕痰溢膈上則眩甚仆倒於地而不知人名之曰癲癇徐嗣伯云大人曰癲小兒曰癇其實一疾也然與中風中寒中暑尸厥等仆倒不同凡癲癇僕時口中作聲將省時吐涎沫省後又復發時作時止而不休息中風中寒中暑尸厥之類則僕時無聲省時無涎沫者後不復再發間有發者亦如癲癇之常法也丹癇屬驚與痰宜吐大率行痰為主黃芩黃連栝蔞半夏南星尋火尋痰分多少治之無有不愈分痰與熱有熱以涼藥清其心有痰必用吐藥吐後用東垣安神丸此證必用吐吐後用平肝之藥青黛柴胡川芎之類海治長洪伏三脈風癇驚癇發狂惡人與火者灸第三椎第九椎服局方妙香丸以針穿一眼子透冷水內浸少時服之如本方若治弦細緩三脈諸癇似狂者李河南五生丸妙香丸方見虛煩條氣亂於頭則為厥逆頭重眩僕全文見針灸邪搏陽則為癲疾見診法下同針經九針云邪入於陽轉為癲疾厥成為癲疾厥氣上逆也素帝曰人生而有病癲疾者病名曰何安所得之岐伯曰病名為胎病此得之在母腹中時其母有所大驚氣上而不下精氣並居故令子發為癲疾奇病論凡癲癇及中風中寒中暑中濕氣厥尸厥而昏眩倒僕不省人事者皆由邪氣逆上陽分而亂於頭中也癲癇者痰邪逆上也中風寒暑濕及氣厥尸厥者亦風寒暑濕等邪氣逆上也邪氣逆上則頭中氣亂頭中氣亂則脈道閉塞孔竅不通故耳不聞聲目不識人而昏眩無知仆倒於地也以其病在頭巔故曰癲疾治之者或吐痰而就高越之或鎮墜痰而從高抑之或內消痰邪使氣不逆或隨風寒暑濕之法用輕劑發散上焦或針灸頭中脈絡而導其氣皆可使頭巔脈道流通孔竅開發而不致昏眩也是知癲癇之癲與厥成癲疾眩冒癲疾之巔一疾也王太僕誤分癲為二疾獨孫真人始能一之今特冠此氣亂頭巔等經文於癲癇篇首使人知疾有所歸而治有所據也局碧霞丹治五癇疾方見虛實門世治暗風天麻南星半夏殭蠶白附子防風各半兩白礬二兩用木瓜一個切去頂取穰納前藥末用原頂覆住麵包煨熟就搗如泥為丸又用皂角二寸敲細酒半盞浸一宿如發時取前藥一十九粒納口中用酒灌下取出痰即愈自省後日服三十粒薑湯下治風癇及心風病用皂角三挺捶破濾汁熬如稀糊攤紙上曬乾取兩葉如小錢大用溫漿水浸洗去紙注於兩鼻孔各一蜆殼許須臾涎下咬箸瀝盡涎後服祛痰丸代赭石一兩生白礬二兩生上為細末稀糊為丸如梧子大每服三十丸冷水送下不拘時仲風引湯治癇疾瘛瘲方見後無礬丹丸治五癲百癇無問陰陽冷熱虢丹晉礬各一兩上用磚鑿一窠可容二兩許先安丹在下次安礬在上以炭五斤熾令炭盡取出細研以不經水豬心血為丸如緑豆大每服十丸至二十丸橘皮湯下世治暗風遠年日久不愈皆可服用地黃廣南道地者不計多少火煅醋淬七次為細末每服二錢溫酒調下年深者亦治羅參朱丸治風癇大有神效人參蛤粉硃砂各等分上為細末豵豬心血為丸如梧子大每服三十丸金銀花湯下食遠服神應丹治諸癇用好辰砂不拘多少為細末用豬心血和之得所以蒸餅裹蒸取出就熱丸如梧子大每服一丸食遠臥時煎人參湯下大有神效琥珀壽星丸天南星一斤撅坑二尺深用木炭五斤煅熱取出炭用好酒一升潑之將南星趁熱下坑用盆蓋訖合過一宿取出再焙乾為末琥珀四兩取末硃砂二兩一半為衣一半入藥豬心三個取血另打生薑麵糊攪令稠黏將豬心血和入藥末丸如梧子大每服五十丸煎人參湯空心送下日進三服世密陀僧散治暗風取密陀僧成塊者以鐵線纏又用鐵線懸掛火煅紅用酒醋一升淬盡出火毒研極細每服一錢麝香酒調下治癇疾凌霄花一味為細末每三錢空心酒調服每服藥時以木梳不住手梳其發又用冷水一碗逐口含之水溫則換水盡住梳如此四十九日永絶其根楊氏家藏五癇丸治癲癇發作不問新久並宜服之天南星炮一兩烏蛇肉酒浸一宿去皮骨焙一兩硃砂二錢半另研全蠍二錢去毒炒半夏二兩酒洗焙雄黃一錢半另研蜈蚣半條去頭足炙白附子半兩炮白殭蠶一兩半炒去絲麝香三錢另研白礬一兩皂角四兩捶碎水半升揉汁與白礬同熬干研上為末薑汁煮麵糊丸如梧子大每服三十丸薑湯下丹治癇疾川芎二兩防風豬牙皂角鬱金明礬各一兩蜈蚣一條上細末蒸餅丸如梧子大空心清茶下十五丸一日除根羅治癇病心風病用天南星九蒸九曝為末生薑汁打糊為丸如梧子大每服二十丸煎人參麥門冬菖蒲湯下亦可素春脈者肝也春脈太過為病在外善怒忽忽眩冒而癲疾全文見治法脈來弦實而強為太過歲木太過甚則忽忽善怒眩冒而癲疾全文見運氣類注丹治巡檢夫人癇通聖散二錢半姜三片煎下犀角丸三十粒保防風通聖散防風川芎當歸芍藥大黃芒硝連翹薄荷麻黃不去節各五錢枯梗黃芩石膏各一兩白朮山梔荊芥穗各二錢半滑石三兩甘草一兩上為粗末每服一兩生薑煎溫服日再服若勞汗當風寒薄為皶郁乃痤此勞汗出於玄府脂液所凝去芒硝倍加芍藥當歸發散玄府之風當調其榮衛俗云風刺或生癮疹或赤或白倍加麻黃鹽豉蔥白出其汗麻黃去節亦去芒硝以咸走血而內凝故不用之發汗罷依前方中加四物湯黃連解毒三藥合而飲之日二服故內經曰以苦發之為熱在肌表連內也小便淋閉去麻黃加滑石連翹煎藥中調木香末一錢匕麻黃主於表而不主於裡故去之腰脅走注疼痛者加硝石當歸甘草一服各二錢調車前子末海金砂末各一錢故經曰腰者腎之府破傷風者如在表則辛以散之在裡則苦以下之兼散之汗下後通利榮血祛逐風邪每一兩加荊芥穗大黃各二錢調全蠍末一錢羌活末一錢諸風癇搐小兒急慢驚風大便祕結邪熱暴甚腸胃乾燥寢汗咬牙上竄睡語筋轉驚悸肌肉蠕動每一兩加大黃二錢梔子二錢茯苓末二錢匕如肌肉蠕動者調羌活末一錢經曰肌肉蠕動命曰微風風傷於肺咳嗽喘急者每一兩加半夏桔梗紫菀各二錢如打撲傷損肢節疼痛腹中惡血不下每一兩加當歸大黃各三錢半調沒藥乳香末各二錢解利四時傷寒內外所傷每一兩加益元散一兩蔥白十莖鹽豉一合生薑半兩水一碗同煎至五七沸或煎一小碗溫冷服一半以箸投之即吐吐罷後服一半稍熱服汗出立解如飲酒中風身熱頭痛如破者加黃連須二錢蔥白十莖依法立愈慎勿用桂枝麻黃湯解之頭旋腦熱鼻塞濁涕時下每一兩加黃連薄荷各二錢半內經曰膽移熱於腦則辛頞鼻淵鼻淵者濁涕下不已王注曰膽液不澄則為濁涕不已如水泉者故曰鼻淵也此為足太陽脈與陽明脈俱盛也如氣逆者調木香末一錢素心脈滿大癇瘈筋攣仲風引湯除熱癲癇又治大人風引少小驚癇瘛瘲日數十發醫所不療又治腳風大黃龍骨乾薑各四兩桂枝三兩甘草牡蠣各二兩寒水石滑石赤石脂白石脂紫石英石膏各六兩上十二味杵粗末篩以韋囊盛之取三指撮井花水三升煮三沸溫服一升治風熱瘛瘲食後量多少呷之不用渣無不效河犀角丸治風癲癇發作有時揚手擲足口吐痰涎不省人事暗倒屈伸犀角末半兩赤石脂三兩朴硝二兩白殭蠶一兩薄荷葉一兩上為末麵糊丸如梧子大每服二十丸至三十丸溫水下日三服不拘時候如覺痰多即減數忌油膩炙爆龍腦安神丸治男婦五種癲癇無問遠年近日發作無時茯苓去皮取末三兩人參去蘆地骨皮甘草麥門冬去心各二兩龍腦三錢另研牛黃半兩研硃砂二錢飛桑白皮一兩馬牙硝二錢另研麝香三錢另研烏犀角末一兩金箔三十五片上十三味煉蜜為丸如彈子大金箔為衣冬月溫水化下夏月涼水又治虛勞發熱咳嗽語澀舌強日進三服靈肝脈小急癇瘈筋攣王注云肝養筋藏血肝氣受寒故癇瘈筋攣二陰急為癇厥同上肺脈急甚為癲疾腎脈急甚為骨癲疾見治虛實法羅沉香天麻湯治癇瘛瘲筋攣方見小兒門珠子辰砂丹治風癇久不愈者薯蕷人參遠志防風紫石英茯神虎骨虎睛龍腦五味子石菖蒲丹參細辛各二錢半珠子末四錢上件為細末麵糊為丸如梧子大用硃砂二錢研細為衣每服三十五丸煎金銀花湯送下日進三服忌魚肉濕面動風之物烏頭丸治五風癇病川烏草烏天仙子五靈脂各二兩黑豆一升上為細末滴水和丸如梧子大每服五七丸溫水下如中風加附子半兩子和昔項開完顏氏病搐先右臂並右足約搐六七十數良久左臂並左足亦搐六七十數不瘥兩目直視昏瞶不識人幾月余求治於余先湧其寒痰三四升次用導水禹功散泄二十餘行次服通聖散辛涼之劑不數日而瘥羅法煮萆麻子治諸癇病不問年深日遠萆麻子去皮取仁二兩黃連去須銼如豆大一兩上件用銀器水一大碗慢火熬水盡即添水熬三日兩夜為度取出去黃連只用萆麻子仁風乾不得見日用竹刀將萆麻子每粒切作四塊每次服五粒計二十塊作一服用荊芥湯食後溫服服萆麻仁者終身忌食豆犯之則腹脹而死丹治一婦人四十五歲生子多觸胎時有腹痛每夜喜飲酒三盞即睡其夫性暴而諧謔所以借酒解怒忽九月望後癇病大作目上視揚手擲足甚強健舉體大筋皆動喉向如鋸涎沫流口兩角如此一時辰許諸症皆靜狀如熟寢全不知人半時小腹漸痛上至心痛大作汗如雨自頭至乳而止如此半時痛漸減汗亦收痛作時卻自言其痛其餘言語皆謬誤問亦不答亦不知人痛定又熟寢如前癇與痛間作晝夜不息經兩宿方召豫脈之痛作時脈四至半似弦非弦左弱於右豫未敢與藥候癇作時再看形脈後作時六脈皆隱但有大筋轉於指下眼白青而面不青手之動三倍於足豫問之痛作時必欲重按比癇作時汗必不出其夫言果然豫曰此非死證若尚能咽藥則易治試以調香附子末灌之適癇勢稍定卻咽得半盞令急燒竹瀝未就時痛大作余以肝有怒邪因血少而氣獨行所以脾受病肺胃之間舊有酒痰為肝氣所抑鬱而為痛然酒喜動可以出入升降入內則痛出外則癇當乘其入內之時急為點大敦行間中脘三處穴令分頭同時下火灸之足上艾火少灸先了腹上痛漸下至腰而止熟寢少時癇作如前證減半又以竹瀝入少薑汁灌下大半鍾灌時適值癇定但熟寐如前自是不省人事一晝二夜皆已棄之余曉之曰身不發熱因痛則汗出大便不通者五六日自豫來亦未見其小水非死症當是血少無神而昏耳爾為痛掐人中俄而呻吟急以人參湯同竹瀝灌之又昏睡如前余教以作人參白朮膏入竹瀝調下如此二晝夜凡用人參一斤白朮二斤眼忽能開手能舉自言胸膈滿而舉身皆痛耳目仍未有聞見忽自溺床甚多余聞之甚喜且得癇與痛皆不作但教令用陳皮芍藥甘草川芎湯調參朮膏又加竹瀝飲之余欲往他處且與脈之聞其作聲余自知謬拙不教以粥與藥間服急令作稀粥與之止咽得三四匙牙禁不受余遂以木楔斡開以稀粥入藥湯又與竹瀝同灌一大鐘蓋是粥多而藥居三之一豫遂出門教令粥藥相間與之豫在二十里外未申間天大風作豫料此婦癇必作特往視之癇不作而痛作脈去來急無次急為灸然谷太衝巨闕灸罷痛定問其要粥否答曰我正飢其夫飲之以粥咽兩鍾豫乃往他處仍教以藥湯調參朮膏竹瀝與粥間與之如前第二夜半時召豫甚急往視之癇病大作奪手不能診脈令人扶定兩肘豫捉其中指強而脈之四至半粗大有力左右同而右少緩口妄言而無次又怒罵人眼上視不瞬而嘔又欲起走其狀若有所憑然豫捉定兩手為灸兩大指背半甲半肉際各三壯怒壯稍殺求免索燭視之耳目仍未有聞見昏寐至夜半狂怒大作且言鬼怪之事而師巫至大罵巫者豫靜思之氣因血虛亦從而虛邪因入理或有之且與補藥血氣若充邪當自退仍與前藥又恐痰頑佐以荊瀝又以秦承祖灸鬼法灸之哀告我自去昏睡一晝夜忽自起坐索粥其夫與之方問夫你面垢如許怪床上有香氣繼又無所知識惟開眼不睡手足雖能運動卻作尋摸態如此又二晝夜粥食稍加又溺床多如前豫益喜仍守前藥豫又往他處次日晚忽來召豫急往視之病人自言渾身皆痛脈之皆五至左右均而和曰參朮膏俱盡遂教令就與前藥中加參朮煎去荊瀝加香附末與一服覺甚快余且令守此藥至次夜半又來告急曰前痛大作往視之坐桶上叫聲甚高豫思之此虛病亦多汗腸燥而糞難耳痛當在小腹與腰急烘琥珀膏大者貼小腹仍教以熱手摩腰腎間連得下氣而痛減就睡少時又起如是者五六次一醫者勸令用通利藥豫曰痛與死孰為輕重且堅忍至夜半後當自通又往他處至四更來告急往視之痛大作豫令坐以溫湯中當自下換湯痛定覺甚快第二桶湯下結糞二塊就睡天明豫又往他處至晚又告急豫視痛大作連及兩脅手不可近豫思之此痛無因若結糞未盡痛當在下今痛在上必因食多問之果然醫者欲用感應丸豫教勿與粥藥病力索藥遂以香附末令舐之至夜半痛漸減天明覺略飢索粥豫曰非飢也乃嘈耳勿與而自安其家又自與粥至辰巳間豫往他處至晚痛又作而病者索香附末不已遂以湯調半碗與之探令吐猶有宿食痛遂止豫又往他處至夜半又告痛復作詢之以醋拌蘿蔔苗吃粥又以香附末探吐之痛定教令一晝夜勿與食至次日少與淡粥覺飢時以陳皮湯下白朮丸如此調理自安痰癲癇治法並見上虛條潔治風癇病久不能愈者從厚朴丸春秋加添外又於每一料中加人參菖蒲茯苓各一兩五錢和劑服之厚朴丸方見翻胃垣升陽湯治陽蹺癇足太陽下行宜升陽氣麻黃八錢不去節羌活一兩半防風根八錢炙甘草五錢上㕮咀每服三錢水五大盞煎至一盞去渣稍熱服宿食消盡腹中空服之後避風寒一二時辰乃效潔晝發治陽蹺申脈二穴在足外踝下陷中容爪甲白肉際是也夜發治陰蹺照海二穴在足內踝下陷中是也先灸兩蹺各二七壯然後服前藥千治百病風癲用麻仁四升水六升猛火煮令茅生去渣煎取七合旦空心服或發或不發或多狂語勿怪之但令人摩手足須臾即定凡進三劑無不愈羅神應丹治諸風心癇病狐肝一具烏鴉一隻鴟梟一個白礬一兩野貍一個去肚腸不用皮毛用新瓦罐盛肉以炭火煮爛生犀角末一兩上為末用酒打麵糊為丸如皂子大硃砂為衣每服一丸酒送下不拘時候楊氏蠍虎治癇法見小兒驚癇門妙靈暴攣癇眩足不任身取天柱氣亂於頭則為厥逆頭重眩僕取之天柱天柱不知取太陽滎輸於此義同癲疾始生先不樂頭重痛視舉目赤甚作極已而煩心候之於顏取手太陽陽明太陰血變而止癲疾始作而引口啼呼喘悸者候之手陽明太陽左強者攻其右右強者攻其左血變而止癲疾始作先反僵因而脊痛候之足太陽陽明太陰手太陰血變而止俱出癲狂篇玉癇凡灸癇必先下之乃可灸不然則氣不通能殺人針不拘鳩尾必高手乃可下針但宜灸亦不可多壯多則令人健忘通後溪集鳩尾湧泉心腧桑陽交三里後溪太衝間使摘風癇熱病心風驚癇上脘三里桑天吊巨闕三寸百會囟門東癇平旦發者足少陽晨朝發者足厥陰日中發者足太陽黃昏發者足太陰人定發者足陽明半夜發者足少陰心癇面赤心下熱短氣喘息巨缺灸三壯肝癇面青反視手足搖動丘墟三壯中封三壯脾癇面黃腹大善利胃脘並脘傍一寸各三壯衝陽隱白肺癇面白口吐沫肺腧少商少陽各三壯腎癇面黑正直視身不搖如尸厥金戶少海至陰湧泉各三壯刺一分膈癇四肢不舉風府一七壯刺一分百會人中承漿各隨年灸腸癇都無動靜如尸厥狀承山湧泉勞宮翳風各隨年壯刺入一分馬癇目張搖頭馬鳴欲反折風府三壯刺一分神關牛癇目直視腹滿鳩尾尖三壯大椎三壯羊癇揚目吐舌大椎三壯刺一分豬癇吐濁沫口動搖浮白三壯刺一分犬癇手屈拳攣勞宮一壯刺一分絲竹空肋戶各一壯雞癇搖頭反折善驚目搖至陰竅陰厲兌各灸三壯刺一分甲癲疾多言耳鳴目僻頰腫實則聾齲喉痹不能言齒痛鼻鼽衄虛則痹膈俞偏歷主之癲疾吐舌鼓頷狂言見鬼溫溜主之腕後五寸癲疾吐舌曲池主之癲疾互引僵仆申脈主之先取陰蹺後取京骨癲疾狂妄行振寒京骨主之癲疾身痛狂善行束骨主之癲疾僵仆轉筋僕參主之癲疾目䀮䀮鼽衄崑崙主之狂癲疾體痛飛揚主之癲疾反折委中主之癲疾憎風而振寒不得言得寒益甚身熱狂走欲自殺目反妄見瘛瘲泣出死不知人肺腧主之癲狂膈腧及肝腧主之癲疾僵仆目妄見恍惚不樂狂走瘛瘲絡卻主之癲疾互引反折戴眼及眩狂走不得臥心中煩攢竹主之癲疾發寒熱大煩滿悲泣出解溪主之癲疾互引口喎喘悸者大迎主之取手陽明太陰變血而止癲疾狂多食喜笑不發於外煩心渴商丘主之癲疾嘔沫神庭及兌端承漿主之其不嘔沫本神及百會後頂玉枕天衝大杼曲骨尺澤陽溪外丘當上脘傍五分通谷金門承筋合陽主之委中下二寸為合陽癲疾互引水溝及齦交主之癲疾上星主之先取譩嘻後取天牖風池癲疾嘔沫暫起僵仆惡見風寒面赤腫囪會主之癲疾瘛瘲狂走頸項痛後頂主之後頂在百會後一寸五分癲疾狂走瘛瘲搖頭口喎戾頸強強間主之癲疾骨酸眩狂瘛瘲口噤羊鳴刺腦戶狂易言不休及狂走欲自殺目反妄見刺風府癲疾怒欲殺人身柱主之狂走癲疾脊急強目轉上插筋輸主之癲疾發如狂走者面皮厚敦敦不治虛則頭重洞泄淋癃大小便難腰尻重難起居長強主之寒厥癲疾噤呵瘛瘲驚狂陽交主之癲疾大瘦腦空主之癲疾僵仆狂虛腕骨及風池主之癲疾狂瘛瘲眩僕喑不能言羊鳴沫出聽宮主之癲狂煩滿刺絲竹空癲疾吐舌沫出羊鳴戾頸天井主之天井在肘後癲疾氣短嘔血胸背痛行間主之痿厥癲疾洞泄然谷主之癲狂互引天柱主之上針灸癲法內經但取手足太陽陽明太陰六經而已今甲乙經等書又多取督經手足太陽足少陰厥陰蓋隨症取之然學者當以內經為主也靈骨癲疾者顑齒諸腧分肉皆滿而骨居汗出煩悗嘔多沃沫氣下泄不治顑苦感切骨居汗出千金作骨倨強直汗出筋癲疾者身倦攣急大刺項大經之大杼嘔多沃沫氣下泄不治脈癲疾者暴僕四肢之脈皆脹而縱脈滿盡刺之出血不滿灸之挾項太陽灸帶脈於腰相去三寸諸分肉本輸嘔多沃沫氣下泄不治癲疾者疾發如狂者死不治治癲疾者嘗與之居察其所當取之處病至視之有過者瀉之置其血於瓠壺之中至其發時血獨動矣不動灸窮骨二十壯窮骨者骶骨也俱出癲疾篇來疾去徐上實下虛為厥癲疾全文見治虛實法素癲疾脈搏大滑久自已脈小堅急死不治通評虛實論癲疾脈虛則可治實則死同上脈癲疾脈實堅者生脈沉細小者死此見與內經相反更詳之當以內經為正子癇云葛根湯治妊娠臨月因發風痓忽悶憒不識人吐逆眩倒名曰子癇葛根貝母去心牡丹皮防風當歸川芎白茯苓桂心澤瀉甘草各二兩獨活石膏人參各三兩上㕮咀以水九升煮取三升分溫二服貝母令人易産未臨月升麻代之丹治一婦人懷妊六月發癇手足揚直面紫黑色閣眼涎出昏瞶不省人事半時而醒醫與震靈丹五十餘帖其疾時作時止無減症直至臨産方自愈産一女蓐中子母皆安次年其夫疑丹毒必作求治之診其脈浮取弦重取澀按至骨則沉實帶數時正二月因未見其癇發症狀未敢與藥意其舊年癇發時乃五月欲待其時度此疾必作當審諦施治至五月半其疾果作皆是午巳兩時遂教以自制防風通聖散用生甘草加桃仁多紅花少或服或吐至四五劑疾漸疏而輕發為疥而愈大治子癇用縮砂末酒調下二錢詳見安胎痓痓病者口噤角弓反張者是也丹痓大率與癇病相似比癇為虛宜帶補多是氣虛有火兼痰宜服人參竹瀝之類不用兼風藥無此症多由亡血筋無所營故邪得以襲之所以傷寒汗下過多與夫病瘡人及産後致斯病者概可見矣丹一男子二十餘歲患痘瘡靨謝後忽患口噤不開四肢強直不能屈時或繞臍腹痛一陳則冷汗如雨痛定則汗止時作時止其脈極弦緊而急如真弦狀向知此子極勤苦意其因勞倦傷血山居多風寒乘虛而感又因痘瘡其血愈虛當用辛溫養血辛涼散風遂以當歸身芍藥為君川芎青皮鉤藤為臣白朮陳皮甘草為佐桂枝木香黃連為使更加紅花少許煎十二帖而安海神術加羌活麻黃湯治剛痓解利無汗神術方見傷寒太陰白朮加桂心黃耆白朮湯治柔痓解利有汗白朮方見傷寒太陽太陽陽明加川芎荊芥穗正陽陽明加羌活酒大黃少陽陽明加防風柴胡根熱而在表者加黃芩寒而在表者加桂枝黃耆附子熱而在裡者加大黃寒而在裡者加乾薑良薑附子以上數經寒熱當以脈別之防風當歸散防風當歸川芎地黃各一兩上銼每服一兩水三盞煎至二盞溫服仲活人治痓法並見後表裡陰陽條太陽病發熱無汗而反惡寒者名曰剛痓太陽病發熱汗出而不惡寒者名曰柔痓仲葛根湯治太陽無汗而小便反少氣上衝胸口噤不得語欲作剛痓葛根湯主之方見傷寒若發熱無汗反惡寒者名曰剛痓宜麻黃加獨活防風湯麻黃去節桂枝各一兩芍藥三兩甘草半兩獨活防風各一兩上銼細每服一兩水二鍾煎至一鍾半溫服仲栝蔞桂枝湯太陽病其症備身體強𠘧𠘧然脈反沉遲此為柔痓海藏治有汗而為柔痓栝蔞根二兩桂枝三兩甘草二兩生薑三兩大棗十二枚芍藥二兩上六味以水九升煮取三升分溫三服取微汗汗不出食頃啜粥發之海若發熱自汗而不惡寒者名曰柔痓宜桂枝加川芎防風湯桂枝芍藥生薑各一兩半甘草防風川芎各一兩大棗六枚上銼細每服一兩水三盞煎至一盞半去渣溫服凡剛柔二痓並可與小續命湯方見中風門但去渣入生薑汁小續命湯加減法若柔痓自汗者去麻黃夏間及病有熱者減桂枝一半冬及初春去黃芩千續命湯治卒中半身不遂手足拘急不得屈伸身體冷或智或癡或身強直不語或生或死狂言不可名狀角弓反張或欲得食或不用食大小便不利皆療之人參桂心當歸獨活黃芩乾薑炮甘草炙各七錢半石膏一兩半杏仁四十枚上九味㕮咀以水九升煮取三升分溫三服日二服取汗無汗者加麻黃仲剛痓為病胸滿口噤臥不著席腳攣急必齘齒可與大承氣方見傷寒子和呂君玉之妻年三十餘病風搐目眩角弓反張數日不食諸醫皆作驚風暗風風癇治之以天南星雄黃天麻烏附用之殊無少效戴人曰諸風掉眩皆屬肝木曲直搖動風之用也陽主動陰主靜由火盛制金金衰不能平木肝木茂而自病因湧風涎二三升次以寒劑下十餘行又以排針刺百會穴出血一杯立愈海若汗後不解乍靜乍躁目直視口噤往來寒熱脈弦者少陽風痓宜柴胡加防風湯柴胡一兩人參五錢半夏制六錢黃芩五錢生薑甘草各六錢半防風一兩棗三個上銼每服一兩水三盞煮至一盞半去渣溫服若發汗過多發熱頭面搖卒口噤背反張者太陽兼陽明也宜去風養血防風當歸散主之方見本門大法條陽痓並見表裡條仲景雖曰痓皆身熱足寒然屬陽不厥逆百一治中風身直不得屈伸反覆者取槐皮黃白者切之以酒或水六升煮取二升去渣服千倉公當歸湯治賊風口噤角弓反張痓方當歸防風各七錢半獨活一兩半附子一枚細辛半兩麻黃一兩二錢半上㕮咀以酒五升水三升煮取三升服一升口不開者格口納湯一服當蘇二服小汗三服大汗活八物白朮散治陰痓一二日面腫手足厥冷筋脈拘急汗不出恐陰氣內傷白朮茯苓五味子各半兩桂心三分麻黃半兩良薑一分羌活半兩附子三分上為末每服四錢水一大盞生薑五片同煎至五分去渣溫服無時海若發熱脈沉而細者附太陰也必腹痛宜桂枝加芍藥防風防己湯又宜小續命湯桂枝一兩半防風防己各一兩芍藥二兩生薑一兩半大棗六枚上銼每服一兩水三盞煎至一盞半去渣溫服活附子散陰痓手足厥逆筋脈拘急汗出不止頭項強直頭搖口噤桂心三錢附子一兩炮白朮一兩川芎三錢獨活半兩上為末每服三錢水一鍾棗一枚煎至五分溫服桂心白朮湯治陰痓手足厥冷筋脈拘急汗出不止白朮防風甘草桂心川芎附子上為末每服五錢水二鍾生薑五片棗二枚同煎至七分去渣溫服附子防風散治陰痓閉目合面手足厥逆筋脈拘急汗出不止白芷一兩防風甘草各三分桂心半兩附子三分乾薑三分柴胡一兩半茯苓三分五味子一兩上為末每服三錢水二盞生薑四片同煎去渣溫服海發汗太多因致痓身熱足寒項強惡寒頭熱面腫目赤頭搖口噤背反張者太陽痓也若頭低視下手足牽引肘膝相構陽明痓也若一目或左右邪視並一手一足搐搦者少陽痓也汗之止之和之下之各隨其經可使必已右太陽痓屬表無汗宜汗之有汗宜止之陽明痓屬裡宜下之少陽痓屬半表半裡宜和之所謂各隨其經也丹盧婦人因怒手足強直十指如束左脈弦虛右脈弦大而強稍堅此風木攻脾土宜速瀉肝氣助肺金補脾土之陰黃連二錢天南星白朮人參黃芩天麻川芎木通陳皮青皮各半錢甘草一分作一帖煎取一盞入薑汁令辣再沸熱服肺移熱於腎傳為柔痓全文見診病傳變運氣痓有三一曰風經云厥陰在泉客勝則大關節不利內為痓強拘急外為不便又云諸暴強直皆屬於風是也二曰濕經云諸痓項強皆屬於濕王注謂陽內郁而陰行於外是也三曰寒包熱經云火太過曰赫曦赫曦之紀上羽與正徵同其病痓蓋司天之寒束火於中亦陰陽內郁陰行於外之意也世治角弓反張胞衣瓶內水鵝毛挑入患人口唇即愈肘治中風身體強直不得屈伸反覆括枳樹皮細切一升以酒二升浸一宿每日溫酒服半升酒盡再作枳實即枸橘樹去風除濕千治口噤手足不隨而身體強直伏龍肝五升以水七升和攪取汁飲之仲病者身熱足寒頸項強急惡寒時頭熱面赤目赤獨頭動搖卒口噤背反張者痓病也活人書云外症發熱惡寒與傷寒相似但其脈沉遲弦細而項背反張為異耳太陽病發汗太多因致痓夫風病下之則痓復發汗必拘急夫痓脈按之緊如弦直上下行脈痓家其脈伏堅直上下行無凡痓脈皆伏沉弦緊仲太陽病發熱脈沉而細者名曰痓為難治痓病有灸瘡難治即破傷風之類痓病若發其汗者寒濕相搏其表益虛即惡寒痓病發其汗已其脈浛浛如蛇暴腹脹大者為欲解脈如故反伏弦者痓靈風痓身反折先取足太陽及膕中及血絡出血中有寒取三里熱病篇素太陽所謂強上引背者陽氣大上而爭故強上也脈解篇督脈為病脊強反折骨空論靈足少陰之筋循脊內挾膂上至項其病主癇瘈及痓在外者不能俯在內者不能仰故陽病者腰反折不能俯陰病者不能仰治在燔針甲風痓身反折先取太陽及膕中及血絡出血痓中有寒取三里痓取之陰蹺及三毛上及血絡出血痓取囟會及百會又膈俞上關光明主之痓目不眴刺腦戶痓脊強反折瘛瘲癲疾頭重五樞主之痓互引善驚天衝主之痓反折心痛形氣短尻䐈澀小便黃閉長強主之痓筋痛急互引肝俞主之熱痓脾俞及腎俞主之痓口噤互相引口乾小便赤黃或時不禁承漿主之痓驚互引腳如結腨如裂束骨主之痓反折互引腹脹掖攣背中怏怏引脅痛內引心中膂內肺俞主之又刺陽明從項而數背椎俠脊膂而痛按之應手者刺之尺澤三痏立已勞風即痓之屬丹云痓比癇為虛蓋因勞汗遇風內挾太陽寒濕之邪治亦與痓同法但當視其所勞則知虛在何藏如房勞則腎虛汗出腠理開風入皮腠得寒則閉風不能出與水俱行其人當目下腫如臥蠶之狀戴人云腎主水其經至於目下故也不禁房室則死明其虛在腎也所以關於太陽何也太陽主寒其經最在外腠理得寒則閉故太陽先受邪也治宜八物白朮散倉公當歸湯見前痓門河間芎枳丸方未考皂角化痰丸方見咳嗽條胎前痓此病多由風寒濕乘虛而感皆從太陽經治之活獨活防風湯治痓太陽有汗桂枝一兩芍藥三兩甘草半兩獨活防風各一兩上銼細每服一兩水二鍾煎至一鍾溫服防風葛根湯治痓太陽無汗葛根四兩麻黃三兩芍藥防風各二兩桂枝一兩上銼細每用一兩先煮麻黃去上沫入後藥同煎數沸溫服産後痓千竹瀝湯治産中風口噤面青手足急強用竹瀝一升分為五服微溫頻服大效此症因虛遇風挾痰而作宜服人參竹瀝之類産問曰産後汗出多而變痓者何答曰産後血虛腠理不密因遇風邪搏之故變痓也宜速斡口灌小續命湯稍緩即汗出如雨手拭不及不可救也小續命方見前痓條舉卿古拜散治新産血虛痓者荊芥穗不以多少瓦上微炒為末大豆黃卷熱酒沃之去黃卷取汁調四五錢和渣飲之其效如神千大豆紫湯治産後中風形如角弓反張口噤涎潮黑豆半升炒令焦黑煙起以無灰酒二升沃之入瓷器中每用一盞入獨活五錢同煎至六七分去滓溫服按續命以下三方太陽厥陰藥也邪實脈浮弦有力者固宜但産後血氣大虛之人不宜輕發其表但用防風當歸散治之為妙海防風當歸散方見前痓條破傷風破傷風者因瘡熱甚鬱結而榮衛不得宣通怫熱因之遍體故多白痂是時瘡口閉塞氣難宣通故熱甚而生風也先辨瘡口平無汁者中風也邊自出黃水者中水也並欲作痓急治之又痛不在瘡處者傷經絡亦死症也初覺瘡腫起白痂身寒熱急用玉真散貼之傷在頭面急嚼杏仁和雄黃白麵敷瘡上腫漸消為度若腰脊反張四肢強直牙關口噤通身冷不知人急用蜈蚣研細末擦牙吐出涎沫立蘇亦宜按摩導引河破傷風風熱躁甚怫鬱在表而裡氣尚平者善伸數缺筋脈拘急或時惡寒或筋惕而搐脈浮數而弦也宜以辛熱治風之藥開沖結滯而愈猶傷寒表熱怫鬱而以麻黃湯辛熱發散也凡用辛熱開衝風熱結滯宜以寒藥佐之則良免致藥中病而風熱轉甚也如治傷寒發熱用麻黃桂枝加黃芩石膏知母之類是也若止以甘草滑石蔥豉寒藥發散甚妙若表不已漸傳入里里又未太甚而脈弦小者宜以退風熱開結滯之寒藥調之或微加治風辛熱亦得猶傷寒在半表半裡而以小柴胡和解之也若里勢已甚而舌強口噤項背反張驚惕搐搦涎吐稠黏胸腹滿塞便溺祕結或時汗出脈沉洪數而弦也然汗出者由風熱鬱甚於里而表熱稍罷則腠理疏泄而心火熱甚故汗出也法宜除風散結寒藥下之後以退風熱開結滯之寒藥調之則熱退結散而風自愈矣背後搐者羌活獨活防風甘草向前搐者升麻白芷獨活防風甘草兩傍搐者柴胡防風甘草右搐加滑石河玉真散南星防風各等分上為末生薑汁酒調服傷處以此貼之羌活防風湯治破傷風初邪傳在表羌活防風川芎藁本當歸芍藥甘草地榆細辛各一兩上㕮咀每服五錢水二盞煎八分熱服熱則加黃芩一兩大便祕加大黃一兩防風湯見前風條蜈蚣散蜈蚣一對魚鰾五錢炒左蟠龍半兩炒煙盡上為細末用防風湯調服白朮防風湯若服前藥已過臟腑和有自汗者宜服此藥白朮防風黃耆各一兩上㕮咀每服七錢水二盞煎至一盞去滓溫服大芎黃湯臟腑祕小便赤自汗不止者宜速下之川芎一兩黃芩六錢甘草半兩大黃一兩上㕮咀每服五錢水一盞半煎至一盞去滓溫服以利為度江鰾丸治破傷風驚而發搐臟腑祕澀知病在裡江鰾半兩炒野鴿糞半兩炒雄黃一錢蜈蚣一對天麻一兩白殭蠶半兩上為細末分作三分先用二分燒飯為丸如桐子大硃砂為衣又用一分入巴豆霜一錢同和亦以燒飯為丸不用硃砂為衣每服硃砂為衣丸藥二十丸入巴豆霜丸藥一丸次服二丸漸加至利為度再服硃砂為衣丸藥病愈止羌活湯利後宜服搐痓不已亦宜服羌活獨活地榆各一兩每服五錢水一盞半煎至一盞去滓溫服如有熱加黃芩有痰加半夏地榆防風散治半表半裡頭微汗身無汗地榆防風地丁香馬齒莧各一兩上為細末每服三錢溫米飲調下養血當歸地黃散日久氣血漸虛邪氣入胃宜養血四物湯加防風藁本白芷細辛各等分為細末每用五錢水一盞半煎至一盞溫服瘛瘲病筋脈相引而急名曰瘛瘲俗謂之搐是也河諸熱瞀瘈皆屬於火熱勝風搏並於經絡風主動而不寧風火相乘是以熱瞀瘈生矣治法祛風滌熱之劑折其火熱瞀瘈可立愈若妄加灼艾或飲以發表之劑則死不旋踵矣素問云心脈急甚者為瘛瘲此心火虛寒也治宜補心牛黃散主之靈樞云心脈滿大癇瘈筋攣此心火實熱也治宜瀉心火涼驚丸主之肝脈小急亦癇瘈筋攣此肝虛也續斷丸主之若肝脈盛者先救脾宜加減建中湯素問云脾脈急甚者亦為瘛瘲此脾虛肝乘之而瘈也故宜實土瀉肝木之劑汗多不止為虛無汗能食為實垣人參益氣湯治熱傷元氣四肢困倦手指麻木時時瘛瘲黃耆二錢甘草炙升麻各五分五味子三十粒柴胡六分生甘草五分人參一錢二分炙甘草五分白芍藥七分上㕮咀作一服水二盞煎至一盞去渣熱服獨活湯治風虛昏聵不自覺知手足瘛瘲或為寒熱血虛不能服發汗藥及中風自汗尤宜服之獨活羌活人參防風當歸細辛茯神遠志半夏桂心白薇菖蒲川芎各五錢甘草二錢半每服一兩水二盞生薑五片煎八分食後溫服胃風湯治虛風症能食麻木牙關緊急手足瘛瘲目肉蠕瞤胃中有風面腫白芷一錢二分升麻二錢葛根一錢蒼朮一錢甘草五分炙柴胡藁本羌活黃柏草豆蔻各五分麻黃半錢不去節蔓荊子一錢當歸身一錢上㕮咀水二鍾姜三片棗二枚煎至一鍾溫服千薯蕷丸治虛勞不足風氣百疾頭目眩冒驚悸狂癲薯蕷二十八分當歸十分桂心七分神麯炒熟地各十分甘草二十分人參十分芎藭五分芍藥白朮麥門冬杏仁各六分柴胡桔梗茯苓各五分鹿角膠七分乾薑三分白蘞三分防風六分大棗一百枚為膏黃芩六分大豆黃卷七分上二十二味末之和棗膏煉蜜丸如彈子大空腹酒服一丸日三服續斷丸治肝勞虛寒脅痛脹滿眼昏不食攣縮瘛瘲續斷酒浸川芎當歸酒浸半夏湯泡薑製橘紅乾薑炮各一兩桂心甘草炙各半兩上為細末蜜丸如桐子大每服百丸白滾湯下牛黃散治心虛風筋脈攣搐神昏語澀牛黃龍腦硃砂麝香各一錢蟬蛻烏蛇肉一兩酒浸全蠍炒殭蠶炒桑螵蛸羚羊角阿膠炒天麻防風甘菊花蔓荊子桂心細辛側子炮去皮獨活去蘆各半兩犀角半兩麻黃七錢半上為細末和勻再研每服一錢豆淋酒下續命煮散治風氣留滯心中昏憒四肢無力口眼瞤動或時搐搦或渴或自汗防風獨活當歸人參細辛葛根芍藥川芎甘草熟地遠志荊芥半夏各五錢官桂七錢半每服一兩水二盞生薑三片煎至八分去渣通口服汗多者加牡蠣粉一錢半獨活散消風化痰細辛石膏研甘草炙各半兩防風藁本旋覆花川芎蔓荊子獨活各一兩上為細末每服三錢姜三片水一大盞煎七分食後服運氣瘛瘲有二其一曰火經曰火鬱之發民病嘔逆瘛瘲又曰少陽所至為暴注瞤瘈又曰少陽司天客勝則為瘛瘲是也其二曰水經曰陽明司天燥氣下臨木氣上從民病脅痛目赤掉振鼓栗又曰歲土太過雨濕流行民病足痿不收行善瘈又曰太陰之復頭頂痛重而掉瘈尤甚是也甲卒心中痛瘛瘲互相引肘內廉痛心熬熬然間使主之熱病先手臂身熱瘛瘲唇口聚鼻張目下汗出如轉珠兩乳下二寸堅脅滿悸列缺主之振寒瘛瘲手不伸咳嗽唾濁氣膈善嘔尺澤主之大風默默不知所痛嗜臥善驚瘛瘲天井主之頭重鼻衄及瘛瘲至陰主之身熱狂走譫語見鬼瘛瘲身柱主之千腹滿瘛瘲心痛氣滿不得息巨闕主之嘔血時瘈善搖頭顏青汗出不過肩傷寒溫病曲澤主之顫振顫搖也振動也風火相乘動搖之象比之瘛瘲其勢為緩內經云諸風掉眩皆屬於肝掉即顫振之謂也又曰諸禁鼓栗如喪神守皆屬於熱鼓栗亦動搖之意也此症多由風熱相合亦有風寒所中者亦有風挾濕痰者治各不同也常見此症多於傷寒熱病痢疾中兼見者多是熱甚而然虛亦有之背戰搖振動輕利而不痿弱比之中風嚲曳牽動重遲者微有不同星附散治中風雖能言口不喎斜手足嚲曳者天南星半夏以上俱用薑製人參黑附子去皮臍白附子茯苓川烏去皮臍殭蠶沒藥各等分上㕮咀每服五錢水酒各一盞煎八分熱服並進得汗為度獨活散見前瘛瘲條千金牙酒療積年八風五疰舉身嚲曳行步跛躄不能收持金牙碎如米粒用小絹袋盛地膚子無子用莖葉一方用蛇床子熟地蒴藋根附子防風細辛莽草各四兩川椒四合羌活一斤一方用獨活上十味㕮咀盛以絹袋用酒四斗於瓷器中漬封固勿令泄氣春夏三四宿秋冬六七宿酒成去滓日服一合常令酒氣相接不盡一劑病無不愈産後瘛瘲産後因虛傷風瘛瘲同傷表症未傳入里宜服防風湯見前風門愈風湯治産後中風口噤瘛瘲亦治血暈四肢強直用荊芥略炒為末每服三錢豆淋酒下增損柴胡湯治産後感異症手足牽搐涎潮昏悶柴胡黃芩一錢二分人參一錢半甘草炙一錢半石膏二錢知母一錢黃耆二錢半半夏一錢半上㕮咀分二服水二盞姜三片棗二枚煎八分不拘時服秦艽湯前症已去次服此藥去其風邪秦艽芍藥柴胡各一錢七分甘草炙一錢三分黃芩防風各一錢二分人參半夏各一錢一分上㕮咀分二帖每帖水二盞姜三片煎八分食遠服癘風經曰脈風成為癘俗呼癩風是也丹云大風病是受得天地間殺物之風古人謂之癘風以其酷烈暴悍可畏爾人得之者須分在上在下夫在上者以醉仙散取臭惡血於齒縫中出在下者以通天再造散取惡物蛔蟲於穀道中出所出雖有上下道路之異然皆不外於陽明一經而已看其疙瘩上先見在上體多者病在上也下先見在下體多者病在下也上下同得者病在上覆在下也陽明主胃與大腸無物不受此風之入人也氣受之在上多血受之在下多血氣俱受者上下皆多自非醫者有神病者有鐵心罕有免者余曾治四五人中間惟一婦人得免以其貧甚無物可吃也孫真人曰吾嘗治四五百人終無一人免者非真人之不能治也第無一人能守禁忌耳大法重者取積取汗醉仙散治大風疾遍身癮疹瘙癢麻木胡麻子牛蒡子枸杞子蔓荊子各一兩同炒白蒺藜苦參栝蔞根防風各半兩上為細末每十五錢末入輕粉一錢拌勻每服一錢茶調下晨午夕各一服後五七日先於牙縫內出臭黃涎渾身疼痛昏悶如醉次後利下膿血惡臭氣病根乃去矣四聖保命丹大黃半兩黃柏八兩苦參荊芥各四兩上為末煉蜜和勻分作一百二十丸每服一丸溫酒送下食遠日三服忌肉醬一方用蝦蟆一個燒灰祛風散大蠶砂五升先篩淨水淘三遍控干東行蠍虎一條焙乾用白麵四斤拌蠶砂為絡索曬乾上每服一二合熬柏葉湯調服食前日三服通天再造散治大風惡疾鬱金半錢大黃一兩泡白牽牛六錢半生半炒皂角刺黑大者一兩上為末每服五錢日未出時面東以無灰酒調下愈風丹治癩皂角一斤去皮弦銼作四指許以無灰酒浸一宿漉出同新汲水一大碗揉作濃汁濾去渣以砂鍋慢火熬膏苦參四兩為末土蝮蛇頭尾全用陰乾為末上二味末以皂角膏丸桐子大每服七十丸空心用防風通聖散煎成送下日二服服三二日後入浴出汗病重者不過一料病微者止用烏梢蛇不用土蝮蛇換肌散治大風年深不愈至眉毛墮落鼻梁坍壞額顱腫破服此速效白花蛇三兩烏蛇三兩酒浸一宿地龍去土三兩當歸酒製細辛白芷各一兩天麻蔓荊子威靈仙荊芥穗甘菊花苦參紫參沙參木賊不灰木川芎沙苑蒺藜甘草炙天門冬赤芍藥菖蒲九節者何首烏胡麻炒草烏頭各三兩蒼朮三兩米泔浸木鱉子去殼三兩定風草三兩上同為細末每服五錢匕食後酒調服酒多為妙輕者疏風和血以二聖散治之二聖散方大黃半兩皂角刺三錢燒灰上將皂角刺一二個燒灰研細用大黃半兩煎湯調下二錢早服樺皮散中以升麻湯下瀉青丸晚服二聖散此為緩治柏葉湯用東南枝上柏葉一稱水一桶水三沸去渣甕盛起旋熬蠶砂調服初服苦澀三五日後甜十日四肢沉重便赤白痢一月後發出瘡疙瘩破用烏龍散搽之烏龍尾即倒懸灰二錢烏雞子皮煅二味為末用柏油調搽於破瘡上樺皮散治肺擁風毒遍身癮疹瘙癢荊芥穗二兩枳殼樺皮各四兩甘草炙半兩杏仁二兩去皮尖用水一碗煎令減半取出令乾另研上為末每服二錢食後溫酒調下凌霄散治癘風神效蟬殼地龍炒殭蠶全蠍各七個炒凌霄花半兩上為末每服二錢熱酒調下無時於浴室中常蹲湯中一時許服藥神效祛風丸治疥癩經曰脈風成為癘也黃耆枳殼防風芍藥甘草熟地地骨皮枸杞子生地上九味木杵臼為細末煉蜜丸如桐子大白湯下五十丸如聖散蔓荊子苦參玄參厚朴荊芥紫參陳皮沙參麻黃去節一兩防風白芷威靈仙各二兩上為細末每服五錢桃柳枝各一把水五升煎臨臥熱洗忌五辛垣段庫使病癘風滿面連須極癢眉毛已脫落須用熱水沃之稍緩每晝夜須數次或砭刺亦緩先師曰風論中雲夫癘者榮衛熱胕其氣不清故使其鼻柱壞而色敗皮膚瘍潰風寒客於脈而不去名曰癘風治之者當刺其腫上以鋭針刺其處拔出其惡氣腫盡乃止當食如常食勿食他食如用藥當破血去熱升陽去癢瀉榮以辛冷散之甘溫升之行陽明經瀉心火補肺氣乃治之正也補氣瀉榮湯升麻連翹各六分蘇木當歸全蠍黃連地龍黃耆各三分黃芩生四分甘草一錢半人參二分生地四分桃仁三個桔梗五分麝香少許胡桐淚一分水蛭炒令煙盡二個虻蟲去翅足微炒二個上銼如麻豆大除連翹另銼胡桐淚研白豆蔻二分為細末二味另放麝香虻蟲水蛭三味為末另放外都作一服水二大盞酒一匙入連翹煎至一盞六分再入白豆蔻二味並麝香等三味再上火煎一二沸去渣稍熱早飯後午飯前服忌酒濕面生冷硬物經大風刺其肌肉故汗出百日刺骨髓汗出百日凡二百日鬢眉生而止針承漿一穴在頤前唇下宛宛中足陽明任脈之會療偏風口喎面腫口齒疳蝕蟲瘡灸亦佳日灸七壯至七七壯灸則血脈通宣其風應時立愈
