body:
  text: 卷之四陰陽臟腑部治虛實法素邪氣盛則實精氣奪則虛通評虛實論此二句乃虛實之要領邪之所湊其氣必虛評熱論針經云風雨寒熱不得虛邪不能獨傷人許學士云邪之所湊其氣必虛留而不去其病則實難人有三虛三實何謂也有脈之虛實有病之虛實有診之虛實脈之虛實者濡者為虛緊牢者為實病之虛實者出者為虛入者為實言者為虛不言者為實緩者為虛急者為實診之虛實者濡者為虛牢者為實癢者為虛痛者為實外痛內快為外實內虛內痛外快為內實外虛故曰虛實也素所謂重實者言大熱病氣熱脈滿是謂重實通評虛實論下同脈氣虛尺虛甲乙經作脈虛氣虛尺虛是謂重虛所謂氣虛者言無常也尺虛者行步恇然脈虛者不象陰也脈盛皮熱腹脹前後不通悶瞀此謂五實五實死身汗得後利則實者活玉機真藏論下同子和診一舟子病乃五實也作大劑下之殊不動搖計竭智窮無如之何忽憶桃花萼丸頻下七八十丸連瀉二百餘行與前藥相兼而下其昏困數日方已脈細皮寒氣少泄痢前後飲食不入是謂五虛五虛死漿粥入胃泄注止則虛可活治五虛黃耆建中湯理中湯之類方見後條傷寒垣胃中元氣盛則能食而不傷過時而不飢脾胃俱旺則能食而肥脾胃俱虛則不能食而瘦或少食而肥雖肥而四肢不舉脾實而邪氣盛也治脾胃虛補中益氣湯見發熱靈形氣不足病氣有餘是邪氣也急瀉之形氣有餘病氣不足急補之形氣不足病氣不足此陰陽俱不足也不可刺之刺之則重不足重不足則陰陽俱竭血氣皆盡五臟空虛筋骨髓枯老者絶滅壯者不復矣形氣有餘病氣有餘此謂陰陽俱有餘也急瀉其邪調其虛實根結篇東垣云病來潮作之時病氣精神增添者是謂病氣有餘若病來潮作之時神氣困弱者是謂病氣不足病氣有餘乃邪氣勝也急瀉之以寒涼酸苦之劑病氣不足急補之以辛甘熱之劑不問形氣有餘及形氣不足只取病氣有餘不足也夫形氣者氣謂口鼻中氣息也形謂皮肉筋骨血脈也形勝者為有餘消瘦者為不足察其氣者審口鼻中氣勞役如鼓為氣有餘若喘息氣促氣短或不足少息者為不足其曰形氣謂人形體中之血氣也當補當瀉全不在此只在病勢潮作之時精神困弱語言無力懶語者急補之若形氣不足病未潮作之時亦為不足此乃陰陽俱不足也禁用針當補之以甘藥不已灸臍下一寸五分氣海穴也素陽道實陰道虛太陰陽明論至陰虛天氣絶至陽盛地氣不足方盛衰論河血實氣虛則肥氣實血虛則瘦所以肥能寒而不能熱瘦能熱而不能寒者由寒則傷血熱則傷氣損其不足則陰陽愈偏故不能也損其有餘者方得平調故能之矣靈肥而澤者血氣有餘肥而不澤者氣有餘血不足瘦而無澤者血氣俱不足審察其形氣有餘不足而調之可以知逆順矣陰陽二十五人篇衛氣虛則汗多榮血虛則無汗經云衛氣者所以肥腠理司開闔者也今衛虛則腠理疏開闔無司而汗多矣又云奪血者無汗奪汗者無血今血少則無汗矣靈美眉者太陽多血通髯極須者少陽多血美須者陽明多血五音五味篇黃帝曰夫子之言脈之上下血氣之候以知形氣奈何岐伯曰足陽明之上血氣盛則髯美長血少氣多則髯短故氣少血多則髯少血氣皆少則無髯兩吻多畫足陽明之下血氣盛則下毛美長至胸血多氣少則下毛美短至臍行則善高舉足足指少肉足善寒血少氣多則肉而善瘃血氣皆少則無毛有則稀枯瘁善痿厥足痹瘃少玉切乃凍瘡也足少陽之上氣血盛則通髯美長血多氣少則通髯美短血少氣多則少髯血氣皆少則無須感於寒濕則善痹骨痛爪枯也足少陽之下血氣盛則脛毛美長外踝肥血多氣少則脛毛美短外踝皮堅而厚血少氣多則䯒毛少外踝皮薄而軟血氣皆少則無毛外踝瘦無肉足太陽之上血氣盛則美眉眉有毫毛血多氣少則惡眉面多少理血少氣多則面多肉血氣和則美色足太陰之下血氣盛則跟肉滿踵堅氣少血多則瘦跟空血氣皆少則喜轉筋踵下痛手陽明之上血氣盛則髭美血少氣多則髭惡血氣皆少則無髭手陽明之下血氣盛則腋下毛美手魚肉以溫血氣皆少則手瘦以寒手少陽之上血氣盛則眉美以長耳色美血氣皆少則耳焦惡色手少陽之下血氣盛則手卷多肉以溫血氣皆少則寒以瘦氣少血多則瘦以多脈手太陽之上血氣盛則頷多須面多肉以平血氣皆少則面瘦惡色手太陽之下血氣盛則掌肉充滿血氣皆少則掌瘦以寒以上見陰陽二十五人篇靈黃帝曰余聞人有精氣津液血脈余意以為一氣耳今乃辨為六名余不知其所以然岐伯曰兩神相搏合而成形常先身生是為精何謂氣岐伯曰上焦開發宣五穀味熏膚充身澤毛若霧露之溉是謂氣何謂津岐伯曰腠理發泄汗出溱溱是為津何謂液岐伯曰谷入氣滿淖澤注於骨骨屬屈伸泄澤補益腦髓皮膚潤澤是謂液何謂血岐伯曰中焦受氣取汁變化而赤是謂血何謂脈岐伯曰壅遏營氣令無所避是謂脈黃帝曰六氣者云云精脫者耳聾氣脫者目不明津脫者腠理開汗大泄液脫者骨屬屈伸不利色夭腦髓消脛酸耳數鳴血脫者色白夭然不澤其脈空虛以上見決氣篇上精氣津液血脈六者蓋精氣即衛氣津液血脈即營血之異名衛氣根於血營血根於氣故曰一氣也素臂多青脈曰脫血平人氣象論下同安臥脈盛謂之脫血靈尺炬然熱人迎大者當奪血論疾診尺篇氣虛則脈弦血虛則脈大仲景云脈弦則衛氣不行內經云脈粗大者陰不足陽有餘也脈脈大而堅者血氣俱實脈小者血氣俱虛脈大者血氣俱多脈細微者血氣俱虛靈脈動而實且疾者疾瀉之虛而徐者則補之終始篇難脈有陽虛陰盛陽盛陰虛何謂也然浮之損小沉之實大故曰陰盛陽虛沉之損小浮之實大故曰陽盛陰虛是陰陽虛實之意也六難仲脈藹藹如車蓋者名曰陽結也脈纍纍如循長竿者名曰陰結也如車蓋者浮大而有力也如循長竿者弦而有力也脈寸口脈潎潎如羹上肥陰氣微連連如蜘蛛絲陰氣衰如羹上肥者浮大而無力也蜘蛛絲者細而無力也仲脈綿綿如瀉漆之絶者亡其血也脈脈滑者多血少氣脈澀者少血多氣仲寸口脈微而澀微者衛氣衰澀者榮氣不足難脈有損至何謂也然至之脈一呼再至曰平三至曰離經四至曰奪精五至曰死六至曰命絶此死至之脈也何謂損一呼一至曰離經二呼一至曰奪精三呼一至曰死四呼一至曰命絶此損之脈也至脈從下上損脈從上下也損脈之為病奈何然一損損於皮毛皮聚而毛落二損損於血脈血脈虛少不能榮於五臟六腑三損損於肌肉肌肉消瘦飲食不能為肌膚四損損於筋筋緩不能自收持五損損於骨骨痿不能起於床反此者至脈之病也從上下者骨痿不能起於床者死從下上者皮聚而毛落者死治損之法奈何然損其肺者益其氣損其心者調其榮衛損其脾者調其飲食適其寒溫損其肝者緩其中損其腎者益其精此治損之法也治損之法詳見虛門脈來一呼再至一吸再至不大不小曰平一呼三至一吸三至為適得病前大後小即頭痛目眩前小後大即胸滿短氣一呼四至一吸四至病欲甚脈洪大者苦煩滿沉細者腹中痛滑者傷熱澀者中霧露一呼五至一吸五至其人當困沉細夜加浮大晝加不大不小雖困可治其有大小者為難治一呼六至一吸六至為死脈也沉細夜死浮大晝死一呼一至一吸一至名曰損人雖能行猶當著床所以然者血氣皆不足故也再呼一至再吸一至名曰無魂無魂者當死也人雖能行名曰行尸上部有脈下部無脈其人當吐不吐者死上部無脈下部有脈雖困無能為害也所以然者譬如人之有尺樹之有根枝葉雖枯槁根本將自生脈有根本人有元氣故知不死以上十四難仲寸口諸微亡陽諸濡亡血脈來緩時一止復來者名曰結脈來數時一止復來者名曰促脈陽盛則促陰盛則結此皆病脈挾喉兩旁人迎脈大為陽盛兩手寸口脈大為陰盛詳見針灸門刺虛實法內經以挾喉兩旁動脈為人迎脈經以關前為人迎當以內經為正素陰不勝其陽則脈流薄疾並乃狂陽不勝其陰則五臟氣爭九竅不通生氣通天論潔氣虛氣弱者陳皮黃耆人參氣實氣結者青皮厚朴木香沉香血虛者生地黃當歸身血實惡血積聚者當歸梢蘇木紅花海氣血弱者勿與枳殼以其損氣也氣血盛者勿與丁香以其益氣也脈弦而虛者勿損氣脈大而實者勿益氣脈中有少力浮則似止胸中真氣不及也人參五味子麥門冬沉香川芎益智白豆蔻丁香氣虛則生脈散血虛則三才丸四君子湯治真氣虛弱及短氣脈弱白朮人參黃耆茯苓等分上為粗末每服五錢水一盞煎至七分食遠溫服千金生脈散人參五味麥門冬潔益氣丸治語言多損氣懶語補上益氣麥門冬去心人參各三錢橘皮去白桔梗炙甘草各半兩五味子二十一粒上為極細末水浸油餅為丸如雞頭大每服一丸細嚼津唾咽下油餅和油燒餅也虛損人參黃耆湯人參二錢黃耆白朮陳皮去白各一錢甘草半錢炙當歸茯苓各一錢上㕮咀水煎空心熱服胃熱不能食者加薑棗湯煎垣補中益氣湯治飲食勞倦所傷方見虛熱門調中益氣湯治脈弦洪緩而沉按之中之下時得一澀其證心腹滿閉肢節煩疼難以屈伸身體沉重煩心不安忽肥忽瘦四肢懶倦口失滋味腹難舒伸大小便溺清利而數或上飲下泄或大便澀滯不行一二日一見夏月飧泄米穀不化或便後見血及白膿胸滿短氣膈咽不通或痰嗽稠黏口中沃沫食入反出耳鳴耳聾兩目焰火視物昏花胬肉紅絲熱壅頭目不得安臥嗜臥無力不思飲食黃氏一錢甘草五分人參半錢去蘆嗽者去之柴胡二分為上氣不足胃氣與脾氣下陷能補上氣從水引火橘皮二分如腹中氣不得運轉者更加一分升麻二分蒼朮五分木香一分上銼如麻豆大都作一服水二盞煎至一盞去渣帶熱服宿食消盡服之寧心絶思藥必神效蓋病在四肢血脈空虛宜在旦服如時顯熱燥是下元陰火蒸蒸發也加真生地黃二分黃柏三分如大便虛坐不得或大便了而不了腹常逼迫血虛血澀也加當歸身三分如身體沉重雖小便數多亦加茯苓二分蒼朮一錢澤瀉五分黃柏三分時令從權祛濕也不可常用兼足太陰已病其脈絡於心中故顯濕熱相合而生煩亂也如胃氣不和加湯洗半夏半錢生薑三片以製半夏之毒有嗽者去之緣痰厥頭痛非半夏不能除此足太陰脾經之邪所作也如無以上證只服黃耆一錢人參二錢甘草五分橘皮二分柴胡二分升麻二分蒼朮五分黃柏酒洗一分上件銼如麻豆大依前煎服中氣不足隨時加減用藥法如食少不飢加炒曲如食已心下痞別服橘皮枳朮丸如脈弦四肢滿悶便難而心下痞加甘草黃連柴胡如腹中氣上逆者是衝脈逆也加黃柏三分黃連一錢五分以泄之如大便祕燥心下痞加黃連桃仁少加大黃當歸身如心下痞夯悶者加白芍藥黃連如心下痞腹脹加五味子白芍藥縮砂仁如天寒少加乾薑或中桂如心下痞中寒者加附子黃連如心下痞嘔逆者加黃連生薑橘皮如冬月不加黃連少入丁香藿香葉如口乾咽乾加五味子葛根如脅下急或痛加柴胡甘草如胸中滿悶鬱郁然加橘紅青皮木香少許如頭痛有痰沉重懶倦者乃太陰痰厥頭痛加半夏半錢生薑二分或三分如腹中或周身間有刺痛皆血澀不足加當歸身如噦加五味子多益智少如脈洪大兼見熱症少加黃連黃芩生地黃甘草如脈緩沉重怠惰無力者濕勝也加蒼朮澤瀉人參白茯苓五味子如脈澀覺氣滯澀者加當歸身天門冬木香青皮陳皮有寒者加桂枝黃耆如食不下乃胸中胃上有寒或氣澀滯加青皮陳皮木香此三味為定法冬天加益智仁草豆蔻仁縮砂仁夏月少用更加黃連秋月氣澀滯氣不下更加檳榔草豆蔻仁縮砂仁或少加白豆蔻仁如春三月食不下亦用青皮少陳皮多更加風藥以退寒覆其上如初春猶寒更少加辛熱以補春氣之不足以為風藥之佐益智草豆蔻皆可也如脈弦者見風熱之證以風藥通之如胸中窒塞或氣閉悶亂者肺氣澀滯不行宜破滯氣青皮陳皮少加檳榔木香冬月加吳茱萸人參如胸中窒塞閉悶不通者為外寒所遏使呼出之氣不得伸故也必寸口脈弦或微緊乃胸中有寒若加之以舌上有白苔滑者乃丹田有熱胸中有寒明矣丹田有熱者必尻骨冷前陰間冷汗兩丸冷是邪氣乘其本而正氣走於經脈中也若遇寒則必作陰陰而痛以此辨丹田中有伏火加黃柏生地黃勿誤作寒證治之如秋冬天氣寒涼而腹痛者加半夏或益智或草豆蔻之類如發熱或捫之而肌表熱者此表證也只服補中益氣湯一二服亦能得微汗則涼矣如腳膝痿軟行步無力或疼痛乃腎肝中伏濕熱也少加黃柏空心服之不愈更增黃柏加漢防己半錢則腳膝中氣力如故也如多唾或唾白沫者胃口上停寒也加益智仁如少氣不足以息者服正藥二三服氣猶短促者為膈上及表間有寒所遏當引陽氣上伸加羌活獨活藁本最少升麻多柴胡次之黃耆加倍四物湯益榮衛滋氣血熟地黃補血如臍下痛非此不能除乃通腎經之藥川芎治風泄肝木也如血虛頭痛非此不能除乃通腎肝之藥芍藥和血當歸如血刺痛非此不能除乃通腎經之藥上為粗末水煎又春則防風四物加防風倍川芎夏則黃芩四物加黃芩芍藥秋則門冬四物加天門冬倍地黃冬則桂枝四物加桂枝倍當歸若血虛而腹痛微汗而惡風四物加朮桂謂之腹痛六合若風眩加秦艽羌活謂之風六合若發熱而煩不能睡臥者加黃連梔子謂之熱六合若中濕身沉重無力身涼微汗加白朮茯苓謂之濕六合若氣虛弱起則無力眶然而倒加厚朴陳皮謂之氣六合若虛寒脈微自汗氣難布息便清白加乾薑附子謂之寒六合若身熱脈躁頭昏項強者加柴胡黃芩若因熱生風者加川芎柴胡防風若目赤暴發作雲翳疼痛不可忍宜四物龍膽湯方見眼目門若瘡疾加荊芥酒煎常服若虛煩不得睡加竹葉人參若虛熱病四物與參蘇飲相合名補心湯主之若煩躁大渴加知母石膏若陰虛致熱與血相搏口舌乾渴飲水加栝蔞麥門冬若諸痛有濕者宜四物與白朮相半加天麻茯苓穿山甲酒煎若四肢腫痛不能行動四物蒼朮各半湯主之若嘔者加白朮人參生薑若水停心下微吐逆者加豬苓茯苓防己若治燥結四物與調胃承氣湯各半為玉燭散若臟閉澀者加大黃桃仁若老人風祕加青皮等分煎若流濕潤燥宜四物理中各半湯若滑瀉者加官桂附子若血痢加膠艾煎若腹脹加厚朴枳實若虛勞氣弱咳嗽喘滿宜厚朴六合四物湯四兩厚朴薑製一兩枳實麩炒半兩若血氣上衝心腹肋下滿悶宜治氣六合四物湯四兩加木香檳榔各一兩若發寒熱者加乾薑炒黑牡丹皮白芍藥柴胡若虛壯熱似傷寒者加人參柴胡四物與桂枝麻黃白虎柴胡理中四逆茱萸承氣涼膈等皆可作各半湯此易老用藥大略也四物湯加減治婦人雜病方二十六道見婦人部四物湯加減治妊娠傷寒方名六合湯一十五道見傷寒部四物湯加減調經方七道見調經三才丸天門冬地黃人參各等分為末煉蜜丸空心服溫衛補血湯治耳鳴鼻不聞香臭口不知五味氣不快四肢困倦不收行步欹側毛髮脫落食不下膝冷陰汗帶下喉中吤吤不得臥口舌液干太息頭不可回顧項筋緊脊骨強痛頭旋眼黑頭痛呵缺嚏噴蒼朮二分升麻四分柴胡根三分生地黃一分牡丹皮三分熟甘草二分白朮一分當歸三分人參三分生甘草半分丁香一分王瓜根二分黃耆一錢二分陳皮二分吳茱萸二分葵花七朵上為粗末水二盞煎法如常食前服一本加藿香黃柏地骨皮桃仁脾胃不足皆為血病是陽氣不足陰氣有餘故九竅不通諸陽氣根於陰血之中陰血受火邪則陰盛陰盛則上乘陽分而陽道不行無生髮升騰之氣也夫陽氣走空竅者也陰氣附形質者也如陰氣附於土陽氣升於天則各安其分也今所立方中有辛甘溫藥者非獨用也復有甘苦大寒之劑亦非獨用也以火酒二製為之引使苦甘寒藥至頂而復入腎肝之下所謂升降浮沉之道自偶而至奇自奇而至偶也瀉陰火以諸風藥升發陽氣以滋肝膽之用是令陽氣生上出於陰分末用辛甘溫藥投其升藥使大發散陽分而令走九竅也治陰不勝陽脈至數疾六七至甚則狂者治見寒熱門黃連解毒湯三黃丸紫雪諸方求之甚者承氣湯仲云陽先絶色青陰先絶色赤海脈絶者陰入於地中也脈者如地中溝渠也通達諸經灌溉一體陽氣鼓舞而行之陽不行則脈不動矣是以陰離而不守故大小便皆為之不禁內溫之外灸之並行而不可緩溫之四逆輩灸之臍下腧穴一寸五分氣海是也潔八物湯偶方四物四君子二方合和也白朮茯苓人參黃耆當歸芍藥川芎地黃上為散每五錢水二盞煎至一盞去渣食後溫服仲虛勞憂思諸不足黃耆建中湯主之黃耆三兩桂枝二兩去皮甘草二兩炙大棗十二枚芍藥六兩生薑二兩膠飴一升上七味以水七升煮取三升去渣納膠飴更上微火消解溫服一升日三服氣短胸滿者加生薑腹滿者去棗加茯苓一兩半及療肺虛損不足補氣加半夏一兩垣又治脈弦自汗四肢發熱或皮毛枯槁發脫落宜黃耆建中湯仲虛勞裡急悸衄腹中痛夢失精四肢痠疼手足煩熱咽口乾燥小建中湯主之方見傷寒垣雙和散補血益氣治虛勞少力黃耆熟地黃當歸川芎各一錢白芍藥一錢半官桂甘草各七分上為粗末每服四大錢水一盞半生薑三片肥棗三枚煎至八分去渣服豫制此方是建中四物二方每傷寒瘧疾中暑大疾之後虛勞氣乏者以此調治皆驗不熱不冷溫而有補海大補十全散治男子婦人諸虛不足五勞七傷不進飲食久病虛損時發潮熱氣攻骨脊拘急疼痛夜夢遺精面色痿黃腳膝無力喘嗽中滿脾腎氣弱五心煩悶並皆治之肉桂甘草芍藥黃耆當歸川芎人參白朮茯苓熟地各等分上為粗末每服二大錢水一盞生薑三片棗二枚煎至七分不拘時候溫服桂芍藥甘草小建中湯也黃耆與此三物即黃耆建中湯也人參茯苓白朮甘草四君子湯也川芎芍藥當歸地黃四物湯也以其氣血俱衰陰陽並弱法天地之成數故名曰十全散河正氣天香散治九氣烏藥二兩香附末八兩陳皮蘇葉乾薑各一兩上為細末調服玄導氣丸青木香蘿蔔子茴香檳榔牽牛頭末各四兩上為末薄糊丸如桐子大每服三四十丸仲桃仁承氣湯方見傷寒部蓄血門玄通真丸婦人通經男子破血大黃去皮米醋同煮爛桃仁各四兩去皮尖另研天水末四兩天水一名益元散乾漆二兩用瓦上焙煙盡杜牛膝二兩生上為末醋糊丸如桐子大每服六七十丸木香和中丸木香沉香白豆蔻枳實炒檳榔蓬朮青皮陳皮當歸酒洗黃芩木通黃連縮砂豬牙皂角去皮弦並子蜜水潤炙乾郁李仁湯去皮三稜以上各淨末一兩大黃四兩香附三兩黃柏二兩牽牛頭末三兩上為末水丸每服三錢重白湯下或薑湯下木香檳榔丸流濕潤燥推陳致新木香檳榔青皮陳皮廣朮枳殼宣連各半兩黃柏一兩半大黃一兩半黑牽牛評曰此戴人經驗方也善治下虛上實抑火升水流濕潤燥推陳致新資陰代陽散郁破結活血通經及治肺痿喘嗽胸膈不利脾濕黃疸宿食不消一切雜證不能盡述戴人每令病人夜睡服之以進食任服他藥婦人調和血氣小兒驚疳積熱皆可量輕重用之原本有香附二兩全真丸治脾臟積熱洗滌腸垢潤利燥澀風毒攻經手足浮腫或頑痹不仁痰涎不利涕唾稠黏胸膈痞塞臍腹脹滿飲食減少困倦無力凡所內傷並宜服之黑牽牛八兩燥火炒四兩生用四兩同取頭末四兩大黃二兩米泔浸三日逐日換泔取出切焙乾細為末上以皂角二兩輕手揉去皮子水一大碗浸一宿入蘿蔔一兩切作片子同皂角一處熬至半碗去渣再熬至二盞搜和上件藥末乾溼得所丸如桐子大每服三十二丸諸飲下不拘時候金宣宗敕賜名保安丸心印神芎導水丸治勞瘵停濕二陽病熱鬱黃芩一兩黃連半兩大黃二兩川芎半兩滑石四兩薄荷半兩黑牽牛四兩頭末河間制治一切熱證其功不可盡述設或久病熱鬱無問瘦𤸆老弱並一切證可下者始自十丸以為度常服此藥除腸垢積滯不傷和氣推陳致新得利便快並無藥燥搔擾亦不困倦虛損遂病人心意或熱甚必急須下者使服四五十丸未效再服以意消息常服二三十丸不動臟腑有益無損或婦人血病下惡物加桂半兩病微者常服甚者取利因而結滯開通惡物自下也凡老弱虛人脾胃經虛風熱所郁色黑齒槁身瘦焦痿黃或服甘熱過度成三消等病若熱甚於外則肢體躁擾病於內則神志躁動怫鬱不開變生諸症皆令服之惟臟腑滑泄者或裡寒脈遲者或婦人經病産後血下不止及孕婦等不宜服舟車神祐丸泄水濕甘遂一兩醋炒大黃二兩芫花醋炒一兩黑牽牛頭末四兩輕粉一錢大戟一兩醋炒青皮陳皮木香檳榔各半兩取蠱加蕪荑半兩為末水丸空心服河間依仲景十棗湯例製出此方主療一切水濕為病戴人云十棗泄諸水之上藥所謂溫藥下者是已如中滿腹脹喘嗽淋閉水氣蠱腫留飲癖積氣血壅滯不得宣通風熱燥郁肢體麻痹走注疼痛久新瘧痢等患婦人經病帶下皆令按法治之病去如掃故賈同知稱為神仙之奇藥也緣此方河間所定初服五丸日三服加至快利後卻常服以病去為度設病愈後平人能常服保養宣通氣血消運飲食若病痞悶極甚者便多服反煩滿不開轉加痛悶宜初服二丸每服加二丸加至快利為度以意消息小兒丸如麻子大隨強弱增損三四歲者三五丸依前法如減至戴人變為神芎丸神祕不傳然每令病人夜臥先服百餘粒繼以浚川等藥投之五更當下種種病出投下少末再服和膈藥須以利為度有五日一下者三日一下者病輕者可一二度止重者五六度方愈是擒縱卷舒之妙臨證制宜非言可諭觀其藥雖峻急認病的確自非老手諳練有大負荷者焉敢見諸行事豫每親制用之若符節然又隨人強弱當依河間漸次進服強實之人依戴人治法行之神效可驗大聖浚川散大黃一兩煨甘遂半錢牽牛一兩頭末木香三錢郁李仁一兩芒硝三錢半評曰此下諸積之聖藥也諸濕為土火熱能生濕土故夏熱則萬物濕潤秋涼則濕復燥干濕病本不自生因於火熱怫鬱水液不能宣通停滯而生水濕也凡病濕者多自熱生而熱氣多為兼病內經云明知標本正行無間者是也夫濕在上者目黃而面浮在下者股膝腫厥在中者肢滿痞膈痿逆在陽不去者久則化氣在陰不去者久則成形世俗不詳內經所言留者攻之但執補燥之劑怫鬱轉加而病愈甚也法當求病之所在而為施治瀉實補虛除邪養正以平為期而已又嘗考戴人治法假如肝木乘脾土此土不勝木也不勝之氣尋救於子己土能生庚金庚為大腸味辛者為金故大加生薑使伐肝木然不開脾土無由行也遂以舟車丸先通閉塞之路是先瀉其所不勝後以薑汁調浚川散大下之是瀉其所勝也戴人每言導水丸必用禹功散繼之舟車丸必以浚川散隨後如寒疝氣發動腰腳胯急痛者亦當下之以瀉其寒水世俗暗於治體一概鹵莽有當下而非其藥終致委頓而已豈知巴豆可以下寒甘遂芫花可以下濕大黃芒硝可以下燥如是分經下藥兼食療之非守一方求其備也故戴人曰養生與攻疴本自不同今人以補劑療病宜乎不效是難言也丹六郁氣血沖和百病不生一有怫鬱諸病生焉氣香附撫芎蒼朮濕蒼朮川芎白芷痰海石香附栝蔞南星熱青黛香附蒼朮川芎梔子血桃仁紅花青黛川芎香附食蒼朮香附山楂神麯針砂加醋炒春加川芎秋冬加茱萸夏加苦參越鞠丸解諸郁蒼朮香附川芎神麯梔子凡郁在中焦以蒼朮撫芎開提其氣以升之假如食在氣上提其氣則食自降矣余皆仿此益陰經血解五臟結氣用山梔炒令十分有二分焦黑為末以薑汁入湯煎飲之其效捷於他方也世順氣丸治血鬱香附半斤童便浸曬乾粟糊為丸本貝母能散心胸鬱結之氣殊有功保論曰虛損之人寒熱因虛而感也感寒則損陽陽虛則陰盛故損自上而下治之宜以辛甘淡過於胃則不可治也感熱則損陰陰虛則陽盛故損自下而上治之宜以甘苦酸鹹過於脾則不可治也自上而下者一損損於肺皮聚而毛落二損損於心血脈虛少不能榮於臟腑婦人月水不通三損損於胃飲食不為肌膚自下而上者一損損於腎骨痿不能起於床二損損於肝筋緩不能自收持三損損於脾飲食不能消克論曰心肺損而色敗腎肝損而形痿谷不能化而脾損感此病者皆損之病漸浸之深皆虛勞之疾也四君子湯治肺損而皮聚毛落益氣可也方見前八物湯治心肺虛損皮聚而毛落血脈虛損婦人月水愆期益氣和血方見前十全散治心肺損及胃飲食不為肌膚益氣和血調食方見前金剛丸治腎損骨痿不能起於床益精補腎萆薢杜仲炒蓯蓉酒浸菟絲子酒浸等分上細末酒煮豬腰子為丸桐子大每服五七十丸空心酒下牛膝丸治肝腎損骨痿不能起床筋緩不能收持宜益精緩中牛膝酒浸萆薢杜仲炒蓯蓉酒浸防風菟絲子酒浸白蒺藜等分桂一分上細末酒煮豬腰子丸桐子大空心酒下五七十丸煨腎丸治肝腎損及脾食穀不化宜益精緩中消穀牛膝萆薢杜仲蓯蓉菟絲子白蒺藜胡蘆巴破故紙等分桂半兩上丸如金剛丸法治腰痛不起者神效上陰陽虛損諸方蓋謂虛而無熱者設也若虛而有熱者作虛熱治之虛熱又分二法一治新病屬虛熱者反治條求之一治久病屬勞瘵者骨蒸門求之素絡氣不足經氣有餘者寸口熱而尺寒也秋冬為逆春夏為從治主病者經滿絡虛刺陰灸陽若經虛絡滿者尺熱寸口寒澀也春夏死秋冬生絡滿經虛灸陰刺陽經絡皆實是寸脈急而尺緩也皆當治之故曰滑則從澀則逆也通評虛實論素夫人之常數太陽常多血少氣少陽常多氣少血陽明常多氣多血少陰常多氣少血厥陰常多血少氣太陰常少血多氣此天之常數血氣形志論許學士脈浮而有力者表實也浮而無力者表虛也沉而有力者裡實也沉而無力者裡虛也云脈浮診得六數七極者為表實也浮診得三遲二敗者為表虛也如中診得六數七極者是中焦之熱實也中診得三遲二敗者中焦虛也如沉診得六數七極者下焦有實熱也沉診得三遲二敗者下焦虛也素帝曰病之中外何如岐伯曰調氣之方必別陰陽定其中外各守其鄉內者內治外者外治微者調之其次平之盛者奪之汗之下之寒熱溫涼衰之以屬隨其攸利謹道如法萬舉萬全氣血正平長有天命至真要大論下同帝曰病之中外何如岐伯曰從內之外者調其內從外之內者治其外從內之外而盛於外者先調其內而後治其外從外之內而盛於內者先治其外而後調其內中外不相及則治主病垣表虛桂枝黃耆表實麻黃葛根裡虛人參白朮裡實枳實大黃自汗脈浮無力為表虛無汗脈浮有力為表實自利脈沉無力為裡虛不大便脈沉有力為裡實海藏實麻黃湯實調胃承氣湯實大承氣湯浮中沉虛桂枝湯虛小建中湯虛四逆湯浮可下者外無六經之形證沉可汗者內無便溺之阻隔云麻黃為瀉能瀉表之實不能瀉里之實桂枝為補能補表之虛不能補里之虛姜附為補不能補表之虛而能補里之虛承氣為瀉能瀉里之實而不能瀉表之實建中為補能補中焦之虛而不能補上焦下焦之虛調胃為瀉能瀉中焦之實而不能瀉上焦下焦之實也本事有人病傷寒身熱頭疼豫視之曰邪在表此表實證也當汗之以麻黃湯或問曰傷寒大抵因虛故邪得以入之今邪在表何以雲表實也豫曰古人稱邪之所湊其氣則虛留而不去其病則實蓋邪之入人也始因虛入及邪居中則反為實矣大抵調治傷寒先要明表裡虛實能明此四字則仲景三百九十七法可立而定也何以言之有表實有表虛有裡實有裡虛有表裡俱實有表裡俱虛豫於表裡虛實歌中常論其事矣仲景麻黃湯之類為表實而設也桂枝湯之類為表虛而設也裡實則承氣之類是也裡虛則四逆之類是也表裡俱實所謂陽盛陰虛下之則愈也表裡俱虛所謂陽虛陰盛汗之則愈也常讀華他傳有府吏倪尋李延其證俱頭痛身熱所苦正同他曰尋外實當下之延內實當發汗或難其異他曰尋外實延內實故治之異耳麻黃湯桂枝湯承氣湯三方並見傷寒部四逆湯方見傷寒門上仲景治表裡虛實法萬世之準繩也垣戊申六月初樞判白文舉年六十二素有脾胃虛損病目疾時作身面目睛俱黃小便或黃或白大便不調飲食減少氣短上氣怠惰嗜臥四肢不收至六月中目疾復作醫以瀉肝散下數行而前疾增劇豫謂大黃牽牛雖能除濕熱而不能走經絡下咽不入肝經先入胃中大黃苦寒重虛其胃牽牛其味至辛能瀉肺氣重虛肺本故嗽大作蓋標實不去本虛愈甚加之適當暑雨之際素有黃證之人所以增劇也此當補脾胃肺之本臟瀉外經之濕熱制清神益氣湯主之而愈防風三分生薑五分蒼朮三分茯苓三分澤瀉三分升麻二分此藥能走經除濕熱而不守故不瀉本臟補肺與脾胃本臟中氣之虛弱橘皮二分青皮一分人參三分生甘草白朮白芍藥各二分此藥能守本而不走經不走經者不滋經絡中邪守者能補五臟之元氣五味子三分麥門冬二分人參三分黃柏一分此藥去時令虛熱濕蒸上銼如麻豆大都作一服水二盞煎至一盞去渣稍熱空心服火熾之極金伏之際而寒水絶體於斯時也故急救之以生脈散除其濕熱以惡其太甚肺欲收心苦緩皆酸以收之心火盛則甘以瀉之故用人參之甘佐以五味子之酸孫思邈曰夏月常服五味子以補五臟氣是也麥門冬微苦寒能滋水之源於金之位而清肅肺氣又能除火刑金之嗽而斂其痰邪復微加黃柏之苦寒以為守位滋水之流以鎮墜其浮氣而除兩足之痿弱也上舉東垣一法為例余可觸類而長也仲病有急當救里救表者何也師曰病醫下之續見下利清穀不止身體疼痛者急當救里後身體疼痛清便自調者急當救表也救里四逆湯救表桂枝湯羅徵南帥不鄰吉歹腸鳴自利咽溢腫痛先治咽塞後治下痢愈方見外熱內寒本事後周姚僧垣名醫也帝因發熱欲服大黃藥僧垣曰大黃乃急快藥至尊年高不宜輕用帝不從服之遂至不起及元帝有疾諸醫皆謂至尊至貴不可輕服大黃宜用平藥僧垣曰脈洪而實必有宿食不用大黃必無瘥理元帝從之果下宿食乃愈合用與不用必心下明得諦當然後可海仲景浮汗而沉下右手沉實調胃承氣左手沉實桃仁抵當難經沉汗而浮下右手浮實枳實牽牛左手浮實桃仁四順右手雜病是為之表傷寒是為之裡左手雜病是為之裡傷寒是為之表治上下法素天不足西北故西北方陰也而人右耳目不如左明也此不滿東南故東南方陽也而人左手足不如右強也帝曰何以然岐伯曰東方陽也陽者其精並於上並於上則上盛而下虛故其耳目聰明而手足不便也西方陰也陰者其精並於下並於下則下盛而上虛故其耳目不聰明而手足便也故俱感於邪其在上則右甚在下則左甚此天地陰陽所不能全也故邪居之陰陽應象篇頭痛巔疾下虛上實過在足少陰巨陽甚則入腎徇蒙招尤目冥耳聾下實上虛過在足少陽厥陰甚則入肝腹滿䐜脹肢膈胠脅下厥上冒過在足太陰陽明咳嗽上氣厥在胸中過在手陽明太陰心煩頭痛病在膈中過在手巨陽少陰五臟生成篇靈下虛則厥下盛則熱上虛則眩上盛則熱垣兩寸脈實謂之陽盛陰虛下之則愈兩寸脈俱虛謂之陰陽皆虛補陰則陽竭補陽則陰竭宜調之以甘藥兩寸脈不足求之於地地者脾胃也當從陰引陽兩寸脈短小乃陽氣不足病在下也謂之陰盛陽虛取之下陵三里補瀉無形是謂導氣同精治在五亂中取法乃不足病也當取穴於腹募氣海臍下一寸五分甚者取三里氣衝以毫針引之兩關脈俱實上不至發汗下不至利大便宜芍藥湯瀉其土實兩關脈俱虛脈沉細宜服理中湯脈弦遲宜服建中湯盛加黃耆附子之類兩尺脈俱實是陰盛陽虛汗之則愈兩尺脈俱虛宜服姜附湯補陽問何陰虛而補陽曰陰本根於陽是也仲景云兩尺脈俱虛者不宜下下之則為逆逆者死兩尺脈或不見或短小病在天上求之於五臟背俞或血絡經隧伏火是天上有陰火故陽不收藏也又難經云下部無脈或兩尺竭絶乃為食塞當吐素來疾去徐上實下虛為厥顈疾來徐去疾上虛下實為惡風也脈要精微論補上治上制以緩補下治下制以急急則氣味厚緩則氣味薄適其至所此之謂也病所遠而中道氣味之者食而過之無越其制度也是故平氣之道近而奇耦制小其服也遠而奇耦制大其服也大則數少小則數多多則九之少則二之至真要論遠近言臟腑之位也潔病在上為天煎藥宜武宜清服宜緩飲制度宜炒酒洗浸病在下為地煎藥宜文宜濃服宜急飲垣在上不厭頻而少在下不厭頓而多少服則滋榮於上多服則峻補於下病在心上者先食而後藥病在心下者先藥而後食凡用黃芩黃連半夏知母病在頭面及手皮膚者須用酒一鍾借酒力以上升也咽之下臍之上須酒洗之在下生用大凡生降熟升凡諸藥根在上者中半以上者氣脈上行以生苗者為根中半以下者氣脈下行以入土者為梢病在中焦上焦者用根下焦者用梢則根升而梢降也去下部之疾者其丸極大而光治中焦之疾者次之治上焦者極小稠麵糊取其遲化直至下焦稀麵糊取其易化水浸宿蒸餅為丸及滴水為丸者又易化也羅東垣先生治消渴以甘露飲子劑為粗散時時以舌舐之取膈上停留此劑之緩也治心煩欲吐怔忪不安臥以辰砂安神丸如米大津液下十餘丸此近而奇耦制小其服也心肺在上為近劑小者不令下行故也治臊臭制瀉肝湯其說云難經論心主五臭入肝為臊臭此其一也用柴胡苦平微寒為君佐以龍膽苦寒以瀉心火澤瀉車前子甘鹹寒平淡滲肝之邪所謂在下者引而竭之多用水煮頓服之此制之急也以下焦陰虛制滋腎丸以黃柏大苦寒為君知母苦寒為佐使桂甘辛大熱為臣用丸如雞頭實大空心沸湯下百餘丸此遠而奇耦制大其服也素高者抑之下者舉之至真要論王注云高者抑之制其勝也下者舉之濟其弱也海熱在至高之分故用輕劑從高抑之治從緩也若急服之上熱未除中寒生矣如治大頭痛用酒煨大黃及黃連芩甘草黍黏子煎湯細細呷之之類是也局方養正丹方見眩運門垣柴胡調經湯一婦人經候黑血凝結成塊左廂有血瘕水瀉不止谷有時化有時不化東垣云經漏不止是前陰之氣血已下脫矣水瀉數年不愈是後陰之氣血下陷亦已脫矣是病人周身之氣常行秋冬之令久沉久降當大舉大升以助春夏次用四物隨顯證加減調經湯方見血崩丹一婦人産後有物如衣裙半在腹半在席醫不能曉先生曰此子宮也氣血虛隨子而下不能入即與黃耆當歸之劑而加升麻舉之仍以外攻之法而用五倍子作湯洗濯皺其皮使緩斂頃之子宮上先生慰之曰三年後可再生兒無憂也已而果然靈陷下則灸之東垣云陷者皮毛不任風寒知陽下陷也其脈雖數中必得細強而緊小或沉澀覆其上知其熱火陷下也雖脈八九至甚數疾而陰脈覆其上者可灸陰脈者細強緊小沉澀是也素氣反者病在上取之下病在下取之上病在中傍取之五常政大論丹一男子病小便不通醫以痢藥治之加劇丹溪云此積痰病也積痰在肺肺為上焦而膀胱為下焦上焦閉則下焦塞譬如滴水之器必上竅通而後下竅之水出焉乃以法大吐之吐已病如失又治一老人泄痢百方不應膈悶食減丹溪與吐劑吐出膠痰升許而痢止詳見久痢此上二法亦下者舉之之意夫小便不通氣血壅塞於下焦也泄瀉日久氣血降沉於下焦也今大吐之則一身血氣皆升浮而復於上焦則下之壅塞者流通降沉者升舉故皆痊也病在上取之下如噦逆喘滿上氣者灸臍下丹田三里引氣下降其病立痊之類是也王注上盛不已吐而脫之下盛不已下而奪之保仲景云傷寒三四日邪氣未傳於裡止用瓜蒂散吐而瘥豈可汗也又傷寒六七日胸中微悶不欲言懊惱昏眩無下證仲景梔子湯吐之立可又云中風不知人事亦不須發汗喉中呷喝有聲用稀涎散吐之又云風頭痛若不吐涎久則瞽目而不治用瓜蒂散吐之三吐而瘥又暴嗽風涎上壅咽塞不利茶調散吐之陽癇久不愈未成癡呆用導涎散吐之又陰癇用三聖散吐之又膏粱之人多食生鱠化蟲伏於胸中胸膈不快噎食不下用藜蘆散吐之又久患脅痛諸藥不能治用獨聖散加蠍梢半錢吐之諸癇不時發作不知人事用半生熟湯吐之暗風病久不瘥發過如舊用鬱金散吐之痎瘧久不瘥發寒熱無時用常山散吐之蛟龍瘕痛腹脹如鼓久不愈欲死用糖球散吐之吐出其物形如蜥蜴長七八寸亦可一人初患傷寒飲冷心腹悶身熱見食則啘用赤小豆散吐之婦人筋攣急痛用神應散吐之或曰筋病吐之何為答曰木鬱達之所謂達者令其條達或又有打撲墜損先吐之用金花散後下之用承氣湯蓋承者順也偏枯證半身不遂者用追風散吐之頭風后有目疾眼有半明可救者用防風散吐之小兒上喘嘲熱先用鬱金散吐之後用鎮涎散下之立效治顛狂病久不已用三聖散吐之後大下之諸風掉搖目直不知人事便可用懸頭膏吐涎立效胸膈滿背痛或臂疼可先用祛風湯吐之後服烏藥散厲風或瘡瘍惡瘡便用三聖散吐之後服苦參丸諸厥氣中風不省人事便用神聖散鼻內灌之吐出涎立效破傷風牙關緊急角弓反張亦用神聖散吐之吐後汗下之效三法俱用之者乃上古高醫神妙莫測今庸下之流止看諸方不知治法不識源流不行聖人法去聖日浸遠矣可惜悲哉丹凡吐取逆流水調藥吐之凡藥升動真氣者皆能吐如防風桔梗芽茶山梔川芎蘿蔔子以薑汁醋少許瓜蒂散少許入齏汁溫服之以鵝毛鉤探之子和稀涎散豬牙皂角不蛀者去皮弦一兩緑礬五錢藜蘆半兩上為細末每服半錢或一二錢斡開牙關漿水調灌之丹吐食積痰用蘿蔔子五合油炒擂入漿水攄汁入桐油白蜜少許旋旋半溫用帛緊束肚皮然後用鵝毛攪喉中令吐又法用蝦帶殼半斤入醬薑蔥等料物煮汁先吃蝦後飲汁以鵝翎鉤引即吐必須緊勒腹肚吐肥人濕痰用益元散齏汁調下探引吐之世豆參散吐痰輕劑赤小豆苦參上為末酸漿水調服用鵝翎探之丹吐法單藥桔梗蘆人參蘆艾葉末茶瓜蒂藜蘆附子尖砒此數味皆自吐不用手法探引但藥湯皆可吐虛病症用人參蘆吐之子和三聖散防風二兩去蘆瓜蒂三兩揀淨炒微黃藜蘆聖惠方減用之或一兩或半兩或三錢上各為粗末每服約半兩以齏汁三茶盞先用二盞煎三五沸去齏汁次入水一盞煎至三沸卻將先二盞同一處熬二沸去渣澄清放溫徐徐服之以吐為度不必盡劑丹一方用鬱金半兩藜蘆一錢苦參一錢上為末齏汁調吐如吐不止丁香一粒止之又不止蔥白湯呷之治風涎用天南星一枚中開一竅如粟米大好醋納於中焙乾如此三次藜蘆二錢半併為末酒糊丸每三五丸空心溫酒下一飯時自吐如未吐再三丸如涎盡嘔不止冷蔥白湯止之仲瓜蒂散方見傷寒腳氣上衝活人服瓜蒂法附於後衍義云凡用瓜蒂良久涎未出者含砂糖一塊下咽即涎吐之子和二仙散瓜蒂好茶各等分為細末每服二錢齏汁調下空心用之衍義瓜蒂此即甜瓜蒂也去瓜皮用蒂約半寸許暴極干不限多少細末量疾每用一二錢膩粉一錢匕以水半合同調勻灌之治風涎暴作氣塞倒臥服之良久涎自出或覺有涎用諸藥行化不下但如此服涎即出和劑碧露丹石緑細研九度飛過十兩附子尖川烏尖蠍梢各七十個上為末入石緑令勻糊丸雞頭大每服用薄荷汁半盞化下一丸更以酒半合溫服之須臾吐出痰涎上吐痰熱劑凡吐痰用寒劑纍纍吐不透者必用熱劑吐之方透丹溪用瓜蒂梔子苦參藜蘆等劑纍吐許白雲先生不透後以附子尖和漿水與之始得大吐也子和獨聖散用砒不以多少為細末每服一字以新水調下斡開牙關灌之尋常勿用世治痰喘砒一錢面二兩清水捏餅香油煮黃色為末每用末子一銅錢面江茶三銅錢面調勻五更井水調下如不吐可添半銅錢面次日再服子和青黛散搐鼻取涎神妙方見頭痛氣實痿熱結吐難出者必先二三次用苦梗開之丹吐法先以布搭膊勒肚腹於不通風處行之凡用探吐鵝毛須浸以桐油卻以皂莢水洗去油曬乾待用子和療痰者以叉股雞翎探引不出以齏投之不吐再投之且投且探無不出者吐至昏眩慎勿驚疑書曰若藥不瞑眩厥疾不瘳如發頭眩可飲冰水立解如無冰水新汲水亦可強者一二吐而安弱者可作三次吐之庶無損也吐之次日有頓復者有轉甚者蓋引之而上未平也數日當再為之如覺渴者冰水新水瓜梨涼物皆不禁惟禁食過飽硬物乾脯難化之物一醫吐一婦人半月不止命懸須臾豫煎麝香湯解之下咽立止或問麝香何能止吐豫謂之曰瓜苗聞麝香即死吐者瓜蒂也所以立解如藜蘆吐者不止以蔥白湯解之如石藥吐者不止以甘草貫衆解之諸草木吐者可以麝香解之丹溪云丁香甘草白朮總解諸藥吐藥之苦寒者有豆豉瓜蒂茶末梔子黃連苦參大黃黃芩苦辛而寒者有鬱金常山藜蘆甘苦而寒者有地黃汁辛而寒者有輕粉酸而寒者有晉礬緑礬齏汁酸辛而寒者有膽礬酸鹹而寒者有青鹽白米飲甘鹹而寒者有滄鹽甘而寒者有牙硝甘而微溫且寒者有人參蘆苦而溫者有木香遠志厚朴辛苦而溫者有薄荷芫花辛而溫者有穀精草蔥根鬚甘而溫者有烏頭附子尖酸而溫者有飯漿咸而溫者有皂角辛而熱者有蠍梢酸而平者有銅緑甘酸而平者有赤小豆凡此三十六味惟常山膽礬瓜蒂有小毒藜蘆芫花輕粉烏附尖有大毒外二十六味皆吐藥之無毒者各對證用之宜先小服不吐積漸加之病勢劇危老弱氣衰者不可吐吐不止則亡陽血虛者不可吐諸吐血嘔血咯血衄血嗽血崩血失血者皆不可吐病人無正性妄言妄從者不可吐主病者不辨邪正之說不可吐性行剛暴好怒喜淫之人不可吐海脈尺中按之有力當吐之若尺中按之無力不可吐也有力則陽氣下陷於陰中為陰中所遏故吐之使陽氣得上升也垣脾胃虛不可妄用吐藥論六元正紀論曰木鬱則達之者蓋木性當動蕩軒舉是其本體今乃鬱於地中無所施為即是風失其性人身有木鬱之證者當開通之乃可用吐法以助風木是木鬱則達之之義也又說木鬱達之者蓋謂木初失其性鬱於地中今既開發行於天上是發而不郁也是木復其性而有餘也有餘則兼其所勝脾土受邪見之於木鬱達之條下不止此一驗也又厥陰司天風木旺也厥陰之勝亦風木旺也俱是脾胃受邪見於上條其說一同或者不悟木鬱達之四字之義反作木鬱治之重實其實脾胃又受木製又復其木正謂補有餘而損不足也既脾胃之氣先已不足豈不因此而重絶乎明胸中窒塞當吐氣口三倍大於人迎是食傷太陰上部有脈下部無脈其人當吐不吐則死以其下部無脈知其木鬱在下也塞道不行而肝氣下絶矣兼肺金主塞而不降為物所隔金能剋木肝木受邪食塞胸咽故曰在上者因而越之仲景曰實煩以瓜蒂散吐之如經汗下謂之虛煩又名懊憹煩躁不能眠知其木鬱也以梔子豉湯吐之昧者不知膈咽不通上支兩脅腹脹胃虛不足乃濁氣在上則生䐜脹之病猛浪吐之況胃虛必怒風木已來乘凌胃氣內經以鐵烙鎮墜之豈可反吐助其風木之邪不宜吐而吐其差舛如天地之懸隔唯窒塞煩悶者宜吐之耳治下實大承氣湯在前表裡條診五臟虛實靈肝氣虛則恐實則怒本神論肝實則兩脅下痛引少腹善怒虛則目䀮䀮無所見耳無所聞善恐如人將捕之經文見刺虛實法素春脈太過則令人善怒忽忽眩冒而顛疾其不及則令人胸痛引背下則兩脅胠滿玉機真藏論背者肺之分野肝木不及而肺金乘之故胸痛引背靈心氣虛則悲實則笑不休本神篇心實則胸中痛脅支滿脅下痛膺背肩髀間痛兩臂內痛虛則胸腹大脅下與腰相引而痛經文見刺虛實法素夏脈太過則令人身熱膚痛為浸淫其不及則令人煩心上見咳唾下為氣泄玉機真藏論靈脾氣虛則四肢不用五臟不安實則腹脹經溲不利本神篇脾實則身重善飢肉痿足不收行善瘈腳下痛虛則腹滿腸鳴飧泄食不化經文見刺虛實法素脾脈太過則令人四肢不舉其不及則令人九竅不通名曰重強玉機真藏論靈肺氣虛則鼻塞不利少氣實則喘喝胸盈仰息本神篇肺實則喘咳逆氣肩背痛汗出尻陰股膝髀腨胻足皆痛虛則少氣不能報息耳聾嗌乾經文見刺虛實法素秋脈太過則令人逆氣而背痛慍慍然其不及則令人喘呼吸少氣而咳上氣見血下聞病音玉機真藏論靈腎氣虛則厥實則脹本神篇腎實則腹大脛腫喘咳身重寢汗出憎風虛則胸中痛大腹小腹痛清厥意不樂經文見刺虛實法素冬脈太過則令人解㑊脊脈痛而少氣不欲言其不及則令人心懸如病飢䏚中清脊中痛少腹滿小便變玉機真藏論木不及其病內舍胠脅外在關節火不及其病內舍膺脅外在經絡土不及其病內舍心腹外在肌肉四肢金不及其病內舍膺脅肩背外在皮毛水不及其病內舍腰脊骨髓外在溪谷踹膝氣交變論黃帝問曰春脈如弦何如而弦岐伯對曰春脈者肝也東方木也萬物之所以始生也故其氣來耎弱輕虛而滑端直以長故曰弦反此者病帝曰何如而反岐伯曰其氣來實而強此謂太過病在外其氣來不實而微此謂不及病在中玉機真藏論難春脈弦反者為病何謂反然其氣來實強是謂太過病在外氣來虛微是謂不及病在內十五難素帝曰夏脈如鉤何如而鉤岐伯曰夏脈者心也南方火也萬物之所以盛長也故其氣來盛去衰故曰鉤反此者病帝曰何如而反岐伯曰其氣來盛去亦盛此謂太過病在外其氣來不盛去反盛此謂不及病在中玉機真藏論難夏脈鉤反者為病何謂反然其氣來實強是謂太過病在外氣來虛微是謂不及病在內十五難素帝曰秋脈如浮何如而浮岐伯曰秋脈者肺也西方金也萬物之所以收成也故其氣來輕虛以浮來急去散故曰浮反此者病帝曰何如而反岐伯曰其氣來毛而中央堅兩傍虛此謂太過病在外其氣來毛而微此謂不及病在中玉機真藏論難秋脈毛反者為病何謂反然其氣來實強是謂太過病在外氣來虛微是謂不及病在內十五難素帝曰冬脈如營如何而營岐伯曰冬脈者腎也萬物之所合藏也故其氣來沉以搏故曰營反此者病帝曰何如而反岐伯曰其氣來如彈石者此謂太過病在外其去如數者此謂不及病在中玉機真藏論難冬脈石反者為病何謂反其氣來實強是謂太過病在外氣來虛微是謂不及病在中難十五問素帝曰四時之序逆從之變異也然脾脈獨何主岐伯曰脾脈者土也孤藏以灌四傍者也帝曰然則脾善惡可得見之乎岐伯曰善者不可得見惡者可見帝曰惡者何如可見岐伯曰其來如水之流者此謂太過病在外如鳥之喙者此謂不及病在中玉機真藏論難脾者中州也其平和不可得見衰乃見耳如雀之啄如水之下漏是脾之衰見也十五難靈陰氣盛則夢涉大水而恐懼陽氣盛則夢大火而燔焫陰陽俱盛則夢相殺上盛則夢飛下盛則夢墮甚飢則夢取甚飽則夢與肝氣盛則夢怒肺氣盛則夢恐懼哭泣飛揚心氣盛則夢善笑恐畏脾氣盛則夢歌樂身體重不舉腎氣盛則夢腰脊兩解不屬凡此十二盛者至而瀉之立已厥氣客於心則夢見丘山煙火客於肺則夢飛揚見金鐵之奇物客於肝則夢山林樹木客於脾則夢見丘陵大澤壞屋風雨客於腎則夢臨淵沒居水中客於膀胱則夢遊行客於胃則夢飲食客於大腸則夢田野客於小腸則夢聚邑街衢客於膽則夢鬥訟自刳客於陰器則夢接內客於項則夢斬首客於脛則夢行走而不能前及居深地窖苑中客於股肱則夢禮節拜起客於胞䐜則夢溲便凡此十五不足者至而補之立已也淫邪發夢說肝膽味辛補酸瀉氣溫補涼瀉心小腸味鹹補甘瀉氣熱補寒瀉脾胃味甘補苦瀉氣溫補寒瀉補瀉各從其宜逆從互換入求責法肺大腸味酸補辛瀉氣涼補溫瀉腎膀胱味苦補咸瀉氣寒補熱瀉肝苦急急食甘以緩之甘草肝欲散急食辛以散之川芎以辛補之細辛以酸補之芍藥肝虛以生薑陳皮之類補之虛則補其母腎者肝之母也以熟地黃柏補腎如無他證錢氏地黃丸補之補肝丸四物湯內加防風羌活等分為細末煉蜜為丸是也鎮肝丸即瀉青丸去梔子大黃是也治肝虛錢氏補腎地黃丸方見勞海肝實以白芍藥瀉之如無他證錢氏瀉青丸主之實則瀉其子心乃肝之子以甘草瀉心錢氏瀉青丸當歸去蘆焙稱草龍膽焙稱川芎梔子川大黃煨羌活防風去蘆上各等分為末煉蜜為丸雞頭大每服一丸煎竹葉湯同砂糖溫水化下海藏云東垣先生治癍後風熱毒翳膜氣暈遮睛以此劑瀉之大效初覺易治仲問曰上工治未病何也師曰夫治未病者見肝之病知肝傳脾當先實脾四季脾土不受邪即勿補之中工不曉相傳見肝之病不解實脾惟治肝也夫肝之病補用酸助用焦苦益用甘味之藥調之酸入肝焦苦入心甘入脾脾能傷腎之氣腎氣微弱則水不行水不行則心火氣盛則傷肺肺被傷則金氣不行金氣不行則肝木自愈此治肝補脾之要妙也肝虛則用此法實則不必用之經曰虛虛實實補不足損有餘是其義也餘臟准此垣從前來者為實邪從後來者為虛邪此子能令母實母能令子虛是也治法云虛則補其母實則瀉其子假令肝受心火之邪是從前來者為實邪當瀉其子火也然非直瀉其火十二經中各有金木水火土當木之分瀉其火也故標本論云本而標之先治其本後治其標既肝受火邪先於肝經五穴中瀉滎火行間穴是也後治其標者於心經五穴內瀉滎火少府穴是也以藥論之入肝經藥為引用瀉心火藥為君標而本之先治其標後治其本既肝受水邪當先於腎經湧泉穴中補木是先治其標後於肝經曲泉穴中瀉水是後治其本以藥論之入腎經藥為引用補肝經藥為君是也海心苦緩急食酸以收之五味子心欲軟急食鹹以軟之芒硝以咸補之澤瀉以甘瀉之人參黃耆甘草心虛以炒鹽補之虛則補其母肝乃心之母以生薑補肝如無他證錢氏安神丸是也錢氏安神丸麥門冬去心焙馬牙硝白茯苓乾山藥寒水石研甘草各半兩硃砂一兩研龍腦一字研上為細末煉蜜為丸如雞頭大每服半丸砂糖水化下無時海八物定志丸補益心神安定魂魄治痰去胸中邪熱理肺腎此方補心更俟同志定奪人參一兩半菖蒲遠志去心茯神去心茯苓去皮各一兩硃砂二錢白朮麥門冬去心各半兩牛黃二錢另細研上為細末煉蜜丸如桐子大米飲湯下三十丸無時若髓竭不足加生地黃當歸若肺氣不足加天門冬麥門冬五味子若心氣不足加上黨參茯神菖蒲若脾氣不足加白朮白芍藥益智若肝氣不足加天麻川芎若腎氣不足加熟地黃遠志牡丹皮若膽氣不足加細辛酸棗仁地榆若神昏不足加硃砂預知子茯神心實以甘草瀉之如無他證以錢氏方中重則瀉心湯輕則導赤散錢氏瀉心湯黃連一兩去須上為極細末每服一字至半錢一錢臨臥溫水調下海藏云易老單方瀉心湯出於此乃實邪也實則瀉其子錢氏導赤散丹溪云導赤散正小腸藥也生地黃木通甘草各等分上同為末每服三錢水一盞入竹葉七片同煎至五分食後溫服一本不用甘草用黃芩脾苦濕急食苦以燥之白朮脾欲緩急食甘以緩之甘草以甘補之人參以苦瀉之黃連脾虛以甘草大棗之類補之如無他證以錢氏益黃散補之虛則補其母心乃脾之母以炒鹽補心錢氏益黃散陳皮一兩青皮訶子肉甘草各半兩丁香二錢上為細末每服二錢三錢煎服海藏云此劑瀉脾以燥濕東垣閻孝忠編集錢氏方以益黃散補土又言風旺必克脾土當先實其脾味者不審脾中寒熱一例用補脾藥又不審藥中有丁香青皮辛熱大瀉肺金脾虛之症豈可反瀉其子為寒水反來侮土中寒嘔吐腹痛瀉痢青白口鼻中氣冷益黃散神治之藥也如因服熱藥巴豆之類過劑損其脾胃或因暑天傷熱積食損其脾胃而成吐瀉口鼻中氣熱而成慢驚者不可服之今立一方治胃中風熱名人參安胃散黃耆二錢人參一錢生甘草半錢炙甘草半錢白芍藥七分陳皮一錢去白黃連少許白茯苓四分上為粗末每服水二盞煎五沸去渣溫服海脾實以枳實瀉之如無他證以錢氏瀉黃散瀉之實則瀉其子肺乃脾之子以桑白皮瀉肺錢氏瀉黃散藿香七錢山梔仁一兩石膏半兩甘草二兩防風四兩上銼同蜜酒微炒香為細末每服二錢水一盞煎清汁服海藏云此劑瀉肺熱海肺苦氣上逆急食苦以瀉之訶子皮一作黃芩肺欲收急食酸以收之白芍藥以酸補之五味子以辛瀉之桑白皮肺虛以五味子補之如無他證錢氏補肺阿膠散主之虛則補其母脾乃肺之母以甘草補脾錢氏補肺阿膠散阿膠一兩半炒黍黏子一兩炒香馬兜鈴半兩炒甘草一錢炒杏仁七個去皮尖糯米一兩上為末每服二錢水一盞食後海藏云杏仁瀉肺非若人參天冬麥冬之補也當以意消息之海肺實以桑白皮瀉之如無他證以瀉白散主之實則瀉其子腎乃肺之子以澤瀉瀉腎錢氏瀉白散桑白皮一兩炒黃地骨皮一兩甘草半兩炒上為細末每服二錢水一盞入粳米百粒同煎食後服易老加黃連海藏云治肺熱傳骨蒸熱自宜用此以直瀉之用山梔黃芩方能瀉肺但當以氣血分之海腎苦燥急食辛以潤之知母黃柏腎欲堅急食苦以堅之知母以苦補之黃柏以咸瀉之澤瀉腎虛以熟地黃柏補之垣腎有兩枚右為命門相火左為腎水同質而異性也經曰形不足者溫之以氣精不足者補之以味又云氣化精生味和形長無陰則陽無以化當以味補腎真陰之虛陰本既固陽氣自生化成精髓若相火陽精不足宜用辛溫之劑世人用辛熱之劑治寒甚之病非補腎也難經云臟各有一耳腎獨有兩者何也然腎兩名非皆腎也其左者為腎右者為命門命門者諸精神之所舍元氣之所繫也故曰男子以藏精女子以系胞故知腎有一也左腎屬水水不足則陰虛宜補腎丸龜板酒炙四兩知母酒浸炒黃柏炒焦各三兩乾薑一兩上為末粥丸一方無姜有側柏葉用地黃膏為丸補血丸龜板酒炙黃黃柏炒知母炒各三兩生乾薑一兩杜牛膝二兩上為末粥丸固真丸龜板醋炙二兩虎骨酥炙一兩蒼耳酒蒸九次三兩生地薑汁製炒柏皮半兩乾薑三錢烏藥半兩上為末薑汁糊丸垣三才封髓法丹降心火益腎水麥門冬去心熟地人參各半兩黃柏炒三兩甘草炙七錢半縮砂仁一兩半上為細末水糊和丸梧子大每服五十丸用蓯蓉半兩作片酒浸一宿次日煎至三五沸去渣送下前丸子空心服右腎屬火火不足則陽虛宜八味丸垣八味丸治腎氣虛乏下元傷憊臍下疼痛夜多漩溺腳膝緩弱面色痿黃或黧黑及虛勞不足渴欲飲水腰重疼痛小腹急痛小便不利並宜服之脾惡濕腎惡燥古人制方益腎皆濕潤之藥也故八味丸仲景謂之腎氣丸以熟地黃為主熟地補腎水真陰八兩肉桂補腎水真火一兩丹皮補神志不足三兩附子能行諸經而不止兼益火一兩白茯苓能伐腎邪濕滯三兩澤瀉去胞中留垢及遺溺三兩山茱萸治精滑不禁四兩乾山藥能治皮毛中乾燥酸濕四兩上八味為細末煉蜜丸皆君主之藥也若不依易老加減服之終不得效若加五味子為腎氣丸述類象形之劑也益火之源以消陰翳壯水之主以制陽光錢氏地黃丸加減法如陽事多痿不振依今方然夏月減附子三停精完全減桂附只六味血虛陰衰熟地黃為君精滑山茱萸為君小便或多或少或赤或黃或白茯苓為君小便淋漓澤瀉為君心虛腸胃積熱心火熾盛心氣不足牡丹皮為君皮膚澀干山藥為君以上言為君者其分兩用八兩其乾地黃只依為臣分兩余皆同保命金剛丸牛膝丸煨腎丸並見虛損門海離珠丹又名神珠丹治下焦陽氣虛乏臍下腹冷痛足胻寒而逆杜仲炒去絲三兩萆薢二兩訶子煨五個龍骨一兩破故紙三兩巴戟酒浸去心三兩胡桃一百個去皮硃砂另研一兩半縮砂仁半兩上為末酒為丸梧桐子大硃砂為衣每服三十丸空心溫酒鹽湯任下還少丹大補心腎脾胃一切虛損神志俱耗筋力頓衰腰腳沉重肢體倦怠血氣羸乏小便渾濁乾山藥牛膝酒浸遠志去心山茱萸去核白茯苓五味巴戟酒浸去心肉蓯蓉酒浸石菖蒲楮實杜仲去絲舶上茴香各一兩薑汁一兩枸杞一兩半上為細末煉蜜同棗肉為丸桐子大每服三十丸溫酒或鹽湯下日三服食前五日覺有力十日精神爽半月氣壯二十日目明一月夜思飲食冬月手足常暖久服令人身體輕健筋骨壯盛怡悅顏色壽延難老更有加減法如熱加山梔子一兩心氣不寧加麥門冬一兩少精神加五味子一兩陽弱加續斷一兩常服固齒牢牙永無瘴瘧婦人服之容顏悅澤暖子宮去一切病水芝丸方見小便數門丹玉女長春不老丹牛膝根汁蒼耳根汁各二碗不可入水和一處瓷器熬成膏如稠蜜金罌子為末散半斤用不去皮蓮子實豭豬肚即羯豬肚蒸熟取蓮子曬乾四兩和前二末膏子丸如梧子大溫酒下草丸一月身和暖二月覺精神服一料驗甚海腎實須澤瀉瀉之腎本無實不可瀉錢氏止有補腎地黃丸無瀉腎之藥治脈洪而實錢氏地黃丸加生地黃去山茱萸是也此治左手本部脈實若右尺洪實以鳳髓丹瀉之假令水在木之分是從後來者此為虛邪雖水為虛邪則木本虛矣經曰母能令子虛假令火在木之分是從前來者此為實邪雖火為實邪則木本實矣經曰子能令母實假令兩手脈弦無表證乃東方實也是西方不足也緣母虛所致宜大補其脾土微補肺大泄其火微泄其木雜症諸論云先調其氣次治諸疾況此本經不足的證也難經云東方實是西方虛也又云欲泄其邪先補其虛此之謂也此證當以溫藥補肺以氣藥燥劑為用如正氣已勝當再服泄火瀉風之藥清鬲涼上勿令入胃此為全治用益黃加白朮半夏茯苓甘草如酒病得之加澤瀉治手足陽明二燥益黃者燥濕而補氣也實瀉黃也泄火瀉風用瀉青之類羌活防風生地黃甘草黃連等分黃芩倍之凡用藥補即用各方之生數如理中丸建中湯是也瀉即用各方之成數七宣丸是也診五邪相干難有正經自病有五邪所傷何以別之經言憂愁思慮則傷心形寒飲冷則傷肺恚怒氣逆上而不下則傷肝飲食勞倦則傷脾久坐濕地強力入水則傷腎是正經自病者也何謂五邪有中風有傷暑有飲食勞倦有傷寒有中濕此之謂五邪假令心病何以知中風得之然其色當赤何以言之肝主色自入為青入心為赤入脾為黃入肺為白入腎為黑肝為心邪故知當赤色也其病身熱脅下滿痛其脈浮大而弦何以知傷暑得之然當惡臭何以言之心主臭自入為焦臭入脾為香臭入肝為臊臭入腎為腐臭入肺為腥臭故知心病傷暑得之也當惡臭其病身熱而煩心痛其脈浮大而散何以知飲食勞倦得之然當喜苦味虛為不欲食實為欲食何以言之脾主味入肝為酸入心為苦入肺為辛入腎為咸自入為甘故脾邪入心為喜苦味也其病身熱體重嗜臥四肢不收其脈浮大而緩何以知傷寒得之然當譫言妄語何以言之肺主聲入肝為呼入心為言入脾為歌入腎為呻自入為哭故知肺邪入心為譫言妄語也其病身熱灑灑惡寒甚則喘咳其脈浮大而澀何以知中濕得之然當喜汗出而不可止何以言之腎主濕入肝為泣入脾為涎入肺為涕自入為唾故知腎邪入心為汗出不可止也其病身熱而小腸痛足脛寒而逆其脈沉濡而大此五邪之法也四十九難肝主色心主臭脾主味肺主聲腎主液肝色青其臭臊其味酸其聲呼其液泣心色赤其臭焦其味苦其聲言其液汗脾色黃其臭香其味甘其聲歌其液涎肺色白其臭腥其味辛其聲哭其液涕腎色黑其臭腐其味鹹其聲呻其液唾病有虛邪有實邪有賊邪有微邪有正邪何以別之從後來者為虛邪從前來者為實邪從所不勝來者為賊邪從所勝來者為微邪自病者為正邪何以言之假令心病中風得之為虛邪傷暑得之為正邪飲食勞倦得之為實邪傷寒得之為微邪中濕得之為賊邪五十難一脈為十變者何謂也然五邪剛柔相逢之意也假令心脈急甚者肝邪干心也心脈微急者膽邪干小腸也心脈大甚者心邪自干心也心脈微大者小腸邪自干小腸也心脈緩甚者脾邪干心也心脈微緩者胃邪干小腸也心脈澀甚者肺邪干心也心脈微澀者大腸邪干小腸也心脈沉甚者腎邪干心也心脈微沉者膀胱邪干小腸也五臟各有剛柔邪故令一脈輒變為十也十難靈黃帝曰請問脈之緩急大小滑澀之病形何如岐伯曰臣請言五臟之病變也心脈急甚者為瘛瘲微急為心痛引背食不下謂色赤脈鉤而急也余緩大小滑澀五脈仿此緩甚為狂笑微緩為伏梁在心下上下行時唾血大甚為喉吤微大為心痹引背善淚出小甚為善噦微小為消疸滑甚為善渴微滑為心疝引臍小腹鳴澀甚為喑微澀為血溢維厥耳鳴顛疾肺脈急甚為癲疾微急為肺寒熱怠惰咳唾血引腰背胸若鼻瘜肉不通謂色白脈毛而急也餘脈仿此緩甚為多汗微緩為痿瘻偏風頭以下汗出不可止大甚為脛腫微大為肺痹引胸背起惡日光小甚為泄微小為消疸滑甚為息賁上氣微滑為上下出血澀甚為嘔血微澀為鼠瘻在頸肢腋之間下不勝其上其應善酸矣肝脈急甚者為惡言微急為肥氣在脅下若覆杯謂色青脈弦而急也餘脈仿此緩甚為善嘔微緩為水瘕痹也大甚為內癰善嘔衄微大為肝痹陰縮咳引小腹小甚為多飲微小為消疸滑甚為㿉疝微滑為遺溺澀甚為溢飲微澀為瘈攣筋痹脾脈急甚為瘛瘲微急為膈中食飲入而還出後沃沫緩甚為痿厥微緩為風痿四肢不用心慧然若無病大甚為擊僕微大為疝氣腹裡大膿血在腸胃之外小甚為寒熱微小為消疸滑甚為㿉癃微滑為蟲毒蛔蠍腹熱澀甚為腸㿉微澀為內㿉多下膿血腎脈急甚為骨癲疾微急為沉厥奔豚足不收不得前後謂色黑脈石而急也餘脈仿此緩甚為折脊微緩為洞洞者食不化下嗌還出大甚為陰痿微大為石水起臍以下至小腹腄腄然上至胃脘死不治小甚為洞泄微小為消疸滑甚為癃㿉微滑為骨痿坐不能起起則目無所見澀甚為大癰微澀為不月沉痔黃帝曰病之六變者刺之奈何岐伯答曰諸急者多寒緩者多熱大者多氣少血小者血氣皆少滑者陽氣盛微有熱澀者多血少氣微有寒是故刺急者深內而久留之刺緩者淺內而疾髮針以去其熱刺大者微瀉其氣無出其血刺滑者疾髮針而淺內之以瀉其陽氣而去其熱刺澀者必中其脈隨其逆順而久留之必先按而循之已髮針疾按其痏無令其血出以和其脈諸小者陰陽形氣俱不足勿取以針而調以甘藥也初詳滑者陰氣有餘今反言陽氣盛澀者陽氣有餘今反言少氣多血恐二脈乃交互間宜更詳之以上並見邪氣臟腑病形篇垣假令肝病實邪風熱相合風性急火搖動焰而旋轉其脈弦而緊洪風熱發狂宜芎黃湯羌活川芎大黃各一兩甘草半兩上㕮咀每服半兩水二盞煎至六分去渣溫服虛邪風寒相合木慮腎恐拘急自汗其脈弦緊而沉仲景云風感太陽移證在少陰經中桂枝加附子湯主之賊邪風燥相合血虛筋縮皮膚皴揭脈弦浮而澀仲景云血虛筋急桂枝加栝蔞湯主之微邪風濕相合體重節痛臟腑洞泄脈弦長而緩仲景云身體疼痛下痢清穀急當救里四逆湯主之正邪中風目眩頭重叫怒不出脈弦緊而長仲景云甚則如癇為痓宜羌活湯本草云羌活主痓癇防風黃芩為佐小兒為癇大人為痓假令心病實邪熱濕相合憒憒心煩熱蒸不眠脾經絡於心心經起於脾二經相接故為濕熱脈浮大而緩足太陰寄證在手太陽宜梔豉湯若痞加厚朴枳實虛邪熱風相合妄聽妄聞耳有蕭聲膽與三焦之經同出於耳銅人云刺關衝出血瀉支溝脈浮大而弦初小柴胡湯後大柴胡湯此證是太陽與少陽為病前客後主也賊邪熱寒相合膽惕心懸如飢神怯恐怖足少陰與手厥陰相接水中心經故神怯怖耳脈大而沉濡亦在太陽經中內經曰心虛則熱收於內以黃連附子瀉心湯主之治法云熱多寒少以熱為佐如寒多熱少加附子乾薑佐之微邪熱燥相合過飲歌樂實為熱燥俗言暢飲也病人言快活快活是有聲歌樂也以意思漿是無聲歌樂也脈大而洪澀白虎湯主之喘則加人參正邪熱也脫陽見鬼躁擾狂越脈洪實一呼四至是八至脈也小承氣湯主之謂腹不堅大也假令肺病實邪燥寒相合毛聳皮涼溲多而清其脈短澀而沉此證如秋冬宜八味丸若春夏宜地黃丸虛邪燥濕相合微喘而痞便難而痰其脈浮澀而緩枳實理中湯主之如喘甚加人參若便難加木香檳榔各半錢為極細末煎下理中丸賊邪燥熱相合鼻窒鼽衄血溢血泄其脈澀而浮大甚者桃仁承氣湯微者犀角地黃湯極者抵當湯微者抵當丸微邪燥風相合皮燥甲枯血虛氣虛二臟俱虛先血後氣其脈浮澀而弦大養氣血藥主之正邪燥自病其氣膹郁皆屬於肺諸燥有聲其脈浮澀而短則諸嗽藥選而用之假令腎病實邪寒風相合當藏不藏故下痢純清其脈沉滑而弦仲景云少陰證口燥咽乾下痢純清大承氣湯主之脈沉弦而遲四肢逆冷者宜四逆湯等虛邪寒清相合咳唾多呻灑淅寒清無寐經言燥化清其脈沉實而澀酸棗仁湯主之賊邪寒濕相合腎為胃關關閉水溢關閉不利水在胃為腫在肺為喘及變諸證其脈沉緩而大仲景云大病瘥後腰下有水氣者牡蠣澤瀉湯主之微邪寒熱相合膀胱熱鬱津液枯少其脈沉濡而大內經曰水少乾涸是也豬苓湯主之正邪寒自病為寒忿用藏黑痹經沉其脈沉濡而滑宜黑痹天麻丸如證同脈異微者腑病也甚者臟病也假令脾病實邪濕燥相合胃中燥屎腹滿堅痛其脈緩而長澀正陽陽明證也調胃承氣湯主之虛邪濕熱相合熱陷胃中腸澼下血脈緩而大黃連解毒湯主之賊邪濕風相合嘔逆脅痛往來寒熱脈緩而弦長小柴胡湯主之微邪濕寒相合寒來求濕身黃而不熱體重而不渴謂之寒濕其脈緩沉而滑朮附湯主之如小便不利者加茯苓正邪濕自病腹滿時痛手足自溫其脈沉澀而長虛痛桂枝加芍藥湯實痛桂枝加大黃湯主之胃為十二經之海十二經皆稟血氣滋養於身脾受胃之稟行其血氣也脾胃既虛十二經之邪不一而出假令不能食而肌肉削乃本病也其右關脈緩而弱本部脈也本部本證脈中兼見弦脈或見四肢滿閉淋溲便難轉筋一二證此肝之脾胃病也當於本經藥中加風藥以瀉之本部本證脈中兼見洪大或見肌熱煩面赤而不能食肌肉消一二證此心之脾胃病也當於本經藥中加瀉火之藥本部本證脈中兼見浮澀或見氣短氣上喘咳痰盛皮澀一二證此肺之脾胃病也當於本經藥中兼瀉肺之邪及補氣之藥本部本證脈中兼見沉細或見善恐數缺之證此腎之脾胃病也當於本經藥中加瀉腎水之浮及瀉陰火伏熾之藥弦脈風邪所傷甘草芍藥黃耆建中湯之類或甘酸之劑皆可用之洪脈熱邪所傷三黃丸瀉黃散調胃承氣湯或甘寒之劑皆可用之脾胃右關其脈緩如得緩脈本經太過濕邪所傷平胃散加白朮茯苓五苓散或除濕之劑皆可用之澀脈燥邪所傷異功散加當歸四君子湯加熟地黃或甘溫甘潤之劑皆可用之沉細脈寒邪所傷益黃散養脾丸理中湯如寒甚則加附子甘熱之劑皆可用之前項所定方藥乃常道也如變則更之脾胃不足不同餘臟無定體故也其治肝心肺腎有餘不足或補或瀉惟益脾胃之藥為切經言至而不至是為不及所勝妄行所生受病所不勝乘之也至而不至者謂從後來者為虛邪心與小腸來乘脾胃也脾胃脈中見浮大而弦其病或煩躁悶亂或四肢發熱或口苦舌乾咽乾蓋心主火小腸主熱火熱來乘土位乃濕熱相合故煩躁悶亂也四肢者脾胃也火乘之故四肢發熱也飲食不節勞役所傷以致脾胃虛弱乃血所生病主口中津液不行故口咽乾也病人自以為渴醫者治以五苓散謂止渴燥而反加渴燥乃重竭津液以至危亡也經云虛則補其母當於心與小腸中以補脾胃之根蒂以甘溫之藥為之主以苦寒之藥為之使以酸味為之臣佐以心苦緩急食酸以收之心火旺則肺金受邪金虛則以酸補之次以甘溫及甘寒之劑於脾胃中瀉心火之亢盛是治其本也所勝妄行者謂心火旺能令母實母者肝木也肝木旺則挾火之勢無所畏懼而妄行也故脾胃先受之或身體沉重走注疼痛蓋熱濕相搏風熱鬱而不得伸附麗於有形也或多怒者風熱下陷於地中也或目病而生內障者脾裹血胃主血心主脈脈者血之府也或云心主血又云肝主血肝之竅開於目也或妄見妄聞起妄心夜夢亡人四肢滿悶轉筋皆肝木火盛而為邪也或生痿或生痹或生厥或中風或生惡瘡作腎痿或上熱下寒為邪不一皆風熱不得生長而木火遏於有形中也所生受病者言肺受土火木之邪而清肅之氣傷或胸滿少氣短氣者肺主諸氣五臟之氣皆不足而陽道不行也或咳嗽寒熱者濕熱乘其內也所不勝乘之者水乘木之妄行而反來侮土故腎火下亢致督任沖三脈盛火旺煎熬令水沸騰而乘脾肺故痰涎唾出於口也下行為陰汗為外腎冷為足不任身為腳下隱痛或水附木勢而上為眼澀為眵為冷淚此皆由肺金之虛而寡於畏也夫脾胃不足是火不能生土而反抗拒此至而不至是為不及也白朮君人參臣甘草佐芍藥佐黃連使黃耆臣桑白皮佐諸風藥皆是風能勝濕也諸甘溫藥亦可心火亢盛乘於脾胃之位亦至而不至是為不及也黃連君石膏佐芍藥佐知母佐黃柏臣甘草使生地臣黃芩佐肝木妄行胸脅痛口苦舌乾往來寒熱而嘔多怒四肢滿閉淋溲便難轉筋腹中急痛此所不勝乘之也柴胡君防風臣白朮佐羌活佐獨活佐芍藥臣甘草臣升麻使茯苓佐豬苓澤瀉佐肉桂臣藁本川芎細辛蔓荊子白芷石膏黃柏知母滑石肺金受邪由脾胃虛弱不能生肺乃所生受病也故咳嗽氣短氣上皮毛不能禦寒精神少而渴情慘慘不樂皆陽氣不足陰氣有餘是體有餘而用不足也人參君白朮佐白芍藥佐橘皮臣青皮破滯氣黃耆臣桂枝佐桔梗引用桑白皮佐甘草木香佐檳榔五味佐此三味除客氣腎水反來侮土所勝者妄行也作涎及清涕唾多溺多而惡寒者是也土火復之及三脈為邪則足不任身足下痛不能踐地骨乏無力喜睡兩丸冷腹陰陰而痛妄聞妄見腰脊背脅皆痛乾薑君蒼朮佐川烏臣炒少許白朮臣肉桂佐茯苓澤瀉使豬苓佐附子佐炮孫按虞部郎中汪奉老疾革有子可升當遺表奏蔭召孫至曰郎中亡矣不可治可升告孫曰生且固難如何可延三日以待奏回孫曰郎中之患肝氣將絶脾土反勝當後脾土火旺肝氣乃絶方今日辰巳間當略瀉脾土使不能勝肝則木且未絶三日後早奏下當日氣絶孫尚藥精究五臟盛衰類此天地之氣內淫而勝為病藥方六氣乘虛為病相勝藥方六氣之復為病藥方並見運氣類注
