body:
  text: 卷之二十五脾胃部積塊癥瘕丹氣不能作塊成聚塊乃有形之物痰與食積死血成聚宜醋煮海石醋三稜莪朮桃仁紅花五靈脂香附之類石鹼白朮湯下之瓦龍子能消血塊又能消痰治塊當降火消食積食積即痰也行死血血塊去後須大補之石鹼痰積有塊可用洗滌垢膩又能消食積塊在皮裡膜外須用補氣香藥開之兼二陳湯加補氣藥先須斷厚味凡積病不可用下藥徒損真氣病亦不退當用消積藥融化開則自消垣治積要法許學士云大抵治積或以所惡者攻之所喜者誘之則易愈如硇砂水銀治肉積神麯麥蘖治酒積水蛭虻蟲治血積木香檳榔治氣積牽牛甘遂治水積雄黃膩粉治痰積礞石巴豆治食積各從其類也若用群隊之藥分其勢則難取效須要認得分明是何積聚兼見何證然後增加佐使之藥不爾反有所損要在臨時通變也治積當察其所痛以知其病有餘不足可補可瀉無逆天時詳臟腑之高下如寒者熱之結者散之客者除之留者行之堅者削之強者奪之咸以耎之苦以瀉之全真氣藥補之隨其所積而行之節飲食慎起居和其中外可使必已不然遽以大毒之劑攻之積不能除反傷正氣終難復也醫者可不慎歟諸積皆本於喜怒傷臟而陰虛陰既虛矣則風雨襲陰之虛病起於上而生積清濕襲陰之虛病起於下而成積詳見針灸條潔壯人無積虛人則有之皆由脾胃怯弱氣血兩衰四時有感皆能成積若遽以磨堅破結之藥治之疾似去而人已衰矣乾漆硇砂三稜牽牛大黃之類得藥則暫快藥過則依然氣愈消疾愈大竟何益哉故善治者當先補虛使血氣壯積自消如滿座皆君子則小人自無容地也不問何臟先調其中使能飲食是其本也丹有婦人三十歲因哭子至半年後胸痞有塊如杯飲食大減面淡黃慘黑若不勝衣六脈弦細虛澀至日晡後則發寒熱予察其事勢已急補瀉兼用以補中益氣湯隨天氣寒暄加減法與東垣痞氣丸相間服方見五積門食前用湯食後用丸常令湯多於丸些少如此近一月寒熱皆退食亦稍進又以丸用湯相等服之至第二月以後忽一夜大發寒熱至天明熱退胸中之塊如失至晚手足下半節皆腫遂停藥三五日後忽一夜手足之腫如失至天明胸中之塊復有比如前覺小一暈遂以二陳湯加桔梗白朮枳實調理半月而安次年復生一男一婦人四十餘面白形瘦性急因大不如意三月後乳房下貼肋骨作一塊漸漸長大掩心微痛膈悶飲食減四之三每早覺口苦兩手脈微而短澀予知其月經不來矣為之甚懼辭勿與治思至夜半其婦尚能出外見醫梳妝言語如舊料其尚有胃氣遂以參朮歸芎佐以氣藥作大服一晝夜與四次外以大琥珀膏貼塊上防其長經一月餘服補藥百餘帖食及平時之半仍用前藥又過一月脈氣漸充又與前藥吞潤下丸百餘帖月經不及兩月而至澀脈減五分之四時天氣熱意其經行時必帶紫色仍與前補藥加醋炒三稜吞潤下丸以抑青丸十五粒佐之又經一月忽報塊已消及大半月經及期尚欠平時半日飲食甘美如常但食肉則覺不快予令止藥且待來春木旺時又與區處至次年六月忽報一夜塊大比舊反加大半指脈略弦左略怯於右至數日平和自言食飽後則塊微悶食行卻自平予意有動心事激之問之果然仍與前補藥加黃芩炒黃連以少木通生薑佐之去三稜煎湯吞潤下丸外以琥珀膏貼之半月值經行而塊散此是肺金為內火所爍木邪勝士土不能運清濁相干舊塊輪廓尚在者因氣血之未盡復也濁氣稍留舊塊復起補其血氣使肺不受邪木氣平而土氣正濁氣行而塊散矣方提領年五十六丁丑年冬因飲酒後受怒氣於左脅下與臍平作痛自此以後漸漸成小塊或起或不起起則痛痛止則伏面黃口乾無力食少吃此物便噯此味轉惡風寒脈之左大於右弦澀而長大率左甚重取則全弦此得熱散太多以致胃氣大傷陰血下衰且與和胃湯以補胃氣滋養陰血並下保和丸助其化粕伺胃實陰血稍充卻用消塊和胃湯方人參三錢白朮一錢半陳皮一錢芍藥歸身各五分乾葛三分紅花豆大甘草二錢炙作一帖下保和丸二十五龍薈丸十五上三法補氣血藥為主磨積出入佐之皆補多於磨乃氣血虛甚而有積塊之法也敢村婦人腹下有塊白朮湯下保和丸三十五粒王郎心痛膈有塊與白朮二錢青皮一錢芍藥木通川芎蒼朮各一錢甘草五分作一帖煎下保和丸三十粒馮氏女年三十歲形瘦色嫩滋味素厚幼年曾踏雪嘗以火烘鞋履以致濕熱上襲至二十五歲時口嘗吐清水吞酸醫用丁香等熱藥時止時作作時仍服前藥至當年心痛胸痞有塊吃飯即吐些常出三之一遂與佐金丸二十四粒以薑湯下之與三十餘次全不進食予曰結已開矣且令止藥或口乾思飲止與半盞熟水間以青六丸與之雖困臥著床尤以絕藥為善如此近四十日診其脈前後些微弦重取似澀輕取稍和至此弦脈漸添遂令與人參酒芍藥湯引金瀉木漸漸思食而苦於大便秘病家必欲行大黃予止之遂以生芍藥陳皮桃仁人參為丸與之用蜜煎導大便行而食進調理半月而安參萸丸即佐金丸加人參一錢是也廬子裕左脅下因瘧後食肉與酒而成塊白朮一錢柴胡醋炒一錢茯苓二錢枳殼炒五分人參五分作湯下阿魏五保和二十抑青十與點十攻塊五長垣朱郎因酒多年濕病脅上有塊腹滑泄小便黃滑石一兩白朮三稜各六錢陳皮五錢黃連豬苓各三錢黃芩木通各二錢防風一錢半乾薑一錢甘草五分炙分七帖煎下保和丸二十一丈夫肚左邊帶脅上有塊先吃匾食牛乳者成氣痛又因酒肉塊大如桃食減三分之一滑石半兩白朮四錢陳皮三稜各三錢蘿蔔子連翹黃連各一錢乾葛二錢半桃仁二十個黃芩一錢甘草錢半炙上分四帖水煎服婦人脅下有塊大如掌脈澀時有熱此虛中有氣積先與補虛次與磨積藥白芍歸鬚四錢陳皮白朮三錢青皮川芎木通各一錢甘草半錢白水煎熱服磨積藥三稜醋煮一錢枳實青皮桃仁各五錢大黃五錢桂枝錢半海藻醋煮三錢細末神麯糊丸如桐子大每服四十丸世一孺人左脅下舊有塊漸長大脈弦而大稍數詢之近亦發熱食亦減倦怠先與補之次攻此塊陳皮五錢白朮兩半柴胡歸頭青皮各五錢甘草一塊木通三錢半上作八帖服次與攻塊青皮醋一兩半桃仁五錢三稜醋一兩半桂枝三錢半海藻醋洗三錢銼末神麯糊為丸一丈夫脅下有積塊內有痰熱汗不得泄兩脈大而散軟此體有虛三稜五錢白朮黃連各三錢人參二錢半甘草五分連翹木通各三錢川芎桂一錢水煎下保和丸富小娘瘧後左脅下塊小便少厚朴柴胡各二錢三稜一錢半甘草半錢木通五錢白朮六錢半青皮五錢生薑一片上食前熱服下邳錢郎正月發沙因此臍邊有塊二枚發起則痛伏則不痛有時又隱痛自灸臍中脈甚弦右手伏重取則略數此蘊熱因春欲汗解而氣弱不能自發為汗復郁又因食不節邪挾宿食所以成塊宜以保和二十溫中二十抑青十用白朮木通三稜湯下上十一法皆補藥與磨積相半兼服之前七法治飲食酒肉成積後三法治體虛有熱成積也丹陳里長男二十七歲舊因飽食牛肉豆腐患嘔吐又不節飲食右脅下生一塊漸長今大如掌痛發則見痛止則伏其脈弦而數知此人必性急塊上不可按按則愈痛痛則必吐黃酸苦水詢之果然或作腎氣治予曰非也此足太陰有食積與濕痰荔枝核燒二個山梔炒五個去殼枳實炒十五個山楂九個茱萸炒九枚一方有人參上細研急流水一盞蕩起煎沸入生薑汁令辣食前熱服與六帖吐二帖服四帖與此藥且止其痛卻與消塊藥半夏末六錢皂角六個水煮取汁拌半夏末曬乾黃連炒五錢石鹼二錢另研以上三件同為細末以糖球膏為丸如胡椒大丹一婢色紫稍肥性沉多憂年近四十經不行三月矣小腹中有一氣塊初起如慄漸如炊餅予脈之兩手皆澀重取卻稍和試令按塊痛甚捫之高寸半遂與千金消石丸至四五次後忽自言乳頭黑且有汁恐是孕予曰韭也澀脈無孕之理又與三五帖脈之稍覺虛豁予悟曰經阻久矣令止前藥與四物湯倍白朮佐以陳皮炙甘草至三十帖候服完再與消石丸數次忽自言塊消一暈便令莫服又半月經行痛甚下黑血半升內有如椒核者數十粒而塊消一半又來索藥以消余塊予曉之曰勿性急似開矣不可又攻若次月經行當消盡矣次月經行下少黑血塊又消一暈又來問藥予曰且守禁忌至次月又消盡已而果然大凡攻擊之藥有病則病受之病邪輕而藥力重則胃氣受傷夫胃氣者清純沖和之氣也惟與穀肉菜果相宜蓋藥石皆偏勝之氣雖參耆輩為性亦偏況攻擊之藥乎此婦胃氣弱血亦少若待塊盡而去藥胃氣之存者幾希矣一婦人年五十五歲形氣俱實富而神勞味厚性急常經水過多醫每用澀藥止後病氣痛胸腹共有積塊大小十三枚遇夜痛甚著床累月飲食雖減應接家事如故其脈兩手皆澀而弱此因屢用澀藥致敗血積聚不行故爾時三月間用蜀葵根煎湯再煎人參白朮陳皮青皮甘草梢牛膝成湯入玄明粉少許研桃仁調熱飲之服至二帖腹痛下塊一枚再並渣煎服又下一枚時以病久血耗不敢再取塊告技窮而歸後想此症患病雖重其形質尚可受藥但當去葵根玄明粉其後塊漸消而病安一女子年二十一歲累因食傷胃脘有塊隨氣上塞咽中問之又因食煨鹽配粥與白朮一錢半陳皮半夏各一錢桔梗青皮木通各五錢甘草炙些生薑二片煎服一二次病遂平復再與前藥半月後加桔梗煎一服令其吐吐出痰積遂愈子和息城司侯聞父死於賊乃大悲哭罷便覺心痛日增不已月餘成塊狀若覆杯大痛不堪藥皆無功議用燔針炷艾病人惡之乃求治於戴人戴人至適巫者在其傍乃學巫者雜以狂言以謔病者至是大笑不忍回面向壁一二日心中結硬皆散戴人曰內經言憂則氣結喜則百脈舒和又云喜勝悲內經自有此法丹呂宗信年六十素好酒八月間因暑熱中得疾兩足冷過膝上脘有塊如掌牽引脅痛不可眠臥飲食減半卻不渴已自服生料五積散三帖予脈之六脈俱沉澀而小按之不為弱皆數而右為甚大便如常小便赤色遂用大承氣湯減大黃之半而熟炒加黃連芍藥川芎乾葛甘草作湯下栝蔞仁半夏黃連貝母丸至十二帖足冷退至脛塊減半遂止藥至半月飲食復舊諸症悉除唐柳宗元纂救死方元和十二年二月得腳氣夜半痞絕脅有塊大如石且死因大寒不知人三日家人號哭滎陽鄭詢美傳杉木湯服半食頃大下三次氣通塊散其方用杉木節一大升橘葉一大升無葉以皮代之大腹檳榔七個合搗碎之童便三大升共煮取一升半分二服若一服得快利停後服肘治卒暴症腹中有如石刺痛牛膝一大把並葉酒煮飲之外治卒暴症腹中有物堅如石痛欲死取蒴藋根一小束洗瀝去水細擘以酒二升漬三宿暖溫服五合至一升日三若欲速得服於熱灰中溫令藥味出服之此方無毒神效上暴積急去條四方如塊除後必用補劑以救其受攻之傷也海萬病紫菀丸療臍腹久患痃癖如碗大及諸黃病每值氣起時上氣衝心繞臍絞痛一切蟲咬十種水病十種蠱病及反胃吐食嘔逆噁心飲食不消天行時病女人多年月露不通或腹如懷孕多血天陰即發又治十二種風頑痹不知年歲晝夜不安夢與鬼交頭多白屑或哭或笑如鬼魅所著腹中生瘡腹痛服之皆效紫菀去苗土吳茱萸湯洗七次焙乾菖蒲柴胡去須厚朴薑製各一兩桔梗去蘆茯苓去皮皂莢去皮子炙桂枝乾薑炮黃連去須蜀椒去目及閉口微炒出汗巴豆去皮膜內油炒人參去蘆各五錢川烏炮去皮臍三錢加羌活獨活防風各一兩上為細末入巴豆研勾煉蜜丸如桐子大每服三丸漸加至五丸七丸生薑湯送下食後臨臥服有孕者不宜服具引於後痔漏腸風酒下赤白痢訶子湯下膿血痢米飲湯下墮傷血悶四肢不收酒下蛔蟲咬心檳榔湯下氣噎憂噎荷葉湯下打撲傷損酒下中毒掃帚灰甘草湯下一切風升麻湯下寸白蟲檳榔湯下霍亂乾薑湯下咳嗽杏仁湯下腰腎痛豆淋酒下陰毒傷寒溫酒下吐逆生薑湯下飲食氣塊麵湯下時氣井花水下脾風陳皮湯下頭痛水下心痛溫酒下大小便不通燈草湯下因物所傷以本物湯下吐水藜湯下氣病乾薑湯下小兒天吊風搐防風湯下小兄疳痢蔥白湯下小兒乳食傷白湯下月信不通紅花酒下婦人腹痛川芎酒下懷孕半年後胎漏艾湯下有子氣衝心酒下產暈痛溫酒下血氣痛當歸酒下產後心痛腹脹滿豆淋湯下難產益智湯下產後血痢當歸湯下赤白帶下酒煎艾湯下解內外傷寒粥飲下室女血氣不通酒下子死腹中菜子湯下又治小兒驚癇大小顛狂一切風及無孕婦人身上頑麻狀如蟲行四肢俱腫呻吟等疾楊駙馬患風氣衝心飲食吐逆遍身枯瘦日服五丸至二十日瀉出肉塊如蝦蟆五六枚白膿二升愈趙侍郎先食後吐目無所見耳無所聞服五十日瀉出青蛇五七條四寸許惡膿三升愈王氏患大風病眉發墮落掌內生瘡服之半月瀉出癩蟲二升如馬尾長寸許後愈李靈患肥氣病日服五丸經一年瀉出肉鱉二枚愈黃門卒中風病發時服藥泄出惡膿四升赤黃水一升一肉蟲如亂髮愈李知府妻梅氏帶下病七年血崩不止骨痿著床日服五丸至十丸十五丸取下膿血五升黃水一升肉塊如雞子狀治愈一切萬病如神惟有孕者不宜服局溫白丸治心腹癖塊久症積聚大如杯碗黃疸宿食朝起嘔吐支滿上氣時時腹脹心下堅結上來搶心傍攻兩脅十種水氣八種痞塞翻胃吐逆飲食噎塞五種淋疾九種心痛積年食不消化或連年瘧疾不瘥及療一切諸風身體頑麻不知痛癢或半身不遂或眉發墮落及療七十二種風三十六種遁屍疰忤及顛癇及婦人諸疾斷續不生帶下淋瀝五邪失心憂愁思慮飲食減少月水不調及腹中一切諸疾連年羸瘦困斃或歌或笑如鬼所使但服此藥無不除愈即前萬病紫菀方減羌活獨活防風萬病丸療八種痞病五種癇病十種疰忤七種飛屍十二種蠱毒五種黃病十二種瘧疾十種水病八種大風十二種痹並風入頭眼翳膜漠漠及上氣咳嗽喉中如水雞聲不得臥飲食不作肌膚五臟滯氣積聚不消壅閉不通心腹脹滿及胸背膨脹氣結四肢流入胸腹又治心膈氣滿時定時發十年二十年不瘥五種下痢疳蟲蛔蟲寸白諸蟲上下冷熱久積痰飲令人多眠睡消瘦無力蔭入骨髓便成漏疾身體氣腫飲食嘔逆腰腿痠疼四肢沉重不能久行久立婦人因產冷入子臟臟中不淨或閉塞不通胞中瘀血冷滯出流不盡時時疼痛為惡或因此斷產並小兒赤白下痢及狐臭耳聾鼻塞等病服此藥以三丸為一劑不過三劑其病悉除說無窮盡故稱萬病丸牛黃研細黃芩去蘆芫花醋炒赤禹餘糧醋淬研飛雄黃研飛芎藭人參去蘆紫菀去蘆頭醋炒蒲黃微炒麝香研當歸去蘆桔梗去蘆大戟銼炒乾薑炮防風去蘆黃連去須硃砂研飛犀角鎊前胡去蘆巴豆去皮心膜炒細辛去苗葶藶炒肉桂去粗皮茯苓去皮桑白皮炒芍藥川椒去目及閉口者微炒出汗甘遂各一兩蜈蚣一十二節去頭足炙芫青二十八枚入大米同炒黃色去頭足石蜥蜴去頭尾足炙四寸上為細末入研藥勻煉蜜為丸如豆大若一歲以下小兒有疾者令乳母服兩小豆大亦以吐利為度近病及卒病多服積病久疾即少服常服微溏利為度卒病欲死服三丸取吐利即瘥卒中惡口噤服二丸漿水下利即瘥五疰鬼刺客忤服二丸男女邪病歌哭腹大妊娠者服二丸日三夜一間食服之蠱毒吐血腹如刺服二丸不瘥更服瘧病未發前服一丸未瘥更服諸有痰飲者服三丸冷癖日三服每服三丸皆間食常令微溏利宿食不消服二丸取利癥瘕積聚服二丸日三服拘急心腹脹滿心痛服三丸上氣嘔逆胸膈滿不得臥服二丸不瘥更服大痢服二丸日二服疳䘌服二丸或一丸如杏仁大和醋二合灌下部中水病服三丸日再服間食服之瘥止人弱即隔日服頭痛惡寒服二丸覆取汗傷寒天行服二丸日三服間食服之小便不通服一丸不瘥明日更服大便不通服三丸又內一丸下部中即通耳聾停急以綿裹如棗核塞之鼻衄服一丸癰腫疔腫破腫內一丸如麻子大日一敷之赤根自出犯疔腫血出以豬脂和塗有孔則內孔中瘥癩瘡以醋泔洗訖取藥和豬脂敷之漏瘡有孔以一丸內孔中和豬脂敷上痔瘡塗綿筋上內孔中即瘥瘰癧以醋和塗上瘥癬瘡以布揩令汗出以醋和塗上日一易瘥胸背腰脅腫以醋和敷腫上日一易又服二丸諸冷瘡積年不瘥者以醋和塗之惡刺以一丸內瘡孔中即瘥蝮蛇螫以少許內螫處若毒入腹心煩欲絕者服三丸蜂螫以少許敷之瘥婦人諸疾胞衣不下服二丸小兒驚癇服一丸如米許以塗乳令小兒嗍之看小兒大小加減兒客忤服一丸如米大和乳塗乳頭令嗍之以意量之蠍螫以少許敷之瘥小兒乳不消心腹脹滿服一丸如米許塗乳頭令嗍之即瘥羅乾柿丸取虛實積下膈甚妙硃砂研為衣沒藥研豬牙皂角去皮弦子為細末乾薑炮為末乾漆炒煙盡為末京三稜炮為末輕粉一錢青礞石煅為末各一錢水銀一錢鉛一錢結炒乾巴豆三十粒去皮膜醋煮十沸上件各研勻軟飯和為丸如綠豆大煎柿蒂湯冷下三五丸加減用婦人有胎不可服小腸移熱於大腸為久癖為沉全文見診病傳變千消石丸治癥瘕硝石六錢大黃八錢人參甘草各三錢上各為末先將硝黃末以三年苦酒先煎候將干卻用參甘二末和勻為丸每三十丸米湯下四日一服候下如雞肝或如米泔赤黑色等效下後忌風冷羅醋煮三稜丸治一切積聚不拘遠年近日治之神效京三稜四兩醋煮透竹篦切曬乾川芎二兩醋煮大黃半兩醋煮濕紙裹煨過上三味同為末醋糊為丸如桐子大每三十丸溫水下不拘時病甚者一月效小者半月效羅神功助化散專治男子婦人腹中痞塊不拘氣血食積所成此方之妙不可盡述地萹蓄五錢瞿麥穗五分大麥蘖五錢神麯二錢半沉香一錢半木香一錢半甘草五分大黃二兩上為細末淨依分兩和勻男以甘草淡竹葉二味等分煎湯及無灰酒同調服酒多於湯婦人用紅花燈心當歸等分煎湯及無灰酒同調服酒多於湯忌油膩動氣之物及房事一月藥須用黃昏服大小便見惡物為度神妙非常誓不輕傳匪人聖散子治遠年積塊及婦人乾血氣硇砂六兩大黃八兩麥蘖六兩乾漆燒過萹蓄茴香炒檳榔各一兩如婦人乾血氣加穿山甲二兩炮上為細末每服三錢溫酒調下仰臥此藥只在心頭至天明大便如魚腸小便赤為驗取出並無毒有神效小兒用一錢十五以上五錢空心服之更效寒氣客於小腸膜原之間絡血之中血泣不得注於大經血氣稽留不得行故宿昔而成積矣全文見諸痛海紅丸子治大人脾積氣滯胸膈滿悶面黃腹滿脹四肢無力酒積不食乾嘔不止脾連心胸及兩乳痛婦人脾血積氣諸般血症氣塊及小兒食積骨瘦面黃肚脹氣急不嗜飲食漸成脾虛不拘老少並宜服之京三稜五斤水浸軟分切作小片子蓬朮五斤陳皮五斤揀淨青皮五斤胡椒三斤乾薑二斤炮上研六味同為細末醋糊為丸桐子大礬紅為衣每三十丸食後薑湯吞下羅雞爪三稜丸治五臟痃癖氣塊雞爪三稜石三稜京三稜木香青皮去白陳皮去白各半兩硇砂三錢檳榔肉豆蔻各一兩上為細末生薑汁麵糊為丸桐子大生薑湯送下硇砂煎丸消積磨塊一切凝滯黑附子二枚各重五錢以上者炮裂去皮臍剜作甕子木香三錢蓽茇一兩硇砂三錢用水一盞續續化開納在甕內火上熬干破故紙一兩隔紙微炒上將飛過硇砂末封在附子甕內卻用剜出附子末蓋口用和成白麵裹約半指厚慢火灰內燒勻黃色去面用木香等為細末卻用元裹附子熟黃面為末醋調煮糊為丸如桐子大每服十五丸至三十丸生薑湯送此藥累有奇功本治症丸治丈夫女人小兒年深日近沉積瘕塊面色青黃時上搶心吐水吞酸舌生白沫婦人積年月經不調漸成血氣或血蠱塊中焦之間覆如杯碗連年累月漸成瘦瘠寒熱往來一切脾胃受寒久不瘥愈之疾並皆治之巴豆五兩去油膜蓬朮三兩醋炙透京三稜三兩醋煮透丁香皮二兩木香一兩半丁香一兩半厚朴三兩制石菖蒲二兩良薑一兩半虻蟲一兩半炒川牛膝一兩香附子四兩炒石蓮子肉二兩薏苡仁一兩使君子三兩去殼上為細末稀麵糊為丸如綠豆大積年癥瘕成塊者第一服用熟水下二十丸自後每日三丸五丸更量虛實加減與之五日云盡積塊若近脾胃有積者每服五丸米飲吞下一服取效婦人血氣成塊及血瘕每服二十丸用蘇木酒童子小便各一半煎五七沸令溫空心吞下自後每日用溫酒下三丸其血塊逐旋消從大小便去儘自知小兒蛔蟲腹痛不能忍日夜叫喚百藥不救者陳皮湯下七丸立效諸蟲皆宜下常服或白湯或薑湯下三五丸中酒及酒積大便鮮臭者白湯與酒各半吞十丸立效如神一切咽塞心下硬痛皆用棗湯下五丸不拘時候羅玄胡索丸治吐利腹脹心腹痛癥瘕氣結蟲煩不安順三焦和脾胃玄胡索當歸青皮去白雄黃飛廣朮炮木香檳榔京三稜炮各四兩上為細末入雄黃末水糊為丸桐子大生薑湯下荊蓬煎丸破痰癖消癥塊冷熱積聚胸膈疰悶通利三焦升降陰陽順氣消食京三稜二兩酒浸冬三日夏一日枳殼炒一兩廣朮二兩醋浸冬三日夏一日以上二味同以去皮巴豆二十個銀器內炒令黃色不用巴豆木香去根青皮去白茴香微炒檳榔各一兩上為細末水糊為丸豌豆大每服三十丸生薑湯下丹潤下丸治積塊方見咳嗽世二賢散消積塊進食橘紅一斤淨甘草四兩鹽半兩上用水二四碗從早煮至夜以爛為度水乾則添水曬乾為末淡薑湯調下有塊者加薑黃半兩同前藥煮氣滯加香附二兩同前藥煮氣虛者加沉香半兩另入噤口痢加蓮肉二兩去心另入上自久積緩除條至此一十六方皆純是磨積之劑必用補氣血藥相兼服之純用之致死乃醫殺之也謹之驚風成塊者妙應丸加穿山甲炒鱉甲燒各三錢玄胡索蓬朮各四錢每五十丸加至七十丸以利為度妙應丸即控涎丹方見痰門丹茶癖喜吃茶及吃干茶者石膏黃芩升麻為末砂糖調服世酒積方累效烏梅肉一兩半夏曲七錢青木香四錢枳實半兩砂仁半兩杏仁三錢巴霜一錢黃連酒浸一宿一兩上為末蒸餅丸綠豆大每八丸白湯送下褚澄傳云澄善醫為吳郡太守百姓李道念以公事到郡澄見謂曰汝有重病答曰舊有冷病至今年久眾醫不瘥澄為診曰汝病非冷非熱當是食白瀹雞子過多所致令取蒜一升煮食吐一物如升涎裹之開看是雞雛羽翅爪距具足能行走澄曰此未盡更服余藥又吐得如曏者有十三頭而病都瘥衍有人病心腹懣煩彌二歲診曰腹有蠱誤食發而然令餌雄黃一劑少選吐一蛇如拇指無目燒之有發氣乃愈此殺毒蟲之驗也上二方吐蟲積之法也丹治食積死血痰積成塊在兩脅動作腹鳴嘈雜眩運身熱時作時止黃連一兩半用茱萸益智仁同炒止用黃連山梔半兩炒川芎神麯桃仁去皮三稜蓬朮各半兩並醋煮香附童便浸山楂各一兩蘿蔔子炒一兩半上面糊丸又方有青皮半兩白芥子一兩半炒治脅痛有塊龍薈丸二錢半起料方見治寒熱加薑黃桃仁各半兩上蜜丸服世小阿魏丸治脅下積塊三稜醋炙一兩蓬朮醋製一兩青皮醋製二兩胡椒三錢木香一兩麝香二分阿魏二錢半上為末醋煮陳倉米粉為丸桐子大子和果園劉子平妻腹中有塊如瓢十八年矣經水斷絕諸法無措戴人令一月之內湧四次下六次取去痰約一二桶其中不化之物有如葵葉煮爛魚腸之狀湧時以木如意攪之覺病積如括漸漸而平及積既盡塊痕反窪如臼略無少損至是而面有童色經水復行若當年少可以有子丹治塊在何部分在中為痰飲在右為食積在左為血積潤下丸治痰積方見咳阿魏丸去諸積山楂南星皂角水浸半夏同南星浸麥芽神麯黃連各一兩連翹阿魏醋浸栝蔞貝母各半兩風化硝石鹼胡黃連白芥子各二錢半蘿蔔子一兩蒸上為末薑汁浸炊餅丸一方加香附蛤粉治嗽羅破積導飲丸治內有積塊堅硬飲食不消心下痞悶木香檳榔陳皮去白青皮去白枳殼麩炒枳實麩炒廣朮炮京三稜炮半夏湯洗七次神麯炒麥蘖炒茯苓乾薑澤瀉甘草炙各五錢牽牛頭末六錢巴豆三十枚去皮心膜上為細末入巴豆霜令勻生薑汁打曲糊為丸如桐子大每服三十丸溫薑湯送下食前無小三稜煎治食症酒痞血癥氣塊時發刺痛全不思食積滯不消心腹堅脹痰逆嘔噦噫酢吞酸京三稜蓬朮各四兩蕪花一兩去梗葉上同入甕器中用米醋五升浸滿封器口以炭火煨令乾取出稜術將芫花以余醋炒令微焦焙乾為末醋糊丸如綠豆大每十五丸生薑湯下羅神效五食湯丸取虛實積氣食蠱脹積塊水氣年深痞瘕並皆治之大戟刮去皮甘遂生各半兩豬牙皂角生去皮子胡椒生芫花醋浸一宿取出炒各二兩巴豆去皮膜心醋煮二十沸研半兩上件除巴豆杵羅為末入巴豆再研勻水煮麵糊為丸如綠豆大每服五七丸氣實者十丸夜臥水一盞入白米白麵黑豆生菜豬肉各少許煎至半盞去渣候湯溫下藥取下病忌油膩黏滑物婦人有胎者不可服必效療癖取車下李仁微湯退去皮及並仁者與乾麵相拌搗為餅如面乾和淡水如常溲麵法作餅大小一如病人掌為二餅微炙黃至熟空腹食一枚當大利如不利更食一枚或飲熱粥汁以利為度若至午後利不止即以醋飲止之利後當虛病未盡者量力一二日更進一服以病盡為限小兒亦以意量之不得食酪及牛馬肉等無不效丹保和丸治食積酒積方見傷食阿魏丸治肉積及飽食停滯胃壯者宜此脾虛者勿服山楂蘿蔔子神麯麥芽陳皮青皮香附各二兩阿魏一兩醋煮軟另研上炊餅丸又方龍薈丸加白鴿糞大能消食積或入保和丸羅流氣丸治五積六聚癥瘕癖塊留飲木香川茴香炒青皮廣朮炮陳皮去白蘿蔔子炒補骨脂炒蓽澄茄砂仁神麯炒麥蘖炒枳殼麩炒各一兩牽牛一兩半檳榔一兩上為細末麵糊為丸如桐子大食後每服三十丸細嚼白豆蔻仁一枚白湯送下丹治血塊丸海粉醋煮三稜醋煮蓬朮桃仁紅花五靈脂香附石鹼上為丸白朮湯吞下本主症積滿腹諸藥不瘥者取白馬尿服之愈世治腹中有塊豬腰子一雙切薄片木鱉子肉一兩與豬腰片相間縛定外用濕紙包火內煨熟取出去紙擂盆內搗如泥入黃連末和為丸每服二十丸烏梅甘草湯吞下第二服二十五丸三服三十丸漸加至以痛為度大便利其塊自消有神效難病有積有聚何以別之然積者陰氣也聚者陽氣也故陰沉而伏陽浮而動氣之所積名曰積氣之所聚名曰聚故積者五臟所生聚者六腑所成也積者陰氣也其始發有常處其痛不離其部上下有所終始左右有所窮處聚者陽氣也其始發無根本上下無所留止其痛無常處故謂之聚故以是別知積聚也五十五難治聚法見末條仲病有積有聚有穀氣何謂也師曰積者臟病也終不移聚者腑也發作有時展轉痛移為可治穀氣者脅下痛按之則愈復發為穀氣素青脈之至也長而左右彈有積氣在心下支胠名曰肝痹得之寒濕與疝同法腰痛足清頭痛是也五臟生成篇難肝之積名曰肥氣在左脅下如覆杯有頭足久不愈令人發咳逆㾬瘧連歲不已以季夏戊己日得之何以言之肺病傳肝肝當傳脾脾季夏適王王者不受邪肝復欲還肺肺不肯受故留結為積故知肥氣以季夏戊己日得之五十六難肝脈微急為肥氣在脅下若覆杯全文見治虛實法素赤脈之至也喘而堅診曰有積氣在中時害於食名曰心痹得之外疾思慮而心虛故邪從之五臟生成篇帝曰病有少腹盛上下左右皆有根此為何病可治否岐伯曰病名曰伏梁帝曰伏梁何因而得之岐伯曰裹大膿血居腸胃之外不可治治之每切按之致死帝曰然何以故岐伯曰此下則因陰必下膿血上則迫胃脘生膈俠胃脘內癰此久病也難治居臍上為逆臍下為從勿動亟奪腹中論王注云生當作出林注云太素俠胃作便胃帝曰人有身體髀骨股胻皆腫環臍而痛是為何病岐伯曰病名伏梁此風根也其氣溢於大腸而著於肓肓之原在臍下故環臍而痛也不可動之動之為水溺澀之病同上難心之積名曰伏梁起臍上大如臂上至心下久不愈令人病煩心以秋庚辛日得之何以言之腎病傳心心當傳肺肺秋適王王者不受邪心復欲還腎腎不肯受故留結為積故知伏梁以秋庚辛日得之五十六難心脈微緩為伏梁在心下上下行時唾血全文見治虛實法素黃脈之至也大而虛有積氣在腹中有厥氣名曰厥疝女子同法得之疾使四肢汗出當風是也五臟生成篇疝當作痞字難脾之積名曰痞氣在胃脘覆大如盤久不愈令人四肢不收發黃疸飲食不為肌膚以冬壬癸日得之何以言之肝病傳脾脾當傳腎腎以冬適王王者不受邪脾復欲還肝肝不肯受故留結為積故知痞氣以冬壬癸日得之五十六難脾脈微大為痞氣腹裹大膿血在腸胃之外全文見治虛實法素白脈之至也喘而浮上虛下實驚有積氣在胸中喘而虛名曰肺痹寒熱得之醉而使內也五臟生成篇喘謂脈躁數也難肺之積名曰息賁在右脅下覆大如杯久不已令人灑淅寒熱喘咳發肺壅以春甲乙日得之何以言之心病傳肺肺當傳肝肝以春適王王者不受邪肺復欲還心心不肯受故留結為積故知息賁以春甲乙日得之五十六難肺脈滑甚為息賁主氣全文見虛實法素黑脈之至也上堅而大有積氣在小腹與陰名曰腎痹得之沐浴清水而臥是也難腎之積名曰賁豚發於少腹上至心下若豚狀或下或上無時久不已令人喘逆骨痿少氣以夏丙丁日得之何以言之脾病傳腎腎當傳心心以夏適王王者不受邪腎復欲還脾脾不肯受故留結為積故知賁豚以夏丙丁日得之五十六難腎脈微急為沉厥奔豚足不收不得前後全文見治虛實法垣肝之積肥氣丸治積在左脅下如覆杯有頭足久不愈令人咳逆㾬瘧連年不已厚朴半兩黃連七錢柴胡二兩椒去汗目閉不用四錢巴豆霜五分川烏炮去皮臍一錢二分乾薑五分皂角去皮弦子煨一錢半白茯苓一錢半廣朮炮昆布人參各二錢半甘草三錢上除茯苓皂魚巴豆外為極細末再另研巴豆霜旋旋入和勻煉蜜丸如桐子大初服二丸一日加一丸二日加二丸漸加至大便微溏再從兩丸加服周而復始積減大半勿服上後積藥依此法服之春夏秋冬另有加減法在各條下秋冬加厚朴一半通前重一兩減黃連一錢半若治風癇於一料中加人參茯苓菖蒲各三錢黃連只依春用七錢雖秋冬不減淡醋湯送下空心服加減肥氣丸仲夏合此治同前柴胡厚朴各半兩黃連一兩川椒甘草各五分巴霜三錢乾薑半兩肉桂二錢人參半兩川烏三錢上除巴豆末外同為細末旋入巴霜研勻煉蜜丸如桐子大初服二丸一日加一丸二日加二丸漸加至大便微溏再從二丸加服淡醋湯下空心服利大便行秋冬去生薑半錢加厚朴一倍減黃連一半心之積伏梁丸治起臍上大如臂上至心下久不愈令人心煩黃連一兩半人參半兩厚朴去皮薑製半兩黃芩去皮三錢肉桂一錢乾薑巴豆霜川烏焙去皮臍各五分紅豆茯神去皮各一錢丹參炮一錢菖蒲五分上除巴豆霜外為末另研豆霜旋入和勻煉蜜為丸如桐子大初服二丸一日加一丸二日加二丸漸加至大便微溏再從二丸加服淡黃連湯下食遠周而復始即減半勿服秋冬加厚朴半兩通前共一兩減黃連半兩只用一兩黃芩不用脾之積痞氣丸氣在胃脘腹大如盤久不愈令人四肢不收發黃疸飲食不為肌膚厚朴制半兩黃連去須八錢吳茱萸洗二錢黃芩二錢白茯苓另為末澤瀉各一錢巴豆霜另研四分乾薑炮一錢五分白朮二錢川烏炮去皮臍五分人參一錢茵陳一錢半縮砂一錢半桂四分川椒炒五分上除巴豆霜茯苓另研為末旋入外余藥同為細末煉蜜為丸如桐子大初服二丸一日加一丸二日加二丸漸加至大便微溏再從二丸加服淡甘草湯下食遠周而復始積減大半勿服加減痞氣丸孟秋合此黃芩酒製三分厚朴一錢黃連酒製半夏各五分益智三分吳茱萸三分紅花五分青皮二分歸尾三分澤瀉五分茯苓神麯廣朮昆布各二分橘皮去白三分熟地二分人參二分附子三分甘草炙巴豆霜葛根各二分上為末蒸餅為丸桐子大初服二丸一日加一丸二日加二丸漸加至大便微溏再從二丸加服淡甘草湯送下肺之積息奔丸治左右脅下覆大如杯久不已令人灑淅寒熱喘咳嗽發肺癰厚朴薑製八錢黃連炒一兩三錢乾薑炮一錢半桂枝去皮一錢巴豆霜四分白茯一錢半川烏炮去皮臍一錢川椒去汗錢半人參二錢桔梗一錢紫菀去苗一錢半青皮五分陳皮京三稜炮天門冬白豆蔻各一錢上除茯苓巴豆霜旋入外余藥為末煉蜜丸如桐子大每服二丸一日加一丸二日加二丸加至大便微溏再從二丸加服煎淡生薑湯送下食遠周而復始積減大半勿服秋冬加厚朴五錢通前一兩三錢黃連減七錢用六錢加減息奔丸仲夏合此其積為病寒熱喘咳氣上奔脈澀失精亡血氣滯則短氣血凝泣則寒熱相參氣分寒血分熱治法宜益元氣泄陰火破氣削其堅也川烏一錢乾薑一錢人參二錢陳皮八錢黃連一兩三錢紫菀一錢半桂枝二錢巴豆霜四分厚朴一錢半青皮七分川椒炒去汗錢半紅花少許茯苓一錢半桔梗一錢白豆蔻一錢京三稜一錢半天門冬去心一錢半上件為末湯泡蒸餅為丸如桐子大初服二丸一日加一丸二日加二丸加至大便微溏為度再從二丸加服煎生薑湯送下食前忌酒濕面辛辣生冷之物腎之積奔豚丸發於小腹上至心下若豚狀或上下無時久不已令人喘逆骨痿少氣及治男子內經七疝女子瘕聚帶下苦楝酒煮三錢黃連炒五錢白茯二錢澤瀉二錢川烏炮五分菖蒲二錢玄胡索一錢半全蠍一錢附子一錢巴豆霜四分厚朴薑製七錢獨活一錢丁香五分肉桂三分上除巴豆霜茯苓另為末旋入外余藥為細末煉蜜丸如梧子大初服二丸一日加一丸二日加二丸漸加至大便微溏再從二丸加服淡鹽湯送下食遠周而復始病減大半勿服秋冬加厚朴半兩通前用一兩二錢如積勢堅大先服前藥不減於一料中加存性牡蠣三錢疝帶勿加如大積大聚消其大半乃止藥過劑則死如積滿腹或半腹先治其所起是何積當先服本臟積藥諸疾自愈是治其本也余積皆然如服藥不覺熱加黃連如服藥人氣短加厚朴如服藥人悶亂減桂潔肝之積伏梁溫白丸加柴胡川芎治之心之積肥氣溫白丸加菖蒲黃連桃仁治之脾之積痞氣溫白丸加吳茱萸乾薑治之肺之積息奔溫白丸加人參紫菀治之腎之積奔豚溫白丸加丁香茯苓遠志治之溫白丸方見前丹賈福六舅子十餘歲左脅有塊能飲食青皮細切醋炒三稜柴胡三分桂枝川芎防風各二錢白朮二錢半木通一錢半海藻一錢甘草半錢上分七帖煎取半盞下保和丸十五粒忌一切無肥氣丸治肝之積氣在脅下如覆杯其脈弦而細青皮炒當歸蒼朮各一兩半蛇含石煅醋盛三分蓬朮三稜鐵孕粉各二兩與三稜蓬朮同入醋煮一伏時上為末醋煮米糊丸綠豆大每服四十丸當歸酒下海治伏梁在心下結聚不散用桃奴三兩為末空心溫酒調下桃奴是桃實著樹不落者正月採樹上干桃子是也出聖惠方本治肺喘久不愈為息賁五靈丸五靈脂二兩半木香半兩馬兜鈴去殼炒一兩葶藶上為細末棗肉為丸如桐子大每服二十丸生薑湯下日三肺之積名曰息奔在右脅下大如杯令人灑淅寒熱喘嗽發肺癰棗膏丸葶藶陳皮桔梗各等分上下二味為末入葶藶研勻煮肥棗肉和丸如桐子大每服五七丸飲下予嘗患停飲久漬肺經食已必嚏喘覺肺系大急服此良驗定喘急肺積葶藶丸苦葶藶一兩一分當歸肉桂白蒺藜鱉甲川烏頭乾薑吳茱萸大杏仁茯苓人參各五錢檳榔一兩上為細末煮棗肉和杵丸如桐子大每服二三十丸薑棗湯下日四服不拘時候師曰奔豚病從小腹起上衝咽喉發作欲死復還止皆從驚恐得之故越人曰驚者神上越也仲景謂奔豚從驚恐得之蓋奔豚病上衝咽喉者隨神上越也奔豚氣上衝胸腹痛往來寒熱奔豚湯主之甘草芎藭當歸各二兩半夏四兩黃芩二兩生薑三兩芍藥二兩乾葛一兩三錢甘李根白皮一升焙乾上九味以水二斗煮取五升溫服一升日三夜一服茯苓桂枝甘草大棗湯治臍下悸欲作奔豚桂枝加桂湯治奔豚氣從小腹上至心以上二方並見傷寒無散聚湯治有塊痛無常處展轉動移半夏檳榔當歸各一兩陳皮杏仁去皮尖桂心各二兩茯苓甘草炙附子炮去皮臍川芎枳殼麩炒吳茱萸湯洗厚朴薑製各一兩上銼散每四錢水一盞半煎七分去渣食前服運氣積塊皆從濕土經云土太過曰敦阜敦阜之化其動濡積並蓄是也丹琥珀膏貼塊方見癰疽門下又貼塊三聖膏用石灰十兩細篩過炒紅急用好醋熬成膏入大黃末一兩官桂末半兩攪勻以瓦器封貯紙攤貼患處火烘熱貼大黃鬚錦紋者世又貼塊白鴿糞二兩白芷三兩硫黃白蘞木鱉子肉各一兩上為末用面水調和敷患處丹貼積聚塊大黃朴硝各一兩各為末大蒜搗膏和勻貼之外集驗熨症吳茱萸三升碎之以酒和煮熱布裹熨症上冷更炒更番用之症移走逐熨之候消乃止靈黃帝曰人之善病腸中積聚者何以候之少俞答曰皮膚薄而不澤肉不堅而淖澤如此腸胃惡惡則邪氣留止積聚乃傷脾胃之間寒溫不次邪氣稍至蓄積留止大聚乃起五變篇脈胃中有癖食冷物者痛不能食食熱則能推而外之內者不外心腹積也全文見諸脈診病雜文難人病有沉滯久積聚可切脈而知之耶然診病在右脅有積氣得肺脈結脈結甚則積甚結微則氣微診不得肺脈而右脅有積氣者何也然肺脈雖不見右手脈當沉伏其外痼疾同法耶將異也然結者脈來去時一止無常數名曰結也伏者脈行筋下也浮者脈在肉上行也左右表裡法皆如此假令脈結伏者內無積聚脈浮結者外無痼疾有積聚脈不結伏有痼疾脈不浮結為脈不應病病不應脈是為死病也十八難仲諸積大法脈來細而附骨者乃積也寸口積在胸中微出寸口積在喉中關上積在臍傍上關上積在心下微下關積在少腹尺中積在氣衝脈出在左積在左脈出在右積在右脈兩出積在中央各以其部處之素太陰澀則病積心腹時滿厥陰澀則病少腹積氣少陰澀則病積溲血陽明澀則病積時善驚太陽澀則病積時善巔疾少陽澀則病積時筋急目痛四時刺逆從論寸口脈沉而橫曰脅下有積腹中有橫積痛平人氣象論即動脈之狀厥厥如豆不升降也脈左手脈橫症在左右手脈橫症在右脈頭大者在上頭小者在下脈遲而滑中寒有癥結偏得洪實而滑為積弦緊亦為積為寒痹為疝痛內有積不見脈難治見一脈相應為易治諸不相應為不治脈弦腹中急痛腰背痛相引腹中有寒疝瘕脈弦緊而微細者症也夫寒痹癥瘕積聚之脈皆弦緊苦在心下即寸弦緊在胃脘即關弦緊在臍下即尺弦緊脈弦小者寒痹心肺有積痹其脈皆喘數經云赤脈之至也喘而堅診曰有積氣在中名曰心痹白脈之至也喘而浮上虛下實有積氣在胸中喘而虛名曰肺痹是也肝有積其脈弦長面青經云青脈之至也長而左右彈有積氣在心下支胠名曰肝痹是也脾腎有積痹其脈皆大經云黃脈之至也大而虛有積氣在腹中黑脈之至也上堅而大有積氣在小腹與陰名曰腎痹王注云上謂寸口是也全文見上臟腑條脈診人心腹積聚其脈堅強急者生虛弱者死脈弦而伏者腹中有症不可轉也必死不治靈黃帝問曰夫百病之始生也皆生於風雨寒暑清濕喜怒喜怒不節則傷臟風雨則傷上清濕則傷下三部之氣所傷異類願聞其會岐伯曰三部之氣各不同或起於陰或起於陽請言其方喜怒不節則傷臟臟傷則病起於陰也清濕襲虛則病起於下風雨襲虛則病起於上是謂三部至於其淫泆不可勝數百病始生篇下同是故虛邪之中人也始於皮膚皮膚緩則腠理開開則邪從毛髮入入則抵深深則毛髮立毛髮立則淅然故皮膚痛留而不去則傳舍於絡脈在絡之時痛於肌肉其痛之時息大經乃代留而不去傳舍於經在經之時灑淅善驚留而不去傳舍於輸在輸之時六經不通四肢則肢節痛腰脊乃強留而不去傳舍於伏沖之脈在伏沖之時體重身痛留而不去傳舍於腸胃在腸胃之時賁響腹脹多寒則腸鳴飧泄食不化多熱則溏出麋留而不去傳舍於腸胃之外募原之間以上數端皆邪氣襲虛留而不解去以次相傳未曾留著無有定所若留著而有定所則不能傳矣所謂留著者當如下文法云留著於脈稽留而不去息而成積或著孫脈或著絡脈或著經脈或著輸脈或著於伏沖之脈或著於膂筋或著於腸胃之募原上連於緩筋邪氣淫泆不可勝論其著孫絡之脈而成積者其積往來上下臂手孫絡之居也浮而緩不能拘積而止之故往來移行腸胃之間水湊滲注灌濯濯有音有寒則䐜䐜滿雷引故時切痛其著於陽明之經則挾臍而居飽食則益大飢則益小其著於緩筋也似陽明之積飽食則痛飢則安其著於腸胃之募原也痛而外連於緩筋飽食則安飢則痛其著於伏沖之脈者揣之應手而動發手則熱氣下於兩股如湯沃之狀其著於膂筋在腸後者飢則積見飽則積不見按之不得其著於輸之脈者閉塞不通津液不下孔竅乾壅此邪氣之在外入內從上下也此謂風雨襲陰之虛病起於上而積生也黃帝曰積之始生至其已成奈何岐伯曰積之始生得寒乃生厥乃成積也黃帝曰其成積奈何岐伯曰厥氣生足悗足悗生脛寒脛寒則血脈凝澀血脈凝澀則寒氣上入於腸胃入於腸胃則䐜脹䐜脹則腸外之汁沫迫聚不得散日以成積卒然多食飲則腸滿起居不節用力過度則絡脈傷陽絡傷則血外溢血外溢則衄血陰絡傷則血內溢血內溢則後血腸胃之絡傷則血溢於腸外腸外有寒汁沫與血相搏則併合凝聚不得散而積成矣卒然外中於寒若內傷於憂怒則氣上逆氣上逆則六輸不通溫氣不行凝血蘊里而不散津液澀滲著而不去而積皆成矣此謂清濕襲陰之虛病起於下而成積也黃帝曰其生於陰者奈何岐伯曰憂思傷心重寒傷肺忿怒傷肝醉以入房汗出當風傷脾用力過度若入房汗出浴則傷腎此謂喜怒傷臟病起於陰也風雨襲陰之虛則病起於上而生積清濕襲陰之虛則病起於下而成積此內外三部皆受病其積方成矣此內外三部之所生病者也黃帝曰善治之奈何岐伯對曰察其所痛以知其應有餘不足當補則補當瀉則瀉毋逆天時是謂至治手少陰筋病內急心承伏梁下為肘綱治在燔針劫刺以知為數以痛為輸其成伏梁唾血膿者死不治手太陰筋病甚成息奔脅急吐血手心主筋病胸痛息奔皆治在燔針劫刺以知為數以痛為輸經文並見經筋桑癥瘕積塊先於塊上針之甚者又於塊首一針塊尾一針立應針訖灸之又三里灸之玉氣塊照海內關通谷又積塊章門中脘灸皆三報之氣海天樞上脘通谷選用之甲傷憂煩思氣積中脘主之腹中積上下行懸樞主之大腸轉氣按之如覆杯熱引胃痛脾氣寒四肢煩不嗜食脾俞主之腹中積聚時切痛商一作盲曲主之胞中有大疝瘕積與陰陽相引而痛苦湧泄上下出補尺澤太谿手陽明寸口皆補之摘伏梁氣狀如覆杯上脘三里甲息奔時唾血巨缺主之息奔脅下氣上衝胸中有熱期門主之撮奔豚氣水道二寸灸五十壯瀉之桑奔豚搶心不得息並疝玉泉三寸即中極穴章門五十壯又法奔豚氣攻心脅痛滿淹淹欲絕急先用湯洗手足數數易之卻取下穴氣海期門關元各五七壯玉疝氣衝心欲死關門在玉莖旁二寸針入二寸半灸二七壯甲賁豚腹腫章門主之奔豚上下期門主之少腹積聚勞宮主之奔豚卵上入痛引莖歸來主之賁豚上腹䐜堅痛引陰中不得小便兩丸騫陰交主之賁豚氣腹䐜痛舌強不能言莖腫先引腰後引小腹腰臗少腹堅痛下引陰中不得小便兩丸騫石門主之賁豚寒氣入小腹時欲嘔傷中溺血小便數背臍痛引陰腹中窘急欲湊後泄不止關元主之賁豚上搶心甚則不得息忽忽少氣屍厥心煩痛飽不能食善寒中腹脹引臍而痛小腹與脊相控暴痛時窘之後中極主之婦人血積丹婦人有塊多是血塊當歸丸治婦人月經不調血積證當歸赤芍川芎熟地廣朮京三稜各半錢神麯百草霜各二錢半上為細末酒糊為丸桐子大溫水下本牛膝根淨洗切焙乾搗下酒煎溫服治婦人血塊立效上輕劑杜尚書媳婦馬氏年三十二腹中血塊作疼經五六年形已骨立眾皆曰不可為奈其未死何家甚貧而大小愍之一日召杜至告杜曰但以濟物為懷則可業已請召明公非所言也遂以少物帛贈杜杜不受曰但服某藥必獲安無以是為疑遂示方用沒藥牛膝乾漆當歸各半兩硇砂木香水蛭炒紅娘子炒紅花牡丹皮硃砂各一分海馬一個斑蝥去翅足炒十四個為末酒醋各半升熬為膏每日天明用一皂子大酒醋化下一月病退六十日漸安果如其言上重劑垣加減四物湯治婦人血積當歸川芎芍藥熟地廣朮桂去皮京三稜乾漆炒煙盡各等分上為粗末每服二錢水二盞煎法如常食前大黑神丸神麯茴香各四兩木香川椒炒香出汗丁香各半兩檳榔四個乾漆六兩半生半熟用薑湯煮半日令香上除椒漆外五物皆半生半炒為細末用前生熟漆和丸如彈子大又用茴香十二兩鋪陰地陰乾候外干並茴香收器中至干去茴香用治腎氣膀胱痃癖及疝墜五隔血崩產後諸血漏下赤白並一丸分四服死胎一丸皆綿灰酒下若難產炒葵子四十九粒杵碎酒煎下諸疾不過三服痃氣十服膈氣症癖五服血瘕三丸一婦有塊如杯每發痛不可忍諸藥莫愈投此丸盡三服杯氣盡消終身不復作矣云沒藥散治一切血氣臍腹撮痛及產後惡露不行兒枕痛血竭沒藥並細研桂心當歸蒲黃紅花木香玄胡索乾漆炒赤芍各等分上為極細末每服二錢熱酒調下食前若血塊衝心痛甚危者以大順散三錢酒調服立止牡丹散治婦人久虛羸瘦血塊走疰心腹疼痛牡丹皮桂心當歸玄胡索各一兩莪朮牛膝赤芍各三兩京三稜一兩半上為粗末每服三錢水酒各半盞羅木香硇砂丸治婦人痃癖積聚血塊刺痛脾胃虛寒宿食不消久不瘥者丁香硇砂研木香官桂附子炮乾漆炒煙盡細墨大黃炒銼乳香廣朮青皮京三稜巴豆霜減半沒藥研豬牙皂角乾薑炮各等分上除硇砂乳香沒藥外同為細末以好醋一升化開硇砂去渣腳入銀器中熳火熬次下巴豆霜大黃末熬成膏將前藥末與膏為丸如麻子大每服三五十丸食後溫水送下加至大便利為度治血積挾熱之證於產後血塊求之大桃仁煎治婦人血瘕血積經候不通出千金方桃仁去皮尖炒黃大黃虻蟲朴硝上四味末之以醇醋二升半銀石器中熳火煎取一升五合下桃仁大黃虻蟲等不住手攪千下次下朴硝更不住手攪良久出之丸如桐子大前一日不用吃晚飯五更初用溫酒吞下五丸日午取下如黑豆汁雞肝蝦蟆衣未下再作見鮮血即止即以調氣血藥補之腸覃生於腸外月事時下石瘕生於胞中月事不以時下二病皆似蠱脹並見脹門脈診婦人疝癖積聚脈弦急者生虛弱小者死甲婦人子臟中有惡血內逆滿痛石關主之胎前產後積素黃帝問曰婦人重身毒之何如岐伯曰有故無殞亦無殞也帝曰願聞其故何謂也岐伯曰大積大聚其可犯也衰其太半而止過者死六元正紀大論丹血塊如盤有孕難服峻劑此方主之香附醋煮四兩桃仁去皮尖一兩海粉醋煮二兩白朮一兩麵糊丸服南山婦人年三十八於九月二十三日月經行比前過後十日得草藥以敗血海為下胎之謀有數滴血下因此腹痛在小腹下有塊如碗大不可按湯熨則痛稍定大小便抽痛小便澀大便略下少赤積垢食不進口略渴發熱此胃氣為草藥所敗加以受傷之血妄行而不得泄所以為病砂仁三分甘草炙三分滑石一錢半川芎黃芩各三分牛膝二錢桃仁七個水酒煎服保芍藥湯治產後諸積不可攻宜養陰去熱其病自安芍藥一斤黃芩茯苓各六兩上散每半兩水煎日三服溫丹產後消血塊滑石三錢沒藥二錢血竭二錢上為細末醋糊丸如惡露不下以五靈脂為細末麵糊丸白朮湯陳皮湯送下又消血塊香附童便浸桃仁去皮留尖為末醋糊丸息積素帝曰病脅下滿氣逆二三歲不已是為何病岐伯曰病名曰息積此不妨於食不可灸刺積為導引服藥藥不能獨治也奇病論王注云氣逆息難故名息積也用息奔法治之亦可無磨積丸胡椒一百五十粒木香二錢半全蠍十枚去毒上為末粟米丸綠豆大每十五丸陳皮湯下化氣湯治息積砂仁桂心木香各二錢半甘草炙茴香炒丁香皮青皮炒陳皮乾薑蓬朮炮各半兩胡椒沉香各一錢上為末每服二錢姜蘇鹽湯調下婦人醋湯服陳無擇云導引法隨意行之皆可愚謂或按摩滿處或手足相屈伸或八段錦或六字氣之類以氣通為效面靈黃帝曰首面與身形也屬骨連筋同血合於氣耳天寒則裂地凌冰其卒寒或手足懈惰然而其面不裂何也岐伯答曰十二經脈三百六十五絡其血氣皆上於面而走空竅其精陽氣上走於目而為睛其彆氣走於耳而為聽其宗氣上出於鼻而為臭其濁氣出於胃走唇舌而為味其氣之津液皆上熏於面而皮又厚其肉堅故天熱甚寒不能勝之也邪氣臟腑病形篇面腫頰腮痛丹朱奶兩腮熱腫膈壅之病也乾葛桔梗一錢半升麻一錢蘇葉一錢半甘草炙七分薄荷一錢姜一片水煎服垣咽痛頷腫脈洪大面赤者羌活勝濕湯加黃芩桔梗甘草各半錢治之如耳鳴目黃頰頷腫頸肩臑肘臂外後廉痛面赤脈洪大者以羌活防風甘草藁本通其經血加黃連黃芩消其腫以人參黃耆益其元氣而瀉其火邪丹兩腮腫細辛草烏等分為末入蚌粉以豬脂調敷腫處口含白梅置腮邊良久腫退出涎患消矣消時腫必先向下世治痄腮竹葉車前草柏子仁杵碎熱敷患處腮腫用赤小豆末敷之立效山痄腮雞子清調赤小豆末及喉下諸般腫痛用蝸牛飛面研勻貼腫處素面腫曰風平人氣象論千主卒中風頭面腫杵杏仁如膏敷之針灸面頰腫痛有三法其一取手陽明經云顑痛刺足陽明曲周動脈見血立已不已按人迎於經立已又云厥胸滿面腫唇漯漯然暴言難甚則不能言取足陽明又云厥頭痛面若腫起而煩心取之足陽明太陰為煩心也又云顑痛刺手陽明與顑之盛脈出血是也其二取手太陽經云手太陽之脈是動則頷腫不可以顧所生病者目黃頰痛視盛虛熱寒陷下取之也其三取手足少陽經云三焦手少陽之脈所生病者頰痛又云膽足少陽之脈所生病者頷腫視盛虛熱寒陷下取之也又云肝氣逆則頭痛耳聾頰痛取血者蓋取足少陽之血也東面赤頰熱惡風寒頷痛攢竹玉枕灸三壯妙巨窌灸五壯集頷腫生瘡名枯曹風合谷列缺地倉頰車不應再取下穴人中承漿玉液金津三里甲面腫目癰腫刺陷谷出血立止䪼腫唇癰顴窌主之頰腫痛天窗主之頰腫口急頰車痛不可以嚼頰車主之面熱面寒丹面熱火氣因鬱熱面寒因胃虛靈面熱者足陽明病邪氣臟腑病形篇垣飲食不節則胃病胃病則氣短精神少而生大熱有時而火上行獨燎其面針經云面熱者足陽明病羅面熱楊郎中之內五十一歲身體肥盛己酉春患頭目昏悶面赤熱多服清上藥不效請予治之診其脈洪大而有力內經云面熱者足陽明病脈經云陽明經氣盛有餘則身以前皆熱況其人素膏粱積熱於胃陽明經多血多氣木實則風熱上行諸陽皆會於頭目故面熱之病生矣先以調胃承氣湯七錢加黃連三錢犀角一錢疏下三兩行徹其本熱次以升麻加黃連湯去經絡中風熱上行如此則標本之邪俱退矣升麻加黃連湯升麻葛根各一錢白芷七分甘草炙五分白芍五分酒黃連四分生犀末三分川芎三分荊芥穗三分薄荷三分上銼如麻豆大用水半盞先浸川芎荊芥薄荷外都作一服水二盞煎至一盞入先浸三味同煎至七分去渣食後溫服數服愈忌酒濕面五辛之物咳逆停息不得臥面熱如醉此為胃熱上衝熏其面茯苓桂枝五味甘草湯加大黃以利之前文方見喘不得臥羅面寒真定維摩院尼長老六十一歲身體瘦弱己酉十月間病頭面不耐寒氣弱不敢當風行諸治不效予診之其脈皆弦細而微且其人年高素食茶果而已陽明之經本虛脈經云氣不足則身以前皆寒慄又加看誦損氣由此胃氣虛經絡之氣亦虛不能上榮頭面故惡風寒先以附子理中丸溫其中氣次以升麻湯加附子主之升麻葛根白芷黃耆各七分甘草炙五分黑附子七分炮人參草豆蔻各五分益智仁三分上銼如麻豆大都作一服水三盞連須白蔥頭二莖同煎一盞去渣溫服食前數服良愈升麻湯辨或曰升麻加黃連湯治面熱升麻加附子湯治面寒有何依據答曰出自仲景云岐子注傷寒論中辨葛根湯云尺寸脈俱長者陽明受病也當二三日發以其脈夾鼻絡於目故身熱目疼鼻乾不得臥此陽明經受病也始於鼻交頞中從頭至足行身之前為表之裡陽明經標熱本實從標脈浮而長從本脈沉而實陽明為病蒸蒸而熱不惡寒身熱為標病陽明本實者胃中燥鼻乾目疼為本病陽明為肌肉之本禁不可發汗在本者不禁下發之則變黃症太陽主表榮衛是也榮衛之下肌肉屬陽明二陽並病葛根湯主之衛者桂枝榮者麻黃榮衛之中桂枝麻黃各半湯主之榮衛之下肌肉之分者葛根湯主之又名解肌湯故陽明為肌肉之本非專於發汗止汗之治桂枝麻黃兩方互併為一方加葛根者便作葛根湯故榮衛肌肉之次也桂枝芍藥生薑甘草大棗止汗有麻黃桂枝甘草發汗葛根味薄獨加一味者非發汗止汗也從葛根以解肌故名葛根湯錢仲陽制升麻湯治傷寒瘟疫風熱壯熱頭痛肢體痛瘡疹已發未發用葛根為君升麻為佐甘草芍藥安其中氣朱奉議作活人書將升麻列作陽明經解藥予診楊氏婦陽明經標本俱實先攻其里後瀉經絡中風熱故用升麻湯加黃連以寒治熱也尼長老陽明經標本俱虛先實其里次行經絡故用升麻湯加附子以熱治寒也仲景乃群方之祖信哉面青面塵難肝外證面青善潔善怒十六難運氣面塵有二一曰燥金制肝經云陽明司天燥淫所勝民病嗌乾面塵又云陽明在泉燥淫所勝病嗌乾面塵又云金鬱之發嗌乾面塵宜治以濕劑是也二曰火經云少陽之復厥氣上行面如浮塵目乃瞤瘈治以寒劑是也針灸面塵皆取肝膽二經經云肝足厥陰之脈是動病甚則嗌乾面塵脫色又云膽足少陽之脈是動病甚則面微有塵皆視盛虛熱寒陷下取之也面赤難心外證面赤口乾善笑十六難垣面赤為邪氣怫鬱在經宜表不宜下仲景云下利脈沉而遲其人面赤身有微熱下利清穀者以鬱冒汗出而解此面赤亦表而解也運氣面赤皆屬寒經云太陽司天寒淫所勝民病面赤目黃治以熱劑是也針灸面赤皆取心主經云心主手厥陰之脈是動則病面赤目黃視盛虛熱寒陷下取之也面黃治法見黃疸門難脾外證面黃善噫善思善味十六難素陽明經終者口目動作善驚妄言色黃診要經終篇面白難肺外證面白善嚏悲愁不樂欲哭十六難血脫者色白夭然不澤其脈空虛全文見治虛實法垣巴戟丸治肺病面白不悅則為脫氣脫血脫津脫液脫精脫神方見夢遺脈緊者寒也或面白善嚏或面色惡皆寒也以羌活防風甘草藁本四味瀉足太陽少加附子以通其脈面色惡悲恐者更加桂附太陽終者戴眼反折瘛瘲其色白絕汗出少陽終者耳聾百節皆縱目睘絕系其色青白以上全文見診生死法面黑若身黃面黑於黑疸求之難腎外證面黑善恐欠十六難羅陰出乘陽一婦人年幾三十憂思不已飲食失節脾胃有傷面色黧黑不澤環唇尤甚心懸如飢狀又不欲食氣短而促大抵心肺在上行榮衛而光澤於外宜顯而藏腎肝在下養筋骨而強於內當隱而不見脾胃在中主傳化精微以灌四旁沖和而不息其氣一傷則四臟失所憂思不已氣結而不行飲食失節氣耗而不足使陰氣上溢於陽中故黑色見於面又經云脾氣通於口其華在唇今水反來侮土故黑色見於唇此陰陽相反病之逆也上古天真論云陽明脈衰於上面始焦故知陽明之氣不足非助陽明生髮之劑無以復其色故以沖和順氣湯主之升麻一錢葛根一錢半甘草四分芍藥三分白芷一錢黃耆八分防風一錢人參七分蒼朮三分內經曰上氣不足推而揚之以升麻苦平葛根甘溫自地昇天通行陽明之氣為君人之氣以天地之風名之氣留而不行者以辛散之防風辛溫白芷甘辛溫以散滯氣為臣蒼朮苦辛蠲除陽明經之寒白芍藥之溫酸安太陽經之怯弱十劑云補可去弱人參羊肉之屬人參黃耆甘草甘溫補益正氣為佐至真要大論云辛甘發散為陽生薑辛熱大棗甘溫和榮衛開腠理致津液以復其陽氣故以為使上件㕮咀都作一服水二盞姜三片棗二枚同煎至一盞去渣溫服早飯後午飯前取陽升之時使人之陽氣易達故也數服而愈孫樊樓有店家劉三一日滿面皆黑色有相者斷云不過月餘死既過月且安孫入店與客飲酒遂拜孫述說其病狀孫特與診之曰非病也乃為臭氣所熏穢氣蓄於面部不散故有此色問劉曰汝一月前聞甚一陣非常臭氣不能避耶劉曰一日登溷其廁臭氣不可聞隱忍良久下廁明日遂有此疾孫曰去至臭無過至香我家有南人將至售香可用沉檀二香各一兩碎掰焚於爐中安帳內以熏絹被蓋定勿令香氣散可端坐香邊瞑目靜坐候香氣散方可出帳明日引鑑照之劉依其言面色漸變旬日如故腎臭腐屬水脾臭香屬土今夫廁臭者腐臭也故聞之則入腎而面黑沉香者香臭也故熏之則睥土勝腎水而色還也針灸面黑有二法其一取胃經云胃足陽明之脈是動則病洒洒振寒顏黑其二取腎經云足少陰之脈是動則病飢不欲食面如漆柴視盛虛熱寒陷下取之也少陰終者面黑齒長而垢腹脹閉全文見診生死下同太陰終者腹脹閉不得息善噫嘔逆則面赤不逆則面黑皮毛黑頰車病謂頰車開而不合肅平江陳氏因驚懼後常用手指甲掐拄兩頰遂兩頰破損心中懊憹不安脈數而實諸藥不愈用活幼口義牛黃清心涼膈丸數服如失無凡伸欠頰車蹉但開不能合以酒飲之令大醉睡中吹皂角末搐其鼻嚏透即自正狂癲狂謂妄言妄走也癲謂僵仆不省也各自一症今以狂入脾部癲入肝部然經有言狂癲疾者有言狂互引癲者又言癲疾為狂者此則又皆狂癲兼病今病有妄言妄走頃時前後僵仆之類有僵仆後妄見鬼神半日方已之類是以癲狂兼病者也難癲狂之病何以別之然狂之始發少臥而不飢自高賢也自辨智也自貴倨也妄笑好歌樂妄行不休是也癲疾始發意不樂直視僵仆其脈三部陰陽俱盛是也重陽者狂重陰者癲二十難王注云狂病之後不欲眠臥不肯飲食自言賢智尊貴歌笑行走不休今人以為癲疾謬矣素二陰二陽皆交至病在腎罵詈妄行癲疾為狂陰陽類論王注云二陰腎水二陽胃土土刑水病在腎胃為狂靈邪入於陽則為狂轉則為癲疾九針篇素癲疾厥狂久逆之所生也通評虛實論太陽所謂狂癲疾者陽盡在上而陰氣從下下虛上實故狂癲疾也脈解篇針灸狂癲有二法其一取胃經云足陽明之別名曰豐隆去踝八寸別走太陰其病實則狂癲取之所別是也其二取膀胱經云膀胱足太陽之脈所生病者狂癲視盛虛熱寒陷下取之也甲狂癲疾吐舌太乙及滑肉期門主之狂僕溫溜主之狂癲疾陽谷及築賓通谷主之狂互引顛疾數發後谿主之狂癲陰谷主之狂欲獨閉戶牖而處陰不勝其陽則脈流薄疾並乃狂全文見治虛實法血並於陽氣並於陰故為驚狂全文見刺虛法素帝曰有病怒狂者此病安生岐伯曰生於陽也帝曰陽何以使人狂岐伯曰陽氣者因暴折而難決故善怒也病名曰陽厥帝曰何以知之岐伯曰陽明者常動巨陽少陽不動不動而動大疾此其候也帝曰治之奈何岐伯曰奪其食即已夫食入於陰長氣於陽故奪其食即已使之服以生鐵落為飲夫生鐵落者下氣疾也病能篇無虢礬丹治狂效方見癲癇門鎮心丹治驚悸自汗心煩短氣喜怒悲惡悉不自知忘魂失魄狀若神靈所憑及男子遺泄女子帶下辰砂研白礬煅汁盡各等分上為末水丸如雞頭大每服一丸煎人參湯下食後服世浙江一婦人癲狂不止醫以瓜蒂半兩為末每一錢重井花水調滿一盞投之隨得大吐吐後熟睡勿令驚動自此無恙竹來蘇膏治遠年近日風癇心病風狂中風涎沫潮閉牙關不開及破傷風並皆治之皂角一兩肥大無蟲蛀者去皮弦子上將皂角切碎用漿水一大碗春秋浸三四日冬七日夏一二日揉開取淨浸透皂角汁入銀器或砂鍋內以文武火熬用新柳條槐枝攪熬似膏藥取出攤於夾紙上陰乾收貯如遇病人取手掌大一片用溫漿化在盞內用竹管兒盛藥水將病人扶坐定頭微抬起將藥吹入左右鼻孔內良久扶起涎出為驗欲要涎止將溫鹽湯令病人服一二口便止忌雞魚生硬濕面等物子和一男子落馬發狂起則目瞪狂言不識親疏棄衣而走罵言湧出氣力加倍三五人不能執縛燒符作醮問鬼跳巫殊不知顧服丹砂牛黃犀珠腦麝資財散去室中蕭然不遠二百里而求戴人一往戴人以車軸埋之地中約高二丈許上安中等車輪其𮝚上鑿一穴如作盆之狀縛病人在其上使之伏臥以軟裀襯之又令一人於下坐機一枚以棒攪之轉千百遭病人吐出青黃涎沫一二斗許繞車輪數匝病人曰我不能堪可解我下從其言而解之索涼水與之冰水飲數升狂乃罷矣素帝曰陽明病甚則棄衣而走登高而歌或至不食數日逾垣上屋所上之處皆非其素所能也病反能者何也岐伯曰四肢者諸陽之本也陽盛則四肢實實則能登高也帝曰其棄衣而走者何也岐伯曰熱甚於身故棄衣欲走也帝曰其妄言罵詈不避親疏而歌者何也岐伯曰陽盛則使人妄言罵詈不避親疏而不欲食不欲食故妄走也陽明脈解篇陽明所謂病至則欲乘高而歌棄衣而走者陰陽復爭外並於陽故使之棄衣而走也海許氏病陽厥狂怒罵詈親疏或哭或歌六脈舉按無力身表如水石發即叫呼聲高潔古云奪食則已因不與之食予用大承氣湯下之得臟腑渣穢數升狂稍寧數日復發復下如此五七次行大便數斗疾瘥身溫脈生良愈此易老奪食之法也保當歸承氣湯當歸大黃各一兩甘草半兩芒硝七錢上銼如麻豆大每二兩水一大碗姜五片棗十枚煎至一半去渣熱溫服若陽狂奔走罵詈不知親疏此陽有餘陰不足大黃芒硝去胃中實熱當歸補血益陰甘草緩中加薑棗者胃屬土此引入胃中也經所謂微者逆之甚者從之此之謂也以大利為度微緩以瓜蒂散入防風末藜蘆末吐之其病立安後用調心散洗心散涼膈散解毒湯等調之子和一狂人陰不勝其陽則脈流薄疾陽並乃狂難經曰陽極則狂陰極則癲陽為腑陰為臟非陽熱而陰寒也熱並於陽則狂狂則生寒並於陰則癲癲則死內經曰足陽明實則狂故登高而歌棄衣而走無所不為是熱之極也以調胃承氣大作湯下數十行三五日復上湧一二升三五日又復下之凡五六十日下百餘行吐亦七八度如吐時暖室置火以助其汗數汗方平一叟年六十值徭役煩擾而暴發狂口鼻覺如蟲行兩手爬搔數年不已戴人診其兩手脈皆洪大如絙斷之曰肝主謀膽主決徭役迫遽財不能支則肝屢謀而膽屢不能決屈無所伸怒無所泄心火磅礴乘陽明金然胃本屬土而肝屬木膽屬相火火隨木氣而入胃故暴發狂乃命置燠室中湧而汗出如此三坎內經曰木鬱則達之火鬱則發之正謂此也又以調胃承氣湯半斤用水五升煎半沸分作三服大下二十行血水與瘀血相雜而下數升來日乃康以通聖散調其後孫相國寺僧充忽患癲疾經半年遍服名醫藥皆不效僧俗兄潘氏家富召孫療之孫曰今夜睡著明後日便愈也潘曰且告投藥報恩不忘孫曰有咸物但與師吃待渴卻來道至夜僧果渴孫至遂求溫酒一角調藥一服與之有頃再索酒與之半角其僧遂睡兩晝夜乃覺人事如故潘謝孫問其治法曰眾人能安神矣而不能使神昏得睡此乃靈苑方中硃砂酸棗仁乳香散也人不能用耳辰砂散治風痰諸癇狂言妄走精神恍惚思慮迷亂乍歌乍哭飲食失常疾發仆地吐沫戴目魂魄不守醫藥無驗辰砂一兩須光明有牆壁者酸棗仁半兩微炒乳香半兩光瑩者上量所患人飲酒幾何先令恣飲沉醉但勿令吐至靜室中以前藥都作一服溫酒調下作一盞調之令頓飲如飲酒素少人但以隨量取醉服藥訖便安置床枕令臥病淺者半日至一日病深者三兩日令家人潛伺之鼻息勻調但勿喚覺亦不可驚觸使覺待其自醒即神魂定矣萬一驚悟不可復治正肅吳公少時心病服此一劑五日方寤遂瘥一醉膏治心恙無灰酒二碗香油四兩和勻用楊柳枝二十條逐條攪一二百下候香油與酒相入成膏煎至八分灌之熟睡則醒或吐下即安矣狂之為病少臥少臥則衛獨行陽不行陰故陽盛陰虛令昏其神得睡則衛得入於陰而陰得衛填不虛陽無衛助不盛故陰陽均平而愈矣本寧志膏人參酸棗仁各一兩辰砂五錢乳香一分上為細末煉蜜和丸如彈子大每服一丸薄荷湯送下予族弟緣兵火失心制此方與之服二十粒愈親舊多傳去服之皆驗海狂邪癲癇不欲眠臥自賢自智妄行不休此方能安五臟下心氣用白雄雞一隻煮熟五味調和作羹粥食之經云悲哀動中則傷魂魂傷則狂妄不精不精則不正此悲哀傷魂而狂當用溫藥補魂之陽仲景方以地黃湯本事驚氣丸之類即是也經云喜樂無極則傷魄魄傷則狂狂者意不存人此喜樂傷魄而狂當用涼藥補魄之陰辰砂鬱金白礬之類是也世治失心鬱金十兩須四川蟬肚者是真明礬三兩上為細末薄糊為丸如桐子大每服五六十丸湯水任下昔有婦人癲狂可畏數年不愈後遇至人授此方初服覺心胸中有物脫去神氣灑然再服頓蘇至人云此病用憂驚得之痰涎包絡心竅此藥能去郁痰仲防己地黃湯治病如狂狀妄形獨語不休無寒熱其脈浮防己一錢桂枝防風各三錢甘草二錢上四味以酒一杯漬一宿絞取汁生地黃二斤㕮咀蒸之如斗米飯久以銅器盛其汁更絞地黃汁和分再服本治驚痓積氣痓風邪發則於關緊急涎潮昏塞醒則精神若癡驚氣丸附子木香白殭蠶白花蛇橘紅天麻麻黃各半兩乾葛二分紫蘇葉一兩硃砂一錢留少許為衣天南星洗切薑汁浸一夕半兩上為末加腦麝少許同研極勻煉蜜杵丸如龍眼大每服一丸金銀薄荷湯化下溫酒亦得此予家秘方也戊申年軍中一人犯法褫衣將受刑而得釋精神頓失如癡予與一丸服訖而寐及覺病已失矣提轄張載揚其妻因避寇失心已數年予授此方不終劑而愈又黃彥奇妻狂厥者逾十年諸醫不驗予授此方去附子加鐵粉亦不終劑而愈鐵粉非但化痰鎮心至如摧抑肝邪特異若多恚怒肝邪大盛鐵粉能制伏之素問云陽厥狂怒治以鐵落飲金制木之意也此亦前人未嘗論及無治中風或歌或哭或笑語無所不及小續命湯用麻黃三兩人參桂枝白朮各三兩無防風附子生薑有當歸一兩世治巔狂發作披頭大叫不避水火苦參為末蜜丸梧子大每服十丸薄荷湯化下妙保牛黃膏治熱入血室發狂不認人牛黃二錢半硃砂鬱金牡丹皮各三錢甘草腦子各一錢上為末煉蜜丸如棗子大新汲水化下肝移寒於心狂膈中全文見診病傳變運氣狂皆屬火經云諸躁狂越皆屬於火又云火太過曰赫曦赫曦之紀其病笑謔狂妄又云歲火太過上臨少陰少陽病譫妄狂越治以諸寒是也子和項開合之妻病飢不欲食常好叫呼怒罵欲殺左右惡言不輟眾醫皆處藥幾半載尚爾其夫命戴人視之戴人曰此難以藥治乃使二娼各塗丹粉作伶人狀其婦人大笑次日又作角觝又大笑其旁常以兩個能食之婦誇其食美病婦亦索其食而為一嘗之不數日怒減食增不藥而瘥後得一子夫醫貴有才無才何足應變無窮靈狂始生先自悲也喜忘苦怒善恐者得之憂飢治之取手太陰陽明血變而止及取足太陰陽明狂始發少臥不飢自高賢也自辨智也自尊貴也善罵詈日夜不休治之取手陽明太陽太陰舌下少陰視之盛者皆取之不盛釋之也狂言驚善笑好歌樂妄行不休者得之大恐治之取手陽明太陽太陰狂目妄見耳妄聞善呼者少氣之所生也治之取手太陽太陰陽明足太陰頭兩顑狂者多食善見鬼神善笑而不發於外者得之有所大喜治之取足太陰太陽陽明後取手太陰太陽陽明狂而新發未應如此者先取曲泉左右動脈及盛者見血有頃已不已以法取之灸骨觝二十壯顛狂篇大熱遍身狂而妄見妄聞妄言視足陽明及大絡取之虛者補之血而實者瀉之因其偃臥居其頭前以兩手四指挾按頸動脈久持之卷而切推下至缺盆中而復止如前熱去乃止此所謂推而散之者也刺節真邪篇頸動脈胃挾喉兩旁人迎脈也胃足陽明之脈是動病甚則欲上高而歌棄衣而走故狂皆取陽明也秦承祖灸鬼法狐魅神邪癲狂諸病並小兒驚癇兩手大拇指用軟繩急縛之灸三壯艾炷著四處半在甲半在肉上四處盡燒一處不著其疾不愈神效難量此法累用累效明堂灸狂發怒欲殺人見鬼身柱灸在三椎節下間後谿通玄呆癡神門一穴沿皮向前三分先補後瀉灸之後谿補生瀉成標幽又法大鐘集失志呆癡神門中衝鬼服鳩尾百會摘心悶不已支溝甲狂易魚際及合谷腕骨支正少海崑崙主之狂言笑見鬼取之陽谿及手足陽明太陽狂歌妄言怒恐惡人與火罵詈三里主之狂妄走善欠巨虛上廉主之狂易見鬼神與火解谿主之狂言太淵主之心懸如飢之狀善悲而驚狂面赤目黃間使主之狂疾液門主之又俠谿丘墟光明主之狂互引頭痛耳鳴目痹中渚主之身熱狂走談言見鬼瘛瘲身柱主之狂妄言怒恐惡火甚罵詈巨闕主之欲獨閉戶牖而處素陽明所謂欲獨閉戶牖而處者陰陽相搏也陽盡而陰盛故欲獨閉戶牖而居帝曰陽明惡人者何也岐伯曰陽明厥則喘而惋惋則惡人陽明脈解篇針灸獨閉戶牖而處有二法其一取胃經云胃足陽明之脈是動則病惡人與火獨閉戶牖而處視盛虛熱寒陷下取之也其二取少陰經云少陰之虛獨閉戶牖而處注云取大鐘太谿二穴甲熱病汗不出鼽衄眩時僕而浮腫足脛寒不得臥振寒惡人與木音喉痹齧齒惡風鼻不利多臥善驚厲兌主之四厥手足悶者使人久持之厥熱脛痛腹脹皮痛善伸數欠惡人與木音振寒嗌中引外腎痛熱病汗不出下齒痛惡寒目急喘滿寒慄齧齒口噤懈惰不嗜食內庭主之難病若閉目不欲見人者脈當得肝脈弦急而長而反得肺脈短而澀者死也口口者脾之所主胃大腸脈之所挾經云中央黃色入通於脾開竅於口藏精於脾又云脾主口在藏為脾在竅為口又云脾氣通於口脾和則口能知五味矣此脾之所主於口也又經云胃足陽明之脈挾口下交承漿又云大腸手陽明之脈挾口交人中此胃大腸之脈所挾於口也口苦肝氣熱則膽泄口苦全文見痿內經曰有病口苦名曰膽癉乃肝主謀慮膽主決斷盛汁七合是清淨之府取決於膽膽或不決為之恚怒則氣上逆膽汁上溢故口苦或熱甚而使然也以龍膽瀉肝湯主之柴胡一錢黃芩七分生甘草人參天門冬去心黃連草龍膽山梔麥門冬知母各五分五味子七粒上件㕮咀都作一服水二盞煎至一盞去渣溫服食遠忌辛熱物大效真氣上逆故口苦舌乾全文見水腫素帝曰有病口苦者病名為何何以得之岐伯曰病名曰膽癉夫肝者中之將也取決於膽咽為之使此人者數謀慮不決故膽虛氣上溢而口為之苦治之以膽募俞奇病論膽募穴在腹部期門下五分膽俞穴在背部第十一椎下兩旁相去各二寸半針灸口苦獨取於膽此篇經文是其一法也又經云膽病者善太息口苦嘔汁當取陽陵泉又云膽足少陽之脈是動則病口苦善太息視盛虛熱寒陷下取之也口瘡入疥門口糜膀胱移熱於小腸膈腸不便上為口糜全文見診病傳變垣移熱湯治口糜內經云膀胱移熱於小腸膈腸不便上為口糜好飲酒人多有此疾易老用五苓散導赤散相合服之神效丹治滿口白爛蓽茇一兩厚黃柏一兩六錢為末用米醋煎數沸後調上藥涎出吐之再用湯漱口即愈重者二次羅胡黃連散治口糜胡黃連五分藿香一錢細辛三錢黃連三錢上為末每用半錢乾摻口內漱吐之必效散治口糜白礬大黃等分上為細末臨臥干貼瀝涎盡溫水漱之運氣口糜皆屬熱經云少陰之復火氣內發上為口糜治以苦寒是也口臭喉腥本加減甘露飲治男子婦人小兒胃客熱口臭牙宣赤眼口瘡一切瘡疼已散未散皆可服之丹溪云甘露飲心肺胃藥也熟地生地天門冬去心黃芩枇杷葉去毛山茵陳枳殼金釵石斛甘草各一兩犀角三錢上為末每服二錢水一盞煎至七分去渣食後臨臥溫服小兒一服分作二服更斟酌與之此方得自一品之家其間用犀角一味甚有道理百發百中予族中有一僕牙宣口臭牙齒漸漸頹落予與二服頓愈服之無不愈者本事方前集所未載此方緣得之不易故不敢輕泄服之自有奇效本治口臭香薷一把以水一斗煮取三升稍稍含之丹溪云惟香薷湯能治口臭羅肺熱喉腥治驗梁濟民膏粱而飲因勞心過度肺氣有傷以致氣出腥臭而唾稠黏咽嗌不利口苦幹燥以加減瀉白散主之桑白皮三錢地骨皮一錢半甘草炙錢半知母七分黃芩五分五味子二十一粒麥門冬五分桔梗二錢難經云心主五臭入肺為腥臭此其一也因洪飲大熱之氣所傷從心火刑于肺金以桑白皮地骨皮苦微寒降肺中伏火而補氣為君以黃芩知母苦寒治氣腥臭清利肺氣為臣肺欲收急食酸以收之以五味子酸溫以收肺氣麥門冬苦寒治涕唾稠黏口苦幹燥為佐桔梗辛溫體輕浮治痰逆利咽膈為使也上㕮咀都作一服水二盞煎至一盞去渣溫服食後一日二服忌酒濕面及辛熱之物聖治口臭仍醫齒腫痛細辛煮取濃汁熱飲令吐瘥子和尚家一男子年二十餘歲病口中氣出臭如登廁雖親戚莫肯與對語戴人曰肺金本主腥金為火所乘火主臭應便如是也久則成腐腐者腎也此亢極則反兼水化也病在上宜湧之以茶調散湧而去其七分夜以舟車丸浚川散下五七行比旦而臭斷甲口中腫臭勞宮主之口甘入中消門唇唇酸入口瘡門六腑之華在唇經云脾胃大腸小腸三焦膀胱者倉廩之本榮之居也其華在唇四白是也胃脈肝脈督脈皆環唇經云胃足陽明之脈挾口環唇又云肝足厥陰之脈環唇內經云督脈上頤環唇是也衝脈任脈皆絡唇經云衝脈任脈別而絡唇口是也唇反者死經云唇舌肌者肉之本也唇反者肉先死是也四肢陽主四肢經云四肢者諸陽之本也又云陽受氣於四肢是也陽實則肢腫經云結陽腫四肢是也陽虛則肢滿經云冬氣病在四肢是也脾主四肢經云四肢皆稟氣於胃而不得至經必因於脾乃得稟者是也脾實則四肢不舉經云脾脈太過為病在外則令人四肢不舉者是也脾虛則四肢不用經云脾藏肉形不足則四肢不用又云四肢懈惰此脾精之不行是也治見痿及中風五臟有邪留在支節經云肺心有邪其氣留於兩肘肝有邪其氣留於兩股脾有邪其氣留於兩髀腎有邪其氣留於兩膝是也治法見痛痹運氣四肢不舉皆屬濕經云土太過曰敦阜敦阜之紀其病腹滿四肢不舉是也甲風逆四肢腫復溜主之肉脾主肉經云脾主肉在體為肉在臟為脾又云邪在脾胃則病肌肉痛是也脾病在溪經云北方黑色入通於腎故病在溪溪者肉之小會也素帝曰願聞溪谷之會也岐伯曰肉之大會為谷肉之小會為溪肉分之間溪谷之會以行榮衛以會大氣邪溢氣壅脈熱肉敗榮衛不行必將為膿內消骨髓外破大膕留於節湊必將為敗積寒留舍榮衛不居卷肉縮筋肋肘不得伸內為骨痹外為不仁命曰不足大寒留於溪谷也溪谷三百六十五穴會亦應一歲其小痹淫溢循脈往來微針所及與法相同氣穴論形樂志樂病生於肉治之以針石全文見治法濕傷肉甘傷肉經云濕傷肉風勝濕甘傷肉酸勝甘又云甘走肉肉病無多食甘又云多食酸則肉胝䐢而唇揭是也坐樂傷肉經云久坐傷肉又云形樂志樂病生於肉治之以針石是也身重垣身重者濕也補中益氣湯去桂加五苓散主之潔起臥不能謂之濕身重是也小柴胡湯黃耆芍藥湯仲風濕脈浮身重汗出惡風者防己黃耆湯主之方見傷寒身重潔夏月中風濕身重如山不能轉側宜除風勝濕去熱之藥治之仲腎著之病其人身體重腰中冷如坐水中形如水狀反不渴小便自利飲食如故病屬下焦身勞汗出表裡冷濕久久得之腰以下冷痛腹重如帶五千錢甘姜苓朮湯主之甘草白朮各二兩乾薑茯苓各四兩上四味以水五升煮取三升分溫二服腰中自溫素肝虛腎虛脾虛皆令人體重煩冤示從容論體重屬肝腎虛肝虛則脾寡於畏而體重腎虛則脾勝之而體重也垣參朮湯治脾胃虛弱元氣不能榮於心肺四肢沉重食後昏悶黃耆二錢人參半錢升麻三分甘草炙四分柴胡酒黃柏各三分陳皮五分青皮五分神麯七分蒼朮一錢當歸二分上㕮咀作一服水二盞煎至一盞半去渣帶熱服食前運氣身重有五一曰濕乃濕制腎虛而重經云太陰所至為身重又云太陰之復體重身滿又云歲土太過濕氣流行民病體重煩冤又云土鬱之發民病身重是也二曰濕熱經云少陽司天之政四之氣炎暑間化其病滿身重是也三曰寒濕經云太陰司天之政三之氣感於寒濕民病身重是也四曰風乃木製脾虛而重經云歲木太過風氣流行民病體重煩冤又云歲土不及風乃大行民病體重煩冤又云厥陰在泉風淫所勝病身體皆重是也五曰金乃燥制肝虛而重經云歲金太過燥氣流行民病體重煩冤是也針灸身重有二法其一取脾經云脾病者身重肉痿取其經太陰陽明少陰血者又云脾足太陰之脈是動則病腹脹身體皆重視盛虛熱寒陷下取之也其二取腎經云腎病者身重寢汗出憎風取其經少陰太陽血者是也怠惰嗜臥垣云脈緩怠惰嗜臥四肢不收或大便泄瀉此濕勝從平胃散又云怠惰嗜臥有濕胃虛不能食或沉困或瀉泄加蒼朮自汗加白朮本補虛損治勞倦一切虛極欲垂死者肥人陰虛宜服瘦人不宜服甘草三兩蒼朮一斤米泔浸一宿切用韭白一斤細切同罨過一宿川椒四兩炒草烏半斤水浸一宿切用鹽四兩罨一宿次日炒乾上共為末用好酒糟六斤同搗三五千杵令勻為丸如桐子大每服三十丸空心溫酒鹽湯任下婦人淡醋湯下垣食入則困倦精神昏冒而欲睡者脾虛弱也人參補氣湯治四肢懶倦黃耆一錢半人參七分甘草炙三分生地五分防風七分白芍五分五味二十粒升麻七分肉桂二分熟地六分生甘草一分黃柏七分知母七分上為粗末作一服水二盞煎至一盞濾去渣空心熱服下蠱毒無江南閩中山間人以蛇虺蜈蚣蜒岫蝦蟆等百蟲同器蓄之使其自相食啖勝者為靈以祀之取其毒雜以菜果飲食之類以害人妄意要福以圖富貴人或中之症狀萬端或年歲間人多死又有人家香火奉祀如家先者亦謂之蠱能病人世謂之蠱疰以姓類屬五音謂之五蠱此皆邊鄙邪僻之地多有此事中都則蔑聞也夫中蠱毒者令人心腹絞痛如有物吐出皆如爛肉若不即治食人五臟即死驗令病人唾水沉者即是有人行蠱毒以病人若欲知其姓名者以敗鼓皮燒作末飲服方寸匕須臾自呼蠱家姓名可語之令呼喚將去則愈治之亦有方世驗蠱之法含一大豆其豆脹皮脫者蠱也豆不脹皮不脫者非也人以鵠皮至病人臥所下勿令知覺病甚者走居則非也治療之法必須審而後行試而後可今人偶有積聚脹滿之病類乎蠱者便以為蠱尤為非也凡蠱毒之中有緩有急急者十數日便死緩者待以歲月氣力羸敗食盡五臟而後死死則其毒流注於傍傍人亦成蠱疰矣無凡中毒嚼生豆不腥嚼白礬味甘者皆中毒無疑脈人為百藥所中傷脈浮澀而疾者生微細者死洪大而遲者生千金遲作速無辰砂丸治蠱毒從酒食中著者端午日合辰砂細研雄黃另研水飛赤腳蜈蚣續隨子各一兩麝香一錢上為末糯米飲為丸如雞頭大若覺中毒即以酒下一丸蛇蠍所螫醋磨敷效必效主蠱毒神效以胡荽根絞汁半升酒和服之立下外治蠱毒土瓜根大如拇指長三寸切以酒半升浸一宿一服當吐下崔蛇蠱食飲中得之咽中如有物咽不下吐不出悶悶心熱服馬兜鈴即吐出又服麝香一錢匕即吐蠱毒聖五種蠱毒馬兜鈴根三兩為末分為三帖水一盞煎五分去渣服當吐蟲出未快再服本主蠱毒用大戟桃白皮以火烘乾班蝥去翅足炒三物等分搗篩為散以冷水服半方寸匕其毒即出不出更一服蠱並出此李饒州法大奇效若以酒中得則以酒服以食中得則以飲服之上吐利蠱毒法無凡諸蠱多是假毒藥以投之知時宜煮大豆甘草薺苨汁飲之通除諸毒藥經山豆根不拘多少如中藥蠱毒密遣人和水研以禁聲服少許不止再服一方用酒調下二錢本食中有蠱毒令人腹內堅痛兩目青黃淋露骨立病變無常用鐵精細研搗雞肝和為丸桐子大食前或後酒下五丸蠱下血見血無解毒丸治設食毒中並百物毒救人於必死板藍根四兩洗曬乾貫眾一兩銼去毛青黛甘草生各一兩上為末蜜丸桐子大以青黛另為衣如稍精神恍惚即是誤中諸毒急取十五丸爛嚼用新水送下即解青黛雄黃丸凡始覺中毒及蛇蟲咬癰疽才作即服此毒氣不聚青黛雄黃等分上為細末新汲水調下二錢潔解毒丸善治男子婦人及小兒一切積熱不解停留作毒上焦壅熱咽喉不利口乾多渴伏暑困悶霍亂不寧或山嵐瘴氣及食毒酒毒吐逆不定遊風丹毒迷惑昏困不省人事虛煩發躁赤目口瘡善解四時傷寒之疾發散瘟疫毒邪之氣及四方人不服水土一切諸毒並皆解之常服此藥補真益氣化毒除風神效不可細述滑石黃芩貫眾茯苓山梔乾薑草龍膽大豆青黛甘草薄荷寒水石各一兩益智仁砂仁大黃山豆根生地桔梗百藥煎草河車即蚤休綠豆粉馬勃板藍根黃藥各半兩上為細末煉蜜為丸如彈子大每服一丸新汲水化下細嚼或噙化亦得小兒半丸如婦人血暈不省生薑薄荷水磨下一丸世解諸毒用玉簪花根擂水服治中諸藥毒生甘草黑豆淡竹葉各等分上㕮咀用水一碗濃煎連服無礬灰散治中諸物毒明礬建茶各等分上為末每服三錢新汲水調下得吐即效世解砒毒鼠莽毒用旋刺下羊血及雞鴨血熱服鼠莽草未詳藍飲子解砒毒及巴豆毒用藍根砂糖二味相和擂水服之更入薄荷汁尤妙解砒毒白扁豆青黛甘草巴豆半粒用半邊去殼不去白上同為末砂糖一大塊水化開調一大盞飲之砒毒隨利去卻服五苓散之類解砒毒用早禾稈燒灰新汲水淋汁濾過冷服一碗毒從利下即安又方用井花水調豆粉或綠豆擂水汁皆可解砒毒漢椒四十九粒黑豆十四粒甘草節二寸碎之烏梅二個上㕮咀用水一盞煎至七分溫服解鼠莽草毒用枯過明礬同上等好末茶少許新汲水調服人有用之累效解鼠莽草毒用大黑江豆煮汁服之如欲試其驗先刈鼠莽苗葉以豆汁澆其根從此敗爛不復生矣仲治自死六畜肉中毒方用黃柏搗屑服方寸匕治郁肉漏脯中毒郁肉密器蓋之隔宿者是也漏脯茅屋漏下沾著者是也燒犬屎酒服方寸匕或服人乳汁或飲韭汁二三升亦良治黍禾中藏肝脯食之中毒方大豆濃汁飲數升即解亦治貍肉漏脯等毒治食生肉中毒方掘地深三尺取其下土三升以水五升煮數沸澄清汁飲一升即愈治六畜馬獸肉中毒方水浸豆豉絞取汁服數升即愈治馬肝毒中人未死方雄鼠屎二七粒末之水和服日再服屎尖者是又人垢取方寸服之佳治馬肉中毒欲死方香豉二兩杏仁三兩相和蒸一食頃熟杵服日再服又方煮蘆根汁飲之良治啖蛇牛肉食之欲死方辨啖蛇牛肉毛髮向後順者是也飲乳汁一升立愈以泔洗頭飲一升愈牛膝細切以水一斗煮取一升暖飲之大汗出即愈治食牛肉中毒甘草煮汁飲之即解治食犬肉不消心下堅或腹脹口乾大渴心急發熱妄語如狂或洞泄方杏仁一升炒皮熟研以沸湯三升和取汁分三服利下肉片出大驗鳥獸有中毒箭死者其肉毒用大豆煮汁及藍汁服之即解世誤吞蜈蚣用生雞血令病人吃須更以清油灌口中其蜈蚣滾在血中吐出繼以雄黃細研水調服愈仲鱠食在心胸間不化吐不出速下除之久成症病方陳皮一兩大黃二兩朴硝二兩上三味以水一大升煮取半升頓服消食鱠多不消結為症病治用馬鞭草搗汁飲之或以姜葉汁飲一升亦消又可服吐藥吐之食魚後食毒物煩亂用陳皮濃煎汁服之即解食鯸鮧魚中毒用蘆根煮汁服之即解世治食河豚魚中毒一時困殆倉卒無藥以清油多灌之使毒物盡吐出為愈仲食蟹中毒治用紫蘇煮汁飲三升紫蘇子搗飲之亦可冬瓜汁飲二升吃冬瓜亦可食果中毒用豬骨燒過末之服方寸匕亦治馬肝漏脯等毒世解一切菌毒掘新地窟以冷水於內攪之令澄少頃取飲之見本草陶隱居注謂之地漿荷葉殺蕈毒仲食諸菌中毒悶亂欲死治方人糞汁飲一升土漿飲二升大豆濃煮汁飲之服諸吐利藥並解取糞汁法截淡竹去青皮浸滲其中取筒中汁是也食楓樹菌而笑不止亦治以前方世蕈毒吐瀉不止者用細茶芽研細以新汲井水化服神效治蕈毒欲死方用石首魚頭或鯗頭亦妙白水煮汁灌之即愈治中蕈毒用笆竹不入泥者數節煎湯飲之立效仲誤食芋煩毒欲死亦治以前方其芋根山東人名魁芋人種芋三年不收亦成野芋並殺人蜀椒閉口者有毒誤食之戟人咽喉氣欲絕或吐下白沫身體痹冷急治之用肉桂煎汁飲之或食蒜或食地漿或濃煮豉豆汁飲之並解仲食躁或躁方用豉煮濃汁飲之鉤吻與芹菜相似誤食殺人解之用薺苨八兩水六升煮取二升分溫二服鉤吻生池傍無他異其莖有毛以此別之菜中有水莨菪葉圓而光有毒誤食之令人狂亂狀如中風或吐血治之用甘草煮汁服之解春秋二時龍帶精入芹菜中人偶食之為病發時手青腹滿痛不可忍名蛟龍病治之用餳糖二三升日兩度服之吐出如蜥蜴三五枚瘥食苦瓠中毒治之用黍穰煮汁服之解飲食中毒煩滿治之用苦參三兩苦酒一升半煮半沸三上三下服之吐食出即瘥或以水煮亦得犀角湯亦解貪食食多不消心腹堅滿痛治之用鹽一升水三升煮令鹽消分三服當吐出食便瘥奇病項上生瘡如櫻桃大有五色瘡破則項皮斷但逐日飲牛乳自消寒熱不止經日後四肢堅如石以物擊之一似鐘磬聲日漸瘦惡用茱萸木香等分煎湯飲即愈大腸頭出寸余痛苦直候乾自退落又出名為截腸病若腸盡乃不治但初截寸余可治用脂麻油器盛之以臀坐之飲大麻子汁數升愈口鼻中腥臭水流以碗盛之有鐵色蝦魚如粳米大走躍不住以手捉之即化為水此肉壞矣任意饌食雞肉愈腹上麻痹不仁多煮蔥白吃之自愈婦人小便中出大糞名交腸服五苓散效如未盡愈可用舊幞頭燒灰酒服之兩足心凸如腫上面生黑色豆瘡硬如釘子釘了履地不得脛骨破碎跟髓流出身發寒顫唯思飲酒此是肝腎氣冷熱相吞用炮川烏頭末敷之煎韭子湯服效凡腹脹經久忽瀉數升晝夜不止服藥不驗乃為氣脫用益智子煎濃湯服立愈四肢節脫但有皮連不能舉動名曰筋解用酒浸黃蘆三兩經一宿取出焙乾為末每服二錢酒調下服盡安玉莖硬不痿精流無歇時時如針刺捏之則脆乃為腎滿漏疾用韭子破故紙各一兩為末每服三錢水一盞煎至六分日三次飲之愈則住服咽喉間生肉層層相疊漸漸腫起不痛多日乃有竅子臭氣自出遂退飲食用臭橘葉煎湯連服愈腹中如鐵石臍中水出旋變作蟲行之狀繞身匝啄癢痛難忍撥掃不盡用濃煎蒼朮湯浴之以蒼朮末入麝香少許水調服痊眼前常見諸般禽蟲飛走以手捉之則無乃肝膽經為疾用酸棗仁羌活玄明粉青葙子花各一兩為末每服二錢水一大盞煎至七分和滓飲一日三服大腸蟲出不斷斷之復生行坐不得用鶴蝨末水調五錢服之自愈眼睛垂出至鼻如黑角色痛不可忍或時時大便血出名曰肝脹用羌活煎汁服數盞自愈腹中有物作聲隨人語言用板藍汁一盞分五服服之又名應聲蟲當服雷丸自愈有飲油五升以來方始快意長得吃則安不爾則病此是發入胃被氣血裹了化為蟲也用雄黃半兩為末水調服蟲自出如蟲活者置於油中逡巡間連油潑之長江治臥於床四肢不能動只進得食好大言說吃物謂之失說物望病治法如說食豬肉時便云你吃豬肉一頓病者聞之即喜遂置肉令病人見臨要卻不與吃此乃失他物望也當自睡中涎出便愈手十指節斷壞唯有筋連無節肉蟲出如燈心長數尺余遍身綠毛卷名曰血餘以茯苓胡黃連煎湯飲之愈遍身忽皮底混混如波浪聲癢不可忍抓之血出不能解謂之氣奔以人參苦杖青鹽細辛各一兩作一服水二碗煎十數沸去渣飲盡便愈眼白渾黑見物依舊毛髮直如鐵條雖能飲食不語如醉名曰血潰用五靈脂為末二錢酒調下因著艾灸訖大痂便退落瘡內鮮肉片子飛如蝶形狀騰空去了痛不可忍是血肉俱熱用大黃朴硝各半兩為末水調下微利即愈臨臥渾身蝨出約至五升隨至血肉俱壞每宿漸多癢痛不可言狀惟吃水臥床晝夜號哭舌尖出血不止身齒俱黑唇動鼻開但飲鹽醋湯十數碗即安眼赤鼻張大喘渾身出斑毛髮如銅鐵乃胃中熱毒氣結於下焦用白礬滑石各一兩為末作一服水三碗煎至半令不住飲候盡乃安有蟲如蟹走於皮下作聲如小兒啼為筋肉之化用雷丸雄黃各一兩為末摻在豬肉片上炙熟吃盡自安手足甲忽然長倒生肉刺如錐痛不可忍吃葵菜自愈鼻中毛出晝夜可長一二尺漸漸粗圓如繩痛不可忍雖忍痛摘去一莖即後更生此因食豬羊血過多遂用乳香硇砂各一兩為末以飯丸梧桐子大空心臨臥各一服水下十粒自然退落面上及遍身生瘡似貓兒眼有光彩無膿血但痛癢不常飲食減少久則透脛名曰寒瘡多吃魚雞韭蔥自愈脅破腸出臭穢急以香油摸腸用手送入煎人參枸杞淋之皮自合矣吃羊腎粥十日即愈口鼻中氣出盤旋不散涎如黑墨色過十日漸漸至肩胸與肉相連堅勝金鐵無由飲食此多因瘧後得之煎澤瀉湯日飲三盞連服五日愈遍身忽然肉出如錐既癢且痛不能飲食此名血擁若不速治潰而膿出以赤皮蔥燒灰淋洗吃豉湯數盞自安眉毛搖動目不能視交睫喚之不應但能飲食有經日不效者用蒜三兩取汁酒調下即愈毛竊節次血出若血不出皮脹膨如鼓須臾眼鼻口被氣脹合此名脈溢飲生薑水汁各一二盞即安忽然氣上喘不能語言口中汁流吐逆齒皆搖動氣出轉大則悶絕蘇復如是名曰傷寒並熱霍亂用大黃人參末各半兩水三盞煎至一盞去滓熱服可安口內生肉球臭惡自己惡見有根線長五寸余如釵股吐球出飲食了卻吞其線以手輕捏痛徹於心困不可言用水調生麝香一錢服三日驗渾身生燎泡如甘棠梨每個破出水內有石一片如指甲大泡復生抽盡肌肉不可治急用荊三稜蓬莪朮各五兩為末分三服酒調連進愈頭面發熱有光色他人手近之如火燒用蒜汁半兩酒調下吐如蛇狀遂安人自覺自形作兩人並臥不別真假不語問亦無對乃是離魂用辰砂人參茯苓濃煎湯服之真者氣爽假者化也男子自幼喜飲酒至成丁後日飲一二升不醉片時無酒叫呼不絕全不進食日就羸弱令其父用手巾縛住其手足不令動搖但扶少立卻取生辣酒一罈就於其子口邊打開其酒氣衝入口中病者必欲取飲堅不可與之須臾口中忽吐物一塊直下壇中即用紙封裹壇口用猛火燒滾約酒幹一半即開視之其一塊如豬肝樣約三兩重周圍有小孔如針眼不可數計棄之於江飲食復舊雖滴酒不能飲矣夜間飲水誤吞水蛭入腹經停月餘日必生下小蛭能食人肝血腸痛不可忍面目黃瘦全不進食若不早治能令人死用田中干泥一小塊小死魚三四個將豬脂溶攪勻用巴豆十粒去殼膜研爛入泥內為丸綠豆大用田中冷水吞下十丸小兒只用三丸至五丸須臾大小水蛭一時皆瀉出卻以四物湯加黃耆煎服生血補理方見婦人門通治類婦人產後忽兩乳伸長細小如腸垂下直過小肚痛不可忍危亡須臾名曰乳懸將川芎當歸各二斤半斤銼散於瓦石器內用水濃煎不拘時候多少溫服餘一斤半銼作大塊用香爐慢火逐漸燒煙安在病人面前桌子下要煙氣在上不絕令病人低頭伏桌子上將口鼻及病乳常吸菸氣直候用此一料藥盡看病證如何或未全安略縮減再用一料如前法煎服及燒煙燻吸必安如用此二料已盡雖兩乳略縮上而不復舊用冷水磨蓖麻子一粒於頭頂心上塗片時後洗去則全安矣婦人臨產服催生藥驚動太早大肉離經而用力太過以致肓膜有傷產後水道中垂出肉線一條約三四尺長牽引心腹痛不可忍以手微動之則痛欲絕先服失笑散數服仍用老薑三斤淨洗不去皮於石缽臼內研爛用清油二斤拌勻入鍋內炒熟以油乾焦為度先用熟絹段約五尺長折作結方令穩重婦人輕輕盛起肉線使之屈曲作一團納在水道口卻用絹袋兜裹候油姜稍溫敷在肉線上熏覺姜漸冷又用熨斗火熨熱使之常有姜氣如姜氣已過除去又用新者如此熏熨一日一夜其肉線已縮大半再用前法越兩日其肉縮盡入腹中其病全安卻再服失笑散芎歸湯補理切不可使肉線斷作兩截則不可醫有人患勞瘵兩年諸藥不效一日聞肉味其腹痛不可忍又恐傳染移在空房候其自終經停三日病者腹痛氣息將絕思憶肉味之急忽有人惠雞子三枚其病人俯仰取火低頭取瓦銚煎熟吹火屢燃屢滅鼻中如有所礙將熟間忽嚏噴一聲有紅線一條自鼻中出牽抽約二尺長趨下瓦銚中病人知是怪物急用碗覆煎銚中盡力燒火不住其銚欲裂方住火開銚視之乃是小蟲一條頭目皆具已煅死如鐵線樣即以示家人後棄之於江其病即安居民逃避石室中賊以煙火熏之欲死迷悶中摸索得一束蘿蔔嚼汁下咽而蘇又炭煙燻人往往致死含蘿蔔一片著口中煙氣不能毒人或預曝乾為末備用亦可或新水擂爛干蘿蔔飲之亦可自行攧穿斷舌心血出不止以米醋用雞翎刷所斷處其血即止仍用真蒲黃杏仁去皮尖硼砂少許研為細末煉蜜調藥稀稠得所噙化而安身上及頭面肉上浮腫如蛇狀者用雨滴堦磉上苔痕一錢水化開塗蛇頭上立消治病人齒無色舌上白或喜唾不知痛癢處或下痢宜急治下部不曉此者但攻其上不以為意則下部生蟲食其肛爛見五臟便死燒艾於管中熏下部令煙入更入少雄黃良肘後方有人被蜘蛛咬腹大如孕婦其家棄之乞食於道有僧遇之教飲羊乳未幾日而平古今錄驗療妖魅貓鬼病人不肯言鬼方鹿角屑搗散以水服方寸匕即實言也外臺秘要蛟龍子生在芹菜上食之入腹變成龍子須慎之用餳粳米杏仁乳餅煮粥食之三升日三服吐出蛟龍子有兩頭鬼擊之病得之無漸卒者加刀刺狀胸脅腹內切痛不可抑按或即吐血衄血下血一名鬼排斷白犬頭取熱血一升飲之丹馬希聖年五十餘性嗜酒常痛飲不醉糟粕出前竅便溺出後竅六脈皆沉澀與四物湯加海金沙木香檳榔木通桃仁服而愈此人酒多氣肆酒升而不降陽極虛酒濕積久生熱煎熬血乾陰亦大虛陰陽偏虛皆可補接此人中年後陰陽虛時暫可活者以其形實酒中谷氣尚在三月後其人必死後果然
