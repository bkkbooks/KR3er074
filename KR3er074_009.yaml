body:
  text: 卷之九陰陽臟腑部調攝宜禁素醫不能嚴不能動神外為柔弱亂至失常病不能移則醫事不行疏五過論凡陰陽之要陽密乃固兩者不和若春無秋若冬無夏因而和之是謂聖度故陽強不能密陰氣乃絶陰平陽祕精神乃治陰陽離決精氣乃絶全文見五臟生氣通天論素春夏養陽秋冬養陰以從其根故與萬物沉浮於生長之門逆其根則伐其本壞其真矣四氣調神論丹陽有餘陰不足論人受天地之氣以生天之陽氣為氣地之陰氣為血故氣分常有餘血分常不足何以言之天地為萬物父母天大也為陽而運於地之外地居天之中為陰天之大氣舉之日實也亦屬陽而運於月之外月缺也屬陰稟日之光以為明者也人身之陰氣其消長視月之盈缺故人之生也男子十六歲而精通女子十四歲而經行是有形之後猶有待於乳哺水穀以養陰氣始成而後可與陽氣為配方能成人而為人之父母古人必近至三十二十而後嫁娶可見陰氣之難於成而古人之善於攝養也禮記注曰惟五十而後養陰者有以加內經曰年四十陰氣自半起居衰矣又曰男子六十四歲而精絶女子四十九歲而經斷夫以陰氣之成止供給得三十年之視聽言動已先虧矣夫人之情欲無涯以此難成易虧之陰氣若之何而可以縱恣也經曰陽者天氣也主外陰者地氣也主內故陽道實而陰道虛又曰至陰虛天氣絶至陽盛地氣不足虛與盛之所在非吾之過論也蓋主閉藏者腎也司疏泄者肝也二臟皆有相火而其繫上屬於心心君火也為物所感則易動心動則相火亦動動則精自走相火翕然而起雖不交會亦暗流而疏泄矣所以聖賢只是教人收心養心其旨深矣天地以五行更迭衰旺而成四時人之五臟六腑亦應之而衰旺四月屬巳五月屬午為火大旺火為肺金之夫火旺則金衰六月屬未為土大旺土為水之夫土旺則水衰況腎水常藉肺金為母以補助其不足故內經諄諄於資其化源也古人夏月必獨宿而淡味兢兢業業愛護保養金水二臟正嫌火土之旺爾內經又曰冬不藏精者春必病溫十月屬亥十一月屬子正火氣潛伏閉藏以養其本然之真而為來春發生升動之本若於此時恣嗜欲以自戕賊至春升之際下無根本陽氣輕浮必有溫熱之病夫夏月火土之旺冬月火氣之伏此論一年之虛耳若上弦前下弦後月廓月空亦為一月之虛大風大霧虹霓飛電暴寒暴熱日月薄蝕憂愁忿怒驚恐悲哀醉飽勞倦謀慮勤動又皆為一日之虛若病患初退瘡痍正作尤不止於一日之虛而已今人多有春末夏初患頭疼腳軟食少體熱仲景謂春夏劇秋冬瘥而脈弦大者正世俗所謂注夏病也若犯此四者之虛似難免此夫當壯年便有老態仰事俯育一切隳壞興言至此深可驚懼古人謂不見所欲使心不亂夫以溫柔之感於身聲音之感於耳顏色馨香之感於目鼻誰是鐵漢心不為之動也唯善攝生者於此五個月出居於外苟值一月之虛亦宜暫遠帷幕各宜珍重保全太和期無負敬身之教幸甚茹淡論或問內經精不足者補之以味又曰地食人以五味古者人年五十而食肉子今年邁七十矣盡卻鹽醯豈中道乎何子之神茂而色澤也曰味有出於天賦者有成於人為者天之所賦者若谷菽果菜自然沖和之味有養神補陰之功此內經所謂味也人之所為者皆烹飪調和偏厚之味有致病伐命之毒此吾子所疑之味也今鹽醯之卻非真茹淡者夫麥與栗之咸粳米山藥之甘蔥薤之辛之類皆味也子以為淡乎安於沖和之味者心之收火之降也以偏厚之味為安者欲之縱火之勝也何疑之有內經又曰陰之所生本在五味非天賦之味乎陰之五宮傷在五味非人為之味乎聖人防民之具於是為備凡人飢則必食彼粳米之甘而淡者土之德也物之為陰而最補者也惟可與菜同進經以菜為充者恐於飢時頓食或慮過多因致胃損故以菜助其充足取其疏通而易化此天地生萬物之仁也論語曰肉雖多不使勝食氣又曰疏食菜羹又曰飯疏食飲水傳曰賓主終日百拜而酒三行以避酒禍此聖人施教之意也蓋谷與肥鮮同進厚味得谷為助其積之也久寧不助陰火而致毒乎故服食家在卻谷者則可不卻谷而服食未有不被其毒者內經謂久而增氣物化之常氣增而久夭之由也彼安於厚味者未之思爾或又問精不足者補之以味何不言氣補曰味陰也氣陽也補精以陰求其本也故補之以味若甘草白朮地黃澤瀉天門冬五味子之類皆味之厚者也經曰虛者補之正此意也上文謂形不足者溫之以氣夫為勞倦所傷則氣虛故不足溫者養也溫存以養之使氣自充氣充則形完矣故言溫不言補經曰勞者溫之正此意也彼為局方者不知出此凡諸虛損證悉以溫熱佐輔補藥名之曰溫補不能求經旨故也或曰千金方有房中補益法可用否豫應之曰傳曰吉凶悔吝皆生於動故人之疾病亦生於動其動之極也病而死矣人之有生心為火居上腎為水居下水能升而火能降一升一降無有窮已故生意存焉水之體靜火之體動動易而靜難聖人於此未嘗忘言也儒者立教曰正心收心養心皆所以防此火之動於妄也醫者立教曰恬淡虛無補精養神亦所以遏此火之動於妄也蓋相火藏於肝腎陰分君火不妄動相火惟有稟命守位而已焉有燔灼之虐焰飛走之狂勢也哉易兌取象於少女兌說也遇少男艮為咸咸無心之感也艮止也房中之法有艮止之義也若艮而不止徒自戕賊何補益之有竊詳千金之意彼壯年貪縱者此水之體非向日之靜也故著房中之法為補益之助此可用於質壯心靜遇敵不動之人也苟無聖賢之心神仙之骨未易為也女法水男法火水能制火一樂於與一樂於取此自然之理也若以房中為補殺人多矣況中古以下風俗日婾資稟日薄說夢向癡難矣哉婾它候切房中補益論醇酒冷飲論醇酒之性大熱有大毒清香美味即適於口行氣和血亦宜於體由是飲者不自覺其過於多也不思肺屬金惟畏火又畏寒其體脆其位高為氣之主為腎之母木之夫酒下咽膈肺先受之若是醇酒理宜冷飲過於肺入於胃然後漸溫肺先得溫中之寒可以補氣一益也次得寒中之溫可以養胃二益也冷酒行遲傳化以漸不可恣飲三益也古人終日百拜不過三爵既無酒病亦無酒禍今豫稽之於禮經則曰飲齊視冬時飲齊酒也視猶比也冬時寒也參之內經則曰熱因寒用厥旨深矣今則不然不顧受傷只圖取快蓋熱飲有三樂存焉膈滯通快喉舌辛美杯行可多不知酒性喜升氣必隨之痰鬱於上溺澀於下肺受賊邪金體必燥恣飲寒涼其熱內郁肺氣得熱必大傷耗其始也病淺或嘔吐或自汗或瘡痍或鼻皶或自泄或心脾痛尚可發散而去之若其久也為病深矣為消渴為內疸為肺痿為內痔為鼓脹為失明為哮喘為勞嗽為癲癇又為難名之疾倘非具眼未易處治可不謹乎人言一盞冷酒須兩盞血乃得行酒之不可冷飲也明矣此齊東之語也今參之於經證之以理發之為規戒子尚以為迂耶賤體在病年餘而今秋又得痢者一月自揆不久終獲苟安蓋久病之後氣血銷損脂膏消散當此之時初感之證已退減惟諸虛百損在耳大凡藥雖參耆亦是毒物內經於藥字之下加毒字又加攻字天地間養人性命者惟谷耳備土之德得氣中和故其味淡甘而性和平大補而滲泄乃可久食而無厭是大有功於人者在藥則不然矣不肖得安全者自去秋得病餌藥至冬節日便不吃藥惟一味白粥不吃下飯雖鹽醬與醯醢涓滴皆不入口此等淡味初亦甚難自想此證必無他慮但思己過收放心自訟自責安心待死既自待死尚可吃粥猶有可生之理由是自解以死不愈於淡乎如此乃可打捱得過此時非淡不可以和此氣血氣血不和不足以復此生意不以死在前操此心以摧抑其怒與妄想血氣雖欲復生不可得也詳玩來書此時無病可言矣曰煩躁曰喘急曰氣響曰腹痛曰咳嗽曰大腑溏曰小腑澀皆吾兄之所自求者平時為學不肯先求己過而克治之但欲妄得以遂其受用之私心至於染病之後又不能歸罪於己思所以安其親之心而盡其子職之當然者方且操欲速之念以極其怨尤之癡所以怒火熾矣而況稟受急躁火中又火加之口味不節又起陰經之火至於奄延歲月陰且受火克所存者鮮矣惟有借穀氣以扶持所以未死其所以煩躁者氣隨火升也喘急者氣因火鬱而為痰在肺胃也氣響與痛或嗽痰者由食成積而愈盛也大腑溏者肺因火爍不行收令其大腸之門戶不得斂也小腑澀者血因火爍下焦無血氣不得降而滲泄之令不行也據高懷欲速之心便欲倚重於藥而掃除之殊不知此法不可行矣而此病有必安之理昔者孟子教滕君於齊人築薛以為滕之深計令其強為善而已矣者心也蓋他無良策有以御齊之侵奪彼齊君者只亦欺我無君人之德爾以常人聽孟子之言非迂闊乎孟子之學出於孔子者也豈欺滕君哉兄之症有似乎此今之議藥為尤難欲攻則無病邪之實欲補又無的在之虛惟有滅欲心斷絶口味使內靜外安陰氣自然以漸而復某自去冬至節直到今月不曾用刀圭之藥今已十月安好矣久病之後若欲以藥方摧趲速效此是揠苗助長者也無可求之理內經諄諄言之而後人特未之思爾復戴仲積書大病不守禁忌論病而服藥須守禁忌孫真人千金方言之詳矣但不詳言所以守禁忌之由敢陳其約以為規戒夫胃氣者清純沖和之氣人之所賴以為生者也若謀慮神勞動作形苦嗜欲無節思想不遂飲食失宜藥餌違法皆能致傷既傷之後須用調補若恬不知怪而乃恣意犯禁舊染之證尚未消退方生之證與日俱積吾見醫藥將日不暇給而傷敗之胃氣無復完全之望去死近矣方書云二人同患痢一人愈後自恃能食縱口大嚼而死一人惡食能禁口淡味得生其詳具見後泄下門世俗以肉為補性之物肉無補性惟補陽而今之虛損者不在於陽而在於陰以肉補陰猶緣木而求魚何者內性熱入胃便熱發熱發便生痰痰多氣便不降而諸證作矣久病後可用作養胃氣蓋胃氣非陰氣不足以自全所以淡味為自養之良方尤當今之急著也食淡又須安心使內火不起可也養老論人生至六十七十以後精血俱耗平居無事已有熱症何者頭昏目眵肌癢溺數鼻涕牙落涎多寐少足弱耳聵健忘眩運腸燥面垢發脫眼花坐久兀睡未風先寒食則易飢笑則有淚但是老境無不有此或曰局方烏附丹劑多與老人為宜豈非以老年氣弱下虛理宜溫補今吾子皆以為熱烏附丹不可施之老人何耶豫曉之曰奚止烏附丹劑不可妄用至於好酒膩肉濕面肉汁燒炙煨炒之類辛辣甜滑皆在所忌者或又曰甘旨養老經訓具在為子與婦甘旨不及孝道便虧而吾子之言若是其將有說以通之乎願聞其略豫愀然應之曰正所謂道並行而不相悖者請詳言之古者井田之法行鄉閭之教具人知禮讓比屋可封肉食不及幼壯五十方才食肉當時之人血氣衝和筋骨堅凝腸胃清厚甘旨養老何由致病今則不然幼小食肉強壯恣叨比及五十疾已蜂起氣耗血竭筋柔骨痿腸胃壅閼涎沫充溢而況人身之陰難成易虧六七十後陰不足以配陽孤陽幾欲飛越因天生胃氣尚爾留連又藉水穀之陰羈縻而不走耳所陳前證皆是血少內經曰腎惡燥烏附丹劑非燥而何夫血少之人若防風半夏蒼朮但是燥劑且不敢多況烏附丹劑乎或者又曰一部局方悉是溫熱養陽吾子之言無乃繆妄乎豫曰局方用燥劑為劫濕病也濕得燥則豁然而收局方用暖劑為劫虛病也補脾不補腎脾得暖則易化而食進下雖暫虛亦可少回內經治法亦許用劫正是此意蓋為質厚而病淺者說此亦儒者用權之意若以為經常之法豈不大誤彼老年之人質雖厚此時亦近乎薄病雖淺其本亦易以撥而可用劫藥以取速效乎若夫形肥者血多形瘦者血實間或有可用劫藥者設或失手何以收救吾寧稍遲計出萬全豈不美乎烏附丹劑其不可輕餌也明矣至於飲食尤當謹節夫老人內虛脾弱陰虧性急內虛胃熱則易飢而思食脾弱難化則食已而再飽陰虧難降則氣鬱而成痰至於視聽言動皆成廢懶百不如意怒火易熾雖有孝子順孫亦是動輒扼腕況未必孝順乎所以物性之熱者炭火製作者氣之香辣者味之甘膩者皆不可食也明矣雖然腸胃堅厚福氣深壯者世俗觀之何妨奉養縱口固快一時積久必為災害由是觀之多不如少少不如絶爽口作疾厚味臘毒古人格言猶在人耳可不慎歟或曰如子之言殆將絶而不與於汝安乎豫曰君子愛人以德小人愛人以姑息況施於所尊者哉惟飲與食將以養生不以致疾若以所養轉為所害恐非君子之所謂孝與敬也然則如之何則可曰好生惡死好安惡病人之常情為子與孫必先開之以義理曉之以物性旁譬曲喻陳說利害意誠辭確一切以敬順行之又須以身先之必將有所感悟而自無捍格之逆矣若子所謂絶而不與施於有病之時尤是孝道若無病之時量酌可否以時而進某物不食以某物代之何傷於孝敬乎若夫平居閒話素無開導誘掖之言及至飢腸已嗚饞涎已動飲食在前馨香撲鼻其可禁乎經曰以飲食忠養之忠之一字恐與此意合請勿輕易看過豫事老母固有愧於古者然母年逾七旬素多痰飲至此不作節養有道自謂有術只因大便燥結時以新牛乳豬脂和糜粥中進之雖得暫時滑利終是膩物積多次年夏時郁為黏痰發為脅瘡連月苦楚為人子者置身無地因此苦思而得節養之說時以小菜和肉煮進之且不敢多又間與參術補胃生血之藥加減遂得大腑不燥面色瑩潔雖瘦弱終是無病老境得健職此之由也因成一方用參術為君牛膝芍藥為臣陳皮茯苓為佐春加川芎夏加五味黃芩麥冬冬加當歸身倍生薑一日或一帖或二帖候其小水才覺短少便進此藥小水之長如舊即是卻病捷法直到八十有七一旦無病而死顏貌如生後到東陽因聞老何安人性聰敏七十以後稍覺不快便卻粥數日單服人參湯數帖而止後九十餘無疾而卒以其偶同故筆之以求是正東垣安養心神調治脾胃論靈蘭祕典論曰心者君主之官神明出焉凡喜怒忿悲憂思恐懼皆損元氣夫陰火之熾盛由心生凝滯七情不安故也心者神之舍心君不守化而為火夫火者七神之賊也故曰陰火太盛經營之氣不能頤善於神乃脈病也神無所養津液不行不能生血脈也人心之神真氣之別名也得血則生血生則脈旺脈者神之舍若心生凝滯七神離形而脈中惟有火矣善治斯病者惟在調和脾胃使心無凝滯或生歡欣或逢喜事或天氣暄和居溫和處或食滋味或見可欲事則慧然如無病矣蓋胃中元氣得舒伸故也脾胃將理法或方怒不可食不可大飽大飢飲食欲相接而溫和宜穀食多而肉食少不宜食肉汁忌寒濕物令肌肉不生陽氣潛伏四肢怠惰之症疼痛沉重時當濕雨則泄利大便後有白膿血痢或腸澼下血痛此乃諸陽氣不行陽道之故也勞則陽氣衰宜乘車馬遊玩遇風寒則止行住坐臥各得其宜不可至疲倦日晴暖可以溫湯澡浴勿以熱湯令汗大出勿困中飲食雖飢渴當先臥至不困乃食食後少動作忌博奕勞心遇夜汗出宜避賊風夜半收心靜坐少時此生髮周身血氣之大要也夜寢語言大損元氣須默默少時候周身陽氣行方可言語忌浴當風汗當風須以手摩汗孔合方許見風必無中風中寒之疾遇卒風暴寒衣服不能御者則宜掙努周身之氣以當之氣弱不能御而受之者死遠行卒遇疫癘之氣飲酒者不病腹中有食者病空腹者死白粥粳米緑豆小豆鹽豉皆滲利小便且小便數不可更利況大瀉陽氣反行陰道切禁濕面如食之覺快勿禁藥中不可服澤瀉茯苓豬苓燈心琥珀通草木通滑石之類皆瀉陽道行陰道也如渴小便不利或閉塞不通則服得利勿再服忌大咸助火邪而瀉腎水真陰及大辛味蒜韭五辣醋大料物官桂乾薑之類皆傷元氣如衣薄而氣短則添衣於無風處居處如氣尚短則用沸湯一碗熏其口鼻即不短也如衣厚而氣短則宜減衣摩汗孔令合於漫風處居止如久居高屋或天寒陰濕所遏令氣短者亦如前法熏之如居周密小室或大熱而處寒涼氣短者則出就風日凡氣短皆宜食滋味湯飲令胃調和或大熱能食而渴喜寒飲當從權以飲之然不可耽嗜如冬喜熱飲亦依時暫飲夜不安寢衾厚熱壅故也當急去之仍拭汗孔或薄而寒即加之睡自穩也飢而睡不安則宜少食食飽而睡不安則宜少行坐遇天氣變更風寒陰晦宜預避之大抵宜溫暖避風寒省言語少勞役為上若服升浮之藥先一日將理次日腹空方服服畢更宜將理十日先三日尤甚不然則反害也風從南方來名曰大弱風其傷人也內舍於心外在於脈其氣主為熱全文見診歲病經諸所謂風者髮屋折木揚沙起石開發腠理者也其從太乙所居之方來者為實風主生長萬物其從沖後來者為虛風主殺害傷人故聖人謹俟虛風而避之邪弗能害今言風從南方來者夏至為實風太乙所居之方故也冬至為虛風者以其沖太乙者故也余方虛風實風同義風從西南方來名曰謀風其傷人也內舍於脾外在於肌其氣主為弱立秋為實風立春為虛風風從西方來名曰剛風其傷人也內舍於肺外在於皮膚其氣主為燥秋分為實風春分為虛風風從西北方來名曰折風其傷人也內舍於小腸外在於手太陽脈脈絶則溢脈閉則結不通善暴死立冬為實風立夏為虛風風從北方來名曰大剛風其傷人也內舍於腎外在於骨與肩背之膂筋其氣主為寒冬至為實風夏至為虛風風從東北方來名曰凶風其傷人也內舍於大腸外在於兩脅腋骨下及肢節立春為實風立秋為虛風風從東方來名曰嬰兒風其傷人也內舍於肝外在於筋紐其氣主為身濕春分為實風秋分為虛風風從東南方來名曰弱風其傷人也內舍於胃外藏於肌肉其氣主體重夏至為實風冬至為虛風此八風皆從其虛之鄉來乃能病人故聖人避風如避矢石焉病在肝禁當風病在心禁溫食熱衣病在脾禁溫食飽食濕地濡衣病在肺禁寒飲食與衣病在腎禁犯淬㶼熱溫食炙衣全文見診病愈劇宣明五氣篇云心惡熱肺惡寒脾惡濕腎惡燥今皆就其所惡而禁之也淬音對反㶼烏來反煩熱也靈肝病禁辛心病禁咸脾病禁酸腎病禁甘肺病禁苦五味篇素五味所禁辛走氣氣病無多食辛咸走血血病無多食鹹苦走骨骨病無多食苦甘走肉肉病無多食甘酸走筋筋病無多食酸是謂五禁勿令多食宣明五氣論肝色青宜食甘粳米牛肉棗葵皆甘心色赤宜食酸小豆犬肉李韭皆酸肺色白宜食苦麥羊肉杏薤皆苦脾色黃宜食鹹大豆豕肉栗藿皆咸腎色黑宜食辛黃黍雞肉桃蔥皆辛辛散酸收甘緩苦堅咸耎毒藥攻邪五穀為養五果為助五畜為益五菜為充氣味合而服之以補精益氣此五者有辛酸甘苦鹹各有所利或散或收或緩或急或堅或耎四時五臟病隨五味所宜也臟氣法時論五味之偏者則為毒藥以攻病邪五味之中和者則為谷果子菜以助益充其精氣也仲五臟病各有得者愈五臟病各有所惡各隨其所不喜者為病病者素不應食而反暴食之必發熱也用藥宜禁丹病雖實胃氣傷者勿便攻擊論凡言治者多借醫為喻仁哉斯言也真氣民也病邪盜賊也藥石兵也或有盜起勢須剪除而後已良將良相必先審度兵食之虛實與時勢之可否然後動動涉輕妄則吾民先困於盜次困於兵民困則國弱矣行險僥幸小人所為萬象森羅果報昭顯其可不究心乎治呂氏寒戰用耆葛愈一法治葉先生滯下用參朮而後下之愈一法治婦人積塊用消石丸大峻後用補劑間服愈詳各見本門大凡攻擊之藥有病則受之病邪輕藥力重則胃氣受傷夫胃氣者清純沖和之氣也惟與穀肉菜果相宜蓋藥石皆是偏勝之氣雖參耆輩為性亦偏況攻擊之藥乎忌春夏不宜桂枝秋冬不宜麻黃藥忌已汗者不可再發已利者不可再利病忌虛人不宜用涼實人不宜用熱東垣凡治病服藥必知時禁經禁病禁藥禁夫時禁者必本四時升降之理汗下吐利之宜大法春宜吐象萬物之發生耕耨砟斫使陽氣之郁者易達也夏宜汗象萬物之浮而有餘也秋宜下象萬物之收成推陳致新而使陽氣易收也冬宜周密象萬物之閉藏使陽氣不動也夫四時陰陽者與萬物沉浮於生長之門逆其根伐其本壞其真矣用溫遠溫用熱遠熱用涼遠涼用寒遠寒無翼其勝也故冬不用白虎夏不用青龍春夏不用桂枝秋冬不服麻黃不失氣宜如春夏而下秋冬而汗是失天信伐天和也有過則從權過則更之經禁者足太陽膀胱諸陽之首行於背表之表風寒所傷則宜汗傳入本則宜利小便若下太早則變證百出此一禁也足陽明胃經行身之前病主腹滿脹大便難宜下之蓋陽明化燥火津液不能停禁若發汗利小便為重損津液此二禁也足少陽膽經行身之側在太陽陽明之間病則往來寒熱口苦胸脅痛只宜和解且膽者無出無入又主發生之氣下則犯太陽汗則犯陽明利小便則使發生之氣反陷入陰中此三禁也三陰非胃實不當下為三陰無傳本須胃實得下也分經用藥有所據焉病禁者如陽氣不足陰氣有餘之病則凡飲食及藥忌助陰瀉陽諸淡食及淡味藥物瀉陽升發以助收斂諸苦藥皆沉瀉陽氣之散浮諸薑附官桂辛熱之藥及濕面酒大料物之類助火而瀉元氣主冷硬物能損陽氣皆所當禁也如陰火欲衰而退以三焦元氣未盛必口淡如咸物亦所當禁也藥禁者如胃氣不行內亡津液而乾涸求湯飲以自救非渴也乃口乾也非濕勝也乃血病也當以辛酸益之而淡滲五苓之類則所當禁也汗多禁利小便小便多禁發汗咽痛禁發汗利小便若大便快利不得更利大便祕澀以當歸桃仁麻子仁郁李仁皂角仁和血潤腸如燥藥則所當禁者也吐多不得復吐如吐而大便虛軟者此上氣壅滯以薑橘之屬宣之吐而大便不通則利大便藥所當禁也諸病惡瘡小兒癍後大便實者亦當下之而薑橘之類則所當禁也人知脈弦而服平胃散脈緩而服黃耆建中湯乃實實虛虛皆所當禁也人稟天地之濕化而生胃也胃之與濕其名雖二其實一也濕能滋養於胃胃濕有餘亦當瀉其太過也胃之不足惟濕物能滋養仲景云胃勝思湯餅而胃虛食湯餅者往往增劇濕能助火火旺鬱而不通則生大熱初病火旺不可食濕以助火也察其時辨其經審其病而後用藥四者不失其宜則善矣丹大病虛脫本是陰虛用艾灸丹田者所以補陽陽生陰長故也不可用附子可多服人參垣春宣論春蠢也陽氣升浮草木萌芽蠢然而動人氣在頭有病宜吐又曰傷寒大法春宜吐宣之為言揚也謂吐之法自上而出也今世俗往往有瘡痍者膈滿者蟲積者以為不於春時宣瀉毒氣不可愈也醫者遂用牽牛巴豆大黃枳殼防風輩為丸藥名之曰春宣丸於二月三月服之謂俾下利而止初瀉之時臟腑得通時暫輕快殊不知氣升在上則在下之陰甚弱而用利藥戕賊真陰其害何可勝言況仲景承氣湯等下劑必有大滿大堅實有燥屎轉矢氣下逼迫而無表證者方行此法可下之證悉具猶須遲以待之泄痢之藥其可輕試之乎豫伯考形肥骨瘦味厚性沉五十歲輕於聽信忽於三月半購春宣丸服之下二三行甚快每年習以為常至五十三歲時七月初熱甚無病暴死此豈非妄用春宣為春瀉而至禍耶自上召下曰宣宣之一字為吐也明矣子和已詳論之昔賢豈妄言哉後之死者又有數人愚故表而出之以為後人之戒夏日伏陰在內論天地以一元之氣化生萬物根於中者曰神機根於外者曰氣血萬物天地同此一氣人靈於物形與天地參而為三者以其得氣之正而通也故氣升亦升氣浮亦浮氣降亦降氣沉亦沉人與天地同一槖籥也子月一陽生陽初動也寅月三陽生陽初出於地此氣之升也巳月六陽生陽盡出於上此氣之浮也人之腹屬地氣於此時浮於肌表散於皮毛腹中之陽虛矣經曰夏者經滿氣溢孫絡受血皮膚充實長夏氣在肌肉所以表實表實者里必虛也世言夏月伏陰在內此陰字有虛之義若作陰冷看其誤甚矣或曰以手捫腹明知其冷非冷而何前人治暑病有玉龍丹大順散桂苓丸單煮良薑與縮脾飲用草果等皆溫熱之劑何吾子不思之甚也豫曰經云春夏養陽王太僕謂春食涼夏食寒所以養陽也其意可見矣若夫涼臺水閣大扇風車陰木寒泉水果冰雪寒涼之傷自內及外不用溫熱病何由安詳玩其意實非為內伏陰而用之也前哲又謂升降浮沉則順之寒熱溫涼則逆之若於夏月火令之時妄投溫熱寧免實實虛虛之患乎或曰四月純陽於理或通五月一陰六月二陰非陰冷而何豫曰此陰之初動於地下也四陽浮於地上焰灼焚燎流金礫石何陰冷之有孫真人制生脈散令人夏月服之非虛而何東垣經云一陰一陽之謂道偏陰偏陽之謂疾聖濟經曰陽劑剛勝積若燎原為消渴癰疽之屬則天癸竭而榮涸陰劑柔勝積若凝冰為洞泄寒中之屬則真火微而衛散故大寒大熱之藥當宜權用之氣平而止如寒熱有所偏勝令人臟氣不平嗚呼生死之機捷若影響殆不可忽丹局方地榆散治痢每用粟殼地榆而治瘧每用砒丹常山然此四五件亦痢瘧之一藥但以粟殼輩投之一二服投之不止反閉胃口而有嘔逆之證漸成禁口常山輩投之一二服投之不去反耗損真氣而寒熱纏綿之咎漸成勞瘵今局方水煮木香丸以青皮為君地榆散以枳殼為君稍可擔負亦須證明而後可但枳殼為君以枳實為臣非獨止痢且有安胃氣止溏泄之功若止用枳殼雖亦言其安胃氣卻無止痢止溏泄之功局方中地榆散當去皮用羅仲景云瘡家雖身疼痛不可發汗其理何也豫曰此榮氣不從逆於肉理而為瘡腫作身疼痛非身感寒邪而作疼痛故戒之以不可發汗如汗之則成痓又問仲景言鼻衄者不可發汗復言脈浮緊者當服麻黃湯發之衄血自止所說不同願聞其故答曰此與瘡家概同且夫人身血之與汗異名而同類奪血者無汗奪汗者無血今衄血妄行為熱所逼若更發其汗則反助熱邪重竭津液必變凶證故不可汗若脈浮則為在表緊則為寒寒邪郁遏陽不得伸熱伏營中迫血妄行上出於鼻則當麻黃湯散其寒邪使陽氣得伸其衄自止又何疑焉或者嘆曰知其要者一言而終不知其要者流散無窮潔古之學可謂知其要者矣傷寒衄忌汗者脈微海當汗而不汗則生黃當利小便而不利亦然脾主肌肉四肢寒濕與內熱相合故也不當汗而汗亡其津液令毒氣擾陽之極極則侵陰矣故燥血而蓄之胸中或利小便過多亦然若犯發汗多蓄血上焦為衄若利小便多蓄血為發狂或問曰傷寒雜症一體若誤下變有輕重何也答曰傷寒誤下變無定體雜症誤下變有定體何以然曰傷寒自外而入陽也陽主動雜證自內而出陰也陰主靜動者犯之其變無窮靜者犯之其變止痞與腹脅痛而已故變無窮者為重病痞與脅痛者為輕也羅無病服藥辨諺云無病服藥如壁里安柱此無稽之說為害甚大夫天之生物五味備焉食之以調五臟過則生疾故經云陰之所生本在五味陰之五宮傷在五味又曰五味入胃各隨其所喜故酸先入肝辛先入肺苦先入心甘先入脾咸先入腎久而增氣氣增而久夭之由也又云酸走筋辛走氣苦走骨咸走血甘走肉五味者口嗜而欲食之必自裁製勿使過焉至於五穀為養五果為助五畜為益五菜為充氣味合而食之補精益氣倘用之不時食之不節猶或生疾況藥乃攻邪之物無病而可服乎聖濟經云彼修真者蔽於補養輕餌藥石陽劑剛勝積若燎原為消渴癰疽之屬則天癸絶而陰涸陰劑柔勝積若凝冰為洞泄寒中之屬則真火微而衛散一味偏勝一臟偏傷一臟受傷四臟安得不病唐孫思邈言藥勢有所偏勝令人臟氣不平裴潾諫唐憲宗曰夫藥以攻病非朝夕常用之物況金石性酷烈有毒又加煉以火氣非人五臟所能禁至於張皋諫穆宗曰神慮淡則氣血和嗜欲多而疾疢作夫藥以攻疾無病不可餌故昌黎伯銘李子之墓曰余不知服食說自何世起殺人不可計而世慕尚之益至此其惑也今直取目見親與之遊而以藥敗者六七公以為世誡工部尚書歸登殿中御史李虛中刑部尚書李遜第刑部侍郎常建襄陽節度使工部尚書孟簡東川節度使御史大夫盧植金吾將軍李道古今又復取目見者言之僧閻仲章服火煉丹砂二粒項出小瘡腫痛不任牙癢不能嚼物服涼膈散半斤始緩後飲酒輒發藥以寒涼之劑則緩終身不愈鎮人李潤之身體肥盛恐生風疾至春服搜風丸月餘便下無度飲食減少舌不知味口乾氣短臍腹痛足脛冷眩暈欲倒面色青黃不澤日加困篤乃告親知曰妄服藥禍悔將何及後添煩躁喘滿至秋而卒張秀才者亦聽方士之說服四生丸推陳致新服月餘大便或溏或瀉飲食妨阻怠惰嗜臥目見黑花耳聞蟬聲神虛頭旋飄飄然身不能支至是方知藥之誤也遂調飲食慎起居謹於保養二三年間其證猶存逾十年後方平復劉氏子聞人言臘月晨飲涼水一杯至春無目疾遂飲之旬余腹中寒痛不任咳嗽嘔吐全不思食惡水而不欲見足脛寒而逆醫以除寒燥熱之劑急救之終不能效此皆無故求益生之祥反生病焉或至於喪身殞命壁里安柱果安在哉且夫高堂大廈梁棟安基址固壞塗毀塈安柱壁中甚不近人情潔古老人云無病服藥無事生事此誠不易之論人之養身幸五臟之安泰六腑之和平謹於攝生春夏奉以生長之道秋冬奉以收藏之理飲食之有節起居而有常少思寡欲恬淡虛無精神內守此無病之時不藥之藥也噫彼數人者既往不咎矣後人當以此為龜鑑哉陰盛陽虛不宜下辨陰盛陽虛汗之則愈下之則死此言邪氣在表之時也夫寒邪屬陰身之外皆屬陽各臟腑之經絡亦屬陽也蓋陽氣為衛衛氣者所以溫肌肉充皮毛肥腠理司開闔此皆衛外而為固也或煩勞過度陽氣內損不能為固陽為之虛陽虛者陰必湊之故陰得以勝邪氣勝則實陰盛陽虛者此也陰邪既勝腠理致密陽氣伏郁不得通暢所以發熱惡寒頭項痛腰脊強應解散而藥用麻黃者本草云輕可去實葛根麻黃之屬是也蓋麻黃能退寒邪使陽氣伸越作汗而解故曰陰盛陽虛汗之則愈裡氣和平而反下之中氣既虛表邪乘虛而入由是變症百出故曰下之則死外臺祕要云表病里和汗之則愈下之則死正此意也陽盛陰虛不宜汗辨陽盛陰虛下之則愈汗之則死此言邪氣在裡之時也夫寒邪始傷於表不解而漸傳入於裡變而為熱人之身在裡者為陰華他云一日在皮二日在膚三日在肌四日在胸五日在腹六日入胃入胃謂之入腑也腑之為言聚也若府庫而聚物焉又為水穀之海滎衛之源邪氣入於胃而不復傳流水穀水穀不消去鬱而為實也此陽盛陰虛者此也故潮熱引飲腹滿而喘手足漐漐汗出大便難而譫語宜大承氣湯下之則愈潮熱者實也此外已解可攻其里而反汗之表無陰邪汗又助陽陽實而又補表表裡俱熱不死何待外臺祕要云表和里病下之則愈汗之則死正此意也汗多亡陽齊大兄冬月因感寒邪頭項強身體痛自用酒服靈砂丹四五粒遂大汗出汗後身輕至夜前病復來以前藥復汗其病不愈復以通聖散發汗病添身體沉重足脛冷而惡寒是日方命醫醫者不究前治又以五積散汗之翌日身重如石不能反側足䯒如冰冷及腰背頭汗如貫珠出而不流心胸躁熱煩亂不安喜飲西瓜梨柿冰水之物常置左右病至於此命豫治之診得六脈如蛛絲微微欲絶豫以死決之主家曰得汗多矣焉能為害豫曰夫寒邪中人者陽氣不足之所致也而感之有輕重治之者豈可失其宜哉仲景云陰盛陽虛汗之則愈汗者助陽退陰之意也且寒邪不能自汗必待陽氣泄乃能出也今以時月論之大法夏月宜汗然亦以太過為戒況冬三月閉藏之時無擾乎陽無泄皮膚使氣亟奪為養藏之道也逆之則少陰不藏此冬氣之應也凡有觸冒宜微汗之以平為期邪退乃已急當衣暖衣居密室服實表補衛氣之劑雖有寒邪弗能為害此從權之治也今非時而大發其汗乃謂之逆故仲景有云一逆尚引日再逆促命期今本傷而並汗汗而復傷傷而復汗汗出數四使氣亟奪衛氣無守陽泄於外陰乘於內故經云獨陽不生獨陰不長不死何待雖盧扁亦不能治也是日至夜將半項強身體不仁手足搐急爪甲青而死矣金匱要略云不當汗而妄汗之奪其津液枯槁而死今當汗之一過中亦絶其命況不當汗而強汗之者乎下多亡陰真定趙客乙丑歲六月間客於他方因乘困傷濕面心下痞滿躁熱時作臥不得安遂宿於寺中僧妄以大毒食藥數丸下十餘行心痞稍減越日困睡為盜劫其財貨心有所動遂躁熱而渴飲冷水一大甌是夜臍腹脹痛僧再以前藥復下十餘行病加困篤四肢無力躁熱身不停衣喜飲冷水米穀不化痢下如爛魚腸腦赤水相雜全不思食強食則嘔痞甚於前噫氣不絶足䯒冷少腹不任其痛請豫治之診其脈浮數八九至按之空虛豫溯流而尋源蓋暑天之熱已傷正氣又以有毒大熱之劑下之一下之後其所傷之物已去而無遺矣遺巴豆之氣流毒於腸胃之間使嘔逆而不能食胃氣轉傷而然及下膿血無度大肉陷下皮毛枯槁脾氣弱而衰也舌上赤澀咽乾津液不足下多亡陰之所致也陰既亡心火獨旺故心胸躁熱煩亂不安經曰獨陽不生獨陰不長夭之由也遂辭而退後易他醫醫至不審其脈不究其源惟見痞滿以枳殼丸下之病添喘滿痢下不禁而死金匱要略云不當下而強下之令人開腸洞泄便溺不禁而死此之謂也夫聖人治病用藥有法不可少越內經曰大毒治病十去其六小毒治病十去其七常毒治病十去其八無毒治病十去其九復以穀肉果菜食養盡之無使過之過則傷其正矣記有之云醫不三世不服其藥蓋慎之至也彼僧非醫流妄以大毒之劑下之太過數日之間使人殞身喪命用藥之失其禍若此病之擇醫可不謹乎戒之戒之方成勿約之失丁巳冬十一月豫從軍回至汴梁有伶人李人愛謂豫曰大兒自今歲七月間因勞役渴飲涼茶及食冷飯覺心下痞請醫治之醫投藥一服下痢兩行其症遂減不數日又傷冷物心腹復痞滿嘔吐噁心飲食無味且不飲食四肢困倦懶於言語復請前醫診視曰此病易為更利幾行即快矣遂以無憂散對加牽牛末白湯服至夕腹中雷鳴而作陳痛少焉既吐又瀉煩渴不止飲食無度不復能禁時發昏憒再命前醫視之診其脈不能措手而退頃之冷汗如洗口鼻氣漸冷而卒矣小人悔恨無及敢以為問豫曰未嘗親見不知所以然既去或曰豫親見之果藥之罪歟而非歟豫曰此非藥之罪乃失其約量之過也夫藥之無據反為氣賊內經云約方猶約囊也囊滿弗約則輸泄方成弗約則神與氣弗俱故仲景以桂枝治外傷風邪則曰若一服汗出病瘥停後服不必盡劑大承氣湯下大實大滿則曰得更衣止後服不必盡劑其慎如此此為大戒蓋得聖人約囊之旨也治病必求其本蓋李人以雜劇為戲勞神損氣而其中痛因時暑熱渴飲涼茶脾胃氣弱不能運化而作痞滿以藥下之是重困也加以不慎又損其陽虛而復傷傷而復下陰爭於內陽擾於外魄汗未藏四逆內起仲景所謂一逆尚引日再逆促命期如是則非失約量之過而何故內經戒云上工平氣中工亂脈下工絶氣不可不慎也脫營忌瀉疏五過論云常貴後賤雖不中邪病從內生名曰脫營鎮陽一士人軀幹魁梧而意氣豪雄喜交遊而有四方之志年逾三旬已入仕至五品出入從騎塞途姬侍滿前飲食起居無不如意不三年以事罷去心思鬱結憂慮不已以致飲食無味精神日減肌膚漸至瘦弱無如之何遂耽嗜於酒久而中滿始求醫醫不審得病之情輒以丸藥五粒溫水送下二十餘行時值初秋暑熱猶盛因而煩渴飲冷過多遂成腸鳴腹痛而為痢疾有如魚腦以至困篤命豫治之診其脈乍大乍小其症反覆悶亂兀兀欲吐嘆息不絶豫料曰此病難治啓玄子云神屈故也以其貴之尊榮賤之屈辱心懷慕戀志結憂惶雖不中邪病從內生血脈虛減名曰脫營或曰願聞其理黃帝針經有曰宗氣之道內谷為主谷入於胃乃傳入於脈流溢於中布散於外精專者行於經隧周而復始常營無已是為天地之紀故氣始從手太陰起注於陽明傳流而終於足厥陰循腹裡入缺盆下注肺中於是復注手太陰此營氣之所行也故晝夜氣行五十營漏水下百刻凡一萬三千五百息所謂交通者並行一數也故五十營備得盡天地之壽矣今病者始樂後苦皆傷精氣精氣竭絶形體毀阻暴喜傷陽暴怒傷陰喜怒不能自節蓋心為君主神明出焉肺為輔相主行營衛制節由之主貪人欲天理不明則十二官相使各失所司使道閉塞而不通由是則經營之氣脫去不能灌溉周身百脈失其天度形乃大傷以此養生則殃何疑之有瀉火傷胃經歷晉才卿膏粱而飲至春病衄醫曰諸見血為熱以清涼飲子投之即止越數日其疾復作醫又曰藥不勝病故也遂投黃連解毒湯既而或止止而復作易醫數四皆用苦寒之劑俱欲勝其熱然終不愈而飲食起居浸不及初肌寒而時躁言語無聲口氣臭穢如冷風然其衄之餘波則未絶也或曰諸見血者熱衄熱也熱而寒之理也今不惟不愈而反害之何哉豫言內經曰五臟以平為期又云下工絶氣不可不慎也彼惟知見血為熱而以苦寒攻之抑不知苦寒能瀉脾胃夫脾胃土也乃人身之所以為本者也今火為病而瀉其土火固未嘗除而土已病矣土病則胃虛胃虛則榮氣不能滋榮百脈元氣不循天度氣隨陰化而變無聲與肌寒也噫粗工嘻嘻以為可治言熱未已寒病復起此之謂也下工絶氣危生丁巳豫從軍至開州夏月有千戶高國用謂豫曰父親年七十有三於去歲七月間因內傷飲食又值霖雨瀉痢暴下數行醫以藥止之不數日又傷又瀉止而復傷傷而復瀉至十月間肢體瘦弱四肢倦怠飲食減少腹痛腸鳴又以李醫治之處以養臟湯治之數日泄止後添嘔吐又易以王醫用丁香人參藿香橘紅甘草同為細末生薑煎數服而嘔吐止延至今正月間飲食不進扶而後起又數日不見大便豫問醫曰父親不見大便何以治之醫曰老官人年過七旬血氣俱衰弱又況瀉痢半載脾胃久虛津液耗少以麻仁丸潤之可也衆親商議一親曰馮村牛山人見證不疑有果決遂請治之診其脈問其病曰此是風結也以搜風丸百餘丸服之利數行而死豫悔恨不已敢以為問豫曰人以水穀為本今高年老人久瀉胃中津液耗少又重瀉之神將何依靈樞經曰形氣不足病氣不足此陰陽俱不足也不可瀉之瀉之則重不足重不足則陰陽俱竭血氣皆盡五臟空虛筋骨髓枯老者絶滅少者不復矣又曰上工平氣中工亂脈下工絶氣危生絶氣危生其牛山人之謂歟用藥無據反為氣賊北京按察書吏李仲寬年五旬至元已巳春患風症半身不遂麻痹言語謇澀精神昏憒一友處一法用大黃半斤黑豆三升水一斗同煮豆熟去大黃新汲水淘淨每日服二三合則風熱自去服之過半又一友云用通聖散四物湯黃連解毒湯相合服之其效尤速服月餘精神愈困遂還真定歸家養病親舊獻方無數不能悉録又增喑啞不能言氣冷手足寒命豫診視細詢前由盡得其說豫診之六脈如蛛絲細豫謂之曰夫病有表裡虛實寒熱不等藥有君臣佐使大小奇偶之制君所服藥無考憑故病愈甚今已無救君自取耳未幾而死有吏曹通甫妻蕭氏年六旬有餘孤寒無依春月忽患風疾半身不遂言語謇澀精神昏憒口眼喎斜與李仲寬症同豫刺十二經井穴接其經絡不通又灸肩井曲池詳病時月處藥服之減半豫曰不須服藥病將自愈明年春在張子敬郎中家見其行步如舊豫嘆曰夫人病痊得不亂服藥之故由此論之李仲寬亂服藥終身不救蕭氏貧困恬憺自如內經曰用藥無據反為氣賊聖人戒之一日姚雪齊舉許先生之言曰富貴有二事反不如貧賤有過惡不能匡救有病不能醫療噫李氏之謂歟戒妄下真定鈔庫官李提舉年逾四旬體干魁梧肌肉豐盛有僚友師君告之曰肥人多風證今君如此恐後致中風搜風丸其藥推陳致新化痰宜服之李從其言遂合一料每日服之至夜下五行如是半月覺氣短而促至月餘添怠惰嗜臥便白膿小便不禁足至膝冷腰背沉痛飲食無味仍不欲食心胸痞滿時有躁熱健忘恍惚不安凡三易醫皆無效因陳其由請豫治之豫日孫真人云藥勢有所偏助令人臟氣不平藥本攻疾無疾不可餌平人谷入於胃脈道乃行水入於經其血乃成水去則榮散谷消則衛亡榮散衛亡神無所依君本身體康強五臟安泰妄以小毒之劑日下數行初服一日且推陳矣陳積已去又何推焉今飲食不為肌膚水穀不能運化精微灌溉五臟六腑周身百脈神將何依故氣短而促者真氣損也怠惰嗜臥者脾氣衰也小便不禁者膀胱不藏也便下膿血者胃氣下脫也足脛寒而逆者陽氣微也時有躁熱心下虛痞者胃氣不能上營也恍惚健忘者神明亂也金匱云不當下而強下之令人開腸洞泄便溺不禁而死前證所生非天也君自取之治雖粗安促命期矣李聞之驚恐汗浹於背起謂豫曰妄下之過悔將何及雖然君當盡心救其失豫以為病勢過半病將難痊固辭而退至秋疾甚醫以奪命散下之燥熱喘滿而死內經曰誅罰無過是謂大惑如李君者內經所謂大惑之人也衛生君子可不戒哉刺禁靈五臟之氣已絶於內而用針者反實其外是謂重竭重竭必死其死也靜治之者輒反其氣取腋與膺針經云五臟之氣已絶於內者脈氣口內絶不知者反取其外之病處與陽經之合有留針以致陽氣陽氣至則內重竭重竭則死矣其死也無氣以動故靜五臟之氣已絶於外而用針者又實其內是謂逆厥逆厥則必死其死也躁治之者反取四末針解云五臟之氣已絶於外者脈氣口外絶不知者反取其四末之輸有留針以致其陰氣陰氣至則陽氣反入入則逆逆則死矣陰氣有餘故躁難經云五臟脈絶於內者腎肝氣已絶於內也而醫反補其心肺五臟脈絶於外者心肺脈已絶於外也而醫反補其腎肝陽絶補陰陰絶補陽是謂實實虛虛損不足益有餘如此死者醫殺之耳刺之害中而不去則精泄害中而去則致氣精泄則病益甚而恇致氣則生為癰瘍無實實虛虛損不足而益有餘是謂甚病病益甚難經云假令肺實而肝虛肝者木也肺者金也金木當更相平當知金平木也假令肺實故知肝虛微少氣用針不補其肝而反重實其肺故曰實實虛虛損不足而益有餘病中工所害也取五脈者死針解云言病在中氣不足但用針盡大瀉其諸陰之脈也取三陽之脈者恇針解云言盡瀉三陽之氣令病人惟然不復也奪陰者死針解云言取尺之五里五往者也奪陽者狂針害畢矣針解云奪陽者狂正言也甲問曰針能殺生人豈不能起死人乎對曰能殺生人不能起死人者也是人之所生受氣於谷谷之所注者胃也胃者水穀之府氣血之海也海之所行雲雨者天下也胃之所出氣血者經隧也經隧者五臟六腑之大絡也迎而奪之而已矣迎之五里中道而止五至而已五往而藏之氣盡矣故五五二十五而竭其輸矣此所謂奪其天氣者也故曰窺門而刺之者死於家中入門而刺之者死於堂上黃帝曰請傳之後世以為刺禁經隧靈樞作經墜凡刺之補瀉無過其度與脈逆者無刺靈凡刺之禁新內勿刺新刺勿內已刺勿醉已醉勿刺新怒勿刺已怒勿刺新勞勿刺已刺勿勞已飽勿刺已刺勿飽已飢勿刺已刺勿飢已渴勿刺已刺勿渴大驚大恐必定其氣乃刺之乘車來者臥而休之如食頃乃刺之步行來者坐而休之如行十里頃乃刺之凡此十二禁者其脈亂氣散逆其榮衛經氣不次因而刺之則陽病入於陰陰病出於陽邪氣復生粗工不察是謂伐身形肉已奪是一奪也大奪血之後是二奪也大奪汗之後是三奪也大泄之後是四奪也新産又大下血是五奪也此皆不可瀉也素天溫日明則人血淖液而衛氣浮故血易瀉氣易行天寒日陰則人血凝泣而衛氣沉月始生則血氣始精衛氣始行月廓滿則血氣實肌肉堅月廓空則肌肉減經絡虛衛氣去形獨居是以因天時而調血氣也是以天寒無刺天溫無疑月生無瀉月滿無補月廓空無治是謂得時而調之因天之序盛虛之時移光定位正立而待之故曰月生而瀉是謂臟虛月滿而補血氣揚溢絡有留血命曰重實月廓空治是謂亂經陰陽相錯真邪不別沉以留止外虛內亂淫邪乃起八正神明論刺陽明出血氣刺太陽出血惡氣刺少陽出氣惡血刺太陰出氣惡血刺少陰出氣惡血刺厥陰出血惡氣也血氣形志篇甲神庭禁不可刺上關禁不可深令人耳無聞顱囟刺不可多出血左角刺不可久留人迎刺過深殺人雲門刺不可深使人逆息不能食缺盆刺不可過深使人逆氣五里禁不可刺手陽明經穴臍中禁不可刺伏兔禁不可刺刺五分三陽絡禁不可刺復溜刺無多見血承筋禁不可刺然谷刺無多見血乳中禁不可刺鳩尾禁不可刺靈刺上關者呿不能缺刺下關者缺不能呿刺犢鼻者屈不能伸刺兩關者伸不能屈本輸篇素春氣在經脈夏氣在孫絡長夏氣在肌肉秋氣在皮膚冬氣在骨髓中帝曰願聞其故岐伯曰春者天氣始開地氣始泄凍解冰釋水行經通故人氣在脈夏者經滿氣溢入孫絡受血皮膚充實長夏者經絡皆盛內溢肌中秋者天氣始收腠理閉塞皮膚引急冬者蓋藏血氣在中內著骨髓通於五臟是故邪氣者常隨四時之氣血而入客也至其變化不可為度然必從其經氣闢除其邪則亂氣不生帝曰逆四時而生亂氣奈何岐伯曰春刺絡脈血氣外溢令人少氣春刺肌肉血氣環逆令人上氣春刺筋骨血氣內著令人腹脹夏刺經脈血氣乃竭令人解㑊夏刺肌肉血氣內卻令人善恐夏刺筋骨血氣上逆令人善怒秋刺經脈血氣上逆令人善忘秋刺絡脈氣不外行令人臥不欲動秋刺筋骨血氣內散令人寒栗冬刺經脈血氣皆脫令人目不明冬刺絡脈內氣外泄留為大痹冬刺肌肉陽氣竭絶令人善忘凡此四時刺者大逆之病不可不從也反之則生亂氣相淫病焉故刺不知四時之經病之所生以從為逆正氣內亂與精相搏必審九候正氣不亂精氣不轉四時刺逆從論春甲乙日自乘無刺頭無發朦於耳內夏丙丁日自乘無振埃於肩喉廉泉長夏戊己日自乘四季無刺腹去爪瀉水秋庚辛日自乘無刺關節於股膝冬壬癸日自乘無刺足脛是謂五禁素黃帝問曰願聞刺要岐伯對曰病有浮沉刺有淺深各至其理無過其道過之則內傷不及則生外壅壅則邪從之淺深不得反為大賊內動五臟後生大病故曰病有在毫毛腠理者有在皮膚者有在肌肉者有在脈者有在筋者有在骨者有在髓者是故刺毫毛腠理無傷皮皮傷則內動肺肺動則秋病溫瘧溯溯然寒栗刺皮無傷肉肉傷則內動脾脾動則七十二日四季之月病腹脹煩不嗜食刺肉無傷脈脈傷則內動心心動則夏病心痛刺肉無傷筋筋傷則內動肝肝動則春病熱而筋弛刺筋無傷骨骨傷則內動腎腎動則冬病脹腰痛刺骨無傷髓髓傷則銷鑠胻酸體解㑊然不去矣刺要論凡刺之道必中氣穴無中肉節中氣穴則針遊於巷中肉節則皮膚痛補瀉反則病益篤中筋則筋緩邪氣不出與真相搏亂而不去反還內著用針不審以順為逆刺中心一日死其動為噫刺中肺三日死其動為咳刺中肝五日死其動為缺素問作語刺中脾十五日死素問作十日其動為吞刺中腎三日死素問作六日又云七日其動為嚏刺中膽一日半死其動為嘔刺中膈為傷中其病雖愈過一歲必死刺跗上中大脈血出不止死刺陰股中大脈血出不止死刺面中溜脈不幸為盲刺客主人內陷中脈為內漏為聾刺頭中腦戶入腦立死刺膝臏出液為跛刺舌下中脈太過血出不止為喑刺臂太陰脈出血多立死刺足下布絡中脈血不出為腫刺足少陰脈重虛出血為舌難以言刺郤中大脈令人僕脫色刺膺中陷中肺素曰刺膺中陷中脈為喘逆仰息刺氣衝中脈血不出為腫鼠𪖈刺肘中內陷氣歸之為不屈伸刺脊間中髓為傴刺陰股下三寸內陷令人遺溺刺乳上中乳房為腫根蝕刺腋下脅間內陷令人咳刺缺盆中內陷氣泄令人喘咳逆刺少腹中膀胱溺出令人少腹滿刺手魚腹內陷為腫刺腨腸內陷為腫刺匡上陷骨中脈為漏為盲刺關節中液出不得屈伸俱出刺禁篇灸禁垣針經云陷下則灸之天地間無他惟陰與陽二氣而已陽在外在上陰在內在下今言陷下者陽氣下陷入陰血之中是陰反居其上而覆其陽脈證俱見寒在外者則灸之異法方宜論云北方之人宜灸焫也為冬寒大旺伏陽在內皆宜灸之以至理論之則腎主藏藏陽氣在內冬三月主閉藏是也太過則病固宜灸焫此陽火陷入陰水之中是也難經云熱病在內取會之氣穴為陽陷入陰中取陽氣通天之竅穴以火引火而導之此宜灸焫也若將有餘之病一概灸之豈不誤哉仲景云微數之脈慎不可灸因火為邪則為煩逆追虛逐實血散脈中火氣雖微內攻有力焦骨傷筋血難復也又云脈浮宜以汗解用火灸之邪無從出因火而盛病從腰以下必重而痹名火逆也脈浮熱甚而反灸之此為實實而虛治因火而動必咽燥唾血又云身之穴三百六十有五其三十六穴灸之有害七十九穴刺之為災並中髓也仲景傷寒例第三十按明堂針經各條下所說禁忌明矣內經云脈之所見邪之所在脈沉者邪氣在內脈浮者邪氣在表世醫只知脈之說不知病症之禁忌若表見寒證身汗出身常清數栗而寒不渴欲覆厚衣常惡寒手足厥皮膚燥枯其脈必沉細而遲但有一二症皆宜灸之陽氣下陷故也若身熱惡熱時見躁作或面赤面黃咽乾嗌乾口乾舌上黃赤時渴咽嗌痛皆熱在外也但有一二症皆不宜灸其脈必浮數或但數而不浮亦不可灸灸之則災害立生若有鼻不聞香臭鼻流清涕眼瞼時癢或缺或嚏惡寒其脈必沉是脈證相應也或輕手得弦緊者是陰伏其陽血雖面赤宜灸之不可拘於面赤色而禁之也更有腦痛惡寒者雖面赤亦宜灸風府一穴若帶偏腦痛更惡風者邪在少陽宜灸風池無灸風府然艾炷不宜大但如小麥粒一七壯足矣若多灸艾炷大防損目四十五難曰八會者何也然府會太倉藏會季脅筋會陽陵泉髓會絶骨血會膈俞骨會大杼脈會太淵氣會三焦外一筋宜兩乳內也熱病在內者取其會之氣穴東垣辨之矣內經中說熱病在內取會之氣穴皆陷下者灸之從陰引陽於背腧府會太倉太倉者中脘也是六腑六陽之總稱也藏會季脅者脾之募也在腰背腹募之間與臍平是兩儀之間也五臟六腑陽陷者皆取脾胃是萬物有餘皆出於土也脾者五臟之總稱也帶脈者脾之附經血又其別稱也血會鬲俞鬲俞者背之上也骨會大杼大杼者背也髓會絶膏絶骨者是骨名也在足外踝上也乃是少陽之分筋會陽陵泉陽陵泉者足少陽經中膝下外側也脈會太淵太淵者兩寸脈也氣會膻中膻中者兩乳是也熱病在內取會之氣穴者謂熱陷於內故取百會之穴以灸伸之此為陷下者炙之非太過不及本經所生自病中它邪者乃以經取之也恐後學所疑復明其理以證之陷者皮毛不任風寒知陽氣下陷也其脈中得必細弦而緊小或沉澀覆其上知其熱火陷下也雖脈八九至甚數而陰脈覆其上者皆可灸陰脈者細弦緊小沉澀如上說是也頭維禁不可灸承光禁不可灸腦戶禁不可灸風府禁不可灸灸之不幸使人喑喑門禁不可灸灸之使人喑耳門耳中有膿不可灸下關耳中有干米適不可灸人迎禁不可灸絲竹空禁不可灸灸之不幸使人目小及盲承泣禁不可灸脊中禁不可灸白環俞禁不可灸乳中禁不可灸石門女子禁不可灸氣衝灸之不得息淵液禁不可灸鳩尾禁不可灸陰市禁不可灸陽關禁不可灸天府禁不可灸使人逆氣伏兔禁不可灸地會五禁不可灸使人瘦瘈脈禁不可灸經渠禁不可灸傷人神
