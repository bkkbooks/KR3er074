body:
  text: 卷之四十內經運氣類注五運六氣總論黃帝問曰天有五行御五位以生寒暑燥濕風人有五臟化五氣以生喜怒思憂恐論言五運相襲而皆治之終期之日周而復始豫已知之矣願聞其與三陰三陽之候奈何合之鬼臾區再拜稽首對曰昭乎哉問也夫五運陰陽者天地之道也萬物之綱紀變化之父母生殺之本始神明之府也可不通乎故物生謂之化物極謂之變陰陽不測謂之神神用無方謂之聖夫變化之為用也在天為玄在人為道在地為化化生五味道生智玄生神神在天為風在地為木在天為熱在地為火在天為濕在地為土在天為燥在地為金在天為寒在地為水故在天為氣在地成形形氣相感而化生萬物矣然天地者萬物之上下也左右者陰陽之道路也水火者陰陽之徵兆也金木者生成之終始也氣有多少形有盛衰上下相召而損益彰矣帝曰願聞五運之主時也何如鬼臾區曰五氣運行各終期日非獨主時也帝曰請問其所謂也鬼臾區曰臣積考太始天元冊文曰太虛寥廓肇基化元萬物資始五運終天布氣真靈總統坤元九星懸朗七曜周旋曰陰曰陽曰柔曰剛幽顯既位寒暑弛張生生化化品物咸彰臣斯十世此之謂也天元紀大論此一章論五運六氣之端變化盛虛之始也五運者地之木火土金水治政令於內者也三陰三陽者天之風熱濕燥寒治政令於外者也帝問五運相襲而治者其與三陰三陽外治之候如何合之鬼臾區答五運陰陽之治乃天地之道萬物之綱紀變化之父母生殺之本始神明之府也故其治也物生謂之化物極謂之變陰陽莫測之謂神神用無方謂之聖其變化神聖謂之用在天則為風熱濕燥寒三陰三陽之氣在地則風之氣為木熱之氣為火濕之氣為土燥之氣為金寒之氣為水而成五運之形故在天之形與地相感而萬物育以為物生之化也然天地者萬物之上下左右者陰陽之道路此在天三陰三陽之氣右旋於外以加地也水火者陰陽之徵兆金木者生成之終始此在地五運之形左轉於內以臨天也天上之氣有多少地下之形有盛衰故天上多少之氣與地下盛衰之形相召而損益彰以為物極之變也其氣之多與形之盛相召者益益為變之盛也氣之少與形之衰相召者損損為變之虛也蓋物生之化者天地之常氣在五運曰平氣在六氣曰常化也物極之變者天地之變氣在五運曰太過不及在六氣曰淫勝反勝相勝也其變之盛者則五運之太過六氣之淫勝也其變之虛者則五運之不及六氣之反勝相勝也凡此五運六氣所謂變化盛虛經後篇千言萬語皆所以反覆發明此四者學者當潛心以究之也五運氣行各終期日非獨主時者言木火土金水治政各終一歲之期日不獨治歲內六步之時令也蓋經於前篇但論五運不及六氣但論主時不及治歲今始於此篇論五運六氣相感相召而治不獨五運也次論五運各治一歲不獨主時也帝曰善何謂氣有多少形有盛衰鬼臾區曰陰陽之氣各有多少故曰三陰三陽也形有盛衰謂五行之氣各有太過不及也故其始也有餘而往不足隨之不足而往有餘從之知迎知隨氣可與期應天為天符承歲為歲直三合為治帝曰上下相召奈何鬼臾區曰寒暑燥濕風火天之陰陽也三陰三陽上奉之木火土金水地之陰陽也生長化收藏下應之天以陽生陰長地以陽殺陰藏天有陰陽地亦有陰陽木火土金水地之陰陽也生長化收藏故陽中有陰陰中有陽所以欲知天地之陰陽者應天之氣動而不息故五歲而右遷應地之氣靜而守位故六期而環會動靜相召上下相臨陰陽相錯而變由生也帝曰上下周紀其有數乎鬼臾區曰天以六為節地以五為制周天氣者六期為一備終地紀者五歲為一周君火以明相火以位五六相合而七百二十氣為一紀凡三十歲千四百四十氣凡六十歲而為一周不及太過斯皆見矣帝曰夫子之言上終天氣下畢地紀可謂悉矣余願聞而藏之上以治民下以治身使百姓昭著上下和親德澤下流子孫無憂傳之後世無有終時可得聞乎鬼臾區曰至數之機迫迮以微其來可見其往可追敬之者昌慢之者亡無道行私必得夭殃謹奉天道請言真要帝曰善言始者必會於終善言近者必知其遠是則至數極而道不惑所謂明矣願夫子推而次之令有條理簡而不匱久而不絶易用難忘為之紀綱至數之要願盡聞之鬼臾區曰昭乎哉問明乎哉道如鼓之應桴響之應聲也臣聞之甲己之歲土運統之乙庚之歲金運統之丙辛之歲水運統之丁壬之歲木運統之戊癸之歲火運統之帝曰其於三陰三陽合之奈何鬼臾區曰子午之歲上見少陰丑未之歲上見太陰寅申之歲上見少陽卯酉之歲上見陽明辰戌之歲上見太陽巳亥之歲上見厥陰少陰所謂標也厥陰所謂終也厥陰之上風氣主之少陰之上熱氣主之太陰之上濕氣主之少陽之上相火主之陽明之上燥氣主之太陽之上寒氣主之所謂本也是謂六元帝曰光乎哉道明乎哉論請著之玉版藏之金匱署曰天元紀天元紀大論此一章覆論前章氣有多少形有盛衰上下相召之義也陰陽之氣各有多少者夫三陰三陽之氣各分多少陰多者太陰次少者少陰又次者厥陰也陽多者太陽次少者陽明又次者少陽也形有盛衰謂五行之治各有太過不及者地五運之形各有盛衰土有大少宮金有大少商水有大少羽木有大少角火有大少徵而大者太過少者不及也上下相召者天右旋之陰陽加於地下地左轉之陰陽臨於天上上下加臨而相召治歲步也天之陰陽風熱燥濕寒又增火為六數者在天之熱分為暑火二氣故三陰三陽各上奉之也地之陰陽木火土金水亦增火為六數者在地之火分為君相二形故生長化收藏各下應之也其天之陰陽下加地氣共治歲也則應天之氣動而不息蓋地之治歲君火不主運惟五運循環故天之六氣加之常五歲右餘一氣與地遷移一位而動不息也地之陰陽上臨天氣共治步也則應地之氣靜而守位蓋地之治步其木君相土金水無殊皆各主一步以終期故其上臨天之六氣共治也常六期齊周復於始治之步環會而靜守位也故治歲動者與治步靜者相召外旋上者與內運下者相臨則陰陽相錯而損益盛虛之變所由生也天以六為節地以五為制者上下相召之數也蓋天之六氣各治一歲故六期一備地之六位其君火以明相火以位故五歲一周五六相合凡三十歲為一紀六十歲為一周其間相錯之陰或氣類同多而益為太過之盛者或氣類異少而損為不及之虛者斯皆可見其變也甲己之歲土運統之乙庚之歲金運統之丙辛之歲水運統之丁壬之歲木運統之戊癸之歲火運統之地五位一周之數也子午之歲上見少陰熱氣丑未之歲上見太陰濕氣寅申之歲上見少陽相火卯酉之歲上見陽明燥氣辰戌之歲上見太陽寒氣巳亥之歲上見厥陰風氣者天六期一備之數也天地之數五而火熱居三可見天地間熱多於寒火倍於水而人之病化從可推也黃帝坐明堂始正天綱臨觀八極考建五常請天師而問之曰論言天地之動靜神明為之紀陰陽之升降寒暑彰其兆余聞五運之數於夫子夫子之所言正五氣之各主歲耳首甲定運余因論之鬼臾區曰土主甲己金主乙庚水主丙辛木主丁壬火主戊癸子午之上少陰主之丑未之上太陰主之寅申之上少陽主之卯酉之上陽明主之辰戌之上太陽主之巳亥之上厥陰主之不合陰陽其故何也岐伯曰是明道也此天地之陰陽也夫推之可數者人中之陰陽也然所合數之可得者也夫陰陽者數之可十推之可百數之可千推之可萬天地陰陽者不以數推以象之謂也帝曰願聞其所始也岐伯曰昭乎哉問也臣覽天元冊文丹天之氣經於牛女戊分黅天之氣經於心尾己分蒼天之氣經於危室柳鬼素天之氣經於氐亢昴畢玄天之氣經於張翼婁胃所謂戊己分者奎壁角軫則天地之門戶也夫候之所始道之所生不可不通也五運行大論此一章覆論前章五運六氣所化陰陽之義也其論五天之象所經星宿為運氣之化皆干與支同屬者及連位者齊化也土主甲己及丑未之上太陰主之者黅天之氣經於心尾己分之象而心尾者甲地己分者中宮故甲與五連位己與未同屬齊化濕土也金主乙庚及卯酉之上陽明主之者素天之氣經於亢氐昴畢之象而氐亢者乙地昴畢者庚地故乙與卯同屬庚與酉同屬齊化燥金也水主丙辛及辰戌之上太陽主之者玄天之氣經於張翼婁胃之象而張翼者丙地婁胃者辛地故丙與辰連位辛與戌連位齊化寒水也木主丁壬及巳亥之上厥陰主之者蒼天之氣經於危室柳鬼之象而危室者壬地柳鬼者丁地故壬與亥同屬丁與巳同屬齊化風木也火主戊癸及子午之上少陰主之寅申之上少陽主之者丹天之氣經於牛女戊分之象而牛女者癸地戊分者中宮故癸與子同屬戌與午連位齊化火熱也干之甲乙屬木位東丙丁屬火位南庚辛屬金位西壬癸屬水位北戊己屬土位中宮支之寅卯配甲乙巳午配丙丁申酉配庚辛亥子配壬癸辰位東南未位西南戌位西北醜位東北為四維屬戊己故乙卯同屬木丁巳同屬火己未同屬土庚酉同屬金壬癸亥子同屬水也甲寅位東之首癸丑位北方尾而甲醜連位癸寅連位也丙位南之首辰位東之尾而丙辰連位也戌己位木火金水中間在天地為門戶在四時為長夏南連午西連申而戊己午申連位故戊己無方位而經獨言戊分己分者表章之也辛戌皆位酉之尾而辛戌連位也獨戊火連申夾未土於中癸火連寅夾醜土於中者蓋濕土在中火遊行其間在天居土前在地居土後而土火常相混也故土旺長夏火熱之內丹溪深悟此理發明濕熱相火為病十居八九及有濕鬱生熱熱久生濕之論良以此也其五天之象所經星宿分野獨當五運之干位不及六氣之支位者蓋干之與支即根本之與枝葉經言干則支在其中矣故其化皆干與支之同屬者連位齊化者是根本與枝葉同化者也或曰近世獨以五運之化為出五天之象六氣之化不言五天之象但將正化對化立說以土正化於未對化於醜金正化於酉對化於卯水正化於戌對化於辰木正化於亥對化於巳君火正化於午對化於子相火正化於寅對化於申又以未酉戌亥午寅之正化為實無勝復醜卯辰巳子申之對化為虛有勝復今子所釋經文一以運氣之化皆出五天之氣與彼說異者何也曰經旨皎如日星好事者鑿此正化對化之說也謹按經文帝悉陳五運之干六氣之支一併設問非獨問五運不及六氣也岐伯之答亦以五天之象所經星宿一併答五運之干六氣之支非獨答五運而分出六支不答也今何為不究經旨擅將運氣分作二義妄撰正化對化異說上亂聖經下惑後學而作軒岐之罪人也至於勝復之說經但以子午寅申辰戌六歲之紀氣化大而先天無勝復未聞未酉亥氣化少者為實無勝復以丑未卯酉巳亥六歲之紀氣化少而後天有勝復未聞子辰申氣化大者為虛有勝復也帝曰善論言天地者萬物之上下左右者陰陽之道路未知其所謂也岐伯曰所謂上下者歲上下見陰陽之所在也左右者諸上見厥陰左少陰右太陽見少陰左太陰右厥陰見太陰左少陽右少陰見少陽左陽明右太陰見陽明左太陽右少陽見太陽左厥陰右陽明所謂面北而命其位言其見也帝曰何謂下岐伯曰厥陰在上則少陽在下左陽明右太陰少陰在上則陽明在下左太陽右少陽太陰在上則太陽在下左厥陰右陽明少陽在上則厥陰在下左少陰右太陽陽明在上則少陰在下左太陰右厥陰太陽在上則太陰在下左少陽右少陰所謂面南而命其位言其見也上下相遘寒暑相臨氣相得則和不相得則病帝曰氣不相得而病者何也岐伯曰以下臨上不當位也帝曰動靜何如岐伯曰上者右行下者左行左右周天余而復會也帝曰余聞鬼臾區曰應地者靜今夫子乃言下者左行不知其所謂也願聞何以生之乎岐伯曰天地動靜五行遷復雖鬼臾區言其上候而已猶不能遍明夫變化之用天垂象地成形七曜緯虛五行麗地地者所以載生成之形類也虛者所以列應天之精氣也形精之動猶根本之與枝葉也仰觀其象雖遠可知也帝曰地之為下否乎岐伯曰地為人之下太虛之中者也帝曰憑乎岐伯曰大氣舉之也燥以干之暑以蒸之風以動之濕以潤之寒以堅之火以溫之故風寒在下燥熱在上濕氣在中火遊行其間寒暑六入故令虛而化生也故燥勝則地干暑勝則地熱風勝則地動濕勝則地泥寒勝則地裂火勝則地固矣帝曰天地之氣何以候之岐伯曰天地之氣勝復之作不形於診也脈法曰天地之變無以脈診此之謂也帝曰間氣何如岐伯曰隨氣所在期於左右帝曰期之奈何岐伯曰從其氣則和違其氣則病不當其位者病迭移其位者病失守其位者危尺寸反者死陰陽交者死先立其年以知其氣左右應見然後乃可以言死生之逆順帝曰寒暑燥濕風火在人合之奈何其於萬物何以生化岐伯曰東方生風風生木木生酸酸生肝肝生筋筋生心其在天為玄在人為道在地為化化生五味道生智玄生神化生氣神在天為風在地為木在體為筋在氣為柔在臟為肝其性為暄其德為和其用為動其色為蒼其化為榮其蟲毛其政為散其令宣發其變摧拉其眚為隕其味為酸其志為怒怒傷肝悲勝怒風傷肝燥勝風酸傷筋辛勝酸南方生熱熱生火火生苦苦生心心生血血生脾其在天為熱在地為火在體為脈在氣為息在臟為心其性為暑其德為顯其用為燥其色為赤其化為茂其蟲羽其政為明其令鬱蒸其變炎爍其眚燔焫其味為苦其志為喜喜傷心恐勝喜熱傷氣寒勝熱苦傷氣咸勝苦中央生濕濕生土土生甘甘生脾脾生肉肉生肺其在天為濕在地為土在體為肉在氣為充在臟為脾其性靜兼其德為濡其用為化其色為黃其化為盈其蟲裸其政為謐其令雲雨其變動注其眚淫潰其味為甘其志為思思傷脾怒勝思濕傷肉風勝濕甘傷脾酸勝甘西方生燥燥生金金生辛辛生肺肺生皮毛皮毛生腎其在天為燥在地為金在體為皮毛在氣為成在臟為肺其性為涼其德為清其用為固其色為白其化為斂其蟲介其政為徑其令霧露其變肅殺其眚蒼落其味為辛其志為憂憂傷肺喜勝憂熱傷皮毛寒勝熱辛傷皮毛苦勝辛北方生寒寒生水水生咸咸生腎腎生骨髓髓生肝其在天為寒在地為水在體為骨在氣為堅在臟為腎其性為凜其德悽愴其用為藏其色為黑其化為肅其蟲鱗其政為靜其令為寒其變凝冽其眚冰雹其味為咸其志為恐恐傷腎思勝恐寒傷血燥勝寒咸傷血甘勝咸五氣更立各有所先非其位則邪當其位則正帝曰病之生變何如岐伯曰氣相得則微不相得則甚帝曰主歲何如岐伯曰氣有餘則制己所勝而侮所不勝其不及則己所不勝侮而乘之己所勝輕而侮之侮反受邪侮而受邪寡於畏也五運行大論此一章論天右旋於外而寒暑六入以舉其地地受天六入以為五行左轉化生人物於天之中也天地萬物之上下左右陰陽之道路者天右旋六節之位也上下謂在上者司天之位在下者在泉之位左右謂在上之左右者天左間右間之位在下之左右者泉左間右間之位也故天之三陰三陽於其六位右旋如巳亥歲上見厥陰而左間少陰右間太陽至子午歲厥陰右旋下降則上見少陰而左間太陰右間厥陰常如此逐歲自上旋降於右也面北命其位言其見者謂司天之位在南而面北命其左右則西南為左間之位東南為右間之位而言其所見之陰陽也厥陰在上則少陽在下而左間陽明右間太陰至厥陰右旋下降而少陰在上則陽明在下而左間太陽右間少陽常如此隨司天旋轉也面南命其位言其見者謂地之位在北而面南命其左右則東北為左間之位西北為右間之位而言其所見之陰陽也自天地萬物之上下至此獨論天右旋之氣也上下相遘寒暑相臨氣相得則和不相得則病者言天之右旋繞地方位而其氣與地方位氣相遘相臨其遘同類相生之氣則和不同類相制之氣則病也或氣雖同類相得亦病者惟相火臨於君火為不當位故也經下篇云君位臣則順臣位君則逆逆則病近害速者是也動靜何如者帝謂天動能臨於地地靜不能臨天而難上下相遘寒暑相臨之語也岐伯答上者右行下者左行則知天常於上自右降東南而旋回以臨地地常於下自左升東北而循顯明木君相土金水之位循環臨天而皆動也故左右臨動各皆周天過則復相會也然天之右行即歷家退度之右行其實皆如地之左行而東升西降也應地者靜帝復難下者左行之言也岐伯答天地之體動靜雖殊而其用之變化在地則五行麗地而載生成之形類運於內在天則七曜緯虛而列應天之精氣運於外其形類與精氣之相隨運動猶根本之與枝葉同乎一氣而不殊故但仰觀七曜之象周旋雖遠可知其動也自上下相遘至此通論天右旋地左轉之氣也地之為下否乎者帝謂天象周旋皆轉於地下而地居其上今曰下者左行則地之左行為下得非否乎岐伯答地為人之下太虛之中者則上下之義始明矣蓋以其所屬言之則司天在泉之氣屬天者為上五行之屬地者為下以其所在言之則司天者為上在泉者為下而地之五行居中岐伯以所屬言之故曰下者左行帝以所在言之故難地之左行非下也憑附也地居太虛之中何所憑附而不墜也大氣舉之謂風寒暑濕燥火六節大氣旋轉於外任持其地而干蒸動潤堅濕以入其體也故其入也風寒在下而風居東寒居北燥熱在上而燥居西熱居南濕氣在中而居中央火於未入之前在濕上已入之後在濕下而遊行上下之間也自地之為下至此原地氣一皆本乎天也候診候也言天地之氣及勝復之作統貫六位難以診候唯間氣偏治一位故可隨其所在期之於尺寸左右也凡期之之法陽之所在其脈應陰之所在其脈不應故北政之歲人氣面北而寸北尺南地左間之氣在右寸右間之氣在左寸天左間之氣在左尺右間之氣在右尺所以少陰在泉則左間太陰右間厥陰而兩寸俱不應厥陰在泉則左間少陰而右寸不應太陰在泉則右間少陰而左寸不應少陰司天則左間太陰右間厥陰而兩尺俱不應厥陰司天則左間少陰而左尺不應太陰司天則右間少陰而右尺不應也南政之歲人氣面南而寸南尺北天左間之氣在右寸右間之氣在左寸地左間之氣在左尺右間之氣在右尺所以少陰司天則左間太陰右間厥陰而兩寸俱不應厥陰司天則左間少陰而右寸不應太陰司天則右間少陰而左寸不應少陰在泉則左間太陰右間厥陰而兩尺俱不應厥陰在泉則左間少陰而左尺不應太陰在泉則右間少陰而右尺不應也從其氣則和者陰陽各當尺寸本位也違其氣則病者陰陽或不當其位或迭移其位或失守其位或尺寸反或陰陽交也不當其位者謂陰陽之見不當尺寸本位也迭移其位者謂陰陽迭皆移轉一位也假如南政少陰司天陰皆在寸陽皆在尺迭皆左轉者則陰皆移左而左不應陽皆移右而右應迭皆右轉者則陰皆移右而右不應陽皆移左而左應之類是也失守其位者謂本位他位皆失守不見也如陰失守則尺寸皆無陰陽失守則尺寸皆無陽非如迭移而相反相交見於他位也尺寸反者假如北政少陰司天陽在寸陰在尺而陽反見尺陰反見寸之類是也陰陽交者假如北政太陰司天陽在左陰在右而陽反見右陰反見左之類是也寒暑燥濕風火在人合之奈何其於萬物何以生化者言天外旋轉大氣六入地中生化人物其在人臟腑形體者如何合之在萬物如何生化也東方生風者天六入之風居東方地體中為生生之始也自風而生木酸肝筋心矣凡東方性用德化政令之類皆本乎風而內合人之肝氣者也故肝居左象風之生於東筋為屈伸象風之動也南方生熱者天六入之熱居南方地體中為生長之始也自熱而生火苦心血脾矣凡南方性用德化政令之類皆本乎熱而內合人之心氣者也故心居前象熱之生於南血為人之神象火之明曜也中央生土者天六入之濕居中央地體中為生化之始也自濕而生土甘脾肉肺矣凡中央性用德化政令之類皆本乎濕而內合人之脾氣者也故脾居腹象濕之生於中央肉充一身象土之充實大地也西方生燥者天六入之燥居西方地體中為生收之始也自燥而生金辛肺皮毛腎矣凡西方性用德化政令之類皆本乎燥而內合人之肺氣者也故肺居右象燥之生於西皮毛乾於身表象氣之燥也北方生寒者天六入之寒居北方地體中為生藏之始也自寒而生水咸腎骨肝矣凡北方性用德化政令之類皆本乎寒而內合人之腎氣者也故腎居後象寒之生於北骨為百骸象寒之堅也五氣更立各有所先其所先非其位則邪當其位則正者謂前五方之氣各治一部之令者也五氣更立治令皆各有所先其所先者風之立非春令熱之立非夏令濕之立非長夏令燥之立非秋令寒之立非冬令是皆非其位之立為勝復之邪也風當春令立熱當夏令立濕當長夏令立燥當秋令立寒當冬令立是皆當其位之立為本氣之正也氣相得則微不相得則甚者言非位所立之邪生變之病其邪與治令之氣相得則病微不相得則病甚也主氣者亦謂前五方之氣各治一歲之政者也歲氣有餘則制所勝而侮所不勝如歲木治政之氣有餘則制土氣而濕化減少侮金氣而風化大行也其不及則己所不勝侮而乘之己所勝輕而侮之如歲木治政之氣不及則金氣勝侮而乘之燥化乃行土氣輕而侮之濕氣反布也侮反受邪侮而受邪寡於畏者金侮木不及從而乘之則木之子火報復其勝而侮金反受邪也侮金受邪則其不及之木寡於畏而氣復疏伸也自天地之氣何以候至此原人氣一皆本乎天也乙丙丁戊庚辛壬癸八干每干六歲通該四十八歲甲己通該十二歲黃帝問曰嗚呼遠哉天之道也如迎浮雲若視深淵視深淵尚可測迎浮雲莫知其極夫子數言謹奉天道余聞而藏之心私異之不知其所謂也願夫子溢志盡言其事令終不滅久而不絶天之道可得聞乎岐伯對曰明乎哉問天之道也此因天之序盛衰之時也帝曰願聞天道六六之節盛衰何也岐伯曰上下有位左右有紀故少陽之右陽明治之陽明之右太陽治之太陽之右厥陰治之厥陰之右少陰治之少陰之右太陰治之太陰之右少陽治之此所謂氣之標蓋南面而待之者也故曰因天之序盛衰之時移光定時正立而待之此之謂也少陽之上火氣治之中見厥陰陽明之上燥氣治之中見太陰太陽之上寒氣治之中見少陰厥陰之上風氣治之中見少陽少陰之上熱氣治之中見太陽太陰之上濕氣治之中見陽明所謂本也本之下中之見也見之下氣之標也本標不同氣應異象帝曰其有至而至有至而不至有至而太過何也岐伯曰至而至者和至而不至來氣不及也未至而至來氣有餘也帝曰至而不至未至而至何如岐伯曰應則順否則逆逆則變生變生則病帝曰善請言其應岐伯曰物生其應也氣脈其應也六微旨大論此一章論天之陰陽右周天道之常所謂上者右行者也天道六六之節盛衰者天之三陰三陽右旋天外更治歲政每歲各一盛衰至六歲周遍通得盛衰之節六六也上下有位左右有紀者謂每歲陰陽盛衰之位上下謂司天在泉二位也左右謂司天之左間右間及在泉之左間右間為四紀也凡天右旋之陰陽臨司天之位者其天之政盛至三之氣始布臨在泉之位者其地之氣盛至終之氣始布而上下二位有二節陰陽盛衰也臨司天之左間者其氣至四之氣盛右間者其氣至二之氣盛臨在泉之左間者其氣至初之氣盛右間者其氣至五之氣盛而左右四紀有四節陰陽盛衰也故此六節陰陽每歲各一盛衰而數得六寅申歲少陽旋來司天治之為初六少陽之右卯酉歲陽明旋來司天治之為六二陽明之右辰戌歲太陽旋來司天治之為六三太陽之右巳亥歲厥陰旋來司天治之為六四厥陰之右子午歲少陰旋來司天治之為六五少陰之右丑未歲太陰旋來司天治之為六六太陰之右周而復始於少陽治之故曰六六之節盛衰也凡此三陰三陽為治之氣皆所謂六氣之標也南面待之者明前少陽之右云云皆南面立而待之乃右居西而從西旋過東也少陽之上火氣治之中見厥陰陽明之上燥氣治之中見太陰太陽之上寒氣治之中見少陰厥陰之上風氣治之中見少陽少陰之上熱氣治之中見太陽太陰之上濕氣治之中見陽明者其火燥風寒熱濕為治之氣皆所謂六氣之本也其中見之氣乃六氣之中氣也通前六氣之標言之則本居上標居下中氣居本標之中故曰本之下中之見也見之下氣之標也中氣者三陰三陽各猶夫婦之配合相守而人之臟腑經脈皆應之也故少陽本標之中見厥陰厥陰本標之中見少陽而互為中氣相守則人之膽三焦少陽經亦絡肝心包肝心包厥陰經亦絡膽三焦而互交也陽明本標之中見太陰太陰本標之中見陽明而互為中氣相守則人之胃大腸陽明經亦絡脾肺脾肺太陰經亦絡胃大腸而互交也太陽本標之中見少陰少陰本標之中見太陽而互為中氣相守則人之膀胱小腸太陽經亦絡腎心腎心少陰經亦絡膀胱小腸而互交也本標不同氣應異象者謂太陽少陰二氣也太陽之上寒氣治之是標陽本寒不同其氣應則太陽所至為寒生中為溫而寒溫異象也少陰之上熱氣治之是標陰本熱不同其氣應則少陰所至為熱生中為寒而熱寒異象也至於脈從病反如瓜甜蒂苦蔥白葉青參補蘆瀉麻黃髮汗根節止汗之類皆太陽少陰本標不同之氣異象也其有至而至有至而不至有至而太過者言陰陽旋來治歲之候至而其氣化亦應候至者為至而至者和也候至而其氣化不至者為至而不至旋來之氣不及也候未至而氣化先至者為未至而至旋來之氣有餘也故氣化應候至者為順未至而至至而不至者為逆逆則勝復之變生變生則病作矣物生其應氣脈其應者覆說應則順之義也經所謂厥陰所至為風生之類是物生之應厥陰之至其脈弦之類是氣脈之應也少陽治寅申歲六節盛衰陽明治卯酉歲六節盛衰太陽治辰戌歲六節盛衰厥陰治巳亥歲六節盛衰少陰治子午歲六節盛衰太陰治丑未歲六節盛衰火燥寒風熱濕為本三陰三陽為標本標之中見者為中氣少陽之上火氣治之中見厥陰厥陰之上風氣治之中見少陽陽明之上燥氣治之中見太陰太陰之上濕氣治之中見陽明太陽之上寒氣治之中見少陰少陰之上熱氣治之中見太陽五臟六腑為本十二經絡為標本標之間所絡者為中氣臟腑之本居里中氣居表裡之間經脈之標為表足少陽屬膽絡肝手少陽屬三焦絡心包足厥陰屬肝絡膽手厥陰屬心包絡三焦足陽明屬胃絡脾手陽明屬大腸絡肺足太陰屬脾絡胃手太陰屬肺絡大腸足太陽屬膀胱絡腎手太陽屬小腸絡心足少陰屬腎絡膀胱手少陰屬心絡小腸帝曰善願聞地理之應六節氣位何如岐伯曰顯明之右君火之位也君火之右退行一步相火治之復行一步土氣治之復行一步金氣治之復行一步水氣治之復行一步木氣治之復行一步君火治之相火之下水氣承之水位之下土氣承之土位之下風氣承之風位之下金氣承之金位之下火氣承之君火之下陰精承之帝曰何也岐伯曰亢則害承乃制制則生化外列盛衰害則敗亂生化大病帝曰盛衰何如岐伯曰非其位則邪當其位則正邪則變甚正則微帝曰何謂當位岐伯曰木運臨卯火運臨午土運臨四季金運臨酉水運臨子所謂歲會氣之平也帝曰非位何如岐伯曰歲不與會也帝曰土運之歲上見太陰火運之歲上見少陽少陰金運之歲上見陽明木運之歲上見厥陰水運之歲上見太陽奈何岐伯曰天之與會也故天元冊曰天符帝曰天符歲會何如岐伯曰太乙天符之會也帝曰其貴賤何如岐伯曰天符為執法歲位為行令太乙天符為貴人帝曰邪之中也奈何岐伯曰中執法者其病速而危中行令者其病徐而持中貴人者其病暴而死帝曰位之易也何如岐伯曰君位臣則順臣位君則逆逆則其病近其害速順則其病遠其害微所謂二火也六微旨大論此一章論地之陰陽左運地理之常所謂下者左行者也地理應六節氣位者地之四方分為六步更治時令以應天外六節氣位之治也顯明之右君火之位者日出顯明卯地之右在方屬東南在時屬春分卯中之後為君火之位也君火之右退行一步相火治之者地氣至南方相火位行令治夏至前後三之氣以應司天之政布其運主戊癸歲以應司天之政治歲也復行一步土氣治之者地氣至西南土位行令治秋分前四之氣以應司天左間之氣盛其運主甲己歲以應司天之政治歲也復行一步金氣治之者地氣至西北金位行令治秋分後五之氣以應在泉右間之氣其運主乙庚歲以應司天之政治歲也復行一步水氣治之者地氣至北方水位行令治冬至前後終之氣以應在泉之氣布其運主丙辛歲以應司天之政治歲也復行一步木氣治之者地氣至東北木位行令治春分前初之氣以應在泉左間之氣盛其運主丁壬歲以應司天之政治歲也復行一步君火治之者地氣至東南君火位行令治春分後二之氣以應司天右間之氣盛其運周歲相火代之不主歲也凡此六步治令之時各行本方之氣入於中國故木於東方治令時春氣西行而中國皆東方溫氣與泉左間所居之氣也君相於南方治令時夏氣北行而中國皆南方熱氣與天右間所居之氣也金於西方治令時秋氣東行而中國皆西方涼氣與天左間所居之氣也水於北方治令時冬氣南行而中國皆北方寒氣與泉右間所居之氣也六氣之下各有所制之氣承之者蓋五行之氣一極則一生而循環相承無一息間斷也相火之下水氣承之者夏相火極水生承之從微漸化至冬著也水位之下土氣承之者冬水極土生承之從微漸化至長夏著也土位之下木氣承之者長夏土極木生承之從微漸化至春著也水位之下金氣承之者春木極金生承之從微漸化至秋著也金位之下火氣承之者秋金極火生承之從微漸化至夏著也君火之下陰精承之者夏君火極陰精承之從微漸化至冬著也其意與陰陽家水胎於午金胎於卯等說大同小異而皆循環相承以為胎也亢過極也亢則害承乃制制則生化外列盛衰害則敗亂生化大病者言六位之氣過極則必害作承氣乃生於下制之使不過也故制則從微化著承者自外列盛極者自外列衰而生化循環害作則敗壞擾亂而生化大病也盛衰非其位則邪當其位則正者覆明上文制則生化外列盛衰之盛衰也蓋制亢下承生化之盛衰惟歲氣和平則其所化循序漸進從微至著而皆當六位之正其歲氣有太過不及則其所化無序或躐等陵節或乘危往勝故變或兼化而為半非其位之邪變或復勝而為全非其位之邪也木運臨卯火運臨午土運臨四季金運臨酉水運臨子所謂歲會氣之平者言此八歲皆歲與五運相會而氣和平其盛衰皆能循序當六位之正如餘歲不與運會則氣有太過不及其盛衰皆無序而非其位也或曰王氏注文釋水承火下者熱甚則潤溢象水也土承水下者寒甚則冰堅象土也風承土下者雨為疾風吹零也金承風下者風動氣清萬物皆燥也火承金下者火煅金流也林氏校正又引木發而毀折及厥陰所至為飄怒大涼等語證之河間又以亢則害承乃制六字之義著書伸二家之說其說皆指六位下承之氣為旦夕之暴作今吾子獨謂為四時之循環必將有說通知之而證其得失是非乎曰經下文制則生化外列盛衰盛衰當其位則正非其位則邪數句論下承之義親切詳備足可證其得失是非矣今經云君火之右退行一步相火治之水氣承之復行一步土氣治之木氣承之復行一步金氣治之火氣承之復行一步水氣治之土氣承之復行一步木氣治之金氣承之復行一步君火治之陰精承之一節乃下承生化之盛衰當其位則正者也蓋其盛衰循序不亂盛者當法之正位衰者當承之正位而各當本位之正故溫當春熱當夏涼當秋寒當冬而氣候和平以為生長收藏焉此則經之本旨論四時循環當位正化也王氏注文所釋下承之義又引林氏所引木發毀折厥陰所至為飄怒大涼之證乃下承生化之盛衰非其位則邪者也蓋其盛衰無序而亂故木發毀折者暴亢極之木飄半兼暴承下之金殺同化而盛衰半非其位為兼化之邪也厥陰所至為飄怒大涼者暴亢極之木飄怒為暴承下之金涼報復而盛衰全非其位為勝復之邪也故溫非春熱非夏涼非秋寒非冬而或和或乖以為人之百病焉此則王氏林氏誤用旦夕暴作非位之邪釋經當位之正也然其非位之兼化勝復又有太過不及之殊今河間所伸王氏林氏之說以亢則害承乃制六字釋變氣之義有曰木極似金金極似火火極似水水極似土土極似木皆以亢過極則反似勝己之化者有曰制甚則兼化乃虛象者有曰治兼化但當瀉其亢甚之氣為病本不可反誤治其兼化者諸儒此言皆謂五氣變盛之兼化若夫不及者則未之及也謹按五常政大論云木不及曰委和委和之紀其動緛戾拘緩其味酸辛其色白蒼其聲角商火不及曰伏明伏明之紀其動彰伏變易其味苦鹹其色玄丹其聲徵羽土不及曰卑監卑監之紀其動瘍湧分潰癰腫其味酸甘其色蒼黃其聲宮角金不及曰從革從革之紀其動鏗禁瞀厥其味苦辛其色白丹其聲商徵水不及曰涸流涸流之紀其動堅止其味甘鹹其色黅玄其聲羽宮委和所謂軟戾拘緩者緛王注謂縮短也蓋木之條達不及而極則金兼化縮短承於非位以勝之也戾肢體曲戾也拘筋脈拘強也木為金之縮短牽引而曲戾拘強也緩筋脈緩縱也金勝木則土寡於畏故土兼化緩縱於其空隙而拘者自拘緩者自緩也酸辛白蒼角商皆木不及而夭極金於非位承之兼化也伏明所謂彰伏變易者彰火化彰明也伏水化隱伏也變易火不及水兼之而或彰或伏變易不常也苦鹹玄丹徵羽者皆火不及而夭極水於非位承之兼化也卑監所謂瘍湧分潰癰腫者瘍癰腫土化壅塞也湧分潰木化啓折也土化壅塞而為瘍癰腫木兼化啓折而為騰湧分潰其壅塞也酸甘蒼黃宮角者土不及而夭極木於非位承之兼化也從革所謂鏗禁瞀厥者鏗謂金化鏗聲而為咳也禁謂閉氣抑喉而禁忍其咳也蓋金肺太過則欲氣伸而喘喝胸憑仰息金肺不及則欲氣蓄而禁忍鏗咳也瞀昏也厥逆也金化鏗禁而不及則火兼化昏瞀厥逆之氣升于禁忍之處也苦辛白丹商徵者皆金不及而夭極火於非位承之兼化也涸流所謂堅止者堅堅干止定止也水少堅干而土兼之定止也甘鹹黅玄羽宮者皆水不及而夭極土於非位承之兼化也凡此皆氣虛所變之兼化其治法當補本氣之虛非如氣盛兼化之法當瀉今河間例言治兼化但當瀉其亢甚之本氣者可乎其所兼之化皆本氣不足所承者得以勝之而然不治則本氣愈衰承氣愈勝今例言兼化為相似之虛象不可反治之者可乎此則河間誤釋太過不及所變之兼化皆為太過也曰王氏林氏河間氏失經旨意已聞命矣然六位下承之氣其所以為正化之常者為兼化勝復之變者為和者為乖者之詳猶有可得聞之而一證之以經旨乎曰至誠無息者道體也陰陽五行在天地間流行一極一生而更互相承循環無端者與道為體也故其相承以陰陽言則冬至陰極陽生承之夏至陽極陰生承之也以五行言之則五行即陰陽之相承特有盛稚之分耳故火盛陽水盛陰木稚陽金稚陰土負陰抱陽為沖氣其在陰陽相承則冬至陰極陽生承之始於長夏土之沖氣極木稚陽生承之次於秋金之稚陰極火盛陽生承之終於冬水之盛陰極土沖氣生承之也夏至陽極陰生承之始於春木之稚陽極金稚陰生承之次於夏君火之盛陽極陰精生承之終於夏相火之盛陽極陰生承之而一歲一周也其在五行自相承則君火相火之下陰精水氣承之水位之下土氣承之者初歲也土位之下木氣承之者二歲也木位之下金氣承之金位之下火氣承之者凡三歲周而復始也故混而陰陽分而五行常如是更互相承循環無端者實由相承之體至誠無息而然聖人在川上所謂逝者如斯夫不捨晝夜正謂此至誠無息之體也然以其相承之體言之則至誠無息隨極而承無常變和乖之殊以其流行之用言之則極於平氣之紀而當其位承之者為正化之常而為和極於太過不及之紀而非其位承之者為兼化勝復之變而為乖也其常者則循序漸進以為四時之周流其變者則或肆威太過而暴極於非位或勢力不及而夭極於非位故所承者皆隨其極制於下而躐等陵節變其本氣以為旦夕之暴化是故半變者本氣半衰下承半盛而為半非位之兼化全變者本氣全衰下承全盛而為全非位之勝復和而變者為德化政令乖而變者為災害眚傷也經所謂發生之紀其變振拉摧拔之類乃太過之兼化木不勝德則收氣復之類乃太過之勝復委和之紀其動緛戾拘緩之類乃不及之兼化肅殺炎赫沸騰之類乃德化政令之勝復水發而雹雪木發而毀折之類乃災害眚傷之兼化厥陰所至為飄怒太涼少陰所至為大暄寒之類乃災害眚傷之勝復也故均是至誠無息之體但其所極所承者有常變和乖之不齊則其應見者有變化兼化勝復及微甚災祥之各異王氏林氏不分變化釋變化為變氣河間不分虛實釋兼化為盛皆不思之過也六位之下各有承氣制亢圖當其位則正冬至陰盛極陽生承之陰盛亢則害陽承乃制之制生則化至春夏著盛春即稚陽木夏即老陽火長夏即沖氣上也夏至陽盛極陰生承之陽盛亢則害陰承乃制之制生則化至秋冬著盛秋即稚陰金冬即老陰水也相火之下水氣承之夏火亢則害水承乃制之制生則化至冬著盛水位之下土氣承之冬水亢則害土承乃制之制生則化至長夏著盛土位之下木氣承之長夏土亢則害木承乃制之制生則化至春著盛木位之下金氣承之春木亢則害金承乃制之制生則化至秋著盛金位之下火氣承之秋金亢則害火承乃制之制生則化至夏著盛君火之下陰精承之亢則害承乃制制生則化外列盛衰盛衰當其位則正非其位則邪木發而毀折風木之飄半兼金承之故毀折火發而曛昧火熱之明半兼木承之故曛昧土發而飄驟土濕之雨半兼風承之故飄驟金髮而清明金燥之清半兼火承之故清明水發而雹雪寒水之零半兼土承之故雹雪厥陰所至為飄怒大涼風飄之勝全變非位承之金涼復少陰所至為大暄寒君火之勝全變非位承之寒氛復太陰所至為雷霆驟注烈風驟雨之勝全變非位承之烈風復少陽所至為飄風燔燎霜凝相火之勝全變非位承之霜凝陽明所至為散落溫金涼之勝全變非位承之溫熱復太陽所至為寒雪冰雹白埃寒氛之勝全變非位承之溫埃復帝曰善願聞其步何如岐伯曰所謂步者六十度而有奇故二十四步積盈百刻而成日也帝曰六氣應五行之變何如岐伯曰位有終始氣有初中上下不同求之亦異也帝曰求之奈何岐伯曰天氣始於甲地氣始於子子甲相合命曰歲立謹候其時氣可與期帝曰願聞其歲六氣始終早晏何如岐伯曰明乎哉問也甲子之歲初之氣天數始於水下一刻終於八十七刻半二之氣始於八十七刻六分終於七十五刻三之氣始於七十六刻終於六十二刻半四之氣始於六十二刻六分終於五十刻五之氣始於五十一刻終於三十七刻半六之氣始於三十七刻六分終於二十五刻所謂初六天之數也乙丑歲初之氣天數始於二十六刻終於一十二刻半二之氣始於一十二刻六分終於水下百刻三之氣始於一刻終於八十七刻半四之氣始於八十七刻六分終於七十五刻五之氣始於七十六刻終於六十二刻半六之氣始於六十二刻六分終於五十刻所謂六二天之數也丙寅歲初之氣天數始於五十一刻終於三十七刻半二之氣始於三十七刻六分終於二十五刻三之氣始於二十六刻終於一十二刻半四之氣始於一十二刻六分終於水下百刻五之氣始於一刻終於八十七刻半六之氣始於八十七刻六分終於七十五刻所謂六三天之數也丁卯歲初之氣天數始於七十六刻終於六十二刻半二之氣始於六十二刻六分終於五十刻三之氣始於五十一刻終於三十七刻半四之氣始於三十七刻六分終於二十五刻五之氣始於二十六刻終於一十二刻半終之氣始於一十二刻六分終於水下百刻所謂六四天之數也次戊辰歲初之氣復始於一刻常如是無已周而復始帝曰願聞其歲候何如岐伯曰悉乎哉問也日行一周天氣始於一刻日行再周天氣始於二十六刻日行三周天氣始於五十一刻日行四周天氣始於七十六刻日行五周天氣復始於一刻所謂一紀也是故寅午戌歲氣會同卯未亥歲氣會同辰申子歲氣會同巳酉醜歲氣會同終而復始帝曰願聞其用也岐伯曰言天者求之本言地者求之位言人者求之氣交帝曰何謂氣交岐伯曰上下之位氣交之中人之居也故曰天樞之上天氣主之天樞之下地氣主之氣交之分人氣從之萬物由之此之謂也帝曰何謂初中岐伯曰初凡三十度而有奇中氣同法帝曰初中何也岐伯曰所以分天地也帝曰願卒聞之岐伯曰初者地氣也中者天氣也帝曰其升降何如岐伯曰氣之升降天地之更用也帝曰願聞其用何如岐伯曰升已而降降者謂天降已而升升者謂地天氣下降氣流於地地氣上升氣騰於天故高下相召升降相因而變作矣六微旨大論此一章論天之陰陽與地之陰陽相錯而變生所謂動靜相召上下相臨陰陽相錯者也步者帝覆問上章地之六步也六十度有奇者地之六步繞天一周凡三百六十五度以為一歲之日數而每步各得六十度有奇也故一日為一度六十日八十七刻半為一步而不盈日積二十四步凡四歲則其餘奇積盈百刻而成日於歲終以為一紀也六氣應五行之變者帝覆取上文天道六六之節及地理應六節氣位二章之義合而問之也言天六氣風熱濕火燥寒之盛衰相應地五行木君火相火土金水之治令者同一歲步而其氣錯之變何如求之也位即步也位有終始者即天六氣之盛者應地五行之治令者同在一步而其候有終始也氣有初中者即每步始終之盛而治令之氣分為前後前半步為初氣主地氣升後半步為終氣主天氣降也天上地下之氣相錯於位之終始氣之初中不同而求之之法亦異也天氣始於甲地氣始於子者求位有終始之法也言天地之氣皆自甲子歲始求之者謹按其始終之時則其氣候之至可與之期也歲六氣始終早晏者蓋天地二氣之始終有步候之分其在步候則一歲六步每步天地之氣始終各治六十日八十七刻半其在歲候則每歲天地之氣始終各治三百六十五日二十五刻今帝先問一歲六步之氣始終之候早晏也甲子之歲始於水下一刻終於八十七刻半者甲子歲六步其天之氣少陰司天而左間太陰右間厥陰陽明在泉而左間太陽右間少陽皆各於所在之步更盛而相應地氣同治其令今初之氣則在泉左間太陽寒氣盛相應地東北木氣治令而同主春分前六十日八十七刻半始終之候早晏也二之氣始於八十七刻六分終於七十五刻者司天右間厥陰風氣盛相應地東南君火治令而同主春分後六十日八十七刻半始終之候早晏也三之氣始於七十六刻終於六十二刻半者司天少陰熱政布相應地南方相火治令而同主夏至前後六十日八十七刻半始終之候早晏也四之氣始於六十二刻六分終於五十刻者司天左間濕氣盛相應地西南土氣治令而同主秋分前六十日八十七刻半始終之候早晏也五之氣始於五十一刻終於三十七刻半者在泉右間火氣盛相應地西北金氣治令而同主秋分後六十日八十七刻半始終之候早晏也終之氣始於三十七刻六分終於二十五刻者在泉陽明燥氣盛相應地北方水氣治令而同主冬至前後六十日八十七刻半始終之候早晏也天地之氣在甲子歲六步始終之候早晏餘歲同例推之也歲候者帝因步候而問及歲候也蓋天地於一歲之政天氣之司天在上者共主一歲地氣之主運者居中配之凡二氣之候同其始終於一歲也日行一歲日行一周天也氣始於一刻者甲子歲司天少陰熱氣在泉陽明燥氣中運大宮土氣之候始同治其歲也日行二周天氣始於二十六刻者乙丑歲司天太陰濕氣在泉太陽寒氣中運少商金氣之候始同治其歲也日行三周天氣始於五十一刻者丙寅歲司天少陽火氣在泉厥陰風氣中運大羽水氣之候始同治其歲也日行四周天氣始於七十六刻者丁卯歲司天陽明燥氣在泉少陰熱氣中運少角木氣之候始同治其歲也此天地之氣在初紀四歲始終之候余紀同例推之也用者用前歲步始終之候求天地之氣也言天者求之本言地者求之用言人者求之歲交者言用前歲步始終之候也言求天氣者則求風寒暑濕燥火之本氣其標與中氣不必求之也言求地氣者則求木火土金水火之位氣其下承之氣不必求之也言求人氣者則求氣交中所應見之氣其不應見者不必求之也就甲子歲初之氣言之則言求天氣者求司天之熱在泉之燥泉左間之寒也言求地氣者求中運之土本部之木也言求人氣者則求氣交所應見者或熱或燥或寒或土或木五者之氣為常非是五者皆勝復之邪變也氣交者天地二氣之交接以人之身半天樞為界天樞之上至司天之位屬天氣主之天樞之下至在泉之位屬地氣主之天地二氣於天樞交接之界分屬人氣之所從萬物之所由故曰氣交也凡此天地始終之候亙古不易之體也初凡三十度有奇中氣同法者求氣有初中之法也言每步六十日八十七刻半其前三十日有奇則為初氣而日屬陽主天樞以下之氣皆升後三十日有奇則為中氣而月屬陰主天樞以上之氣皆降就甲子歲初之氣言之天樞以下者謂在泉燥氣泉左間寒氣中運土氣本部木氣皆上升也天樞以上者謂司天熱氣下降也升已而降降者流地降已而升升者騰天故高下相召升降相隨而氤氳錯雜勝侮相乘由是變常化於氣交而作勝復也蓋天地之氣各皆均平則於升降之間各守界分而應歲步本位始終之常化其有盈虛多少則盈而同類多者勝勝則越出歲步之本位虛而同類少者侮侮則為非歲步本位之氣氣乘來勝故常化變而勝復作矣凡此天地升降之氣隨時變化之用也或曰天之陰陽六節惟司天在泉二節統盛一歲餘四節獨盛一步者何也曰司天在泉二節正當天地之中其升降常在中國相持故統盛一歲餘四節各居四方其升降不在中國惟治令一方所居之氣隨春令西行夏令北行秋令東行冬令南行入歸中國盛之故此四節各隨四時之令獨盛一步也若夫勝復作而出位變常者雖不居治令之方亦入中國往復也曰天氣以風暑濕火燥寒為序而濕居火前地氣以木火土金水為序而土居火後夫濕土一氣其位不同何也曰在天為氣故天以三陰三陽之氣多少為序在地成形故地以五行之形相生為序其以氣之多少為序者從少漸多則陰之序始厥陰厥陰者一陰也次少陰少陰者二陰也終太陰太陰者三陰也陽之序始少陽少陽者一陽也次陽明陽明者二陽也終太陽太陽者三陽也此則天氣以陰陽之多少為序而濕居火前也其以形之相生為序者生生不已則其氣始於木初之氣木生火故君火為二之氣相火為三之氣火生土故土為四之氣土生金故金為五之氣金生水故水為終之氣而復生木此則地氣以五行之相生為序而土居火後也王太僕以少陽次太陽陳無擇以濕土生相火可謂不究經旨矣帝曰善寒濕相遘燥熱相臨風火相值其有間乎岐伯曰氣有勝復勝復之作有德有化有用有變變則邪氣居之帝曰何謂邪乎岐伯曰夫物之生從於化物之極由乎變變化之相搏成敗之所由也故氣有往復用有遲速四者之有而化而變風之來也帝曰遲速往復風所由生而化而變故因盛衰之變耳成敗倚伏遊乎中何也岐伯曰成敗倚伏生乎動動而不已則變作矣帝曰有期乎岐伯曰不生不化靜之期也帝曰不生化乎岐伯曰出入廢則神機化滅升降息則氣立孤危故非出入則無以生長壯老已非升降則無以生長化收藏是以升降出入無器不有故器者生化之宇器散則分之生化息矣故無不出入無不升降化有大小期有近遠四者之有而貴常守反常則災害至矣故曰無形無患此之謂也帝曰善有不生不化乎岐伯曰悉乎哉問也與道合同惟真人也六微旨大論此一章論天地陰陽之變寒暑相遘燥濕相臨風火相值其有間乎帝承上章天地初中升降之義而問寒濕燥熱風火等氣其於升降相遘相臨相值之交接處有空隙之間否乎也岐伯答氣有勝復者言天地相遘相臨相值者凡五氣有盈虛多少常於升降之交接處強弱侵凌乘勢勝復無空隙之間也故其勝復之作於升降交接處有為數和彰顯溽蒸清潔淒滄之德者有為生榮蕃茂豐備緊斂清謐之化者有為曲直燔爍高下散落沃衍之用者有為摧拉炎燥淫潰肅殺凝冽之變者唯變則邪氣居之於人為病死也帝問何謂邪乎言何故謂變為邪也岐伯答物之生從於化物之極由乎變者言變化二氣猶陰陽晝夜之相反而物之生從化極由變故變之於化更相搏物則化者成之所由而為正氣變者敗之所由而為邪氣是故謂變為邪也氣有往復用有遲速者言變化之氣皆有往復其往復之用皆有遲速也如經所謂春有鳴條律暢之化則秋有霧露清涼之政者是其化氣往復之類是也冬有慘淒殘賊之勝則夏有炎暑燔爍之復者是變氣往復之類又皆其往復之用遲者也所謂少陰所至為太暄寒陽明所至為散落溫者是其往復之用速者也凡變化必有此往復遲速四者播扇然後化之正風變之邪風始來薄入也成敗倚伏遊於中者即冬傷於寒春必病溫春傷於風夏必飧泄及仲景所謂伏氣伏寒之類是也帝問遲速往復風所由生而化而變故因運氣盛衰之變而常然生風者耳人感其風以為成敗者則倚伏遊行於中不於當時隨所感發作者何也岐伯答成敗倚伏生於動動而不已則變作者倚伏之義始明丹溪所謂傷寒屬內傷十居八九之論深得斯旨也言成敗倚伏遊於中者皆生於人之所動人動有節而自養則其氣和而所感者亦化氣之和來居以為成身之生氣倚伏遊於中焉人動無節而煩勞則其氣乖而所感者亦化氣之乖來居以為敗身之病根倚伏遊於中焉至於動而不已煩勞無休而重感變氣以啓之然後舊之倚伏者始發而變作矣期者變作之期也言變動而不以之動作也不生不化靜之為期而死矣故曰不生不化靜之期也故動物靜則以口鼻出入之息廢而神機化滅為期植物靜則以根柯升降之化已而氣之孤危為期也故動物非息出入則無以生長壯老已植物非化升降則無以生長化收藏是以升降出入無器不有故動植之器乃化生之宅宇氣散則出入升降各相離分而生化息矣故無不出入無不升降化有大小自蠢動之微至天地之廣期有近遠自蜉蝣之朝生暮滅至聃彭之壽年千百凡此大小遠近四者之有皆貴乎常守反常則災害至而靜期促矣帝問曰五運六氣之應見六化之正六變之紀何如岐伯對曰夫六氣正紀有化有變有勝有復有用有病不同其候帝欲何乎帝曰願盡聞之岐伯曰夫氣之所至也厥陰所至為和平少陰所至為暄太陰所至為埃溽少陽所至為炎暑陽明所至為清徑太陽所至為寒氛時化之常也厥陰所至為風府為璺啓少陰所至為火府為舒榮太陰所至為雨府為員盈少陽所至為熱府為行出陽明所至為司殺府為庚蒼太陽所至為寒府為歸藏司化之常也厥陰所至為生為風搖少陰所至為榮為形見太陰所至為化為雲雨少陽所至為長為蕃鮮陽明所至為收為霧露太陽所至為藏為周密氣化之常也厥陰所至為風生終為肅少陰所至為熱生中為寒太陰所至為濕生終為注雨少陽所至為火生終為蒸溽陽明所至為燥生終為涼太陽所至為寒生中為溫德化之常也厥陰所至為毛化少陰所至為羽化太陰所至為裸化少陽所至為羽化陽明所至為介化太陽所至為鱗化德化之常也厥陰所至為生化少陰所至為榮化太陰所至為濡化少陽所至為茂化陽明所至為堅化太陽所至為藏化布政之常也厥陰所至為飄怒大涼少陰所至為大暄寒太陰所至為雷霆驟注烈風少陽所至為飄風燔燎霜凝陽明所至為散落溫太陽所至為寒雪冰雹白埃氣變之常也厥陰所至為撓動為迎隨少陰所至為高明焰為曛太陰所至為沉陰為白埃為晦暝少陽所至為光顯為彤雲為曛陽明所至為煙埃為霜為徑切為淒鳴太陽所至為剛固為堅芒為立令行之常也厥陰所至為裡急少陰所至為瘍疹身熱太陰所至為積飲痞膈少陽所至為嚏嘔為瘡瘍陽明所至為浮虛太陽所至為屈伸不利病之常也厥陰所至為支痛少陰所至為驚惑惡寒戰栗譫妄太陰所至為稸滿少陽所至為驚躁瞀昧暴病陽明所至為鼽尻陰股膝髀腨胻足病太陽所至為腰痛病之常也厥陰所至為緛戾少陰所至為悲妄衄蔑為行徑太陰所至為中滿霍亂吐下少陽所至為喉痹耳鳴嘔湧陽明所至為脅痛皴揭太陽所至為寢汗痙病之常也厥陰所至為脅痛嘔泄少陰所至為語笑太陰所至為重胕腫少陽所至為暴注瞤瘛暴死陽明所至為鼽嚏太陽所至為流泄禁止病之常也凡此十二變者報德以德報化以化報政以政報令以令氣高則高氣下則下氣後則後氣前則前氣中則中氣外則外位之常也故風勝則動熱勝則腫燥勝則乾寒勝則浮濕勝則濡泄甚則水閉胕腫隨氣所在以言其變耳帝曰願聞其用也岐伯曰夫六氣之用各歸不勝而為化故太陰雨化施於太陽太陽寒化施於少陰少陰熱化施於陽明陽明燥化施於厥陰厥陰風化施於太陰各命其所在以徵之也帝曰自得其位何如岐伯曰自得其位常化也帝曰願聞所在也岐伯曰命其位而方月可知也帝曰六位之氣盈虛何如岐伯曰太少異也太者之至徐而常少者暴而亡帝曰天地之氣盈虛何如岐伯曰天氣不足地氣隨之地氣不足天氣從之運居其中而常先也惡所不勝歸所同和隨運歸從而生其病也故上勝則天氣降而下下勝則地氣遷而上勝多少而差其分微者小差甚者大差甚則位易氣交易則大變生而病作矣大要曰甚紀五分微紀七分其差可見此之謂也帝曰善六元正紀大論此一章論五運六氣應見之候也六化之正者常氣也六變之紀者變氣也有化有變有勝有復有用有病之六候者其化之一候六化之正應見也變勝復用病五候六變之紀應見也厥陰所至為和平流泄禁止十二節論化變病三候也其曰時化司化氣化德化之常及布政令行之常者論化之候也其曰氣變之常者論變之候也其曰病之常者諭病之候也凡此十二變至言其變一節論勝復之二候也六氣之用至方月一節論用之一候也時化之常者六部生氣之常化也司化之常者司天在泉六位之常化也氣化之常者五運之常化也厥陰所至為風生終為肅少陰所至為熱生中為寒太陰所至為濕生終為注雨少陽所至為火生終為蒸溽陽明所至為燥生終為涼太陽所至為寒生中為溫者其風生熱生濕生火生燥生寒生六者本氣也終為肅終為注雨終為蒸溽終為涼四者標氣也中為寒中為溫二者中氣也夫本之下中之見也見之下氣之標也故其生物之德皆始於本氣終於標氣而中氣常居標本之中故言標本則中氣在其中矣惟少陰太陽言中而不言終者蓋少陰太陽中氣與標氣同故言中則標氣亦在其中矣德化之常者德生植物之常化也其次德化之常者德生動物之常化也凡此十二變者言前德化政令病變十二節之候若不當歲步主客正位而至者則屬變氣而為勝復也凡勝復之候至其勝氣變德則報復以德變化則報復以化變政令則報復以政令而其氣之往復不能相移也所變之氣居高則報復亦高居下則報復亦下居後則報復亦後居前則報復亦前居中則報復亦中居外則報復亦外而其位之高下亦不能相移也由是言之則天下風寒暑濕燥火之變常不能同也南方清燥而旱北方雨濕而潦者有之中原冰雪而寒左右鬱蒸而熱者有之況地理有高下形勢有大小高者氣寒多清燥下者氣熱多雨濕小者小異大者大異而錯雜於天道不一之變矣王氏釋高下前後中外俱作人身生病之所而不及地理之分野宜乎程子以天下旱潦常不同之義非運氣主歲之說也風勝則動熱勝則腫燥勝則乾寒勝則浮濕勝則濡泄甚則水閉胕腫隨氣所在以言其變者勝復為病之位也假若風於高處勝則人身亦於高處病頭重而掉眩風於下處勝則人身亦於下處病足動而戰栗又如熱於高處勝則人身亦於腰上分野病腫熱熱於下處勝則人亦於腰下分野病腫熱皆隨六氣勝復之所在高下前後中外以言其變病之所也六氣之用各歸不勝而為化者謂各歸不勝之方月施化也方月者假如厥陰司天之歲則陽明之位在泉左間其方月東北初之氣也太陽之位右間其方月東南二之氣也厥陰之位司天其方月正南三之氣也少陰之位在天左間其方月西南四之氣也太陰之位在泉右間其方月西北五之氣也少陽之位在泉其方月正北終之氣也故其歲施用太陰雨化施於東南二之氣太陽之位太陽寒化施於西南四之氣少陰之位少陰熱化施於東北初之氣陽明之位陽明燥化施於正南三之氣厥陰之位厥陰風化施於西北五之氣太陰之位皆各命其所在之化以徵驗其所施之化於歲同法推之也自得其位在本位之方月施化也如厥陰之歲則太陰自得於西北五之氣本位施雨化太陽自得於東南二之氣本位施寒化少陰自得於西南四之氣本位施熱化少陽自得於正北終之氣本位施火化陽明自得於東北初之氣本位施燥化厥陰自得於正南三之氣本位施風化於歲同法推之也大者之至徐而常者六氣之盈者為病則其勢反徐而微治法當逆之也少者之至暴而亡六氣之虛者為病則其勢反暴而甚治法當從之也人見其氣暴烈驟用峻劑攻之則熱病未已寒病復始殊不知大者之氣反微少者之氣反甚也帝曰願聞陰陽之三也何謂岐伯曰氣有多少異用也帝曰陽明何謂也岐伯曰兩陽合明也帝曰厥陰何也岐伯曰兩陰交盡也帝曰幽明何如岐伯曰雨陰交盡故曰幽兩陽合明故曰明幽明之配寒暑之異也帝曰分至何如岐伯曰氣至之謂至氣分之謂分至則氣同分則氣異所謂天地之正紀也帝曰夫百病之始生也皆生於風寒暑濕燥火以之化之變也經言盛者瀉之虛者補之余錫以方士而方士用之尚未能十全余欲令要道必行桴鼓相應猶拔刺雪汙工巧神聖可得聞乎岐伯曰審察病機無失氣宜此之謂也帝曰願聞病機何如岐伯曰諸風掉眩皆屬於肝諸寒收引皆屬於腎諸氣膹郁皆屬於肺諸濕腫滿皆屬於脾諸熱瞀瘈皆屬於火諸痛癢瘡皆屬於心諸厥固泄皆屬於下諸痿喘嘔皆屬於上諸禁鼓栗如喪神守皆屬於火諸痙項強皆屬於濕諸逆衝上皆屬於火諸脹腹大皆屬於熱諸躁狂越皆屬於火諸暴強直皆屬於風諸病有聲鼓之如鼓皆屬於熱諸病胕腫疼酸驚駭皆屬於火諸轉反戾水液渾濁皆屬於熱諸病水液澄徹清冷皆屬於寒諸嘔吐酸暴注下迫皆屬於熱故大要曰謹守病機各司其屬有者求之無者求之盛者責之虛者責之必先五勝疏其血氣令其調達而至和平此之謂也至真要大論此一章論五運六氣之為病治法也病機一十九條實察病之要旨而有者求之無者求之盛者責之虛者責之一十六字乃答篇首盛者瀉之虛者補之之旨而總結一十九條之義又其要旨中之要旨也河間原病式但用病機一十九條立言而遺此十六字猶有舟無操舟之工有兵無將兵之帥今負僣竊之罪以補之夫諸風病皆屬於肝也風木盛則肝太過而病化風如木太過發生之紀病掉眩之類俗謂之陽痓急驚等病治以涼劑是也燥金盛則肝為邪攻而病亦化風如陽明司天燥金下臨病掉振之類俗謂之陰痓慢驚等病治以溫劑是也諸火熱病皆屬於心也火熱甚則心太過而病化火熱如歲火太過諸譫妄狂越之類俗謂之陽躁譫語等病治以攻劑是也寒水勝則心為邪攻而病亦化火熱如歲水太過病躁悸煩心譫妄之類俗謂之陰躁鄭聲等病治以補劑是也諸濕病皆屬於脾也濕土甚則脾太過而病化濕如濕勝則濡泄之類仲景用五苓等劑去濕是也風木勝則脾為邪攻而病亦化濕如歲木太過病飧泄之類錢氏用宣風等劑去風是也諸氣膹郁皆屬於肺也燥金甚則肺太過而病化膹郁如歲金太過甚則咳喘之類東垣謂之寒喘治以熱劑是也火熱勝則肺為邪攻而病亦化膹郁如歲火太過病咳喘之類東垣謂之熱喘治以寒劑是也諸寒病皆屬於腎也寒水甚則腎太過而病化寒如太陽所至為屈伸不利之類仲景用烏頭湯等劑是也濕土勝則腎為邪攻而病亦化寒如濕氣變物病筋脈不利之類東垣用復煎健步等劑是也其在太過所化之物為盛盛者真氣也其在受攻所化之病為虛虛者假氣也故有其病化者恐其氣之假故有者亦必求之無其病化者恐其邪隱於中如寒勝化火燥勝化風及寒伏反躁熱伏反厥之類故無者亦必求之其病之化似盛者恐其盛之未的故盛者亦必責之其病之化似虛者恐其虛之未真故虛者亦必責之凡一十九條病機皆用此一十六字為法求之庶幾補瀉不瘥也今河間損此一十六字但以病化有者為盛無者為虛而不復求其假者虛者為未備故引經傳以證其得失也帝曰五味陰陽之用何如岐伯曰辛甘發散為陽酸苦湧泄為陰鹹味湧泄為陰淡味滲泄為陽六者或收或散或緩或急或燥或潤或耎或堅以所利行之調氣使平帝曰非調氣而得者治之奈何有毒無毒何先何後願聞其道岐伯曰有毒無毒所治為主適大小為制也帝曰請言其制岐伯曰君一臣二制之小也君一臣三佐五制之中也君一臣三佐九制之大也寒者熱之熱者寒之微者逆之甚者從之堅者削之客者除之勞者溫之結者散之留者攻之燥者濡之急者緩之散者收之損者益之逸者行之驚者平之上之下之摩之浴之薄之劫之開之發之適事為故帝曰何謂逆從岐伯曰逆者正治從者反治從少從多觀其事也帝曰反治何謂岐伯曰熱因寒用寒因熱用塞因塞用通因通用必伏其所主而先其所因其始則同其終則異可使破積可使潰堅可使氣和可使必已至真要大論此一章論內氣不調得病者之治法也蓋內氣不調而得病故所病寒熱之邪但可於其氣之微者逆治之如氣甚而逆治之則正邪格拒不能勝邪命將難全故但當從其寒熱之邪於外伏其所主之劑於中然後正邪相入而邪就擒矣東垣所謂姜附寒飲承氣熱服及仲景於白通湯加尿膽治少陰丹溪於苓柏湯皆熟炒治色目婦人惡寒之類是也帝曰氣調而得者何如岐伯曰逆之從之逆而從之從而逆之疏氣令調則其道也至真要大論此一章論內氣本調因外邪得病者之治法也蓋內氣調而得病故不分寒熱之微甚或逆治之或從治之皆可更不須懼其正邪格拒正固則邪自退矣帝曰病之中外何如岐伯曰從內之外者調其內從外之內者治其外從內之外而盛於外者先調其內而後治其外從外之內而盛於內者先治其外而後調其內中外不相及則治主病帝曰善火熱復惡寒發熱有如瘧狀或一日發或間數日發其故何也岐伯曰勝復之氣會遇之時有多少也陰氣多而陽氣少則其發日遠陽氣多而陰氣少則其發日近此勝復相搏盛衰之節瘧亦同法帝曰論言治寒以熱治熱以寒而方士不能廢繩墨而更其道也有病熱者寒之而熱有病寒者熱之而寒二者皆在新病復起奈何治岐伯曰諸寒之而熱者取之陰熱之而寒者取之陽所謂求其屬也帝曰善服寒而反熱服熱而反寒其故何也岐伯曰治其王氣是以反也帝曰不治王而然者何也岐伯曰悉乎哉問也不治五味屬也夫五味入胃各歸所喜故酸先入肝苦先入心甘先入脾辛先入肺咸先入腎久而增氣物化之常也氣增而久夭之由也帝曰善方制君臣何謂也岐伯曰主病之謂君佐君之謂臣應臣之謂使非上下三品之謂也帝曰三品何謂岐伯曰所以明善惡之殊貫也帝曰善病之中外何如岐伯曰調氣之方必別陰陽定其中外各守其鄉內者內治外者外治微者調之其次平之盛者奪之汗之下之寒熱溫涼衰之以屬隨其攸利謹道如法萬舉萬全氣血正平長有天命帝曰善不治五味屬也一本五味二字作王氣二字至真要大論岐伯曰寒熱燥濕不同其化也故少陽在泉寒毒不生其味辛其治苦酸其谷蒼丹陽明在泉濕毒不生其味酸其氣溫其治辛苦甘其谷丹素太陽在泉熱毒不生其味苦其治淡咸其谷黅秬厥陰在泉清毒不生其味甘其治酸苦其谷蒼赤其氣專其味正少陰在泉寒毒不生其味辛其治辛苦甘其谷白丹太陰在泉燥毒不生其味鹹其氣熱其治甘鹹其谷黅秬化淳則咸守氣專則辛化而俱治故曰補上下者從之治上下者逆之以所在寒熱盛衰而調之故曰上取下取內取外取以求其過能毒者以厚藥不勝毒者以薄藥此之謂也氣反者病在上取之下病在下取之上病在中旁取之治熱以寒溫而行之治寒以熱涼而行之治溫以清冷而行之治清以溫熱而行之故消之削之吐之下之補之瀉之久新同法帝曰病在中而不實不堅且聚且散奈何岐伯曰無積者求其藏虛則補之藥以祛之食以隨之行水漬之和其中外可使畢已帝曰有毒無毒服有約乎岐伯曰病有久新方有大小有毒無毒固宜常制矣大毒治病十去其六常毒治病十去其七小毒治病十去其八無毒治病十去其九穀肉果菜食養盡之無使過之傷其正也不盡行復如法必先歲氣無伐天和無盛盛無虛虛而遺人夭殃無致邪無失正絶人長命帝曰其久病者有氣從不康病去而瘠奈何岐伯曰昭乎哉聖人之問也化不可代時不可違夫經絡以通血氣以從復其不足與衆齊同養之和之靜以待時謹守其氣無使傾移其形乃彰生氣以長命曰聖王故大要曰無代化無違時必養必和待其來復此之謂也五常政大論帝曰氣有多少病有盛衰治有緩急方有大小願聞其約奈何岐伯曰氣有高下病有遠近證有中外治有輕重適其至所為故也大要曰君一臣二奇之制也君二臣四偶之制也君二臣三奇之制也君二臣六偶之制也故曰近者奇之遠者偶之汗者不以奇下者不以偶補上治上制以緩補下治下制以急急則氣味厚緩則氣味薄適其至所此之謂也病所遠而中道氣味之者食而過之無越其制度也是故平氣之道近而奇偶制小其服也遠而奇偶制大其服也大則數少小則數多多則九之少則二之奇之不去則偶之是謂重方偶之不去則反佐以取之所謂寒熱溫涼反從其病也帝曰善病生於本余知之矣生於標者治之奈何岐伯曰病反其本得標之病治反其本得標之方至真要大論帝問曰婦人重身毒之何如岐伯曰有故無殞亦無殞也帝曰願聞其故何謂也岐伯曰大積大聚其可犯也衰其太半而止過者死六元正紀大論
