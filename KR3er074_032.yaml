body:
  text: 卷之三十二傷寒部合病並病汗下吐後等病太陽與陽明合病必自下利葛根湯主之不下利但嘔者葛根加半夏湯主之太陽與少陽合病自下利者與黃芩湯若嘔者黃芩加半夏生薑湯主之陽明與少陽合病必下利脈滑而數者有宿食也當下之宜大承氣湯論見下利二陽並病太陽出汗不徹因轉屬陽明自汗不惡寒太陽症不罷面赤躁煩短氣者更發汗則愈二陽並病太陽症罷潮熱譫語者下之則愈論見譫語太陽與少陽並病項強眩冒心下硬如結胸者刺胸腧肝腧論見項強喘太陽與陽明合病喘而胸滿者不可下麻黃湯主之許有人病傷寒脈浮而長喘而胸滿身熱頭痛腰脊強鼻乾不得臥豫曰太陽陽明合病仲景云中有三證下利葛根湯不下利嘔逆者加半夏喘而胸滿者麻黃湯也治以麻黃湯得解太陽病頭疼發熱身疼惡風無汗而喘者麻黃湯論見發熱陽明病脈浮無汗而喘者麻黃湯論見不大便喘家有汗桂枝湯加厚朴杏仁佳桂枝加厚朴杏仁湯桂枝去皮芍藥各一兩甘草炙厚朴各六錢杏仁去皮尖二十一個上㕮咀每服五錢水一盞半生薑五片肥棗三枚劈破同煎至八分溫服覆取微汗表不解乾嘔發熱咳喘者小青龍去麻黃加杏仁湯論見咳陽明病潮熱汗出不惡寒短氣腹滿而喘者大承氣湯論見不大便注云在裡而喘者腹滿在表而喘者腹不滿小便不利大便乍難乍易微熱喘冒不能臥者大承氣湯脈沉喘滿反發汗大便難者裡實論見譫語發汗後不可更行桂枝湯汗出而喘無大熱者可與麻黃杏仁甘草石膏湯麻黃四兩杏仁五十個甘草二兩石膏半斤上四味以水七升先煮麻黃減二升去上沫納諸藥煮取二升去渣溫服一升發汗後飲水多必喘以水灌之亦喘汗後脈沉喘滿大便難譫語者裡實論見譫語下後不可更行桂枝湯若汗出而喘無大熱者可與麻黃杏仁甘草石膏湯下後利不止脈促而喘汗者葛根黃芩黃連湯論見下利太陽病下之微喘者表未解故也桂枝加厚朴杏仁湯主之許有武臣為寇執置舟中艎板下數日得脫乘飢恣食良久解衣捫蝨次日遂傷寒自汗而膈不利一醫作傷食而下之一醫作解衣中邪而汗之雜治數日漸覺昏困上喘息高豫診之曰太陽下之表未解微喘者桂枝加厚朴杏仁湯此仲景之法也指令醫者急治藥一啜喘定再啜漐漐汗出至晚身涼脈已和矣醫曰某平生不曾用仲景方不知其神捷如此傷寒吐下後不大便潮熱若劇則不識人循衣摸床微喘直視脈弦者生澀者死論見循衣摸床濕家下後額汗微喘大小便利者死論見體痛少陰病息高者死詳見厥利論見欲寐厥冷無脈灸之不還反微喘者死詳見厥利直視譫語喘滿者死論見譫語脈浮洪汗出如油發潤喘不休者為命絶論見大法喘續法活陰證喘促者返陰丹主之四肢逆冷喘促入口便佳方見陰毒病人小渴與水劇飲之致停飲心下滿結者喘死甚衆當以五苓散或陷胸丸主之方見渴及結胸身重三陽合病腹滿身重難以轉側口不仁而面垢譫語遺尿發汗則譫語下之則額上出汗手足逆冷若自汗出者白虎湯主之風溫為病脈浮汗出身重多眠鼻息鼾論見風溫宜活人葳蕤湯陽明病脈浮緊口苦咽燥腹滿而喘發熱汗出不惡寒身重忌汗忌燒針忌下論見自汗注云此證宜和解之陽明病汗出不惡寒身重短氣腹滿而喘有潮熱者宜大承氣湯論見不大便風水脈浮身重汗出惡風者宜防己黃耆湯防已一兩甘草半兩白朮七錢半黃耆去蘆一兩一錢上㕮咀每服五錢生薑四片大棗一枚水盞半煎八分溫服良久再服服後當如蟲行皮中從腰下如冰後坐被上又以一被繞腰以下溫令微汗瘥喘者加麻黃半兩胃中不和者加芍藥三分氣上衝者加桂三分下有沉寒者加細辛三分中暑病發熱惡寒身重痛汗出足冷脈虛而渴者忌汗下針宜瓜蒂散白虎湯論見中暑傷寒脈浮緩身不疼但重無少陰但欲寐吐利證者宜大青龍湯下後身重心悸者不可發汗當自汗者乃解論見悸陰陽易為病身重少氣少腹急引陰中拘攣上衝胸眼花者燒裩湯論見陰陽易少陰病腹痛小便不利四肢沉重疼痛下利者真武湯論見身重難轉側三陽合病腹滿身重難轉側汗出者白虎湯論見身重下後胸滿煩驚小便不利譫語身重不可轉側者柴胡牡蠣湯論見驚風濕相搏身體煩疼不能自轉側不嘔不渴脈浮虛而澀者桂枝附子湯論見身疼遺尿三陽合病腹滿身重難轉側譫語遺尿汗出者白虎湯論見身重風溫病脈浮汗出者身重多眠若下之則小便不利直視失溲論見風溫寸口脈微而澀微者衛氣不行澀者榮氣不逮榮衛不能相將三焦無所仰身體痹不仁榮氣不足則煩疼口難言衛氣虛則惡寒數欠三焦不歸其部上焦不歸者噫而吞酢中焦不歸者不能消穀引食下焦不歸者則遺溲咳而小便利若失小便者不可發汗汗出則四肢厥冷太陽病火尉其背大汗出譫語十餘日振栗下利欲小便不得反嘔而失溲者此為欲解也論見譫語遺溲狂言目反直視者此為腎絶論見大法盜汗三陽合病脈浮大見關上但欲眠睡目合則汗陽明病脈但浮者必盜汗出論見胃實成無己云陽明病當作裡實而脈浮者云必盜汗是猶有表邪故也太陽病脈浮而動數頭痛發熱微盜汗出而反惡寒者表未解也論見結胸成傷寒盜汗者非若雜病之虛是由邪氣在半表半裡使然也何者若邪氣一切在表干於衛則自然汗出也此則邪氣浸行於里外連表邪及睡則衛氣行於里乘表中陽氣不致津液得泄故但睡而汗出覺則氣散於表而汗止矣其證悉當和表而已面赤二陽並病太陽初得病時發其汗汗先出不徹因轉屬陽明續自微汗出不惡寒若太陽症不罷者不可下之下之為逆如此可小發汗設面色緣緣正赤色者陽氣怫鬱在表當解之熏之若發汗不出出不足言陽氣怫鬱不得越當汗不汗其人躁煩不知痛處乍在腹中乍在四肢按之不可得其人短氣但坐以汗出不徹故也更發汗則愈何以知汗出不徹以脈澀故知也因發不透徹而面赤躁煩短氣者不足言陽氣怫鬱止是當汗不汗也故更發汗則愈脈浮而遲面熱赤而戰惕者六七日當汗出而解反發熱者瘥遲為無陽不能作汗其身必癢也太陽病如瘧狀若脈微惡寒面反有熱色而身癢者桂枝麻黃各半湯小汗之論見發熱身熱足寒面赤卒口噤背反張者痓病陽毒面赤斑斑如錦紋咽喉痛唾膿血者宜升麻鱉甲湯方論見陽毒少陰病下利清穀手足厥逆脈微欲絶身反不惡寒面赤色者通脈四逆湯加蔥白論見下利下利清穀脈沉遲面少赤手足微厥者必鬱冒汗出解論見下利陽明病面合赤色者不可攻之論見便難壞病太陽病三日已發其汗若吐若下若溫針仍不解者此為壞病桂枝不中與也觀其脈症知犯何逆隨證治之壞病續法山治傷寒壞症獨參湯好人參一兩煎服海陽症大汗大下後亡陽於外亡血於內上而津脫下而液脫津液兩亡宜以羊肉湯補之矧陰症者豈可不溫補哉此與傷寒太陽症振搖與真武湯一例外之陽病至此尚溫況內之陰候豈得不補耶韓産脫血虛者宜用羊肉湯傷寒汗下太過亡陽失血若只用救逆效必遲矣與羊肉湯為效神速病人面色雖見陽是客熱上焦中下二焦陰氣已盛若調得下焦有陽則上焦陽氣下降丹田知所歸宿矣夫氣有高下病有遠近證有中外治有輕重各適其至所為故病八九日汗下太過二脈沉細無力多蜷足臥惡聽人聲皮有粟時戰如瘧宜羊肉湯主之當歸白芍藥各一兩黑附子炮去皮臍四錢龍骨燒通赤半兩生薑二兩牡蠣燒赤一兩桂枝七錢半上為粗末每服一兩羊肉四兩蔥白五寸去黃心同銼爛以水五升一升今之一大盞也熬至一半以來濾絞去渣分三服服之戰栗振搖成戰者身為之戰搖也栗者心戰是也戰之與栗戰外而栗內也又云戰為正與邪爭則鼓栗而戰振但虛而不至爭故心聳動而振也戰之與振振輕而戰重也傷寒若吐若下後心下逆滿氣上衝胸起則頭眩脈沉緊發汗則動經身為振振搖者宜茯苓桂枝白朮甘草湯茯苓二兩桂枝一兩半白朮甘草各一兩上㕮咀每服五錢水一盞半煎八分去渣溫服太陽病發汗汗出不解其人仍發熱心下悸頭眩身瞤動振振欲劈地者真武湯主之方見少陰附下利孫太乙宮道士周德真患傷寒發汗出多驚悸目眩身戰掉欲倒地衆醫有欲發汗者有作風治者有用冷藥解者病皆不除召孫至曰太陽經病得汗早欲解不解者因太陽經欲解復作汗腎氣不足汗不來所以心悸目眩身轉遂作真武湯服之三服微汗自出遂解蓋真武湯附子白朮和其腎氣腎氣得行故汗得來也若但責太陽者惟能幹涸血液爾仲景云尺脈不足榮氣不足不可以汗以此知腎氣怯則難得汗也明矣許學士云鄉里有一姓高者子年三十初得病身微汗脈弱惡風醫以麻黃藥與之汗遂不止發熱心多驚悸夜不得眠譫語不識人筋惕肉瞤振振動搖醫又進鎮心藥豫曰強汗之過也仲景云脈微汗出惡風不可服青龍湯服之則筋惕肉瞤此為逆也惟真武湯可救進此三服佐以清心竹葉湯數日遂愈清心竹葉湯未考下後復發汗必振寒脈微細所以然者以內外俱虛故也亡血家不可發汗發汗則寒栗而振太陽病火尉其背大汗出火熱入胃發譫語十餘日振栗自下利者此為解也論見譫語脈浮緊按之芤當戰而汗出解脈芤為虛是以發戰脈浮為在表故當汗出解也論見大法太陽病脈陰陽俱停等必戰栗汗出而解論見發熱凡柴胡症下之若柴胡症不罷者復與柴胡湯必蒸蒸而振發熱汗出而解論見往來寒熱脈浮而遲面熱赤而戰惕者當汗出解也反發熱者脈遲不能作汗其身必癢也論見面赤諸乘寒者則為厥鬱冒不仁口急不能言戰而栗也陰中於邪必內栗也表氣微虛裡氣不守故邪中於陰也筋惕肉瞤汗出筋惕肉瞤若眩悸振振欲劈地者及服大青龍湯後厥逆者俱宜真武湯方見戰掉及發熱若動氣在左頭汗不止者活人用防風白朮牡蠣次服建中湯論見重寒汗下吐溫針後若膚瞤動胸煩面色青黃者難治論見痞若經脈動惕脈微心下痞氣衝咽喉者久而成痿論見痞叉手冒心發汗過多叉手自冒心心下悸欲得按者桂枝甘草湯方論見悸驚悸少陽耳聾目赤胸滿而煩者不可吐下吐下則悸而驚論見口苦傷寒八九日下之胸滿煩驚小便不利譫語一身盡重不可轉側者宜柴胡加龍骨牡蠣湯半夏二合大棗六枚柴胡四兩生薑人參龍骨鉛丹桂枝茯苓各一兩半大黃二兩半牡蠣一兩半上㕮咀每服五錢水一盞半煎至八分去渣溫服傷寒脈浮醫以火迫劫之亡陽必驚狂起臥不安者桂枝去芍藥加蜀漆牡蠣龍骨救逆湯主之活人云醫以火於臥床下或周身用火迫劫汗出或尉而成火邪者是也桂枝蜀漆牡蠣龍骨救逆湯桂枝去皮三兩甘草炙二兩生薑切三兩牡蠣炒五兩龍骨四兩大棗十二枚蜀漆洗去腥三兩上㕮咀每服五錢水一盞半煎至八分去渣溫服太陽傷寒者加溫針必驚也風溫脈浮自汗身重多眠若被火者微則發黃劇則如驚癇時瘛瘲論見風溫陽明病脈浮緊口苦咽乾腹滿若加燒針必怵惕煩躁不眠論見自汗驚悸續法海茯苓丸治傷寒後或用心勞倦四肢羸弱心忪驚悸吸吸短氣茯神麥門冬去心熟地各一兩牡丹皮人參黃耆各七錢桂枝甘草炙牛膝澤瀉各半兩上為細末煉蜜和搗三五百杵丸如桐子大食前溫酒下二十丸犀角湯治傷寒後伏熱在心怔忪驚悸不得眠睡犀角屑半兩茵陳蒿七錢半茯苓二兩芍藥生地焙二兩麥門冬去心兩半山梔半兩上㕮咀每服五錢水一盞半薑二片竹葉三七片同煎食後服麥門冬茯苓飲子治傷寒後心神恍惚不得臥麥門冬去心赤茯苓去皮知母焙芎藭甘草炙酸棗仁微炒陳皮去白炒檳榔各一兩上㕮咀每服五錢水一盞半生薑五片煎溫服日三服少陰心悸者四逆不可與也心悸者火懼水也惟腎欺心故為心悸者是足經上手經也若與四逆湯變無形中惡候生矣故先以甘草茯苓湯導其濕次以四逆湯溫之者為心悸全無手經火令入足水也心悸在濕未去終至於斃故不敢溫之溫之則壞矣悸汗後心下悸若頭眩身瞤動振振欲劈地者真武湯也論見戰振若叉手自冒心者後條桂枝甘草湯也若譫語胃不和煩悸者活人用調胃承氣湯也論見口苦若臍下悸者後條茯苓桂枝甘草大棗湯也發汗過多其人叉手自冒心心下悸欲得按者宜桂枝甘草湯桂枝四錢甘草二錢上二味以水一盞半煎八分去渣溫服發汗後其人臍下悸者欲作奔豚宜茯苓桂枝甘草大棗湯茯苓八錢甘草炙二錢桂枝四錢大棗二枚上作二服以甘瀾水二鍾先煮茯苓減二分納諸藥煮取一盞去渣溫服日三作甘瀾水法取水斗許置大盆中以杓揚之水上有珠子五六千顆相逐取用之脈浮數者法當汗出而愈若下之身重心悸者不可發汗當自汗出乃解所以然者尺中脈微此裡虛須表裡實津液自和便自汗出愈少陽病耳聾胸滿不可吐下吐下則悸而驚者注云氣血虛往來寒熱胸脅滿心下悸而小便不利者小柴胡去黃芩加茯苓湯方論見往來寒熱太陽病小便利者以飲水多必心下悸小便少者必苦裡急也傷寒二三日心中悸而煩者小建中湯主之傷寒脈結代心動悸宜炙甘草湯甘草炙一兩生薑三片人參半兩生地一兩桂枝去皮麥門冬去心各一兩麻仁一合阿膠半兩上㕮咀每服五錢水一盞半入酒半鍾煎至八分去渣納阿膠溶盡溫服日三霍亂吐利心悸者理中丸加茯苓手足厥冷而悸者茯苓甘草湯手足逆而不溫悸者四逆散加桂枝臟結與結胸痞氣大同小異問曰病有結胸有臟結其狀何如答曰按之痛寸脈浮關脈沉名曰結胸也何謂臟結答曰如結胸狀飲食如故時時下利寸脈浮關脈細小沉緊名曰臟結舌上白胎滑者難治王朝奉云可刺關元穴臟結無陽症不往來寒熱其人反靜舌上滑胎者不可攻也王朝奉云可刺關元穴服小柴胡湯病胸中素有痞連在臍旁引入小腹入陰筋者此名臟結死病發於陽而反下之熱入因作結胸病發於陰而反下之因作痞所以成結胸者以下之太早故也傷寒五六日嘔而發熱者柴胡湯症具而以他藥下之柴胡症仍在者復與柴胡湯此雖已下之不為逆必蒸蒸而振卻發熱汗出而解若心滿而硬痛者此為結胸也大陷胸湯主之但滿而不痛者此為痞柴胡不中與之與半夏瀉心湯結胸太陽病重發汗而復下之不大便五六日舌上燥而渴日晡所有潮熱從心下至少腹而痛不可近者大陷胸湯主之太陽病脈浮而動數浮則為風數則為熱動則為痛數則為虛頭痛發熱微盜汗出而反惡寒者表未解也醫反下之動數變遲膈內拒痛胃中空虛客氣動膈短氣躁煩心中懊憹陽氣內陷心下因硬則為結胸大陷胸湯主之若不結胸但頭汗出余處無汗劑頸而還小便不利身必發黃也丹溪云此症曰胃中空曰短氣躁煩曰脈浮大陷胸湯不可輕用傷寒六七日結胸熱實脈沉而緊心下痛按之實硬者大陷胸湯主之云岐云三症陷胸皆日西潮熱大陷胸湯大黃一兩半去皮為末錦紋者佳芒硝一兩八錢甘遂一字赤連珠者為細末上水二盞煮大黃至八分去渣下硝一沸下甘遂末溫服得快利止後服小結胸病正在心下按之則痛脈浮滑者宜小陷胸湯半夏湯洗二兩黃連一兩栝蔞一枚用四分之一上㕮咀水二盞先煎栝蔞至一盞半後用半夏黃連煎取八分去渣溫服未和再服微解下黃涎便安也孫工部郎中鄭忠厚因患傷寒胸腹滿面黃如金色諸翰林醫官商議略不定推讓曰胸滿可下恐脈浮虛召孫至曰諸公雖疑不用下藥鄭之福也下之必死某有一二服藥服之必瘥遂下小陷胸湯尋利其病遂良愈明日面色改白京城人稱服傷寒十餘日熱結在裡復往來寒熱者與大柴胡湯但結胸無大熱者此為水結在胸脅也但頭微汗出者大陷胸湯主之活人云水結胸小半夏加茯苓湯小柴胡去牡蠣湯亦主之病在陽應以汗解之反以冷水噀之若灌之其熱被卻不得去彌更益煩肉上粟起意欲飲水反不渴者服文蛤散若不瘥者與五苓散寒實結胸無熱證者與三物小陷胸湯白散亦可桔梗三分巴豆一分去皮尖熬黑研如脂貝母三分上三味為末納巴豆更於臼中杵之以白飲和服強人半錢匕羸者減之病在膈上必吐在膈下必利不利進熱粥一碗利過不止進冷粥一碗汗出已腹中痛與芍藥一兩上熱實結胸及寒實結胸活人不拘寒熱但用陷胸湯不瘥用枳實理中丸應手而愈結胸項亦強如柔痓狀下之則和宜大陷胸丸大黃二兩葶藶芒硝杏仁去皮炒各三分上搗羅二味納杏仁芒硝合研如脂相和為丸如彈大後用甘遂末一字白蜜少許水二盞半煎至一盞頓服一宿乃下如不下再服王海藏云大陷胸湯太陽入本藥也大陷胸丸陽明藥也小陷胸湯少陽藥也大陷胸治熱實大陷胸丸兼喘小陷胸治痞心下滿痛如結胸狀若頭下強痛眩冒者刺大椎肝腧若汗下後頭項強痛發熱小便不利者桂枝去桂加茯苓白朮湯方論並見項強若婦人經水來熱除譫語者刺期門論見譫語太陽病二三日不能臥但欲起心下必結脈微弱者此本有寒也反下之若利止必作結胸未止者四日復下之此作協熱利也四日復下之五字衍文也太陽病下之脈浮者必結胸也論見大法太陽少陽並病而反下之成結胸心下硬下利不止水漿不下其人心煩結胸症悉具煩躁者亦死結胸續法活若誤下了初未成結胸者急頻與理中湯自然解了更不作結胸蓋理中湯治中焦故也此古人亦説不到後因人消息得之若大段轉損有厥症者兼與四逆湯便安胃中雖和傷寒未退者宜候日數足可下卻以承氣再下之蓋前來下之未是故也西晉崔行功云傷寒結胸欲絶心膈高起手不得近用大陷胸湯皆不瘥者此是下後虛逆氣已不理而毒復上攻氣毒相摶結於胸者當用枳實理中丸先理其氣次療其疾古今用之如神應手而愈枳實理中丸治傷寒結胸欲絶心膈高起手不得近枳實十六片麩炒茯苓人參白朮乾薑炮甘草炮以上各二兩上為末煉蜜丸如雞子黃大每服一丸熱湯化下連進二三服胸中豁然渴者加栝蔞根一兩自汗者加牡蠣二兩煅過下利亦加海增損理中丸王朝奉云大小陷胸湯丸不愈者宜與之人參白朮栝蔞牡蠣甘草炙各二兩乾薑炒白半兩枳實炒二十四個黃芩去枯一兩上為細末煉蜜為丸如彈子大湯一盞煎服不效復與之不過五六丸胸中豁然矣用藥神速未嘗見也渴者加栝蔞根有汗加牡蠣活水結在胸脅間亦名結胸其證頭微汗出但結胸無熱者小半夏加茯苓湯小柴胡去棗加牡蠣主之孫按俞伯道忽患微熱心下滿頭有汗不能解衆醫以為溫病用表藥有謂食在膈者治之皆不愈召孫至曰用半夏茯苓湯遂瘥衆問其故曰頭有汗心下滿非濕症乃水結胸脅也水既去其病乃愈且如濕氣心下滿自當遍身汗若有食心滿頭豈得有汗若言是表身又不疼不惡寒表證何在故凡水結胸脅頭必有汗耳小半夏加茯苓湯方見嘔門穿結散大實大滿心胸高起氣塞不通者為結也蟾酥麝香輕粉巴豆另研少許上再研過至細以乳汁為丸如黍米大每服二丸用薑湯下不時服本婦人傷寒血結胸膈揉而痛不可撫近宜海蛤散海蛤滑石甘草炙各一兩芒硝半兩上末每服二錢雞子清調下小腸通利則胸膈血散膻中血聚則小腸壅小腸壅膻中血不流行宜此方若小便血散數行更宜桂枝紅花湯發其汗則愈活人書云此方疑非仲景然其言有理姑存之治結胸灸法巴豆十四個黃連七寸去皮用上搗細津唾和成膏填入臍中以艾灸其上腹中有聲其病去矣不拘壯數病去為度才灸了便以溫湯浸手帕拭之恐生瘡也摘傷寒結胸先使人心蔽骨下正痛處左畔揉之以毫針刺左畔支溝穴正坐側臂取之二分次刺左間使名曰雙關刺次左行間臥取之針入六分此支溝行間穴下針至分數內捻針令病人五吸次外捻針三呼又次內捻針五吸訖長呼一口氣出針即左畔一壁結胸立效右畔依上刺之慢慢呼吸停針用針獲時而愈無有不效云傷寒結胸痞氣胸中結痞湧泉太溪中衝大陵心中結痞隱白太白少衝神門胃中結痞少商太淵大敦太衝並上下中脘瀉之通玄結胸身黃湧泉摘血結胸面赤大燥口乾消渴胸中疼痛不可忍期門大陵關元妊娠不得刺關元胎死不出子母俱亡慎之集傷寒胸膈痛期門大陵活近世治結胸多用金針並用硫黃陽起石者若寒實結胸或有瘥者若熱實結胸必死也痞心下痞按之濡其脈關上浮者大黃黃連瀉心湯主之活人云結胸與痞關脈須沉若關脈浮者大黃黃連瀉心湯大黃黃連瀉心湯大黃黃連各二兩黃芩一兩上㕮咀以麻沸湯二升漬之一時良久絞去渣分溫再服心下痞而復惡寒汗出者宜附子瀉心湯大黃黃連黃芩各一兩附子一枚炮去皮臍破別煮取汁上㕮咀百沸湯二大盞熱漬之一時久絞去渣納附子汁分溫再服傷寒大下後復發汗心下痞惡寒者表未解也不可攻痞當先解表表解乃可攻痞解表宜桂枝湯攻痞宜大黃黃連瀉心湯活人云表症未解心下妨悶者非痞也謂之支結柴胡桂枝湯主之胸脅滿微結小柴胡加乾薑牡蠣湯主之傷寒嘔而發熱者柴胡湯症具而以他藥下之若心下滿而不痛者此為痞宜半夏瀉心湯論見結胸痞同異半夏瀉心湯半夏湯洗七次一兩黃芩人參甘草各一兩半黃連半兩大棗六枚乾薑一兩上㕮咀每服五錢每一盞半煎至八分去渣溫服半夏瀉心湯若加甘草即後條甘草瀉心湯治痞硬嘔吐利也若加生薑即後條生薑瀉心湯治痞硬噫氣下利也傷寒中風醫反下之其人下利日數十行穀不化腹中雷鳴心下痞硬而滿乾嘔心煩不得安醫見心下痞謂病不盡復下之其痞益甚此非結熱但以胃中虛客氣上逆故使硬也宜甘草瀉心湯甘草炙二兩黃芩乾薑各一兩半半夏一兩大棗六個黃連半兩人參一兩上㕮咀每服五錢水一盞半煎至八分去渣溫服活人云伊尹湯液論甘草瀉心七味舊本無人參傷寒發熱汗出不解心中痞硬嘔吐而下利者大柴胡湯主之心下痞硬嘔逆下利若表解身涼脅痛十棗湯主之方論並見脅痛傷寒汗出解之後胃中不和心下痞硬乾噫食臭脅下有水氣腹中雷鳴下利者宜生薑瀉心湯生薑二兩黃芩甘草炙人參各一兩半乾薑半兩半夏一兩黃連半兩大棗六個上㕮咀每服五錢水一盞半煎至七分去渣溫服太陽病外症未除而數下之遂協熱而利利下不止心下痞硬表裡不解者宜桂枝人參湯桂枝另銼甘草炙各一兩三錢白朮人參乾薑各一兩上㕮咀每服五錢水二盞煎至一盞納桂更煮取七分去渣溫服日再服夜一服傷寒發汗若吐若下解後心下痞硬噫氣不除者旋覆代赭石湯主之活人云有旋覆代赭石湯證其人或咳逆氣虛者先服四逆湯胃虛者先服理中丸次服旋覆代赭石湯為良旋覆代赭石湯旋覆花一兩人參半兩生薑一兩半代赭石三錢甘草炙一兩半夏湯泡八錢大棗六個上㕮咀每服五錢水一盞煎至八分去渣溫服病解後心下痞硬噫氣若不下利者此條旋覆代赭石湯也若下利者前條生薑瀉心湯也胸中痞硬氣上衝咽不得息者瓜蒂散若心下痞硬脅痛氣上衝咽眩冒者成痿方論並見氣上衝心本以下之故心下痞與瀉心湯痞不解其人渴而口煩躁小便不利者五苓散主之發熱惡寒身痛表症未解若心下支結妨悶者柴胡桂枝湯也方見發熱若心下痞而腹滿者即前條先以桂枝湯解後用大黃黃連瀉心也心下滿似痞而手足厥冷若脈乍結乍緊心煩飢不欲食者瓜蒂散若脈沉細頭汗惡寒大便硬者小柴胡湯論見厥太陽病醫發汗遂發熱惡寒因復下之心下痞表裡俱虛陰陽並竭無陽則陰獨復加燒針因胸煩面色青黃膚瞤者難治今色微黃手足溫易愈脈浮而緊而反下之緊反入里則作痞按之自濡但氣痞耳脈浮而大心下反硬有熱屬臟者攻之不令發汗屬腑者不令溲數溲數則大便硬汗多則熱愈甚汗少則便難若脈遲尚未可攻陽明痞胃實心下硬滿者不可攻之論見胃實痞續法活傷寒本無痞應發汗醫反下之遂成痞枳實理中丸最良審知是痞先用桔梗枳殼湯尤妙緣桔梗枳殼行氣先用之無不驗也桔梗枳殼湯治傷寒痞氣胸滿欲絶桔梗枳殼麩炒去穰各二兩上㕮咀以水二盞煎至一盞去渣分二服煩發汗吐下後虛煩不得眠若劇者必反覆顛倒心中懊憹梔子豉湯主之若少氣者梔子甘草豉湯主之若嘔者梔子生薑豉湯主之陽明病下之其外有熱手足溫不結胸心下懊憹飢不能食但頭汗出者梔子豉湯主之陽明病脈浮緊若下之則胃中空虛客氣動膈心中懊憹舌上白胎者宜梔子豉湯論見自汗下利後煩按之心下濡者為虛煩也宜梔子豉湯肥梔子四個破香豉半兩上水二盞先煎梔子一盞納豉同煎取七分去渣溫服得快吐止後服梔子甘草豉湯於梔子豉湯中加甘草半兩余依前法得吐止服梔子生薑豉湯於梔子豉湯中加生薑一兩二錢余依前法得吐止後服傷寒醫以丸藥大下之身熱不去微煩者梔子乾薑湯主之梔子四兩破乾薑半兩上二味以水一盞半煎取八分去渣溫服得吐者止後服發汗吐下後心中懊憹而煩若無燥屎大便耎者此條梔子豉等湯也若有燥屎不大便者後條小承氣湯也太陽病若吐若下若發汗微煩小便數大便因硬者與小承氣湯和之愈陽明病下之心下懊憹而煩胃中有燥屎者可攻腹微滿初頭硬後必溏不可攻之若有燥屎者宜大承氣湯方見陽明潮熱胃實不大便心煩若吐下後者此條大小承氣湯也若不吐不下者調胃承氣也許有人病傷寒八九日身熱無汗時時譫語時因下後大便不通三日矣非躁非煩非寒非痛終夜不得臥但心中無曉會處或時發一聲如嘆息之狀醫者未知是何症豫診之曰此懊憹怫鬱二症俱作也胃中有燥屎者服承氣湯下燥屎二十枚得利而解仲景云陽明病下之心中懊憹微煩胃中有燥屎者可攻又云小便不利大便乍難乍易時有微熱怫鬱不臥者有燥屎也承氣湯主之素問云胃不和則臥不安此夜所以不得眠也仲景云胃中燥大便堅者必譫語此所以有時發譫語也非煩非躁非寒非痛所以心中懊憹也聲如嘆息而發一聲所謂外氣怫鬱也燥屎得除大便通利胃中安和故其病悉去也不得眠而煩論見不得眠胸滿而煩若不經汗兼往來寒熱者小柴胡湯方論見往來寒熱兼下利咽痛者豬膚湯方論見下利若汗下後往來寒熱者柴胡桂枝幹薑湯方論見往來寒熱兼身重不可轉側者柴胡龍骨牡蠣湯方論見驚發汗若下之而煩熱胸中窒者梔子豉湯主之心下硬滿而煩若滿而不痛腹中雷鳴下利者甘草瀉心湯脅痛氣衝咽冒眩者成痿方論見痞若滿痛下利不止水漿不下者並病方論見痞傷寒下後心煩腹滿臥起不安者宜梔子厚朴湯梔子去殼四兩厚朴薑製一兩枳實切一枚以上三味用水一盞半煎取八分去渣溫服得吐者止後服腹滿而煩若有燥屎者前條大承氣湯也若大便溏胸痛欲吐先此時極吐下者調胃承氣湯也論見嘔太陽病吐之但太陽當惡寒今反不惡寒不欲近衣此為吐之內煩也脈之微數不可灸灸則煩逆論見大法嘔時鬱郁微煩若與小柴胡湯嘔不止者大柴胡湯也若極吐下後胸滿便溏腹痛者調胃承氣湯也病欲解者必當先煩乃有汗而解論見大法太陽病初服桂枝湯反煩不解者先刺風池風府卻與桂枝湯則愈傷寒發熱汗解半日許復煩脈浮數者可更發汗宜桂枝湯主之病人脈已解而日暮微煩以病新瘥人強與谷脾胃氣尚弱不能消穀故令微熱煩損谷則愈吐利汗後脈平小煩者以胃虛不勝穀氣也論見吐利心悸而煩若少陽汗後譫語胃不和煩悸者活人用調胃承氣湯論見口苦若二三日心中悸而煩者宜小建中湯論見悸心煩而渴方論見渴少陰病但欲寐而煩若自利而渴小便白者活人用四逆湯論見欲寐若與白通湯後下利不止厥逆無脈乾嘔者白通湯加豬膽汁若惡寒身倦時煩欲去衣者可治也論見但欲寐手足厥冷而煩若脈乍結乍緊及心中滿飢不能食者宜瓜蒂散吐之若脈緊至七八日自利脈緊變暴微手足反溫者欲解也方論並見下利若下利無脈乾嘔者白通湯加豬膽汁也論見下利煩躁煩躁有表證發熱惡寒體痛脈浮緊者大青龍湯也方論見發熱條若發汗不徹太陽證不罷其人面赤躁煩短氣者更發汗則愈論見短氣得病二三日脈弱無太陽柴胡症煩躁心下硬至四五日雖能食以小承氣湯少少與微和之令小安至六日與承氣湯一升若不大便六七日小便少者雖不能食但初頭硬後必溏未定成硬攻之必溏須小便利屎定硬乃可攻之宜大承氣湯王注云無太陽證為無表證也無柴胡症為無半表半裡證也煩躁不大便續臍痛發作有時者有燥屎也下之後復發汗日夜煩躁不得安眠時安靜不嘔不渴無表證脈沉微身無大熱者宜乾薑附子湯乾薑一兩附子生用一枚上二味以水三升煮取一升去渣頓服海服薑附湯有二法一法當熱服手少陰心也水包火熱服以接心火身表寒盛外火少也寒從外生熱從內消譬如凍死寒在外也一法當寒服足少陰腎也寒邪入水冷服以類腎水身表微熱內水多也熱從外生寒從內消譬如飲冷寒在內也發汗若下之病仍不解煩躁者宜茯苓四逆湯茯苓一兩人參六錢附子一枚生用去皮臍作八片只用二片甘草乾薑各二錢上銼如麻豆大作一服水一盞半煎至八分去渣溫服煩躁心下硬若未曾下者即前條無太陽柴胡症以小承氣少少微和之也若已曾下心下硬痛短氣躁煩者大陷胸也若結胸證悉具煩躁者死也方論見結胸火逆下之因燒針煩躁者宜桂枝甘草龍骨牡蠣湯桂枝去皮半兩甘草炙牡蠣熬龍骨各一兩上銼如麻豆大每服五錢水一盞半煎至八分去渣溫服太陽病以火熏之不得汗其人必躁如不解必清血名為火邪太陽病火尉其背大汗出火熱入胃胃中水竭躁煩必發譫語十餘日振栗下利者欲解也論見譫語煩躁厥逆若吐利者吳茱萸湯也論見吐利若不煩而躁四逆脈不至死也論見厥不得臥者死也論見下利成所謂煩躁者謂先煩漸至躁也所謂躁煩者謂先發躁而迤邐復煩者也從煩至躁為熱未有不漸煩而躁者也先躁後煩謂怫怫然更作躁悶此為陰盛隔陽也雖大躁欲於泥水中臥但飲水不得入口是也此氣欲脫而爭譬如燈將滅而暴明也蓋內熱曰煩謂心中郁煩也外熱曰躁謂氣外熱躁也內熱為有根之火故但煩不躁及先煩後躁者皆可治外熱為無根之火故但躁不煩及先躁後煩者皆不可治也臟厥蛔厥煩躁方論見厥躁無暫定而厥者為臟厥靜而復煩吐蟲而厥者為蛔厥烏梅丸主之方論見厥熱少厥微不欲食煩躁數日小便白者熱除也若欲食者愈若厥而嘔胸脅煩滿者便血論見厥少陰病但欲寐不煩至五六日變自利煩躁不得臥者死論見欲寐煩躁續法活病人身冷脈沉細疾煩躁而不飲水者陰盛隔陽也宜服霹靂散須臾躁止得睡汗出即瘥火焰散丹砂丸並主之丹砂丸方見活人書霹靂散治陰盛隔陽煩躁不飲水附子一枚炮熟取出用冷灰挹細研入真臘茶二錢和勻上為細末分作二服水二盞煎至六分臨熟入蜜半匙放溫或冷服之須臾躁止得睡汗出即瘥海已寒丸此丸不僭上陽生於下治陰症服四逆輩胸中發躁而渴者或數日大便祕小便澀亦服此丸上不躁大小便自利肉桂茯苓各五錢良薑烏頭炮各七錢附子炮乾薑炮芍藥茴香炒各一兩上等分為細末糊為丸如桐子大溫酒下空心服五七十丸八九十丸亦得酒醋為糊俱可本破陰丹治陰中伏陽煩躁六脈沉伏方論見陰毒頃年鄉人李信道得疾六脈沉伏不見深按至骨則若有力頭疼身溫煩躁指末皆冷胸中滿噁心更兩醫矣皆不識止用調氣藥豫診之曰此陰中伏陽也仲景法中無此證世人患此者多若用熱藥以助之則為陰所隔絶不能導引真陽反生客熱用冷藥則所伏真火愈見消爍非其治也須用破散陰氣導達真火之藥使火升水降然後得汗而解矣豫授此藥二百粒作一服冷鹽湯下不時煩躁狂熱手足躁擾其家大驚豫曰俗所謂換陽也須臾稍定略睡身已中汗自昏達旦方止身涼而病除矣咳傷寒表不解心下有水氣乾嘔發熱而咳或渴或利或噎或小便不利少腹滿或喘者宜小青龍湯麻黃芍藥各三錢五味子半兩乾薑甘草細辛桂枝去皮半夏各三錢上㕮咀每服五錢水盞半煎八分去渣溫服若微利者去麻黃加芫花如彈子大熬赤色若渴者去半夏加栝蔞根三分若噎者去麻黃加附子一錢五分炮若小便不利少腹滿者去麻黃加茯苓一兩若喘者去麻黃加杏仁三分去皮尖咳而往來寒熱胸滿心煩喜嘔者小柴胡去人參薑棗加五味乾薑也方論見往來寒熱咳而表解胃實屬陽明病若反無汗小便利而嘔手足厥者必頭痛若頭眩不惡寒能食者必咽痛論見胃實咳而但欲寐屬少陰病若下利腹痛小便不利四肢重痛者用真武湯加五味子細辛乾薑也若下利六七日變咳嘔渴不得眠者豬苓湯也若下利譫語小便難者被火氣劫也若四逆者用四逆散加五味子乾薑也方論並見欲寐傷寒咳逆上氣其脈散者死謂其形損故也咳而失小便者不可發汗汗出則四肢厥冷論見遺尿咳續法丹崇慶和尚因飽醉後發熱嗽而右脅痛渴不安眠柴胡黃芩白朮陳皮桔梗木通各二錢人參麻黃各一錢半甘草三錢上分三帖水煎服云傷寒汗後喘咳不止恐傳肺痿補肺散人參一兩五味子五錢桑白皮二兩款冬花蛤蚧一對上為細末每服五錢沸湯一盞調服傷寒汗下後咳嗽肺虛聲音嘶敗者宜阿膠散薯蕷阿膠炒五味子麥門冬去心白朮各一兩乾薑炮桂枝各二錢杏仁去皮尖三錢上銼細末每服七錢水二盞入烏梅肉一錢同煎服傷寒汗下後喘咳煩躁氣滯澀邪氣逆者用桔梗湯桔梗桑白皮各一兩甘草貝母訶黎勒各五錢上為細末每服五錢入五味子烏梅肉各一錢水二盞同煎服小便不利小便不利表不解若干嘔發熱而咳少腹滿者小青龍湯去麻黃加茯苓也方論見效若汗下後仍項強發熱心下滿痛者桂枝去桂加茯苓白朮方論見項強小便不利胸脅滿若往來寒熱未汗下者小柴胡去黃芩加茯苓汗下後者加柴胡桂薑方論見往來寒熱若煩驚譫語身重不可轉側者柴胡湯加龍骨牡蠣也論見不得臥小便不利大便乍難乍易喘急不能臥者大承氣湯論見不得臥條小便不利而渴若脈浮數發熱者五苓散加豬苓湯方論見渴若頭汗者柴胡桂薑湯加茵陳蒿湯方論見發黃小便不利關節疼痛若痛不得屈伸汗出惡風身腫者屬風濕宜甘草附子湯若脈沉緩大便反快者屬濕痹活人用五苓散也方論見身痛小便不利頭汗若脅滿者柴胡薑桂也方論見往來寒熱若發黃者茵陳蒿湯也小便不利身發黃方論俱見發黃大下後復發汗小便不利者亡津液故也勿治之得小便利必自愈活人云若大渴引飲須利之小便不利但欲寐者屬少陰若腹滿下利膿血者用桃花湯腹痛下利四肢重痛者用真武湯也方論見下利若四逆者用四逆散加茯苓方論見但欲寐陽明病小便不利濈然汗出者若欲食者愈不能食者欲作痼瘕痼瘕者寒氣積結也小便不利續法活陰症小便不利手足厥冷脈微細者不宜服利小便冷滑藥但服返陰丹並取臍下石門穴灸之方論見陰毒返陰丹集傷寒小便不通取陰谷陰陵泉傷寒後小便不利見小便不通門小便難汗後小便難若太陽發汗遂漏不止者則惡風小便難四肢難屈伸宜桂枝附子湯也方論自汗若太陽症中風以火劫發汗則邪風被火熱血氣流溢身黃陽盛陰虛欲衄小便難也方論見頭汗若少陰以火劫汗者則咳而下利譫語小便難也論見脅痛下後小便難有二若脈遲浮弱惡風寒下之者則脅滿身黃項強小便難也見脅痛若陽明胃實發熱惡寒脈浮緊下之者則腹滿小便難也論見胃實脅痛身黃小便難若陽明胃實未下者宜小柴胡湯若下後不食項強者忌柴胡論見脅痛尸厥鬱冒少陰脈不至腎氣微少精血奔氣促迫上入胸膈榮氣反聚血結心下陽氣退下熱歸陰股與陰相動令身不仁此為尸厥當刺期門太陽病下之不愈因復發汗以此表裡俱虛其人因至冒冒家汗出自愈所以然者汗出表和故也得里和然後復下之得里和三字中間必有衍文脫簡得字當是若字之誤里和當是里未和蓋脫一未字也下利清穀脈沉遲其人面赤身有微熱者必鬱冒汗出解論見下利小便不利大便乍難乍易喘冒不能臥者大承氣湯論見下利諸乘寒者則為厥鬱冒不仁口急不能言戰栗也論見大法眩冒心下硬若不汗下吐而項強者為並病宜刺大椎肺腧肝腧論見項強若汗下吐後脈微氣上衝咽者成痿論見氣上衝少陰病但欲寐下利止而眩冒者死論見欲寐尸厥鬱冒續法海傷寒傳至五六日間漸變神昏不語或睡中獨語一二句目赤唇焦舌乾不飲水稀粥與之則咽不與則不思六脈細數而不洪大心下無痞腹中不滿大小便如常或傳至十日以來形貌如醉醫見神昏不已多用大承氣湯下之則誤矣蓋不知此熱傳手少陰心經也然又未知自何經而來答曰本太陽經傷風風為陽邪傷衛陰血自燥熱蓄膀胱壬病逆傳於丙丙丁兄妹由是傳心心火自上迫熏肺所以神昏也蓋肺為清肅之臟內有火邪故令神昏宜梔子黃芩黃連湯若脈在丙者導赤散脈在丁者瀉心湯若誤用涼膈散此乃氣中之血藥也如右手寸脈沉滑有力者則可用之或用犀角地黃湯近於是已本方所説若無犀角以升麻代之是陽明經藥也此解陽明經血中熱藥若脈浮沉俱有力者是丙丁俱有熱可以導赤散瀉心湯各半服之則宜矣此症膀胱傳丙足傳手經者下傳上也丙傳丁者表傳裡也壬傳丁者艮之離也越經傳者又為腑傳臟也活人云傷寒只傳足經不傳手經者此言不盡意也有從足經而傳手經者何以知之經云傷寒或止傳一經或間傳三經不可一途取之但視其脈與外證治之此活法也與食則咽者邪不在胃也不與則不思者以其神昏故也邪熱既不在裡誤用承氣下之其死也必矣脈在丙者脈浮也脈在丁者脈沉也脈丙丁俱有熱者浮沉俱有力也噫噫而心下痞硬不利者旋覆代赭湯若下利者生薑瀉心湯也方論見痞噫續法云傷寒噫氣者何氣使然答曰胸中氣不交故也少陰經至胸中交於厥陰水火相傳而有聲故噫氣也宜如聖加枳實湯甘草桔梗各五錢枳實炒三錢上銼細每服五錢入五味子半錢水煎服傷寒汗下後喘而噫氣者宜如聖加人參藿香杏仁湯甘草桔梗人參藿香杏仁各等分上銼細每服五錢水煎服噦傷寒大吐大下後極虛復極汗出者以其人外氣怫鬱復與之水以發其汗因得噦所以然者胃中寒冷故也胃中虛冷不能食者飲水則噦與小承氣湯入腹中不轉矢氣者不可攻之攻之必脹滿不食與水則噦論見潮熱本渴而飲水嘔者噦食谷者噦論見脅痛陽明病胃實不能食者攻其熱必噦論見胃實濕家頭汗出背強惡寒欲覆被向火者下之早則噦論見體痛太陽病以火劫發汗血氣流溢身黃欲衄頭汗腹滿譫語甚者至噦捻衣摸床小便利者可治論見頭汗傷寒噦而腹滿視其前後知何部不利利之則愈陽明胃實脈弱浮大短氣腹滿脅痛嗜臥身黃小便難有潮熱時時噦脈浮者小柴胡若不尿腹滿加噦者不治論見胃實噦續法活噦胃寒所生橘皮乾薑湯羌活附子散半夏生薑湯退陰散主之若服藥不瘥者灸乳直下一指許三壯若婦人則屈乳頭下盡處是穴亦有陽症者小柴胡湯橘皮竹茹湯方見雜病噦橘皮乾薑湯橘皮通草乾薑桂心甘草各三兩人參二兩上㕮咀每服四錢水一盞煎至六分去渣溫服日三羌活附子散方見雜病噦半夏生薑湯治噦欲死半夏一兩生薑二兩切上水二盞煎至八分去渣溫服海傷寒咳逆脈散死仲景之言不虛偽大抵原因失下生咳逆喉中陰不內便軟惟宜用瀉心便硬尤宜大承氣二藥神工作者誰東垣潔古為良劑潔咳逆者火熱奔急上行而肺陰不內何其當哉故便祕者宜大承氣下之便軟者瀉心湯主之海少陰咳逆者此失下也陰消將盡陽逆上行使陰不內也然陰既盡陽亦將盡也吸入腎與肝陽逆上行陰入不內故為陽極脈微將盡者不宜下宜服瀉心湯養陰退陽而已如不用瀉心湯涼膈散去硝黃清肺散亦可若脈左浮右沉實非表也里極則反出於表也何以然咳逆舌強右脈實者知少陰里也飲水過多心下痞而渴逆者五苓散主之別無惡候是也惡候生或兼以舌攣語言不正而反昏冒與咽痛者少陰也速下之宜大承氣湯也何以脈浮為表浮之實大沉之損小是為表也浮之實大沉之亦然即非表也邪入已深矣內熱當沉反浮陽極復之表也陰症者內已伏陰陰氣太甚腎水擅權肝氣不生胃火已病丁火又消所以遊行相火寒邪迫而萃集於胸中亦欲盡也故令人發熱大渴引飲欲去蓋覆病人獨覺熱他人按執之身體肌肉骨髓血脈俱寒此火即無根之火也宜用丁香乾薑之類熱藥溫胃其火自下勻氣散川烏頭大者三個炮裂去皮臍上為細末每服三錢用黑豆二十一粒砂糖同泡湯調乘熱細細飲之本治陰毒厄逆方川烏頭乾薑附子以上俱炮肉桂芍藥半夏炙甘草吳茱萸陳皮大黃各等分上為細末每服一錢水一盞生薑三五片煎至七分去渣溫服肉豆蔻湯治傷寒汗後厄逆噫氣肉豆蔻一個石蓮肉炒茴香各一兩人參丁香各半兩枇杷葉五片拭去毛炙上銼細用水四盞生薑十片煎二盞去渣空心溫服分二服良薑湯橘皮良薑桂枝當歸各一兩麻黃半兩杏仁二十個甘草半兩檳榔三個另為末上㕮咀用水四盞薑十片棗三枚同煎至二盞去渣下檳榔末再煎三沸通口服一盞未已再服龐老云傷寒厄逆不止是陰陽氣升降欲作汗升之不下故胃氣上逆為厄逆無休止宜服此方無汗太陽發熱惡風寒體痛脈浮緊無汗其人若喘者麻黃湯也若煩躁者大青龍湯也若項背強者葛根湯也方論見發熱若小便少氣衝胸口噤者為剛痓亦葛根湯也論見痓若自衄者必自愈論見衄陽明病胃家實法當多汗若反無汗者有四證脈浮而喘者邪尚在表宜麻黃汗之身如蟲行癢者久虛宜建中之類小便利而厥者寒邪宜溫之小便不利發黃者瘀熱宜茵陳利之也論見胃實無汗身癢其人若脈微惡寒面反有熱色者桂枝麻黃各半湯也方論見發熱若脈浮遲面赤戰惕發熱者遲為無陽不能作汗也論見面赤若陽明胃實身如蟲行者久虛也論見胃實無汗小便不利其人若身黃頭汗渴飲水漿或懊憹者宜茵陳湯方論見發熱若身黃脅痛鼻乾嗜臥有潮熱脈浮者柴胡湯方論見胃實若項強發熱心下滿痛桂枝去桂加茯苓白朮也方論見項強無汗禁忌若浮緊身痛者忌桂枝論見大法脈浮發熱表不解者忌白虎論見渴若少陰欲寐但厥者忌強發汗必動其血也論見欲寐凡發汗如服一劑病症尤在當再作本湯與之至有不肯汗出者服三劑乃解若汗不出者死病也論見大法無汗續法摘傷寒在表發熱惡寒頭項痛腰脊強無汗尺寸脈俱浮合谷五分候遍身汗出即出針此穴發汗大妙復溜瀉云又法手陽明商丘合谷手太陽腕骨陽谷足少陽俠溪足陽明厲兌手厥陰勞宮皆隨經辨脈刺之又十二經滎皆可刺摘傷寒發汗不出風池俠溪魚際散脈中二分留三呼經渠二分內庭應時出汗瘧狀太陽病如瘧狀一日二三度發其人若脈微緩不嘔清便者欲愈也若脈微惡寒面有熱色身癢者桂枝麻黃各半也方論見發熱服桂枝湯大汗出脈洪大者與桂枝湯如前法若形如瘧日再發者汗出必解宜桂枝二麻黃一湯桂枝八錢半芍藥五錢半麻黃三錢二字大棗二個生薑五錢半杏仁去皮尖八枚甘草半兩上㕮咀每服五錢水一盞半煎至八分去渣溫服病人煩熱汗出解又如瘧狀日晡所發者屬陽明也脈實者宜下之脈浮虛者宜發汗下之與大承氣湯發汗宜桂枝湯婦人寒熱經水適斷者為熱入血室其血必結故使如瘧狀發作有時小柴胡湯主之論見婦人傷寒頭汗頭汗小便不利其人若胸脅滿往來寒熱者柴胡桂薑也方論見往來寒熱若發黃渴飲水漿者宜茵陳湯方論見發黃陽明胃實頭汗其人若下血譫語者為熱入血室宜刺期門論見譫語若下後手足溫不結胸心中懊憹飢不欲食者宜梔子豉湯方論見煩若被火額上汗出小便不利者必發黃也方見胃實頭汗心下滿其人若脈沉細微惡寒手足冷口不欲食大便硬者小柴胡湯論見厥往來寒熱若水結胸無大熱者大陷胸湯孫兆改用半夏茯苓湯太陽病中風以火劫發汗邪風被火熱血氣流溢失其常度兩陽相熏灼其身發黃陽盛則欲衄陰虛則小便難陰陽俱虛竭身體則枯燥但頭汗出劑頸而還腹滿微喘口乾咽爛或不大便久則譫語甚者至噦手足躁擾捻衣摸床小便利者可治關格不通不得尿頭無汗者可治有汗者死濕家關節疼痛下之額上汗出微喘小便利者死下利不止者亦死濕家頭汗出欲被覆向火者若下之早則噦胸滿小便不利舌上白胎也論見身痛頭汗續法孫凡水結胸脅間頭必有汗治以半夏茯苓湯活病人表實裡虛玄府不開則陽氣上出汗見於頭凡頭汗出者五臟乾枯胞中空虛津液少也慎不可下下之謂之重虛成頭者諸陽之會邪搏諸陽津液上湊則汗見於頭也海頭汗出劑頸而還血證也額上偏多者屬心部為血證也獨益中州脾土以血藥治之其法無以加矣舌白胎舌上白胎若陽明胃實脅下滿不大便而嘔者小柴胡湯論見胃實若下後心中懊憹者梔子豉湯方論見煩若下後噦而胸滿小便不利者丹田有熱胸中有寒也論見牙疼脈陰陽俱緊者口中氣出唇口乾燥倦臥足冷鼻中涕出舌上胎滑勿妄治也到七日以來其人微發熱手足溫者此為欲解或到八日以上反大熱者此為難治設使惡寒者必欲嘔也腹內痛者必欲利也海藏云惡寒必欲嘔者小柴胡湯腹中痛者理中湯臟結如結胸狀飲食如故時時下利寸脈浮關脈小細沉緊舌上白胎滑者難治也若無陽症不往來寒熱其人反靜者不可攻也論見臟結舌胎續法成舌者心之官法應南方火本紅而澤傷寒三四日以後舌上有膜白滑如胎甚者或燥澀黃黑是數者熱氣淺深之故也邪氣在表者舌上即無胎及邪氣傳裡津液結搏則舌上生胎矣寒邪初傳未全成熱或在半表或在半里或邪氣客於胸中者皆舌上白胎而滑也經曰舌上如胎者以丹田有熱胸上有寒邪初傳入里也陽明病脅下硬滿不大便而嘔舌上白胎者可與小柴胡湯是邪在半表半裡也太陽病若下之則胃中空虛客氣動膈心中懊憹舌上胎者梔子豉湯主之是邪客於胸中也若病在臟宜若可下如舌上滑胎者則不可攻是邪未全成熱猶帶表寒故也及其邪傳為熱則其舌上之胎不滑而澀也經曰傷寒七八日不解熱結在裡表裡俱熱時時惡風大渴舌上乾燥而煩欲飲水數升者白虎加人參湯主之是熱耗津液而滑者已干也若熱聚於胃則為之舌黃是熱已深矣金匱要略曰舌黃未下者下之黃自去若舌上黑色者又為熱之極也針經曰熱病口乾舌黑者死以心為君主之官開竅於舌黑為腎色見於心部心部者火也腎者水也水之邪熱已極鬼賊相刑故知必死也垣下後病嗽加五味子麥門冬如舌上有滑胎者是胸中有寒勿用之胸有微寒加辛熱之劑立效舌燥澀如楊梅刺者用生薑切厚片蘸蜜於舌上揩之其刺立消神效無薄荷蜜治舌上白胎乾澀語話不真先以生薑厚片蘸蜜水揩洗有用薄荷自然汁與白蜜等分調勻敷之良動氣成動氣者為築築然動跳於腹者是也動氣在右不可發汗發汗則衄而渴心苦煩飲即吐水活人云先服五苓散三服次服竹葉湯動氣在左不可發汗發汗則頭眩汗不止筋惕肉瞤活人云先服防風白朮牡蠣汗止次服建中湯方見自汗動氣在上不可發汗發汗則氣上衝正在心端活人云宜服李根湯方見氣上衝動氣在下不可發汗發汗則無汗心中大煩骨節苦疼目暈惡寒食則反吐谷不能進活人云先服大橘皮湯吐止後服小建中湯動氣在右不可下下之則津液內竭咽燥鼻乾頭眩心悸也動氣在左不可下下之則腹內拘急食不下動氣更劇雖身有熱臥則欲蜷動氣在上不可下下之則掌握熱煩身上浮冷熱汗自泄欲得水自灌動氣在下不可下下之則腹脹滿卒起頭眩食則下清穀心下痞也動氣續法云傷寒汗下後臍在有動氣者宜防葵散防葵一兩木香不見火柴胡黃芩各半兩上銼為細末每服五錢水煎服傷寒汗下後臍上有動氣者宜枳殼散枳殼麩炒五錢赤茯苓當歸三稜炮各一兩木香訶黎勒各五錢上為末每服五錢沸湯點服傷寒汗下後臍右有動氣者宜前胡散前胡赤茯苓大腹皮人參各五錢木香檳榔大黃各三錢上為細末每服五錢沸湯點服傷寒汗下後臍下有動氣者宜茯苓散赤茯苓一兩檳榔三錢桂心大腹皮川茴香炮炒良薑各五錢上為細末每服五錢沸湯點服如久不治傳為積熱治之難痊不可汗下也鼻衄傷寒脈浮緊不發汗因致衄者麻黃湯主之活人云衄後脈浮者宜麻黃湯衄後脈已微者不可行麻黃湯宜黃芩芍藥湯太陽病脈浮緊無汗發熱身疼痛八九日不解表症仍在此當發其汗服藥已微除其人發煩目瞑劇者必衄乃解所以然者陽氣重故也麻黃湯主之不大便頭痛有熱若小便赤者承氣湯也若小便清而衄者桂枝湯也論見發汗太陽病脈浮緊發熱無汗而衄者愈也論見發熱太陽病以火劫發汗血氣流溢失其常度陽盛則欲衄陰虛則小便難論見頭汗少陰病但厥無汗而強發之必動其血或從口鼻出或從目中出者難治論見欲寐動氣發汗則衄而渴飲水就吐論見動氣脈浮發熱口乾鼻燥能食者則衄陽明胃實口燥但欲漱水不咽者必衄也衄家不可發汗汗出必額上陷脈急緊直視不能瞬不得眠衄忌發汗者為無脈若浮緊身疼發熱惡寒之症宜發之鼻衄續法海仲景言衄不可發汗者蓋為脈微也若浮緊者麻黃湯浮緩者桂枝湯脈已微二藥不可用犀角地黃湯主之仲景云衄家不可發汗汗出必額上陷脈緊直視不能瞬不得眠又云亡血不可發其表汗出即寒栗而振此二説皆為脈微不可汗也若脈浮緊及得緩者皆當發之是也活傷寒衄血脈已微者黃芩芍藥湯犀角地黃湯主之犀角地黃湯治傷寒應發汗而不發汗內有瘀血鼻衄吐血面黃大便黑此方主消化瘀血芍藥一兩生地一兩半牡丹皮二錢半犀角二錢半上㕮咀每服五錢水一盞半煎取一盞有熱如狂者加黃芩一兩其人脈大來遲腹不滿自言滿者為無熱不用黃芩茅花湯治鼻衄不止用茅花尖一把以水三盞濃煎汁一盞分二服即瘥無花以根代之若衄而渴者心煩飲則吐水先服五苓散次服竹葉湯本治傷寒衄血滑石丸滑石末不以多少飯丸如桐子大每服十丸微嚼破新水咽下立止用藥末一錢飯少許同嚼下亦得老幼皆可服湯晦叔云鼻衄者當汗不汗所致其血青黑時不以多少乃止宜服溫和藥以調其衛才見鮮血急以此藥治之下血傷寒下血若太陽病外已解但少腹急結者桃仁承氣湯也方論見蓄血若陽明胃實譫語者宜刺期門穴論見譫語太陽病以火熏汗不得汗其人必躁而清血論見躁淋家不可發汗發汗則便血太陽病下之其脈浮滑者必下血論見大法少陰病但欲寐一身手足盡熱者必便血也傷寒熱少厥微不欲食煩躁數日小便利色白若欲食者愈若嘔而胸脅煩滿者必便血也唾血咽痛吐血若面赤斑斑如錦紋者為陽毒宜升麻鱉甲湯方論見陽毒若下後利不止手足厥逆下部脈不至者麻黃升麻湯方論見下利脈浮熱甚反灸之必咽燥唾血論見大法服桂枝湯吐者必吐膿血論見吐蓄血身黃如狂屎黑喜忘者為蓄血太陽病表證在而發熱惡寒脈反沉結而身黃髮狂少腹硬滿者若小便不利為無血也小便自利血證諦也宜以抵當湯主之論見發熱抵當湯水蛭十個熬去子杵虻蟲十枚去翅足熬大黃一兩湯浸去皮桃仁七枚去皮捶碎上㕮咀作一服水一盞煎七分去渣溫服傷寒有熱少腹滿應小便不利今反利者為有血也當下之不用余藥宜抵當丸水蛭五枚炙虻蟲五枚去翅足炒桃仁六枚大黃三錢上為末煉蜜和作一丸以水一盞煎至七分頓服晬時當下血不下再服太陽病不解熱結膀胱其人似狂若血自下者病愈其外未解者尚未可攻當先解外外解但小腹急結者宜攻之桃仁承氣湯王海藏方有薑七片桂硝各三錢桃仁十二枚去皮尖雙仁者不用大黃一兩甘草炙桂枝芒硝各半兩上㕮咀每服一兩水二盞煎至一盞去渣入硝化開食後服陽明症胃家實喜忘大便黑色雖硬反易者有蓄血宜抵當湯論見胃實海初便褐色者重再便深褐色者愈重三便黑色者為尤重色變者以其火燥也如羊血在日色中須臾變褐色久則漸變而為黑色即此意也當詳察之許血在上則喜忘在下則發狂病人無表裡症發熱七八日雖脈浮數者可下之假令已下脈不解胃熱則消穀善飢至六七日不大便者有瘀血宜抵當湯若脈數不解血下不止必協熱而便膿血也成當不大便六七日之際無喜忘如狂之症又無少腹硬滿之候何以知其有蓄血蓋以其脈浮數故也浮則熱客於氣數則熱客於血下後浮數俱去則病已若下後數去而浮仍在則榮血中熱去而衛氣中熱在為邪氣獨留心下善飢邪熱不殺穀潮熱反渴也若下後浮去而數不解則衛氣中熱去而榮血中熱在血熱合並迫血下行胃虛協熱消穀善飢血至下焦若下不止則血得以泄必膿血也若不大便六七日則血不得出泄必蓄在下焦為瘀血故須以抵當湯下之病者胸滿痞痿舌青口燥但漱水不欲下咽無寒熱脈微大來遲腹不滿其人言我滿為有瘀血海云漱水不咽胸滿心下手不可近者桃仁承氣湯主之病者如熱狀煩滿口乾燥而渴其脈反無熱此為陰伏是瘀血也當下之衄血唾血蓄血續法海血症古人用藥雖有輕重之殊而無上下之別今分作上中下三等以衄血嘔血唾血吐血為上部血結胸中為中部蓄血下焦為下部夫既有三部之分故藥亦當隨其輕重也汗多為衄血脈浮灸之咽燥為唾血當汗不汗熱入於裡者為嘔血吐血此在上也犀角地黃湯主之涼膈散加生地黃亦可然衄唾嘔吐俱在上亦當以輕重分之大凡血證皆不飲水惟氣證則飲之宜詳之此證乃足太陰所主脾所不裹越而上行所以有吐血嘔血之候也實者犀角地黃湯虛者黃芩芍藥湯凡病嘔吐者以脾所主故咸用芍藥主之是知太陰藥也血結胸中頭痛身痛漱水不咽者衄無熱胸滿漱水不欲咽者喜忘昏迷其人如狂心下手不可近者血在中也桃仁承氣湯主之蓄血下焦其人發狂小腹滿硬小便自利大便反黑及臍下疼者抵當湯丸主之如狂者在中發狂者在下抵當湯丸藥味同劑如何是二法蓋喜忘發狂身黃屎黑者疾之甚也但小腹滿硬小便利者輕也故有湯丸之別桃仁大黃等分水蛭虻蟲多者作湯三之二者作丸丸之名取其數少而緩也故湯用煎服一升丸止服七合也活病人無表症不發寒熱唇燥但欲漱水不欲入咽其脈微而沉小腹硬滿小便反利大便必黑身黃髮狂此血證諦也大抵傷寒當汗不汗裡熱蓄化為血其人喜忘而如狂血上逆則喜忘血下蓄則如狂輕者犀角地黃湯桃仁承氣湯甚者抵當湯丸須取盡黑物為效按太陽病蓄血者表症仍在也今云無表證者但説得陽明蓄血為未備海喜忘發狂身黃屎黑者疾之甚也但小腹滿小便利者輕也生地黃丸病人七八日後兩手脈沉細微膚冷臍下滿或狂或躁大便實而色黑小便自利者此蓄血證也若老幼氣虛弱者宜此方主之生地黃自然汁一升如無生地黃只用生乾地黃二兩乾漆半兩炒煙盡生藕自然汁半升如無藕用刺薊汁一升半藍葉一握切細乾者用末半升虻蟲二十個去翅足麩內炒黃水蛭十個炒大黃一兩銼如豆大桃仁研碎半兩上一處入水三升同慢火熬及二升放冷分二服先投一服至半日許血未下再投之此地黃湯比抵當湯丸其勢甚輕如無地黃與藕汁升數添水同煎抵當丸恐用之太過不止損血故以此湯主之吐血垣治一貧士病脾胃虛與補劑藥愈後繼而居曠室臥熱炕咳而吐血數次豫謂此久虛弱外有寒形而有火熱在內上氣不足陽氣外虛當補表之陽氣瀉里之虛熱蓋冬居曠室衣服單薄是重虛其陽表有大寒壅遏裡熱火邪不得舒伸故血出於口因思仲景治傷寒脈浮緊當以麻黃湯發汗而不與之遂成衄血卻與麻黃湯立愈與此甚同因與麻黃人參芍藥湯麻黃一錢去外寒桂枝半錢補表虛白芍藥一錢黃耆一錢實表益衛甘草炙一錢補脾五味五粒安肺氣門冬三分保肺氣人參三分益三焦元氣不足而實其表當歸五分和血養血上㕮咀作一服水三盞煎麻黃一味令沸去沫至二盞入余藥同煎至一盞去渣熱服臨臥一服愈觀此一方足以為萬世模範也蓋取仲景麻黃湯與補劑各半服之但凡虛人合用仲景方者皆當以此為則也活傷寒吐血諸陽受邪初熱在表應發汗熱毒入經結於五臟內有瘀積故吐血也瘀血甚者抵當湯也輕者桃仁承氣湯兼服犀角地黃湯三黃丸短氣短氣骨節痛不得屈伸汗出小便不利惡風身腫者為風濕宜甘草附子湯方論見體痛短氣腹滿脅痛其人若脈弦浮大外不解無汗嗜臥身黃小便難有潮熱者小柴胡湯也論見胃實方見往來寒熱若表未解手足濈然汗出或有潮熱者宜大承氣湯方論見潮熱條若表解心下痞硬乾嘔短氣者宜十棗湯方論見上短氣煩躁若發汗不徹續微汗出不惡寒表證不罷面赤者為並病更發汗則愈論見面赤若下後心中懊憹心下硬痛者用大陷胸湯論見結胸趺陽脈微而緊緊則為寒微則為虛微緊相搏則為短氣坐而伏者短氣也論見大法心痛傷寒五六日大下之後身熱不去心中結痛者未全解也梔子豉湯主之陽明病胃實脈弦浮大短氣腹滿脅下及心痛鼻乾無汗嗜臥身黃小便難有潮熱時時噦者小柴胡湯論見胃實方見往來寒熱心痛續法摘傷寒飲水過多腹脹氣喘心下痛不可忍宜灸中脘氣海二穴如小腹有氣上衝者宜灸天樞氣衝三里三陰交如無此症只用前穴除中傷寒脈遲六七日而反與黃芩湯徹其熱脈遲為寒今與黃芩湯復除其熱腹中應冷當不能食今反能食此名除中必死眼睛不慧語言不出而穀食反多者此為除中口雖欲言舌不能語凡手足厥冷而利不當食而食者恐為除中試與索餅食之發熱者除中不發熱者非也論是厥門下重泄利下重若少陰症欲寐四逆者四逆湯加薤白散若熱者白頭翁湯方論見下利脈浮宜以汗解用火灸之邪無從出因火而盛病從腰以下必重而痹名火逆也脈遲浮弱惡風寒者表症醫反下之遂不食脅痛身黃項強小便難復與柴胡湯必下重論見脅痛下利脈沉弦者下重也論見下重身熱惡寒身寒惡熱病人身大熱反欲得近衣者熱在皮膚寒在骨髓也活人云先以桂枝湯治寒次以小柴胡加桂以溫其表身大寒反不欲近衣者寒在皮膚熱在骨髓也活人云先與白虎湯加人參除熱次以桂枝麻黃各半湯以解其外續增啞射干湯治初秋暴雨冷及天行暴寒其熱喜伏於內咳嗽曲折不可得氣息喉啞失聲干嗽無唾喉中如梗射干一兩半夏二兩半杏仁兩半去皮尖炒生薑炮二兩甘草紫菀各一兩橘皮肉桂枳實炙各二兩當歸獨活麻黃以上各一兩上㕮咀每服五錢水一盞半煎至八分去渣溫服續增斑海陽症發斑有四有溫毒發斑有熱病發斑有時氣發斑有傷寒發斑以上四斑活人有治法見後斑斑如錦紋或發之四末或發之面部或發之胸背色紅赤者胃熱也紫黑者胃爛也一則下早一則下晚乃外感熱病而發也宜用玄參升麻湯白虎等藥王朝奉云赤斑出五死一生黑斑出十死一生皆用白虎人參湯阿膠大青龍湯兼與紫雪散大妙可下者調胃承氣湯活溫毒發斑者初春病人肌肉發斑癮疹如錦紋或咳心悶但嘔者是也冬時觸冒寒毒至春始發初病在表或已汗吐下而表證未罷毒氣未散以此發斑宜用黑膏主之又有冬月溫暖人感乖戾之氣冬未即病至春或被積寒所折毒氣不得泄至天氣暄暖溫毒始發則肌肉斑疹如錦紋而咳心悶但嘔有清汁宜用葛根橘皮湯主之黑膏方療溫毒發斑生地半斤切碎好豉一升上二味豬膚二斤合一處煎令三分減一絞去渣用雄黃麝香如豆大為末同藥再煎服之其毒便從皮中出者則愈忌蕪荑葛根橘皮湯療冬溫未即病至春被積寒所折不得發至夏得熱其寒解冬溫始發肌中斑爛癮疹如錦紋而咳心悶但嘔吐有清汁宜服此湯即止葛根橘皮杏仁去皮麩炒知母黃芩麻黃去節湯泡甘草炙各半兩上㕮咀每服五錢水一盞半煎至一盞去渣溫服熱病發癍與時氣發癍並同夫病人或未發汗或已經發汗而熱毒不散表虛里實熱毒乘虛出於皮膚所以發癍瘡癮疹如錦絞俗名謂之麩瘡素問謂之疹大抵發癍不可用表藥蓋表虛里實若發其汗重令開泄更增癍爛也宜用玄參升麻湯大青四物湯豬膽雞子湯選用之玄參升麻湯治傷寒發汗吐下後毒氣不能散表虛里實發熱於外故身發癍如錦紋甚則煩躁譫語兼治喉閉腫痛玄參升麻甘草炙各半兩上㕮咀每服五錢水一盞半煎至八分去渣熱服大青四物湯治傷寒熱病十日以上發汗及吐利後熱不除身上斑出大青一兩阿膠甘草各一錢半豆豉二合上㕮咀每服五錢水一盞半煎至一盞旋入膠再煎令溶服豬膽雞子湯治五六日斑出豬膽三合雞子一枚苦酒三合上三味合煎三沸強人盡服瘦人煎六七沸服之陽毒升麻湯治癍出面方見陽毒海消毒飲子治癍黍黏子六錢荊芥防風各二錢甘草一錢上㕮咀水煎服陰症發癍出胸背又出手足亦稀少而微紅者若作熱症投之涼藥大誤矣此無根失守之火聚於胸中上獨熏肺傳於皮膚而為斑點但如蚊蚋蚤蝨咬形狀而非錦紋也宜調中溫胃加茴香芍藥以大建中陰毒升麻鱉甲湯之類其斑自退可謂治本而不治標也海藏云陽明發斑亦有紅點如斑出於皮毛之間者宜白虎瀉心等藥當審之大建中湯方見治惡寒門陰毒升麻鱉甲湯治陰斑方見陰毒侯國華病傷寒四五日身微斑渴欲飲診之沉弦欲絶厥陰脈也服溫藥數日不已又以薑附等藥覺陽微回脈生因渴私飲水一杯脈復退又見頭不舉目不開問之則犯陽易若只與燒裩散則寒而不濟矣遂更用吳茱萸湯一大服調燒裩散連進二服出大汗兩晝夜而愈丹發癍似傷寒者痰熱之病發於外汗以散之下之非理欲眠目不閉聲嗄為狐惑為𧈟狐惑之為病狀如傷寒或因傷寒而變成斯病其狀默默欲眠目牽不得閉臥起不安蟲蝕於喉咽為惑蝕於陰肛為狐不欲食惡聞食臭其面目乍赤乍黑乍白蝕於上部則聲嗄甘草瀉心湯主之方見痞蝕於下部則咽乾苦參湯洗之蝕於肛者雄黃散熏之用雄黃一味為末取二瓦合之燒向肛熏之脈經云病人或從呼吸上蝕其咽喉或從下焦蝕其肛陰蝕上為惑蝕下為狐狐惑病者豬苓散主之方未考究病者脈數無熱微煩默默但欲臥汗出初得之三四日目赤如鳩眼七八日目四眥一本皆有黃字黑若能食者膿已成也赤豆當歸散主之方見下血狐惑續法一婦人狐惑聲嗄多眠目不閉惡聞食臭不省人事半月後又手足拘強脈數而微細先與竹瀝薑汁一盞服之忽胸中有汗腹鳴即目閉省人事遂用參朮歸陳入竹瀝薑汁飲之五六帖而愈活狐惑傷寒與濕𧈟皆蟲證初得狀如傷寒或因傷寒變成此疾大抵傷寒腹內熱食少腸胃空虛三蟲行作求食蝕人五臟及下部為𧈟蟲病其候齒無色舌上盡白甚者唇黑有瘡四肢沉重忽忽喜眠蟲蝕其肛爛見五臟則死當數看其上下唇上唇有瘡蟲蝕其臟下唇有瘡蟲蝕其肛殺人甚急多因下痢而得治𧈟桃仁湯黃連犀角湯雄黃鋭散主之治𧈟桃仁湯生艾桃仁去皮尖炒雙仁不用槐花子碎各一兩大棗十五個去核上水二盞煎至一盞半分三服黃連犀角湯治傷寒及諸病之後內有𧈟出下部者黃連半兩犀角一兩烏梅七個沒藥一分上水二大盞半煎至一盞半分三服雄黃鋭散治下部𧈟瘡雄黃苦參青葙子黃連各二分桃仁去皮尖一分上為散以生艾搗汁為丸如棗核大綿裹納下部扁竹葉汁更佳冬月無艾只用散裹納亦得百合病百合病論曰百合病者謂無經絡百脈一宗悉致病也人常默默然意欲食不能食意欲臥不能臥意欲行不能行或有時聞食臭或時如寒無寒如熱無熱口苦小便赤諸藥不能治得藥即劇吐利如有神靈者身形雖似和其人脈微數每溺時輒頭痛者六十日乃愈若溺時頭不痛淅淅然者四十日愈若溺時快然但頭眩者二十日愈體症或未病而預見或病四五日而出或病二十日或一月微見者各隨其症治之活人云此名百合傷寒多因傷寒虛勞大病之後不平復變成奇疾也百合病發汗後宜服百合知母湯百合七枚劈知母三兩切上先將百合水洗浸一宿當白沫出去其水更以井水二盞煎至一盞去渣又將井水二盞另煎知母取一盞去渣和百合一盞同煎取一盞半分溫再服百合病下後者宜用滑石代赭湯百合七個劈滑石三兩碎綿裹代赭石如彈大一枚綿裹上先將百合水洗淨浸一宿當白沫出去水更以井水二升煎取一盞去渣另用水二升煎滑石代赭石取一升去渣後合和同煎取一升半分溫服百合病吐後宜用百合雞子湯百合七枚劈雞子黃一枚上先將百合水浸一宿當白沫出去其水更以井水二升煎取一盞去渣納雞子黃攪勻煎五分溫服百合病不經吐下發汗病形如初者宜百合地黃湯百合七個劈生地黃汁一升上水洗百合浸一宿當白沫出去水更以井水二升煎取一升去渣納地黃汁煎取一升五合分溫再服中病勿更服大便當如漆黑百合病一月不解變成渴者百合洗方主之用百合一升以水一斗漬之一宿洗身已食煮餅勿以鹽豉食之百合病渴不瘥者宜栝蔞牡蠣散栝蔞根牡蠣炒各等分上為末飲服方寸匕日三服百合病變發熱者一作發寒熱宜用百合滑石散百合一兩滑石三兩上為散飲服方寸匕日三服當微利止服熱則除百合病見於陰者以陽法救之見於陽者以陰法救之見陽攻陰復發其汗此為逆見陰攻陽乃復下之此亦為逆也
