body:
  text: 卷之六陰陽臟腑部治惡寒丹陽虛惡寒用參耆之類甚者加附子少許以行參耆之氣永康呂親家形瘦色黑平生喜酒多飲不困年近半百且有別館忽一日大惡寒戰且自言渴卻不能飲豫診其脈大而弱惟右關稍實略類弦重取則澀遂作酒熱內郁不得泄由表熱而下虛也黃耆一物與乾葛同煎與之盡黃耆二兩乾葛一兩脈得小次日安矣垣脾胃之虛怠惰嗜臥四肢不收時值秋燥令行濕熱少退體重節痛口舌乾食無味大便不調小便頻數不嗜食食不消兼見肺病灑淅惡寒氣慘慘不樂面色惡而不和乃陽氣不伸故也當升陽益胃名曰升陽益胃湯羌活半兩柴胡三錢獨活半兩防風半兩以其秋旺故以辛溫瀉之人參一兩去蘆甘草炙一兩白朮三錢半夏一兩湯洗脈澀者可用黃耆二兩澤瀉三錢不淋者勿用黃連二錢茯苓二錢小便利不渴者勿用橘皮不去穰四錢白芍藥五錢何故秋旺用人參白朮芍藥之類反補旺為脾胃虛則肺受病故因時而補母虛也上㕮咀每服三錢生薑五片棗二枚去核水三盞同煎至一盞去渣溫服早飯後午飯前服之禁忌如前其藥漸加至五錢止服藥如小便罷而病加增劇者是不宜利小便當少去茯苓澤瀉若喜食初一二日不可飽食恐胃再傷以藥力尚少胃氣不得轉運升發也須薄滋味或美食助其藥力益升浮之氣而滋其胃氣慎不可淡食以損藥力而助邪氣之降沉可以小役形體使胃與藥轉運升發慎勿大勞役使復傷胃氣若脾胃得安靜尤佳若胃氣稍強少食果以助谷藥之力五穀為養五果為助者也禁忌如前者服藥訖忌語話一二時辰及酒濕面大料物及冷蒸寒涼淡滲之物黃耆補胃湯治表虛惡賊風黃耆三錢甘草一錢麻黃一錢草豆蔻一錢半橘皮一錢半青皮七分當歸一錢香白芷一錢半升麻三分藁本三分柴胡六分黃柏八分上銼如麻豆大水二盞煎至一盞去渣稍熱食前服丹縉雲胡君錫年三十一歲形肥而大色稍蒼厚家富而足更專嗜口味兩年前得消渴病醫與寒涼藥而得安有一人教以病後須用滋補令其專用黃雌雞因此食至千餘隻漸有膈滿嘔吐之病醫者意為胃寒遂以附子沉香之藥百餘帖嘔病除月餘天氣大熱忽惡風足亦怕地氣遂堆糠尺許厚上鋪以簟糊以重紙方可坐臥而兩手不能執筆口鼻皆無氣以呼吸欲言無力行十餘步便困倦脈皆浮大而虛僅得四至豫作內有濕痰因多服燥熱藥遂成氣耗血散當此夏令自合便死因其色之蒼厚元氣尚全可以安穀遂以人參黃耆白朮熬膏煎淡五味子湯以竹瀝調飲之三日諸病皆愈令其頓絶肉味一月後康健如舊又以雞湯下飯一月後胸腹膨滿甚自煎二陳湯加附子白豆蔻飲之其病頓除遣人問調理藥豫教以絶去諸藥與肉飲自然平安上陽虛惡寒五法皆以參耆為君首一法佐以附子中三法佐以升陽之劑末一法佐以消痰之劑也垣夫脾胃之症始則熱中終傳寒中經云陰盛生內寒厥氣上逆寒積於胸中是腎水反來侮土此謂所勝者妄行也作中滿腹脹作涎作清涕或溺足下痛不能任身履地骨乏無力喜睡兩丸多冷時作陰陰而痛或妄見鬼狀夜夢亡人腰背胛眼腰脊俱痛而不渴不瀉此溫氣去寒獨留寒獨留則血凝泣血凝泣則脈不通故其脈盛大以澀名曰寒中白朮附子湯白朮附子炮陳皮蒼朮制厚朴制半夏湯泡茯苓去皮澤瀉各一兩豬苓去皮半兩肉桂四錢上銼如麻豆大每服五錢水二盞生薑三片煎至一盞食前溫服量虛實加減夫病熱中症者衝脈之火附二陰之裡傳之督脈督脈者第二十一椎下長強穴是也與足太陽膀胱寒氣為附經督脈其盛也如巨川之水疾如奔馬其勢不可遏太陽寒氣細細如線督脈逆太陽寒氣上行沖頂入額下鼻尖入手太陽傳於胸中手太陽者丙熱氣也足太陽膀胱者壬寒氣也壬能克丙寒熱逆於胸中故脈盛大其手太陽小腸熱氣不能交入膀胱經故十一經之盛氣積於胸中故其脈盛大其膀胱逆行盛之極子能令母實手陽明大腸金即其母也故燥旺其燥氣挾子之勢故脈澀而大便不通以此言之脈盛大以澀者手陽明大腸脈也若見此病中一症皆為寒禁用諸甘酸藥素帝曰人身非衣寒也中非有寒氣也寒從中生者何岐伯曰是人多痹氣也陽氣少陰氣多故身寒如從水中出帝曰人有身寒湯火不能熱厚衣不能溫然不凍栗是為何病岐伯曰是人者素腎氣勝以水為事太陽氣衰腎脂枯不長一水不能勝兩火腎者水也而生於骨腎不生則髓不能滿故寒甚至骨也所以不能凍栗者肝一陽也心二陽也腎孤藏也一水不能勝二火故不能凍栗名曰骨痹是人當攣節也逆調論東垣云晝則惡寒是陰氣上溢於陽分也夜則惡寒是陰血自旺於陰分也海氣分寒桂枝加附子湯方見傷寒自汗桂枝加芍藥人參新加湯方見傷寒體痛血分寒巴戟丸神珠丸方見治虛實法巴戟丸良薑六兩紫金藤十六兩巴戟二兩青鹽二兩肉桂吳茱萸各四兩上為末酒糊丸每服二十丸暖鹽酒送下鹽湯亦得三焦寒用藥大例上焦寒陳皮厚朴藿香中焦寒大小便不通白朮乾薑丁香下焦寒肉桂附子沉香上焦桂附丸鐵刷湯胡椒理中丸中焦二氣丹大建中湯下焦還少丹八味丸天真丹胡椒理中丸款冬花去梗胡椒甘草炙蓽茇良薑各四兩白朮五兩乾薑陳皮去白細辛去苗各四兩上為末煉蜜丸如梧子大每服五十丸溫湯酒米飲任下鐵刷湯良薑炮六兩茴香二兩甘草炙一兩蒼朮米泔浸一宿八兩上為細末每服二錢姜三片鹽一捻水一盞煎至七分溫服或熱酒調下二氣丹肉桂去粗皮硫黃細研各一錢乾薑炮硃砂研為衣各二錢附子一個去皮臍炮製為末半兩上為細末研勻麵糊為丸梧子大每服三十丸鹽湯下附子理中丸人參去蘆附子炮去皮臍乾薑炮甘草炙白朮各三兩上為末煉蜜和丸每一兩作十丸每服一丸以水一盞化破煎至七分服大建中湯治內虛里急少氣手足厥逆少腹攣急或腹滿弦急不能起臥微汗出陰縮或腹中寒痛不堪勞苦唇口乾精自出或手足乍寒乍熱而煩苦痠痛不能久立補中益氣桂心一錢芍藥黃耆各二錢甘草一錢炙生薑五錢當歸人參各三錢附子半錢半夏二錢棗三枚上㕮咀水五盞煎至三盞去渣分三服垣天真丹治下焦陽虛沉香巴戟酒浸炒去心茴香鹽炒香去鹽破故紙炒萆薢酒浸焙胡蘆巴炒杜仲麩炒去絲琥珀各一兩官桂五錢牽牛炒黑去鹽取頭末一兩上為末用浸藥酒糊為丸梧子大每服五十丸至八十丸空心溫酒下海下焦寒四逆例乾薑味苦能止而不行附子味辛能行而不守泄小便不通二藥皆陽氣化能作小便若薑附術三味內加茯苓以分利之為佳附生用而不炮則無火力熱則行而不止兼以水多煎少則熱直入下焦代灸膏治老人衰弱元氣虛冷臟腑虛滑腰腳冷痛沉重飲食減少手足逆冷不能忍者用此代灸其效不能盡述大附子一個炮吳茱萸桂皮木香蛇床子各半兩馬藺草一兩上為細末每用藥半匙白麵半匙生薑汁半盞用煎成膏攤於紙上臨臥貼臍以油紙覆其上綿衣系之自夜至明乃去每夜如此貼之其腰腹如灸百壯除寒積腰疼貼腰眼背惡寒是痰飲仲景云心下有留飲其人背惡寒冷如冰治法茯苓丸之類是也方見驚悸身前寒屬胃經云胃足陽明之脈氣虛則身以前皆寒栗治法宜針法補三里穴是也手足寒者厥也治見厥掌中寒者腹中寒魚上白肉有青血脈者胃中有寒腹胃寒理中之類也全見診法五臟寒方肝寒雙和湯方見治虛實法心寒定志丸菖蒲丸方見小兒脾寒益黃散方見小兒肺寒小青龍湯方見傷寒腎寒八味丸方見治虛實法海通治大寒大已寒丸四逆湯垣沉香桂附丸沉香附子炮肉桂乾薑炮良薑吳茱萸茴香炒川烏各一兩上為末醋煮麵糊為丸桐子大每服五七十丸米飲下食前一服忌生冷海大已寒丸蓽茇肉桂各四兩乾薑炮良薑各六兩上為細末水煮麵糊為丸如梧子大每服二十粒米飲湯下食前服垣諸脈按之無力所生病症六脈中之下得弦細而澀按之無力腹中時痛心胃相控睪隱隱而痛或大便溏泄鼻不聞香臭清濁涕不止目中淚出喘喝痰嗽唾出白沫腰沉沉苦痛項背胸脅時作痛目中流火口鼻惡寒時時頭痛目眩苦振寒不止或嗽或吐或嘔或噦則發躁蒸蒸而熱如坐甄中必得去衣居寒處或飲寒水則便如故其振寒復至或氣短促胸中滿悶而痛如有膈咽不通欲絶之狀甚則口開目瞪聲聞於外而淚涕痰涎大作其發躁方過而振寒復至或面白而不澤者脫血也悲愁不樂情慘意悲健忘或善嚏此風熱大損寒水燥金之復也如六脈細弦而澀按之空虛此大寒症也亦傷精氣以辛甘溫熱潤之劑大瀉西北二方則愈姜附湯治中寒口噤四肢強直失音不語忽然暈倒口吐涎沫狀如暗風手足厥冷或復煩躁兼治陰證傷寒大便利而發熱者乾薑熟附子等分上㕮咀每服四錢水一盞半煎至七分去渣溫服或慮此藥性太燥即以附子理中湯相繼服餌姜附本治傷寒經下後又復發汗內外俱虛身無大熱晝則煩躁夜則安靜不渴六脈沉伏並宜服此不知脈者更宜審之兼治中脘虛寒久積痰水心腹冷痛霍亂轉筋四肢厥逆一方附子湯以生用者名曰白通湯一方白通湯內加白朮倍之甘草減半名生附子白朮湯治中風濕昏悶恍惚腹脹滿身重手足瘛瘲漐漐自汗失音不語便利不禁一方用姜附湯加麻黃白朮人參甘草等分名附子麻黃湯治中寒濕昏暈緩弱腰脊強急口眼喎噼語聲渾濁胸腹䐜脹氣上喘急不能轉動更宜審而用之海六月大熱之氣反得大寒之病氣難布息身涼脈遲何以治之答曰病有標本病熱為本大寒為標用涼則順時而失本用熱則順本而失時故不從乎標本而從乎中治中治者何用溫是已然既曰溫則不能治大寒之病治大寒者非薑附不可若用薑附又似非溫治之例然衰其大半乃止脈得四至余病便無令治之足矣雖用姜附是亦中治也非溫而何經曰中熱遠熱雖用之不當然勝至可犯亦其理也上虛寒正治蓋謂脈虛而惡寒者設也脈虛惡寒真寒也故正治丹色目婦人年近六十六月內常覺惡寒戰栗喜炎火御綿多汗如雨其形肥肌厚已服附子十餘帖渾身癢甚兩手脈沉澀重取稍大知其熱甚而血虛也以四物去川芎倍地黃加白朮黃耆炒黃柏生甘草人參每服一兩重方與一帖腹大泄目無視口無言豫知其病勢深而藥無反佐之過也仍用前藥熱炒與之蓋借火力為嚮導一帖利止四帖精神回十帖病痊安蔣氏年三十餘形瘦面黑六月喜熱惡寒兩手脈沉而澀重取似數以三黃丸下之以薑湯每服三十粒二十帖微汗而安三黃恐是三補丸芩連柏也海婦人先病惡寒手足冷全不發熱脈八至兩脅微痛治者便作少陽治之陽在內伏於骨髓陰在外致使發寒治當不從內外從乎中治也宜以小柴胡調之倍加薑棗子和一婦人身冷脈微食沸熱粥飯六月重衣以衣帽蒙其首猶覺寒泄注不止常服薑附硫黃燥熱之劑僅得平和稍用寒涼其病轉加三年不愈戴人診其兩手脈皆如橫繩有力一息六七至脈訣曰六數七極熱生多以涼布尉心以新汲水淋其病處婦乃叫殺人不止令人時時復以冷水淋之至三四十桶大戰汗出昏困一二日而向之所惡者皆除此法本於華他所用世無知者素陽明所謂灑灑振寒者陽明者午也五月盛陽之陰也陽盛而陰氣加之故灑灑振寒也脈解篇上寒實反治蓋謂脈實而惡寒者設也脈實惡寒假寒也故反治丹久病惡寒當用解鬱濕痰積中抑遏陽氣不得外泄身必惡寒進士周本道年近四十得惡寒症服附子數百帖而病甚豫診其脈弦而緩遂以紅茶入生薑汁香油些少吐痰一升許減大半又與通聖散去麻黃大黃芒硝加當歸地黃百帖而安一女子惡寒用苦參赤小豆各一錢為末齏水吐後用後藥川芎南星蒼朮黃芩酒面丸服上焦不通則陽氣抑遏而皮膚分肉無以溫之故寒栗東垣升陽益胃湯用升發之劑開發上焦以伸陽明出外溫之也丹溪吐出濕痰亦開發上焦使陽氣隨吐升發出外溫之也故寒栗皆愈二者治陽虛表寒之要運氣惡寒有三一曰火熱經曰諸禁鼓栗如喪神守皆屬於火又云少陽所至為惡寒戰又云少陽在泉客勝則腰腹痛而反惡寒治以寒劑是也二曰風經云厥陰在泉風淫所勝病灑灑振寒治以辛涼是也三曰寒濕包熱經云陽明司天之政清熱之氣持於氣交民病振寒四之氣寒雨降病振栗治視寒熱輕重多少其制是也靈陰陽者寒暑也熱則滋雨而在上根荄少汁人氣在外皮膚緩腠理開血氣減汗大泄皮淖澤寒則地凍水冰人氣在中皮膚致腠理閉汗不出血氣強肉堅澀當是之時善行水者不能往冰善穿地者不能鑿凍善用針者亦不能取四厥血脈凝結堅搏不往來者亦未可即柔故行水者必待天溫冰釋凍解而水可行地可穿也人脈猶是也治厥者必先尉調和其經掌與腋肘與腳項與脊以調之火氣已通血脈乃行然後視其病脈淖澤者刺而平之堅緊者破而散之氣下乃止此所謂以解結者也刺節真邪篇下同用針之類在於調氣氣積於胃以通榮衛各行其道宗氣留於海其下者注於氣街其上者走於息道故厥在於足宗氣不下脈中之血凝而留止弗之火調弗能取之用針者必先察其經絡之實虛切而循之按而彈之視其應動者乃後取之而下之六經調者謂之不病雖病謂之自已也大寒在外留而補之入於中者從合瀉之針所不為灸之所宜官能篇從合治之黃帝曰人之振寒者何氣使然岐伯曰寒氣客於皮膚陰氣盛陽氣虛故為振寒寒栗補諸陽針灸臟腑惡寒有三其一取肺經云振寒鼓頷不得汗出腹脹煩冤取手太陽是也其二取胃經云胃足陽明之脈是動則病灑灑振寒善伸數缺視盛虛熱寒陷下取之也其三取膽經云膽足少陽之脈所生病者汗出振寒視盛虛熱寒陷下取之也撮下部寒冷關元腎俞桑君又法氣海中極甲振寒瘛瘲手不伸咳嗽唾濁氣膈善嘔鼓頷不得汗煩滿身痛因為瘛瘲尺澤主之頭項惡風汗不出淒厥惡寒嘔吐目系急痛引額頭重項痛玉枕主之悽悽振寒數缺伸鬲俞主之密語通身惡寒筋脈拘急十指不得近風絶骨二寸半推而上之令氣中和為解治往來寒熱靈榮之生病也寒熱少氣血上下行壽夭剛柔篇仲云婦人中風七八日續得寒熱發作有時經水適斷此為熱入血室其血必結故使如瘧狀發作有時小柴胡湯主之方見傷寒海小柴胡加減法如寒熱往來經水不調去半夏加秦艽芍藥當歸知母地骨皮牡丹皮川芎白朮茯苓如小柴胡湯與四物湯各半名調經湯無孕嘔者加半夏無汗者加柴胡惡寒者加桂有汗者加地骨皮嗽者加紫菀通經者加京三稜廣朮勞者加鱉甲羅完顏小將軍病寒熱間作腕後有斑三五點鼻中微血出兩手脈沉澀胸膈四肢按之殊無大熱此內傷寒也問之嚮者臥殿角傷風又渴飲冰酪水此外感者輕內傷者重外從內病俱為陰也故先斑後衄顯內陰症寒熱間作脾亦有之非徒少陽之寒熱也與調中湯數服而愈調中湯白茯苓乾薑白朮甘草各等分上銼如麻豆大每服五錢水一盞半煎經云風氣盛於皮膚之間內不得通外不得泄風者善行而數變腠理開則灑然寒閉則熱而悶其寒也則衰飲食其熱也則消肌肉故使人怢栗而不能食名曰寒熱風入皮膚為寒熱全文見風門怢栗一作失味因於露風乃生寒熱全文見五臟風盛為寒熱全文見診河解風湯治中風寒熱頭目昏眩肢體疼痛手足麻痹上膈壅沸人參川芎獨活甘草麻黃去節湯洗焙各一兩細辛半兩上為末每服三錢水一盞生薑五片薄荷葉少許同煎至八分不計時候防風湯治中風寒熱防風甘草黃芩桂枝當歸白茯各一兩秦艽乾葛各一兩半杏仁五十枚上為散水酒薑棗煎服脈大腸有宿食寒栗發熱有時如瘧輕則消導重則下之熱食承氣之類寒食見晛丸之類並宿食門求之上積聚而寒熱以積聚法治之云地骨皮散治血中風氣體虛發渴寒熱柴胡地骨皮桑白皮枳殼前胡黃耆各七錢半白茯苓五加皮人參甘草桂心芍藥白條各半兩上㕮咀每服三錢生薑三片水煎柴胡散治寒熱體瘦肢節疼痛口乾心煩柴胡黃耆赤茯苓白朮各二兩人參地骨皮枳殼制桔梗桑白皮赤芍藥生地黃各七錢半麥門冬三兩甘草半兩上㕮咀每服四錢姜五片水煎本事有一師尼患惡風體倦乍寒乍熱面赤心煩或時自汗是時疫氣大行醫見其寒熱作傷寒治之大小柴胡雜進數日病劇豫診視之三部無寒邪脈但厥陰弦長而上魚際宜服抑陰等藥豫制此地黃丸生地黃三兩柴胡秦艽黃芩各半兩赤芍藥一兩上細末煉蜜丸桐子大每服三十丸烏梅湯吞下不拘時候日三服昔宋褚澄療師尼寡婦別制方蓋有為也此二種寡居獨陰無陽欲心萌而多不遂是以陰陽交爭乍寒乍熱全類溫瘧久則為勞嘗讀史記倉公傳戟濟北王侍人韓女病腰背痛寒熱衆醫皆以為寒熱也倉公曰病得之欲男子不可得也何以知其然診其脈肝脈弦出寸口是以知之蓋男子以精為主婦人以血為主男子精盛則思室婦人血盛則懷胎夫肝攝血故也厥陰弦出寸口又上魚際則陰血盛可知褚澄之言信有為矣上地黃丸雖曰抑陰實補陰瀉陽之劑也丹趙孺人夜間發寒後便熱醜寅時退起來口渴食少無味穀不化腹痛而泄倦怠或遇事則熱燥赤眼氣壅又不耐風寒亦惡熱白朮二錢芍藥炒一錢陳皮一錢黃芩半錢炒柏三錢炙甘草二分炒芩三分牡丹三分木通三分人參半錢歸身二錢縮砂三分煎下保和丸實腸丸各三十丸呂十四孺人怒氣後寒熱咳嗽食少淋泄縮砂三分甘草三分人參半錢白朮一錢半連翹一錢陳皮一錢茯苓一錢姜二片同煎潤肺散治嗽方見咳大柴胡湯治結熱在裡往來寒熱方見傷寒有宿食者以宿食法治之臟腑寒熱有四一曰肺經云脈之至也喘而虛名曰肺痹寒熱得之醉而使內也又曰肺脈微急為肺寒熱是也二曰脾經云脾脈小甚為寒熱是也三曰太陽經云三陽為病發寒熱是也四曰陽維難經云陽維為病苦寒熱是也運氣寒熱有二一曰火熱攻肺經云少陰司天熱氣下臨肺氣上從喘嘔寒熱又云少陽司天火氣下臨肺氣上從寒熱胕腫又云少陰司天熱淫所勝寒熱皮膚痛又云歲木不及燥乃大行復則病寒熱瘡瘍治以寒劑是也二曰寒熱相錯經云陽明司天之政天氣急地氣明民病寒熱發暴三之氣燥熱交合民病寒熱又云陽明司天燥氣下臨肝氣上從民病寒熱如瘧又云少陰司天之政四之氣寒熱互至民病寒熱治視寒熱多少其制是也子和武陽仇天祥之子病發寒熱諸醫作骨蒸勞治之半年病甚戴人往視之診其手脈尺寸皆朝於關關脈獨大戴人曰肺癰也問其乳媼會有痛處乳媼曰無戴人令兒去衣舉其兩手觀其兩脅下右脅稍高戴人以手側按之兒移身避之按其左脅則不避戴人曰此肺部有癰已吐膿矣素灸寒熱之法先灸項大椎以年為壯數王汪云如患人之年數次灸撅骨以年為壯數尾穹謂之橛骨視背腧陷者灸之膏肓等腧陷者為筋骨之間陷中也王注背胛骨際有陷處也舉臂肩上陷者灸之肩髃穴也兩季脅之間灸之京門穴也外踝上絶骨之端灸之陽輔穴也足小指次指間灸之俠溪穴也腨下陷脈灸之承筋穴也外踝後灸之崑崙穴也缺盆骨上切之堅動如筋者灸之當隨其所有而灸之膺中陷骨間灸之天突穴也未詳是否掌束骨下灸之陽池穴也未詳是否臍下關元三寸灸之毛際動脈灸之氣衝穴也膝下三寸分間灸之三里穴也足陽明跗上動脈灸之衝陽穴也巔上一灸之百會穴也凡當灸二十九處灸之不已者必視其經之過於陽者數刺其俞而藥之按項大椎至巔上一灸之二十九處也以上出骨空論靈皮寒熱者不可附席毛髮焦鼻槁臘不得汗取三陽之絡以補手太陰肌寒熱者肌痛毛髮焦而唇槁臘不得汗取三陽於下以去其血者補足太陰以出其汗骨寒熱者病無所安汗注不休齒未槁取其少陰於陰股之絡齒已槁死不治骨厥亦然寒熱病篇無汗而寒熱者屬表可治寒熱汗出不休骨寒熱者已入骨髓故難治也邪在肺則病皮膚寒熱上氣喘汗出咳動肩背取之膺中外腧背三節五臟之傍以手疾按之快然乃刺之取之缺盆中以越之五邪篇小腹滿大身時寒熱小便不利取足厥陰全文見小腸滿經云絡病者善太息口苦下痢寒熱取陽陵泉全文見刺法素病風且寒且熱汗出一日數過先刺諸分理絡脈汗出且寒且熱三日一刺百日而已經云凡刺寒熱皆多血絡必間日而一取之血盡乃止乃調其虛實甲寒熱五處及天柱風池腰腧長強大杼中膂內俞上窖齗交上脘關元天牖天容合谷陰溪關衝中渚陽池消爍少澤前谷腕骨陽谷少海然谷至陰崑崙主之身寒熱陰都主之寒熱刺腦戶風寒熱腋門主之心如懸陰厥腳腨後廉急不可前卻癃癖便膿血足跗上痛舌卷不能言善笑心下痞四肢倦溺青赤白黃黑青取井赤取滎黃取輸白取經黑取合血痔泄後重腹痛如癃狀臥僕必有所扶持及失氣涎出鼻孔中痛腹中常鳴骨寒熱無所安汗出不休復溜主之骨寒熱溲難腎腧主之肺寒熱呼吸不得臥上氣嘔沫喘氣相追逐胸滿脅膺急息難振栗脈鼓氣鬲胸中有熱支滿不嗜食汗不出腰脊痛肺俞主之咳而嘔鬲寒食不下寒熱皮肉膚痛少氣不得臥胸滿支兩脅鬲上兢兢脅痛腹䐜胃脘暴痛上氣肩背寒痛汗不出喉痹腹中痛積聚默默然嗜臥怠惰不欲動身常濕濕一作溫心痛無可搖者鬲俞主之咳而脅滿急不得息不得反側腋脅下與臍相引筋急而痛反折目上視眩耳中翛然肩項痛驚狂衄少腹滿目䀮䀮生白翳咳引胸痛筋寒熱唾血短氣鼻酸肝俞主之寒熱食多身羸瘦兩脅引痛心下賁痛心如懸下引臍少腹急痛熱面急一作黑目䀮䀮久喘咳少氣溺濁赤腎俞主之寒熱咳嘔沫掌中熱虛則肩背寒栗少氣不足以息寒厥交兩手而瞀口沫出實則肩背熱痛汗出暴四肢腫身濕搖時寒熱飢則煩飽則善面色變一作癰口噤不開惡風泣出列缺主之寒熱胸背急喉痹咳上氣喘掌中熱數缺伸汗出善忘四肢厥逆善笑溺白列缺主之胸中膨膨然甚則交兩手而瞀暴痹喘逆刺經渠及天府此謂之大腧肺系急胸中痛惡寒胸滿悒悒然善嘔膽汁胸中熱喘逆氣氣相追逐多濁唾不得息肩背風汗出面腹腫鬲中食噎不下喉痹肩息肺脹皮膚骨痛寒熱煩滿中府主之寒熱目䀮䀮善咳喘逆通谷主之煩心咳寒熱善噦勞宮主之寒熱唇口乾身熱喘息目急痛善驚三間主之一本云寒熱心背引痛胸中不得息咳唾血涎煩中善飢食不下咳逆汗不出如瘧狀目淚出悲傷心腧主之寒熱善嘔商丘主之嘔厥寒時有微熱脅下支滿喉痛嗌乾膝外廉痛淫濼脛酸腋下腫馬刀瘻肩腫吻傷痛太衝主之寒熱頭痛喘喝目不能視神庭主之其目泣出頭不痛者聽會取之寒熱頭痛如破目痛如脫喘逆煩滿嘔吐流汗頭維主之寒熱胸滿頭痛四肢不舉腋下腫上氣胸中有聲喉中鳴天池主之寒熱頭痛水溝主之寒熱善怖頭重足寒不欲食腳攣京骨主之下部寒熱病汗不出體重逆氣頭眩痛飛陽主之肩背痛寒熱瘰癧繞頸有大氣暴聾氣蒙瞀耳目不開頭頷痛淚出目鼻衄不得息不知香臭風眩喉痹天牖主之寒熱痠痛四肢不舉腋下腫馬刀挾癭髀膝脛骨淫濼酸痹不仁陽輔主之寒熱頸瘰癧咳呼吸灸手三里左取右右取左寒熱頸瘰癧大迎主之寒熱瘰癧胸中滿有大氣缺盆中滿痛者死外潰不死肩引項不舉缺盆中痛汗不出喉痹咳嗽血缺盆主之寒熱頸瘰癧肩痛不可舉臂臑腧主之寒熱頸瘰癧耳鳴無聞痛引缺盆肩中熱痛手臂不舉肩貞主之寒熱瘰癧目不明咳上氣唾血肩中腧主之寒熱頸腋下腫申脈主之寒熱頸頷腫後溪主之胸中滿耳前痛齒熱痛目赤痛頸腫寒熱渴飲輒汗出不飲則皮乾熱煩曲池主之振寒小指不用寒熱汗不出頭痛喉痹舌急卷小指之間熱口中熱煩心心痛臂內廉痛聾咳瘛瘲口乾頭痛不可顧少澤主之振寒寒熱肩臑肘臂頭痛不可顧煩滿身熱惡寒目赤痛眥爛生翳膜暴痛鼽衄耳聾臂重痛肘攣痂疥腦滿引臑泣出而驚頸項強身寒頭不可顧後溪主之振寒寒熱頸項腫實則肘攣頭眩痛狂易虛則生疣小者痂疥支正主之寒熱淒厥鼓頷承漿主之肩痛引項寒熱缺盆主之身熱汗不出胸中熱滿天窖主之寒熱肩腫引胛中肩臂痠痛臑腧主之臂厥肩膺胸滿痛目中白翳眼青轉筋掌中熱乍寒乍熱缺盆中相引痛數咳喘不得息臂內廉痛上鬲飲已煩滿太淵主之寒熱腹䐜央央然不得息京門主之善齧頰齒唇熱汗不出口中熱痛衝陽主之胃脘痛時寒熱皆主之寒熱篡反出承山主之寒熱篡後出瘛瘲腳腨酸重戰栗不能久立腳急腫痛趺筋足攣少腹痛引喉嗌大便難承筋主之寒熱脛腫丘墟主之寒熱痹脛不收陽交主之跟厥膝急腰脊痛引腹篡陰股熱陰暴痛寒熱膝酸重合陽主之寒熱解孏一作爛淫濼脛酸四肢重痛少氣難言至陽主之寒熱腰痛如折束骨主之寒熱骨痛玉枕主之靈黃帝曰人之善病寒熱何以候之少俞答曰小骨弱肉者善病寒熱黃帝曰何以候骨之大小肉之堅脆色之不一也少俞答曰顴骨者骨之本也顴大則骨大顴小則骨小皮膚薄而其肉無䐃其臂濡濡然其地色始然不與天同色汙然獨異此其候也然後臂薄者其髓不滿故善病寒熱也五變篇仲云病有灑淅惡寒而復發熱者何也曰陰脈不足陽往從之陽脈不足陰往乘之何謂陽不足假令寸口脈微名曰陽不足陰氣上入陽中則灑淅惡寒也何謂陰不足假令尺脈弱名曰陰不足陽氣下陷入陰中則發熱也全文見傷寒寒熱素寸口脈沉而喘曰寒熱平人氣象論脈沉數細散者寒熱也脈要精微論沉細為寒數散為熱脈澀洪大寒熱在中尺膚烘然先熱後寒寒熱也言初捫尺膚則熱久之則寒也尺膚先寒久之而熱者亦寒熱也言初捫尺膚則寒久之則熱也寒熱奪形脈堅搏是逆也全文見診生死門尺肉熱者解㑊安臥脫肉者寒熱不治全文見診生死門診寒熱赤脈上下貫瞳子見一脈一歲死見一脈半一歲半死見二脈二歲死見二脈半二歲半死見三脈三歲死見赤脈不下貫瞳子可治也寒熱篇寒熱病者平旦死全文見診生死門産後往來寒熱云産後往來寒熱四物內加小柴胡湯保治日久虛勞微有寒熱脈沉而數宜柴胡四物湯川芎當歸芍藥熟地黃各一錢半柴胡八錢人參黃芩甘草半夏各三錢上為末水煎服云産後往來寒熱而脈弦者少陽也小柴胡加生地黃湯柴胡二兩黃芩五錢人參三錢半夏一兩五錢制大棗三枚生地黃梔子枳殼麩炒各五錢上如前煎服增損柴胡湯治産後虛發寒熱飲食少腹脹柴胡人參甘草半夏陳皮川芎白芍藥各等分上㕮咀每服三錢姜五片棗二枚水同煎食後日二服大全治産後乍寒乍熱增損四物湯人參當歸芍藥川芎乾薑各一兩甘草上㕮咀每服四錢水一盞姜三片煎七分去渣熱服無時云熟地黃散治産後蓐勞皆由體虛氣力未壯勞復所起四肢煩疼時發寒熱熟地黃人參白芍藥白茯苓白朮續斷各一兩黃耆桂心五味子當歸川芎各七錢半上㕮咀每服四錢姜三片棗一枚水同煎黃耆丸治産後蓐勞寒熱進退頭目眩痛骨節痠疼氣力乏黃耆鱉甲當歸炒各一兩桂心白芍藥續斷川芎牛膝蓯蓉沉香柏子仁枳殼各六錢半五味子熟地黃各半兩上為細末煉蜜為丸桐子大每服四五十丸粥飲下食後外熱內寒外寒內熱仲云病人身大熱反欲得近衣者熱在皮膚寒在骨髓也活人云先與桂枝湯治寒次與小柴胡湯治熱也羅病有遠近有緩急徵南帥不鄰吉歹年七旬丙辰冬南征至楚丘諸路迎送多獻酒醴因而過飲太多遂腹痛腸鳴自利日夜約有五十餘行咽嗌腫疼耳前後赤腫舌本強涎唾稠黏欲吐不吐以手泄之方出言語艱難反側悶亂夜不得臥豫診得脈浮數極按之沉細而弦即謂中丞黏公曰仲景言下利清穀身體疼痛急當救里清便自調急當救表救里四逆湯救表桂枝湯今胃氣不守下利清穀腹中疼痛雖宜急治之比之咽嗌痛猶可少待公曰何謂也答曰內經云瘡發咽嗌名曰猛疽此疾治遲則咽塞咽塞則氣不通氣不通則半日死故宜急治於是遂砭刺腫上紫黑血出頃時腫勢大消遂用桔梗甘草連翹黍黏酒製黃芩升麻防風等分㕮咀每服約五錢水煮清令熱潄冷吐去之咽之恐傷脾胃自利轉甚再服涎清腫散聲出後以神應丸辛熱之劑以散中寒解化宿食而燥脾濕丸者取其不即化則不犯上焦至病所而後化乃治主以緩也不數服利止痛定後胸中閉塞作陳而痛思靈樞云上焦如霧宣五穀味蒸膚充身澤毛若霧露之溉是為氣也今相公年高氣弱自利日久致脾胃中生髮之氣不能滋養於心肺故使閉塞而痛經云上氣不足推之揚之脾不足者以甘補之再與發散甘辛之味溫養脾胃加以升麻人參上升以順正氣不數服而胸中快利痛止內經云調氣之方必別陰陽內者內治外者外治微者調之其次平之盛者奪之隨其攸利萬舉萬全又曰病有遠近治有緩急無越其制又曰急則治其標緩即治其本此之謂也仲云病人身大寒反不欲近衣者寒在皮膚熱在骨髓也活人云先與白虎加人參湯治熱次與桂枝麻黃各半湯以解其外上熱下寒上寒下熱羅上熱下寒治驗中書左丞姚公茂六旬有七宿有暗風至元戊申末因酒病發頭面赤腫而痛耳前後腫尤甚胸中煩悶嗌咽不利身半以下皆寒足脛尤甚由是以床相接作坑身半以上常臥於床飲食減少精神困倦而體痛命豫治之診得脈浮數按之弦細上熱下寒明矣內經云熱勝則腫又曰春氣者病在頭難經云蓄則腫熱砭射之也蓋取其易散故遂於腫上約五十餘刺出血紫黑約一杯數頃時疼痛消散又於氣海中大艾灸百壯乃助下焦陽虛退其陰寒次於三里二穴各灸三七壯治足胻下寒引導陽氣下行故也遂制一方名曰既濟解毒湯以熱者寒之然病有高下治有遠近無越於此以黃芩黃連苦寒酒製為引用瀉其上熱桔梗甘草辛甘溫升佐諸苦藥治其熱柴胡升麻苦平味薄者也陽中之陽散發上熱連翹苦辛平散結消腫當歸辛溫和血止痛酒煨大黃苦寒引苦性上行止煩熱投劑之後腫散痛減大便利再服減大黃慎言語節飲食不旬日良愈既濟解毒湯治上焦頭目赤腫而痛胸膈煩悶不得臥身半以下皆寒足胻尤甚大便赤祕大黃酒煨大便利不用連翹酒製炒黃芩酒炒甘草炙黃連酒炒桔梗各二錢柴胡歸身升麻各一錢脈熱病所謂陽附陰者腰以下至足熱腰以上寒陰氣下爭還心腹滿者死所謂陰附陽者腰以上至頭熱腰以下寒陰氣上爭還得汗者生靈上寒下熱先刺其項太陽久留之已刺則尉項與肩胛令熱下合乃止此所謂推而上之者也刺節真邪論下同上熱下寒視其虛脈而陷之於經絡者取之氣下乃止此所謂引而下之者也垣另有上熱下寒經曰陰病在陽當從陽引陰必須先由絡脈經隧之血若陰中火旺上騰於天致六陽反不衰而上充者先去五臟之血絡引而下行天氣降下則下寒之病自去矣慎勿獨瀉其六陽此病陽亢乃陰火之邪滋之只去陰火只損血絡經隧之邪勿誤也聖人以上熱下寒是有春夏無秋冬也當從天外引陽下降入地中此症乃上天群陰火熾而反助六陽不能衰退先於六陽中決血絡出血使氣下降三陰雖力微能逐六陽下行以陰血自降故也亦可謂老陽變陰之象也故經云上熱下寒視其虛脈下陷於經絡者取之此所謂引而下之也但言絡脈皆是也病大者三稜針決血去陽中之熱熱者手太陽小腸中留火熱之邪致此老陽不肯退化為陰而下故先決去手太陽之熱血使三陰得時之用而下降以行秋令奉收道下入地中而舉藏也乃瀉老陽在天不肯退化行陰道者也至元戊辰春中書參政楊公正卿年逾七十病面顏郁赤若飲酒狀痰稠黏時眩運如在風霧中一日會都堂此症忽來復加目瞳不明遂歸命豫診候兩寸脈洪大尺脈弦細無力此上熱下寒明矣欲藥之為高年氣弱不任記先師所論凡上熱譬猶鳥巢高顛射而取之即以三稜針於顛前髮際疾刺二十餘出紫黑血約二合許即時頭目清利諸苦皆去自後不復作刺上熱下寒與經旨不同也經旨於寒處責其虛治之能引上熱下降垣於熱處得血候熱自里退而下降也密語上寒下熱上熱下寒懸鐘二寸半上寒下熱先補後瀉上熱下寒先瀉後補或分開上寒補懸鐘五分下熱瀉曲池一寸五分瘧寒熱魄汗未盡形弱而氣爍穴俞已閉發為風瘧見生氣通天論秋善病風瘧全文見五臟夏暑汗不出者秋成風瘧素黃帝問曰夫痎瘧皆生於風其蓄作有時者何也岐伯曰瘧之始發也先起於毫毛伸缺乃作寒栗鼓頷腰脊俱痛寒去則內外皆熱頭痛如破渴欲飲冷帝曰何氣使然願聞其道岐伯對曰陰陽上下交爭虛實更作陰陽相移也陽並於陰則陰實而陽虛陽明虛則寒栗鼓頷也巨陽虛則腰背頭項痛三陽俱虛則陰氣勝陰氣勝則骨寒而痛寒生於內故中外皆寒陽盛則外熱陰虛則內熱內外皆熱則喘而渴故飲冷也此皆得之夏傷於暑熱氣盛藏於皮膚之內腸胃之外此榮氣之所舍也此令人汗空疏腠理開因得秋氣汗出遇風及得之以浴水氣舍於皮膚之內與衛氣並居衛氣者晝日行於陽夜行於陰此氣得陽而外出得陰而內薄內外相薄是以日作帝曰其間日而作者何也歧伯曰其氣之舍深內薄於陰陽氣獨發陰邪內著陰與陽爭不得出是以間日而作也帝曰善其作日晏與其日早者何氣使然也歧伯曰邪氣客於風府循膂而下衛氣一日一夜大會於風府其明日日下一節故其作也晏此先客於脊背也每至於風府則腠理開腠理開則邪氣入邪氣入則病作以此作日稍益晏也其出於風府日下一節二十五日五一作一下至骶骨二十六日六一作二入於脊內注於伏膂一作伏中之脈其氣上行九日出於缺盆之中其氣日高故作日益早也其間日發者由邪氣內薄於五臟橫連募原也其道遠其氣深其行遲不能與衛氣俱行不得皆出故間日乃作也靈樞經云瘧者內簿於五臟橫連募原其道遠其氣深其行遲不能日作故次日乃蓄積而作焉詳蓄積二字則作一日之義明矣始明邪氣未盛未與衛氣相當故未作必候蓄積與衛氣相當故作焉帝曰夫子言衛氣每至於風府腠理乃發發則邪氣入入則病作今衛氣日下一節其氣之始發也不當風汗其日作者奈何歧伯曰此邪氣客於頭項循膂而下者也故虛實不同邪中異所則不得當其風府也故邪中於頭項者氣至頭項而病中於背者氣至背而病中於腰脊者氣至腰脊而病中於手足者氣至手足而病衛氣之所在與邪氣相合則病作故風無常府衛氣之所發必開其腠理邪氣之所舍則其府也帝曰瘧先寒而後熱者何也歧伯曰夏傷於大暑其汗大出腠理開發因遇夏氣淒滄之水寒藏於腠理皮膚之中秋傷於風則病成矣夫寒者陰氣也風者陽氣也先傷於寒而後傷於風故先寒而後熱也病以時作名曰寒瘧帝曰先熱而後寒者何也此先傷於風而後傷於寒故先熱而後寒也亦以時作名曰溫瘧帝曰夫病溫瘧與寒瘧而皆安舍舍於何藏岐伯曰溫瘧得之冬中於風寒氣藏於骨髓之中至春則陽氣大發邪氣不能自出因遇大暑腦髓爍肌肉消腠理發泄或有所用力邪氣與汗皆出此病藏於腎其氣先從內出之於外者也如是者陰虛而陽盛陽盛則熱矣衰則氣復反入入則陽虛陽虛則寒矣故先熱而後寒名曰溫瘧其但熱不寒者陰氣先絶陽氣獨發則少氣煩冤手足熱而欲嘔名曰疸瘧帝曰疸瘧何如岐伯曰疸瘧者肺素有熱氣盛於身厥逆上衝中氣實而不外泄因有所用力腠理開風寒舍於皮膚之內分肉之間而發發則陽氣盛陽氣盛而不衰則病矣其氣不及於陰故但熱而不寒氣內藏於心而外舍於分肉之間令人消爍肌肉故名曰疸瘧帝曰瘧未發其應何如歧伯曰瘧氣者必更盛更虛當氣之所在也病在陽則熱而脈躁在陰則寒而脈靜極則陰陽俱衰衛氣相離故病得休衛氣集則復病也衛與邪相併則病作與邪相離則病休其並於陰則寒並於陽則熱離於陰則寒已離於陽則熱已至次日又集而併合則復病也帝曰時有間二日或至數日發或渴或不渴其故何也岐伯曰其間日者邪氣與衛氣客於六腑而有時相失不能相得故休數日乃作也瘧者陰陽更勝也或甚或不甚故或渴或不渴以上俱瘧論篇帝曰火熱復惡寒發熱有如瘧狀或一日發或間數日發其故何也岐伯曰勝復之氣會遇之時有多少也陰氣多而陽氣少則其發日遠陽氣多而陰氣少則其發日近此勝復相薄盛衰之節也瘧亦同法至真要大論帝曰論言夏傷於暑秋必病瘧今瘧不必應者何也岐伯曰此應四時者也其病異形者反四時也其以秋病者寒甚以冬病者寒不甚以春病者惡風以夏病者多汗帝曰夫風之與瘧相似同類而風獨常在瘧則有時而休者何也岐伯曰風氣留其處故常在瘧氣隨經絡沉以內薄故衛氣應乃作瘧論篇保夏傷於暑秋必病瘧蓋傷之淺也近而暴傷之重也遠而深痎瘧者久瘧也是知夏傷於暑濕熱閉藏而不能發泄於外邪氣內行至秋而發為瘧也初不知何經受病隨其受而取之有中三陽者有中三陰者大抵經中邪氣其症各殊同傷寒治之也故內經曰五臟皆有瘧其治各別在太陽經者謂之風瘧治多汗之在陽明經者謂之熱瘧治多下之在少陽經者謂之風熱瘧治多和之此三陽受病皆謂暴瘧也發在夏至後處暑前者此乃傷之淺者近而暴也在陰經者則不分三經皆謂之溫瘧宜以太陰經論之其發處暑後冬至前者此乃傷之重者遠而深也痎瘧者老瘧也故謂之久瘧桂枝羌活湯治瘧病處暑前後頭痛項強脈浮惡風有汗桂枝羌活防風甘草炙各半兩上為粗末每服半兩水一盞半煎至一盞溫服迎發日服吐者加半夏曲瘧疾頭痛項強脈浮惡風無汗者宜麻黃羌活湯麻黃羌活防風甘草炙各半兩上同前服法如吐加半夏曲等分治瘧病身熱目痛熱多寒少脈長睡臥不安先以大柴胡湯下之微利為度如下過外微邪未盡者宜白芷湯以盡其邪白芷湯白芷知母各一兩石膏四兩上為粗末同前服法治瘧無他症隔日發先寒後熱寒少熱多宜桂枝石膏湯桂枝五錢石膏知母各一兩半黃芩一兩上為粗末分作三服水半盞同煎服間日者邪氣所舍深也如外邪已罷內邪未已再下之從卯至午發者宜大柴胡湯下之從午至酉者知邪在內也宜大承氣湯下之從酉至子發者或至寅時發者知邪在血也宜桃仁承氣湯下之前項下藥微利為度以小柴胡湯徹其微邪之氣治瘧寒熱大作不論先後此太陽陽明合病也謂之交爭寒熱作則必戰動經曰熱勝則動也發熱則必汗泄經云汗出不愈知為熱也陽盛陰虛之證治當內實外虛不治恐久而傳入陰經也宜桂枝芍藥湯主之桂枝二錢黃耆知母芍藥石膏各半兩上為粗末五七錢用水煎如前藥服之寒熱轉大者知太陽陽明少陽三陽合病也宜桂枝黃芩湯以和之甘草四錢半石膏五錢知母五錢桂枝二錢柴胡一兩二錢黃芩四錢半人參四錢半半夏四錢上為粗末同煎服服後如外邪已罷內邪未已用大柴胡大承氣等湯下之治處暑後冬至前後瘧其法並於久瘧法求之局方雙解飲子治瘧疾闢瘴氣神效肉豆蔻草豆蔻各二個一個用水和麵裹煨一個生用厚朴二寸一半用生薑汁浸炙一半生用甘草大者二兩一半炙一半生用生薑二塊如棗大一塊濕紙裹煨一塊生用上各㕮咀每服分一半用水一碗煎至一大盞去渣空心溫服東垣云秋暮暑氣衰病熱瘧知其寒也局方用雙解飲子是已知此方治寒瘧也保治發瘧如前症是夜發者麻黃黃芩湯主之麻黃一兩去節甘草炙三錢桃仁三十枚去皮黃芩五錢桂二錢半上為細末依前服法桃仁味苦甘辛肝者血之海血受邪則肝氣燥經所謂肝苦急急食甘以緩之故桃仁散血緩肝謂邪氣深遠而入血故夜發乃陰經有邪此湯發散血中風寒之劑世桃仁承氣湯治夜瘧有實熱者方見傷寒治先熱後寒者小柴胡湯先寒後熱者小柴胡加桂枝湯多熱但熱者白虎加桂枝湯多寒但寒者柴胡桂薑湯此以瘧之寒熱多少定治法也若多寒而但有寒者其脈或洪實或滑當作實熱治之若便用桂枝誤也如或多熱而但有熱者其脈或空虛或微弱當作虛寒治之若便用白虎湯亦誤也所以欲學者必先問其寒熱或熱多熱少或寒多寒少又診脈以參之百無一失矣小柴胡加桂湯治瘧先寒後熱方見傷寒小柴胡湯治瘧先熱後寒仲溫瘧者其脈如平身無寒但熱骨節疼煩時便難白虎加桂枝湯主之脈經云朝發暮解暮發朝解知母六兩甘草二兩炙石膏一斤粳米二合桂去皮三兩上銼每服五分水一盞煎八分去渣溫服出汗愈柴胡桂薑湯治瘧寒多微有熱或寒不熱方見傷寒瘧多寒者名曰牡瘧蜀漆散主之蜀漆燒去腥雲母燒三日夜龍骨等分上三味搗為散未發前以漿水服半錢匕如溫瘧加蜀漆一錢臨發時服一錢匕牡蠣湯治牡瘧牡蠣四兩炙麻黃去節三兩甘草二兩蜀漆三兩上四味以水八升先煮蜀漆麻黃去上沫得六升內諸藥煮取二升溫服一升若吐則勿更服柴胡去半夏加栝蔞湯治瘧病後渴者亦治勞瘧柴胡八兩人參黃芩各三兩栝蔞根四兩生薑二兩大棗十二枚甘草炙三兩上七味以水一斗二升煮取六升去渣再煎取三升溫服一升一日兩三服丹瘧有風有暑有食有痰三日一發者受病一年間日一發者受病半年一日一發者受病一月二日連發住一日者氣血俱受病一日間日者補藥帶表藥後用截瘧丹截之在陰分者用藥徹起陽分方可用截方常山草果檳榔知母烏梅穿山甲炒甘草炙用水酒各一大碗煎至半碗露一宿臨發前二時溫服之如吐則勿服之大法暑風必當發汗夏月多在風涼處歇遂閉汗而不泄因食者必從飲食將息瘧而虛者須先用參術一二帖托住其氣不使下陷後用他藥治內傷挾外邪者同法內必生痰必以汗解二陳湯加柴胡常山黃芩瘧而甚者發寒熱頭痛如破渴而飲水自汗可與人參黃耆白朮黃連黃芩梔子川芎蒼朮半夏天花粉水煎服一丈夫瘧脈弦細每日近午發此風寒也白朮柴胡青皮半夏蒼朮二錢麻黃木通一錢半桂一錢甘草何氏子年二十歲瘧間日作頭痛惡寒為甚麻黃一錢白朮五錢青皮三錢木通七錢蒼朮二錢桂皮一錢半半夏五錢炙甘草三錢小娘患瘧汗但未到下體白朮二錢麻黃知母一錢半夏一錢半人參桂枝半錢分二帖姜三片水二盞半煎至半盞露星月下一夜次日早空心熱服陳一之子二歲間日瘧麻黃五分白朮二錢蒼朮一錢半陳皮一錢半夏一錢木通一錢甘草炙些何主首二十歲瘧間兩日作寒自足起發時口渴身痛頭痛服已有汗麻黃半分黃耆白朮炒青皮二錢芍藥蒼朮二錢木通一錢炙甘草三錢柴胡一錢王舅瘧左弦甚右略澀將退時有汗人參一兩半夏一兩白朮柴胡各六錢蒼朮青皮各五錢木通一兩甘草些分五帖煎服三之一去渣入薑汁半杯露一夜次早溫服之王孺人舊患瘧疾因勞心力又發今骨節疼痛噁心食少與此方人參五錢白朮一兩半蒼朮一兩陳皮一兩川芎當歸木通各七錢甘草一錢分六帖姜三片馮官人發瘧脈弦有汗人參五錢黃耆黃連白朮各三錢芍藥半兩茯苓三錢黃芩三分作五帖水煎服盧兄瘧后辛苦再發脈大洪而浮此血傷也宜補之人參半錢白朮一錢黃芩四錢甘草四錢白芍一錢黃連三錢生地黃茯苓歸尾各五分作一帖熱飲仍灸大椎穴五壯一婦人五十餘歲形實喜作勞性急味厚喜火食夏卻患惡寒發熱更作無休時衣被雖厚常凜然兩脈皆澀豫作雜合邪治之遂以四物湯加陳皮以人參白朮為君生甘草黃柏為佐多入薑汁吞通神丸三十丸回金抑青各二十丸阿魏十丸煎三帖而得睡第五帖而身和第七帖通身微汗諸症皆去局方人參養胃湯草果茯苓人參去蘆各半兩甘草炙七錢橘紅七錢半厚朴去皮薑製蒼朮湯洗炒半夏湯洗各一兩藿香葉洗去土上㕮咀每服四錢水一盞半姜七片烏梅一個煎至七分去渣熱服脈弱無力或寒多者加乾薑附子如脈洪有力熱多者加黃芩黃連柴胡上朴蒼藿香發散也半果茯橘劫痰也人參用之惟虛人最宜丹絶瘧青蒿丸青蒿冬瓜皮官桂馬鞭草各二兩上藥焙乾為末糊為丸如胡椒大每一兩分四服於戌時前一時服盡治瘧方百草霜黃丹等分細研每服二錢匕於發日虛心水調服不止連兩服愈治瘧用蒜不拘多少研極爛以黃丹少許聚為度丸如雞頭大候乾每服一丸新汲水下面東服至妙垣治瘧疾大蒜一顆分開片上一片內入巴豆肉一粒輕紙裹煨熟去巴豆研入黃丹為丸如雞頭大每服一丸先發寒用桃枝七寸東向者煎湯發日五更面北服如發熱用冷水送下未全好次發又可進一服除根上黃丹劫痰例輕劑也易簡七寶湯常山陳皮青皮檳榔草果甘草炙厚朴等分上㕮咀每服半兩水酒各一盞煎六分當發日侵晨服之此服有常山必須吐而愈或當日大作俗謂鬥藥是也虛怯人及脾胃寒者不宜服上此劫痰例重劑也虛人慎之或補後用之局方克效飲子龍腦麝香定粉各研半兩荷葉焙緑豆末甘草炙各五兩硃砂二兩研丸信醋炙二錢半金箔二十五片為衣上為末煉蜜搜和每兩作二十丸無名異為衣每服一二丸溫水磨連日發者未發前服之間日者不發夜服之隔數日發者前一日夜服之河辟邪丹治嵐瘴鬼瘧並日頻日緑豆雄黑豆各四十九粒信半錢另研黃丹一錢硃砂二錢上為末同入乳鉢內滴水為丸分作三十粒每服一粒用東南桃心取七枚研汁井花水早晨日欲出不出時向日吞之上信砒劫痰為至峻之劑虛人切忌之運氣瘧疾有二一曰火熱經云歲火太過炎暑流行金肺受邪民病瘧少氣又云火太過曰赫羲其病笑瘧狂妄又云火鬱之發民病溫瘧又云少陽司天火淫所勝民病發熱惡寒而瘧又云少陽之復發而為瘧又云少陽司天之政民病寒熱瘧治以寒劑是也二曰寒濕經云陽明司天為四之氣病瘧寒之候是也河斷瘧如聖散砒一錢蜘蛛大者三個雄黑豆四十九粒上為末滴水為丸如雞頭大如來日發於今晚夜北斗下先獻過次早以紙裹於耳內札一丸立愈如神一粒可救二人素帝曰夫經言有餘者瀉之不足者補之今熱為有餘寒為不足夫瘧者之寒湯火不能溫也及其熱冰水不能寒也此皆有餘不足之類當此之時良工不能止必須其自衰乃刺之其故何也願聞其說岐伯曰經言無刺熇熇之熱無刺渾渾之脈王注曰渾渾謂脈無端緒無刺漉漉之汗故為其病逆未可治也夫瘧之始發也陽氣並於陰當是之時陽虛而陰盛外無氣故先寒栗也陰氣逆極則復出之陽陽與陰復並於外則陰虛而陽實故先熱而渴夫瘧氣者並於陽則陽勝並於陰則陰勝陰勝則寒陽勝則熱瘧者風寒之氣不常也病極則復至病之發也如火之熱如風雨不可當也故經言曰方其盛時必毀因其衰也事必大昌此之謂也夫瘧之未發也陰未並陽陽未並陰因而調之真氣得安邪氣乃亡故工不能治其已發為其氣逆也帝曰善攻之奈何早晏何如岐伯曰瘧之且發也陰陽之且移也必從四末始也陽已傷陰從之故先其時堅束其處令邪氣不得入陰氣不得出審候見之在孫絡盛堅而血者皆取之此其往而未得並者也瘧論凡治瘧先發如食頃乃可治過之則失時也瘧發身方熱刺跗上動脈開其空出其血立寒瘧方欲寒刺手陽明太陰足陽明太陰亦謂出血當隨井俞而刺之瘧脈滿大急刺背俞用中針傍五胠俞各一適肥瘦出其血也王注云背俞謂大杼五胠俞噫嘻也胠去魚反瘧脈小實急灸脛少陰刺指井脛少陰復溜穴指井至陰穴也瘧脈緩大虛便宜用藥不宜用針諸瘧而脈不見刺十指間出血血去必已先視身之赤如小豆者盡取之刺瘧者必先問其病之所先發者先刺之先頭痛及重者先刺頭上及兩額兩眉間出血王注云頭上謂上星百會兩額謂懸顱兩眉間謂攢竹等穴先項背痛者先刺之先腰脊痛者先刺郤中出血先手臂痛者先刺手少陰陽明十指間先足脛痠痛者先刺足陽明十指間出血風瘧瘧發則汗出惡風刺三陽經背俞之血者胻痠痛甚按之不可名曰胻髓病以鑱針針絶骨出血立已身體小痛刺至陰諸陰之井無出血間日一刺瘧不渴間日而作刺足太陽渴而間日作刺足少陽靈樞經云瘧不渴間日而作刺足陽明渴日作刺手陽明溫瘧汗不出為五十九刺足太陽之瘧令人腰痛頭重寒從背起先寒後熱熇熇暍暍然熱止汗出難已刺郤中出血金門穴黃帝中誥圖經云委中主之海藏羌活加生地黃小柴胡加桂湯足少陽之瘧令人身體解㑊寒不甚熱不甚惡見人見人心惕惕然熱多汗出甚刺足少陽俠溪穴海小柴胡湯足陽明之瘧令人先寒灑淅灑淅寒甚久乃熱熱去汗出喜見日月光火氣乃快然刺足陽明跗上衝陽穴足太陰之瘧令人不樂好太息不嗜食多寒熱汗出病至則善嘔嘔已乃衰即取之待病衰即取之井俞及公孫海小建中湯異功散足少陰之瘧令人嘔吐甚多寒熱熱多寒少欲閉戶牖而處其病難已海小柴胡加半夏湯陽明病見少陰中是賊邪故難已足厥陰之瘧令人腰痛少腹滿小便不利如癃狀非癃也數便意恐懼氣不足腹中悒悒刺足厥陰太衝穴海四物加柴胡苦楝附子湯肺瘧令人心寒寒甚熱熱間善驚如有所見者刺手太陰陽明列缺合谷心瘧者令人煩心甚欲得清水反寒多不甚熱刺手少陰神門肝瘧者令人色蒼蒼然太息其狀若死者刺足厥陰見血中封脾瘧者令人寒腹中痛熱則腸中鳴鳴已汗出刺足太陰商丘腎瘧者令人灑灑然腰脊痛宛轉大便難目眴眴然手足寒刺太陽少陰大鐘主之胃瘧者令人且病善飢而不能食食而肢滿腹大刺足陽明太陰橫脈出血厲兌解溪三里主之瘧寒熱甚寒熱厥取手陽明瘧寒少熱多取足少陽瘧而赤目䀮䀮心痛取手陽明少陽瘧腰背痛不渴取足太陽俱刺瘧篇甲㾬瘧神庭及百會主之瘧振寒熱盛狂言天樞主之瘧盛熱列缺主之瘧寒厥及熱厥煩心善噦心滿而汗出刺少商出血立已熱瘧口乾商陽主之瘧寒甚欲嘔沫陽溪主之風瘧汗不出偏歷主之瘧多寒少熱大鐘主之瘧咳逆心悶不得臥嘔甚熱多寒少欲閉戶而處寒厥足熱太溪主之瘧瘛瘲驚股膝重胻轉筋頭眩痛解溪主之瘧日西發臨泣主之瘧多汗腰痛不能俯仰目如脫項如拔崑崙主之瘧不渴間日作崑崙主之久瘧久瘧者痎瘧也以其隔二三日一發纏綿不去丹老瘧系風暑之邪入在陰分在臟宜用血藥引出陽分而散川芎撫芎紅花當歸蒼白朮白芷黃柏甘草露一宿早服古方多用峻劑恐非稟受怯弱與居養所移者所宜始悟常山砒丹烏梅劫劑或誤投之輕病變重重必危矣三日一作者邪入於三陰經也作於子午卯酉日者少陰經瘧也作於寅申巳亥日者厥陰經瘧也作於辰戌丑未日者太陰經瘧也瘧得於暑當以汗解或因取涼太過汗郁成痰其初感也弱者即病胃氣強者伏而未發至於再感復因內傷其病乃作宜其難瘥夫感暑與風皆外邪也故非汗多不解今之遘此疾者已經再三劫試胃氣重傷何由得愈欲治此症必先與參術等補劑為君加柴葛等發散藥漸而收汗得汗而虛又行補養下體屬陰最難得汗補藥力到汗出至足方是佳兆丹治一婦病瘧三日一發食少經不行已三月脈無時冬寒議作虛寒治疑誤再診見其梳洗言動如常知果誤也經不行非無血為痰所礙脈無非血氣虛及積痰生熱結伏其脈而不見耳當作實熱治與三花丸旬日後食進脈出帶微弦謂胃氣既全雖不藥瘧當自愈而經行也令淡滋味果應三花神佑丸方見水脹一婦身材小味厚痎瘧月餘間日發於申酉頭與身痛寒多喜極熱辣湯脈伏面慘晦作實熱治之以十棗湯為末粥丸黍米大服十粒津咽日三次令淡飯半月大汗愈久瘧欲吐不吐宜吐之用藜蘆散或雄黃散瘧病能食而痰伏者小胃丹方見內傷飲食一人性急好酒色味厚適多憂怒患久瘧忽大熱下臭積大孔痛陷下此大虛脈弦大而浮以瓦磨如錢圓燒紅童便焠急取以紙裹於痛處恐外寒乘虛而入也以參歸陳皮煎服淡味半月而安一婦人久痢因哭子變瘧一日五六作汗如雨不止脈微數疲甚無邪可治陰虛陽散死在旦夕且服四獸等熱劑遂用參術各二兩白芍藥一兩黃耆半兩炙甘草二錢作大劑四五服而愈一人因勞役發嗽得痎瘧又服發散藥變為發熱舌短語言不正痰吼有聲脈洪實似滑先用獨參湯加竹瀝二蛤殼一服後吐膠痰舌本正後用黃耆人參湯服半月而愈藜蘆散大藜蘆末五分溫齏水調下以吐為度雄黃散雄黃瓜蒂赤小豆各一錢上為細末每服半錢溫水調下以吐為度鱉甲煎丸治瘧母鱉甲十二分炙烏扇三分燒黃芩鼠婦熬大黃桂枝石韋去毛厚朴紫葳阿膠各三分乾薑人參桃仁各二分柴胡蜣螂熬各六分芍藥牡丹皮䗪蟲炒各五分蜂窠炙四分瞿麥二分葶藶炒半夏各一分赤硝十二分上二十三味為末取鍛灶下灰一斗清酒一斛五斗浸灰候酒盡一半著鱉甲於中煮令泛爛如膠漆絞取汁內諸藥煎為丸如桐子大空心服七丸日三服瘧母丸青皮桃仁紅花神麯麥芽鱉甲醋煮為君三稜蓬朮海粉香附俱用醋煮上為末神麯糊為丸如桐子大每服五七十丸白湯下小兒瘧疾痞塊用生地芍藥各一錢半陳皮川芎黃芩半夏各一錢甘草二分姜水煎調鱉甲末服十棗湯芫花醋浸煮大戟甘遂制各等分上為末每服半錢水一盞棗十枚同煎半盞服瘧脹秋深久瘧胸中無物又無痰癖腹高而食少俗謂瘧氣入腹宜蒼朮湯主之蒼朮四兩草烏頭一錢杏仁三十個上為粗末起作一服水三升煎至一半均作三服一日服盡産後瘧産後瘧疾多由汙血挾寒熱而作大法宜柴胡四物湯調之熱多者宜服草果飲子半夏湯泡七次赤茯苓草果煨去皮甘草炙陳皮川芎白芷各一錢二分紫蘇良薑青皮各六分乾薑二錢四分上㕮咀分二帖水二盞姜五片棗二枚煎至八分當發日早連進三服無不效者寒多者宜服生熟飲子肉豆蔻草果仁厚朴半夏陳皮甘草大棗去核生薑各二錢半上㕮咀分二分一半生一半以濕紙裹煨香熟和勻分作二帖水二盞煎八分空心一服食後一服二渣並煎午前一服
