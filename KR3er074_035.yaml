body:
  text: 卷之三十五婦人部胎前症胎前之道始於求子求子之法莫先調經每見婦人之無子者其經必或前或後或多或少或將行作痛或行後作痛或紫或黑或淡或凝而不調不調則血氣乖爭不能成孕矣詳夫不調之由其或前或後及行後作痛者虛也其少而淡者血虛也多者氣虛也其將行作痛及凝塊不散者滯也紫黑色者滯而挾熱也治法血虛者四物氣虛者四物加參耆滯者香附縮砂木香檳榔桃仁玄胡滯久而沉痼者吐之下之脈證熱者四物加芩連脈證寒者四物加桂附及紫石英之類是也直至積去滯行虛回然後血氣和平能孕子也豫每治經不調者只一味香附末醋為丸服之亦百發百中也丹婦人肥盛者多不能孕育以身中有脂膜閉塞子宮以致經事不行瘦弱婦人不能孕育以子宮無血精氣不聚故也肥人無子宜先服調理藥當歸一兩酒洗川芎七錢半白芍白朮半夏湯泡香附陳皮各一兩茯苓二兩甘草一兩作十帖每帖姜三片水煎吞後丸子白朮二兩半夏曲一兩茯苓半兩橘紅四錢川芎香附各一兩神麯炒半兩甘草二錢粥丸每服八十丸如熱多者加黃連枳實各一兩服前藥訖卻服後蠡斯丸厚朴杜仲桂心秦艽各二錢附子茯苓各六錢白薇半夏乾薑牛膝沙參各二錢人參四錢細辛半兩上為末煉蜜丸小豆大每服五丸空心酒下加至十丸不妨覺有娠三月後不可更服忌食牛馬肉則難産當出月按此方即秦桂丸也丹溪忌服之者蓋忌於瘦人無血者若肥人濕多者又兼前調理藥而所服丸數十減其九只服五分無妨也上三方得之於丹溪之子朱懋誠者纍試有效海大五補丸同上三方丸天門冬麥門冬菖蒲茯苓人參益智枸杞地骨皮遠志熟地各等分上為細末煉蜜丸如桐子大空心酒下三十丸服本方數服後以七宣丸泄之增損三才丸天門冬酒浸去心熟地酒蒸人參去蘆遠志去心五味子茯苓酒浸去心干鹿角酥炙一法加白馬莖酥炙一法加附子補相火不足一法加麥門冬令人有力一法加續斷以續筋骨一法加沉香暖下焦虛冷上為細末煉蜜杵千下丸如桐子大每服五十丸空心好酒下年老欲補加混元衣全個入藥混元衣者是胎衣頭生兒者佳用酒浸曬乾細銼為末紫石英丸治婦人無子紫石英研水飛三兩天門冬酒浸去心焙乾三兩當歸切焙川芎紫葳卷柏熟地禹餘糧醋淬七次牡蒙石斛去根辛夷各二兩人參肉桂牡丹皮桑寄生細辛根續斷川烏炮食茱萸厚朴薑製乾薑炮牛膝酒浸各一兩柏子仁輕炒另研山蕷烏賊魚骨燒灰各一兩半甘草炙上二十六味為極細末煉蜜丸桐子大每服二十丸酒米飲任下空心食前日二子和戴人過譙都營中飲曾有一卒說出妻事戴人問其故答曰吾婦為室女時心下有冷積如覆盆按之如水聲以熱手尉之如冰娶來已十五年矣恐斷吾孕是以去之戴人曰公勿黜也如用吾藥病可除孕可得卒從之戴人診其寸脈沉而遲尺脈洪大有力非無子之候也可不逾年而孕其良人嘆曰試之先以三聖散吐涎一斗心下平軟次服白朮調中湯五苓散後以四物湯和之不再月氣血合度數月而娠一子戴人常曰用吾此法無不子之婦此言不誣一婦人年三十四歲夢與鬼神交驚怕異常及見神堂陰司舟楫橋梁如此一十五年竟無妊娠巫祈覡禱無所不至鑽肌灸肉孔穴萬千黃瘦發熱引飲中滿足腫委命於天一日苦請戴人戴人曰陽火盛於上陰水盛於下見鬼神者陰之靈神堂者陰之所舟楫橋梁水之用兩手寸脈皆沉而伏知胸中有痰實也凡三湧三泄三汗不旬日而無夢一月而有娠大蕩胞湯治婦人立身以來全不産育及斷絶久不産二三十年者朴硝丹皮當歸大黃蒸一飯久桃仁各三兩細辛厚朴苦梗赤芍藥人參茯苓桂心甘草川牛膝陳皮各二兩附子炮一兩半虻蟲炒焦去翅足水蛭炒各十枚上㕮咀每服四大錢水酒各半盞煎至六分去渣溫服空心日三夜一溫覆得少汗必下積血及冷赤膿如小豆汁斟酌下盡若力弱大困不堪者只一二服止然恐惡物不盡不得藥力能盡服盡好不爾用坐導藥坐導藥治全不産及斷緒服前蕩胞湯惡物不盡用此方皂角去皮子吳茱萸當歸各二兩細辛去苗五味子乾薑炮各二兩黃葵花白礬枯戎鹽蜀椒各半兩上為細末以絹袋大如指長三寸余盛藥令滿縛定納婦人陰中坐臥任意勿行走小便時去之更安一日一度易新者必下清黃冷汁汁盡止若未見病出可十日安之本為子宮有冷惡物故令無子值天陰冷則發疼痛須候病出盡方已不可中輟每日早晚用蕒菜煎湯熏之丹秦桂丸論無子之因多起於婦人醫者不求其因起於何處遍閲古方惟秦桂丸其辭確其意專用溫熱藥近乎人情欣然授之鋭然服之甘受燔灼之禍猶懵然不悔何者陽精之施陰血能攝之精成其子血成其胞胎孕乃成今婦人之無子者率由血少不足以攝精也血之少也固非一端然欲得子者必須調補陰血使無虧缺乃可推其有餘以成胎孕何乃輕用熱劑煎熬臟腑血氣沸騰禍不旋踵矣或曰春氣溫和則萬物發生冬氣寒凜則萬物消隕非秦桂丸之溫熱何以得子臟溫暖而成胎耶豫曰詩曰婦人和平則樂有子和則血氣均平則陰陽不爭今得此藥經血必轉紫黑漸成衰少或先或後始則飲食驟進久則口苦而干陰陽不平血氣不和疾病蜂起焉能成胎縱然成胎生子亦多病而不壽以秦桂丸耗損天真之陰也戒之慎之按秦桂丸施於肥人而少其丸數兼服調理補藥亦無妨但忌施於瘦人火多者也素督脈生病女子不孕世治男子無子者用熱艾一團用鹽填臍滿卻於鹽上隨鹽大小做艾丸灸之如痛即換鹽直灸至艾盡為度如一日灸不盡二日三日灸之曾效東婦人無子胞門在關內左邊一寸灸五十壯又法氣門在關元傍各開三寸灸五十壯集又法子宮在中極傍各開三寸針入二寸灸三七壯中極垣又法關元二十壯三報穴甲絶子灸臍中令人有子女子手腳拘攣腹滿疝月水不下乳余疾絶子陰癢陰交主之腹滿疝積聚余疾絶子陰癢刺石門千金云奔豚上少腹堅痛下引陰中不得小便女子絶子衃血在內不下關元主之千金云轉胞不得溺小腹滿名石水痛婦人子門不端少腹苦寒陰癢及痛經閉不通中極主之婦人無子湧泉主之大疝絶子築賓主之絶子商丘主之穴在內踝前宛宛中婦人絶産若未曾産陰廉主之刺入分半灸下一寸仲男子脈浮弱而澀為無子精氣清冷脈婦人少腹冷惡寒久年少者得之此為無子年大者得之絶産脈微弱而澀年少得此為無子中年得此為絶産肥人脈細胞有寒故令少子其色黃者胸上有寒少陰脈浮而緊緊則疝瘕腹中痛半産而墮傷浮則亡血絶産惡寒受胎丹成胎以精血之後先分男女者褚澄之論也愚竊惑焉後閲東垣方有曰經水斷後一二日血海始淨精勝其血感者成男四五日後血脈已旺精不勝血感者成女此論亦為未瑩何以言之易曰乾道成男坤道成女夫乾坤陰陽之性情也左右陰陽之道路也男女陰陽之儀象也父精母血因感而會精之泄陽之施也血能攝之陰之化也精成其骨此萬物之始於乾元也血成其胞此萬物資生於坤元也陰陽交姤胎孕乃凝胎之所居名曰子宮一系在下上有兩歧一達於左一達於右精勝其血及剛日陽時感者則陽為之主受氣於左子宮而男形成精不勝血及柔日陰時感者則陰為之主受氣於右子宮而女形成或曰分男分女吾知之矣其有雙胎者將何如曰精氣有餘歧而分之血因分而攝之故也若夫男女同孕者剛日陽時柔日陰時感則陰陽混雜不屬左不屬右受氣於兩歧之間者也亦有三胎四胎五胎六胎者猶是而已或曰其有男不可為父女不可為母與男女之兼形者又若何而分之耶豫曰男不可為父得陽氣之虧者也女不可為母得陰氣之塞者也兼形者由陰為駁氣所乘而為狀不一以女兼男形者有二一則遇男為妻遇女為夫一則可妻而不可夫又有下為女體上具男之全形此又駁之甚者也或曰駁氣所乘獨見於陰而所成之形又若是之不同耶豫曰陰體虛駁氣易於乘也駁氣所乘陰陽相混無所為主不可屬左不可屬右受氣於兩歧之間隨所得駁氣之輕重而成形故所兼之形有不可得而同也上丹溪此論極造精微發前人之未發是知男女之分已定於萬物資始乾元之際陰陽交姤之時昧者不寤是理妄有轉女為男之法惑矣夫萬物皆資始於乾元獨男女之分不資始於乾元乎胎前當清熱養血産前安胎白朮黃芩妙藥也胎前將臨月以三補丸加炒香附炒白芍藥蒸餅丸服又抑熱以三補用生地膏丸芩連柏為末地黃膏丸之有孕八九個月必順氣枳殼蘇莖前至八九月因火動逆作喘急可用條芩香附為末調下海神方驗胎散婦人三兩個月月經不行疑是兩身卻疑血滯心煩寒熱恍惚此藥可驗取之內也外已有身病無邪脈以素問脈法推之十得八九矣真雀腦芎一兩當歸全用重一兩者只用七錢上二味為細末分作二服濃煎好艾湯一盞調下或好酒調服亦得可待三兩個時辰間覺腹臍微動仍煩即有胎也動罷即愈安穩無虞如不是胎即不動所滯惡物自行母亦安也如服藥不覺效再煎紅花湯調下必有神效靈苑治婦人經脈住三個月驗胎法真川芎為細末濃煎艾湯下一匕投腹內漸動是有胎也試孕有無甘草一寸炙皂角一寸去皮黃連少許上為末酒調服有則吐無則不吐每服一錢半脈婦人懷軀七月而不可知時時衄血而轉筋者此為軀也衄時嚏而動者非軀也素婦人足少陰脈動甚者妊子也平人氣象論謂太溪脈也全元起本作足少陰王冰本作手少陰當從全本王注云動脈者如豆厥厥動搖也一說動甚謂動搖太甚也陰搏陽別謂之有子陰陽別論王注云陰謂尺中也搏謂搏觸於手也尺脈搏擊與寸脈殊別則為有孕之兆脈妊娠初時寸微小呼吸五至三月而尺數也脈滑疾重以手按之散者胎已三月也脈重手按之不散但疾不滑者五月也此即陰搏陽別之義言尺脈滑數寸脈微小而尺與寸脈別者孕脈也尺脈左偏大為男右偏大為女左右俱大産二子大者如實狀亦陰搏陽別之義謂尺脈實大與寸脈殊別但分男左女右也婦人妊娠四月欲知男女法左疾為男右疾為女俱疾為生二子王子亨云妊娠三部俱滑而疾在左為男在右為女遺妊娠人面南行還復呼之左回首者是男右回首者是女看上圊時夫從後急呼之左回首者是男右回首者是女也上按丹溪云男受胎在左子宮女受胎在右子宮斯言大契是說也蓋男胎在左則左重故回首時慎護重處而就左也女胎在右則右重故回首時慎護重處而就右也推之於脈其義亦然胎在左則血氣護胎而盛於左故脈亦從之而左疾為男左大為男也胎在右則血氣護胎而盛於右故脈亦從之而右疾為女右大為女也亦猶經云陰搏陽別謂之有子言受胎處在臍腹之下則血氣護胎而盛於下故陰之尺脈鼓搏有力而與陽之寸脈殊別也又如癰癤發上則血氣從上而寸脈盛發下則血氣從下而尺脈盛發左則血氣從左而左脈盛發右則血氣從右而右脈盛也丹溪以左大順男右大順女為醫人之左右手蓋智者之一失也丹婦人懷孕愛物乃一臟之虛假如肝藏虛其血氣止能養胎不能榮肝肝虛故愛酸物吃大胎動不安或因僵仆或因毒藥重者便致傷墮當以母形色察之母面赤舌青者子死母活唇口俱青兩邊沫出者子母俱死面青舌赤口中沫出者母死子活也脈婦人妊娠八月脈實大牢強弦緊者生沉細者死丹脈細勻易産大浮緩氣散難産脈婦人懷胎一月之時足厥陰脈養二月足少陽脈養三月手心主脈養四月手少陽脈養五月足太陰脈養六月足陽明脈養七月手太陰脈養八月手陽明脈養九月足少陰脈養十月足太陽脈養諸陰陽各養三十日活兒手太陽少陰不養者下主月水上為乳汁活兒養母懷娠者不可灸刺其經必墮胎陳氏大全論云足厥陰肝脈也足少陽膽脈也四時之令始於春木故十二經云胎養始於肝膽而在一月二月手心主心胞絡脈也手少陽三焦脈也屬火而旺夏所以養胎在三月四月足太陰脾脈也足陽明胃脈也足陽明屬土而旺長夏所以養胎在五月六月手太陰肺脈也手陽明大腸脈也足少陰腎脈也足太陽膀胱脈也屬金水而旺秋冬所以養胎在七月八月九月十月惡阻惡阻謂嘔吐噁心頭眩惡食擇食是也素帝曰何以知懷子之且生也岐伯曰身體有病而無邪脈也腹中論大妊娠稟受怯弱便有阻病其狀顏色如故脈息和順但覺肢體沉重頭目昏眩擇食惡聞食氣好食鹹酸甚者或作寒熱心中憤悶嘔吐痰水恍惚不能支持巢氏謂之惡阻但症有輕重耳仲婦人得平脈陰脈小弱其人渴不能食無寒熱名妊娠桂枝湯主之於法六十日當有此證設有醫治逆者卻一月加吐下者則絶之上絶之者謂絶止醫治候其自安也子常治一二婦阻病吐愈治愈逆因思此仲景絶之之旨遂停藥月餘自安真大哉聖賢之言也丹惡阻即從痰治多用二陳湯羅半夏茯苓湯治妊娠惡阻嘔吐心煩頭目眩暈惡聞食氣好食酸鹹多臥少起百節煩疼羸瘦有痰胎孕不牢半夏洗一兩二錢半赤茯苓熟地各七錢半橘紅旋覆花千金方無旋覆花有細辛紫蘇人參芍藥川芎桔梗甘草各半兩上㕮咀每服五錢姜七片水煎空心兼服茯苓丸若有客熱煩渴口瘡去橘紅細辛加前胡知母七錢半若腹冷下利去地黃加炒桂心半兩若胃中虛熱大便祕小便赤澀加大黃七錢半去地黃加黃芩二錢五分茯苓丸治妊娠阻病心中煩悶吐痰眩暈先服半夏茯苓湯兩劑後服此藥赤茯苓人參桂心乾薑半夏湯泡七次炒黃橘皮各一兩白朮葛根甘草枳殼各二兩上為細末煉蜜丸如桐子大每服五十丸米飲下日三服一方加麥門冬肘後加五味子仲妊娠嘔吐不止者乾薑人參半夏丸主之乾薑人參半夏上三味末之以生薑汁糊丸如桐子大飲服十丸日三服大全方論半夏動胎而不用今仲景豈獨不知此而用於此方乎豫治妊阻病纍用半夏未嘗動胎也經云有故無殞是也大治惡阻吐清水甚害十餘日粥漿不入者白朮一兩人參半兩丁香二錢半甘草一錢上為細末每服二錢水一鍾姜五片煎至七分溫服歸原散治妊娠惡阻嘔吐不止頭痛全不入食服諸藥無效人參甘草川芎當歸芍藥丁香各半兩白茯苓白朮陳皮各一兩半桔梗炒枳殼炒各二錢半半夏洗炒黃一兩上㕮咀每服三錢生薑五片棗一枚水同煎人參橘皮湯治阻病嘔吐痰水人參橘皮白朮麥門冬去心各一兩甘草三錢厚朴制白茯苓各五錢上為粗末每四錢加淡竹茹彈子大生薑三片水同煎治妊娠惡阻嘔吐不下食青竹茹橘皮各二兩生薑茯苓各四兩半夏五兩上細切以水六升煮取二升半去渣分三服治妊娠嘔吐不食兼吐痰水生蘆根七分橘紅四分生薑六分檳榔二分上切以水二盞煎七分空心熱服治妊娠惡食心中煩憒熱悶嘔吐青竹茹麥門冬各三兩前胡二兩橘皮一兩蘆根一握上切細以水一大升煮半升去渣分兩服食前安胎飲治妊娠惡阻心中憒悶頭重目眩嘔逆不食或胎動不安腰腹疼痛甘草茯苓當歸熟地川芎地榆白朮黃耆白芍藥半夏泡七次炒阿膠炒各等分上㕮咀每服三錢生薑四片水同煎一婦人孕三月吐痰水並飲食每日寅卯作作時覺少腹有氣衝上然後膈滿而吐面赤微躁頭眩臥不起床四肢疼微渴此肝火挾衝脈之火衝上也一日甚一日輕脈和右寸洪大百藥不效者將二月豫男病偶用沉香磨水化抱龍丸一服膈寬氣不上衝二三服吐止眩減食進而安又應氏婦得胎七月嘈雜吐食脈壅心下滿塞氣攻背兩肘皆痛要人不住手以熱物摩尉得吐稍疏脈洪大黃芩二錢半炒黃連一錢炒白朮半夏各二錢甘草炙縮砂各五分陳皮當歸山梔枳殼炒香附人參蒼朮各一錢茯苓一錢半生薑七片服二帖後嘈雜吐止心滿塞退但於夜間背肘痛用摩尉遂與抱龍丸化服其疾如失丹一婦人年近三十懷孕兩月病嘔吐頭眩自覺不可禁持以人參白朮川芎陳皮茯苓等藥服五七日愈覺沉重召豫脈之兩手弦左為甚而且弱豫曰此是惡阻病必怒氣所激問之果然肝氣既逆又挾胎氣參術之補大非所宜教以時用茯苓湯下抑青丸二十四粒五帖自覺稍安診其脈略有數狀自言口乾苦稍食粥則口酸豫意其為膈間滯氣未盡行教全以川芎陳皮山梔茯苓生薑煎湯下抑青丸十五粒十餘帖餘證皆平但食及常時之半食後覺口酸不食覺易飢豫謂肝熱未平則以白湯下抑青丸二十粒二十日而安豫又脈之見其兩手脈雖和平而左手弱甚此胎必墮此時肝氣既平參朮可用矣遂用始初參術等藥補之預防墮胎以後之虛服之一月胎自墮卻得平穩無事抑青丸一味黃連為丸是也妊娠經來脈婦人經月下但為微少師脈之反言有軀其後審然其脈何類何以別之師曰寸口脈陰陽俱平榮衛調和按之滑浮之則輕陽明少陰各如經法身反灑淅不欲食飲頭痛心亂嘔噦欲吐呼則微數吸則不驚陽多氣溢陰滑氣盛滑則多實六經養成所以月見陰見陽精汁凝胞散散者損墮設復陽盛雙妊二胎今陽不足故令激經也滑脈主血有餘今經又少故知孕也胎漏下血丹胎漏因氣虛因血虛因血熱仲師曰婦人有漏下者有半産後因續下血都不絶者有妊娠下血者假令妊娠腹中痛為胞阻芎歸膠艾湯主之方見血崩梅治胎動下血心腹疼死生不知服此湯活即安死即下此即催生佛手散方見跌撲傷胎即當歸川芎等分為散也妊娠無故卒下血不止取阿膠三兩炙搗末酒一升半煎令消一服愈羅立聖散治妊娠下血不止雞肝三個用酒一升煮熟共食之大效保治胎漏二黃散生地熟地等分銼水三盞煎半乾去渣服梅治胎下血阿膠二兩搗末生地半斤搗取汁以清酒三升絞汁分三服大治胎漏下血不止胞干即死宜急治之生地汁一升陳酒五合上同煎三五沸溫三服以止為度保治婦人胎漏下血及因事下血枳殼湯枳殼黃芩各半兩白朮一兩上粗末每七錢水一盞煎七分食前服丹婦人年二十餘三個月孕發瘧疾後淡血水下腹滿口渴白芍白朮茯苓一錢黃芩歸尾川芎陳皮五分東陽婦人三十五歲孕八九個月漏胎不止胎比前時稍覺收小血色微紫有塊食減平時三之一腹微疼無情緒人參白朮炒白芍一錢陳皮川芎茯苓縮砂大腹皮三分木連藤七葉同煎食前下三聖丸五十粒仲婦人宿有癥病經斷來及三月而得漏下不止胎動在臍上者為癥痼害妊娠六月動者前三月經水利時胎下血者後斷三月衃也所以血不止者其癥不去故也當下其癥桂枝茯苓丸主之凡胎動多在當臍今動在臍上故知是癥也桂枝茯苓牡丹去心桃仁去皮尖芍藥各等分上五味末之煉蜜丸如兔屎大每日食前服一丸不知加至三丸本治胎下血不止取桃樹上幹不落桃子燒灰和水服瘥本草云桃奴破血又治伏梁積氣胎漏黃汁下或如豆汁大治妊娠忽然下黃汁如膠或如豆汁胎動腹痛粳米五升黃耆六兩上以水七升煎取二升分為四服梅銀苧酒治妊娠下黃汁或如赤豆汁苧根去黑皮切銀一斤上水九升煎取四升每服入酒半升或一升煎分二次服脈婦人懷軀六月七月暴下鬥余水其胎必倚而墮此非時孤漿預下故也胎漏徐徐下水今暴下而多故知墮胎也胎動不安大妊娠胎動不安者由衝任經虛受胎不實也亦有飲酒房室過度損動不安者有誤擊觸而胎動者有喜怒氣宇不舒傷於心肝觸動血脈者有信醫宜服暖補反為藥所害者有因母病而胎動者但治母病其胎自安有胎不堅固動及母疾但當安胎其母自愈永固孕丸地黃川芎黃芩各五分歸身尾人參白芍陳皮各一錢白朮一錢半甘草三錢黃柏些桑上羊食藤七葉圓者糯米半升上㕮咀煎服仲妊娠宜常服當歸散主之當歸黃芩芍藥芎藭各一兩白朮半斤上五味杵為散酒飲服方寸匕日再服妊娠常服即易産胎無苦疾産後百病悉主之妊娠養胎白朮散主之白朮芎藭各四錢蜀椒三錢去汗牡蠣煅二分上四味杵為散酒服一錢匕日三服夜一服但苦痛加芍藥心下毒痛倍加芎藭心煩痛吐不能飲食加細辛一兩半夏大者二十枚服後若嘔以醋醬水服之後不解者小麥汁飲之以後渴者大麥粥服之病雖愈服之勿置肘胎動不安取苧根如足大指者一尺㕮咀以水五升煮取三升去渣服一方有生薑五片丹溪云苧根大能補陰而行滯血大銀苧酒方見前胎漏條治胎動不安好銀煮水著蔥白作羹食之佳治妊娠二三月上至八九個月胎動不安腹痛已有所下方艾葉阿膠炒當歸川芎各三兩甘草一兩上細切以水八升煮取三升去渣內膠令煬分三服日三云立效散治婦人胎動不安如重物所墜冷如冰即佛手散方見眩門大縮砂散治胎動不安墮在須臾者神效方見毒物傷胎胎上逼心本紫蘇飲治妊娠胎氣不和懷胎近上脹滿疼痛謂之子懸兼治臨産驚恐氣結連日不下紫蘇莖葉一兩大腹皮人參川芎陳皮白芍各半兩當歸三分甘草一分上細銼分作三服每服用水一盞半生薑四片蔥白七寸煎至七分去渣空心服曾有纍日婦人産不下服遍催生藥不驗豫曰此必坐草太早心懷下一點懼氣結而不行然非不順也素問云恐則氣下蓋恐則精神怯怯則上焦閉閉則氣還還則下焦脹氣乃不行矣得此藥一服便産及婦人六七月子懸者豫用此數數有驗不十服胎便近下陳良甫云治一婦有孕七個月遠歸忽然胎上衝心而痛坐臥不安兩醫治之無效遂說胎已死矣用萆麻子研爛加麝香調貼臍中以下之命在垂亡召陳診視兩尺脈絶他脈平和陳問二醫作何證治之答曰死胎也陳曰何以知之兩尺脈沉絶以此知之陳曰此說出在何經二醫無答陳曰此子懸也若是胎死卻有辨處面赤舌青子死母活面青舌赤吐沫母死子活唇口俱青母子俱死今面不赤口不青其子未死是胎上逼心宜以紫蘇飲子治之至十服而胎遂下矣大治胎上逼心煩悶方並治胎動困篤用蔥白二七莖濃煮汁飲之若胎未死即安已死即出未效再服此方神妙脈浮滑者宜之本草云蔥白通陽氣安胎祕録胎動上迫心痛取艾葉如雞子大以頭醋四升煎取二升分溫服治胎上逼心熱痛下血神麯半斤搗碎和熟水絞取汁三鍾無時溫服止大治妊娠遍身痛或衝心欲死不能飲食白朮五兩黃芩二兩芍藥四兩上水六升煮取二升半分作三服緣胎有水致痛兼易産跌撲傷胎毒藥傷胎本佛手散治婦人妊娠六七月因事築磕著胎或子死腹中惡露下疼痛不已口噤不絶用此藥探之若不損則痛止子母俱安若胎損立便逐下又治血上衝心腹滿悶者如湯沃雪此藥催生神效方見眩即當歸川芎等分為散口噤灌之大治胎忽因倒地舉動擎重促損腹中不安子死以川芎末酒服方寸匕須臾二三服出治妊娠從高墜下腹中下血煩悶生地益母草各一兩當歸黃耆各半兩上㕮咀每服四錢水一盞姜四片煎至六分去渣無時服丹婦人因閃挫傷胎肚疼血崩歸尾陳皮白朮人參茯苓白芍川芎各三錢甘草五分炙上分四帖水三盞煎取一盞下縮砂末一錢五分五靈脂一錢大治婦人服草藥胎墮腹痛用白扁豆少許去皮為末米飲調服方寸匕或濃煎亦可阿膠散治妊娠或因傾僕或因毒藥胎動不安腰痛腹滿或有所下或胎上搶心短氣熟地二兩白芍艾葉當歸甘草阿膠黃耆各一兩一方有川芎上㕮咀每服半兩姜三片棗一枚同煎溫服無時治妊娠偶有所傷胎動不安疼痛不可忍縮砂不以多少和皮炒黑色一方用仁置尉斗內略炒為細末熱酒調下二錢不飲酒者米飲調下覺腹中熱則胎已安矣此方極效奪命丸治婦人小産下血子死腹中其人憎寒手指唇口爪甲青白面色黃黑胎上搶心則悶絶欲死冷汗自出或食惡物或誤服草藥傷動胎氣下血不止胎尚未損服之可安已死服之可下若胎腐爛腹中危甚者立可取出此方的系異人傳授至妙此即仲景茯苓桂枝丸但用淡醋湯嚼下不同耳方即牡丹茯苓桂枝桃仁赤芍藥等分是也丹溪亦稱妙妊病可下胎斷胎大治妊娠母因疾病胎不能安可下之取七月七日法面四兩水二大盞煎取一盞三分綿濾去渣分溫三服立下又方大麴五升清酒一斗煮二沸去渣分五帖隔宿勿食但再服其子如糜母無疾苦千金不傳妙又方麥糵一升為末和水煮二升服之即下神效又方附子二枚為末以醇苦酒和塗右足去之大良又方取雞子一枚以三指撮鹽放雞子中服之立出丹斷子法用白麵曲一升無灰酒五升打作糊煮二升半用絹帛濾去渣作三服候前月經將來日晚下吃一服次日五更吃一服天明吃一服月經即行終身絶子大斷産驗方故蠶紙方圓一尺燒為末酒飲調服終身不復懷孕又方油煎水銀空心服如棗核大一丸永斷不損人胎自墮丹陽施陰化胎孕乃成血氣虛損不足營養其胎自墮或勞怒傷情內火便動亦能墮胎推原其本皆因於熱火能消物造化自然病源乃謂風冷傷於子藏而墮此未得病情者也豫見賈氏婦但有孕至三月左右必墮診其脈左手大而無力重取則澀知其血少也以其妙年只補中氣使血自榮時正夏初教以濃煎白朮湯下黃芩末一錢服三四十帖遂得保全其生因而思之墮因內熱而虛者於理為多曰熱曰虛當分輕重蓋孕至三月正屬相火所以易墮不然何以黃芩熟艾阿膠等為安胎妙藥耶好生之工幸無輕視大治妊娠懷胎數落而不結實甘草黃耆人參白朮川芎熟地吳茱萸各等分上為末空心溫酒調二錢忌菘菜桃李雀肉醋物按丹溪論皆是虛熱而無寒者今姑存此一方以俟施之於千百而一者也醋附丸治數墮胎方見血崩妊子不成時時墮胎後漏下五色疼痛灸胞門關門左邊二寸名胞門右邊二寸名子戶十月未足欲産過期不産大婦人懷胎有七月八月而産者有至九月十月而産者有經一年二年乃至四年而後産者各依後法治知母丸治十月未足而痛如欲産兼治産難及子煩用知母一味為細末煉蜜丸如雞豆大溫酒嚼下日三服丸如桐子大飲下二十丸治妊娠月數未足而似欲産腹痛者槐子蒲黃等分上為末蜜丸如桐子大溫酒下二十丸以痛止為度又方蒲黃如棗核大篩過以井花水調服千日月未足而欲産者搗菖蒲根汁一二升灌喉中本草云菖蒲治胎動不安下血羅治婦過月不産方四物湯香附桃仁枳殼縮砂紫蘇水煎服即生難産縮胎法丹世之難産者往往見於鬱悶安佚之人富貴豢養之家若貧賤辛苦者無有也古方書止有瘦胎飲一論而其方為湖陽公主作也實非極至之言何者見其有用此方者其難自若豫表妹苦於難産後遇胎孕則觸而去之豫甚憫焉視其形惟勤於針指構思旬日忽自悟曰此正與湖陽公主相反彼奉養之人其氣必實耗其氣使平和故易産今形肥知其氣虛久坐知其不運必氣愈弱兒在胞胎因母氣不能自運耳當補其母之氣則兒健易産矣令其有孕至五六個月來告遂於大全方紫蘇飲加補氣藥與數十帖因得男而甚快後遂以此方隨母形色性稟參時令加減與之無不應者因名其方曰達生散縮胎飲即達生散大腹皮三錢人參陳皮紫蘇莖葉各五分歸身尾白芍白朮各一錢甘草二錢炙黃楊樹腦七個或加枳殼縮砂青蔥五葉上作一帖吞下益母丸臨月得二十服易生産後無病按丹溪云難産死胎此血氣滯病也蓋此方補中行滯春加川芎氣虛倍參術氣實倍香附陳皮血虛加當歸地黃形實倍紫蘇性急加黃連熱急加黃芩濕痰加滑石半夏食積加山楂食後易飢加黃楊腦腹痛加木香官桂黃芩冬不用芩黑神丸一名催生丸一名益母丸用益母草研末粥丸治婦人臨月一日三次服之用縮砂飲送下能催生易産産後服能生新血去舊血只以白湯送下虛者煎白朮人參陳皮湯送下縮胎丸八九個月用之黃芩夏一兩秋七錢冬半兩炒白朮二兩茯苓七錢半陳皮三兩上末粥丸桐子大又方候九個月用之黃芩一兩宜熱藥不宜涼藥怯人減半枳殼炒七錢半滑石七錢五分臨月十日前小便多時加此一味白朮一兩上為末粥丸如桐子大每服三十丸空心熱湯下保束胎丸白朮枳殼各等分上燒餅為丸桐子大入月一日食前五十丸水下服之至産已本滑胎枳殼散枳殼甘草各二兩上為細末每服二錢百沸湯點服空心食前日三服凡懷孕六七月以上即服令兒易生初生胎少黑一百日肉漸變白此孫真人滑胎易産方抑陽降氣為衆方之冠也妊娠治衝任脈虛補血安胎內補丸熟地二兩當歸一兩微炒上細末煉蜜丸桐子大每服三四十丸溫酒下上三方諸集皆載在人用之如何耳大率婦人妊娠唯在抑陽助陰素問云陰搏陽別謂之有子蓋關前為陽關後為陰尺中之脈按之搏手不絶者妊身也婦人平居陽氣微盛無害及其妊子則方閉經隧以養胎若陽氣盛搏之則經脈妄行胎乃不固素問所謂陰虛陽搏謂之崩也抑陽助陰之方甚多然胎前藥唯惡群隊若陰陽交雜別生他病唯是枳殼散所以抑陽四物湯所以助陰故爾枳殼散差寒若早服之恐有胎寒腹痛之疾以內補丸佐之則陽不至強陰不至弱陰陽調勻有益胎孕此前人未常論及本榆白皮焙乾為末婦人妊娠臨月日三服方寸匕令産極易産下兒身皆塗之信有效臨産坐草法脈訣欲産之婦脈離經沉細而滑也同名夜半覺時應分誕來辰日午定知生難經云脈一呼三至曰離經一呼一至曰離經脈經云婦人欲産其脈離經夜半覺日中則生也身重體熱寒又頻舌下之脈黑復青及舌上冷子當死腹中須遣母歸冥面赤舌青細尋看母活子死定難應唇舌俱青沫又出子母俱死總高𢬵面青舌赤沫出頻母死子活定知真不信若能看應驗尋之賢哲不虛陳大十産論一曰正産者婦人懷胎十月滿足忽腰腹作陳疼痛相次胎氣頓陷至於臍腹痛極乃至腰間重痛穀道挺迸繼之漿破血出兒子遂生此名正産二曰傷産者婦人懷胎未産一月以前忽然臍腹痛疼有如欲産仍卻無事是名試月非正産也但一切産母未有正産之候即不可令人抱腰亦不可令産母妄亂用力若兒身未順才方轉動便教産母虛亂用力使兒子錯落忽橫忽倒不能正生皆緣産母用力於未當用力之所致也直待兒子身順臨逼門戶方始用力一送令兒下生此名傷産上傷産一法最為切要慎勿輕忽也凡十月未足臨産腹痛或作或止或痛不甚者名曰弄痛非正産之候或腹雖痛甚而腰不甚者非正産之候胎高未陷下者非正産之候穀道未挺迸者非正産之候水漿未破血未出者非正産之候漿血雖出而腹不痛者非正産之候凡未有正産候且令扶行熟忍如行不得或憑物坐之或安臥之或服安胎藥一二服得安即止慎勿妄服催生藥餌愴惶致令産母憂恐而挫其志務要産母寬心存養調停亦令坐婆先說解諭之如覺心中煩悶可取白蜜一匙新汲水調下切勿妄亂用力先困其母直待子逼門戶腰重痛極眼中如火穀道挺迸時是正産候方可用力並服催生藥也豫男婦於未産一月以前腰腹俱痛全似將産其痛至甚但遇巳牌稍止如此者將十餘日計無所出因閲此條遂與安胎藥加參術數服間與肉味養之由是平復不痛又二十餘日始産一男是時若妄動亂用力並服催生等藥立見危亡矣三曰催産者若婦欲産漿破血下已見是正産候但卻未生即可服催生藥以催之忽有經及數日産母困苦亦可服藥助産母之正氣令兒速生此名催生四曰凍産者冬月天冷産母經血得冷則凝以致兒子不能生下此害最深若冬月産者下部不可脫去綿衣並不可坐臥寒處當滿房著火常有暖氣令産母背身向火令臍下腿膝間常暖血得熱則流散使兒易生此名凍産五曰熱産者盛夏之月産婦要溫涼得所不可恣意取涼傷損胎氣亦不可人多熱氣逼襲産母使産母血沸而有發熱頭痛面赤昏昏如醉乃至不知人事此名熱産六曰橫産者兒先露手或先露臂此由産母未當用力而用之過也兒身未順用力一逼遂至身橫不能生下當令産母安然仰臥後令看生之人先推其手令入直上漸漸逼身以中指摩其肩推上而正之或以指攀其耳而正之須是産母仰臥然後推兒徐徐正之候其身正煎催生藥一盞吃了方可用力令兒下生此名橫産七曰倒産者産母胎氣不足關鍵不牢用力太早致令兒子不能回轉便直下先露其足當令産母仰臥令看生之人推其足入去不可令産母用分毫力亦不得驚恐使兒自順云八曰偏産者兒身未正産母用力一逼致令兒頭偏拄左腿或偏拄右腿故頭雖露偏拄一畔不能生下當令産母仰臥次令看生之人輕輕推兒近上以手正其頭令兒頭頂端正然後令産母用力一送即便生下若是小兒頭後骨偏拄穀道只露其額當令看生之人以綿衣炙溫裹手於穀道外方輕輕推兒頭令正便令産母用力送兒生也此名偏産九曰礙産者兒身已順而露正頂不能生下蓋因兒身回轉肚帶攀其肩以此露正頂而不能生當令産母仰臥令看生之人輕推兒近上徐徐引手以中指按兒肩下撥其肚帶仍須候兒身正順方令産母用力一送使兒生下此名礙産上橫産倒産偏産礙産四法若看生之人非精良妙手不可依用此法恐恣其愚以傷人命也按倒産者今世往往隨其倒足生下並無後患子母雙全不必依推足上之法亦可又礙産者往往肚帶有纏在兒頂上而兒頭自出在産門外看生之人以手撥其肚帶從兒頭頂過而下之者又有肚帶纏在頂上一匝而兒與胞衣自然同下者皆無妨不必以此礙産法入産門裡撥下之也十曰坐産者言欲臨産時高處系一手巾令産母以手攀之輕輕屈足坐身令兒生下非坐在物上也此名坐産十一曰盤腸産者趙都運恭人每産則大腸先出然後産子産後其腸不收甚以為苦名曰盤腸産醫不能療偶在建昌得一坐婆施一法而收之其法以醋半盞新汲冷水七分調停噀産母面每噀一縮三噀收盡此良法也丹産後腸不收香油五斤煎熱盛盆俟溫坐油盆中約一頓食時以皂角末吹入鼻中嚏作立上妙斗門大半夏為末搐鼻中則腸上矣又方以大紙捻蘸香油點燈吹滅以煙燻産母鼻中腸即上矣又方以萆麻子十四粒去殼研如膏貼産母頭頂中心腸上即減去催生法大大凡生産自有時候未見時候切不可強服催生滑胎等藥或勢不得已則服之又云切不可坐草及令坐婆亂下手凡催生藥必候腰痛甚胎陷下漿血破方可服丹催生只用佛手散最穩當又效捷方見婦人通論即芎歸湯催生如聖散黃蜀葵子小半合一方二錢重研爛以酒濾去渣溫服神妙或漏血胎干難産痛極者並進三服良久腹中氣寬胎滑即産須見正産候方可服之歌曰黃葵子炒七十粒細研酒調濟君急若遇臨危産難時免得全傢俱哭泣丹又方以香油白蜜小便和勻各半盞調益母草末服一方止用油蜜小便能下難産祕録治橫産不得出車前子末酒服二錢匕大催生柞木飲子治産難或橫或倒死胎爛脹腹中此方屢用神效大柞木枝一大握長一尺洗淨寸銼生用甘草大者五寸銼作五段上用新汲水三升半同入新瓷瓶內以紙三重緊封之文武火煎至一升半令香候産婦腰重痛欲坐草時溫飲一小盞腰未重痛勿服便覺心下開豁如覺再渴又飲一盞至三四盞覺下重便生此方至驗梅治難産礙胎在腹中如已見兒胎衣不出胎死者蒺藜子貝母各四兩為末米飲下一匙如相去四五里許不下再服又方通明乳香一塊如皂角子大為末腰痛時用新汲水一小盞入醋少許同煎令産母兩手捉兩石燕坐婆調藥飲水須臾坐草便生無痛楚神良又方開骨膏乳香研細五月五日午時滴水丸如雞頭大每服一粒無灰酒吞下又方催生神效乳朱丹乳香研細以豬心血為丸如桐子大硃砂為衣曬乾每服一粒冷酒化下良久未下再服一粒如大段難産以蓮葉心蒂七個水二盞煎至一盞放溫化下一粒良久未下亦可再服此藥靈驗如神合藥時五月五日午時七月七日三月三日效又方乳香硃砂等分為細末麝香酒調下又方腰疼可服乳香人參各一錢辰砂半錢同研細用雞子清一個調之生薑自然汁放開冷服如橫生倒生即時端順子母平善大勝金散問曰産難若何答曰胎側有成形塊為兒枕子欲生時枕破與敗血裹其子故難産但服此藥逐其敗血即自生逆生橫生並治之麝香一錢鹽豉一兩以青布裹了燒紅急研細上為末取稱錘燒紅以酒淬之調下一錢催生丹治産婦生理不順産育艱難或橫或逆並皆治之十二月兔腦髓去皮膜研如泥乳香另研極細二錢半母丁香末一錢麝香另研一字上三味拌勻以兔腦髓和丸如雞頭大陰乾油紙裹每服一丸溫水下即産兒握藥出勝金丹治難産神妙敗兔毫筆頭一枚燒為灰研細搗生藕汁一盞下之立産若産母虛弱及素有冷疾者恐藕冷動氣即於銀器內重湯暖過後服草主難産搗益母草取汁七大合煎半頓服立下無新者以乾者一大握水七合煎服丹易産天麻丸天麻即益母草六月間帶根採曬乾上為末不拘多少煉蜜丸如龍眼大臨産時熟水嚼化一丸能除産後百病難産縮砂香附醋炒枳殼甘草滑石上為末白湯調服催生蒲黃地龍陳皮等分地龍洗去土於新瓦上焙令微黃各為末臍足心三處貼如經日不産各炒一錢匕新水調服立産此常親用甚妙大催生神效七聖散臨産腰痛方用之玄胡索沒藥白礬白芷薑黃當歸桂心上為細末臨産陳痛時燒犁頭鐵通赤淬酒調三錢服一二杯立産山難産吞槐子十四枚逆産燒銅錢通紅放酒中飲之大治胞漿先破惡水來多胎幹不得下時須先與四物湯補養血氣次更煎濃蔥湯放冷令坐婆洗産戶須是款曲洗令氣上下通暢更用酥調滑石末塗産戶里次服神妙乳珠丹或葵子如聖散二方見前催生如聖散治逆産橫生瘦胎百草霜香白芷不見火為末上二味等分研勻每服二大錢於臨産時以童子小便並少米醋打為膏沸湯調下集驗方用酒童便各半盞同煎才沸即熱服不過再服丹溪用芎歸湯調血血得黑則止此藥大能固血免得干生又方治橫倒生者明阿膠炒滑石末各一兩葵子二兩上水一盞半煎至一盞去渣分二服治難産五六日不得分娩者疲困虛乏光明水膠二兩用好酒一升半微火焙膠入新雞子一個鹽一錢匕攪溫令産母坐椅上伸腰大口作二次服覺小便重便生緣坐草早驚動故也潔半夏湯治胎干而不能産半夏曲一兩半大黃五錢肉桂七錢半桃仁三十個微炒上為粗末先服四物湯一二服次服半夏湯生薑三片水煎服又方當歸為末調方寸匕酒服之如聖膏治難産並治胞衣不下兼治死胎萆麻子七粒去殼細研成膏塗腳心胞即下速洗去不洗腸出卻用此膏塗頂上腸自縮入一方萆麻子百粒雄黃一錢細研用如上法塗之催生萬金不傳遇仙丹萆麻子十四粒去殼硃砂雄黃各一錢半蛇蛻一尺燒上為末漿水飲和丸如彈子大臨産時先用椒湯淋泄臍下次安藥一丸於臍中用蠟紙數重覆上以闊帛系之須生下急取去藥一丸可用三次一方萆麻子三粒世三麻四豆脫衣裳研碎將來入麝香若有婦人遭産難貼在臍中兩分張用萆麻子三粒巴豆四粒去殼入麝研細貼在臍中治産危急者立聖丹寒水石四兩內二兩生二兩煅赤取出同生者研細入硃砂同研如深桃花色每用三分井花水調如薄糊用紙花剪如杏葉大攤用貼臍心候乾再易不過三上便産橫逆惡候死胎不下並治神驗寒水石非方解石也即今人謂軟石膏也此方國初異人傳之妙圖經催生令産婦兩手各握石燕一枚須臾子下救産難經日不生雲母粉半兩溫酒調服入口即産萬不失一陸氏云已救三五百人效治橫逆産理不順用伏龍肝細研每服一錢酒調服之以土著兒頭上戴出妙世如神散治催生纍效靈妙於理固難通於事實殊效臨産時令人路上尋草鞋一隻取耳燒灰溫酒調下三錢匕得左足者生男右足者生女覆者兒死側者有驚此藥委是神奇用此送下催生丸尤妙東婦人將産預先胎破惡水長流坐草早無血可養枯竭獨陰五分在足小指第三節間承陰一寸五分玉催生難産及死胎太衝八分補百息合谷補三陰交五分瀉立時分解足小指節三壯心術多此一穴産子上衝逼心巨闕令正坐用抱頭抱腰微偃針入六分留七呼得氣即瀉立蘇如子掬母心生下手心有針痕子頂母心人中有痕向後枕骨有痕是其驗也神效合谷三分留三呼補之三陰交五分瀉十吸張仲文橫産難産右腳小指尖頭灸三壯立産集又法獨陰同上法取灸七壯禁刺合谷補三陰交瀉桑難産三陰交下死胎法大下死胎法方用桂枝二錢麝香當門子一個同研暖酒服須臾如手推下比之用水銀等此藥不損血氣趙和叔傳一方無麝香單用桂末一錢痛時童便調下名救苦散鄧知縣傳療死胎不出朴硝研細半兩以童便溫服下屢效治死胎不下指甲青舌青脹悶口中作屎臭先以平胃散一帖作兩服每服酒水各一盞煎至一盞卻投朴硝半兩研細再煎三五沸溫服其胎化血水下治子死腹中不出其母氣欲絶水銀二兩吞之立效本治子死腹中不出用辰砂一兩以水煮數沸末之然後取酒服之立出外療子死腹中真珠二兩為末酒調服盡立出云治妊娠三五個月胎死在腹中不出大腹子赤芍藥榆白皮各三兩當歸一兩炒滑石末七錢瞿麥葵子茯苓粉草黃芩各半兩上為粗末每服四錢水煎千小兒死腹中葵子末酒服方寸匕若口噤不開格口灌之藥下即活療妊娠胎死腹中或母疾欲下胎榆白皮煮汁服二升大治子死腹中或半生不下或半著脊骨在草不産血氣上蕩母心面無顏色氣欲絶豬脂一升白蜜一升醇酒二升上三味合煎取二升分溫二服不能飲隨所能服之世治生産不順胎死腹中胞衣不下臨産危急妙蛇蛻一條全者香油燈上燒研麝香少許上為末童便酒各半盞調一服即生效楊氏療有孕月數未足子死腹中母欲悶絶取大豆三升醋煮濃汁三升頓服立瘥本治妊娠熱病胎死腹中鹿角屑一兩水一盞蔥五莖豆豉半合同煎至六分去渣溫分二服大取死胎烏雞一隻去尾細銼以水三升煮取二升去雞通手用衣帛蘸摩臍下胎自出産後症大凡生産畢令飲童便一盞不得便臥且宜閉目而坐須臾上床仰臥不宜側臥宜豎膝未可伸足高倚床頭厚鋪茵褥遮圍四壁使無孔隙免致賊風兼時時令人以物從心捍至臍使惡露不滯更三日內令産婦常聞醋炭氣或燒乾漆煙若無干漆以舊漆器燒之以防血暈不問腹痛不痛有病無病以童便和酒半盞溫服五七服妙陳藏器云漬苧汁與産婦服之將苧麻與産婦枕之止血暈産婦腹痛以苧安腹上則止丹産後當大補血氣為先雖有雜症以末治之大地黃丸治産後腹痛眼見黑花或發狂如見鬼狀或胎衣不下失音不語心胸脹滿水穀不化口乾煩渴寒熱往來口內生瘡咽喉腫毒心中忪悸夜不得睡産後中風角弓反張面赤牙關緊急或崩中如豚肝臍腹㽲痛煩躁恍惚四肢腫滿及受胎不穩唇口指甲青黑生地研取汁留渣生薑各二斤研取汁留渣蒲黃當歸各四兩上於銀石器內取生地黃汁炒生薑滓以生薑汁炒地黃渣各令乾四味同焙研為細末醋煮麵糊為丸如彈子大每服一丸食前當歸酒化下神妙一方只用生薑生地無蒲黃當歸依交加法制之為末每服三錢溫酒調下丹黑神丸産後服之能生新血去舊血用白湯送下虛者參朮陳皮湯送下方見催生門益母膏治産婦一切傷損一切血病方見調經門大凡婦人因暑月産乳取涼大多得風冷腹中積聚百病競起迄至於死百方不瘥桃仁煎主之出蓐後服之桃仁一千二百枚去皮尖及雙仁熬令黃色上一味搗令極細熟以上等酒一斗五升研三四遍如作麥粥法以極細為佳納小長項瓷甕中密塞以糊封之納湯中煮一伏時不停火亦不令火猛使瓶口常出在湯上勿令沒之熟極溫酒服一合日再服黑神散治婦人産後惡露不盡胞衣不下攻衝心腹痞滿或臍腹堅脹撮痛及血暈神昏眼黑口噤産後瘀血諸疾熟地蒲黃炒當歸乾薑炮桂心芍藥甘草各四兩黑豆炒去皮半升上為細末每服二錢酒半盞童便半盞同煎調服上黑神散寒多及秋冬者宜之若性急形瘦及夏月宜審之丹胎前母滯産後母虛産後一切皆不可發表産後不可用芍藥以酸寒伐生髮之氣故也大不可吃物過多恐成積滯若未滿月不宜多語喜笑驚恐憂惶哭泣思慮急怒強起離床坐久行動或作針工恣食生冷黏硬油膩魚肉之物及不避風寒當時未覺滿月之後即成蓐勞凡産後滿百日乃可交合不爾至死虛羸百病滋長慎之凡婦人患風氣臍下虛冷莫不由早行房也丹或曰初産之婦好血已虧汙血或留彼黑神散非要藥乎答曰至哉乾元萬物資生理之常也初産之婦好血未必虧汙血未必積臟腑未必寒何以藥為飲食起居勤加調護何病之有誠有汙血體怯而寒與之數帖亦自簡便或有他病當求病起何因病在何經氣病治氣血病治血何用海制此方例令服餌設有性急者形瘦者本有怒火者夏月坐蓐者時有火令薑桂皆為禁藥至於將護之法尤為悖理肉汁發陰經之火易成內傷之病也先哲具有訓戒胡為以羊雞濃汁作糜而又常服當歸丸當歸建中湯四順理中丸雖是補劑並是偏熱臟腑無寒何處消受若夫兒之初生母腹頓寬便啖雞子且吃夥鹽不思雞子難化夥鹽發熱展轉生證不知所困率爾用藥寧不誤人豫每見産婦之無疾者必教之以卻去黑神散與夫雞子夥鹽諸品肉食且與白粥將理間以些少鯗魚煮令淡食之半月後方與少肉若雞於亦須豁開淡煮大能養胃卻疾彼富貴之家驕恣之婦卒有白帶頭風氣痛膈滿痰逆口乾經事不調發禿體倦皆是陽盛陰虛之病天生血氣本自和平曰勝曰虛又烏知非此等繆迷有以兆之耶脈診婦人生産之後寸口脈洪疾不調者死沉微附骨不絶者生診婦人新生乳子脈沉小滑者生實大堅弦急者死胞衣不下大奪命丹治血入胎衣衣為血脹不得下附子炮半兩牡丹一兩乾漆一分碎之炒盡煙上為末以釅酷一升大黃末一兩熬成膏和藥丸如桐子大溫酒吞五七丸不拘時此藥逐去胞中之血血散脹消胞衣自下矣花蕊石散治産後氣欲絶緣敗血不盡血迷血暈惡血奔心胎死腹中胎衣不下至死者但心頭暖急以童便調一錢取下惡血如豬肝終身無血風血氣疾膈上有血化為黃水即吐出或從小便出也方見跌撲傷損黑龍丸治胞衣不下神效方見産後血不下黑神散治惡露不快胞衣不下方見産通用牛膝湯治胞衣不出臍腹堅脹急痛即殺人服此藥胞即爛下死胎亦下牛膝瞿麥各四兩當歸三兩通草六兩滑石八兩葵子五兩上㕮咀以水九升煮三升分三服若衣不下腹滿即殺人推其源皆胞衣有血奔心是以不出服此藥衣即爛出治胞衣不出牛膝一兩葵子一合以水一升煮半升去渣分二服千備急丹治産後惡血衝心胎衣不下腹中血塊以錦紋大黃一兩為細末用釅醋半升同煎如膏丸如桐子大患者用醋七分盞化五丸至七丸服之須臾血下即愈保治胎衣不下或子死腹中或血衝上昏悶或血暴下及胎幹不能生産半夏湯主之見前催生條下胎丸半夏白蘞各半兩上細末丸如桐子大食後半夏湯下三十丸漸加至五十丸如未效者須廣大其藥榆白皮散主之又不效大聖散主之有宿熱者宜服人參荊芥散大治胞衣不下惟有花蕊石散一件最為要緊若鄉居藥局遠者倉卒無之今採得胡氏方一妙法若産訖胞衣不下稍久則血流胞中為血所脹上衝心胸喘急疼痛必致危篤若有此證宜急斷臍帶以少物繫帶必用力牢固系之然後截斷使其子血脈不潮入胞中則胞衣自當痿縮而下縱淹延數日亦不害人只要産母心懷安泰終自下矣纍試有驗治胞衣不下以蛇蛻炒為細末酒下二錢如聖膏方見胎前催生即萆麻子法若胞衣不下腹脹則殺人黑豆一合炒熟入醋一盞煎去豆分三服胞衣不下取灶內黃土一寸研碎同醋調勻納於臍中續煎甘草湯三四合服之出山胞衣不下用取初洗兒湯服下一盞勿令産母知集胞衣不下三陰交中極各瀉之標幽又法照海內關甲女子字難若胞不出崑崙主之産後血暈仲問曰新産婦人有三病一者病痓二者病鬱冒三者大便難何謂也師曰新産血虛多汗出喜中風故令病痓亡血復汗寒多故令鬱冒亡津液胃燥故大便難産婦鬱冒即今世所謂血暈也大産後血暈者氣血暴虛未得安靜血隨氣上迷亂心神故眼前生花極甚者令人悶絶不知人口噤神昏氣冷但服清魂散即醒澤蘭葉人參各二錢半荊芥一兩川芎半兩甘草一兩先方無上為末用溫酒熱湯各半盞調一錢急灌之下咽即開眼氣定省人事保治産後風虛血暈精神昏昧荊芥散荊芥一兩三錢桃仁五錢炒上細末溫水下三錢微喘加杏仁炒甘草各三錢衍治産後血暈用荊芥穗為末童便調下二三錢極妙驗産後血暈身痓直戴眼口角與目外眵向上牽急不知人取雞子一枚去殼取清以荊芥末二錢調服遂仍依次調治若無他疾則不須治甚敏捷上荊芥例氣虛人不宜服大下血多而暈者但昏悶煩亂而已當補血下血少而暈者乃惡露不下上搶於心心下滿急神昏口噤絶不知人當破血行血丹婦人産後血暈此乃虛火載血漸漸暈將上來用鹿角燒灰出火毒研極細用好酒童便調灌下一呷即醒此物行血極效云獨行散治産後血暈昏迷不省衝心悶絶五靈脂半生半炒各二錢為細末溫酒調下二錢口噤者斡開口灌之入喉即愈一方加荊芥等分為末童便調下世治下胎或産後血上衝心已死用鬱金燒存性為末二錢釅醋一合調灌之立活簡産後血暈心悶氣絶紅花一兩搗為末分作二服酒二鍾煎取一鍾並服如口噤斡開灌之速效一方用紅花三兩新者無灰酒童便各半升煮取一盞服之肘治血暈蘇木三兩細銼水五升煮取二升分再服瘥無蘇木方取緋衣煮汁服之亦得聖産後血暈不知人及狂語麒麟竭一兩細研為末非時溫酒調下二錢匕保紅花散治産後血昏血暈血崩及月事不勻遠年乾血氣乾荷葉牡丹皮川歸紅花蒲黃炒等分上細末每半兩酒煎和渣溫服如胎衣不下榆白皮湯調半兩立效上破血輕劑無牡丹散治産後血暈悶絶口噤則斡開口灌之牡丹皮大黃煨芒硝各一兩冬瓜子半合桃仁三十粒去皮尖上銼每服五錢水三鍾煎至一鍾半去渣入硝又煎分二服産書治産後心煩手腳煩熱氣力欲盡血暈連心頭硬及寒熱不禁接骨木破之如算子一握以水一升煎取半升分溫二服或小便數惡血不止服之即瘥此木煎三遍其力一般此是起死之方上重劑血點滴不出者宜用大花蕊石散治産後氣欲絶惡血奔心至死者但以童便調一錢取下惡物極妙方見跌撲傷損黑神散治産後血暈用細酒調服佳方見産通用上二方寒多者用之芎歸加芍藥湯治産後去血過多而暈方見産後血不止保又方治産後血暈危困生地汁一大盞當歸二錢半炒赤芍藥二錢半銼上水煎三五沸溫服如覺煩熱去當歸入童便半盞服之梅治産後余血攻心或下血不止心悶面青身冷氣欲絶新羊血一盞飲之日三服妙大産後忽冒悶汗出不識人者暴虛故也破雞子三枚吞之便醒若未醒可與童便一升甚驗若産後去血多者又增此疾與雞子不醒者可急作竹瀝汁一服五合須臾不定再與五合頻與三五服瘥丹婦人年三十餘面白形長心中長有不平事忽半夜誕子才分娩後侵晨暈厥不知人遂急於氣海灼艾十五壯而蘇後以參術等藥兩月方安仲一産婦鬱冒其脈微弱不能食大便反堅但頭汗出所以然者血虛而厥厥而必冒冒家欲解必大汗出以血虛下厥孤陽上出故但頭汗出所以産婦喜汗出者亡陰血虛陽氣獨盛故當汗出陰陽乃復大便堅嘔不能食小柴胡湯主之鬱冒即暈也大治産後血暈全不省人事極危殆者用韭菜切入有嘴瓶內煎熱醋沃之便密封瓶口以瓶嘴向産婦鼻孔令醋氣透入須先扶病人起坐即醒又方如覺暈即以醋噀面醒來即與醋細細呷之又以醋塗口鼻並置醋於傍使常聞其氣又法治血暈去者急取乾漆燒取煙以向鼻即醒如無干漆舊漆器亦可又方治産後血暈用生半夏末少許吹入鼻中本治胎後血上衝心生薑五片切以水八升煮取三升分三服丹醋墨防産時血暈好墨半錠火燒赤投醋中如此三遍出火毒研細每服五分淡醋湯調下摘産後血暈不省人事三里支溝三陰交心術無此一穴標幽又法陰交陽別世又法神門內關不應取後穴關元灸産後血不下保治婦人惡血不下當歸炒芫花炒等分上為細末每服三錢酒下又用好墨醋淬末小便酒下妙大産後惡露方行而忽然斷絶驟作寒熱臍腹百脈皆痛如以錐刺當歸一分桂心芍藥各半兩桃仁去皮尖炒研沒藥研各一分虻蟲去翅足炒水蛭炒各三十枚上為末醋糊丸如豌豆大醋湯下上峻劑治産後惡露不下乾荷葉二兩鬼箭羽桃仁劉寄奴蒲黃各一兩上為粗末每服三大錢以童便一大盞姜二片生地一分捶碎同煎至六分去渣無時熱服梅治産後血不下蒲黃三兩水三升煎取一升頓服本治産後血不下益母草搗絞汁每服一小鐘入酒一合溫攪勻服千生産後血不去麻子五升酒一升浸一宿明旦去渣溫服一升不瘥再服一升不吐不下不得與男子通一月將養如初瘥大黑龍丸治産後一切血疾産難胎衣不下危急惡疾垂死者但灌藥得下無不全活神驗不可言當歸五靈脂川芎良薑熟地各三兩上細銼入沙罐中赤石脂泯縫紙筋鹽泥固濟炭火十斤煅令通赤去火候冷取開看成黑糟色取出細研卻入後藥百草霜五錢硫黃乳香各一兩花蕊石琥珀各三錢上五味並細研如桐子大頓服立效産後血不止芎歸加芍藥湯治産後血崩眩暈不知人事川芎當歸芍藥各等分上㕮咀每服四錢以水一鍾半煎至七分去渣無時熱服云産後血崩如豆汁紫黑過多者四物湯加蒲黃生地汁阿膠薊根艾白芷煎服丹七二孺人産後冒寒哭多血再下身潤脈沉當歸白朮陳皮川芎乾薑黃芩各二錢芍藥一錢甘草炙些上分二帖煎服王孺人因憂慮墮胎後兩月餘血不止腹痛此體虛氣滯惡物行不盡陳皮一錢白朮二錢芍藥一錢木通川芎五分甘草二分炙作湯下五芝丸六十粒食前千治産後惡血不盡或經月半歲升麻三兩清酒五升煮取二升半分溫再服云牡蠣散治産後惡露淋瀝不絶心悶短氣四肢乏弱頭目昏重煩熱牡蠣川芎熟地茯苓龍骨各一兩續斷當歸炒艾葉酒炒五味人參各半兩甘草二兩半地榆半兩上為末每服三錢生薑三片棗一枚水同煎食前産書産後猶有餘血水氣者宜服豆淋酒黑豆五升熬令煙盡於瓷器內以酒一斗淬之上豆淋酒治汙血又能發表也治産後惡血不絶腹中絞痛氣息急亂髮燒一兩阿膠二兩代赭石乾薑各三兩馬蹄一個燒乾地黃四兩牛角䚡五兩酥炙上為細末煉蜜丸如桐子大空心米飲下三四十丸日二服千治産後崩中下血不止菖蒲一兩半銼酒二鍾煎一鍾去渣分三服食前溫服丹産後血崩取木月及斤者或半斤者燒灰為末用麝香一錢枳殼去穰內用濕紙包煨令香熟研細入藥每用一錢烏梅湯下上木月蓋木耳之類木屑疊也按木耳治崩中滯下效本産後下血不止炙桑白皮煮水飲之祕録治胎落下血不止以桑木中蠍蟲燒末酒服方寸匕日二服産後虛弱丹産後補虛人參白朮各一錢黃芩歸身尾各五分川芎半兩陳皮三分上煎服如有寒加乾薑三分茯苓一錢保三元湯治産日久虛勞而脈浮大者方見婦人門大法條乃小柴胡合四物也治産後日久虛勞針灸不效者三合散此四君子四物小柴胡三方合和是也白朮川歸芍藥黃耆茯苓熟地一兩柴胡一兩半黃芩六錢人參一兩半半夏甘草各六錢川芎一兩上為粗末每一兩水一鍾半服日三大當歸羊肉湯治産後雖無疾者但覺虛弱兼心腹痛肥羊肉一斤去脂水一斗煮取八升去肉當歸五兩黃耆四兩生薑六兩上以肉汁煮三味取二升五合分為四服若覺惡露不盡加桂三兩惡露下多加芎三兩有寒加茱萸一兩有氣加細辛二兩有熱加生地汁二合保治産婦虛勞不能食十全散方見治虛實法氣血條羅當歸建中湯治婦人一切血氣俱損及産後勞傷虛羸不足腹中㽲痛吸吸少氣小腹拘急痛引腰背時自汗出方用當歸四兩肉桂二兩甘草二兩白芍六兩薑棗煎服云治産後虛損飲食不下四物加建中人參白朮茯苓主之産後無乳大纍經産而無乳者亡津液故也須服滋益之藥以動之若雖有乳卻又不甚多者須服通經之藥以動之仍以羹臛引之蓋婦人之乳資於衝脈與胃經通故也大抵婦人素有疾在衝任經者乳汁少而其色帶黃所生之子怯弱多病無乳汁不行有氣血盛而壅閉不行者有血氣弱澀而不行者虛當補之實當疏之疏用通草漏蘆土瓜輩補用鍾乳粉豬蹄鯽魚之屬大治乳無汁土瓜漏蘆各三兩甘草二兩通草四兩上水八升煎取二升分溫三服集下乳汁栝蔞子淘洗控干炒令香熟瓦上㩉令白色為末酒調下一匕令臥少時産書下乳汁土瓜為末酒服一錢日三服本下乳汁以京三稜三個水二碗煎取一碗洗取汁下為度極妙丹婦人乳不行萵苣子糯米各一合細研水一碗攪勻入甘草末一字煎之溫呷頻與妙云立效方下乳汁糯米萵苣子各半合並淘洗甘草半兩生上煎汁一升研藥令細去渣分作三服立下又方豬蹄一隻通草四兩上以水一斗煮作羹食之羅湧泉散治婦人奶汁因氣絶少瞿麥穗麥門冬去心龍骨穿山甲炮黃王不留行上為細末每服一錢熱酒調下後吃豬蹄羹少許又用木梳於左右乳上各梳三二十梳日三服依前法又方治奶汁少栝蔞根薄荷干身等分上為粗末先吃羊蹄汁一碗次服藥後再吃蔥絲羊羹湯少許出效大有人乳脈不行已十七日諸藥無效遇有人送赤豆一斗遂時常煮粥食之當夜乳脈通行乳汁自出大産前乳汁自出者謂之乳注生子多不育産後乳汁自出蓋是身虛宜服補藥以止之若乳多急痛而出者溫帛尉之漏蘆散亦可漏蘆二錢半蛇蛻一條栝蔞十個上為末酒調二錢無時産後陰脫丹一婦人三十餘歲生女二日後産戶一物如手帕下有帕尖約重一斤豫思之此因胎前勞乏傷氣成肝痿所致卻喜血不甚虛其時歲暮天寒恐冷干壞了急與炙黃耆半錢人參一錢白朮五分當歸一錢半升麻五分三帖連服之即收上得汗通身乃安但下裔沾席處乾者落一片約五六兩重蓋脂膜也食進得眠診其脈皆澀左略弦視其形卻實與白朮芍藥各錢半陳皮一錢生薑一片煎二三帖以養之一婦人産子後陰戶中下一物如合鉢狀有二歧其夫來求治豫思之此子宮也必氣血弱而下墜遂用升麻當歸黃耆大料二帖與之半日後其夫復來曰服二次後覺響一聲視之已收陰戶訖但因經宿幹著席上破一片如掌心大在席其妻在家哭泣恐腸破不可復生豫思之此非腸胃乃糟粕也肌肉破尚可復完若氣血充盛必可生滿遂用四物湯加人參與一百帖三年後復有子治子宮下用黃耆一錢半人參一錢當歸七分升麻三分甘草二分作一帖水一鍾煎至三分去渣食前服卻用五倍子末泡湯洗又用末敷之如此數次宜多服藥永不下治陰脫蓋産努力太過致陰脫若脫肛狀及陰挺出逼近腫痛舉重房勞皆能發作清水續續小便淋露用硫黃烏賊骨各半兩五味子一分為末敷患處兼服參耆歸草升麻等補藥治産後陰下脫人屎燒酒下方寸匕日一千金無擇蠍皮散加鱉頭炙亦治方見脫肛大治産後陰腫下脫內出玉門不閉石灰一升炒極熱湯二升投灰中適溫冷澄清坐水中以浸玉門斯須平復如故又方以鐵精粉上推內之又灸臍下橫紋二七壯一法用鐵精羊脂二味攪令稠布裹炙熱尉推內之鐵精是鍛鐵灶中飛出如塵紫色而輕虛可以瑩磨器皿者又方單炒蛇床子一升乘熱以布裹煨患處亦治産後陰戶痛子母療産後陰下脫燒兔頭末敷之東女人胞胎門落頽不收常濕神關玉泉五十壯身交臍下指縫中灸五十壯三報又法玉泉傍開三寸灸隨年壯三報女人陰門冷腫皈來三十壯甲婦人陰挺出四肢淫濼身悶少海主之一作照海
