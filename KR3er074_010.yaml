body:
  text: 卷之十肝膽部諸風素帝問曰風之傷人也或為寒熱或為熱中或為寒中或為癘風或為偏枯或為風也其病各異其名不同或內至五臟六腑不知其解願聞其由岐伯對曰風氣藏於皮膚之間內不得通外不得泄風者善行而數變腠理開則灑然寒閉則熱而悶其寒也則衰食飲其熱也則消肌肉故使人怢栗而不能食名曰寒熱風論治見寒熱門怢陀骨切忽忘也栗懼也風氣與陽明入胃循脈而上至目內眥其人肥則風氣不得外泄則為熱中而目黃人瘦則外泄而寒則為寒中而泣出治熱中見黃疸門治寒中見目淚門風氣與太陽俱入行諸脈俞散於分肉之間與衛氣相干其道不利故使肌肉憤䐜而有瘍衛氣有所凝而不行故其肉有不仁也治見痹門風寒客於脈而不去名曰癘風或名曰寒熱癘者其榮衛熱胕腫其氣不清故使鼻柱壞而色敗皮膚瘍潰以春甲乙傷於風者為肝風以夏丙丁傷於風者為心風以季夏戊己傷於邪者為脾風以秋庚辛中於邪者為肺風以冬壬癸中於邪者為腎風風中五臟六腑之俞亦為臟腑之風各入其門戶所中則為偏風治見中風門風氣循風府而上則為腦風治見頭痛風入系頭則為目風眼寒治見眼目飲酒中風則為漏風治見肝門入房汗出中風則為內風王注以勞風為內風治見痓門新沐中風則為首風治見頭痛久風入中則為腸風飧泄治見下痢外在腠理則為泄風故風者百病之長也至其變化乃為他病也無常方然致甲乙經作故字有風氣也帝曰五臟風之形狀不同者何願聞其診及其病能岐伯曰肺風之狀多汗惡風色皏然白時咳短氣晝日則瘥暮則甚診在眉上其色白皏字普邊切白貌也仲景云肺中風者口燥而唾身暈而重冒而腫脹心風之狀多汗惡風焦絶善怒嚇赤色病甚則言不可快診在舌其色赤嚇字衍文也仲景云心中風者翕翕發熱不能起心中飢食則嘔吐肝風之狀多汗惡風善悲色微蒼嗌乾善怒時憎女子診在目下其色青仲景云肝中風者頭目瞤及脅痛常嘔令人嗜甘脾風之狀多汗惡風身體怠惰四肢不欲動色薄微黃不嗜食診在鼻上其色黃仲景云脾中風者翕翕發熱形如醉人腹中煩重皮目瞤瞤而短氣腎風之狀多汗惡風面痝然浮腫脊痛不能正立其色炲隱曲不利診在肌上其色黑奇病論云有痝然如有水狀切其脈大緊身無痛處形不瘦不能食食少名為何病岐伯對曰病生在腎名為腎風腎風不能食善驚而心氣痿者死張子和治桑惠民病風面黑畏風不敢出爬搔不已眉毛脫落作癩醫三年不痊求治於戴人戴人曰非癩也乃出素問風論云腎風之狀多汗惡風脊痛不能正立其色炲面痝然浮腫今公之病乃腎風也宜先刺其面大出血其血當如墨色三刺血變色矣於是下針自額上下排針直至頤頷皆出血果如墨色遍腫處皆針之惟不針目眥外兩傍蓋此少陽經少血多氣隔日又針之血色乃紫二日外又刺其血色變赤初針時癢再刺則額角痛三刺其痛不可任蓋邪退而然也後二十日余又輕刺一遍方已每刺必以冰水洗其面血十日黑色退一月面稍赤三月乃紅白但不服除下熱之藥病又作戴人在東方無能治者胃風之狀頸多汗惡風飲食不下膈塞不通腹善滿失衣則䐜脹食寒則泄診形瘦而腹大首風之狀頭面多汗惡風當先風一日則病甚頭痛不可以出內至其風日則病少愈漏風之狀或多汗常不可單衣食則汗出甚則身汗喘息惡風衣常濡口乾善渴不能勞事泄風之狀多汗汗出泄衣上口中乾上漬其風不能勞事身體盡痛則寒上五臟風症多汗惡風其治法用仲景桂枝湯之類孫真人皆灸本臟背腧兼用續命湯治之靈黃帝曰人之善病風厥漉汗者何以候之少俞答曰肉不堅腠理疏則善病風帝曰何以候肉之不堅也少俞答曰膕肉不堅而無分理理者粗理粗理而皮不致者腠理疏此言其渾然者五變論素暴厥而聾偏閉塞不通內氣暴薄也不從內外中風之病故瘦留著也通評虛實論此條非風病汗出而身熱者風也全文見虛煩尺膚滑而淖澤者風也尺膚滑而澤脂者風也全文見診法脈脈浮而大者曰風病風以日夕死全文見診生死中風中風世俗之稱也其症卒然仆倒口眼喎斜半身不遂或舌強不言唇吻不收是也然名各有不同其卒然仆倒者經稱為擊僕世又稱為卒中乃初中風時如此也其口眼喎斜半身不遂者經稱為偏枯世又稱為左癱右瘓及腲腿風乃中倒後之證邪之淺者如此也其舌強不言唇吻不收者經稱為痱病世又稱為風懿風氣亦中倒後之症邪之深者如此也東垣以邪淺為中脈中腑而易治邪深為中臟而難治者得之矣凡病偏枯必先仆倒故內經連名稱為擊僕偏枯也後世迷失經意以偏枯痱病之旨一以中風名之遂指偏枯為枯細之枯而非左癱右瘓之症習俗之弊至於如此也殊不知仲景云骨傷則痿名曰枯蓋痿緩不收是筋骨肌肉無氣以生脈道不利手足不稟水穀之氣故曰枯非細之謂也或積日纍月漸成細者間有之非可便指枯為細也素凡治消疸僕擊偏枯痿厥氣滿發逆肥貴人則膏粱之疾也通評虛實論三陰三陽發病為偏枯痿易四肢不舉全文見診病傳變靈樞云真氣去邪氣獨留發為偏枯靈其有三虛而偏中於邪風則為擊僕偏枯矣九宮八風篇風中五臟六腑之俞亦為臟腑之風各入其門戶所中則為偏風全文見諸風上經四節論偏枯前二節屬內傷後二節屬外感蓋此症內傷外感相兼而成也至於河間東垣丹溪則專主內傷仲景陳無擇孫思邈則專主外感今詳偏枯邪淺者宜瀉外感為主補內傷佐之痱病邪深者宜補內傷為主瀉外感佐之也垣中風為百病之長乃氣血閉而不行此最重疾凡治風之藥皆辛溫上通天氣以發生為體是元氣始出地之根蒂也河風病多因熱盛俗云風者言末而忘其本也所以中風而有癱瘓諸症者非謂肝木之風實甚而卒中之也亦非外中於風良由將息失宜而心火暴甚腎水虛衰不能制之則陰虛陽實而熱氣怫鬱心神昏冒筋骨不為用而卒倒無所知也多因喜怒思悲恐之五志有所過極而卒中者由五志過極皆為熱甚故也所謂肥人多中風者肥則腠理致密而多鬱滯氣血難以通利若陽熱又甚而鬱結甚故多卒中也其瘦者腠理疏通而多汗泄血液衰少而為燥熱故多有勞嗽之疾也然肥人反勞者由暴然亡液損血過極故也瘦人反中風者由暴然陽熱太甚而鬱結不通故也經云人之氣以天地之疾風名之故中風者非外來風邪乃本氣病也凡人年逾五旬氣衰者多有此疾壯歲之際無有也若肥盛則間有之亦形盛氣衰如此治法宜和臟腑通經絡便是治風東垣論中風從內出其治法則如外入之證亦以發表攻裡行中道三法也仲夫風之為病當半身不遂或但臂不遂者此為痹脈微而數中風使然無擇諸方論中所謂左癱右瘓者蓋邪氣中人邪氣反緩正氣即急正氣引邪喎僻不遂也風懿者以心悶閉不能言俱噫噫作聲蓋肺氣入心則能言邪中心肺涎潮塞故使然也四肢緩縱為風痱者以風涎散注於關節氣不能行故使四肢不遂也舌強不能言者以風入心脾經心之別脈繫於舌本脾之脈俠咽連舌本散舌下今風涎入其經絡故舌不轉而不能言也四肢拘攣者以中風冷邪氣入肝臟使諸經攣急屈而不伸也風柔者以風熱入於肝臟使諸經張緩而不收也故經曰寒則攣急熱則弛張風顫者以風入於肝臟經絡上氣不守正位故使頭招面搖手足顫掉也風喑者以風冷之氣客於中滯而不能發故使口噤不能言也與前所謂涎塞心肺同候此以口噤為瘥耳腲腿風者半身不遂失音不語臨事不前亦偏中於心肺經所致也以上皆言風從外入卒中之初初中倒時隨即醒者宜治若不醒者宜掐人中至醒若痰涎壅盛者宜吐之口噤者亦宜吐之若口開手撒遺尿者為陽暴絶速宜大料參耆補接之若眼戴上者宜灸之本治中風忽然昏倒若醉形體昏悶四肢不收風涎潮於上膈氣閉不通宜救急稀涎散豬牙皂角四梃肥實不蛀者去黑皮晉礬光明者一兩上為細末研勻輕者五分重者三字匕溫水調灌下不大嘔吐但微微令涎出一二升便得醒醒後緩緩調治不可便大投藥餌恐過傷人治中風同前症勝金丸生薄荷半兩豬牙皂角二兩槌碎水一升二味一處浸取汁研成膏瓜蒂末一兩藜蘆二兩硃砂半兩研上將硃砂末二分與二味末研勻用膏子搜和丸如龍眼大以硃砂為衣溫酒化下一丸甚者二丸以吐為度得吐即醒不醒者不可治必用方論中風無吐法引金虎碧霞為戒且如卒暴涎生聲如引鋸牙關緊急氣閉不行湯藥不能入命在須臾者執以無吐法可乎但不當用銀粉藥恐損脾壞人四肢爾豫用此二方每每有驗羅謙甫方有粉霜鉛粉無藜蘆治法同治急中風口閉涎上欲垂死者一服即瘥江子二粒去皮膜白礬如拇指大一塊為末上將二味在於新瓦上煅令江子焦赤為度為末煉蜜丸如雞豆大每服一丸用綿裹放患人口中近喉處良久吐痰立愈中倒後口噤牙關緊急治法另見後口噤門亦用吐法玄風病口開手撒眼合遺尿鼻聲如鼾者五臟氣絶也蓋口開者心絶手撒者脾絶眼合者肝絶遺尿者腎絶聲如鼾者肺絶也若見一猶可用工若面赤時黑主陽上散腎水反克心火兼遺尿口開氣喘者斷不救也五臟氣絶速宜大料參耆煎濃湯灌之及臍下大艾灸之亦可轉死回生也羅治中風眼上戴不能視者灸第二椎骨第五椎上各七壯一齊下火炷如半棗核大立愈中分淺深靈虛邪偏客於身半其入深內居榮衛榮衛稍衰則真氣去邪氣獨留發為偏枯故其邪氣淺者脈偏痛刺節真邪篇偏枯身偏不用而痛言不變志不亂病在分腠之間巨針取之益其不足損其有餘乃可復也痱之為病也身無痛者四肢不收志亂不甚其言微知可治甚則不能言不可治也痱廢也痱即偏枯之邪氣深者痱與偏枯是二疾以其半身無氣榮運故名偏枯以其手足廢而不收或名痱或偏廢或全廢皆曰痱也巨針取之千金作溫臥取汗上內經論中風之淺深也其偏枯身偏痛而言不變志不亂者邪在分腠之間即仲景東垣所謂邪中腑是也痱病無痛手足不收而言喑志亂者邪入於裡即仲景東垣所謂邪中臟是也仲寸口脈浮而緊緊則為寒浮則為虛寒虛相搏邪在皮膚浮者血氣虛絡脈空虛賊邪不瀉或左或右邪氣反緩正氣即急正氣引邪喎僻不遂邪在於絡肌膚不仁邪在於經即重不勝邪入於腑即不識人邪入於臟舌即難言口遂吐涎潔風者百病之始善行而數變行者動也風本為熱熱勝則風動宜以靜勝其躁養血是也治須少汗亦宜少下多汗則虛其衛多下則損其榮汗下各得其宜然後可治其在經雖有汗下之戒而有中臟中腑之分中腑者宜汗之中臟者宜下之此雖合汗下亦不可過也仲景云汗多則亡陽下多則亡陰亡陽則損氣亡陰則損形故經言血氣者人之神不可不謹養也所謂表裡不和須汗下之表裡已和是宜治之在經也其中腑者面顏顯五色有表證而脈浮惡風惡寒拘急不仁或中身之後或中身之前或中身之側皆曰中腑也其病多易治其中臟者唇吻不收舌不轉而失音鼻不聞香臭耳聾而眼瞀大小便祕結皆曰中臟也其病多難治若風中腑者先以加減續命湯隨證發其表如兼中臟則大便多祕澀宜以三化湯通其滯表裡證已定別無變端後以大藥和而治之大抵中腑者多著四肢中臟者多滯九竅雖中腑者多兼中臟之證至於舌強失音久服大藥能自愈也垣中血脈則口眼喎斜中腑則肢節廢中臟則性命危急此三者治各不同如中血脈外有六經之形證則從小續命湯加減及疏風湯治之如中腑內有便溺之阻隔宜三化湯或局方中麻仁丸通利之外無六經之形證內無便溺之阻隔宜養血通氣大秦艽湯羌活愈風湯治之中臟痰涎昏冒宜至寶丹之類鎮墜若中血脈中腑之病初不宜用龍麝牛黃為麝香入脾治肉牛黃入肝治筋龍腦入腎治骨恐引風深入骨髓如油入面莫之能出又不可一概用大戟芫花甘遂瀉大便損其陰血則真氣愈虛潔古言中臟者大小祕澀東垣言中腑者有便溺阻隔二說當以東垣為主蓋大小祕結不中臟者亦有之中臟者亦有大小便不祕結者也中淺半身偏痛舌能言難經所謂偏枯身偏不用而痛言不變志不亂病在分腠是也仲三黃湯治中風手足拘急百節疼痛煩熱心亂惡寒終日不欲飲食陳無擇兼半身不遂失音不言黃耆二錢獨活四錢細辛二錢麻黃五錢黃芩三錢上五味以水六升煮取二升分溫作三服一服小汗二服大汗心熱加大黃二錢腹滿加枳實一枚氣逆加人參三錢悸加牡蠣三錢渴加栝蔞根三錢先有寒加附子一枚潔疏風湯治半身不遂或肢體麻痹筋骨疼痛麻黃去節三兩益智仁杏仁去皮尖各一兩炒甘草炙升麻各五錢上㕮咀每服一兩水一小碗煎至六分去渣熱服腳蹬熱水葫蘆候大汗出去葫蘆冬月不可服海拯濟換骨丹自汗者不宜服槐皮芎術芷仙人防首蔓十味各停勻苦味香減半龍麝加少許硃砂作衣纏麻黃膏煎丸大小如指彈上治半身不遂口眼喎斜手足不仁言語謇澀或痛入骨髓或痹在皮膚或中急風涎潮不言精神昏塞行步艱難筋脈拘急左癱右瘓一切風疾並皆治之槐莢子生人參桑白皮蒼朮川芎何首烏蔓荊子威靈仙防風各二兩五味子木香苦參各一兩香白芷二兩麝香二錢另研龍腦二錢辰砂五錢另研上十四味為細末入麝香令勻又用麻黃十斤去根節用大河水三石三斗熬至六斗去滓再熬至二斗半入銀石器內熬成膏入前藥末和勻杵三五千下每一兩作十丸硃砂為衣每服一丸先搗碎酒一盞浸自晨至晚食後臨臥攪勻服之神清無睡是藥之驗更隔五日服之如無汗宜服若體自汗服之是重亡津液也若風盛人於密室溫臥取汗羅續命丹治男子婦人卒中諸風口眼喎斜言語謇澀牙關緊急半身不遂手足搐搦頑痹疼痛涎潮悶亂婦人血風喘嗽吐逆坐臥不寧川芎羌活南星薑製川烏白蘚皮海桐皮肉桂當歸防風熟地乾葛各一兩地榆虎骨硃砂鉛白霜烏蛇生牛黃雄黃各三錢輕粉二錢麻黃去節四兩以好酒三升煮一升不用麻黃用酒上為末以麻黃酒汁入蜜半斤熬成膏和藥為丸彈子大每服一丸豆淋酒下或蔥湯化下不拘時候中書左丞張仲謙患半身不遂麻木太醫劉子益與服之汗大出一服而愈本服桑枝法桑枝一小升細切炒香以水三大升煎取二升一日服盡無時圖經云桑枝溫平不涼不熱可以常服療體中風癢乾燥腳氣風氣四肢拘攣上氣眼暈肺氣咳嗽消食利小便久服身輕聰明耳目令人光澤兼療口乾仙經云一切仙藥不得桑煎不服出抱朴子政和間何子常病兩臂痛服諸藥不效依此作數劑臂痛即愈外療偏風半身不遂冷癖疰附子一兩生用㕮咀納於無灰酒中經一七日隔日飲之服一小合瘥中深半身不收舌難言經所謂痱之為病身無痛四肢不收志亂不甚其言微知可治甚則不能言者是也丹今世所謂風病多與痿證滾同論治良由局方多以治風之藥通治諸痿也古聖論風痿各有篇目源流不同治法亦異不得不辨按風論風者百病之長至其變化乃為它病又曰善行數變曰因於露風曰先受邪曰在腠理曰客曰入曰傷曰中歷陳五臟與胃之傷皆多汗而惡風其發明風邪系外感之病有臟腑內外寒熱虛實之不同若是之明且盡也別無癱緩痿弱卒中不省僵仆喎斜攣縮眩運語澀不言之文也或曰吾子謂內經風論主於外感局方用麻黃桂附輩將以解風寒也用腦麝威靈仙黑牽牛輩將以行凝滯也子之言過矣曰風病外感善行數變其病多實少虛發表行滯有何不可治風之外何為又歷述神魂恍惚起便須人手足不隨神志昏憒癱緩嚲曳手足筋攣眩運倒僕半身不遂膝腳緩弱四肢無力顫掉拘攣不語語澀等諸痿症兼治之考諸痿論肺熱葉焦五臟因而受之發為痿躄心氣熱生脈痿故脛縱不任地肝氣熱生筋痿故宗筋弛縱脾氣熱生肉痿故痹而不仁腎氣熱生骨痿故足不任身又曰諸痿皆生於上謂之上者指病之本在肺也又曰昏惑曰瘛瘲曰瞀昧曰暴病曰鬱冒曰矇昧暴喑曰瞀瘛皆屬於火又曰四肢不舉曰舌本強曰足痿不收曰痰涎有聲皆屬於上又禮記注曰魚肉天産也以養陽作陽德以為倦怠悉是濕熱內傷之病當作諸痿治之何局方治風之方兼治痿者十居八九不思諸痿皆起於肺熱傳入五臟散為諸症大抵只宜補養若以外感風寒治之寧免實實虛虛之禍乎風病外感之邪有寒熱虛實而挾寒者多痿病內熱之傷皆是虛證無寒可散無實可瀉局方本為外感立方而以內傷熱證滾同一治其為害也似非細故上丹溪諸論蓋因局方治中風孟浪用發表行濕之藥戕賊血氣誅伐根本不知補養之法故引痿病以救局方之失而其言如此然局方所述中風手足不隨起便須人神魂恍惚不語語澀等證即內經熱病相同至於異處不得不察針經刺節真邪云真氣去邪獨留發為偏枯痿論云陽明虛則宗筋縱帶脈不引而足痿不用由是知手足不隨者在偏枯手足為邪氣阻塞脈道而然在痿病則陽明虛宗筋縱帶脈不引而然也痱病有言變志亂之症痿病則無之也痱病又名風痱而內傷外感兼備痿病獨得於內傷也痱病發於擊僕之暴痿病發於怠惰之漸也凡此皆明痱與痿明是兩疾也大率治風主血虛有痰治痰為先或作屬虛挾火與濕半身不遂者大率多痰在左屬死血在右屬痰左以四物湯等加桃仁紅花竹瀝薑汁上以二陳四君子湯等加竹瀝薑汁氣虛有痰者濃煎獨參湯加竹瀝薑汁聲如鼾者屬氣虛以人參一兩煎湯一盞入竹瀝薑汁遺尿者亦屬氣虛以參耆竹瀝薑汁與之少食者亦為氣虛宜參耆竹瀝血虛有痰宜四物湯俱用薑汁炒恐泥痰再加竹瀝入內服治痰若氣虛少食者用竹瀝氣實能食者加荊瀝此二味開經絡行氣血入四物湯中必少用薑汁肥人多濕用附子烏頭行經肥人中風口喎手足麻木左右俱作痰治用貝母栝蔞南星半夏陳皮黃芩白朮黃連羌活黃柏防風荊芥威靈仙薄荷桂心甘草天花粉多食濕面加附子竹瀝羌汁酒一匙行經瘦人脈虛火實四物湯加牛膝竹瀝一匙行經黃芩黃柏有痰加痰藥痰壅盛者口眼喎斜者不能言者皆當用吐法輕者用瓜蒂蝦汁皂角急者用藜蘆五分或三分加麝香灌入鼻內吐痰出如口不噤者灌入口內吐痰出一吐不已再吐之亦有虛而不可吐者有痰者先吐後用藥羅風中腑兼中臟治驗順德府張安撫耘夫年六十一歲於己未閏十一月初患風證半身不遂語言謇澀心神昏憒煩躁自汗表虛惡風如灑冰雪口不知味鼻不聞香臭耳聞木音則驚怖小便頻多大便結燥欲用大黃之類下之則平日飲食減少不敢用不然則又滿悶晝夜不得瞑目而寐最苦於此約有三月餘凡三易醫病全不減至庚申三月七日又因風邪加之痰嗽咽乾燥疼痛不利唾多中脘氣痞似噎豫思內經云風寒傷形憂恐忿怒傷氣氣傷臟乃病臟病形乃應又云人之氣以天地之疾風名之此風氣下陷入陰中不能生髮上行則為疾矣又云形樂志苦病生於脈神先病也邪風加之邪入於經動無常處前證互相出見治病必求其本邪氣乃服論時月則宜升陽神脾胃瀉風木論病則宜實表裡養衛氣瀉肝木潤燥益元氣慎怒是治其本也宜以加減沖和湯主之柴胡黃耆各五錢升麻當歸甘草炙各三錢半夏黃柏酒洗黃芩陳皮人參芍藥各二分上㕮咀作一服水二盞煎至一盞去渣溫服自汗加黃耆五分五味子二十粒晝夜不得睡乃因心事煩擾心火內動上乘陽分衛氣不得交入陰分故使然也以硃砂安神丸服之由是晝亦得睡十日後安撫曰不得睡三月有餘今困睡不已莫非它病生否豫曰不然衛氣者晝則行陽二十五度夜則行陰二十五度此衛氣交入陰分循其天度故安撫得睡也何病之有焉止有眼白睛紅隱澀難開宜以當歸連翹湯洗之黃連黃柏各五分連翹四分當歸甘草各三分上作一服水二盞煎至一盞去渣時時熱洗十三日後至日晡微有悶亂不安於前沖和湯中又加柴胡三分以升少陽之氣飲三服至十五日全得安臥減自汗惡寒躁熱胸膈痞原小便多服藥後小便減少大便一二日一行鼻聞香臭口知味飲食如常脈微弦而柔和按之微有力止有咽喉中妨悶會厭後腫舌赤早晨語言快利午後微澀宜以玄參升麻湯治之升麻黃連各五分黃芩炒四分連翹桔梗各三分鼠黏子玄參甘草殭蠶各三分防風一分上㕮咀總作一服水二盞煎至七分去渣稍熱噙漱時時咽之前症良愈止有牙齒無力不能嚼物宜以牢牙散牢牙散治牙齒無力不能嚼物羊脛骨灰升麻各二錢生地黃連石膏各一錢白茯苓人參各五分梧桐淚三分上為細末入麝香研勻臨臥擦牙後以溫水漱之安撫初病時右肩臂膊痛無主持不能舉動多汗出肌肉瘦不能正臥臥則痛甚經云汗出偏沮使人偏枯余思針經云虛與實鄰決而通之又云留瘦不移節而刺之使經絡通和血氣乃復又云陷下者灸之為陰氣下陷入陰中肩膊時痛不能運動以火導之火引而上補之溫之以上症皆宜灸刺為此先刺十二經之井穴於四月十二日右肩臂上肩井穴內先針後灸二七壯及至灸瘡發於枯瘦處漸添肌肉汗出少肩臂微有力至五月初八日再灸左肩井次於尺澤穴各灸二十八壯引氣下行與正氣相接次日臂膊又添氣力自能搖動矣時值仲夏暑熱漸盛以清肺飲子補肺氣養脾胃定心氣白芍藥五分人參升麻柴胡各四分天門冬麥門冬各三分陳皮二分半甘草生甘草炙黃芩黃柏各三分上㕮咀作一服水三盞煎至一盞去渣溫服食後汗多加黃耆五分後以潤腸丸潤腸丸治胸膈痞滿大便澀滯麻子仁另研大黃酒煨各一兩半歸尾枳實白芍藥桃仁泥升麻半兩人參甘草生陂皮各三錢木香檳榔各二錢上除桃仁麻仁外為末卻入二仁泥蜜和丸如桐子大每服七八十丸溫水食前服初六日得處暑節暑猶未退宜微收實皮毛益胃氣秋以胃氣為本以益氣調榮湯主之藥中加時藥使邪氣不能傷也人參三分為臣益氣和中陳皮二分為佐順氣和中熟地二分為佐養血潤燥瀉陰火白芍藥四分為佐補脾微收肝木之邪白朮三分為佐養胃和中厚腸胃升麻二分為使使陽明氣上升滋榮百脈當歸二分為佐和血潤燥黃耆五分為君實皮毛止自汗益元氣半夏三分療風痰強胃進食甘草二分炙為佐調和胃氣溫中益氣柴胡二分為使引少陽之氣使出於胃中乃風行於天上麥門冬三分為佐猶有暑氣未退故加之安肺氣至秋分節不用上㕮咀作一服水二盞煎至一盞去渣溫服忌食辛熱之物反助暑邪秋氣不能收正氣得復而安矣素太陰所謂入中為喑者陽盛已衰故為喑也內奪而厥則為喑痱此腎虛也少陰不至者厥也脈解篇王注云痱廢也腎氣內奪則舌喑足廢河地黃飲子治舌喑不能言足廢不能用腎虛弱其氣厥不至舌下熟地巴戟山茱萸肉蓯蓉酒浸焙石斛附子炮五味子白茯苓菖蒲遠志去心官桂麥冬去心各等分上為末水一盞半每服三錢生薑五片棗一枚薄荷同煎至八分不拘時服肘治中風四肢逆冷吐清水婉轉啼呼者取桂二兩㕮咀以水三升煮取二升去渣適寒溫盡服千地黃煎治熱風心煩悶及脾胃熱不下食冷補方生地汁二升枸杞根汁二升生薑汁酥各三升荊瀝竹瀝各五升天門冬人參各八兩茯苓六兩大黃梔子各四兩上十一味搗後五味為細末先煎地黃等汁成煎次納藥末攪勻每服一匕日再漸加至三匕覺利減之荊瀝湯治患風人多熱宜服荊瀝竹瀝生薑汁各五合上三味相和溫暖為一服每日旦服煮散午後進此平復乃止煮散見後解表雜方條衍唐王太后中風不能言脈沉而口噤醫人許胤宗曰既不能下藥宜湯氣熏之藥入腠理周時可瘥乃煎黃耆防風湯數斛置床下氣如煙霧熏之其夕便得語藥力熏蒸其效如此丹溪云人之口通乎地鼻通乎天口以養陰鼻以養陽天主清故鼻不受有形而受無形地主濁故口受有形而兼乎無形王太后病風不言而脈沉其急非大補不可也若以有形之藥湯緩不及事今以黃耆防風煎湯氣如煙霧滿室則口鼻俱受非智者通神之法不可為也食主風中心氣風熱手足不遂及風痹不任筋脈五緩恍惚煩躁熊肉二斤切如常法調和作醃臘空肚服之肘中緩風四肢不收者豉三升水九升煮三升分為三服日二服亦可酒漬飲之治卒風中不得語煮豆煎汁如飴含之亦可濃煮飲之佳聖治卒風中不語舌根強硬陳醬五合三年者妙人乳汁五合二件相和研以生布絞取汁不計時候少少與服久當愈肘治中風卒不得語以苦酒煮白芥子附頸一周以綿裹之一日夕而瘥凡治中風莫如續命之類然此可扶持初病若要收全功火艾為良中風皆因脈道不利血氣閉塞也灸則喚醒脈道而血氣得通故收全功本凡中風續命排風風引竹瀝諸湯及神精丹茵芋酒之類更加以灸無不愈者然此疾積聚之久非一日所能攻皆大劑久而取效唐書載王太后風喑不語醫者蒸黃耆防風湯數斛以熏之得瘥蓋此類也今人服三五盞求效則責醫也亦速矣孟子曰七年之病必求三年之艾久而後知爾仲續命湯治中風痱身體不能自收口不能言冒昧不知痛處或拘攣不能轉側麻黃六兩桂枝二兩當歸人參各一兩石膏四兩乾薑甘草芎藭各一兩杏仁三十枚上九味以水一斗煮取四升溫服一升當小汗薄覆脊憑几坐汗出則愈不汗更服無所禁勿當風並治肺風但服不得臥咳逆上氣面目浮腫潔治中風外有六經之形症先以加減續命湯隨證治之麻黃去節人參黃芩芍藥甘草炙川芎杏仁麥炒去皮尖防己官桂防風各一兩附子炮去皮臍半兩上除附子杏仁外搗為粗末後入二味令勻每服五錢水二盞半生薑五片煎至一盞去渣稍熱服食前如無汗惡寒者加麻黃防風杏仁上依本方加一倍宜針太陽經至陰出血如有汗惡風者加桂枝芍藥杏仁上依本方加一倍宜針風府以上二證太陽中風也如身熱無汗不惡寒者加知母石膏甘草如身熱有汗不惡寒者加葛根桂枝黃芩上依本方加一倍宜針陷谷刺厲兌針陷谷者去陽明之賊也刺厲兌者瀉陽明之實也以上二證陽明中風也如無汗身涼者加附子乾薑甘草宜針隱白去太陰之賊也此一證太陰中風也如有汗無熱加桂枝附子甘草若依本方加一倍宜針太溪此一證少陰中風也如無此四證六經混淆繫於少陽厥陰或肢節攣痛或麻木不仁宜羌活連翹續命湯小續命湯八兩羌活四兩連翹六兩上古之續命混淆無經今立分經治療又各分經針刺無不愈也治法宜刺厥陰之井大敦以通其經灸少陽之經絶骨以引其熱是針灸同象治法之大體也附云岐子加減法如精神恍惚加茯苓遠志如心煩多驚者加犀角半兩如骨節間煩痛有熱者去附子倍芍藥骨間冷痛者倍用桂枝附子如躁悶小便澀者去附子倍芍藥入竹瀝一合煎服如臟寒下痢者去防己黃芩倍附子白朮一兩熱痢不可用附子如腳弱加牛膝石斛各一兩如身疼痛加秦艽一兩如腰痛加桃仁杜仲各半兩如失音加杏仁一兩如或歌笑語無所不及者用麻黃三兩人參桂枝白朮各二兩無附子防風生薑有當歸一兩自汗者去麻黃杏仁加白朮春加麻黃一兩夏加黃芩七錢秋加當歸四兩冬加附子半兩內有便溺之阻隔復以三化湯導之厚朴薑製大黃枳實羌活各等分上銼如麻豆大每服三兩水三升煎至一升半服之以微利則已如內邪已除外邪已盡當從愈風湯以行中道久服大風悉去縱有微邪只從愈風湯加減治之然治病之法不可失於通塞或一氣之微汗或一旬之通利此為常治之法也久則清濁自分榮衛自和矣羌活愈風湯療肝腎虛筋骨弱語言難精神昏憒及治風濕內弱者是風熱體重也或瘦而一枝偏枯或肥而半身不遂或恐而健忘喜而多思思忘之道皆精不足也故心亂則百病生靜則萬病息是以此藥能安心養神調陰陽無偏勝保命集云內邪已除外邪已盡當服此藥以行中道諸經久服大風悉去縱有微邪只從此藥加減服之如覺風動服此不致倒僕羌活甘草炙防風去蘆黃耆去蘆蔓荊子川芎細辛去苗枳殼炒人參去蘆地骨皮麻黃去根知母去皮甘菊薄荷枸杞當歸去蘆獨活白芷杜仲炒去絲秦艽去蘆芍藥去皮黃芩白茯苓各三兩石膏三兩生地蒼朮各四兩肉桂一兩上銼每服一兩水二盞煎至一盞去渣溫服如遇天陰加生薑三片煎空心一服臨臥再煎渣服俱要食遠服空心咽下二丹丸謂之重劑臨臥咽下四白丹謂之輕劑是動以安神靜以清肺假令一氣之微汗用愈風湯三兩加麻黃一兩勻作四服每服加生薑五七片空心服以粥投之得微汗則住如一旬之通利用愈風湯三兩大黃一兩亦勻作四服如前煎臨臥服之得利為妙常服之藥不可失四時之輔如望春大寒後加半夏柴胡人參各二兩木通四兩此迎而奪少陽之氣也望夏加石膏黃芩知母各二兩此迎而奪陽明之氣也季夏之月加防己白朮茯苓各二兩此勝脾土之濕也秋初大暑後加厚朴藿香各二兩桂一兩此迎而奪太陰之氣也望冬霜降後加附子官桂各一兩當歸二兩此勝少陰之氣也如得春減冬所加藥四時類此此藥治七情六欲四氣無使五臟偏勝及不動於榮衛如風祕服之永不燥結如久瀉服之能自調適初覺風氣便服此藥與局方天麻丸一料相為表裡乃治未病之聖藥也不問男子婦人小兒風癇急慢風等病服之神效四白丹能清肺氣養魄為中風者多昏冒氣不清利也白朮白茯苓人參砂仁香附甘草防風川芎各半兩白芷一兩白檀一錢半知母二錢羌活薄荷獨活各二錢半細辛二錢麝香一錢另研牛黃一錢龍腦半錢俱另研藿香一錢半甜竹葉二兩上為細末煉蜜丸如桐子大每兩作十丸臨臥嚼一丸用愈風湯送下能上清肺氣下強骨髓二丹丸治健忘養神定志和血內以安神外華腠理熟地天冬丹參各一兩半茯神甘草各一兩菖蒲半兩遠志半兩去心人參半兩麥冬一兩去心硃砂二錢為衣上為細末煉蜜丸如桐子大空心用愈風湯送下至六十丸中風外無六經之形證內無便溺之阻格知為血弱不能養筋故手足不能運動舌強不能言語宜養血而筋自榮也當以秦艽湯主之秦艽石膏甘草川芎當歸羌活獨活防風黃芩白芍藥白芷白朮生地熟地白茯苓各一兩細辛半兩上銼每服一兩水二鍾煎至一鍾去滓溫服無時如遇天陰加生薑七八片如心下痞每服一兩加枳實一錢同煎天麻丸行榮衛壯筋骨天麻六兩酒浸三日曬乾玄參六兩牛膝六兩酒浸三日焙乾萆薢六兩另為末杜仲七兩銼炒去絲當歸十兩全用羌活十兩生地六兩附子一兩炮獨活五兩一方無上為細末煉蜜丸如桐子大每服五七十丸病大至百丸空心食前溫酒或白湯服忌壅塞失於通利故服藥半月稍覺壅塞微以七宣丸輕疏之使藥可為用也如素有痰久病中風津液湧溢在胸中氣不得利者用獨聖散吐之吐後用利氣瀉火之劑獨聖散治諸風隔痰諸癇痰涎津液湧溢用瓜蒂一兩炒黃色為末每服量虛實久新或二錢藥末茶一錢酸齏汁一鐘調下若用吐法須天氣晴明陰晦無用如病卒暴者不拘此法吐時宜辰卯二時故內經云平旦至日中天之陽陽中之陽也若論四時之氣仲景大法春宜吐是天氣在上人氣亦在上一日之氣辰卯是其候也故宜早不宜夜先令病人隔夜不食如服藥不吐用熱虀水投之如吐風癇者加全蠍五分微炒如有蟲者加狗油五七點雄黃末一錢甚者加芫花五分立吐蟲出如濕腫滿者加赤小豆末一錢此藥不可常用大要辨其虛實實則瓜蒂散虛則梔子豉湯滿加厚朴不可一概用之吐罷可服降火利氣安神定志之劑潔瀉清丸治中風自汗昏冒發熱不惡風寒不能安臥此是風熱煩躁方見治虛實法丹一婦人年六十左癱手足不語涎痰防風荊芥羌活南星沒藥乳香木通茯苓厚朴桔梗甘草麻黃金蠍紅花上作末酒湯下不拘時春脈漸伏以淡鹽湯虀汁每早一碗吐五日仍以白朮甘草陳皮厚朴菖蒲一日二帖後以川芎山梔豆豉瓜蒂緑豆粉虀湯吐了用蒼朮南星生薑牛膝茯苓酒糊丸服十日後夜間微汗手足動而能言千竹瀝湯治風痱四肢不收心神恍惚不知人不能言方患熱風者必先用此以制熱毒竹瀝二升生葛汁一升生薑汁五合上三味相和溫服分三服平旦日晡夜各一服服訖覺四肢有力次進後湯方竹瀝一升生葛汁五合芎藭防己附子人參各一兩羚羊角三兩芍藥黃芩甘草桂心各一兩生薑四兩石膏六兩杏仁四十枚麻黃防風各一兩半上十六味㕮咀以水七升煎減半納瀝再煮取二升五合分三服取汗間五日更服一劑頻服三劑漸覺少損仍進後方竹瀝三升防風升麻羚羊角防己桂心芎藭各二兩麻黃三兩上八味㕮咀以水四升合竹瀝煮取二升半分三服兩日服一劑常用加獨活三兩此方神良頻進三劑苦手足冷者加生薑五兩白朮二兩若未除更進後服竹瀝一升甘草二兩人參芎藭獨活升麻各二兩防風麻黃芍藥各一兩半羚羊角生薑石膏附子一作杏仁防己桂心黃芩白朮各二兩上十七味㕮咀以水八升煮減半納瀝煮取二升半分三服相去如行人十里久更服若有氣者加陳皮牛膝五加皮各一兩凡風痱服前湯得瘥訖可常服煮散除餘風方防己防風獨活秦艽黃耆芎藭芍藥人參白朮茯神羚羊角遠志升麻石斛牛膝五加皮丹參甘草厚朴天門冬陳皮地骨皮黃芩桂心各一兩乾地黃杜仲生薑麻黃檳榔藁本烏犀角各二兩薏苡仁一升石膏六兩上三十三味搗篩為粗散和攪勻每服以水三升藥三兩煮取一升綿濾去渣頓服之取汗日服若覺心中熱煩以竹瀝代水煮之世治卒中風不語桂枝薄辣者去皮一兩懷中藏三個時辰分三服水煎並進神效上解表諸方治中風全不能語經所謂甚則不能言者是也羅犀角防風湯治一切諸風口眼喎斜手足嚲拽言語謇澀四肢麻木皆治之犀角防風甘草炙天麻羌活各一兩滑石三兩石膏一兩半麻黃七錢半不去節獨活山梔各七錢荊芥連翹當歸黃芩全蠍薄荷大黃各半兩桔梗白朮細辛各四錢上㕮咀每服五錢水二盞生薑十片煎至一盞去渣稍熱服未汗再一服如病人臟氣虛則全減大黃輕骨丹治風癱瘓四肢不隨苦參桑白皮白芷蒼朮甘松川芎各四兩麻黃去節五升河水五升煮去渣再熬成膏至半碗上為末入前麻黃膏和丸如彈子大每服一丸溫酒研化服之臥取汗五七日間再服手足當即輕快卒中涎潮分利後用之一方有浮萍四兩風藥聖餅子治半身不遂手足頑麻口眼喎斜痰涎壅盛及一切風他藥不效者小兒驚風大人頭風婦人血風並治之川烏生草烏麻黃去節各二兩蒼朮何首烏白附子白殭蠶川芎各五錢防風乾薑各二錢半雄黃四錢六分藿香荊芥各二錢半上為末醋糊丸如桐子大捏作餅子嚼碎茶湯送下食後世採浮萍草法並方不在山兮不在岸採我之時七月半一任癱風與瘓風些少微風都不算豆淋酒內下三錢錢幞頭上也出汗本治風半身不遂此方甚妙穿山甲左癱用左腳右癱用右腳川烏頭紅海蛤各二兩上為末每用半兩生蔥自然汁調成膏作餅子約一寸半左患貼左腳右患貼右腳貼在足掌心內用舊絹片緊扎定於密房中無風處椅子上坐用湯一盆將有藥腳浸於湯中用小心人扶病人恐汗出不能支持候汗出急去藥如汗欲出時身必麻木以汗周遍為妙如未效半月後再用一次神妙世治卒中手足不遂用麥麩五升入烏頭尖一升連翹半升同甑炊令大熱輔在席下以手足不遂處臥之令熱氣熏蒸候出汗為度日用三次丸藥再蒸用之候兩日外別用新藥如無烏頭尖只用草烏頭半升不去皮尖研作粗末亦可千治半身不遂用蠶砂兩石分作三袋每袋可七斗蒸熱一袋著患處如冷再換一袋依前法數數換易百不禁瘥止須羊肚釀粳米蔥白薑椒豉等煮爛熟吃日食一具十日止此方千金不傳上解表方治中風語言謇澀經所謂志亂不甚其言微知者是也羅中臟治驗真定府臨濟寺趙僧判於至元八月間患中風半身不遂精神昏憒面紅頰赤耳聾鼻塞語言不出診其兩手六脈弦數常記潔古有云中臟者多滯九竅中臟者多著四肢今語言不出耳聾鼻塞精神昏憒是中臟也半身不遂是中腑也此臟腑俱受病先以三化湯一兩內疏二三行散其壅滯使清氣上升充實四肢次與至寶丹加龍骨南星安心定志養神使各臟之氣上升通利九竅五日音聲出語言稍利後隨四時脈證加減用藥不旬日稍能行步先以繩絡其病腳如履閾或高處得人扶之方可逾也又刺十二經之井穴以接經絡翌日不用繩絡能行幾步百日大勢皆去戒之慎言語及節飲食一年方愈子和一衲子因陰雨臥濕地一年手足皆不遂若遇陰雨其病轉加諸醫皆作中風偏枯治之用當歸芍藥乳香沒藥自然銅之類久服反加大便澀風燥生經歲不已戴人以舟車丸下三十餘行去青黃沫水五升次以淡劑滲泄之數日手足能舉戴人曰受風濕寒三氣合而為痹水濕得寒而浮蓄於皮腠之間久而不去內舍六腑宜用去水之藥可也水濕者人身中之寒物也寒去則血行血行則氣和氣和則愈矣世治中風大便祕者用不蛀皂角燒灰為細末每服一錢米飲調下本豨蘞丸豨蘞俗呼火杴草莖葉頗類蒼耳春生苗葉秋初開花秋末結實法於五月五日六月六日九月九日採其葉去根莖花實或云秋花成實後和枝取用洗淨曝乾入甑中用酒蜜蒸之九遍焙乾搗篩為細末煉蜜丸如桐子大空心用溫酒或米飲下四五十丸張乖崖進表云誰知至賤之中乃有殊常之效臣服至百服眼目清明至千服須鬢變黑筋骨強健又云甚益元氣療諸疾患修合施人服無不效羅正舌散治中風舌強語澀雄黃研荊芥各等分上為末每服二錢用豆淋酒調下茯神散治證同前茯神心炒一兩薄荷焙二兩蠍梢去毒二錢半上為末每服一二錢溫酒調下本治風在肝脾語澀謇腳弱大便多祕地黃酒熟地四兩附子茵芋羌活防風芎藭各一兩石斛二兩丹參二兩半牛蒡根二兩半牛膝杜仲桂枝各一兩半大麻子一升上銼入絹袋盛寬貯之用無灰酒一斗九升封漬七日逐日空心食前後飲一盞常醺勿令吐治中風內虛腳弱語謇防風湯石斛一兩半地黃杜仲丹參防風川芎麥門冬桂心獨活各一兩上為粗末每服五錢水一大盞半棗二枚同煎去渣溫服治中風入肝脾經四肢不遂舌強語謇竹瀝湯威靈仙附子桔梗防風蔓荊子枳殼川芎當歸各等分上為粗末每服四錢水一盞竹瀝半盞生薑四片同煎至八分去渣溫服日三四忌口治久風邪入肝脾二經言語不轉防己湯漢防己防風桂心附子各半兩威靈仙三錢麻黃半兩上為粗末每服四錢水一盞引子半盞煎七分去渣溫服日三四引子用竹瀝荊瀝地黃汁各一盞生薑汁拌勻用之以上四方龐先生傳審而用之良驗千獨活煮散治風痱獨活八兩芎藭芍藥茯苓防風防己葛根各六兩羚羊角當歸人參麥門冬桂心石膏各四兩磁石十兩甘草三兩白朮五兩上十六味各切銼分為二十四服每服生薑生地切作一升杏仁二七枚以水二升煮取七合或日晚或夜中或日一服或間日服羅局方至寶丹治風中臟方見局方聖保命金丹治中風口眼喎斜手足嚲拽言語謇澀四肢不舉晨昏痰多貫衆一兩生地七錢大黃半兩青黛板藍根各三錢硃砂研蒲黃薄荷各二錢半珠子研龍腦研各一錢半麝香研一錢牛黃二錢半研上為末研和藥勻蜜丸如雞豆大每服一丸細嚼茶清送下新汲水亦得如病人嚼不得薄荷湯化下無時此藥墜痰涎大有神效用金箔為衣活命金丹治中風不語半身不遂肢節痹疼痰涎潮上咽嗌不利胸膈痞滿上實下虛氣閉面赤汗後餘熱不退勞病諸藥不治無問男女老幼皆可服板藍根貫衆甘草乾葛根各一錢桂心芒硝一兩大黃一兩半珠子粉牛黃研青黛生犀屑薄荷各五錢辰砂四錢研一錢為衣麝香研龍腦二錢上為末和勻蜜水浸蒸餅為劑每兩作十丸就濕用硃砂再用金箔四十片為衣臘月修合瓷器收貯多年不壞如療風毒茶清化下解毒藥新汲水化下汗後餘熱勞病及小兒驚風熱病用薄荷湯化下海解語丸治中風語言不正白附子石菖蒲遠志全蠍羌活天麻南星白殭蠶上為細末蜜丸如緑豆大服之經治中風及壅滯旋覆花淨洗搗末煉蜜丸如桐子大夜臥茶湯下五丸七丸至十丸治中風不語喉中如拽鋸聲口中涎沫取藜蘆一分天南星一枚去浮皮卻於臍上剜一坑子內入藜蘆陳醋和麵包裹四面用火逼令黃色同搗再研極細生面為丸如小豆大每服三丸溫酒下運語澀皆屬風經云厥陰司天風淫所勝民病舌本強是風氣勝也又云厥陰司天主勝則舌難以言是風氣虛也靈帝曰刺節言解惑夫子乃言盡知調陰陽補瀉有餘不足相傾移也惑何以解之岐伯曰大風在身血脈偏虛偏虛者不足實者有餘輕重不得傾側宛伏不知東西不知南北乍上乍下乍反乍覆顛倒無常甚於迷惑黃帝曰善取之奈何岐伯曰瀉其有餘補其不足陰陽平復用針若此疾於解惑黃帝曰善刺節真邪論盡知調陰陽補瀉有餘不足相傾移者謂診手部三候面部三候足部三候視其所候之症其脈實者瀉之虛者補之如陽經之脈實陰經之脈虛瀉其陽經補其陰經陰經之脈實陽經之脈虛瀉其陰經補其陽經又如左實右虛瀉左補右右實左虛瀉右補左之類是也羅灸風中脈口眼喎斜聽會二穴頰車二穴地倉二穴凡喎向右者為左邊脈中風而緩也宜灸左喎陷中二七壯凡喎向左者為右邊脈中風而緩也宜灸右喎陷中二七壯艾炷如大麥大灸風中腑手足不遂等疾百會一穴肩髃二穴曲池二穴足三里二穴絶骨二穴風市二穴凡覺手足痹或麻或痛良久乃已此將中腑之候宜灸此諸穴病在左灸右在右灸左灸風中臟氣塞涎上不語極危者下火立效百會一穴風池二穴大椎一穴肩井二穴曲池二穴間使二穴足三里二穴凡覺心中憒亂神氣不怡或手足麻木此中臟之候也不問是風與氣可速灸此七穴五七壯日後再別灸之隨年壯止凡遇春秋二季可時時灸此七穴以泄風氣凡人風發怕痛不肯灸忽然卒死是謂何病曰風入臟故也病者不可不知豫自五月間口眼喎斜灸百會等三穴即正右手足麻木無力灸百會髮際等七穴得愈七月氣塞涎上不能語魂魄飛揚如墮江湖中頃刻欲絶灸百會風池等左右頰車二穴氣遂通吐涎半碗又下十餘行伏枕半月遂平復自後凡覺神氣少異於常即灸百會風池等穴無不立效本範子默記崇寧中凡兩中風始則口眼喎斜次則涎潮閉塞左右共灸十二穴得氣通十二穴者謂聽會頰車地倉百會肩髃曲池風市足三里絶骨髮際大椎風池也依而用之無不效羅中風針法出竇太師氣元歸類手太陰列缺偏風半身不遂天府卒中惡鬼疰不得安臥手陽明肩髃曲池偏風半身不遂足陽明大巨偏枯四肢不舉衝陽偏風口眼喎斜足緩不收手太陽腕骨偏枯狂惕足太陽輔陽風痹不仁四肢不舉足太陰照海大風偏枯半身不遂善悲不樂足少陽陽陵泉半身不遂環跳風眩偏風半身不遂甲痱痿臂腕不用唇吻不收合谷主之偏枯四肢不舉善驚大巨主之偏枯不能行大風默默不知所痛視如見星溺黃小腹熱咽乾照海主之偏枯臂腕發痛肘屈不得伸手又風頭痛泣出肩臂頸痛項急煩滿驚五指掣不得屈伸戰惕腕骨主之羅大接經從陽引陰治中風偏枯出雲岐子醫學新說足太陽膀胱之脈出於至陰小指外側去爪甲如韭葉為井金十呼足少陰腎之脈湧泉起於小指之下斜趨足心三呼手厥陰心包之脈其直者循中指中衝出爪甲如韭葉陷中為井其支者別掌中小指次指出其端手少陽三焦之脈起小指次指之端去爪甲如韭葉為井三呼足少陽膽之脈起足竅陰小指次指之端去爪甲如韭葉為井其支者上入大指岐骨內出其端還貫爪甲出三毛中三呼十三呼足厥陰肝之脈起大敦大指入叢毛之際去爪甲如韭葉及三毛為井十呼六呼手太陰肺之脈起大指之端出於少商大指內側去爪甲如韭葉為井其支者出次指內廉出其端手陽明大腸之脈起大指次指之端入次指內側去爪甲如韭葉為並一呼中指內交三呼足陽明胃之脈起足大指次指之端去爪甲如韭葉為井其支者入大指出其端一呼足太陰脾之脈起足大指端循指內側去爪甲角如韭葉為井隱白是也十呼手少陰心之脈起手小指內出其端循指內廉去爪甲角如韭葉為井手太陽小腸之脈起手小指之端去爪甲下一分陷中為井大接經從陰引陽治中風偏枯手太陰肺之脈起手大指端出於少商大指內側去爪甲角如韭葉為井一呼三呼手陽明大腸之脈起手大指次指之端去爪甲如韭葉為井其支者入大指間出其端足陽明胃之脈起足大指次指之端去爪甲如韭葉為井其支者入大指間出其端足太陰脾之脈起足大指端循指內側去爪甲如韭葉為井隱白也手少陰心之脈起手小指內出其端循指內廉去爪甲如韭葉為井手太陽小腸之脈起手小指之端去爪甲下一分陷中為井足太陽膀胱之脈起足小指外側至陰去爪甲如韭葉為井金足少陰腎之脈起足小指之下斜趨足心為井湧泉穴也手厥陰心包之脈其直者循手中指出其端去爪甲如韭葉為井中衝穴也其支者循掌中循小指次指出其端手少陽三焦之脈起手小指次指之端去爪甲如韭葉為井足少陽膽之脈起於竅陰小指次指之端去爪甲如韭葉為井其支者上入大指岐骨內出其端還貫爪甲出三毛中足厥陰肝之脈起足大指之端入叢毛之際去爪甲如韭葉為井大敦也六呼大接經皆十二經井穴也此羅謙甫治趙僧判中臟刺十二井穴愈治張安撫中臟灸十二井穴愈內經所謂留瘦不移節而刺之是也難陰蹺為病陽緩而陰急陽蹺為病陰緩而陽急羅云治失音不語出竇太師氣元歸類手陽明天鼎暴喑並喉痹合谷喑不能言手少陰陰郤喑不能言靈道暴喑不語足陽明頰車地倉不語飲食不收水漿漏落病右治左病左治右手少陽支溝暴喑不語三陽絡暴啞不能言手太陽天窗暴喑不能語足少陰通谷暴喑不語手厥陰間使喑不能語玉中風不語不省人事頂門灸七壯百會針入豆許先補後瀉瀉多補少又撮要法中衝一分補之大敦灸一分百會一分瀉怪穴又法十指尖出血此更詳之玉中風失音喑門二分留三呼瀉之不可深人中三分留三吸瀉之天突湧泉各五分神門支溝各三分如舌急不語喑門二分如舌緩不語風府三分東陽卒中失音不能言語緩縱不隨天窗刺之一分灸五十壯息火仍移灸百會五十壯畢復灸天窗五十壯始發若先灸百會則風氣不得泄內攻五臟喜閉伏仍失音所以先灸天窗千治風痱不語手足不遂方度病者男左手女右手小指內歧間至指端為度以置臍上直望心下以朱塗度上端畢又作兩度續所塗上合其下開其上取其本度橫置開上令三合其狀如形復以朱塗兩端畢三處同時起火灸之各一百壯愈河凡覺中風必先審六經之候慎勿用大熱藥烏附之類故陽劑剛勝積若燎原為消狂瘡腫之屬則天癸絶而榮涸矣羅云中風人初覺不宜服腦麝恐引風入骨髓如油入面不能得出如潮痰盛不省人事煩熱者宜用下痰神效潔云中風如小便不利不可以藥利之既已自汗則津液外亡小便自少若利之使榮衛枯竭無以制火煩熱愈盛當候熱退汗室小便自行也丹治中風方續命排風越婢等悉能除去而千金多用麻黃令人不得慮虛以風邪不得汗則不能泄也然此治中風不汗者為宜若自汗者更用麻黃則津液轉脫反為大害中風自汗仲景雖處以桂枝湯至於不住發搐口眼瞤動遍身汗出者豈勝對治此時獨活湯續命煮散能復榮衛卻風邪不可缺也獨活續命散方風瘛瘲條千治中風無密室者不可療強人居室不密尚中風邪況服藥之人乎服汗劑必依此法丹寒則筋急熱則筋緩緩因於弛長縮因於短促若受濕則弛弛因於寬而長然寒與濕未嘗不挾熱三者皆因於濕然外濕非內濕無以啓之不能成疾致濕之由酒面為多魚與肉繼以成之若甘滑燒炙香辛硬物皆致濕之因戒之慎之藥中肯綮矣若將理失宜雖聖醫不治也天産作陽氣浮發熱先哲格言但是患痿之人若不能淡薄食味吾知其必不能安全也丹溪斷痱病為痿凡人初覺食指次指麻木不仁或不用者三年內必中風之候也宜先服愈風湯天麻丸各一兩料此治之先也是以聖人治未病不治已病中風人能食蓋甲己化土脾盛故能多食此脾愈盛下克腎水腎水虧則病增宜廣服藥不欲多食病能自愈中風多食風木盛也盛則克脾脾受敵求助於食經曰實則夢與虛則夢取當瀉肝木治風安脾脾安則食少是其養矣肺脈微緩為痿瘻偏風頭以下汗出不可止全文見治虛實法脾脈微緩為風痿四肢不用心慧然若無病同上經云脈緩者多熱蓋風痿即風痱之類素胃脈沉鼓澀胃外鼓大心脈小堅急皆鬲偏枯男子發左女子發右不喑舌轉可治三十日起其從者喑三歲起年不滿二十者三歲死大奇論王注云從謂男發左女發右也玄中風不語者為病在心臟脈反沉者治難見效凡病脈不應病者危丹脈訣內言不治證見則不可治筋枯不治動則筋痛者是謂筋枯以其無血滋潤筋骨也産後中風丹産後中風口眼喎斜必用大補氣血然後治痰當以左右手脈分其氣血多少以治切不可作中風治用小續命湯及發表治風之藥云治産後中風半身手足不遂言語謇澀恍惚多忘精神不定獨活當歸芍藥防風川芎玄參天麻各五錢桂心三錢上㕮咀以水八升煮取二升半分為三服覺效更作一劑又作丸每服二十丸如有熱加葛根五錢有冷加白朮五錢若有氣症加生薑一兩半若手足不遂加牛膝一錢半萆薢三錢黃耆四錢若腹痛加當歸芍藥七錢半若不食加人參五錢玄參一兩若寒中三陰所患必冷小續命湯加姜煎若暑中三陽所患必熱小續命湯去附子減桂心一半加薄荷煎保血風湯治産後諸風痿攣無力秦艽羌活防風白芷川芎芍藥當歸白朮茯苓熟地各等分上為末一半蜜丸一半散酒調下五七十丸妙食治産後風虛五緩六急手足頑痹氣血不調大豆一升炒令熟熱投三升酒中密封飲之小品治産後中風語澀四肢拘急羌活三兩為末每服五錢水酒各半盞煎去渣溫服上産後中風用續命湯及羌活發散之藥必詳氣血以四物四君子相與各半停對分兩服之可也口噤中倒之初有口噤者故附之丹口噤搐鼻用鬱金藜蘆為末水調搐之治口噤卒不得語附子杵末內管中吹喉中立安千金翼云吹喉中恐是吹鼻中經治急中風目瞑牙噤無門下藥者用此末子以中指蘸末揩大牙左右二三十遍其口自開始得下藥名開關散天南星搗為末白龍腦二件各等分研五月五日午時修治者只一字至半錢效涎盛者吐之簡治中風口噤涎潮壅塞吐涎方用皂角一挺去皮塗豬脂炙黃為末每服一錢匕非時溫酒服如氣實脈盛調二錢匕如牙不開用白梅揩齒口開即灌藥吐出風涎瘥本治中風不省人事牙關緊急用藜蘆一兩去蘆濃煎防風湯洗過焙乾切炒微黃褐色搗末每半錢溫水下以吐涎為效如人行三里許未吐再服羅分涎散治中風涎潮作聲口噤手足搐搦藿香全蠍炒白附子南星炮各一兩丹砂膩粉粉霜各二兩上為細末每服一錢匕至二錢薄荷湯或茶湯調下未吐利再服衍黃耆防風湯熏法方見中深半身不遂門世治中風口噤不知人事産後中風用白朮四兩水三升煎一升頓服大白朮酒治妊娠中風口噤語言不得白朮獨活一兩黑豆炒一合上銼以酒三升煮取一升半去渣溫分四服口噤者斡開灌之得汗即愈千治中風通身冷口噤不知人事用獨活四兩好酒一升煎半升分溫再服破傷風口噤見破傷風門摘中風口噤不開人中四分頰車四分得氣即瀉集又法人中頰車一分沿皮透地倉百會一分灸承漿三分灸合谷一分灸東口噤不開唇吻不收喑不能言合谷人中甲口噤不能言翳風主之口眼喎斜凡半身不遂者必口眼喎斜亦有無半身不遂之症而喎斜者故另立附之運氣口眼喎斜者多屬胃土風木不及金乘之土寡於畏也經云木不及曰委和委和之紀其動緛戾拘緩又云厥陰所至為緛蓋緛縮短也木不及則金化縮短乘之以勝木之條達也戾者口目喎斜也拘者筋脈拘強也木為金之縮短牽引而喎斜拘強也緩者筋脈縱也木為金乘則土寡於畏故土兼化緩縱於其空隙而拘緩者自緩也故目喎斜者多屬胃土有痰治法宜辛溫瀉金之短縮平土之濕痰也垣清陽湯治筋脈縮短牽引口目喎斜方見後孟中賊風口偏不能語者取吳茱萸一升清酒一升和煮四五沸合服之半升日三服得少汗瘥千治口喎大豆三升炒令焦好酒三升淋取汁頓服一日一服治中風面目相引口偏著耳牙車急舌不得轉方獨活三兩竹瀝生地汁各一升上三味合煎取二升頓服即愈治卒中風口喎不正取空青末如豆大一枚含之即愈口目喎斜之症大率在胃而有筋脈之分經云足之陽明手之太陽筋急則口目為僻眥急不能卒視此胃土之筋為喎邪也經云胃足陽明之脈挾口環唇所生病者口喎唇邪此胃土之脈為喎邪也垣清陽湯治口喎斜頰腮急緊胃中火盛汗不止而小便數升麻二錢葛根一錢半當歸身二錢黃耆二錢甘草炙一錢紅花一錢蘇木五分桂枝一錢甘草生五分黃柏酒一錢上㕮咀作一服酒三盞煎至一盞三分去渣稍熱食前服訖以火尉摩緊急處即愈夫口喎筋急者是筋脈血絡中大寒此藥少代燔針劫刺破惡血以去凝結內泄衝脈之火熾羅風中血脈治驗太尉中武史公年六十八歲於至元十月初侍國師於聖安寺丈室中煤炭火一爐在左邊遂覺面熱左頰微有汗師及左右諸人皆出因左頰疏緩被風寒客之右頰急口喎於右脈得浮緊按之洪緩豫舉醫學提舉忽君吉甫專科針灸先以左頰上灸地倉穴一七壯次灸頰車二七壯後於右頰上熱手尉之議以升麻湯加防風秦艽白芷桂枝發散風寒數服而愈或曰世醫多以續命等藥治之今君用升麻湯加四味其理安在對曰足陽明經起於鼻交頞中循鼻外入上齒中手陽明之經亦貫於下齒中況兩頰皆屬陽明升麻湯乃陽明經藥香白芷又行手陽明之經秦艽治口噤防風散風邪桂枝實表而固榮衛使邪不能再傷此其理也夫病有標本經絡之別藥有氣味厚薄之殊察病之源用藥之宜其效如桴鼓之應不明經絡所過不言藥性所主徒執一方不惟無益而又害之者多矣學者宜細思之秦艽升麻湯治中風手足陽明經口眼喎斜四肢拘急惡風寒升麻干根甘草炙芍藥人參各半兩秦艽白芷防風桂枝各三錢上㕮咀每服一兩水二盞連須蔥根白三莖煎至一盞去渣稍熱服食後服藥畢避風寒臥得微汗出則止丹婁舍人口眼喎斜先自右邊牙疼防風五分南星一錢桂枝三分半夏五分蒼朮五分甘草炙二分白朮一錢半茯苓三分上煎後入薑汁一合服本治風客陽經邪傷腠理背脊強直口眼喎斜體熱惡寒痰厥頭痛肉瞤筋惕辛頞鼻淵及飲酒過多嘔吐涎沫頭痛眩暈如坐車船常服解風邪傷寒闢霧露瘴氣爽慧神志諸風不生定風餅子天麻川烏南星半夏川薑川芎白茯苓甘草生各等分上為細末薑汁為丸如龍眼大作餅子硃砂為衣每服一餅細嚼熱薑湯下不拘候熙豐間王丞相常服預防風疾神驗千枳茹酒主口僻眼急大驗諸藥不瘥方枳實上青刮取末欲至心止得茹五升微火炒去濕氣以酒一斗漬微火暖令得藥味隨性飲之子和東𣏌一夫患口目喎斜其兩手急數如弦之張有力而實其人壯氣充風火交勝與調胃承氣湯六兩以水四升煎作三升分作四服令稍熱啜之前後約瀉四五十行去一兩次以苦劑投之解毒數服以升降水火不旬而愈脈訣云熱則生風內經治口眼喎斜多屬足陽明筋病蓋足陽明筋結頰上得寒則急得熱則弛左寒右熱則左頰筋急牽引右之弛者而右隨急牽引喎向左也右寒左熱則右頰筋急牽引左之弛者而左隨急牽引喎向右也故其治法以火灸且為之膏油尉其急者以白酒調和桂末塗其弛者又以桑為鉤鉤其舌吻之喎僻處使正平而高下相等復以水調生桑灰於鉤柄之坎縫處連頰塗之以收其弛兼飲姜酒啖美肉使筋脈氣和以助外之塗尉不飲酒者自強其筋骨以手拊拍其急處使症自去也詳見筋門千又方牡蠣附子礬石灶下黃土上四味各等分為末取三年雄雞冠血和藥敷其上持鏡看候欲復故便急洗去之不速去便過不復還也千金翼云偏左塗右偏右塗左又方酒煮桂取汁一升以故布浸拓病上則正左喎斜拓右右喎斜拓左此祕方不傳余常用大效此方即內經用酒桂塗法也又方大皂莢一兩去皮子搗篩以三年石灰末水和左喎塗右右喎塗左干又塗之衍取硬石灰一合以醋炒和如泥於患偏風牽口喎斜人口唇上不患處一邊塗之立便牽正孫卒患偏風口喎語澀取衣中白魚摩耳下喎向左摩右向右摩左即正即蠹書魚也聖治中風口喎用巴豆七枚去皮爛研喎左塗右手心喎右塗左手心仍以暖水一盞安向手心須臾即便正洗去藥並頻抽掣中指子和一長吏病口目喎斜豫療之目之斜灸以承泣口之喎灸以地倉俱效苟不效者當灸人迎夫氣虛風入而為偏上不得出下不得泄真氣為氣邪所陷故宜灸所以立愈按此乃脈兼喎斜故灸之愈若筋急喎斜非灸可愈必用服藥及用燔針劫刺其急處或用馬膏塗法可愈故承泣地倉人迎皆足陽明陽明胃脈之所發也玉口眼喎斜地倉針入二分沿皮斜向頰車一寸半留十吸瀉之頰車二分斜向地倉以上三穴喎右補瀉左喎左補瀉右甲乙口僻顴窖及齦交下關主之面目惡風寒䪼腫癰痛招搖視瞻瘛瘲口僻巨窖主之口不能水漿喎僻水溝主之厥口僻失缺下牙痛頰腫惡寒口不能收舌不能言不能嚼大迎主之口僻偏歷主之口僻刺太淵引而下之口僻噤外關主之僻不正失缺口不開翳風主之千又方以葦筒長五寸以一頭刺耳孔中四畔以面塞密勿令泄風一頭納大豆一顆並艾燒令燃灸七壯即瘥患右灸左患左灸右千金不傳耳病亦可灸之癢凡中風多有癢甚不收者故編此附之於後與前中風方相兼用之可也丹經曰諸癢為虛血不榮肌腠所以癢也當以滋補藥以養陰血血和肌潤癢自不作矣治身上虛癢四物加黃芩煎湯調浮萍末服之治諸癢如蟲行此虛也先與大料四物湯服之鹽一斗水一石煎減半溫浴三次能治一切風癢祕要諸癢凌霄花末酒下一二錢此花補陰血甚速本草云凌霄治熱風身癢遊風風疹瘀血蒼耳葉同用也陶安人身體肥壯久患瘙癢自投風藥漸成虛症身上麻木無力口苦幹小便數白朮二錢陳皮芍藥黃芩一兩茯苓七錢歸身黃耆人參川芎青皮蒼朮木通五錢黃柏酒炒五味子甘草炙二錢每服下黃精丸三十丸靈虛邪搏於皮膚之間其氣外發腠理開毫毛搖氣往來行則為癢刺節真邪篇丹何首烏散治渾身風寒濕癢何首烏鹽炒天麻枸杞生地熟地各一兩防風川芎薄荷訶子甘草各半兩上為末每服二三錢溫酒空心服溫茶亦得集治風氣客皮膚瘙癢不已蟬蛻薄荷末等分為末酒調一錢匕日三服又方治風氣客於皮膚瘙癢不已蜂房炙過蟬蛻等分為末酒調一錢匕日二三服局消風散治皮膚頑麻癃疹瘙癢茯苓川芎羌活人參荊芥穗防風藿香蟬蛻白殭蠶炒去絲甘草炒各二兩厚朴陳皮各半兩上為末每服二錢茶酒調下經治風疹癢不止枳殼三兩麩炒微黃去穰為末每服二錢非時水一盞煎至六分去渣服聖治婦人瘙疹身癢不止用蒼耳花葉子等分搗羅為末頭淋酒調服一錢匕丹治一切癢食羊蹄根不宜多河癢得爬而解者爬為火化微則亦能癢甚則癢去者謂令皮膚辛辣而屬金化辛能散火故金化見則火化解矣聖治風瘙癮疹遍身癢成瘡者用蠶砂一升水一斗煮取一斗二升去渣熱洗宜避風羅澡洗藥治一切諸風及遍身瘙癢光澤皮膚乾荷葉三十三兩威靈仙十五兩藁本一斤零陵香一斤茅香一兩甘松白芷各半斤上為粗末每用二兩生絹袋盛水二桶約四斗煎五沸放熱於無風處淋澡洗之避風少時如水少時便添熱湯斟酌得所勿添冷水不添藥末浴癢無如鹽濃煎湯最妙仲寸口脈遲而緩遲則為寒緩則為虛榮緩則為亡血衛緩則為中風邪氣中經則身癢而癮疹心氣不足邪氣入中則胸滿而短氣脈緩而大浮為風虛大為氣強風氣相搏大成癮疹身為癢癢者名泄風久久為痂癩
