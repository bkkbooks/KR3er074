body:
  text: 卷之十五肝膽部頭風痛丹頭痛多主於痰痛甚者火多有可吐者亦有可下者垣金匱真言論云東風生於春病在肝俞在頸項故春氣者病在頭又諸陽會於頭面如足太陽膀胱之脈起於目內眥上額交巔直入絡腦還出別下項病沖頭痛又足少陽膽之脈起於目鋭眥上抵頭角病則頭角額痛夫風從上受之風寒傷上邪從外入客經絡令人振寒頭痛身重惡寒治在風池風府調其陰陽不足則補有餘則瀉汗之則愈此傷寒頭痛也治法見傷寒條頭痛耳鳴九竅不利者腸胃之所生乃氣虛頭痛也治法見氣虛條如氣上不下頭痛巔疾者下虛上實也過在足少陰巨陽甚則入腎寒濕頭痛也治法見寒濕條有厥逆頭痛者所犯大寒內至骨髓髓以腦為主腦逆故令頭痛齒亦痛治見寒條有心煩頭痛者病在膈中過在手巨陽少陰乃濕熱頭痛也治見實條頭痛分三陰三陽見陰陽條諸血虛頭痛當歸川芎主之諸氣虛頭痛人參黃耆主之主者主治也兼見何證以佐使藥治之此立方之大法也血氣俱虛頭痛者於調中益氣湯加川芎蔓荊子細辛其效如神諸濕厥頭痛清空膏主之即風濕熱頭痛也方見濕氣條諸痰厥頭痛半夏白朮天麻湯主之方見脾土條諸厥逆頭痛羌活附子湯主之方見寒條如濕熱在頭者以苦吐之不可執方而治方見實條海三陽頭痛羌活防風荊芥升麻葛根白芷柴胡川芎芍藥細辛蔥白連須分兩旋加陰證頭痛只用溫中藥如理中薑附之類也垣凡頭痛皆以風藥治之者總其大體而言之也高巔之上惟風可到故味之薄者陰中之陽自地升天者也然亦有三陰三陽之異太陽經頭痛惡風寒脈浮緊川芎獨活之類為主少陽經頭痛脈弦細往來寒熱柴胡黃芩主之陽明經頭痛自汗發熱不惡寒脈浮緩長實者升麻葛根石膏白芷主之太陰經頭痛必有痰體重或腹痛為痰癖脈沉緩者蒼朮半夏南星主之少陰經頭痛三陰三陽經不流行而足寒氣逆為寒厥其脈沉細麻黃附子細辛湯主之厥陰經頭疼項痛或吐痰沫冷厥其脈浮緩吳茱萸湯主之方見傷寒清空膏治偏正頭痛年深不愈者及療風濕熱頭痛上壅損目及腦痛年深不止羌活防風各一兩柴胡七錢川芎五錢甘草炙一兩半黃連炒一兩黃芩三兩一半酒製一半炒上為細末每服二錢熱盞內入茶少許湯調如膏抹在口內少用白湯送下臨臥如苦頭痛每服中加細辛二錢如太陰脈緩有痰名曰痰厥頭痛加羌活防風川芎甘草又加半夏一兩半如偏正頭痛服之不愈減羌活防風川芎一半加柴胡一倍如發熱惡熱而渴正陽明頭痛只與白虎湯加白芷東垣云諸濕熱頭痛清空膏主之丹溪云東垣清空膏諸般頭痛皆治惟血虛頭痛從魚尾相連痛者不治又云治少陽頭痛如痛在太陽厥陰者勿用蓋謂頭巔痛也丹小清空膏治諸般頭痛惟血虛頭痛不治用片芩細切酒拌勻曬乾為末茶清調下酒亦可垣清上瀉火湯昔有人年少時氣弱於氣海三里節次約灸五七百壯至年老添熱厥頭痛雖冬天大寒猶喜風寒其頭痛便愈微來暖處或見煙火其痛復作五七年不愈皆灸之過也羌活三錢防風七分升麻七分柴胡五分藁本半錢細辛少許川芎二分荊芥二分蒼朮三分蔓荊子二分黃芩酒製一錢半黃連酒製半錢黃柏酒製一錢甘草五分知母酒製一錢半當歸三分生地半錢黃耆一錢紅花少許上銼如麻豆大分作二服每服水二盞煎至一盞去渣稍熱服食遠補氣湯服前藥之後服此藥黃耆八分甘草炙歸身各二錢柴胡升麻各二分細辛少許麻黃炒苦丁香各半錢水煎服安神散治頭旋眼黑頭痛羌活一兩防風二錢半柴胡五錢升麻五分酒黃柏一兩酒知母五錢酒生地半兩黃耆一兩甘草炙三錢生甘草三錢上㕮咀每服半兩水二大盞煎至一盞半加蔓荊子半錢川芎三分再煎至一盞臨臥去渣熱服上東垣丹溪治虛熱頭痛大率皆以酒芩酒連酒柏加風劑也羅川芎散治頭風偏正頭痛昏眩川芎細辛羌活槐花甘草炙香附子石膏炙半兩荊芥薄荷菊花防風茵陳各一兩上為細末每服二錢食後茶清調下日三服石膏散治頭疼不可忍麻黃去根節石膏各一兩何首烏半兩葛根七錢半上為細末每服三錢生薑三片水煎稍熱服石膏散治頭疼川芎石膏亂紋好者白芷上各等分為細末每服四錢熱茶清調下本荊芥散治頭風王太醫方荊芥石膏煅存性等分上為細末每服二錢薑三片蔥白三寸和須使水一盞煎至七分食後服治丈夫婦人風虛頭疼氣虛頭疼婦人胎前産後傷風頭疼一切頭疼並皆治之茵陳揀淨五兩麻黃石膏煅存性各二兩上為末每服一錢臘茶調下食後服服畢仰臥霎時玉真丸治腎氣不足氣逆上行頭疼不可忍謂之腎厥其脈舉之則弦按之則堅硫黃二兩石膏煅通赤研半夏湯洗硝石研各一兩上為細末研勻生薑汁糊為丸如桐子大陰乾每服二十丸薑湯或米飲下更灸關元百壯良方中黃丸子亦佳虛寒甚者去石膏用鍾乳粉一兩素問云頭疼巔疾下虛上實過在足少陰巨陽甚則入腎徇蒙招尤目眩耳聾下實上虛過在足少陽厥陰甚則入肝下虛者腎虛也故腎虛則頭痛上虛者肝虛也故肝虛則頭暈徇蒙者如以物蒙其首招搖不定目眩耳聾皆暈之狀也故肝厥頭暈腎厥巔痛不同如此治肝厥鉤藤散見眩門神妙丸治頭疼及腦風食鹽硫黃各等分上為末水調生面為丸如桐子大每服十五丸用薄荷茶食前下荊芥酒亦得丹孫兆口訣治頭疼附子炮石膏煅等分為末入腦麝少許酒茶下半錢妙上硫附中加石膏之劑治頭風如神附子一枚生去皮臍用緑豆一合同煮豆熟為度去附子只吃豆立瘥每附子一枚可煮五次後末服之修真祕要本治氣虛頭疼用大附子一枚剜去心入全蠍二個在內取前附子末同鍾乳一分面少許水和裹炮熟卻研為末以焦黃為度蔥茶調下一錢或半錢又方用大附子一枚和皮臍生為末大川芎一個銼作四片以水和附子末如面劑裹川芎作四處如附子末少入少麵裹畢以針穿數孔子用真腦麝熏其穴內覺附香再捻合穴子如未覺內有香即再熏一炷細羅成灰用銚子內熱灰炮熟末之每服半錢蔥茶調下不拘時候上泗醫楊吉老二方神效上附子純熱例素帝曰人有病頭痛數歲不已此安得之名為何病岐伯曰當有所犯大寒內至骨髓髓以腦為主腦逆故令頭痛齒亦痛病名曰厥逆奇病論垣羌活附子湯治冬月大寒犯腦令人腦痛齒亦痛名曰腦風出奇病論中防風二分黃耆一錢麻黃一錢蒼朮半錢升麻二分甘草二分黑附子一分羌活半錢白芷白殭蠶黃柏各三分上㕮咀水煎去渣溫服食後若有寒嗽加佛耳草三分羅川芎神功散治風熱上攻偏正頭痛無問微甚久新並皆治之川芎一兩甘草二錢半川烏生去皮臍白芷天南星麻黃去根各半兩上為末每服三錢水二盞生薑三片煎至七分投清酒半盞和渣溫服密室避風如人行五七里再服汗出為度其病立愈救苦神白散治男子婦人偏正頭痛眉骨兩太陽穴痛及熱上攻頭目目赤不已項筋拘急耳作蟬鳴川芎甘草炙各八錢甘松去土赤芍藥白芷兩頭尖川烏頭去皮臍各六錢上為細末每服二錢溫茶調下服藥後飲熟水半盞本治一切頭疼黑龍丸天南星洗川烏各半斤黑豆拌蒸三次石膏半兩麻黃薄荷各四兩藁本白芷各二兩京墨兩半上為細末煉蜜杵丸彈子大每服一丸薄荷茶湯調下治傷寒頭疼太陽頭疼及一切頭疼川烏炮草烏各半兩麻黃川芎防風羌活各一兩半地龍去土全蠍一個雄黃三錢上為細末每服半錢食後茶清調下垣麻黃吳茱萸湯治頭痛胸中痛食減少咽嗌不利寒冷脈左寸弦急麻黃半錢吳茱萸三分黃芩二分川烏一分羌活五分細辛少許蔓荊子一分藁本柴胡黃耆各二分蒼朮一錢黃連二分半夏一分黃柏升麻各二分紅花少許當歸二分上㕮咀作一服水二大盞煎至一盞去渣稍熱服食後丹東陽陳兄露筋骨體稍長患體虛而勞頭痛甚至有訣別之言豫察其脈弦大而帶數以人參為君川芎陳皮為佐至五六日未減衆皆訝之以藥之不對也豫曰藥力有次第更少俟一二宿當自安忽其季來問曰何不少加黃耆豫不答又經一宿忽自言病頓愈豫脈之覺指下稍盛又半日病者言胸上滿不覺飢視其腹紋已隱矣豫曰藥中莫加黃耆否曰然止與三帖遂連與二陳湯加厚朴枳殼黃連以瀉其衛三帖而安血虛頭痛自魚尾上攻頭痛必用川芎當歸湯眉尖後近髮際曰魚尾大一奇散治血虛頭痛神妙即芎歸湯也方見産頭痛又方用川芎半兩為末每服二錢臘茶調下甚效曾有産後頭痛者一服即愈外治頭痛欲裂當歸一兩酒一升煮取六合飲至醉效素頭痛耳鳴九竅不利腸胃之所生也通評虛實論東垣云此氣虛頭痛也用人參黃耆主之羅氣虛頭痛治驗參謀柏仲實年六十一歲二月間患頭痛不可忍晝夜不得眠邀往視之其人云近在燕京患頭昏悶微痛醫作傷寒解之汗出後痛轉加復汗解病轉加而頭愈痛遂歸每召醫用藥雷同到今痛甚不得安臥惡風寒而不喜飲食診其脈弦細而微氣短而促懶言語內經曰春氣者病在頭今年高氣弱清氣不能上升頭面故昏悶此病本無表邪因發汗數四清陽之氣愈虧損不能上榮亦不能外固所以頭苦痛而惡風寒不喜飲食氣短弱宜升陽補氣頭痛自愈名之曰順氣和中湯黃耆錢半人參一錢白朮五分陳皮三分當歸五分芍藥五分甘草炙三分升麻三分蔓荊子二分柴胡三分川芎二分細辛二分內經曰陽氣者衛外而為固也今年高氣弱又加發汗衛外之氣愈損故黃耆甘溫補衛實表為君人參甘溫當歸辛溫補氣補血芍藥味酸收衛氣為臣白朮陳皮炙甘草苦甘溫養衛氣生髮陽氣上實皮毛腠理為佐柴胡升麻苦辛引少陽陽明之氣上升通百脈灌溉周身者也川芎蔓荊子細辛辛溫體輕浮清利空竅為使上件㕮咀作一服水二盞煎至一盞去渣溫服食後服之減半再服而愈垣調中益氣湯加川芎蔓荊子細辛治氣血俱虛頭痛方見治法門子和青黛散治頭風豬牙皂角玄胡索一分青黛少許上為細末水調豆許鼻內灌之其涎自出先仰臥灌鼻俟喉中酸味即起身涎出口咬銅錢一文任流下丹頭痛搐鼻取涎蓽茇川芎薄荷白芷細辛各等分為末入豬膽內與汁拌勻陰乾再為末用無根水為丸如緑豆大青黛為衣每一丸茶清化灌鼻中口噙銅錢三文其涎來如泉一方有玄胡索藁本青黛無薄荷細辛本治偏正頭風夾腦風並一切頭風不問年深日近剋日取效名透頂散細辛表白者三莖瓜蒂七個丁香三粒糯米七粒腦子麝香各一黑豆大上將腦麝乳鉢內研極細卻將前四味研勻另自治為末然後入乳鉢內蕩起腦麝令勻用瓦罐子盛之謹閉罐口患人隨左右搐之一大豆許良久出涎一升許則安東垣云濕熱在頭而頭痛者必以苦吐之若用上項搐鼻藥而涎少者必兼下項吐法治之聖治痰厥頭痛以烏梅十個取肉鹽二錢酒半盞合水煎至七分去渣非時溫服吐即住丹頭痛難忍支風痰所致梔子末蜜和濃塗舌上吐即止兵部集頭痛非冷非風此膈有痰也濃煎茶啜一二升探吐之吐而又吐候苦汁出乃止不損人待渴自止妙外臺祕要子和茶調散瓜蒂好茶二味等分為末每服二錢齏汁調下空心用之丹霞僧病頭痛常居暗室不敢見明其頭熱痛以布圍其巔上置冰於其中日易數次熱不能已諸醫莫識其證求見戴人戴人曰此三陽蓄熱故也乃置炭火於暖室中出汗湧吐三法並行七日方愈常仲明之子自四歲得風痰疾至十五歲轉甚每月發一二次發必頭痛痛則擊數百拳出黃緑涎一二盞方愈此年發益頻目見黑花昏不知人三四日方省諸醫皆用南星半夏化痰之藥終無一效戴人以雙解散發汗以苦劑吐痰病去八九續以分劑平調自春至秋如此數次方獲全瘥邪在胃而頭痛者必下之其證必兼隔痞或動作則痛甚或右手脈滑盛者是也治法並見脾胃條東風生於春病在頭俞在頸項全文五臟春氣者病在頭惡風為胃風河新沐中風為首風頭面多汗惡風當先風一日則病甚至其風日則少愈大川芎丸主之大川芎丸治首風旋暈弦急外合陽氣風寒相搏胃膈痰飲偏正頭疼身體拘蜷川芎一斤天麻四兩用鄆州者上為末煉蜜丸每兩作十丸每服一丸細嚼茶酒下食後服風氣循風府而上則為腦風項背怯寒腦戶極冷神聖散主之神聖散治腦風邪氣留飲不散項背怯寒頭痛不可忍者麻黃去節細辛去苗乾葛生一半炒一半藿香葉各等分上為末每服二錢煮荊芥薄荷酒調下茶亦得並治血風證又方治腦風邪氣留飲頭疼不可忍者用遠志末不以多少於鼻中搐於痛處揉之相兼前藥可用也丹頭疼連眼痛此風痰上攻須用白芷開之雨前茶川芎白芷防風臺烏細辛當歸為末湯調服世偏正頭風川芎細辛防風白芷烏頭尖全蠍梢南星薑製麝香少許為末每一字溫酒調服丹頭風方羌活三錢細辛一錢川芎二錢乾葛二錢甘草一錢半防風二錢半夏一錢上除川芎細辛二味外研為末用酒和炒曬乾入川細二味末和勻每服一錢茶清調下又方荊芥草烏尖七片防風甘草臺芎蔓荊子桔梗麻黃上為末茶調服本治頭疼面赤煩悶咽乾上膈風痰頭目暈昏百節疼痛背項拘急芎辛丸川芎防風殭蠶獨活各一兩桔梗三兩麻黃細辛白附子羌活甘草各四兩薄荷荊芥各一兩半上為細末煉蜜丸如彈子大每服一粒茶酒吞下食後垣徹清膏川芎三錢蔓荊子一錢細辛一分藁本一錢薄荷三分生甘草半錢炙甘草梢半錢上為細末食後茶清調下一錢或半錢本治頭目風荊芥穗細辛川芎等分為末飯後湯點二錢凡治頭痛皆用芎芷羌防辛等溫氣藥升散者由風木虛不能升散而土寡於畏得以壅塞而痛故用此助肝木散其壅塞也若風盛疏散太過而痛服辛散藥反甚者則宜用酸澀收而降之乃愈後乳香盞落散是也羅乳香盞落散治男子婦人偏正頭疼不可忍大有神效御米殼去蒂四兩陳皮甘草炙桔梗去蘆柴胡去苗各一兩上為細末每服二錢水一鍾入燈心十莖長四指同煎七分去渣食後溫服垣半夏白朮天麻湯治太陰痰厥頭痛眼黑頭旋噁心煩亂方見眩門東垣先生壯歲病頭痛每發時兩頰青黃眩運目不欲開懶於言語身沉體重兀兀欲吐數日方過潔古老人曰此厥陰太陰合而為病名曰風痰宜以局方玉壺丸治之少風濕藥二味可加雄黃白朮以治風濕更有水煮金花丸更灸俠溪二穴各二七壯不旬日愈是知方者體也法者用也徒知體而不知用者弊體用不失可謂上工信矣哉金花丸方見咳嗽丹徐舍人因作勞頭與目眶痛足冷身熱脈大而不甚數作勞痰治之半夏二錢川芎黃芩白朮陳皮各一錢半木通一錢甘草少許分二帖煎薑一片下保和丸三十丸羅茯苓半夏湯治風熱痰逆嘔吐或眩運頭痛半夏三個稍大者制赤茯苓一錢陳皮一錢湯洗黃芩一錢甘草一錢上用水二鍾生薑三片煎一盞分三服作一日溫服無時丹又治濕痰頭痛黃芩酒炒三錢蒼朮酒炒一兩川芎細辛各二錢甘草一錢為末擂生薑一片和勻茶清調服賈孺人脈沉有痰頭痛川芎一錢澤瀉一錢酒炒白朮一錢半酒煎下茯苓丸三十粒茯苓丸方見痰飲門聖治偏正頭疼並夾腦風連兩太陽頭痛以白殭蠶細研為末用蔥茶調服方寸匕上濕痰頭痛用半夏南星及酒朮酒芩燥其痰也風痰頭痛用風藥余者並見風頭痛條素陽明所謂客孫脈則頭痛鼻鼽腹腫者陽明並於上上者則其孫絡太陰也故頭痛鼻鼽腹腫也脈解篇孫館職學士張居易嗜酒散誕不為名利拘束忽發熱頭疼俾翰林醫官治之十日愈甚諸學士共議召孫孫至脈之曰餘人皆曰傷寒故作此疾也張學士好酒多痰食所傷也今疾非傷寒而右手脈甚數左手脈平和此必傷酒食而作頭痛宜吃食藥五七丸俟之半日進退決矣孫遂用食藥經食久膈漸寬頭痛遂減再進利膈藥遂獲安大凡陽邪頭疼經十日豈得不變發熱而狂亂故知非傷寒乃食病之過也丹胡孺人因吃冷粉與肉頭痛自汗膈痞小便赤白朮二錢半陳皮一錢半木通川芎黃芩各半錢薑水煎熟吞下草豆蔻丸阿魏丸保和丸各五十粒脈動作頭重痛熱氣潮者屬胃謂胃有酒食及痰疾之類也丹頭痛如破酒炒大黃半兩茶煎服上以酒炒大黃下頭痛蓋病在胃而頭痛者必下之方愈也如孫兆以利膈藥下張學士傷食頭痛詳見本條郭茂恂以黑龍丹下其嫂金華君産後汙血頭痛詳見産後頭痛皆下咽即安是也心煩頭痛病在膈中過在手巨陽少陰東垣清空膏之類治之全文見治虛實後法頭痛巔病下虛上實過在足少陰巨陽甚則入腎頭痛全文見治虛實法許學士謂之腎厥頭疼也用玉真丸治之東垣云此寒濕頭痛氣上而不下也玉真丸方見寒熱條運氣頭痛有四一曰火鬱於上而痛經云少陽司天之政初之氣風勝乃搖候乃大濕其病氣怫於上頭痛二之氣火反郁白埃四起其病熱鬱於上頭痛又云少陽司天火淫所勝民病頭痛發熱惡寒而瘧治以寒劑為君也二曰寒氣逐熱氣上行而痛經云歲金不及炎火乃行復則陰厥且格陽反上行頭腦戶痛延及腦頂發熱又云太陽之勝熱反上行頭項頂巔腦戶中痛目如脫又云太陽之復心痛痞滿頭痛治以熱劑為君也三曰濕邪傷腎膀胱而痛經云太陰司天濕淫所勝腰脊頭項痛時眩又云太陰在泉濕淫所勝病沖頭痛目似脫項似拔又云太陰之復頭頂痛重而掉瘈尤甚亦治以熱劑為君也四曰陽明覆氣兼非位之心病而痛經曰陽明之復咳噦煩心病在膈中頭痛治以溫劑也垣白芷散治風頭痛搐鼻石膏二錢薄荷三錢芒硝二錢鬱金一錢香白芷二錢上細末口噙水搐鼻若症在太陽加羌活二錢防風一錢紅豆二粒為末搐之川芎散搐鼻青黛二錢半蔓荊子川芎各一錢二分鬱金芒硝各一錢石膏一錢三分細辛根一錢薄荷葉二錢紅豆一粒上為末搐鼻丹瘦人搐鼻藥軟石膏朴硝各半錢腦子檀香皮荊芥薄荷葉各一錢白芷細辛各三錢羅如聖散治眼目偏痛頭風麻黃燒灰半兩盆硝二錢半麝香腦子各少許上件為細末搐之神效又方楊梅青硝石伏龍肝等分上為末搐鼻立效河瓜蒂神妙散治偏正頭目昏眩及偏正頭痛焰硝雄黃川芎薄荷葉道人頭即蒼耳子藜蘆各一分天竺黃一錢半上為細末含水鼻中搐一字神驗上六方搐鼻治頭痛屬熱者也本治八般頭風草烏尖細辛等分黃丹少許上為細末葦管搐入鼻中立效丹治卒頭上痛皂莢末吹鼻嚏則止斗門方世火筒散治頭風應驗方蚯蚓糞四錢乳香二錢麝香少許上為末用紙筒自下燒上吸煙搐鼻內神效仲頭痛摩散方大附子一枚炮食鹽等分上二味為末以方寸匕摩疹上令藥力行聖治風頭痛每天欲陰風雨先發者用桂心一兩為末以酒調如膏用敷頂上並額角治頭風餅子五倍子全蠍土狗七個上為末醋糊作如錢大餅子發時再用醋潤透貼太陽穴上炙熱貼之驗甚仍用帕子縛之啜濃茶睡覺即愈聖治時氣頭痛不止用朴硝二兩為末生油調塗於頂上經患頭風山豆根搗末油調塗之食治熱風頭痛燒杏仁令煙盡去皮尖以亂髮裹之咬於所患處齒下其痛便止世偏正頭痛風醉頭風以萆麻子九粒先用米調成膏塗茶碗底卻用火燒萆麻仁煙出以茶碗覆熏煙上候煙盡用少湯衝開服之覺額上癢是效丹頭內如蟲蛀響名天白蟻用茶子細末吹鼻中周氏方靈厥頭痛面若腫起而煩心取之足陽明太陰厥病篇下同厥頭痛頭脈痛心悲善泣視頭動脈反盛者刺盡去血後調足厥陰頭痛項胛盛者取血與厥陰厥頭痛貞貞都耕切頭重而痛瀉頭上五行行五先取手少陰後取足少陰厥陰頭痛意善忘按之不得取頭面左右動脈後取足太陰厥頭痛項先痛腰脊為應先取天柱後取足太陽經云頭目苦痛取之項中兩筋間蓋風府穴也又云足太陽脈是動則沖頭痛目如脫項似拔所生病者頭囟項痛故應頭痛取足太陽也厥頭痛頭痛甚耳前後脈湧有熱瀉出其血後取足少陽經云足少陽脈從耳後入耳中出走耳前所生病者頭痛故耳前後脈湧熱者取足太陽也真頭痛頭痛甚腦盡痛手足寒至節死不治頭痛不可取於腧者有所擊墮惡血在於內若肉傷痛未已可側刺不可遠取也頭痛不可刺者大痹為惡日作者可令少愈不可已陽迎頭痛腦滿不得息取之人迎陽迎即陽逆也又云肝氣逆頭則痛耳聾頰腫取血者是瘀血腫滿處取之也摘偏正頭風絲竹空沿皮向外透率谷風池橫針入寸半透風府合谷半寸以上穴未愈再取解溪三里中脘中脘一穴灸五十壯集正頭風百會一分灸七壯上星二分灸七壯三稜針出血亦得合谷不愈再取神庭灸七壯太陽在兩額角眉後紫脈上三稜針出血亦得醉頭風內攢竹一穴通玄同印堂一分灸五壯攢竹一分沿皮橫透魚腰三里膻中灸風門沿皮向外一寸摘頭風面腫項強不得回顧天牖五分留七呼不宜補亦不宜灸若灸之則面腫脹合當取下穴譩嘻六分留三呼瀉五吸後取天牖風池即瘥此古流注之法潔頭風後溪京骨上手足太陽玉頭痛嘔吐神庭一分印堂在兩眉中沿皮透左攢竹補三吸轉歸元穴退針沿皮透右攢竹補三吸摘風痰頭痛豐隆五分灸亦得腎厥頭痛湧泉三分彈針出血嘗治一老婦人頭痛久歲不已因視其手足有血絡皆紫黑遂用三稜針盡刺出其血如墨汁者數盞後視其受病之經灸刺之而得全愈即經所謂大痹為惡及頭痛久痹不去身視其血絡盡出其血是也甲腦風頭痛惡見風寒鼽衄鼻窒喘息不通承靈主之頭痛身熱引兩頷急一作痛腦空主之頭痛目窗天衝風池主之以上諸穴在頭部第三行也善嚏頭痛身熱頷厭主之熱病頭痛引目外眥而急煩滿汗不出引頷齒面赤皮疼懸釐主之熱病偏頭痛引目外眥懸釐主之醉酒風熱發兩角眩一云兩目痛不能飲食煩滿嘔吐率谷主之千金云此條在風篇頸額榰滿引牙齒口噤不開急痛不能言曲鬢主之以上諸穴皆在耳前也頭痛引頸竅陰主之頭風耳後痛煩心及足不收失履口喎僻頸頂搖瘈牙車急完骨主之以上諸穴皆在耳後也頭目瞳子痛不可以視俠項強急不可以顧陽白主之頭痛目眩頸項強急胸脅相引不得傾側本神主之以上諸穴皆在面部也頭痛振寒清冷淵主之頭痛項背急消濼主之頭風痛鼻鼽衄眉頭痛善嚏目如欲脫汗出寒熱面赤頰中痛項強不可左右顧目系急瘛瘲攢竹主之頭眩痛重目如脫項似拔狂見鬼目上反項直不可顧暴攣足不任身痛欲拆天柱主之風眩頭痛鼻不利時嚏清涕自出風門主之暴病頭痛身熱痛肌肉動耳聾惡風目眥爛赤項不可以顧髀樞痛泄腸澼束骨主之風眩頭痛少海主之厥頭痛面浮腫煩心狂見鬼喜笑不休發於外有所大喜喉痹不能言豐隆主之陽厥悽悽而寒少腹堅頭痛脛股腹痛消中小便不利善嘔三里主之厥頭痛面腫起商丘主之厥頭痛孔最主之頭重頂痛目不明風到腦中寒重衣不熱汗出頭中惡風刺腦戶主之頭重目瞑厥寒熱項強難以顧汗不出陶道主之頭痛如破身熱如火汗不出瘛瘲裡急腰股相引痛命門主之素寸口之脈中手短者曰頭痛平人氣象論推而下之下而不上頭項痛脈診頭痛目痛久視無所見者死久視不見見諸脈病雜法下而不上甲乙經作卒視上而不下者是病若頭痛目痛脈急短澀死未詳其義産後頭痛大一奇散治産後頭疼用當歸川芎為細末每服二錢水一盞煎七分溫服丹産婦年三十餘身熱頭痛肚痛陳皮白朮白芍各二錢黃芩二錢半川芎一錢乾薑牡丹皮甘草各一錢半荊芥半錢分四帖煎服保治産後頭痛血虛痰癖寒厥皆令頭痛加減四物湯蒼朮一兩六錢羌活川芎防風香附炒白芷各一兩石膏二兩半細辛一兩半當歸甘草各五錢上粗末每一兩水煎服無時如有汗者知氣弱頭痛也方中加芍藥三兩桂一兩半生薑煎如痰癖頭痛加半夏三兩茯苓一兩生薑煎如熱痰頭痛加白芷三兩石膏三兩知母一兩如寒厥頭痛加天麻三兩附子一兩半生薑三片煎服大芎附散治産後敗血作梗頭痛諸藥不效上大附子一枚釅醋一碗用火四畔炙透蘸醋令盡去皮臍加川芎一兩併為細末每服一錢茶清下郭茂恂嫂金華君産七日不食始言頭痛頭痛已又心痛作既而目睛痛如割如刺更作更止相去無瞬息間每頭痛甚欲取大石壓良久漸定心痛作則以十指抓壁血流滿掌痛定目復痛又以兩手自剜取之如是十日不已衆醫無計進黑龍丹半粒疾少間中夜再服下瞑目寢如平昔至平旦下一行約三升許如蝗蟲子三疾減半巳刻又行如前則頓愈矣黑龍丹方見産後血不下條偏頭風頭半邊痛者是也當與前頭痛相參用之丹偏頭風有痰者多左屬風荊芥薄荷左屬血虛川芎當歸右屬痰蒼朮半夏右屬熱黃芩羅川芎散治偏頭痛神效甘菊石膏川芎白殭蠶生各六錢上為極細末每服三錢茶清調下潔治頭痛連睛痛石膏鼠黏子炒上為末茶清食前調下垣細辛散治偏頭風細辛二分川芎七分柴胡二錢黃芩酒炒一錢生黃芩五分瓦粉二分甘草炙一錢半黃連酒炒七分芍藥半錢上㕮咀每服三錢水煎食後溫服之經治偏頭痛絶妙蓽茇為末一兩於食前用清粥飲調半錢服本治風寒客於頭中無時疼痛牽引兩目遂至失明宜白附散白附子一兩麻黃不去節川烏南星各半兩全蠍五個乾薑硃砂麝香各一分上為細末酒調一字服略睡少時效一族人患頭痛不可忍一服瘥治偏頭風豬牙皂角去皮筋香白芷白附子各等分上為末每服一錢臘茶調下右疼右邊臥左疼左邊臥皆疼仰臥食後服丹偏頭風蓽茇豬膽搐鼻中本治偏頭風用好蘿蔔自然汁一蜆殼許令患人仰臥左疼注左右疼注右或兩邊皆疼皆注之雖十年患者亦效王荊公患十二年用之立效後醫數人皆愈此禁中祕方靈頭半寒痛先取手少陽陽明後取足少陽陽明厥病篇雷頭風頭痛而起核塊者是也子和凡雷頭懶於俗呼之謬名也可用茶調散吐之次用神芎丸下之然後服烏荊丸及愈風餅子之類衰者可用涼膈散消風散熱茶調散方見上下部即二仙散是也神芎丸大黃黃芩各二兩牽牛滑石各四兩上為細末滴水為丸如小豆大溫水下十五丸每服加十丸以利為度日三服愈風餅子川烏炮半兩川芎甘菊白芷防風細辛天麻羌活荊芥薄荷甘草炙以上各一兩上為細末水浸蒸餅為劑捏作餅子每服三五餅細嚼茶酒送下不計時候涼膈散方見前寒熱條保夫治雷頭風者諸藥不效為與證不相對也蓋雷頭風者震卦主之震仰盂故豫製藥內加荷葉者象震之形其色又青乃述類象形當煎局方中升麻湯主之升麻湯治頭面疙瘩憎寒拘急發熱狀如傷寒升麻蒼朮荷葉上為細末每服五錢水一盞煎七分溫服食前後或燒全荷葉一個研細調藥服之妙子和雷頭風者是頭上有赤腫結核或如酸棗狀可用扉針出血則愈矣素雷頭風上囟百會風池大頭痛頭痛如腫大如斗是也大率多是天行時疫病垣泰和年東垣以監納濟源稅時長夏多疫癘初覺憎寒體重次傳面目腫盛目不能開上喘咽喉不利舌乾口燥俗云大頭天行親戚不相訪問如染之多不救張縣丞亦得此證至五六日醫以承氣湯加藍根下之稍緩翌日其病如故下之又緩終莫能愈漸至危篤或曰李明之存心於醫可以請治遂命診視具説其由曰夫身半以上天之氣也身半以下地之氣也此雖邪熱客於心肺之間上攻頭而為腫盛以承氣下之瀉胃中之實熱是誅罰無過殊不知適其病所為故遂處方用黃連黃芩味苦寒瀉心肺間熱以為君橘紅玄參苦寒生甘草甘寒瀉火補氣以為臣連翹鼠黏子薄荷葉苦辛平板藍根味甘寒馬屁勃白殭蠶味苦平散腫消毒定喘以為佐新升麻柴胡苦平行少陽陽明二經不得伸桔梗味辛溫為舟楫不令下行共為細末用湯調時時服之拌蜜為丸噙化之服盡良愈因嘆曰往者不可追來者尤可及凡他所有是病者皆書方以帖之全治甚衆普濟消毒飲子黃芩黃連各半兩人參三錢橘紅玄參甘草生各二錢連翹鼠黏子板藍根馬屁勃各一錢白殭蠶炒七分升麻七分柴胡桔梗各二錢上為細末服如前法或加防風薄荷川芎當歸身㕮咀如麻豆大每服五錢水煎去渣熱服之食後時時服之如大便硬加酒煨大黃一錢或二錢以利之腫熱甚者宜砭刺之海大頭病者雖在身半以上熱伏於經以感天地四時非節瘟疫之氣所著以成此疾至於潰裂膿出而又染他人所以謂之疫癘也大抵足陽明邪熱太甚實資少陽相火為之熾多在少陽或在陽明甚則逆傳視其腫勢在何部分隨其經而取之濕熱為腫木盛為痛此邪發於首多在兩耳前後所先見出者為主為根治之宜早藥不宜速恐過其病所謂上熱未除中寒已作有傷人命矣此疾是自外而之內者是為血病況頭部分受邪見於無形之處至高之分當先緩而後急先緩者謂邪氣在上著無形之部分既著無形所傳無定若用重劑大瀉之則其邪不去反過其病矣雖用緩藥若又急服之或食前或頓服咸失緩體則藥不能除病矣當徐徐漬無形之邪或藥性味形體據象服餌皆須不離緩體及寒藥或酒炒浸之類皆是也後急者謂前緩劑已經高分瀉邪氣入於中是到陰部染於有形質之所若不速去反損陰也此卻為客邪當急去之是治客以急也且治主當緩者謂陽邪在上陰邪在下各為本家病也若急治之不惟不能解其紛而反致其亂矣此所以治主當緩也治客當急者謂陽分受陽邪陰分受陰邪主也陰分受陽邪陽分受陰邪客也凡所謂客者當急去之此治急以客也假令少陽陽明之為病少陽為邪者出於耳前後也陽明者首面大腫也先以黃芩黃連甘草通炒過銼煎少少不住服呷之或服畢再用大黃或酒浸或煨又以鼠黏子新瓦上炒香㕮咀煎去渣納芒硝各等分亦細細呷之當食後用徐得微利及邪氣已只服前藥如不已再服後藥依前次第用之取大便利邪已即止如陽明渴者加石膏少陽渴者加栝蔞根湯陽明行經加升麻葛根芍藥之類太陽行經加羌活防風荊芥之類選而加之並與上藥均合不可獨用散也潔黑白散治大頭病如神烏黑蛇酒浸白花蛇去頭尾酒浸雄黃二錢大黃煨半兩上為極細末每服一二錢白湯調無時海疫毒頭腫者甘桔湯加鼠黏子大黃芒硝丹大頭天行病羌活酒芩酒蒸大黃素巨陽之厥則腫首頭重全文見厥山大頭風用井底泥調大黃芒硝塗之此方若在表者忌之在裡者宜之運氣大頭病皆屬火蓋經所謂上腫者即其屬也經云少陽司天之政風熱參布太陰橫流寒乃時至民病上怫腫色變又云少陰司天之政熱病生於上清病生於下民病嗌乾腫上終之氣燥令行餘火內格腫於上咳喘其治方東垣普濟消毒飲子得之矣眉痛丹眉痛屬風熱與痰作風痰治類頭風用白芷酒黃芩末酒調下又方川烏草烏二味為君童便浸炒細辛羌活黃芩甘草各等分為佐垣選奇湯眉骨痛不可忍防風羌活各三錢酒黃芩一錢冬不用如能食熱痛者加之甘草三錢夏生冬炙用上㕮咀每服三錢水煎稍熱服食後時時撮要摘英眉攢內痛解溪玉眉間痛攢竹瀉出血沿皮透魚腹頭維一分沿皮斜向下透懸顱選而用之不必盡取眉稜骨痛攢竹合谷神庭頭重垣紅豆散治頭重如山此濕氣在頭也麻黃根炒半錢苦丁香半錢紅豆十粒羌活燒連翹各三錢上五味為細末鼻內搐之又方羌活根燒連翹各三錢紅豆半錢上為末搐鼻督脈之別名曰長強挾膂上項散頭上下當肩胛左右別走太陽虛則頭重高搖之挾脊之有過者取之所別也全文見針灸長強穴在脊骶即尾骨端也撮頭重如石印堂一分沿皮透攢竹先左後右彈針出血頭風屑羅肝經風盛木自搖動尚書云滿招損老子云物壯則老故木凌脾土金來克之是子來為母復仇也使梳頭有屑皮見肺之證也謂肺主皮毛大便實瀉青丸主之虛則消風散主之瀉青丸方見治虛實法消風散治諸風上攻頭目昏痛項背拘急肢體煩痛肌肉蠕動目眩旋運耳簫蟬鳴眼澀好睡鼻塞多嚏皮膚頑麻燥癢癮疹又治婦人血風頭皮腫癢眉骨疼旋欲倒痰逆噁心芎藭羌活人參茯苓去皮白殭蠶藿香去土荊芥甘草炒蟬殼去土各二兩厚朴去皮薑製陳皮去白各半兩防風上為細末每服二錢茶清調下如久病偏頭風每日三服便覺輕減如脫著沐浴暴感風寒頭痛身重寒熱倦疼用荊芥茶清調下半盞不拘服之小兒虛風目澀昏倦及急慢驚風用乳香荊芥湯調下亦得丹頭癢風屑發黃用酒炒大黃茶調服海萬病紫菀丸治頭多白屑每服三丸至五七丸薑湯下方見積塊條本治風屑極燥癢無時此乃氣虛風邪侵於皮表而生用藜蘆不拘多少為末先洗頭須避風候未至十分乾時用末糝之須用入發至皮方得緊縛之兩日夜次日即不燥癢如尚有些少可再用一次立效禹錫按陳藏器云鹽麩子主頭風白屑效俗名麩鹽桃其末結五倍子經患頭上白屑極多山豆根油浸塗以孩兒乳汁調塗效本又方白芷零陵香各等分上為末如前法用之候三五日篦去敷三二次終始不生多臥不得臥靈黃帝曰病而不得眠者何氣使然岐伯曰衛氣不得入於陰常留於陽留於陽則陽氣滿陽氣滿則陽蹺盛不得入於陰則陰氣虛故目不瞑矣又曰病目不得視者何氣使然岐伯曰衛氣留於陰不得行於陽留於陰則陰氣盛陰氣盛則陰蹺滿不得入於陽則陽氣虛故目閉也大惑論足太陽有通項入於腦者正屬目本名曰眼系頭目苦痛取之在項中兩筋間入腦乃別陰蹺陽蹺陰陽相交陽入陰陰出陽交於目鋭眥以蹺脈考之當作目內眥陽氣盛則瞋目陰氣盛則瞑目寒熱論帝問曰夫邪氣之客人也或令人目不瞑不臥出者何氣使然伯高曰衛氣者晝日行於陽夜行於陰常從足少陰之分間行於五臟六腑今厥氣客於五臟六腑則衛氣獨衛其外行於陽不得入於陰行於陽則陽氣盛陽氣盛則陽蹺陷陷當作滿不得入於陰陰氣虛故目不瞑黃帝曰治之奈何伯高曰補其不足瀉其有餘調其虛實以通其道而去其邪飲以半夏湯一劑陰陽已通其臥立至黃帝曰善此所謂決瀆壅塞經絡大通陰陽和得者也願聞其方伯高曰其湯方以流水千里以外者八升揚之萬遍取其清五升煮之炊以葦薪火沸置秫米一升治半夏五合徐炊令竭為一升半去其渣飲汁一小杯日三稍益以知為度故其病新發者覆杯則臥汗出則已矣久者三飲而已也邪客篇按本草秫米即所謂糯米是也黃帝曰人之多臥者何氣使然岐伯曰此人腸胃大而皮膚濕而分肉不解焉腸胃大則衛氣留久皮膚濕則分肉不解其行遲夫衛氣者晝常行於陽夜行於陰故陽氣盡則寐陰氣盡則寤故腸胃大則衛氣行留久皮膚濕分肉不解則行遲留於陰也久其氣不清則目瞑故多臥矣其腸胃小皮膚滑以緩分肉解則衛氣之留於陽也久故少瞑焉黃帝曰其非常經也卒然多臥者何氣使然岐伯曰邪氣留於上焦上焦閉而不通已食若飲湯衛氣留久於陰而不行故卒然多臥焉大惑篇海膽虛不眠寒也酸棗仁炒竹葉湯調服聖惠方膽實多睡熱也酸棗仁生用末茶薑汁調服濟衆方一法酸棗仁一兩生用臘茶二兩以生薑汁塗炙微焦搗羅為末每服二錢水七分盞煎六分溫服無時不得臥仲虛勞虛煩不得眠酸棗湯主之酸棗仁二升甘草一兩知母茯苓芎藭各二兩一方加生薑二兩上以水八升煮酸棗仁得六升納諸藥煮取三升分溫三服本治膽虛不得眠四肢無力鱉甲丸鱉甲酸棗仁羌活牛膝黃耆人參五味子各等分上為細末煉蜜杵為丸如桐子大每服三四十丸溫酒送下聖治骨蒸勞煩心不得眠用酸棗仁一兩水一大盞半研絞取汁下米二合煮粥候熟下地黃汁一合更煮過不計時服之素帝曰人有臥而有所不安者何也岐伯曰藏有所傷及精有所寄之則安故人不能懸其病也精有所寄之則安太素作精有所倚則臥不安是也海胡洽治振悸不得眠人參白朮茯苓甘草生薑酸棗仁六物煮服本真珠母丸治肝經因虛內受風邪臥則寬散而不收狀若驚悸珠母三分研細用碾當歸熟地各一兩半人參酸棗仁柏子仁犀角茯苓各一兩沉香龍齒各半錢上為細末煉蜜為丸如桐子大辰砂為衣每服四五十丸金銀薄荷湯下日午後臥服獨活湯獨活羌活人參前胡細辛半夏五味子沙參白茯苓酸棗仁甘草各一兩上為粗末每服四大錢水一盞半薑三片烏梅半個同煎至七分去渣不拘時候紹興癸丑豫待次四明有董生者患神氣不寧每臥則魂飛揚覺身在床而神魂離體驚悸多魘通夕無寐更醫不效豫為診視詢之曰醫作何病治董曰衆皆以為心病豫曰以脈言之肝經受邪非心病也肝氣因虛邪氣襲之肝藏魂者也遊魂為變平人肝不受邪臥則魂歸於肝神靜而得寐今肝有邪魂不得歸是以臥則魂飛揚若離體也肝主怒故小怒則劇董欣然曰前此未之聞雖未服藥已覺沉疴去體矣願求治之豫曰公且持此説與衆醫議所治之方而徐質之閲旬日復至云醫遍議古今方無與病相對者故豫處此二方以贈服一月而病悉除此方用真珠母為君龍齒佐之真珠母入肝經為第一龍齒與肝同類也龍齒虎睛今人例以為鎮心藥殊不知龍齒安魂虎睛定魄各言其類也蓋東方蒼龍木也屬肝而藏魂西方白虎金也屬肺而藏魄龍能變化故魂遊而不定虎能專靜故魄止而有守豫謂治魄不寧者宜以虎睛治魂飛揚者宜以龍齒萬物有成理而不失在夫人達之而已垣羌活勝濕湯加柴胡治臥而多驚邪在少陽厥陰也方見腰痛諸水病者故不得臥臥則驚驚則咳甚也全文見水腫內經半夏湯治不得臥乃去飲之劑也方見前陰陽條無溫膽湯治大病後虛煩不得眠兼治驚悸方見驚悸丹煩不得眠六乙散加牛黃服之即益元散子和一富家婦人傷思慮過甚二年不得寐無藥可療其夫求戴人治之戴人曰兩手脈俱緩此脾受邪也脾主思故也乃與其夫議以怒激之多取其財飲酒數日不處一法而去其婦大怒汗出是夜困眠如此者八九日不寤自是食進其脈得平此因膽虛不能制脾之思慮而不寐今激之怒膽復製脾故得寐也素陽明者胃脈也胃者六腑之海其氣亦下行陽明逆不得從其道故不得臥也下經曰胃不和則臥不安此之謂也逆調論喘不得臥以喘法治之厥不得臥以腳氣法求之素帝曰人之不能偃臥者何也岐伯曰肺者藏之蓋也肺氣盛則肺大肺大則不得偃臥撮膽寒不得臥竅陰一分補之灸甲驚不得眠善齘水氣上下五臟遊氣也陰交主之不得臥浮郤主之多臥子和陳州長史一小兒病寐而不寤三日諸醫作睡驚治之或欲以艾火灸之或以大驚丸及水銀餅子治之其父曰此子平日無疾何驟有驚乎以子之病問戴人戴人診其兩手脈皆平和戴人曰若驚風之脈當洪大而強今則平和非驚風也戴人竊問其乳母爾三日前曾飲酒醉否蘧然笑曰夫人以煮酒見餉酒味甚美三飲一罌而睡夫陳酒味甘而戀膈酒氣滿乳兒亦醉也乃銼甘草乾葛葛花縮砂仁貫衆煎汁啜之立醒運氣多睡皆屬內熱經云陽明司天之政初之氣陰始凝氣始肅病中熱善眠是也怪穴困睡多無名指第二節尖灸一壯屈手指取之咽喉經云一陰一陽結謂之喉痹又云肝者中之將也取決於膽咽為之使故以喉咽入肝膽部素喉主天氣咽主地氣太陽陽明論地氣通於嗌全文見五臟咽喉下接連胸中肺葉之間嗌即咽之低處也咽即嗌之高處也咽喉者水穀之道也喉嚨者氣之所以上下者也會厭者音聲之戶也懸壅者音聲之關也全文見喑子和咽與喉會厭與舌此四者同在一門而其用各異喉以納氣故喉氣通於天咽以納食故咽氣通於地會厭管乎其上以司開闢掩其喉則其食下不掩之其喉錯必舌抵上齶則會厭能閉其喉矣四者交相為用闕一則飲食廢而死矣喉痹凡經云喉痹者謂喉中呼吸不通言語不出而天氣閉塞也云咽痛云嗌痛者謂咽喉不能納唾與食而地氣閉塞也云喉痹咽嗌痛者謂咽喉俱病天地之氣並閉塞也蓋病喉痹者必兼咽嗌痛病咽嗌痛者不能兼喉痹也今以喉咽俱病諸方併入喉痹門中喉痹惡寒及寸脈小弱於關尺者皆為表證宜甘桔湯半夏桂枝甘草湯詳寒熱發散之若水漿不得入口者用解毒雄黃丸四五粒以極酸醋磨化灌入口內吐出濃痰卻服之間以生薑自然汁一蜆殼噙下之神效按喉痹惡寒者皆是寒折熱寒閉於外熱鬱於內薑汁散其外寒則內熱得伸而愈矣切忌膽礬酸寒等劑點喉反使其陽鬱結不伸又忌硝黃等寒劑下之反使其陽下陷入里則禍不旋踵矣韓祇和云寸脈弱小於關者宜消陰助陽垣云兩寸脈不足乃陽氣不足故用表藥提其氣升以助陽也或三部俱小弱亦可用其法也喉痹鄉村病皆相似者屬天行運氣之邪治必先表散之亦大忌酸藥點之寒藥下之郁其邪於內不得出也其病有二其一屬火經云少陽所至為喉痹又云少陽司天之政三之氣炎暑至民病喉痹治宜仲景桔梗湯或面赤斑者屬陽毒宜陽毒諸方汗之其二屬濕經云太陰之勝火氣內郁喉痹又云太陰在泉濕淫所勝病嗌腫喉痹治宜活人半夏桂枝甘草湯或面青黑者屬陰毒宜陰毒諸方汗之仲桔梗湯治傷寒客熱咽痛方見傷寒咽痛海藏治咽痛甘桔湯加鼠黏子竹茹妙無荊芥湯治咽喉腫痛語聲不出咽之痛甚荊芥半兩桔梗二兩甘草一兩上銼散每服四錢水一盞薑三片煎六分去渣溫服活半夏桂枝甘草湯治暴寒中人咽痛方見傷寒咽痛無治卒喉痹不得語小續命湯加杏仁七個煎甚妙續命湯方見中風門和五香散治喉咽腫痛毒氣結塞不通木香沉香雞舌香薰陸香各一兩麝香另研三錢上為末入麝香研勻每二錢水一盞煎服不拘時本治中風急喉痹欲死者白殭蠶搗篩為末生薑自然汁調下喉立愈丹溪云殭蠶屬火而有土與木老得金氣而僵治喉痹者取其火中清化之氣以從治相火散濁逆結滯之疾陳附子去皮炮令坼以蜜塗上炙之令蜜入內含之勿咽其汁主喉痹和如聖勝金錠治咽喉急閉腮頷腫痛並單蛾結喉重舌木舌硫黃細研一兩半川芎一兩臘茶薄荷去根梗各半兩貫衆二兩硝石研四兩荊芥二兩上為末生蔥汁搜和為錠每服先用新汲水灌漱次嚼生薄荷五七葉卻用藥一錠同嚼極爛井水咽下甚者連進三服並以一錠安患處其病隨藥便消羅徵南帥不鄰吉歹病咽痛下利方見表熱裡寒門洪武戊辰春鄉村病喉痹者甚衆蓋前年終之氣及當年初之氣二火之邪也豫纍用甘桔湯加黃連半夏殭蠶鼠黏子根等劑發之挾虛者加參耆歸輩水漿不入者先用解毒雄黃丸醋磨化之灌喉痰出更用生薑汁灌之卻用上項藥無不神驗若用膽礬等酸寒點過者皆不治蓋邪郁不出故也羅解毒雄黃丸治纏喉風及急喉閉卒然倒僕牙關緊急雄黃鬱金各一分巴豆去皮油十四個上為細末醋糊為丸緑豆大茶清下七丸吐出頑痰立蘇未吐再服如至死者心頭猶熱灌藥不下斡口開灌之下咽無有不治如小兒驚熱痰涎壅塞或二丸三丸量小大加減一法用雄黃丸三粒醋磨化灌之尤妙其痰立出即瘥大治纏喉風雄黃一塊新汲水磨急灌吐瘥丹纏喉風屬熱痰宜用鵝翎蘸桐油探吐之又法用射干逆流水吐之世遠志去心為末每半錢水小半盞調服口含竹管吐痰涎極捷治喉痹如神烏犀角膏治咽喉腫痛及一切結喉爛喉遁尸纏喉痹喉急喉飛絲入喉重舌木舌等證皂莢兩條子捶碎用水三升浸一時久挪汁去渣入瓦器內熬成膏好酒一合焰硝百草霜研一錢同皂角膏攪勻令稠人參一錢為末硼砂白霜梅各少許並研入膏中上拌和前藥用鵝毛點少許於喉中以出盡頑涎為度卻嚼甘草二寸咽汁吞津若木舌先以粗布蘸水揩舌冷次用生薑片擦之然後用藥山纏喉風皂角揉水灌下得吐愈鬥治纏喉風喉痹飲食不通欲死者用反魂草根一莖淨洗納入喉中取寒痰出即瘥神驗更以馬牙硝津咽之即絶根反魂草一名紫菀世治咽痛用土烏藥即矮樟根以醋兩盞煎一盞先噙後咽吐出痰涎為愈杜治纏喉風束氣不通用蛇蛻炙黃當歸等分為末溫酒調下一錢匕得吐愈羅備急如聖散治時氣纏喉風漸入咽塞水穀不下牙關緊急不省人事雄黃細研藜蘆生用白礬飛豬牙皂角去皮炙黃上等分為細末每用一豆大鼻內搐之立效世一字散治喉閉氣塞不通飲食不下雄黃另研一分蠍梢七枚白礬生研藜蘆各一錢豬牙皂角七錠上為末每用一字吹入鼻中即時吐出頑涎為愈治喉咽痛牙關緊急用巴豆去殼以紙壓出巴豆油在紙上以此紙作捻子點火吹滅以煙燻入鼻中即時口鼻涎流牙關開矣喉痹不惡寒者及寸脈大滑實於關尺者皆屬下證宜硝石青黛等寒藥降之或白礬等酸劑收之也韓祗和云寸脈大於關尺者宜消陽助陰東垣云兩寸脈實為陰盛陽虛下之則愈故豫每用此法治急喉痹如鼓應桴或三部俱實亦可用其法也無玉鑰匙治風熱喉痹及纏喉風焰硝一兩半硼砂半兩腦子一字白殭蠶一分上為末以竹管吹半錢入喉中立愈世治喉痹咽痛用蒲黃甘草青黛芒硝等分為末時時咽豆許神效外療喉痹神驗朴硝一兩細細含咽汁立愈無玉屑無憂散治纏喉風咽喉疼痛語聲不出咽物有礙或風涎壅滯口舌生瘡大人酒癥小兒奶癖或誤吞骨屑哽塞不下玄參貫衆滑石砂仁黃連甘草茯苓山豆根荊芥各半兩寒水石煅硼砂各三錢上為末每服一錢先抄入口以清水咽下此藥除三尸去八邪闢瘟療渴丹治喉痹呼吸不通須臾欲絶絡石草二兩水升半煎取二盞去渣細細呷之立通外臺祕要本草云絡石味苦溫微寒無毒主風熱治喉痹白瑞香花根寸許研細調灌之妙白瑞香藥性未詳葛卒喉痹取黃柏片含之又黃柏一斤㕮咀酒一斗煮二沸去渣恣飲便愈世喉痹水穀不下蘿蔔汁咽之甚佳蘿蔔下氣甚速丹又方李實根一片噙口內佳治風熱痰喉痹先以千緡湯次以四物湯加黃柏知母養陰則火降矣靈苑治急喉閉逡巡不救者蠡魚膽臘月收陰乾為末每用少許點患處藥至即瘥病深則水調灌之丹用李實根研水敷頂上一遭治喉痹卒不語羊蹄獨根者勿見風日及婦人雞犬以三年醋研和如泥生布拭喉令赤敷之千金方又方焰硝枯礬各五分硼砂一錢杜牛膝調敷上降之之劑羅開關散治喉風氣息不通白殭蠶炒一兩枯白礬各等分上為細末每服三錢生薑蜜水調下細細服之本治纏喉風用白礬末半錢烏雞子清一個二味調勻灌入喉中立效如神此方活人不計數幸毋忽山喉閉用枯礬末吹納喉中急用燈盞底油腳灌下世治喉痹馬屁勃白礬等分為細末以鵝翎吹入喉中吐痰二升愈馬屁勃味辛平治喉閉一握金一握燒灰拌白礬末炒青色為度用箸三四根壓下舌看喉中端的吹入患處妙此藥一名八角荷一名山荷葉如川芎樣生深山詩云一葉一枝花深山是我家硫黃怕我死水銀化成砂無神效散荊芥萆麻肉等分為末蜜丸皂子大綿裹含化治喉痹語聲不出者佳丹又方豬牙皂角和霜梅為末噙之世治喉痹咽腫手足不和惡寒者用鴨嘴膽礬末以箸蘸藥點患處藥至即瘥神效上收之之劑海治喉痹取蠐螬蟲汁點在喉中下咽即開崔治喉痹壅塞不通取紅藍花搗絞取汁一小升服之以瘥為度如冬月無濕花可浸乾者濃絞取汁如前服之極驗咽喉塞服之皆瘥丹又方用茜草一兩煎服降血中之火世治咽腫杜牛膝搗自然汁和醋服之本草云杜牛膝主血結及血塊無馬鞭草散治患喉痹咽腫連頰吐氣數者馬鞭草本草云馬鞭草味辛涼破血主癥癖血瘕通月經上搗自然汁每服咽一合許又一法用馬銜鐵煮汁服亦妙丹治喉痹射干切一片含咽汁外臺祕要本草云射干破血消癥治療老血在心脾間味辛涼微溫有毒孫押班都知潘元從喉閉急召孫至於夾袋中取藥末半匕吹入喉中少頃潘吐出膿血立愈翌日潘詣孫謝曰火急之難非明公不能救救人之急非藥不能療贈金一百兩願求方以濟非常之急孫以其方授之用豬牙皂角白礬黃連等分細銼新瓦上焙乾為末每用半錢吹入喉中因曰神方無價安用以利易哉遂不受所贈急喉痹其聲如鼾有如痰在喉間者此為肺絶之候速宜參膏救之用薑汁竹瀝放開服如未得參膏或先煎獨參湯救之服早者十全七八次則十全四五遲則十不全一也素一陰一陽結謂之喉痹陰陽別論海治喉閉逡巡不救方皂莢去皮弦子生半兩為細末以箸頭點少許在腫痛處更以醋糊調藥末厚塗項上須臾便破血出立瘥丹溪以雞毛蘸敷腫處尤妙又用遠志去心水調敷項上一遭丹治喉痹青艾和莖葉一握用醋同杵敷痹處冬月用乾者李亞方一法用青艾汁灌下山喉閉用蛇床子燒煙熏入喉中愈本喉中卒被毒氣攻痛者切商陸根炙熱隔布尉之冷輒易立愈丹有人患纏喉風食不能下大麥面作稀糊咽之滑膩容易下咽以助胃氣衍義云以此代粥食也若能食者不必用此山挫喉氣不通者以冷水徐灌之內經刺灸喉痹法有四今以經脈所過咽喉取之驗者及他病相干而致喉痹取之者通六經也其一取手足陽明經云喉痹不能言取足陽明能言取手陽明又云胃足陽明脈從大迎前下人迎附循喉嚨所生病者頸腫喉痹視盛虛熱寒陷下取之又云足陽明之別名曰豐隆去踝八寸別走太陰其病氣逆則喉痹卒喑取之所別也又曰大腸手陽明脈所生病者喉痹視盛虛熱寒陷下取之也其二取手少陽經云三焦手少陽之脈出缺盆上項系耳後是動則病嗌腫喉痹視盛虛熱寒陷下取之又曰邪客手少陽之絡令人喉痹刺手中指次指爪甲上去端如韭葉各一痏壯者立已老者頃已左取右右取左是也其三以經絡所過喉咽者有二經云肝足厥陰之脈循喉嚨之後故喉之後疼者取之纍驗也又云腎足少陰之脈上貫肝鬲循喉嚨竇漢卿所謂必準者照海治喉中之閉塞是也其四他病相干致喉痹者有一經云心咳之狀喉中介介如梗狀甚則咽腫喉痹取心之俞蓋大陵穴是也孫文潞公一日喉腫翰林咽喉科治之經三日愈甚上召孫治之孫曰病得相公書判筆一管去筆頭水霑筆管點藥入喉便愈孫隨手便刺相公昏僕不省人事左右皆驚愕流汗孫乃笑曰非我不能救相公須臾嘔出膿血升余旬日乃平復如故見上上喜曰孫召良醫甚有手段豫嘗治一男子喉痹於太溪穴刺出黑血半盞而愈由是言之喉痹以惡血不散故也凡治此疾暴者必先發散發散不愈次取痰取痰不愈次去汙血也摘治喉痹豐隆湧泉關衝甚者以小三稜針藏筆鋒中詐言點藥於喉痹上乃刺出紫血頓下立愈撮喉痹乳蛾少商針入一分臥針向後三分照海太衝潔喉閉不通少商隱白少衝湧泉摘喉痹頷腫如升水粒不下少商出血手大指背頭節三稜折刺三針出血陽谷三分甲喉痹完骨及天容氣舍天鼎尺澤合谷商陽陽溪中渚前谷商丘然谷陽交悉主之喉痹胸中暴逆先取衝脈後取三里雲門皆瀉之脈喉痹刺少陰少陰在手腕當小指掌後動脈是也針入三分補之甲喉痹咽如梗三間主之喉痹不能言溫溜曲池主之喉痹氣逆口喎咽喉如扼狀行間主之喉痹咽腫水漿不下璇璣主之喉痹食不下鳩尾主之白色粗理者肺大肺大則多飲善病喉痹全文見診心脈大甚為喉吤全文見治虛實法咽嗌痛咽嗌不能納唾與食是也形苦志苦病生於咽嗌治之以百藥全文見治法丹咽痛必用荊芥陰虛火炎上者必用玄參氣虛人參加竹瀝血虛四物加竹瀝咽痛有陰氣大虛陽氣飛越痰結在上遂成咽痛脈必浮大重取必澀去死為近宜補陰陽人參一味濃煎湯細細飲之此證皆是勞嗽日久者有之如用實喉痹條下諸方非徒無益而反害之咽瘡多虛火遊行無制客於咽喉宜用人參蜜炙黃柏荊芥治之潤喉散治氣鬱夜熱咽乾梗塞用桔梗二錢半粉草紫河車香附各三錢百藥煎一錢半上為細末敷口內咽喉生瘡損了不用生薑用之辛辣痛又能散不收咽痛實熱者黃連荊芥薄荷蜜薑汁調噙咽中瘡腫萆麻子一粒去皮朴硝一錢同研新汲水作一服連進二三服效丹溪云萆麻子屬金性善收能遣毒腫又似屬水當是外科要藥羅龍麝聚聖丹治心脾客熱毒氣攻衝咽喉赤腫頭痛或成喉痹或結硬不消愈而復發經久不瘥或舌本腫脹滿口生瘡飲食難咽並宜服之川芎一兩生地犀角屑羚羊角琥珀研各五錢馬牙硝研三錢硼砂研一兩人參赤茯苓各三錢玄參桔梗升麻鉛白霜研連翹各五錢硃砂水飛二錢牛黃研二錢麝香研三錢腦子研三錢金箔為衣上為細末煉蜜為丸每兩作十丸用金箔為衣每服一丸薄荷水化下或細嚼或噙化如無薄荷新水亦可臨臥用之祛毒牛黃膏治大人小兒咽喉腫痛舌本強硬滿口生瘡涎潮喘急飲食難進咽膈不利牛黃研三錢半人參琥珀犀角取細末桔梗生地硼砂各半兩雄黃一兩玄參升麻各三錢蛤粉水飛四兩寒水石煅二兩硃砂飛研七錢鉛白霜腦子各一錢金箔為衣上為細末煉蜜丸如小彈子大金箔為衣用磁石器內收貯每服一丸濃煎薄荷湯化下或新汲水服亦得日進二三服噙化亦得咽喉備急丹青黛芒硝白殭蠶各一兩甘草四兩上為細末用臘月內牛膽有黃者盛藥其中蔭四十九日多時為妙經患喉痛含山豆根一片細咽津極妙丹咽痛硼砂或和膽礬白殭蠶白霜梅和噙又方百藥煎去黑皮硼砂甘草生白礬等分為細末每服一錢食後米飲調細細咽下肘咽喉卒腫食飲不通黃柏搗敷腫上冷復易之用苦酒和末佳丹婦人患咽疼用桔梗一兩生甘草半兩分三帖水二碗煎取一小盞稍熱飲之先與蚤休末細咽之蚤休末即金線重樓是也羅增損如聖湯治風熱攻衝會厭語聲不出咽喉妨悶腫痛並治之桔梗二兩甘草炙一兩半枳殼湯浸去穰防風各半兩上件為細末每服三錢水一大盞煎至七分去渣入酥如棗許攪勻食後溫服本治虛煩上壅脾肺有熱咽喉生瘡利膈湯雞蘇葉荊芥防風桔梗人參牛蒡子隔紙炒甘草各一兩上為細末每服一錢沸湯點服如咽痛口瘡甚者加殭蠶一兩垣桔梗湯治咽腫微覺痛聲破季冬合之麻黃不去節半錢桔梗一錢黃芩三錢甘草一錢白殭蠶三錢馬屁勃一兩桂枝少許歸身三分上㕮咀水二盞煎去渣稍熱服食後可徐徐呷之羅發聲散治咽痛妨悶咽物則微痛不宜寒涼藥過泄之此妨悶虛熱也栝蔞一個白殭蠶微炒半兩桔梗七錢半甘草炒二錢上為細末每用少許干糝咽喉中若腫痛左右有紅或只一壁紅紫長大水米難下用此散一錢朴硝一錢和勻糝喉中咽津如喉中生赤腫或有小白頭瘡用前散一錢匕白礬細研半錢干糝丹薑汁調殭蠶末治咽痛神效詳見喉痹無蜜附子治感寒咽門閉不能咽大附子一枚生去皮臍切作大片蜜塗炙令黃含咽津甘味盡更以附子片塗蜜炙用之丹治咽痛用諸藥不效者此非咽痛乃是鼻中生一條紅線如發懸一黑泡大如櫻珠垂挂到咽門而止口中飲食不入須用深取牛膝根直而獨條者洗淨入好醋三五滴同研細就鼻孔滴二三點入去則絲斷珠破其病立安素肝者中之將也取決於膽咽為之使奇病論世咽痛用倒摘刺根淨洗入好酒醋同研滴在喉中耳若癢即安範汪方治喉中腫痛不得飲食燒筆頭灰漿水飲下方寸匕廣主咽喉塞鼻中瘡出及乾嘔頭痛食不下生雞子一個開頭取白去黃著米酢煨拌煻火頓沸起擎下沸定須頓三度就熱飲酢盡不過一二次瘥運氣咽喉嗌痛皆屬寒經云太陽在泉寒淫所勝民病嗌痛頷腫是也內經灸刺咽喉有二其一取足少陰經云腎足少陰之脈所生病者咽腫上氣嗌乾痛又云嗌中腫不能納唾時不能出唾者刺然骨之前出血立已左刺右右刺左又云邪客足少陰之絡令人嗌痛不可納食無故善怒氣上走賁上林億云賁膈也謂氣上走膈上也刺足下中央之脈各三痏凡六刺立已左刺右右刺左是也其二取手太陽經云小腸手太陽之脈是動則病嗌痛頷腫視虛實寒熱陷下取之也甲咽中痛不可納食湧泉主之咽腫難言天柱主之喉痛喑不能言天突主之乳蛾竹咽喉乳蛾方雄黃鬱金各五錢白礬生用二錢半膽礬五分上為細末以竹管吹入喉中立能言語粉香散吹乳蛾即開白礬三錢巴豆三粒去皮油輕粉麝香各少許上於鐵器上飛白礬沸入巴豆在礬上枯去不用巴豆為細末三味和合吹喉中孫治懸癰垂長咽中妨悶白礬一兩燒灰鹽花一兩二味細研以箸頭點藥在上竹羅青散治單雙乳蛾蒲黃五錢羅青盆硝研各三錢甘草二錢上為細末每服一錢冷蜜水調細細咽之吞不下雞翎蘸藥喉內掃之立效本玄參散治懸癰痛不下食玄參一兩升麻射干大黃各半兩甘草上為細末用水煎至七分放溫時時含咽良驗無乾薑散治懸癰熱卒暴腫大乾薑半夏湯洗去滑等分上為細末以少許著舌上咽津世乳蛾用杜牛膝根紅者研調男用女乳汁女用男乳汁納鼻吸之丹治喉中卒生肉綿裹箸頭蘸鹽揩一日六七次易之孫真人方咽中介介如梗狀仲婦人咽中如有炙臠半夏厚朴湯主之半夏一升厚朴三兩茯苓生薑各四兩蘇葉二兩上五味以水七升煮取四升分溫四服日三夜一丹痰結核在咽此濕痰必用痰藥中咸能軟堅之味栝蔞實青黛杏仁海蛤粉桔梗連翹風化硝上為末薑蜜丸噙化內經灸刺咽嗌介介如梗狀有二其一取陽陵泉經云膽病者善太息口苦嘔宿汁嗌中介介然數唾取陽陵泉是也其二取大陵經云心咳之狀喉如吤吤然如梗狀取心之俞是也諸物梗喉無治諸哽煮薤白令半熟以線縛定手執線頭少嚼薤白咽之度薤白至哽處便牽引哽即出矣又法用綿一小塊以蜜煮用如食薤法世治骨哽入喉縮砂甘草各等分上為末以綿裹少許噙之旋旋咽津久之即出骨哽以乳香燒煙吸入喉即吐出本治諸魚骨哽久不出方以皂角少許吹入鼻中得嚏哽出多祕此方陳獺主魚骨哽不可出者取獺足於項下爬之亦可煮汁食之外治哽螻蛄膽一枚吞下亦治刺不出敷之刺即出古金録療魚骨橫喉中六七日不出取鯉魚鱗皮合燒作屑水服之即出未出再服上治骨哽子和一小兒誤吞一錢在喉中不下諸醫皆不能出亦不能下乃命戴人戴人熟思之忽得一策以淨白表紙令卷實如箸以刀縱橫亂割其端作鬅鬙之狀又別取一箸縛針鉤於其端令不可脫先下咽中輕提輕抑探之覺鉤入於錢竅然後以紙卷納之咽中與鉤尖相抵覺鉤尖入紙卷之端不礙肌肉提之而出葛誤吞叉取薤白曝令萎黃煮使熟勿切食一大束叉即隨出丹治誤吞錢叉及環用飴糖一片漸漸食之自出外臺祕要上治錢哽世治骨哽槿樹葉油馬屁勃砂糖三味熬膏為丸噙化纍效治骨哽喉痛用水牛屎上生出菌曬乾為末用砂糖為丸徐徐咽吞下仍用砂糖為衣不然損牙外治魚骨哽在喉中以少硇砂口咀嚼咽之立下世治魚骨哽用玉簪花根研細取汁竹管灌喉中不可著齒著則齒酥骨哽用萱草根汁服之傳者云可立視骨下邵云萱草即鹿蔥也又名宜男又方魚骨哽細嚼蘿蔔徐徐咽之愈丹治魚骨哽百法不能療者餳糖丸如雞子黃大吞之立出肘後方治諸哽生艾數升水酒各五升煮取四升稍熱服之外臺世魚骨哽楮子搗自然汁濾去渣服或收曬乾為末水和汁服亦可楮子即谷樹子也一方用楮樹皮衍橄欖味澀食久則甘嚼汁咽治魚哽外治哽以瞿麥為末水調方寸匕服本治骨哽白茯苓一味臨時細切為末以所哽骨煎湯調下世治雞骨哽用水簾草搗汁飲之骨自消治骨哽以野苧根洗淨搗爛如泥每用龍眼大如被雞骨所傷以雞羹化下如魚骨所傷魚湯化下治一切骨哽用金鳳花子嚼爛噙下無子用根亦好山誤吞稻芒麥芒咽間者急取鵝口中涎灌之或取薦頭草嚼亦妙丹魚骨在肚中刺痛煎茱萸汁一盞飲之骨軟而出食療丹治吞錢艾一把水五升煎至一升頓服便下錢氏篋中方治吞錢及鐵物在喉者不得下南燭根燒細末湯調一錢下之山誤吞錢百部根四兩酒一升漬一宿溫服一升日再服之外臺祕要又方誤吞銅錢用家茨菰取汁呷飲自消見山居方外誤吞錢並金銀等物以糊粉一兩搗調之分再服如吞金銀物在腹中以水銀服之令消煬無凡治哽之法皆以類推如鸕鷀治魚哽磁石治針哽發灰治發哽貍虎治骨哽亦各從其類也項頸強痛靈缺盆之中任脈也名曰天突當缺盆中央動脈是也一次任脈側之動脈足陽明也名曰人迎挾喉二旁之動脈是也二次脈手陽明也名曰扶突挾喉動脈之後曲頰之前一寸後是三次脈手太陽也名曰天窗手陽明之後當曲頰之下是也四次脈足少陽也名曰天容曲頰之後當耳之下是也五次脈手少陽也名曰天牖耳後當完骨上是也六次脈足太陽也名曰天柱挾項大筋中是也七次脈頸中央之脈督脈也名曰風府足陽明挾喉之動脈也其腧在膺中手陽明次在其腧外不至曲頰一寸太陽當曲頰足少陽在耳下曲頰之後手少陽出耳後上加完骨之上足太陽挾項大筋之中俱本輸篇內經刺灸項頸痛有二其一取足手太陽治項後痛經云足太陽之脈是動則病項如拔視虛盛寒熱陷下取之又云項痛不可俯仰刺足太陽不可以顧刺手太陽又云大風項頸痛刺風府風府在上椎又云邪客於足太陽之絡令人頭項肩痛刺足小指爪甲上與肉交者各一痏立已不已則刺外踝下三痏左取右右取左如食頃是也其二取足手陽明治頸前痛經云足陽明之脈所生病者頸腫又云手陽明之脈是動則病頸腫皆視盛虛寒熱陷下取之也玄頸項痛後溪玉項強承漿風府甲頭項痛重暫起僵仆鼻窒鼽衄喘息不得通通天主之頂上痛風頭重目如脫不可左右顧百會主之頸痛項不得顧目泣出多眥鼻鼽衄目內眥赤痛氣厥耳目不用咽喉僂引項筋攣不收風池主之項腫不可俯仰頰腫引耳完骨主之項強刺喑門頸項痛不可以俯仰頭痛振寒瘛瘲氣實則脅滿俠脊有並氣熱汗不出腰背痛大杼主之東風生於春病在肝腧在頸項全文見五臟本治筋急項不得轉側木瓜煎木瓜兩個取蓋去穰沒藥研二兩乳香研二分上二味納木瓜中用蓋子合了竹籤簽定飯上蒸三四次研爛成膏子每服三五匙地黃酒化下生地黃汁半盞無灰酒二盞和之用八分一盞熱暖化服有人患此證自午後發至黃昏時定豫曰此患先必從足起經言足十二經絡各有筋惟足太陽之筋自足至項大抵筋者肝之合也日中至黃昏天之陽陽中之陰也又曰陽中之陰肺也自離至兌陰旺陽弱之時故靈寶畢法云離至乾腎氣絶而肝氣弱肝腎二臟受陰氣故發於是時豫授此方三服而愈丹男子項強不能回顧動則微痛診其脈弦而數實右手為甚豫作痰熱客太陽經治之用二陳湯加酒洗黃芩羌活紅花服後二日愈垣養神湯治精神短少不得睡項筋腫急難伸禁甘溫宜苦寒黃耆一錢人參三分甘草七分蒼朮五分白朮三分柴胡四錢升麻四錢歸身五分麥芽五分木香一分川芎三分半夏七分橘皮一錢黃連五分黃芩酒二分黃柏一分上㕮咀每服五錢水二盞煎去渣稍熱服不拘時本治腎氣上攻項背不能轉移椒附散大附子一枚六錢上者炮去皮臍末之上末每二大錢好川椒二十粒用白麵填滿水一盞半生薑七片通煎至七分去椒入鹽空心服豫一親戚患項筋痛連背髀不可轉移服諸風藥皆不效豫嘗憶千金髓有腎氣攻背強一證豫處此方與之一服頓瘥自爾與人皆有驗蓋腎氣自腰夾脊上至曹溪穴然後入泥丸宮曹溪一穴非精於搬運者不能透今逆行至此不得通用椒以引歸經則安矣氣上達椒下達故服之愈千治風項強不得顧視穿地作坑燒令通赤以水灑之令冷納生桃葉鋪其席下臥之令項在藥上以衣著項邊令氣上蒸病人汗出良久即瘥又方治頭項強不得顧視蒸大豆一升令變色納囊中枕之諸痙項強皆屬於濕全文見診法治法見傷寒項強條
