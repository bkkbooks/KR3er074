body:
  text: 卷之十四肝膽部脅痛丹肝木氣實肝火盛而脅痛者當歸龍薈丸為瀉肝火要藥脅痛甚者用生薑自然汁吞下龍薈丸以肝火盛也龍薈丸方見治法門肝實條經云肝氣實則怒又云肝痛者兩脅下痛引少腹善怒龍薈丸治肝實脅痛其人氣收者善怒是也甚則用薑汁吞下經云風木淫勝治以辛涼是也壽四郎右脅痛小便赤少脈少弦不數此內有陳久積痰飲因外感風寒所遏不能宣散所以作痛與龍薈丸三十五粒保和丸三十粒細嚼薑片以熱湯下服後脅痛已安小便尚赤少再與白朮三錢陳皮芍藥各二錢木通一錢半條芩一錢甘草五分上姜三片煎熱飲之一婦人脾疼帶脅痛口微干問已多年時尚秋用二陳湯加川芎乾葛青皮木通下蘆薈丸二十粒章宅張郎氣痛自右脅時作時止脈沉而弦小便時有赤色吞酸喜嘔出食此濕痰在脾肺間所以肝善乘之小柴胡湯去黃芩加川芎白朮木通芍藥滑石生薑煎湯下保和丸三十五粒一婦人氣暈兩脅胸背皆痛口乾青皮半夏五錢白朮黃芩川芎三錢木通二錢半陳皮二錢桔梗二錢甘草炙五分上分六帖煎熱服又脅下有食積一條扛起加吳茱萸炒黃連本治因驚傷肝脅骨里疼痛不已桂枝散枳殼一兩小者桂枝半兩上為細末每服二錢薑棗湯調下潔勻氣散專治脅痛山梔熟地茯苓細辛桂心川芎各等分上研為末加羊脂煎服本治脅下疼痛不可忍兼治肺弱芎葛湯川芎乾葛桂枝細辛枳殼人參芍藥麻黃防風各半兩甘草二錢上為粗末每服五錢水二盞生薑三片同煎至七分去渣溫服日三服有汗避風治脅下風氣作塊寒疝發則連小腹痛湊心其積屬肝在右脅下故病發則右脅手足頭面昏痛不思飲食乾葛一兩麻黃二分附子一個川芎防風當歸枳實芍藥桂枝羌活甘草各四錢上為粗末每服四錢水一盞半生薑三片同煎至七分去渣服日三有汗避風治脅痛如前兼去手足枯悴薏苡仁丸薏苡仁一兩石斛用細者二錢附子半兩牛膝生地黃各三錢細辛人參枳殼柏子仁川芎當歸各半兩甘草桃仁各一兩上為細末煉蜜丸如桐子大每服三四十丸酒吞下食前日三服丸子食前煮散食後相兼服為佳治悲哀煩惱傷肝氣至兩脅骨疼筋脈緊腰腳重滯兩股筋急兩脅牽痛四肢不能舉漸至脊膂攣急此藥大治脅痛枳殼煮散枳殼四兩先煎細辛桔梗防風川芎各二兩葛根一兩半甘草上為粗末每服四錢水一盞半薑棗同煎至七分去渣空心食前溫服右肝虛脅痛經所謂木不及病中清胠脅痛是也中清謂中有寒也熱實脅痛當歸龍薈丸是也仲脅下偏痛發熱其脈弦緊此寒也以溫藥下之宜大黃附子湯大黃三錢附子二枚炮細辛二兩上三味以水五升煮取二升分溫三服若強人煮取二升半分溫三服服後如人行四五里更進一服垣神保丸治心膈痛腹痛血痛腎氣脅下痛大便不通氣噎宿食不消木香二錢半胡椒二錢半巴豆十枚去皮心膜研乾蠍七枚上四味共為末湯浸蒸餅為丸如麻子大亦用硃砂為衣每服五丸心膈痛柿蒂燈心湯下腹痛柿蒂煨薑湯下血痛炒姜醋湯下腎氣脅下痛茴香酒下大便不通蜜湯調檳榔末一錢下氣噎木香湯下宿食不消茶酒任下許學士云沈存中良方載頃在建陽醫者王琪言諸氣唯膀胱脅下痛最難治謂神保丸能治之熙寧中病項筋骨痛諸醫皆作風治之數月不瘥乃流入於背膂又臂攣痛甚苦憶琪語有證乃合服之一服而瘥再發又一服立效潔煮黃丸治脅下痃癖痛如神方見內傷飲食丹控涎丹治一身氣痛及脅走痛痰挾死血加桃仁泥凡脅痛有痰流注二陳加南星川芎蒼朮實者控涎丹下之本治男子兩脅疼痛枳實散枳實一兩白芍藥炒雀腦芎人參各半兩上細末薑棗湯調二錢酒亦得食前日三服東調中順氣丸治三焦痞滯水飲停積脅下虛滿或時刺痛木香白豆蔻去殼青皮炮京三稜炮各一兩陳皮大附子各二兩半夏湯炮七次一兩縮砂去殼檳榔沉香各半兩上為末煮麵糊為丸如桐子大每服三十丸漸加六十丸食後陳皮湯送下沉香導氣散治一切氣不升降脅肋痞塞沉香二錢半人參五錢檳榔二錢半白朮烏藥麥糵炒神麯炒紫蘇葉大腹皮炒厚朴制各一兩訶子皮炮半兩香附炮一兩半薑黃橘紅甘草各四兩京三稜二兩廣朮炮四兩益智二兩紅花四兩上為細末每服二錢食前沸湯點服丹溪云脅痛有死血者桃仁紅花川芎之類是也若跌撲脅痛者亦為汙血流歸脅下而痛東垣復元活血湯之類是也治法見攧撲傷損門運氣脅痛者鄉境皆病脅痛也其證有二其一風木助肝氣實而痛經云厥陰所至為脅痛又云厥陰在泉風淫所勝民病兩脅裡急支滿又云少陽司天之政初之氣風勝乃搖候乃大溫其病脅痛治以涼劑得痊也其二燥金攻肝虛而痛經云少陽所至為脅痛又云陽明司天燥氣下臨肝氣上從脅痛又云少陰司天地乃燥淒滄數至脅痛善太息又云歲木不及燥乃大行民病中清胠脅痛治以溫劑得痊也丹咳嗽脅痛方二陳湯加南星多香附青皮青黛薑汁內經灸刺脅痛有三法其一取肝經云肝病者兩脅下痛引小腹善怒取其經厥陰與少陽又云邪在肝則兩脅中痛寒中惡血在內行善掣節時腳腫取之行間以引脅下補三里以溫胃中取血脈以散惡血取耳間青脈以去其掣是也其二取膽絡經云邪客足少陽之絡令人脅痛不得息咳而汗刺足小指次指爪甲上與肉交者各一痏不得息立已汗出立止咳者溫衣飲食一日已左刺右右刺左其病不已復刺如法是也其三取心經云心手少陰脈所生病者目黃脅痛視虛實熱寒陷下施補瀉疾留灸之法也集脅痛懸鐘竅陰此二穴左取右右取左竅陰出血妙外關三里此一穴正取又法支溝章門中封陽陵泉治閃挫行間瀉肝怒氣期門治傷寒後脅痛治脅並胸痛不可忍期門四分章門六分灸七壯至七七壯行間丘墟湧泉東胸脅痛期門沿皮三寸支溝膽俞沿皮半寸胸脅脹滿痛公孫三里太衝三陰交腰脅痛環跳至陰太白陽輔撮脅肋痛支溝透間使瀉之灸外關透內關如取支溝不必再取外關通脅痛陽陵泉甲脅下支滿嘔吐逆陽陵泉主之腹中氣脹嗑嗑不嗜食脅下痛陰陵泉主之仲寸口脈弦者即脅下拘急而痛其人嗇嗇惡寒也靈合腋張脅者肺下肺下則居賁迫肺善脅下痛青色粗理者肝大肝大則逼胃迫咽則苦膈中且脅下痛凡脅骨偏舉者肝偏傾肝偏傾則脅下痛揭唇者脾高脾高則䏚引季脅而痛俱見本藏篇脾滿氣逆見喘條附腋腫腋臭內經針灸刺腋腫有二法其一取膽經云膽足少陽之脈所生病者缺盆中腫痛腋下腫是也其二取心經云心主手厥陰脈是動則病手心熱腋腫皆視虛實寒熱陷下施補瀉疾留灸也丹腋氣神效方密陀僧一兩白礬七錢硇砂少許麝香少上為細末先用皂角煎湯洗後敷上又方銅青密陀僧辰砂白礬硇砂白附子亦如前法搽之本治腋氣用夜明砂不拘多少為末用豆豉汁調塗立效又方以銅青好者不以多少米醋調成膏先洗淨腋下用輕粉摻過即使上件塗之立效經治狐臭用生薑塗腋下絶根本三因治狐臭大蜘蛛一個以黃泥入少赤石脂搗羅極細入鹽少許杵為一窠包藏蜘蛛在內以火燒令通紅放冷剖開將蜘蛛研細臨臥入輕粉一字用釅醋調成膏敷腋下明日登廁必瀉下墨汁臭穢不可聞於遠僻處傾埋之免致染人世治腋氣先用刀削去腋毛淨用白定粉水調搽敷患處至過六七日夜後次日早看腋下有一黑點如針孔大用筆點定即用艾炷灸七枚灸過攻心中痛當用後藥下之青木香檳榔丁香檀香麝香大黃上煎服以下為度諸疝附少腹痛同一治法疝痛屬足厥陰肝經也小腹亦屬肝經也故疝痛與小腹痛同一治法所謂疝者睪丸連小腹痛也其痛有獨在睪丸者有獨在小腹偏於一邊者有睪丸如升斗者㿗疝是也又立臥出入往來者狐疝是也丹疝痛之甚者也睪丸連小腹急痛也有痛在睪丸者有痛在五樞穴邊者皆足厥陰之經也或有形或無形或有聲或無聲或有形如瓜有聲如蛙者素問以下歷代名醫皆以為寒蓋寒主收引經絡得寒收引不行所以作痛理固然也有得寒而無疝者又必有說通之可也豫嘗因門戶上履霜雪踢水徒涉不曾病此以豫素無熱在內也因而思之此症始於濕熱在經鬱而至久又感寒氣外束濕熱之邪不得疏散所以作痛若只作寒論恐為未備或曰此症多客厥陰一經其道遠其位卑鬱積濕熱何由而致豫曰大勞則火起於筋醉飽則火起於胃房勞則火起於腎大怒則火起於肝本經火積之久母能生子濕氣便盛厥陰屬木繫於肝為將軍之官其性急速火性又暴為寒所束宜痛之亦大暴也愚見有用烏頭梔子等分作湯用之其效亦敏後因此方隨症與形加減用之無有不應然濕熱又須分多少而施治但濕者腫多㿗疝是也又有挾虛而發者當以參術為君而以疏導藥佐之診其脈不甚沉急而大豁無力者是也然其痛亦輕惟覺重墜牽引耳羅丁香楝實丸治男子七疝痛不可忍者婦人瘕聚帶下皆任脈所主陰經也乃肝腎受病治法同歸於一當歸去蘆附子炮去皮臍川楝子茴香各一兩上銼碎以好酒三升煮酒盡為度焙乾作細末每藥末一兩入下項藥丁香五分全蠍十三個玄胡索五錢木香五分上四味同為細末入前項當歸等末內拌勻酒糊為丸如桐子大每服三十丸至百丸溫酒空心送下一方無當歸木香名苦楝丸立效凡疝氣帶下皆屬於風全蠍治風之聖藥也川楝茴香皆入小腹經當歸玄胡索和血止痛疝氣帶下皆積寒邪於小腸之間故以附子佐之丁香木香為引導也漆匠韓提控疝氣每發痛不可忍則於榻兩末各置一枕往來伏之以受如是三年不已服此藥三劑良愈丁香疝氣丸治臍下撮急疼痛並臍下周身一遭皆急痛小便頻數清其五脈急洪緩澀沉按之皆虛獨腎脈按之不急皆虛無力名曰腎疝當歸茴香各半兩甘草梢五錢丁香五分全蠍十三個玄胡半兩肉桂一錢防己三錢川烏半兩羌活梢三分麻黃根節一錢上件為細末酒糊丸如雞豆大每服五十丸淡鹽湯送下須空心宿食消盡服之羅當歸四逆湯治男子婦女疝氣臍下冷痛相引腰胯而疼當歸梢七分附子炒官桂茴香炒各五分芍藥四分玄胡索川楝子茯苓各三分澤瀉二分柴胡五分上研為粗末都作一服水煎空心玄胡索苦楝湯治臍下冷撮痛陰冷大寒肉桂三分附子三分熟地黃一錢甘草梢炙半錢苦楝子二分黃柏一錢引用玄胡索二分上件都作一服水四盞煎至一盞依法食前服上四方桂附治寒玄胡當歸川楝茴香丁香木香和血調氣蓋寒症挾汙血滯氣者宜之葫蘆巴丸治大人小兒小腸氣蟠腸奔豚疝氣偏墜陰腫小腹有形如卵上下來去痛不可忍或絞結繞臍攻刺嘔吐悶亂並皆治之葫蘆巴炒二兩茴香鹽炒一兩半吳茱萸湯洗炒一兩二錢川楝子去核炒一兩二錢巴戟去心炒七錢半川烏炮去皮尖七錢半黑醜炒取頭末一兩上研為細末酒糊為丸如桐子大每服十五丸至二十丸止空心溫酒送下小兒五丸茴香湯下食前一本無黑醜衍葫蘆巴本經云得茴香桃仁治膀胱氣甚效嘗合用桃仁麩炒各等分拌酒糊丸半為散每服五七十丸空心食前鹽酒下散以熱米飲調下與丸子相間空心各一二服效丹腎氣散茴香破故紙吳茱萸鹽炒各半兩木香三錢半葫蘆巴七錢半上為細末蘿蔔搗汁丸鹽湯下上三方葫蘆巴破故紙巴戟為君蓋疝而元陽素虛少者宜之本治小腸氣不可忍者烏藥搗碎酒浸一宿高良薑銼茴香各一兩青皮二兩去白上研為末每服二錢遇發熱酒調下治遠年小腸氣衆醫不瘥者硫黃茴香炒令黃不可犯銅鐵器各等分上研為末每服五錢用熱酒調空心服除根本川楝散木香一兩茴香一兩鹽一匙一處炒黃色不用鹽川楝子一兩銼細用巴豆十粒打破一處炒黃色不用巴豆上研為細末每服二錢空心食前調下垣天台烏藥散烏藥木香茴香炒良薑各五錢檳榔三錢川楝子十個巴豆十四粒青皮半兩上八味先以巴豆打碎一同楝實用麩炒候黑色去巴豆麩俱不用外為細末每服一錢溫酒調下痛甚炒生薑熱酒下亦得簡木香楝子散治小腸疝氣膀胱偏墜久藥不效者服此其效如神川楝子三十個巴豆二十粒同炒黃赤色去巴豆不用將川楝子研為末萆薢半兩石菖蒲一兩炒青木香一兩炒荔枝核二十枚炒上研為細末每服二錢入麝香少許空心炒茴香鹽酒調下上以巴豆炒藥例許學士云大抵此疾因虛而得之不可以虛驟補邪之所湊其氣必虛留而不去其病則實矣故必先滌去所蓄之邪熱然後補之是以諸藥多借巴豆氣者蓋為此也仲寒疝腹中痛逆冷手足不仁若身疼痛灸刺諸藥不能治抵當烏頭桂枝湯主之上用烏頭一味以蜜二升煎減半去渣以桂枝湯五合解之令得一升後初服二合不知再服三合又不知復加至五合其知者如醉狀得吐者為中病桂枝湯方見傷寒門海藏以附子建中湯加蜜煎治疝即此法也腹痛脈弦而緊弦則衛氣不行即惡寒緊則不欲食邪正相搏即為寒疝寒疝繞臍痛若發則自汗出手足厥冷其脈沉弦者大烏頭煎主之脈經云邪正作弦緊大烏頭炒去皮不㕮咀以水三升煮取一升去渣納蜜二升煎令水氣盡作湯服食後一服過後再不作矣治諸疝方枳實九粒炒桃仁十四個炒山梔九個炒去皮吳茱萸七粒炒山楂四粒炒生薑如指大上味同入擂盆擂細取順流水一鍾入瓶內煎至微沸帶渣服如濕勝㿗疝者加荔枝核如痛甚者加鹽炒大茴香二錢如痛處可按者加薄桂少許又方治疝痛山梔二兩炒山楂四兩炒枳實炒茴香各二兩炒柴胡牡丹皮八角茴香炒各一兩桃仁茱萸炒半兩上研為末酒糊丸空心鹽湯下五六十丸治陽明受濕熱傳入太陽發熱惡寒小腹連毛際間悶痛不可忍梔子仁炒桃仁炒枳實炒山楂各等分上味同研細入生薑汁半合同水一小鐘蕩起煎令沸熱服之一方加茱萸楊淳三哥因舊有腎氣上引乳邊及右脅痛多痰有時膈上痞塞大腑祕結平時少汗脈弦甚與保和溫中各二十丸研桃仁郁李仁吞之本治膀胱氣痛茴香散茴香金鈴子肉蓬莪朮京三稜各一兩甘草半兩炙上為細末每服二錢熱酒調下每發痛甚連日只三二服立定治膀胱氣金楝散巴豆一百粒去殼川楝子二十四個湯浸去薄皮切作片子上二味用麩二升同炒令黃赤去麩與巴豆不用只將川楝肉一味為末每服三錢溫酒空心送下余閲古今一切名方無如此奇特有效一方川楝子不用巴豆炒亦妙靈胃中熱腸中寒則疾飢小腹痛脹師傳篇疾飢胃熱痛脹腸寒也丹諸疝痛處用手按之不痛者屬虛必用桂枝炒山梔細切川烏頭等分為細末生薑自然汁打糊為丸如桐子大每服三四十丸空腹白湯下疝可按者並於歷代獨治外寒條下求之丹溪云疝有挾虛而發者其脈不甚沉緊而大豁無力者是也然其痛亦輕惟覺重墜牽引耳當以參術為君疏導藥佐之蓋疏導藥即桃仁山楂枳實梔仁茱萸川楝玄胡索丁香木香之類以佐參術之類是也海姬提領因疾服涼劑數日遂病臍腹下大痛幾至於死與姜附等劑雖稍蘇痛不已隨本方內倍芍藥服之愈羅疝氣治驗癸丑歲治火兒赤憐歹病疝氣復因七月間飢飽勞役過飲湩乳所發甚於初面色青黃不澤臍腹陳痛搐撮不可忍腰不能伸熱物尉之稍緩脈得沉小而急豫思難經有云任之為病男子內結七疝皆積寒於小腸所致也非大熱之劑即不能愈遂制一方名之曰沉香桂附丸每服一百丸空心溫酒下間服天台烏藥散旬日良愈明年秋如故沉香桂附丸治中氣虛弱脾胃虛寒飲食不美氣不調和退陰助陽除臟腑積冷心腹疼痛脅肋膨脹腹中雷鳴面色不澤手足厥逆便利無度又治下焦陽虛及療七疝痛引小腹不可忍腰痛不能伸喜熱尉稍緩沉香附子炮去皮臍川烏炮去皮臍乾薑炮良薑炒官桂去皮茱萸湯洗茴香炒各一兩上研為細末醋煮麵糊為丸如桐子大每服五十丸至七八十丸止空心食前熱米飲湯下日三服忌冷物丹治疝劫痛方川烏頭細切梔子仁去殼上各等分煎湯服之神效濕多㿗腫者烏頭為君蓋川烏頭治外束之寒梔仁治內郁之熱也羅陰疝足厥陰之脈環陰器抵小腹或痛因腎虛寒水涸竭瀉邪補肝宜以蒺藜湯主之蒺藜湯治陰疝牽引小腹痛諸厥疝即陰疝也房欲勞痛不可忍者蒺藜炒去尖附子炮去皮臍山梔仁各半兩上研為末每服三錢水一盞半煎至七分去渣食前溫服丹又方橘核桃仁梔子茱萸川烏各等分上研煎服治疝作急痛蒼朮鹽炒香附鹽炒茴香炒為佐黃柏酒炒為君青皮玄胡索益智桃仁為臣附子鹽水炒甘草為使上研為末作湯服後一痛過更不再作矣仲寒疝腹中痛及脅痛裡急者當歸生薑羊肉湯主之當歸三兩生薑五兩羊肉一斤上上三味以水八升煮取三升溫服七合一日三服若寒多者加生薑十片痛多而嘔者加陳皮二兩白朮一兩如加生薑者亦加水五升煮取三升二合服之衍義云張仲景治寒疝用生薑羊肉湯服之無不應驗有一婦人産當寒月寒氣入産門腹臍以下脹滿手不敢犯此寒疝也師將治之以抵當湯謂有瘀血非其治也可服張仲景羊肉湯二服遂愈丹諸疝痛處用手按之大痛者為實也羅疝氣痛及腳膝無力控睪證至真要大論云小腹控睪引腰脊上衝心唾出清水及為噦噫甚則入心善忘善悲甲乙經曰邪在小腸也小腸病者小腹痛引腰脊貫肝肺其經虛不足則風冷乘間而入邪氣既入則厥證上衝肝肺客冷散於胸結於臍控引睪丸上而不下痛而入腹甚則衝於心胸蓋其經絡所繫也啓玄子云控引也睪陰丸也控引睪丸治小腸痛結上而不下痛引心臆即東垣茴香楝實丸按之痛為實此方有茱萸等剛劑本不可入此條緣芫花有利性故入之川楝子茴香炒吳茱萸湯洗青皮陳皮各一兩芫花醋炒五錢馬藺花醋炒一兩上為細末醋糊為丸如桐子大每服三十丸溫酒送下食前服量虛實加減以利為度本治小腸氣痛撞腹面青唇黑欲死者木香茵陳芫花甘遂各等分上四件為末每服二錢水一盞煎至七分去渣溫服服過此藥後應犯甘草藥皆不得吃恐與甘遂相犯故也其藥甚妙亦甚有理屢有驗效硇砂丸木香沉香巴豆肉各一兩青皮二兩不去皮銅青半兩研硇砂一錢研上以上二香青皮三味細研同巴豆慢火炒令紫色為度去巴豆為細末入硇砂二味同研勻蒸餅和丸如梧桐子大每服七丸至十丸鹽湯吞下日二三服空心食前服子和律科王敏之病寒疝臍下結聚如黃瓜每發繞臍急痛不能忍戴師先以舟車丸及豬腎散下四五行覺藥繞病三五次而下其瀉皆水也豬腎甘遂皆苦寒經言以寒治寒萬舉萬全但下後忌飲冷水及寒物宜食乾物以寒疝本是水故也即日病減八分食進一倍又數日以舟車丸百餘粒通經散四五錢服之利下候三四日又服舟車丸七八十粒豬腎散三錢乃健步如常矣近穎尾一夫病卒疝赤腫大痛數日不止余以導水丸一百五十丸令三次咽之次以通經散三錢空腹淡酒調下五更下二三十行腫痛皆去不三日平復如故上治實疝利大便形氣實脈有力者宜之杜三十七太尉忽患小腸氣痛醫官及京城醫家用藥皆不效每一發幾死上召杜至進藥數服不驗太尉曰我命不久致良醫不能治上召杜問所以杜對臣用古方書皆不獲愈今日撰一方容進上杜曰撰方已成未敢進先合藥以進太尉一服十愈八九再服全愈然後進方名曰救命通心散川烏頭一兩用青鹽一錢酒一盞浸一宿去皮尖焙乾川楝子一兩用巴豆二十一粒同炒候黑色去巴豆茴香半兩石燕一對土狗五枚芥子一錢六分為末每服三錢入羊石子內濕紙煨香熟夜半時用好酒半升入鹽細嚼石子以酒咽下不得作聲小便大利其病遂去曹五家今祕此方本頃在嶽城日歙尉宋荀甫膀胱氣作疼不可忍醫者以剛劑與之痛愈甚小便不通三日矣臍下虛脹心悶豫因候之見其面赤黑脈洪大豫曰投熱藥太過陰陽痞塞氣不得通為之奈何宋尚手持四神丹數粒云醫謂不止更服此豫曰若服此定斃後無悔渠求治豫適有五苓散一兩許令三服用連須蔥一莖茴香一撮鹽一錢水一盞半煎至七分令接續三服中夜下小便如墨汁者一二升臍下寬得睡翌日診之脈已平安矣續用硇砂丸與之數日瘥上利小便治疝常治謝人妻小腹疼痛小便不通先艾灸三陰交以茴香丁香青皮檳榔桂茱萸玄胡索山楂枳實又倍用黃柏煎服之愈丹赤岸朱同道年四十歲八月望雨後得涼半夜後腹痛甚汗如雨兩腳踏破壁痛在小腹手不可近六脈弦而細實重取如循刀刃責責然問之云六月大熱時於深潭浴水病或起於此與大承氣湯大便微利痛遂頓止至次日酉時其痛復作痛在小腹堅硬手不可近又與大承氣加桂兩服研桃仁同煎大便下紫黑血升余而痛頓止至次日酉時痛復作如初脈雖稍減而責責然猶在與大承氣湯加附子兩帖研桃仁同煎下大便五行得黑紫血如破絮者二升許痛遂頓止一夜得睡次日酉時痛復如初詢知小腹和軟痛在臍腹間下脈亦和似若無病但呻吟如舊詢知乃食蘿蔔菜苗羹兩頓與小建中湯一帖而愈世一婦人少腹痛百藥不效一醫用杉木節童便煎服下血而愈丹治膀胱氣急用蕪荑和食鹽等分綿裹如棗大納下部或下水惡汁並下氣佳鬥治小腸氣用血師一兩米醋一升以火燒血師通赤淬入醋中以淬竭為度搗羅如面用湯調下一大盞即瘥如神血師代赭石也聖治寒疝小腹及陰中相引而痛自汗出欲死丹參一兩杵為散每服熱酒調下二錢匕丹治諸疝發時用海石香附二味為末生薑汁湯調亦能治心疼衍木賊細銼微炒搗為末沸湯點二錢服食前治小腸膀胱氣緩緩必效本治疝氣青礬一兩白礬一兩各為粗末上用小瓦罐子一隻入二藥在內用麻皮縛緊搗鹽泥封固以炭五斤煅令通紅盡炭為度取出埋地穴中伏一宿出火毒醋糊為丸如緑豆大每服十丸空心鹽湯送下或白湯亦可運氣小腹痛有三一曰肝病小腹引脅痛是也經云厥陰之復少腹堅滿裡急暴痛是風氣助肝盛而然治法當瀉肝也又云歲金太過民病兩脅下痛小腹痛又云歲木不及燥乃大行民病中清胠脅痛少腹痛又云歲土不及風乃大行民病腹痛復則胸脅暴痛下引小腹者是燥邪攻肝虛而然治法當補肝瀉金也又寒氣客於厥陰之脈則血泣脈急故脅肋與小腹相引痛者治法亦同也全文見諸痛門二曰小腸其病小腹引睪丸腰脊痛是也經云少陰之脈心下熱善飢臍下痛又云少陰之復燠熱內作小腹絞痛者是熱助小腸盛而然治法當瀉小腸也又太陽在泉寒淫所勝與太陽之復皆病小腹控睪引腰脊上衝心痛及太陰司天大寒且至病小腹痛者是寒邪攻小腸虛而然治法當補小腸瀉寒邪也三曰膀胱其病小腹痛腫不得小便是也經云太陰在泉病小腹痛腫不得小便者是濕邪攻膀胱虛而然治法當補膀胱瀉濕土邪也以上經文見運氣類注內經刺灸小腹痛共四法一曰肝經曰肝病者兩脅下痛引小腹取其經厥陰小腸全文見灸刺門五臟條又曰邪客厥陰之絡令人卒疝暴痛刺足大指爪甲上與肉交者各一痏男子立已女子有頃已左取右右取左者是也全文見灸刺門六腑條爪甲上大敦穴也二曰小腸經云小腸病者小腹痛腰脊控睪而痛時窘之後取巨虛下廉又云小腸控睪引腰脊上衝心邪在小腸取之肓原以散之刺太陰以豫之取厥陰以下之巨虛下廉以去之按其所過之經以調之是也全文並見針灸門六腑條肓原氣海穴也又云疝暴痛取足太陰厥陰盡刺去其血絡靈樞熱病為心風疝而小腸病經云心為牡臟小腸為之使故小腹當有形也三曰膀胱經云膀胱病者小腹偏腫而痛以手按之即欲小便而不得取委中央又云小腹痛腫不得小便邪在三焦約取之足太陽大絡者是也全文見針灸門六腑條太陽大絡委陽穴也四曰督任衝脈經文見如下素病在少腹腹痛不得大小便病名曰疝得之寒刺少腹兩股間刺腰髁骨間刺而多之盡炅病已長刺節篇小腹兩股間者氣衝穴也衝脈起於氣衝故也腰髁間者王注謂腰尻挾脊平立陷者中按之有骨處是也疝為寒生故多刺之少腹盡熱乃止針靈腎脈生病從少腹上衝心而痛不得前後為沖疝任脈為病男子內結七疝女子帶下瘕聚俱見骨空論摘元藏發動臍下痛不可忍氣海三陰交立愈左取右右取左下同玉疝氣少腹偏痛大敦二分沿皮向後三分瀉之灸左取右右取左下同三陰交一寸瀉十吸撮又法大敦水道小海桑又法中極印腎摘卒疝少腹痛不可忍大敦三分陷六呼灸七壯陰市三分灸五壯照海三分灸七壯以上皆左取右右取左痃癖小腸膀胱腎余疝氣氣海五樞各用燔針刺入五分灸百壯三里三陰交刺之桑疝三陰交三里足三間摘疝行間三里集大法關門關元水道三陰交不已再取下穴海底歸來摘少腹痛關元三里甲陰跳遺溺小便難痛陰上下入腹中寒疝陰挺出偏大腫腹臍痛腹中悒悒不樂大敦主之腹痛上搶心心下滿癃莖中痛怒瞋不欲視泣出長太息行間主之環臍痛陰騫兩丸縮腹堅痛不得臥太衝主之疝癃臍少腹引痛腰中痛中封主之陰跳腰腹痛實則挺長寒熱攣陰暴痛遺溺便大虛則暴癢氣逆腫睪卒疝小便不利如癃狀數噫恐悸氣不足腹中悒悒少腹痛嗌中有熱有瘜肉狀如著欲出背攣不可俯仰蠡溝主之上取藏經厥陰男子陰疝兩丸上下少腹痛五樞主之大疝腹堅丘墟主之上取腑經少陽少腹痛飧泄出糜次指熱若脈陷寒熱身痛唇乾不渴汗出毛髮焦脫肉少氣內有熱不欲動搖泄膿血腰引少腹痛暴驚狂言非常巨虛下廉主之少腹痛控睪引腰脊疝痛上衝心腰脊強溺黃赤口乾小腸腧主之疝瘕髀中急痛循脅上下搶心腹痛積聚府舍主之腹痛疝積聚上衝心雲門主之上巨虛下廉小腸腧者取本腑也府舍雲門者刺太陰以豫之也四肢淫濼身悶癃疝至陰主之臍疝繞臍痛沖胸不得息灸臍中陰疝引睪陰交主之少腹疝臥善驚氣海主之臍疝繞臍痛石門主之暴疝痛少腹大熱關元主之少腹痛溺難陰下縱橫骨主之男子陰端寒上衝心中佷佷會陰主之癃疝然谷主之卒疝少腹痛照海主之病在左取右右取左立已陰暴起疝瘕胞中有血四滿主之臍疝繞臍痛時上衝心天樞主之氣疝噦嘔面腫奔豚天樞主之陰疝氣疝天樞主之陰疝痿莖中痛兩丸騫臥不可仰臥刺氣衝陰疝衝門主之一作衡門寒疝下至腹腠膝腰痛如清水大腹諸疝按之至膝上伏兔主之寒疝痛腹脹滿痿厥少氣陰谷主之素厥陰脈滑則病狐疝風少陰滑則病肺風疝太陰脈滑則病脾風疝陽明脈滑則病心風疝太陽脈滑則病腎風疝少陽脈滑則病肝風疝四時刺逆從論診肝脈滑甚為㿗疝心脈微滑為心疝引臍下小腹鳴腎肝滑甚為癃㿉全文見治法東夫滑脈關以上見者為大熱蓋陽與陽並也故大熱滑脈尺部見為大寒生㿗疝滑脈者命門包絡之名也為丙丙丁熱火併於下蓋丙丁不勝壬癸從寒水之化也故生㿗疝素帝曰診得心脈而急此為何病岐伯曰病名心疝少腹當有形也帝曰何以言之岐伯曰心為牡臟小腸為之使故曰少腹當有形也脈要精微論心脈搏滑急為心疝肺脈沉搏為肺疝腎脈肝脈大急沉皆為疝俱大奇論脈脈來中央堅實徑至關者衝脈也動苦少腹痛上搶心有瘕疝絶孕遺矢溺脅支滿煩也丹臍下忽大痛人中如墨色者多死子和七疝圖寒疝其狀囊冷結硬如石陰莖不舉或控睪丸而痛得於坐臥濕地或寒月涉水或冒雨雪或坐臥磚石或風冷處使內過勞宜以溫劑下之久而無子水疝其狀腎囊腫痛陰汗時出或囊腫而狀如水晶或囊癢而搔出黃水或少腹中按之作水聲得於飲水醉酒使內過勞汗出而遇風寒濕之氣聚於囊中故水多今人為卒疝宜以逐水之劑下之有漏針去水者人多不得其法筋疝其狀陰莖腫脹或潰或痛而裡急筋縮或莖中痛痛極則癢或挺縱不收或白物如精隨溲而下久而得於房室勞傷及邪術所使宜以降心火之劑下之血疝其狀如黃瓜在小腹兩旁橫骨兩端約中俗云便癰得於重感春夏大燠勞於使內氣血流溢滲入脬囊留而不去結成癰腫膿少血多宜以和血之劑下之和血四物湯調胃承氣湯各半服之是也氣疝其狀上連腎區下及陰囊或因號哭忿怒則氣鬱之而脹罷則氣散者是也有一治法以針出氣而愈者然針有得失宜以散氣之藥下之或小兒亦有此疾俗云偏氣得於父已年老或年少多病陰痿精怯強力入房因而有子胎中病也此疝不治惟築賓一穴主之狐疝其狀如瓦臥則入小腹行立則出小腹入囊中狐則晝出穴而溺夜則入穴而不溺此疝出入上下往來正與狐相類也亦與氣疝大同小異令人帶鉤鉗是也宜以逐氣流經之藥下之㿗疝其狀陰囊腫縋如升如斗不癢不痛者是也得之地氣卑濕所生故江淮之間湫溏之處多有此疾宜以去濕之藥下之女子陰戶突出雖亦此類乃熱則不禁固也不可便謂虛寒而澀之燥之補之本名曰瘕宜以苦下之以苦堅之王注云陽氣下墜陰氣上爭則寒多下墜則筋緩故睪垂縱緩因作㿗疝也以上七疝下去其病之後可調則調可補則補各量病勢勿拘俗法經所謂陰盛則腹脹不通者癃㿗疝也不可不下上疝圖雖七然寒疝即疝之總名水疝即㿗疝之屬氣疝即狐疝之屬血疝即癰癤之屬惟筋疝罕見之蓋下疳瘡之屬也㿗疝睪囊腫大如升如斗是也丹下部㿗氣不痛之方細思非痛斷房事與厚味不可用藥惟促其壽若蒼朮神麯白芷山楂川芎枳實半夏皆要藥人視其藥皆鄙賤之物以啓慢心又不能斷欲以愛護其根本非徒無益而反被其害者多矣且其藥宜隨時月寒濕更按君臣佐使加減大抵㿗疝屬濕多蒼朮神麯白芷散水山楂川芎枳實半夏南星上神麯糊為丸有熱加山梔一兩堅硬加朴硝半兩秋冬加吳茱萸二錢半㿗疝南星山楂蒼朮各二兩白芷半夏枳實神麯各一兩海藻昆布各半兩玄明粉吳茱萸各二錢上為末酒糊丸又方治木腎不痛南星半夏黃柏酒洗蒼朮鹽炒枳實山楂白芷神麯炒滑石炒茱萸昆布上為末酒糊丸空心鹽湯下一方加枸杞子無香附散治㿗脹用香附子不拘多少為末每用酒一盞海藻一錢煎至半盞先撈海藻嚼細用所煎酒調末二錢服東又方治偏墜初生用穿山甲茴香二味為細末酒送下以乾物壓之丹木腎以楮木葉雄者曬乾為末酒糊為丸空心鹽酒下本事方云無實者雄也潔海蛤丸㿗疝海蛤醋淬三次當歸海金沙膩粉硇砂各一錢海藻粉霜各五分水蛭二十一條炒青黛滑石乳香各一錢硃砂二錢為末地龍二十一條去頭足上細末鹽煮麵糊為丸如小豆大硃砂為衣每服十丸煎燈心湯空心服之小便下冷膿惡物乃效卻以黃連紫河車板藍根各二錢煎湯漱口以固牙齒去板藍根加管仲世治偏墜大者用乾薑桂各一兩為末以綿一兩水大三碗同煮二十餘沸起曬乾又煮水盡為度用干綿包陰丸汗出數次漸愈海地黃膏子丸治男子婦人臍下奔豚氣塊小腹疼痛卵痛即控睪相似漸成腫陰陰痛上衝心腹不可忍者宜服此藥血竭沉香木香廣朮炮玄胡索蛤蚧人參當歸川芎川楝麩炒續斷白朮全蠍茴香炒柴胡吳茱萸沒藥以上分兩不定隨症加減用之氣多者加青皮血多加肉桂上同為細末地黃膏子丸桐子大空心溫酒下二十丸日加一丸至三十丸簡安息香丸治陰氣下墜痛脹卵核腫大堅硬如石痛不能忍者玄胡索炒海藻洗昆布洗青皮去白茴香炒川楝子去核馬藺花以上各一兩半木香半兩不見火大戟酒浸三宿切片焙乾三錢半上為細末另將硇砂真阿魏真安息香三味各二錢半用酒一盞醋一盞將硇砂阿魏安息香淘去砂石用酒醋合一盞熬成膏子再入麝香一錢沒藥二錢半俱各另研細入前藥一同和丸如緑豆大每服十丸至十五丸空心用綿子灰調酒下本治膀胱疝氣外腎腫痛不可忍念珠丸乳香硇砂各三錢飛黃蠟一兩上乳香硇砂同研勻溶蠟和為丸分作一百單八丸以線穿之露一宿次日用蛤粉為衣旋取用乳香湯下頃年有人貨疝疾藥日貨數千有一國醫多金得之用之良驗丹鄭子敬因吃酒後飲水與水果偏腎大時作蛙聲或作痛炒枳實一兩茴香鹽炒炒梔子各三錢研煎下保和丸昌世官膀胱氣下墜如蛙聲臭橘子核炒十枚桃仁二十枚蘿蔔自然汁研下保和丸七十湜兄年三十左腎核腫痛此飲食中濕墜下成熱以橘核即臭橘五枚桃仁七枚細研順流水一盞煎沸熱下保和丸本治膀胱腫硬牽引疼痛及治小腸氣陰囊腫毛間出水宜服金鈴丸金鈴子肉五兩茴香炒馬藺花炒菟絲子海蛤破故紙海帶各二兩木香丁香各一兩上細末糊丸如桐子大每服二三十丸溫酒鹽湯空心食前服無大戟丸治陰㿗腫脹或小腸氣痛大戟去皮銼炒黃半兩葫蘆巴炒四兩木香一兩附子炮去皮臍茴香訶子煨去核檳榔各半兩川楝五兩麝香半兩另研上為末獨取川楝以好酒二升蔥白頭七枚長三四寸煮川楝軟去皮核取肉和上件藥杵丸如桐子大空心溫酒下十丸潮發疼痛炒姜熱酒下十五丸抵聖丸治陰㿗腫滿赤腫大便祕欲飲水按之臍腹痛續隨子薏苡仁郁李仁茵芋白牽牛各一錢略炒上為末滴水丸如桐子大每服五丸用博濟方香姜散咽下黃昏服五更利下惡物效子和汝南司候李審言因勞役王事飲冷水坐濕地乃濕氣下行流入脬囊大腫痛不可忍以金鈴川楝等藥不效求治於戴人曰可服泄水丸審言惑之又數日痛不可堪竟從戴人先以舟車丸浚川散下青緑水十餘行痛止後用茴香丸五苓散以調之三日而腫消至老更不作世綿包取汗方見㿗疝不痛條丹木腎以枇杷葉野紫蘇葉蒼耳葉水晶蒲卜葉濃煎湯熏洗無雄黃散治陰腫大如斗核痛人所不能治雄黃一兩研礬二兩甘草生半兩上銼散以水五升煎洗潔失笑散治腎腫荊芥穗一兩朴硝二兩上為粗末蘿蔔蔥同煎湯淋洗梅治卒外腎腫痛大黃末醋和塗之干即易之焦治男子陰腫大如升核痛人所不能治者搗馬鞭草塗之男子陰腫大如斗核痛人所不能治者蔓菁根搗敷之運氣㿗疝有一經云陽明司天燥淫所勝丈夫㿗疝婦人小腹痛又云陽明之勝外發㿗疝者是燥邪攻肝氣虛而然治法當補肝瀉燥金也全文見運氣類注素厥陰所謂㿗疝婦人少腹腫者厥陰者辰也三月陽中之陰邪在中故曰㿗疝少腹腫也所謂㿗癃疝膚脹者曰陰亦盛而脈脹不通故曰㿗癃疝也俱脈解篇三陽為病發寒熱下為癰腫及為痿厥腨㾓其傳為㿗疝全文見診病傳變王注云腨㾓痠痛也靈黃帝曰刺節言去爪夫子乃言刺關節肢絡願卒聞之岐伯曰腰脊者身之大關節也肢脛者人之管以趨翔也莖垂者身中之機陰精之候津液之道也故飲食不節喜怒不時津液內溢乃下留於睪血道不通日大不休俯仰不便趨翔不能此病滎然有水不上不下鈹石所取形不可匿常不得蔽故命曰去爪帝曰善刺節真邪篇內經刺灸㿗疝共四法其一即此篇文所謂鈹石取睪囊中水液者是也其法令世人亦多能之睪丸囊大如斗者中藏穢液必有數升信知此出古法也鈹針如刀狀其二取肝經云足厥陰之脈是動則病丈夫㿗疝婦人小腹腫是也是於足厥陰肝經視盛虛熱寒陷下而施補瀉留疾與灸也全文見針灸門十二經條其三取肝之絡經云足厥陰之別名曰蠡溝去內踝五寸別走少陽其別者徑脛上睪結於莖其病氣逆則睪腫卒疝取之所別是也是於內踝上五寸貼脛骨後近肉處蠡溝取之也全文見針灸門十五經條其四取足陽明筋經云足陽明之筋聚於陰器上腹其病轉筋髀前腫㿉疝腹筋急治在燔針劫刺以知為數以痛為輸是也是於轉筋痛處用火針刺之也桑治偏墜當外腎縫沿皮針透即消集木腎紅腫如升大不痛大敦三陰交海底歸來在水道下二寸針入二寸半灸七壯木腎紅腫陰汗偏墜闌門毛際玉莖旁開二寸針入二寸半三陰交甲㿗疝大巨及地機中郤主之㿗疝陰暴痛中封主之千金云㿗疝癃暴痛痿厥身體不仁氣癃㿗疝陰急股樞腨內廉痛交信主之丈夫㿗疝陰跳痛引篡中不得溺腹支脅下榰滿閉癃陰痿後時泄四肢不收實則身疼痛汗不出目䀮䀮然無所見怒欲殺人暴痛引臏下節時有熱氣筋攣膝痛不可屈伸狂如新發衄不食喘呼小腹痛引噫足厥痛湧泉主之撮木腎紅腫疼痛然谷半寸瀉之世灸關元者可愈蓋灸之早方效垣前陰分大寒大熱囊垂縮陰陽別論云三陽為病發寒熱下為壅腫及為痿厥腨㾓其傳為索澤又傳為㿗疝夫熱在外寒在內則纍垂此九夏之氣也寒在外熱在內則卵縮此三冬之氣也足太陽膀胱之脈逆上迎手太陽小腸之脈下行至足厥陰肝之脈不得伸其任脈並厥陰之脈逆則如巨川之水致陽氣下墜是風寒濕熱下出囊中致兩睪腫大謂之曰疝太甚則為㿗足厥陰之脈與大腸膀胱寒水之脈同至前陰之末傷寒家說足厥陰肝經為病煩滿囊縮急下之宜大承氣湯以瀉大熱靈樞經云足厥陰肝經筋中為寒則筋攣卵縮為大寒前說囊縮為大熱此說為大寒此說囊縮垂睪下引㿗疝腳氣為大寒風濕盛下垂為寒與上二說不同何也曰以平康不病人論之夏暑大熱囊卵纍垂冬天大寒急縮收上於前三說又不同何也是相乖耶不相乖耶答曰傷寒家囊卵縮大熱在內宜承氣湯急下之與經筋說囊卵縮大寒在外亦是熱在內與傷寒家同故再引平康人以證之冬天陽氣在內陰氣在外人亦應之故寒在外則皮急皮急則囊縮夏月陰氣在內陽氣在外人亦應之故熱在外則皮緩皮緩則囊垂此㿗疝之象也三說雖殊皆一理也用藥者宜詳而審之以上三論各有所主兼此考訂則脈證陰陽寒熱虛實之辨判然矣狐疝臥則入腹立則出腹偏入囊中者是也海藏仲景療陰狐疝氣有大小時時上下者蜘蛛散主之狐夜伏而晝見以見疝處厥陰之分即人之陰篡隱奧之所晝下而夜上故以狐疝名焉蜘蛛十四枚焦炒桂半錢要人厥陰取其肉厚者上為散每服一錢蜜丸亦可雷公云凡使勿用五色者兼大身上有刺毛生者並薄小者以上皆不堪用須用屋西南有網身小尻大腹內有蒼黃膿者真也凡用去頭足了研如膏投藥中用此余之方法若仲景炒焦用全無功矣一方治水㿗偏大上下不定疼痛不止牡蠣不拘多少鹽泥固濟炭三斤煅令火盡冷取二兩乾薑一兩焙為細末二味和勻冷水調得所塗病處小便大利即愈內經刺灸狐疝但取足厥陰一經經云肝足厥陰之脈所生病者狐疝是也隨其經盛虛寒熱陷下取之也甲狐疝太衝主之陰股內痛氣癰狐疝走上下引少腹痛不可俯仰上下商丘主之狐疝驚悸少氣巨缺主之心婦人疝瘕結核疼痛發作無時日出穴夜入穴或負重即下稍輕即止此狐疝也天井五分肘尖五分小壯汗出則愈氣海三寸又互換東西上下向病所各進三寸瀉之中極三寸立愈耳後陷者腎下腎下則腰尻痛不可俯仰為狐疝全文見診産後少腹痛並見産後腹痛門閉癃遺溺遺尿者溺出不自知覺也閉癃者溺閉不通而淋瀝滴點也惟肝與督脈三焦膀胱主之肝脈督脈主之者經云肝足厥陰之脈過陰器所生病者遺溺閉癃又云督脈者女子入系廷孔其孔溺孔之端也其男子循莖下至篡與女子等其生病癃痔遺溺故遺溺閉癃皆取厥陰俞穴及督脈俞穴也三焦主之者經云三焦下脈在於足太陽之前少陽之後出於膕中外廉名曰委陽足太陽絡也三焦者足太陽少陽之所將太陽之別也上踝五寸別入貫腨腸出於委陽並太陽之正入絡膀胱約下焦實則閉癃虛則遺溺遺溺則補之閉癃則瀉之是也膀胱主之者經云膀胱不利為癃不約為遺溺是也然遺溺閉癃不取膀胱腧穴者蓋膀胱但藏溺其出溺皆從三焦及肝督脈也閉癃分二病閉癃合而言之一病也分而言之有暴久之殊蓋閉者暴病為溺閉點滴不出俗名小便不通是也癃者久病為溺癃淋瀝點滴而出一日數十次或百次名淋病是也今分其病立為二門小便不通垣小便不利在氣在血之異夫小便者足太陽膀胱所主長生於申申者西方金也金能生水金者肺也肺中伏熱水不能生是絶小便之源也人法象天地膀胱之源自頭項下至於足故曰陽中之陰如渴而小便不通者肺不能降是也治法皆用清燥金之正化氣味薄之藥茯苓豬苓澤瀉琥珀燈心通草車前子瞿麥萹蓄之類皆為淡滲之藥能瀉肺火而清肺金滋水之化源也若不渴熱在下焦是絶其流而溺不泄也須用氣味俱厚陰中之陰藥治之二者之病一居上焦在氣分而必渴一居下焦在血分而不渴血中有濕故不渴也二者之殊至易分別耳清肺散治渴而小便閉或黃或澀邪熱在氣分也茯苓二錢豬苓三錢澤瀉三錢琥珀五分燈心二分木通七分通草二分車前子一錢炒瞿麥五分萹蓄七分桂五分上為末每服五錢水煎熱服五苓散八正散亦宜用之仲豬苓湯治脈浮發熱渴而小便不利方見傷寒五苓散治煩渴飲水過多或多水入即吐心中淡淡小便不利方見傷寒茯苓戎鹽湯方茯苓半斤白朮二兩戎鹽彈丸大一枚上三味為末白湯調下百小便不通車前子草一斤水三升煎取一升半分作三服垣滋腎丸治下焦陰虛腳膝軟無力陰汗陰痿足熱不能履地不渴而小便閉者邪熱在血分也黃柏二兩酒洗焙知母二兩酒洗焙肉桂二錢內經云熱者寒之又云腎惡燥急食辛以潤之以黃柏之苦寒瀉熱補水潤燥故以為君以知母苦寒瀉腎火故以為佐肉桂辛熱寒因熱用也上為細末熟水為丸如雞豆大每服百丸加至二百丸煎百沸湯下空心服昔長安有大賈王善夫病小便不通漸成中滿腹大堅硬如石壅塞之極腿腳腫脹破裂出黃水雙睛凸出晝夜不得眠飲食不下苦痛不可名狀求豫治之因問受病之始知病不渴近苦嘔噦衆醫皆用治中滿利小便滲淡之藥急難措手乃辭歸從夜至旦耿耿不寢窮究其理忽記素問有云無陽則陰無以生無陰則陽無以化又云膀胱州都之官津液藏焉氣化則能出矣此病小便癃閉是無陰而陽氣不化者也凡利小便之藥皆淡味滲泄為陽止是氣藥陽中之陰非北方寒水陰中之陰所化者此乃奉養太過膏粱積熱損北方之陰腎水不足故膀胱腎之室久而乾涸小便不化火又逆上而為嘔噦非膈上所生也獨為關非格病也潔古老人曰熱在下焦填塞不便是治關格之法今病者內關外格之病悉具死在旦夕但治下焦可愈隨處以稟北方寒水所化大苦寒氣味俱陰者黃柏知母桂為引用丸如桐子大沸湯下二百丸服藥少時須臾前陰如刀刺火燒之痛溺出如瀑泉湧出臥具皆濕床下成流顧盼之間腫脹消散豫驚喜曰大哉聖人之言豈可不遍覽而執一者也其證小便閉塞而不渴時見躁者是也凡諸病居下焦皆不渴也二者之病在氣在血最易分別潔黃連丸治因服熱藥過小便不利諸藥莫能效者或臍下痛不可忍者黃連炒黃柏炒甘草各等分上㕮咀水煎溫服食前如更不通加知母此藥助氣使氣得化則通矣羅白花散治小便不通膀胱有熱用朴硝不以多少為細末每服二錢煎茴香湯調下食前簡要先用茴香酒調垣導氣除燥湯治小便不通乃血濕致氣不通而竅澀之症知母三分酒洗黃柏四錢滑石二錢炒黃澤瀉三分茯苓二錢去皮上和勻每服半兩水煎稍熱空心服如急閉小便不拘時候鬥小便不通用蚯蚓杵以冷水攄過濃服半碗立通大解熱疾不知人事欲死者服之效仲小便不利者有水氣其人苦渴栝蔞瞿麥丸主之栝蔞根二兩茯苓薯蕷各三兩附子一枚炮瞿麥一兩上五味末煉蜜丸如桐子大服三丸日三服不知增至七八丸以小便利腹中溫謂之知小便不通腹下痛狀如覆碗痛悶難忍者乃腸胃乾涸膻中氣不下故經所謂膀胱者州都之官津液藏焉氣化則能出矣故膻中者臣使之官三焦相火腎為氣海也王注曰膀胱津液之府胞內居之少腹處間毛內藏胞器若得氣海之氣施化則溲便注下氣海之氣不及則隱祕不通故不得便利也先用木香沉香各三錢酒調下或八正散甚則宜上湧之令氣通達便自通利經所謂病在下上取之王注曰熱攻於上不利於下氣盛於上則溫辛散之苦以利之一方煎陳皮茯苓湯調木香沉香末服之空心下丹小便不通屬氣虛血虛有實熱痰氣閉塞皆宜吐之以提其氣氣升則水自降蓋氣承載其水者也氣虛用參朮升麻等先服後吐或就參耆藥中調理吐之血虛用四物湯先服後吐或就芎歸湯探吐之痰多二陳湯先服後探吐之痰氣閉塞二陳湯加香附木通探吐之實熱當利之或用八正散蓋大便動則小便自通矣丹治一男子小便不通用吐法一吐便如注論見治虛實法病在下取之上條仲小便不利蒲灰散滑石白魚散茯苓戎鹽湯主之蒲灰發灰本草消汙血滑石丹溪云逐汙血蒲灰散方蒲灰七分恐即蒲黃粉滑石三分上二味杵為散飲服五分方寸匕日三服滑石白魚散方滑石二分亂髮二分燒白魚二分衣魚也上三味杵為散飲服五分匕日三服無發灰散治臍下急滿小便不通用發灰研細每用二錢米醋二合調服一法與葵子等分為末飲服二錢訖即炒黑豆葉蓋其上即通丹溪云髮鬢補陰之功甚捷本桃仁煎治婦人積血頃在毗陵有一貴宦妻妾小便不通臍腹脹痛不可忍衆醫皆作淋治如八正散之類數種皆治不通病愈甚豫診之曰此血瘕也非瞑眩藥不可去豫用此藥初服至日午大痛不可忍臥少頃下血塊如拳者數枚小便如黑豆汁一二升痛止得愈此藥猛烈大峻氣虛血弱者宜斟酌之桃仁大黃朴硝各一兩虻蟲半兩炒黑上四味為末以醇醋二升半銀石器內慢火煎取一升五合下大黃桃仁虻蟲等不住手攪良久出之丸如梧子大前一日不晚食五更初溫酒吞下五丸日午取下如赤豆汁或如雞肝蝦蟆衣狀未下再作如見鮮血即止續以調血氣藥補之此方出千金此方不可妄用上四方治汙血小便不利前三方輕劑可用後一方峻劑須認得分曉用之丹呂仲年六十六歲病傷寒得汗熱退後脈尚洪此洪脈作虛脈論與人參黃耆白朮炙甘草當歸芍藥陳皮數日其脈仍大未收斂又小便不通小腹下妨悶頗為所苦但仰臥則點滴而出豫曰補藥服之未至前藥倍加黃耆人參大劑與服兩日小便方利小腹痛脹如覆碗為實其法有二氣壅塞於下者用吐法以提之血汙於下者用桃仁之類以破之二方並見血氣條世治小便閟用大田螺生去殼搗細封臍上即通治傷寒後小便不通用生薑八九塊杵碎水十餘碗麻布五六尺同煎數沸用桶盛至候通手以布頻尉小腹良久恰用紅豆末一匕江茶二匕井花水調服神效小便如注本治小便難小腹脹滿不急治殺人用蔥白一斤細銼炒令熱以帕子裹分作兩處更替尉臍下即通玄陰陽關格前後不通利大便小水自行中有轉胞之證諸藥不效無救則脹滿悶亂而死豫曾以甘遂末水調敷臍下內以甘草節湯飲之藥汁至臍二藥相反而胞自轉矣小水來如湧泉此救急之良法也聖治小便難腹滿悶不急療之殺人用秦艽一兩去苗以水一大盞煎取七分去渣每於食前作兩服瘥世治小便不通用大杏仁二十一枚研水調分作二服效杏仁紫菀利小水解肺郁郁解則氣自降而小便去矣千治婦人卒不得小便用紫菀末以井花水服三撮便通小便血五撮立止外若小便不通數病而微腫方取陳筆頭一枚燒為灰和水服之此方未詳經云腎合膀胱膀胱者津液之府也小腸屬腎腎上連肺故將兩臟三焦者中瀆之府也水液出焉是屬膀胱乃腎之府也又云膀胱者州都之官津液藏焉氣化則能出矣由是言之膀胱藏水三焦出水治小便不利故刺灸法但取三焦穴不取膀胱也小腸屬腎肺故東垣用清肺飲子滋腎丸利小便是也運氣小便不利有三其一屬濕邪攻三焦經云太陰在泉濕淫所勝病小腹痛腫不得小便又云水不及曰涸流涸流之紀上宮與正宮同其病癃閉是也其二屬風邪攻脾經云厥陰司天風淫所勝病溏瘕泄水閉是也其三屬燥熱經云陽明司天之政天氣急地氣明民病癃閉初之氣其病小便黃赤甚則淋又云少陰司天之政地氣肅天氣明二之氣其病淋是也內經刺灸小便不利法有五其一取肝經云肝足厥陰之脈所生病者癃閉又云小腹滿身寒熱小便不利取足厥陰又云癃取陰蹺及三毛上及血絡出血是也其二取三焦經云三焦病者腹氣滿小腹丸堅不得小便窘急溢則水流即為脹候在足太陽之外大絡大絡在足太陽少陽之間亦見於脈取委陽又云小腹痛腫不得小便邪在三焦約取之太陽大絡大絡委陽視其絡脈與厥陰小絡結而血者當有取之二字是也其三取腎絡經云足少陰之別名曰大鐘當踝後繞跟別走太陽其病實則癃閉取之所別也其四取脾經云足太陰之脈所生病者溏瘕泄水閉視虛實寒熱陷下而施補瀉疾留灸也其五雜取經云內閉不得溲刺足少陰太陽與骶骨上以長針氣逆則取其太陰陽明厥陰甚則取少陰陽明動者之經也經治小便淋瀝或有血以赤根樓蔥近根截一寸許安臍中上以艾灸七壯羅治小便淋澀不通用鹽不以多少炒熱填滿病人臍中卻用艾如箸頭大灸七壯其小便自出摘內陰谷出密語關元八分令病人覺淋瀝三五次為度便揉小腹卻取下穴三陰交三分即透陰谷撮小便閉數不通陰谷一寸五分灸陰陵泉瀉之標又法偏歷集小便閉不通陰陵泉陰谷三陰交氣海關元灸三十壯刺二寸五分不已取下穴太溪陰交東熱淋小便黃腹滿陰陵泉關元各二寸氣衝二七壯石淋不得小便關元三七壯氣門大敦各二七壯血淋氣海丹田各刺灸三七壯小便熱痛目赤尿如血列缺沿皮一寸大陵承漿各五分又法曲骨灸二七壯陰陽二陵泉各二寸五分甲少腹中滿熱閉不得溺足五里取之溺難痛白濁卒疝少腹腫咳逆嘔吐卒陰跳腰痛不可以俯仰面黑熱腹中䐜滿身熱厥痛行間主之癃遺溺鼠鼷痛小便難而白期門主之陰胞有寒小便不利承扶主之筋急身熱少腹堅腫少腹時滿小便難尻股寒髀樞痛外引季脅內控八窖委中主之癃中窖主之胸滿膨膨然實則癃閉腋下腫虛則遺溺腳急兢兢然筋急痛不得大小便腰痛引腹不得俯仰委陽主之小腹脹急小便不利厥氣上頭巔滿谷主之勞痹小便赤難前谷主之氣癃溺黃關元及陰陵泉主之千金云寒熱不節腎病不可俯仰氣癃小便黃氣虛則遺溺石門主之小便難竅中熱實則腹皮痛虛則癢瘙會陰主之淋丹朱郎小便淋痛脈左大右澀此為勞傷經血勿作淋治可補血行肝經滯血自愈生地當歸赤芍各一錢川芎三分條芩三分甘梢三分陳皮五分木通五分黃柏二分炒紅花豆大杜牛膝一錢上桃仁泥研滑石同煎待淋病去退滑石桃仁杜牛膝木通入川牛膝代木通分兩倍之金華申明叔年逾七十因壯年踏冷患腎氣疝痛常食蒼朮烏附等藥二十餘年疝氣少止卻患小便淋痛又十三年其間又服朴硝大黃治諸淋之藥百方俱試並無一效至是年春頸項帶右邊發一疽延及缺盆可尺許不能食淋痛愈加必須叫號其瘡淫潰膿血淋漓精神困憊時正六月診其脈兩手澀短左微是弦狀輕重皆近五至豫謂此瘡皆前烏附等藥積毒所發此淋亦因燥烈之藥凝積滯血滿膀胱況澀脈為敗血短脈為血耗遂令於溺後視之有物出如敗膿者否視之果然因思之忍痛則傷血叫則傷氣遂先治淋令取杜牛膝根莖葉同煎取濃汁卻煎四物湯作大料與服三日後痛漸減前所謂敗膿者至是漸少五七日淋病全安此時瘡亦定蓋四物能生血也但飲食減少瘡未收斂耳遂用參耆當歸白朮四藥大劑於瓦器熬為膏以陳皮半夏縮砂木香煎取清汁調膏藥飲遂能食又一月而瘡安一方名血餘散治血淋內崩吐血舌上出血便血用亂髮以皂角水洗浮曬乾燒灰為末每服二錢以茅根車前葉煎湯調下鬥治五種淋用苧麻根兩莖打碎水一碗半煎半碗頓服即通大妙丹溪云苧根補陰行滯血博治五淋赤芍藥一兩檳榔一個麵裹煨為末每一錢匕水一盞煎至七分空心服氣虛淋八物湯加杜牛膝黃芩汁煎服老人氣虛亦能淋參術中加木通山梔仁八侄淋病脈沉而大此主勞苦傷血下焦蘊結人參歸尾白芍香附五錢條芩木通三錢山梔炒三錢半黃耆五分生甘草梢五分分六帖杜牛膝湯兩盞煎取一盞食前熱飲之胡云六朝奉七十餘因攧後誤與荊芥大黃等藥傷正氣以致惡血結聚今則小便如淋中滿食少以此治之生耆三錢人參二錢歸頭白朮陳皮一錢作一帖煎服又生氣藥縮砂三錢海金沙紅曲二錢檀香二錢木香白豆蔻丁香一錢分六帖研桃仁十四枚入生氣散死血作淋牛膝膏妙但虛人能損胃不宜食本治婦人諸般淋苦杖根俗呼杜牛膝多取洗淨碎之以一合用水五盞煎至一盞去渣入麝香乳香少許研調下鄞縣武尉耿夢得其內人患砂石淋者十三年矣每漩痛楚不可忍溺器中小便下砂石剝剝有聲百方不效偶有此方啜之一夕而愈目所見也千用牛膝以酒煮服治小便淋痛肘後方用牛膝根莖葉亦以酒煮服治小便不利莖中痛欲死及治婦人血結堅痛如神蓋牛膝治淋之聖藥也但虛人當用補劑監治之耳世茄樹散治放尿有血帶血線童子小便煎茄樹根汁服之效羅琥珀散治五淋瀝澀痛小便有膿血出琥珀研海金沙研沒藥研蒲黃各一兩研上研為細末每服三錢食前煎萱草根湯調下日三服黃明之小便澀莖中痛不可忍相引脅下痛制以茯苓琥珀湯主之川楝子去核銼炒甘草生各一錢人參五分玄胡索七分茯苓四分琥珀澤瀉歸梢柴胡各三分上㕮咀都作一服長流水三盞煎至一盞去渣溫服空心食前數服大效瑞治諸般砂石淋琥珀二錢研細空心用蔥白頭濃煎湯調下無問諸般淋證一二服立效丹溪云琥珀古今方用以利小便若血少不利者反受其滲急之苦耳本草琥珀消汙血極驗無鹿角霜丸治膏淋鹿角霜白茯苓秋石各等分上為末糊丸如桐子大每服五十丸米飲下圖治石淋導水用螻蛄一枚鹽二兩同於新瓦上鋪蓋焙乾研末溫酒調下一錢匕服之即愈靈苑治五種淋疾氣淋熱淋勞淋石淋及小便不通至甚者透膈散用硝石一兩不夾泥士雪白者研為末每服二錢諸淋各依湯使如勞倦虛損小便不出小腹急痛葵子煎湯下通後更須服補虛丸散血淋小便不出時下血疼痛並用冷水調下氣淋小腹滿急尿後常有餘瀝木通煎湯下石淋莖內痛尿不能出內引小腹膨脹急痛尿下砂石令人悶絶將藥末先入銚子內隔紙炒至紙焦為度再研令細用溫水調下小便不通小麥湯下卒患諸淋並以冷水調下並空心先調使藥消散如水即服之更以湯使送下服藥未效者服此立愈子和百亭劉十三之子年六歲病砂石淋戴人以苦劑三湧之以益腎散三下之立愈鹿邑一閥閲之家有子二十三歲病膏淋三年矣鄉中醫不能治往京師遍訪多作虛損補以溫燥灼以針艾無少減聞戴人僑居㶏東見戴人曰惑蠱之疾也亦曰白淫實由少腹熱非虛也可以湧以泄其人以時暑憚其法峻不決者三日浮屠一僧曰豫亦有暑病近覺頭痛戴人曰亦可湧願與君同之毋畏之於是湧痰三升色如黑礬汁內有死血並黃緑水又瀉積穢數行尋覺病去方其來時面無人色及治畢次日面如醉戴人慮其暑月路遠又處數方使歸以自備云屈村張氏小兒年十四歲病約一年半矣得之夏秋發則小便大痛至握其峻跳躍旋轉號呼不已小便數日不得下下則成砂石大便祕澀肛門脫出一二寸諸醫不能治求治於戴人戴人曰今日治今日效時日在辰巳間矣以調胃承氣僅一兩加牽牛頭末二錢汲河水煎之令作三五度咽之又服苦末丸如芥子許六十丸日加晡上湧下泄一時齊出有膿有血湧泄既覺定令飲新汲水一大盞小溲已利一二次矣是夜凡飲新水二三十遍病去九分止哭一次明日困臥如醉自晨至暮猛然起走索食於母歌笑自得頓釋所苦繼以太白散八正散等調理一日大瘥恐暑天失所養留五日而歸戴人曰此下焦約也不吐不下則下焦何以開不令飲水則小便何以利大抵源清則流清也苦末丸未詳考丹諸淋皆屬於熱余每用黃柏滋腎丸每百丸用四物湯加甘草梢杜牛膝木通桃仁滑石木香煎湯空心吞服兼灸三陰交如鼓應桴纍試纍效者保淋閟者涼膈散加滑石四兩茯苓一兩涼膈散方見治發熱羅石葦散治腎氣不足膀胱有熱水道不通淋澀不宣出少起數臍腹急痛或尿如豆汁或便出砂石並皆治之木通石葦滑石各二兩炙甘草王不留行當歸各一兩白朮瞿麥芍藥葵子各二兩上為細末每服二錢小麥粥湯調下空心服一方加沉香陳皮無滑石瞿麥白朮木通本治心經熱小便澀及治五淋火府丹生地木通黃芩甘草上為細末煉蜜杵丸如桐子大每服二十粒木通煎湯下此藥治淋澀臍下滿痛上二方解熱利小便兼補之劑無石燕丸治石淋多因憂鬱氣注下焦結所食鹹氣而成令人小便磣痛不可忍出砂石而後小便通石燕燒令通赤水中淬三次搗研水飛焙乾滑石石葦去毛瞿麥穗各一兩上為末糊丸桐子大煎瞿麥燈心湯下十丸食前服日二三羅海金沙散治小便淋澀及下焦濕熱氣不施化或五種淋疾癃閉不通海金沙研木通瞿麥穗滑石通草各半兩杏仁湯洗去皮尖麩炒一兩上為細末入燈心同煎空心服八正散治小便赤澀或淋閉不通及熱淋並宜服之大黃麵裹煨木通瞿麥滑石萹蓄車前子山梔仁甘草各等分上為末入燈心同煎小兒少少與之潔葵花散治小便淋澀經驗葵花根一味洗淨銼水煎至七沸服之立效味甘寒世葛粉丸治男女淋病疼痛效速勿輕忽之砂糖本草云治心肺大腸熱葛粉和丸如桐子大井花水化開一二丸治血石淋楊樹蛀屑烏梅一大棗三水一盞煎服靈苑治卒患諸淋遺澀不止小腸赤澀疼痛三葉酸漿草人家園林亭檻中著地開黃花味酸者是取嫩者淨洗研絞自然汁一合用酒一合攪勻空心服之立通三葉酸漿草即布穀飯詳見白帶門無葎草汁治膏淋及尿血葎草搗汁二升醋二合和空腹服一盞又濃煮汁飲亦治淋瀝尿血葎草俗名辣母藤又名葛勒蔓處處籬牆上有之胞移熱於膀胱則癃溺血全文見診病傳變胞謂女子胞也素痹論云胞痹者小腹膀胱按之內痛若沃以湯澀於小便上為清涕夫膀胱為州都之官津液藏焉氣化則能出矣今風寒濕邪氣客於胞中則氣不能化出故胞滿而水道不通其小腹膀胱按之內痛若沃以湯澀於小便以足太陽經其直行者上交巔入絡腦下灌鼻竅則為清涕也治胞痹小便不通腎著湯千金河間方同赤茯苓去皮白朮各四兩甘草炙二兩乾薑炮一兩上為末每服五錢水二盞煎至一盞去渣溫服日三茯苓丸治胞痹小便內痛赤茯苓防風細辛白朮澤瀉官桂各半兩栝蔞根紫菀附子黃耆芍藥甘草炙各三分生地牛膝酒浸山芋獨活半夏湯浸山茱萸各一分上十八味為細末煉蜜丸如桐子大每服十丸溫酒送下食前巴戟丸治胞痹臍腹痛小便不利巴戟去心一兩半桑螵蛸麩炒遠志去心生地山芋附子炮續斷各一兩肉蓯蓉酒浸一兩杜仲炙石斛鹿茸酥炙龍骨菟絲子五味子山茱萸官桂各三錢上十六味為細末煉蜜丸如桐子大溫酒下三十丸空心食前腎瀝湯治胞痹小腹急小便不利桑白皮炒犀角屑杜仲炙去絲五加皮麥門冬木通桔梗各一兩赤芍藥五錢上八味為粗末每服五錢水一盞半羊腎一個切竹瀝少許同煎去渣溫服諸淋皆屬於熱古方有冷淋蓋十百之一也今因胞痹屬風寒濕故主寒條無瞑眩膏治諸淋疼痛不可忍受及砂石淋大蘿蔔切一指厚四五片好白蜜淹少時安淨鐵鏟上慢火炙乾又蘸又炙盡蜜二兩翻覆炙令香軟不可焦候蜜盡細嚼以鹽湯一盞送下立效聖治冷淋小腸不利莖中急痛用槲葉搗末每服二錢水一盞蔥白七寸煎六分去渣食前溫服崔療石淋便中有石子者胡桃肉一升細米煮漿粥一升相和頓服即瘥胡桃性熱運氣小便淋氣及針灸淋閟法並見小便淋閟門仲淋家不可發汗發汗則便血淋之為病小便如粟狀小腹弦急痛引臍中腎脈滑實為癃㿉脾脈滑甚為㿉癃全文見治虛實法脈少陰脈數婦人則陰中生瘡男子則氣淋素病有癃者一日數十溲此不足也身熱如炭頸膺如格人迎躁盛喘息氣逆此有餘也太陰脈細微如發者此不足也其病安在名為何病岐伯曰病在太陰其盛在胃頗在肺病名曰厥死不治奇病論癃病脈細不治胎前淋閉丹轉胞病胎婦稟受弱者憂悶多者性急躁者食味厚者大率有之古方皆用滑利疏導藥鮮有應效因思胞為胎所壓展在一邊胞系了戾不通耳胎若舉起懸在中央胞系得疏水道自行然胎之墜下必有其由一日吳宅龍人患此脈之兩手似澀重取則弦左手稍和豫曰此得之憂患澀為血少氣多弦為有飲血少則胞弱而不能自舉氣多有飲中焦不清而溢則胞知所避而就下故喜墜遂以四物湯加參朮半夏陳皮生甘草生薑空心飲隨以指探喉中吐出藥汁候少頃氣定又與一帖次日亦然如是八帖而安此法果為的確恐偶中耳後有數人歷歷有效未知果何如耶仲景云婦人本肌盛頭舉身滿今反羸瘦頭舉中空減胞系了戾亦致胞轉其義未詳必有能知之者一婦人四十一歲妊孕九個月轉胞小便不出三日矣下急腳腫不堪存活來告急豫往視之見其形悴脈之右澀而左稍和此飽食而氣傷胎系弱不能自舉而下墜壓著膀胱偏在一邊氣急為其所閉所以水竅不能出也轉胞之病大率如此豫遂制一方補血養氣血氣既正胎系自舉則不下墜方有安之理遂作人參當歸身尾白芍藥白朮帶白陳皮炙甘草半夏生薑煎湯濃與四帖任其叫啖至次早天明又與四帖藥渣作一帖煎令頓飲之探喉令吐出此藥湯小便立通皆黑水後就此方加大腹皮枳殼青蔥葉縮砂仁二十帖與之以防産前後之虛果得就蓐平安産後亦健一婦人妊娠七八個月患小便不通百醫不能利轉加急脹診其脈細弱豫意其血氣虛弱不然水載其胎故胎重墜下壓住膀胱下口因此溺不得出若服補藥升扶胎起則自下藥力未至愈加急滿遂令一老婦用香油塗手自産門入托起其胎溺出如注脹急頓解一面卻以人參黃耆升麻大劑煮服或少有急滿仍用手托放取溺如此三日後胎漸起小便如故仲問曰婦人病飲食如故煩熱不得臥而反倚息者何也師曰此名轉胞不得溺也以胞系了戾故致此病但利小便則愈宜腎氣丸主之即八味丸方見治法酒下十五丸至二十丸日再服産療小便不通及胞轉桑螵蛸搗末米飲服方寸匕日三仲妊娠有水氣重身小便不利灑淅惡寒起即頭眩葵子茯苓散主之葵子茯苓各三兩上二味杵為散飲服方寸匕日三服小便利則愈妊娠小便難飲食如故歸母苦參丸主之當歸貝母苦參各四兩上三味末煉蜜丸如小豆大飲服三丸加至十丸男子加滑石半兩外治妊娠患子淋豬苓五兩一味為末以白湯三合服方寸匕漸至二匕日二夜一大治妊娠卒不得小便杏仁一味去皮尖搗丸如大緑豆燈心湯吞七粒立利丹朱宅婦人三十餘歲四個月胎大小便閉因與通利冬葵子等藥已通但氣未順此由性急血耗氣亂須和其氣滋其血乃安陳皮青皮芍藥一錢人參歸身尾川芎地黃白朮半兩茯苓木通甘草二分甲小便難水脹滿溺出少胞轉不得溺曲骨主之胞轉不得小便小腹滿關元主之産後淋閉無治産前後淋其法不同産前當安胎産後當去血瞿麥蒲黃最為産後要藥茅根湯治産後諸淋主之白茅根八兩瞿麥葵子二兩白茯苓各四兩人參二兩蒲黃桃膠滑石甘草各一兩紫貝十個燒石首魚枕石煅上銼為散每服四錢水一盞半姜三片燈心二十莖煎至七分去渣溫服亦可為末木通煎湯調下大療産後小便不通用陳皮去白為末空心服酒調二錢一服便通治産後小便不通腹脹如鼓悶亂不醒用鹽填臍中卻以蔥白剝去粗皮十餘根作一縛切作一指厚安鹽上用大艾炷滿蔥餅上以火炙之覺熱氣入腹內即時便通神驗小便數羅中書右丞合刺合孫病小便數而短晝夜約二十餘行臍腸填滿腰腳沉㾀不得安臥季春下旬一日奉敕治之遂往診視脈得沉緩時時帶數常記小便不利有三不可概論若津液偏滲於腸胃大便泄瀉而小便澀少者一也宜利而已若熱搏下焦津液則濕熱不能行者二也必滲瀉則愈若脾胃氣澀不能通調水道下輸膀胱而化者三也可順氣令施化而出今右丞平素膏粱濕熱內蓄不得施行膀胱竅澀是以起頻而見少也非滲泄分利則不能快利遂處一方名曰茯苓琥珀湯內經曰甘緩而淡滲熱搏津液內蓄臍腹脹滿當須緩之泄之必以甘淡為主遂以茯苓為君甘寒滑以利竅澀豬苓琥珀之淡以滲泄利水道故以二味為臣脾惡濕濕氣內蓄則脾氣不舒益脾勝濕必以甘為助故以甘草白朮為佐鹹入腎鹹味湧泄為陰故用澤瀉之咸以泄伏水腎惡燥急食辛以潤之津液不行以辛散之桂枝味辛散濕潤燥故以為使煎長流甘瀾水使不助其腎氣大作湯劑令直達於下而急速也兩服減半旬日良愈茯苓琥珀湯茯苓白朮琥珀各半兩甘草炙桂去皮各三錢澤瀉一兩滑石七錢豬苓半兩上為細末每服五錢煎長流甘瀾水一盞調下空心食前待少時以美膳壓之食主下焦虛冷小便數損無力生薯蕷半斤刮去皮以刀切碎於鐺中煮酒沸下薯蕷不得攪待熟加鹽蔥白更添酒空腹下二三盞妙羅水芝丸治上焦真氣虛弱小便頻數日夜無度蓮肉去皮不以多少用好酒浸一兩宿豬肚一個將酒浸蓮肉入肚中多半為度水煮熟取出蓮肉切焙乾上為細末酒煮麵為丸如芡實大每服五十丸米飲湯下食前世治夜多小便用益智三十四個為末鹽五分水一盞煎八分臨臥溫服本衛真湯治丈夫婦人元氣衰憊榮衛怯弱真陽不固三焦不和上盛下虛夜夢鬼交覺來盜汗面無精光唇口舌燥耳內蟬鳴腰痛背倦心氣虛乏精神不寧驚悸健忘飲食無味日漸瘦悴外腎濕癢夜多小便腫重冷痛牽引小腹足膝緩弱行步艱難婦人血海久冷經候不調或過期不至或一月兩來赤白帶下漏分五色子宮感寒久不成孕並皆治之此藥大能生氣血遇夜半子時腎水旺極之際補腎實臟男子攝血化精諸病未萌之前皆能制治使不復為梗當歸一兩酒浸一宿人參一兩半金叉石斛五兩白茯苓木香肉豆蔻山藥以上各三兩生地二兩熟地溫水洗三兩丁香一兩青皮一兩去白川牛膝二兩童便酒各半盞浸一宿上為細末每三大盞酒調下鹽亦得空心食前一服婦人諸病童便同酒調空心下又方治男子婦人一切虛冷之疾活血駐顏減小便除盜汗治婦人久不生産似帶疾而非時有遺瀝並皆治之功驗不可具述蒼朮切焙川楝子茴香吳茱萸湯洗破故紙胡蘆巴以上各一兩並炒川薑川烏草烏以上各半兩炮山藥二兩上各炮治如法同為細末醋糊為丸如桐子大每服十五丸空心溫酒鹽湯任下婦人艾醋湯下日二服耳目永不昏聾髦發不白衍鄰家有一男子小便日數十次如稠米泔色心神恍惚瘦瘁食減令服桑螵蛸散未終一劑而安此藥能安神魂定心志治健忘小便數補心氣用桑螵蛸遠志菖蒲龍骨人參茯苓當歸龜甲醋炙以上各一兩為末以人參湯調下二錢海姜附石脂神砂丹治小便數而不禁怔忡多忘方見滯下丹因看盧氏醫鏡見此一藥味數分兩同惟丹砂用伏火者及治病有瘥所治者小便數而不禁怔忡多忘魘夢不已不同耳見其不同審而詳之乃得此治法不瘥且泛論之經言腎主大便肝主小便淋溲難經云小腸為赤腸是面赤色及便溺色赤皆出心與小腸南方赤色顯於外也經言下焦如瀆者正謂大小便也大便為陰為有形氣化乃下焦之下者也謂腎主大便不言大腸者明子行父道為腎臟病小便為陽為無形氣化乃下焦之高者也謂肝主小便淋溲亦是子行父道為腑病凡諸無形氣化者皆腑病所主諸有形氣化者皆臟病所主此二證俱在下焦則同但有形無形及在腑在臟有殊俱是丹田衰敗不言心火者以其相火代行君之政令故也細分之則膀胱壬水勝丙火小腸者不傳入陰故為泄血泄血利不禁為有形質病且不傳陰則陰不病何為有形病此為陰之體也為腑之用也天地陰陽互為體用以斯可見是明五臟者為六腑所用六腑者為五臟所用明矣是有形皆為傳陰也大小便不禁是膀胱不禁為遺溺此不傳陰也是丹田胞絡受寒為壬所克大抵諸腑皆乘有形有形病者皆在腑責其所乘皆在臟也用伏火丹砂者去其寒性耳治法同者以其俱在下焦補諸無形同在胞絡耳以其胞與腎相對有渠相通故也腎主大便肝主小便所治安得不殊經曰腎肝同歸一治又曰少陽主骨所生病便溲難膀胱主筋所生病亦可知也小便不禁茯苓湯下大便不禁米飲下此論局方姜附神砂丹而發運氣小便數皆屬火經云少陽之復便數憎風是也小便數惟二臟有之一屬肺經云肺手太陰之脈氣盛有餘則肩背痛風寒汗出中風小便數而缺是也以刺言之瀉手太陰則愈一屬肝經云足厥陰之瘧令人如癃狀而小便不利又云肝痹者夜臥則驚多飲數小便是也視虛實補瀉之則愈東小便數腹痛尿胞在玉泉下一寸屈骨端玉小便多命門隨年壯灸腎俞一分沿皮向外六分補六呼瀉一吸集小便滑數中極灸腎腧陰陵泉不已取下穴氣海陰谷三陰交溺赤諸病水液渾濁皆屬於熱全文見診小便黃者少腹中有熱也全文見水腫小便黃無如黃柏知母效脈尺澀足脛逆冷小便赤宜服附子四逆湯足太衝補之臟腑小便黃有四一屬肝熱經云肝熱病者小便先黃是也二屬胃實經云胃足陽明之脈氣盛則身以前皆熱其有餘於胃則消穀善飢溺色黃是也三屬肺虛經云肺手太陰之脈氣虛則肩背痛寒少氣不足以息溺色變故耳四屬腎虛經云冬脈者腎脈也冬脈不及則令人䏚清脊痛小便變是也運氣小便黃有二一屬風經云厥陰之勝胠脅氣並化而為熱小便黃赤是也二屬熱經云少陰司天熱淫所勝病溺色變又云少陽之勝溺赤善驚又云陽明司天燥氣下臨暴熱至乃暑陽氣鬱發小便變是也蓋暴熱謂地氣少陰之熱也邪之所在皆為不足中氣不足溲便為之變補足外踝下留之全文見刺虛實法甲小腸有熱溺赤黃中脘主之溺黃下廉主之小便黃赤完骨主之小便黃腸鳴相追逐上廉主之遺溺垣小便遺失者肺金虛也宜安臥養氣禁勞役以黃耆人參之類補之不愈當責有熱加黃柏生地甲乙云肺脈則少氣不足以息卒遺失無度下虛謂膀胱下焦虛經云水泉不止者是膀胱不藏也仲景云下焦竭則遺溺失便其氣不能自禁制不須治久則愈又云下焦不歸則遺溲世用桑螵蛸雞䏶胵之類是也丹治遺溺桑螵蛸酒炒為末薑湯送下二錢妙無雞內金散治溺床失禁雞䏶胵一具並腸洗淨燒為灰男用雌女用雄即是雞肫內黃皮研為末每服二錢酒飲調服妙又方用羊肚系盛水滿線縛兩頭煮熟取中水頓服之瘥山大人遺溺不知薔薇根細研酒下丹鹿茸丸治久虛冷小便自濁滑數不禁鹿茸椒紅桂附子牡蠣石斛補骨脂肉蓯蓉雞䏶胵沉香各一兩桑螵蛸三分上為末酒糊丸桐子大食前酒下三十丸此方因沉香解諸澀故丹溪取之又云鹿角屑炒黃為末溫酒下二錢妙本草云鹿角逐陰中邪氣惡血鹿茸丸方見虛條河熱甚客於腎部手足厥陰之經廷孔鬱結極甚而氣血不能宣通則痿痹神無所用故津液滲入膀胱而旋溺遺失不能收禁也經曰目得血而能視耳得血而能聽手指得血而能攝掌得血而能握足得血而能走髒得血而能液腑得血而能氣然血所通流則氣亦然也氣血先行則其中神自清和而應機能為用矣故經曰血氣者人之神不可不謹養也故諸所運動時習之則氣血通利而能為用閉塞之則氣血行微而其道不得通利故劣弱也若病熱極甚則鬱結而氣血不能宣通神無所用而不遂其機隨其鬱結之微甚而有不用之大小焉是故目鬱則不能視色耳鬱則不能聽聲鼻鬱則不能聞香臭舌鬱則不能知味至如筋痿骨痹諸所出不能為用皆鬱結之所致也丹千金翼白薇散治尿出不知時白薇本草云氣大寒白芍藥各等分上為末溫酒調下方寸匕日三服食前嘗治一男子遺溺不覺脈洪大盛以黃柏知母杜牛膝為君青皮甘草為臣木香為佐桂些少反佐服數帖大效此法與前白薇散皆河間所謂熱甚廷孔鬱結神無所用不能收禁之意也世神芎導水丸治遺尿有實熱者每百丸空心白湯下若一服利止後服前法河間所謂廷孔鬱結不能收禁此所謂淫氣遺溺痹聚在腎痹謂氣血不通宣也無茯苓丸治心腎俱虛神志不守小便淋瀝不禁及遺泄白濁赤茯苓白茯苓上為末以新汲水挪洗澄去新沫控干別取地黃汁同好酒銀石器內熬成膏搜和為丸如桐子大空心熱酒嚼下世用薏苡仁鹽炒煎服效方見小兒本燕蓐草主眠中遺溺不覺燒令黑研水進方寸匕亦主噦氣即燕窠中草也膀胱咳者咳而遺溺全文見咳針灸遺溺法有四其一取肝其二取督脈其三取三焦並見遺溺閉癃門其四取肺經云手太陰之別名曰列缺其病虛則缺㰦小便遺數取之去腕一寸別走陽明者是也東遺尿失禁陰陵泉陽陵泉二寸半大敦七壯又方曲骨陰陽二陵泉各二寸半甲遺溺關門及神門委中主之氣癃小便黃氣滿虛則遺溺石門主之肝脈微滑為遺溺全文見治法妊娠遺尿大白薇散治妊娠不知尿出時方見前熱條産後一味桑螵蛸散治妊娠小便數不禁方見前下虛條又方用雞尾毛燒灰末酒調方寸匕産後遺尿無婦人産蓐産理不順致傷膀胱遺尿無時丹嘗見尿胞因收生者不謹以致破損而得淋瀝病遂為廢疾一日有徐婦年壯難産得此因思肌肉破傷在外者宜可補完胞雖在腹恐亦可治遂診其脈虛甚豫曰難産之由多是氣虛産後血氣尤虛試與峻補因以參朮為君芎歸為臣桃仁陳皮黃耆茯苓為佐煎以豬羊胞中湯極飢時飲之但劑小率用一兩至一月而安蓋令氣血驟長其胞自完恐稍緩亦難成功矣喬町婦人産後尿不禁面微浮略發熱於午後此膀胱為坐婆所傷黃耆歸身尾芍藥各一錢半白朮一錢人參陳皮五分甘草炙些上煎熱飲之云桑螵蛸散治産後小便數及遺尿桑螵蛸三十個炒鹿茸酥炒黃耆各三兩牡蠣煅人參赤石脂厚朴各三兩上為細末空心米飲調下三錢匕又方桑螵蛸半兩炒龍骨一兩上為細末米飲調下二錢空心前陰諸疾前陰諸疾前陰所過之脈有二一曰肝脈二曰督脈經云肝足厥陰之脈入毛中過陰器抵少腹是肝脈所過也又云督脈者起於少腹以下骨中央女子入系廷孔循陰器男子循莖下至篡與女子等是督脈所過也陰縮陰縱陰縮謂前陰受寒入腹內也陰縱謂前陰受熱挺長不收也經曰足厥陰之筋傷於寒則陰縮入傷於熱則縱挺不收治在行水清陰氣是也丹鮑兄二十餘歲玉莖挺長腫而痿皮塌常潤磨股不能行兩脅氣上手足倦弱先以小柴胡加黃連大劑行其濕熱略加黃柏降其逆上之氣其挺腫漸收漸減及半但莖中有堅塊未消遂以青皮一味為君佐以散風之劑末服外以絲瓜汁調五倍子末敷而愈平江王氏子年三十歲忽陰挺長腫而痛脈數而實用朴硝荊芥湯浸洗又用三一承氣湯大下之愈內經刺灸前陰挺長之法有一經云足厥陰之別名曰蠡溝去內踝五寸別走少陽其病實則挺長取之所別是也明堂陰卵入腹臍下六寸兩旁各一寸六分灸二七壯內經診陰縮而死者皆屬肝傷經云肝悲哀動中則傷魂魂傷則狂妄不精不精則不正當陰縮而攣筋兩脅骨不舉毛悴色夭死於秋又云厥陰終者喜溺舌卷卵上縮是也陰痿陰汗陰冷陰癢陰痿皆耗散過度傷於肝筋所致經云足厥陰之經其病傷於內則不起是也垣陰痿陰汗臊臭論一富者前陰間嘗聞臊臭又因連日飲酒腹中不和求豫治之豫應之曰夫前陰者足厥陰之脈絡陰器出其挺末臭者心之所走散入於五方為臭入肝為臊臭此其一也當於肝經中瀉行間是治其本後於心經中瀉少衝以治其標如惡針當用藥除之治法當求其本連日飲酒夫酒者氣味俱陽能生濕熱是風濕熱合於下焦為邪故經云下焦如瀆又云在下者引而竭之酒者是濕熱之水亦宜決前陰以去之是合下焦二法治之龍膽瀉肝湯治陰部時復濕癢有臊臭柴胡梢澤瀉各一錢車前子木通各五分當歸梢龍膽草生地各三分上銼如麻豆大作一服水三大盞煎至一盞去渣稍熱服空心宿食消盡服便以美膳壓之柴胡入肝為引用澤瀉車前子木通其淡滲之味利小便亦除臊臭是名在下者引而竭之生地黃草龍膽之苦寒瀉酒濕熱更兼車前子之類以徹肝中邪氣肝主血用當歸以滋肝中血不足也固真湯治兩丸冷前陰痿弱陰汗如水小便後有余滴臊氣尻臀並前陰冷惡寒而喜熱膝亦冷正月內定此方升麻柴胡羌活各一錢甘草炙澤瀉各一錢半草龍膽炒知母炒黃柏各二錢上銼如麻豆大水三盞煎至一盞去渣稍熱空腹服以美膳壓之溫腎湯治面色痿黃身黃腳軟弱無力陰汗陰莖有夭色二月定此方麻黃六分防風根一錢五分白朮一錢蒼朮一錢半澤瀉二錢豬苓升麻白茯苓黃柏酒各一錢柴胡梢六分上件分作二服每服水二大盞煎至一盞去渣稍熱服食前天晴明服之候一時辰許方食補肝湯治前陰如冰冷並冷汗兩腳痿弱無力黃耆七分人參葛根各三分甘草炙五分升麻四分知母柴胡羌活陳皮歸身黃柏炒防風白茯苓澤瀉各二分蒼朮五分曲末二分豬苓四分連翹二分上㕮咀水二大盞煎至一盞去渣稍熱服食前忌酒濕面清震湯治溺黃臊臭淋瀝兩丸如冰陰汗浸兩股陰頭亦冷正值十二月天寒凜冽霜雪交集寒之極矣升麻五分柴胡二分羌活一錢黃柏一錢酒蒼朮五分防風三分甘草炙二分藁本三分紅花一分歸身二分豬苓三分澤瀉黃芩五分麻黃根三分上銼如麻豆大都作一服水二大盞煎至一盞去渣臨臥服忌酒濕面柴胡勝濕湯治兩外腎冷兩髀樞陰汗前陰痿弱陰囊濕癢臊氣澤瀉一錢半羌活一錢半升麻一錢半生甘草柴胡各三錢草龍膽一錢黃柏酒二錢紅花少許當歸梢麻黃漢防己茯苓各一錢五味子二十個上㕮咀水三大盞煎至一盞去渣稍熱服食前忌酒濕面房事垣仲景八味丸治陽事多痿不振今依全方夏減桂附一半春秋三停減一疾去精足全減桂附只依六味地黃丸八味方見治法腎脈大甚為陰痿全文見診運氣陰痿皆屬濕土製腎經云太陰司天濕氣下臨腎氣上從陰痿氣衰而不舉是也椒粉散治前陰兩丸濕癢秋冬尤甚冬月減麻黃一錢黑狗脊五分斑蝥二個豬苓三分肉桂二分歸梢三分輕粉少許紅花少許蛇床子五分川椒三分上為極細末滲上避風寒濕冷處坐臥丹腎囊濕癢先以吳茱萸煎湯洗之後用吳茱萸半兩寒水石三錢黃柏二錢半樟腦蛇床子各半兩輕粉一錢白礬三錢硫黃二錢檳榔三錢白芷三錢為末摻之千有人陰冷漸漸冷氣入陰囊腫滿恐死日夜痛悶不得眠取生椒擇之洗淨以布帛裹著丸囊令厚半寸須臾熱氣大通日再易之取出瘥本曾有人陰冷漸次冷氣入陰囊腫滿晝夜疼悶不得眠煮大薊汁服立瘥內經針灸陰暴癢痛足厥陰之別名曰蠡溝上內踝五寸是也全文見針灸門撮陰痿關元補陰濕陰谷寸半瀉灸怪穴陰中濕癢外腎生瘡海底在脬囊底十字文縫中灸瀉二十七壯獨陰在足第二指節下橫文灸瀉二十七壯陰臭陰腫陰痛陰吹溪婦人陰腫腎痛枳實半斤切碎炒熱布裹包尉之冷即易祕録交接勞復陰卵痛是勞復陰陽易仲胃氣下泄陰吹而正喧此穀氣之實也膏發煎導之方見黃疸潔男子陰頭痛女子陰中痛大敦集陰莖虛痛中極太溪三陰交復溜不已取血郤陰陵泉關元海底甲婦人陰中痛少腹堅急痛陰陵泉主之女子陰中寒歸來主之筋靈足太陽之筋起於足小指上結於踝邪上結於膝其下循足外側結於踵上循跟結於膕其別者結於踹外上膕中內廉與膕中並上結於臀上挾脊上項其支者別入結於舌本其直者結於枕骨上頭下顏結於鼻其支者為目上網下結於頄其支者從腋後外廉結於肩髃其支者入腋下上出缺盆上結於完骨其支者出缺盆邪上出於頄其病小指支跟腫痛膕攣脊反折項筋急肩不舉腋支缺盆中紐痛不可左右搖治在燔針劫刺以知為數以痛為輸名曰仲春痹也以知為數以痛為輸者言經筋病用燔針之法但以知覺所針之病應效為度數非如取經脈法有幾呼幾吸幾度之定數也但隨筋之痛處為輸穴亦非如取經脈法有滎俞經合之定穴也足少陽之筋起於小指次指上結外踝上循脛外廉結於膝外廉其支者別起外輔骨上走髀前者結於伏兔之上後者結於尻其直者上乘䏚季脅上走腋前廉繫於膺乳結於缺盆直者上出腋貫缺盆出太陽之前循耳後上額角交巔上下走頷上結於頄支者結於目眥為外維其病小指次指支轉筋引膝外轉筋膝不可屈伸膕筋急前引髀後引尻即上乘䏚季脅痛上引缺盆膺乳頸維筋急從左之右右目不開上過右角並蹺脈而行左絡於右故傷左角右足不用命曰維筋相交治在燔針劫刺以知為數以痛為輸名曰孟春痹也足陽明之筋起於中三指結於跗上邪外上加於輔骨上結於膝外廉直上結於髀樞上循脅屬脊其直者上循骭結於膝其支者結於外輔骨合少陽其直者上循伏兔上結於髀聚於陰器上腹而布至缺盆而結上頸上挾口合於頄下結於鼻上合於太陽太陽為目上網陽明為目下網其支者從頰結於耳前其病足中指支脛轉筋腳跳堅伏兔轉筋髀前腫㿉疝腹筋急引缺盆及頰卒口僻急者目不合熱則筋縱目不開頰筋有寒則急引頰移口有熱則筋弛縱緩不勝收故僻治之以馬膏膏其急者以白酒和桂以塗其緩者以桑鉤鉤之即以生桑灰置之坎中高下以坐等以膏尉急頰且飲美酒啖美炙肉不飲酒者自強也為之三拊而已治在燔針劫刺以知為數以痛為輸名曰季春痹也治在燔針之上當有其病轉筋者五字如足厥陰筋行水清陰氣之下所言也蓋燔針但宜施於筋寒轉筋之病其筋熱緩縱者則不宜也搏擊也指也蓋治口喎僻之法以火烘馬之脂膏尉其半邊急者以白酒調和桂末塗其半邊緩者又以桑鉤鉤其口吻之僻偏復於故處使高下相等復以水調生桑灰於鉤柄之坎縫處連頰塗之以收其緩其桑鉤柄別用線繫縛於肩後使勿走作也復飲酒啖肉使筋脈柔和以助外之塗尉不飲酒者則自強其筋骨使正以手相拍其尉處也張子和云左寒右熱則左急而右緩右寒左熱則右急而左緩故偏於左者左寒右熱偏於右者右寒左熱夫寒不可輕用辛熱之劑蓋左中寒則逼熱於右右中寒則逼熱於左陽氣不得宣行故也足太陰之筋起於大指之端內側上結於內踝其直者絡於膝內輔骨上循陰股結於髀聚於陰器上腹結於臍循腹裡結於肋散於胸中其內者著於脊其病足大指支內踝痛轉筋痛膝內輔骨痛陰股引髀而痛陰器紐痛下引臍兩脅痛引膺中脊內痛治在燔針劫刺以知為數以痛為輸名曰孟秋痹也足少陰之筋起於小指之下並足太陰之筋邪走內踝之下結於踵與太陽之筋合而上結於內輔之下並太陽之筋而上循陰股結於陰器循脊內挾膂上至項結於枕骨與足太陽之筋合其病足下轉筋及所過而結者皆痛及轉筋病在此者主癇瘈及痓在外者不能俯在內者不能仰故陽病者腰反折不能俯陰病者不能仰治在燔針劫刺以知為數以痛為輸在內者尉引飲藥此筋折紐紐發數甚者死不治名曰仲秋痹也足厥陰之筋起於大指之上上結於內踝之前上循脛上結內輔之下上循陰股結於陰器絡諸筋其病足大指支內踝之前痛內輔痛陰股痛轉筋陰器不用傷於內則不起傷於寒則陰縮入傷於熱則縱挺不收治在行水清陰氣其病轉筋者治在燔針劫刺以知為數以痛為輸名曰季秋痹也手太陽之筋起於小指之上結於腕上循臂內廉結於肘內鋭骨之後彈之應小指之上入結於腋下其支者後走腋後廉上繞肩胛循頸出走太陽之前結於耳後完骨其支者入耳中直者出耳上下結於頷上屬目外眥其病小指支肘內鋭骨後廉痛循臂陰入腋下腋下痛腋後廉痛繞肩胛引頸而痛應耳中鳴痛引頷目瞑良久乃得視頸筋急則為筋瘻頸腫寒熱在頸者治在燔針劫刺以知為數以痛為輸其為腫者復而鋭之本支者上曲牙循耳前屬目外眥上頷結於角其病當所過者支轉筋治在燔針劫刺以知為數以痛為輸名曰仲夏痹也手少陽之筋起於小指次指之端結於腕上循臂結於肘上繞臑外廉上肩走頸合手太陽其支者當曲頰入系舌本其支者上曲牙循耳前屬目外眥上乘頷結於角其病當所過者即支轉筋舌卷治在燔針劫刺以知為數以痛為輸名曰季夏痹也手陽明之筋起於大指次指之端結於腕上循臂上結於肘外上臑結於髃其支者繞肩胛挾脊直者從肩髃上頸其支者上頰結於頄直者上出手太陽之前上左角絡頭下右頷其病當所過者支痛及轉筋肩不舉頸不可左右視治在燔針劫刺以知為數以痛為輸名曰孟夏痹也手太陰之筋起於大指之上循指上行結於魚後行寸口外側上循臂結肘中上臑內廉入腋下出缺盆結肩前髃上結缺盆下結胸裡散貫賁合賁下抵季脅其病當所過者支轉筋痛甚成息賁脅急吐血治在燔針劫刺以知為數以痛為輸名曰仲冬痹也手心主之筋起於中指與太陰之筋並行結於肘內廉上臂陰結腋下散前後挾脅其支者入腋散胸中結於臂其病當所過者支轉筋前及胸痛息賁治在燔針劫刺以知為數以痛為輸名曰孟冬痹也手少陰之筋起於小指之內側結於鋭骨上結肘內廉上入腋交太陰挾乳里結於胸中循臂下繫於臍臂當作胸其病內急心承伏梁下為肘網其病當所過者支轉筋筋痛治在燔針劫刺以知為數以痛為輸其成伏梁唾血膿者死不治名曰季冬痹也名曰季冬痹也六字元誤在後無用燔針之下今移在此經筋之病寒則反折筋急熱則筋弛縱不收陰痿不用陽急則反折陰急則俯不伸淬刺者刺寒急也熱則筋縱不收無用燔針艾灸亦然今世不分寒急熱縱皆用艾灸者未知此理也足之陽明手之太陽筋急則口目為噼眥急不能卒視治皆如上方也俱見靈樞經筋篇形樂志苦病生於筋治之以尉引全文見治法諸筋病皆屬於節經云諸筋者皆屬於節又云手屈而不伸者病在筋是也肝主諸筋經云肝主筋又云在臟為肝在體為筋又云酸生肝肝生筋筋生心是也筋病忌風忌食酸辛忌久行經云風傷筋燥勝風酸傷筋辛勝酸又云酸走筋筋病無多食酸又云多食辛則筋急而爪枯又云久行傷筋是也轉筋丹轉筋皆屬血熱四物加黃芩紅花蒼朮南星有筋轉於足大指轉上至大腿近腰結了乃因奉養厚飲酒感寒而作加酒芩紅花蒼朮南星姜煎服聖治肝虛轉筋用赤蓼豆葉切作三合水一盞酒三合煎至四合去渣溫分二服孫尚藥治腳轉筋疼痛攣急松節二兩細銼如米粒乳香一錢上件藥用銀石器內慢火炒令焦只留一分性出火毒研細每服一錢至二錢熱木瓜酒調下同是筋病皆治之外治轉筋取故綿以釅醋浸甑中蒸及熱用綿裹病人腳令更易勿停瘥止仲轉筋之為病其臂腳直脈上下行微弦轉筋入腹者雞屎白散主之用雞屎白一味為散取方寸匕以水六合和溫服丹轉筋遍身入肚不忍者作極鹹鹽湯於槽中暖浸之靈轉筋於陽治其陽轉筋於陰治其陰皆淬刺之四時氣篇此則經所謂以痛為輸之法蓋用火燒燔針劫刺轉筋之時當察轉筋之痛在何處在陽刺陽在陰刺陰隨其所痛之處刺之故曰以痛為輸也若以一針未知則再刺之以知覺應效為度故曰以知為數是也竇轉筋而疼灸承山而可治足太陽之下血氣皆少則善轉筋踵下痛全文見治法霍亂轉筋海吐瀉轉筋身熱脈長陽明本病也宜和中四君子湯平胃散建中湯方見治虛實氣虛條每服一兩水三盞姜五片煎至一盞去渣溫服如吐瀉轉筋自汗脈浮者四君子加桂五錢主之如吐瀉轉筋脅下痛脈弦者宜建中加木瓜柴胡湯平胃散加木瓜五錢亦可也桂枝二兩半芍藥三兩甘草一兩膠飴半升生薑一兩半大棗六枚木瓜五錢柴胡五錢上銼如麻豆大每服一兩水三盞煮至一盞半去渣下膠飴兩匙煎化服如吐瀉後小便不通胃中實痛者四君子湯加大黃一兩主之如吐瀉轉筋腹中痛體重脈沉而細者宜四君子湯加芍藥高良薑湯四君子湯四味各一兩芍藥良薑各五錢同前煎法如吐瀉霍亂四肢拘急脈沉而遲者宜四君子湯加姜附厚朴湯四君子四味各一兩生薑附子厚朴炮製各三錢同前煎服如吐瀉轉筋四肢厥冷脈微緩者宜建中湯加附子當歸湯桂枝一兩當歸二錢芍藥二兩甘草半兩膠飴半升生薑一兩附子三錢炮大棗六枚上同前煎服活香薷散治非時霍亂大渴煩躁汗出轉筋疼痛不可忍方見傷寒吐利門丹怡六官霍亂泄多吐少口渴腳轉筋滑石三錢白朮二錢蒼朮厚朴乾葛陳皮各錢半甘草些炙木通一錢姜五片下保和丸四十粒本霍亂轉筋香薷煮汁飲之無不瘥者肘治霍亂心腹痛煩短氣未得吐下若轉筋燒梔子二十枚研末熟水調下保霍亂轉筋吐瀉不止宜半夏湯半夏曲茯苓白朮各半兩甘草炙上為末渴者涼水下不渴溫水下無時如吐瀉不止身無汗者可與瀉痢門漿水散兼桂枝湯又可與白朮湯直指木瓜湯治霍亂吐瀉轉筋擾悶木瓜二兩茴香二錢五分微炒甘草炙二錢吳茱萸洗焙七次二兩上㕮咀每服四錢水一盞半生薑五片烏梅少許煎溫服活霍亂轉筋者用理中湯去朮加附子一枚生用理中湯方見傷寒本治霍亂吐瀉不止及轉筋諸藥不效者一粒青金丹硫黃一兩研水銀八錢上二味銚子內炒柳木篦子不住手攪勻更以柳枝蘸冷醋頻頻灑候如鐵色結如青金塊方成刮下再研如粉留小半為散余以粽子尖三個醋約半盞研稀調得所成膏和丸如雞豆大硃砂為衣每服一丸煎丁香湯磨化下熱服如服散丁香湯調下一錢傷寒陰陽乘伏用龍腦冷水磨下日二三服梅治霍亂轉筋皂角末一小豆許入鼻中取嚏便瘥古今録治霍亂轉筋取蓼花一把去兩頭以水二升半煮一升半頓服之食治吐後轉筋煮木瓜汁飲之甚良外治霍亂注痢不止轉筋入腹欲死生薑三兩搗碎以酒一升煮三四沸頓服世霍亂之症輕則上吐下瀉兩腳轉筋甚則遍體轉筋腹肚疼痛手足厥冷若欲絶者倉卒之際宜於臍中灼艾及用蓼一把煎湯炮洗次投以姜附理中湯之類其脈洪大者易治脈微腎縮舌卷者不治世霍亂轉筋灸承山灸二十七壯神效又法中風亦灸承山東霍亂轉筋在兩臂及胸堂中者筋拘不及動搖膻中中府巨闕胃脘尺澤太陰灸七壯甲霍亂轉筋金門僕參承山承筋主之爪肝之合筋也其榮爪也全文見五臟肝熱者色蒼而爪枯全文見痿多食辛則筋急而爪枯全文見五臟
