灸七壯至七七壯上脘一穴在巨闕下一寸五分去鳩骨下三寸任脈足陽明手太陽之會針入八分日灸二七壯中脘一穴胃之募也在上脘下一寸五分手太陽少陽足陽明所主任脈之會上紀者中脘也針入八分留七呼瀉五吸灸二七壯建里一穴在中脘下一寸針入五分留十呼可灸五壯下脘一穴在建里下一寸足太陰任脈之會針入八分灸七壯至百壯水分一穴在下脘下一寸臍上一寸任脈氣所發針入八分可灸七壯水病禁針針即成水蠱病死神闕一穴當臍中是穴灸百壯禁針右腹部中行自鳩尾蔽骨端下至臍中八穴陰交一穴在臍下一寸任脈氣所發針入八分灸百壯氣海一穴在臍下一寸五分任脈氣所發針入八分灸百壯石門一穴在臍下二寸三焦之募也任脈氣所發灸二十壯關元一穴在臍下三寸小腸之募也足太陰少陰厥陰三陰任脈之會下記者關元也針入八分留三呼灸三壯至三百壯中極一穴在關元下一寸膀胱之募也足三陰任脈之會針入八分留十呼灸五壯曲骨一穴在橫骨上毛際陷中動脈應手任脈足厥陰之會針入二寸灸七壯至七七壯右腹部中行自臍以下至橫骨六穴會陰一穴一名屏翳在兩陰間任脈別絡腎脈衝脈之會可灸三壯右腹部中行在兩橫骨下至兩陰之間一穴幽門一穴挾巨闕兩旁各五分衝脈足少陰之會針入五分可灸五壯通谷一穴在幽門下一寸衝脈足少陰之會針入五分灸五壯陰都二穴在通谷下一寸衝脈足少陰之會針入五分灸五壯石關二穴在陰都下一寸衝脈足少陰之會針入一寸灸三壯商曲二穴在石關下一寸衝脈足少陰之會針入一寸灸五壯肓腧二穴在商曲下一寸直臍旁五分衝脈足少陰之會針入三分灸五壯中注二穴在肓腧下一寸衝脈足少陰之會針入一寸灸五壯四滿二穴在中注下一寸衝脈足少陰之會針入五分灸三壯氣穴二穴一名胞門一名子戶在四滿下一寸衝脈足少陰之會針入三分灸五壯大赫二穴一名陰維一名陰關在氣穴下一寸衝脈足少陰之會針入三分灸五壯橫骨二穴一名下極在大赫下一寸衝脈足少陰之會針入一寸可灸三壯右腹第二行二十二穴詳幽門下通谷上欠二穴不容二穴在幽門兩旁各一寸五分去任脈二寸直四肋端足陽明脈氣所發針入五分灸五壯承滿二穴在不容下一寸足陽明脈氣所發針入二分灸五壯梁門二穴在承滿下一寸足陽明脈氣所發針入三分灸五壯關門二穴在梁門下一寸足陽明脈氣所發針入三分灸五壯太乙二穴在關門下一寸足陽明脈氣所發針入八分灸五壯滑肉門二穴在太乙下一寸足陽明脈氣所發針入八分灸五壯天樞二穴大腸之募也在挾臍兩旁各二寸足陽明脈氣所發針入八分留七呼灸百壯外陵二穴在天樞下一寸足陽明脈氣所發針入八分灸五壯大巨二穴在外陵下一寸足陽明脈氣所發針入五分灸五壯水道二穴在大巨下三寸足陽明脈氣所發針入二寸五分灸七壯歸來二穴在水道下二寸足陽明脈氣所發針入八分灸五壯氣衝二穴在歸來下鼠鼷上一寸動脈應手宛宛中足陽明脈氣所發可灸七壯艾炷如大麥大禁針右腹第三行二十四穴期門二穴肝之募也在不容旁一寸五分直兩乳第二肋端足太陰厥陰陰維之會針入四分可灸五壯日月二穴膽之募也在期門下五分陷中足太陰少陽陽維之會針入七分可灸五壯腹哀二穴在日月下一寸半足太陰陰維之會針入五分灸五壯大橫二穴在腹哀下二寸五分直臍旁足太陰陰維之會針入七分灸五壯腹結二穴在大橫下一寸三分一名腹屈針入七分灸五壯府舍二穴在腹結下三寸足太陰陰維厥陰之會此三脈上下入腹絡肝脾結心肺從脅上至肩此太陰郤三陰陽明之別針入七分灸五壯衝門二穴上去大橫五寸在府舍下橫骨兩端約文中動脈足太陰厥陰之會刺入七分灸五壯右腹第四行十四穴章門二穴脾之募也在大橫外直臍季脅端側臥屈上足伸下足舉臂取之足厥陰太陽之會針入六分灸百壯帶脈二穴在季脅下一寸八分針入六分灸五壯五樞二穴在帶脈下三寸一云在水道旁一寸五分針入一寸灸五壯維道二穴在章門下五寸三分足少陽帶脈之會針入八分灸五壯居髎二穴在章門下八寸三分監骨上陷中陽蹺足少陽之會針入八分灸三壯右腹第五行十穴京門二穴腎之募也一名氣府在監骨下腰中挾脊季肋下一寸八分針入八分留七呼可灸三壯右腹第六行二穴少商二穴魚際二穴太淵二穴俱見前藏俞右大指內側至寸口動脈六穴孔最二穴去腕上七寸手太陰之郤針入三分灸五壯經渠二穴尺澤二穴俱見前藏俞右寸口動脈循臂內上骨下廉至肘中六穴中衝二穴勞宮二穴俱見前藏俞右中指內廉至掌心四穴內關二穴在掌後兩筋間去腕二寸手心主絡別走少陽針入三分可灸三壯郤門二穴在掌後去腕五寸手厥陰郤針入三分可灸五壯大陵二穴間使二穴曲澤二穴俱見前藏俞右掌後循臂內兩筋間至肘內廉十穴黃帝曰手少陰之脈獨無腧何也岐伯曰少陰心脈也心者五臟六腑之大主也精神之所舍也其藏堅固邪弗能容也容之則心傷心傷則神去神去則死矣故諸邪之在於心者皆在於心之包絡包絡者心主之脈也故獨無腧焉黃帝曰少陰獨無腧者不病乎岐伯曰其外經病而藏不病故獨取其經於掌後鋭骨之端其餘脈出入屈折其行之徐疾皆如手少陰心主之脈行也邪客篇少衝二穴木也一名經始在小指內廉端去爪甲角如韭葉手少陰脈之所出也為井針入一分可灸三壯少府二穴火也在小指本節後陷中直勞宮手少陰脈之所流也為滎針入二分灸七壯右小指內廉至掌後廉四穴神門二穴土也皆掌後鋭骨之端陷中手少陰脈之所經也為俞針入三分留七呼灸七壯陰郤二穴在掌後脈中去腕五分手少陰郤針入三分灸七壯通里二穴在腕後一寸針入三分灸三壯靈道二穴金也在掌後一寸五分手少陰脈之所行也為經針入三分可灸三壯少海二穴水也在肘內大骨外去肘端五分手少陰脈之所行也為合針入三分灸七壯右掌後鋭骨端直臂內廉至肘內廉十穴關衝二穴液門二穴中渚二穴陽池二穴俱見前府俞右第四指外間至手表腕八穴外關二穴手少陰絡在腕後二寸陷中針入三分留七呼灸三壯會宗二穴在腕後三寸空中針入三分灸三壯三陽絡二穴在臂上大交脈支溝上一寸灸七壯禁針四瀆二穴在肘前五寸外廉陷中針入六分留七呼灸三壯支溝二穴天井二穴俱見前府俞右臂外兩骨之間至肘十二穴商陽二穴二間二穴三間二穴合谷二穴俱見前府俞右大指次指上廉至合谷兩歧骨間八穴列缺二穴去腕側上一寸五分以手交叉中指末筋骨罅中手太陰絡別走陽明針入二分留三呼灸七壯偏歷二穴手陽明絡別走太陰在腕中後三寸針入三分留七呼灸三壯溫溜二穴在腕後小士五寸大士六寸手陽明郤針入五分可灸三壯大士小士即大人小兒也下廉二穴在輔骨下去上廉一寸斜針入五分留五呼灸三壯上廉二穴在三里下一寸其分獨抵陽明之會斜針入五分灸五壯三里二穴在曲池下二寸按之肉起鋭肉之端針入二分可灸三壯肘髎二穴在肘大骨外廉陷中針入三分灸三壯陽溪二穴曲池二穴俱見前府俞右腕上側兩筋間循臂上廉至肘後曲縫尖十八穴少澤二穴前谷二穴後溪二穴腕骨二穴陽谷二穴俱見前府俞右小指外側至腕中十穴養老二穴在手踝骨上一空腕後一寸陷中手太陽之郤針入三分灸五壯支正二穴在腕後五寸手太陽絡別走少陰針入三分灸三壯少海二穴見前府俞右臂骨下廉至肘內側肉骨之間六穴俠白二穴在天府下去肘五寸動脈中針入三分可灸五壯天府二穴在腋下三寸臑臂內廉動脈中針入四分留三呼不可灸右肘內約文中動脈直上腋中之前動脈四穴天泉二穴一名天溫在曲腋下去臂二寸舉臂取之針入六分灸三壯右肘內曲澤穴直上腋中二穴青靈二穴在肘上三寸舉臂取之灸七壯極泉二穴在臂內腋下筋間動脈入胸針入三分灸七壯右肘內廉少海穴直臑內後廉四穴清冷淵二穴在肘上三寸伸肘舉臂取之針入三寸灸三壯消濼二穴在肩下臂外間腋斜肘分下行針入六分灸三壯右肘骨上兩筋間天井穴至肩端四穴五里二穴在肘上三寸行向里大脈中央灸十壯禁針臂臑二穴在肘上七寸膕內端手陽明絡針入三分灸三壯右曲地穴直上肩骨前廉四穴肘內側兩骨間直上肩端後肘太陽脈無穴公孫二穴在足大指本節後一寸別走陽明足太陰絡針入四分灸三壯隱白二穴大都二穴太白二穴商丘二穴俱見前藏俞右大指內側至內踝前廉十穴大敦二穴行間二穴太衝二穴中封二穴俱見前藏俞右大指外間至內踝前一寸八穴厲兌二穴內庭二穴陷谷二穴衝陽二穴解溪二穴俱見前府俞右第二指外間至腕上十穴地五會二穴在足小指次指本節後陷中去俠溪一寸針入二分不可灸灸之令人瘦不出三年死竅陰二穴俠溪二穴臨泣二穴丘墟二穴俱見前府俞右第四指外間至外踝之前十穴申脈二穴陽蹺所生在外踝下陷中容爪甲白肉際針入五分留六呼灸三壯金門二穴在足外踝下足太陽之郤陽維所別屬也針入一分灸三壯僕參二穴在跟骨下陷中拱足得之足太陽陽蹺上二脈之會針入三分灸七壯至陰二穴通谷二穴束骨二穴京骨二穴崑崙二穴俱見前府俞右小指外側至外踝之後一十六穴照海二穴陰蹺所生在足內踝下令患人穩坐足底相對赤白肉際陷中針入三分灸三壯水泉二穴足少陰郤去太溪一寸在足內踝下針入四分灸五壯太衝二穴在足跟後沖中別走太陽足少陰絡針入二分留七呼灸三壯湧泉二穴然谷二穴太溪二穴俱見前藏俞右足心斜至內踝之後一十二穴蠡溝二穴在足內踝上五寸別走少陽足厥陰絡針入二分留三呼灸三壯中都二穴一名中郤在內踝上七寸䯒骨中與少陰相直針入三分灸三壯右內踝前一寸上踝至八寸足厥陰脈四穴地機二穴一名脾舍足太陰之郤在膝下五寸針入三分可灸五壯血海二穴在膝臏上內廉白肉際二寸半針入五分灸三壯箕門二穴在魚腹上越筋間陰股內動脈應手經云股上起筋間針入三分留六呼灸三壯陰陵泉二穴見前藏俞右內踝上八寸循脛骨後上膝股內前廉足太陰脈八穴三陰交二穴在足內踝上三寸骨下陷中足太陰厥陰少陰之會針入三分灸三壯漏谷二穴一名太陰絡在足內踝上六寸骨下陷中針入五分灸三壯右內踝前廉上踝至八寸足太陰脈四穴膝關二穴在犢鼻下二寸旁陷中針入四分灸五壯陰包二穴在膝上四寸股內廉兩筋間針入六分灸三壯五里二穴在陰廉下去氣衝下三寸陰股中動脈應手針入六分灸五壯陰廉二穴在羊矢下去氣衝下二寸動脈中針入八分灸三壯曲泉二穴見前藏俞右內踝上八寸上膕內廉循踝至腹足厥陰脈十穴交信二穴在足內踝上二寸少陰前太陰後筋骨間陰蹺之郤針入四分留五呼灸三壯築賓二穴在內踝上腨分中陰維之郤針入三分灸五壯陰谷二穴復溜二穴俱見前藏俞右內踝之後直腨至骨內廉上股內後廉八穴懸鐘二穴在足外踝上三寸動脈中足三陽之大絡按之陽明脈絶乃取之針入六分留七呼灸五壯即絶骨穴光明二穴在足外踝上五寸別走厥陰足少陽絡針入六分留七呼灸五壯外丘二穴在足外踝上七寸足少陽郤少陽所至針入三分灸三壯陽交二穴在足外踝上七寸斜屬三陽分肉間針入六分留七呼灸三壯陽陵泉二穴陽輔二穴俱見前府俞右外踝之前至絶骨端上外輔骨前十二穴陽關二穴在陽陵泉上三寸犢鼻外陷中針入五分禁灸中瀆二穴在髀骨外膝上五寸分肉間陷中針入五分留七呼灸五壯環跳二穴在髀樞中側臥伸下足屈上足取之針入一寸留十呼灸五十壯右外輔骨前上膝髀外廉六穴豐隆二穴在外踝上八寸下䯒外廉陷中別走太陰足陽明絡針入三分灸三壯條口二穴在上廉上一寸舉足取之針入五分灸三壯犢鼻二穴在膝臏下䯒骨上骨解大筋中針入六分灸三壯巨虛下廉二穴三里二穴俱見前府俞右髀骨外廉至膝臏一十二穴粱丘二穴在膝上二寸兩筋間足陽明之郤針入三分灸三壯陰市二穴在膝上三寸伏兔下陷中拜而取之針入三分留七呼禁灸伏兔二穴在膝上六寸起肉正跪正坐而取之一云膝蓋上七寸針入五分禁灸髀關二穴在膝上伏兔後交文中針入六分灸三壯右膝臏中直伏兔上至氣衝八穴跗陽二穴在足外踝上三寸陽蹺之郤太陽前少陽後筋骨間針入五分飛陽二穴在外踝上七寸針入三分灸三壯承山二穴在腨腸下分肉間陷中針入七分灸七壯承筋二穴在腨腸中央陷中灸三壯不可針合陽二穴在膝約文中央下二寸針入六分灸五壯委中二穴見前府俞右外踝之後宜腨至膕中一十二穴浮郤二穴在委陽上一寸展膝得之針入五分灸三壯委陽二穴見前府俞右膕外廉四穴殷門二穴在肉郤下六寸針入五分留七呼灸三壯承扶二穴在尻臀下股陰上約文中針入二分灸三壯右膕中直髀後廉至尻四穴竇問同人寸法答曰以中指大指相屈如環取內側交兩角為寸上竇漢卿取中指內側為同身寸者大法也若取頭部膺腧部腹部同身寸又各有活法不可執一也其頭部法前髮際至後髮際通長一尺二寸取法以軟篾直鼻從前髮際貼肉量至後髮際截之卻將此篾折為十二分度則其十二分度之一分乃頭部同身寸之一寸也其膺腧部法自天突穴至膻中穴通長六寸八分取法亦以軟篾從缺盆中間天突穴宛宛中貼肉量至直兩乳中間膻中穴截之折為六分八釐度則其六分八釐度之一分乃膺腧部同身寸之一寸也其腹部法自鳩尾至臍下通長八寸取法亦以軟篾從鳩尾蔽骨端貼肉量至臍中央截之折為八分度則其八分度之一分乃腹部同身寸之一寸也量腹部同身時宜正臥針灸亦然
