body:
  text: 卷之八陰陽臟腑部穴法上靈肺出於少商少商者手大指端內側也為井木銅人云少商二穴木也在大指端內側去爪甲角韭葉許手太陰脈之所出也為井以三稜針刺之出血以瀉諸藏之熱不宜灸甲乙經云針入二分留一呼灸一壯溜於魚際魚際者手魚也為滎銅人云魚際二穴火也在大指本節後內側散脈中手太陰脈之所行也為滎針入二分留三呼可灸二壯注於太淵太淵魚後一寸陷者中也為腧銅人云太淵二穴土也在手掌後陷中手太陰脈之所注也為腧針入二分可灸三壯行於經渠經渠寸口中也動而不居為經銅人云經渠二穴金也在寸口陷中手太陰脈之所行也為經針入二分留三呼禁灸灸即傷人神入於尺澤尺澤肘中之動脈也為合手太陰經也銅人云尺澤二穴水也在肘中約紋上動脈中手太陰脈之所入為合針入二分可灸五壯心出於中衝中衝手中指之端也為井木銅人云中衝二穴木也在手中指端去爪甲如韭葉陷中手厥陰心主脈之所出也為井針入一分留三呼可灸一壯溜於勞宮勞宮掌中中指本節之內間也為滎銅人云勞宮二穴火也在掌中央動脈中心原虛處屈中指無名指取之手厥陰脈之所溜也為滎針入三分留六呼可灸注於大陵大陵掌後兩骨之間方下者也為腧銅人云大陵二穴土也在掌後兩筋間陷中手厥陰脈之所注也為腧針入六分可灸三壯行於間使間使之道兩筋之間三寸之中也有過則至無過則止為經銅人云間使二穴金也在掌後三寸兩筋間陷中手厥陰心包絡脈之所行也為經針入三分可灸五壯其穴有大絡為限故入絡過腧掌後正勞宮後三寸寸止處是穴故經曰有過則至無過則止也入於曲澤曲澤肘內廉下陷者之中也屈而得之為合手少陰也銅人云曲澤二穴水也在肘內廉下陷中屈肘得之心包絡脈之所入也為合針入三分留七呼可灸三壯手少陰少字當作厥肝出於大敦大敦者足大指之端及三毛之中也為井木銅人云大敦二穴木也在足大指端去爪甲如韭葉及三毛中足厥陰脈之所出也為井針入三分留六呼可灸二壯溜於行間行間足大指間也為滎銅人云行間二穴火也在足大指間動脈應手陷中足厥陰脈之所溜也為滎針入六分留十呼灸三壯注於太衝太衝行間上二寸陷者之中也為腧銅人云太衝二穴土也在足大指本節後二寸或云一寸五分陷中足厥陰脈之所經也為腧針入三分留十呼可灸三壯行於中封中封內踝之前一寸半陷者之中使逆則宛使和則通搖足而得之為經銅人云中封二穴金也在足內踝前一寸仰足而取之陷中伸足乃得之足厥陰脈之所行也為經刺入四分留七呼可灸三壯其穴使足逆仰則穴有宛陷可定針使手足和其穴有巷道可通故曰使逆則宛和則通也入於曲泉曲泉輔骨之下大筋之上也屈膝而得之為合足厥陰也銅人云曲泉二穴水也在膝內輔骨下大筋上小筋下陷中屈膝得之足厥陰脈之所入也為合刺入六分留十呼可灸三壯脾出於隱白隱白者足大指之端內側也為井木銅人云隱白二穴木也在足大指端內去爪甲如韭葉足太陰脈之所出也為井針入一分留三呼可灸三壯溜於大都大都本節之後下陷者之中也為滎銅人云大都二穴火也在足大指本節後陷中足太陰脈之所溜也為滎刺入二分留七呼可灸三壯按本節後後字當作前更詳注於太白太白腕骨之下也為腧銅人云太白二穴土也在足大指內側核骨下陷中足太陰脈之所注也為腧刺入三分留七呼可灸三壯行於商丘商丘內踝之下陷者之中也為經銅人云商丘二穴金也在足內踝骨下微前陷中足太陰脈之所行也為經刺入三分留七呼可灸三壯入於陰之陵泉陰之陵泉輔骨之下陷者之中也伸而得之為合足太陰也銅人云陰陵泉二穴水也在膝下內側輔骨下陷中伸足乃得之足太陰脈之所入也為合刺入五分留七呼可灸三壯腎出於湧泉湧泉者足心也為井木銅人云湧泉二穴一名地衝在足心陷中屈足卷指宛宛中跪取之少陰脈之所出也為井刺入三分留七呼可灸三壯溜於然谷然谷者然骨之下者也為滎銅人云然谷二穴火也一名龍淵足內踝前起大骨下陷中足少陰脈之所溜也為滎刺入三分留三呼灸三壯刺之多見血使人立飢欲食注於太溪太溪內踝之後跟骨之上陷中者也為腧銅人云太溪二穴土也在趺上踝後跟骨上動脈陷中足少陰腎脈之所注也為腧刺入三分留七呼灸三壯凡人病有此脈則生無則死行於復溜復溜上內踝二寸動而不休為經銅人云復溜二穴金也一名伏白一名昌陽在足內踝上二寸筋骨陷中足少陰脈之所行也為經刺入三分留三呼可灸五壯入於陰谷陰谷輔骨之後大筋之下小筋之上也按之應手屈膝而得之為合足少陰經也銅人云陰谷二穴水也在膝下內輔骨之後大筋下小筋上足少陰脈之所入也為合刺入三分可灸三壯膀胱出於至陰至陰者足小指之端也為井金銅人云至陰二穴金也在足小指外側去爪甲如韭葉足太陰脈之所出也為井刺入一分留五呼可灸三壯溜於通谷通谷本節之前外側也為滎銅人云通谷二穴水也在足小指外側本節前陷中足太陽脈之所溜也為滎刺入二分留五呼可灸三壯注於束骨束骨本節之後陷者中也為腧銅人云束骨二穴木也在足小指外側本節後陷中足太陽脈之所注也為腧刺入三分留五呼可灸三壯過於京骨京骨足外側大骨之下為原銅人云京骨二穴在足外側大骨下赤白肉際陷中按而得之足太陽脈之所過也為原刺入三分留七呼可灸七壯行於崑崙崑崙在外踝之後跟骨之上為經銅人云崑崙二穴火也在足外踝後跟骨上陷中足太陽脈之所行也為經刺入五分留十呼可灸五壯入於委中委中在膕中央為合委而取之足太陽也銅人云委中二穴土也在膕中央約文中動脈陷中足太陽脈之所入也為合刺入五分留七呼可灸三壯膽出於竅陰竅陰者足小指次指之中也為井金銅人云竅陰二穴金也在足小指次指之端去爪甲角如韭葉足少陽脈之所出也為井刺入一分留三呼可灸三壯溜於俠溪俠溪足小指次指之間也為滎銅人云俠溪二穴水也在足小指次指二岐骨間本節前陷中足少陽脈之所溜也為滎刺入二分留三呼可灸三壯注於臨泣臨泣上行一寸半陷者中也為腧銅人云臨泣二穴木也在足小指次指本節後間陷中去俠溪一寸五分足少陽脈之所注也為腧刺入二分留三呼可灸三壯過於丘墟丘墟外踝之前下陷者中也為原銅人云丘墟二穴在足外踝下如前陷中去臨泣三寸足少陽脈之所過也為原刺入五分留七呼可灸三壯行於陽輔陽輔外踝之上輔骨之前及絶骨之端也為經銅人云陽輔二穴火也在足之外踝上四寸輔骨前絶骨端三分去丘墟七寸足少陽脈之所行也為經刺入五分留七呼可灸三壯入於陽之陵泉陽之陵泉在膝外陷者中也為合伸而得之足少陽也銅人云陽陵泉二穴土也在膝下一寸䯒外廉陷中足少陽脈之所入也為合刺入六分留十呼可灸七壯至四十九壯胃出於厲兌厲兌者足大指次指之端也為井金銅人云厲兌二穴金也在足大指次指之端去爪甲角如韭葉足陽明胃脈之所出也為井刺入一分留一呼可灸一壯溜於內庭內庭次指外間也為滎銅人云內庭二穴水也在足大指次指外間陷中足陽明胃脈之所溜也為滎刺入三分留十呼可灸二壯注於陷谷陷谷者上中指內間上行二寸陷者中也為腧銅人云陷谷二穴木也在足大指次指本節後陷中去內庭二寸足陽明胃脈之所注也為腧刺入五分留七呼可灸三壯過於衝陽衝陽足跗上五寸陷者中也為原搖足而得之銅人云衝陽二穴一名會原在足跗上五寸去陷谷各三寸骨間動脈足陽明脈之所過也為原刺入三分留十呼可灸三壯行於解溪解溪上衝陽一寸半陷者中也為經銅人云解溪二穴土也在膝下衝陽後一寸五分腕上陷中足陽明脈之所行也為經刺入五分留五呼可灸三壯入於下陵下陵膝下三寸䯒骨外廉三里也為合復下三里三寸為巨虛上廉復下上廉三寸為巨虛下廉也大腸屬上小腸屬下足陽明胃脈也銅人云三里二穴土也在膝下三寸䯒外廉足陽明脈之所入也為合刺入一分留七呼可灸三壯素問在膝下三寸陷中外廉兩間肉分間甲乙云巨虛上廉足陽明與大腸合在三里下三寸刺入三分灸三壯巨虛下廉足陽明與小腸合在上廉下三寸刺入三分可灸三壯按足陽明胃也大腸小腸皆屬於胃是足陽明也三焦者上合手少陽出於關衝關衝者小指次指之端也為井金銅人云關衝二穴金也在手小指次指之端去爪甲角如韭葉手少陽脈之所出也為井刺入一分留三呼可灸三壯溜於液門液門小指次指之間也為滎銅人云液門二穴水也在手小指次指陷中握拳取之手少陽脈之所溜也為滎刺入三分留三呼可灸三壯注於中渚中渚本節之後陷者中也為腧銅人云中渚二穴木也在手小指次指本節後間陷中液門下一寸手少陽脈之所注也為腧刺入二分留三呼可灸三壯過於陽池陽池在腕上陷者之中也為原銅人云陽池二穴一名別陽在手表腕上陷中手少陽脈之所過也為原刺入二分留三呼可灸三壯行於支溝支溝上腕三寸兩骨之間陷者中也為經銅人云支溝二穴火也在腕後三寸兩骨之間陷中手少陽脈之所行也為經刺入二分留七呼可灸二七壯入於天井天井在肘外大骨之陷者中也為合屈肘乃得之銅人云天井二穴土也在肘外大骨後肘上一寸兩筋間陷中屈肘取之手少陽脈之所入也為合刺入一寸留七呼可灸三壯三焦下腧在於足大指之前少陽之後出於膕中外廉名曰委陽足太陽絡也手少陽經也銅人云委陽在足太陽之前少陽之後出於膕中外廉兩筋間承扶下六寸此足太陽之別絡刺入七分留五呼灸三壯屈身而得之詳銅人云委陽在承扶下六寸以今經文考之當云一尺六寸謹按經文論委陽在足太陽之前少陽之後出於膕中外廉又按經文取合穴法取委陽者屈伸而索之取陽陵泉者正豎膝與之齊下至委陽之前取之是知委者曲也委中即兩膕之中央委陽即曲䐐之陽分約文之盡處兩筋間是推其分野正當太陽少陽之間內外廉之界故曰太陽之前少陽之後膕中外廉也其穴正在約文盡處兩筋之間屈伸而得之故取法曰屈伸索之也只正膝與之齊陽陵泉正對其穴故曰取陽陵泉者下至委陽之前取之也又考諸尺寸則承扶下至其穴正得一尺六寸故愚斷然謂甲乙脫去一尺二字無疑也三焦者足少陽太陽之所將太陽之別也上踝五寸別入貫腨腸出於委陽並太陽之正入絡膀胱約下焦實則閉癃虛則遺溺遺溺則補之閉癃則瀉之手太陽小腸上合於手太陽出於少澤少澤小指之端也為井金銅人云少澤二穴金也在手小指之端外側去爪甲一分陷中手太陽脈之所出也為井刺入一分留二呼可灸一壯溜於前谷前谷在手外廉本節前陷者中也為滎銅人云前谷二穴水也在手小指外側本節前陷中手太陽脈之所溜也為滎刺入一分留三呼可灸一壯注於後溪後溪者在手外側本節之後也為腧銅人云後溪二穴木也在手小指外側本節後陷中手太陽脈之所注也為腧刺入二分留三呼可灸三壯過於腕骨腕骨在手外側腕骨之前為原銅人云腕骨二穴在手外側腕前起骨下陷中手太陽脈之所過也為原刺入一分留三呼可灸三壯行於陽谷陽谷在鋭骨之下陷者中也為經銅人云陽谷二穴火也在手外側脘中鋭骨下陷中手太陽脈之所行也為經刺入二分留二呼可灸二壯入於小海小海在肘內大骨之外去端半寸陷者中也伸臂而得之為合手太陽經也銅人云小海二穴土也在肘內大骨外肘端五分陷中屈手向頭取之手太陽脈之所入也為合刺入二分留七呼可灸三壯大腸上合手陽明出於商陽商陽大指次指之端也為井金銅人云商陽二穴金也一名絶陽在手大指次指內側去爪甲如韭葉手陽明脈之所出也為井刺入一分留一呼可灸三壯溜於本節之前二間為滎銅人云二間二穴水也在手大指次指本節前內側陷中手陽明脈之所溜也為滎針入三分留九呼可灸三壯注於本節之後三間為腧銅人云三間二穴火也在手大指次指本節後內側陷中手陽明脈之所注也為腧針入三分留三呼可灸三壯過於合谷合谷在大指岐骨之間為原銅人云合谷二穴在手大指次指岐骨間手陽明脈之所過也為原刺入三分留六呼可灸三壯行於陽溪陽溪在兩筋間陷者中也為經銅人云陽溪二穴火也一名中魁在腕中上側兩筋間陷中手陽明脈之所行也為經刺入三分留七呼可灸三壯入於曲池在肘外輔骨陷者中也屈臂而得之為合手陽明也銅人云曲池二穴土也在肘外輔骨屈肘曲骨之中手陽明脈之所入也為合刺入五分留七呼可灸三壯是謂五臟六腑之腧五五二十五腧六六三十六腧也六腑皆出足之三陽上合於手者也以上並出本輸篇上五臟腧二十五穴六腑腧三十六穴並巨虛上下廉共六十四腧實切要之穴也凡五臟六腑有病皆此六十四穴主之其大淵大陵太衝太白太溪為五臟之原其三里巨虛上下廉委中委陽陽陵泉為六腑之合又切要中之切要而醫所最當先者也六腑之合謂胃合於三里大腸合於巨虛上廉小腸合於巨虛下廉此三腑皆出足之陽明也三焦合於委陽膀胱合於委中此二腑皆出足之太陽也膽合於陽陵泉此一腑出足之少陽也六腑有疾皆取此六腧故後於其尾結之曰六腑皆出足之三陽而表章之也今效竇漢卿傍通十二經孔穴圖而後折衷之於經開如左方肺心肝脾腎井木少商中衝大敦隱白湧泉滎火魚際勞宮行間大都然谷俞土太淵大陵太衝太白太溪經金經渠間使中封商丘復溜合水尺澤曲澤曲泉陰陵泉陰谷大腸小腸膽胃膀胱三焦井金商陽少澤竅陰厲兌至陰關衝滎水二間前谷俠溪內庭通谷液門腧木三間後溪臨泣陷谷束骨中渚原合谷腕骨丘墟衝陽京骨陽池經火陽溪陽谷陽輔解溪崑崙支溝合土曲池巨虛上廉小海巨虛下廉陽陵泉三里委中天井委陽靈黃帝曰願聞五臟六腑所出之處岐伯曰五臟五腧五五二十五腧六腑六腧六六三十六腧經脈十二絡脈十五凡二十七氣以上下所出為井所溜為滎所注為腧所行為經所入為合二十七氣所行皆在五腧也節之交三百六十五會知其要者一言而終不知其要流散無窮所言節者神氣之所遊行出入也非筋肉皮骨也九針十二原難十變又言陰井木陽井金陰滎火陽滎水陰腧土陽腧木陰經金陽經火陰合水陽合土陰陽皆不同其意何也然是剛柔之事也陰井乙木陽井庚金陽井庚庚者乙之剛也陰井乙乙者庚之柔也乙為木故言陰井木也庚為金故言陽井金也經言所出為井所入為合其法奈何然所出為井井者東方春也萬物始生故言所出為井也所入為合合者北方冬也陽氣入藏故言所入為合也十變言五臟六腑滎合皆以井為始者何也蓋井者東方春也萬物始生諸跂行喘息蜎飛蠕動當生之物莫不以春而生故歲數始於春日數始於甲故以井為始也諸井者肌肉淺薄氣少不足使也刺之奈何然諸井者木也滎者火也火者木之子當刺井者以滎瀉之故經言補者不可以為瀉瀉者不可以為補此之謂也難經言春刺井夏刺滎季夏刺腧秋刺經冬刺合者何也蓋春刺井者邪在肝夏刺榮者邪在心季夏刺腧者邪在脾秋刺經者邪在肺冬刺合者邪在腎其肝心脾肺腎而繫於春夏秋冬者何也然五臟一病輒有五也假令肝病色青者肝也臊臭者肝也喜酸者肝也喜呼者肝也喜泣者肝也其病衆多不可盡言四時有數而並繫於春秋冬夏者也針之要妙在於秋毫者是也海藏天元圖七十四難曰從其首系其數肝青大敦木井臊曲泉水合酸中封金經呼太衝土腧泣行間火滎心赤少府火滎焦少衝木井苦少海水合言靈道金經汗神門土俞脾黃太白土俞香大都火滎甘隱白木井歌陰陵泉水合涎商丘金經肺白經渠金經腥大淵土俞辛魚際火滎哭少商木井涕尺澤水合腎黑陰谷水合腐復溜金經咸太溪土俞呻然谷火滎液湧泉木井夫天元法者謂之五化疊元當從其首系其數首者寅方春也在人為肝是從東方順天輪數至所主之處計從幾數卻於所受病一方倒疊回去數至依前數盡處便於受病一方穴內瀉所主之方來路穴也不得於所主之方內經中瀉之勿誤假如病者聞香臭二者心主五臭也入脾為香臭從東數至所主之處所主五臭者心也東一南二計得二數卻當於受病之方倒疊回去脾一心二元數二也是數至心心者滎火也當於受病之方內瀉滎火是從脾經瀉大都是也或曰何以倒疊數對曰此從地出為天輪所載右遷於天不當於所顯之處治之此舟行岸移之意也上天元圖乃海藏發明扁鵲七十四難之義但心腧五穴不合經旨按內經言心臟堅固邪弗能容故手少陰獨無腧其外經病而臟不病者獨取其經於掌後鋭骨之端其餘脈出入屈折其行之徐疾皆如手少陰心主之脈行也故諸邪之在心者皆在心之包絡也今圖中列心五邪曰赤焦苦言汗者皆當在心包絡所受而不列心包絡中衝勞宮大陵間使曲澤五穴反列手少陰少府少衝少海神門靈道五穴為未得也難五臟六腑各有井滎俞經合皆何所主然經言所出為井所溜為滎所注為腧所行為經所入為合井主心下滿滎主身熱腧主體重節痛經主喘咳寒熱合主氣逆而泄此五臟六腑其井滎俞經合所主病也地元圖六十八難曰元證脈合復生五象井心下滿膽元證身熱體重節痛喘咳寒熱逆氣泄滎身熱心下滿小腸元證體重寒熱逆氣俞體重節痛心下滿胃身熱元證寒熱逆氣經喘咳寒熱心下滿大腸身熱體重元證逆氣合逆氣而泄心下滿膀胱身熱體重寒熱元證假令膽病善潔面青善怒元證得弦脈脈合又病心下滿當刺膽井如見善潔面青善怒脈又弦又病身熱當刺膽滎又病體重節痛當刺膽俞如見善潔面青善怒脈又弦又病喘咳寒熱當刺膽合又病逆氣而泄宜刺膽俞合余經例仿此假令肝經溲淋便難轉筋春刺井夏刺滎季夏刺腧秋刺經冬刺合此是斷五邪之原陰陽例即人元圖陰陽者子午也謂滎合水火之稱名曰陰陽也十二經皆有之或感得父氣或感得母氣而病焉子午者乾坤乾坤包六子六子附乾坤也故七十難云春夏各致一陰秋冬各致一陽春夏刺井滎秋冬刺經合是各致一陰一陽之義亦謂井經近乎子午然當微瀉其井大瀉其滎微補其經大補其合或補或瀉反作是寒則留之熱則疾之故微大補瀉以應之春食涼夏食寒秋食溫冬食熱假令膽病善潔面青善怒脈得浮之實大沉之損小是感得父氣為陽中之陰當於本經中瀉火補水卻得浮之損小沉之實大是感得母氣為陰中之陽當於本經中瀉水補火配合例難曰上工治未病者見肝之病則知肝當傳於脾故先實其脾氣無令受肝之邪氣也假令見肝病欲入其脾者先於足太陰經中補土字一針又補火字一針後於足厥陰肝經內瀉木字一針又瀉火字一針子母例假令見肝病滿閉淋溲便難轉筋又見心病煩心心痛掌中熱而噦當於足厥陰肝經內木火二字各瀉一針兄妹例假令見足厥陰肝經太過又兼見膽之證太過是為兄妹當瀉肝經內木火二字各一針又瀉膽經內水火二字各一針此五法乃人元法也以上子母兄妹名曰四針象俱屬人元圖靈五臟有六腑六腑有十二原十二原出於四關主治五臟五臟有疾當取之十二原十二原者五臟之所以稟三百六十五節氣味也五臟有疾應出十二原而原各有所出明知其原睹其應而知五臟之害矣陽中之少陰肺也其原出於太淵太淵二陽中之太陽心也其原出於大陵大陵二陰中之少陽肝也其原出於太衝太衝二陰中之至陰脾也其原出於太白太白二陰中之太陰腎也其原出於太溪太溪二膏之原出於鳩尾鳩尾一肓之原出於氣海氣海一凡此十二原者主治五臟六腑之有疾者也九針十二原難言肺之原出於太淵心之原出於大陵肝之原出於太衝脾之原出於太白腎之原出於太溪少陰之原出於兌骨膽之原出於丘墟胃之原出於衝陽三焦之原出於陽池膀胱之原出於京骨大腸之原出於合谷小腸之原出於腕骨十二經皆以俞為原者何也然五臟俞者三焦之所行氣之所留止也三焦所行之原為俞者何也然臍下腎間動氣者人之生命也十二經之根本也故名曰原三焦者原氣之別使也主通行三氣經歷於五臟六腑原者三焦之尊號也故所止輒為原五臟六腑之有病者皆取其原也海藏拔原例假令針肝經病了又於本經原穴亦下一針如補肝經亦於肝經原穴上補一針如瀉肝經來亦於肝經原穴上瀉一針如余經有補瀉針畢仿此例亦補瀉各經原穴靈黃帝曰余聞五臟六腑之氣滎輸所入為合令何道從入入安連過願聞其故岐伯答曰此陽脈之別入於內屬於腑者也黃帝曰滎輸與合各有名乎岐伯曰滎輸治外經合治內府黃帝曰治內府奈何岐伯曰取之於合黃帝曰合各有名乎岐伯答曰胃合於三里大腸合入於巨虛上廉小腸合入於巨虛下廉三焦合入於委陽膀胱合入於委中央膽合入於陽陵泉黃帝曰取之奈何岐伯答曰取之三里者低跗取之巨虛者舉足取之委陽者屈伸而索之委中者屈而取之陽陵泉者正豎膝豫之齊下至委陽之陽取之取諸外經者揄申而從之黃帝曰願聞六腑之病岐伯答曰面熱者足陽明病云云即前所謂內腑之病而用合穴治之也內腑病見針灸六腑條穴法下銅人神庭一穴在鼻直上入髮際五分足太陽督脈之會禁不可針針即發狂宜灸七壯至三七壯上星一穴在額顱上鼻直中入髮際一寸陷中容豆是穴督脈氣所發刺入二分留十呼灸三壯至五壯止不宜多灸囟會一穴在上星上一寸陷者中是穴督脈氣所發刺入三分灸二七壯七七壯止針入二分留三呼得氣即瀉前頂一穴在囟會上一寸五分骨陷中是穴督脈氣所發刺入一分可灸三壯至七七壯針入三分留七呼瀉五吸百會一穴一名三陽五會在前頂後一寸五分所中央旋毛中可容豆是手足三陽督脈之會刺入二分灸七壯後頂一穴在百會後一寸五分枕骨上督脈氣所發可灸五壯針入四分強間一穴在後頂後一寸五分督脈氣所發可灸五壯針入三分腦戶一穴在枕骨上強間後一寸五分足太陽督脈之會禁不可針灸七壯風府一穴在項後髮際上一寸大筋內宛宛中人疾言其肉立起言休立下足太陽督脈陽維之會禁不可灸灸之令人喑針入三分喑門一穴在項後入髮際五分宛宛中督脈陽維之會入系舌本仰頭取之不可灸針入八分上正頭部中行前髮際至後髮際十穴通長一尺一寸取頭部同身寸法見後雜法條曲差二穴在神庭旁一寸五分入髮際足太陽脈氣所發針入二分灸三壯五處二穴在上星旁一寸五分足太陽脈氣所發針入三分留七呼灸三壯承光二穴在五處後二寸足太陽脈氣所發針入三分不可灸通天二穴在承光後一寸五分足太陽脈也針入三分留七呼灸三壯絡卻二穴在通天後一寸五分足太陽脈氣所發針入三分灸三壯玉枕二穴在絡卻