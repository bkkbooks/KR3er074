body:
  text: 卷之二十二脾胃部腹痛丹腹痛有寒積熱死血食積濕痰垣夫心胃痛及腹中諸痛皆因勞力過甚飲食失節中氣不足寒邪乘虛而入客之故卒然而作大痛經言得炅則止炅者熱也以熱治寒治之正也然腹痛有部分臟腑有高下治之者亦宜分之如厥心痛者乃寒邪客於心胞絡也前人以良薑菖蒲大辛熱之味末之酒調服其痛立止此直折之耳真心痛者寒邪傷其君也手足青至節甚則旦發夕死夕發旦死中脘痛者太陰也理中建中草豆蔻丸之類主之臍腹痛者少陰也四逆薑附禦寒湯之類主之少腹痛者厥陰也正陽散回陽丹當歸四逆湯之類主之雜症而痛者苦楝湯酒煮當歸丸丁香楝實丸之類主之是隨高下治之也更循各臟部分穴俞而灸刺之如厥心痛者痛如針刺其心甚者脾之痛也取之然谷太溪餘臟皆然如腹中不和而痛者以甘草芍藥湯主之如傷寒誤下傳太陰腹滿而痛者桂枝加芍藥湯主之痛甚者桂枝加大黃湯主之夏月肌熱惡熱脈洪疾而痛者黃芩芍藥湯主之又有諸蟲痛者如心腹懊憹作痛聚往來上下行痛有休止腹熱善渴涎出面色乍青乍白乍赤嘔吐水者蛔咬也以手緊按而堅持之無令得脫以針刺之久持之蟲不動乃出針也或局方化蟲丸及諸蟲之藥量虛實用之不可一例治也海秋腹痛肌寒惡寒脈沉微足太陰足少陰主之桂枝芍藥湯中脘痛太陰也理中建中黃耆湯之類臍腹痛少陰也四逆真武附子湯之類小腹痛厥陰也重則正陽散回陽丹之類輕則當歸四逆湯之類太陰傳少陰痛甚者當變下利而止仲虛勞裡急腹中痛小建中湯主之方見傷寒羅肝勝乘脾真定路總管劉仲美年逾六旬有脾胃虛熱之證至元辛巳閏八月初天氣陰寒因官事勞役渴而飲冷夜半自利兩行平旦豫診視其脈弦細而微四肢冷手心寒唇舌皆青褐色腹中微痛氣短而不思飲食豫思內經云色青者肝也肝屬木唇者脾也脾屬士木剋土故色見於唇難經亦云見肝之病則知肝當傳之於脾故先實其脾氣令脾不受肝之邪也潔古先師云假令五臟各行己勝侮所不勝當重實不勝微瀉其勝以黃耆建中加芍藥附子湯主之且芍藥味酸瀉其肝木微瀉其勝黃耆甘草甘溫補實脾土皆重實其勝桂附辛熱治其寒水又助陽退陰飴糖甘溫補脾之不足肝苦急急食甘以緩之生薑大棗辛甘大溫生髮脾胃升騰其氣行其榮衛能緩其急每服一兩依法煎服再服而愈黃耆建中湯倍芍藥量虛實加附子本方見治虛實法仲理中湯方見傷寒少陰病垣草豆蔻丸治脾胃虛而心火乘之不能滋榮上焦元氣遇冬腎與膀胱之寒水旺時子能令母實致肺金大腸相輔而來克心乘脾胃此大復其仇也經曰大勝必大復故皮毛血脈分肉之間元氣已絶於外又大寒大燥二氣並乘之則苦惡風寒耳鳴及腰背相引胸中而痛鼻息不通不聞香臭額寒腦痛目時眩目不欲開腹中為寒水反乘痰唾涎沫食入反出腹中常痛及心胃痛脅下急縮有時而痛腹不能努大便多瀉而少祕下氣不絶或腸鳴此脾胃虛之極也胸中氣亂心煩不安而為霍亂之漸膈咽不通噎塞極則有聲喘喝閉塞或日陽中或暖房內稍緩口吸風寒則復作四肢厥冷身體沉重不能轉側不可回顧小便溲而時躁此藥主秋冬寒涼大復氣之藥也草豆蔻仁一錢四分麵裹煨去皮吳茱萸八分湯洗焙乾益智仁八分陳皮八分白殭蠶一錢甘草炙六分桃仁去皮尖七分青皮六分澤瀉一分小便數減半黃耆八分半夏一錢湯泡七次人參八分麥蘖一錢半炒神麯四分薑黃四分當歸身六分柴胡四分上件十七味同為細末桃仁另研如泥再入一處研勻湯浸蒸餅為丸如桐子大每服三五十丸白湯送下旋斟酌多少神聖復氣湯治復氣乘冬足太陽寒氣足少陰腎水之旺子能令母實手太陰肺實反來侮土火木受邪腰背胸膈閉塞痛疼善嚏口中涎目中泣鼻中流濁涕不止或有瘜肉不聞香臭咳嗽痰沫上熱如火下寒如水頭作陳痛目中流火視物䀮䀮耳鳴耳聾頭並口鼻或惡風寒喜日陽夜臥不安常覺痰塞膈咽不通口無滋味兩脅縮急而痛牙齒動搖不能嚼物腰臍間及尻臀膝足寒冷陰汗前陰冷行步欹側起居艱難掌中寒風痹麻木小便數而晝多夜頻而少氣短喘喝少氣不足以息卒遺矢無度婦人白帶陰戶中大痛牽心而痛黧黑失色男子控睪牽心陰陰而痛面如赭色食少大小便不調煩心霍亂逆氣裡急而腹皮色白後出餘氣腹不能努或腸鳴膝下筋急肩胛大痛此皆寒水來復火土之仇也乾薑炮三分人參五分半夏湯泡七分柴胡一錢藁本八分防風五分羌活一錢甘草八分升麻七分白葵花五朵去心歸身六分酒洗浸黑附子三分炮去皮臍桃仁湯浸去皮五分研郁李仁湯浸去皮五分上作一服水五盞煎至二盞入黃耆一錢草豆蔻一錢麵煨去皮稱陳皮五分上件入在內再煎至一盞再入下項藥黃柏五分酒浸黃連三分酒浸枳殼三分生地二分酒洗以上四味預一日另用新水浸又次入細辛二分川芎三分蔓荊子三分預一日用水半大盞分作二處浸此三味並黃柏等藥前正藥作一大盞不去渣入此浸藥再上火煎至一大盞去渣稍熱服空心又能治咬頰咬唇咬舌舌根強硬等症如神忌肉湯及食肉使不助經絡中火邪也大抵腎並膀胱經中有寒肺氣元氣不足者皆宜服之神驗於月生月滿時隔三五日一服如病急不拘時候益智和中丸季秋合治心腹中大痛煩躁冷汗自出草蔻仁四錢益智仁一錢三分砂仁七分甘草炙二錢半黃耆當歸身人參乾薑麥門冬曲末陳皮各五分桂枝桂花各一錢半大麥蘖炒三錢半黃連一錢生地一錢薑黃三分木香二分上為細末湯浸蒸餅為丸如桐子大每服二三十九溫水送下細嚼亦得溫胃湯治服寒藥多致脾胃虛弱胃脘痛白豆蔻三分益智砂仁甘草二分薑黃各二分陳皮七分澤瀉三分黃耆七分乾薑二分厚朴二分人參三分上為細末每服三錢水一盞煎至半盞食前溫服丹里成人年二十五歲肚痛二個月食少面微寒白朮陳皮青皮各半兩川芎白芍半夏各三錢蒼朮官桂歸身尾甘草炙木通各一錢分七帖薑二片煎下保和九二十粒一老人腹痛作隔不禁下者川芎蒼朮香附白芷茯苓乾薑滑石上八方皆治中寒虛寒腹痛也垣術桂湯治寒濕所客身體沉重胃脘痛面色痞黃麻黃一錢桂技五分杏仁十個草蔻仁半夏澤瀉炒曲各五分蒼朮三錢陳皮一錢白茯苓一錢豬苓五分黃耆各五分甘草二分炙上㕮咀水二大盞煎至一盞去渣稍熱服食前麻黃草豆蔻丸季秋合治客寒犯胃心胃大痛不可忍者麻黃去節二錢草豆蔻炒曲各一錢益智八分升麻大麥曲砂仁黃耆半夏湯泡白朮陳皮各五分去白柴胡甘草炙吳茱萸當歸身青皮木香厚朴各二錢蓽澄茄紅花蘇木各五分上為末湯浸蒸餅為丸如桐子大每服三五十丸細嚼溫水送下厚朴湯治脾胃虛寒心腹滿及秋冬客寒犯胃時作疼痛厚朴薑製陳皮去白二兩甘草炙乾薑各五錢茯苓去皮一兩戊火已衰不能運化又加客氣聚為滿痛散以辛熱佐以苦甘溫以淡泄之扶持胃氣以期平也羅高良薑湯治心腹絞痛如刺兩脅支滿不可忍高良薑五錢厚朴薑製當歸炒桂心各二錢上㕮咀以水一升煮取四合分二服若一服痛止便停不須更服若強人分二服劣人分三服增損之本治心脾痛神效荔枝核為末每服一錢熱醋湯調下仲四逆湯真武湯附子湯以上三方並見傷寒腹中寒氣雷鳴切痛胸膈逆滿嘔吐附子粳米湯主之附子一個炮半夏五分甘草半兩大棗十個粳米半升上五味以水八升煮米熟用湯或去渣溫服一升日三服羅益智散治傷寒陰盛心腹痞滿嘔逆瀉利手足厥逆及一切冷氣攻心脅臍腹脹滿絞痛川烏炮去皮臍四兩益智去皮乾薑炮青皮去白各一兩上為細末每服三錢水二盞生薑三片棗二枚劈破同煎至八分去渣溫服食前本又方治胸滿氣噫下部冷臍腹㽱痛半夏二兩制生薑六兩陳皮四兩去白桂一兩吳茱萸五十粒湯洗泡上㕮咀用水十升煮取四升分五服冷再服空心食前服豫少年時曾患臍㽱腹痛初不疑其虛遍服諸家藥無效遂自診之覺是虛症合此藥一劑服未至半劑頓愈海正陽散回陽丹當歸四逆湯以上三方方見傷寒羅蔥尉治驗內經云寒氣客於小腸膜原之間絡血之中血泣而不得注於大經血氣稽留不得行故宿昔而成積矣又寒氣客於腸胃厥逆上出故痛而嘔也諸寒作痛得炅則痛立止真定一秀士年三十一肌體本弱左脅下有積氣不敢食冷物覺寒則痛或嘔吐清水眩運欲倒目不敢開惡人煩冗靜臥一二日及服辛熱之藥則病退延至至元甲戌秋初因勞役及食冷物其病大作腹痛不止冷汗自出四肢厥冷口鼻氣亦冷面色青黃不澤全不得臥扶幾而坐咳嗽咽膈不利豫與藥服之見藥則吐藥不得入無如之何遂以熟艾約半斤用白紙一張鋪於腹上紙上攤艾令勻又以憨蔥數枝批作兩半片鋪於熟艾上再用白紙一張覆之以慢火尉斗尉之冷則易之覺腹中熱腹皮暖不禁以帛三搭多縫帶系之待冷方解初尉時得暖則痛減大暖則痛止至夜得睡翌日再與對證藥服之良愈故立此尉法以救將來之痛也海夏腹痛肌熱惡熱脈洪疾手太陰足陽明主之芍藥黃芩湯治腹痛脈洪數方見下滯下丹婦人肚墜痛不泄脈不數陳皮地黃芍藥二錢黃芩木通歸尾一錢甘草炙些桃仁二十四個經卒患腹痛水研山豆根汁半盞服之五靈脂湯治中暑肚腹疼不已五靈脂香附各等分上為末白湯調服腹痛或大便利或用手重按痛處不痛者為虛治法並於寒條選用之或無寒者如下方芍藥甘草湯芍藥甘草治腹痛稼穡作甘甘者己也曲直作酸酸者甲也甲己化土此仲景妙方也芍藥二兩甘草一兩上㕮咀每服五錢水煎服海藏云白收而赤散也酸以收之甘以鍰之海肚腹痛者芍藥甘草湯主之脈弦傷氣加芍藥脈洪傷金加黃芩加棗脈緩傷水加桂枝生薑脈澀傷血加當歸脈遲傷火加乾薑丹婦人痢後血少腹痛白芍藥二錢歸身尾一錢半陳皮二錢川芎五分調服六一散仲痛而祕者厚朴三物湯主之厚朴一兩大黃四兩枳實五個上三味以水一斗二升先煮二味取五升內大黃煮取二升溫服一升以利為度丹一男子年十八歲自小面帶微黃五月間腹大痛醫者與小建中湯加丁香兩帖不效加嘔吐清汁又與十八味丁沉透膈湯兩帖食全不進痛無休止臥不能起如此五六日又與阿魏丸百餘粒至夜發躁不得睡口卻不渴豫脈之左三部沉弦而數關部尤甚右三部沉滑而數實痛處不可按遂與大柴胡湯四帖加甘草下之痛嘔雖減食猶未進遂與小柴胡湯去黃芩人參加芍藥陳皮黃連生甘草二十帖而愈白雲許先生始因飲食作痰成脾疼後纍因觸冒風雪腿骨作疼衆皆以脾疼骨疼為寒雜進黃牙濊丹等藥雜治十餘年間艾灸數萬計或似有效及至病再作反覺加重至五十一歲時又冒雪乘船而病愈加至坐則不能起扶起亦不能行兩胯骨不能開合若脾疼作時則兩胯骨痛處似覺稍輕若飲食甘美脾疼不作則胯骨重痛增諸老袖手計無所出豫謂此初因中脘有食積痰雜以胃寒濕抑遏經絡血氣津液不行痰飲注入骨節往來如潮其湧而上則為脾疼降而下則為胯痛非湧泄之法不足以治之時七月二十四日遂以甘遂末一錢入豬腰子內煨與食之連瀉七行至次日兩足便能行步至八月初三日嘔吐大作不能起床顆粒不食但時煩躁氣弱不能言語諸老皆歸罪於七月之瀉而又知纍年熱補之誤皆不敢用藥豫嘗記金匱云病人無寒熱而短氣不足以息者此實也其病多年鬱結一旦以刀圭之劑泄之徒動猖狂之勢他未有制御之藥所以如此仍以吐劑達其上焦以次第治及中下二焦於初三日用瓜蒂吐不透初六日用梔子又吐不透初九日用附子尖三枚和漿水與之始得大吐其嘔噦終止前後所吐共得膏痰沫液一大水桶初十日遂以朴硝滑石黃芩石膏連翹等涼藥㕮咀一斤蒸煎濃汁放井水中極冷飲之十一月十二日十三日十四日每日食上件藥一斤十五日腹微滿大小便皆祕悶豫欲用大承氣下之諸老皆以為不可十六日六脈皆歇至豫診其脈獨歇至卯酉二時其餘時刻平勻如舊豫曰卯酉為手足陰陽之應此大腸與胃有積滯不行所致當速瀉之爭論不已至十八日遂作紫雪半斤十九日早紫雪成每用一匙頭以新汲井水化下至二十日天未明已服紫雪五兩神思稍安腹滿亦減遂收起紫雪不與二十一日大為小便閉作痛所苦遂飲以蘿蔔子汁半茶鍾隨手痛止小便立通二十二日小腹滿痛不可捫摸神思不佳遂以大黃牽牛作丸服至三百丸至二十三日巳時下大便並通如爛魚腸三碗許臭惡可畏是日神思稍安診其脈不歇至矣二十四日腹大絞痛殆不能勝者約一時許腰胯沉重且墜兩時不出聲不能言瀉下穢物如桕油條者一尺余肚中如燒片時方定至二十五日神思漸安夜間得睡二十六日漸能出聲言語自初二日至此並顆粒不曾入口語言並不出聲至二十七日方啜半盞稀粥者四次似有生意至次月初四日方平安其脈自嘔吐至病安日皆是平常弦大之脈唯有中間數日歇至少異耳至次年四月復行倒倉法方步履如初腸癰亦腹痛但小便數似淋脈滑數為異耳治法見腸癰本門肘治小腹俱脹痛短氣欲死或已絶用烏梅二七枚水五升煮一沸內大錢二七枚煮取二升半強人可頓服瘦人可分之再服海當歸丸治三陰受邪於心臍少三腹疼痛氣風等症四物湯各半兩防風獨活全蠍各五分續斷一兩苦楝玄胡各七錢木香丁香各二錢半茴香一兩炒上為細末酒糊丸桐子大空心溫酒下三五十丸大效四物苦楝湯四物湯四兩玄胡索苦楝各一兩云治腹中攪痛不可忍玄胡索當歸白芍川芎乾薑各等分上為末每服三錢溫酒調下又法治證同前玄胡索桂心各半兩當歸一兩上為細末熱酒調下失笑散治心腹痛欲死百藥不效服此頓愈方見心痛經治脾寒氣發歇痛不可忍者茱萸一兩桃仁一兩和炒令茱萸焦黑後去茱萸取桃仁去皮尖研細蔥白三莖煨熟以酒浸溫分三服腹痛脈滑者痰脈弦者食清痰多作腹痛臺芎蒼朮香附白芷上為末生薑自然汁調入熱湯服之溫中丸治食積肚痛白朮香附童便浸針砂各四兩醋浸炒紅山楂肉神麯各八兩苦參一兩川芎半兩春用夏去吳茱萸半兩湯浸冬用春去之蒼朮米泔浸一宿二兩五錢上為末醋調曲糊為丸如桐子大一方去山楂神麯川芎加半夏青皮黃連世蒼朮丸治失飢傷飽肚痛不食蒼朮炒橘紅等分為末上生薑汁打炒神麯糊丸如桐子大每七十丸米飲下丹酒積腹疼痛用三稜蓬莪朮香附官桂蒼朮厚朴陳皮甘草茯苓木香檳榔治之楊淳三哥年六十食積痰作痛在心頭或在腹脅脈皆弦澀食甚少大便祕實此濕積也宜生血行氣進食磨積補虛白朮炒曲半夏各一錢半郁李仁歸身尾芍藥陳皮各五錢山楂五錢川芎三錢人參二錢柴胡二錢紅花五分桃仁三個細末粥丸一日三次食前白湯下四五十丸羅七氣湯治虛冷上氣及寒氣怒氣思氣喜氣憂氣愁氣內結積聚堅牢如杯心腹絞痛不能飲食時發時止發即欲死此藥主之半夏湯洗五兩人參去蘆甘草炙肉桂各一兩上為粗末入半夏令勻每服二錢水一大盞生薑三片煎七分去渣稍熱服食前腹痛有作止者有塊耕起往來者吐清水者皆是蟲痛治法見心痛井窈渠吳孺人年近四十得腹隱痛常以火燒磚瓦尉之面與胸襟間惡火之熱氣發時少煩食亦減六脈和皆微弦最苦夜間不得睡但世上凶惡之事並憂苦境像皆上念時作惡泣説離別囑付後事如此者一年衆作心痛治之自覺氣自下衝上雖久病人卻不瘦豫曰此肝受病遂與防風通聖散吐之時尚春寒於通聖中加桂入薑汁調之日三四次至初夏稍熱與當歸龍膽丸枳朮丸一月而愈運氣腹痛有二一曰土盛攻腎而痛經云歲土太過雨濕流行腎水受邪民病腹痛清厥意不樂是也二曰火鬱之發痛經云火鬱之發民病腹中暴痛是也世鹽炒熱用布裹尉痛處神效丹攪腸沙用臺芎為末每一錢許入生薑自然汁半盞熱湯內調服又方樟木煎湯大吐之或用白礬末一錢清湯調服探吐之或鹽湯探吐之亦可世治發沙面青肚疼昏倒不省人事急以鼠屎一合研為細末滾湯調令通口澄清服之一服而安神效宜預收下刺灸腹痛有四法其一取脾胃經云邪在脾胃陽氣不足陰氣有餘則寒中腸鳴腹痛皆調於三里又云足太陰之別名曰公孫去本節之後一寸實則腹中切痛取之所別也又云腹痛刺臍左右動脈已刺按之立已不己刺氣衝已刺按之立已是也其二取大腸經云大腸病者腸中切痛而鳴濯濯感於寒即泄當臍而痛取巨虛上廉是也其三取督脈經云腎虛則胸中痛大腹小腹痛清厥意不樂取其經少陰太陽血者是也其四取任脈經曰任脈之別名曰尾翳下鳩尾散於腹實則腹皮痛取之所別也世治絞腸沙症手足厥冷腹痛不可忍者以手蘸溫水於病者膝灣內拍打有紫黑處以針刺去惡血即愈玉腹痛並治氣塊內關支溝照海撮氣痛並治積痛食不化氣海一寸半灸五十壯中脘二寸半灸十壯隱白二分瀉之灸七壯桑又法巨闕足三間怪穴腹痛腸鳴氣衝在氣海旁各一寸半針入二寸半灸五十壯世臍腹痛陰陵泉太衝三里支溝不已取下穴中脘關元天樞繞臍痛公孫三陰交陰谷東胃脘暴痛臍中堅痛石門商丘陰谷大腸俞膈俞甲腹中盡疼外陵主之大腸寒中千金作寒疝大便乾腹中切痛者肓輸主之繞臍痛搶心膝寒注利腹結主之仲夫瘦人繞臍痛必有風冷穀氣不行而反下之其氣必沖不沖者心下則痞也脈若腹痛脈反浮大而長者死蟲痛脈浮大無妨心腹痛痛不得息脈細小遲者生堅大疾者死有積脈堅大無妨胎前腹痛仲婦人懷胎腹中諸疾痛當歸芍藥散主之當歸三兩芍藥一斤茯苓四兩白朮四兩澤瀉半斤芎藭半斤一作三兩上六味杵為散取方寸匕酒和日三服潔地黃當歸湯治婦人有孕胎痛當歸一兩熟地二兩上為末作一服水三升煎至一升半去渣頓服之仲婦人腹中痛小建中湯主之方見虛勞云芎歸湯治妊娠先患冷氣忽心腹痛如刀刺川芎人參茯苓桔梗吳茱萸當歸各一兩厚朴制芍藥各二兩上㕮咀以水九升煎取三升分三服氣下即安丹孫院君因近喪冒惡氣傷胎肚痛手不可近發熱口中不思食須安胎散滯氣青皮三錢黃芩芍藥各二錢歸尾一錢半川芎一錢木香五分甘草炙少分二帖水三盞先煎苧根二大片至二盞去苧根入前藥同煎至一盞熱服大治妊娠腹痛用生地黃三斤搗汁酒一升合煎減半頓服愈脈師曰婦人有胎腹痛其人不安若胎病不動欲知生死令人摸之如覆杯者則男如肘頸參差起者女也冷在何面冷者為死溫者為生産後腹痛大黑神散治産後惡露不盡心胸痞滿臍腹撮痛汙血諸疾方見婦人産後丹産後三日血塊痛發熱五靈脂略炒牡丹皮沒藥滑石上研細分五帖豆淋酒下之食前馮宅産後發熱腹中痛有塊自汗惡寒曾服黑神散白朮芍藥三錢滑石五錢黃芩二錢半牡丹皮二錢半人參川芎歸尾陳皮荊芥各一錢乾薑一錢甘草些云卷荷散治産後血上衝心血刺血暈腹痛惡露不快初出卷荷紅花當歸各二兩蒲黃紙炒牡丹皮各半兩上為細末每服三錢空心溫酒調下一碗或用童便調下妙大治血瘕痛無定處童便三升生地汁生藕汁各一升生薑汁二升上先煎三味約三分減二次下薑汁慢火煎如稀餳每取一合溫酒調下治兒枕痛乃血瘕也用真蒲黃研細調服二錢如燥渴者用新汲水調下丹治産後兒枕大痛黑白散烏金石醋煅七次另研寒水石煅存性為末上各收之服時各抄一錢半米飲調下痛止勿服未止再服海四物加玄胡沒藥白芷湯治産後敗血作痛方見婦人門四物苦楝湯方見腹痛一方治臍下痛不可忍四物湯加玄胡索二錢半服之大紫金丸治産後臍下痛即失笑散醋為丸是也五靈脂蒲黃等分醋丸服立效散治産枕痛不可忍用五靈脂慢火炒令乾為末二錢溫酒下瘥産枕即血枕也丹産後惡露未盡小腹作痛五靈脂香附末上合和醋為丸甚者入留尖桃仁一方加蛤粉大治産後血不盡血痛悶方取敗荷葉燒作灰暖水和服煮汁服亦良又方取亂髮如雞子大灰汁洗淨燒為末酒調服二錢治産後血瘕腹痛及喉痹熱因寒用鐵稱錘鍛令通赤焠酒中候溫飲之丹溪法用焠醋中使鼻聞其氣妙仲産婦腹痛法當以枳實芍藥散假令不愈者此為腹中有乾血著臍下宜下瘀血湯主之亦主經水不利大黃二兩桃仁二十枚虻蟲二十個炒去足上三味為末煉蜜和為四丸以酒一升煎一丸取八合頓服之新血下如豚肝云又方療産後血結下不盡腹中絞痛不止大黃另浸生地當歸各二兩半川芎芍藥桂心各一兩甘草黃芩各二兩桃仁四十九個制上切細以水七升煮取二升半大黃更煎一二沸分三服桂心丸治産後血氣不散積聚成塊上攻心腹或成寒熱四肢羸瘦頭痛青皮乾漆炒煙盡各七錢沒藥檳榔當歸桂心赤芍牡丹皮各五錢大黃桃仁去皮尖鱉甲醋炙厚朴制三稜煨玄胡索各一兩上為細末煉蜜丸如桐子大每服三四十丸溫酒下保治血暈血結或聚於胸中或偏於小腹或連於脅肋四物湯四兩倍當歸川芎加鬼箭紅花玄胡各一兩同為粗末加四物煎調沒藥散服之虻蟲二錢去翅足炒水蛭一錢炒麝香少沒藥上為末入前藥調服血下痛止只服一服仲産後腹中疼痛當歸生薑羊肉湯主之方見産後血弱衍一婦人産當寒月寒氣入産門臍下脹滿手不得犯此寒疝也醫將治之以抵當湯謂其有瘀血也豫教之曰非其治也可服張仲景羊肉湯少減作二服遂愈仲內補當歸建中湯治婦人産後虛羸不足腹中刺痛不止吸吸少氣或苦少腹中急痛引腰背不能飲食産後一月日得服四五劑為善令人強壯當歸四兩桂枝三兩芍藥六兩生薑三兩甘草二兩大棗十二枚上六味以水一斗煮取三升分溫三服一日令盡若大虛加飴糖六兩湯成內於火上暖令飴消若去血過多崩傷內衄不止加地黃六兩阿膠二兩合八味湯成內阿膠服之云産後六七日忽然臍腹痛皆因呼吸冷氣乘虛入客於血分宜服當歸建中湯方見上大獨聖湯治産後腹痛當歸為末每服二錢水一盞煎至七分溫服云治産後惡物不盡腹內疼痛産後常服此妙生地當歸並略炒各一兩生薑五錢細切新瓦炒令焦黑上為細末薑酒調二錢服大治産後血塊痛熟地一斤陳生薑半斤上拌勻同炒乾為末每服一錢酒調産後以烏梅湯下之仲産後腹痛煩滿不得臥以枳實芍藥散主之枳實燒令黑勿太過芍藥研末上二味杵為散服方寸匕日三服並主癰膿以麥粥下之産後腹痛服枳實芍藥散不愈者宜下瘀血湯主之方見敗血條仲産後七八日無太陽症少腹堅痛此惡露不盡不大便煩躁發熱日晡時煩躁者不食食則譫語至夜即愈宜大承氣湯主之熱在裡結在膀胱也大承氣湯方見傷寒山兒枕痛用隔年蟹殼燒灰酒下丹局方五積散治産後余血作痛以蒼朮為君麻黃為臣厚朴枳實為使雖有當歸芍藥之補血僅及蒼朮三分之一不思産後之婦有何寒邪血氣未充似難發汗借曰藥性溫和可以推陳致新豈可用麻黃之悍附以蒼朮枳朴之散乎虛而又虛禍不旋踵矣産後血塊痛三陰交氣海宜灸之腸鳴垣如胃寒泄瀉腸鳴於升陽除濕湯加益智仁五分半夏五分生薑棗子和煎升陽除濕湯方見泄瀉丹腹中水鳴乃火擊動其水也二陳湯加芩連梔子腹中鳴者病本於胃也全文見水腫腸鳴多屬脾胃虛一男子腸鳴食少臍下有塊耕動若得下氣多乃已已則復鳴醫用疏氣藥與服半年不效豫用參術為君甘草連參枳乾薑為臣一帖腸鳴止食進又每服吞厚朴紅豆丸其氣耕亦平經云脾胃虛則腸鳴腹滿又云中氣不足腸為之苦鳴此之謂也肺移寒於腎為湧水湧水者按之腹不堅水氣客於大腸疾行則鳴濯濯如囊裹水漿之聲也全文見診病傳變河葶藶丸治湧水疾行則腹鳴如囊裹水漿之聲葶藶隔紙炒澤瀉椒目桑白皮杏仁豬苓去黑皮各五錢上為末煉蜜丸桐子大每二十丸蔥白湯下不拘時以利為度運氣腸鳴有二一曰土發經云土鬱之發腸鳴而為數後是也二曰熱勝經云少陰在泉熱淫所勝病腹中腸鳴氣上衝胸治以鹹寒是也針灸腸鳴有三法其一補脾經云脾虛則腹滿腸鳴飧泄食不化取其經太陰陽明少陰血者是也其二補足太陽經云中氣不足腸為之苦鳴補足外踝下留之五分申脈穴也其三取太陽經云腸中雷鳴氣上衝胸邪在大腸刺肓之原巨虛上廉三里是也甲腹中常鳴時上衝心灸臍下腹中腸鳴盈盈然食不化脅痛不得臥煩熱泄糜不嗜食胸脅搘滿喘息而沖鬲嘔心痛及傷飽身黃骨瘦羸章門主之腸鳴相逐不可傾倒承滿主之腸鳴而痛溫留主之飲食不下腹中雷鳴大便不節小便赤黃陽綱主之嘔吐膈氣總論潔論曰吐有三氣積寒也皆從三焦論之上焦在胃口上通天氣主內而不出中焦在中脘上通天氣下通地氣主腐熟水穀下焦在臍下下通地氣主出而不納是故上焦吐者皆從於氣氣者天之陽也其脈浮而洪其症食已暴吐渴欲飲水大便燥結氣上衝胸而發痛其治當降氣和中中焦吐者皆從於積有陰有陽食與氣相假為積而痛其脈浮而弦其症或先痛而後吐或先吐而後痛治法當以小毒藥去其積檳榔木香和其氣下焦吐者皆從於寒地道也其脈大而遲其症朝食暮吐暮食朝吐小便清利大便祕而不通治法宜毒藥通其閉塞溫其寒氣大便漸通復以中焦藥和之不令大腑結閉而自安也上潔古論三焦吐其説蓋本於黃帝所謂氣為上膈食飲入而還出為下膈食晬時乃反出之其上焦食已暴吐者今世謂之嘔吐也中下二焦朝食暮吐暮食朝吐者今世謂之膈氣反胃也分嘔吐膈氣為二門垣夫嘔吐噦者俱屬於胃胃者總司也以其氣血多少為異耳且如嘔者陽明也陽明多血多氣故有聲有物氣血俱病也仲景云嘔多雖有陽明症慎不可下孫真人云嘔家多服生薑乃嘔吐之聖藥也氣逆者必散之故以生薑為主吐者太陽也太陽多血少氣故有物無聲乃血病也有食入則吐有食已則吐以陳皮去白主之噦者少陽也少陽多氣少血故有聲無物乃氣病也以薑製半夏為主故朱奉議治嘔吐噦以生薑半夏陳皮之類是也究其三者之源皆因其脾虛弱或因寒氣客胃加之飲食所傷而致也宜以丁香藿香半夏茯苓陳皮生薑之類主之按噦內經實指厄逆今先賢誤釋為乾嘔者非也若但有內傷而有此疾宜察其虛實使內消之痰飲者必下之當分其經對證用藥不可亂也嘔有物有聲仲諸嘔吐谷不得下者小半夏湯主之嘔家本渴渴者為欲解今反不渴心下有支飲故也小半夏湯主之用半夏一升生薑半斤以水七升煮取一升半分溫再服卒嘔吐心下痞腸閉有水眩悸者小半夏加茯苓湯主之半夏一升生薑半斤茯苓三兩一法四兩上三味以水七升煮取一升半分溫再服陳皮湯治嘔方見乾嘔孫治嘔吐以白檳榔一枚煨陳皮十分炙銼為末水一盞煎半盞服之上薑半橘治嘔吐必用之聖藥然東垣云辛藥生薑之類治嘔吐但治上焦氣壅表實之病若胃虛穀氣不行胸中閉塞而嘔者惟宜益胃推揚穀氣而已勿作表實用辛藥瀉之仲胃反嘔吐者大半夏湯主之服前小半夏湯諸湯不愈者服此立愈半夏二升洗完用人參三兩白蜜一升上三味以水一斗三升和蜜揚之二百四十遍煮藥取三升溫服一升余分再服李絳療反胃嘔吐無常粥飲入口即吐困倦無力垂死者以上黨人參三大兩劈破水一大升煮取四合熱頓服丹久病嘔者胃虛不納穀也生薑人參黃耆白朮香附胃虛有寒嘔吐者東垣丁香茱萸湯仲景理中湯皆益胃推揚穀氣之劑也方見寒條垣若陰虛邪氣逆上窒塞嘔噦不足之病此地道不通也正當用生地黃當歸桃仁紅花之類和血涼血潤血兼用甘草以補其氣微加大黃芒硝以通其閉大便利邪氣去則氣逆嘔噦自不見矣復有胸中虛熱穀氣久虛發而為嘔噦者但得五穀之陰以和之則嘔噦自止五穀皆屬陰或食或飲白湯或喜涼者飲涼水皆能止嘔噦不必用藥也仲嘔而腸鳴心下痞者半夏瀉心湯主之方見傷寒垣加減二陳湯治痰飲為患或嘔噦噁心或頭眩心悸或中脘不快或發為寒熱或因食生冷脾胃不和並宜治之丁香一兩半夏五兩陳皮五兩茯苓二兩甘草一兩半上㕮咀每服四錢水一盞半生薑三片烏梅一個同煎至七分去渣熱服無時或治痰痞加草豆蔻麵裹煨熟一兩半藿香安胃散治脾胃虛弱不飲食嘔吐不時藿香錢半丁香二錢人參二錢橘紅五錢上件四味為細末每服二錢水二盞生薑三片同煎至一盞去渣服食前垣丁香吳茱萸湯治嘔吐噦胃寒所致丁香五分吳茱萸草豆蔻人參各一錢甘草五分炙黃芩一錢柴胡五分升麻七分茯苓五分當歸錢半蒼朮一錢半夏五分乾薑五分上為細末每服半兩水二盞煎至一盞去渣熱服食前忌冷物世藿香平胃散治嘔吐不止藿香一兩半夏二兩陳皮去白二兩厚朴一兩制蒼朮三兩泔浸甘草二兩炙上為粗未每服五錢水一盞半生薑三片棗三枚同煎去渣溫服羅紅豆丸諸藥不愈者神效方見膈氣寒條杜安業坊有閻氏家老婦人患嘔吐請石秀才醫曰胃冷而嘔下理中丸至百餘丸其病不愈石疑此患召杜至曰藥病正相投何必多疑石曰何故藥相投而病不愈杜曰寒氣甚藥力未及更進五十丸必愈如其言果愈石於是師法於杜海理中湯加減例理中湯方甘草人參白朮乾薑各等分若為寒氣濕氣所中者附子一兩名附子理中湯若霍亂吐瀉者加橘紅青橘皮各一兩名治中湯若干霍亂心腹作痛先吃鹽湯少許頓服嘔吐出令透即進此藥若嘔吐者於治中湯內加丁香半夏一兩生薑十片若泄瀉者加橘紅茯苓各一兩名補中湯若泄瀉不已者於補中湯內加附子一兩不喜飲食水穀不化者再加炒砂仁一兩共成八味若藿亂吐下心腹作痛手足逆冷於本方中去白朮加熟附名四順湯若傷寒結胸先以桔梗枳殼等分煎服不愈者及吐利後胸痞欲絶心膈高起急痛手不可近者加枳實茯苓各一兩名枳實理中湯若渴者但於枳實理中湯內加栝蔞根一兩若霍亂後轉筋者理中湯內加石膏一兩火煅若臍下築者腎氣動也去朮加官桂一兩腎惡燥故去朮恐作奔豚故加官桂若悸多者加茯苓一兩若渴欲飲水者加朮半兩若苦寒者加乾薑五錢若腹滿者去白朮加附子一兩若飲酒過多及啖炙爆熱食發為鼻衄者加川芎一兩若傷胃吐血以此藥能理中脘分利陰陽安定血脈只用本方若中附子毒者亦用此方或止用甘草生薑等分煎服或以烏豆煎湯解之仲嘔而胸滿者吳茱萸湯主之方見傷寒吐嘔而脈弱小便復利身有微熱見厥逆者四逆湯主之方見傷寒下利杜王普侍郎病嘔飲食皆不得進召孫數日亦不愈後復召杜杜曰治嘔愈嘔此胃風也遂用川烏一兩淨洗去皮臍不去尖以漿水一碗煮乾每個作兩片復用漿水一碗煮盡更作四片每細嚼一片以少溫水下少頃嘔遂止痛既少息杜遂問曰尋常好吃何物曰好吃甘甜之物杜曰是甘甜乃膏粱之物積久成熱因而生風非一朝一夕之故也王服其説痛而嘔為寒經云寒氣客於腸胃厥逆上出故痛而嘔者是也丹嘔吐胃中有熱膈上有痰二陳湯加炒梔子黃連生薑主之此方纍試效仲嘔而發熱者小柴胡湯主之方見往來寒熱潔用小柴胡湯加青黛以薑汁打糊為丸名青鎮丸治嘔吐脈弦頭痛蓋本諸此本治胃熱嘔以竹茹湯乾葛三錢甘草二錢半夏三錢薑汁半盞漿水一升煮耗半上末每服五錢水一盞薑三片竹茹一彈大棗一枚同煎至一盞去渣溫服有熱者手足心熱政和年有京人病傷寒得汗身涼數日忽嘔吐藥與飲食俱不下醫者皆進丁香藿香滑石等藥下咽即吐豫曰此正汗後餘熱留胃脘孫兆竹茹湯正相當爾治藥與之即時愈良方中槐花散亦相應定嘔吐利膈枇杷散枇杷葉去毛味苦平下氣人參各一錢茯苓五錢茅根二兩半夏一錢上細銼每服四錢水一盞半生薑七片慢火煎至七分去渣入檳榔末五分和勻服之仲嘔吐而病在膈上後思水解急與之思水者豬苓散主之豬苓茯苓白朮各等分上三味杵為散飲服方寸匕日三服仲景云嘔吐思水解者急與之豫長男每嘔水三二碗諸藥不效但吃井花水一口即住用白朮茯苓湯服愈信知先賢不誣也本治卒嘔吐不止不欲食煮枇杷葉汁飲之止渴偏理嘔啘丹婦人月經時口渴吃水多心痞善嘔不食白朮二錢陳皮二錢山梔炒木通黃芩各一錢炙甘草些分二帖水二盞煎小盞入薑汁熱飲之本治産後嘔不止者香靈丸丁香辰砂另研各六分五靈脂一錢上香脂先研末後入砂再研勻用狗膽或豬膽丸如雞頭大每服一丸生薑陳皮湯磨下諸痿喘嘔皆屬於上全文見診素太陰所謂食則嘔者物盛滿而上溢故嘔脈解篇辛散逆氣諸方用薑半橘之類並見上壅條廣治嘔逆不能食訶黎勒皮二兩去核搗為末煉蜜和丸槐子大空心服二十丸日二服食木瓜主嘔啘風氣又吐而轉筋煮木瓜汁飲之甚良世若病人直患嘔吐而復腳弱或疼乃是腳氣當作腳氣治之運氣嘔吐有四一曰火熱經云少陰司天熱氣下臨嘔逆躁煩又云少陽所至為嘔湧又云少陽之復嘔逆又云火鬱之發嘔逆治以鹹寒甘寒是也二曰風經云厥陰在泉風淫所勝病食則嘔又云厥陰司天風淫所勝食則嘔又云厥陰之勝甚則嘔又云厥陰之復嘔吐飲食不入入而復出甚則入脾食痹而吐治以辛涼甘清酸清是也三曰風火經云少陽司天之政風熱參布民病嘔吐二之氣病熱鬱於上咳逆嘔吐三之氣民病嘔又云太陽司天之政初之氣病見熱頭痛嘔吐治以酸寒辛寒鹹寒是也四曰濕經云陽明司天之政初之氣其病嘔又云土鬱之發甚則心痛腳腫嘔吐是也針灸嘔吐取法有二其一取脾經云脾足太陰之脈是動則病食則嘔視盛虛熱寒陷下取之也其二取肝經云肝足厥陰之脈所生病者胸滿嘔逆視盛虛熱寒陷下取之也潔嘔盛無度並乾嘔大陵間使扁嘔逆中脘尺澤摘胸中痰飲霍亂驚悸腹脹暴痛恍惚吐逆不食巨闕六分三里立愈肝脈緩為善嘔全文見診虛實法垣孫真人言生薑為嘔家聖藥謂上焦氣壅表實之病而言非以瀉氣而言之也若脾胃虛弱穀氣不行榮衛下流是中氣不利清氣津液不上胸中閉塞氣道不開亦令人噦惟宜益胃推揚穀氣而已勿作外實以辛藥生薑之類瀉其壅滯及妄以瀉氣瀉血藥下之下之則轉增閉塞疼痛或變作結胸復下其膈由此致危者多矣蓋氣已虛而反瀉之是重瀉其氣必胸中如刀削之痛與正結胸無異可不慎哉丹嘔吐煎藥忌栝蔞杏仁桃仁蘿蔔子山梔皆要作吐丸藥中帶香藥行散不妨注船大吐渴飲水者即死童便最好吐有物無聲潔治上焦氣熱上衝食已暴吐脈浮而洪宜先降氣和中桔梗湯桔梗一兩半白朮一兩半半夏曲二兩陳皮去白枳實炒茯苓厚朴各一兩上粗末每服一兩水一盞煎至七分取清溫調木香散二錢隔夜空腹服之三服後氣漸下吐漸去然後去木香散加芍藥二兩黃耆一兩半同煎服之病愈則止如大腑燥結食不盡下以大承氣湯去硝微下之少利為度再服前藥補之如大便復結又依前微下之木香散木香檳榔等分上為細末同前藥調下保治暴吐上焦氣熱所沖也經曰諸嘔吐酸暴注下迫皆屬於火脈洪而浮者荊黃湯主之荊芥一兩人參五錢甘草二錢半大黃二錢上粗末作一服水二盞煎至一盞去渣調檳榔散二錢空心服之檳榔散檳榔二錢木香一錢半輕粉少許上為細末同煎藥下如丸亦用水浸蒸餅為丸如小豆大每服二十丸食後服李絳獨參湯治嘔吐胃弱欲死方見嘔胃虛條仲大黃甘草湯治食已即吐又治吐水大黃四兩甘草一兩上二味以水三升煮取一升分溫再服潔金花丸治吐食而脈弦者由肝勝於脾而吐乃由脾胃之虛宜治風安胃半夏湯洗一兩檳榔二錢雄黃錢半上細末薑汁浸蒸餅為丸如桐子大小兒另丸薑湯下從少至多漸次服之以吐止為度風痰羈絆於脾故飲食不下治吐頭痛有汗脈弦青鎮丸主之柴胡一兩黃芩七錢半甘草半夏三錢青黛二錢半人參五錢上細末薑汁浸蒸餅丸桐子大每服五十丸薑湯食後下仲胃反吐而渴欲飲水者茯苓澤瀉湯主之茯苓半斤澤瀉四兩甘草二兩桂枝二兩白朮三兩生薑四兩上六味以水一斗煮取三升內澤瀉再煮取二升半溫服八合一日三服本食即吐欲作反胃白朮散澤瀉白朮茯苓各等分上為末每服一錢湯調溫服經治丈夫婦人吐逆連日不止粥食湯藥不能下者可以五靈脂不夾土石揀精好者不計多少搗細末研狗膽汁和為丸如雞頭大每服一丸煎熱生薑酒磨細更以少生薑酒化下凡湯藥令極熱須是先做下粥溫熱得所左手與患人藥吃不得漱口右手急將粥與患人吃不令太多碧霞丸治吐逆立效黃丹四兩篩過用好米醋半升同藥入銚內煎乾卻用炭火三稱就銚內煅透紅冷取研細為末用粟米飯丸如桐子大煎酵湯下七丸不嚼只一服運氣吐皆屬風木經云厥陰之復甚則入脾食痹而吐又云歲木太過風氣流行民病脅痛吐食治以酸清之類是也灸刺見前灸刺嘔吐條脈陽緊陰數其人食已即吐陽浮而數亦為吐寸緊尺澀其人胸滿不能食而吐寸口脈數其人則吐寸口脈細而數數則為熱細則為寒數為嘔吐仲問曰病人脈數數為熱當消穀引食而反吐者何也師曰以發其汗令陽微膈氣虛脈乃數數為客熱不能消穀胃中虛冷故吐也乾嘔無物有聲仲乾嘔噦若手足厥者陳皮湯主之陳皮四兩生薑半斤上二味以水七升煮取三升溫服一升下咽即愈肘主卒乾嘔不息取甘蔗汁溫服半升日三又以生薑汁一升服並瘥治卒乾嘔不息搗葛根絞取汁服一升瘥本草云生葛根汁大寒噁心欲吐不吐丹噁心有熱有痰皆用生薑隨證用藥仲病人胸中似喘不喘似嘔不嘔似噦不噦徹心中憤憤然無奈者生薑半夏湯主之半夏半斤生薑一升上二味以水三升煮半夏取二升內生薑汁煮取二升半少冷分四服日三夜一服止停後服垣茯苓半夏湯治胃氣虛弱身重有痰噁心欲吐是邪氣羈絆於脾胃之間當先實其脾胃炒曲三錢大麥蘖半兩炒黃陳皮天麻各二錢白朮白茯苓半夏各一兩上為粗未每服五錢水二盞生薑五片煎至一盞去渣熱服柴胡半夏湯治舊有風症不敢見風眼澀眼黑胸中有痰噁心兀兀欲吐但遇風覺皮肉緊手足難舉動重如石若在暖室少出微汗其症隨減再遇風病復如是半夏二錢炒曲一錢生薑三片柴胡升麻各五分蒼朮一錢藁本五分白茯苓七分上為粗末只作一服水二盞煎至五沸去渣溫服張文仲治胃氣冷吃食即欲得吐以白豆蔻仁三枚搗篩更研細好酒一盞微溫調之並飲三兩盞佳仲病人欲吐者不可下之云蒲黃散治産後三四日惡露不下嘔逆壯熱芍藥二兩五錢知母二兩生薑當歸蒲黃各二兩紅花五錢荷葉心中蒂一個生地汁一盞上㕮咀水二升煎至一升去渣下蒲黃煎數沸空心分三服療産後嘔吐不止橘紅一兩半夏曲甘草各五錢藿香一兩上為細末每服三錢薑三片水煎大開胃散治産後胃氣不和嘔吐不止全不納飲食訶子肉一兩半人參一兩甘草半兩上三味為細末別以半夏半分生薑一分蔥白二七莖水二大盞煎至六分去渣分為二服嘔苦水丹鄭宅如夫人清早嘔苦水脈澀而微起轉如常此胃弱而上脘有濕也黃芩七錢滑石一兩半蒼朮一兩炒飛礬二兩陳皮一兩山楂一兩半夏一兩桔梗五錢炒芩五錢薑水煎服刺灸嘔苦獨取膽與胃經云善嘔嘔有苦長太息邪在膽逆在胃膽液泄則口苦胃氣逆則嘔苦故曰嘔取膽三里以下胃氣逆則刺少陽血絡以開膽逆卻調虛實以去其邪又云口苦嘔宿汁取陽陵泉是也運氣嘔苦皆屬燥經云陽明在泉燥淫所勝病善嘔嘔有苦又云陽明之勝嘔苦治以苦溫辛溫是也吐酸吞酸丹或曰吞酸素問明以為熱東垣又以為寒何也豫曰吐酸與吞酸不同吐酸是吐出酸水如醋平時津液隨上升之氣鬱積而成積成積既久濕中生熱故從木化遂作酸味非熱而何其有鬱積之久不能自湧而出伏於肺胃之間咯不得上咽不得下肌表得風寒則內熱愈郁而酸味刺心肌表溫暖腠理開發或得香熱湯丸津液得行亦可暫解非寒而何素問言熱者言其本也東垣言寒者言其末也但東垣不言外得風寒而作收氣立説欲瀉肺金之實又謂寒藥不可治酸而用安胃湯加減二陳湯俱犯丁香且無治熱濕鬱積之法為末合經意豫嘗治吞酸用黃連茱萸各制炒隨時令迭為佐使蒼朮茯苓為輔湯浸蒸餅為小丸吞之仍教以糲食蔬果自養則病易安吞酸用吳茱萸順其性而折之此反佐之法也必須以炒黃連為君咽醋丸茱萸去枝梗半兩煮曬乾陳皮去白五錢黃芩炒五錢蒼朮七錢半黃連一兩細切用陳壁泥同炒上為細末曲糊丸桐子大參萸丸可治吞酸不可治自利方見泄瀉兵部手集治酸心每醋氣上攻如酸醋茱萸一合水三盞煎七分頓服縱濃亦強服梅治酸心檳榔四兩陳皮二兩細搗為末空心生蜜湯下方寸匕丹丈夫因外感涼氣與宿飲相搏心下酸戚嘔清水後有紅青皮三錢黃芩錢半人參二錢紫蘇木通甘草枳殼二錢桔梗錢半麻黃五分垣病機云諸嘔吐酸皆屬於熱辨云此上焦受外來客邪也胃氣不受外邪故嘔傷寒論云嘔家雖有陽明證不可攻之是未傳入里三陰不受邪也亦可見此證在外也仲景以生薑半夏治之孫真人云嘔家多用生薑是嘔家聖藥以雜病論之嘔吐酸水者甚則酸水浸其心不任其苦其次則吐出酸水令上下牙酸澀不能相對以大辛熱劑療之必減吐酸嘔出酸水也酸味者收氣也西方肺金旺也寒水乃金之子子能令母實故用大咸熱之劑瀉其子以辛熱為之佐以瀉肺之實以病機之法作熱攻之者誤矣蓋雜病醋心濁氣不降欲為中滿寒藥豈能治之乎加減二陳湯藿香安胃散二方並見前嘔吐痰飲門本豫平生有二疾一則下血二則膈中停飲下血有時而止停飲則無時始因年少時夜坐為文左向伏几案是以飲食多墜向左邊中夜以後稍困乏必飲酒二三盞既臥就枕又向左邊側睡氣壯盛時殊不覺三五年後覺酒止從左邊下漉漉有聲脅痛飲食外減十數日必嘔數升酸水暑月止是右邊身有汗漐漐常潤左邊病處絶燥遍訪名醫及海上方服之少有驗者間或中病止得月餘復作其補如天雄附子礬石其利如牽牛甘遂大戟備嘗之矣豫後揣度之已成癖囊如潦水之有科臼不盈科不行水必盈科而行也清者可行濁者依前停蓄蓋下無路以出之也是以積之五七日必嘔而去稍寬數日復作脾土惡濕而水則流濕莫若燥脾以勝濕崇土以堆科臼則疾當去矣於是悉屏諸藥一味服蒼朮三月而除自此後一向數年不吐不嘔胸膈寬飲啖如故暑月汗周體而身涼飲亦從中下前此飲漬其肝目亦多昏眩其後燈下能書細字皆蒼朮之力也其法蒼朮一斤去皮切末之用白芝麻半兩水二盞研攄取汁大棗十五枚爛煮去皮核研以麻汁勻研成稀膏搜和入臼熟杵丸如桐子大干之每日空腹溫湯吞下五十丸加至一百丸二百丸忌桃李雀鴿初服時必膈微燥且以茅朮制之覺燥甚再進山梔子散一服久之不燥也豫服半年以後止用燥烈味極辛者削去皮不浸極有力亦自然不燥山梔散用山梔一味干之為末沸湯點服故知久坐不可伏向一邊時或運動亦調息之法治酒癖停飲吐酸水乾薑丸聖惠方乾薑葛根枳殼橘紅前胡各五錢白朮半夏曲各一兩茱萸甘草各一分上細末煉蜜丸如桐子大每服三十丸用米飲服有效治中風痰涎飲眩瞑嘔吐酸水頭痛惡心半夏二兩南星白附各一兩上並生為末滴水丸如桐子大以生面裹衣陰乾每服十丸至二十丸生薑湯下子和棠溪張鳳村一田叟姓楊其病嘔酸水十餘年本留飲諸醫皆以燥劑治之中脘臍胻以火艾燔針刺之瘡未嘗合戴人以苦劑越之其涎如膠乃出二三升談笑而愈運氣吐酸皆屬於熱經云諸嘔吐酸皆屬於熱又云少陽之勝欲嘔嘔酸治以辛寒是也東吐宿汁吞酸章門神光嘔吐清水本一味蒼朮丸治嘔吐清水如神方見吐酸濕條仲茯苓飲治心胸中有停痰宿水自吐出水後心胸間虛氣滿不能食消痰氣令能食茯苓人參白朮各三兩枳實二兩陳皮五錢生薑四兩上六味水六升煮取一升八合分溫三服如人行八九里進之丹盛兄兩手麻弦飲後嘔清水神麯蒼朮香附各五錢益元散一兩半夏七錢半上為末薑汁浸蒸餅為丸仲渴欲飲水水入則吐者名曰水逆五苓散主之方見傷寒丹施卜年四十因灸艾火太多病腸內下血糞肚痛今痛自止善嘔清水食不下宜清胃口之熱黃芩五分陳皮地黃各一錢白朮一錢半連翹錢半甘草茯苓五分生薑三片千治痰飲水吐無時節者其源因冷飲過度遂令脾胃氣羸不能消於飲食飲食入胃則皆變成冷水反吐不停皆赤石脂散主之赤石脂一斤搗篩服方寸匕酒飲時稍加至三匕服盡一斤終身不吐痰水又不下痢補五臟令人肥健有人痰飲服藥不愈用此方愈運氣嘔吐清水有二一曰濕經云太陰之復嘔而密默唾吐清液治以甘熱是也二曰寒經云諸病水液澄徹清冷皆屬於寒是也嘔沫仲乾嘔吐逆吐涎沫半夏乾薑散主之半夏乾薑各等分上二味杵為散取方寸匕漿水一升半煎取七合頓服之乾嘔吐涎沫頭痛者吳茱萸湯主之方見傷寒婦人吐涎沫醫反下之心下即痞當先治其吐涎沫小青龍湯主之涎沫止乃治痞瀉心湯主之刺灸嘔沫獨取手太陰經云手太陰厥逆虛滿而咳善嘔沫治主病者是也脾脈微急為膈中食飲入而還出後沃沫全文見虛實法經云急者多寒嘔膿仲嘔家有癰膿不可治嘔膿儘自愈嘔吐蟲丹吐蟲黑錫炒成灰檳榔末米飲調下仲蛔厥者當吐蛔今病者靜而復時煩此為臟寒蛔上入膈故煩須臾復止得食而嘔又煩者蛔聞食臭出其人當自吐蛔蛔厥者烏梅丸主之又主痢方見傷寒厥陰論刺灸嘔蟲獨取胃經云胃咳之狀咳而嘔嘔甚則長蟲出取胃三里是也脈關上脈微浮積熱在胃中嘔吐蛔蟲心健忘仲病人有寒復發汗胃中冷必吐蛔吐利成無己云若止嘔吐而利經云謂之吐利是也上吐下利躁擾煩亂乃謂之霍亂其與但稱吐利者有異也蓋暴於旦夕者為霍亂可數日久者為吐利今以暴為霍亂者寓於傷寒吐利門徐而日久者入此門海上吐下瀉不止當渴而反不渴脈微細而弱者理中湯主之方見傷寒丹泄瀉或嘔吐六一散生薑汁湯調丈夫因辛苦發熱腰腳痛吐瀉交作白朮滑石陳皮各二錢木通柴胡錢半人參一錢甘草五分脈心乘肝必吐利運氣吐利有二一曰風木經云厥陰所至為嘔泄又云木太過曰發生發生之紀上徵則氣逆其病吐利是也二曰寒水經云水太過曰流衍流衍之紀其動漂泄沃湧是也漂泄謂泄利沃湧謂吐沫也咳嘔腹痛且發泄其脈絶是逆也全文見診生死仲乾嘔而利者黃芩加半夏生薑湯主之黃芩三兩甘草炙二兩芍藥三兩半夏半斤生薑四兩大棗二十個上六味以水一斗煮取三升去滓溫服一升日再夜一服黃芩湯治乾嘔下利黃芩二兩人參乾薑各三兩桂枝一兩大棗十二個半夏半兩上六味以水七升煮取三升溫分三服潔水煮金花丸治有痰而泄痢不止甚則嘔而欲吐利下而不能食由風痰羈絆脾胃之間半夏一兩湯洗天南星一兩洗天麻半兩寒水石燒存性一兩雄黃一錢半白麵四兩上為末滴水為丸桐子大每服百丸先煎漿水沸下藥煮令浮為度漉出生薑湯下食前關格關者不得小便格者吐逆上下俱病者也難邪在六腑則陽脈不和陽脈不和則氣留之氣留之則陽脈盛矣邪在五臟則陰脈不和陰脈不和則血留之血留之則陰脈盛矣陰氣太盛則陽氣不得相營也故曰格陰盛陽不得營故寸口大三四倍於人迎陽氣太盛則陰氣不得相營也故曰關陽盛陰不得營故人迎大三四倍於寸口陰陽俱盛不得相營也故曰關格關格者不得盡其命而死矣三十七難潔關則不得小便格則吐逆關者甚熱之氣格者甚寒之氣是關無出之由故曰關也格無入之理故曰格也寒在胸中遏絶不入熱在下焦填塞不便云陰陽易位病名關格胸膈上陽氣常在則熱為主病身半已下陰氣常在則寒為主病寒反在胸中舌上白胎而水漿不下故曰格格則吐逆熱在丹田小便不通故曰關關則不得小便胸中有寒以熱藥治之丹田有熱以寒藥治之若胸中寒熱兼有以主客之法治之治主當緩治客當急尺寸反者死陰陽交者死關格者不得盡其命而死矣丹必用吐提其氣之橫格不必在出痰也有痰以二陳湯吐之吐中便有降有中虛氣不運者補氣藥中升降之孫奉職趙令儀女忽吐逆大小便不通煩亂四肢漸冷無脈凡一日半與大承氣湯一劑至夜半漸得大便通脈漸和翌日乃安此關格之病極為難治垂死而活者惟此一人耳孫治大小便不通關格不利燒皂角細研粥飲下三錢立通外關格脹滿大小便不通獨頭蒜燒熱去皮紙裹納下部氣立通仲寸口脈浮而大浮為虛大為實在尺為關在寸為格關則不得小便格則吐逆脈下微本大者則為關格不通不得尿頭無汗者可治有汗者死成注云下微謂脈沉之而微也本大謂關後脈大也膈氣丹局方治氣一門有曰治一切氣冷氣滯氣逆氣上氣用安息香丸丁沉丸大沉香丸蘇子丸勻氣散如神丸集香丸白沉香丸煨薑丸鹽煎散七氣散溫白丸生薑湯其治嘔吐膈噎也用五膈丸五膈寬中散膈氣散酒症丸草豆蔻丸撞氣丸人參丁香散其治吞酸也用丁香煎丸小理中丸其治痰飲也用倍術丸消飲丸溫中化痰丸五套丸且於各方條下或曰口苦失味曰噫酸曰舌澀曰吐清水曰痞滿曰氣急曰脅下急痛曰五心中熱口爛生瘡皆是明言熱症何為悉用熱藥夫周流於人之一身以為主者氣也陽往則陰來陰往則陽來一升一降無有窮已苟內不傷於七情外不感於六淫其為氣也何病之有今曰冷氣滯氣逆氣上氣皆是肺受火邪氣得炎上之化有升無降熏蒸清道甚而至於上焦不納中焦不化下焦不滲展轉變為嘔為吐為膈為噎為痰為飲為反胃為吞酸夫治寒以熱治熱以寒此正治之法也治熱用熱治寒用寒此反佐之法也詳味前方既非正治又非反佐此愚之所以不能無疑也謹按原病式曰諸病嘔吐酸皆屬於熱諸積飲痞滿中膈皆屬於濕諸氣逆衝上嘔湧溢食不下皆屬於火諸堅痞腹滿急痛吐腥穢皆屬於寒深契仲景之意金匱要略曰胸痹病胸背痛栝蔞薤白湯主之胸痹心痛徹背背痛徹心栝蔞薤白半夏湯主之心下痞氣氣結在胸脅下上逆搶心者枳實薤白栝蔞桂枝湯主之嘔而心下痞者半夏瀉心湯主之乾嘔而利者黃芩加半夏生薑湯主之諸嘔吐谷不得入者小半夏湯主之嘔吐病在膈上者豬苓湯主之胃反嘔吐者半夏參蜜湯主之食已即吐者大黃甘草湯主之胃反吐而渴者茯苓澤瀉湯主之吐後欲飲者文蛤湯主之病似嘔不嘔似噦不噦心中無奈者薑汁半夏湯主之乾嘔手足冷者陳皮湯主之噦逆者陳皮竹茹湯主之乾嘔下痢者黃芩湯主之氣衝上者皂莢丸主之上氣脈浮者厚朴麻黃湯主之上氣脈沉者澤瀉湯主之火逆上氣者麥門冬湯主之心下有痰飲胸脅支滿目眩茯苓桂術湯主之短氣有微飲當從小便出之宜茯苓桂術甘草湯主之腎氣丸亦主之病者脈伏其人欲自利利者反快雖利心下續堅滿者此為留飲欲去故也甘遂半夏湯主之病懸飲者十棗湯主之病溢飲者當發其汗宜大青龍湯又宜小青龍湯主之心下有支飲其人苦冒眩澤瀉湯主之支飲胸滿者厚朴大黃湯主之支飲不得息葶藶大棗瀉肺湯主之嘔家本渴今反不渴心中有支飲故也小半夏湯主之卒嘔吐心下痞膈間有水眩悸者小半夏加茯苓湯主之假令瘦人臍下有悸者吐涎沫而頭眩此水也五苓散主之心胸有停痰宿水自吐出水後心胸間虛氣滿不能食消痰氣令能食茯苓飲主之先渴後嘔為水停心下此屬飲家半夏湯加茯苓主之觀其微意可表者汗之可下者利之滯者導之郁者揚之熱者清之寒者溫之偏寒偏熱者反佐而行之挾濕者淡以滲之挾虛者補而養之何嘗例用辛香燥熱之劑以火濟火實實虛虛咎將誰執或曰脈訣謂熱則生風冷生氣寒主收引今冷氣上衝矣氣逆矣氣滯矣非冷而何吾子引仲景之言而斥其非然則諸氣諸飲諸嘔吐反胃吞酸等病將無寒症耶豫曰五臟各有火五志激之其火隨起若諸寒為病必須身犯寒氣口食寒物乃為病寒非若諸火病自內作所以氣之病寒者十無一二或曰其餘痰氣嘔吐吞酸噎膈反胃作熱作火論治於理可通若病人自言冷氣從下而上非冷而何豫曰上升之氣自肝而出中挾相火自下而出其熱為甚自覺其冷非真冷也火極似水積熱之甚陽亢陰微故見此症冷生氣者出高陽生之謬言也若病果因於寒當以去寒之劑治之何至例用辛香燥熱為方不知權變寧不誤人或曰氣上升者皆用黑錫丹養正丹養氣丹等藥以為鎮墜然服之者隨手得效吾子以為熱甚之病亦將有誤耶豫曰相火之外又有臟腑厥陽之火五志之動各有火起相火者此經所謂一水不勝二火之火斯火也出於天造厥陽者此經所謂一水不勝五火之火出於人欲二者之火相扇而動氣之升也隨火炎上升而不降孰能御之令借丹劑之重墜而降之氣鬱為濕痰丹性熱燥濕痰被劫亦為暫開所以清快丹毒積久偏助狂火陰血愈耗其升愈甚俗人喜溫迷而不悟被此禍者滔滔皆是或曰丹藥之重欲降而升然如之何則可豫曰投以辛涼行以辛溫制伏肝邪治以鹹寒佐以甘溫收以苦甘和以甘淡補養陰血陽自相附陰陽比和何升之有先哲治法其則不遠吾不贅及或曰諸氣諸飲與夫嘔吐吞酸膈噎反胃等症局方未中肯綮我知之矣然則要略之方果足用乎抑猶有未發者乎豫曰天地之氣化無窮人身之病亦變化無窮仲景之書載道者也醫之良者引例推類可謂無窮之用借令略有加減修合終難逾越矩度夫氣之初病也其端甚微或因些小飲食不謹或外冒風雨寒暑或內感七情或食味過厚偏助陽氣積成膈熱或資稟素實表密無汗或性急易怒陰火炎上以致津液不行清濁相干氣為之病或痞或痛或不思食或噎噫腐氣或吞酸或嘈雜或膨滿不求本原便認為寒遽以辛香燥熱之劑投之數帖暫得快然以為神方仍前厚味不節將理不謹舊疾被劫暫舒濁液易於攢聚或半月或一月前病復作如此延蔓自氣成積自積成痰此為痰為飲為吞酸之由也良工未遇謬藥已行痰挾汙血遂成窠囊於是為痞為痛為嘔為噎膈反胃之次第諸症隆起飲食湯液泥滯不行滲道蹇澀大便或祕或溏下失傳化中焦愈停醫者不察猶執為冷翻思前藥隨手得快至此賓主皆恨藥欠燥熱顒俟久服脾可以溫胃可以壯以冀一旦豁然之效不思胃為水穀之海多血多氣氣清和則能受脾為消化之宮氣清和則能運今得香熱之藥偏助氣血沸騰其始也胃液凝聚無所容受其久也脾氣耗散傳化漸遲其有胃熱易飢急於得食脾傷不磨鬱積成痛醫者猶曰虛而積寒非尋常草木可療妄以烏附助佐丹劑專意服餌積而久也血液俱耗胃脘乾稿其稿在上近咽之下水飲可行食物難入間或可入入亦不多名之曰噎其稿在下與胃為近食雖可入難盡入胃良久復出名之曰膈亦曰反胃大便祕小若羊屎然名雖不同病出一體要略論飲有六曰痰飲懸飲溢飲支飲留飲伏飲分別五臟諸證治法至矣盡矣第恨醫者不善處治病者不守禁忌遂使藥助病邪展轉深痼去生漸遠深可哀憫或曰千金諸方治膈噎反胃未嘗廢薑桂等劑何吾子之多言也豫曰氣之鬱滯久留清道非借香熱不足以行然悉有大黃石膏竹茹芒硝澤瀉前胡朴硝茯苓黃芩蘆根栝蔞等藥為之佐使其始則同其終則異病邪易伏故易於安或曰胃脘乾稿者古方果可治乎將他有要捷之法或可補前人之未發者乎豫曰古方用人參以補肺御米以解毒竹瀝以清痰乾薑以養血粟米以實胃蜜水以潤燥薑以去穢正是此意張雞峰亦曰噎當是神思間病惟內觀自養可以治之此言深中病情治法亦為近理夫噎病主於血乾夫血者陰氣也陰主靜內外兩靜則臟腑之火不起而金水二氣有養陰血自生腸胃津液傳化合宜何噎之有翻胃丹翻胃即膈噎大約有四血虛氣虛有熱有痰治必用童便竹瀝韭汁牛羊乳薑汁氣虛入四君子湯血虛入四物湯加童便年少者四物湯清胃脘血血燥不潤故便澀年高者不治治必用參朮輩關防氣虛胃虛一中年婦人患反胃以四物湯加和白陳皮留尖桃仁生甘草酒紅花濃煎入驢尿以防其或生蟲也與數十帖而安台州一木匠年二十七勤於工作而性巧慧有一艾妻且喜酒病反胃者半載其面白其脈澀而不勻重取則大而弱大便八九日方通一次糞皆燥結如羊屎甚羸乏無力豫謂精血耗竭也先與甘蔗汁煎六君子湯加附子大黃與之伺大便稍潤令謝去工作臥於牛家取新溫牛乳細飲之每頓盡一杯一晝夜可五六次以漸而至七八次其餘菜果粥飯皆不入口半月而大便潤月餘而安然或口乾蓋酒毒未解間飲甘蔗汁少許近兩月而安矣六君子湯謂人參茯苓白朮枳殼陳皮半夏各等分薑棗煎也翻胃用韭汁二盞牛乳一盞生薑汁半盞和勻溫服效別有方見前梅主反胃朝食暮吐旋旋吐者以甘蔗汁七升生薑汁一升二味相和分為三服丹杭州一男子四十餘歲患反胃兩月矣口乾而不喜飲食有時不吐或吐則食物里涎沫而出吐後胸膈方快其脈俱澀重則弦大蓋其壯年多服金石房中之藥所致時正秋初尚熱遂令其多作竹瀝煮罌粟米為粥代粥飯與之每啜一二口而止卻帶溫頻頻與之自此不吐至旬日稍涼以流水作稀粥入少竹瀝與之時間以四物湯加陳皮益其血月餘而安食主脾胃氣弱食不消化嘔逆反胃湯飲不下粟米半升研粉水和丸如桐子大煮令熟點少鹽空心和汁吞下世治翻胃吞酸餳糖查六兩生薑四兩研細和為餅曬乾每用餅十兩入甘草一兩為末湯調下陳彥正服得效陽蓄積病菀而陽氣當隔隔者當瀉不亟正治粗乃敗之全文見陰陽隔則閉絶上下不通則暴憂之病也通評虛實論潔治中焦吐食由食積與寒氣相格故吐而疼宜服紫沉丸半夏曲三錢烏梅去核二錢沉香一錢杏仁去皮尖一錢砂仁三錢丁香二錢檳榔二錢木香一錢陳皮五錢白豆蔻五分白朮一錢巴豆霜五分上細末入巴豆霜令勻醋糊為丸如黍米大每服五十丸食後薑湯下愈則止小兒另丸一法反胃吐食用橘皮一個浸少時去白裹生薑一塊麵裹紙封燒令熟去外面煎湯下紫沉丸一百丸一日二服後大便通至不吐則止此主寒積氣病機有代赭石肉果無白朮垣厚朴丸主翻胃吐逆飲食噎塞氣上衝心腹中諸疾其藥味即與萬病紫菀丸同厚朴蜀椒去目微炒川烏頭炮去皮各一兩半紫菀去上苗吳茱萸湯洗菖蒲柴胡去苗桔梗茯苓官桂皂角去皮弦炙乾薑炮人參各二兩黃連二兩半巴豆霜半兩上為細末入巴豆霜勻煉蜜為劑旋旋丸如桐子大每服三丸漸次加至五七丸以利為度生薑湯下食後而臥此藥治效與局方溫白丸同及治處暑以後秋冬間下痢大效春夏加黃連二兩秋冬再加厚朴二兩如治風於春秋所加黃連厚朴外更加菖蒲茯苓各一兩半如治風痛不愈者依春秋加藥外更加人參菖蒲茯苓各一兩半如心之積加菖蒲白茯苓為輔如肝之積加柴胡蜀椒為輔如肺之積加黃連人參為輔如脾之積加茱萸乾薑為輔秋冬久瀉不止加黃連茯苓保反胃大便不通者是腸勝胃也服局方半硫丸三十丸大府祕用後藥附子五錢巴豆二個砒一豆許上末極細生薑糊丸緑豆大每服一丸白湯下治下焦吐食朝食暮吐暮食朝吐大便不通宜附子丸附子炮五錢砒研半錢巴豆霜一錢上同研極細溶黃蠟為丸如桐子大每服一二丸冷水送下利為度利後更服紫菀丸常服一丸勿令再閉潔白朮木香散治寒積氣嘔吐腹中痛是無積也胃強而乾嘔有聲無物脾強而吐食持擊強是以腹中痛當以此藥和之木香一錢白朮半兩半夏曲一兩檳榔二錢茯苓五錢甘草四錢丁香一錢上為細末每服一二錢濃煎芍藥生薑湯調下有積者痛時手按之愈痛無積者按之不痛白朮散治胃中虛損及痰而吐者半夏曲五分白朮木香甘草各一兩檳榔三錢半茯苓上為細末每服二錢食前薑湯下羅十膈氣散專治十般膈氣冷膈風膈氣膈伏膈熱膈悲膈水膈食膈喜膈皆病源也並因憂驚冷熱不調又乖將息更於喜怒無時貪嗜飲食因而不化積滯在膈上腸鳴痰嗽歲月漸深心胸噎塞漸至羸瘦久若不除必成惡候人參白茯苓官桂枳殼炙甘草神麯炒麥芽炒廣朮炮白朮陳皮去白乾薑炮京三稜煨訶黎勒煨去核各一兩厚朴薑製檳榔木香以上各五錢上為極細末每服一錢鹽湯點服如覺脾胃不和腹脹心胸滿悶用水一盞生薑七片棗二枚鹽少許同煎至八分和渣熱服空心食前豆蔻散治五種膈氣肉豆蔻去皮五個木香人參厚朴薑製赤茯去皮桂各半兩甘草炙半兩檳榔五錢訶黎勒青皮各半兩陳皮去白半兩郁李仁湯泡去皮尖炒黃半兩半夏湯洗了用生薑搗如泥堆新瓦上文武火焙黃五錢上為極細末每服二錢入鹽少許如茶點服若入生薑棗同煎亦佳不拘時候能治氣補勞通血脈補脾胃去痰實本驢尿治反胃外臺載昔幼年經患此疾每食餅及羹粥等須臾吐出貞觀中許奉御兄弟及柴蔣等時稱名醫奉敕令治醫竭其術竟不能療漸至羸憊死在朝夕忽有衛士云服驢小便極驗旦服二合後食唯吐一半晡時又服二合人定時食粥吐即便定後奏知大內中五六人患反胃同服一時俱瘥此藥稍有毒服時不可過多盛取尿熱服二合病深者日服之良驗本草云驢尿治癥瘕反胃又云驢尿性冷味甘世又方驢尿調平胃散平胃散見滯瀉新瓦散治反胃用多年瓦一片燒紅入驢尿內焠二十一次研為末倉米飯焦亦為末二分飯末一分瓦末蠟精和飯丸以驢尿和平胃散服之吞下丹翻胃方黃連細切薑汁熳炒三錢山楂肉一錢保和末六錢上粥丸桐子大人參湯入竹瀝再煎沸熱下六十丸羅人參利膈丸治胸中不利痰嗽喘滿利脾胃壅滯便祕推陳致新治膈氣之聖藥也木香檳榔七錢半人參當歸藿香甘草枳實大黃酒浸厚朴薑製各一兩上為細末滴水為丸桐子大如難丸少加宿蒸餅和丸每服三五十丸食後諸飲下本大黃湯治冷涎翻胃其候欲發時先流冷涎次則吐食此乃勞證治不早死在旦夕用大黃一兩生薑自然汁半茶盞炙大黃令燥又焠入薑汁中如此焠汁盡切焙為末每服二錢陳米一撮蔥白二莖水一大盞煎至七分先食蔥白次服其藥不十日去根羅玄明粉朴硝不以多少煎過澄濾五七遍晚於星月露至明旦自然結成青白硝用一瓦罐按實炭火內煅從慢至緊自然成汁煎至不響再加頂火一煅取出於淨地上倒合盆去火毒至晚取出為細末每二斤入甘草末二兩每用一錢二錢桃花湯或蔥白湯調下治膈上氣壅滯五臟祕塞邪熱忌魚及藕丹翻胃積飲通用益元散生薑自然汁澄清白腳丸小丸子時時服益元散方見泄瀉翻胃治用茱萸貝母栝蔞牛膝草本治積聚停飲痰水生蟲久則成反胃及變為胃癰其説在靈樞及巢氏病源芫花丸芫花醋炒稱一兩牛膝狼牙根桔梗炒黃藜蘆炒檳榔各半兩巴豆十粒炒黑上為細末醋糊為丸如赤豆大每服二三丸加至五七丸食前生薑湯下此方常服化痰消堅殺蟲豫患飲癖三十年暮年常多雜痰飲來潮遲即吐有時飲半杯酒即止蓋合此症也因讀巢氏病源論酒瘕云飲酒多而食谷少積久漸瘦其病常欲思酒不得酒則吐多睡不復能食是胃中有蟲使然名為酒瘕此藥治之要之須禁酒即易治不禁無益也海有楊時者因患風氣衝心飲食吐逆遍身枯瘦日服萬病紫菀丸五丸至二十日瀉出肉塊蝦蟆五六枚白膿二升愈又趙侍郎先食後吐目無所見耳無所聞服萬病紫菀丸五丸至十日瀉出青蛇五七條下惡膿三升方愈紫菀丸即前治反胃厚朴丸加羌活獨活防風是也乃磨積之劑世治翻胃用蛔蟲火煨為末肉汁調下諸逆衝上皆屬於火全文見診世治翻胃大田螺不拘多少用新水養之待吐出泥澄去上清水後用米篩張地上卻將皮紙鋪在灰上傾此泥於紙上候乾稠丸如桐子大每服三十丸藿香湯下立愈仍將田螺放水中如食之其病不安治反胃多年壁土和香附子末米飲湯頻頻服之本治反胃吐食白礬二兩黃丹一兩上為末入瓦罐內煅令和取出以淨紙盛放地上盆蓋一宿再為末蒸餅丸如桐子每服五丸至七丸空心溫酒下更量老少虛實與之羅紅豆丸治諸嘔逆膈氣反胃丁香胡椒砂仁紅豆各二十一個上為細末薑汁糊為丸如皂角子大每服一丸以大棗一枚去核填藥麵裹燒熟去面細嚼白湯下食前進三服神效丁香附子散治膈氣吐食丁香半兩檳榔一大個黑附一個半兩重炮去皮臍硫黃去石胡椒各二錢上先將前四味為末次入硫黃再研勻每服二錢用飛硫黃一個去毛翅足腸肚填藥在內用濕紙五七重裹定置慢火內燒熟取出嚼吃後用溫酒送下一日三服不拘時候如不吃葷酒溫粟粥飲調下飛硫黃或云蝙蝠本草無考世六丁丸治翻胃如神即香靈丸方見嘔吐本附子散治反胃用附子一枚極大者坐於磚上四面著火漸漸逼熟焠入生薑自然汁中再用火逼再焠約盡生薑汁半碗焙乾入丁香二錢每服二錢水一盞粟米少許同煎七分不過三服瘥斗門方用粟米飲調下一錢服之又方治男婦小兒唇青面黃肚裡冷疼引牽小腹以至翻胃換食嘔吐口苦舌乾少寤多寐腳手牽掣不拘年日遠近一切脾冷病悉能除愈有一婦人年四十餘久患翻胃面目黃黑歷三十餘年醫不能效脾腧諸穴燒灸交遍其病愈甚服此藥七日頓然全愈服至一月遂去其根自是服之不三五服些小脾疾立便瘥平保全胃氣能生肌肉進飲食順榮衛常服大有補益纍試纍驗幸毋忽焉人參一兩茯苓白者二兩附子七錢以上重者炮去皮臍粉草一兩黃耆一兩鹽炙上為細末每服三大錢鹽湯煎服忌生冷油麵黏膩等毒物無不效者甚妙羅桂香散治膈氣反胃諸藥難瘥朝食暮吐甚者食已輒出其效神速水銀黑錫各三錢硫黃五錢上三味銚內用柳木槌熬研微火上細研為灰取出後用丁香末二錢桂末二錢生薑末三錢都一處研令勻每服三錢黃米粥飲調下一服效甚者再服上丁香附子例治翻胃灼見臟腑有寒者服之丹溪云治反胃忌甚燥之劑犯之必死設用必與潤血藥相兼服又前瀉積條亦香燥劑用者謹之本治男婦小兒遠年近日翻胃吐食方用五靈脂一味不拘多少為細末用黃犬膽汁為丸如龍眼大每服一丸好酒半盞溫服不止再服不過三服即效衍義云五靈脂行經血有效本草云味甘溫療心腹冷氣通氣脈女子月閉食不能下者胃脘膈也全文見水腫一陽發病少氣善咳善泄其傳為膈全文見診病傳變王注云三焦內結中熱故膈塞不便素三陽結謂之膈王注云小腸結則血脈燥膀胱熱則津液竭故膈塞不便運氣膈食皆屬濕經云太陰所至為積飲痞膈是也世治翻胃痛而吐諸氣不入者黃牛鼻繩各姓者七個長七寸燒存性為末作三服用好酒調下飯湯調亦得鯽魚散大鯽魚一個去腸留膽納緑礬末填滿縫口以炭火炙黃為末每服一錢陳米飲調下日三服山翻胃細炒棠梨葉去刺為末酒下又方松木節為末酒下靈黃帝曰氣為上膈者食飲入而還出余已知之矣蟲為下膈下膈者食晬時乃出晬時周時也余未得其意願卒聞之岐伯曰喜怒不適食飲不節寒溫不時則寒汁流於腸中流於腸中則蟲寒蟲寒則積聚守於下管則腸胃充郭衛氣不營邪氣居之腸胃充郭則衛氣不營故邪氣得以居之也人食則蟲上食蟲上食則下管虛下管虛則邪氣勝之積聚以留邪氣原因衛虛而居下脘今蟲上而下管虛則邪氣乘虛勝之而積聚以留也留則癰成癰成則下管約下管約故食入則痛至晬時乃復出也其癰在管內者即內而痛深其癰在脘外者則癰外而痛浮癰上皮熱黃帝曰刺之奈何岐伯曰微按其癰觀氣所行先淺刺其傍稍內益深還而刺之毋過三行察其沉浮以為深淺已刺必尉令熱入中日使熱內邪氣益衰詳此剌癰非所刺也但剌後尉之使熱氣入於積所則邪免衰去衛氣復盛也大癰乃潰伍以參禁以除其內恬憺無為乃能行氣後以鹹苦化谷乃下矣灸刺膈食有四其一取胃經云蟲為下膈按其癰刺之者是其一法也其二取太陰經云太陰根於隱白結於太倉太陰為開開折則倉廩無所輸膈洞膈洞者取之太陰視有餘不足故開折者氣不足而生病者是也蓋膈洞者經謂之食不化下嗌還出也其三取胃經云胃病若膈咽不通飲食不下取之三里是也又云飲食不下膈塞不通邪在胃脘在上脘則刺抑而下之在下脘則散而去之是也其四取手少陰經云手少陰之別名曰通里去脘一寸半其病實則支膈取之掌後一寸別走太陽者是也撮翻胃勞宮一分中脘灸瀉之心腧一分沿皮向外一寸半補之玉翻胃吐食中魁中指第三節灸瀉之中脘寸半腕骨一分瀉之灸東吐食不化上脘中脘下脘甲食飲不化入腹還出下脘主之又法三里陰陵泉不應取下穴中脘天樞又法中脘脾腧中魁三里又法腋聚毛下宛宛中五十壯石關五十壯東今日食明日吐心腧沿皮寸半膈腧沿皮寸半胸堂七壯即膻中巨闕胃脘寸半各灸五十壯又翻胃商丘通谷巨闕然谷隱白陽陵泉內庭膈關甲背痛惡寒脊強俯仰難食不下嘔吐多痰鬲關主之丹切不可用香燥之藥服之必死宜薄滋味脈寸口脈微而數微則無氣無氣則榮虛榮虛則血不足血不足則胸中冷跗陽脈浮而澀浮則為虛澀則傷脾脾傷則不磨朝食暮吐暮食朝吐完穀不化名曰胃反脈緊而澀其病難治脈弦者虛也胃氣無餘朝食暮吐變為胃反寒在於上醫反下之令脈反弦故名曰虛脾脈微急為膈中食飲入而還出涎沫全文見虛實法素胃脈耎而散者當病食痹脈要精微論至真要論云食痹而吐腎脈微緩為洞洞者食不化下嗌還出全文見治虛實法噎丹一男子年六十二歲平居不能頓食常喜頻食一日忽覺咽膈壅塞大便結糞如羊矢三四日一見走動倦乏與補氣藥則作痛醫見食少則與快腸胃消導之藥豫脈之兩手俱見澀脈似真臟喜其人形瘦而色紫黑病見乎冬卻有生意遂於四物湯加白朮陳皮煎取濃湯研桃仁十二粒再煎沸飲之多食諸般血以助藥力三十帖而知至五十帖而大便潤七十帖而食進百帖而愈浦江男子年六十自來好色虛甚去秋患吐病或有作時或有止時腹結微渴地黃一錢人參半錢白朮一錢黃芩三分川芎三分芍藥一錢當歸陳皮各五分枳殼半分甘草炙二分木通三分楊淳三哥大便祕澀咽塞不通人參散主之方見大便祕門潔厚朴丸治飲食噎塞方見翻胃丹東陽王仲延咽膈間常覺有物悶悶每食物必屈曲自膈而下且梗澀作微痛食亦減他無所苦豫脈之右甚澀而關甚沉左卻和豫曰汙血在胃脘之口氣因而鬱為痰此必食物所致明以告我彼不自覺豫又曰汝去冬好食何物為多曰我每日必單飲點剁酒三兩杯逼寒氣為制一方用生韭汁半盞令細呷之每服半盞一日三次盡韭二斤而安治膈噎馬剝兒即王瓜燒存性每一錢用棗肉平胃散二錢溫酒調服食即可下然後隨病源調理神效棗肉平胃散方見局方世治噎雞谷袋不問多少不可失包內物一粒用泥固濟火煅存性用薑汁炒香附每個入半兩香附末神麯為丸薑湯送下治氣噎不下飲食枇杷葉去毛炙青皮去穰陳皮去白上等分為末每服二錢水一盞生薑五片同煎至六七分溫服不計時候治膈氣噎不下飲食用陳皮去白不拘多少用大蒜研細和丸如緑豆大每服二十丸至三十丸溫米飲下食後日三服金匱玉函五噎心膈氣滯煩悶吐逆不下食蘆根五兩銼水三大盞煮二盞去渣溫服羅漢防已散治五噎漢防己五錢官桂一兩細辛七錢半陳皮去白一兩羚羊角末紫蘇各七錢半杏仁湯洗去皮尖一兩上為細末每服三錢生薑三片水煎日二本治五種積氣及五噎胸膈不快停痰宿飲纏金丹丁香木香沉香檳榔官桂胡椒硇砂研白丁香各一錢白豆蔻飛礬各一錢研馬兜鈴南星五靈脂栝蔞根半夏各半兩硃砂三錢留半為衣上為細末入二味研藥和勺生薑汁煮糊丸如桐子大每服三丸生薑湯下或干嚼蘿蔔湯下治氣食憂勞思慮五噎膈氣丸麥門冬甘草各五錢人參四錢桂心細辛川椒遠志去心炒各三錢附子乾薑各二錢上為末煉蜜丸如雞豆大綿裹二丸含化食後日三夜三服胸中當熱七日愈治氣食憂勞思慮五噎膈氣丸半夏桔梗各一兩肉桂枳殼各兩半上細末薑汁麵糊丸如桐子大薑湯下三十丸食後臨臥服無擇廣五行記永徽中有僧惟則病噎不能食謂諸弟子曰吾死後便可開吾胸喉視有何物自經而卒弟子果開視胸中得一物形似魚而有兩頭遍體皆肉鱗弟子置碗中跳躍不止戲以諸味皆隨化盡時夏中盛藍作澱適有一僧以澱置器中此蟲遂繞器中走須臾化為水此乃蟲瘕非五噎比後人因以藍治噎誤矣子和沈丘王宰妻病胸膈不利口流涎沫自言咽下胃中常有雷聲心間時作微痛又復發昏胸乳之間灸瘢如棋化痰利膈等藥服之三載病亦依然其家知戴人痰藥不損來求之一湧而出雪白蟲一條長五六寸有口鼻牙齒走於涎中病者惡而斷之中有白髮一莖此正與徐文伯所吐宮人發瘕一同蟲出立安運氣噎皆屬燥經云陽明司天之政民病咳嗌塞又云陽明之勝內余嗌塞胸中不便嗌塞而咳又云陽明司天清復內余噎塞者是也上按運氣皆以嗌塞生於燥嗌塞者噎病也丹溪皆以噎病生於血稿血稿則燥矣得病情合經旨者丹溪一人也禹錫頭垢治噎酸漿水煎膏用之立愈聖治膈氣咽喉噎塞飲食不下用碓觜上細粳蜜丸如彈子大不時含一丸咽津下孫治噎欲發時銜鸕鷀鳥嘴遂下外臺祕要同聖治噎病用狼結喉骨曝乾杵末入半錢於飯飲內食之妙摘五噎吞酸多唾嘔吐不止天突五分留三呼得氣即瀉三吸通關在中脘旁各五分針入八分左捻能進飲食右捻能和脾胃許氏云此穴一針四效凡下針後良久覺脾磨食覺針動為一效次針破病根腹中作聲為二效次覺流入膀胱為三效又次覺氣流行腰後骨空間為四效撮治五噎亶中中魁中指大三節尖灸之以口吹火滅甄權噎塞膈氣通谷明堂五噎分治氣噎亶中憂噎心腧灸食噎乳根乳左下一寸八分灸勞噎鬲腧灸思噎天府灸集五噎勞宮中魁中脘三里太陰支溝上脘不已再取後穴亶中太白下脘右關脾腧胃腧仲寸口脈浮大醫反下之此為大逆浮即無血大即為寒寒氣相搏即為腸鳴醫不知而反與飲水令汗大出水得寒氣冷必相搏其人即饐脈寸口脈緊而芤緊則為寒芤則為虛虛寒相搏脈為陰結而遲其人則噎咽喉噎塞口開目瞪垣堵塞咽喉陽氣不得出者曰塞陰氣不得下降者曰噎夫噎塞迎逆於咽喉胸膈之間令諸經不行則口開目瞪氣欲絶當先用辛甘氣味俱陽之藥引胃氣以治其本加堵塞之藥以瀉其標也寒月陰氣大助陰邪於外於正藥內加吳茱萸大熱大辛苦之味以瀉陰寒之氣暑月陽盛則於正藥中加青皮陳皮益智黃柏散寒氣泄陰火之上逆或以消痞丸合滋腎丸滋腎丸者黃柏知母微加肉桂三味是也或更加黃連別作丸二藥七八十丸空心約宿食消盡服之待少時以美食壓之不令胃中停留也以上諸法皆於補中益氣湯加減之膈咽不通並四時換氣用藥法黃帝針經曰胃病者腹䐜脹胃脘當心而痛上支兩脅膈咽不通飲食不下取三里夫咽者咽物之門戶也鬲者上焦心肺之分野不通者升降之氣上不得下交通又云清氣在下則生飧泄飧泄者謂泄黃如糜米穀不化者是也濁氣在上則生䐜脹腹中脹滿不得大便或大便難先結後溏皆是也濁氣在上當降而不降者乃腎肝吸入之陰氣不得入故食不得下也此皆氣衝之火逆胃之脈反上而作者也清氣在下則生飧泄者胃氣未病之日當上行心肺而榮經也因飲食失節勞役形體心火乘於土位胃氣弱而下陷入陰中故米穀入而不得升反降而為飧泄也咽膈之間壅遏之甚不得交通者皆衝脈上行逆氣所作也蓋胃病者上衝兩脅膈咽不通飲食不下取之三里者是也針經云清濁相干亂於胸中是為大悗大悗者惑也氣不交通最為急證不急去之諸變生矣聖人治此有要法陽氣不足陰氣有餘先補其陽後瀉其陰是先令陽氣升發於陽分而後瀉陰也春夏之月陽氣在經當益其經脈去其血絡秋冬陽氣降伏當先治其臟腑若有噎有塞塞者五臟之所主陰也血也噎者六腑之所主陽也氣也二者皆由陰中伏陽而作也今立四時用藥法並治法於後冬三月陰氣在外陽氣在內當外助陽氣不得發汗內消陰火勿令泄瀉此閉藏周密之大要也盛冬乃水旺之時水旺則金旺子能令母實肺者腎之母皮毛之陽元本虛弱更以冬月助其令故病者善嚏鼻流清涕寒甚則濁涕嚏不止比常人尤大惡風寒小便數而欠或上飲下便色清而多大便不調常夜無寐甚則為痰為嗽為嘔為噦為吐唾白沫以至口開目瞪氣不交通欲絶者吳茱萸丸主之吳茱萸丸治寒在膈上膈咽不通吳茱萸草蔻各一錢二分益智仁八分白殭蠶四分陳皮人參黃耆升麻各八分麥芽一錢半甘草歸身各六分半夏一錢木香二分澤瀉薑黃柴胡各四分青皮二分上為末湯浸蒸餅為丸如緑豆大細嚼三十丸白湯送下不拘時候勿多飲湯恐速走下則減藥力夏三月大暑陽氣在外陰氣在內以此病值此時是天助正氣而銼其邪氣不治而自愈矣然亦有當愈不愈者蓋陰氣極盛正氣不能伸故耳且如膈咽不通咽中梗甚者前證俱作治法當從時用利膈丸瀉肺火以黃耆補中湯送下如兩足痿厥行步恇怯欹側欲倒臂臑如折及作痛而無力或氣短氣促而喘或不足以息以黃耆人參甘草白朮蒼朮澤瀉豬苓茯苓陳皮等作湯送下滋腎丸五六十丸六七月之間濕熱之令大行氣短不能言者加五味子麥門冬如心下痞悶食不下以上件白朮蒼朮等湯送下消痞丸七十丸更審而用之黃耆補中湯方見痞利膈丸方見翻胃滋腎丸方見淋消痞丸方見痞嘈雜丹嘈雜只是痰因火而動梔子薑炒黃連不可無此食鬱有熱山梔黃芩為君南星半夏陳皮為佐熱多加青黛肥人嘈雜二陳湯少加蕪芎蒼朮白朮炒梔子心下嘈雜者導飲丸最妙方見內傷飲食噦噦者成無己許學士謂之厄逆是也或曰成無己許學士固以噦為厄逆然東垣海藏又以噦為乾嘔陳無擇又以噦名咳逆諸論不同今子獨取成許二家之説何也答曰噦義具在內經諸家察之不詳故論紛紛耳謹按靈樞雜病篇云噦以草刺鼻嚏嚏而已無息而疾迎引之立已大驚之亦可已詳此經文三法正乃治厄逆之法按厄逆用紙捻刺鼻便嚏嚏則厄逆立止或閉口鼻氣使之無息亦立已或作冤盜賊大驚駭之亦已此豫所以取成許二家之論噦為厄逆為得經旨也蓋噦厄之名雖二而病則一經名為之噦者噦即厄聲之重也俗名為之厄者厄即噦聲之輕也皆因病聲之輕重得此二名初非噦厄有二病若以噦為乾嘔設使乾嘔之人或使之嚏或使之無息或使之大驚其乾嘔能立已乎噦非乾嘔也明矣若以噦名咳逆夫噦者噦之病聲其聲發會厭下咳者咳之病聲其聲發會厭上故內經噦有噦之口問咳有咳之篇論病各不同噦不可名咳逆也明矣丹厄逆論厄病氣逆也氣自臍下直衝上出於口而作聲之名也書曰火炎上內經曰諸逆衝上皆屬於火東垣謂火與元氣不兩立又謂火元氣之賊也古方悉以胃弱言之而不及火且以丁香柿蒂竹茹陳皮等劑治之未審孰為降火孰為補虛人之陰氣依胃為養胃土傷損則木氣侮之矣此土敗木賊也陰為火所乘不得內守木挾相火乘之故直衝清道而上言胃弱者陰弱也虛之甚也病人見此似為危症然有實者不可不知敢陳其説趙立道年近五十質弱而多怒七月炎暑大飢索飯其家不能急具因大怒兩日後得滯下病口渴自以冷水調生蜜飲之甚快滯下亦漸緩如此五七日召豫視脈稍大不數遂令止蜜水渴時且令以人參白朮煎湯調益元散與之滯下亦漸收七八日後覺倦甚發厄豫知其因下久而陰虛也令其守前藥然滯下尚未止又以煉蜜飲之如此者三日厄尤未止衆皆尤藥之未當將以薑附飲之豫曰補藥無速效附子非補陰者服之必死衆曰冷水飲多得無寒乎豫曰炎暑如此飲涼非寒勿多疑待以日數藥力到當自止又四日而厄止滯下亦安陳擇仁年近七十厚味之人也有久嗽病而作止不常新秋患滯下食大減至五七日後厄作召豫視之脈皆大豁衆以為難豫曰形瘦者尚可為以人參白朮湯下大補丸以補血至七日而安此二人虛之謂也又一女子年逾笄性躁味厚炎月因大怒而厄作作則舉身跳動脈不可診神昏不知人問之乃知暴病視其形氣俱實遂以人參蘆二兩煎湯飲一碗大吐頑痰數碗大汗昏睡一日而安人參入手太陰補陰中之陽者也蘆則反是大瀉太陰之陽女子暴怒氣上肝主怒肺主氣經曰怒則氣逆因怒逆肝木乘火侮肺故厄大作而神昏參蘆善吐痰盡則氣降而火衰金氣復位胃氣得和而解麻黃髮汗節能止汗谷屬金粳之性熱麥屬陽麩之性涼先儒謂物物具太極學者不可不觸類而長引而伸之也無凡吐利後多作噦此由胃中虛膈上熱故噦或至八九聲相連於氣不回至於驚人者若傷寒久病得此甚惡內經所謂壞府者是也上吐利後噦即丹溪治趙立道與陳擇仁二人噦皆於滯下得之之類六脈大豁用參術而愈是也豫長兄九月得滯下每夜五十餘行嘔逆食不下五六日後加厄逆與丁香一粒噙之立止但少時又至遂用黃連瀉心湯加竹茹飲之厄雖少止滯下未安如此者十餘日遂空心用御米殼些少澀其滑日間用參朮陳皮之類補其虛自服御米殼之後厄聲漸輕滯下亦收而安仲噦而腹滿視其前後知何部不利利之即愈小承氣湯治大便不通噦數譫語方見下利中丹超越陳氏二十餘歲因飽後奔走數里遂患噦病但食物則連噦百餘聲半日不止飲酒與湯則不作至晚發熱如此者二月脈澀數以血入氣中治之用桃仁承氣湯加紅花煎服下汙血數次即減再用木香和中丸加丁香服之十日而愈無噦而心下堅痞眩悸者以膈間有痰水所為丹洪孺人年二十六歲夏月因事為長上所阻怒氣折郁不得舒須臾就浴湯熱不可近怒氣復增就悶絶昏倒乃以衣遮掩就房須臾咳逆大作每一聲必渾身為跳躍仍復昏悶凡三五息一作脈不可診豫曰此膈上有痰逆為怒氣所郁痰熱相搏氣不得降而逆非吐則不可是時夜半又事出倉卒適有人參蘆二兩在彼濃煎飲之大吐稠痰二升許通體得汗困睡半夜而安此即前厄逆論所言者自此詳細故重出之燥痰不出者用蜜水吐之世噦聲頻密相連者為實可治若半時噦一聲者為虛難治多死在旦夕仲噦逆者陳皮竹茹湯主之陳皮二升竹茹二升大棗三十枚生薑半斤甘草五兩人參一兩上六味以水一斗煮取三升溫服一升日五服乾嘔噦若手足厥者陳皮湯主之方見嘔吐門本又方枳殼五錢木香一分上細末每服一錢白湯調下未可再與孫治諸厄噫陳皮二兩湯浸去穰銼以水一升煎之五合通口服頃刻更加枳殼一兩去穰炒同煎之外治久患咳噫連咳一二十聲者取生薑汁半合蜜一匙頭煎令熱溫服如此三服立效超越陳氏噦用桃仁承氣湯下汙血數升而愈是汙血為噦也丹溪用益元散大補丸治趙立道陳擇仁滯下而噦者或用蜜水治噦者是熱噦也潔柿錢散治厄逆柿錢丁香人參各等分上為細末水煎食後服羅丁香柿蒂散治諸種厄噫嘔逆痰涎丁香柿蒂青皮陳皮各一兩上為粗未每服三錢水一盞半煎七分去渣溫服不拘時候羌活附子湯羌活附子炮木香茴香各五錢炒乾薑一兩上為細末每服二錢鹽一撮煎二十沸熱服一服止胃為噦全文見五臟虛實腹滿利而不噦者胃實也運氣噦有三一曰熱經云少陰之復噦噫治以苦寒是也二曰寒經云太陽之復嘔出清水及為噦噫治以苦寒是也三曰燥經云陽明之復咳噦治以辛溫是也靈以草刺鼻嚏治厄有病傷寒將愈忽患厄逆豫與古人治厄逆之藥殆遍皆不愈計出無藥遂用皂角末吹入鼻中得嚏而厄逆止少時又厄又與皂角末嚏而止者凡數百次其嚏時出痰涕漸多自是厄逆漸疏至三二日而止此是合經草刺鼻嚏之法故書之黃帝曰人之噦者何氣使然岐伯曰谷入於胃胃氣上注於肺今有故寒氣與新穀氣俱還入於胃新故相亂真邪相攻氣並相逆復出於胃故為噦補手太陰瀉足少陰口問篇世治厄逆於臍下關元穴灸七壯立愈纍驗羅又方男左女右乳下黑盡處一韭葉許灸三壯甚者二七壯集治氣逆發厄亶中中脘先補後瀉不已再取下穴三里肺俞行間心脈小甚為噦全文見治虛實法産後噦大産後咳逆三日不止欲死肉桂五錢薑汁三合上同煎服二合以火先炙手摩令背熱時時塗藥汁盡妙産後咳逆乾柿一個切碎以水一盞煎六分熱呷産寶治産後咳逆經三五日不止欲死方煎壁鏡窠三五個呷瘥即蟢子窩大噫厄服藥無效灸期門必愈
