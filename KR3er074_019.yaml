body:
  text: 卷之十九心小腸部癰疽所發部分名狀不同靈五臟身有五部伏兔一腓二腓者腨也背三五臟之腧四項五此五部有癰疽者死寒熱病篇王海藏云腦須鬢頤四處亦為癰疽必死之處涓不可患癰疽者七處眼後虛處頤接骨處陰根根上毛間胯與尻骨接處耳門前後車骨接處諸因小腹風水所成癰疽頷骨下近耳後虛處鼻骨中並能害人但以諸法療之或有得瘥唯眼後虛處最險正腦上一處起為腦癰及腦疽腦鑠並在大椎骨上入髮際生腦癰皮起易得破穴急破急出膿不害腦疽皮厚難得破穴須急發內毒使破穴方可腦鑠一處初起如橫木掘上起頂門下止大椎發腫如火燒其色青黑如靴皮大硬不見膿即損外皮如犬咬去肉之跡難愈鑠式約切左右鬢兩處癰疽癤初起如蟲咬癮疹痛腫不赤紅難見膿汁是為鬢髮此亦危篤之患既損破多為漏瘡左右髮際起如粟米頭白肉赤熱痛如錐刺此疾婦人患多丈夫患少始因風濕上攻髮際亦宜出膿無傷左額右額髮赤疽不拘大小狀如桃李急宜藥貼破見膿無害右額角一處發毒疽及惡癤為近太陽穴如腫滿太陽即成虛損為近穴而難消不可破如破後傷外風水即能害人亦宜用藥潰膿後速斂合瘡口如經冬月即成冷瘡緣此處近太陽穴上至額角都為險處左右太陽穴或發疽癤及癰五七日不潰毒氣流入眼眶攻眼眼舍不開用藥貼破破後慎外風水所入即損其睛疰損眼瞼而成大疾左右眉稜兩處發為發眉不拘在頭尾宜慮未穴已前攻擊在眉頭即攻入眼損睛在眉後即攻入太陽並宜戒慎鼻下一處人中兩處為發髭此多因摘髭外入風而結攻作不常寒熱相併此亦害人下頤一處發為發頤肥人多有此疾恐手搔傷而發腫左右牙叉骨接處發癰疽處腫脹攻骨及牙關張口不得因諸風熱上攻或多食燒炙之物所為或因患牙癰即從牙縫中破出膿血切忌外風水觸犯垂臂兩處發接骨下臂肘上起如雞鴨卵大皆由榮衛不調所為也喜患實處而不透內亦宜急消或發穴早療兩臂肘起在接骨下引手至小骨之上發癰癤此處雖實奈連大小筋骨舉動不便垂手多墮疼如膿深沉徹骨即傷筋脈拳縮不舒搐撮宜急以緩慢筋脈藥餌治之兩手背發癰疽初生如水刺無頭腦頑然滿手背腫滿後聚毒成瘡深入至骨而為發手背此屬五種皆發毒之類也兩肋起疽名為發肋初腫盛至十數日不穴攻即腫大如杯碗高如𨫼背痛徹內腸絞刺左邊患應右邊痛右邊患應左邊痛唯有此處多是內毒卻入攻而死者多人有斯患急以針刺出膿血則免內攻傷內矣三里兩處起癰疽初發如牛眼睛青黑便五七日破穴出黑血汁膿腫攻膀肚連腿里拘急冷疼此因傷筋氣勞力所成宜用湯藥注射去其外毒自平息矣兩腳接骨近上膀肚下一處起丹疽如胡桃大硬如物打搕之狀不苦疼但腫急脹慮其損筋亦須早出膿毒可保平安矣兩腳心發徹骨者不治如腳心微皮破不至深發膿不多者可治癰發雖重不至損人但世人不曉醫治自至危殆耳上焦發癰為陽是壅塞實候宜解利溫涼湯藥去其積熱上攻外即貼消毒逼腫藥如已結定即用發穴藥候穴破出其膿毒腫平方貼生肉等藥然後斂合瘡口亦慮外傷風水勿食發風熱醬面毒物等忌房事中焦發癰至腰上一節前後心不定所在皆是澀滯候亦乘虛而作不拘大小前起心鳩尾者最要緊近兩腋是虛處兩脅肋下至臍上及臍下兩傍一二寸發癰填氣伏硬難潰膿為此等處偏難發穴穴後難合瘡口並須先用暖內藥服後用熱藥貼令軟和慢慢破穴不得急破急破即朝夕出膿不住緩慢破穴即一頓出膿易為將息後心者唯有十一椎脾俞下十四椎上為腎俞腎俞下為腰俞兩處起癰者防毒氣內攻為此處皆是至虛處凡有癰起先須補內氣令實方可放破內氣實則不內攻且易得潰唯腰俞兩處多成漏疾預防節欲則免矣下焦發為流注虛損候前陰股兩處起如雞卵大長橫折內初起腫核結塊後四畔浮腫相併伏硬色青黑先用和平內藥服三五日後用發穴散及罨藥令軟即穴穴後其瘡口即隨摺子內作長瘡瘡口破宜急用抽毒膏出膿膿盡便貼合瘡口藥為此處無肉可壞更不須長肉也腿䏶兩處起為便毒胯下兩臀尖下大道前穀道小道後水道成懸癰皆是虛極人患此癰近穀道左右亦名痔癰宜急補脾臟及發處貼藥即用發穴散破後用抽膿膏膿盡用合瘡口散合之慎勿過冬即成冷漏難治垂珠左右兩處起癰為騙馬墜初起大小不定此處微實皮肉薄紋緊口亦難合瘡初起宜以消散藥貼令內消此處亦易成漏瘡唯宜消散之硬即恐緩慢難為功矣又云交𦡁一處近稜線上亦為騙馬墜防漏騙匹扇切俗名跨馬癰是也兩曲䐐膀肚下內外兩踝前有廉刃兩邊為裡外廉上結癰腫此處近骨難瘥宜用收毒散外貼四畔中心即用活血肉藥貼無害下至兩腳心發癰癤沉深不治如微似皮薄易破者猶可也凡有癰腫皆屬六腑有疾靈癰發於嗌中名曰猛疽猛疽不治化為膿膿不瀉塞咽半日死其化為膿者瀉則合豕膏冷食三日而已發於頸者名曰夭疽其癰大而赤黑不急治則熱氣下入淵腋前傷任脈內熏肝肺熏肝肺十餘日而死矣俱出癰疽篇下同涓百脈疽腫起環頸項疼痛身體大熱不敢動止悁悁不能食此有大畏恐駭上氣咳嗽其發引耳不可以腫十五日可刺導引不刺導引見血八十日必死土龍疽發背起胃俞及腎俞大發寒熱十數日大汗展頸引身盡熱如沸不穴二十日死九日可刺不刺其上下亦黑若膿青黑者死血膿者不死靈陽氣大發消腦留項名曰腦爍其色不樂項痛而如刺以針煩心者死不可治涓赤色疽發頭額以腦前並手掌中十日不穴者死七日可刺出赤血七日未有膿不可治不穴者不作穴而東攻西擊也杼疽髮鬢須及兩耳不穴十五日死可刺其膿色黑如豆豉或見血者死黑疽發大椎骨上連兩夾脊上七日可刺導引為癰疽出膿不可止吐碎骨身癢後痛者此故傷寒氣入臟腑發為食疽也九日可刺導引之不刺不導引十一日死靈發於肩及臑名曰疵癰其狀赤黑急治之此令人汗出至足不害五臟癰發四五日逆焫之癰疽篇此當入癰涓丁疽發兩肩惡血留結內外榮衛不通發成疔疽五日腫大令人口噤寒戰十二日可刺不治二十日死陳干疽腫發起兩肩及兩大臂連胛骨二七日痛不息亦不可動五十日身熱不赤六十日可刺刺之無血者死靈發於腋下赤堅者名曰米疽治之以砭石欲細而長疏砭之塗以豕膏六日已勿裹之其癰堅而不潰者為馬刀挾癭急治之涓內疚疽發兩腋下及臂並兩手掌中振寒熱而嗌乾飲多即嘔煩心悁悁脈盛六七八日診如此可汗不汗死靈發於胸名曰井疽其狀如大豆三四日起不早治下入腹不治七日死矣發於膺名曰甘疽色青其狀如谷實栝蔞常苦寒熱急治之去其寒熱不急治十歲死死後出膿發於脅名曰敗疵敗疵者女子之病也灸之其病大癰膿治之其中乃有生肉大如赤小豆銼菱翹草根各一升以水一斗六升煮之竭為取三升則強飲厚衣坐於釜上令汗出至足已疵疾𧊒切甲乙經於赤少豆下作治之銼菱草赤松根各一升涓使熒疽腫起發肋及兩肩肘頭二十日不穴死九日可刺發赤白相間膿多可治全無赤白者不治蜂疽發髀背起心俞及心包絡俞若肩髁二十日不穴死十日可刺其色赤黑膿清者不治特疽發肺俞及肝俞不穴二十日死八日可刺其色紅赤內隱起如椒子者死陰陽二氣疽廣闊滿背或大或小不常腫熱脹大十日可刺導引出膿不拘深淺多少發渴體倦十日外不見膿不治筋疽髮夾脊兩邊大筋上其色蒼八日可刺有癰在肥腸中九十日死沖疽發小腹疼痛而振寒熱四日悁悁五日變色可刺不刺即導引出膿毒不治五十餘日死靈發於尻名曰銳疽其狀赤堅大急治之不治三十日死矣治見經虛條涓湧泉疽腫起發太陰如伏鼠二十日不穴死十日可刺發清膿赤黑者死白者可治太陰尻尾前是也靈發於股脛名曰股脛疽其狀不甚變色癰腫內薄於骨不急治三十日死矣股脛劉涓子作股陽發於股陰名曰赤施不急治六十日死在兩股之內不治十日死涓陰疽發腿髀及陰股始發腰強數飲不能多七日發堅腫脹惡疼心煩躁死不治靈發於膝名曰疵疽其狀大癰色不變寒熱而堅勿石石之者死須其柔乃石之者生堅如石者用生樟陸根擦之則效諸癰疽之發於節而相應者不可治也發於陽者百日死發於陰者三十日死陽謂諸節之背陰謂諸節之膕郄間劉涓子云應者內發透外也發於脛名曰兔齧其狀如赤豆至骨急治之不急治害人也發於內踝名曰走緩其狀癰色不變數石其輸而止其寒熱不死發於足上下名曰四淫其狀大癰不急治之百日死發於足傍名曰厲癰其狀不大初從小指發急治去之其狀黑者不可消輒益不治百日死發於足指名曰脫癰其狀赤黑者死不治不赤黑者不死治之不衰急斬之否則死矣涓瘇敦疽發兩足指五日不穴死四日可刺其色發黑癰者不堪未過節者可治陽疽起足跗及足下二十日不穴死十日可刺發赤白膿血不多其瘡上癢及赤黑者死禽疽始發者如疹數十處如拳打之狀發寒齒噤如此者十四日死十日可刺導引膿出即愈衡疽發如腫或時復往來可要其所刺之導引膿出即愈丹琥珀膏歸鬚川芎黃耆梢蜂房細辛皂角升麻甘草梢蓖麻子木鱉子芍藥白蘞獨活川椒藁本防風梢枸杞子菖蒲降真香官桂栝蔞蘇木白芷杏仁黃連槐枝以上各一兩琥珀沉香木香丁香藿香零陵香雲母石乳香雄黃硃砂安息香甘松以上各二錢半輕粉麝香各一錢發灰五錢白礬枯一兩以上十六味為極細末羊腎脂四兩蟾酥二兩香油四斤黃丹上先以前二十六味銼槌碎用水五升文武火熬至二升半去渣再用水五升又熬至二升半去渣與前汁一處慢火煎用槐枝不住手攪成膏用瓷器盛頓起將後琥珀等十六味研為極細末用紙包起於前膏內下淨羊脂四兩真酥二兩同膏入香油內攪令勻以文武火熬膏內水盡用紙捻點油燒不爆為度漸入黃丹以二兩五錢重為一次仍用槐枝不住手攪滴水中不散軟硬得所如軟添黃丹如硬添油再上火熬卻入前藥細末五兩微煎數沸用瓷器盛貯如用於紙上攤之量瘡口大小專治五發惡瘡疔腫瘰癧遠年冷疳痔漏一切無名惡瘡蛇傷蠍齧犬咬並皆治之疔瘡疔瘡皆生四肢發黃疱中或紫黑必先癢後痛先寒後熱也羅丙午歲予居藁城人多患疔瘡縣尹董公謂予曰今歲患疔瘡者極多貧民無力醫治近於史侯處得數方用之者無不效官給藥錢君當舍手治之遂諾其語董公榜示通衢命予施藥如此一年全活甚眾其用保生錠子千金托裡散神聖膏藥破棺丹凡四方保生錠子治疔瘡背疽瘰癧一切惡瘡金腳信二錢雄黃三錢輕粉二錢硇砂三錢麝香一錢半巴豆四十九粒另研文武火炮生用尤妙加蟾酥一錢上為細末用黃蠟五錢溶開將藥和成錠子冷水浸少時取出旋丸捏作餅子如錢眼大將瘡頭撥開每用一餅次用神聖膏後用托裡散若瘡氣入腹危者服破棺丹世傳疔瘡必有一條紅線可針紅線所至之處出毒血然後敷藥神聖膏藥治一切惡瘡當歸藁本各半兩沒藥乳香各二錢白芨琥珀各二錢半黃丹二兩白膠香三兩黃蠟二兩粉霜一錢木鱉子五十個去皮巴豆十五粒去油清油槐柳枝各一百二十支膽礬一錢上件一處先將槐柳枝下在油內熬焦取出復下余藥熬勿至焦濾出卻將油澄清下黃丹再熬成膏用緋帛攤之立有神效千托裡散治一切發背疔瘡黃耆一兩半厚朴川芎防風桔梗各二兩白芷一兩連翹二兩二錢芍藥官桂甘草節人參各一兩木香沒藥乳香當歸各半兩上為細末每服三錢酒一大盞煎二三沸和渣溫服破棺丹治瘡腫一切風熱大黃二兩半生半熟甘草芒硝各一兩上為細末煉蜜丸如彈子每服半丸食後溫酒化下或童溺半盞研化之忌冷水濟金砂散取疔瘡道人頭微炒存性一兩即蒼耳子硇砂三錢半雄黃三錢蟾酥以多為妙上將瘡四圍刺破以少油調藥末置於瘡內緋帛封之數日疔自出如瘡入腹嘔逆者將蒼耳搗汁飲之一方但用硇砂雄黃等分研細用蜜調先破瘡頭去血入藥豆大在瘡口內紙花貼之亦效無蒼耳散治一切疔腫神效用蒼耳草根莖苗子但取一色便可用燒灰存性研細用好米醋米泔澄澱和如泥隨瘡大小塗上厚二分干即易之不過十度即拔根出須針破塗之更加雄黃尤妙世蒼耳與白梅研爛貼疔上拔去根濟蟾酥丹治疔瘡取蟾酥以白麵黃丹搜作劑丸如麥粒狀針破患處以一粒納之取蟾酥法用癩蚆破眉稜上以手捻出酥於油紙或桑葉上用竹篦刮下然後插在背陰處自干用之衍苦苣搗汁敷疔瘡殊驗青苗陰乾以備冬月為末水調敷本草云取苦苣莖中白汁敷疔腫出根又取汁滴癰上立潰丹治疔用磁石為末苦酒和敷封之根出立瘥秘要疔瘡用白蘞為末水調敷之聖惠方世治疔瘡用麻內蛀蟲一條研敷瘡上卻用膏藥貼上一飯時去膏藥其疔自出治疔瘡最有功效用蟬蛻殭蠶為末酸醋調塗四圍留瘡口俟根出稍長然後拔去再用藥塗瘡海藏方單用殭蠶為末津調塗亦佳保治疔瘡奪命散烏頭尖附子底蠍梢雌黃雄黃各一錢蜈蚣一兩硇砂粉霜輕粉各五分砒二錢半腦子少許麝香少許上為細末先破瘡出惡血以草杖頭用紙帶藥末插入於內以深為度丹日本三藏敷疔瘡方江子肉十粒半夏一大顆研末附子半枚蜣螂一枚各為末四味臭麝香也相和看瘡大小以紙繩子圍瘡口以藥泥上又用絹帛貼敷時換新藥以可為度此方活人甚多聖治疔瘡甚者用附子末醋和塗之干即再塗千金方同丹琥珀膏方見癰疽下雜方條又方用針刀鏇破疔頭以蟾酥敷之後用野菊花莎草根甜菜葉擂細以無灰酒儘量調服之酒醒疔化水即痛定如熱除不必去疔亦自愈也世治疔瘡獨腳茅防風細辛甘草節白殭蠶青皮黃連羌活獨活蟬蛻赤芍藥各等分上㕮咀每服五錢先將一服加澤蘭葉少許姜一兩同擂爛熱酒和服然後酒水各半盞姜三片煎服此方神效無治十三種疔皆以此法治之以緋帛一片裹藥取匝為限先用亂髮雞子大攤布帛上牛黃如桐子大又以棘刺針二十一枚赤小豆七粒為末並布發上卷緋綿作團外以發作繩十字縛之置熨斗中急火燒灰研細以枸杞或子或根皮枝葉隨得為末用枸杞末二匕緋帛灰一匕共成三匕研勻分二服空心溫酒調下世奪命丹治疔瘡發噁心及諸惡瘡蟾酥半錢硃砂水飛三分輕粉枯礬寒水石水飛各一錢銅綠一字麝香一字海羊二十個研即蝸牛也上件為細末將海羊另研為泥和藥一處丸如綠豆大如丸不就加好酒成之病輕者一丸二丸重者三丸未效再服服時嚼蔥白一大口極爛置手心放藥丸於蔥內裹合以熱酒送下暖處臥取汗出為效忌冰水瑞返魂丹治十三種疔硃砂膽礬各一兩半血竭銅綠蝸牛生用各一兩雄黃枯白礬各一兩輕粉沒藥蟾酥各半兩麝香少許上將蝸牛蟾酥研爛余藥為細末同研和丸如雞頭大每服一丸令病人先嚼蔥白三寸放在手心將藥丸裹在蔥白內用熱酒一盞吞下如重車行五里許有汗出即瘥如不能嚼蔥研爛裹下極效治疔瘡毒氣入腹多嘔吐欲死者即服內托香粉散滴乳半兩另研真綠豆粉一兩為細末煎生甘草湯調三錢時時飲之常令灌潤胸膈一方用雄黃綠豆粉乳香等分為末水調服世疔瘡入腹嘔者煎道人頭濃汁飲之治疔瘡毒氣入腹昏悶不食紫花地丁蟬蛻貫仲各一兩丁香乳香各二兩上為細末每服二錢空心溫酒下紫花地丁麥熟時有之開紫花質甚脆如蒲公英狀但蒲公英開黃花地丁開紫花瑞治疔危篤者二服即愈輕者一服立效土蜂房一小窠全本草云土蜂房有毒利大小便蛇蛻一條全上作一處器皿中盛用黃泥封固火煅存性研為細末每服一錢空心好酒調服少頃腹中大痛痛止其瘡已化黃水矣仍服五聖散大黃一兩生薑二兩栝蔞一個皂角針二兩甘草一兩金銀花二兩上㕮咀用好酒二升同煎至八分去渣不拘時服羅破棺丹一方有當歸赤芍連翹牡蠣金銀花紫花地丁宜選用之山梔牽牛末大黃各一兩甘草京三稜炮各七錢上煉蜜丸如彈子大酒化服之世治疔瘡最驗用蒼耳臭牡丹各一大握搗爛新汲水或順流水調服一碗瀉下黑水即愈丹追毒丸海浮石燒赤醋焠七次半兩乳香沒藥各一錢巴豆四十九粒川烏一兩上為末醋糊丸如桐子大若患二三日服十丸五六日服十四丸隨病上下服之先吃冷酒半盞或一盞又用冷酒吞下如嘔吞之不妨出藥依上服之病人大便不動再用三丸如疔看得端的爪破用頭垢留患處後服藥海肘後犯疔腫垂死菊花葉一握搗絞汁一升入口即活此神驗亦用其根丹溪云根莖葉花皆可紫梗者佳孟疔腫困重生搗蒼耳根葉和小兒尿絞汁冷服一升日三服甚驗世疔瘡於所屬經絡各瀉之疔瘡者必發於手足之間生黃疱其中或紫黑色有一條如紅線直上倉卒之際急宜以針於紅線所至處刺出毒血然後以蟾酥乳香膏等藥於正瘡上塗之針時以病者知痛出血為好否則紅線入腹攻心必致危困矣百一治疔腫以針刺四畔用石榴皮末著瘡上調面圍四畔灸痛為度調末敷上急裹經宿連根自出禹錫患疔腫中風疼痛者煼驢馬糞熨瘡滿五十遍極效無一曰麻子疔其狀肉上起頭大如黍米色稍黑四邊微赤多癢忌食麻子及衣布併入麻田中行二曰石疔其狀皮肉相連色如黑豆甚硬刺之不入肉內陰陰微痛忌瓦爍磚石之屬三曰雄疔其狀疱頭黑黶四畔仰疱漿起有水出色黃大如錢孔形忌房事四曰雌疔其狀瘡頭稍黃向里黶亦似灸瘡四面疱漿起心凹色赤大如錢孔忌房事五曰火疔其狀如湯火燒灼瘡頭黑黶四邊有疱漿起如赤粟米忌火灸爍六曰爛疔其狀色稍黑有白瘢瘡中潰潰有濃水流出瘡形大小如匙面忌沸熱食爛帛物七曰三十六疔其狀頭黑浮起形如黑豆四畔起大赤色今日生一明日二後日三乃至十若滿三十六藥所不能治俗名黑疱忌嗔怒蓄積愁恨八曰蛇眼疔其狀瘡頭黑皮上浮生形如小豆狀似蛇眼大體硬忌惡眼看並嫉妒人見之及毒藥九曰鹽膚疔其狀大如匙面四畔皆赤有黑粟粒起大忌食鹹物十曰水洗疔其狀大如錢形或如錢孔瘡頭白里黑黶汁出中硬忌飲漿水水洗渡河十一曰刀鐮疔其狀闊狹如薤葉大長一寸左側肉黑如燒爍忌刺及刀鐮切割鐵刃所傷可以藥治不可亂攻十二曰浮漚疔其狀瘡體圓曲少許不合長而狹如薤葉大內黃外黑黑處刺不痛黃處刺則痛十三曰牛拘疔其狀肉疱起掐不破此十三種初發必先癢後痛先寒後熱熱定則寒多四肢沉重頭痛心驚眼花若大重者則嘔逆嘔逆者難治其麻子疔一種始末唯癢所最忌者不得觸犯犯即難治其浮漚疔牛拘疔兩種無忌縱不治亦不殺人欲知犯觸但看脊強瘡痛極甚不可忍者是犯禁也疱步孝切石癰丹治石癰如石不治腫者生商陸根搗擦之燥則易之取軟為度張文仲癰未潰以苦苣白汁滴之立潰本草云亦出疔根保木香散治瘡難消不能作膿痛不止酒調下三錢方見痘癰諸腫丹卒腫起大痛芫青根大者杵之和苦酒如泥煮三沸帛上包之葛氏風毒腫三年苦酒濃煎蔥白以布包熨腫上外臺秘要治一切熱毒腫商陸根和鹽少許敷之日再易孫真人食忌治一切毒腫疼痛不可忍者搗蓖麻仁敷之立瘥肘後方治腫蒺藜子一升炒黃杵細以香油和如泥再炒令焦以舊布如腫之大小攤之貼腫上勿開頭㧺上外臺秘要治惡刺及狐貍刺毒腫取蒲公英草根白汁敷之多塗立瘥餘七月十五日夜左手中指背揩著庭木痛不可忍十日後瘡日深漸高大痛欲死用此而安孫方經患熱腫水研山豆根濃汁塗干再塗衍臘月中以新瓦罐滿注熱水用朴硝二升投湯中攪散掛北檐下俟硝滲出罐外卻收之以人乳汁調半盞掃一切風熱毒氣攻注目瞼及發頭面四肢腫痛應手神效山腫毒或疼痛處以赤小豆為末水調敷頻換或用香白芷水調敷尤妙又方白芙蓉葉曬乾同皂角為末水調敷丹治諸處皮裡面痛何首烏末薑汁調膏以帛裹於痛處用火炙皮鞋底熨之妙經驗方瘰癧馬刀結核連續者為瘰癧形長如蛤者為馬刀羅曲陽縣劉禪師善治瘡瘍瘰癧其效更捷授予四方太乙膏玉燭散克效散翠玉膏用之每每見效太乙膏治癧子瘡神效沒藥四錢清油一斤黃丹五兩腦子研一錢麝香三錢輕粉乳香各二錢上以清油黃丹熬成膏用柳枝攪又用憨蔥七枝旋旋加下蔥盡為度下火不住手攪至滴水不散卻入沒乳腦麝輕粉等味攪勻瓷器內盛用克效散斑蝥四十九個不去翅足炒官桂半錢粳米四十九粒赤小豆四十九粒硇砂半錢上五味研為細末初服一字次服半錢次服三字又次服四字煎樟柳根湯送下空心服以小便淋瀝並作澀為效噁心嘔吐黃水無妨其瘰癧日日自消矣玉燭散治瘰癧自消和血通經當歸芍藥大黃甘草熟地芒硝黃芩川芎各等分上為粗末每服三錢水一盞生薑三片煎至七分去渣溫服日進一服七八日效翠玉膏方見臁瘡楊氏家藏治瘰癧方荊芥白殭蠶黑牽牛各二錢斑蝥二十八個去頭翅足用大米炒上為末臨臥時先將滑石末一錢用米飲調服半夜時又一服五更初卻用溫酒調藥一錢或二三錢量強弱用服訖如小便無惡物行次日早再進一服又不行第三日五更初先進白糯米稀粥湯再進前藥一服更以燈心湯下調琥珀末一錢重服以小便內利去惡毒為愈如小便痛用青黛一錢以甘草湯調送下即止嚴三聖丸治瘰癧丁香五十粒斑蝥十個麝香另研一錢上為末用鹽豉五十粒湯浸研爛如泥和前藥令勻丸如綠豆大每服五七丸食前溫酒送下日進三服五七日外覺小便淋瀝是藥之效或便下如青筋膜之狀是病之根也忌濕面毒食保連翹湯連翹一斤瞿麥一斤大黃三兩甘草二兩上銼每服一兩水二碗煎至一盞半早食後巳時服在項兩邊屬足少陽經服藥十餘日後可於臨泣穴灸二七壯服藥不可住至五六十日方效一方加大黃木通貝母一作知母各五兩雄黃七分檳榔半兩減甘草不用同前藥為細末熟水調下三五錢無必勝丸治瘰癧不以年深月近及腦後兩邊有小結塊連複數個兼癆瘵腹內有塊鯽魚一個去腸並子雄黃一粒雞子大硇砂一錢以上二味併入在鯽魚腹內仰安魚於炭火燒煙盡取出蜈蚣全者一條蓬朮半兩梔子五個皂角二挺以上四味並燒存性蓖麻子五個去皮燈上燒黃明膠三文上為末另用皂角二挺去皮捶碎以水三碗揉去滓煮精羊肉四兩爛軟入輕粉五匣男子乳汁半兩同研成膏和藥末丸如綠豆大硃砂為衣溫酒浸晨下十丸一服至晚看肉疙瘩子若項有五個則以五服藥取之視其所生多少以為服數既可更進數服白花蛇散治久漏瘰癧發於頂腋間憎寒發熱或痛或不痛白花蛇酒浸軟去皮骨焙乾二兩犀角鎊半兩黑牽牛半兩半生半炒青皮半兩上為末每服二錢加膩粉半錢研勻五更糯米飲調下巳時利下惡物乃瘡之根也更候十餘日再進一服忌發風壅熱物如已成瘡一月可效神驗世小犀角丸常服除去根本截其源流應效如神諸癧並宜服之犀角青皮陳皮各一兩黑牽牛一兩半生半炒連翹半兩上為細末用皂角二條去皮弦子炮捶以布絞取汁一碗許又用新薄荷二斤研取汁同熬成膏以前藥末為丸如桐子大每服三十丸連翹煎湯食後服間以薄荷茶湯服子和一婦人病瘰癧延及胸臆皆成大瘡相連無好皮肉求戴人療之戴人曰火淫所勝治以鹹寒命以滄鹽吐之即一吐而著痂次用涼膈散解毒湯等劑皮肉反復如初世治瘰癧未破者如神百藥不應者累效杏樹葉陰乾為末五分萬年霜火煅為末二分半即人中白蝙蝠火焙乾為末二分半白花蛇蛻燒為灰存性為末二分半蜜蜂七個焙為末上將杏樹葉末用清水調卻入前四件藥末調勻敷患處卻將皮紙一片用針刺孔貼藥上如干用清水就紙上刷之每一晝夜換藥一次如面上發熱服清涼飲子數帖其熱自退敗散瘰癧方神效白膠香海螵蛸降真香用心無土氣者上等分為末摻患處外以水紙掩之一夕而退已破者蜜蜂二十一個蛇蛻七分半蜈蚣二條端午前收者上用香油四兩將前三藥入油內用文武火熬成入光粉二兩用桑枝七條如箸大者急攪候冷出火氣七晝夜方可用紙攤作膏貼患處以上二方得之於義門鄭氏累驗不須服藥貼上五七日便消丹貼瘰癧方用大烏頭五個火炮五個生用並去皮臍大皂莢二條半以好米醋二鍾刷炙醋乾為度一半焙乾並去黑皮又用炒糯米一百六十粒同研末以好米醋於火上略頓微暖敷貼患處入蜜少許尤佳不問有頭無頭大蟢五枚日乾細研酥調如面日兩度貼之出聖惠方蟢一作蜘蛛或破或不破項以下至胸前者皆治之用九真藤如雞卵大洗生嚼常服之取葉搗覆瘡上數服即止出斗門方九真藤即何首烏也無蝸牛散治瘰癧潰與未潰皆可治蝸牛不拘多少以竹籤穿瓦上曬乾燒存性上為末入輕粉少許豬骨髓調用紙花量瘡大小貼之一法以帶殼蝸牛七個生用取去肉入丁香七枚於七殼內燒存性與肉同研成膏用紙花貼之海項後側少陽經中疙瘩不辨肉色不問大小及月日深遠或有赤硬腫痛用生山藥一塊去皮蓖麻子一個上研勻攤貼之如神丹溪云山藥補陽氣生者能消腫硬經曰虛之所在邪必湊之留而不去其病為實非腫硬之謂乎故其氣則留滯自不容不行世粉金散黃柏草烏等分為末蜜調敷之清涼散餅山慈姑生用良薑等分上俱搗為餅去汁罨之能散去寒熱或以山慈菰磨調酒服大妙此藥大能散癧如神東龍泉散塗癧瓦粉龍泉粉炒即磨刀石上粉也昆布去上廣朮京三稜各半兩酒浸炒乾上件同為極細末煎熱水調塗之用此去疾尤速世治癧用鯽魚芫花燒灰存性水調敷治鼠癧小嫩鼠末出毛者焙乾蝙蝠糞小麥炒鬼箭根焙乾各為末和勻油調敷干再敷之本治鼠癧瘰癧刺蝟皮瓦上炒上一味研為末加水銀粉干敷廣治瘰癧經年不瘥者生玄參搗碎敷上日一易之外治瘰癧燒狼屎灰敷上本治諸癧疾硃砂砒霜硇砂馬牙硝各等分上乳缽內研細麵糊搜如香附子狀相瘡口大小作之盡送入瘡口中恐腫時用薄荷研細塗之待收口卻將大柏皮白丁香併為末盡入孔中如邊不幹卻用江子去殼不拘多少用麻油煎令赤去火氣後去江子入蠟合如膏看瘡口大小塗之及將白芨末水調塗上立效治漏癧用蛇菰子不拘多少瓦上曬乾為末用紙捻蘸藥入瘡口立效蛇菰子未詳恐即慈菰子丹又方用大田螺肉燒存性為末麝香少許濕則乾摻干則油調敷脈人年五六十其脈浮大者痹俠背行苦腸鳴馬刀挾癭者皆為勞得之又治瘰癧人參白朮當歸陳皮芍藥酒浸各一錢川芎香附茯苓半夏各五分甘草少上作一服姜二片以金銀藤煎湯一鍾半煎前藥食後就吞絳宮丸五十粒又方絳宮丸大黃酒蒸二兩山楂連翹川芎當歸酒洗麥芽桃仁蘆薈甘草蕓薹子一兩黃連酒浸南星酒浸海藻酒洗一兩半升麻羌活桔梗防風半兩白朮二兩黃芩酒炒上用神麯糊為丸已破加人參一兩作膏用甘草節殭蠶同煎治頸上塊動者夏枯草末六錢甘草末一錢上和勻每服一錢至二錢茶清調下食後本言夏枯草大治瘰癧散結氣有補養厥陰血脈之功而經不言觀其能退寒熱虛者儘可倚仗若實者以行散之藥佐之外施艾灸亦漸取效此草三四月開花夏至邊便枯蓋稟純陽之氣得陰則枯耳世人不知故表而出之內瀉病本之法並見前表裡條東連翹散堅湯治耳下至缺盆或至肩上生瘡堅硬如石動之無根者名馬刀瘡從手足少陽經中來也或生兩脅或已流膿作瘡或未破並皆治之當歸酒洗半兩黃芩生半兩土瓜根酒炒一兩芍藥一錢柴胡根一兩二錢連翹半兩蒼朮三錢草龍膽酒洗一兩黃芩酒炒七錢甘草炙六錢黃連酒炒三錢廣朮酒炒半兩京三稜細銼半兩同廣朮酒洗一次微炒乾上以一半為細末煉蜜為丸如綠豆大每服一百丸或一百五十丸一半㕮咀每服半兩水一盞八分先浸半日煎去渣熱服臨臥頭低腳高去枕而臥每口作十次咽留一口送下丸子服畢如常安臥升陽調經湯治繞項下或至頰車生瘰癧此症出足陽明胃經中來也若其瘡深遠隱曲肉低是足少陰腎中來也是戊傳癸水夫傳妻俱作塊子堅硬大小不等並皆治之或作丸服亦得升麻八錢連翹半兩葛根五錢草龍膽酒炒半兩桔梗半兩細黃芩酒炒六錢黃柏酒炒二次去皮七錢知母酒洗炒一兩廣朮酒洗炒一兩甘草炙半兩京三稜酒洗微同廣朮炒五錢黃連去須酒洗五錢上秤一半作丸煉蜜為丸如綠豆大每服一百丸或一百五十丸一半㕮咀每服半兩若能食大便硬可旋加至七八錢止水二盞先浸半日煎至一盞去渣熱服臥身腳在高處去枕頭噙一口作十次咽之留一口在後送下丸子服藥畢臥如常此治法也散腫潰堅湯治馬刀瘡結硬如石在耳下至缺盆或至肩上或至脅下皆手足少陽經中及瘰癧遍下頦或至頰車堅而不潰在足陽明經中所出或二瘡已破及流膿水並皆治之服藥多少臨病斟酌量病人飲食多少大便硬軟以意消息之柴胡梢四錢升麻六錢桔梗半兩草龍膽酒炒半兩黃芩梢酒洗炒八錢一半生連翹三錢甘草根炙三錢當歸三錢白芍藥二錢栝蔞根酒洗半兩黃柏去皮酒炒半兩知母炒半兩葛根二錢黃連二錢京三稜酒炒三錢廣朮酒洗炒三錢昆布去土半兩上㕮咀每服六錢或七錢水二盞先浸半日煎至一盞去渣稍熱服於臥處伸腳在高處頭微低每噙一口作十次咽至服畢依常安臥取藥在胸中停留故也另攢半料作細末煉蜜為丸如綠豆大每服一百丸此湯留一口送下更加海藻半兩炒食後量虛實加減多少服皆仿此例救苦勝靈丹湯治馬刀挾癭者從耳下或耳後下頸至肩上或入缺盆中者乃手足少陽經之分野其瘰癧在於頦下或至頰車者乃足陽明經之分野受心脾之邪而作也今將二證合治之黃耆一錢護皮毛實腠理及活血氣又實表補元氣乃瘡家之聖藥也人參三分補肺氣如氣短及不調而喘者加之真漏蘆半錢勿以白頭翁代之升麻一錢葛根半錢此三味俱足陽明本經藥甘草半錢能調中和諸藥瀉火益胃連翹一錢此一味乃十二經瘡中之藥不可無者能散血結氣聚此瘡家之神藥也牡丹皮三分去腸胃中留滯宿血當歸身三分生地黃三分熟地黃三分此三味諸經中和血生血涼血藥也白芍藥三分如夏月倍之其味酸其氣寒能補中益氣治腹痛如冬月寒症勿用肉桂二分大辛熱能散結聚如陰症瘡瘍少用之此寒因熱用之意又為陰寒覆蓋其瘡用大辛熱去之煩躁者勿用柴胡功同連翹如瘡不在少陽經勿用黍黏子三分無腫不用昆布二分味鹹若瘡堅硬甚者用之咸能軟堅也京三稜炮二分廣朮三分此二味瘡堅硬甚者用之不硬者勿用羌活獨活防風各一錢以上三味必關手足太陽症脊痛項強不可回顧腰似折項似拔防風辛溫如瘡在膈上雖無手足太陽經症亦當用之為能散結去上部風邪故也益智仁二分如唾多者胃不和也或吐沫吐食胃中寒者加之無則勿用麥芽一錢消食健脾神麯炒二分食不消化者用之黃連炒三分治煩悶厚朴薑製一錢二分如腹脹加之黃柏炒三分如有熱或腿腳無力加之如煩躁欲去衣者此腎中伏火也更宜加用上共為細末湯浸蒸餅捏作餅子曬乾搗如米粒大每服三錢白湯下如氣不順加橘紅甚者加木香少許量病人虛實消息之毋令藥多妨其飲食此治之大法也如止在陽明分者去柴胡黍黏子二味余皆用之如在少陽分為馬刀挾瘦去獨活漏蘆升麻葛根加瞿麥三分如本人氣素弱其病勢來時氣盛而不短促者不可考其平素宜作氣盛而從病變治之權也加黃芩黃連黃柏知母防己視邪氣在上中下而用之假令在上焦加黃芩半酒洗半生用在中焦加黃連半酒半生在下焦加酒製黃柏知母防己之類選而用之如大便不通而滋其邪盛者加酒製大黃以利之如血燥而大便乾燥者加桃仁泥大黃如風結燥不行者加麻仁大黃以潤之如風澀而大便不行加煨皂角仁大黃秦艽以利之如脈澀覺身亦氣澀而大便不通者加郁李仁大黃以除風燥如陰寒症為寒結秘而大便不通者以局方半硫丸或加炮附子乾薑煎候冰冷服之大抵用藥之法不惟瘡瘍一家凡諸疾病氣素怯弱者當去苦寒之劑多加人參黃耆甘草之類以瀉火而補元氣余皆仿此本治鼠癧瘰癧土附子一個食鹽三升小便五升上三味同浸半月日取出將附子去黑皮陰乾為末用黑豆爛煮研為膏丸附子末如桐子大每服十丸酒吞下早晚二服丹初發頭項硬未破者其效如神牡蠣四兩甘草二兩為末每服一大錢食後臘茶同點日二服半月除根初虞世方丹溪治世義大官癧瘡用此方一切丈夫婦人瘰癧經效牡蠣用炭一稱煅通赤取出於濕地上用紙襯出火毒一宿取四兩玄參三兩並搗羅為末以麵糊丸如桐子大早晚食後臨臥各三十丸酒下藥將盡癧亦除根出經驗方肘治頷下瘰癧如梅李大宜速消之海藻一斤酒一升漬數日稍稍飲之衍取蓼子微炒研為細末薄荷酒調二三錢服治瘰癧久則效世治瘰癧用夜合草遇夜則其葉閉合本草名合明俗名連錢母出禾田中貼水面生取其葉搗自然汁服之渣盦患處效保文武膏治瘰癧用桑椹黑熟者二斗以布袋絞取汁石器中熬成膏子白湯化下一匙日三服紅者曬乾為末湯調服聖治瘰癧腫硬疼痛年深時久不瘥用貍頭蹄骨酥炙黃搗羅為散每日空心粥飲調下一錢匕靈黃帝曰寒熱瘰癧在於頸腋者皆何氣使生岐伯曰此皆鼠瘻寒熱之毒氣也留於脈而不去者也鼠瘻之本皆在於藏其末上出於頸腋之間其浮於脈中而未內著於肌肉而外為膿血者易去也黃帝曰去之奈何岐伯曰諸從其本引其末可使衰去而絕其寒熱審按其道以予之徐往徐來以去之其小如麥者一刺知三刺而已寒熱篇上經一章皆從經脈取臟腑之本以治瘰癧之末也其末出於耳下或耳後下頸至肩上或入缺盆中者當於手足少陽經取之或針或灸如後穴扁瘰癧天井肩井撮瘰癧天井半寸灸七壯瀉之東腋下腫馬刀挾癭善自齧舌頰天牖中腫寒熱臨泣丘墟各一分灸五壯太衝一分灸三壯腋下頸項腫天池順皮三分灸七壯如頷腫加後谿二分灸五壯腋下腫馬刀挾癭喉痹陽輔五分灸二七壯申脈一分灸三壯立愈甲胸中滿腋下腫馬刀瘻善自齧舌頰天牖中腫淫濼脛酸頭眩枕骨頷腮痛目澀身痹灑淅振寒季脅支滿寒熱脅腰腹膝外廉痛臨泣主之馬刀腫瘻淵液章門支溝主之出於頦下或至頰車者當於手足陽明經取之或針或灸如後穴三里足陽明合谷手陽明丹搗生商陸根作餅子置於瘰癧上艾炷灸餅子上干即易之灸三四餅出外臺秘要世當癧上貼肉灸十四壯神效東瘰癧馬刀將先出一瘡用四楞鐵環定住不令出移破作口子以油紙捻紝之勿令合了以絕其瘡之源其效至速如瘡不破或病人不肯破更以藥塗之三日一易之以龍泉散主之方見表裡條世瘰癧多生肩項或赤或白或沉或浮初生如豆久似核年月浸久其大如梅或如雞卵排行成列或生二三或生六七俗名蟠蛇癧是也用性努力思慮過久則疾痛赤腫繼之早治為上流注癧婦人多有之其性急躁其氣怫鬱其心執著初生在項破後膿注四肢遍體結毒如梅李狀不療自破孔竅相穿寒熱疼痛或流膿汁是名流注癧也又名千歲瘡宜服托裡救苦神應丸川烏附去皮臍生用一兩烏頭五兩當歸酒浸一宿沒藥白芷陳皮甘草節各一兩蟬蛻水洗半兩大皂角七錠去皮弦子薑黃一兩半上用皂角敲碎水四大碗煎至二大碗濾去渣用汁一同煮烏頭川烏候烏頭爛為度擂如泥其餘諸藥卻另為末和烏頭泥為丸如桐子大每服六十丸飢飽皆用薄荷湯下若瘡既破穿鑿孔穴其處必生腫肉如指大或黑或白乃風與氣搏宜驅風行經散氣之劑以化氣調經湯主之化氣調經湯與神應丸間服治流注癧香附末酒浸一宿曬乾一兩橘皮二兩羌活一兩白芷一兩甘草半兩牡蠣煅半兩天花粉皂角刺各半兩上為細末每服二錢用清湯不拘時候調下日三次如脈有力者先用追毒神異湯下之卻服救苦神應丸辰砂血竭各一錢麝香一字共為細末大黃半兩大甘草節半兩上為㕮咀作一帖河水一鍾煎半鍾調前末子臨臥服之單窠癧者生一個也發於頸項最難治但宜如前藥服之日久自消或發於囟骨亦難治用毒藥療之勿令浸漬日久蓮子癧一胞裹十數枚生於項之左右以手觸則能轉動尚可用藥治療如堅硬挨不動者乃不可生憎寒發熱燥渴凡遇此症至難治雖神聖亦無如之何也已重臺癧生於項頸或左或右初則單窠結在上或在下重疊見之是名重臺癧此症藥不可療不可針灸若是毒行甚腫痛發渴生痰萬死一生害人極速初覺有之急用小犀角丸粉金散治之燕窠癧形似燕窠不可治肺脈微澀為鼠瘻在頸支腋之間下不勝其上其應善酸全文見治虛實法色白脈主澀靈黃帝曰決其生死奈何岐伯曰反其目視之其中有赤脈上下貫瞳子見一脈一歲死見一脈半一歲半死見二脈二歲死見二脈半二歲半死見三脈三歲而死見赤脈不下貫瞳子可治也寒熱篇丹夫瘰癧初發必起於少陽經不守禁戒必延及陽明經大抵食味之厚鬱氣之積曰毒曰風曰熱皆此三端招引變換須分虛實彼實者固易治自非痛斷厚味與發氣之物雖易亦難殊為可慮以其屬膽經主決斷有相火而且氣多血少婦人見此若月經行不作寒熱可生稍久轉為潮熱其症危矣自非斷欲絕慮食淡雖神聖不可治也結核獨形而小核者為結核河結核火氣熱甚則鬱結堅硬如果中核也不須潰發但熱氣散則自消丹結核或在項在頸在臂在身如腫毒者多在皮裡膜外多是痰注作核不散問其平日好食何物吐下後用藥散核結核在頸項方殭蠶炒大黃酒浸青黛膽星各等分上為末蜜丸噙結核在下頦二陳湯加酒炒大黃連翹桔梗柴胡結核在臂二陳湯加連翹防風川芎酒芩蒼朮皂角刺殭蠶麝香行太陰厥陰之積痰使結核自消甚捷濟治頦下結核不消經效用大肚蜘蛛不拘幾個以好酒浸之研爛同浸酌酒去渣溫熱臨臥服之癭瘤靈虛邪之入於身也深寒與熱相搏久留而內著寒勝其熱則骨疼肉枯熱勝其寒則爛肉腐肌為膿內傷骨內傷骨為骨蝕有所疾前筋疾前二字衍文也筋當作結筋屈不得伸邪氣居其間而不反發為筋溜有所結氣歸之衛氣留之不得反津液久留合為腸溜久者數歲乃成以手按之柔已有所結氣歸之津液留之邪氣中之凝結日以易甚連以聚居為昔瘤以手按之堅有所結深中骨氣因於骨骨與氣並日以益大則為骨疽有所結中於肉宗氣居之邪留而不去有熱則化而為膿無熱則為肉疽凡此數氣者其發無常處而有常名也刺節真邪篇此皆虛邪中人為病弗去而久留著故積歲累月而成疽瘤也子和新寨一婦人年四十餘有瘤三瓣戴人令以咸吐之三湧三汗三下癭已消半次服化癭之藥遂大消去夫病在上者皆宜吐亦自有消息之法耳河瘤氣赤瘤丹熛熱勝氣也火之色也丹癭氣先須斷厚味海藻洗一兩黃連二兩上為末以少許置掌中時時舐之津嚥下如消三分之二須止後服一方用黃柏二兩海藻一兩不用黃連亦佳治癭氣結核累累腫硬以昆布一兩洗去咸搗為末每用一錢綿裹於好醋中浸過含之咽津藥味盡再噙之肘治頸下卒結囊欲成癭海藻一斤洗去咸酒浸飲之無破結散海藻洗草龍膽海蛤通草昆布礬石枯松蘿各三分麥面四分半夏貝母各二分為末酒服方寸匕日三忌鯽魚豬肉五辛生菜諸雜毒物十日知二十日愈濟玉壺散治三種癭海藻洗海帶洗昆布雷丸各一兩青鹽廣朮各半兩上等分為細末陳米飲丸如榛子大噙化以煉蜜丸亦好子和人參化癭丹海帶洗海藻洗海蛤昆布以上四味皆焙澤瀉炒連翹以上各等分豬靨羊靨各十枚豬羊靨即豬羊外腎乃囊中之卵也上為末蜜丸如雞頭大臨臥噙化一二丸忌油膩物羅寶金散偏醫癭氣無不瘥豬羊靨十對暖水洗去脂膜後曬乾杵為細末海藻洗海帶各二兩洗丁香木香琥珀研麝香研各一分真朱研半兩上件先將丁香木香海藻海帶杵為細末入下項藥味合和再研細重羅過每服一錢熱酒一盞調服夜臥服垂頭而睡若在室男女十服必效如男子婦人患者一月見效有胎不可服海帶丸治癭氣久不消海藻洗貝母青皮陳皮上件各等分為細末煉蜜為丸如彈子大食後噙化一丸大效羅枯瘤方名一井散硇砂粉霜雄黃以上各二錢輕粉沒藥乳香以上各一錢土黃三錢做土黃法砒黃另末二兩木鱉子半兩去殼巴豆半兩去油硇砂另為末二錢上以砒黃一處為末用木鱉子同石腦油成一塊油紙裹定埋於地坑內四十九日取出於瓷器盛掰作小塊研細少許砒黃即雌黃上為細末以津調塗瘤頂外邊歇一韭葉先以花紙貼之上用小黃膏貼之小黃膏黃柏黃芩大黃各等分上為細末以水調為糊比前藥大一遭三日一易至八九日不取直候可取一方單用黃柏末亦佳丹小兒丹瘤蓖麻子五個去皮研入面一匙水調塗之甚妙出小兒門羅生肌青龍散訶子皮高茶龍骨上件各等分為細末乾摻上又枯瘤方砒硇砂黃丹雄黃輕粉以上各一錢斑蝥生用三十個硃砂乳香沒藥各一錢上研為末糯米粥為丸捏作棋子樣爆干先灸破瘤頂三炷以藥餅蓋上用黃柏末以水調貼之數日自然枯乾落下一方以銅綠為末草刺瘤破摻上以膏藥塗之世點瘤疒贅方神驗桑柴灰棗樹灰黃荊灰桐殼灰各二升半蕎麥灰少上以沸湯淋汁五碗許澄清入斑蝥四十個穿山甲五片乳香腦子不拘多少約五碗煎作二碗用瓷器盛之乳香腦子候冷入之後臨用時入新石灰調成膏神妙敷瘤上干以清水潤之其效如神羅枯瘤方桑柴灰三碗石灰三碗朽木三兩干桑耳三兩草烏半斤川烏四兩上朽木等四味一處燒灰令存性同前二灰研勻用水一桶淋汁如法熬成膏用之東諸癭惡氣肩顒男左灸十八壯右十七壯女右灸十八壯左十七壯又法天府七七壯衝陽隨年壯甲癭天窗一作天容千金作天府及臑會主之癭瘤氣舍主之子和在西華眾人皆訕以為吐瀉而已一日魏壽之與戴人入食肆中見一夫病一瘤正當目上網內眥色如灰李下垂覆目睛不能視物戴人謂壽之曰吾不待食熟立取此瘤魏未之信也戴人曰吾與爾取此瘤何如其人曰人皆不敢割戴人曰吾非用刀割別有一術其人從之乃引入一小室中令俯臥一床以繩束其胻刺委中大出血先令以手揉其目瘤上亦刺出雀糞立平出戶壽之大驚戴人曰人之有技可盡窺乎郜城戴人之鄉也一女子未嫁年十八兩手背皆有瘤一類雞距一類羊角腕不能釧嚮明望之如桃膠然夫家欲棄之戴人見之曰在手背者為膠瘤在面者為粉瘤此膠瘤也以䤵針十字刺破按出黃膠膿三二匙立平瘤核更不再作婚事覆成非素明者不敢用此法耳本治果報面生疒贅瘤方用艾丸灸十壯即用醋磨硫黃塗紙上剪如螺螄掩子大貼所灸處更用膏藥重貼二日一換候癢擠出膿如綠豆粉即愈硫黃羅謙甫作雄黃無癭多著於肩項瘤則隨氣凝結此等皆年數深遠浸大浸長堅硬不可移者名曰石癭皮色不變者名曰肉癭筋脈露結者名曰筋癭赤脈交結者名曰血癭隨憂愁消長者名曰氣癭五癭皆不可妄決破決破則膿血崩潰多致夭枉瘤則有五骨瘤脂瘤肉瘤膿瘤血瘤亦不可決潰肉瘤尤不可治治則殺人唯脂瘤破而去其脂粉則愈丹服癭瘤藥先須斷厚味目眥瘍即俗謂之偷針也運氣目眥方有二一曰熱經云少陰司天之政三之氣大火行寒氣時至民病目赤眥瘍治以寒劑也二曰燥經云歲金太過民病目赤腫眥瘍又云陽明司天燥淫所勝民病目眯眥瘍治以溫劑也世治偷針眼方南星生為末三錢生地黃不拘多少上一處研成膏貼太陽兩邊腫自消又方治偷針眼生薑搗細盦之淚出即愈天蛇頭代指丹蒲公英草清明時節如薺菜狀中開一朵花如菊花者取干與蒼耳草二味等為末以好醋濃煎浸洗即愈蒲公英忍冬酒治天蛇頭極效累驗方見乳癰門世治天蛇頭蒲公英搗細水和調去渣服之又搗渣盦患處屢效治天蛇頭用野落蘇即兼絲子金銀花藤天蕎麥上切細用好米醋濃煎先熏後洗又方用人糞雜黃泥搗之裹在患處即愈丹治手指忽腫痛名為代指以烏梅入醋研浸患處立瘥治手指腫酸漿水入少鹽熱浸之冷即易孫真人方甲疽嵌甲嵌丘銜反精治甲疽因剔甲傷肌或因甲長侵肉遂成瘡腫痛復緣穿窄靴趼損四邊腫焮黃水出浸淫相染五指俱爛漸漸引上腳缺泡漿四邊起如火燒瘡日夜倍增醫方所不能療者用綠礬五兩形色似朴硝而綠色置於鐵板上聚炭封之吹令火熾其礬即沸流出色赤如溶金汁者是真也候沸定汁盡去火待冷取出研為細末色似黃丹收之先以鹽湯洗瘡帛裹干用此末敷之愈靈苑治甲疽胬肉裹甲膿血疼痛不瘥凡此疾須剔去肉中甲不治亦愈或已成瘡不瘥用乳香末膽礬燒研等分敷之內消愈精勝金方治甲疽胬肉膿血疼痛不瘥用牡蠣頭厚處生研為末每服二錢研靛花酒調下如癰盛已潰者以此末敷之更服煎藥一日三服丹嵌甲陷甲割甲成瘡久年不瘥者用烏頭尖黃柏等分末之洗淨貼之精華佗治嵌甲累效方硇砂乳香並研各一錢膩粉半錢橄欖核燒存性用三個黃丹一字上為末以生麻油調先以鹽湯洗淨挹干敷之二次效乳癰乳岩丹乳硬論乳房陽明所經乳頭厥陰所屬乳子之母不知調養怒忿所逆鬱悶所遏厚味所釀以致厥陰之氣不行故竅不通而汁不得出陽明之血沸騰故熱甚而化膿亦有所乳之子膈有滯痰口氣焮熱含乳而睡熱氣所吹遂生結核於初起時便須忍痛揉令稍軟吮令汁透自可消散失此不治必成癰癤治法疏厥陰之滯以青皮清陽明之熱細研石膏行汙濁之血以生甘草節消腫導毒以栝蔞子或加沒藥青橘葉皂角刺金銀花當歸頭或湯或散加減隨意消息然須以少酒佐之若加以艾火兩三壯於腫處其效尤捷彼村工喜於自衒便妄用針刀引惹拙病良可哀憫若夫不得於夫不得於舅姑憂怒郁遏時日積累脾氣消沮肝氣橫逆遂成隱核如鱉棋子不痛不癢十數年後方為瘡陷名曰乳岩以其瘡形嵌凹似巖穴也不可治矣若於始生之際便能消釋病根使心清神安然後施之治法亦有可安之理予族侄婦年十八歲時曾得此察其形脈稍實但性急躁伉儷自諧所難者後姑耳遂以單方青皮湯間以加減四物湯行經絡之劑兩月而安此病多因厚味濕熱之痰停蓄膈間與滯乳相搏而成又有滯乳因兒口氣吹噓而成又有拗怒氣激滯而生者煅石膏燒樺皮栝蔞子甘草節青皮皆神效藥也婦人此病若早治之便可立消有月經時悉是輕病五六十後無月經時不可作輕易看也乳癰青皮栝蔞橘葉連翹桃仁留尖皂角刺甘草節破多加參耆精神效栝蔞散治乳癰乳岩神效丹溪亦云妙捷恐貧賤之家未能辦集者用後蒲公英草尤妙栝蔞一個去皮焙為末子多者有力甘草生當歸酒浸焙各半兩乳香另研沒藥另研各二錢半上為末用無灰酒三升於銀石器內慢火熬取一升清汁分作三服食後良久服如有奶岩便服此藥可杜絕病根如毒氣已成能化膿為黃水毒未成即於大小便中通利如疾甚再合服以退為度立效散與前方間服神妙但於栝蔞散方減去當歸加紫色皂角刺一兩六錢是也本蒲公英草味甘平無毒主婦人乳癰腫水煮汁飲之及封之立消用酒煎更妙渣敷患處丹蒲公英在處田間路側有之三四月開黃花似菊味甘解毒散滯意其可入陽明太陰經洗淨細研以忍冬藤濃煎湯入少酒佐之隨手便欲睡睡覺已失之矣云張氏橘皮湯治乳癰未結即散已結即潰極痛不可忍者神效因小兒吹乳變成斯疾者並皆治之用陳皮一味湯浸去白曬乾麵炒微黃為細末麝香研酒調二錢初發覺赤腫疼痛一服見效丹乳癰初發腫硬一服瘥真樺皮末酒服方寸匕睡省已失出靈苑羅勝金丹治婦人吹乳極有神效用百齒霜即木梳上發垢上一味不拘多少有無根水為丸如桐子大每服三丸倒流水送下食後令病左乳者左臥右乳者右臥於溫處汗出愈用新水傾於房上接之乃倒流水也圖治婦人奶疼痛不可忍用穿山甲炙黃木通各一兩自然銅半兩生用三味搗為細末每服二錢溫酒調下不拘時候簡婦人吹乳獨勝散白丁香半兩搗羅為末每服一錢匕溫酒調服無時云治婦人吹乳皂角散歌曰婦人吹乳意如何皂角燒灰蛤粉和熱酒一杯調一字頃間揉散笑呵呵又方乳香研一錢栝蔞根末一兩上研令勻溫酒調服二錢丹楊孺人乳腫痛青皮石膏煅連翹皂角刺炒黃藥子當歸頭木通各一錢甘草生三分作一帖入好酒些少同煎飲之又有別藥洗腫處義二孺人平時乳內有結核不為痛忽乳邊又有一腫核頗卻有些痛黃芩川芎木通陳皮各四錢人參二錢芍藥一錢大腹皮三錢炙甘草生甘草各一錢當歸頭一錢分二帖煎服丹二孺人但經將行而乳腫先兩日發口乾而不渴食少減脈左弦帶數右卻平治用四物湯加陳皮白朮茯苓帶熱下與點丸三十粒產後乳膨調麥芽飲自消云連翹湯治產後妒乳並癰連翹升麻芒硝各一兩玄參芍藥白蘞防己射干各八錢大黃二錢甘草六錢杏仁四十個去皮尖上㕮咀以水六升煮二升下大黃次芒硝分三服丹一婦人年六十厚味鬱氣而形實多妒夏無汗而性急忽左乳結一小核大如棋子不痛自覺神思不佳不知食味絕半月以人參湯調青皮甘草末入生薑汁細細呷一日夜五六次至五七日消矣此乃乳岩之始不早治隱至五年十年以後發不痛不癢必於乳下潰一竅如巖穴出膿又或五七年十年雖飲食如故洞見五內乃死惟不得於夫者有之婦人以夫為天失於所天乃能生此謂之岩者以其如穴之嵌岈空洞而外無所見故名曰岩患此者必經久淹延惟此婦治之早正消患於未形余者皆死凡十餘人又治一初嫁之婦只以青皮甘草與之安丹用蒲公英草搗爛盦患處神妙云用天南星末以溫酒調塗之聖治婦人乳痛成癰以益母草為末水調塗乳上一宿自瘥生搗爛用之亦得山婦人吹乳用桑樹蛀屑飯搗成膏貼之丹乳頭裂破丁香末敷之梅師方怪穴乳癰乳中穴在乳下中針入一分沿皮向後一寸半灸瀉甲乳癰寒熱短氣臥不安膺窗主之乳癰淒素寒熱痛不可按乳根主之大驚乳痛梁丘主之乳癰有熱三里主之乳癰諸藥不能止痛者三里針入五分立止女子乳癰驚巨虛下廉主之千金云臂腫重足蹈不收跟痛乳癰太衝及復溜主之妒乳太淵主之婦人乳余疾肓門主之囊癰陰頭癰丹外科精要云癰疽入囊者死囊為厥陰今以死言之將以為屬少陰腎經邪予親見入囊者七八人悉以濕熱入肝經施治而用補陰藥佐之雖膿潰皮脫睪丸懸掛可畏者皆不死但未知下虛年老者如何耳千治丈夫陰頭癰師所不能醫用鱉甲一枚燒末以雞子白和敷之良便毒精治穀道前後生癰謂之懸癰用橫紋甘草一兩四寸截斷以長流水一碗文武火慢慢蘸水炙自早至午炙令水盡甘草中心見水潤為透細銼卻用無灰好酒二小杯入甘草煎至一杯溫服之二三服便可保無虞此病初發如松子大漸如蓮子數十日後始覺赤腫如桃子即破若破難治此藥雖不能消過二十日後必盡消矣投兩服亦無害林判院嘗患此癰已破服此藥兩服瘡即合甚妙丹騎馬癰用大粉草帶節四兩長流水一碗以淬浸水盡為末入皂角灰少許作四服湯調頓服立效垣青皮湯治便毒青皮防風當歸身甘草梢生各等分上㕮咀分作四服水一小碗煎至八分去渣大溫服空心日進三服丹毒腫或著陰卵或偏著一邊痛牽引小腹痛不可忍方見癰疽雜病痛牽引小腹條子和玉燭散即四物湯調胃承氣湯各半服之也世又方劉寄奴王不留行大黃金銀花木鱉子上等分酒水煎露一宿五更服丹便毒初起射干二寸生薑如指大搗細上取順流水煎微沸服之以瀉為度又用牛皮膠醋煮塗患處已結成膿者大黃半兩枳實三分厚朴三錢甘草節一錢連翹半錢桃仁泥二十一枚生薑三片上作一帖煎服之又便毒青皮白芷柴胡赤芍藥檳榔朴硝烏藥木瓜大黃連翹栝蔞生地黃甘草節三稜蓬朮黃芩犀角皂角刺上㕮咀水三碗煎至一碗大飢服以瀉為度山便毒取大蜘蛛一個研細熱酒下丹又方用甘草節白芷黃連各等分如破者龍骨白枯礬赤石脂並用鐵圍散癰疽腫毒亦治用之效乳香沒藥各半兩大黃黃連黃柏南星半夏防風羌活皂角刺木鱉子栝蔞甘草節草烏尖阿膠另研上為細末醋調成膏以石器內火熬黑色鵝翎敷之貼骨癰保諸瘡大痛不辨肉色漫腫光色名附骨癰如神三生散露蜂房蛇蛻頭髮洗淨等分上燒灰存性研細酒下三錢丹附骨癰熱在血分之極初發時以青皮甘草治之破後當養血內癰有三素肝滿腎滿肺滿皆實即為腫王注云滿謂脈氣滿實腫謂癰腫肺之癰喘而兩胠滿仲景云肺癰吐膿如米粥咽燥振寒肝癰兩胠滿臥則驚不得小便腎癰腳下至少腹滿大奇論林億云腳下當作胠下千金云腸癰之為病小腹腫強按則痛便數似淋仲景云腸癰小腹痞堅蓋小腹痛而痞堅者腎癰也小便數而似淋者腸癰也即肺癰肝癰之屬胃脘癰人迎脈逆而盛全文見後胃脘癰條肺癰腸癰胃脘癰丹癰疽發於內者肺癰肝癰腎癰腸癰囊內癰附骨癰惟肺癰須先解表令表而出之千咳唾膿血其脈數實者為肺癰若口中咳即胸中隱痛脈反滑數此肺癰也問曰病者咳逆何以知其肺癰當有膿血吐之則死其脈何如曰寸脈微而數微為風數為熱微則汗出數則惡寒風中於衛呼氣不入熱逼於榮吸氣不出風傷皮毛熱傷血脈風舍於衛其人則咳口乾喘滿咽燥不渴多吐濁沫時時振寒熱之所過血為凝滯蓄結癰膿吐如米粥始萌可救膿成則死問曰振寒發熱寸脈滑數其人飲食起居如故此為癰腫醫反不知以傷寒治之不應何以知有膿膿之所在何以別知其處師曰假令膿在胸中者為肺癰其脈數咳吐有膿血設膿未成其脈自緊數緊去但數為膿已成也要小青龍湯方見傷寒條要葶藶大棗瀉肺湯治肺癰喘不得臥葶藶炒黃研細丸如彈大大棗十二枚水三升入棗先煮取二升去棗入葶藶又煮一升頓服之又曰治肺癰胸滿脹一身並面目浮腫鼻塞清涕出不知香臭酸辛咳逆上氣喘鳴迫塞用前方三日一劑可至三四劑須先與小青龍湯一劑乃與之要桔梗湯治咳而胸滿振寒脈數咽乾不渴時出濁唾腥臭久久吐膿如粥者肺癰也桔梗甘草炙各一兩水三升煮取一升去渣分溫再服則吐膿血也亦治喉痹三因甘草倍之每四錢名四聖散千金亦名桔梗湯用桔梗三兩甘草二兩服後必吐膿血要葦莖湯治肺癰又云一本治咳有微熱煩滿心胸甲錯葦莖三升切薏苡仁半升冬瓜仁半升桃仁五十枚去皮水一斗先煮葦莖得五升去柤入諸藥取二升分溫五服當吐如粥千金云肺癰當吐膿血葦莖即汀洲間蘆荻之粗種也治吐膿血如肺癰狀口臭他方不應者宜消風散入男子發灰研細入和之清米飲下可除根只兩服亦治吐血消風散方荊芥川芎羌活人參茯苓殭蠶防風蟬蛻藿香各二錢厚朴陳皮各半兩為末是也韋宙獨行方治心胸甲錯為肺癰黃昏湯主之用夜合皮掌大一枚水三升煮取二升分再服夜合樹按本草即烏農樹上肺癰證治要略以小青龍湯先與一劑乃行氣取膿之藥將以解表之風寒邪氣此治腫瘍之例也後以韋宙方終之者將以補里之陰氣此治潰瘍之例也以上六方皆丹溪所集梅如聖丸治風熱毒氣上攻咽喉痛痹腫塞妨悶及肺癰喘嗽唾濃血胸滿振寒咽乾不渴時出濁沫氣臭腥久久咯膿狀如米粥樟腦另研牛黃另研桔梗甘草生用各一錢上為細末煉蜜丸每兩作二十丸每用一丸噙化丹濟生桔梗湯治肺癰心胸氣塞咳嗽膿血心神煩悶咽乾多渴兩足腫滿小便赤黃大便多澀桔梗貝母川歸栝蔞仁枳殼薏苡仁桑白皮防風以上各一兩生甘草杏仁蒸百合各半兩黃耆一兩半上修事㕮咀每服四錢水一碗半生薑五片煎至八分去渣服若大便秘加大黃小便秘加木通仲桔梗白散治咳而胸滿振寒脈數咽乾不渴時出濁唾腥臭久久吐膿如米粥者為肺癰桔梗貝母各三分巴豆一分去皮炒研如脂上三味為散強人飲服半錢匕羸者減之病在膈上者吐膿血膈下者瀉出若下多不止飲冷水一碗則定此亦要略方丹溪不刪採用之者必有微意存焉丹肺癰醫壘元戎搜風湯吐之搜風湯未考本治肺癰吐膿血作臭氣胸乳皆痛升麻湯川升麻桔梗薏苡仁地榆牡丹皮芍藥各半兩甘草二分上銼粗末每一兩水一升半姜五片煎去渣日三服丹濟生排膿湯治肺癰得吐膿後以此排膿補肺生綿耆二兩細末每二錢水一碗煎一半服肺癰收斂瘡口止有合歡樹皮白蘞煎湯飲之肺癰已破入風者不治腸癰千金謂妄治必殺人腸癰為病小腹重而強按之則痛便數似淋時時汗出復惡寒身皮甲錯腹皮急如腫狀其脈數者小有膿也巢云洪數者已有膿脈若遲緊者未有膿甚者腹脹大轉側有水聲或繞臍生瘡或膿自臍出或大便出膿血脈問曰羽林婦病何以知腸有膿師曰脈滑而數滑則為實數則為熱滑則為榮數則為衛衛數下降榮滑上升榮衛相干血為敗濁小腹痞堅小便或澀或自汗出或復惡寒膿為已成設脈遲緊則為瘀血血下即安要薏苡附子敗醬散治身甲錯腹皮急如腹脹本無積聚身熱脈數者附子炮二分敗醬五分薏苡仁一錢上為末每服方寸匕以水二合煎頓服小便當下三因薏苡仁附子同前敗醬用一兩一分每四錢水一盞半煎七分去渣空心服千大黃牡丹湯治腸癰小腹痞堅或偏在膀胱左右其色白堅大如掌熱小便自調時自汗出脈遲堅者未成膿可下之當有血脈數膿成不復可下大黃四兩牡丹皮三兩芒硝二兩冬瓜仁一升桃仁五十個上㕮咀水五升煮一升頓服當下膿血刪繁用芒硝半合瓜子五合劉涓子用硝石三合肘後同名瓜子湯三因用大黃桃仁各二分瓜子三分牡丹皮一錢硝二錢銼散作一帖水三盞煎至八分去渣入硝再煎沸頓服無時無薏苡湯治腸癰腹中痛煩躁不安或脹滿不食小便澀婦人產後虛熱多有此病縱非癰但疑是者便可與或有差亦無妨薏苡仁五兩牡丹皮桃仁各三兩瓜子仁四兩銼散每四大錢水盞半煎七分服姚氏去桃仁用杏仁崔氏加芒硝二兩千金方同醫案曰女子腹痛百方不治脈滑數時作熱腹微急孫診曰腹痛脈當沉細今脈滑數此腸癰也以雲母膏一兩作丸如桐子大以牛皮膠烊溫酒調膠水下丸子藥晌時服盡膏下膿血一盆而安千灸法屈兩肘正肘頭銳骨是穴灸百壯下膿血而安王氏余話有婦人腸中痛不可忍大便自小便出李生診之曰芤脈見於陽部此腸癰也乃出雲母膏作百十丸煎黃耆湯吞下利膿血數升而安李曰寸芤積血在胸關芤為腸生癰也李乃楊吉老之婿棄舉業習醫官取醫博士內疽者皆因飲食之火挾七情之火相鬱而發飲食者陰受之七情者臟腑受之宜其發在腔子而向里非干腸胃肓膜也謂之內者以其視之不見故名焉上腸癰五方丹溪先生所集也前三方內其要略一方元本雖云內有癰膿然先生不言之而又連千金三因二方置於篇首者蓋亦腫瘍瀉利例也後二方用膠烊黃耆煎湯吞藥者蓋亦潰瘍補例也素帝曰人病胃脘癰者診當何如岐伯曰診此者當候胃脈其脈當沉細沉細者氣逆甲乙經沉細作沉澀逆者人迎甚盛甚盛則熱人迎者胃脈也逆而盛則熱聚於胃中而不行故胃脘為癰也病能篇河射干湯治胃脘癰人迎脈逆而盛嗽膿血榮衛不流熱聚胃口成癰射干去毛梔仁赤茯苓去皮升麻各一兩赤芍藥一兩半白朮半兩上為末每服五錢水二盞煎至一盞去渣入地黃汁一合蜜半合再煎溫服不計時候要復元通氣散治諸氣澀耳聾腹癰便癰瘡疽無頭止痛消腫青皮陳皮各四兩甘草三寸生熟各半穿山甲炮栝蔞根各二兩金銀花一兩連翹一兩上為細末熱酒調下丹腸癰大腸有熱積死血流注桃仁承氣湯加連翹秦艽近肛門破入風者難治用防風之類大凡破傷風在頭面則以白芷為君防風頭佐之蓋去頭面皮膚之風故也在身體及四肢則以防風為君隨身梢用下部則以獨活佐之肺癰吐膿後其脈短而澀者自痊浮大者難治其面色白而反赤者此火之剋金皆不可治金匱方論曰熱在上焦者因咳為肺痿肺痿之病何從得之或從汗出或從嘔吐或從消渴小便利數或從便難又被快藥下利重亡津液故寸口脈數其人咳口中反有濁唾涎沫者為肺痿之病若口中辟辟燥咳即胸中隱隱痛脈反滑數此為肺癰咳唾膿血脈數虛者為肺痿數實者為肺癰按此言肺痿屬熱如咳久肺傷聲啞聲嘶咯血此屬陰虛火熱甚是也本論治肺痿吐涎沫而不咳者其人不渴必遺尿小便數以上虛不能制下故也此為肺中冷必眩多涎唾用炙甘草乾薑此屬寒也肺痿吐涎多心中溫液者用炙廿草湯此補虛勞也亦與補陰虛火熱不同是皆宜分治之故肺痿又有寒熱之異也精勞傷血氣腠理虛而風邪乘之內盛於肺也則汗出惡風咳嗽短氣鼻塞項強胸脅脹滿久久不瘥已成肺痿也保肺癰者由食啖辛熱炙爆或酣飲熱酒燥熱傷肺所致治之宜早
