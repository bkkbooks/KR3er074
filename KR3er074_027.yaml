body:
  text: 卷之二十七肺大腸部喘丹凡治嗽未發以扶正氣為要已發以攻邪氣為主嘗治一中年男子久嗽每發時不食數日聲撼四鄰百治不效脈寸沉伏關滑遂於未發時用人參白朮當歸地黃以薑汁製之栝蔞實陳皮茯苓黃芩黃連乾薑些少煎湯下青礞石丸將發時先用神秘沉香丸下之次與前藥中加杏仁枳實蘇葉倍栝蔞實煎服一月後證減十分之八後遂守此方漸安凡治數人皆以此法加減治之皆得大效氣虛短氣而喘有痰亦短氣而喘不可用苦寒之藥火氣盛故也宜導痰湯加千緡湯陰虛自少腹下火起衝於上而喘者宜降心火補陰有火炎上者宜降心火清肺金有痰者宜降痰下氣為主上氣喘而躁者為肺脹欲作風水症宜發汗則愈有陰虛挾痰喘者四物湯加枳殼半夏補陰降火諸喘不止者用椒目研極細一二錢生薑湯調下劫之氣虛不用又法用蘿蔔子蒸熟為君皂角燒灰等分為末薑汁加煉蜜丸如小豆大每噙化五七十丸劫止之後因痰治痰因火治火氣虛者用人參蜜炙黃柏麥冬地骨皮之類氣實人因服黃耆過多而喘者用三拗湯以瀉氣若喘甚者須用阿膠若久病氣虛而發喘者宜阿膠人參五味補之新病氣實而喘者宜桑白皮苦葶藶瀉之治哮專主於痰宜吐法不可用涼藥必帶表散垣肺脹膨膨而喘咳胸膈滿壅盛而上奔者於隨證用藥方中多加五味子人參次之麥門冬又次之黃連少許如甚則交兩手而督者真氣大虛也若氣短加黃耆五味子人參氣盛去五味子人參加黃芩荊芥穗冬月去荊芥穗加草豆蔻仁仲火逆上氣咽喉不利止逆下氣宜麥門冬湯主之麥門冬七升半夏一升人參四兩甘草二兩粳米三合大棗十二枚上六味以水一斗二升煮取六升溫服一升日三夜一服保天門冬丸治婦人喘嗽手足煩熱骨蒸寢汗口乾引飲面目浮腫天門冬十兩去心麥門冬八兩去心生地三斤取汁為膏上三味為細末膏子為丸如桐子大每服五十丸逍遙散下逍遙散須去甘草加人參或與王氏博濟方人參荊芥散亦得如面腫不已經曰面腫因風故宜汗麻黃桂枝可發其汗後與柴胡飲子去大黃咳論曰治臟者治其腧治腑者治其合浮腫者治其經治腧者治其土也治合者亦治其土也如兵圍魏救趙之法也本治咳嗽上氣喘急以人參一味為末雞子清投新水調下一錢昔有二人同走一含人參一不含俱走三五里許其不含者大喘含者氣息自如此乃人參之力也上用門冬五味人參三味為主治肺虛或自汗或少氣而喘蓋聖藥也予治一婦人五十餘歲素有痰嗽忽一日大喘痰出如泉身汗如油脈浮而洪似命絕之狀予適在彼速用麥門冬四錢人參二錢五味一錢五分煎服一帖喘定汗止三帖後痰亦漸少再與前方內加栝蔞仁一錢五分白朮當歸芍藥黃芩各一錢服二十餘帖而安此實麥門冬五味人參之功也如自汗兼腹滿脈沉實而喘者裡實也宜下之仲上氣喘而躁者屬肺脹欲作風水發汗則愈咳而上氣此為肺脹其人喘目如脫狀脈浮大者越婢加半夏湯主之麻黃六兩石膏半斤生薑三兩大棗十五枚甘草一兩半夏半升上六味以水六升先煮麻黃去上沫納諸藥煮取三升分溫三服丹七三嬸喘遇冬則發此寒包熱也解表則熱自除枳殼三錢炒麻黃防風黃芩桔梗各二錢陳皮紫蘇五葉木通一錢半通利九竅治肺壅甚當上分四帖煎取小半盞熱飲之治寒包熱而喘必用發散半夏枳殼炒桔梗黃芩炒紫蘇麻黃杏仁甘草如天寒加桂枝女子十二歲自小喘嗽白朮陳皮青皮五錢麻黃茯苓木通片芩三錢蒼朮桔梗二錢乾薑一錢甘草五分一男子年一十四歲哮十日則發一遍此疾在上焦不得汗泄正當九月十月之交宜溫散仍與小胃丹佐之溫散加麻黃黃芩每帖用一錢半入薑汁研細末以水盞半煎去渣飲之每夜臨臥時與小胃丹十二粒津下之仲肺脹咳而上氣煩躁而喘脈浮者心下有水小青龍加石膏湯主之麻黃芍藥桂枝細辛甘草乾薑各三錢五味子半夏各半升石膏二兩上九味以水一斗先煮麻黃去上沫納諸藥煎取三升強人服一升羸者減之日三服小兒服四合垣麻黃定喘湯小兒寒鬱喘喉鳴腹內鳴堅滿鼻流清涕脈沉急而數麻黃草豆蔻益智仁各一兩分半甘草歸身紅花黃芩生柴胡梢各一分升麻神麯各五分吳茱萸二分蘇木半分全蠍一個上㕮咀分二服水二大盞煎至七分去渣稍熱服食後忌風寒微微有汗效麻黃蒼朮湯治秋暮冬天每夜連聲嗽不絕大喘至天明日高方緩口苦兩脅下痛臥而多驚筋攣肢節痛痰吐涎沫日晚呵欠不能飲食柴胡根羌活根蒼朮各五分麻黃一分防風根甘草根生歸梢黃芩各四分熟甘草三分五味子九分草豆蔻六分黃耆一錢半上分二帖水煎去渣稍熱服臨臥上發表治喘前五方發寒包熱也後三方發外中皆寒也四磨湯治七情鬱結上氣喘急人參檳榔沉香天台烏藥上四味各濃磨水取七分煎一二沸放溫服加木香枳殼為六磨湯有苦寒者加丁香桂亦可衍義云烏藥檳榔氣少走泄多但不甚剛猛與沉香同磨作湯治胸中氣膈甚當上解鬱治喘丹一婦人與前方發熱得汗而喘定夜半進少稀粥喘再作心痞口乾與下方半夏枳實炒三錢黃連白朮二錢木通陳皮各一錢半麻黃紫蘇各一錢甘草五分上㕮咀姜水煎服若陰虛痰喘急者補陰降火四物加枳殼半夏平江洗伯寧家豐好內厚味每年到四月九月內必發氣喘抬肩吐痰脈沉澀而細數諸醫用平肺之藥數年不愈如此者六七年用人參生地黃膏和當歸牛膝肉蓯蓉枸杞子五味子知母黃柏天門冬玄參末為丸如桐子大每服百丸空心服以救肺虛又用阿魏黃連山楂沉香牛黃辰砂膽星陳皮神麯糊為丸如桐子大臨臥薑湯下三四十丸治厚味服訖復用瓊玉膏一劑繼服之而安瓊玉膏方見勞瘵治哮亦治積雞子略敲損殼不損膜浸尿缸內三四日臨夜煮食海藏本草云陰不足者補之以味羅喘則肺實己未八月中霖雨不止時承上命治不憐吉歹元帥夫人年逾五十身體肥盛因飲酒及湩乳過腹脹喘滿聲聞舍外不得安臥大小便澀滯氣口脈大兩倍於人迎關脈沉緩而有力予思霖雨之濕飲食之熱濕熱大盛上攻於肺神氣躁亂故為喘滿邪氣盛則實實者宜下之故制平氣散以下之白牽牛二兩半生半熟只取頭末一兩青皮去白檳榔各三錢陳皮去白半兩大黃七錢內經曰肺苦氣上逆急食苦以泄之故以白牽牛苦寒瀉氣分濕熱上攻喘滿故以為君陳皮苦溫體輕浮理其肺氣青皮苦辛平散肺中滯氣為臣檳榔辛溫性沉重下痰降氣大黃苦寒盪滌滿實故以為使上為細末每服三錢煎生薑湯一大盞調下無時一服減半再服喘愈止有胸膈不利煩熱口乾時時咳嗽再與加減瀉白散桑白皮一兩地骨皮知母陳皮青皮各去白桔梗去蘆各五錢黃芩細銼淨甘草炙各三錢上件銼如麻豆大每服五錢水二大盞煎至一盞去渣溫服食後數服良愈華佗云盛則為喘減則為枯活人云發喘者氣有餘也凡看文字須要會得本意盛而為喘者非肺氣盛也喘為氣有餘者亦非肺氣有餘也氣盛當認作氣衰有餘當認作不足肺氣果盛又為有餘當清肅下行而不喘以其火入於肺衰與不足而為喘焉故言盛者非言肺氣盛也言肺中之火盛也言有餘者非言肺氣有餘也言肺中之火有餘也故瀉肺以苦寒之劑非瀉肺也瀉肺中之火實補肺也用者不可不知羅槐角利膈丸治風勝痰實胸滿及喘滿咳嗽皂角一兩酥炙去皮弦子半夏槐角炒各半兩牽牛一兩半上同為細末生薑汁麵糊丸如桐子大每服三十丸食後生薑湯送下定喘餅子神驗羌花醋浸一宿炒桑白皮炒吳茱萸炒馬兜鈴陳皮去白各一兩寒食麵三兩白牽牛三兩半生半炒取頭末二兩上為末和勻滴水丸如櫻桃大捏餅子取熱灰半碗在鍋內同炒餅子熱每夜服一餅嚼爛煎馬兜鈴湯下如患人心頭不快加上一餅或兩餅至微明利下神效婦人有胎不可服洞虛子神秘沉香丸下痰喘方見痰飲門仲膈間支飲其人喘滿心下痞堅面色黧黑其脈沉緊得之數十日醫吐之不愈木防己湯主之虛者即愈實者三日復發與不愈者宜木防己湯去石膏加茯苓芒硝湯主之木防己三兩石膏十二枚如雞子大桂枝二兩人參四兩上四味以水六升煮取二升分溫再服木防己加茯苓芒硝湯方木防己桂枝各二兩人參四兩茯苓四兩芒硝三合上五味水六升煮二升去渣納芒硝再微煎分溫再服微利即愈丹喘急有風痰者婦人大全千緡湯半夏七個炮製四片破之皂角去皮尖甘草炙各一寸生薑如指大上用水一碗煮去半頓服一方不用甘草但用半夏末一兩皂角去皮弦半兩生薑七片同入紗袋中水三升煎至一盞五分以手揉洗取清汁分作三服並服二服效云四七湯治痰涎咽喉中上氣喘逆甚效方見咽喉條即仲景治婦人胸中如有炙臠半夏厚朴湯保半夏丸治因傷風而痰作喘逆兀兀欲吐噁心欲倒半夏一兩檳榔三錢雄黃三錢上為末薑汁浸蒸餅為丸桐子大每服三十五丸薑湯下小兒丸米大經定喘化痰豬蹄甲四十九個淨洗控干每個指甲內入半夏白礬各一字裝罐子內封閉勿令煙出火煅通赤去火毒細研入麝香一錢匕有上喘咳嗽用糯米飲下小兒五分至妙簡治喘急用桔梗一兩半搗羅為末童便半升煎取四合去渣溫服凡治喘正發時無痰將愈時卻吐痰者乃痰於正發之時閉塞不通而喘甚當於其時開其痰路則易安也宜此方桔梗之類及枳殼栝蔞實杏仁蘇葉前胡等引出其痰候痰出喘退卻調其虛實虛者補以參耆歸術實者瀉以沉香滾痰丸之類是也河人參半夏丸化痰定喘方見咳喘予平日用此方治久喘未發時服此丸已發時用沉香滾痰丸微下之累效世火喘用白虎湯加栝蔞仁枳殼黃芩神效保雙玉散治痰熱而喘痰湧如泉寒水石石膏各等分上細末人參湯下三錢食後服仲支飲不得息用葶藶大棗瀉肺湯卞之方見肺癰此方效驗甚捷但虛人忌服丹紫金丹治哮喘遇冷發者用之精豬肉三十兩砒霜明亮者一兩研細上將肉切如骰子大用砒末入肉內拌勻分肉為六分每分用紙筋黃泥包之用火烘令泥干又用白炭火於無人處煅青煙出盡為度放地上一宿研極細用湯浸蒸餅丸如綠豆大用清茶吞下大人二十丸小兒十丸量虛實用之哮喘遇冷則發者有二證其一屬中外皆寒治法乃東垣參蘇溫肺湯調中益氣加茱萸湯及此方紫金丹劫寒痰者是也其二屬寒包熱治法乃仲景丹溪用越婢加半夏湯等發表諸方之類及預於八九月未寒之時先用大承氣湯下其熱至冬寒時無熱可包自不發者是也丹清金丹治哮嗽遇厚味發者用之蘿菔子淘淨蒸令熟曬乾為末一兩豬牙皂角火燒過以碗覆地上作灰末三錢上為末拌勻用薑汁浸蒸餅丸如蘿蔔子大每服三十粒慢嚥下一方劫喘用薑汁蜜煉丸桐子大每七八十丸噙下止之瑞化痰丸快脾順氣化痰消食治久喘或作或止者甚妙半夏洗南星去皮膜白礬皂角切碎生薑上各一斤用水煮南星無白點為度揀去皂角不用將生薑切作片同半夏南星曬乾無日色火焙再加青皮去穰陳皮去白紫蘇子炒蘿蔔子炒另研乾葛杏仁去皮尖另研神麯炒麥蘖炒山楂香附子去毛上各半斤淨與前藥合和一處研為細末生薑汁浸蒸餅打糊為丸如桐子大每服五七十丸臨臥食後茶湯送下仲病人飲水多必暴喘滿潔白朮散治夏月飲冷酒生痰膈滿方見咳脾肺條丹喘而心痛油炒半夏為末粥丸薑湯下三十丸哮嗽必用吐法吐藥中用醋多不用涼藥子和稀涎散方見治法門上實條世治喘用古文錢七個鹽梅七個水一盞同浸二宿每服一呷空心良久吐出惡痰而效垣病機云諸痿喘嘔皆屬於上辨云傷寒家論喘嘔以為火熱者是明有餘之邪中於外寒變而為熱心火太旺攻肺故屬於上又云膏粱之人奉養太過及過愛小兒亦能積熱於上而為喘咳宜以甘寒之劑治之脈經又云肺盛有餘則咳嗽上氣喘渴煩心胸滿短氣皆衝脈之火行於胸中而作也系在下焦非屬上也蓋雜病不足之邪起於有餘病機之邪自是標本病傳多說飲食勞役喜怒不節水穀之寒熱感則害人六腑皆由中氣不足其䐜脹腹滿咳喘嘔食不下皆以大甘辛熱之劑治之則立已令立熱喘寒喘二方於後人參平肺散治心火刑肺傳為肺痿咳嗽喘嘔痰涎壅盛胸膈痞悶咽嗌不利桑白皮一錢知母七分甘草炙五分茯苓四分地骨皮五分天門冬四分青皮三分五味子三十粒陳皮三分人參五分上㕮咀只作一服水煎食後溫服如熱甚加黃芩四分紫蘇葉半夏各五分參蘇溫肺湯治形寒飲冷則傷肺喘煩心胸滿短氣不能宣暢人參肉桂甘草木香五味子陳皮半夏制桑白皮白朮紫蘇莖葉各二兩白茯苓一兩上㕮咀每服五錢水一盞半生薑三片煎至七分去渣食後溫服如冬寒每服不去節麻黃半分先煎去沫下諸藥丹喘有陰虛自小腹下火起而上者亦有痰火衝上者宜四物湯加青黛竹瀝陳皮入童便煎服垣調中益氣湯加減法方見治虛實條如秋冬月胃脈四道為衝脈所逆並脅下少陽脈二道而反上行病名曰厥逆其證氣上衝咽不得息而喘息有音不得臥加茱萸五分或一錢湯洗去苦觀厥氣多少而用之如夏月有此證為大熱也蓋此證隨四時為寒熱溫涼宜以酒黃連酒黃柏酒知母各等分為細末熟湯丸如桐子大每服二百丸白湯送下空心服仍多飲熱湯服畢少時便以美食壓之使不得胃中停留直至下元以瀉衝脈之邪也大抵治飲食勞倦所得之病乃虛勞七損證也當用溫平甘多辛少之藥治之是其本法也如時上見寒熱病四時症也又或將理不如法或酒食過多或辛熱之食作病或寒冷之食作病或居大寒大熱之處益其病當臨時制宜暫用大寒大熱治法而取效此從權也不可以得效之故而久用之必致夭橫矣黃帝針經曰從下上者引而去之上氣不足推而揚之蓋上氣者心肺上焦之氣陽病在陰從陰引陽宜以入腎肝下焦之藥引甘多辛少之藥使升發脾胃之氣又從而去邪氣於腠理皮毛也又曰視前痛者當先取之是先以繆刺瀉其經絡之壅塞者為血凝而不流故先取之而後治他病加減瀉白散治陰氣在下陽氣在上咳嘔喘促桑白皮一兩青皮二兩茯苓三錢地骨皮七錢甘草陳皮五味人參各五分上㕮咀每服四錢水一盞半入粳米數十粒同煎去渣溫服食後平居則氣平和行動則氣促而喘者亦衝脈之火予族兄六旬有餘素有喘證或唾吐血痰平居時則不喘稍行動則氣促喘急以黃柏知母滋腎丸空心服七八十丸其證大減此黃柏知母能泄衝脈之火者如此效也丹治卒上氣喘鳴息便欲死者研韭汁飲一升瘥蓋韭去胸中惡血滯氣食主上氣咳嗽胸膈妨滿氣喘桃仁二兩去皮尖以水一升研取汁和粳米二合煮粥食之諸氣憤郁皆屬於肺全文見診王注云憤謂憤郁奔迫也簡治肺氣喘嗽馬兜鈴二兩只用裡面子去殼秋石半兩入碗內和勻慢火炒乾甘草一兩炙二味為末一錢水一盞煎六分溫呷以藥末含咽津亦得衍義云治肺氣愈垣加減三奇湯治咳氣喘上氣痰涎喘促胸膈不利桔梗半夏陳皮甘草青皮杏仁人參五味子各等分上㕮咀每服四錢水二盞姜二片煎至一盞去渣通口食後服羅紫參散治形寒飲冷傷肺喘促痰涎不得安臥粟殼一兩蜜炒黃色麻黃桔梗紫參甘草炙五味各五錢上㕮咀每服四錢水二盞姜三片同煎去渣食後服云清金湯治男婦不拘遠近肺氣咳嗽上氣喘急喉中涎聲胸滿氣逆坐臥不安飲食不下粟殼蜜炙人參甘草各半兩陳皮茯苓杏仁阿膠炒五味子桑白皮薏苡仁紫蘇百合貝母去心半夏曲款冬花各一兩上㕮咀每服五錢姜三片棗二枚烏梅一個水煎臨臥服肺虛則少氣而喘經云秋脈者肺也秋脈不及則喘呼吸少氣而咳上氣見血下聞病音其治法則門冬五味人參之屬是也肺痹肺積則久喘而不已經云淫氣喘息痹聚在肺又云肺痹者煩滿喘而嘔是肺痹而喘治法或表之或吐之使氣宣通而愈也難經又云肺之積名息賁在右脅下如杯久不已令人喘咳發肺癰治法則息賁丸能磨其積是也胃喘則身熱而煩經云胃為氣逆又云犯賊風虛邪者陽受之陽受之則入六腑入六腑則身熱不時臥上為喘呼又云陽明厥則喘而啘啘則惡人或喘而死者或喘而生者何也厥逆連臟則死連經則生是也啘王注謂熱內鬱而煩凡此胃喘治法宜加減白虎湯之類是也腎喘則嘔咳經云少陰所謂嘔咳上氣喘者陰氣在下陽氣在上諸陽氣浮無所依從故嘔咳上氣喘也東垣治以瀉白散是也運氣喘者有三一曰金助肺盛而喘經云歲金太過病甚則喘咳氣逆肩背痛又云歲金太過曰堅成堅成之紀其病喘喝胸憑仰息治以溫劑是也二曰火攻肺虛而喘經云歲火太過炎暑流行肺金受邪民病少氣咳喘上臨少陰少陽咳喘息鳴又云少陰司天熱淫所勝病寒熱喘咳甚則肺脹大腹滿膨膨而喘咳又云少陰在泉熱淫所勝病氣上衝胸喘不能久立治以鹹寒是也三曰風火為氣逆經云木太過曰發生發生之紀上微則其氣逆是也靈黃帝曰衛氣之留於腹中搐積不行苑蘊不得常所使人肢脅胃中滿喘呼逆息者何以去之伯高曰其氣積於胸中者上取之積於腹中者下取之上下皆滿者傍取之黃帝曰取之奈何伯高對曰積於上瀉大迎天突喉中積於下者瀉三里與氣衝上下皆滿者上下取之與季脅之下一寸重者雞足取之診視其脈大而弦急及絕不至者及腹皮急甚者不可刺也衛氣失常論難足取之者正入一針左右斜入二針如雞之足三爪也東垣云大不可刺者宜灸也一則沉寒痛冷二則無脈知陽絕也三則腹皮急而陽陷也舍此三者余皆不得灸若病在兩寸者及腹皮急甚者當從陰引陽取穴於腹募五臟病取五臟募六腑病取六腑募若病在兩尺脈者當從陽引陰取穴於背腧五臟病取五臟腧六腑病取六腑腧元氣病取六腑腧募筋骨有形病者取五腧募其病不在天之陽不在地之陰在腹中者故取季脅下一寸元氣病取之右筋骨病取之左故在中者旁取之此其理也灸者認取之靈黃帝曰刺節言振埃夫子乃言刺外經去陽病余不知其所謂也願卒聞之岐伯曰振埃者陽氣大逆上滿於胸中憤瞋肩息大氣逆上喘喝坐伏病惡埃煙䭇不得息請言振埃尚疾于振埃黃帝曰善取之何如岐伯曰取之天容黃帝曰其咳上氣窮詘胸痛者取之奈何岐伯曰取之廉泉黃帝曰取之有數乎岐伯曰取天容者無過一里取廉泉者血變而止帝曰善哉刺節真邪篇䭇於結反陽迎頭痛胸滿不得息取之人迎寒熱病篇陽迎陽逆也氣逆上刺膺中陷者與下胸動脈雜病篇刺灸喘滿有六法其一取陽氣上四節經文所言者是也其二取肺經云肺手太陰之脈是動則病肺脹滿膨膨而喘咳缺盆中痛甚則交兩手而瞀所生病者咳上氣喘渴煩心胸滿視盛虛熱寒陷下取之也又云邪在肺則皮膚痛寒熱上氣喘汗出咳動肩背取之膺中外腧背三節五椎之傍以手疾按之快乃刺之取之缺盆之中以越之又云肺病者喘咳逆氣肩背痛取其經太陰足太陽之外厥陰內血者王注謂內外之間是足少陰經也又云肺藏氣氣有餘則喘咳上氣瀉其經隧無傷其經無出其血無出其氣楊注謂經隧為列缺穴也又云氣亂於肺則俯仰喘喝接手以呼取之手太陰滎足少陰輸是也其三取大腸經云腹中常鳴氣上衝胸喘不能久立邪在大腸刺肓之原巨虛上廉三里又云邪客手陽明之絡令人氣滿胸中喘息而支胠胸中熱刺手大指次指爪甲上去端如韭葉各一痏左取右右取左如食頃已是也其四取腎經云腎病者喘咳身重寢汗出憎風取其經少陰太陽血者是也其五取脾經云氣滿胸中喘急取足太陰大指之端去爪甲如韭葉寒則留之熱則疾之氣下乃止其六取脾喘內經詳文具痹千灸嗽兩乳黑白際二穴脊後三穴嘗灸族侄喘灸後一月喘發大吐痰一桶許而安見效針灸條下玉治喘哮天突針入向下五分瀉五吸亶中三分三呼旋璣三分瀉三吸氣海腧府一分沿皮向外一寸半瀉六吸乳根一分沿皮向外一寸半瀉一吸摘五膈氣喘息不止中脘八分期門凡剌腹部氣虛人內息六七口下入丹田閉氣剌之集哮喘灸刺上穴不愈者可選用之膏肓關元中脘三里百勞腎腧各灸之支溝大陵東陽哮喘諸穴選用之天容噫嘻氣舍扶突太白剌魄戶中府大包彧中雲門石門期門各灸之怪穴氣喘乳中在乳下肋中針入一分沿皮向後一寸半瀉之桑哮喘豐隆三寸半潔喘滿痰實口中如膠太谿甲喘少氣不足以息腹滿大便難時上走胃中鳴脹滿口舌乾口中吸吸善驚咽中痛不可內食善怒恐不樂大鐘主之咳腸下積聚而喘逆臥不安席時寒熱期門主之流注氣促喘天突甲喘逆鼽衄肩胛內廉痛不可俯仰䏚季脅引少腹而痛脹噫嘻主之怪穴婦人血弱氣喘氣中在氣海旁一寸半針入二寸半先補後瀉成喘者肺主氣形寒飲冷則傷肺故其氣逆而上行沖急喝喝而息數張口抬肩搖身滾肚是為喘也喘鳴肩息者脈實大也緩則生急則死全文見小兒喘王注云緩謂縱緩急謂弦急非來往之緩急也脈上氣喘息低昂其脈滑手足溫者生脈澀四肢寒者死丹哮喘必用薄滋味凡下痰走喘諸方施之形實有痰者神效若陰虛而脈浮大按之澀者不可下下之必反劇而死也喘不得臥凡喘而臥不得其脈浮按之虛而澀者為陰虛去死不遠慎勿下之下之必死宜四物加童便竹瀝青黛門冬五味枳殼蘇葉服之丹胡安人年六十八惡寒發熱自四月來得痰嗽眠不得食少心膈痛口中連嗽五更頗甚白朮三錢枳殼炒黃連各二錢芍藥二錢半片芩七錢半桔梗蘇梗葉各一兩木通五分甘草炙些五味二十一粒上入竹瀝煎服一丈夫因病喘不可臥肺脈沉而澀此外有風涼濕氣遏內熱不得舒黃芩陳皮木通各一錢半麻黃蘇葉桂枝各一錢黃連乾薑甘草炙開二教體虛感寒發熱氣喘難臥蒼朮麻黃白朮片芩炒各五分桂枝三分半夏枳殼各一錢木通三分甘草炙上生薑二片同煎加研碎杏仁五個此方半夏為君必是吐痰多之人也上解表三方前一方寒熱多者設後二方寒多者設咳逆上氣時時濁唾但坐不得眠者皂莢丸主之用皂莢八兩刮去皮酥炙上一味為末蜜丸如桐子大以棗膏和湯服三十丸日三夜一女人年六十自來無汗多痰今得喘病眠不得曾與青州白丸子半夏半兩枳殼炒四錢桔梗陳皮木通黃芩二錢麻黃一錢半紫蘇防風各一錢甘草炙五分上分作五帖生薑三片水煎去渣入竹瀝兩蚶殼許熱飲素夫不得臥臥則喘者是水氣之客也夫水者循津液而流也腎者水臟主津液主臥與喘也逆調論垣神秘湯治病人不得眠眠則喘者水氣逆行上乘於肺肺得水而浮使氣不流通其脈沉大宜此治之蘇葉陳皮生薑人參各五錢茯苓桑白皮木香各二錢上㕮咀水煎去渣大溫分二服仲咳逆倚息不得臥小青龍湯主之方見傷寒又云支飲亦喘不得臥加短氣其脈平也青龍湯下已多唾口燥寸脈沉尺脈微手足厥逆氣從小腹上衝胸咽手足痹其面翕然如醉狀因復下流陰股小便難時覆冒者與茯苓桂枝五味子甘草湯治其氣衝桂枝去皮茯苓各四兩甘草炙三兩五味子半升上四味以水八升煮取三升去渣分溫三服沖氣即低而反更咳胸滿者用桂枝茯苓五味甘草湯去桂加乾薑細辛各三兩以治其咳滿咳滿即止而更復渴沖氣復發者以細辛乾薑為熱藥也服之當遂渴而渴反止者為支飲也支飲者法當冒冒者必嘔嘔者復納半夏半升以去其水於桂苓甘草五味湯中去桂加乾薑細辛半夏是也水去嘔止其人形腫者加杏仁半升主之其證應內麻黃以其人遂痹故不納之若逆而納之必厥所以然者以其人血虛麻黃髮其陽故也用茯苓四兩甘草乾薑細辛各三兩五味子半夏杏仁各半升去皮尖上煎去渣溫日三服若面熱如醉此胃為熱所沖熏其面加大黃三兩以利之無真應散治遠年喘急不能眠百藥不效者白石英四兩通明者以生絹袋盛用雄豬肚一個以藥入內縫定煮熟取藥出再換豬肚一個如前法煎三次煮了取藥出曬乾研上為末以官局款冬花散二錢入藥末二錢再加桑白皮二寸生薑三片棗子一個水一盞半煎至七分通口服豬肚亦可吃只不得用醬醋鹽椒姜等調和款冬花散方用款冬花一錢貝母知母桑葉杏仁半夏阿膠甘草各二錢麻黃去節四錢為粗末是也本治多年肺氣喘急哮嗽夕不得臥紫金丹砒水飛半錢豌豆好者二錢用水略潤少時以紙挹乾研成膏上用膏子和砒同杵極勻丸如麻子大每服十五丸小兒量大小與之並用蠟茶清極冷吞下臨臥以知為度有一親戚婦人患十年遍求醫者皆不效忽有一道人貨此藥漫贖一服是夜減半數服頓愈遂多金丐得此方予屢用以救人時為神異素不得臥而息有音者是陽明之逆也足三陽者下行今逆而上行故息有音也陽明者胃脈也胃者六腑之海其氣亦下行陽明逆不得從其道故不得臥也下經曰胃不和則臥不安此之謂也逆調論千金白前湯治喉中水雞聲不得臥方見咳喉中作聲感寒喘不得臥治法見產後喘甲咳喘不得臥不得坐呼吸氣索咽不得胸中熱雲門主之咳逆煩滿不得臥胸中滿喘不得息背痛太淵主之上針灸喘不得臥天突穴甚效予治數人皆中產後喘產後喘極危多死也郭氏治產後喉中氣急喘促者因所下過多榮血暴竭衛氣無主獨聚肺中故令喘也此名孤陽絕陰為難治陳無擇云宜大料芎歸湯一方用獨參湯尤妙若惡露不快散血停凝上熏於肺亦令喘急但服奪命丹血去喘自定奪命丹方見胞衣不下世血竭散治產後敗血衝心胸滿上喘命在須臾宜服真血竭如無紫礦代沒藥上等分研細頻篩再研取盡為度每服二錢用童便合好酒半大盞煎一沸溫調下方產下一服上床良久再服其惡血自循經下行更不衝上免生百病云參蘇飲治產後血入於肺面黑髮喘欲死者人參一兩為末蘇木二兩上以水兩碗煮取蘇木一碗以下去渣調參末隨時加減服神效無若因憂怒性理郁發而喘者用小調經散以桑白皮杏仁煎湯調服小調經散方見水腫旋覆花湯治產後傷風寒咳喘嗽痰涎壅盛坐臥不寧旋覆花赤芍藥荊芥穗半夏曲五味子麻黃茯苓杏仁甘草前胡各等分上㕮咀每服四錢水盞半姜五片棗一枚煎七分去渣食前溫服浦江昊輝妻孕時足腫七月初旬產後二月洗浴即氣喘但坐不得臥者五個月惡風得暖稍寬兩關脈動尺寸皆虛百藥不效用牡丹桃仁桂枝茯苓乾薑枳實厚朴桑白皮紫蘇五味栝蔞皮仁煎湯服之即寬二三服得臥其痰如失蓋作汙血感寒治之也若傷鹹冷飲食而喘者宜見晛丸薑黃三稜蓽澄茄陳皮良薑人參蓬朮等分上為細末用蘿蔔浸煮爛研細將汁煮麵糊丸桐子大蘿蔔子湯下短氣短氣者氣短而急似喘非喘也詳見診條仲平人無寒熱短氣不足以息者實也丹溪治白雲許先生脾疼胯疼短氣用大吐大下者二十餘日凡吐膠痰二大桶如爛魚腸或如柏油條者數碗而安詳見腹痛孫正元散治氣不接續氣短兼治滑泄及小便數王丞相服之有效蓬莪朮一兩金鈴子去核一分上件為末入硼砂一錢煉過研細和勻每服二錢鹽湯或溫酒調下空心服垣胸滿少氣短氣者肺主諸氣五臟之氣皆不足而陽道不行也氣短小便利者四君子湯中去茯苓加黃耆以補之如腹中氣不轉者更加甘草一半肺氣短促或不足者加人參白芍藥中焦用白芍藥則脾中陽升使肝膽之邪不敢犯之如衣薄而短氣則添衣於無風處居止氣尚短則以沸湯一碗熏其口鼻即不短也法見調攝下同如厚衣於不通風處居止而氣短則宜減衣摩汗孔令合於漫風處居止如久居高屋或天寒陰濕所遏令氣短者亦如前法熏之如居周密小室或大熱而處寒涼氣短則就風日凡氣短皆宜食滋味湯飲令胃氣調和仲胸痹胸中氣塞短氣茯苓杏仁甘草湯主之橘枳薑湯亦主之方見胸痹痛門胸痹喘息咳唾胸背痛短氣栝蔞薤白半夏湯主之方見胸痹痛門夫短氣有微飲當從小便去之苓桂朮甘湯主之腎氣丸亦主之腎氣丸見腳氣中款花補肺湯治咳嗽短氣方見咳嗽門氣虛條苓桂朮甘湯茯苓四兩桂枝白朮各三兩甘草二兩上四味以水六升煮取三升分溫三服小便則利仲景論短氣皆屬飲此方苓桂朮甘湯是其一法也金匱云咳逆倚息短氣不得臥其形如腫謂之支飲又云支飲亦喘而不得臥加短氣其脈平也又云膈上有留飲其人氣短而渴四肢歷節痛脈沉者有留飲又云肺飲不弦但苦喘短氣其治法危急者小青龍湯脹滿者厚朴大黃湯冒眩者此方苓桂朮甘湯及澤瀉湯不得息葶藶大棗湯吐下不愈者木防己湯之類是也靈短氣息短不屬動作氣索補足少陰去血絡也癲狂篇東短氣房勞天井大椎肺腧肝腧尺澤灸甲短氣心痹悲怒逆氣狂易魚際主之成短氣者短氣而不能相續者是已似喘而非喘若有氣上衝而實非氣上衝也喘者張口抬肩搖身滾肚謂之喘也氣上衝者腹裡氣時時上衝也所謂短氣者呼吸雖數而不能相續似喘而不搖肩似呻吟而無痛者短氣也經所言短氣者眾實為難辨之證愚師莫識之為治有誤者多矣要識其短氣之真者氣急而短促謂之氣短者是也脈寸口脈沉胸中短氣仲陽脈微而緊緊則為寒微則為虛微緊相搏則為短氣少氣少氣者氣少不足以言也素三陽絕三陰微是為少氣方盛衰論怯然少氣者是水道不行形氣消索也示從容篇言而微終日乃復言者此奪氣也全文見診生死上少氣治法蓋生脈散獨參湯之屬是也一陽發病少氣善咳善泄全文見診病傳變運氣少氣有二一曰火熱經云火鬱之發民病少氣又云少陰之復少氣骨痿又云少陽之復少氣脈痿治以諸寒是也二曰風濕經云太陽司天之政四之氣風濕交爭風化為雨民病大熱少氣是也針灸少氣有三一曰補肺經云肺藏氣氣不足則息微少氣補其經隧無出其氣又云肺虛則少氣不能報息耳聾嗌乾取其經太陰足太陽之外厥陰內血者是也二曰補腎經云少氣身漯漯也言吸吸也骨酸體懈惰不能動補足少陰是也漯運合切三曰補氣海經云膻中者為氣之海其輸上在於柱骨之上下前在於人迎氣海不足則氣少不足以言審守其輸調其虛實所謂柱骨之上者蓋天容穴也人迎者結喉兩旁之脈動處也乃取天容人迎二穴補之也魚際絡青短者少氣也全文見陰陽素脾脈搏堅而長其色黃當病少氣脈要精微論一呼脈一動一吸脈一動曰少氣平人氣象論尺堅大脈小甚少氣悗有加立死全文見診謂尺內堅而脈反小而少氣悗加也善悲悲屬肺經云在臟為肺在志為悲又云精氣並於肺則悲是也仲婦人臟躁喜悲傷欲哭象如神靈所作數欠伸甘麥大棗湯主之甘草三兩小麥一升大棗十枚上三味水六升煮三升溫分三服亦補脾氣本鄉里有一婦人數次無故悲泣不止或謂之有祟祈禳請禱備至終不應予忽憶金匱有一證云婦人臟躁悲傷欲哭象如神靈數欠伸者宜甘麥大棗湯予急令治藥盡劑而愈古人識病制方種種絕妙如此運氣悲皆屬寒水攻心經云火不及曰伏明伏明之紀其病昏惑悲忘從水化也又云太陽司天寒氣下臨心氣上從喜悲數欠又云太陽司天寒淫所勝喜悲時眩僕又云太陽之復甚則入心善忘善悲治以諸熱是也針灸悲有二其一取心經云邪在心則病心痛善悲時眩僕視有餘不足而調其輸也其二取厥陰經云厥陰根於大敦結於玉英絡於亶中厥陰為闔闔折即氣絕而喜悲悲者取之厥陰視有餘不足虛實寒熱陷下而取之也妊娠善悲大論管先生治一妊娠四五個月臟躁悲傷遇晝則慘感淚下數欠象若神靈如有所憑醫與巫皆無益與仲景大棗湯一投而愈鼻塞鼻塞皆屬肺經云肺氣通於鼻肺和則鼻能知香臭矣又云五氣入鼻藏於心肺心肺有病而鼻為之不利也又云西方白色入通於肺開竅於鼻藏精於肺又云肺主臭在臟為肺在竅為鼻是也垣金匱真言論云西方白色入通於肺開竅於鼻藏精於肺夫十二經脈三百六十五絡其氣血皆上走於面而走空竅其精陽氣上走於目而為睛其彆氣走於耳而為聽其宗氣出於鼻而為臭難經云肺氣通於鼻肺和則能知香臭矣夫陽氣宗氣者皆胃中生髮之氣也其名雖異其理則一若因飢飽勞役損脾胃生髮之氣既弱其營運之氣不能上升邪塞孔竅故鼻不利而不聞香臭也宜養胃氣實營氣陽氣宗氣上升鼻管則通矣又一說難經云心主五臭肺主諸氣鼻者肺竅反聞香臭者何也蓋以竅言之肺也以用言之心也因衛氣失守寒邪客於頭面鼻亦受之不能為用是不聞香臭矣故經曰心肺有病鼻為之不利潔古曰視聽明而清涼香臭辨而溫暖者是也治法宜先散寒邪後補衛氣使心肺之氣得交通則鼻利而聞香臭矣麗澤通氣湯治鼻不聞香臭羌活獨活防風升麻葛根各二錢麻黃不去節一錢冬加之蒼朮三錢川椒一錢白芷黃耆各四錢甘草炙二錢上每服一兩水二盞生薑三片棗二枚蔥白三寸同煎至一盞去渣稍熱服食遠忌一切冷物及風寒涼處坐臥行住溫肺湯治鼻不聞香臭眼多眵淚升麻黃耆各二錢葛根羌活甘草炙防風各一錢麻黃四錢不去節丁香一分上粗末分二服每服水二大盞蔥白二握同煎一盞去渣稍熱食遠服禦寒湯治寒氣風邪傷於皮毛令人鼻塞咳嗽上喘黃耆一錢人參升麻陳皮各五分甘草炙款冬花黃柏各二分佛耳草黃連羌活白芷防風各二分蒼朮七分上㕮咀作一服水二大盞煎至一大盞去渣稍熱服食遠溫衛湯治鼻不聞香臭目中流火氣寒血熱淚多臍下冷陰汗足痿弱黃耆蒼朮升麻知母羌活柴胡歸身各一錢人參甘草炙白芷防風黃柏澤瀉各五分陳皮三錢青皮二錢木香黃連各三分上作一服水煎去渣溫服食遠日晴明服之溫衛補血湯治耳鳴鼻不聞香臭不知穀味氣不快四肢困倦行步不正發脫落食不下膝冷汗帶下喉中吤吤不得臥口舌液干太息頭不可以回顧額項筋緊急痛旋暈眼黑頭痛呵欠嚏噴升麻四分柴胡甘草生甘草炙地骨皮桔梗各三分生地白朮吳茱萸黃柏各一分蒼朮陳皮王瓜根牡丹皮各二分歸身二分半桃仁三個葵花七朵上㕮咀作一服水煎去渣稍熱食前服外治鼻塞不通小薊一把水二升煮一升去渣分服本草云小薊保精養血世噙化蓽澄茄丸治鼻不通蓽澄茄五分薄荷葉三錢荊芥穗一錢半上為細末煉蜜丸如櫻桃大每服一丸噙化本治鼻不聞香臭多年者亦治用生蔥分作三段早用蔥白午用蔥管中截晚換蔥管末梢一截塞入鼻中令透里方效無通草散治鼻齆氣息不通不聞香臭並鼻瘜肉木通細辛附子各等分上為末蜜和綿裹少許納鼻中世菖蒲散治鼻內窒塞不通不得喘息菖蒲皂角各等分上為末每用一錢綿裹塞鼻中仰臥少時玉鼻閉塞不聞香臭迎香一分沿皮向上瀉多補少忌灸上星三分集又法迎香上星合谷三處不愈灸人中風府百勞甲左窒刺右右窒刺左兩脅下痛泄上下出胸滿短氣不得汗補手太陽以出之鼻不利前谷主之鼻淵謂鼻出濁涕膽移熱於腦則辛頞鼻淵鼻淵者濁涕不止也傳為衄蔑瞑目全文見診病傳變又脈解精微論云泣涕者腦也故腦滲為涕羅鼻中諸病膽移熱於腦則辛頞鼻淵濁涕不止如湧泉不藏久而不已必成衄血之疾防風湯主之防風去蘆一兩半黃芩人參甘草炙川芎麥門冬去心各一兩上細末每服一錢沸湯點服食後服日三丹治鼻淵南星半夏蒼朮白芷神麯酒芩辛夷荊芥嘗治一中年男子右鼻管流濁涕有穢氣脈弦小右寸滑左手寸澀先灸上星三里合谷次以酒芩二兩蒼朮半夏各一兩辛夷細辛川芎白芷石膏人參葛根各半兩分七帖服之全愈此乃濕熱痰積之疾也仲肺中寒者吐濁涕無蒼耳散治鼻流濁涕不止名曰鼻淵辛夷仁半兩蒼耳子炒二錢半香白芷一兩薄荷葉五分上為末每服二錢用蔥茶清食後調服嚴云辛夷散治鼻內壅塞涕出不已或氣息不通或不聞香臭辛夷仁細辛去土葉藁本去蘆升麻川芎白芷木通去節防風甘草上為末每服二錢食後茶清調服運氣鼻淵皆屬熱經云少陰之復甚則入肺咳而鼻淵治以苦寒是也撮鼻流清涕濁涕上星灸二七壯清補濁瀉集又法上星人中風府不愈再取後穴百會風池風門大椎鼻流臭穢上星曲差灸之合谷不愈取後穴人中迎香鼻鼽謂鼻出清涕丹肥人鼻流清涕乃飲食痰積也蒼朮片芩南星川芎白芷辛夷甘草上或末或丸皆可白湯下本治鼻塞清涕出腦冷所致通草辛夷各半兩細辛甘遂桂心芎藭附子各一兩上細末蜜丸綿裹納鼻中密封勿令氣泄丸如麻子稍加大微覺少痛效搗姜為丸即愈無辛夷散治鼻塞腦冷清涕不已細辛川椒乾薑川芎吳茱萸辛夷附子各三分皂角屑半兩桂心一兩豬油六兩上煎豬脂成膏先一宿以苦酒浸前八味取入油煎附子黃色止以錦裹塞鼻孔中運氣鼻鼽有二一曰火攻肺虛鼻鼽經云少陰司天熱氣下臨肺氣上從鼽衄鼻窒又云少陰司天熱淫所勝民病鼽衄嚏嘔又云少陽司天火淫所勝甚則鼽衄又云少陽之復煩躁鼽嚏又云少陰司天客勝則鼽嚏又云歲金不及炎火乃行民病鼽嚏又云金不及曰從革從革之紀其病嚏咳鼽衄治以諸寒是也二曰金助肺實鼻鼽經云陽明所至為鼽嚏治以溫劑是也針灸鼻鼽獨取足太陽經云足太陽之別名曰飛陽去踝七寸別走少陰實則鼽窒頭背痛取之所別是也甲鼻鼽不利窒氣塞喎僻多涕鼽衄有癰迎香主之鼻鼽不得息不收涕不知香臭及衄不止水溝主之鼻瘜肉無羊肺散治肺虛壅鼻生瘜肉不聞香臭羊肺一具白朮四兩蓯蓉木通乾薑川芎各一兩俱為末上五味為細末以水量打稀稠得所灌肺中煮熟焙乾細研為末食後米飲服二錢世瘜肉因胃中有食積熱痰流注治本當消食積蝴蝶礬二錢細辛一錢白芷五分上為末以綿裹藥納鼻中頻頻換又方蝴蝶礬三分虢丹一分細辛一錢如此法塞鼻三因方單用枯礬末面脂用綿裹少許納鼻中數日瘜肉與藥消落上鼻中用此藥塞更以星半蒼朮酒芩連神麯辛夷細辛白芷甘草消痰積之藥服之為效也世辛夷膏治鼻生瘜肉窒塞不通有時疼痛辛夷葉二兩細辛木通木香白芷杏仁湯浸去皮尖研各半兩上用羊髓豬脂二兩和藥於石器內慢火熬成膏取赤黃色放冷入龍腦麝香各一錢為丸綿裹塞鼻中數日內脫落即愈此方有理羅輕黃散治鼻中瘜肉輕粉杏仁湯浸去皮尖及雙仁各一錢雄黃半兩麝香少許上四味用淨乳缽內先研杏仁如泥後入雄黃麝香同研極細勻瓷合蓋定每有患者不拘遠近夜臥用筋點粳米大在鼻中瘜肉上隔一日夜臥點一次半月見效世鼻中有瘜肉不聞香臭瓜蒂細辛等分為細末以綿包如豆許塞鼻中須臾即通有人患瘜肉垂出鼻外用此藥即化為黃水點滴至盡三四日愈聖惠方單用陳瓜蒂以羊脂和敷上日三次效本消鼻痔方瓜蒂炒甘遂各四錢白礬枯螺青炒草烏尖各五分炒上為末用真麻油搜令硬些子不可爛旋丸如鼻孔大用藥入鼻內令達痔肉上其痔化為水肉皆爛下每日一次用妙不可言又方取鼻痔苦丁香乃瓜蒂赤小豆丁香各十四個上慢火焙乾為末入腦子少許口內先含水次將小竹管吹藥入鼻中如半盞茶時盡為度候頭疼時取下上瓜蒂例取鼻痔芭豆十二粒去殼陽起石一錢石蓮心三十枚上為末每用半字許搐入鼻內又用綿塊子蘸藥塞入鼻中其痔肉化爛自出又方取鼻痔蠍梢一錢芭豆去油五粒丁香五粒白丁香七粒上為細末用螺青一字和勻用內消膏藥溶開入上件藥末搜丸如龍眼核大臨睡用一丸安鼻內上芭豆例世治久患鼻瘡膿極臭者用百草霜研細用冷水調服三錢東鼻中瘜肉鼽衄風池風門風府人中禾窌甲鼻中瘜肉不利鼻額頞中痛鼻中有蝕瘡斷交主之鼽衄涕出中有懸癰瘜肉內窒不通不知香臭素窌主之鼻窒口僻清涕出不可止鼽衄有癰禾窌主之酒齄鼻羅鉛紅散治風熱上攻陽明經絡面鼻紫赤刺癮疹俗呼肺風以肺病在皮膚也硫黃白礬灰各五錢上細末入黃丹少許染與病人面色同每上五分津液塗之洗漱罷及臨臥再上兼煎升麻湯下瀉青丸服之除其本也升麻湯方見小兒痘瀉青丸方見治虛實本治肺風鼻赤皶用老山楂為末溶黃蠟等分和丸彈子大空心茶酒嚼下半月效忌酒炙爆簡治赤鼻枇杷葉一兩去毛陰乾新者佳梔子半兩上為末每服二三錢溫酒調下早晨服先去左邊臨臥服去右邊效若神衍治酒皶風鼻上赤將橘核微炒為末每用二錢匕研胡桃肉一個同以溫酒調服以知為度圖經云胡桃性熱海云治酒皶鼻用山茱萸暖腰膝助水臟除一切風逐一切氣破瘕治酒皶鼻片腦些硫黃明淨者五分枇杷葉一錢上用豬臟去頭段一尺用第二段一尺割下臟上脂煎成油調和前藥末入生臟內兩頭縛定掛當風處七日用時將小針於臟上針孔捏出藥少許用手敷患處十日內全愈無粉黃膏治肺熱赤瘰俗曰酒皶硫黃一分為末蘿蔔切去蓋剜作穴子入硫黃在內以竹針蓋定安正入糠火煨一宿取出細研輕粉烏頭尖各少許為末上研勻以面油調臥時敷早晚洗去以酥調尤佳治酒皶鼻用乳香硫黃細辛輕粉等分為末水調敷檳榔散治鼻頭赤檳榔硫黃各等分片腦少許上為細末用粗絹帛包裹時時於鼻上搽磨鼻聞其臭效又加蓖麻子肉為末酥油調臨睡時少許搽鼻上使終夜得聞效丹治酒皶以桐油入黃連末天釣藤燒灰敷之甲鼻管疽發為病腦空主之無鼻頭微白亡血也赤者血熱也酒客多有之鼻得冷則黑丹面鼻得冷則黑論諸陽聚於頭則面為陽中之陽鼻居面中央而陽明起於頞中一身之血運到面鼻陽部皆為至清至精之氣矣酒性善行而喜升大熱而有峻急之毒多酒之人酒氣熏蒸面鼻血得酒為極熱熱血得冷為陰氣所搏汙濁凝結滯而不行宜其先為紫而後為黑色也須用融化滯血使得流通滋生新血可以運化病乃可愈予嘗以酒製四物湯加酒炒片芩陳皮生甘草酒紅花生薑煎調下五靈脂末飲之氣弱形肥者加酒黃耆無有不應入好酒數滴為引使肩背痛肩背痛屬肺分野病經云西風生於秋病在肺腧在肩背故秋氣者病在肩背又云秋肺太過為病在外則令人逆氣背痛慍慍然是也垣脈經云風寒汗出肩背痛中風小便數而欠者風熱乘其肺使肺氣鬱甚也當瀉風熱以通氣防風湯主之柴胡升麻黃耆各一錢防風羌活陳皮人參甘草各五分藁本青皮各三分黃柏一分白蔻仁二分上㕮咀作一服水煎溫服食後氣盛者宜服面白脫色氣短者勿服肩背痛不可回顧此手太陽氣鬱而不行以風藥散之丹治一男子忽患背胛縫有一線痛起上肩跨至胸前側脅而止其痛晝夜不歇不可忍診其脈弦而數重取豁大左大於右予意背胛小腸經也此必思慮傷心心臟未病而腑小腸先病故痛從背胛起及慮不能決又歸之膽故痛至胸脅而止乃小腸火乘膽木子來乘母是為實邪詢之果因謀事不遂而病故用人參四分木通二分煎湯使吞龍膽丸數服而愈二陽一陰發病主驚駭背痛善噫全文見診病傳變運氣肩背痛皆屬火攻肺病經云歲火太過民病肩背熱又云少陰司天熱淫所勝病肩背臑缺盆中痛又云歲金不及其病內舍膺脅肩背外在皮毛治以寒劑是也針灸肩背有二法其一取肺經云肺病者喘咳逆氣肩背痛汗出取其經太陰足太陽之外厥陰內血者又云肺手太陰之脈氣盛有餘則肩背痛風寒汗出氣虛則肩背痛寒少氣不足以息視盛虛熱寒陷下取之是也其二取腎經云邪在腎則病肩背頸項痛時眩取之湧泉崑崙視有血者盡取之是也玉肩背痛連胛胛縫在背踹骨下直腋縫尖及臂取二寸半瀉六吸五樞二寸半瀉八吸世肩背胛痛崑崙懸鐘肩井東肩背頸項腋前痛與胸相引者湧泉一分見血妙前腋刺面上一寸又法氣舍五分天窌灸曲池一寸半天井五分甲肩背痹痛不舉血瘀肩中不能動搖巨骨主之肩背不可自帶衣臂腕外側痛不舉陽谷主之肩背欲折臑如拔手不能自上下養老主之項背痛引頸魄戶主之肩痛胸滿淒厥脊背急強神堂主之肩背髀痛臂不舉寒熱淒索肩井主之通玄肩背痛手三里主之素寸口脈中手促上擊者曰肩背痛平人氣象論肩痛針灸肩痛有三法其一取手陽明經云大腸手陽明之脈所生病者肩前臑痛視盛虛熱寒陷下取之也其二取手太陽經云小腸手太陽之脈是動則病肩似拔臑似折視盛虛熱寒陷下取之也其三取筋經云手太陽之筋病繞肩胛引頸而痛應耳中鳴痛手陽明足太陽之筋皆病肩不舉皆治在燔針劫刺以知為數以痛為腧也東肩不可動臂不可舉肩髃二寸半巨骨五分清泠淵一寸關衝五分玉肩端腫肩髃二寸半瀉九吸腕骨七分先瀉後補兩胛痛肩井二寸半不宜久停針支溝甲肩腫不能顧氣舍主之肩中熱指臂痛肩髃主之肩肘中痛難屈伸手不可舉腕重急曲池主之肩肘節酸重臂痛不可屈伸肘窌主之肩痛不能自舉汗不出頭痛陽池主之肩重肘臂痛不可舉天宗主之肩胛周痹曲垣主之肩胛中痛而寒至肘肩外腧主之肩膊閉急淒厥惡寒魄戶主之肩痛不可舉天窌秉風主之肩重不舉臂痛肩窌主之肩不可舉不能帶衣清泠淵主之肩痛不可舉引缺盆雲門主之皮膚素黃帝問曰余聞皮有分部脈有經紀筋有結絡骨有度量其所生病各異別其分部左右上下陰陽所在病之始終願聞其道岐伯對曰欲知皮部以經脈為記者諸經皆然陽明之陽名曰害蜚上下同法視其部中有浮絡者皆陽明之絡也其色多青則痛多黑則痹黃赤則熱多白則寒五色皆見則寒熱也絡盛則入客於經陽主外陰主內少陽之陽名曰樞持上下同法視其部中有浮絡者皆少陽之絡也絡盛則入客於經故在陽者主內在陰者主出以滲於內諸經皆然太陽之陽名曰關樞上下同法視其部中有浮絡者皆太陽之絡也絡盛則入客於經少陰之陰名曰樞儒上下同法視其部中有浮絡者皆少陰之絡也絡盛則入客於經其入經也從陽部注於經其出者從陰內注於骨心主之陰名曰害肩上下同法視其部中有浮絡者皆心主之絡也絡盛則入客於經太陰之陰名曰關蟄上下同法視其部中有浮絡者皆大陰之絡也絡盛則入客於經凡十二經絡脈者皮之部也是故百病之始生也必先於皮毛邪中之則腠理開開則入客於絡脈留而不去傳入於經留而不去傳入於腑廩於腸胃邪之始入於皮也泝然起毫毛開腠理其入於絡也則絡脈盛色變其入客於經也則感虛乃陷下其留於筋骨之間寒多則筋攣骨痛熱多則筋弛骨消肉爍㿉破毛直而敗帝曰夫子言之皮之十二部其生病皆何如岐伯曰皮者脈之部也邪客於皮則腠理開開則邪入客於絡脈絡脈滿則注於經脈經脈滿則入舍於腑臟也故皮者有分部不與而生大病也帝曰善皮部論皮膚屬肺經云肺之合皮也其榮毛也又云肺主皮毛在臟為肺在體為皮毛是也毛折爪枯為手太陰絕經云手太陰者行氣溫於皮毛者也氣不榮則皮毛焦皮毛焦則津液去皮絕者津液既去則爪枯毛折毛折者毛先死皮膚痛皮膚痛屬心實經云夏脈者心也夏脈太過則病身熱膚痛為浸淫運氣皮膚痛皆屬火邪傷肺經云少陰在泉熱淫所勝病寒熱皮膚痛又云少陰司天火淫所勝熱上皮膚痛又云少陰之復咳皮膚痛治以諸寒是也針灸皮膚痛取肺經云邪在肺則病皮膚痛寒熱上氣喘汗出咳動肩背取之膺中外腧背三節五椎之傍以手疾按之快然乃刺之取之缺盆中以越之是也甲身腫皮膚痛不可近衣淫濼苛獲久則不仁屏翳主之皮膚索澤皮膚索澤即仲景所謂皮膚甲錯蓋皮膚澀而不滑澤者是也仲五勞虛極羸瘦腹滿不能飲食食傷憂傷飲傷房室傷飢傷勞傷經絡榮衛傷內有乾血肌膚甲錯兩目黯黑緩中補虛大黃虻蟲丸主之方見勞條三陽為病發寒熱其傳為索澤全文見診病傳變索盡也王氏云精血枯涸故皮膚潤澤之氣皆盡也仲咳有微熱煩滿胸中甲錯是為肺癰葦莖湯主之方見肺癰門運氣皮膚索澤屬燥傷膽氣經云陽明在泉燥淫所勝病體無膏澤治以苦寒是也針灸皮膚索澤取足少陽經云足少陽之脈是動則病體無膏澤視盛虛熱寒陷下取之也尺膚粗如枯魚之鱗者水泆飲也全文見診法喑喑者邪入陰部也經云邪搏陰則為喑又云邪入於陰搏則為喑然有二症一曰舌喑乃中風舌不轉運之類是也一曰喉喑乃勞嗽失音之類是也蓋舌喑但舌本不能轉運言語而喉咽音聲則如故也喉喑但喉中聲嘶而舌本則能轉運言語也舌喑丹一男子年三十五歲因連日勞倦發啖發為瘧疾醫與瘧藥三發後變為發熱舌短言語不辨喉間痰吼有聲診其脈洪數似滑遂以獨參湯加竹瀝兩蚶殼許兩服後吐膏痰三塊舌本正而言可辨餘證未退遂煎人參黃耆湯服半月而諸證皆退粥食調補兩月方能起立人舌短言語不辨乃痰涎閉塞舌本之脈而然嘗治一中年男子傷寒身熱師與傷寒藥五帖日後變神昏而喑遂作體虛有痰治之人參五錢黃耆白朮當歸陳皮各一錢煎湯入竹瀝薑汁飲之十二日其舌始能語得一字又服之半月舌漸能轉運言語熱除而痊蓋足少陰脈挾舌本脾足太陰之脈連舌本手少陰別系舌本故此三脈虛則痰涎乘虛閉塞其脈道而舌不能轉運言語也若此三脈亡血則舌無血營養而喑經云刺足少陰脈重虛出血為舌難以言又云刺舌下中脈太過血出不止為喑治當以前方加補血藥也又嘗治一男子五十餘歲嗜酒吐血桶許後不食舌不能語但渴飲水脈略數與歸芎芍地各一兩朮參各二兩陳皮一兩半甘草二錢入竹瀝童便薑汁至二十餘帖能言若此三脈風熱中之則其脈弛縱故舌亦弛縱不能轉運而喑風寒客之則其脈縮急故舌強舌卷而喑治在中風半身不收求之也針灸喑有二治其一取脾經云脾足太陰之脈是動則病舌本強視盛虛熱寒陷下取之也其二取心經云手太陰之別名曰通里去腕一寸五分別而上行入於心中系舌本虛則不能言取之掌後一寸是也心脈澀甚為喑全文見虛實法素心脈搏堅而長當病舌卷不能言脈要精微論喉喑丹俞繼道遺精誤服參耆及升浮劑遂氣壅於上焦而喑聲不出用童便浸香附為末調服而疏通上焦以治喑又用蛤粉青黛為君黃柏知母香附佐之為丸而填補下焦以治遺十餘日良愈本草言童便主久嗽失音故治喑多用童便由童便能降火故也出聲音方訶子炮去核木通各一兩甘草半兩用水三升煎至升半入生薑地黃汁一合再煎數沸放溫分六服食後日作半料訶子治逆氣破結氣木通通利九竅治肺癰甚當河訶子湯治失音不能言語訶子四個半生半炮桔梗一兩半生半炙甘草二寸半炙半生上為細末每服二錢童便一盞水一盞煎五七沸溫服甚者不過三服愈桔梗通利肺氣訶子泄肺導氣童便降火甚速一方桔梗三兩大訶子四個甘草二兩炮製皆同每服一錢匕入砂糖一小塊不入童便獨用水五盞煎至三盞時時細呷一日服盡其效甚速海發聲散治咽喉語聲不出栝蔞皮銼白殭蠶去頭甘草各等分俱各炒黃上細末每三錢溫酒調下或生薑自然汁調下用五分綿裹噙化咽津亦得不拘時候日兩三服肘治卒失音咽不出陳皮五兩水三升煮取一升去渣頓服羅玉粉丸治冬月寒痰結咽喉不利語聲不出半夏洗五次草烏一字炒桂一字上為細末生薑汁浸餅為丸如雞豆大每服一丸至夜含化多年不愈亦有效黃帝針經中說寒氣客於會厭卒然而啞此藥主之丹蛤蚧丸治肺間邪氣胸中積血作痛失音並治久咳失音蛤蚧一對去嘴足溫水浸去膜颳了血脈用好醋炙訶子煨去核阿膠炒生地麥門冬去心北細辛去苗甘草炙各半兩上為末煉蜜丸如棗大每服一丸含化食後千治暴嗽失音語不出方杏仁研如泥薑汁砂糖白蜜各一升五味紫菀各三兩通草貝母各四兩桑白皮五兩上㕮咀以水九升煮五味紫菀通草貝母桑白皮取三升去渣納杏仁泥薑汁蜜糖和攪微火煎取四升初服三合日再夜一後稍加通聲膏方五味款冬花通草各三兩人參細辛桂心青竹皮菖蒲各二兩杏仁一升白蜜二斤棗膏薑汁一升酥五升上㕮咀以水五升微火煎三上三下去渣納薑汁棗膏酥蜜煎令調和酒服如棗大二丸丹咳嗽聲嘶者此血虛受熱也用青黛蛤粉蜜調服之世失音槐花瓦上炒令香熟於地上出火毒三更後床上仰臥隨意服亦治咯血千風寒之氣客於中滯而不發故喑不能言盂人患卒啞杏仁三分去皮尖熬另研桂一分如泥和取杏核大綿裹含細細嚥之日五夜三丹治失音以桂末著舌下咽津妙千金斗門食忌聖惠方同治風冷失音以紫梗荊芥根一兩研汁入酒相和溫飲半盞服無時聖惠方聖治風冷失音咽喉不利以蘘荷根二兩絞汁酒一大盞相和令勻不計時候溫服半鍾孫內侍曹都使新造一宅落成遷入經半月飲酒大醉臥起失音不能語召孫至診曰因新宅故得此疾耳半月當愈但服補心氣薯蕷丸治濕用細辛川芎又十日其病漸減二十日全愈曹既安見上問誰醫曰孫兆郎中上乃召問曰曹何疾也對曰凡新宅壁土皆濕地亦陰多人乍來陰氣未散曹心氣素虛飲酒至醉毛竅皆開陰濕之氣從而入乘心經心經既虛而濕氣又乘之所以不能語臣先用薯蕷丸使心氣壯然後以川芎細辛又去濕氣所以能語也運氣喑有二一曰熱助心實經云少陰之復暴喑治以苦寒是也二曰寒攻心虛經云歲火不及寒乃大行民病暴喑治以鹹溫是也狐惑聲啞其證默默欲眠目不能閉起居不安是也治法見傷寒靈黃帝問於少師曰人之卒然憂恚而言無音者何道之塞何氣出行使音不彰願聞其方少師答曰咽喉者水穀之道也喉嚨者氣之所以上下者也會厭者聲音之戶也口唇者音聲之扇也舌者音聲之機也懸雍垂者音聲之關也頏顙者分氣之所泄也橫骨者神氣所使主發舌者也故人之鼻洞涕出不收者頏顙不開分氣失也是故厭小而疾薄則發氣疾其開闔利其出氣易其厭大而厚則開闔難其氣出遲故重言也人卒然無音者寒氣客於厭則厭不能發發不能下至其開闔不致故無音黃帝曰刺之奈何岐伯曰足之少陰上繫於舌絡於橫骨終於會厭兩瀉其血脈濁氣乃闢會厭之脈上絡任脈取之天突其厭乃發也夏恚無言篇厥氣走喉而不能言手足清大便不利取足少陰雜病篇厥氣者逆氣也足少陰脈循喉嚨又挾舌本故取之針灸喑有三法其一取足少陰上二段經文是也其二取足陽明經云足陽明之別名曰豐隆去踝八寸別走太陰下絡喉嗌其病氣逆則喉痹卒喑取之所別是也予治一男子四十九歲久病痰嗽忽一日感風寒食酒肉遂厥氣走喉病暴喑與灸足陽明豐隆二穴各三壯足少陰照海穴各一壯其聲立出信哉聖經之言也仍用黃芩降火為君杏仁陳皮桔梗瀉厥氣為臣訶子泄逆甘草和元氣為佐服之良愈其三取手陽明經云暴喑氣哽取扶突與舌本出血舌本廉泉穴也甲喑不能言合谷及湧泉陽交主之桑卒暴失音神門湧泉甲食飲善嘔不能言通谷主之暴喑氣哽喉痹咽痛不得息飲食不下天鼎主之喑不能言期門主之暴喑不能言支溝主之胎前產後喑素黃帝曰人有重身九月而喑此為何也岐伯對曰胞之絡脈絕也帝曰何以言之岐伯曰胞絡者繫於腎少陰之脈貫腎系舌本故不能言帝曰治之奈何岐伯曰無治也當十月復王注云少陰腎脈也氣不榮養故不能言郭氏論產後不語者何答曰人心有七孔三毛產後虛弱多致停積敗血閉於心竅神志不能明瞭心氣通於舌心氣閉塞則舌亦強矣故令不語但服七珍散人參石菖蒲生地川芎各一兩細辛防風辰砂另研各半兩上為細末每服一錢薄荷湯調下不拘時胡氏孤鳳丹散治產後閉目不語用白礬細研每服一錢熱水調下脫肛丹脫肛氣虛者補氣參耆川芎升麻血虛者四物升麻氣熱者條芩六兩升麻一兩為末神麯為丸服之血熱者涼血四物加黃柏百一治脫肛以槐花槐角各等分炒黃為末用羊血蘸藥炙熱食之酒下世治脫肛槐花荊芥穗白連等分白連恐是白蘞上為細末空心酒下便入無蝟皮散治肛門或因洞泄或因用力脫出不收蝟皮一個燒存性磁石半兩煅碎桂心半兩上為末飲服方寸匕忌舉重及房室肘後治女人陰脫加鱉頭一枚燒灰研入丹大腸頭出痛苦干又落落又出名截腸病腸盡則死初出寸余時治之以芝麻油一盞以臀坐之飲大麻子汁數升愈無五倍子為末每三錢水二碗煎減半入白礬一塊安小桶內洗之立效世治男女脫肛用五倍荊芥小便濃煎洗之本治腸風及脫肛不收有血下用皂角三莖槌碎水一碗揉令皂角消盡用絹二重濾取清汁數分將脫肛腸浸在藥水中其腸自收不用手托如大腸收了更用湯蕩其脫肛上下令皂角氣行則不再作三次蕩愈集治脫肛歷年不愈以生鐵三斤水一斗煮取五升出鐵以汁洗日再一方用磨刀漿鏽水洗亦效肘若腸隨脫肛出轉久不可收入搗生栝蔞汁浸之豬肉汁中洗手隨按之令暖自得入世又方亦治脫肛荊芥龍腦薄荷朴硝上煎湯朝朝洗之腸頭自入無香荊散治脫肛香附末荊芥穗等分上為末每用三匙水一大碗煎熱淋洗針粉散治脫肛歷年不愈針粉研細每用少許摻之按入即愈本治腸風並脫肛及有血用蛇床子不拘多少炒為末貼大腸脫垂處立收甚妙無用木賊不以多少燒存性為細末摻肛門上按之乘閒方治瀉多時脫肛疼痛黑聖散用大蜘蛛一個葉重裹線系定合子內燒令黑色存性取出細研入黃丹少許同研凡有上件疾即先用白礬蔥椒湯洗拭乾後將藥末摻在軟處將手掌按托入收之妙聖治大腸久積虛冷大便脫肛收不得蝸牛一兩燒灰豬脂和敷之千治脫肛歷年不愈鱉頭一枚燒令煙絕杵末日敷肛上手按挼之丹治脫肛用胡荽燒熏立入海治諸般痔脫肛以死蛇一條如指大濕者用掘地坑燒之將有孔板蓋坑上坐熏之煙絕為愈大效世腸頭出用皂角熏次用蜒蚰一個入蜜浸去蜒蚰將蜜調土朱敷上即入一女子脫肛醫用糯米一勺濃煎飲去米候洗肛溫柔卻先以磚一片燒火通紅用醋沃濕以青布鋪磚上坐肛於青布上如熱則加布令厚其肛自吸入腹中而愈紫蕺膏治臟熱肛門脫出以紫背蕺一大握又名魚腥草擂爛如泥先用朴硝水洗淨肛門用芭蕉葉托入卻用藥於臀下貼坐自然收入集治脫肛大腸腧百會長強扁鵲脫肛百會肩井摘又法百會針二分灸七壯至十七壯世脫肛合谷甲脫肛刺氣衝主之穀道痛蝕肘治穀道赤痛熬杏仁杵作膏敷之良愈外治下部蟲齧杵桃葉一斛蒸之令極熱納小口器中以下部榻上坐蟲立死脈䘌蝕陰脫其脈虛小者生緊急死痔仲小腸有熱者必痔垣秦艽蒼朮湯治痔疾若破謂之痔漏大便秘澀必作大痛此由風熱乘食飽不通氣逼大腸而作也受病者燥氣也為病者胃濕也胃刑大腸則化燥火以乘燥熱之實勝風附熱而來是濕熱風燥四氣相合故大腸頭成塊者濕也作大痛者風也若大便燥結者主病兼受火邪也熱結不通去燥屎者其西方肺主諸氣其體收下亦助疾病為邪須當破氣藥兼之治法全矣服之其疾立愈不可作丸以銼湯與之效如神速秦艽一錢去蘆澤瀉三分蒼朮七分制防風根五分桃仁去皮一錢另研歸根三分酒洗第二服藥用身黃柏去皮酒洗五分大黃少許雖大便秘澀亦不可多用檳榔一錢細末調服之皂角仁燒存性去皮一錢搗細末調下服之上除檳榔桃仁皂角仁三味候煎成藥研勻調入外余㕮咀作一服水三盞煎至一盞二分去渣入前三味再上火煎至一盞空心熱服待少時以美膳壓之不犯胃氣也服藥日忌生冷硬物及酒面大料物乾姜之類犯之則藥無效如有白膿加五朵白葵花須除萼去心細剪入青皮五分不去白入上藥同煎又用木香三分為細末同檳榔等三味再上火同煎依上法服餌古人以此疾多以歲月除之此藥一服立愈若病久者再服必愈秦艽白朮丸秦艽去蘆歸梢酒洗桃仁酒浸去皮尖另研各一兩地榆三錢枳實麩炒白朮澤瀉皂角仁燒存性去皮各半兩上為細末和桃仁泥研勻煎熱沸湯麵糊丸雞豆大焙乾白湯下空心宿食消盡服之少時以美膳壓忌生冷硬物冷水冷菜之類並濕面酒及五辣辛熱大料物之類犯之則藥無驗十服必愈潔蒼朮澤瀉丸蒼朮四兩去皮澤瀉枳實秦艽各二兩地榆皂角子燒存性各一兩上為細末燒餅為丸如桐子大每服三十丸米飲湯或酒下白朮丸藥味與蒼朮澤瀉丸同只改蒼朮為白朮去秦艽丹痔漏專一涼血為主人參黃連生地涼血當歸和血川芎和血槐角涼生血條芩涼大腸枳殼寬腸升麻提起上煎湯服之外以澀藥爐甘石童便煅牡蠣粉龍骨海蛤密陀僧之類敷之許孺人產後痔作瘡有頭如蒜頭大或下鮮血或紫血大便疼與黑神散又多食肉大飽此濕熱在大腸所為郁李仁去皮麻仁槐角各七錢枳實皂角仁五錢為末蒼朮歸尾生地各三錢大黃炒一錢上分六帖納三樣仁另研煎服經患五種痔水研山豆根服味甘寒退血熱本又方治痔用雞冠花不拘多少濃煎湯每服一盞空心服本草云雞冠花性涼治瀉血丹痔頭向上是大腸熱甚收縮為主用四物解毒加枳殼白朮槐角秦艽治翻花痔荊芥防風朴硝上煎湯洗之次用木鱉子鬱金研末龍腦些少水調塗上世治翻花痔用信一錢蜈蚣數個以香油久浸之臨臥時先洗痔拭乾卻取浸油敷患處用手按入立愈累效其餘痔皆妙痔藥膏子治外痔翻花脫出黃水不止腫痛並用銀闊篦蘸藥塗敷日一次重者五七次立愈先用藥水洗拭乾卻敷此膏用真桑灰不拘多少淋濃汁兩碗熬至一碗卻入草烏片大黃片各二錢再慢火熬至半碗入甘草一錢數沸下淨細石灰半匙頭不可多略沸三五次用絹一重花紙二重如絞漆狀濾過再熬成膏候冷用真膽礬五分研極細末放入膏中用瓦器盛貯封之臨用入龍腦末和勻敷之千治風痔漏不問有頭無頭定三日安藜蘆燒灰天麻各五錢乾薑半兩皂角針不用皮條炒二錢蓮子草明礬硫黃各一兩大苦栝蔞一個麝香五分上將栝蔞開一孔入礬並硫黃在內孔如小錢大就將元掩合定綿紙糊卻用瓦罐子盛坐瓶上炭火煅令煙盡為度候冷取出研細同前六味藥末和令勻煉蜜丸桐子大每服十丸至十五丸空心溫酒下日三服三日見效忌油麵醃藏牛馬肉魚腥生冷行房行遠勞力一切等事治腸痔鱉甲丸鱉甲蝟皮炙焦黑穿山甲炙焦白礬枯附子豬牙皂角各半兩炙焦存性二分上細末研勻蒸餅丸如桐子大米飲下二十丸食前日三服又方槐花炒白礬枯各一兩附子五錢上細末研勻蒸餅丸如桐子大每服二十丸米飲下食前日三服以上二方龐老傳治腸風痔漏赤芍藥官桂去皮甘草炙各等分上㕮咀每服二錢姜二片白糖一塊水一盞同煎七分去渣空心服素因而飽食筋脈橫解腸澼為痔生氣通天論潔黑地黃丸治血虛久痔神妙治痔之聖藥也方見勞瘵世治痔方神妙當歸川芎黃連全蠍三稜蓬朮羌活獨活山茱萸去核各半兩枳殼十二兩去穰商陸白者一兩巴豆去殼不拘數木香甘草節鼠黏子炒苦參藁本柴胡各一兩刺蝟皮炒豬牙皂魚去皮弦各一兩一方加白朮半夏荊芥薄荷檳榔各一兩上將巴豆二粒或三粒入枳殼內線扎定卻用醋煮爛訖冷水洗淨去巴豆不用曬焙乾入前藥同為細末煮醋麵糊為丸桐子大每服三四十丸空心醋湯下更用五倍子羌活獨活煎湯洗如大便燥結用煮過巴豆六七粒加入前藥同丸上一方疏風泄熱破積滯其效如神集治五痔不以年月日久新枳實為末煉蜜丸桐子大空心飲下二十丸丹二三十年不愈者三服止用蓮花蕊散蓮花蕊黑牽牛頭末各一兩半當歸半兩礬紅少許上為末先忌食肉五七日空心令食肉一頓就取溫酒下三錢約兩時辰取下膿血或蟲是效海藏外臺治五十歲痔不瘥塗熊膽取瘥神效諸方不及此垣七聖散丸治大腸疼痛不可忍王叔和云積氣生於脾臟傍大腸疼痛陣難當漸交稍瀉三焦是莫漫多方立紀綱羌活一兩檳榔木香川芎桂枝去皮各半兩大黃八分煨郁李仁去皮另研一兩半上除郁李仁另研外為細末煉蜜丸桐子大驗虛實臨時斟酌丸數白湯下取大便微利一服而愈切禁不得多利大便若大便大行其病滋甚秦艽防風湯治痔漏大便時時發疼痛非痔漏也此藥主之奏艽防風白朮各一錢半歸身一錢黃柏五分陳皮紅花少甘草炙升麻各六分柴胡二分桃仁三十個大黃三分煨澤瀉上銼如麻豆大總作一服水三盞煎一盞去渣稍熱服空心宿食消盡服之避風寒忌房事酒濕面大辛熱物當風寒處大便本治痔有鼠結核作渴疼痛方皂角酥炙黃耆荊芥槐子穿山甲木香蝟皮桔梗鱉甲醋炒露蜂房炒焦芍藥各一兩大黃五錢上為末煉蜜丸桐子大每服三十丸溫酒下食前日三服未知加至四五十丸治痔下腫痛枳殼一兩陳粟米同炒令黃赤米不用青木香一分上為末每服二錢飯飲調下集治痔疾下血疼痛不止以玩月沙不限多少慢火熬令黃色為末每二錢入乳香五分空心溫酒調下日三四服瘥即兔子糞是也外治痔發疼痛貍肉作羹食之良作脯食不過三頓瘥世治痔瘡痛不可忍者木棉花煎湯旋入朴硝乘熱熏之候溫浸之單用硝水極妙曾用大有效本治痔痛大蜈蚣一條大青州棗三個白礬一塊如棗大上將蜈蚣白礬二味為末用棗肉丸分作二丸燒煙用竹筒透引煙燻妙垣秦艽羌活湯治痔漏成塊下垂疙瘩不任其癢升麻根柴胡甘草炙麻黃根各五分黃耆秦艽各一錢防風根七分藁本三分細辛少羌活根一錢三分上銼如麻豆大作一服水二大盞煎一盞去渣空心宿食消盡服之忌如前梅治痔有蟲咬穀道癢或下膿血多取槐白皮濃煎汁安盆中坐熏之塞其穀道湯冷更暖之良久欲大便當蟲出不過三度即愈如用末綿裹納下部丹治痔穀道中蟲癢不止水銀棗膏各二兩研勻捏如棗形薄綿裹納之明日蟲出若痛者加粉草三大分作丸梅師方羅淋渫藥治下部痔腫大腸頭癢痛威靈仙枳殼麩炒各一兩上為粗末熬水熏洗冷即再暖臨臥避風洗三次挹干貼蒲黃散世治痔癢用五茄莖葉濃煎湯以瓶盛之坐瓶口上熏痔至湯溫洗之三次必效丹腸風痔漏有蟲如絲細黑頭取去除根瞿麥半升豬牙皂角一寸上為末入豬腰子一雙內用米泔煮空心食之少頃肚痛上攻蟲皆隨出作地坑埋之薄粥補之垣當歸郁李仁湯治痔漏大便硬努出大腸頭下垂多血苦疼不能忍皂角仁另為細末調服郁李仁秦艽各一錢麻子仁一錢半當歸梢生地蒼朮各五分澤瀉三分枳實七分大黃三錢煨上除皂角仁研細末余藥銼如麻豆大水三大盞煎一盞去渣入皂角末調在內空心食前候宿食消盡服之忌風寒處大小便丹如欲涼大腸寬大腸則用枳殼去穰入巴豆鐵線纏煮透去巴豆入藥用若丸藥則搗爛用煎藥則乾用食治野雞痔下血腸風明目方嫩槐葉一升蒸如茶法取葉碾作末亦如茶法煎呷之千治腸痔每大便下血槐樹上木耳取末之飲服方寸瘥日三服良肘治腸痔每大便常血水服蒲黃方寸匕瘥日三服良食主五痔下血不止杏仁去皮尖及雙仁水一升研濾取汁煎減半投米煮粥停冷空心食之草治腸痔多年不瘥下血不止木賊枳殼各二兩乾薑一兩大黃一分四味並銼一處入銚子內炒黑色存三分性搗羅溫粟米飲調食前服二錢匕甚妙外治患腸痔大便常有血食鯽魚羹及隨意任作飽食孫真人同本治腸痔在腹內有鼠奶下血方白蕪荑椿樹東行根狼牙根貫眾蝟皮炙焦雄黃半兩白鱔頭一個炙焦槐東引根白皮一分上細末臘月豬脂和一丸彈子大綿裹納下部丹痔漏腸漏竅用赤石脂白石脂枯礬黃丹腦子塞之本治腸風痔漏用鯽魚一個破開去腸入白礬令滿合之瓦上燒過為細末用雞毛卷藥敷之立效治痔漏瘡方雞子一個煮熟去黃取白切炒白礬明者如皂角子大匙上枯過用三分上為末先用溫湯洗淨拭乾用紙捻點藥送入瘡孔內立效日三易上治痔漏下血如血虛必兼服黑地黃丸乃妙衍鱗鯉甲燒一兩存性肉豆蔻仁三個同為末米飲調二錢服治氣痔膿血甚者刺蝟皮一兩燒服中病即已不必盡劑運氣痔發皆屬寒經云太陽之勝痔瘧發治以苦熱是也世治痔神應散治五種腸風下血上廁糞前有血名外痔糞後有血名內痔大腸不收名脫肛穀道四面有胬肉名奶痔痔頭上有孔漏出名腸風並治之黃牛角䚡一枚酌中者槌碎蛇蛻皮一條白者豬牙皂角七莖穿山甲七片刺蝟皮一兩銼上五味細銼入甕瓶內以黃泥封固候乾先用小火燒令煙出後用大火煅令通赤為度取出攤開候冷搗羅為末服時先令患者臨臥時細嚼胡桃仁一個如糊用無灰好酒一盞送下不可言語便睡至五更時以溫酒調下藥末三錢至辰時更進一服雖久年不過三服立效丹治腸風痔漏如神大樹木上寄生葉取干為末酒水米飲任下或丸桐子大服三十丸亦得千治五痔方蒼耳莖葉以五月五日採干為末水服方寸或丸桐子大服之立效洗痔疼用荊芥朴硝桑寄生定痛解毒去風涼大腸熱安胎如腫者加五倍子木鱉子研細調敷又方五倍朴硝桑寄生蓮房水煎先熏後洗一方加百藥煎洗保淋洗法天仙子荊芥穗小椒蔓荊子上水煎湯洗本熏洗痔方用枳殼不拘多少為末每用二錢水一盞砂瓶內煎令沸先去瓶嘴上坐熏後卻瀉出通手熱洗妙此方久痔亦妙除根世洗痔方輕者用朝東馬齒莧劉寄奴濃煎湯熏待溫卻用手洗拭乾重者加大青葉梗乾者一半同煎丹痔庠用灰莧帶根濃煎湯先熏後洗又方取河水頻洗用蝸牛塗之經痔漏用犍牛兒膽蝟膽各一個膩粉五十文麝香二十文將蝟膽汁膩粉麝香和勻入牛膽內懸於簷前四十九日熟旋取為丸如大菱角急送入瘡內後追出惡物日三驗候瘡口漸合用生面蓋瘡內一遍出惡物妙丹一方治痔用雄雞膽片腦和勻貼之一方熊膽塗之神效世治痔用活蜈蚣一條以香油一小罐浸之陳愈妙敷之累驗無貼痔法蜀葵子半兩蟬蛻五個檳榔一個併為末上用棗三枚取肉研細搜和藥末如覺硬滴少蜜研成膏量大小貼於病處羅蒲黃散治下部痔漏蒲黃血竭半兩上為細末每用少許貼於患處斗門治痔疾有頭如雞冠者用黃連末敷之即瘥更加赤小豆末尤良一方用黃連木香末敷妙無熏痔法蝟皮切方三指大雄黃棗大研熟艾雞子大上為末用瓦器以灰實一半如燒香法安長桶內坐其上熏之煙氣從口出為佳凡三度熏永瘥勿犯風冷忌雞肉毒物本熏痔方用鼠郎皮一味瓶內燒煙坐身於瓶上熏三五次除根世痔方赤腳蜈蚣一條香油煎酥紙上挹干加乳香二錢沒藥二錢麝香粉霜各五分人指甲五錢泥裹煨乾脆為末用鵝毛管盛藥吹上如有水即時出盡不疼其物結一硬丁用線系在上揭落之羅治痔神效雄黃硫黃明礬各等分上為末新盞盛藥先入礬末一半在底次入余藥又將礬末一半蓋上用火煅候礬枯為度出火毒研末津液調敷乾落為度後用石膏五倍子為末收瘡口周先生枯痔法明礬赤石脂五錢辰砂痛加一錢黃丹上為末先用鬱金末護肛門如無鬱金用薑黃末代之調塗四圍好肉如不就加綠豆粉打合卻將枯藥敷上如肛門疼急濃煎甘草湯放溫拂四圍肛門上就與寬腸藥槐花大黃枳殼木通連翹瞿麥當歸上半酒半水煎枯藥早辰上一次日午一次洗去舊藥申時又洗去又上一次如要急安至夜半子時又洗上一次至次日且看痔頭淡淡黑色兩三日如烏梅四五日內用竹篦子輕輕敲打痔頭見如石堅至七八日便住更不須上枯藥且待自然如蘿蔔根乃脫去也洗用甘草荊芥槐花洗去舊藥方上新藥凡醫痔之法且如明日要下手今日先與此藥所以寬大腸使大便軟滑不與痔相礙且不泄瀉痔頭未脫落者須要日日與之以大黃一兩煨枳殼炒當歸酒洗一兩同為細末如桐子大好酒吞下治枯痔頭慮生他證凡用枯藥或觸壞腎根或水道赤澀痛與此方大黃木通生地各一兩滑石瞿麥各半兩同為細末每用四錢煎服催痔方如枯盡未脫落以此催之好磁石一錢白殭蠶生川烏五分同為細末冷水調敷上立脫凡用枯藥去盡乳頭恐留痔硬頭損破肛門四圍成瘡用此藥龍骨一錢石膏一錢沒藥五分膩粉五分同研十分細先以荊芥湯洗次摻之切忌毒物生薑痔脫後用甘草湯豆豉湯洗再用荊芥五倍子煎水洗便不生膿治痔脫後肉癢方用大粉草濃煎湯洗收腸方凡用枯藥脫下乳頭隨即與此以收其腸此方補氣又收膿去血生肉令痕壯人參當歸各一兩川芎甘草白芷防風厚朴桔梗桂枝黃耆上細末半酒半水煎如惡酒者酒少水多煎之夏月減桂樸加芩柏經治痔瘻有頭方用芫花入土根不限多少以淨水洗卻入木臼搗用少許水絞取汁於銀銅器內慢火熬成膏將絲線於膏內度過系痔系時微痛候心燥落時以紙捻引入膏藥於竅內永除根未落不得便屎周先生割痔麻藥川烏草烏尖胡椒吳茱萸花椒白殭蠶炒上細末酒調敷四邊然後割之又以此藥敷之否則亦用麝香龍骨塗之上枯痔系痔割痔三法用前藥服及敷貼不退者然後用之必敬謹之不可視為常法本治痔漏此因大腸感風熱而生生砒一字水銀一粒如米大膩粉一字麝香一粒如小豆大上件併入乳缽內研極細如痔如有珠子者將礬湯淨洗拭乾用手捻藥揩在痔上覺癢便是藥行一日二次又洗五日後住藥見效如或有孔只用紙捻引藥送入令徹其內更用紙貼孔前一日二次使藥自能生全陳無擇云忌用生砒恐毒氣入腹今兩存之以治珠突者針灸痔獨取足太陽經云足太陽之脈所生病者痔瘧視盛虛熱寒陷下取之蓋後世取承山穴者是也其二論督脈而不見其取法經云督脈生病癃痔蓋後世取長強穴是也丹治痔瘡大蒜十片頭垢捏成餅子先安頭垢餅於痔頭上外安蒜片以艾灸之本唐峽州王文顯充西路安撫司判官乘騾入駱谷有痔疾因此大作其狀如胡瓜貫於腸頭熱如糖灰火至驛僵仆主驛吏云此病予曾患來須灸即瘥用柳枝濃煎湯先洗痔便以艾炷其上連灸三五壯忽覺一道熱氣入腸中因轉瀉鮮血穢物一時出至痛楚瀉後遂失胡瓜所在登騾而馳去玉痔漏下血裡急後重或癢或疼二白在掌後縱紋上四寸手厥陰脈兩穴相併一穴在兩筋中一穴在大筋外針入三分瀉兩吸長強一寸大痛方到穴瀉三吸世灸法長強一寸大痛方到穴瀉三吸如灸可七壯雖久不愈者亦效又法脊骨凸處與臍平對是穴灸七壯承山二寸半補一呼如灸可七壯甲痔篡痛承筋主之痔篡痛飛陽及委中扶承主之痔痛攢竹主之痔痛會陰主之痔與陰相通者死陰中諸病前後相引痛不得大小便會陰皆主之痔骨蝕商丘主之無腸癖為痔如大澤中有小山突出為峙人於九竅中凡有小肉突出皆曰痔不特於肛門邊生有鼻痔眼痔牙痔等其狀不一方書分出五種曰牡曰牝曰脈曰腸曰氣牡痔者肛邊生瘡腫突出一日數枚膿潰即散牝痔者肛邊發露肉珠狀如鼠奶時時滴漬膿血脈痔者腸口顆顆發㿔且痛且癢出血淋漓腸痔者腸內結核有血寒熱往來登溷脫肛氣痔者遇恐怒則發肛門腫痛氣散則愈又有酒痔每遇飲酒發動瘡腫痛而流血血痔則每遇大便清血隨下而不止宜解熱調血順氣為主苦久不愈必至穿穴為漏矣治痔切勿用生砒毒氣入腹反至奄忽忌吃生冷硬物冷菜之類及酒濕面五辣辛熱大料物及乾薑之類犯之無效此東垣格言也
