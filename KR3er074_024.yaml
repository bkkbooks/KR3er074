body:
  text: 卷之二十四脾胃部水脹通論靈黃帝問曰水穀入於口輸於腸胃其液別為五天寒衣薄則為溺與氣天熱衣厚則為汗悲哀氣並則為泣中熱胃緩則為唾邪氣內逆則氣為之閉塞而不行不行則為水脹余知其然也不知其何由生願聞其道岐伯曰五穀之津液和合而為膏者內滲入於骨空補益腦髓而下流於陰股陰陽不和則使液溢而下流於陰髓液皆減而下下過度則虛虛故腰背痛而脛酸陰陽氣道不通四海塞閉三焦不瀉津液不化水穀並行腸胃之中別於回腸留於下焦不得滲膀胱則下焦脹水溢則為水脹五癃津液篇下過度謂房勞過度也本臍腹四肢悉腫者為水但腹脹四肢不甚腫為蠱蠱即脹也靈黃帝問於岐伯曰水與膚脹鼓脹腸覃石瘕石水何以別之岐伯答曰水始起也目窠上微腫如新臥起之狀其頸脈動時咳陰股間寒足頸腫腹乃大其水已成矣以手按其腹隨手而起如裹水之狀此其候也黃帝曰膚脹何以候之岐伯曰膚脹者寒氣客於皮膚之間𪔣𪔣然不堅腹大身盡腫皮厚按其腹窅而不起腹色不變此其候也鼓脹何如岐伯曰腹脹身皆大大與腹脹等也色蒼黃腹筋起此其候也腸覃何如岐伯曰寒氣客於腸外與衛氣相搏氣不得榮因有所繫癖而內著惡氣乃起瘜肉乃生其始生也大如雞卵稍以益大至其成如懷子之狀久者離歲按之則堅推之則移月事以時下此其候也石瘕何如岐伯曰石瘕生於胞中寒氣客於子門子門閉塞氣不得通惡血當瀉不瀉衃以留止日以益大狀如懷子月事不以時下皆生於女子可導而下黃帝曰膚脹鼓脹可刺邪岐伯曰先瀉其脹之血絡後調其經刺去其血絡也水脹論石水臍以下腫其脈沉水腫先自足腫後腹大為水素帝曰其有不從毫毛而生五臟陽以竭也津液充郭王注云不從毫毛生言生於內也津液者水也充滿也郭皮也蓋陽竭於外津液得以充滿於郭而浮腫也其魄獨居孤精於內氣耗於外形不可與衣相保此四極急而動中是氣拒於內而形施於外治之奈何岐伯曰平治於權衡去宛陳莝微動四極溫衣繆刺其處以復其形開鬼門潔淨府精以時服五陽已布疏滌五臟故精自生形自盛骨肉相保巨氣乃平湯液醪醴論開鬼門發汗也潔淨府利小便也王注云平治權衡謂察其脈浮沉也脈浮為在表脈沉為在裡在裡者泄之在表者汗之故下文云開鬼門潔淨府也去宛陳莝謂去積久之水物猶如草莝之不可久留於身中也微動四極謂微動四肢令陽氣漸以宣行故曰溫衣也仲諸有水者腰以下腫當利小便腰以上腫當發汗乃愈風水脈浮身重汗出惡風者防己黃耆湯主之防己一兩黃耆一兩一分白朮三分甘草炙半兩上銼每服五錢生薑四片棗一枚水盞半煎取八分去渣溫服良久再服腹痛加芍藥一法潔古用此湯調五苓散治因濕為腫者又方防己湯治風濕脈浮為在表其人或頭汗出無表症病者但下重從腰以上為和腰以下常腫及身重難以屈伸皮水為病四肢腫水氣在皮膚中四肢聶聶動者防己茯苓湯主之防己黃耆桂枝各三兩茯苓六兩甘草二兩上五味以水六升煮取二升分溫三服厥而皮水者蒲灰散主之方見淋以上利小便法風水急風一身悉瘡脈浮不渴續自汗出無大熱越婢湯主之麻黃六兩石膏半兩生薑三兩大棗十五枚甘草二兩上五味以水六升先煮麻黃去上沫內諸藥煮取三升分溫三服惡風者加附子一枚炮風水加朮四兩里水者一身面目黃腫其脈沉小便不利故令病水假如小便自利此亡津液故令渴也越婢加朮湯主之於前越婢湯加白朮四兩甘草麻黃湯亦主之甘草二兩麻黃四兩上二味以水五升先煮麻黃去上沫內甘草煮取三升溫服一升重覆汗出不汗再服慎風寒水之為病其脈沉小屬少陰浮者為風無水虛脹者為氣水其汗即已脈沉者宜麻黃附子湯浮者宜杏子湯麻黃三兩甘草二兩附子一個炮上三味以水七升先煮麻黃去上沫內藥煮取二升半溫服八合日三服以上發汗出愈丹水腫因脾虛不能制水水積妄行當以參術補脾使脾氣得實則能健運自然升降運動其樞機則水自行非若五苓之行水也宜補中行濕利小便切不可下當用二陳湯加白朮人參蒼朮為主佐以黃芩麥門冬制肝木若腹脹少佐厚朴氣不運加木香木通氣若陷下升麻柴胡提之隨症加減必須補中用大劑白朮補脾如壅滿用半夏陳皮香附監之有熱者當清肺金門冬黃芩之屬赤岸馮令八官素飲食不知飽但食肉必泄忽遍身發腫頭面加多致目亦不可開膈間滿如築兩足麻至膝而止渾身不可見風陰器挺長其脈左沉而重取不應右三部雖短小卻有和滑氣象遂令單煮白朮湯飲早晨空心探而去之食後白朮二錢麻黃五分川芎半錢防風三分作湯下保和丸五十丸如此者二日因吐中得汗通體上截為多遂得腫寬而眼開氣順而食進卻於前方中去麻黃防風加白朮三錢木通通草各半錢下保和丸五十丸如此者五日而安此即開鬼門之法也盧節婦年二十餘半月之前夜間發熱面先腫次及身足腫肚亦腫口渴思冷水食略減大腹皮半錢白朮一錢半蒼朮一錢半梔子四枚川芎一錢麻黃六分木通一錢乾葛二錢甘草梢些朱秀才因久坐受濕能飲酒下血以苦澀藥兜之遂成腫疾而肚足皆腫口渴中滿無力少汗脈澀而短乃血為濕氣所傷法當行濕順氣清熱進食化積滑石六錢白朮二錢木通三錢厚朴乾葛各二錢蒼朮一錢分四帖加蘇葉七片每一帖煎至三之一熱下保和丸與點丸溫中丸各五十丸王三九孺人浮腫膈滿腹滑泄口苦而渴小便赤少脈虛而豁大稍遲此有汙積病為人性急滑石一兩陳皮四錢蘇梗白朮川芎木通厚朴各二錢茯苓皮一錢半甘草梢半錢分六帖用順流水煎下保和丸二十五丸抑青丸十丸吳孺人胃中有積發為腫成瘡疥身倦食少惡寒發熱脈虛而沉白朮一兩六錢滑石二兩生地木通川芎各半兩黃芩茯苓皮連翹各四錢紫蘇三錢甘草炙二錢半下保和丸三十丸一女子年三十餘歲腫病有熱服藥得安但兩足下節不退肚內自覺尚有熱脈卻平矣飲食如昨白朮一錢郁李仁一兩半蘇梗木通條芩檳榔枳實炒半兩青皮一兩甘草梢一錢分十帖細研郁李仁以順流水三盞蕩起煎一盞食前熱服張郎二十歲秋得腫疾午前上甚午後下甚口渴乏力脈澀弱食亦少稟氣素怯汗不能自出鬱而為水與灸三里肺俞大椎合谷分水又與此方白朮一錢半陳皮五分黃芩紫蘇海金沙木通大腹皮茯苓皮乾葛炒厚朴甘草各二錢作一帖水煎服光明人腳腫肚略急身微熱脈略數口乾白朮一錢茯苓五分乾葛炒五分蘇梗五錢大腹皮三錢甘草炙一錢川芎二錢陳皮五分許宅婦人二十以上腳踝腫近日有瘡毒白朮七錢蒼朮陳皮犀角末川芎各五錢連翹木通蘇葉各三錢甘草梢一錢分七帖煎後入薑汁令辣熱食前服馮官人因內有濕積兼時令濕熱右腿少陽分發爛瘡如掌大癢甚兩手脈洪緩略數兩目手足俱虛腫膈中午前痞悶午後腫到兩足則膈寬犀角生五分枳殼炒五分陳皮連翹白朮各一錢木通五分蒼朮五分甘草梢二分茯苓五分加薑汁煎服馮客瘧而發腫微渴脈左手虛右手大食少白朮一錢半陳皮一錢木通厚朴炒大腹皮各五分甘草炙二分牛膝五分蘇梗三分薑三片馮儒人瘧而浮腫大便自利人參半夏陳皮各一錢川芎蒼朮炒白芷各五分木通二錢白朮一錢半炒甘草炙三分王官人年四十瘧兩日一發始善啖至春作腫大小便祕食少面浮腫口渴厚朴一錢白朮一錢半木通七分半陳皮一錢川芎大腹皮各五分牛膝滑石各一錢炒甘草炙三分上丹溪治水腫之法十五條其法大率皆以甘草佐白朮參陳等劑補中氣為君木通滑石郁李仁海金沙行水為臣厚朴大腹皮蘇梗通滯氣為佐使如氣不升浮惡寒脈沉者探吐以提之頭面先腫加麻黃微汗之挾積氣者佐以保和溫中抑青等丸磨之挾熱者佐以黃芩之類清之挾瘡癰者佐以連翹犀角散之而隨症加減也羅治腫以胃氣為本至元戊寅五月間積雨淋淫魯齋許仲平先生時年五十有八面目肢體浮腫大便溏多腹脹腸鳴時痛飲食減少命豫治之脈得弦細而緩魯齋曰年壯時多服牽牛大黃藥面目四肢時有浮腫今因陰雨故大發豫曰營運之氣出自中焦者胃也胃氣弱不能布散水穀之氣營養臟腑經絡皮毛故氣行而澀為浮腫大便溏多而腹脹腸鳴皆濕氣勝也四時五臟皆以胃氣為本五臟有胃氣則和平而身安若胃氣虛弱不能運動滋養五臟則五臟脈不和平本臟之氣盛者其脈獨見輕則病過甚則必死故經曰真臟之脈弦無胃氣則死先生之疾幸而未至於甚尚可調補人知服牽牛大黃為一時之快不知其為終身之害也遂以平胃散加白朮茯苓草豆蔻仁數服而腹脹溏泄腸鳴時痛皆愈飲食進止有四肢浮腫以導滯通經湯主之良愈導滯通經湯治痹濕有餘及氣不宣通面目手足浮腫陳皮桑白皮白朮木香各五錢茯苓一兩去皮霖雨時加澤瀉一兩上㕮咀每服五錢水二盞煎至一盞食前溫服白茯苓湯能變水白茯苓澤瀉各二兩郁李仁五錢上㕮咀作一服水一碗煎至一半生薑自然汁入藥常服無時從少至多服五七日後覺腹下再腫治以白朮散白朮澤瀉各半兩上為末煎服三錢或丸亦可煎茯苓湯下三十丸以黃耆芍藥建中湯之類調養之平復後忌房室豬魚鹽面等物本大棗湯治四肢腫滿用白朮三兩㕮咀每服半兩水一盞半大棗三枚拍破同煎至九分去渣溫服日三四服不拘時候梅治水腫不能服藥商陸一升羊肉六兩以水一斗煮取六升去渣和肉蔥豆作臛如常法食之商陸白者好食醫治十種水氣病不瘥欲死者鯉魚一頭重一斤以上者煮熟取汁和冬瓜蔥白作羹食之治十種水氣病不瘥垂死者青頭鴨一隻治如食法細切和米並五味煮令熟作粥空腹食之梅治水氣脹滿小便澀白鴨一隻去毛腸洗淨饙飯半升與椒薑同穰鴨腹中縫定如法蒸熟食之子和郾之營兵狄家小兒病風水諸醫用銀粉粉霜之藥小便反澀飲食不進頭腫肚脹四肢皆滿狀若水晶求治戴人戴人曰此證不與壯年同壯年病水者或因留飲及房室此小兒才七歲乃風水證也宜出汗乃置燠室以屏帳遍遮之不令見火若內火見外火必昏瞶也使大服胃風湯而浴之浴訖以布單重覆之凡三五重其汗如水腫乃減五分隔一二日又依前法治之汗出腫減七分又三汗而全減尚未能食以檳榔丸調之兒已嬉笑如常日矣本治水氣羌活散羌活蘿蔔子各等分上同炒香熟去蘿蔔子不用末之溫酒調下二錢一日一服二日二服三日三服取效羅五皮散治他病愈後或瘧痢後身體面目四肢浮腫小便不利脈虛而大此由脾肺虛弱不能運行諸氣氣虛不理散漫於皮膚肌腠之間故令腫滿也此藥並宜服之大腹皮赤茯苓皮生薑皮陳皮桑白皮炒各等分上件為粗末每服五錢水一大盞同煎至八分去渣溫服不拘時候日進三服香蘇散治水氣虛腫小便赤澀陳皮一兩去白防己木通紫蘇葉各半兩上為末每服二錢水二盞生薑三片同煎外治水病洪腫氣脹不消食用香薷五十斤細銼納釜中水浸上數寸煮使氣盡去渣澄清熬稠丸如桐子大日三服每服五丸稍加之以小便利為度梅治水腫作坐臥不得頭面身體悉腫取東引花桑枝燒灰淋汁煮赤小豆空心食令飽飢即食盡不得吃飯兵治水病初得危急冬瓜不限多少任吃神效無比丹溪云冬瓜性急久病與陽虛者忌之丹十種水氣冬瓜去穰納赤豆在內蒸熟為丸服治痢日久津液枯四肢腫口乾用冬瓜黃土厚包五寸煨熟去土取汁飲之録驗羅白丸子治遍身腫及單腹脹滿喘悶不快小便赤澀神效輕粉五分粉霜炒四錢碙砂研炒三錢滑石研炒四錢寒水石火燒研炒三錢白丁香研羅末炒三錢上件藥將輕粉滑石二味一處研勻用薄紙裹了卻更和白麵作餅再裹前藥又用桑柴火燒以熟為度取出與前四味一處和勻水浸蒸餅搦干為丸如緑豆大每日薑湯下三服食前下第一日每服二丸第二日每服三丸第三日每服四丸第四日每服五丸如覺小便多腫漸減便勿服如小便不多更服一日二日加作六丸做一服一日亦三服腫消為效如服藥至第三日覺牙縫內癢痛口氣出時便用漱口藥用貫衆黃連各半兩為散每服一錢水一盞煎至七分入龍腦少許攪勻溫服之每一日煎一錢漱口如腫消忌鹽魚肉冷硬果食只服粥百日永瘥如臟腑祕澀氣實先服治腫海藻散此藥親用救人甚多神效海藻散方見本門積氣條仲牡蠣澤瀉散治腰以下腫方見傷寒河葶藶丸治一切水濕氣通身腫不可當者人參一兩苦葶藶四兩於鍋內紙上炒黃色為度上二味同為細末用棗肉和丸桐子大每服十五丸煎桑白皮湯下日進三服空心食前驗羅聖靈丹治脾肺有濕喘腫盛小便赤澀苦葶藶四兩炒木香檳榔茯苓麵裹煨防風木通人參以上各二錢半恐是二兩半上為末用棗肉為丸如桐子大煎桑白皮湯下垣赤茯苓丸治脾濕太過四肢腫滿腹脹喘逆氣不宣通小便赤澀葶藶四兩防己二兩赤茯苓一兩木香五錢上為細末棗肉丸如桐子大每服三十丸煎桑白皮湯下食前服續隨子丸治遍身虛腫喘悶不快人參漢防己赤茯苓木香檳榔各五錢苦葶藶四兩炒續隨子一兩海金沙五錢上為細末棗肉丸如桐子大每服二三十丸煎桑白皮湯食則下海潔古方治水腫用螻蛄去頭尾與葡萄心同搗露七日曝乾為末淡酒調下暑月濕用尤佳聖惠方治水腫喘促不得臥螻蛄五枚為末食前湯調半錢至一錢小便通效仲夫水病人目下有臥蠶或面目鮮澤脈伏其人消渴病水腹大小便不利其脈沉細者有水可下之世治水腫薏苡仁根君木香檳榔黑牽牛上為末酒調服妙外療水病腫用鯉魚一頭極大者去頭尾及骨唯取肉以水二升赤小豆一大升和魚肉煮取二升以上生布絞取汁去渣頓服盡如不盡分為三服當下利利盡即瘥本治身體腫滿水氣急臥不得郁李仁一大合搗為末合和麵搜作餅子與吃入口即大便利氣便瘥丹有人患腳膚腫漸上膝足不可踐地大水頭面遍身腫脹滿用苦瓠瓤實捻如豆大以麵裹煮一沸空心服七枚至午當出水一斗三日水自出不止大瘦乃瘥三年內須慎口味一方治腫取苦瓠殼以鹽搽殼上燒存性為末煎童便一盞調服瘥苦瓠須擇無靨翳細理潔淨者不爾有毒世三種散治浮腫用陳蘿蔔種去瓤陳蒲殼去瓤烏豆一合同煎服即時退羅無礙丸治脾濕積流四肢腫滿大腹皮二兩木香半兩蓬朮京三稜檳榔郁李仁各一兩上為細末炒麥蘖曲糊為丸如桐子大生薑湯下本治腫滿小便不利茯苓散郁李仁四錢檳榔二錢赤茯苓白朮甘遂切片炒各一錢陳皮一錢半上細末每服一錢薑棗湯調下治十種水病並根源證狀方法一青水先從左右肋腫起根在肝大戟二赤水先從舌根起根在心葶藶子三黃水從腰腹起根在脾甘遂微炒四白水從腳腫起根在肺桑白皮五黑水從外腎腫起根在腎連翹六玄水從面腫起根在外腎芫花醋炒七風水從四肢腫起根在骨澤瀉八石水從腎腫起根在膀胱藁本九高水從小腹腫起根在小腸巴豆去皮油十氣水或盛或衰根在腹赤小豆上十般腫病各有根源種種不同看十種病根除一味倍多餘九味等分逐味依法修治焙為細末煉蜜丸如桐子大用赤茯苓湯吞下三丸不拘時候每日三服忌鹽一百二十日緣鹽能化水也又忌魚蝦麵食一切毒物及生冷房室甚效用此方獲瘥後更用後來補藥補藥方肉桂去粗皮赤茯苓去皮乾薑莪朮醋煮川芎肉豆蔻桔梗各等分依法制服一方無赤茯苓莪朮有青皮白朮檳榔上等分為末每服三錢百沸湯點服空心食前服午晚各一服前項二方治水腫病甚效子試用之百發百中獲濟者無數世間所有水病方藥無出此二方之上者幸勿忽河三花神佑丸治中滿腹脹一切水濕腫滿甘遂大戟芫花醋淬濕炒各五錢大黃一兩輕粉一錢牽牛二兩上為末滴水丸如小豆大初服五丸每服加五丸溫水下每日三服以快利為度得利止後服神效垣海金沙散治脾濕太過通身腫滿喘不得臥及腹脹如鼓牽牛一兩半一半炒一半生甘遂五錢白朮一兩海金沙三錢上為細末每服二錢煎倒流水一盞食前調下得宣利止後服羅海藻散治男子婦人通身虛腫喘滿不快海藻大戟大黃續隨子去殼各一兩上四味用好酒浸一宿取出曬乾候用滑石半兩白牽牛頭末生一兩甘遂麩炒一兩白豆蔻一個青皮去白陳皮去白各半兩上前藥都一處杵為細末大人每服二錢如氣實者三錢平明冷茶清調下至夜時取下水三二行腫減七分隔二三日平明又一服腫消忌魚肉百餘日小兒腫服一錢五歲以下者半錢女人有胎者不可服保錢氏論虛實腹脹實則不因吐瀉久病之後亦不因下利得之脹而喘急悶亂更有痰有熱及有宿食不化者宜大黃丸白餅子紫霜丸下之更詳別大小便如俱不通先利小便後利大便虛則久病吐瀉後其脈微細主目胞腮虛腫手足冷宜先與塌氣丸後與異功散及和中丸益黃散和其氣因氣而腫者煎陳皮湯因濕而腫者煎防己黃耆湯調五苓散因熱而腫者八正散又一法燥熱於肺為腫者乃絶水之源當清肺除燥水自生矣於梔子豉湯中加黃耆如熱在下焦陰消使氣不得化者宜益陰則陽氣自化加黃連黃柏是也垣中滿分消丸方見脹門丹熱水腫梔子五錢木香一錢白朮二錢半急流水煎服又方山梔子去皮取仁炒槌碎米飲湯送下如胃脘熱病在上者帶皮用本治遊風攻頭面或四肢作腫塊知母湯知母麻黃黃耆甘草羌活白朮枳殼各一兩上粗未每服四錢水一盞半牛蒡子百粒研碎煎至七分溫日三四服覺冷不用牛蒡子有一達官母年七十中風手拘攣平日止是附子之類扶養一日面浮腫手背亦腫尋常有一國醫供藥診之是水病欲下大戟牽牛以導之其家大驚憂惶召豫議之豫曰素問稱面腫曰風足脛腫曰水此服附子太過正虛風生熱之證咽必噎塞膈中不利誠如豫言用升麻牛蒡玄參湯繼以知母湯三日便愈無復元丹治三焦不瀉氣脈塞閉樞機不通喘息奔急水氣盈溢滲透經絡皮膚溢滿足脛尤甚兩目下腫腿腹間冷口苦心腹堅脹不得正偃偃則咳嗽小便不通夢中虛驚不能安臥獨活炮二兩木香炒川椒炒出汗羌活厚朴去皮薑製陳皮吳茱萸炒桂心各一兩澤瀉一兩半肉蔻煨檳榔各半兩上為末糊丸如桐子大每服五十丸煎紫蘇湯送下不拘時此藥世傳屢驗服者宜先屏去諸藥一日三服先服漩利如傾次即腫消喘止宜絶欲屏鹽半年乃不再作本治脾虛浮腫實脾散大附子一枚草果二兩甘草一兩乾薑二兩大腹皮去皮六兩木瓜一個去穰切片上用水於沙器內煮乾一半掰開看乾薑不白心為度亦不得令水乾至焦取出焙乾為末每日午時空心沸湯點服素三陰結謂之水陰陽別論王注云謂脾肺之脈俱寒結也下焦溢為水全文見診王注云下焦為分注之所氣窒不瀉則為溢水陽明所謂上喘為水者陰氣下而復上上則邪客於臟腑間故為水也運氣水腫有四一曰濕經云太陰所至為胕腫又云濕勝則濡泄甚則水閉胕腫又云太陰之勝足脛胕腫飲發於中胕腫於上又云太陰司天客勝則首面胕腫呼吸氣喘治以諸熱是也二曰火熱經云諸病胕腫皆屬於火又云少陽司天火氣下臨肺氣上從寒熱胕腫又云少陽司天火淫所勝民病皮膚痛色變黃赤傳而為水身面胕腫腹滿仰息又云少陽之復渴引水漿化而為水傳為胕腫又云少陽司天客勝甚則胕腫治以諸寒是也三曰寒經云寒勝則浮是也四曰燥經云陽明所至為浮虛是也素黃帝問曰少陰何以主腎腎何以主水岐伯對曰腎者至陰也至陰者盛水也肺者太陰也少陰者冬脈也故其本在腎其末在肺皆積水也帝曰腎何以能聚水而生病岐伯曰腎者胃之關也關門不利故聚水而從其類也上下溢於皮膚故為胕腫附腫者聚水而生病也帝曰諸水皆生於腎乎岐伯曰腎者牝臟也地氣上者屬於腎而生水液也故曰至陰勇而勞甚則腎汗出腎汗出逢於風內不得入於臟腑外不得越於皮膚客於玄府行於皮里傳為胕腫本之於腎名曰風水所謂玄府者汗空也帝曰水俞五十七處者是何主也岐伯曰腎俞五十七穴積陰之所聚也水所從出入也尻上五行行五者此腎俞故水病下為胕腫大腹上為喘呼不得臥者標本俱病故肺為喘呼腎為水腫肺為逆不得臥分為相輸俱受者水氣之所留也肺腎之標本其上下分為相輸應之病而俱受者緣此二臟乃水氣之所留故也伏菟上各二行行五者此腎之街也三陰之所交結於腳也踝上各一行行六者此腎脈之下行也名曰太衝凡五十七穴者皆臟之陰絡水之所客也水熱穴論尻上五行行五脊中一懸樞一命門一腰俞一長強一大腸俞二小腸俞二膀胱俞二中呂內俞二白環俞二胃倉二肓門二志室二胞肓二秩邊二伏菟上各二行行五中柱二四滿二氣穴二大赫二橫骨二外陵二大巨二水道二歸來二氣街二踝上各一行行六太衝二復溜二陰谷二照海二交信二築賓二靈風㽷膚脹為五十七痏取皮膚之血者盡取之四時氣篇刺灸水腫有五法其一取腎膀胱經前篇云五十七穴者是取其二經之穴也又經云腎病者腹大脛腫取其經少陰太陽血者是取其二經之血也其二取血絡經前云取皮膚之血者盡取之是也其三取胃經云胃足陽明之脈所生病者大腹水腫視盛虛熱寒陷下取之是也其四取委陽經云三焦病者不得小便溢則水取委陽是也其五筒針取水先以鈹針針之已刺而筒之引針而納之入而復之以盡其㽷必堅來來緩則煩悗來急則安靜間日一刺之㽷盡乃止筒針針中有空竅如筒出水也撮浮腫分水中脘各灸之內庭行間臨泣各瀉立安東水氣皮痛不可近衣小腹敦敦然小便黃身潤章門屋翳灸陰交章門刺之華外腰水腫先從腰腫起肝募水分內中水腫面痿黃胃脘通谷氣海水分胞中水腫根在心水赤心俞巨闕氣海腹中水腫從脾起水黃脾俞胃脘水分肺喘水腫從胸起水白肺俞肝募足心水腫從足起白環俞水分亶中四肢水腫變身浮膽募兩脅水腫四肢枯瘦從脅腫起章門期門小腸水腫從臍腫起氣海保五脈論五水灸法青水灸肝井弦脈赤水灸心滎洪脈黃水灸脾俞緩脈白水灸肺經澀脈黑水灸腎合沉脈甲身腫關門主之水腫脹皮腫三里主之風水膝腫巨虛上廉主之風水面胕腫顏黑解溪主之風水面胕腫衝陽主之水中留飲胸脅支滿刺陷谷出血立已面胕腫上星主之先取噫嘻後取天牖風池水腫人中盡滿唇反者死水溝主之水腫大臍平灸臍中無理不治素目窠微腫如臥蠶之狀曰水平人氣象論足脛腫曰水仲病下利後渴飲水小便不利腹滿因腫者何也答曰此法當病水若小便自利及汗出者自當愈跗陽脈當伏今反數本自有熱消穀小便數今反不利此欲作水寸口脈浮而遲浮脈則熱遲脈則潛熱潛相搏名曰沉跗陽脈浮而數浮脈則熱數脈則止熱止相搏名曰伏沉伏相搏名曰水沉則絡脈虛伏則小便難虛難相搏水走皮膚則為水矣素頸脈動喘疾咳曰水平人氣象論仲風水其脈自浮外證骨節疼痛惡風針經論疾診尺篇云視人之目窠上微癰如新臥起狀其頸脈動時咳按其手足上窅而不起者風水膚脹也又仲景云太陰脈浮而緊法當骨節疼痛反不疼身體反重而酸其人不渴汗出即愈為風水治法見前陽虛條皮水其脈亦浮外證胕腫按之沒指不惡風其腹如鼓不渴當發其汗又云渴而不惡寒者此是皮水蓋法當風水惡寒不渴皮水不惡寒而渴假令皮水不渴亦當發汗也治法見陽虛條正水其脈沉遲外證自喘石水其脈自沉外證腹滿不喘大奇論篇腎肝並沉為石水並浮為風水黃汗其脈沉遲身發熱胸滿四肢頭面腫久不愈必致癰膿又云身腫而冷狀如周痹胸中窒不能食反聚痛暮躁不得眠此為黃汗治法見黃疸條仲心水者其身重而少氣不得臥煩而躁其陰大腫肝水者其腹大不能自轉側脅下腹中痛時時津液微生小便續通肺水者身腫小便難時時鴨溏脾水者其腹大四肢苦重津液不生但苦少氣小便難腎水者其腹大臍腫腰痛不得溺陰下濕如牛鼻上汗其足逆冷面黃瘦一云大便反堅無大抵浮腫帶數即是虛寒潛止於其間久必沉伏沉伏則陽虛陰實為水必矣面痝然浮腫疼痛其色炲黑多汗惡風者屬腎風治見諸風注諸唇黑則傷肝缺盆平則傷心臍出則傷脾足心平則傷腎背平則傷肺凡此五傷必不可治也仲脈得諸沉當責有水身體腫重水病脈出者死無擇云大抵浮脈帶數即是虛寒潛止於其間久必沉伏沉伏則陽虛陰實為水必矣脈水病脈洪大者可治微細者不可治水病腹大如鼓脈實者生虛者死水病夜半死全文見診生死仲諸病水者渴而下利小便數者皆不可發汗素帝曰有病腎風者面胕痝然壅害於言可刺否岐伯曰虛不當刺不當刺而刺後五日其氣必至帝曰其至何如岐伯曰至必少氣時熱時熱從胸背上至頭汗出手熱口乾苦渴小便黃目下腫腹中鳴身重難以行月事不下煩而不能食不能正偃正偃則咳病名曰風水論在刺法中帝曰願聞其説岐伯曰邪之所湊其氣必虛陰虛者陽必湊之故少氣時熱而汗出也小便黃者少腹中有熱也不能正偃者胃中不和也正偃則咳甚上迫肺也諸有水氣者微腫先見於目下也帝曰何以言之岐伯曰水者陰也目者亦陰也腹者至陰之所居故水在腹者必使目下腫也真氣上逆故口苦舌乾臥不得正偃正偃則咳出清水也諸水病者故不得臥臥則驚驚則咳甚也腹中鳴者病本於胃也薄脾則煩不能食食不下者胃脘隔也身重難以行者胃脈在足也月事不來者胞脈閉也胞脈者屬心而絡於胞中今氣上迫肺心氣不得下通故月事不來也評熱病論仲問曰病者苦水面目身體四肢皆腫小便不利脈之不言水反言胸中痛氣上衝咽狀如炙肉當微咳喘審如師言其脈何類師曰寸口脈沉而緊沉為水緊為寒沉緊相搏結在關元始時當微年盛不覺陽衰之後榮衛相干陽損陰盛結寒微動緊氣上衝喉咽塞噎脅下急痛醫以為留飲而大下之氣擊不去其病不除後重吐之胃家虛煩咽燥欲飲水小便不利水穀不化面目手足浮腫又與葶藶丸下水當時如小瘥食飲過度腫復如前胸脅苦痛象若奔豚其水揚溢則浮咳喘逆當先攻擊沖氣令止乃治咳咳止其喘自瘥先治新病病當在後丹盧氏醫鏡水脹辨內經曰諸氣膹郁皆屬於肺諸濕腫滿皆屬於脾諸腹脹大皆屬於熱蓋濕者土之氣土者火之子故濕每生於熱熱氣亦能自濕者子氣感母濕之變也凡病腫皆宜以治濕為主所挾不同故治法亦異類例治腫以治水立説而欲導腎以決去之豈理也哉脾土衰弱內因七情外傷六氣失運化之職清濁混淆鬱而為水類例以為本末皆隸於肺腎胃三者而不及脾下文繼以肺金盛而生水水液妄行氣息閉樞機壅而為腫夫脾土受病肺為之子焉有自盛而生水者哉若謂腫之水果生於肺金之清氣則滋長腎陰奉行降令為化生之源何病腫之有今滲透經絡注流溪谷皆濁腐之氣窒礙津液久久灌入隧道血亦化水而欲藉脾土以制之導腎氣以利之不思脾病則肝木來侮子氣亦衰木寡於畏脾欲不病不可得矣治法宜清心經之火補養脾土全運化之職肺氣下降滲道開通使敗濁之氣其稍清者復回而為氣為血為津液其甚者在上為汗在下為溺以漸而分消矣今不明言而曰制水燥水得非白圭以鄰國為壑乎經言腫病因津液充郭而致不生於肺金之盛也明矣又言氣拒於內氣耗於外責其不能滲運敗濁耳又云開鬼門潔淨府鬼門膚腠也屬肺淨府膀胱也屬腎之府未聞有導腎氣之説注文明言陰精耗損腎氣果可導乎仲景謂治濕利小便即經中潔淨府之意苟以清淨為腎而導之果於經意有合乎錢仲陽謂腎無瀉法其可輕易導之乎或曰經言疏滌五臟非導腎歟豫曰此承上文五陽已布而言若鬼門開矣淨府潔矣五宮之陽氣條布彼敗濁之氣自然疏導滌除於腎氣何與焉胎前水腫云防己湯治妊娠脾虛遍身浮腫心腹脹滿喘促小便不利防己七錢半桑白皮赤茯苓紫蘇莖葉各一兩木香二錢半上為粗末每服四錢薑四片水同煎食前服葶藶散治妊娠遍身洪腫葶藶子一兩白朮五兩茯苓桑白皮郁李仁各二兩上為粗末水六升煎取二升分三服小便利即瘥又方澤瀉葶藶各二兩茯苓枳殼白朮各六兩上細切以水六升煮取二升半分溫二服子和治妊娠從腳上至腹腫小便不利微渴豬苓五兩末以熟水服方寸匕日三服丹子腫多濕用山梔一撮米飲吞下産後水腫丹産後腫必用大補氣血為主少佐以蒼朮茯苓使水自利大大調經散治産後腫滿喘急煩渴小便不利大豆一兩半炒去皮茯神一兩真琥珀一錢上為細末濃煎烏豆紫蘇湯調下産後四肢浮腫者敗血循經流入四肢淫留日深腐爛如水故令四肢腫面黃宜服小調經散血行腫消則愈沒藥琥珀桂心芍藥當歸各一錢細辛麝香各五分上為細末每服半錢薑汁酒各少許調停服丹婦人産後浮腫小便少口渴惡寒無力脈皆沉此體虛而有濕熱之積必上焦滿悶宜補中導水行氣可也白朮二兩半陳皮一兩川芎半兩木通六錢茯苓三錢下與點丸二十五丸大奪魂散治産後虛腫喘促利小便則愈生薑三兩取汁白麵三兩半夏七個上以生薑汁搜麵裹半夏為七餅子煨焦熟為末水調一盞小便利為效潔如産後風寒在表面目四肢浮腫宜局方中七聖丸白湯下日加以利為度七聖丸方見痔如浮腫至膝喘嗽加木香檳榔倍之謂氣多也如浮腫又頭痛昏冒加羌活川芎謂風多也如只浮腫止七聖丸本方服之垣中滿分消丸方見脹門熱條用四物湯吞之杜張宣徽侍寵産後半月忽患浮腫急召産科醫治經半月不瘥病勢轉劇召杜治之杜至曰諸醫作何病張曰皆雲水氣浮腫杜曰非也且水氣發咳嗽小便澀是也今愛寵小便不澀不作咳嗽惟手足寒乃血藏虛氣塞不通流面生浮腫遂用益血和氣藥治之旬日病去七八經半月全愈所用之藥乃靈苑方牡丹散也其方云治血藏風虛冷今産科家多用此藥治産後諸病如神更名曰損金湯者是也牡丹散方見産後血暈門大加減吳茱萸湯治婦人血藏虛宿挾風冷身面虛浮等疾吳茱萸一兩半桔梗乾薑甘草麥門冬防風半夏細辛當歸赤茯苓牡丹皮桂心各半兩上為粗未每服四錢水一盞半煎至七分去渣食前熱服丹産後風腫水腫澤蘭防己等分溫酒調下二錢如不能飲者醋調下亦可成氏方小腹脹先腹大後四肢腫為脹或獨腹大四肢不腫者治法同無附子緑豆湯治寒客皮膚殼殼然而堅腹大身腫按之陷而不起色不變病名膚脹一劑未知再作大附子一個重七錢者生去皮臍半破緑豆二兩上以生薑二兩切水二碗煎至一碗去渣分三服空腹溫服次日將前附子破作四片再用緑豆二兩薑一兩如前煎服停三日復將附子作八片如前煎服治鼓脹法並見後行濕寒熱氣血諸條皆其法也仲脹滿按之不痛為虛痛者為實可下之腹脹時減復如故此為寒當與溫藥腹滿不減減不足言須當下之宜大承氣湯海脾虛滿者黃耆湯芍藥停濕脾實滿不運平胃散蒼朮泄濕東垣云腹脹滿氣不轉者加厚朴以破滯氣腹中夯悶此非腹脹滿乃散而不收可加芍藥收之是知氣結而脹宜厚朴散之散而脹宜芍藥收之丹鼓脹大補中氣行濕此乃脾虛之甚必須遠音樂斷厚味朝寬暮急血虛暮寬朝急氣虛終日急氣血皆虛用大劑人參白朮佐以陳皮蒼朮茯苓之類有血虛者四物行血隨證加減凡補氣必帶厚朴寬滿腹脹必少佐厚朴者蓋厚朴味辛以氣聚於上焦故也氣不運加木香氣若陷下用升麻柴胡以提其氣水腫當補脾為主白朮茯苓陳皮佐之鼓脹論心肺陽也居上腎肝陰也居下脾居中亦陰也屬土經曰飲食入胃遊溢精氣上輸干脾脾氣散精上歸於肺通調水道下輸膀胱水精四布五經並行是脾具坤靜之德而有干健之運故能致心肺之陽降腎肝之陰升而成天地交之泰是為無病之人今也七情內傷六淫外侵飲食失節房勞致虛脾土之陰受傷轉輸之官失職胃雖受谷不能運化故陽自升陰自降而成天地不交之否於斯時也清濁相混隧道壅塞氣化濁血瘀鬱而為熱熱留而久氣化成濕濕熱相生遂成脹滿經曰鼓脹是也以其外雖堅滿中空無物有似於鼓其病膠固難以治療故又名曰蠱若蟲侵蝕有蠱之義驗之治法理宜補脾又須養肺金以制木使脾無賊邪之慮滋腎水以制火使肺得清化之令卻鹽味以防助邪斷妄想遠音樂以保母氣無有不安醫者不察病起於虛急於取效衒能希賞病者苦於脹急喜行利藥以求一時之快不知寬得一日半日其腫愈甚病邪甚矣真氣傷矣去死不遠古方惟禹餘糧丸又名石中黃丸又名紫金丸制肝補脾殊為切當亦須隨證又須順時加減用之為妙豫友俞仁叔儒而醫連得家難年近五十得此疾自制禹餘糧丸服之豫診其脈弦澀而數曰此丸新制煅煉之火邪尚存溫熱之藥太多宜自加減不可執方俞笑曰今人不及古人此方不可加減服之一月口鼻出血色黑骨立而死楊兄年五十性嗜酒病瘧半年患脹病自察必死來求治診其脈弦而澀重則大瘧未愈手足瘦而腹狀如蜘蛛遂教以參術為君當歸川芎芍藥為臣陳皮黃連厚朴茯苓為佐生甘草些少作濃湯飲之一日定三帖彼亦嚴守戒忌一月後瘧得汗而愈又半月小便長而脹愈中間雖少有加減大意只是利氣行濕又陳氏年四十餘性嗜酒大便時見血於春間患脹色黑而腹大其形如鬼診其脈數而澀重似弱豫以四物加黃連黃芩木通白朮陳皮厚朴生甘草作湯與之近一年而安一補氣一補血余藥大率相出入皆獲安以保天壽或曰氣無補法子何補氣而獲安果有説以通之乎豫曰氣無補法乃世俗之言也蓋氣之為病痞悶壅塞似難於補恐增病勢不思正氣虛者不能運行邪滯所著而不去所以為病經曰壯者氣行則愈怯者著而成病苟或氣怯不用補法氣何由行或曰子之藥審則審矣何效之遲也病者久在床枕將必厭子之迂而求速效者矣豫曰此病之起或三五年或十餘年根深勢篤欲求速效自求禍耳知王道者能治此病也或曰脹病將終不可與利藥乎豫曰灼知其不因於虛受病亦淺脾胃尚壯積滯不固而又有可下之證亦宜略與疏導若援張子和浚川散禹功丸為例行迅攻之策實所不敢潘可達女年十九歲稟受頗厚患胸腹脹滿自用下藥利十數行時脹無增減來求治診其脈皆大略按即散而無力全無數意豫曰此有表證反攻裡當死賴稟受好時又在室尚可挽回壽損矣急與四物湯加人參白朮帶白陳皮炙甘草煎服至半月後病不退又自用蘿蔔根種煎湯澡浴兩度時腫稍增豫曰表病攻裡已自難救今又虛其表事急矣於前藥去地黃芍藥加黃耆倍白朮大劑濃煎湯飲又吞人參白朮丸十日後如初病時又因吃難化物自利以參術為君少加陳皮為佐又與肉豆蔻訶子為君山楂子為使粥和作丸吞之至四五十帖而安一男子年四十餘患瘧久而腹脹脈不數而微弦重取則來不滑利輕重又皆無力遂與索氏三和湯三倍加白朮入薑汁服之數服而瘧愈小便利二三行脹稍減遂又小便短少豫作氣血兩虛於前藥內入人參牛膝當歸身尾作大劑料百服而愈索氏三和湯三倍加白朮方白朮厚朴陳皮各三兩木通一兩檳榔紫蘇各二兩甘草海金沙大腹皮白茯苓枳殼各一兩水煎服海調胃白朮澤瀉散治痰病化為水氣傳變水穀不能食白朮半斤澤瀉芍藥陳皮茯苓生薑木香檳榔各一兩上為末治腹腫如神若心下痞加枳實若心下盛加牽牛仲心下堅大如盤邊如旋杯水飲所作枳朮湯主之枳實七個白朮二兩上二味以水五升煮取三升分溫三服腹中軟即當散也羅真定王君用年一十九歲病積臍左連脅如覆杯腹脹如鼓多青絡脈喘不得臥時值暑雨加之自利完穀日晡潮熱夜有盜汗求豫往治之脈得浮數按之有力謂病家曰凡治積非有毒之劑攻之則不可今脈虛弱如此豈敢以常法治之遂投分滲益胃之劑數服而便清自調雜以升降陰陽進食和氣而腹大減胃氣稍平間以消積之劑不月餘良愈先師嘗曰潔古老人有云養正積自除譬如滿座君子縱有一小人自無容地今令真氣實胃氣強積自消矣丹一婦人年三十六歲家貧多勞性偏急自七月斷經後八月小腹下有一塊偏左如拳有時塊起即痛作伏則勢減至半月後腹漸腫脹食減平時三分之二無力遇夜發熱天明即稍退其脈得虛微短弱澀左尤甚初與白朮一斤帶白陳皮一斤作二十帖服以三聖膏貼塊上經宿則塊軟再宿則塊小旬日後食稍進熱減半脈稍有力又與白朮一斤帶白陳皮半斤酒當歸身半斤木通三兩每帖研桃仁九粒盡此劑病悉除一婦人年五十餘歲素好怒因食燒豬肉次早面脹絶不思食倦怠六脈沉澀獨左豁大余作體虛有痰氣為痰所隔不得降當以補虛利痰為主每早以二陳湯加參術大劑與一帖服後探令吐出藥辰巳時復與索氏三和湯一倍加白朮二帖至睡後以神佑七丸以撓其痰去牽牛如此服至一月而安矣金壽一安人年七十一歲好濕面得帶下病亦惡寒淋瀝醫與荷花須柴胡等藥發熱所下愈多醫與縮砂豆蔻藥以其食少也腹滿脹氣喘又與葶藶散不應又與禹餘糧丸病愈甚醫又與崇土散亦不應豫脈之兩手洪澀輕則弦長而滑實至是喘甚不得臥此不是濕而釀成濕在足太陰陽明二經水穀之氣為濕所抑不得上升遂成帶下理用升舉之劑以補氣和血吹之而醫反與澀燥宜其展轉身病遂與人參生肺之陰以拒火毒白朮以補胃氣除濕熱行水道桃仁去汙生新郁李仁行積水以通草佐之犀角屑解食毒消腫悶檳榔治最高之氣作濃湯吞下保和丸藥又疑素厚養有肉積加阿魏小丸同咽之四五日後積氣漸消腫漸下又加補腎丸以生腎水之真陰又兩三日後漸安而得睡食有味矣又兩日後加與點丸以驅逐肺家之積熱而愈一丈夫脾有熱腎有虛胃有積得腫疾或進或退口乾或氣喘醫連月不退脈軟而細以其形肥不以為忌用白朮四錢芍藥地黃三錢連翹當歸二錢青皮二錢半人參木通羌活黃芩各一錢半甘草紅花些上分五帖煎下保和丸楊生年三十因瘧初安淡食豆腐齋飯成脹在膈上小便赤少不思食口渴脈弦而澀此胃中有瘀血用蘇梗三分木通半錢白朮一錢半川芎枳實白芍各五分甘草二分炙陳皮五分厚朴三分上研益元散下保和丸五十粒一丈夫氣上肚或膨脹此下虛所致陳皮五錢人參歸鬚白朮連翹各三錢地黃芍藥各二錢木通一錢半甘草五分上分五帖煎下保和丸木香化滯湯白豆蔻仁陳皮大腹子白茯苓砂仁人參各一錢青皮檳榔木香薑黃各二錢白朮一錢甘草炙四分白檀二分藿香葉二分桔梗五分上為細末水一大盞二分煎至一盞稍熱服食前沸湯點服亦得上方治因積滯成脹皆以參朮朴通等煎湯補虛行濕下神佑阿魏等丸消積所謂攻補兼施者也小溫中丸治脹是脾虛不能運化不可下之陳皮半夏湯泡去皮臍神麯炒茯苓各一兩白朮二兩香附子不要烘曬針砂各一兩半醋炒紅苦參炒黃連炒各半兩甘草三錢上為末醋水各一盞打糊為丸如桐子大每服七八十丸白朮六錢陳皮一錢生薑一片煎湯吞下虛甚加人參一錢各用本方去黃連加厚朴半兩忌口病輕者服此丸六七兩小便長病甚者服一斤小便始長無禹餘糧丸治十種水氣腳膝腫上氣喘滿小便不利但是水氣悉皆主之許學士及丹溪皆云此方治膨脹之要藥蛇含石大者三兩以新鐵銚盛入炭火中燒蛇黃與銚子一般紅用鉗取蛇黃傾入醋中候冷取出研極細禹餘糧三兩真針砂五兩先以水淘淨炒乾入禹餘糧一處用米醋二升就銚內煮醋乾為度後用銚並藥入炭中燒紅鉗出傾藥淨磚地上候冷研細以三物為主其次量人虛實入下項治水多是取轉惟此方三物既非大戟甘遂芫花之比又有下項藥扶持故虛人老人亦可服羌活木香茯苓川芎牛膝酒浸桂心白豆蔻炮大茴香炒蓬朮炮附子炮乾薑炮青皮京三稜炮白蒺藜當歸酒浸一宿各半兩上為末拌勻以湯浸蒸餅捩去水和藥再搗極勻丸如桐子大食前溫酒白湯送下三十丸至五十丸最忌鹽一毫不可入口否則發疾愈甚但試服藥即於小便內旋去不動臟腑病去日三服兼以溫和調補氣血藥助之真神方也丹脈堅實人壯盛者或可用攻藥便收拾白朮為主垣中滿治法開鬼門潔淨府開鬼門者發汗也潔淨府利小便也又中滿者瀉之於內謂脾胃有病當令上下分消其氣下焦如瀆氣血自然分化不待泄滓穢如或大實大滿大小便不利從權以寒熱藥下之或傷酒濕面及味厚之物膏粱之人又或食已便臥使濕熱之氣不得施化致令腹脹滿此亦是熱脹也治熱脹分消丸主之仲氣分心下堅大如盤邊如旋杯水飲所作桂枝去芍加麻辛附子湯主之桂枝生薑三兩甘草一兩大棗十二個麻黃細辛各二兩附子一個炮上七味以水七升煮麻黃去上沫內諸藥煮取二升分溫三服當汗出如蟲行皮中即愈聖牛黃琥珀丸治水腫腹大氣息不通危急者神效牛黃琥珀椒目沉水者葶藶炒紫色各三分昆布洗炙海藻洗炙各一兩一錢牽牛炒桂各一兩上七味為末另研葶藶如泥一處拌勻煉蜜丸如桐子大每服十五丸米飲下以小便利為度日再服河間方有麝香龍膽無琥珀易名苦葶藶膏治法與此方同仲腹滿口舌乾燥此腸胃間有水氣防己椒藶丸主之防己椒目葶藶炙大黃各一兩上四味末之蜜為丸如桐子大先食飲服十丸日三服稍增口中自有津液渴者加芒硝五錢無葶藶丸治腫滿腹大四肢枯瘦小便澀濁甜葶藶隔紙炒薺菜根等分上為末蜜丸如彈子大每服一丸陳皮湯嚼下只三丸小便清數丸當依舊以上葶藶椒目行濕羅白丸子治單腹脹神效方見水脹門潔治水氣蠱脹潔淨府楮實子丸楮實子一斗水二斗熬成膏子白丁香一兩半茯苓三兩上二味為末用楮實膏為丸如桐子大不計丸數從少至多服至小便清利及腹脹減為度次服中治丸末治藥調養疏啓其中忌甘苦峻補其下宜五補七宣丸白丁香為行濕之劑中治丸即白朮散用白朮澤瀉等分以為末茯苓煎湯調下末治即黃耆建中之類方並見水腫門世治蠱用蝦蟆一枚去內腸入螻蛄七個新瓦上焙乾為末丸酒服如無螻蛄用縮砂七粒本草云蝦蟆味辛寒有毒主邪氣破瘕堅素黃帝問曰有病心腹滿旦食則不能暮食此為何病岐伯對曰名為鼓脹帝曰治之奈何岐伯曰治之以雞矢醴一劑知二劑已帝曰其時有復發者何也岐伯曰此飲食不節故時有病也雖然其病且已時故當病氣聚於腹也腹中論王注雞矢大利小便微寒用湯漬服之潔古云以酒調服無五積久必心腹脹滿肝為肥氣心為伏梁肺為息奔脾為痞氣腎氣奔豚如斯之類從五積法治之可也丹朱恕八哥肚腫因濕氣起自五月能飲酒左脅有塊兩足時有腫白朮三稜醋炒木通陳皮大腹皮赤茯苓海金沙各五分甘草二分炒朴五分肉桂三分煎湯下保和丸三十溫中丸三十抑青丸十丸垣廣朮潰堅丸治中滿腹脹內有積堅硬如石形如盤令人坐臥不寧大小便澀滯為喘氣促面色痿黃厚朴五分生黃芩五分黃連六分草豆蔻五分益智五分半夏七分蓬朮二分甘草生紅花一錢柴胡升麻吳茱萸澤瀉各二分神麯三分歸梢五分青皮二分陳皮一分葛根四分治虛渴上銼如麻豆大水二盞煎至一盞去渣稍熱服忌酒面二服之後中滿減半止有積不消再立方名曰半夏厚朴湯厚朴八分半夏一錢吳茱萸肉桂紅花黃連各一分桃仁七分蘇木五分京三稜蒼朮白朮柴胡葛根不渴不用甘草生各三分歸梢豬苓乾薑升麻各四分草豆蔻二錢澤瀉六分木香青皮陳皮黃芩生各二分昆布少神麯上銼如麻豆大作一服依前煎服之禁忌如前服此藥二服後前證又減一半卻於前藥中加減之厚朴五分黃芩二分甘草炙五分吳茱萸一分益智二分砂仁一分豆蔻三分半夏四分黃耆四分紅花少歸梢一錢黃連一分上銼如麻豆大作一服水二大盞煎至一盞去渣稍熱服食前忌苦寒藥泄大便又忌魚兔肉並鹽物房事等項丹心腹膨脝內多食積所致南星一兩半半夏栝蔞仁研和爛各一兩香附童便浸黃連薑炒各二兩礞石硝煅蘿蔔子五錢麝香少連翹五錢上用麵糊為丸腹腫不寬滿食肉多黃連一兩阿魏半兩醋浸擂細作糊丸同溫中丸白朮湯送下食肉多腹脹用三補丸料內加香附半夏曲蒸餅丸服三補方見治寒熱世四炒枳殼丸治氣血凝滯腹內蠱脹枳殼四兩去穰切作指面大塊分四處一兩用蒼朮一兩同炒黃去蒼朮一兩用蘿蔔子一兩同炒黃去蘿蔔子一兩用乾漆一兩同炒黃去幹漆一兩用茴香一兩同炒黃去茴香止用枳殼為細末上用原炒蒼朮蘿蔔子乾漆茴香四味同水二碗煎至一碗去渣煮麵糊為丸如桐子大每服五十丸食後米飲下孫殿中丞某郎中妹十歲腹痛色不變按之而大陷心腹痞膈病已月餘按甲乙經云三焦脹者氣滿於皮膚中殼然石堅遂與仲景方厚朴生薑二兩半夏七錢甘草半兩人參一錢每用藥一兩五錢水煎分三服一日服之至二十日愈潔棗一斗置鍋內入水約四指用大戟並根苗蓋遍盆合之煮熟為度去大戟不用旋旋吃棗無時棗盡決效如神丹大戟為末棗肉丸每七丸泄利小水劫快實者垣沉香交泰丸治脹大便燥結脈沉之洪緩浮之弦者沉香白朮各三錢枳實炒一錢厚朴薑製五錢茱萸湯泡白茯苓澤瀉陳皮當歸各二錢大黃酒浸一兩青皮木香各二錢上為細末湯浸蒸餅為丸桐子大每服五十丸加至七八十丸溫湯下食後微利止沉香海金沙丸治一切積聚脾濕腫脹肚大青筋羸瘦惡證海金沙五錢半沉香二錢輕粉一錢牽牛末一兩上為末研獨科蒜如泥為丸如桐子大每服三十丸加至五十丸煎百沸燈心通草湯空腹送下更量虛實加減丸數取利為度潔治腫木香散治水腫脹大如鼓或遍身皆腫木香大戟白牽牛各等分上細末用豬腰子一雙批片摻末在內煨熟空心服之如食左腰子則拓左臂如食右腰子拓右臂如腫不能全去於肚上繞臍滿腹塗甘遂細末卻飲甘草水少許其腫便去也竹香棗丸治蠱氣病有十種苦丁香為細末用熟棗為丸如桐子大每服三十丸煎棗湯送下空心服之立效三服大愈仲病腹滿發熱十日脈浮而數飲食如故厚朴七物湯主之厚朴半斤甘草大黃各三兩大棗十枚枳實五個桂枝三兩生薑五兩上七味以水一斗煮取四升溫服八合一日三服嘔者加半夏五合下利去大黃寒多者加生薑至半斤上下脹諸方蓋本於經所謂泄之則脹已之旨也丹治脹專主濕熱治法見前補虛行濕條垣諸腹脹大皆屬於熱論此乃八益之邪有餘之證自天外而入感風寒之邪自表傳裡寒變為熱作胃實腹病日晡潮熱大渴引飲譫語是太陽陽明並大實大滿者大承氣湯下之少陽陽明微滿實者小承氣湯下之內經曰泄之則脹已此之謂也又熱論云傷寒變為熱故下之不脹者以明寒因寒用故曰下之脹已非陰盛生內寒胃寒脹滿之病假令痎瘧為脹滿亦有寒脹熱脹是天之邪氣傷暑而得之不即時發至秋髮者何也暑天當時助正氣故邪不能發至秋暮暑氣衰絶而瘧病作矣知其寒也局方用交解飲子者是也此天之邪氣雖有餘病痎瘧猶以為寒況不足病為脹滿者乎是知腹脹多為寒病也何以言之脈經云胃中寒則脹滿靈樞經云夫飲食不節起居不時末傳寒中又云腹脹滿胃脘當心而痛上支兩脅膈咽不通飲食不下取胃之三里又云濁氣在上則生䐜脹靈樞經云脹取三陽三陽者足太陽膀胱寒水為脹與內經通評虛實論説腹暴滿按之不下取足太陽經絡者胃之募也正同又云腹滿䐜脹支膈胠脅下厥上冒過在太陰陽明此乃胃中寒熱鬱遏也又云太陰之厥則腹滿䐜脹後不利不欲食食則嘔不得臥按內經所説寒脹多如此老夫但略舉其端其病者不悟寒脹之多一切脹滿病作熱治之多用三花神佑丸大黃牽牛之類下之或藥病不相應立致夭折由是論之當從靈樞素問乎當從俗醫胸臆之論乎今立治中滿䐜脹寒脹一方熱脹一方評而用之使上下分消其氣可也中滿分消湯治寒脹分消丸治熱脹二方並見後條靈胃中寒則腹脹胃中寒腸中熱則脹而且泄師傳篇適寒涼者脹下之則脹已五常政論東垣沉香海金沙丸方見脈實篇陰並於下則足寒足寒則脹也厥論垣濁氣在上則生䐜脹陰陽應象論云清氣在下則生飧泄濁氣在上則生䐜脹此陰陽反作病之逆從也夫䐜脹者以寒熱溫涼論之此何脹也曰此飲食失節為脹乃受病之始也濕熱亦能為脹右關脈洪緩而沉弦脈浮於上是風濕熱三脈相合而為病也是脾胃之令不行陰火亢甚乘於脾胃盛則左遷而陽道不行是六腑之氣已絶於外火盛能令母實風氣外絶風氣外絶者是穀氣入胃清氣營氣不行便是風氣也異呼同類即胃氣者是也經云虛則兼其所勝土不勝者肝之邪也是脾胃之土不足木火大勝者也經云濁陰出下竅濁陰走五臟濁陰歸六腑濁陰歸地此平康不病之常道反此則為脹也陰陽論云飲食不節起居不時者陰受之陰受之則入五臟入五臟則䐜脹閉塞調經篇云下脘不通則胃氣熱熱氣熏胸中故內熱下脘者幽門也人身之中上下有七衝門皆下衝上也幽門上衝吸門吸門者會厭也沖其吸入之氣不得下歸於腎肝為陰火動相拒故咽膈不通致濁陰之氣不得下降而大便乾燥不行胃之濕與客陰之火俱在其中則腹脹作矣治在幽門使幽門通利泄其陰火潤其燥血生益新血幽門通利則大便不閉吸門亦不受邪其膈咽得通䐜滿腹脹俱去是濁陰得下歸地矣故經曰中滿者瀉之於內此法是也沉香交泰丸治濁氣在上中擾清陽之氣鬱而不伸以為腹脹服之以利為度方見前上治脈洪便結而脹範天秩郎中之內八月中先因勞役飲食失節加之憂思氣結病心腹脹滿旦食則不能暮食兩脅刺痛診其脈弦而細至夜濁陰之氣當降而不降䐜脹尤甚大抵陽主運化飲食勞倦損傷脾胃陽氣不能運化精微聚而不散即為脹滿先灸中脘乃胃之募穴引胃中生髮之氣上行陽道後以順氣湯助之則濁陰之氣自此而降矣木香順氣湯治濁氣在上則生䐜脹木香蒼朮草豆蔻麵裹煨各三分厚朴制四分青皮一錢益智陳皮澤瀉白茯苓去皮半夏乾薑吳茱萸湯泡各二分當歸人參各五分升麻柴胡去蘆各一分內經曰留者行之結者散之以柴胡升麻之苦平行少陽陽明二經發散清氣運行陽分為君以生薑半夏草豆蔻益智仁之甘辛大熱消散中寒為臣以厚朴木香蒼朮青皮之辛苦大溫通順滯氣以陳皮當歸人參辛甘溫調和榮衛滋養中氣濁氣不降宜以苦泄之吳茱萸之苦熱泄之者也氣之薄者為陽中之陰茯苓甘平澤瀉鹹平氣薄引濁陰之氣自上而下故以為佐氣味相合散之泄之上之下之使清濁之氣各安其位也上㕮咀都作一服水二盞煎至一盞去渣溫服食前忌生冷硬物上治脈弦細脅痛而脹中滿分消湯治中滿寒脹寒疝大小便不通陰躁足不收四肢厥逆食入反出下虛中滿腹中寒心下痞下焦躁寒沉厥奔豚不收二服愈黃耆五分益智半夏各三分川烏一分吳茱萸草豆蔻各五分人參木香青皮當歸黃連各二分厚朴五分茯苓澤瀉生薑麻黃不去節各二分升麻三分柴胡梢乾薑蓽澄茄各二分黃柏五分上銼如麻豆大作一服水二盞煎至一盞去渣稍熱服食前大忌房勞酒面生冷硬物油膩丹治大人小兒因食果子多而腹脹氣急者肉桂細米飯丸緑豆大每服十丸小兒五粒熱水下經驗方垣靈樞經云腹滿大便不利上走胸臆喘息喝喝然取足少陰取者瀉也宜以辛熱散之良薑肉桂益智草豆蔻仁厚朴升麻甘草獨活使黃柏少許引用又方桂枝桔梗人參青皮少許陳皮良薑白朮澤瀉吳茱萸四肢濕腫宜繆刺先瀉其血結後調其真經謂刺去其血結是也千治心腹脹滿短氣以草豆蔻一兩去皮為細末生薑湯調下五分垣太陰所至為蓄滿辨云脾為陰中之太陰又云脾為陰中之至陰乃為坤元亙古不遷之土天為陽火也地為陰水也在人則為脾同陰水之化脾有餘則腹脹滿食不化故無陽則不能化五穀脾盛乃大寒為脹滿故脈經云胃中寒則脹滿大抵此病皆水氣寒濕為之也治宜大辛熱之劑必愈然亦有輕重木香塌氣丸治中滿腹脹下焦虛損者蘿蔔子炒陳皮去白各五錢胡椒二錢草豆蔻麵裹煨木香青皮各一錢蠍梢去毒二錢半上為細末水調為丸如桐子大每服三十丸溫米飲下忌油膩服白粥百日重者一年小兒丸如麻子大桑白皮湯下十丸日三服大人陰囊洪腫冰冷須用青鹽乾薑白麵各三錢水和膏攤紙上塗貼諸脹腹大皆為熱全文見診諸病有聲鼓之如鼓皆屬於熱垣中滿分消丸治中滿熱脹鼓脹氣脹水氣脹大熱脹有寒者不治黃芩炒黃連各五錢炒薑黃白朮人參去蘆甘草炙豬苓去皮各一錢白茯苓去皮砂仁各二錢枳實炒黃半夏湯泡各五錢乾薑二錢厚朴去皮炒一兩知母炒四錢澤瀉二錢陳皮三錢上共為細末水浸蒸餅為丸如桐子大每服一百丸焙乾白湯下食後寒因熱用故焙服丹有第二小娘食積挾濕手足生瘡腹滿面浮口渴食少膈滿小便少大便實大腹皮乾葛各二錢黃芩五錢陳皮五錢厚朴三錢川芎三錢炙甘一錢白朮一兩木通半兩薑三片煎服南二孺人面浮肚脹蒼朮五錢黃柏三錢炒白朮兩半陳皮一錢木通二錢川芎五分滑石炒錢半甘草二錢炙厚朴五分裴孺人年五十二歲氣上膈滿食少此積熱生濕診得左三部澀小右三部微數重取稍大喜得無弦脈為可治之病白朮一兩青皮三錢陳皮厚朴各五錢大腹皮二錢片芩炒木通五錢蘇梗川芎各三錢桂枝三錢甘梢一錢半分十帖薑二片煮飲之煎渣之湯下保和三十丸經患腹脹滿夯悶掘山梔根少許煎水調一盞服女人血氣腹腫以山梔根末三錢熱酒空心服之仲寸口脈遲而澀遲則為寒澀則為血不足跗陽脈微而遲微則為氣遲則為寒寒氣不足則手足逆冷手足逆冷則營衛不利營衛不利則腹滿腸鳴相逐氣轉膀胱榮衛俱勞陽氣不通即身冷陰氣不通即骨寒陽前通則惡寒陰前通則痹不仁陰陽相得其氣乃行大氣一轉其氣乃散實則失氣虛則遺尿名曰氣分氣分謂氣不通利而脹血分謂血不通利而脹非脹病之外又別有氣分血分之病也蓋氣血不通利則水亦不通利而尿少尿少則腹中水漸積而為服但氣分心下堅大而病發於上血分血結胞門而病發於下氣分先病水脹後經斷血分先經斷後病水脹也血分治法見水腹脹門腹滿䐜脹支膈胠脅下厥上冒過在足太陰陽明全文見治虛實條素太陰所謂病脹者太陰子也十一月萬物氣皆藏於中故曰病脹脈解篇上脾胃脹治法見前補虛行濕條諸方是也腎氣實則脹全文見治虛實條二陰一陽發病善脹心滿善氣全文見診病傳變運氣脹有七一曰濕助脾盛而脹經云諸濕腫滿皆屬脾士又云歲土太過甚則飲食中滿又云歲土不及濕乃大行民病腫滿又云土鬱之發民病心腹脹滿腸鳴又云太陽司天寒氣下臨濕氣變物水飲內蓄中滿不發甚則胕腫治以諸熱是也二曰風攻脾虛而脹經云厥陰在泉風淫所勝病腹脹治以辛涼是也三曰寒脹經云水太過曰流衍流衍之紀其病脹又云歲水太過寒氣流行甚則腹大脛腫又云水鬱之發民病痞堅腹滿又云太陽之勝皮膚痞腫腹滿又云太陰司天之政民病寒濕腹滿身䐜胕腫三之氣感於寒濕民病胕腫胸腹滿治以諸熱是也四曰燥脹經云陽明之復腹脹而泄治以溫劑是也五曰寒鬱熱於中而脹經云陽明司天之政初之氣寒雨化其病中熱脹又云太陽司天之政二之氣大涼反至火氣遂抑民病氣鬱中滿是也六曰寒熱相搏而脹經云少陰司天之政水火寒熱接於氣交民病腹脹大又云太陰司天之政四之氣寒風曉暮蒸熱相搏民病心腹滿熱臚脹甚則胕腫是也七曰火鬱之發脹經云火鬱之發民病脅腹胸背面首四肢䐜膹臚脹是也梅治腹滿不能服藥導引方取獨蒜煨熟去皮納下部冷即易靈黃帝曰脈之應於寸口如何而脹岐伯曰其脈大堅以澀者脹也黃帝曰何以知臟腑之脹也岐伯曰陰為臟陽為腑黃帝曰夫氣之令人脹也在於血脈之中耶臟腑之內乎岐伯曰二者皆存焉然非脹之舍也黃帝曰願聞脹之舍岐伯曰夫脹者皆在於臟腑之外排臟腑而郭胸脅脹皮膚故命曰脹黃帝曰臟腑之在胸脅腹裡之內也若匣匱之藏禁器也各有次舍異名而同處一域之中其氣各異願聞其故岐伯曰夫胸腹臟腑之郭也膻中者心主之宮城也胃者太倉也咽喉小腸者傳送也胃之五竅者閭里門戶也廉泉玉英者津液之道也故五臟六腑者各有畔界其病各有形狀黃帝曰願聞脹形岐伯曰夫心脹者煩心短氣臥不安甲乙經云心輸主之亦取列缺肺脹者虛滿而喘咳甲乙經云肺輸主之亦取太淵肝脹者脅下滿而痛引小腹甲乙云肝俞主之亦取太衝脾脹者善噦四肢煩悗體重不能勝衣臥不安甲乙云脾俞主之亦取太白腎脹者腹滿引背央央然腰髀痛甲乙云腎俞主之亦取太溪胃脹者腹滿胃脘痛鼻聞焦臭妨於食大便難甲乙云中脘主之亦取章門大腸脹者腸鳴而痛濯濯冬日重感於寒則飧泄不化甲乙云天樞主之小腸脹者少腹䐜脹引腰而痛甲乙云中窖主之膀胱脹者少腹滿而氣癃甲乙云曲骨主之三焦脹者氣滿於皮膚中輕輕然而不堅甲乙云石門主之膽脹者脅下痛脹口中苦善太息甲乙云陽陵泉主之凡此諸脹者其道在一明知逆順針數不失瀉虛補實神去其室致邪失正真不可定粗之所敗謂之天命補虛瀉實神歸其室久塞其空謂之良工黃帝曰脹者焉生何因而有岐伯曰衛氣之在身也常然並脈循分肉行有逆順陰陽相隨乃得天和五臟更始四時循序五穀乃化然後厥氣在下榮衛留止寒氣逆上真邪相攻兩氣相搏乃合為脹也榮氣循脈衛氣逆為脈脹衛氣並脈循分為膚脹三里而瀉近者一下遠者三下無問虛實工在疾瀉榮衛循脈至此三十九字原誤在病各有形之下黃帝曰願聞之上有三里而瀉之上當有脫簡甲乙云凡五臟六腑之脹皆取三里三里者脹之要穴也黃帝曰善何以解惑岐伯曰合之於真三合而得帝曰善黃帝曰脹論言無問虛實工在疾瀉近者一下遠者三下今有其三而不下者其過焉在岐伯曰此言陷於肉肓而中氣穴者也不中氣穴則氣內閉針不陷肓則氣不行上越中肉則衛氣相亂陰陽相逐其於脹也當瀉不瀉氣故不下三而不下必更其道氣下乃止不下復始可以萬全烏有殆者乎其於脹也必審其脈當瀉則瀉當補則補如鼓應桴惡有不下者乎脹論篇刺灸脹有七法其一取血絡經云膚脹先取脹之血絡是也其二取胃經前篇脹論所謂三里而瀉近者一下遠者三下無問虛實工在疾瀉是其一法也又云胃者水穀之海其輸上在氣街下至三里水穀之海有餘則腹滿審守其輸調其虛實又云胃病者腹䐜脹取之三里也又云胃足陽明之脈是動則病賁響腹脹胃中寒則脹滿視盛虛熱寒陷下取之是脹病大法皆瀉胃穴三里也其三取脾經云腹滿食不化腹響響不能大便取足太陰又云脾足太陰之脈是動病腹脹嘻噫視盛虛熱寒陷下取之又云脾虛則腹滿腸鳴飧泄取其經太陰陽明少陰血者又云足太陰之別名曰公孫去本節之後一寸別走陽明其別者入絡腸胃虛則鼓脹取之所別也是脹之虛者多補足太陰脾穴也其四取腎膀胱經云腎病者腹大脛腫取其經少陰太陽血者又云腎藏志志有餘則腹脹飧泄瀉然筋血者又云邪在腎則病腹脹腰痛大便難取之湧泉崑崙是有血者盡取之又云腹滿大便不利腹大亦上走胸嗌喘息喝喝然取足少陰又云男子如蠱女子如阻身體腰脊如解不欲飲食先取湧泉見血是跗上盛者盡見血也又云脹取三陽是脹病多瀉腎經諸穴也其五取三焦委陽穴經云三焦病者腹氣滿小腹尤堅不得小便窘急溢則水留即為脹取委陽是也蓋不得小便則水無所泄其水溢出皮膚腫者為水其水留於腹中獨腹脹者為脹也其六取肺經云振寒灑灑鼓頷不汗出腹脹煩悗取手太陰是也其七取厥病成脹經云陽明之厥腹滿不得臥太陰之厥腹滿䐜脹少陰之厥腹滿心痛厥陰之厥少腹腫痛腹脹盛則瀉之虛則補之不盛不虛以經取之是也祕鼓脹之狀腹身皆大臍上下左右各刺二寸二分中脘通關三里手膚脹之狀空而不堅腹身盡腫按之陷而不起太白公孫復溜絶骨三里分水玉腹脹分水二寸半氣海三里三陰交人中腹脹並兩足有水內庭五分瀉灸臨泣三分瀉用香油抹穴可出一身之水摘腹暴脹按之不下中脘氣海三里世單蠱脹氣喘水分在分水旁各一寸半針入二寸半灸五十壯又法分水三里行間內庭右關氣海各灸二七壯東腹脹臍突缺盆中滿尻腰腫大敦天牖崑崙甲寒氣腹滿癃淫爍身熱腹中積聚疼痛衝門主之腹滿響響然不便心下有寒痛商丘主之腹脹善滿積氣關門主之腹中氣盛腹脹逆不得臥陰陵泉主之腹脹腸鳴氣上衝胸不能久立腹中痛濯濯冬日重感於寒則泄當臍而痛腸胃間遊氣切痛食不化不嗜食身腫俠臍急天樞主之腹中有大熱不安腹有大氣相和挾暴腹脹滿癃淫爍氣衝主之腹滿痛不得息正臥屈一膝伸一股並氣衝針入三寸氣至瀉之腸中寒脹滿善噫聞食臭胃氣不足腸鳴脹滿腹痛泄食不化心下脹三里主之大腸有熱腸鳴腹滿俠臍痛食不化喘不能久立巨虛上廉主之腹滿不嗜食衝陽主之寒腹滿脹厲兌主之男子如蠱女子如阻寒熱少腹偏腫陰谷主之胃中寒脹食多身體羸瘦腹中滿而鳴腹膜風厥胸脅搘滿嘔吐脊急痛筋攣食不下胃輸主之頭痛食不下腸鳴臚脹欲吐時泄注三焦俞主之腹滿臚脹大便泄意舍主之臚脹水腫飲食不下多寒胃倉主之腹滿不能食刺脊中寒中傷飽食飲不化五臟䐜滿脹心腹胸脅搘滿脈虛則生百病上脘主之腹脹不通寒中傷飽食飲不化中脘主之水腫水氣行皮中陰交主之水腫腹大水脹水氣行皮中石門主之腹滿胃中有熱不嗜食懸鐘主之素脈盛而緊曰脹平人氣象論脹論脈大堅以澀為脹唇偏舉者脾偏傾脾偏傾則善滿善脹全文見診腹脹身熱脈大是逆也如是者不過十五日死矣全文見診生死下同脹或兼身熱或兼如瘧狀皆不可治纍驗腹大脹四末清脫形泄甚是逆也如是者不及一時死矣腹脹便血其脈大時絶是逆也嘔咳腹脹且飧泄其脈絶是逆也少陰終者面黑齒長而垢腹脹閉上下不通而終矣太陰終者腹脹閉不得息善噫善嘔嘔則逆逆則面赤不逆則上下不通不通則面黑皮毛焦而終矣少腹脹滿臍下脹滿是也若先臍下滿漸延及臍上滿者亦用此法無澤漆湯治石水四肢瘦腹腫不喘其脈沉澤漆洗去腥五兩桑白皮射干洗浸黃芩茯苓白朮各四兩澤瀉防己各二兩上㕮咀每服五錢水三盞烏豆一合煎二盞入藥同煎七分去渣空腹溫服日三聖治腹堅脹滿號石水方用白石英十兩捶大豆大以甕瓶盛用好酒三斗浸以泥重封瓶口用馬糞及粳火燒之長令酒小沸從卯至午即住火候次日暖一中盞飲日可三度如吃酒少隨性飲之其白石英可更一度燒之素陰陽結邪多陰少陽曰石水少腹脹腎肝並沉為石水大奇論靈腎脈微大為石水起臍以下至小腹腄腄然上至胃脘死不治腸覃寒氣客於腸外與衛氣相搏氣不得榮因有所繫癖而內著惡氣乃起瘜肉乃生其始生也大如雞卵稍以益大至其成如懷子之狀久者離歲按之則堅推之則移月事以時下此其候也羅晞露丸治寒傷於內氣凝不流結於腸外久為癥瘕時作疼痛腰不得伸京三稜廣朮各一兩酒浸乾漆五錢洗去腥炒煙盡茴香三錢鹽炒硇砂四錢另研輕粉一錢另研川烏半兩炮去皮臍青皮去白三錢雄黃另研三錢穿山甲炮一錢麝香五分另研巴豆三十粒去皮同廣朮三稜炒令深黃色去巴豆不用上除另研四味外余為細末和勻生薑汁糊為丸桐子大每服二三十丸溫生薑湯送下溫酒亦得食前無烏喙丸治腸覃亦治乳余烏喙炮去皮尖一錢半夏湯洗四錢石膏煅藜蘆炒牡蒙茯苓酒浸桂心乾薑炮各一錢巴豆七個研膏上末蜜丸如緑豆大每服三五丸食後酒飲任下亦治男子疝病經云石瘕生於胞中寒氣客於子門子門閉氣不得通惡血當瀉不瀉衃以留止日以益大狀如懷子月事不以時下皆生於女子可導而下之聖見晛丹治寒客於下焦血氣閉塞而成瘕空大必不消者附子四錢炮去皮臍鬼箭羽三錢澤瀉肉桂玄胡索木香各二錢紫石英一錢檳榔二錢半血竭錢半另研水蛭炒一錢半煙盡桃仁湯浸去皮炒黃三十個京三稜銼五錢大黃銼碎二錢同京三稜酒浸一宿焙乾上除血竭桃仁外同為細末和勻用原浸酒打糊為丸桐子大每服十丸溫醋湯送下溫酒亦得食前無石英散治婦人血結胞門或為瘕瘕在腹脅間心腹脹滿腫急如石水狀俗謂之血蠱紫石英一兩歸尾馬鞭草各五錢紅花炒半兩烏梅肉五錢蓬朮炮三稜炮蘇木節沒藥琥珀研各一錢甘草一錢上為末濃煎蘇木酒調下二錢不飲酒薑湯調服脈問曰病有血分水分何謂也師曰經水前斷後病水名曰血分此病為難治先病水後經水斷名曰水分此病易治何以故去水其經自當下水分即氣分也仲寸口脈沉而遲沉則為水遲則為寒寒水相搏跗陽脈伏水穀不化脾氣衰則鶩溏胃氣衰則身體腫少陽脈卑少陰脈細男子則小便不利婦人則經水不通經為血血不利則為水名曰血分是也師曰寸口脈沉而數數則為出沉則為入出則為陽實入則為陰結跗陽脈微而弦微則無胃氣弦則不得息少陰脈沉而滑沉則為在裡滑則為實沉滑相搏血結胞門其瘕不瀉經絡不通名曰血分仲大黃甘遂湯治女人小腹滿如敦敦狀小便微難而不渴為水與血並結在血室也大黃四兩蒸甘遂炮阿膠炒各二兩上銼散每服三錢水一盞煎至七分去渣溫服其血當下無萬病丸治室女月經不通臍下堅結大如杯升發熱往來下痢羸瘦此為血瘕若生內瘕不可為也乾漆杵碎炒令出煙一時久牛膝酒浸一宿一兩六錢生地黃四兩八錢取汁上以地黃汁入下二味為末慢火熬候可丸即丸如梧子大空心米飲或溫酒下一丸日再勿妄加病去止藥女人氣血虛經不行者不可服之靈小腹滿大上走胃至心淅淅身時寒熱小便不利取足厥陰雜病篇甲石水痛引脅下脹頭眩痛身盡熱關元主之振寒大腹石水四滿主之石水刺氣衝石水章門及然谷主之又天泉主之世腸覃之狀內著惡氣乃起瘜肉大如雞卵日以益大其成也如孕推之則移中極氣衝天樞五福石瘕之狀生於胞中惡血不通日以益大如孕陰陵泉去胞中惡血復溜順骨刺下待腹溫方可去胎前腹脹産後腹脹大紫蘇飲治妊娠心腹脹滿而脅妨悶方見婦人胎逼上心門潔枳殼湯治婦人妊胎腹脹枳殼三兩黃芩一兩上為粗末每服五錢水盞半煎溫服治胎前腹滿身體沉重枳殼湯中加白朮一兩仲婦人懷妊六七月脈弦發熱其胎愈脹腹痛惡寒者小腹如扇所以然者子藏寒故也當以附子湯溫其臟附子湯方見傷寒婦人傷胎懷身腹滿不得小便從腰以下重如有水氣狀懷身七月太陰當養不養此心氣實刺瀉勞宮及關元小便微利則愈治産後血與惡露不下因而血脹用杜牛膝杵碎用水熬成膏去渣每服一碗未知再服神效子母産後穢汙不盡腹滿用麻子三兩酒五升煮取一升分溫二服當下惡物千治産後穢汙下不盡腹滿生薑二斤以水煮取汁服即出日華治産後血脹苗葉同功乃益母草子也保紫金丹治産後腫胸中有物狀是嗌氣不降代赭石𥓌礰石各等分按本草並無𥓌礰石止有礪石一名磨石即其能破宿血下石淋除癥結伏鬼物惡氣疑即是此上為細末醋糊丸桐子大每服三十五丸酒下胸中痛加川歸湯下久服治血癖大抵聖湯治産後腹脹滿悶嘔吐不定不可用尋常治脹止吐藥赤芍藥半夏澤蘭葉人參陳皮各一分甘草一錢上㕮咀用水一碗生薑焙乾五錢煎至半碗去渣分熱三服丹陽禮五孺人瘧産後腹滿略渴不飲脈卻虛白朮炒六錢陳皮五錢白芍炒極熟二錢半厚朴川芎各二錢每服加海金沙一錢分四帖煎下保和丸二十五粒大枳朮湯治虛後心腹大如盤方見脹門補虛條保又方代赭石一兩桃仁三十去皮尖大黃半兩上細末薄荷水調丸三五十丸溫水下無時治産後腹大堅滿不能臥白聖散樟柳根三寸大戟兩半甘遂半兩上細末每服二錢熱湯下取大府利為度此主水氣之妙藥也甲婦人産後余疾飲食不下胸脅支滿目眩足寒心切痛善噫聞酸臭脹痹腹滿小腹尤大期門主之
