body:
  text: 卷之三十六小兒部小兒通治錢五臟所主心主驚實則叫哭發熱飲水而搐虛則困臥悸動不安肝主風實則目直視大叫呵欠項急煩悶虛則咬牙多欠氣熱則外生風氣溫則內生風脾主困實則困睡身熱飲水虛則吐瀉生風肺主喘實則悶亂喘促有飲水者有不飲水者虛則哽氣長出氣短腎主虛無實也惟瘡疹腎實則黑陷更當別虛實證如肺病又見肝證咬牙多呵欠者易治肝虛不能勝肺故也若目直視大叫哭項急煩悶者難治蓋肺病久則虛冷肝強實而反勝肺也宜視病之新久虛實虛則補母實則瀉子肝病哭叫目直視呵欠煩悶項急心病多叫哭驚悸手足動搖發熱飲水脾病困睡泄瀉不思飲食肺病悶亂哽氣長出氣短氣喘急腎病目無精光畏明體骨重肺藏怯唇白色當補肺阿膠散主之若悶亂氣粗喘促哽氣者難治肺虛損故也脾肺病久則虛而唇白脾者肺之母也母子皆虛不能相營故名曰怯肺主唇唇白而光澤者吉白如枯骨者死此以唇診肺之法也唇白色者肺藏怯也阿膠散主之若手尋衣領及亂捻物者肝熱也宜瀉青丸手掐眉目鼻面者肺熱也宜甘桔湯之類是也心實心氣實則氣上下行澀若合面臥則氣不得通故喜仰臥使氣得上下通也瀉心湯主之心氣熱則合面臥實則仰臥也腎虛兒本虛怯由胎氣不成則神氣不足目中白睛多顱解囟開面色㿠白者皆為難養雖長不過八八之數若恣色欲不及四旬而亡或有因病而致腎虛者非也又腎不足則下竄蓋骨重惟欲墜下而身縮也腎者陰也腎氣虛則畏明皆宜補腎地黃丸主之心氣熱則上竄宜導赤散腎氣虛則下竄宜地黃丸是也肝病勝肺肝病秋見一作日晡肝勝肺也肺怯不能勝肝當補脾治肝益脾者母令子實故也補脾益黃散治肝瀉青丸主之肺病勝肝肺病春見一作早辰肺勝肝也肝怯故受病當補肝腎治肺補肝腎地黃丸治肺瀉白散主之五臟相勝輕重肝病見秋木旺肝勝肺也宜補肺瀉肝輕者肝病退重者唇白而死肺病見春金旺肺勝肝也當瀉肺輕者肺病退重者目淡青必發驚更有赤者當搐海藏云為肝怯故目淡青也心病見冬火旺心勝腎也當補腎治心輕者心病退重者下竄不語腎怯虛也腎病見夏水勝火腎勝心也當瀉腎輕者腎病退重者悸動當搐脾病見四旁皆仿此治之順者易治逆者難治脾怯當面赤目黃五臟相反隨證治之上五臟相勝病隨時令乃錢氏擴充內經藏氣法時論之旨實發前人所未發者也假如肝病見於春及早晨乃肝自病於本位也今反見於秋及日哺肺之位知肺虛極肝往勝之故當補脾肺瀉肝也余仿此凡病先虛或已經下有合下者必先實其母後瀉其子也假令肺虛而痰實此可下之症先當益脾後方瀉肺也瀉青丸又名瀉肝丸導赤散海藏云瀉丙小腸瀉心湯海藏云瀉丁心安神丸錢氏治心虛疳熱神思恍惚益黃散又名補脾散海藏云此劑補脾以燥濕東垣云錢氏益黃散治胃中寒濕嘔吐腹痛瀉利清白之聖藥也瀉黃散又名瀉脾散海藏云瀉脾熱阿膠散又名補肺散海藏云杏仁本瀉肺非若人參天門冬麥門冬之類也瀉白散又名瀉肺散海藏云治肺熱骨蒸自汗用此直瀉之梔子黃芩亦瀉肺當以氣血分之以上八方並見臟腑部治虛實法地黃丸海藏云治腎虛解顱即魃病也治脈毛而虛方見勞瘵潔熱則從心寒則從腎嗽而氣上從肺風從肝瀉從脾假令瀉兼嗽又氣上乃脾肺病也宜瀉白益黃散合而服之脾苦濕肺苦燥氣上逆也其症見瀉又兼面色黃腸鳴呦呦者宜服理中湯瀉而嘔者宜服茯苓半夏湯如瀉而渴熱多者宜服黃芩厚朴湯不渴而熱少者宜服白朮厚朴湯其他五臟若有兼症皆如此類推之更詳後論四時推移用藥心主熱自病或大熱瀉心湯主之實則煩熱黃連瀉心湯主之虛則驚悸生犀散主之肺乘心微邪喘而壯熱瀉白散主之肝乘心虛邪風熱煎大羌活湯下大青丸主之脾乘心實邪泄瀉身熱瀉黃散主之腎乘心賊邪恐怖惡寒安神丸主之肺主燥自病則喘嗽燥則潤之實則喘而氣盛瀉白散主之虛則喘而少氣先益黃散後阿膠散主之心乘肺賊邪熱而喘嗽先地黃丸中導赤散後阿膠散主之肝乘肺微邪惡風眩冒昏憒嗽羌活膏主之腎乘肺實邪憎寒嗽清利百部丸主之脾乘肺虛邪體重吐痰泄瀉嗽人參白朮散主之肝主風自病則風搐拘急肝苦急急食甘以緩之佐以酸苦以辛散之實則風搐力大瀉青丸主之虛則風搐力小地黃丸主之心乘肝實邪壯熱而搐利驚丸涼驚丸主之肺乘肝賊邪氣盛則前伸呵欠微搐法當瀉肺先補本臟補肝地黃丸主之瀉肺瀉白散主之脾乘肝微邪多睡體重而搐先當定搐瀉青丸主之搐止再見後症則別立法治之腎乘肝虛邪憎寒呵欠而搐羌活膏主之脾主濕自病則泄瀉多睡體重昏倦脾苦濕急食苦以燥之實則泄瀉赤黃睡不露睛瀉黃散主之虛則泄瀉色白睡露睛白朮散主之肝乘脾賊邪風瀉而嘔茯苓半夏湯主之心乘脾虛邪壯熱體重而瀉羌活黃芩蒼朮甘草湯主之肺乘脾實邪能食不大便而嘔吐嗽煎檳榔大黃湯下葶藶丸腎乘脾微邪惡寒泄瀉理中丸之類主之腎主寒自病則足脛寒而逆人之五臟惟腎無實小兒瘡疹變黑陷則是腎實水克退心火心乘腎微邪內熱不惡寒桂枝湯主之肺乘腎虛邪喘嗽皮澀寒百部丸主之肝乘腎實邪拘急氣搐身寒理中丸主之脾乘腎賊邪體重泄瀉身寒理中丸主之凡五臟虛弱是自己正令不行乃鬼賊之所克害當補本臟之正氣假令肺病喘嗽時於初春見之法當補腎見於夏救肺見於秋瀉肺見於冬補心瀉本臟又名寒嗽大抵五臟各至本位即氣盛不可更補到所克位不可更瀉潔古云五臟子母虛實鬼賊微正若不達旨意不易得而入焉在前者為實邪在後者為虛邪妻來乘夫為微邪夫來乘妻為賊邪本藏自病為正邪潔肝病面白肺病面赤脾病面青腎病面黃心病面黑若肝病驚搐而又加面白痰涎喘急之類此皆難治余仿此推之假令春分前風寒也宜用地黃羌活防風或地黃丸及瀉青丸相間服之春分後風熱也宜用羌活防風黃芩或瀉青丸導赤散下之立夏後熱也宜用三黃丸導赤散夏至後濕熱也宜用導赤散瀉黃散合而服之或黃芩人參木香之類秋分後用瀉白散立冬後用地黃丸主之謂腎不受瀉也海補肝丸四物湯內加防風羌活等分為細末煉蜜丸是也鎮肝丸瀉青丸去梔子大黃治肝虛瀉腎丸治脈洪而實前熟地改生地去山茱萸是也此治左手本部脈若右尺洪實以鳳髓丹瀉之此地黃丸即仲景八味丸去桂附若加五味子腎氣丸也此益肺之源以生腎水焉丹慈幼論人生十六歲以前血氣俱盛如日方升如月將圓惟陰長不足腸胃尚脆而窄養之之道不可不謹童子不衣裘帛前哲格言具在人耳裳下體之服帛溫暖甚於布者也裘皮服溫軟甚於帛者也蓋下體主陰得寒涼則陰易長得溫暖則陰暗消是以下體不與綿絹夾厚溫暖之服恐妨陰氣實為確論血氣俱盛食物異消故食無時然腸胃尚脆而窄若稠黏乾硬酸鹹甜辣一切魚肉水果濕面燒炙煨炒俱是發熱難化之物皆宜禁絶只與熟菜白粥非惟無病且不縱口可以養德此外生栗味鹹乾柿性涼可為長陰之助然栗太補柿太澀俱為難化亦宜少與婦人無知惟務姑息畏其啼哭無所不與積成痼疾雖悔何及所以富貴驕養有子多病逮至成人筋骨柔弱有食則不能忌口以自養居喪則不能食素以盡禮小節不謹大義亦虧可不慎歟至於乳母尤宜謹節飲食下咽乳汁便通情欲中動乳脈便應病氣到乳汁必凝滯兒得此乳疾病立至不吐則瀉不瘡則熱或為口糜或為驚搐或為夜啼或為腹痛病之初來其溺必少便須詢問隨證治母母安亦安可消患於未形也夫飲食之擇猶是小可乳母稟受之厚薄性情之緩急骨相之堅脆德行之善惡兒能速肖尤為關係古之胎教具在方册愚奚多贅若夫胎孕致疾事起茫昧人多玩忽醫所不知兒之在胎與母同體得熱俱熱得寒俱寒病則俱病安則俱安母之飲食起居尤當慎密不可不知也田大凡小兒過暖生熱熱極生風提抱生癰喂飼生癖最宜慎之錢大喜後食乳食多成驚癇大哭後食乳食多成吐瀉丹乳下小兒常多濕熱食積痰熱乃是傷乳為病小兒易怒肝病與脾病最多錢脈亂不治弦急氣不和沉緩傷食促急虛驚浮風沉細冷本候兒脈當以大指按三部一息六七至為平和八九至為發熱五至為內寒脈弦為風癇沉緩為傷食促急為虛驚弦急為氣不和沉細為冷浮為風大小不勻為惡候為鬼祟浮大數為風為熱伏結為物聚單細為疳勞凡腹痛多喘嘔而脈洪者為有蟲沉而遲潮熱者胃寒也溫之則愈訣曰小兒脈緊風癇候沉緩食傷多嘔吐弦急因知氣不和急促急驚神不守冷則沉細風則浮牢實大便應祕久腹痛之候緊而弦脈亂不治安可救變蒸之時脈必亂不治自然無過繆單細疳勞洪有蟲大小不勻為惡候脈沉而遲有潮熱此必胃寒來內寇瀉利脈大不可醫仔細酌量宜審究云岐子云未及五歲不可視聽者未可別脈五歲以上方可以脈別浮沉遲數按錢氏論又不拘五歲上下也嬰兒未可方脈者俗醫多看虎口中紋顏色與四肢冷熱取之亦有可驗豫作二歌紀之曰紫風紅傷寒青驚白色疳黑時因中惡黃即困脾端又冷熱症歌曰鼻冷定知是瘡疹耳冷因知風熱證通身皆熱是傷寒上熱下冷傷食病若能以色脈參伍驗之所得亦過半矣世百日內不治症發斑臍風撮口馬脾風龜背錢不治症目赤脈貫瞳人胸腫及陷鼻乾黑魚口氣急吐蟲不定瀉不定精神不好大渴不定止之又渴吹鼻不噴病重口乾不睡時氣唇上青黑點頰深赤如塗胭脂鼻孔開張喘急不定靈嬰兒病其頭毛皆逆上者必死論疾診尺篇脈小兒病困汗出如珠著身不流者死小兒病而胸陷口唇枯乾目直視口中氣冷足與頭相抵臥不舉身手足四肢垂其臥正直如縛掌中冷皆死至十日不可復治之錢病重面有五色不常不澤者死生下胎疾無小兒初生氣絶不能啼者必是難産或胃寒所致急以綿絮包裹抱懷中未可斷臍帶且將胞衣置爐炭中燒之仍捻大紙條蘸油點火於臍帶下熏之蓋臍帶連兒火熏時有火氣由臍入腹更以熱醋湯蕩洗臍帶須臾氣回啼哭如常方可洗浴了即斷臍帶海百壽散小兒初生未滿月已里用之者老無瘡疥黃連一兩硃砂一錢上水煎令老母拭去口涎淨灌下余藥傾盆中浴兒遍身搽妙又方淨黃連一錢水一盞預先煎下待兒生未出聲時便用灌下以去腹中惡物臍屎兼解胎中蘊積熱毒終身不生瘡又去臍風等病錢胎實面紅目黑睛多者善笑胎怯面黃目黑睛少白睛多者多哭更別父母肥瘦肥不可生瘦瘦不可生肥也胎肥者生下肌肉厚遍身血色紅滿月以後漸漸羸瘦目白睛粉紅色五心煩熱大便難時時生涎浴體法主之天麻二錢蠍尾去毒硃砂各五分烏蛇肉酒浸焙乾為末白礬各三錢麝香一字青黛三錢上研勻每用三錢水三碗桃枝一握並葉五七枚同煎至十沸溫熱浴之勿浴背胎怯者生下面無精光肌肉薄大便白水身無血色時時哽氣多噦目無精采亦宜以浴法主之世母氣不足則羸瘦而肉薄父精不足則解顱眼白多胎熱生下有血氣時時叫哭身壯熱如淡茶色目赤大便赤黃糞稠急釀乳浴法主之湯小兒在胎時因母有熱或恣食酒面熱毒之物傳於胎中令兒生下面赤眼閉身體壯熱哭聲不止口熱如湯乃胎熱之候也宜生地黃湯生地赤芍藥川芎當歸栝蔞根上件等分㕮咀每服半兩水一盞煎六分産婦亦可服以些抹入兒口中凡胎熱服藥不可求速效治法當釀乳漸解之若處以涼藥攻之必損脾胃加以嘔吐乃成大患宜服生地黃湯用釀乳小兒胎中有寒生下不能將護再傷於風其候面色青白四肢逆冷手足顫動口噤不開乃胎寒之故或寒氣乘虛入臟作腹疼盤腸內吊胎寒治法見寒腹痛條田月里生驚急取豬乳細研辰砂牛黃各少許調抹口中神效乳母服防風通聖散三劑其驚自消鬥治小兒未滿月驚搐似中風欲死者用辰砂以新汲水濃磨汁塗五心上最效湯治胎癇驚風皆可服全蠍頭尾全者用生薄荷葉包外以麻線纏火上炙燥為末別研生朱麝香各少許煎麥門冬湯調下小兒生下遍體面目皆黃狀如金色身上壯熱大便不通小便如柏汁乳食不思啼叫不止此胎黃之候凡有此症乳母宜服生地黃湯仍忌酒面五辛之物錢木瓜丸治小兒生下吐者因兒初生下拭口中穢惡不盡咽入喉中故吐木瓜丸主之凡初生急須拭掠口中令淨若啼聲一發則咽下多生諸病矣木瓜麝香膩粉木香檳榔各等分上同研細末麵糊丸如小黃米大每服一二丸甘草水下無時田月里生嘔先用硃砂丸下之如利後用朱沉煎墜其邪氣使穢物自下而不嘔也月里生赤肌膚如赤丹塗者先用牛黃散托裡續用藍葉散塗外乳母服清涼飲子三大劑上小兒初生下月里諸疾蓋胎毒之淺者若一二歲後所生之疾乃胎毒之深者宜權法治之垣李叔和一日問東垣曰中年來得一子至一歲後身生紅絲瘤不救後三四子至一二歲皆病瘤而死敢問何也曰豫試思之翌日見叔和曰吾得之矣汝腎中伏火精中多有紅絲以氣相傳生子故有此疾遇觸而動發於肌肉之間俗名胎瘤是也汝試視之果如其言遂與滋腎丸數服以瀉腎中火邪補天真之不足忌酒肉辛熱之物其妻以六味地黃丸養其陰血受胎五月後以白朮黃芩二味作散與服後生兒至三歲前症不復作矣叔和曰先生乃神醫也遂從受學其子今已年壯矣丹溪補遺謂小兒心氣鬱而多瘡疽由胎食過而受毒此至論也小兒識見未萌欲想未動心氣何郁先哲謂乳下小兒常多濕熱與胎食過而受毒又有成胎之時父母氣血有寒熱之偏多能致子之病況形體未堅完肓膜尚脆嫩何為略而未論向見一人連年痁病新愈而成一男生來三月病熱右腋下陽明少陽之間生一癤甫平左腋下相對又生一癤膿血淋漓無復生意醫者王壽甫以四物湯敗毒散加參以香附為佐犀角為使大料飲乳母兩月而安逾三月忽腹脹生赤疹如霞片取剪刀草汁調晚蠶砂敷之隨消半月脹移入胞囊為腫黃瑩可畏越兩日囊裂開兩丸顯露出清水以紫蘇葉承麩炭細末托之旬余而合夫以父之久病其母寧無憂鬱之火與痁之餘熱毒致此亦不可不知垣張進士次子二歲滿頭有瘡一日瘡忽自平遂患痰喘豫視之曰此胎毒也慎勿與解利藥衆皆愕然豫又曰乃母孕時所喜何物張曰辛辣熱物是其所喜因口授一方人參連翹川芎黃連甘草陳皮芍藥木通濃煎湯入竹瀝與之數日而安何以知之見其精神昏倦受病特深決無外感非胎毒而何豫之次女形瘦性急體本有熱懷孕三月適當夏暑口渴思水時發小熱遂教以四物加黃芩陳皮生甘草木通因懶於煎煮數帖而止其後生子二歲瘡疾遍身忽一日其瘡頓愈遂成痎瘧豫曰此胎毒也瘡若再作病必自安已而果然若於孕時確守前方何病之有丹鄭廉使之子年十六初生七個月患淋病五七日必一發其發則大痛水道狀如黍如粟者約一杯許然後定診其脈輕則澀重則弦視其形瘦而長其色青而蒼意其父必因多服下部藥遺毒在胎留於子之命門而然遂以紫雪和黃柏末丸桐子大曬極干熱湯下百丸以食物壓之又半日痛大作腰連腹水道乃行下如黍如粟者一大碗許其病減十分之八後又與陳皮一兩桔梗木通各半兩作一帖與之又下如黍粟者一合許而安父得燥熱且能病子況母得之者乎豫書此以證東垣紅瘤之事此亦熱在血分也陳氏女八歲時癇病遇陰雨則作遇驚亦作口出涎沫聲似羊鳴豫視之曰此胎受驚也其病深痼調治半年亦可安仍須淡味以佐藥功與燒丹丸繼以四物湯入黃連隨時令加減半生而安燒丹丸方原本未考按類萃用玄精石輕粉各一錢粉霜硼砂各五分研勻入寒食麵一錢滴水和成餅再用麵裹煨黃取出去面再研細滴水和丸如米大一歲五丸二歲十丸溫水送下取下惡物為度未知是否肝主風錢肝有風目連札不搐有熱則直視亦不搐得心熱則搐治肝瀉青丸治心導赤散凡病或新或久皆引肝風風動而上於頭目目屬肝風入於目上下左右如風吹不定兒不任故目連札也若熱入於目牽其筋脈兩眥皆緊不能轉視故目直視也若得心熱則搐其子母俱有實熱風火相搏故也治肝瀉青丸治心導赤散角弓反張錢肝有風甚則身反張強直不搐心不受熱當補腎治肝補腎地黃丸治肝瀉青丸丹溪云痓比癇為虛宜帶補多是氣虛有火兼痰用人參竹瀝治之不用兼風藥此論實發前人所未發湯氏雖云痓候十無一生蓋未嘗有此法施於人也明角弓反張鼻上入髮際三分灸三壯大椎下節間灸三壯湯身軟時醒者為癇身強直反張如弓不時醒者為痓痓候十無一生搖頭湯肝風搖頭諸方不載鄭都丞子患七年搖頭三年下血已服百餘方前後所服治搖頭者無非風藥止血者或作痢或作腸風百藥無效豫既視其病又知其詳亦不明其標本退而思之乃肝血液盛外有風熱乘之肝屬木盛而脾土為木所克脾與肺是子母俱為肝所勝而血遂漬於大便故便血不止遂處一方但損肝祛風而益脾初亦一時之見只數服而愈十餘日後血止而下白膿遂得以安犀角屑甘草各一分栝蔞根半兩蛇蛻皮一錢炙赤防風五兩鉤藤鉤子一錢麻黃去節一錢黃耆蜜炙半兩羌活白芍藥各半兩上為末棗肉丸食後薄荷湯下只二服作效頭搖即止便血隨愈次間服胃風湯數日頓除沈舍人子服之亦驗海食療云蛇脫皮主去風邪明目治小兒一百二十種驚癇寒熱痔蠱毒安胎熬用治癇弄舌搖頭者宜用全脫偏風錢全蠍散治小兒驚風中風口眼喎斜言語不正手足偏廢不舉全蠍去毒炒殭蠶直者炒川芎黃芩去心甘草桂枝赤芍藥麻黃去節各一兩天麻六錢大南星湯泡七次去皮臍切焙乾五錢上為粗末每服三錢水一鍾半薑七片煎七分溫服無時量大小與之一日三四服忌羊肉驚搐按驚搐一也而有晨夕之分表裡之異身熱力大者為急驚身冷力小者為慢驚仆地作聲醒時吐沫者為癇頭目仰視者為天吊角弓反張者為痓而治各不同也錢潮熱變發搐在早晨寅卯時者此肝用事之時也身體壯熱目上視手足動搖口內生熱涎項頸強急此肝旺也當補腎治肝補腎地黃丸治肝瀉青丸潔古云木之位肝旺也因潮熱發搐在巳午未時者此心用事之時也心惕目上視白睛赤色牙關緊急口內涎生手足動搖此心旺也當補肝治心治心導赤散涼驚丸補肝地黃丸潔古云火之位心熱也廣親宅七太尉方七歲潮熱數日欲愈錢謂父二大王曰七使潮熱將安八使預防驚搐王怒曰但使七使愈勿言八使病錢曰八使過來日午間即無苦也次日午前果作搐急召錢治之三日而愈蓋預見其目直視而腮赤必肝心俱熱更坐石杌子乃欲就冷此熱甚也又肌膚素肥盛而本實其脈急促故發搐克言午時者自寅至午皆心肝用事之時治之乃瀉心肝補腎自安矣因潮熱發搐在申酉戌時者此肺用事之時也不甚搐而喘目微斜視身熱如火睡露睛手足冷大便淡黃水是肝旺當補脾益黃散治肝瀉青丸治心導赤散潔古云脾病肝強法當補脾恐木賊害宜先瀉心肝以挫其強而後補脾為當徐氏子三歲病潮熱每日西則發搐身微熱而目微斜露睛四肢冷而喘大便微黃請錢與李同治錢問李曰病何搐也李曰有風何身熱微溫曰四肢所作何目斜睛露曰搐則目斜何肢冷曰冷厥心內熱曰何喘曰搐之甚也曰何以治之曰涼驚丸鼻中灌之必搐止錢又問曰既謂風病溫壯搐引目斜露睛內熱支冷及搐甚而喘並以何藥治之李曰皆此藥也錢曰不然搐者心肝實也身微熱者日西肺用事之時也肺主身溫今且熱者肺虛也目微斜露睛者肝肺相乘勝也四肢冷者脾虛也肺若虛甚則脾母亦弱木氣乘脾四肢即冷治之當先補脾肺用益黃散阿膠散得脾虛癥退然後治其心肝以瀉青丸導赤散涼驚丸治之九日愈因潮熱發搐在亥子丑時者此腎用事之時也不甚搐而臥不穩身體溫壯目睛緊斜視喉中有痰大便銀褐色乳食不消多睡不省當補脾治心補脾益黃散治心導赤散涼驚丸潔古云皆因大病後脾胃虛損多有此疾傷風發搐因傷風后得之口中氣出熱呵欠頓悶手足動搖當發散大青膏主之小兒生來怯弱者多此病也大青膏方見傷寒潔傷風發搐因傷風而得之症同大人傷風寒痰之類當辨有汗無汗陰陽二症用大青膏小續命之類開發則愈大青膏陰症小續命陽症也錢傷食發搐因傷食後得之身體溫多唾多睡或吐不思乳食而發搐當先定搐搐退白餅子下之後服安神丸潔傷食發搐謂不因他症忽然而搐此因飲食過度致傷脾胃故兒多睡多吐不思飲食脾胃既虛引動肝風則發搐當先定其搐加羌活防風煎下瀉青丸後用白餅子下其食漸漸用調中丸異功散養其氣錢百日內發搐真者不過兩三次必死假者頻發不為重真者內生驚癇假者外傷風冷蓋血氣未實不能勝任乃發搐也欲知假者口中氣出熱治之可發散大青膏主之及用塗囟浴體法李司戶孫百日病來搐三五次請衆醫治或作天吊或作胎驚或作驚癇皆無應者後錢氏用大青膏如豆許一服發之復與塗囟法及浴體法三日而愈何以然嬰兒初生肌骨嫩怯一被風傷遂不能任故發搐也然頻發者輕以客風在內每遇不任即搐輕則易歇故發頻也搐稀者是內臟發病不可救也頻搐者宜散風冷故用大青膏亦不可多服蓋兒至小易虛易實多即生熱止宜用下塗囟法麝香一字蠍尾去毒為末半錢薄荷半字蜈蚣炙牛黃青黛各一字上同研末用熟棗肉劑為膏新綿紙上塗勻貼囟上四旁可出一指許火上炙手頻尉百日裡外兒可用此塗囟法垣外物驚宜鎮平之以黃連安神丸若氣動所驚宜寒水石丸黃連安神丸黃連安神丸見燥條寒水石丸見治法按外物驚者元氣本不病故治以黃連安神之苦寒氣動驚者不因外物驚元氣自有病故治以寒水石安神之甘寒也錢鎮心丸涼心經治驚熱痰盛甜硝白者一兩人參一兩甘草炙寒水石燒各兩半山藥白者二兩白茯苓二兩硃砂一兩龍腦麝香各一錢三味另研凡急慢驚陰陽異證切宜辨而治之急驚合涼瀉慢驚合溫補上急驚症屬木火土實也木實則搐而力大目上目札所謂木太過曰發生其動掉眩癲癇是也火實則身熱面赤土實則不吐瀉睡合睛故其治法合涼瀉而用涼驚丸利驚丸之類慢驚症屬木火土虛也木虛則搐而力小似搐而不甚搐經所謂木不及曰委和其病搖動注恐是也謂手足搐動腹注泄心恐悸也火虛則身冷口氣冷土虛則吐瀉睡露睛故其治法合溫補而用羌活膏益黃散有熱者用東垣黃耆益黃散其東垣非錢氏羌活膏治慢驚者謂土虛泄瀉火木乘之謂手掌與腹俱熱之症若火木土俱虛而搖動恐悸注瀉手腹冷者非羌活膏不能治之丹急驚主痰熱當涼瀉之只用降火下痰養血之藥慢驚主脾虛所以多死先實脾土後散風邪只用硃砂安神丸更於血藥中求之如四物四君子東垣黃耆益黃散詳用錢急驚因聞大聲或大驚而發搐過則如故此無陰也當下利驚丸主之小兒急驚者本因熱生於心身熱面赤引飲口中氣熱大小便黃赤劇則發搐蓋熱甚則風生風屬肝此陽盛陰虛也故利驚丸主之以除其痰熱不可用巴豆及溫藥大下之恐搐虛熱不消也小兒熱痰客於心胃因聞大聲非常則動而驚搐矣若熱極雖不聞聲及驚亦自發搐潔急驚者陽症也俱腑受病熱痰客於心肺是少陽相火旺經云熱則生風因聞大聲而作蓋謂東方震卦得火氣而發搐火本不動焰得風而動當用利驚丸導赤散瀉青丸地黃丸搐止宜服安神丸閻急驚內有熱即生風又或因驚而發則目上連札潮涎搐搦身體與口中氣皆熱及其發定或睡起即了了如故此急驚症也當其搐勢漸減時與鎮心治熱之藥一二服如麝香丸鎮心丸抱龍丸辰砂丸紫雪之類候驚勢已定須臾以藥下其痰熱如利驚丸軟金丹桃枝丸之類利下痰熱心神安寧即愈丹大黑龍丸治小兒急驚神效方見後急慢驚治條小黑龍丸治小兒急驚輕者青礞石煅一兩青黛一錢蘆薈一錢半膽星一兩上為極細末甘草湯為丸如雞頭大每一丸薑蜜薄荷湯下上二方礞石膽星瀉濕痰之劑為君痰多者宜之錢涼驚丸草龍膽防風青黛研各三兩龍腦研一錢黃連末五分牛黃麝香各一字上為細末麵糊為丸如粟米大每服一二十丸金銀煎湯下之無治陽癇即急驚風硃砂研一分膩粉麝香各五分蘆薈白附子甘草各二錢胡黃連一錢蠍梢七個殭蠶蜜炙十條金箔七片赤腳蜈蚣炙一條上為末二歲以上服半錢匕金錢薄荷湯調下三歲一錢匕如口不開灌入鼻中錢利驚丸輕粉天竺黃青黛各一錢黑牽牛頭末半兩上同研蜜丸豌豆大一歲一丸溫薄荷湯下食後服海藏云涼驚溫驚利驚自有分別南星胭脂輕粉青黛色味各有輕重羅鎮肝丸治小兒急驚風目直上視抽搐昏亂不省人事是肝經風熱也天竺黃研生地當歸竹葉草龍膽川芎大黃煨羌活防風以上各二錢半上為細末煉蜜丸如雞頭大每服二丸砂糖水化下先服此後服天麻散上五方瀉肝木之劑為君前二方輕劑通用後三方峻劑必脈有力血氣實者宜之又閻氏所謂候搐勢定下其痰熱之類是已海五福丸治急驚風生蚯蚓一條研爛入五福化毒丹一丸再研如泥煎薄荷湯少許調化旋灌量兒大小加減服之無不效者錢五福化毒丹治驚熱涼心膈生地熟地焙各五兩天門冬麥門冬去心焙各三兩甜硝玄參甘草各二兩炙青黛一兩半上上六味為細末後研入硝黛煉蜜丸如雞頭大每服半丸或一丸食後熟水化下安神丸方見治法鎮心丸方見前表裡條上三方甘寒瀉火之劑為君小兒血氣虛而急驚者宜之又潔古閻氏所謂候搐止勢減宜安神鎮心之類是已錢慢驚因大病後或吐瀉或只吐不瀉變成脾胃虛損遍身冷口鼻氣出亦冷手足時瘛瘲昏睡露睛此無陽也栝蔞湯主之潔慢驚者陰證俱臟受病蓋小兒吐瀉病久脾胃虛損若不早治則成慢驚名曰瘛瘲似搐而不甚搐也因脾胃虛損故大便不聚當去脾間風先用宣風散導之後用益黃散使君子丸平之則其利自止既已失治則脾胃俱虛致被肝木所乘是為慢驚當用溫補羌活膏主之錢東都王氏子吐瀉諸醫用藥下之至虛變慢驚其候昏睡露睛手足瘛瘲而身冷錢曰此慢驚也與栝蔞湯其子胃氣實即開目而身溫王疑其子不大小便令諸醫以藥利之醫留八正散等數服不利而身復冷令錢氏利小便錢曰不當利小便利之必身冷一二日果身冷矣因抱出錢曰不能食而胃中虛若利大小便則脾胃俱虛當身冷而閉目即死今幸胎氣實而難衰也錢氏用益黃散使君子丸四服令微能飲食至日午果能飲食所以然者謂利大小便脾胃虛寒當補脾不可別攻也後又不語諸醫作失音治之錢曰既失音何開目而能飲食又牙不緊而口不噤也諸醫不能曉以地黃補腎錢曰此因用涼藥利小便至脾腎俱虛今脾已實腎尚虛故補腎必安治之半月而能言一月而痊栝蔞湯栝蔞二錢白甘遂末一錢上同於慢火上炒焦黃研勻每服一字麝香薄荷湯調服上栝蔞湯錢氏治慢驚法脈有力者宜用蓋濕痰積於膈中使風火不得開發而身冷故用栝蔞湯劫去濕痰使風火得伸而身溫搐止若脈無力者不宜用之便當補脾及溫白丸羌活膏之類閻青州白丸子治小兒驚風大人諸風半夏生七兩南星生三兩白附子生二兩川烏生半兩去皮臍上為末以生絹袋盛井花水擺出如未出者更以手揉出如有滓更研再入絹袋擺盡為度於瓷盆中日曬夜露至曉撇去舊水別用井花水攪又曬至來日早再換新水攪如此法春五日夏三日秋七日冬十日去水曬乾後如玉片研細以糯米粉煎粥清丸緑豆大每服三五丸薄荷湯下癱風酒下並無時錢氏異功散溫中和氣治吐瀉不思食方見吐瀉門海驚啼手足瘛瘲睡臥不穩四君子加全蠍去尾尖毒炒鉤藤白附子炒等分同煎方見治虛實法脾胃虛弱生風多困四君子加炒半夏曲沒石子等分為細末入冬瓜子少許同煎服錢溫白丸治小兒脾氣虛困泄瀉瘦弱冷疳洞利及因吐瀉或久病成慢驚瘛瘲天麻生半兩白殭蠶炒白附子生天南星銼湯洗焙乾各一兩乾蠍去毒一錢上為末湯浸寒食麵為丸如緑豆大仍於寒食麵中養七日取出用每服五七丸至二三十丸空心生薑米飲下量病勢漸加丸數服之寒食麵謂寒食日煮吃麵取之以焙乾貯用也鉤藤飲子治吐利脾胃氣弱虛風慢驚鉤藤三分蟬殼防風去蘆人參去蘆麻黃去節白殭蠶炒黃天麻蠍尾炒去毒各半兩甘草炙川芎各一分麝香一錢另研一方有蜣螂三個去頭足炙黃上為末每服二錢水一盞薑三片煎六分溫服量多少與之寒多者加附子半錢服無時羌活膏治脾胃虛或吐瀉後為慢驚者亦治傷寒無不效防風去蘆川芎人參去蘆白附子炮赤茯苓去皮各半兩天麻一兩白殭蠶湯浸炒黃乾蠍炒去毒白花蛇酒浸焙各一分川附炮去皮臍麻黃去節各三錢肉豆蔻沉香母丁香藿香葉木香各二錢輕粉真珠末牛黃各一錢半龍腦半字麝香辰砂雄黃各一錢以上七味各另研入羌活半兩上為細末煉蜜作劑旋丸如豆大每服一二丸食前服或薄荷湯或麥門冬湯化下實熱急驚勿服性溫故也海返魂丹治小兒諸癲癇潮發瘛瘲口眼相引項背強直牙關緊急目直上視及諸病久虛變生虛風多睡者因荏苒不解速宜服之荏苒柔弱也烏犀銼屑二兩水銀半兩天麻酒洗焙乾檳榔各半兩殭蠶去絲嘴微炒硫黃半兩研末入水銀置磁石盞內慢炒成沙火要看緊慢白附子炮川烏炒通赤留煙少許入碗內以一盞子蓋上新土圍之待冷取出獨活去蘆乾蠍炙萆薢炒各一兩肉桂去粗皮當歸酒浸焙乾炒細辛根防風去蘆天南星薑汁煮軟炒黃阿膠杵碎炒藿香洗去土烏蛇酒浸一宿炙熟去皮骨沉香槐膠羌活白花蛇酒浸一宿炙熟去皮骨麻黃去根節半夏薑汁浸三宿炒羚羊角鎊陳皮去白炒以上各一兩天竺黃研木香人參去蘆乾薑炮茯苓去皮蔓荊子去白皮晚蠶砂微炒敗龜板醋酒炙黃藁本去土桑螵蛸炒白芷何首烏米泔浸一宿煮焙虎骨酒醋塗炙黃砂仁白朮泔浸一宿切焙枳殼炒去白丁香厚朴去皮薑汁塗炙以上各三分蟬殼炒川芎附子水浸泡去皮尖石斛去根肉豆蔻去殼微炒龍腦另研雄黃研水飛硃砂研水飛以上各一兩膩粉另研麝香另研各一錢烏雞一隻去嘴翅足狐肝三具以上二味臘月內入瓦瓶固濟火煅赤候冷取出研用金箔三十片為衣上藥五十八味炮製如法煉蜜合和搗三五千下丸如桐子大金箔為衣每一歲兒溫薄荷自然汁化下無時上閻氏宗錢氏治慢驚法脈無力者宜之其法以青州白丸子兼異功散羌活膏溫白丸鉤藤飲子之類服之至有往往死中得生者今如其法又增入海藏四君子法次於異功散之後返魂丹次於羌活丸膏之後相參用之也湯凡吐瀉成虛風慢脾先用奪命散青州白丸子末煎如稀糊入蜜調控下涎後服祛風醒脾等藥奪命散方見後通治急慢驚下治虛風八仙散風盛者服之白天麻白附子花蛇肉防風南星半夏冬瓜子全蠍各等分加川烏上㕮咀每服一錢水半盞薑二片棗半枚煎二分熱服加薄荷尤佳醒脾散昏困者服之白朮人參甘草橘紅茯苓全蠍各半兩半夏木香各一分白附子炮四個南星炮兩枚陳倉米二百粒一方無白朮半夏加蓮肉一錢亦可上為末每服一錢水半盞薑二片棗半個煎二分漸漸服之不可頓服頓服必吐釀乳方人參木香藿香沉香橘皮神麯麥芽各等分丁香減半上㕮咀每服四錢水一碗薑十片紫蘇十葉棗三枚煎至半碗乳母食後須去乳汁盡方取服之即仰臥霎時令藥入乳之絡次令兒吮數口不可過飽此良法也如嘔定一日急宜截風服八仙散兩日後宜醒脾散如前件藥俱用不效危困可憂須診太衝脈未絶者當灸百會一穴前後髮際兩耳尖折中乃是穴也方書所載但云頂上旋毛中殊不審有雙頂者又有旋毛不正者庸醫之輩習循舊本誤人多矣灸後即當控涎用青州白丸子末再煎如稀糊入煉蜜調奪命散良久涎下細研靈砂米飲調旋抹口中漸看退證如風盛服八仙散昏困服醒脾散常令減乳乳母服釀乳藥如此調理無不愈者間有稟受不堅五行數短者雖神聖工巧不能奪其造化矣若涎已離膈但在喉中如鋸藥不能入又不可控當用別法撩之兼搐鼻噴嚏得出次服奪命散庶免再作撩痰方川烏尖白附尖各七個去皮生用蠍梢七枚石緑少許上為末一處和勻用軟雞翎蘸藥入喉中逐漸抽出頻用帕子拭之上湯氏治慢驚法先用奪命散白丸子控涎候涎下一回用八仙醒脾等一回令乳母用釀乳法如危極者卻灸百會及撩痰法但奪命用礞石氣虛者難用必與東垣益黃散相兼服之可也陳氏治慢驚風先服芎蠍散用手法斡出寒痰冷涎自不癡呆次服油珠膏後服益真湯溫壯元氣時服前朴散寬上實下芎蠍散治小兒腦髓受風囟顱開解皮肉筋脈急脹腦骨縫青筋起面少血色或腹中氣響時便青白色沫或嘔吐痰涎欲成慢驚搐足脛冷者川芎一兩細辛二錢蓽茇一兩半夏酒浸一宿湯洗焙二錢蠍梢去毒一錢上細末一周兒抄一銅錢用數沸湯調稍熱飢服如痰滿胸喉中眼珠斜視速與服若目上直視不轉睛者難救或痰氣壅塞不能咽藥用一指於兒喉靨齶中探入就斡去痰涎氣稍得通次用補脾益真湯或以油珠膏選用此方纍世活人多矣油珠膏治氣逆嘔吐風痰作搐石亭脂硫黃中揀取如蠟者五錢滑石半兩黑附子炮去皮臍半夏酒浸一宿湯洗七次焙乾南星醋浸一宿湯洗七次焙乾各一錢上細末每服一錢用冷清齏汁半盞滴麻油一點如錢抄藥在油珠上須臾墜下卻去齏汁與兒服之更用清齏汁三五口咽下肚飢服服訖後一時方與乳食補脾益真湯治胎弱吐乳便清而成陰癇氣逆涎潮眼珠直視四肢抽掣或因變蒸客忤及受驚誤服涼藥所作木香當歸人參黃耆丁香訶子陳皮厚朴薑製甘草炙肉蔻麵裹煨草果茯苓白朮桂枝半夏湯泡附子炮各半兩全蠍炒每服加一枚上㕮咀每服三錢水一盞半薑一片棗一枚煎六分稍熱飢服服訖令揉心腹以助藥力候一時方與乳食渴者加茯苓人參甘草去附子丁香肉蔻瀉者加丁香訶子肉嘔吐加丁香半夏陳皮腹痛者加厚朴良薑咳嗽加前胡五味子去附子官桂草果肉蔻足冷加附子丁香厚朴惡風自汗加黃耆官桂痰喘加前胡枳實赤茯苓去附子丁香肉蔻草果氣逆不下加前胡枳殼檳榔去當歸附子內蔻腹脹加厚朴丁香前胡枳殼前朴散治心腹結氣或嘔噦吐瀉腹脹痛驚悸前胡白朮人參陳皮良薑藿香甘草厚朴各等分上銼每服三錢水一盞煎七分稍熱空心服小兒誤服涼藥或用帛蘸水繳口因此傷動脾胃或泄瀉或腹脹或腹中響小兒面少血色常無喜笑不看上而視下小兒囟顱高急頭縫青筋時便青糞小兒肥壯糞如清涕或如凍汁小兒時時扎眼糞便青白沫有時乾硬以上五症忽然嘔吐者必成陰癇俗謂慢驚是也小兒頭雖熱眼珠青白而足冷或腹脹而足冷或瀉而足冷或嘔而足冷或渴而足冷頭熱目赤痰塞鼻喉咽皆無根之火逆也以上五症忽然吐而作搐者名曰慢脾風速與補脾益真湯一服三錢重加蠍一枚如因驚而搐者前朴散一服三錢重加附子前胡各半錢同煎上陳文忠治慢驚法其治之次第自成一家故另録之以備採用其醫案所言芎蠍散油珠膏纍纍取效世治慢驚神效用一粒丁香一個蠍一字辰砂一點血以上俱為末男用男左手中指血女用女右手中指血蘸末擦唇上愈本醒脾丸治小兒慢脾風因吐痢後虛困昏睡欲生風癇厚朴白朮硫黃入豆腐中煮三五沸天麻全蠍防風官桂人參各一錢上為細末酒浸蒸餅和丸如雞頭大每一丸捶碎溫米飲下蜴梢丸治小兒胎虛氣弱吐痢生風昏困嗜臥或潮搐全蠍微炒白附煨裂各半兩硫黃半夏薑汁製焙乾各一兩上為末薑汁糊丸如麻子大每服三十丸荊芥湯下量兒大小加減服之世小兒慢驚風身冷瘛瘲天麻防風川烏全蠍去翅足薄荷葉包炒南星等分水煎服湯氏治慢驚真川烏一枚去皮生用全蠍等分上二件㕮咀分二服水二盞薑十片煎半盞旋旋滴入口中無陰癇即慢驚風黑附子生去皮臍南星生半夏各二錢白附子一錢半上研細井水浸七日每日換水浸訖控干入殊砂二錢麝香一錢研勻每服一字薄荷湯調下量兒加減一方用黑附子生去皮臍為末每服二錢以水一盞半生薑二片煎至半盞分二服量兒加減吐者入丁香五個同煎空心服或水浸炊餅為丸如粟米大每服二十丸生薑湯下亦可錢回生散治小兒吐瀉或誤服冷藥脾虛生風成慢驚大南星重八九錢以上者用地坑子一個深三寸許用炭火五斤燒紅入好酒半盞在內然後入南星卻用炭火三兩條蓋在地坑上候南星微裂取出銼碎再炒勻熟不可稍生放冷為末每服半錢濃煎生薑防風湯調下又方梓朴散厚朴半夏湯洗七次薑汁浸半日曬乾一錢上米泔三升同浸一百刻水盡為度如百刻水未盡少加火熬干去厚朴只將半夏為末每服五分或一字薄荷湯調下無時豆卷散治小兒慢驚多因藥性太溫及熱藥治之有驚未退而別生熱症者有因病愈而致熱症者有反為急驚者甚多當問病幾日因何得之曾以何藥療之可用解毒藥無不效宜此方大豆黃卷水浸黑豆生芽是也曬乾管仲板藍根甘草炙各一兩上為末每服半錢水煎服甚者三錢藥水內入油數點煎又治吐蟲服不拘時上諸家雜治慢驚其首一方用人血蘸藥末擦唇者甚效後一方解藥太過之毒尤見錢氏憂人之切也垣驚兒瀉青色先鎮平以硃砂之類勿用寒涼之藥大禁涼驚丸蓋風木旺必克脾土當先實其土後瀉其木其風木旺症右關脈洪大掌中熱腹皮熱者是也今立一方黃耆益黃散主之人參甘草黃耆各等分此三味皆溫能補脾土益元氣甘能瀉火內經云熱淫於內以甘瀉之以酸收之白芍藥酸寒寒能瀉火酸能瀉肝木而大補肺金所補得金土之位大旺則火虛矣風木何由而來剋土然後瀉風木之旺脾虛者以火邪乘其土位故也故曰從後來者為虛邪火旺能實其木木旺故來剋土當於心經中以甘溫補土之源更於脾土中瀉火以甘寒補金以酸涼故致脾土中金旺火衰則風木自虛矣黃耆益黃散治胃中風熱黃耆二錢人參一錢甘草生五分炙五分白芍藥七分陳皮不去白一錢黃連少許白茯苓四分上為粗末每服水二盞煎五沸去渣溫服丹治小兒驚而有熱者人參茯苓白芍藥酒炒白朮上入生薑煎服暑月加黃連生甘草竹葉煎服陳明遠治小兒驚因脾虛肝乘之手足搐動四肢惡寒而食少白朮二錢茯苓一錢上煎湯入竹瀝熱下龍薈丸二十丸保和丸二十丸湯奪命散大能控風涎不問急慢驚風痰潮壅盛塞於咽喉其響如潮名曰潮涎百藥不能過咽命在須臾但先用此藥入喉痰即墜下功有萬全奪天地之造化也青礞石一兩入甘窩子同焰硝一兩炭火煅通紅須硝盡為度候冷如金色取用上為細末急驚風痰壅上身熱如火用生薄荷自然汁入蜜調微溫服之良久其藥自裹痰墜下從大便出如稠涕膠黏乃藥之功也次服退熱祛風截驚等藥慢驚風亦以痰涎潮上塞住咽喉藥食俱不能入醫者技窮勢迫以待其盡但用此藥以青州白丸再研為末煎如稀糊熟蜜調下其涎即墜入腹次服花蛇川烏全蠍蜈蚣等藥丹大黑龍丸治小兒急慢驚風神效膽星礞石硝煅各一兩天竺黃青黛各半兩蘆薈二錢半辰砂蜈蚣燒灰錢半殭蠶五分上為末甘草汁為丸如雞頭大每服一丸或二丸薑蜜薄荷湯下如慢驚用桔梗白朮湯下鎮驚丸琥珀二錢半青黛半兩辰砂二錢半天竺黃二兩天麻一兩真珠母二錢半蘆薈柴胡各半兩青皮甘草各二錢半膽星二兩雄黃一錢半乳香一兩青礞石硝煅半兩上為末甘草膏丸如雞頭大慢驚參朮湯下急驚薄荷薑蜜湯下小兒急慢驚風全蠍四十九個微炒黃辰砂半兩研極細和勻上取蚯蚓十條洗淨入小瓶內以溫火煅蚯蚓化為水和丸如胡椒大每三丸用順流水化服下小兒急慢驚風殭蠶三條辰砂豆大一粒全蠍一個真珠末一撮上末取蓬蒿中小蟲兒每一個研作一丸如麻子大每一粒用乳汁下本保命丹治小兒急慢驚風四肢逆冷眼直口噤涎不止虎睛一對安瓦上以瓦蓋之慢火逼干硃砂半兩全蠍半錢天麻一分蜈蚣二條去頭尾赤腳者麝香半錢上為細末煉蜜丸如大豆大瓦罐貯之又入腦麝窨定急驚薄荷蜜湯化下慢驚薄荷湯化下各三丸錢溫驚丸一名粉紅丸南星為末入臘月牛膽中陰乾百日為末四兩硃砂一錢半天竺黃一兩坯子胭脂半錢龍腦五分另研上用牛膽汁和丸如雞頭大每服一丸小者半丸砂糖水下抱龍丸治傷風溫疫身熱昏睡氣粗風熱痰實壅嗽驚風潮搐及蠱毒中暑沐浴後並可服壯實小兒宜時與服之丹溪云抱龍丸心肺肝藥也南星如無牛膽者只將生者銼炒熟用四兩天竺黃一兩雄黃水飛辰砂另研各半兩麝香另研一錢上為細末煮甘草膏和丸皂莢子大溫水化下百日小兒每丸分作三四服五歲兒一二丸大人三五丸亦治室女白帶伏暑用鹽少許嚼一二丸新汲水送下臘月雪水煮甘草和藥尤佳一法用漿水或新水浸南星三日候透煮軟三五沸取出乘軟切去皮只取白軟者薄切焙乾炒黃色取末八兩以甘草二兩半拍破用水二碗浸一宿慢火煮至半碗去渣漸漸傾入南星末內慢研令甘草水盡方入余藥世奪命散治急慢驚風諸藥不效此藥隨手奏功白附子三錢黑附子炮去皮臍半兩急驚不用南星炮一兩天麻三錢辰砂另研二錢半防風半夏各半兩全蠍去毒七個蜈蚣炙一條麝香半錢殭蠶炒慢驚不用上為末三歲兒半錢薄荷生薑自然汁加好酒沸湯各少許調服急驚加輕粉腦子各少許湯治慢驚甚驗赤腳蜈蚣酒塗炙一條白殭蠶炒七條辰砂另研一字全蠍用薄荷葉包炙七枚青州白丸子三十粒上為末入麝香少許慢驚人參麥門冬湯調下急驚加腦子牛黃各少許金銀薄荷湯調下羅天麻散治小兒急慢驚風及大人中風涎盛半身不遂言語艱澀不省人事半夏七錢天麻二錢半甘草炙茯苓白朮各三錢上用水一盞入瓷罐內煮令水乾將老薑三錢同煮候乾為細末每服一錢五分薑棗湯調下經治驚風墜涎天南星一個重一兩者換酒浸七伏時取出新瓦上炭火炙乾烈地上去火毒搗末入硃砂一分研為細末每服五分荊芥湯空心及午時各調下一服田天麻防風丸治小兒驚風身熱喘粗多睡驚悸搐掣神昏涎痰不利等症天麻防風人參各一兩蠍尾去毒半兩甘草硃砂雄黃牛黃麝香各一錢殭蠶炒半兩上為末煉蜜丸如櫻桃大硃砂為衣每服薄荷湯下一二丸云七味羌活膏治急慢驚風壯熱羌活獨活天麻全蠍去毒人參殭蠶炒各半兩烏蛇肉酒浸一宿焙乾一兩上為末煉蜜丸如皂子大每兩作五十丸每服一丸荊芥湯下經治小兒驚風全蠍一錢不去頭尾用薄荷葉裹炙乾同研為末作四服湯下衍治小兒驚風殭蠶蠍梢等分天雄尖附子尖共一錢炮過為末每服一字薑湯調下羅小兒驚風釀乳方用白羊頭一個丁香同熬至熟乳母空心盡食之丹孫女因胎中受濕熱日午發搐唇黑麵青每日作一次未半周難與藥且釀乳飲之白朮陳皮半夏芍藥青皮各五分人參川芎木通各三錢黃連二錢甘草炙一錢上分八服薑五片與乳母煎服小兒急慢驚風發熱口瘡手足伏熱痰熱痰喘痰嗽並用湧法重劑用瓜蒂散輕劑苦參赤小豆末酒酸齏汁調服之後用通神散蜜丸服之間以桑牛陰乾研末調服以平其氣本褊銀丸治小兒急慢驚風積痼青黛三錢水銀一皂角子大同黑鉛錫炒砂子寒食麵黃明膠炒焦為末各二錢輕粉炒豆許雄黃粉霜硃砂各一兩巴豆二十一粒去油腦麝少許上研細滴水為丸如麻子大捏褊曝乾瓷盒盛之一歲一丸隨意加減煎棗子湯送下不得化破博治急慢驚風乳香甘遂各半兩同研細每服半錢用乳香湯調下或用童便調下尤妙上二十方通治急慢驚風蓋謂虛實兩見急慢互出故有通治之法合而言之急慢雖異皆本之於痰故礞石星半之屬通能治之者也分而言之礞石之屬瀉痰青黛之屬瀉木硃砂之屬瀉火皆治氣實之劑參草之屬補土天麻全蠍之屬補木烏附之屬補火又皆治氣虛之劑故補瀉兼施虛實通治之法也山小兒驚風猢猻糞燒存性碗覆出火毒生蜜調灌少許海心神不安四君子加辰砂半分棗湯調下又有一症欲發瘡疹先身熱驚跳或發搐搦此非驚風當用發散藥閻驚風或泄瀉等症煩渴者皆津液內耗也不問陰陽宜煎錢氏白朮散使滿意取足飲之彌多彌好明堂急慢驚印堂灸急驚瀉慢驚補急驚支正下廉小兒慢驚風灸尺澤二穴各七壯在肘橫紋內正中炷如小麥大睡中驚掣厲兌一壯睡中驚目不合灸屈肘橫紋上三壯錢咬牙甚者發驚目直面青身反折者生驚呵欠面青者驚風呵欠面黃者脾虛驚目赤兼青者發搐錢驚癇發搐男發搐目左視無聲右視有聲女發搐目右視無聲左視有聲相勝故也更有發時症潔古曰男為木故左視木位無聲右視金位相擊則有聲女為金故右視金位無聲左視木位亦相擊有聲李寺丞子三歲發搐自卯至巳目右視大叫哭錢見曰此逆也男為陽本發左視無聲則順右視有聲則逆所以然者左肝木也右肺金也逆則二臟相戰金木相擊而有聲也治宜瀉強補弱假令女發搐目左視是肺來乘肝肝不能任故叫哭也當瀉其肺後治其心續治其肝若病在秋日西時同肺兼旺位當大瀉其肺若病在春早晨時同此肝旺之時尚不能勝肺是肺強而肝木弱也當補其肝腎大瀉其肺若男發搐目右視是肝來勝肺而叫哭當瀉其肝心若病在春夏早晨日中時同肝心旺時當大瀉其肝若病在秋冬日晡時同此肺旺之時尚不能勝肝是肝強而肺極虛也當補其肺大瀉其肝所以言目反視者乃肝主目也凡搐則是風熱相搏於內風屬肝故外見於目也今此病男反女症故稍易治於女也先瀉其肺以瀉肺湯主之二日不悶亂知病退也後用地黃丸補腎三服後用瀉青丸各二服以瀉心肝五日而愈又肺虛不瀉者何也曰假令男目右視木剋金肝旺勝肺而但瀉肝若更病在春夏金氣極虛故當補其肺慎勿瀉也湯凡搐男左女右為順易治男右女左為逆難治心脈急甚為瘛瘲全文見診治法經云急者多寒脾脈急甚為瘛瘲陳驚風不治證搐而不休休而再搐驚叫發搐汗出足冷痰滿胸喉口開目直閻治小兒急驚方搐不用驚擾此不足畏慢驚雖靜乃危病也急驚方搐時俱扶持之不可擒捉蓋風氣方盛恐流入筋脈或至手足成拘攣也驚癇驚癇即急慢之症但驚癇發時仆地作聲醒時吐沫急慢驚則不作聲不吐沫也陽癇初作時病先身熱瘛瘲驚啼叫啖而後發脈浮者為陽癇乃急驚也內在六腑外在皮膚為易治若病先身冷不驚瘈不啼呼而作脈沉者為陰癇乃慢驚也此病內在五臟外在骨髓劇者難治錢凡治五癇皆隨臟治之每臟各屬一獸宜以五色丸主之犬癇反折上竄犬叫肝也羊癇目瞪吐舌羊叫心也牛癇目直視腹滿牛叫脾也雞癇驚跳反折手縱雞叫肺也豬癇如尸吐沫豬叫腎也五色丸硃砂研半兩水銀一分雄黃熬一兩鉛三兩同水銀熬真珠末研一兩上煉蜜丸如麻子大每服三四丸金銀薄荷湯下潔如有客痰發熱而有聲煎大黃荊芥湯下五色丸潮熱有時積熱也桃枝丸主之壯熱不退當用地骨皮散下五色丸風熱當用防風黃芩湯下大青膏身溫不熱當用白虎湯加蒼朮下五色丸本雌黃丸治小兒癲癇欲發眼暗瘛瘲聲惡嚼舌雌黃黃丹各一兩麝香研一錢上為末拌令極勻用牛乳汁半升熬成膏入前藥末杵三五百下丸如緑豆大每服三丸溫熱水下一日三服此方得自名醫之家極有神效湯蛇黃丸治驚癇真蛇黃醋煅淬三個鬱金三分一處為末麝香另研一錢上為末粳米飯丸如桐子大每服三二丸煎金銀磨刀水化服海古鏡味辛無毒主驚癇邪氣小兒諸惡疾煮取汁和諸藥煮服之彌古者尤佳治癇方治太陽陽明二經為病荊芥穗四兩白礬為細末二兩上棗肉為丸如桐子大每服二十丸荊芥湯下次三十丸四十丸又次五十丸俱食前羅沉香天麻湯魏敬甫之子四歲從長老摩頂授記衆僧念咒因而大恐遂發驚搐痰涎壅塞目多白睛項背強急喉中有聲一時許方醒後每見皂衣人輒發多服朱犀龍麝鎮墜之藥四十餘日前症猶在又添行步動作神思如癡豫診其脈沉弦而急黃帝針經云心脈滿大癇瘈筋攣又云肝脈小急癇瘈筋攣蓋小兒血氣未定神氣尚弱因而驚恐神無所依又動於肝肝主筋故癇瘈筋攣病久氣弱小兒易為虛實多服鎮墜寒涼之劑復損其氣故添動作如癡內經云暴攣癇眩足不任身取天柱穴是也天柱穴乃足太陽之脈所發陽蹺附而行也又云癲癇瘛瘲不知所苦兩蹺主之男陽女陰潔古云晝發治陽蹺申脈夜發治陰蹺照海先各灸兩蹺各二七壯次處沉香二錢天麻三錢羌活五錢防風三錢益智二錢川烏炮去皮臍二錢甘草炙當歸各一錢半半夏湯泡三錢獨活四錢附子炮去皮臍三錢薑屑一錢半上㕮咀每服五錢生薑三片水煎溫服舉痛論云恐則氣下精怯而上焦閉又云從下上者引而去之以羌活獨活苦溫味之薄者陰中之陽引氣上行又入太陽之經為引用故以為君天麻防風辛溫以散之當歸甘草辛甘溫以補氣血之不足又養胃氣故以為臣黑附子川烏頭益智仁大辛溫行陽退陰又治寒客傷胃腎主五液入脾為涎以生薑半夏燥濕化痰十劑云重可去怯沉香辛溫體重氣清去怯安神故以為使氣味相合升陽補胃恐怯之氣自得平矣湯牛黃丸治因驚中風五癇天吊客忤潮涎灌壅白花蛇酒浸取肉白附子全蠍真川烏一枚半兩者生天麻薄荷葉各半兩以上六味先為細末次入雄黃五兩辰砂三錢腦子另研半兩牛黃三錢麝香一錢上為一處和勻麻黃去根二兩酒一升煎麻黃至一盞去麻黃用酒熬藥得所勿至焦赤衆手疾丸如芡實大密器盛之一丸作五服煎金銀薄荷湯磨化大能發散驚邪治五癇得效方露蜂房焙一兩石緑一兩桂心遠志去心人參各半兩硃砂一錢上為末粥丸如桐子大每服二三十丸白湯下世治小兒驚癇膽星二兩全蠍去翅足炒半兩白附子一兩薄荷半兩殭蠶炒一兩川芎一兩上為末粥丸青黛為衣每服一二丸薑湯下治小兒癇用甘遂末一錢豬心一個取三管頭血三條和甘遂末將豬心批作兩片入藥在內以線縛定外濕紙包裹入文武火煨熟不可過度取藥細研入辰砂末一錢和勻分作四丸每服一丸豬心湯化下再服另取豬心煎湯此方神效湯斷癇丹治癇瘥後復作連綿不除服之有驗黃耆蜜水塗炙鉤藤細辛甘草炙蛇蛻皮各半兩蟬蛻去土四個牛黃另研一字治遠年驚癇心血不足神驗方蠍虎一枚褐色者用剪子取下四足爪連血細研入生朱末麝香腦子各少許同研細薄荷湯調下作一服須先用奪命散控下涎次服之能奪造化雖數年癲癇亦能治之此藥所以神效者蓋癇皆心血不足此物名守宮其血與心血類也取下如室女之紅鉛服之於心故能補也此乃怪蟲去其足而復能行又再生而活也蠍虎即蝘蜓奪命散方見驚搐門肘小兒多患胎寒好啼晝夜不止因此成癇當歸末小豆大乳汁灌之日夜三四服本治小兒卒得癇用鉤藤甘草炙各二分水五合煮取二合服如小棗大日夜三大服廣濟及崔氏方治小兒驚癇諸湯飲皆用鉤藤皮又野豬黃味辛甘平療癲癇水研如棗核日三服效衍義云野豬黃膽世不常有間得之能治小兒痰癇子和李氏一小兒病手足搐搦戴人曰心火勝也勿持捉其手當從搐搦此由乳母保抱太極所致乃令掃淨地以水灑之干令復灑令極濕俯臥兒於地上良久渾身轉側泥漿皆滿仍以井水洗之少頃而瘥杜治小兒胃寒蟲上諸危惡與癇相似者乾漆搗炒煙盡入白蕪荑等分為細末米飲調下一字至一錢瘥甲小兒癲癇瘛瘲脊強互相引項灸長強穴三十壯在脊骶端趺地取之乃得小兒驚癇瘛瘲脊急強目轉運上插筋縮主之田小兒癲癇驚風目眩灸神庭穴七壯在鼻直上入髮際五分小兒風癇灸鼻柱上髮際宛宛中三壯炷如小麥大小兒驚癇先驚怖啼叫後乃發也灸頂上旋毛中三壯及耳後青絲脈炷如小麥大旋毛中即百會穴也青絲脈手足少陽瘈脈穴也明驚癇灸巨闕三壯甲小兒驚癇本神及前頂囟會天柱主之小兒驚癇反視臨泣主之小兒癇痓嘔吐泄注驚恐失精瞻視不明眵䁾瘈脈主之羊癇食宗下空主之錢氏云羊癇目瞪吐舌羊叫癇發目上插攢竹主之馬癇金門及僕參主之風從頭至足癇瘈口閉不能開每大便腹暴滿按之不下嚏悲喘崑崙主之小兒癇瘈遺精溺虛則病癇癲實則閉癃小腹中熱善寐大敦穴主之癇驚如有見者列缺穴主之並取陽明絡錢五癇重者死病後甚者亦死天吊天吊亦驚風之證但天吊發時頭目仰視驚風則無也湯小兒瘛瘲不定翻眼抬睛狀若神祟頭目仰視名為天吊凡有此疾宜服蘇合香丸灸兩手大拇指兩甲肉相半男先灸左女先灸右及兩足大拇指中間各三五壯又灸前後手心各五壯此皆得效之法九龍控涎散治天吊赤腳蜈蚣酒塗炙一條滴乳天竺黃二味另研各一錢臘茶雄黃另研甘草炙各二錢荊芥穗炒白礬枯各一錢緑豆半生半炒一百粒上為末每服半錢人參薄荷湯調下鉤藤飲治天吊潮熱鉤藤人參犀角屑各半兩全蠍天麻各一分甘草半分上為末每服一錢水煎服丹癇迷嚼舌仰視牛黃大豆許和蜜水調廣利方眼目明目澀羞明狀如青盲中渚一壯凡小兒艾炷皆如小麥大兒三五歲忽生白翳遮睛掩瞳人疼痛不可忍九椎上灸一壯奶癬目不明者肩中腧灸一壯錢目赤兼青者發搐目直而射身反折強直者生驚眼白多世治眼白多多屬虛鹿茸半兩澤瀉茯苓各一兩山茱萸二兩地黃牡丹皮牛膝各一兩上為末蜜丸如桐子大鹽湯食後下二十丸雀目疳眼羅煮肝丸治小兒疳眼翳膜羞明不見物服十日必退如大人雀目者一服效夜明沙青蛤粉穀精草各一兩上件為細末每服一錢五七歲以上二錢豚豬肝一大片批開摻藥在內攤勻麻線纏定以米泔半碗煮肝熟取出肝湯傾碗內熏眼分肝作三服嚼訖卻用肝湯下一日三服不拘時候大人雀目空心服至夜便見物如患多時日二服龍膽飲子治疳眼流膿生疳翳濕熱為病神效不治寒濕為病者青蛤粉半兩羌活草龍膽各三錢黃芩炒二錢蛇蛻皮半兩麻黃二錢半穀精草半兩升麻二錢鬱金甘草炙各半錢上為細末每服二錢食後茶清調下灸雀目疳眼法小兒雀目夜不見物灸手大指甲後一寸內廉橫紋頭白肉際各一壯炷如小麥大小兒疳眼灸合谷二穴各一壯炷如小麥大在手大指次指兩骨間陷中赤眼湯導赤散治心熱小便赤眼目赤腫赤芍藥羌活防風各半兩大黃甘草各一錢上為末燈心黑豆煎食後服余平生無赤眼之患用之如神大人小兒可通用凡眼赤澀之初只用自己小便張目溺出用一指接抹眼中便畢閉目少頃即效此以真氣逼去邪熱也本治小兒赤熱腫眼大黃白礬上二味等分為末同冷水調作罨子貼眼立效明眼忽大小眥赤合谷灸三壯熱毒風盛眼疼灸中指本節頭三壯通睛湯牛黃丸小兒通睛皆因失誤築打觸著頭面額角兼倒撲令兒肝受驚風遂使兩目鬥睛名曰通睛宜服此牛黃白附子炮肉桂全蠍芎藭石膏煅各一錢白芷二錢藿香半兩硃砂二錢麝香一分上為末煉蜜為丸如芡實大三歲以下每服一丸薄荷湯下乳食後忌油麵豬肉偏墜田小兒狐疝氣偏有大小時時上下者蜘蛛十四枚熬焦桂枝半兩二物為散每服八分日再酒調下蜜丸亦通偏墜亦宜防葵丸令兒坐於上中午時灸卵下偏墜之處七壯防葵丸未詳小兒偏墜若非胎中所有在後生者於莖下腎囊前中間弦子上灸七壯立愈明胎産疝卵偏墜囊縫後十字紋上灸三壯春灸夏瘥夏灸冬瘥陰腫囊腫脫囊湯小兒陰腫由啼叫怒氣閉縱於下成此疾宜海蛤散海蛤三錢茴香炒三分薏苡仁白朮檳榔各半兩上末食前溫酒調下大小加減陰腫又方桃仁去皮尖及雙仁者炒三分牡丹皮桂枝白蒺藜炒去刺各半兩郁李仁湯浸去皮一分上水煎服丹脫囊即外腎腫大木通甘草當歸黃連黃芩上水煎服錢蚯蚓散治腎子腫硬成疝用干蚯蚓為末唾調敷常避風冷濕地先用花椒蔥湯避風處洗卻用此敷之纍驗世治小兒囊腫如升用甘草煎汁調地龍末塗之立退纍效丹用紫蘇葉為末水調敷上又用青荷葉包之治脫囊效明陰腫崑崙灸三壯疝痛湯治小腸疝氣家傳妙方芫花醋浸炒木香檳榔三稜各半兩茯苓青皮全蠍桂枝附子硇砂各一分上為末將硇砂浸澄去土頓在湯瓶上候成膏子和糖酷打麵糊為丸如豆大每三十丸空心溫酒下未效再服小便不通錢捻頭散治小便不通玄胡川苦楝各等分上同為細末每服半錢或一錢捻頭湯調下量多少與之捻頭湯即湯中滴油數點食前服湯木通散治心經伏熱小便不通啼叫木通一兩牽牛子炒半兩滑石一兩上為末燈心蔥白煎服冬葵子散治小兒腹急悶冬葵子一兩木通半兩上為末每服一錢煎服錢尿深黃色久則尿血小便不通久脹滿當利小便淋病湯治血淋神效方紫草連翹車前子各等分水煎服又方海螵蛸生地白茯苓上等分為末柏葉車前草煎湯調下治氣淋赤芍藥一兩檳榔麵裹煨一個上為末燈心同棗子煎湯調下遺尿湯治小便不禁或睡中遺出不覺雞腸草一兩牡蠣粉三錢龍骨麥門冬去心白茯苓桑螵蛸各半兩上件㕮咀每服一錢棗子一枚擘破煎食前服又方破故紙一味炒為末黃柏湯調下外療小兒睡中遺尿不自覺桂末雄雞肝等分搗丸如小豆大溫水下日三服世小兒夢中遺尿薏苡仁一合許去心不去殼敲碎入鹽一小撮同炒黃色用水二鍾煎至半鍾空心服之纍效喉痹凡治小兒喉痹宜於大人喉痹法參用之湯喉痹別無治法非吐不可生此證萬一危極前法無效急用官局碧霞丹研細用薄荷自然汁入醋調以雞翎蘸藥送入喉內徐徐導引得吐出痰涎為佳本事方論碧霞丹能害人此不然蓋當時遇有合死之人耳碧霞丹石緑附子尖烏頭尖蠍梢上為末為丸薄荷汁化取涎出明喉中鳴咽乳不利璇璣急喉痹天突一壯不宜灸忌之
