body:
  text: 卷之三十九小兒部肺主燥咳嗽錢嗽者肺感微寒八九月間肺氣大旺病嗽者其病必實非久病也其症面赤痰盛身熱法當以葶藶丸下之若久者不可下也葶藶丸治乳食沖脾傷風咳嗽面赤痰盛身熱喘促甜葶藶去土隔紙略炒黑牽牛微炒漢防己杏仁去皮尖炒另研如膏各一兩上為末研入杏膏拌勻蒸陳棗肉和再搗為劑丸如麻子大每服五丸至七丸淡生薑湯下乳食後或臨夜服量兒加減潔人參荊芥散治身熱痰嗽胸膈不利宜下痰去熱人參半兩荊芥穗一兩大黃二錢上為細末水煎調檳榔木香細末五分輕粉一字乳後服如身熱潮熱宜服清涼飲子去大黃三服之後一二日卻入大黃服之令疏利則愈不可便動臟腑錢十一月十二月嗽者乃傷風寒嗽也風寒從背第三椎肺腧穴入當以麻黃湯汗之有熱證面赤飲水痰熱咽喉不利者宜以甘桔湯兼治之若五七日其證身熱痰盛唾黏加減三拗湯下之麻黃去根節三錢水煮去沫焙乾桂枝二錢杏仁七個去皮尖炒黃另研如膏甘草炙一錢上為粗末入杏膏拌勻每服一錢水六分煎至四分去渣溫服無時以汗出為度量大小加減若自汗者不宜服之百部丸治小兒肺寒壅嗽微喘有痰百部炒麻黃去節各三兩杏仁四十個去皮尖微炒研入上為末熟棗子丸如皂子大溫水下二三丸無時日三四服此本方也仲景加松子仁五十個蜜丸更加胡桃肉含化大妙一方加甘草二錢紫蘇子散治小兒咳逆上氣因乳哺無度內挾風冷傷於肺氣或小兒啼氣未定與乳飲之與氣相逆氣不得下紫蘇子訶子去核杏仁去皮尖炒蘿蔔子木香人參去蘆各三兩青皮甘草炒各一兩半上為細末每服二錢水一盞生薑三片煎至五分去渣不拘時服量兒加減有肺盛者咳而後喘面腫欲飲水有不飲水者其身即熱以瀉白散瀉之若傷寒咳嗽五七日無熱證而但嗽者亦葶藶丸主之後用化痰藥瀉白散方見虛實法有肺虛者咳而哽氣長出氣喉中有聲此久病也以阿膠散補之痰盛者先入脾後以褊銀丸微下之涎退速即補肺如上法補肺法方見治虛實法潔黃耆湯治小兒咳嗽喘逆身熱鼻乾燥者是熱入肺經為客熱呷呀有聲黃耆二兩人參二錢半地骨皮五錢桑白皮三錢甘草二錢半上㕮咀水煎放溫頻頻服之海涎嗽四君子加杏仁桑白皮等分半夏曲減半同煎咳嗽四君子末煎紫蘇湯調下潔咳嗽肺之生病而成嗽大抵秋冬則實春夏則虛更詳五臟兼見之證以辨虛實若實則面赤飲水身熱痰涎盛涕唾稠黏咽乾不利喘嗽面腫吐食皆當先補脾益黃散後瀉肝瀉青丸若咯膿血是肺痿也用清肺散治之若虛則面白脫色氣少不語喉中有聲唾痰清利法當阿膠散補之若亡津液用白朮散主之錢治嗽大法盛即下之久即補之更量虛實以意加減褊銀丸治風涎膈實上熱及乳食不消腹脹喘粗巴豆去油膜皮心研細半兩水銀五錢黑鉛二錢半同水銀炒結砂麝香另研五分好墨火燒醋淬研八錢上將巴豆末並墨再研勻和入砂子麝香陳米粥和丸如緑豆大捻褊一歲兒一丸三二歲二三丸五歲以上五六丸煎薄荷湯放冷送下不得化破更量虛實加減並食後服虛人先以益黃散實脾後以此方下之下後補肺嗽而吐水或青緑水者百祥丸下之方見痘門嗽而吐痰涎乳食者白餅子下之方見積門丹小兒痰嗽必用吐法詳見喘條世白附丸治咳嗽有痰方見脾主濕門勝金方治小兒咳嗽蜂房二兩淨洗去蜂糞及泥土以火燒為灰每服一字飯飲下羅塗唇膏治襁褓小兒咳嗽吐乳久不愈石燕一味為末每用一捻蜜少許調塗兒唇上日三五次無時錢杜氏子五歲自十一月病嗽至三月未止始得嗽而吐痰乃外風寒蓄入肺經令肺病嗽而吐痰風在肺中故也宜以麻黃散輩發散後用涼藥壓之即愈時醫與朱粉丸半夏丸褊銀丸諸法下之其肺即虛而嗽甚至春三月間尚未愈召錢視之其候面青而光嗽而喘促哽氣又時時長出氣錢曰病困十已八九然所以面青而光者肝氣旺也春三月者肝之位肺衰之時也嗽者肺之病肺自十一月至三月肺即虛痿又再下之脾肺子母俱虛復為肝所勝此為逆也故嗽而喘促哽氣長出氣也錢急與瀉青丸瀉之後與阿膠散實肺次日面青而不光錢又用補肺而嗽如前又與瀉肝未已而又加肺虛唇白如練錢曰此病必死不可治也何者肝大旺而肺虛絶肺病不得時而肝勝之今三瀉肝而肝病症不退三補肺而肺病尤虛此不久生故言死也此證病於秋者十救三四春夏者十難救一果大喘而死嗽膿血錢有喘而咯膿血者乃肺熱食後服甘桔湯久嗽者肺亡津液阿膠散主之咳而痰實不甚喘而面赤飲水者可褊銀丸下之阿膠散即補肺散方見治虛實法褊銀丸方見前甘桔散桔梗米泔浸一宿焙乾甘草炒各二兩上為細末每服一大錢水一大盞入阿膠半兩炮過煎至五分食後溫服海甘桔湯仲景少陰咽痛藥也孫真人治肺癰吐膿血用生甘草加減二十餘條丹小兒咯血黑豆甘草陳皮煎服錢段齋郎子四歲病嗽身熱吐痰數日而咯血前醫以桔梗湯及防己丸治之不愈涎上攻吐喘不止請錢氏下褊銀丸一大服復以補肺湯補肺散治之或問段氏子咯血肺虛何以下之錢曰肺雖咯血有熱故也久則虛痿今涎上潮而吐當下其涎若不吐涎則不甚便蓋吐涎能虛又生驚也痰實上攻亦能發搐故依法只宜先下痰而後補脾肺必涎止而吐愈為順治也若先補其肺為逆耳此所謂識病之輕重先後為治也喘潔肺虛則喘而少氣先益黃散後補肺散二方並見治虛實法錢京東轉運使李公孫八歲病嗽而喘滿短氣醫者言肺經有熱用竹葉湯牛黃膏治之三日加喘錢氏云此肺氣不足復有寒邪即便喘滿當補肺脾勿服涼藥李曰醫已用竹葉湯牛黃膏錢曰何治也前醫曰退熱退涎錢曰何熱之所作曰肺經熱而生嗽嗽久不除生涎錢曰本虛而風寒所作何熱也若作肺熱何不治其肺而反調心蓋竹葉湯牛黃膏治心藥也李師有慚色錢治愈潔肺實則喘而氣盛瀉白散方見治虛實法錢東都張氏孫九歲病肺熱咳嗽他醫以朱犀龍麝牛黃藥治之一月不愈其證咳嗽喘急悶亂飲水不止全不能食錢氏用使君子丸益黃散張曰本有熱何以又行溫藥他醫用涼藥攻之一月尚無效錢曰涼藥久則胃寒不能食小兒虛不能食當與補脾候飲食如故即瀉肺經病必愈矣服補脾藥二日其子欲飲食錢以瀉白散瀉肺遂愈張曰何以不虛錢曰先實其脾然後瀉肺故不虛也云小兒結熱上氣喘者四順散一名清涼飲子本治小兒哮啼黃丹砒霜上各薑製為末用棗肉為丸如麻子大每服三丸臨臥冷茶下丹痰嗽痰喘並用湧法吐之重劑用瓜蒂散輕劑用苦參赤小豆末須蝦齏汁調服之世萬金丹治哮痰涎喘急方見瘧大人通用湯治肺中風多因嗽而始但服嗽藥不能散其風邪入於肺臟之絡其候喘急面色青黃目能認人口不能言醫不能明其證坐以待盡不亦陋乎紹興王尚書女伴老嫗得此病半月相繼而死庸醫俱不能識又張南軒亦得此疾而逝醫師滿目環視而立待盡余悔不得一見豈非天命也哉後有親樓八哥之子病此症是時乃一氣之行諸醫皆言無術而退子父來告急但欲得別是何疾亦不望其活矣余往視之尚留殘喘以橘皮桑白皮罌粟殼三件煎湯化百部丸二服急灸肺腧其喘立定而忽能言繼時索粥自此生矣鳴呼是病有法不遇余者多矣可深惜哉素帝曰乳子中風熱喘鳴肩息者脈何如岐伯曰喘鳴肩息者脈實大也緩則生急則死通評虛實論馬脾風暴喘而脹滿也田暴喘俗傳為馬脾風也大小便哽宜急下之用牛黃奪命散後用白虎湯平之牛黃奪命散治小兒肺脹喘滿胸膈起急兩脅扇動陷下作坑兩鼻竅張悶亂嗽喝聲嗄而不鳴痰涎潮塞俗云馬脾風若不急治死在旦夕白牽牛黑牽牛各一兩半生半熟川大黃檳榔各一兩上為細末三歲兒每服二錢冷漿水調下涎多加膩粉少許無時加蜜少許無價散治風熱喘促悶亂不安俗謂之馬脾風辰砂二錢半輕粉五錢甘遂麵裹煮焙乾一錢半上為細末每服一字用溫漿水少許入滴油一點挑藥在上沉下去卻以漿水灌之立效又一法小兒喘脹俗謂之馬脾風又謂之風喉者以草莖量病兒手中指里近掌紋至中指尖截斷如此二莖自乳上微斜直立兩莖於梢盡頭橫一莖兩頭盡頭點穴灸三壯此法多曾見愈世馬脾風在百日內者不治悲哭本治小兒拗哭龍齒散龍齒蟬殼去翅足泥土鉤藤有鉤子者羌活茯苓人參各等分上為末每服一大錢煎六分去渣溫熱服子和一小兒悲苦彌日不休兩手脈弦而緊戴人曰心火甚則乘肺肺不受其屈故哭肺主悲王太僕云心爍則痛甚故爍甚悲亦甚先令浴以溫湯漬形以為汗也肺主皮毛汗出則肺熱散浴止而啼亦止矣仍命服涼膈散加當歸桔梗以竹葉生薑朴硝同煎服瀉膈中之邪熱錢小兒驚啼邪熱乘心也當安心安神丸主之丹小兒驀然忽大啼作聲者必死此火大發則虛其氣故也夜啼無小兒夜啼有四證一曰寒二曰熱三曰重舌口瘡四曰客忤寒則腹痛而啼面青白口有冷氣腹亦冷曲腰而啼此寒證也熱則心躁而啼面赤小便赤口中熱腹暖啼時或有汗仰身而啼此熱也若重舌口瘡要吮乳不得口到乳上即啼身額皆微熱急取燈照口若無瘡舌必重也客忤者見生人氣忤犯而啼也各隨證治之蒜乳丸治腹痛夜啼當歸丸治臟寒腹痛二方見腹痛田五味子散治小兒夜啼及腹痛至夜輒劇狀似鬼祟五味子當歸赤芍藥白朮各半兩茯神陳皮桂心甘草炙各二錢半上為粗末水煎量兒大小加減錢三黃丸治腹熱痛夜啼面赤唇焦便赤用人參湯吞下熱痛腰不曲肢不冷也無燈花散治熱證心燥夜啼以燈花三四顆研細用燈心煎湯調塗口中以乳汁送下日三服一法用燈花塗乳上令小兒吮之無燈花用燈心燒灰亦妙又一法燈花七枚硼砂一字辰砂少許研細蜜調抹唇上立安丹小兒夜啼人參二錢半黃連一錢半甘草炙五分竹葉二十片生薑一片水煎服淡寮龍齒散治小兒夜啼不止方見拗哭即上本事龍齒散但無羌活一味世又方蟬蛻二七枚去足為末入硃砂一字蜜調送下丹馬齒燒研細敷乳上吮之妙小兒夜啼黃連薑汁炒甘草竹葉煎服世治小兒夜啼青黛半錢細研清水調下無蒲黃散治小兒重舌方見舌牡蠣散治小兒口瘡方見瘡治客忤夜啼法用本家廚下燒殘火柴頭一個以火焦頭為上朱書云吾是天上五雷公將來作神將能收夜啼兒一縛永不放急急如太上老君律令敕書了勿令兒知立在床下倚床前腳里立之男左女右效明夜啼灸中衝一壯即止喑世通關散治小兒驚風已退只是聲啞不能言百藥不效者以大天南星一個炮為末每服一錢豬膽汁調下入喉便能言語鼻丹治小兒赤鼻雄黃黃丹等分用無根水調敷或用菖蒲半葉酒蒸為末調服解食毒無根水者天落雨水用碗盛之者是也辛荑葉先焙乾一兩細辛木通白芷木香各五錢杏仁去皮尖一錢上為細末用杏仁泥羊骨髓豬脂各一兩同諸藥和勻以瓦石器中熬成膏赤黃色為度於地上放冷入腦麝各一錢拌勻每用少許塗囟上並鼻中神效龜胸錢肺熱腸滿攻於胸膈即成龜胸聖治龜胸方大黃炒一錢天門冬去心焙百合杏仁去皮尖炒木通桑白皮蜜炙甜葶藶炒川朴硝各半兩上為末煉蜜丸如芡實大溫水食後化下三歲以上化二丸丹治小兒龜胸蒼朮黃柏酒炒芍藥酒炒陳皮防風山楂威靈仙加當歸又利後加生地黃為末煉蜜丸食後溫水下田小兒龜胸緣肺熱脹滿攻胸膈所生又緣乳母食熱面五辛轉更高起宜灸兩乳前各一寸五分上兩行三骨罅間六處各三壯炷如小麥大春夏從下灸上秋冬從上灸下若不依此法十灸不愈一二也龜背錢兒生下血風入脊逐於骨髓即成龜背治之以龜尿擦胸骨取龜尿法當以蓮葉安龜在上後用鏡照之其尿自出聖小兒龜背由令兒坐早有客風吹入脊骨而入於骨髓故使背高如龜之狀也雖有藥方多成痼疾以灸法為要當灸第三椎骨節下兩旁各一寸半肺腧穴又第五椎骨節下兩旁各一寸半心腧穴又第七椎骨節下兩旁各一寸半膈腧穴以小兒中指節為一寸艾炷如小麥大三五壯即止此法纍用十有一二得效亦無全效之功世龜背在百日內不治脫肛湯治大腸虛弱肛門脫下龍骨訶子煨去核各一兩沒石子大者二枚罌粟殼去核醋塗炙二錢上為末白湯點服仍用蔥湯熏洗令軟款款以手托入用新磚瓦一片燒紅以醋澆之氣上即用腳布疊數重壓定使熱氣上透不可過熱令病者以臀坐於布上如覺布溫逐旋減之以常得溫熱為度並常服前藥潔五倍子散治小兒脫肛五倍子地榆各等分上為細末每服半錢或一錢空心米飲調下錢赤石脂散治小兒因痢後努躽氣下推出肛門不入躽於建反用力努腹也真赤石脂伏龍肝各等分上為細末每用五分敷肛頭上頻用按入世治小兒脫肛用五倍子為末量多少摻患處以物襯手揉入切忌食發風毒物田脫肛治法用蒲黃一兩豬脂二兩煉豬脂和蒲黃成膏塗腸頭上即縮入無水聖散治小兒脫肛不收用浮萍草不以多少杵為細末干貼患處丹脫肛用東北方陳壁泥土湯泡先洗下後熏上又方見脫囊條田小兒脫肛瀉血秋深不痊灸龜尾一壯炷如小麥大脊端穹骨也小兒脫肛者灸臍中三壯小兒脫肛久不瘥及風癇中風角弓反張多哭言語不擇發無時節盛即吐沫者取百會一穴灸七壯在鼻直入髮際五寸頂中央旋毛中可容豆炷如小麥大明治久痢脫肛見痢門肛癢丹治小兒蟯蟲攻下部癢取扁竹葉一握切以水一升煎取五合去渣空腹飲之蟲即下用其汁煮粥亦佳心鏡治蟲狀如蝸牛食下部癢取扁竹葉一握水二升煮熟五歲兒空腹服五合隔宿不食明日早食之尤佳楊氏産乳腎主虛寒解顱丹小兒解顱乃是母氣血虛與熱多耳用四君子四物有熱加酒炒黃連生甘草煎服外以綿束緊用白蘞末敷之田解顱治法宜用生地散錢解顱生下而囟不合者腎氣不成故也長必少笑更有目白睛多㿠白色瘦者多愁少喜也湯解顱者囟大頭縫不合如開解故曰解顱此由腎氣不成故也腎主骨髓而腦為髓海腎氣不成則腦髓不足故不能合也凡得此者不過千日其間亦有數歲者乃廢人也人之無腦髓如木無根古人雖有良方吾所以不録者勞而無功也亦不可束手待斃宜依錢氏補腎萬一有可生之理補腎地黃丸方見勞瘵錢天南星散治顱開不合鼻塞不通天南星大者微泡去皮為細末米醋塗調緋帛上貼囟上炙手頻尉之立效無三辛散治小兒骨應合而不合頭骨開也名曰解顱細辛桂心各半兩乾薑七錢半上為末以薑汁和敷顱上貼之兒面赤即愈又方用蛇蛻炒焦為末用豬頰車中髓調敷頂上日三四度曾有人作頭巾裹遮護之久而自合亦良法也明囟門不合臍上臍下各五分二穴各灸三壯灸瘡未發先合世父精不足則解顱眼白多囟填湯氏小兒囟填其囟高大如物填在上汗出毛髮黃而短是也若寒氣上衝則牢𩊅頭垤起腫硬曰牢𩊅音昂熱氣上衝則柔軟又小兒臟腑積熱氣上衝於腦亦致囟填而又肝氣盛風熱衝上而成此候也玉環集歌曰囟門腫起定為風此候應須也不中或若加坑如盞足七日之間命必終行遲齒遲發遲湯小兒稟受血氣不足者則髓不滿骨故軟弱而不能行腎主髓治法當用錢氏補腎地黃丸加鹿茸五加皮麝香則髓生而骨強自然行矣外甥黃虯知録之子三歲不能行遂合此方服之有驗無五加皮散治小兒三歲不能行者由受氣不足體力虛怯腰脊腳膝筋骨軟足故不能行用真五加皮為末粥飲調次入好酒少許每服一栗殼許日三服效錢羚羊角丸補腎肝五六歲不能行羚羊角虎脛骨醋炙黃桂枝生地黃耆防風當歸白茯苓酸棗仁炒各等分上為細末蜜丸皂子大食後溫水化下久服取效湯芎黃散治小兒齒不生大川芎生地各半兩山藥當歸甘草炙各一分上焙為末熱湯調服用搽齒腳本尿坑中竹木主小兒齒不生正旦刮屑塗之即生湯香薷煎治小兒白禿不生髮燥痛陳香薷二兩胡粉一兩豬脂半兩上用水一大盞煎香薷取汁三分去渣入胡粉豬脂相和合勻塗於頭上日頻用之肘治小兒頭生白禿發不生用椿楸樹葉心取汁敷之大效錢小兒長大不行行則腳細齒久不生生則不固發久不生生則不黑皆屬氣血虛也宜大劑補之停耳田紅玉散治小兒膿耳枯白礬干胭脂麝香各一錢上同研勻先以綿裹杖子捻淨摻之湯龍黃散治小兒停耳汁出不止枯白礬龍骨末黃丹炒各半兩麝香一錢上同研細先以綿杖子搌膿水盡用散一字半分為兩處吹入耳內日二次丹停耳硫黃末敷之日一夜一妙祕要用蛐蟺灰末吹入立效有瘡者敷之孫真人方同呵欠呵欠面赤者風熱也面青者驚風也面黃者脾虛驚也多睡者內熱也氣熱者傷風也額黑唇青為寒垣補陽湯初冬間一小兒二歲大寒證明堂青脈額上青黑腦後青絡高起唇青舌上白滑喉鳴而喘大便微青耳尖冷眼澀常常淚下出仍多眵胸中不利臥而多驚無搐即寒柴胡三錢升麻二錢麻黃三錢吳茱萸五分地龍五錢蠍梢少生地五分歸身三錢甘草炙一錢黃耆二分黃柏一錢陳皮一分葛根連翹各一錢上為粗末作一服水一盞煎法如常乳食後熱服始漸喜睡精神出氣和順乳食旺錢血氣虛怯為冷所乘則唇青雜病寒熱湯食積寒熱如瘧渴瀉氣急要合地臥此候先當取下積只用平胃散次常服進食丸平胃散方見大人泄瀉進食丸方見癖錢曹宜德子三歲面黃時發寒熱不欲食而飲水及乳不止衆醫以為潮熱用牛黃丸不愈及以止渴乾葛散服之反吐錢曰當以白餅子下之後補脾乃以消積丸磨之此乃解也後果愈何以故不食但飲水者食伏於脾內不能消致令發寒熱用止渴藥吐者藥沖脾故也故下之即愈子和高巡檢子八歲病熱醫者皆為傷冷治之以熱藥欲飲冰水禁而不與內水涸竭煩躁轉生前後皆閉口鼻俱干寒熱往來咳嗽時作遍身無汗又欲灸之適遇戴人戴人責其母曰重裀厚被暖坑紅爐兒已不勝其熱尚可灸乎其母謝以不明戴人令先服人參柴胡飲子連進數服下爛魚腸之類臭氣異常渴欲飲水聽其所欲冰雪冷水連進數杯節次又下三四十行大熱方去又與通膈丸牛黃丸復下十餘行兒方大痊前後約五十餘行略計所用冰雪水飲至一斛向灸之當何如哉瘧治小兒瘧疾多與大人同法以出汗為瘥宜桂枝柴胡麻黃參芩等輩又視其病食病痰以意消息之大抵多是飲食不節得之須以消導為先可也世萬金丹治大人小兒瘧並哮痰涎喘急黑豆四十九粒信一錢先以黑豆浸去皮端午日以乳鉢研細拌勻作一小丸之黃丹為衣陰乾治哮冷茶清吞一丸治瘧空心井花水吞一丸忌熱物葷腥一月如食熱物即吐湯治疸瘧但熱不寒方用黃丹煅通紅臨發蜜湯調下能飲酒用酒調一法專服小柴胡湯次服人參前胡湯草果飲治寒多熱少手足厥冷遍身浮腫肚腹疼痛厚朴薑製青皮草果藿香甘草炙丁皮神麯良薑半夏曲等分㕮咀薑棗煎空心服治久瘧露星散秦艽柴胡白朮白茯苓檳榔常山黃芩甘草炙半夏曲官桂上等分㕮咀酒醋一半煎露一宿次日早取再溫濾去渣服陳舍人令嗣久瘧服驗小柴胡湯治小兒瘧疾往來寒熱人參半夏柴胡黃芩甘草各等分上㕮咀薑三片棗一枚煎服青皮湯治小兒瘧疾作浮腫兼寒熱不退飲食不進白朮茯苓厚朴青皮陳皮半夏大腹皮檳榔三稜蓬朮木通甘草各等分上㕮咀每服三錢薑水煎服養胃湯治外感風寒內傷生冷溫中快膈能闢山嵐瘴氣寒瘧脾胃虛寒嘔逆噁心並宜服之蒼朮厚朴半夏藿香草果人參茯苓甘草陳皮上㕮咀每三錢棗子烏梅各一枚同煎食前熱服鬼哭散止瘧疾久不愈者效常山大腹皮白茯苓鱉甲醋炙上㕮咀每服三錢桃柳枝各七寸同煎臨發時服略吐出涎效鱉甲飲子治瘧久不愈腹中結為癥瘕名曰瘧母鱉甲醋炙白朮黃芩草果檳榔芎藭橘紅甘草厚朴白芍藥各等分上㕮咀薑棗煎服大腹皮湯治小兒瘧疾用藥太早退熱變作浮腫外腎腫大飲食不進大腹皮檳榔三稜蓬朮枳殼蒼朮制各二兩甘草三錢上㕮咀每服三錢加薑皮蘿蔔子同煎四獸飲治五臟氣虛喜怒勞逸不節致陰陽相勝結聚痰飲發為瘧疾兼治瘴瘧半夏人參白朮茯苓草果陳皮各一兩半甘草二錢半上㕮咀加烏梅棗子各一枚生薑三片每服三錢煎服經效截瘧丹治瘧母結癖寒熱無已真阿膠湯泡研雄黃各二錢半硃砂一錢半上研為細末稀糊丸如桐子大每服一丸人參湯候冷空心服瘴瘧桃枝湯冷服臨發時磨一丸塗鼻口畔效要略瘧脈自弦弦數者多熱弦遲者多寒弦小緊者宜下之弦遲者可溫之弦緊者可發汗浮大者可吐之弦數者風發也以飲食消息之脈瘧脈自弦微則為虛代散則死明小兒瘧久不愈灸內庭在足大指次指外間陷中各一壯大椎百會各隨年壯繼病海小兒鬾病母有娠乳兒有病如瘧痢他日亦相繼腹大或瘥或發他人相近亦能相繼北人未識其病懷妊者取百勞鳥毛帶之又取其踏枝鞭小兒令速語鄭禮注云鵙博勞也楚辭云在外見鳴鵙言其鳴惡也白澤圖云屋間鬥不祥即百勞也以此治繼病本草云百勞味平有毒其毛用之治小兒繼病聖治小兒生十餘月後母又有妊令兒精神不爽身體萎瘁名為鬾病用伏翼燒灰細研以粥飲調下五分日四五服效若炙令香熟嚼哺兒亦效即蝙蝠無千金論小兒有鬾病者是娠婦被惡神導其胎中妒疾小兒令生此病鬾亦小鬼也其證微微下利寒熱往來毫毛髮鬢鬇鬡不悅者是也宜服龍膽湯凡婦人先有小兒未能行而母更有娠使兒飲此乳亦作鬾也令兒黃瘦骨立發熱發落龍膽湯治嬰兒出腹血脈盛實寒熱溫壯四肢驚掣吐哯者若已能進哺中滿食不消壯熱及變蒸不解中客人鬼氣並諸驚癇方悉主之龍膽草柴胡黃芩桔梗鉤藤皮芍藥甘草炙茯苓各二錢半蜣螂二枚大黃煨一兩上為銼散以水一升煮取五合為一劑十歲以下小兒皆可服若兒生一日至七日分一合為三服八日至十五日分一合半為三服十六日至二十日分二合為三服二十日至三十日分三合為三服皆以得下即止此劑為出腹嬰兒所作若日月長大者亦依此為例必知客忤及有鬼氣者可加人參當歸各二錢半一百日兒加一錢一字二百日兒加二錢半一歲加半兩余藥皆仿此海生者為相繼死者為傳尸有脈而無氣謂之尸厥有氣而無脈謂之行尸丁奚哺露客忤無辜四異病也陽易陰易百合狐惑四奇病也五硬五軟五硬仰頭取氣動搖難氣壅疼連胸腹間腳手心如冰冷硬頭仰為風命不還吃食如何不長肌肉少皮寬軟自離莫教瀉痢當時作靈藥難醫命必危五歲孩兒不肯行腳軟氣羸命不亨細小不妨榮衛氣長大須應肉自生宜用參耆等藥錢氏地黃丸治之上五硬即痓之屬經所謂暴強直皆屬於風是也五軟即痿之屬治見疳雜方條補遺方至寶丹療卒中急風不語中惡氣絶中諸物毒暗風中熱客毒陰陽二毒山嵐瘴氣毒蠱毒水毒産後血暈口鼻血出惡血攻心煩躁氣喘吐逆難産悶絶死胎不下以上諸疾並用童子小便一合生薑自然汁三五滴入於小便內溫過化下三丸至五丸神效又療心肺積熱伏熱嘔吐邪氣攻心大腸風祕神魂恍惚頭目昏眩眠睡不安唇口乾燥傷寒狂語並皆療之烏犀角研生硃砂研飛雄黃研玳瑁屑研生琥珀研各一兩麝香研龍腦研各一分金箔五十片半入藥半為衣銀箔五十片牛黃五錢安息香一兩半研以無灰酒攪澄飛過濾去沙土慢火熬成膏上將生犀玳瑁為細末入余藥研勻將安息香膏重湯煮凝成後入諸藥中和搜成劑盛不津器中並旋丸如桐子大用人參湯化下三丸至五丸又療小兒諸癇急驚心熱卒中客忤不得眠睡煩躁風涎搐搦每二歲兒服二丸人參湯化下桂苓甘露飲官桂人參去蘆藿香各半兩茯苓去皮白朮甘草炙葛根澤瀉石膏寒水石各一兩滑石二兩木香一分上為細末每服一錢白湯下新水生薑湯亦可順氣散消中熱在胃而能飲食小便黃赤以此下之不可多利微微利至不欲食而愈朴硝制一兩大黃四錢枳實二錢上㕮咀每服八錢水二盞煎八分去渣通口服膠艾湯治衝任虛損月水過多及妊娠胎動不安男子腹痛下墜阿膠炒川芎甘草炙各二兩當歸艾葉微炒各三兩白芍藥熟地各四兩上銼每服五錢水一盞酒六分煎至八分去渣稍熱服空心食前日三服甚者連夜並服震靈丹此丹不犯金石飛走有性之藥不僣不燥奪造化沖和之功大治男子真元衰憊五勞七傷臍腹冷痛肢體痠痛上盛下虛頭目眩暈心神恍惚血氣衰微及中風癱瘓手足不遂筋骨拘攣腰膝沉重容枯肌瘦目睛耳聾口苦舌乾飲食無味心腎不足精滑夢遺膀胱疝墜小腸淋瀝夜多盜汗久瀉久痢嘔吐不食八風五痹一切沉寒痼冷服之如神及治婦人血氣不足崩漏虛損帶下久冷胎藏無子服之無不愈者禹餘糧火煅醋淬紫石英赤石脂代赭石如上法煅淬以上四味並作小塊入坩堝泥固濟候乾用炭一斤煅通紅火盡為度入地出火毒二宿乳香另研五靈脂去砂石沒藥去石研各二兩硃砂水飛過一兩上件前後共八味併為細末以糯米輕煮糊為丸如小雞頭大曬乾每一粒空心溫酒下冷水亦得常服鎮心神駐顏色溫脾腎理腰膝除尸疰蠱毒闢鬼魅邪癘久服輕身忌豬羊血恐減藥力婦人醋湯下孕婦不可服極有神效駐車丸治一切下痢無問新久及冷熱膿血腸滑裡急日夜無度臍腹絞痛不可忍者阿膠搗砂炒如珠子為末以醋四升熬成膏當歸去蘆各十五兩黃連去須三十兩乾薑炮十兩上為細末以阿膠膏和並手丸如桐子大每服三十丸食前溫米飲下日三服凡小兒服丸如麻子大更量歲數加減甘草乾薑湯甘草四兩炙乾薑二兩炮上㕮咀以水三升煮取一升五合去渣分溫再服乾薑附子湯乾薑一兩附子一枚生用去皮上二味水煎頓服茯苓丸治臂痛如神赤茯苓防風細辛白朮澤瀉官桂各半兩栝蔞根紫菀附子黃耆芍藥甘草炙各三分生地牛膝酒浸山芋獨活半夏酒浸山茱萸各一分上十八味為細末煉蜜為丸如梧桐大每服十丸溫酒送下食前當歸四逆加茱萸湯當歸桂枝芍藥細辛各一兩通草甘草各六錢茱萸三錢上水六盞煎服升麻葛根湯升麻葛根芍藥甘草等分每服六錢水一盞半煎至八分去渣服寒多即熱服熱多即寒服開胃丸治乾嘔氣逆不止半夏曲微炒三兩人參一兩半白豆蔻去皮陳皮去白焙白朮各一兩上為細末用生薑汁同棗肉和丸如桐子大每服二十丸至三十丸不拘時用粥飲送下辰砂丸辰砂麝香牛黃各二錢半半夏制丁香白附子鐵粉天麻南星制各半兩上為細末煮粳米飲丸如麻子大每服五丸用荊芥湯不拘時下軟金丹又名聖力丹治急慢驚風五癇瘛瘲頭項動搖目睛上視或牽邪偏搐背脊強直或反折如弓口噤牙緊或屈指如數或溫壯連綿或服涼藥過多內生虛風或因傷寒變搐發渴或因吐痢生風為癇一切諸症乳食不化昏冒不省凡此急候服之皆愈但不喘急者此藥必效如已喘急者更須詳虛實苦涎實者可同水銀丸化下此二藥引化驚涎則潮搐立止虛者但只服此藥即便服效如兒涎熱風熱有諸驚症者服之即瘥又治大人卒中風病涎潮不省此藥神聖救人不可具載香墨各一錢全蠍三十個丁香一錢半蟾酥一皂子大牛黃另研丹砂飛雄黃飛生犀鎊研半夏曲制天麻殭蠶炒木香蟬殼洗焙使君子肉各一分肉果麵裹煨天南星炮白附子炮各三錢膩粉一錢螺青一兩二錢水銀鉛各三錢半炒結砂用五錢麝香一錢研龍腦半錢研白花蛇烏蛇各取項後粗處肉各一兩酒浸一宿去皮骨曬乾不見火附子一個炮去皮臍虛者用蜈蚣二條赤足者生用檳榔大二個原方有大裸蟲二十五個去殼本草無考上逐旋入研細勻用不蛀皂策一鋌刮去皮弦以好酒半升浸一宿揉去渣取汁入石腦油三錢銀石器內文武火熬數沸放冷別煉蜜少許投內和諸藥得所大者丸棗大小者皂子大以金銀為衣每服一丸金銀薄荷湯化下涎實者同水銀丸化下量兒大小與服神效水銀丸治急驚痰壅發搐悶亂口噤水銀一分入棗肉少許同研至無星膩粉一錢研南星炮製一分全蠍微炒一分再研棗肉為丸如黍米大每服五七丸乳香湯化下無時量大小加減太乙神精丹治客忤霍亂腹痛脹滿尸疰惡氣顛狂鬼語蠱毒妖魅溫瘧但是一切惡毒無所不治丹砂曾青雌黃雄黃磁石各四兩金牙二兩半上六味各搗絹下篩惟丹砂雌黃雄黃三味以醶醋浸之曾青用好酒於銅器中漬紙密封訖日中曝百日經憂急五日亦得無日以火暖之然後各研令如細粉以醶酢拌使乾溼得所納土釜中以六一泥固濟勿令泄氣干後安鐵環施腳高一尺五寸置釜上以漸放火無問軟硬炭等皆得初放火取熟兩稱炭各長四寸置釜上待三分盡即益如此三度盡用熟火然後用益生炭其過三上熟火已外皆須加火漸多及至一伏時其火已欲近釜即便滿就釜下益炭經兩度即罷火盡極冷然後出之其藥精飛化凝著釜上五色者上三色者次一色者下但色光明皎潔如雪最佳若飛上不盡更令與火如前以雄雞翼掃取或多或少不定研和棗膏丸如黍粒治偏風大風惡疾癲癇癧癤鬼打等最良服法平旦空服一丸如黍米為度其瘧病積久百方不瘥又加心腹脹滿上氣身面腳等並腫垂死者服一丸吐即瘥亦有不吐瘥者若不吐復不瘥者更服一丸半仍不瘥者後日增半丸漸服無不瘥氣亦定當吐出青黃白物其因瘧兩脅下有癖塊者亦當消除若心腹不脹滿者可與一丸日日加之以知為度不必專須吐亦可一丸即瘥勿並與服亦可三日一服皆須以意斟酌量得其宜或腹內有水便即下者勿怪若患瘧日近精神健亦可斟酌病人藥性並與兩丸作一丸頓服之皆至午後食勿使冷勿使熱豉漿粥任意食之若病瘧盜汗虛弱者日服一丸至三日吐即止若患瘧不汗氣復不流腳冷者服一丸至三日若不汗氣復腳即暖有潤汗不止三日吐即止若患瘧無顏色者服藥後三日即有顏色亦有須吐瘥者亦有服少許而瘥者亦有殺藥強人服三四丸始覺藥行者凡人稟性不同不可一概與之但作黍米大服之為始漸加以知為度藥力驗壯勿並多服特慎油麵魚肉蒜當清淨服之若有患久不瘥在床羸瘦並腹脹滿及腫或下痢者多死但與藥救之十人中或瘥三四人也又癥瘕積聚服一刀圭以飲漿水送下治諸卒死中惡客忤霍亂腹滿體帶五尸疰惡風疰忤大病相易死亡滅門狂癲鬼語已死氣絶心上微暖者扶起其頭挍開口不可開琢去兩齒以漿飲送藥藥下即活諸久病者日服一刀圭覆令汗汗出即愈不愈者不過再服亦有不汗而瘥復有不汗不愈者服如上法加半刀圭以瘥為度常以絳囊帶九刀圭散男左女右小兒系頭上闢瘴毒惡時氣射公小兒患可以苦酒和之塗方寸紙上著兒心腹上令藥在上治之亦有已死者冬二日夏一日與此藥服得藥下便活若加金牙磁石者服至五服內必令人吐逆下利過此即自定其藥如小豆大為始從此漸小不得更大大風惡癲可二十服偏風癧癤諸惡風癲病等亦可二十服自余諸惡病者皆止一二服量人輕重強弱不得多與若欲解殺藥但爛煮食肥豬肉服此藥後小應頭痛身熱一二日來大不能得食味後自漸得氣味五日後便能食若貪食過多者宜節之若服藥下悶亂可煮木防己湯服之即定凡言刀圭者以六粟為一刀圭一説云三小豆為一刀圭作土釜法其法取兩個瓦盆各受二大斗許以甘土塗其內令極干又一法作一瓦釜作一熟鐵釜各受九升瓦在上鐵在下其狀大小隨藥多少不必依此説作六一泥法赤石脂牡礪滑石礬石黃礬滷土蚯蚓屎各二兩上取醶酢以足為度若無滷土以鹽代之先作甘土泥以泥各別裹前黃礬等五種作團裹之勿令泄氣以火燒周三日最好一日亦得出火破團取藥各搗碎絹篩然後與蚯蚓屎滷土等分以酢和之如稠粥既得好酢可用二分酢一分水和用取前瓦盆以此泥塗之曾青如蚯蚓屎如黃連佳世少此者好崑崙碌亦得瘥病丹砂亦鮮粟砂亦得舊不用磁石金牙今加之用治萬種惡風神良凡有患連年積歲不可治者宜須合此一劑皆以王相日天晴明齋戒沐浴如法合之述曰古之仙者以此救俗特為至祕余以大業年中數以和合而苦雄黃曾青難得後於蜀中遇雄黃大賤又于飛烏玄武大獲曾青蜀人不識今須識者隨其大小但作蚯蚓屎者即是如此千金可求遂於蜀縣魏家合成一釜以之治病神驗不可論宿症風氣百日服者皆得痊愈故敘而述焉凡雄黃皆以油煎九日九夜乃可入丹不爾有毒慎勿生用丹必熱毒不堪服宜慎之出千金方
