body:
  text: 卷之三十八小兒部脾主濕世白附丸通治小兒咳嗽有痰感冒發熱吐瀉心神不安神效南星二兩半夏白附子白礬各一兩上為細末薑汁糊丸如桐子大一歲兒服八丸用薄荷湯化下南星半夏用冬藏雪水於六月六日浸起曬乾又浸凡九次方用吐瀉錢小兒初生三日內吐瀉壯熱不思乳食大便乳食不消或白色是傷寒當下之並和胃下用白餅子和胃用益黃散主之兒生三日以上至十日吐瀉身溫涼不思乳食大便青白色乳食不消此上實下虛也更有五臟兼見證肺睡露睛喘氣心驚悸飲水脾困倦饒睡肝呵缺煩悶腎不語畏明當先視兒兼臟症先瀉其所實者而補其虛如脾虛益黃散主之此二症多病於秋夏也五月夏至後吐瀉身壯熱者此熱也蓋小兒臟腑十分中九分熱也或因傷熱乳食不消瀉深黃色玉露散主之玉露散一名甘露散寒水石半兩軟而微青黑中有細紋者生甘草一錢石膏半兩堅白而有牆壁手不可折者如無以方解石代之堅白似石膏敲之段段皆方者是上同為細末每服一字或五分一錢食後溫湯調下海藏云非腎熱相火大盛者不宜服此六月大暑後吐瀉身大溫而似熱臟腑中六分熱四分冷也吐嘔乳食不消瀉黃白色似渴或食乳或不食乳食前少服益黃散食後多服玉露散廣親宮五太尉病吐瀉不止米穀不化衆醫用溫藥一日而加喘吐不定錢氏曰當以涼藥治之所以然者謂傷熱在內也用石膏湯三服並服之衆醫皆言吐瀉多而米穀又不化當補脾何以用涼藥王信衆醫皆用補脾丁香散三服錢醫後至曰不可服此三日後必腹滿身熱飲水吐逆三日外果如所言所以然者謂六月熱甚伏入腹中而令引飲熱傷脾胃即大吐瀉也醫又行溫藥使上焦亦熱故喘而引飲三日當甚衆師不能治復召錢至見其熱證以白虎湯三服更以白餅子下之一日減藥二分二日三日又與白虎湯各二服四日用石膏湯一服及旋合麥門冬黃芩腦子牛黃天竺黃茯苓以硃砂為衣服五丸竹葉湯化下熱退而安七月立秋後吐瀉身溫臟腑中三分熱七分冷也不能食乳多似睡悶亂哽氣長出氣睡露睛唇白多噦欲大便不渴食前多服益黃散食後少服玉露散廣親宮七太尉七歲病吐瀉是時七月其症全不食而昏睡睡覺而悶亂哽氣乾嘔大便或有或無不渴衆醫作驚治之疑睡故也錢曰先補脾後退熱與使君子丸補脾石膏湯退熱次日又以水銀硫黃末研和以生薑水調下一字錢曰凡吐瀉五月內九分下而一分補八月內九分補而一分下此者是脾虛瀉醫妄治之至於虛損下之即死即當補脾若以使君子丸恐緩已又留溫胃益脾藥治之醫者李生曰何食而噦錢曰脾虛津少即嘔逆曰何瀉青褐水曰腸胃至虛冷極故也錢治而愈八月秋分後吐瀉身冷無陽也不能食乳乾嘔噦瀉青褐水當補脾益黃散主之不可下也田凡小兒盛暑吐瀉邪熱在下焦則瀉在上焦則吐亡津必渴用玉露散雖吐時時與啜之過三日必愈如身熱脈大小便黃用五苓益元各半熱湯調溫服之如身涼脈細小便青早晨益黃散午後玉露散如過四五日困弱宜異功散和中丸開胃丸潔如有風而瀉用防風羌活謂吐瀉兼肝病風搐拘急也有熱而瀉用黃連黃芩大黃謂吐瀉兼心病身熱也有寒而瀉用附子謂吐瀉兼腎病身冷或足脛寒而逆也有濕而瀉用白朮茯苓謂吐瀉兼本臟脾病多睡體重昏倦也有肺病而瀉用芍藥桂心定喘麥冬人參甚者多檳榔大便不通加大黃謂吐瀉兼肺病喘嗽也更詳看病新舊新則止之久則有腸風之患宜推陳致新法當宣風散導過後用入臟君臣藥調之宜益黃散錢傷寒吐瀉身溫乍涼乍熱睡多氣粗大便黃白色嘔吐乳食不消時咳嗽更有五臟兼見症當煎入臟君臣藥先服大青膏後服益黃散如先曾下或無下證慎不可下此乃脾肺受寒不能入脾也潔古云身溫吐瀉咳嗽是風木入於脾母虛其子亦弱法當煎檳榔豆蔻湯下大青膏後服益黃散傷風吐瀉身熱多睡能食乳飲水不止吐痰大便黃水此為胃虛熱渴吐瀉也當生胃中津液以止其渴止後用發散藥止渴多服白朮散發散大青膏主之潔古云吐瀉身熱而渴小便少者五苓散主之身熱而嘔者當服白朮散後煎檳榔木香湯下大青膏傷風吐瀉身涼吐沫瀉青白色悶亂不渴哽氣長出氣睡露睛此傷風荏苒輕怯因成吐瀉當補脾後發散補脾益黃散發散大青膏主之此二證多病於春冬也潔古云身涼吐瀉不渴者則知為寒煎附子桂枝湯下大青膏小兒傷於風冷病吐瀉醫謂脾虛以溫補之不已復以涼藥治之又不能散謂之本傷風醫者亂攻之因脾氣積虛內不能散外不能解至十餘日其證多睡露睛身溫風在脾胃故大便不聚而為瀉當去脾間風風退則痢止宣風散主之後用使君子丸補其胃亦有諸吐痢久不瘥者則脾虛生風而成慢驚矣海吐瀉過多脾胃虛乏欲生風候者四君子加白附子減半生薑煎服錢玉露散方見上和中散和胃止吐瀉定煩渴治腹痛人參茯苓白朮甘草炙乾葛黃耆炙白扁豆炒藿香各等分上為細末每服三錢水一盞半棗二枚去核生薑五片煎八分食前溫服海藏云和中散四君子湯加減法丹小兒周歲吐乳腹瀉滑石煅二錢白朮炒三錢乾葛一錢陳皮炙三分上為粗末煎飲之吐瀉身熱瀉黃多渴錢氏作熱病治在夏秋用玉露散兼益黃散相間服在春冬用白朮散大青膏亦相間服丹萬安膏方見吐門海吐利四肢脹滿腦門低陷四君子加藿香丁香芍藥等分煎服錢氏益黃散方見小兒大法條世和胃丸治吐瀉不止欲生慢驚丁香白朮各一兩半夏五錢藿香蠍尾各一錢上為末薑汁打糊為丸如小豆大三歲兒三十丸薑湯下閻理中丸治吐利不歇米穀不化手足厥冷方見傷寒金液丹治吐利日久脾胃虛損手足厥冷精神昏塞多睡露睛口鼻氣涼欲成慢驚風又治大人陽虛陰盛身冷脈微自汗吐利小便不禁舶上硫黃十兩先飛揀去砂石杵研為末用砂盒子盛令八分滿水和赤石脂鹽泥固封曬乾露地先埋一水罐盛水滿坐盒子在上又以泥固濟訖常以三斤火養三日三夜足加頂火一斤煅成冷取藥上以柳木槌乳鉢研為末每服二錢生薑米飲調下多服取效大人藥末一兩蒸餅一兩水浸去水餅和丸桐子大曬乾每服五十丸至百丸米飲空心下閻氏云吐瀉虛極當速生胃氣宜與理中丸並研金液丹末煎生薑米飲調灌之惟多服乃效俟胃氣已生手足漸熱然猶瘛瘲即減金液丹一二分增青州白丸子一二分同研如上服兼用異功散羌活膏溫白丸鉤藤飲子之類仍頻與粥雖至危者往往死中得生十救八九沈存中論金液丹見小兒吐利劇氣已絶服之得活者數人須多服方驗錢豆蔻散治吐瀉煩渴腹脹小便少舶上硫黃一錢滑石五分丁香豆蔻各半分上為細末每服一字至半錢米飲調下無時豆蔻散治虛寒而渴方見本條白朮散治虛熱而渴方見下吐條吐瀉身溫瀉黃白似渴錢氏作寒熱雜合病治在夏秋用玉露散益黃散相間服在冬春用益黃散大青膏相間服之錢異功散溫中和氣治吐瀉不思乳食凡小兒虛冷病先與數服以正其氣一方加木香人參茯苓白朮甘草陳皮各等分上為細末每服二錢水一盞生薑五片棗二枚同煎海藏云此方四君子湯補脾湯加減法也溫中丸治小兒瀉白胃寒故也腹痛腸鳴吐酸水不思飲食霍亂吐瀉人參白朮甘草各等分上為末薑汁麵糊丸如緑豆大米飲下二三十丸無時吐瀉昏睡露睛者胃虛熱吐瀉昏睡不露睛者胃實熱胃虛熱治法錢氏白朮散和中散是也胃實熱治法錢氏玉露散河間益元散是也半粟散治小兒脾胃虛寒吐瀉等疾及治寒痰半夏湯浸切焙一兩陳粟米陳粳米亦得用三分上㕮咀每服三錢水一大盞半生薑十片同煎至八分食前溫服世白附丸方見上脾主濕條錢氏吐瀉乳不化傷食也宜下之馮承務子五歲吐瀉壯熱不思食飲錢氏見兒目中黑睛少而白睛多面色㿠白曰此子必多病面色㿠白者神怯也黑睛少者腎虛也黑睛屬水本怯而虛故多病也縱長成必肌膚不壯不耐寒暑易虛易實脾胃亦怯更不可縱恣酒欲若不保養不過壯年也面上常無精神光澤者如婦人之失血也今吐利不食壯熱者傷食也又虛怯不可下下之虛入肺則嗽入心則驚入脾則瀉入腎則益虛但宜以消積丸磨化之為微有食也如傷甚則可下不下則成癖也若實食在內亦可下也下畢補脾必愈隨其虛實無不效者丹小兒吐瀉黃疸三稜蓬朮陳皮青皮神麯麥芽黃連甘草白朮茯苓上為細末生薑燈心湯調服傷乳食吐瀉加山楂時氣吐瀉加滑石發熱加薄荷吐丹萬安膏調脾順氣定驚脾胃不足吐乳黃疸治小兒一切等疾木香三錢沉香二錢檀香三錢香附一兩檳榔半兩白朮二兩肉蔻半兩薄荷二兩人參半兩甘草二兩辰砂三錢琥珀真珠青黛犀角各二錢半黃耆一兩麝香五分使君子一兩天竺黃半兩上為末煉蜜丸臨臥服薄荷汁或蜜水米飲化下世萬安膏治小兒脾胃虛弱腹生疳蟲癥瘕食積泄瀉常服消疳去積助胃氣和中疏氣滯人參一兩木香沉香藿香各半兩厚朴薑製一兩甘草半兩陳皮青皮乾薑肉桂各一兩夏不用使君子炮十個澤瀉冬不用春秋減半用上為末煉蜜丸如芡實大食前米飲化下如熱薄荷湯下一方無木香沉香藿香青皮使君子有白朮蒼朮茯苓豬苓錢吐沫及痰或白緑水皆胃虛冷吐稠涎及血皆肺熱久則虛吐痰涎冷者溫之田朱沉丹治小兒嘔吐不止硃砂二錢半沉香二錢藿香三錢滑石半兩丁香十四粒上為細末每服半錢用新汲水一盞芝麻油滴成花子抄藥在上須臾墜濾去水卻用別水空心送下定吐紫金核治小兒一切嘔吐不止半夏湯洗七次薑製人參白朮木香丁香藿香各二錢半上為細末稀麵糊為丸如李核大後用沉香一錢為末硃砂一錢水飛二味同研勻為衣陰乾每服一丸用小棗一枚去核納藥在內濕紙裹燒熟嚼與小兒服後以米飲壓之錢香銀丸治吐丁香乾葛各一錢半夏湯浸切焙水銀各半兩上上三味同為細末將水銀與藥研勻生薑汁丸如麻子大每服一二丸至五七丸煎金銀花湯下無時本白朮散治小兒吐嘔脈遲細有寒白朮人參半夏曲各二錢茯苓乾薑甘草各一錢上為末每服二錢水一盞姜三片棗一枚煎七分去渣溫服日二三一方無半夏曲有木香藿香湯小兒寒吐者由乳母當風取涼解脫致令風冷入乳變敗兒若飲之故嘔吐也乳母當食後捏去舊宿敗乳急服理中湯次用釀乳法其候是寒清痰夾乳吐出是也凡有此候服藥不效胃氣將絶藥不能下當服靈砂丸如大便通宜來復丹二藥常用驗丹吐乳尋田中蚯蚓屎研如泥食前米飲下五分不過三四次妙聖惠方錢藿香散治脾胃虛有熱面赤嘔吐涎嗽及轉過度者宜服麥門冬去心焙半夏曲炒甘草炙各半兩藿香一兩用葉石膏半兩上為末每服五分至一錢水一盞半煎七分食前溫服本治小兒嘔吐脈數有熱麥門冬散麥門冬半夏人參茯苓各二錢甘草一錢上為末每服二錢水一盞姜三片煎至五分去渣溫服日二三服錢氏玉露散方見吐瀉湯治小兒伏暑嘔吐清膈飲子香薷淡竹葉各一兩白茯苓人參半夏檀香甘草炙各半兩白粳米一合上㕮咀姜煎溫服大小加減小兒秋夏伏暑多有熱吐其吐黃涎頭額溫五心熱小便或赤而少乃熱吐也或乾嘔而無物宜香薷飲方見中暑本治小兒疳積黃瘦吐食川烏一錢定粉三錢艾灰二錢龍骨二錢上為末滴水丸如龍眼核大捏作餅子每服一餅米飲磨下錢鐵粉丸治涎盛潮搐吐逆水銀砂子二錢硃砂一分鐵粉天南星各一分炮去皮臍取末輕粉二分上同研水銀星散盡為度薑汁糊丸如粟米大煎生薑湯下十五丸至二三十丸無時田氏朱沉煎紫金核方見上寒條經治小兒吐不定用五倍子二個一生一熟甘草一握濕紙裹炮過同搗為末每服米泔調下半錢匕瘥錢二氣散治虛實冷熱霍亂吐逆硫黃不夾石者細研半兩水銀一分與硫黃同研上同研如墨煤色不見星為度每服一字至五分乾薑水調下不拘時量兒大小加減此散浮泛難調先灑少水以指緩緩研之稍稍增湯調之治大人小兒一切吐逆諸藥不效者服此頃刻如神湯凡小兒乳哺不宜飽滿飽滿而必溢故嘔吐生下吐見胎病明吐乳灸中庭一壯吐水吐蟲錢面㿠白無精光口中氣冷不思食吐水當補脾益黃散主之丹冬月吐蛔多是胃虛寒而蟲作吐用錢氏白朮散加丁香三粒錢吐水不止者屬心痛胃冷吐水心痛者蟲痛口中吐沫水者後必蟲痛泄瀉丹萬安膏治吐瀉腹痛吐乳方見吐門海吐瀉四君子加陳皮厚朴等分同煎一法加陳皮薑棗臟腑滑泄四君子加訶子五分米飲調下錢黃承務子二歲病傷食而瀉衆醫與止之十餘日便青白乳食不消身涼加哽氣昏睡咸謂困篤召錢錢先與益黃散補肺散各三服三日身溫而不哽氣後以白餅子微下之又與益脾散三服利止何以然利本脾虛傷食初不與下之留連十日上實下虛脾氣弱則引肺亦虛脾肺子母故也今先補脾則肺病自退即身溫不哽氣也然後下其所傷或曰何不先下後補曰便青為下臟冷若先下必大虛今先實脾而後下則不虛矣後更與補之乃安益黃散方見小兒大法溫中丸治胃寒瀉白腹痛腸鳴方見吐瀉丹瀉青亦是寒宜用蘇合香丸平胃散各等分蜜湯調服田便青者因驚風內臟脾氣不和治宜白朮湯潔凡大瀉引飲者其病不以新久皆宜服白朮散痢病亦同治丹小兒夏月泄瀉用益黃散瀉黃赤黑皆熱用益元散黃柏丸之類錢使君子丸治疳瘦泄痢腹脅脹滿方見疳門脈小兒大便青瓣飧泄脈小手足寒難已脈小手足溫易已乳食不化錢食不消脾胃冷故不能消化當補脾益黃散主之潔乳食不消初病忽然氣出冷四肢亦冷面白無光澤精神不定此乃胃氣不和可以大溫藥治之使君子丸益黃散主之若病泄瀉日久不瘥乳食不化是脾胃有風冷先服益黃散二服後用宣風散導之胃宜再補赤白痢丹治小兒痢疾黃連黃芩大黃甘草上煎服赤痢加紅花桃仁白痢加滑石末湯治痢之法若欲取積只用官局進食丸甚穩雖取積又能治痢萬無一失積已下急以四君子湯加豆蔻訶子補之次服厚腸香連丸得效丹治小兒赤白痢多體弱不堪下大困重者麻子一合炒令香熟為末每服一錢匕蜜漿水和服效疳瀉痢日久不瘥見疳門獨瀉不脹條錢瀉黃紅赤黑者皆熱毒瀉青白穀不化者胃冷白附香連丸治腸胃氣暴傷乳哺冷熱相雜渴痢赤白裡急後重腹痛扭撮晝夜頻並乳食減少黃連木香各一錢白附尖二個上末飯丸如粟米大每服十丸至二三十丸米飲下食前日夜各四五服豆蔻香連丸治泄瀉不拘寒熱赤白陰陽不調腹痛腸鳴切痛立效如神黃連炒三分肉豆蔻木香各一錢上為細末粟米飯丸如米粒大每服十丸至二三十丸日夜各四服食前米飲下田木香丸治小兒泄瀉青白膿血相雜黃連吳茱萸同炒去茱萸一兩肉蔻煨二個木香一錢上為細末麵糊丸如黍米大赤痢粟米飲下白痢厚朴湯下空心錢小香連丸治冷熱腹痛水穀利腸滑木香訶子肉各一分黃連半兩上為細末米飲和丸如緑豆大每服十丸至三五十丸食前頻服之海赤痢四君子加赤芍藥當歸入粟米少許同煎湯治熱痢備急方用井花水調臘茶蜜磨生薑渴則飲之錢黃柏丸治小兒熱痢下血黃柏去皮半兩赤芍藥四錢上為末飯和丸如麻子大每服一二十丸食前米飲下量兒加減本治小兒赤痢搗青藍汁二升分四服聖惠方治小兒中蠱下血姚治小兒尿血甘草五分以水六合煎取二合去渣一歲兒一日服令盡海白痢四君子等分加乾薑減半入粟米少許同煎廣治小兒久痢淋瀝水穀不消枳實六分搗末以米飲調二錢匕二歲兒服一錢丹小兒噤口痢釀乳法厚朴枳殼各五分白朮芍藥各半兩滑石一兩木通陳皮甘草各五分上分四帖細研桃仁七枚水二盞半煎取一盞與母服服時去宿乳令盡為妙黃連例錢氏法加黃柏為二聖丸治疳加橘皮為橘連丸治疳加榆仁為榆連丸治疳加黃芩大黃為三黃丸治積熱加阿膠茯苓為阿膠丸治痢加訶子木香為小香連丸治痢加豆蔻木香為豆蔻香連丸治瀉加木香白附子為白附子香連丸治痢加阿膠當歸乾薑為駐車丸治痢田小兒脅下滿瀉痢體重四肢不收痃癖積聚腹痛不嗜食痰瘧寒熱脾腧二穴在背十一椎下兩旁相去各一寸五分明秋深冷痢不止臍下二三寸間動脈中二壯痢下赤白脫肛十二椎下節間三壯又法翠尾骨上三寸骨陷間三壯炷如小麥大又法龜尾一壯脊端穹骨也腹脹附丁奚潔腹脹虛實凡久病吐瀉之後虛則其脈微細肺主目胞及腮脾主四肢若色淡黃目胞腮虛腫手足冷先服塌氣丸後服異功散和中丸四君子湯益黃散之類用諸溫藥養真氣異功散和中丸方見吐瀉四君子湯方見治虛實法塌氣丸胡椒一兩蠍尾半兩上為末糊丸如粟米大每服五七丸至一二十丸陳米飲下無時一方有木香一錢本調中丸治小兒久傷脾胃腹脹乾薑橘紅白朮茯苓木香砂仁官桂良薑各等分上細末糊丸如麻子大每服二三十丸食後熟水下潔實則脈洪實不因吐瀉久病後亦不因痢下腹脹而喘急悶亂更有痰有熱及有宿食不化而腹脹者宜服白餅子大黃丸解毒丸下之兼須詳認大小便如都不通先利小便後利大便白餅子方見癖解毒丸方見喉痹大黃丸方見傷寒云小兒熱結於內腹脹壯熱大便赤黃躁悶煩亂者宜瀉青丸錢腹脹由脾胃虛氣攻作也實者悶亂喘滿可下之用紫霜丸白餅子此言未下而喘者為實故可下若誤下而喘者為虛氣附肺不可下也紫霜丸白餅子方見癖不喘者虛也不可下若誤下之則脾虛氣上附肺而行肺與脾子母皆虛肺主目胞腮之類脾主四肢母氣虛甚即目胞腮腫四肢黃色治之用塌氣丸漸消之未愈漸加丸數不可以丁香木香橘皮豆蔻大溫散藥治之何以然脾虛氣未出故雖腹脹而不喘可以溫散藥治之使上下分消其氣則愈矣若氣虛已出附肺而行即脾胃內弱每生虛氣入於四肢面目矣小兒易為虛實脾虛則不受寒溫服寒則生冷服溫則生熱當識此勿誤也胃久虛熱多生疸病或引飲不止脾虛不能勝腎隨肺氣上行於四肢而目腫若水狀腎氣漫浮於肺即大喘也此當用塌氣丸病愈後面未紅者虛衰未復故也此下後喘故宜塌氣丸若未下而喘宜下之治腹脹者譬如行兵戰寇於林寇未出林以兵攻之必可獲寇若出林不可急攻攻則必有失當以意漸收之即順也寇未出林謂虛氣未出而不喘不目胞腮腫故可用丁香木香大溫散藥上下分消其氣而愈也寇已出林謂虛氣已出為喘為目腮腫須用塌氣丸漸消之治小兒虛腹脹先服塌氣丸不愈腹中有食積結糞小便黃時微喘脈伏而實時飲水能食者可下之蓋脾初虛而後有積所治宜先補脾然後下之後又補脾即愈也不可補肺恐生虛喘丹阿魏丸治小兒食積腹如蜘蛛狀肚痛小便白濁阿魏醋浸一宿研如泥半兩黃連炒半兩花鹼研如粉三錢山楂肉一兩連翹一兩半半夏皂角水浸一宿一兩上為末炒神麯糊丸如卜子大每服二十丸空心米飲下吃果子多者加胡黃連米食多者加神麯山楂肉食多者加阿魏又阿魏丸阿魏一兩黃連酒煮六兩上為末醋浸阿魏一宿研如泥湯浸蒸餅丸如元氣不足加人參小阿魏丸山楂肉三兩石鹼三錢半夏一兩上為末阿魏半兩醋浸糊丸白湯下小兒疳病或腹大胡黃連二錢去果積阿魏一兩半去肉積神麯二兩去食積黃連二錢去熱積麝香四粒通竅上為末每服十二粒白朮湯下無肥兒丸治小兒病多因缺乳吃食太早所致或因久患臟腑胃虛蟲動日漸羸瘦腹大不能行發豎發熱無精神黃連神麯各一兩麥芽炒半兩木香二錢檳榔三個不見火使君子肉豆蔻麵裹煨各半兩上為末糊為丸如桐子大每服三二十丸量兒加減熟水吞下六神丸治如前證丁香木香肉豆蔻用麵裹煨各五錢訶子煨去核半兩使君子蘆薈研各一兩上為末以棗肉和丸如麻子大每服五丸至七丸溫米飲下食前丁奚者腹大頸小黃瘦是也無辜哺露三候大體相似輕重立名宜服十全丹十全丹治丁奚哺露神效方檳榔枳殼麩炒青皮陳皮三稜炒蓬朮炒砂仁各半兩丁香木香各一分香附一兩上為末神麯糊丸如黍米大空心食前米飲下百丸一方去香附砂仁丁香三稜枳殼加五靈脂白蔻使君子蘆薈蝦蟆川芎世治小兒腹如蜘蛛四肢瘦者用黑骨雞子破頂入蜘蛛一枚於內以濕紙糊竅用文武火煨熟去蜘蛛食其雞子纍效必數枚方愈垣中滿分消丸黃連枳實厚朴各五錢乾薑薑黃豬苓砂仁澤瀉茯苓各三分陳皮白朮各一分半夏四分黃芩一兩二錢甘草一分上為細末蒸餅為丸如黍米大每服三十丸溫酒送下消痞丸快利之劑黃連半兩枳實黃芩甘草人參各三錢厚朴七分乾薑四分橘皮一錢薑黃五分上為細末蒸餅為丸如黍米大每服三十丸隨乳下丹腹脹蘿蔔子蘇梗乾葛陳皮各等分甘草減半如食減加白朮煎服垣升陽滋血湯二月間一小兒未滿百日病腹脹不大便二日便瘦弱遍身黃色宜升陽氣滋血和血補血利大便蠍梢二分神麯三分厚朴當歸各一錢桃仁十個升麻三分上作一服水一盞煎至半盞去渣食前服麻黃升麻湯治小兒面色痿黃腹脹食不下正月四月小兒服之神效麻黃二分桂枝一分杏仁吳茱萸草豆蔻厚朴曲末羌活各一分柴胡根五分白茯苓一分白朮青皮各五分升麻根蒼朮澤瀉豬苓陳皮各一分黃連五分黃柏一分上㕮咀作一服水一大盞煎七分去渣食前熱服丹寄子年五歲痘後肚急白朮一錢陳皮木通各五分犀角屑川芎白芷蘇梗甘草炙各三分上㕮咀水煎服田治腹脹引背食飲多漸漸羸瘦黃可灸脾腧二穴七壯在十一椎下兩旁相去各一寸五分黃疸灸三壯甲小兒腹滿不能食飲懸鐘主之丁奚即脹治見脹門丹溪條水腫丹白文舉兒五歲身面皆腫尿多山梔炒桑皮炒各一錢黃芩二錢半白朮蘇梗各一錢半上㕮咀作三帖水一盞半煎至半盞食前溫服湯退腫散氣方赤小豆陳皮蘿蔔子甘草炙各半兩木香炮七分上為粗末薑棗煎服大小加減又方白朮炒木香炮甘草炙茴香炒青皮各半兩巴豆三十粒去膜同青皮炒去巴豆不用上為末米飲調下又方用錢氏益黃散加木香去丁香加蘿蔔子去訶子為末大小加減米飲調下錢腫病腎熱傳於膀胱熱盛逆於脾胃脾虛而不能制腎水反克脾土脾隨水行脾主四肢故流走而身面皆腫也若加喘者重也何以然腎水勝而克退脾土反勝心火心又勝肺肺為心克故喘或問曰心刑肺肺本見虛今何喘實曰此有二一者肺大喘此五臟逆二者腎水氣上行旁侵於肺故令大喘此皆難治明水氣浮腫分水三壯疳潔疳者小兒病癖或久吐瀉醫者妄投轉過之藥小兒易為虛實致令胃虛而亡津液內發虛熱外消肌肉一臟虛則諸臟皆弱其病目胞腫腹脹痢色無常漸加瘦瘠久不痊可是腸胃有風積法當宣風散導之後各依本臟補其母錢諸疳皆依本臟補其母及與治疳藥冷則木香丸熱則胡黃連丸主之疳在內目腫腹脹利色無常或沫青白漸瘦弱此冷證也宜使君子丸使君子丸治臟腑滑及疳瘦下痢腹脅脹滿不思乳食常服安蟲補胃消疳肥肌厚朴去粗皮薑汁塗炙半兩使君子去殼一兩麵裹煨陳皮去白一分甘草炙銼半兩訶子半兩半生半煨去核青黛半兩是兼驚及帶熱渴者宜此方如只臟腑不調不用青黛上為細末煉蜜和丸如小雞頭大每服一丸米飲化下兒生百日以上三歲以下服半丸乳汁化下元方無青黛垣厚腸丸治小兒失乳以食飼之不能克化或生腹脹四肢瘦弱或利色無常陳皮三分麥蘖五分半夏三分枳殼五分蒼朮三分青皮二分人參三分厚朴二分曲末五分上為細末麵糊丸如麻子大每服二十丸溫湯送下忌飽食本芎朴丸治小兒疳瘦瀉白水腹脹芎藭厚朴各一兩白朮半兩上為細末煉蜜丸如小彈子大每服一丸米飲化下三歲以下半丸聖治小兒無辜疳肚脹或時瀉痢冷熱不調以漏蘆一兩杵為散每服以豬肝一兩散子一錢匕鹽少許水煮熟空心頓服世小兒腹大泄瀉水穀不化吃食不知飢飽纍效神麯炒麥芽炒三稜青皮香附山楂厚朴甘草藿香枳實地黃砂仁黃連棗子各等分上為末白湯調下量兒加減丹一富家子年十四歲面黃善啖易飢非肉不飽泄瀉一月來求治脈之兩手皆大怪不甚瘦倦以為濕熱當脾困而食少令反形健而多食且不渴豫意其疾必疳蟲作痢也取大便視之果蛔蟲所為適往他處有一小兒醫在側教其用治蟲藥治之禁其勿用去積藥約回途當為一看診而止痢也後勿果至次年春夏之交其瀉復作腹不痛而口乾豫曰此去年治蟲而不治疳故也遂以去疳熱之藥濃煎白朮湯下三日而瀉止半月後偶過其家見其子甚瘦豫教以白朮為君芍藥為臣川芎陳皮黃連胡黃連入少蘆薈為丸白朮湯服之半月而止禁其勿食肉與甜物三年當自愈錢大蘆薈丸治疳殺蟲和胃止瀉胡黃連黃連白蕪荑用仁蘆薈木香青皮雷丸破開白者佳赤者勿用鶴蝨微炒各五錢麝香另研一錢上為細末粟米飲和丸如緑豆大米飲下一二十丸不拘時胡黃連麝香丸治疳氣羸瘦出白蟲胡黃連白蕪荑仁各一兩半黃連木香各半兩辰砂另研一分麝香另研一錢上為細末麵糊丸如緑豆大米飲下五七丸至十丸三五歲以上者十五丸至二十丸服無時榆仁丸治疳熱瘦悴有蟲久服充肥榆仁去皮黃連去須各一兩上為細末用豬膽七個破開取汁與二藥同和入碗內甑上蒸九分每日一次候日數足研麝香五分蒸餅湯浸一宿同和成劑丸如緑豆大每服五七丸至一二十丸米飲下無時上四方治瀉而多食為蟲疳也錢木香丸治時時下利唇口青白如聖丸治冷熱疳瀉二方並見本條沒石子丸治泄瀉白濁及疳利滑腸悶痛木香黃連各一分沒石子一枚豆蔻仁二個訶子肉三個上為細末飯和丸如麻子大米飲下十五丸量兒加減食前湯休息痢及疳瀉痢遷延日月百藥俱試飲食不妨便痢不止用雞子一枚打破熔黃蠟一塊如指大以雞子和炒空心吃盡百醫百效無不獲安本小兒疳痢垂死者取益母草炙食之取足瘥止甚佳上治瀉而少食為冷疳也獨脹不瀉治法見脹門錢疳在外鼻下臭爛自揉鼻頭上有瘡不著痂漸繞耳生瘡世走馬牙疳神效乾薑白礬棗子燒焦存性為末敷患處田鼻疳治法先用甘草白礬湯洗淨後糝蘆薈黃連黃柏末日三敷一方用米泔洗黃連末敷日三四次亦佳世紅鉛散治走馬疳緑礬不以多少色鮮明者入乾鍋用炭火燒鍋赤傾出以好酒灑拌勻再入鍋如此數遍色紅研作細末入麝香少許先以溫漿水洗漱淨用指蘸藥有疳處貼之羅乳香丸治走馬牙疳如神乳香輕粉砒研各五分麝香少許上先將乳香研細入輕粉麝砒共再研勻用薄紙一韭葉闊去藥內按過揉紙少許丸如黃米大臨臥將藥填在患處至明則愈忌食醬醋鹽等物錢蘭香散治鼻瘡爛蘭香葉燒灰二錢銅青五分輕粉二字上末令勻看瘡大小干貼之龍骨散治口疳走馬疳砒霜一字粉霜半錢龍骨一錢定粉一錢半龍腦半字蟾酥一錢半上先研砒粉極細次入龍骨等研次入定粉等同研每用少許敷之經治小兒走馬疳蝕透損骨及小小攻蝕必效方天南星一個當心作坑子安雄黃一塊在內用麵裹燒候雄黃作汁以盞子合定出火毒去面研為末入麝香少許拂瘡驗錢白粉散治諸瘡烏賊魚骨末三匕白芨末二匕輕粉一匕上末先用清漿水洗拭過貼之山小兒牙疳用茴香桔梗燒灰存性敷之如干油調敷湯五福化毒丹治䘌鼻清膈涼血玄參桔梗去蘆各一兩赤茯苓人參牙硝青黛甘草各一錢麝香五分一方有龍腦五分上除麝香牙硝另研一處為末次和青黛等煉蜜丸如芡實大金銀箔為衣薄荷湯化下瘡疹餘毒磨生犀角水下上焦熱壅口齒鮮血宣露臭氣用生地黃汁化下食後錢大抵疳病當辨冷熱肥瘦其初病者為肥熱疳久病者為瘦冷疳是也冷者木香丸熱者黃連丸主之冷熱之疳尤宜服如聖丸胡黃連丸胡黃連黃連各半兩硃砂一分上二物為細末研入硃砂末都填入豬膽內用淡漿於砂銚子內懸胎煮一飯時久取出研入蘆薈麝香各一分飯丸如麻子大每服五七丸至一二十丸米飲下食後一方加蝦蟆半兩不燒木香丸木香青黛另研檳榔肉蔻去皮各一分麝香另研一錢半續隨子一兩半炒蝦蟆三個先用繩系曬乾燒存性上末蜜丸如緑豆大每服三五丸至一二十丸薄荷湯下食前如聖丸治冷熱疳瀉胡黃連川黃連白蕪荑去皮炒各三兩一本作一兩使君子去殼一兩麝香另研五分干蝦蟆五個酒浸煮成膏上前藥為末與膏丸如麻子大每服人參湯下二三歲五七丸以上十丸至十五丸無時湯小兒冷疳多渴好臥冷地煩躁啼叫飲食不進漸成羸瘦其候難明有若熱證但大便滑泄百藥不效是也因女子百藥俱試而無偶中者竟與錢氏木香丸不數服而愈自後凡有此證無不獲驗錢氏肝疳白膜遮睛湯氏肝疳眼白青兩眼睛癢錢氏筋疳瀉血而瘦並當補肝地黃丸主之方見勞瘵即六味地黃丸麝香丸治小兒一切驚疳等病草龍膽胡黃連各半兩木香蟬蛻去頭足洗淨各一錢瓜蒂龍腦麝香牛黃各一錢並各自研上豬膽為丸如桐子及緑豆大驚疳或祕或瀉清米飲送下小兒五七粒至一二十粒眼疳豬肝湯下疳渴燖豬湯下豬肉湯下亦得驚風發搐眼上竄薄荷湯下一丸更水研一丸滴鼻中牙疳瘡口瘡研貼蟲痛苦楝根湯或白蕪荑湯送下百日內小兒大小便不通水研封臍中有蟲候乾漆麝香各少許併入生油一兩點溫水化下一大丸慢驚勿服本睡驚丸治小兒一切驚疳食積風癇之證使君子五十粒香墨棗大一塊金銀箔各七片膩粉二錢上先將使君子存性同墨研細次入金銀箔乳鉢內研次入膩粉並麝香少許研令極細稀糊丸如桐子大陰乾每服一丸薄荷湯磨下一歲以下半丸一名青金丹極效田氏涼驚丸治小兒驚熱疳瘦乳癖方見驚搐錢氏心疳面黃頰赤身壯熱當補心安神丸主之方見治虛實法湯氏心疳口內生瘡田氏安神丸治心虛疳熱面黃頰赤壯熱驚啼神志恍惚不寧方見治虛實法湯鱉甲散治疳勞骨蒸鱉甲九肋者湯浸用童便塗炙黃氏蜜炙白芍藥各一兩生熟地地骨皮當歸人參去蘆各半兩上㕮咀每服二錢水半盞煎服豬肚丸治骨蒸疳勞肌體黃瘦木香半兩黃連生地青皮銀柴胡去蘆鱉甲九肋者湯浸用童便塗炙各一兩上為末豬肚一枚入藥於內以線纏之於砂罐內懸胎煮熟取出細研豬肚為丸如麻子大米飲送下大小加減不拘時服無龍膽丸治疳病發熱龍膽黃連使君子肉青皮各等分上為末豬膽汁和丸如桐子大每服三十粒量兒加減臨臥熱水下上四方治疳熱安神丸甘寒補心鱉甲散甘溫補脾後二方苦寒瀉脾瀉濕熱也世烏犀丸治小兒疳熱腹內生蟲肚大手足疲弱丁奚尫羸此方治疳熱如神黑牽牛二兩使君子七錢半青皮二兩雷丸二錢半苦楝皮半兩一方不用楝皮用蘆薈錢半鶴蝨五錢上同入鍋內炒焦為末麵糊丸如黍米大三歲兒二十丸米飲下食前烏犀丸食後黃龍丸二丁丸治乳癖食癖疳熱如神方見癖條湯疳熱當服進食丸磨積仍間服化蟲丸後服鱉甲散退熱次服肥兒丸進食丸方見癖鱉甲散方見前治疳熱化蟲丸白蕪荑黃連神麯麥芽各炒等分上末糊丸如黍米大空心米飲下豬膽汁尤佳肥兒丸方見前腹脹上疳熱當以積熱門參用如熱有作止者與潮熱門參用可也錢脾疳面黃腹大食泥土當補脾益黃散主之方見治虛實法湯脾疳食不消胃疳多吐錢大胡黃連丸治一切驚疳腹脹蟲動好吃泥土生米不思飲食多睡吼啀臟腑或瀉或祕肌膚黃瘦毛焦發黃飲水五心煩熱能殺蟲進飲食兼治瘡癬常服不瀉痢啀泥如切欲嘔聲胡黃連黃連苦楝子各一兩白蕪荑去殼半兩秋初三錢乾蟾頭燒存性另研一分麝香另研一錢青黛另研一錢半蘆薈另研一分上先將前四味為細末豬膽汁和為劑每一丸如胡桃大入巴豆仁一枚置其中用油單紙一重裹之同米一升許蒸米熟為度入後四味為丸少入面糊丸如麻子大與十丸或十五丸清米飲下食後臨臥日三服垣大芫荑湯又名梔子茯苓湯治黃疸土色為熱為濕當小便不利今反利者知黃色為燥胃經中大熱發黃脫落知膀胱腎俱受土邪乃濕熱之症鼻下斷作瘡者土逆行營氣伏火也能乳者胃中有熱故也喜食土者胃氣不足面色黑者為寒為痹大便青屬寒褐色血黑色熱蓄血中間黃色腸胃有熱治法當滋營潤燥內除寒熱外致津液山梔三分黃柏甘草炙各二分大蕪荑五分黃連麻黃羌活柴胡各三分防風一分白朮五分茯苓三分當歸四分上件銼如麻豆大作一服水一盞半煎至一盞去渣稍熱服食前上三方治疳黃食土前一方寒多者宜服後二方熱多者宜之丹疳黃食積白朮黃連苦參山楂各等分上用糊丸如麻子大食後白朮湯下十五丸山小兒疳黃雞蛋剜一小竅入巴豆淨一粒紙糊孔煨熟去巴豆食之隔一日再吃一二個丹小兒吃泥石膏黃芩陳皮茯苓甘草白朮水煎服經治小兒吃泥及䑋肚膩粉一分用砂糖搜丸如麻子大空心米飲下一丸瀉出土瘥䑋如掌切脹也錢初病疳津液少者當生胃之津液白朮散主之唯多則妙龍粉丸治疳渴草龍膽定粉微炒烏梅肉焙黃連各二分上為細末煉蜜丸如麻子大米飲下一二十丸無時湯三稜散治小兒尿白濁久則成疳宜疏脾土消食化滯三稜蓬朮炒益智仁甘草各一兩神麯炒麥芽炒橘紅各半兩上為末白湯調下世黃龍丸治停食化積磨積三稜蓬朮各三兩青皮陳皮各一兩半山楂乾薑各七錢半檳榔半兩上曬乾為末糊丸黍米大三歲兒每二十丸食後薑湯下食前烏犀丸相間服此治小兒疳積等證無不效者烏犀丸方見疳熱條錢膽礬丸治疳消癖進食止瀉和胃追蟲緑礬真者二兩膽礬真者為粗末一錢大棗四十個去核好醋一升以上四物同熬令棗爛候和後藥使君子去殼二兩枳實炒三兩黃連訶子去核各為粗末各一兩巴豆二十七個去皮破之以上五味同炒黑約三分干入後藥夜明砂蝦蟆燒存性各一兩苦楝根皮五錢以上三味再入炒候乾同前四物杵羅為末同前膏和入臼中杵千下如未成旋入熟棗肉亦不可多恐服之難化太乾即入溫水亦可丸如緑豆大每服二三十丸米飲溫水下不拘時丹肥兒丸治小兒疳積蘆薈另研胡黃連各二錢神麯四錢黃連白朮山楂炒各半兩蕪荑炒二錢半上為末將蘆薈末拌勻豬膽汁丸如粟米大每服六十丸食前白湯下本蘆薈丸治小兒疳積祕方蘆薈荊芥黑醜青皮各等分上治炮為末麵糊丸如粟米大一歲兒以下一丸或二丸亦不妨量大小加減錢肺疳氣喘口鼻生瘡當補脾肺益黃散主之方見治虛實法腎疳極瘦身有瘡疥當補腎地黃丸主之方見勞瘵即六味地黃丸湯腎疳齒爪黑上腎疳羸瘦瘡疥治法當與虛羸門相參用之錢骨疳喜臥冷地湯木香丸治渴好臥冷地世五疳保童丸治小兒乳食不擇冷熱好餐肥膩恣食甘鹹臟腑不和生疳青黛苦楝根皮夜明砂五倍子蘆薈黃連龍膽草白蕪荑乾蟾各一分麝香少蟬蛻去嘴爪一分豬膽大者五個拌諸藥焙乾上件粟米煮糊為丸如麻子大一歲兒三丸不拘時米飲下日三服忌豬肉聖治小兒腦疳鼻癢毛髮作穗面黃羸瘦益腦用鯽魚膽滴於鼻中連滴三五日效湯小兒腦疳者是胎熱所為但頭皮光急頭髮作穗或有頭瘡腫至囟囟腫則多損眼此疾因兒在胎中母臨月房事不已而成項軟倒肥而不瘦天柱骨倒也附子生去皮臍南星上末生薑自然汁調攤貼患處次服防風丸並瀉青丸世小兒久患疳疾體虛久不進飲食患久諸候退只是天柱骨無力醫者不識謂之五軟用白殭蠶真者去絲炒為末每服五分或一錢薄荷酒調下日三更須貼藥貼藥生筋散木鱉子三個萆麻子三十粒上各取肉同研用一錢津調先烘上令熱貼之上疳五軟蓋痿屬也不若用地黃丸及黃柏龜板之類為愈世小兒無辜疳者其候面黃髮直時時壯熱飲食不生肌膚積經日月遂致死者謂之無辜疳也言天有鳥名曰無辜晝伏夜游洗浣衣褥露之經宿或遇此鳥飛從上過將衣褥與小兒穿臥便令兒有此疾如禽獸生下有噤蟲若不速去當損其命又腦後有核初生軟而不覺痛其中有蟲如米粉得熱氣漸長大則筋結定蟲隨氣血流散所以停留子母相生侵蝕臟腑肌肉作瘡或大便泄膿血致使小兒漸漸黃瘦頭大發豎手足細弱生十二件無辜疾症天吊胡孫噤鵝口木舌懸癰重齶著噤臍風撮口重舌乳淵龜胸鱉甲散鱉甲醋炙三分檳榔三個沉香一分漏蘆甘草炙牛蒡子炒使君子赤芍藥訶子炮去核各半兩上為粗末每服一錢水半盞煎六分去渣溫服明多疳者囟會一壯瘡蝕齦斷臭穢沖人勞宮一壯錢疳皆脾胃病亡津液之所作也因大病或吐瀉後醫又以藥吐下致脾胃虛弱亡失津液且小兒病疳皆愚醫之所壞病假如潮熱是一臟虛一臟實而內發虛熱也法當補母而瀉本臟則愈假令日中發潮熱是心虛熱也肝為心母法宜先補肝母肝實而後瀉心心得母氣則內平而潮熱自愈醫見潮熱妄謂其實乃以大黃牙硝輩諸冷藥利之利既多而不能禁則津液內亡漸成疳也又如癖病發作寒熱飲水脅下有形硬痛法當用藥漸消磨之醫反以巴豆硇砂輩快藥下之小兒易虛易實下之既過胃中津液耗損漸成疳瘦又有病傷寒五六日間有下證以冷藥下之太過致脾胃虛而津液少即便引飲不止而生熱也熱氣內耗肌肉外消他邪相干證變諸端亦成疳病又有吐瀉久病或醫妄下之其虛益甚津液燥損亦能成疳也小兒病癖由乳食不消伏在腹中乍涼乍熱飲水不止或喘而嗽與潮熱相類若不早治必成勞疳以其有癖症則令兒不食致脾胃虛而發熱故引飲也飲多即蕩滌脾胃亡失津液不能傳化水穀其脈沉細益不能飲食致脾胃虛衰四肢不舉諸邪遂生羸瘦而成疳矣肥疳即脾疳也身瘦虛黃干而有瘡疥其候不一種種異端今略舉言之目澀或生白膜唇赤身干黃或黑喜臥冷地或食泥土身有瘡疥瀉青白黃沫水痢色變易腹滿身耳鼻皆有瘡髮鬢作穗頭大項細極瘦飲水皆其證也世心疳者苦要驚啼常只吃水少食辛味耳邊有青脈舌上有焦點者不治肝疳者目帶青左脅下硬多吐沫眼頭黑者不治脾疳者肚大青筋唇口無血色人中平下痢不止者不治肺疳者咳逆氣急瀉白水身上黑斑者不治腎疳者要吃咸醋吃水不住小便如粉汁齒黑有瘡骨出耳干腦焦不治虛羸錢虛羸脾胃不和不能食乳致肌瘦亦因大病或吐瀉後脾胃尚弱不能傳化穀氣有冷者時時下痢唇口青白有熱者身壯熱肌肉微黃此冷熱虛羸也冷者木香丸主之夏月不可服如有證則少服之熱者胡黃連丸冬月不可服如有證則少服之虛羸與疳門同治也木香丸胡黃連丸方並見疳條湯小兒疳積其狀漸黃瘦拍背如鼓鳴脊骨如鋸乃積而生熱成疳也宜服蘆薈丸露星膏蘆薈丸龍膽草黃連蕪荑去皮先炒黃色次入前二味一處炒赤色各一兩上為末另入蘆薈一分和勻爛飯丸如黍米大三歲兒服三十丸空心米飲送下露星膏黃耆蜜水炙胡黃連地骨皮柴胡各等分上為末煉蜜丸如芡實大隔宿酒浸露一宿次日澄去酒薄荷湯浸服之錢橘連丸治疳瘦久服消食和氣長肌肉橘皮一兩黃連米泔浸一宿一兩半上為細末另研入麝香五分用豬膽七個分藥入膽內漿水煮候臨熟以針微刺破以熟為度煮粟米粥和丸如緑豆大每服十丸至二三十丸米飲下量兒加減無時海藏云黃連苦燥可以瀉脾火長肌肉二聖丸治小兒臟腑或好或瀉久不愈羸瘦宜常服黃連去須黃柏去粗皮各一兩上為細末入豬膽內重湯煮熟丸如緑豆大每服二三十丸米飲下量兒加減頻服無妨潔小兒疳病肌羸血氣不足同大人勞瘵之疾治之上以潔古此言論之不拘冷熱虛羸皆用四君子地黃丸與前藥相兼服為得也聖又方治小兒尸疰勞瘦或時寒熱方用鱉頭一枚燒灰杵末新汲水下五分匕立可明羸瘦不生肌膚胃腧灸一壯田小兒疳瘦於胸下骨尖上灸三壯次於脊下端尾翠骨尖上灸三壯小兒疳瘦脫肛體瘦渴飲形容瘦悴諸方不瘥者取尾翠骨上三寸骨陷中灸三壯小兒身羸瘦賁豚腹腫四肢懈惰肩背不舉章門二穴各灸七壯世母氣不足則羸瘦肉極鶴節即虛羸之異名也湯小兒鶴節由稟賦不足血氣不榮肌肉瘦瘠則骨節皆露如鶴之足皆腎虛不生骨髓之故治法宜錢氏地黃丸加鹿茸牛膝宿食湯消食丸治宿食不消又名消乳丸砂仁陳皮炒三稜炒神麯炒麥芽炒各半兩香附炒一兩上末曲糊丸如麻子大食後白湯送下大小加減七聖丸三稜蓬朮川楝青皮陳皮芫花杏仁上件等分先用醋浸芫花一宿炒漸干次入蓬稜同炒赤色又入陳楝等再同炒一處令微焦取出為末前藥如各半兩杏仁亦用半兩湯浸去皮尖雙仁不用細研入巴豆二十粒去油和勻醋糊丸如黍米大一歲兒常服二丸臨臥溫熱湯送下使日間所飧之物一夜而化永無疳疾能使黃瘦子頓作化生兒今之小兒可去巴豆只入杏仁名七聖丸是也痞潔枳朮丸方見內傷飲食飲食不進四君子加薑棗煎枳實理中丸方見傷寒湯痞者塞也其病腹內氣結脹滿壯熱是也當疏利大便破結散氣常服進食丸聖甘遂散治小兒痞結雖服湯藥暫利而滯實不去心下堅脹按之輒啼內有伏熱破結甘遂煨赤青皮黃芩大黃炒各半兩上㕮咀煎去渣服量大小加減以利則止用之無不效湯戶部張侍郎小娘子患此蘊積結聚已經年矣其候腹滿壯熱大小便閉不食諸醫皆作虛熱潮熱或作胃寒不食治然既不食大小便自然少又欲作疳熱治百藥俱試而無一中勢已窘迫招豫視之問曰合服何藥答曰當服甘遂大黃張驚駭曰前諸醫者皆用補劑此女不進食久矣不宜利動腸胃豫答曰信我者生逆我者死張曰更有無甘遂而次於此藥方者可否豫令即服大承氣湯二服而愈次日診之尚有餘滯積實其症必過數日而復閉須服前藥始可除根數日後果再閉腹滿痞結再投此藥一服而痊錢小兒急欲乳不能食由客風熱入兒臍流入心脾經即舌厚唇燥口不能吮乳當涼心脾哺露湯哺露者因乳哺不消脾胃衰弱漸不能食血氣減損肌肉不榮柴骨羸露吸吸苦熱謂之哺露也宜麝香進食丸方見本條癖湯小兒積症面黃腫肚脹面合臥地小便如油多嘔眼睛黃腹內虛鳴多睡眼白黃赤白痢下發黃眼赤多瀉凡有積滯須辨虛實況孩兒虛瘦長短黑白南北古今不同不可一概論也豫今之法實者可服進食丸虛而微白及疳瘦者宜服肥兒丸肥兒丸方見疳門心疳條為丸如黍米大兒一歲十丸飯飲下錢小兒腹中有癖不食但飲乳是也當漸用白餅子送下白餅子滑石輕粉半夏湯洗焙乾南星各一錢為末巴豆二十四個去皮膜水一升煮水盡為度上研勻巴豆後入衆藥以糯米飯為丸如小緑豆大捏作餅子兒三歲以上三五餅四歲以下一二餅蔥白湯下臨臥服局進食丸治乳食不化心胸脹滿疳積肚疼木香炮枳殼去白炒當歸代赭石硃砂另研三錢巴豆去油膜一錢麝香另研五分上為細末麵糊為丸如黍米大一歲二丸量兒大小加減米飲送下活雙聖丸治小兒身熱頭痛飲食不消心腹脹疼痛大小便不利或下重數起未瘥可再服巴豆六十個去皮心膜研去油甘遂麥門冬去心三兩五錢甘草炙一兩硃砂另研一錢牡蠣二兩蕤核取仁四兩半另研上麥門冬甘草甘遂牡蠣四味為細末入巴豆硃砂蕤仁合和搗二千杵更入少蜜搗和極熟旋丸兒半歲服如蘇子大兒一歲服如麻子大分為二丸兒二歲服如麻子大一丸兒三四歲服如麻子大二丸五六歲服如麻子大三丸兒七八歲服小豆大二丸兒十歲微大如小豆大三丸以雞鳴時分服之如至日出不下者熱粥飲數合投之即下丸藥皆雙出也若利甚濃煎冷粥數合與之即止錢珍珠丸治小兒一切積聚驚涎宿食乳癖大小便澀滯療腹脹行滯氣巴豆仁十四個水浸一宿細研木香白丁香丁香各五分滑石二錢輕粉五分留少許為衣上為末研勻濕紙裹燒粟米飯為丸如麻子大一歲兒一丸八九歲至十五歲服八丸棗子煎湯放冷下如挾風熱難動者先服涼藥一帖乳癖者臨臥服數丸本消積丸治小兒食積氣濕氣面黃白多腫大便黃赤酸臭砂仁十二個丁香九粒烏梅肉三個巴豆去油三粒上細末糊丸如粟米大三歲以上五六丸以下二三丸用溫水下無時服大凡小兒身溫壯熱非變蒸之候大便白而酸臭為胃有蓄冷宜此藥消下後服溫胃藥若身溫壯熱大便赤而酸臭為胃有蓄熱宜此藥下後服涼胃藥無不愈一方有使君子七枚丹丁香化癖散治乳癖白丁香密陀僧硫黃以上各二錢硇砂五分輕粉少許上研細末每一歲兒服五分男病女乳調女病男乳調出下黑糞為度後用通膈丸泄之世二丁丸治小兒乳癖白丁香半兩丁香密陀僧各一兩韶粉一錢硫黃三錢上細末糊丸如小豆大三歲兒十丸日晡時米飲下飲乳者乳汁下次日當取下惡物熱即隨退加黃鶯屎一錢尤妙錢紫霜丸代赭石細研水飛二錢杏仁二十一個去皮尖巴豆二十一粒去油心皮膜上為細末飯丸如粟米大每服三五丸至十丸皂莢子湯下無時海藏云五色加減並見治法湯驚癖須用礞石藥方可治之上七方治癖皆峻劑若稍涉虛者必用四君子及益黃散之類兼服之祕録治小兒氣癖取三稜針作羹粥以米麵為之與乳母食每日取一棗大與兒吃亦得作粥與羹熱食之治小兒十歲以下及新生百日無問癇熱無辜痃癖等皆理之妙不可言者田小兒癖氣久不瘥者灸中脘一穴章門二穴各七壯章門在大橫外直臍季脅肋端側臥曲上足伸下足舉臂取之中脘在上脘下一寸臍上四寸居心蔽骨與臍之中從𩩲骭下取病人四指定穴並灸臍後脊骨中二七壯無不驗脾弱多困海脾胃不和四君子加白朮一倍薑棗煎脾困四君子加木香砂仁人參各半錢煎脾胃虛弱生氣多困四君子加炒半夏曲沒石子等分為末入冬瓜子少許同煎本治脾風多困用人參散入慢驚參用人參冬瓜仁各半兩南星切片用漿水薑汁煮存性一兩上為細末每一錢水半盞煎二三分溫服渴潔渴有三種一者乘熱積於心脾煩躁大渴引飲宜白湯謂不因吐瀉大病忽然而作二者因久病或取轉過度致脾虛引飲宜白朮散方見消疸海藏云治發渴四君子加乾葛枇杷葉先以棗湯煮過炙乾用各等分入木瓜少許同煎服亦治虛渴法也三者因患濕熱病熱結膀胱小便不利大渴引飲有表裡症者宜五苓散主之大小便祕無小兒初生大小便不通腹脹欲絶者急令婦人以溫水先漱口了吸咂兒前後心並臍下手足心共七處每一處凡三五次漱口吸咂取赤紅為度須臾自通不爾無生意有此證者遇此方可得再生矣田生下不大便治法先以硬蔥針紝入肛門如大便不下後用牛黃散送硃砂丸一時自見握宣丸治小兒便難燥結或服澀藥腹脹悶亂命在須臾可用此丸不移時大小便自利巴豆一錢半硫黃良薑附子檳榔甘遂各等分上為細末粟米飯和丸如緑豆大用椒湯洗小兒男左女右手握之用綿裹定看行數多少置藥洗去不用即止錢郁李仁丸治襁褓小兒大小便不通並驚熱痰實欲得溏動者大黃一兩酒浸半日炒乾為細末郁李仁去皮研二兩滑石細研十兩上先將郁李仁研成膏和大黃滑石丸如黍米大二歲兒服三二丸量大小與之或乳汁或薄荷湯下食前黃疸潔陽黃則大小便赤澀身熱是脾土與心火相搏為陽病法當先利小便後下大便凡治黃病腹脹當用茵陳蒿湯調下五苓散若欲利小便去大黃欲利大便則加大黃之類有陽證可服謂面赤飲水者是也茵陳湯五苓散方俱見傷寒湯身疼膊背強大小便澀皮膚面目齒爪皆黃小便如屋塵色利者易治澀者難治宜服五苓散加茵陳煎湯調又宜服導赤散加茵陳煎或身熱宜服小柴胡湯甚者服承氣湯田小兒身體蒸熱胸膈煩滿皮膚如青橘之黃白睛亦然濕熱所致也宜加減瀉黃散主之此藥能退脾土復腎水降心火黃連茵陳各五分黃柏黃芩各四分梔子茯苓澤瀉各三分上㕮咀都作一服水一大盞煎至六分去渣稍熱服食前潔陰黃則清便自調面目及身黃四肢冷是脾虛不能制腎水當用益黃散下使君子丸益黃散方見治法使君子丸方見疳淡黃白者胃不和也平胃散調中丸渴者人參白朮散平胃散方見泄瀉調中丸方見腹痛人參白朮散方見消渴月里生黃見胎驚條明飲水不渴面黃陽剛穴一壯錢黃相似身皮目皆黃者黃病也身痛膊背強大小便澀一身盡黃面目指爪皆黃小便如屋塵色著物皆黃渴者難治此黃疸也此一證多發於大病後又有一證不因病後身微黃者胃熱也大人亦同又有面黃腹大食土渴者脾疳也又有自生而身黃者胎黃也又書云諸疸皆熱色深黃者是也若淡黃兼白者胃怯不和也梔子柏皮湯治傷寒身黃髮熱梔子八枚黃柏一兩甘草炙半兩上水煎去渣溫服犀角散治小兒黃疸一身盡黃犀角一兩茵陳乾葛升麻龍膽草生地各半兩寒水石七錢半上㕮咀白水煎服一方治小兒忽發黃面目皮肉盡干黃以乾葛汁和蜜調服袖珍方無干葛用栝蔞連翹赤小豆湯治小兒傷寒發熱身黃麻黃連翹甘草生薑赤小豆生梓白皮各二兩杏仁四十個大棗十二個上㕮咀水煎服一方生小麥苗搗汁服之立效消食丸治小兒脾胃不和常服寬中快氣消乳食正顏色砂仁陳皮三稜蓬朮神麯炒麥芽炒香附米泔浸炒枳殼檳榔烏梅各半兩丁香二錢半上為末麵糊丸如緑豆大食後紫蘇湯下二三十丸茯苓滲濕湯治小兒黃疸寒熱嘔吐而渴欲飲水身體面目俱黃小便不利不得安臥不思食飲茯苓五分澤瀉三分茵陳六分豬苓黃芩黃連山梔防己白朮蒼朮陳皮青皮枳殼各二錢上㕮咀水煎徐徐溫服丹治小兒吐瀉黃疸三稜蓬朮青皮陳皮神麯麥芽黃連甘草白朮茯苓各等分上為末溫水調服若傷乳食吐瀉加山楂時氣吐瀉加滑石發熱加薄荷瓜蒂散治小兒忽發心滿堅硬腳手心熱變為黃疸不急治則殺人瓜蒂七個赤小豆七粒秫米七粒上為末用一字吹兩鼻內令黃水出余末盡水調服之得吐出黃水即愈一方瓜蒂一兩赤小豆四兩為末每服一錢溫水調服藥下即臥當吐清黃汁為效虛者不宜服腹痛湯小兒腹痛曲腰乾哭無淚面青白唇黑肢冷為盤腸內吊凡有此證急煎蔥湯淋洗其腹揉之蔥尉臍腹間良久尿自痛中出其疼立止續次服藥乳香沒藥各少許透明者細研上件木香一塊於乳鉢內磨水一分滾數沸調乳沒末此藥只一服效錢鉤藤膏治小兒腹中極痛乾啼後偃名盤腸內吊乳香研沒藥研木香薑黃各四錢木鱉子仁二十一個上先將後三味同為細末次研入上二味煉蜜和成劑收貯每一歲兒可服半皂子大余以意加減煎鉤藤湯化下無時次用魏香散魏香散蓬朮半兩阿魏一錢上先用溫水化阿魏浸蓬朮一晝夜培干為末每服一字或半錢煎紫蘇米飲空心調下無蒜乳丸治冷證腹痛夜啼大蒜一棵慢火煨香熟研爛乳香另研五分上研為丸如芥菜子大每服七粒乳汁送下上四方治寒腹痛屬盤腸內吊其候曲腰乾哭是也錢胃虛冷面㿠白色腹痛不思食當補脾益黃散主之若不下利者調中丸主之益黃散治下利而痛也調中丸治不利而痛也調中丸白朮人參甘草炒各半兩乾薑炮四錢上為細末蜜丸如緑豆大每服五七丸至十五丸食前溫水下海藏云仲景理中例也當歸散凡小兒夜啼者臟寒而腹痛面青手冷不吐乳是也宜此方服之效當歸去蘆頭白芍藥人參各一錢甘草炙五分桔梗陳皮各一錢上㕮咀煎五分時時少服愈上三方治寒腹痛屬胃虛其候不思食是也熱痛亦啼叫不止夜發面赤唇焦小便赤黃與三黃丸人參湯下三黃丸方見發熱法丹腹痛夜啼服牛黃丸如豆大乳化吃之於臍下書田字立安聖惠方錢積痛口中氣溫面黃白目無精光或白睛多及多睡畏食或大便酸臭者當磨積宜消積丸甚者白餅子下之後和胃用白朮散消積丸白餅子方見癖白朮散方見消渴丹食積腹痛硬必用紫蘇蘿蔔子之類世小兒好吃粽成腹痛用黃連白酒藥等分為丸服湯三稜散治積氣肚痛砂仁甘草益智炒去殼三稜蓬朮青皮炒各等分為末白湯點下蟲痛面㿠白心腹痛口中沫及清水出發痛有時安蟲散主之小兒本怯者多此病田氏云蟲痛啼哭俯仰坐臥不安自按心腹時時大叫面無正色或青或黃唇白又目無精色口吐涎沫此為蟲痛錢安蟲散治小兒蟲痛胡粉炒黃鶴蝨炒黃川楝子去皮核白礬枯二錢半上為細末每服一字大者五分米飲調下痛時服湯治蟲動痛極不可忍用乾漆半兩檳榔一枚生用窯老一塊再煅細研三件一處為末空心熱酒調良久取下蟲立愈驗窯老恐窯中煅過泥物也又方用乾漆一兩搗碎炒令煙盡出用新汲水入生麻油空心調下錢安蟲丸治上中二焦虛或胃寒蟲動及痛乾漆炒煙盡二分雄黃一分巴豆霜一錢上為細末糊丸如黍米大量兒大小服之取東引石榴根煎湯下或苦楝根或蕪荑湯下五七丸至二三十丸發時服蕪荑散主治同前凡小兒痛時便高聲啼叫人中上鼻頭唇口一時黑色脈法當沉弱而弦今反脈大是蟲症也白蕪荑乾漆炒各等分上為細末每服一字或五分或一錢米飲調下發時服丹蛔蟲用苦楝根為君佐以二陳湯煎下錢積痛食痛虛痛大同小異惟蟲痛者當口淡而沫自出治之隨其症用藥蟲與癇相似小兒本怯故胃虛冷則蟲動而心痛與癇症略相似但目不斜手不搐也安蟲散主之辛氏女子五歲病蟲痛諸醫以巴豆乾漆硇砂之屬治之不效至五日外多哭而俯仰睡臥不安自按心腹時大叫面無正色或青或黃或白或黑目無光而慢唇白吐沫至六日胸高而臥轉不安召錢至錢詳視之用蕪荑散三服見目不除青色大驚曰此病大困若更加瀉則為逆也至次日辛見錢曰夜來三更果瀉錢於瀉盆中看如藥汁以杖攪之見有丸藥錢曰此子肌厚當氣實今證反虛不可治也辛曰何以然錢曰脾虛胃冷則蟲動而今反目青此肝乘脾又更加瀉知其氣極虛也而丸藥隨糞下即脾胃已脫兼形病不相應故知死病後五日昏篤七日而死鵝口湯巢氏病源鵝口候者小兒初生口裡白屑滿舌上如鵝口故曰鵝口此乃胎熱而心脾最盛熏發於口也治用發纏指頭蘸井花水揩拭之睡時黃丹煅出火氣摻於舌上葛氏方如用前法其舌上白屑不脫可煮栗荴汁令濃以綿纏指頭拭之若春夏無栗荴子可煮栗木皮如用井花水法小兒初出腹有連舌下有膜如石榴子者中隔連其舌下後令兒言語不發舌不轉也可以爪甲摘斷之微有血出無害若血出不止燒發灰敷之即止口瘡見心主熱門口噤田大人小兒口噤不開牙關緊者諸藥無效天南星末一錢腦子少許相和研勻用指蘸生薑自然汁蘸藥於左右大牙根上擦之立開丹初生口噤不開不收乳用赤腳蜈蚣去足炙末豬乳汁調下五分三四服愈聖小兒生下七日口噤牛黃些少竹瀝調下一字以豬乳滴口中口噤搐鼻法用鬱金藜蘆瓜蒂為末水調搐之滯頤口角垂涎是也肅清心導痰丸治舌縱涎下方見大人門曾用甚妙湯小兒滯頤者多涎流出積於頤上此由脾胃冷涎多故也脾之液為涎緣脾胃虛冷不能制其津液故流出於頤法當補脾按內經云舌縱涎下皆屬熱此恐湯氏之偏見今兩存之以備參考張渙溫脾丹治滯頤效白朮青皮各半兩半夏曲丁香各一兩乾薑炮半兩上為細末糊丸如黍米大一歲兒十丸二歲二十丸米飲下臍風撮口錢小兒洗浴拭臍不幹風入作瘡令兒撮口甚者是胃虛氣不和口頻撮調氣益黃散主之赤腳金頭蜈蚣一條蠍尾四尾殭蠶七條瞿麥五分上為末先以鵝毛管吹豆大入鼻內嚏噴啼叫可醫更用薄荷湯下錢柏墨散治斷臍後為水濕所傷或䙀袍濕氣傷於臍中或解脫風冷所乘致令小兒四肢不和臍腫多啼不能乳哺宜速療之黃柏釜下墨乳發燒各五分上為細末每用少許敷之丹臍風濕鹽二兩豉二合杵成餅子如錢炙熱尉臍上安又以黃柏末敷之姚小兒臍腫桂心炙熱尉之日四五祕臍風瘡用年久東壁泥研敷之聖臍風久者成瘡不幹伏龍肝敷之又馬齒莧燒葉末敷之千金方子母治小兒臍赤腫杏仁杵如脂敷臍腫上聖治小兒臍中汁出不止並赤腫用枯白礬研細敷之世治嬰兒因剪臍傷外風致瘡不幹用白礬煅白龍骨各等分同為末每用少許敷之又方綿燒灰研細每少許乾摻之丹撮口夜合花枝煮汁拭口並洗愈田撮口治法用白殭蠶為末蜜調塗兒穀道又牛黃一錢竹瀝一合時時抹口中即瘥無小兒初生一七日內忽患臍風撮口百無一效坐視其死良可憫也有一法世罕知者凡患此證看兒齒齦上有小泡子如粟米狀以溫水蘸熟帛裹指輕輕擦破即開口便安不藥神效小兒初生臍風撮口諸藥不效者灸然谷穴在內踝前起大骨下陷中可灸三壯針入三分不宜見血立效甲臍風目上插刺絲竹空明臍腫腰對臍骨節間三壯世臍風撮口在百日內不治
