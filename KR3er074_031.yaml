body:
  text: 卷之三十一傷寒部陽明病問曰病有太陽陽明有正陽陽明有少陽陽明何謂也答曰太陽陽明者脾約是也正陽陽明者胃家實是也少陽陽明者發汗利小便胃中燥煩實大便難是也陽明之為病胃家實也問曰緣何得陽明病答曰太陽病發汗若下若利小便者此亡津液胃中乾燥因轉屬陽明不更衣內實大便難者此名陽明病也傷寒脈浮而緩手足自溫者是為系在太陰太陰者身當發黃若小便利不能發黃至七八日大便硬者為陽明病也陽脈實因發其汗汗出多者亦為太過太過為陽絶於里亡津液大便因硬也陽明病若能食為中風不能食為中寒陽明病但頭眩不惡寒故能食而咳其人必咽痛若不咳者咽不痛也陽明病不能食攻其熱必噦所以然者胃中虛冷故也以其人本虛故攻其熱必噦也陽明病脈遲食難用飽飽則微煩頭眩必小便難此欲作谷疸下之腹滿如故所以然者脈遲故也陽明病欲解時從申至戌上傷寒嘔多雖有陽明症不可攻也陽明病面合赤色不可攻之攻之必發熱色黃小便不利也陽明病心下硬滿者不可攻之攻之利遂不止者死利止者愈胃實不大便傷寒不大便六七日頭痛有熱者與承氣湯其小便清者知不在裡仍在表也須當發汗若頭痛者必衄宜桂枝湯陽明病脈浮無汗而喘者發汗則愈宜麻黃湯陽明病脅下硬滿大便不利而嘔舌上白胎者可與小柴胡湯若上焦得通津液得下胃氣因和身濈然汗出而解陽明中風脈弦浮大而短氣腹滿脅下及心痛久按之氣不通鼻乾不得汗嗜臥一身及面目悉黃小便難有潮熱時時噦耳前後腫刺之小瘥外不解病過十日脈續浮者與小柴胡湯脈但浮無餘症者與麻黃湯若不小便腹滿加噦者不治陽明中風口苦咽乾腹滿微喘發熱惡寒脈浮而緊若下之則腹滿小便難也許學士云宜小柴胡湯陽明腹滿脈浮緊口苦咽乾而喘若發熱汗出不惡寒反惡熱身重者忌發汗忌加燒針忌下也論見自汗陽明病脈浮而緊者必潮熱發作有時但浮者必盜汗出上胃家實不大便雖三尺之童亦知可下也殊不知仲景之法雖有胃實症若表未解及有半表者亦先用桂枝柴胡以解外然後視虛實消息之也陽明病自汗出若發汗小便自利者此為津液內竭雖硬不可攻之當須自欲大便時宜用蜜煎導而通之若土瓜根及入豬膽汁皆可導之蜜煎導法用蜜七合入銅器中微火熬稍凝似飴狀攪之勿令焦候可丸以手捏作挺子令頭鋭大如指長二寸許乘熱急作之納穀道中用手急捺住欲大便時乃去之又豬膽汁方用大豬膽一個瀉汁和醋少許和勻灌入穀道中如飯時頃大便自去太陽病寸緩關浮尺弱其人發熱汗出復惡寒不嘔但心下痞者此以醫下之也如其不下者病人不惡寒而渴者此轉屬陽明也小便數者大便必硬不更衣十日無所苦也渴欲飲水少少與之但以法救之渴者宜五苓散陽明病本自汗出醫更重發汗病已瘥尚微煩不了了者此大便必硬故也以亡津液胃中乾燥故令大便硬當問其小便日幾行若本小便日三四行今日再行故知大便不久出今為小便數少以津液當還入胃中故知不久必大便也陽明病潮熱不大便六七日恐有燥糞欲知之法少與小承氣湯轉矢氣者有燥屎可攻若不轉矢氣者無燥糞不可攻方論見潮熱陽明病汗出大便硬而譫語者宜小承氣湯方見譫語不大便腹滿者宜下之若但繞臍痛者則為燥屎宜承氣湯若心下至小腹滿痛者則為結胸宜陷胸湯方見腹痛陽明病不吐不下心煩者宜調胃承氣湯陽明病發熱汗出此為熱越不能發黃也但頭汗出身無汗汗劑頸而還小便不利渴飲水漿者此為瘀熱在裡身必發黃茵陳湯主之小便不利大便乍難乍易有微熱喘冒不臥者宜大承氣湯論見不得臥陽明症其人喜忘者必有蓄血所以然者本有久瘀血故令喜忘屎雖硬大便反易其色必黑宜抵當湯下之方見蓄血無盡里症下後脈數不解消穀易飽六七日不大便者有瘀血宜抵當湯傷寒六七日目中不了了睛不和無表裡證大便難身微熱者此為實也急下之宜大承氣湯趺陽脈浮而澀浮則胃氣強澀則小便數浮澀相搏大便難其脾為約麻仁丸主之麻仁丸丹溪云氣實而表藥也麻仁一升芍藥厚朴去皮薑製枳實各四兩杏仁大黃煨各八兩上為末蜜和丸如桐子大米飲下二三十丸未知益之每日三服陽明口燥但欲漱水不欲咽者此必衄活人云輕則犀角湯重則抵當湯許學士有一士人家病二人皆旬日矣一則身熱無汗大便不通小便如澀神昏而睡診其脈長大而實豫用承氣下之而愈一則陽明自汗大便不通小便利津液少口乾燥其脈亦大而虛作蜜煎三易之下燥糞得溏利而解其家曰皆陽明不通何以治之異豫曰二症雖相似然自汗小便利者不可蕩滌五臟為無津液也然則傷寒大症相似兩症稍有不同宜仔細斟酌正如格局看命雖年月日時皆同而貴賤窮通不相侔者於一時之中有淺深故知不可不謹陽明病發多反無汗其身如蟲行皮中狀者此久虛故也陽明病反無汗而小便利三日嘔而咳手足厥者必頭痛若不咳嘔手足不厥者頭不痛注云小便利者寒邪內攻肢厥頭痛寒邪外攻也陽明胃實脈浮無汗而喘宜麻黃湯論見胃實有表條陽明病無汗小便利心中懊憹者身必發黃宜茵陳蒿湯脈浮而數能食不大便者此為實名曰陽結也期十七日當劇脈沉而遲不能食身體重大便硬名曰陰結也期十四日當劇少陰病但欲寐腹脹不大便者承氣湯主之論見但欲寐胃實續法集傷寒大便不通期門一雲章門照海海已寒丸治陰症服四逆數日不大便躁渴者方見躁條自汗成自汗者謂不因發散而自然汗出也問曰陽明外症云何答曰身熱汗自出不惡寒反惡熱也問曰病有得之一日不發熱而惡寒何也答曰雖得之一日惡寒將自罷即自汗出而惡熱也問曰惡寒何故自罷答曰陽明居中土萬物所歸無所復傳始雖惡寒二日自止此為陽明病也傷寒轉屬陽明者其人濈然微汗出也本太陽初得病時發其汗先出不徹因轉屬陽明也汗出身熱不惡寒便譫語者宜承氣湯論見譫語陽明病發熱汗多者急下之宜大承氣湯許有人患傷寒目痛鼻乾不得臥大便不通尺寸脈俱大已數日一夕汗出豫謂速以大柴胡湯下之醫駭曰陽明自汗津液已涸法當用蜜煎何苦須用下藥豫謂曰子雖知蜜煎為穩當還用大柴胡湯此仲景不傳之妙公安能知之豫力爭竟投大柴胡湯二帖愈仲景論陽明之病多汗者急下之人多謂已是自汗若又下之豈不表里俱虛又如論少陰雲少陰病一二日口乾燥者急下之人多謂病發於陰得之日淺但見乾燥若更下之豈不陰氣愈甚舉此二端則其可疑者不可勝數此仲景之書世人罕能讀也豫謂仲景稱急下之者亦猶急當救表急當救里之説凡稱急者有三變謂才覺汗未至津液乾燥便速下之則為徑捷免致用蜜煎也若胸中識得了了自無可疑若未能了誤用之反不若蜜煎之為穩也陽明脈浮而緊咽燥口苦腹滿而喘發熱汗出不惡寒反惡熱身重若發汗則心憒憒反譫語若加燒針必怵惕躁不得眠若下則胃中空虛客氣動膈心中懊憹舌上胎者梔子豉湯主之若渴欲飲水口乾舌燥者白虎加人參湯主之若脈浮發熱渴欲飲水小便不利者豬苓湯主之注云脈浮發熱口苦者邪在表脈緊自汗腹瞞不惡寒者邪在裡此表裡俱有邪宜和解陽明欲食小便反不利大便自調其人骨節疼翕翕如有熱狀奄然發狂濈然汗出而解此水不勝穀氣與汗共並脈緊則愈陽明病若中寒不能食小便不利手足濈然汗出此欲作痼瘕必大便初硬後溏所以然者以胃中冷水穀不別故也太陽病發熱汗出不惡寒者為柔痓論見痓太陽病吐後汗出不惡寒發熱關上脈細數曰小逆論見發熱汗出身熱不惡寒里症前條陽明病是也汗出身熱惡風寒者宜桂枝湯論見發熱兼項強痛者桂枝加葛根湯論見項強兼骨節煩疼不得屈伸小便不利者甘草附子湯論見風濕身熱條若發汗後遂漏不止惡風者桂枝附子湯論見後條若夏月中暑自汗身熱惡寒脈微弱口渴足冷者白虎加人參湯主之方論見中者傷寒汗出而渴者五苓散主之不渴者茯苓甘草湯主之汗出心下痞滿有二症其痞按之濡軟不痛而惡寒者宜附子瀉心湯其痞按之硬引脅痛而身體不惡寒者宜十棗湯方論見痞條太陽病發汗遂漏不止其人惡風小便難四肢急難以屈伸者桂枝加附子湯主之桂枝加附子湯附子制一個桂枝去皮二兩生薑一兩半甘草炙一兩大棗六枚上㕮咀每服五錢水煎溫服許有一人得太陽症因發汗汗不止惡風小便澀足攣而不伸豫診其脈浮而大浮為風大為虛豫曰在仲景方中有兩症大同而小異一則小便難一則小便數用藥少瘥即有千里之失仲景第七症云太陽發汗遂漏不止其人惡風小便難四肢微急難以屈伸者桂枝加附子湯第十六症云傷寒脈浮自汗出小便數心煩微惡寒腳攣急反以桂枝湯攻表此誤也得之便數咽中干煩躁吐逆一則漏風小便難一則自汗小便數或惡風或惡寒病各不同也豫用第七症桂枝加附子湯三啜而汗止佐以甘草芍藥湯足便得伸二陽並病太陽病發汗不徹因轉屬陽明續自微汗出不惡寒其人面赤躁煩短氣不知痛處但坐更發汗則愈論見面赤發汗已身灼熱者名風溫風溫為病脈浮汗出身重多眠宜葳蕤湯論見風溫發汗後大汗出胃中干煩躁不得眠欲得飲水者少少與之論見不得眠動氣在左發汗則頭眩汗不止筋惕肉瞤此為逆難治治法見後續條汗下後汗出而喘者麻黃杏仁甘草石膏湯下後利不止脈促喘而汗出者葛根黃芩黃連湯論俱見喘汗出下利熱不去厥逆惡寒者四逆湯下利清穀者通脈四逆湯論俱見下利汗出下利有微熱者其脈數自愈脈緊未愈論見下利六七日後發熱而利其人汗出不止者死論見下利脈緊反汗出而咽痛吐利者少陰病亡陽吐利汗出手足厥冷脈微欲絶者四逆湯吐利止汗出而厥脈微欲絶者通脈四逆加豬膽汁湯方論並見吐利脈陽微而汗出者為自和也汗出多者為太過陽明汗多而渴者不可與豬苓湯脈浮自汗若小便數腳攣急者不可與桂枝湯自汗續法海太陽自汗桂枝湯陽明自汗白虎湯少陰自汗四逆湯陽明症身熱目痛鼻乾不得臥不惡寒而自汗或惡熱而尺寸俱浮者白虎湯主之傷寒尺寸脈俱長自汗大出身表如冰石脈傳至於里細而小及瘧疾但寒不熱其人動作如故此陽明傳入少陰戊合癸即夫傳婦也白虎加桂枝主之然脈雖細小當以遲疾別之此症脈疾而非遲故用此法白虎加桂枝湯方見瘧如中暑自汗微惡寒者亦宜服之活傷寒應發汗而動氣在左不可發汗發汗則頭眩汗出筋惕肉瞤此為逆難治先服防風白朮牡蠣散次服建中湯防風白朮牡蠣散治發汗多頭眩汗出筋惕肉瞤防風牡蠣炒成粉白朮各等分上為細末每服二錢以酒調下米飲亦得日二三服汗止後服小建中湯成或汗出發潤與其出如油或大如貫珠著身出而不流皆為不治之症集傷寒汗多不止內庭瀉合谷瀉復溜瀉二陽並病潮熱譫語而手足漐漐汗出者陽明病短氣腹滿而手足濈然汗出者俱宜大承氣湯方論見潮熱陽明病不能食小便不利手足濈然汗出者胃冷欲作痼瘕必大便初硬後溏論見自汗不得臥身熱目疼鼻乾不得臥尺寸脈俱長者陽明受病也病人小便不利大便乍難乍易時有微熱喘冒不能臥者有燥屎也宜大承氣湯汗後大汗出煩躁不得眠欲飲水者少少與之愈論見渴汗下後不得眠若反覆顛倒心中懊憹者梔子豉湯方論見煩若但晝不得眠夜安靜不嘔不渴無表症脈沉微無大熱者宜乾薑附子湯論見煩躁少陰病欲寐二三日後煩心不得臥者黃連阿膠湯主之論見煩躁黃連阿膠湯黃連阿膠各一兩黃芩五錢芍藥一兩雞子一個上㕮咀水二盞煎八分去渣納膠消盡又納雞子黃攪勻溫服日三少陰病下利欲寐六七日後咳而嘔渴心煩不得眠者宜豬苓湯論見下利少陰病但欲寐脈沉細不煩五六日變自利煩躁不寐者死論見不得寐發熱下利厥逆煩躁不得臥者死論見下利不得臥續法活傷寒吐下後心煩乏氣日夜不得眠者酸棗仁湯主之酸棗仁湯酸棗仁一升麥門冬去心一合甘草炙二錢半知母半兩茯苓川芎乾薑各一兩上㕮咀每服四錢水煎服傷寒大熱乾嘔呻吟錯語不得眠者黃連解毒湯主之黃連黃芩黃柏各半兩山梔二錢一方有阿膠二錢上㕮咀每服五錢水煎服如未知再服進粥以此漸瘥傷寒瘥後虛煩不得眠心中懊憹者烏梅湯主之梔子炒半兩烏梅去核四個黃芩甘草炙各半兩柴胡一兩上㕮咀每服四錢薑三片豉五十粒煎至七分去渣溫服一本有竹葉七片潮熱成潮熱者若潮水之潮其來不失時也一日一發指時而發者謂之潮熱若日三五發者是即發熱非潮熱也潮熱屬陽明必於日晡時發者乃為潮熱陽明病潮熱大便微硬可與大承氣湯不硬者不與之若不大便六七日恐有燥糞欲知之可少與小承氣湯入腹中轉矢氣者此有燥糞乃可攻之若不轉矢氣者此但初頭硬後必溏不可攻之攻之必脹滿不能食也欲飲水者與之則噦其後發熱者必大便復硬而少也以小承氣湯和之不轉矢氣者慎不可攻也陽明病脈遲雖汗出不惡寒者其身必重短氣腹滿而喘有潮熱者此外欲解可攻裡也手足濈然汗出者此大便已硬也大承氣湯主之若汗多微發熱惡寒者外未解也其熱不潮未可與承氣湯若腹大滿不通者可與小承氣湯微和胃氣勿令大泄下陽明病胃實譫語而潮熱者承氣湯主之大承氣湯海藏云厚朴去痞枳實泄滿芒硝軟堅大黃泄實必痞滿燥實四症全者方可用之大黃酒浸一兩治不大便地道不通酒浸上行引大黃至巔而下厚朴二錢薑製治腹脹滿枳實一枚治心下痞按之良久氣散痛緩此並主心下滿乃肝之氣盛也芒硝一兩治腹中轉矢氣內有燥屎本草云味辛寒潤燥上㕮咀水二大盞煎枳朴至一大盞下大黃復煎至六分去渣入硝又煎一二沸溫服如未利再作與服以通為度小承氣湯海藏云大黃泄實厚朴去痞必痞實全者可用大黃酒浸一兩厚朴薑製二錢枳實炒一枚上㕮咀同上法煎溫服以利為度不利再服不大便舌燥心下滿痛而日晡小有潮熱者宜大陷胸湯論見結胸陽明病發潮熱大便溏小便自利胸脅滿不去者小柴胡湯主之陽明為病胃實是也今便溏而言陽明病者謂陽明外症身熱汗出不惡寒反惡熱之病也陽明中風脈弦浮大短氣腹滿脅下及心痛鼻乾不得汗嗜臥身黃小便難時時噦而潮熱者小柴胡加茯苓主之傷寒十三日不解胸脅滿而嘔日晡時發潮熱已而微利此必柴胡症下之而不得利今反利者知醫以丸藥下之非其治也潮熱者實也先宜小柴胡湯以解外後以柴胡加芒硝湯主之柴胡一兩黃芩人參甘草炙生薑以上各五錢半夏湯浸三個大棗三枚芒硝一兩每服五錢水一盞半煎至八分去渣納芒硝更微沸溫服陽明病脈浮緊者必潮熱發作有時論見胃實有表條潮熱續法活冬月陽明潮熱脈浮而緊者發作有時但脈澀者心盜汗黃芩湯主之方見下利譫語陽明為病胃家實是也胃實則譫語故譫語宜入陽明門陽明病譫語發潮熱脈滑而疾者小承氣湯主之因與承氣湯一盞腹中轉矢氣者更服一盞若不轉矢氣勿更與之明日不大便脈反微澀者裡虛也為難治不可更與承氣湯陽明病譫語有潮熱反不能食者胃中必有燥屎五六枚若能食者但硬亦宜大承氣湯下之二陽並病太陽病罷但發熱手足漐漐汗出大便難而譫語者下之則愈宜大承氣湯陽明病其人多汗以津液出胃中燥大便必硬硬則譫語小承氣湯主之若一服譫語止勿更服汗出譫語者必有燥糞在胃中此為風也須下之必過經乃可下下之若早語言必亂以表虛里實故下之則愈宜大承氣湯夫實則譫語虛則鄭聲譫語者謂亂語無次第數數更端也鄭聲者謂鄭重頻煩也只將一句舊言重疊頻言之終日殷勤不換他聲也蓋神有餘則能機變而亂語數數更端神不足則無機變而只守一聲也傷寒四五日脈沉而喘滿沉為在裡而反發其汗津液越出大便為難表虛里實久則譫語成無己謂鄭聲為鄭衛之聲非是前辨已明少陽病發汗後及小便數腳攣急誤與桂枝攻表後若胃不和譫語者少與調胃承氣湯方論見厥三陽合病腹滿身重難以轉側口不仁而面垢譫語遺尿發汗則譫語下之則額上生汗手足逆冷若自汗出者白虎湯主之論見身重汗發多亡陽譫語者不可下與柴胡桂枝湯和其榮衛以通津液後自愈發汗多又重發汗者亡其陽譫語脈短者死脈自和者不死諸逆發汗病微者瘥劇者言亂目眩者死形作傷寒其脈不弦緊而弱弱者必渴脈澀者必譫語弱者發熱脈浮解之當汗出愈太陽病火劫汗後身黃小便難身體枯燥頭汗腹滿微喘或不大便久則譫語論見頭汗太陽病二日反躁乃尉其背而大汗出火熱入胃胃中水竭躁煩必發譫語十餘日振栗自下利者此為欲解也故其汗從腰以下不得汗欲小便不得反嘔欲失溲足下惡風大便硬小便當數而反不數及多大便已頭卓然而痛其人足心必熱穀氣下流故也少陽病咳咳而下利譫語小便難者被火氣劫汗故也吐下汗溫針後譫語柴胡湯症罷者此為壞病知犯何逆以法治之論見壞症胸滿譫語若下後煩驚小便不利身重不可轉側者柴胡加龍骨牡蠣湯主之方論見驚陽明病下血譫語者此為熱入血室但頭汗出者刺期門隨其實瀉之濈然汗出則愈腹滿譫語脈浮緊者刺期門論見腹滿太陽少陽並病發汗則譫語脈弦五六日譫語不止者宜刺期門論見項強婦人發熱經水適來譫語為熱入血室若熱除脈遲者身涼胸滿如結胸狀者刺期門若晝則明瞭暮則譫語者無犯胃氣及上二焦必自愈活人以小柴胡湯主之論見婦人傷寒傷寒十三日不解過經譫語者以有熱也當以承氣湯下之若小便利者大便當硬而反下利脈調和者知醫以丸藥下之非其治也若自下利者脈當微厥今反和者此為內實調胃承氣湯主之若下利譫語者有燥屎也宜小承氣湯方見潮熱上下利譫語其曰脈調和而手足和小便利者陽也故用承氣下之其脈當微厥反少陰但欲寐被火氣劫汗譫語小便難者陰也故當用補劑和之但欲寐下利譫語俱見下利少陰條許有人病傷寒下利身熱神昏多困譫語不得眠或者見下利便以譫語為陰虛症豫曰此亦小承氣症衆駭曰下利而服小承氣仲景之法乎豫曰此仲景之法也仲景云下利而譫語者有燥糞也屬小承氣湯而得解豫嘗讀素問云微者逆之甚者從之逆者正治從者反治從多從少視其事也帝曰何謂反治岐伯曰塞因塞用通因通用王冰注云大熱內結注瀉不止熱宜寒療結復須除以寒下之結散利止則通因通用也正合於此又何疑焉直視譫語喘滿者死下利者亦死譫語妄言身微熱脈浮大手足溫者生逆冷脈沉細者不過一日死矣譫語續法素譫語者氣虛獨言也全文見診愚用參耆歸術等劑治譫語得愈有百十數豈可不分虛實一概用黃連解毒大小承氣等湯以治之乎難脫陽者見鬼仲景謂亡陽譫語亦此義海黃耆湯治傷寒或時悲哭或時嬉笑或時太息或語言錯亂失次世疑作譫語狂言者非也神不守室耳兩手脈浮沉不一舉按全無力浮之損小沉之亦損小皆陰脈也甚者用調中丸或理中丸二方並見發熱下丹浦江鄭兄年二十歲九月間發熱頭痛妄言見鬼醫與小柴胡湯數帖熱愈甚豫視之形肥面亦帶白卻喜筋骨稍露診其脈弦大而數實脈本不實涼藥所致此因勞倦成病與溫補藥自安遂以參術為君苓芍為臣黃耆為佐附子一片為使與二帖而症不減或曰脈既數大狂熱而又大渴用附子誤矣豫曰此虛症而誤投寒涼之藥人肥而脈左大於右事急矣非加附子參術焉能有急效再與一帖乃去附子作大劑與服至五十帖得大汗而愈自後又補養兩月氣體方始平復一人五月內患譫語大發熱肢體不能舉喜冷飲診其脈洪大而數用黃耆茯苓濃煎如膏卻用涼水調與之三四服後病者昏睡如死狀但顏色不改氣息如常至次早方醒諸症悉退而安盧兄汗後再發熱妄言呂仲修汗後熱不退亦妄言陶明節熱退後不識人言語謬妄皆用參耆朮歸等補劑而愈信哉譫語屬虛者十居八九活大小便硬手足冷脈微細者必鄭聲也當服溫藥白通湯海藏用黃耆加乾薑湯方見傷寒發熱下侯輔之脈極沉細外熱內寒肩背胸脅斑出十數點語言狂亂或曰發斑譫語非熱乎豫曰非也陽為陰逼上入於肺傳之皮毛故斑出神不守舍故錯語如狂非譫語也肌表雖熱以手按之須臾冷透如冰與薑附等藥數日約二十餘兩得大汗而愈後因再發脈又沉遲三四日不大便與理中丸三日內約半斤其病全愈以此知侯公之狂非陽狂之狂乃失神之狂即陰虛也活大便祕小便赤手足溫脈洪數者必譫語也宜用調胃承氣湯海治老幼及虛人傷寒五六日昏冒言妄小便或淋或澀起臥無度或煩而不得眠並宜白虎湯加山梔一錢鬥治熱病及時疫心躁狂亂奔走狀似癲癇言語不定久不得汗及時疫不知人事者以人中黃不拘多少入罐內用泥封固武火煅半日去火候冷取出於地上以盆蓋半日許研細如面新汲水調下三錢或未退再服愈人中黃即屎也狂亂火劫汗後亡陽心驚狂起臥不安者桂枝去芍藥加蜀漆牡蠣龍骨救逆湯方論見驚汗家重發汗必恍惚心亂小便已陰痛與禹餘糧丸方見痞小腹滿發狂或身黃者宜抵當湯論見發熱方見蓄血遺尿狂言目反直視者此為腎絶論見大法狂亂續法活病人煩躁狂走妄言面赤咽痛脈實潮熱狂語如見鬼狀此陽毒也治陽毒法見陽毒門表者陽毒升麻湯黑奴丸里者大黃散本治傷寒發狂棄衣奔走逾牆上屋鵲石散黃連寒水石各等分上為細末每服二錢濃煎甘草湯候冷調下云傷寒心風狂妄者宜防風黃連湯黃連大黃防風遠志茯神各半兩上為細末每服一兩水煎服海黃耆湯治傷寒或歌或笑或悲哭譫言妄語方見發熱下陳志仁傷寒狂妄每欲狂走四五人扶捉不定脈虛數用柴胡湯反劇以參耆歸朮甘草陳皮煎湯一服狂定再服安睡集傷寒發熱不識尊卑曲池絶骨百勞湧泉甲熱汗不出狂互引癲疾合谷主之循衣摸床傷寒若吐若下後不解不大便五六日至十餘日日晡所發潮熱不惡寒狂語如見鬼狀若劇者發則不識人循衣摸床惕而不安微喘直視脈弦者生澀者死微者但發熱譫語者大承氣湯主之若一服利止後服太陽病以火劫發汗陰陽枯竭虛燥或不大便久則譫語甚者至噦手足躁擾捻衣摸床小便利者可治論見頭汗許有人病傷寒大便不利日晡發潮熱手循衣縫兩手撮空直視喘急更數醫矣見之皆走此誠惡候得之者十中九死仲景雖有症而無法但云脈弦者生澀者死已經吐下難以下藥謾且救之若大便得通而脈弦者庶可治也與小承氣湯一服而大便利諸疾漸退脈且微弦半月愈或問曰下之而脈弦者生此何意也豫曰金匱玉函云循衣妄撮怵惕不安微喘直視脈弦者生澀者死微者但發熱譫語者承氣湯主之豫嘗觀錢仲陽小兒直訣云手尋衣領及捻物者肝熱也此症在玉函列於陽明部蓋陽明者胃也肝有熱邪淫於胃經故以承氣瀉之且得弦脈則肝平而胃不受克此所謂有生之理讀仲景論不能博通諸醫書以發明其隱奧吾未之見也海藏云許學士作尋衣撮空是肝熱風淫末疾此論誠當然莫若以為肺熱之邪其人必妄言亂語難經云肺邪入心為譫語循衣摸床續法嘗治循衣摸床者數人皆用大補氣血之劑惟一人兼瞤振脈代遂於補劑中略加桂二分亦振止脈和而愈渴病人不惡寒而渴者此轉屬陽明也論見不大便服柴胡湯已渴者屬陽明也以法治之傷寒脈浮發熱無汗其表不解者不可與白虎湯渴欲飲水無表證者白虎人參湯主之渴欲飲水無表證者太陽症罷轉屬陽明也下二條意同皆太陽轉屬陽明故渴也服桂枝湯大汗出後大煩渴不解脈洪大者白虎加人參湯主之傷寒病若吐若下後七八日不解熱結在裡表裡俱熱時時惡風大渴舌上乾燥而煩欲飲水數升者白虎加人參湯主之王注云若純在表則惡風無時今表裡有熱故時時惡風也傷寒無大熱口燥渴心煩脈微惡寒者宜白虎加人參湯陽明病脈浮緊口苦腹滿而喘若下後渴欲飲水口乾舌燥者白虎加人參湯主之白虎加人參湯石膏碎四兩知母一兩半甘草一兩粳米一合人參二錢上㕮咀每服五錢水煎溫服上白虎加人參五條治表渴脈洪小便利者本有人初病嘔吐俄為醫者下之已七八日而內外發熱豫診之曰當用白虎加人參湯或曰既吐復下且重虛矣白虎可用乎豫曰仲景云若吐下後七八日不解熱結在裡表裡俱熱者白虎加人參湯正相當也蓋始吐者熱在胃脘而脈至今虛大三投湯而愈仲景既云傷寒若吐下後七八日不解表裡俱熱者白虎加人參湯主之又云傷寒脈浮發熱無汗其表不解不可與白虎又云脈浮滑此以表有熱里有寒白虎加人參湯主之國朝林億校正謂張仲景於此表裡自瘥矣豫謂不然大抵白虎能除傷寒中渴表裡發熱故前後二症或云表裡俱熱或云表熱裡寒皆可服之一種脈浮無汗其表不解全是麻黃與葛根症安可行白虎也林億見所稱表裡不同便謂之瘥是亦不思之過也太陽發熱不惡寒而渴者為溫病論見溫病活人葳蕤湯主之發熱不惡寒者以表解也太陽病者必頭痛身疼表未解也此表裡兩症皆兼見渴而下利屬少陰其病但兼欲寐小便白者四逆湯兼咳嘔不得眠小便不白者豬苓湯兼自利純青色水者大承氣湯有熱者白頭翁湯方論見下利消渴氣上衝心心疼飢不欲食食則吐蛔若下之則利不止若欲飲水者少少與之愈論見氣上衝心太陽病發汗後大汗出胃中干煩躁不得眠欲得飲水者少少與之令胃氣和則愈若脈浮小便不利微熱消渴者五苓散主之發汗已脈浮數煩渴者五苓散主之陽明病脈浮緊口苦腹滿發熱汗出不惡寒若下後脈浮發熱渴欲飲水小便不利者豬苓湯主之五苓散方豬苓去皮二兩澤瀉一兩白朮三兩茯苓去皮二兩桂枝去皮半兩上㕮咀為散每服三錢白湯調下海藏云五苓散當服而不服之谷消水去形亡必就陽明燥火戊胃發黃故有調胃承氣症不當服而服之是為犯本小便強利津液重亡而成血症輕則桃仁承氣湯重則抵當湯主之豬苓湯方豬苓去皮茯苓阿膠澤瀉滑石各半兩上㕮咀每服五錢水煎溫服日三渴而頭汗小便不利兼脅滿往來寒熱者柴胡桂枝幹薑湯兼發黃者茵陳蒿湯論見頭汗表不解心下有水氣乾嘔發熱咳嗽而渴者小青龍湯去半夏加栝蔞根湯論見咳夏月汗出惡寒身熱足冷而渴者為中暑白虎加人參湯及酒黃連主之方見中暑惡寒身熱者症似表也足冷者不可表發熱惡寒腹滿汗出小便利而渴者為肝乘脾刺期門論見腹滿表解不惡寒而渴者宜白虎湯方論見前陽明渴而脅滿及往來寒熱其症未經汗者小柴胡去半夏加人參栝蔞湯若汗下後者柴胡桂枝幹薑湯詳見脅痛並往來寒熱渴而心下硬痛日晡潮熱不大便者為結胸宜大陷胸湯若但硬不痛者為痞與瀉心湯不解反渴而小便不利者宜五苓散詳見結胸痞氣二門病在陽明應汗之反以冷水噀之灌之其熱益煩肉上粟起意欲飲水反不渴者服文蛤散若不瘥與五苓湯論見結胸文蛤散方文蛤一兩即海蛤粉也河間丹溪多用之大能治痰上一味為散沸湯調服方寸匕渴欲飲水而不能飲者丹田有熱胸中有寒論見濕痹中風發熱六七日不解而煩有表裡症渴欲飲水水入則吐者名曰水逆五苓散主之渴欲飲水若太陽發汗後大汗出煩躁不得眠者及厥陰病氣起衝心心疼吐蛔者少少與之愈論見前條及氣上衝凡得時氣病至五六日而渴欲飲水不能多不當與之何者以腹中熱尚少不能消之更與水作病也至七八日大渴欲飲水者猶當依症與之與之常令不足勿極意也言能飲一斗與五升若飲而腹滿小便不利若喘若噦不可與之忽然大汗出是為自愈也活人云凡病非大渴不可飲水若小渴咽乾者少少咽潤之令其胃中和乃佳凡得病反能飲水此欲愈也但聞病飲水自愈小渴者亦強與之飲因成其禍不可復救活人云強飲水致飲停心下滿結喘者當以五苓散或陷胸湯主之下痢脈弱脈數而渴者自愈論見下利渴而發熱其脈不弦緊而浮弱者汗出愈論見譫語陽明病汗出多而渴者不可與豬苓湯以汗多胃中燥與豬苓湯復利其小便故也上活人云切戒太陽症無汗而渴者不可與白虎湯陽明症汗多而渴者不可與豬苓湯然太陽渴終不可與白虎耶太陽症得汗後脈洪大而渴者方可與之也陽明渴終不可與五苓散耶陽明症小便不利汗少脈浮而渴者方可與之也渴續法羅傷寒食少而渴者當以和胃之藥止之不可用涼藥止之恐復損胃氣愈不能食也白朮茯苓是也海秦二母病太陰病三日不解後嘔逆噁心而脈不浮與之半硫丸二三服不止復與黃耆建中湯脈中極緊無表裡病胸中大熱發渴引飲皆曰陽症欲飲之水豫反與薑附等藥緊脈反沉細陽猶未生以桂附薑烏之類酒丸與百丸接之二日中十餘服病人身熱煩躁不寧欲作汗也又以前丸接之覆以厚衣陽脈方出而作大汗翌日大小便始通下瘀血一盆如豬肝然用胃風湯加桂附三服血止其寒甚如此亦世之未見也少陰症口燥舌乾而渴尺寸脈俱沉沉遲則四逆湯沉疾則大承氣湯少陰口燥舌乾而渴身表涼脈沉細而虛者瀉心湯主之此有形無形藥也人參湯治傷寒七八日汗後心煩燥渴人參黃芩柴胡葛根各一兩川梔甘草炙各半兩上為粗末每服五錢薑棗煎溫服活陽毒倍常燥盛大渴者黑奴丸主之方見陽毒風溫加渴甚者宜栝蔞湯方見風溫中暑伏熱纍治不瘥其人發渴不已酒蒸黃連丸主之方見中暑脈熱病在腎令人渴口乾舌焦黃赤晝夜欲飲水不止腹大而脹尚不厭飲目無精光者死不治嘔傷寒發熱無汗嘔不能食而反汗出濈濈然者是轉屬陽明也食谷欲嘔者屬陽明也吳茱萸湯主之得湯反劇者屬上焦也腹痛欲嘔吐者黃連湯主之方論見腹痛嘔而發熱者小柴胡湯主之發熱微惡寒肢節煩疼微嘔心下支結外症未去者柴胡加桂枝湯主之論見發熱太陽病發熱惡寒身體痛嘔逆脈緊者名曰傷寒麻黃湯症論見發熱太陽與陽明合病不下利但嘔者葛根加半夏湯主之活人云頭疼身熱痛肌熱目疼鼻乾脈浮而長是也葛根加半夏湯葛根二錢麻黃生薑各一錢半甘草芍藥桂枝各一錢半夏二錢大棗二枚上㕮咀以水一斗先煎葛根麻黃減二升去白沫納諸藥煎服三升溫服一升覆取微汗嘔而往來寒熱胸脅苦滿者宜小柴胡若兼下利者乃太陽少陽合病宜黃芩加半夏生薑湯論見往來寒熱及下利太陽過經十餘日反二三下之後四五日柴胡症仍在者先與小柴胡湯嘔不止心下急鬱郁微煩者為末解也與大柴胡湯下之愈太陽病過經十餘日心下溫溫欲吐而心中痛大便反溏腹微滿鬱郁微煩先此時自極吐下者與調胃承氣湯若不滿者不可與但欲嘔胸中痛微溏者此非柴胡症以嘔故知極吐下也本渴而飲水嘔者柴胡不中與也論見脅痛先渴卻嘔者為水停心下此屬飲家活人云赤茯苓湯主之先嘔卻渴者此為欲解候也金匱云嘔思水者少與之嘔而下利有寒熱者為陽宜黃芩湯大柴胡湯無熱者為陰宜豬苓湯真武湯並見嘔利門嘔而脈弱小便利身熱見厥者難治四逆湯主之嘔而心煩若汗吐下後者梔子生薑豉湯若未曾吐汗下後兼咳而渴者宜豬苓湯詳見不得眠嘔多雖有陽明胃實不可攻之論見胃實嘔家有癰膿者不可治膿儘自愈服桂枝嘔者酒客病論見大法乾嘔乾嘔發熱兼自汗惡風鼻鳴者桂枝湯兼表不解有水氣而咳者小青龍湯方見發熱乾嘔脅痛若表解身涼短氣汗出不惡寒者十棗湯若兼往來寒熱脈沉緊者小柴胡湯論見往來寒熱乾嘔下利若兼表不解發熱而咳者小青龍湯去麻黃加芫花湯論見咳若表身涼脅痛短氣汗出者十棗湯論見脅痛若因下後心下痞硬滿腹中雷鳴日利數行者甘草瀉心湯論見痞若脈微厥逆者宜白通湯若用白通湯溫後利不止厥逆無脈者白通加豬膽汁湯論見下利乾嘔厥逆若脈微下利者通脈四逆湯白通加豬膽汁湯論見下利若脈弦遲不利者四逆湯論見吐乾嘔續法仲渴而飲水嘔者柴胡不中與也宜治膈間有水赤茯苓湯主之赤茯苓湯治傷寒嘔噦心下滿胸膈間有停水頭眩心悸赤茯苓一兩半夏薑製半兩橘紅芎藭各半兩人參一兩白朮半兩上㕮咀每服四錢薑五片水煎服傷寒瘥後嘔者有餘熱在胃脘也竹葉石膏湯加生薑主之海葛根湯治傷寒乾嘔不止葛根人參各一兩茯苓半兩半夏薑製七錢半白朮半兩黃耆七錢半麥門冬去心甘草炙各一兩上㕮咀每服三錢生薑三片棗二枚同煎服少陽病口苦咽乾少陽之為病口苦咽乾目眩也活人云宜小柴胡湯少陽中風兩耳無所聞目赤胸中滿而煩者不可吐下吐下則悸而驚誤吐氣虛者悸誤下血虛者驚傷寒脈弦細頭痛發熱者屬少陽少陽不可發汗發汗則譫語此屬胃家胃和則愈胃不和則煩悸傷寒三日少陽脈小者欲已也少陽欲解時從寅至辰上陽明病腹滿脈浮緊口苦咽乾而喘若其人發熱惡寒誤下之則腹滿小便難若其人發熱不惡寒反惡熱誤下之則胃空虛為懊憹誤下之則譫語誤加燒針則不得眠論見腹滿許學士云宜小柴胡湯眩眩而口苦舌乾者屬少陽論見口苦眩而心下硬項強者屬太陽少陽並病當刺大椎肺俞忌汗下論見項強眩而胃實若能食不惡寒者中風若飽則頭眩小便難者谷疸皆屬陽明論見胃實太陽發汗後仍發熱心悸頭眩身瞤振振欲劈地者真武湯主之方論見戰振動氣在左誤汗則頭眩汗不止筋惕肉瞤方論見動氣活人云宜小建中湯諸逆誤汗而言亂目眩者死論見譫語頭眩脈沉緊發汗則動經身為振振搖論見戰振往來寒熱本太陽病不解轉入少陽者脅下硬滿乾嘔不能食往來寒熱尚未吐下脈沉緊者與小柴胡湯若已吐下發汗溫針譫語柴胡症罷此為壞病知犯何逆以法治之傷寒五六日中風往來寒熱胸脅苦滿默默不欲飲食心煩喜嘔或胸中煩而不嘔或渴或腹中痛或脅下痞硬或心下悸小便不利或不渴身有微熱或咳者小柴胡主之血虛氣盡腠理開邪氣因入與正氣相搏結於脅下正邪分爭往來寒熱休作有時默默不欲飲食者臟腑相連其病必下邪高病下故使嘔也宜小柴胡湯柴胡二兩黃芩人參甘草各三錢半夏薑製六錢上㕮咀每服五錢生薑五片棗二枚同煎溫服日三服若胸中煩而不嘔去半夏人參加栝蔞實一枚苦渴者去半夏加人參三錢栝蔞根一兩若腹中痛者去黃芩加芍藥三分若脅下痞硬去大棗加牡蠣一兩心下悸小便不利者去黃芩加茯苓一兩若不渴外有微熱者去人參加桂三分溫覆取微汗愈若咳者去人參大棗生薑加五味子半兩乾薑三分凡柴胡病下之不罷者復與柴胡湯必蒸蒸而振卻發熱汗出而解傷寒中風有柴胡症但見一症便是不必悉具傷寒十餘日熱結在裡復往來寒熱者宜大柴胡湯論見結胸大柴胡湯柴胡二兩黃芩芍藥各半兩半夏制六錢生薑一兩枳實半兩大黃一兩上㕮咀每服五錢加大棗三枚水煎溫服以利為度未利再服許有人病傷寒心煩喜嘔往來寒熱醫以小柴胡與之不除豫曰脈洪大而實熱結在裡小柴胡安能去之仲景云傷寒十餘日熱結在裡復往來寒熱者與大柴胡湯三服而病除蓋大黃蕩滌蘊熱傷寒中要藥王叔和云若不用大黃恐不名柴胡須酒洗生用有力傷寒五六日已發汗而復下之胸腹滿微結小便不利渴而不嘔但頭汗出往來寒熱心煩此為未解也宜柴胡桂枝幹薑湯柴胡二兩桂枝乾薑各半兩栝蔞根黃芩各一兩牡蠣甘草炙各半兩上㕮咀每服五錢煎溫服微煩再服汗出愈病人脈微而澀者此為醫所病也大發其汗又數大下之其人亡血病當惡寒後乃發熱無休止時夏月盛熱欲著復衣冬月盛寒欲裸其身所以然者陽微則惡寒陰弱則發熱此醫發其汗令陽氣微又大下之令陰氣弱五月之時陽氣在表胃中虛冷以陽氣內微不能勝冷故欲著復衣十一月之時陽氣在裡胃中煩熱以陰氣內弱不能勝熱故裸其身又陰脈遲澀故知血亡也上脈微因大發汗所致故病當惡寒之時雖盛夏亦欲著復衣脈澀因大下所致故病當惡寒後發熱之時雖盛冬亦欲裸其體是皆亡血陽微陰弱不能勝冷勝熱非是盛夏牽延至盛冬也脅滿痛脅滿乾嘔往來寒熱者屬少陽方論見往來寒熱傷寒四五日身熱惡風頸項強脅下滿手足溫而渴者小柴胡去半夏加人參栝蔞根主之得病六七日脈沉浮弱惡風寒手足溫醫二三下之不能食而脅下滿痛面目及身黃頸項強小便難者與柴胡湯必下重本渴而飲水欲嘔者柴胡不可與也食谷者噦王注云不欲飲水而嘔者屬柴胡症若因水而嘔者水停心下也脅滿胃家實或嘔而舌上白胎者或脈弦浮大身黃小便難有熱者俱屬陽明症宜小柴胡湯方論見胃實脅滿潮熱大便溏利者小柴胡湯方論見潮熱若因下微利而嘔者先以柴胡湯解外後以柴胡加芒硝湯主之方論見潮熱太陽病十日已去脈浮細而嗜臥者外已解也若胸滿脅痛者與小柴胡湯脈浮者與麻黃湯太陽中風下利嘔逆表解者乃可攻之其人漐漐汗出發作有時頭痛心下痞滿硬引脅下痛乾嘔短氣汗出不惡寒者此表解里未和也宜十棗湯芫花炒黑甘遂大戟各等分上為細末合和之再入臼中杵二三百下先以水一升煮肥棗十枚取五六合去渣納藥末強人一錢虛人半錢單飲棗湯送下平旦服若下少病不除者明日更服加五分利後米粥自養若合下不下令人脹滿遍身浮腫也昔杜壬問孫兆曰十棗湯畢竟治甚病孫曰治太陽中風表解里未和杜曰何以知里未和孫曰頭痛心下痞滿脅下痛乾嘔汗出此知里未和也杜曰公但言病症而所以里未和之故要緊總未言也孫曰某嘗於此未決願聽開諭杜曰里未和者蓋痰與燥氣壅於中焦故頭疼乾嘔短氣汗出是痰膈也非十棗不治但此湯不得輕用恐損人於倏忽用藥者慎之婦人發熱惡寒經水適來熱除脈遲身涼脅滿如結胸狀譫語者刺期門論見譫語吐下汗後脈微心下痞脅痛氣上衝咽眩冒脈動惕者成痿論見痞下後脈弦者必兩脅拘急論見傷寒大法脅痛續法集傷寒脅痛支溝陽陵泉胸滿口苦咽乾又耳聾胸滿者屬少陽忌吐下宜柴胡湯論見口苦太陽陽明合病喘而胸滿者宜麻黃湯論見喘少陰病下利咽痛胸滿心煩者宜豬膚湯方論見下利太陽病下之脈促胸滿者桂枝去芍藥湯方論見惡寒若脈促不結胸者欲解也論見大法下後胸滿小便不利若兼煩驚譫語身重不可轉側者柴胡加龍骨牡蠣湯方論見驚若兼噦而舌胎者為濕痹論見體痛濕痹汗下後煩熱胸中窒者梔子豉湯主之論見煩病症發熱惡寒加桂枝或自汗但頭不痛項不強胸中痞硬氣上衝咽喉不得息者瓜蒂散主之論見氣上衝胸痛胸脅痛耳聾尺寸脈俱弦者少陽受病也論見大法活人云柴胡湯主之病胸中諸實胸中鬱郁而痛不能食欲使人按之而反有涎唾下利十餘行其脈反遲寸口脈微滑此可吐之利則止吐下後溫溫欲吐胸中痛大便溏腹滿而煩者宜調胃承氣湯論見嘔耳聾胸脅痛耳聾尺寸脈俱弦者少陽受病也論見大法口苦耳聾胸滿者少陽中風論見口苦未持脈時病人手必自冒胸師因教試令咳而不咳此必兩耳聾無聞也所以然者以重發汗虛故如此少陽病續法海辨表裡中三説假令少陽症頭痛往來寒熱脈浮此三症但有其一即為表也口失滋味腹中不和大小便或閉而不通或泄而不調但有其一即為里也如無上下表里症余皆虛熱也是病在其中矣陽氣毒盛變陽毒陽毒之為病面赤斑斑如錦紋咽喉痛唾膿血五日可治七日不可治宜升麻鱉甲湯升麻二兩當歸蜀椒炒去汗甘草各一兩鱉甲手指大一片雄黃研半兩上六味以水四升煮取一升頓服之取汗愈肘後千金方陽毒升麻湯有桂無鱉甲陰毒用甘草湯無雄黃陽毒續法活陽毒升麻湯治傷寒一二日便成陽毒或服藥吐下之後變成陽毒腰背痛煩悶不安面赤狂言奔走或見鬼或下利脈浮大數面赤斑斑如錦紋咽喉痛下膿血五日可治七日不可治升麻犀角鎊射干黃芩人參甘草各等分上㕮咀水煎服食頃再服溫覆手足出汗則解不解重作陽毒梔子湯治陽毒傷寒發熱百節疼痛升麻黃芩杏仁各二錢梔子赤芍各一錢石膏二錢知母大青各一錢甘草五分柴胡一錢半上㕮咀每服半兩薑五片豉百粒同煎大黃散治陽毒傷寒未解熱在內恍惚如狂大黃一兩半桂心三分甘草炙芒硝木通大腹皮各一兩桃仁二十一枚上㕮咀水煎服以利為度海葛根散治陽毒身熱如火頭痛躁渴咽喉干痛葛根七錢半黃芩大黃醋炒甘草山梔朴硝各半兩上㕮咀水煎服活黑奴丸治時行病六七日未得汗脈洪大或數面赤目痛身體大熱煩躁狂言欲走大渴甚又五六日以上不解熱在胸中口噤不能言為壞傷寒醫所不治或人精魄已竭心下尚暖撥開其口灌藥下咽即活兼治陽毒及發斑麻黃去節泡三兩大黃二兩釜底煤研黃芩芒硝灶突墨研梁上塵小麥奴各一兩上為末煉蜜丸如彈子大新汲水研下一丸渴者與冷水盡飲之須臾當寒寒竟汗出便瘥若無汗再服一丸須微利效小麥奴即小麥未熟時叢中不成麥捻之成黑勃是也此藥須是病人大渴倍常躁盛者乃可與之若不渴者服之反為禍耳脈洪大內外結熱舌卷焦黑鼻中如煙煤宜以水漬布薄之疊布數重新水漬之稍挼去水搭於胸上須臾蒸熱又漬冷如前薄之仍換新水數十易熱甚者置病人於水中勢才退則已亦一良法也丹砂丸治傷寒陰陽二毒相伏危惡形症舶上硫黃水銀太陰石玄精石各一兩硝石半兩太陽石一兩上為末用無油銚子以文武火炒上項藥令勻如灰色研極細生薑自然汁浸炊餅丸如緑豆大每服五丸龍腦生薑蜜水下壓其躁也若陽毒棗湯下陰毒白湯下不許於屋底炒太陰病吐與利下三門並附入少陰病蓋此三門之病本屬太陰病因在少陰者反多故附入少陰也腹滿太陰之為病腹滿而吐食不下自利益甚時腹自痛若下之必胸下結硬太陰病脈浮者可發汗宜桂枝湯本太陽病醫反下之因小腹滿時痛者屬太陰也桂枝加芍藥湯主之大便實痛者桂枝加大黃湯主之桂枝加芍藥湯桂枝生薑各一兩半甘草一兩芍藥三兩大棗六枚上㕮咀每服五錢水煎溫服桂枝加大黃湯桂枝一兩芍藥一兩半甘草炙半兩大黃半兩大便實痛者加一兩虛者減五錢上㕮咀大棗三個生薑四片水煎溫服太陰病脈弱其人續自便利設當用大黃芍藥者宜減之以其人胃氣弱易動故也太陰中風四肢煩疼陽微脈澀而長者為欲愈太陰病欲解時從亥至醜腹滿時痛吐利者為太陰論見前太陰條霍亂吐利頭痛發熱身痛不渴而腹滿者理中丸加附子主之論見吐利霍亂條下利腹脹滿身痛者四逆溫里後用桂枝攻表論見下利噦而腹滿視前後部有不利者利之則愈論見噦少陰腹滿脹不大便者宜大承氣湯論見不大便腹滿小便不利身黃者茵陳蒿湯論見黃若兼脅下痛脈弦浮大者宜小柴胡湯論見鼻乾腹滿不減減不足言當下之宜大承氣湯腹滿時減復如故此虛寒從下而上也當以溫藥和之太陰病腹滿時痛脈浮者宜桂枝湯論見前太陰條陽明脈弦浮大脅痛身黃而腹滿者小柴胡湯論見鼻乾傷寒腹滿譫語寸口脈浮而緊此肝乘脾也名曰縱宜刺期門陽明病腹滿脈浮緊口苦咽乾而痛若其人發熱惡寒者下之則腹滿小便難若其人發熱汗出不惡寒反惡熱者下之則懊憹汗之則譫語加燒針則怵惕不眠論見胃家實注云當和解之陽明病腹滿脈遲苦頭眩小便難者不可下若潮熱汗出不惡寒者大承氣主之論見胃實三陽合病腹滿身重難轉側譫語遺尿自汗者宜白虎湯論見合病傷寒發熱脈澀惡寒大渴欲飲水其腹必滿自汗出小便利其病欲解此肝乘肺也名曰橫宜刺期門腹滿汗出不惡寒而喘若脈遲潮熱者大承氣湯若脈浮緊口苦咽燥者忌發汗忌燒針忌下論見腹滿脈浮遲條發汗後腹脹滿者厚朴生薑人參甘草半夏湯主之厚朴生薑人參甘草半夏湯厚朴生薑各二兩半夏六錢人參一兩甘草五錢上㕮咀每服五錢水煎溫服下利清穀若發汗必脹滿論見下利傷寒吐後腹脹滿者與調胃承氣湯下後心煩腹滿臥起不安者梔子厚朴湯論見煩極吐下後溫溫欲吐胸痛便溏腹滿而煩者調胃承氣湯論見嘔不大便六七日少與小承氣湯不轉矢氣者不可攻之攻之則腹滿不能食論見不大便腹滿吐利者忌下論見太陰腹滿脈浮緊口苦咽乾者忌汗下針論見自汗腹滿脈遲者忌下論見前脈遲條腹滿脈弱自利設用大黃芍藥宜減之論見太陰條中腹滿續法活若飲食不節寒中陰經胸膈不快腹滿閉塞唇青手足冷脈沉細少情緒或腹痛急作理中湯加青皮每服一二劑胸即快矣枳實理中丸五積散尤妙腹脹滿者宜桔梗半夏湯桔梗半夏湯治傷寒心腹痞滿時發疼痛桔梗微炒半夏薑製橘紅各一兩上㕮咀每服四錢生薑三片水煎服海少陰症小便遺瀝大便遺失其人病六七日靜重如山目不視體如冰腹脹滿與物則咽不與則不求其脈沉細而微疾按之有力宜急下之與大承氣湯腹痛腹滿而痛吐利者屬太陰宜四逆湯論見腹滿太陰條若兼頭痛發熱身痛者屬霍亂霍亂腹痛不渴者理中丸加人參論見吐利病腹中滿痛者此為實也宜大承氣湯下之病人不大便五六日繞臍煩疼發作有時者有燥糞故使不大便也發汗不解腹滿痛者急下之宜大承氣湯大下後六七日不大便煩不解腹滿痛者此有燥屎也所以然者本有宿食故也宜大承氣湯汗下後不大便而渴日晡潮熱從心下至小腹硬滿而痛者宜大陷胸湯方論見結胸少陰病腹滿下利若小便不利四肢重痛者真武湯便膿血者桃花湯若下利清穀手足厥逆脈微欲絶者通脈四逆湯去蔥白加芍藥少陰病腹痛若四肢逆而不溫者四逆散加附子方論見欲寐若手足厥冷脈微欲絶者通脈四逆加芍藥湯方論見下利傷寒胸中有熱胃中有邪氣腹中痛欲嘔吐者宜黃連湯甘草炙黃連乾薑各三分大棗三枚半夏半兩人參桂枝各三分上㕮咀水煎服分二服往來寒熱胸脅滿心煩喜嘔而腹痛者小柴胡去黃芩加芍藥湯方見往來寒熱條傷寒陽脈澀陰脈弦當腹中急痛者先與小建中湯不瘥者再與小柴胡湯小建中湯桂枝一兩半甘草炙一兩芍藥三兩生薑一兩半大棗六枚膠飴八兩上㕮咀每服五錢生薑三片同煎至八分去渣下膠飴兩匙許再煎化服東垣云芍藥味酸於土中瀉木為君飴糖甘草甘溫補脾養胃為臣水挾木勢亦來侮土故脈弦而腹痛肉桂大辛熱佐芍藥以退寒水薑棗甘辛溫發散陽氣行於經絡皮毛為使故建中之名始於此焉傷寒四五日腹中痛若轉矢氣及少腹滿者此欲自利也腹痛續法云傷寒邪在三陰內不得交通故為腹痛手足之經皆會於腹如脈弦而腹痛過在足厥陰肝手太陰肺刺太衝太淵大陵如脈沉而腹痛過在足太陰脾少陰腎手厥陰心包刺太溪大陵如脈沉細而痛過在足太陰脾手少陰心刺太白神門三陰交此刺腹痛之法也丹乾霍亂此係內有所傷外為邪氣所遏有用吐藥者則兼發散之義有用溫藥解散者不可用涼藥宜用二陳湯加解散藥如川芎蒼朮防風白芷之類是也無鹽湯治乾霍亂蠱毒宿食不消積冷心腹煩滿鬼氣用煎鹽湯三升熱飲一升刺口令吐宿食使盡不盡更復吐訖復飲三吐乃止此法大勝諸治俗人以為田舍淺近之法鄙而不用守死而已凡有此病即先用之吐訖後詳症脈以加減理中湯治中湯款緩調之直薑鹽湯治欲吐不吐欲瀉不瀉鹽一兩生薑半兩切上同炒色變以水一碗煎溫服病甚加童便一盞世勝靈丹治乾霍亂腹痛甚者取千年石灰湯泡服成病有乾霍亂濕霍亂乾霍亂死者多濕霍亂死者少蓋吐利則所傷之物得以出泄雖甚重胃中水穀泄盡則止矣所以死者少及乾霍亂死多者以其上不得吐下不得利則所傷之物不得出泄壅閉正氣隔絶陰陽煩擾悶躁喘脹而死者多矣無乾嘔霍亂者忽然心腹脹滿絞痛蠱毒煩冤欲吐不吐欲利不利狀若神靈所附頃刻之間便致悶絶黃王叔和原入陽明篇傷寒脈浮而緩手足自溫者是為系在太陰當發身黃小便自利者不能發黃至七八日雖暴煩下利日十餘行必自止以脾家實腑穢當去故也海色如煙燻黃乃濕病也一身盡痛色如橘子黃乃黃病也一身不痛成濕家之黃也身黃似熏黃雖黃而色暗不明也熱家之黃也身黃似橘子色甚者勃勃出染著衣正黃如黃柏是其正黃色也色如熏黃一身盡痛發熱者為濕痹若脈沉緩小便不利者甘草附子湯五苓散若脈大頭痛鼻塞者納藥鼻中則愈矣論見體痛許一人病身體痛面黃喘滿頭痛自能飲食大小便如常豫診之脈大而虛鼻塞而煩豫曰非濕熱宿谷相搏此乃頭中寒濕非茵陳五苓不可行也仲景云濕家病身疼痛發熱面黃而喘頭痛鼻塞而煩其脈大自能飲食腹中初無病病在頭中寒濕攻鼻故塞納藥鼻中則愈仲景無藥方此方見外臺刪繁症云治天行熱病蓋通貫臟腑寒濕沉於骨髓之間或為黃疸宜瓜蒂散即此方也瓜蒂散方見後黃續條又有一舟梢病傷寒發黃鼻痠痛身與目如金色小便赤而數大便如常或者欲用茵陳五苓豫曰非其治也小便利大便如常則知病不在臟今眼睛鼻頞痛是病在清道中清道者華蓋肺之經也若下大黃則必腹脹為逆亦用瓜蒂散先含水次搐之鼻中黃水盡乃愈傷寒七八日身黃如橘子色小便不利腹微滿者茵陳湯主之陽明胃家實身無汗但頭汗出小便不利飲水漿發黃亦茵陳蒿湯主之茵陳蒿嫩者一兩大黃半兩山梔二錢上㕮咀用水三大盞先煎茵陳減半納二味煎熟溫服日三服小便當利如皂莢汁狀色正赤過一宿腹滿減黃從小便中去也身黃脅痛小便難未下者宜柴胡下後者忌柴胡二法俱見胸脅痛門傷寒發汗後而身目俱黃所以然者以寒濕在裡不解故也法不可下當於寒濕中求之與熏法同太陽病脈浮數為表未解醫反下之若不結胸但頭汗出余無汗劑頸而還小便不利身必發黃論見結胸活人云茵陳湯主之陽明病面赤攻之必發熱身黃小便不利論見胃實陽明病黃而腹滿脈遲飽則頭眩小便難者雖下之腹滿如故論見腹滿下後不能食脅下滿痛頸項強小便難而身黃者與柴胡湯必下重陽明病被火額上微汗出小便不利者身必發黃風溫脈浮汗出身重多眠若被火則微發黃色劇則如驚癇時瘛瘲論見風溫太陽病中風以火劫發汗邪風被火熱血氣流溢失其常度兩陽相熏灼其身發黃論見頭汗身黃脈沉結少腹硬而小便自利其人發狂大便黑者為蓄血宜抵當湯論見蓄血傷寒身黃髮熱者梔子黃柏皮湯主之梔子十五枚甘草一兩黃柏二兩上㕮咀每服五錢水煎溫服傷寒瘀熱在裡身必發黃麻黃連翹湯主之麻黃泡去節連翹根生薑甘草各一兩赤小豆梓白皮生各半升杏仁二十粒大棗六枚上㕮咀每服五錢用潦水一盞半煎溫服麻黃杏仁生薑甘草大棗五味甘辛發散表邪為陽也赤小豆連翹梓皮酸苦泄里為陰也潦水味薄不助陰氣也上身黃小便自利小腹硬而狂大便黑者為蓄血則宜抵當湯下之若小腹不硬其人不狂大便不黑者雖小便利非蓄血也其為症有三一者梔子柏皮湯二者麻黃連翹赤小豆湯皆治身黃小便利而身不疼者海藏所謂干黃是也三者桂枝附子湯去桂加白朮湯皆治身黃小便利而一身盡痛者活人所謂中濕是也汗下燒針後心下痞而胸煩者面色青膚瞤難治色微黃手足溫者易治論見痞身黃禁忌見前汗後身黃下後身黃條黃續法海傷寒病遇太陽太陰司天若下之太過往往變成陰黃一則寒水太過水來犯土一則土氣不及水來侵之多變此疾一則茵陳茯苓湯加當歸桂枝二則茵陳橘皮湯加薑朮半夏三則茵陳附子湯四則茵陳四逆湯五則茵陳薑附湯六則茵陳吳茱萸湯方見如左發黃小便不利煩躁而渴茵陳湯加茯苓豬苓滑石當歸官桂主之韓氏名茵陳耆苓湯發黃煩躁喘嘔不渴茵陳湯加陳皮白朮生薑半夏茯苓主之韓氏名茵陳陳皮湯發黃四肢遍身冷者茵陳湯加附子甘草主之韓氏名茵陳附子湯發黃肢體逆冷腰上自汗茵陳湯加附子乾薑甘草主之韓氏名茵陳薑附湯發黃冷汗不止者茵陳湯加附子乾薑主之韓氏名茵陳附子湯發黃前服薑附諸藥未已脈尚遲者茵陳加吳茱萸附子乾薑木通當歸主之韓耆名茵陳茱萸湯趙宗顏因下之太過生黃脈沉細遲無力次第用藥至茵陳附子湯大效按海藏次第用藥者謂先投韓氏茵陳茯苓湯次投茵陳陳皮湯又次投茵陳附子湯後趙秀才次第仿此趙秀才因下之早黃病脈寸微尺弱身冷次第用藥至茵陳四逆湯大效傷冷中寒脈弱氣虛變為陰黃仲景理中湯加茵陳服之茵陳湯治傷寒發黃目悉黃小便赤茵陳山梔柴胡黃柏蜜炙黃芩升麻龍膽草各半兩大黃炒一兩上㕮咀水煎空心服以利為度海往來寒熱一身盡黃者小柴胡加梔子湯主之衍一僧傷寒發汗不徹有留熱身面皆黃多熱期年不愈醫作食黃治之治不對病不去問之食不減尋與此藥服五日病減三分之一十日減三分之二二十日病悉去方用茵陳梔子各三分秦艽升麻各四錢末之每用三錢水四合煎及二合去渣食後溫服以和為度活五苓加茵陳蒿湯治發黃而渴小便不利茵陳蒿湯十分五苓湯五分上二劑拌勻每服三錢日三服水調下又方傷寒欲發黃者急用瓜蒂末口含水搐一字許入鼻中出黃水甚驗即用茵陳湯調五苓散服之最效本治頭中濕熱發黃疸瓜蒂散瓜蒂二十枚赤小豆黍米各十四粒上為細末如大豆大一粒許納鼻中縮入當出黃水慎不可吹入云結胸發黃太陽附本也以結胸法治之痞氣發黃太陰附本也以痞法治之活問白虎症亦有身熱煩渴引飲小便不利何以不發黃答曰白虎與發黃症相近遍身汗出此為熱越白虎症也頭面汗出頸已下無汗發黃症也成傷寒發黃是病已極是有不治者多矣非止寸口近掌無脈鼻氣出冷為不治之症又若形體如煙燻直視搖頭者是為心絶環口黧黑柔汗發黃是為脾絶皆不治之症也少陰病但欲寐嗜臥少陰之為病脈微細但欲寐衛氣寤則行陽寐則行陰而寐也必從足少陰始故少陰病但欲寐少陰病始得之反發熱脈沉者麻黃附子細辛湯主之方見發熱少陰病得之二三日麻黃附子甘草湯微發汗以二三日無症故微發汗也無症謂無吐利厥症麻黃附子甘草湯麻黃甘草炙各二兩附子一枚炮去皮切上㕮咀每服五錢水煎溫服須二三服以身汗為度少陰病得之一二日口中和其背惡寒者當灸之附子湯主之附子半枚茯苓七錢半人參半兩白朮一兩芍藥七錢半上㕮咀每服五錢水煎溫服日三少陰二三日口燥咽乾者大承氣湯急下之方論見口燥咽乾若咽痛者甘草湯不瘥者桔梗湯方論見咽痛少陰病得之二三日以上心中煩不得臥黃連阿膠湯主之方見不得臥少陰病二三日至四五日腹滿小便不利若便膿血者桃花湯主之方論見下利若四肢重痛下利者真武湯主之方論見下利少陰病六七日腹脹不大便者急下之宜大承氣湯方見潮熱少陰病下利至六七日變咳而嘔渴心煩不得眠者豬苓湯主之少陰病脈微細沉但欲臥汗出不煩自欲吐至五六日自利復煩躁不得寤寐者死少陰病六七日息高者死少陰病脈緊至七八日自利脈緊變暴微厥手足反溫者欲解也論見下利少陰病八九日一身手足盡熱者以熱在膀胱必便血也口燥咽乾但欲寐方論見口燥欲吐不吐但欲寐方論見吐吐利但欲寐方論見吐出下利但欲寐方論見下利少陰病但厥無汗而強發之必動其血未知從何道出或從口鼻或從目出是名下厥上竭為難治少陰病四逆惡寒而身蜷脈不至不煩而躁者死少陰病惡寒身蜷而利手足逆冷者不可治少陰病四逆其人或咳悸或小便不利或腹中痛或泄利下重者宜四逆散甘草炙枳實柴胡芍藥各等分上為細末日飲和渣服方寸匕日三服如咳者加五味子乾薑各五分並主下利悸者加桂枝五分小便不利者加茯苓五分腹中冷痛者加附子一枚炮令坼泄利下重者先以水五升煮薤白三升去渣以散三方寸匕納湯中煮取一升半分溫再服少陰病手足逆冷其人若下利後重者此條四逆散加薤白湯若下利脈絶及無脈者通脈四逆湯白通加豬膽汁湯方論見下利若身體骨節痛脈沉者宜附子湯少陰病脈沉者急溫之宜四逆湯方見下利少陰病身體痛手足寒骨節痛脈沉者附子湯主之少陰病脈沉發熱者宜前條麻黃附子細辛湯少陰病欲解時從子至寅上少陰病惡寒而蜷時自煩欲去衣被者可治少陰病下利止而頭眩時時自冒者死少陰中風脈陽微陰浮者為欲愈少陰病脈細沉數病為在裡不可發汗少陰病脈微不可發汗亡陽故也陽已虛尺部弱澀者不可復下之太陽病十日已去脈浮細嗜臥者外已解也胸滿脅痛者小柴胡湯脈但浮者麻黃湯論見鼻乾脈浮汗出多眠若身重息鼾者風溫方論見風溫若合目則盜汗出者三陽合病方論見盜汗狐惑病默默欲眠目不得閉不欲飲食惡聞食臭其面目乍赤乍黑乍白其聲嗄者甘草瀉心湯咽乾者苦參湯其肛蟲蝕雄黃熏之其脈數無熱目赤皆黑者當歸赤小豆散並見狐惑條口燥咽乾少陰病得之二三日口燥乾者宜下之大承氣湯少陰病自利純青色水心下痛口燥乾者宜大承氣湯論見下利傷寒無大熱口燥渴背惡寒者白虎加人參湯陽明病發熱汗出不惡寒反惡熱若口乾舌燥者白虎加人參湯方論見渴表解條太陽病下後不大便日晡潮熱心下滿痛而舌上燥渴者宜大陷胸湯陽明病口燥但欲漱水不咽者必衄海藏云漱水不咽胸滿心下手不可近者桃仁承氣主之病人默默欲眠目不能閉起居不安聲嗄或咽乾者當作狐惑治之咽喉乾燥者不可發汗咽痛少陰病二三日咽痛可與甘草湯不瘥桔梗湯甘草湯用甘草二兩㕮咀每服四錢水煎去渣溫服日三服桔梗湯用甘草二兩桔梗一兩㕮咀每服五錢水煎溫服少陰病咽中痛半夏散及湯主之半夏制桂枝甘草炙各等分上㕮咀水煎服少少咽之為散白湯調服方寸匕亦效日三服仲景法為散調服不㕮咀成甘草湯主少陰客熱咽痛桔梗湯主少陰寒熱相搏咽痛半夏散及湯主少陰客寒咽痛少陰病咽中生瘡不能言語聲不出者苦酒湯主之半夏制十四枚雞子一個去黃納半夏苦酒於雞子殼中上二味納半夏著苦酒以雞子殼置刀鐶中安火上令三沸去渣少少含咽之不瘥更作三劑脈緊當無汗反汗出者亡陽也此屬少陰法當咽痛而復吐利論見吐利師曰伏氣之病以意候之今月之內欲有伏氣假令舊有伏氣當須脈之若脈微弱者當喉中痛似傷寒非喉痹也病人云實咽中痛雖爾今復欲下利見後活人續法咽痛下利兼胸滿者豬膚湯厥逆面赤者通脈四逆湯下後復厥逆下部脈不至者麻黃升麻湯並見下利陽毒咽痛面赤斑斑如錦紋唾膿血五日可治七日不可治宜升麻鱉甲湯活人云陽毒升麻湯主之論見陽毒條陰毒咽痛面目青身痛如被杖五日可治七日不可治升麻鱉甲去雄黃蜀椒湯活人云陰毒甘草湯主之論見陰毒條太陽病下後脈緊者必咽痛論見大法陽明病頭眩而咳者必咽痛若不咳者咽不痛先厥後熱者下利必自止止而反汗出者其喉為痹發熱無汗者下利必自止若不止者必便膿血其喉不痹論見下利咽中閉塞不可發汗發汗則吐血氣欲絶手足厥冷欲得蜷臥不能自溫咽中閉塞不可下下之則上輕下重水漿不下臥則欲蜷身急頭眩下利日數十行咽痛續法活半夏桂枝甘草湯治伏氣之病謂非時有暴寒中人伏氣於少陰經始不覺病旬月乃發脈更微弱先發咽痛似傷寒非喉痹之病必下利始用半夏桂枝甘草湯主之此病只二日便瘥古方謂之腎傷寒也次用四逆主之半夏桂枝甘草湯半夏湯洗甘草炙桂心各等分上㕮咀每服四錢水煎候冷少少細呷之即仲景半夏散及湯但藥㕮咀耳附吐腹滿時痛而吐者太陰病論見腹滿活人云理中湯主之少陰病欲吐不吐心煩但欲寐自利而渴論見下利活人云四逆湯主之少陰病飲食入口則吐心中溫溫欲吐復不能吐始得之手足寒脈弦遲者此胸中實不可下也當吐之若膈有寒飲乾嘔者不可吐也急溫之宜四逆湯少陰病但欲臥不煩而吐五日變自利煩躁不得寐者死論見但欲寐腹痛欲嘔吐者宜黃連湯病解後虛羸少氣欲吐者宜竹葉石膏湯乾嘔吐涎沫頭痛者宜吳茱萸湯吳茱萸湯泡洗一兩半人參三分生薑一兩半大棗三枚上㕮咀水煎去渣分二服發熱渴欲飲水水入則吐者宜五苓散論見厥傷寒本自寒下醫復吐下之寒格更逆吐下若食入口即吐乾薑黃連黃芩人參湯主之乾薑黃連黃芩人參各等分上㕮咀水煎溫服太陽病吐後汗出不惡寒發熱關脈細數欲食冷食朝食暮吐此為小逆論見發熱病人脈數為熱當消穀引食而反吐者此因發汗令陽氣微膈氣虛脈乃數也數而客熱者不能消穀以胃中虛冷故也凡服桂枝湯而吐者必吐膿血也注云內熱者服桂枝湯則吐如酒客之類是也吐厥逆者甘薑吐續法活吐有冷熱二症寸口脈數手心熱煩渴而吐以有熱在胃脘五苓散主之寒多不飲水而吐者理中湯去朮加生薑主之陰症喘促及吐逆者返陰丹入口便住大橘皮湯治動氣在下不可發汗發又無汗心煩骨節疼痛目暈惡寒食則反吐谷不得入先服大橘皮湯吐止後宜建中湯陳皮一兩半生薑一兩棗子八枚甘草炙半兩人參一錢竹茹半升上水三大盞煮取一盞分二服病人直患嘔吐而腳弱或疼乃是腳氣當作腳氣治之治見厥痹附吐利腹滿時痛吐利不渴者太陰病論見腹瞞活人云理中湯中之病人脈陰陽俱緊反汗出者亡陽也此屬少陰法當咽痛而復吐利少陰病吐利手足厥冷煩躁欲死者吳茱萸湯主之少陰病吐利手足不逆冷反熱者不死脈不至者灸少陰七壯少陰病吐利煩躁四逆者死少陰病下利咳而嘔渴心煩變不得眠者宜豬苓湯論見下利少陰病腹痛小便不利四肢重痛自下利或嘔者真武去附子加生薑湯論見下利少陰病下利脈微澀嘔而汗出者當溫其上灸之論見欲寐溫其上謂下有寒氣當溫其上以助陽氣也既吐且利小便復利而大汗出下利清穀內寒外熱脈微欲絶者四逆湯主之王叔和入霍亂篇太陽與少陽合病頭痛脅痛往來寒熱自利而嘔者黃芩加半夏生薑湯論見合病發熱汗出不解心中痞硬嘔吐下利者宜大柴胡湯論見痞發汗後水漿不得入口者為逆若更發汗必吐下不止嘔吐而利者名曰霍亂病發熱頭痛身疼惡寒吐利者此名霍亂自吐下又利止復更發熱也霍亂頭疼發熱身疼痛熱多飲水者五苓散主之寒多不飲水者宜理中湯人參乾薑炮甘草炙各一兩白朮二兩上銼每服四錢水煎去渣溫服如寒甚者加乾薑一兩半渴欲得水者加白朮一兩半臍上築者腎氣動也去白朮加桂枝二兩吐多者去白朮加生薑四兩下利多者倍用白朮悸者加茯苓二兩腹滿者去白朮加附子一枚服湯後如食頃飲熱粥一升許自溫勿發揭衣被活人云或四肢拘急或轉筋者亦去朮加附子吐利汗出發熱惡寒四肢拘急手足厥冷者四逆湯主之素土鬱之發民病嘔吐霍亂注下六元正紀篇太陰所至為中滿霍亂吐下上濕土霍亂即仲景五苓散理中丸之類是也歲土不及風乃大行民病霍亂飧泄氣交變論上土虛風勝霍亂即羅謙甫桂苓白朮散之類是也熱至則身熱霍亂吐下六元正紀篇上熱霍亂即活人書香薷散之類是也靈足太陰之別名曰公孫去本節後一寸別走陽明其別者入絡腸胃厥氣上逆則霍亂實則腸中切痛虛則蠱脹取之所別也經脈篇氣亂於腸胃則為霍亂取之足太陰陽明不下取之三里五亂篇東垣云足太陰期門穴也足陽明中脘穴也吐利止而身痛不休者當消息和解其外宜桂枝湯惡寒脈微利止者四逆加人參湯方論見惡寒吐已下斷汗出而厥四肢拘急不解脈微欲絶者通脈四逆湯加豬膽汁下之甘草炙二兩乾薑三兩附子大一枚去皮尖豬膽汁半合上三味㕮咀水三盞煎至二盞去渣納豬膽汁分作二次溫服其脈即來吐利發汗脈平不煩者以新虛不勝穀氣故也乾嘔而利兼脅痛而表解者宜十棗湯心下痞硬而煩者宜甘草瀉心湯兼厥逆脈微者通脈四逆湯白通加豬膽汁湯詳見乾嘔門脈陰陽俱緊至於吐利其脈獨不解緊去人安此為欲解若脈遲至六七日不欲食此為晚發水停故也為未解食自可者為欲解吐利續法內經霍亂法附活夏月中暑霍亂上吐下利心腹撮痛大渴煩躁四肢逆冷汗自出兩腳轉筋宜服香薷飲須井底沉極冷頓服之乃效他藥不能救香薷散治陰陽不順清濁相干氣鬱中焦名為霍亂此皆飽食鱠炙頓啖乳酪酒醪百品無所不餐多飲水漿眠睡冷席風冷之氣傷於脾胃諸食結而不散陰陽二氣壅而不反陽氣欲降陰氣欲升陰陽交錯變成吐利不已百脈混亂榮衛俱虛冷搏筋轉皆宜服此厚朴去皮二兩黃連薑汁炒二兩香薷四兩甘草半兩上為末每服四錢水煎不犯鐵器慢火煎之兼治不時吐利霍亂腹撮痛大渴煩躁四肢逆冷冷汗自出兩腳轉筋疼痛不可忍者須井中沉令極冷頓服之乃效羅桂苓白朮散治冒暑飲食所傷傳受濕熱內盛霍亂吐瀉轉筋急痛腹滿痛悶小兒吐瀉驚風皆宜服此桂枝人參白朮白茯苓各半兩澤瀉甘草石膏寒水石各一兩滑石二兩一方有木香藿香葛根各半兩上為細末每服三錢白湯調下或新汲水生薑湯下亦得有蒙古百戶昔良海因食酒肉飲湩乳得吐瀉霍亂症從朝至午精神昏憒以困急來告豫診視之脈得沉數按之無力所傷之物已出矣即以新汲水半碗調桂苓白朮散徐徐服之稍得安靜又於牆陰掘地一穴約二尺許貯以新汲水在內攪之待一時澄定名曰地漿用清者一杯再調服之漸漸氣和吐瀉遂止至夜得安翌日微煩渴遂愈卻以錢氏白朮散時時服之良愈或問用地漿者何也豫曰坤為地地屬陰土平曰靜順感至陰之氣又於牆陰貯以新汲水以取重陰之氣也陰中之陰能泄陽中之陽霍亂症由暑熱內傷而得之故痹論云陰氣者靜則神藏躁則消亡又加暑熱七神迷亂非至陰之氣則不能息豫用之者此也內經福萬世之書豈不信哉又提學侍其公年七十九歲六月中暑毒霍亂吐瀉昏冒終日不知人事夜半請豫視之診其脈七八至洪大有力頭熱如火足寒如冰半身不遂牙關緊急豫思內經五亂篇中雲清氣在陰濁氣在陽榮氣順脈衛氣逆行亂於胸中是謂大俯云云亂於腸胃則為霍亂於是霍亂之名自此而生蓋年高氣弱不任暑氣陽不維陰則瀉陰不維陽則吐陰陽不相維則既吐且瀉矣前人見寒多以理中湯熱多以五苓散作定法治之今暑氣極盛陽明得時之際況因動而得之中暑明矣非甘辛大寒之劑不能泄其暑熱墜浮焰之火而安神明也遂以甘露散甘辛大寒瀉熱補氣加茯苓以分陰陽冰水調灌之漸省人事諸症悉去後慎言語節飲食三日以參朮調中湯以意增減服之理其正氣逾十日後方平復無訶子散治老幼霍亂一服即效訶子炮去核甘草炙厚朴薑製乾薑炮神麯炒草果去殼良薑炒茯苓麥芽炒陳皮各等分上為細末每服二錢候發不可忍時用水煎入鹽少許服之聖治霍亂用厚朴薑製火上炙令香為末以新汲水調下二錢匕佳大人參散治妊娠霍亂吐瀉心煩腹痛人參厚朴薑製橘紅各一兩當歸炒甘草炙各半兩上為末每服四錢棗三枚水煎服丹霍亂內有所傷外有所感集吐瀉還用吐以提其氣起吐用二陳湯加減或用樟木煎湯吐亦可海霍亂症本自胃家或因寒飲或因飲水或傷水毒或感濕氣冷熱不調水火相干陰陽相搏轉筋攣痛經絡亂行暴作吐瀉中焦胃氣所主也察其色脈隨經標本此治霍亂吐瀉之法也外治霍亂吐下不止者艾一把水三升煮至一升頓服經霍亂陳皮湯下山豆根末二錢山霍亂吐瀉用屋下倒挂塵泡湯澄清服之大忌飲食入腹則死吃冰水不妨不可飲熱湯集吐瀉不止或吐轉多四肢發厥虛風不省人事服此四肢漸暖神識便省回陽散用天南星為末每服三錢用大棗三枚同煎至八分溫服未省再服霍亂轉筋治法見轉筋門羅增損縮脾飲解伏熱除煩渴消暑毒止吐利霍亂之後服熱藥太多煩躁者尤宜服之草果烏梅甘草砂仁各四兩乾葛二兩上㕮咀每服五錢生薑五片同煎以水沉冷以解煩或溫或熱隨意服無茯苓澤瀉湯治霍亂吐瀉後煩渴欲飲水茯苓八兩澤瀉四兩甘草炙桂心各二兩白朮三兩上㕮咀每服四錢生薑三片同煎食前服一方有小麥五兩世以小竹杖兩手反抱住於脊骨就杖兒上下各點一穴如先吐先灸上穴先瀉先灸下穴各三百壯百發百中又霍亂諸法不效者灸大椎又以鹽納臍中灸二十壯立蘇集霍亂吐瀉中脘天樞三里委中摘又法上脘三里甲霍亂泄出不自知先取太溪後取太倉之原又法巨闕關衝支溝解溪千又主陰陵泉東吐利上下俱出藏痹膿血頭重臂痛太白地機風府各五分長強尺澤各一寸甲霍亂泄利期門主之厥逆霍亂府舍主之世霍亂手足厥冷灸三陰交七壯甲霍亂逆氣魚際太白主之霍亂遺尿失氣三里主之世病人合面正臥兩手著身以繩橫亙兩肘尖頭依繩下俠脊兩邊相去各一寸灸三七壯無不驗霍亂已死但有暖氣者灸承筋七壯立蘇取法以繩從足拇指圍至後跟一匝捻斷等折一半為度以此度從足跟貼地量上至腨度極頭處是穴甲霍亂頸痹不仁承筋主之千金云主瘛瘲腳痠暴霍亂僕參主之世霍亂遍身轉筋肚痛四肢厥冷欲絶者其脈洪大易治脈微囊縮舌卷不治千諸霍亂忌與米飲胃中得米即吐不止羅潔古老人云霍亂轉筋吐瀉不止其病在中焦陰陽交而不和發為疼痛此病最急不可與分毫粥飲穀氣入胃則必死矣保凡霍亂慎勿與粟米粥湯入胃即死本草云粟米味鹹微寒無毒主養腎氣去脾胃中熱益氣霍亂脾胃極損不能傳化加粟米豈有能生也邪如吐瀉已多欲住之後宜以稀粥漸漸補養以遲為妙下利自利不渴者屬太陰以其臟有寒故也當溫之宜四逆湯甘草一兩乾薑三錢附子半個上㕮咀水煎溫服強人加附子半個乾薑一兩半少陰病欲吐不吐心煩但欲寐五六日自利而渴者屬少陰也虛故引水自救若小便色白者少陰病形悉具小便白以下焦虛有寒不能制水故令色白也活人云四逆主之少陰病下利六七日咳而嘔渴心煩不能眠者豬苓湯主之少陰病自利清水色純青者心下必痛口乾燥者急下之宜大承氣湯孫竇大郎患傷寒經十餘日口燥舌乾而渴心中疼自利清水衆醫皆相守但調理耳汗下皆所不敢竇氏親故相謂曰傷寒邪氣害人性命甚速安可以不決之疾投不明之醫乎召孫至曰即日不可下明日正當下投小承氣湯遂大便通得睡明日平復衆皆曰此症緣何下之而愈孫曰不深於書徒知有書耳不知書之奧也口燥舌乾而渴豈非少陰症乎少陰症固不可下豈不知少陰一症自利清水心下痛者下之而愈仲景之書明有是説也衆皆欽服下利欲飲水者以有熱故也宜白頭翁湯白頭翁黃柏秦皮黃連各三錢上㕮咀水煎去渣溫服不瘥再服少陰病下利白通湯主之少陰病二三日不已至四五日腹滿痛小便利或下利或嘔者宜真武湯茯苓芍藥各三錢附子一個白朮半兩加減法從本方上㕮咀每服五錢生薑五片煎至八分溫服日三咳者加五味子細辛乾薑各一分小便利者去茯苓下利者去芍藥加乾薑嘔者去附子加生薑七片少陰下利咽痛胸滿心煩者豬膚湯主之用豬膚四兩以水一盞半煎取一盞去渣加白蜜二合半白粉一合二勺半熬煮和相得溫服海藏云豬膚即豬皮大汗利而厥冷者宜四逆湯少陰病但欲寐下利若兼手足厥逆者白通加豬膽汁湯通脈四逆湯方論見後厥利兼便膿血者宜桃花湯方論見後便膿血條少陰病咳而下利譫語者被火氣劫故也小便必難以強責少陰汗故也少陰病下利脈微澀嘔而汗出必數更衣反少者當溫其上灸之溫其上義見前條少陰病下利若利自止惡寒而蜷手足溫者可治大汗出熱不去內拘急四肢疼必下利厥逆而惡寒者四逆湯主之傷寒六七日大下後寸脈沉而遲手足厥逆下部脈不至咽喉不利吐膿血泄下不止者為難治宜麻黃升麻湯麻黃去節二兩半升麻二兩當歸知母黃芩葳蕤各十八銖石膏碎白朮乾薑芍藥天門冬桂枝茯苓甘草各六銖上㕮咀每服五錢水煎溫服相次一炊時又進一服汗出愈下利脈沉而遲其人面少赤身有微汗下利清穀者必鬱冒汗出而解病人必微厥所以然者其面戴陽下虛故也凡厥利當不能食今反能食者恐為除中試食以索餅不發熱者知胃氣尚在必愈也論見厥傷寒先厥後發熱下利者必自止而反汗出咽中痛者其喉為痹發熱無汗而利必自止必便膿血便膿血者其喉不痹下利後脈絶手足厥冷晬時脈還手足溫者生脈不還者死下利手足厥冷無脈者灸之不溫若脈不還反微喘者死傷寒發熱下利厥逆躁不得臥者死傷寒發熱下利至甚厥不止者死少陰病下利脈微與白通湯利不止厥逆無脈乾嘔煩者白通加豬膽汁湯主之服湯後脈暴出者死微續者生白通湯乾薑一兩附子一枚生用上㕮咀每服五錢入蔥白二寸同煎溫服白通加豬膽汁湯乾薑一分蔥白一莖附子一枚童便一合二勺半豬膽一個上水一盞煎至五分去渣入童便膽汁相和得所溫服少陰病下利清穀裡寒外熱手足厥逆脈微欲絶身反不惡寒其病面赤色或腹痛或乾嘔或咽痛或利止脈不出者通脈四逆湯主之甘草炙乾薑各二兩附子一個生用面赤色者加蔥九莖腹中痛者去蔥加芍藥二兩嘔者加生薑二兩咽痛者去芍藥加桔梗一兩利止脈不出者去桔梗加人參一兩上㕮咀每服五錢水煎溫服未瘥急更作一劑其脈續續出者愈少陰病但欲寐四肢逆而利若下重者四逆散加薤白也論見厥方見但欲寐若惡寒身蜷者不治論見欲寐下利腹脹滿身體疼痛先溫其里乃攻其表溫里四逆湯攻表桂枝湯傷寒表不解乾嘔發熱咳而下利者此為水氣宜小青龍去麻黃加芫花湯方論見效太陽與陽明合病者必自下利葛根湯主之方見太陽病活人云下利而頭痛腰疼肌熱目疼鼻乾其脈浮大而長者是其症也太陽與少陽合病自下利者與黃芩湯若嘔者黃芩加半夏生薑湯主之下利而頭疼胸滿或口苦咽乾或往來寒熱其脈浮大而弦是也黃芩湯黃芩三分甘草炙芍藥各二分大棗二枚上㕮咀水煎溫服若嘔加半夏六錢生薑五片太陽病桂枝症醫反下之利遂不止脈促者表未解也喘而汗出者宜葛根芩連湯葛根三兩黃連黃芩各二兩甘草炙半兩上㕮咀每服五錢水煎溫服日進二三服下利清穀脈沉微手足厥逆者為陰宜通脈四逆湯論見前條脈浮而遲表熱裡寒下利清穀者四逆湯主之傷寒醫下之續得下利清穀不止身疼痛者急當救里下後身疼痛清便自調者急當救表救里宜四逆湯救表宜桂枝湯少陰病下利便膿血者桃花湯主之少陰病二三日至四五日腹滿小便不利下利不止便膿血者宜桃花湯赤石脂四兩一半全一半取末大米二合半乾薑二錢半上水二大盞煮三味米熟去渣納赤石脂細末一方寸匕溫服日三愈勿服少陰病下利膿血者可刺下利便膿血若厥而發熱厥少熱多者病當愈也論見厥先厥後發熱無汗者利不止也論見前條下利脈數而渴者令自愈設不瘥者必清膿血以有熱故也下利寸脈反浮數尺中自澀者必清膿血下利脈數不解而下利不止者必挾熱而便膿血也論見蓄血下利譫語若脈微手足厥但欲寐小便難者為陰宜補劑和之若脈和手足溫及不欲寐小便利者為陽宜調胃承氣湯論見譫語及前少陰下利欲寐條陽明少陽合病必下利其脈不負者順也負者失也互相剋賊名為負也脈滑而數者有宿食也當下之宜大承氣湯下利脈遲而滑者內實也利未欲止當下之宜大承氣湯下利脈反滑當有所去下之乃愈宜大承氣湯下利脈微者白通湯也若微澀嘔而汗出數更衣者當溫而灸之方論見少陰不利條下利脈大者虛也以其強下之故也設脈浮革故爾腸鳴者屬當歸四逆湯主之熱利下重者白頭翁湯主之四肢逆而泄利下重四逆散加薤白主之論見前厥利條下利身體疼痛若但四肢沉重疼痛小便不利者前條真武湯症也若四肢疼厥逆惡寒者四逆湯若通身疼痛者先以四逆湯溫里後用桂枝攻表也方論見前下利三部脈皆平按之心下硬者急下之宜大承氣湯下利後心下痞硬者此非結熱但胃虛客氣上逆故使硬甘草瀉心湯主之論見痞下利咽喉痛若兼胸滿者豬膚湯兼厥逆者通脈四逆湯若下利不止厥逆下部無力咳唾膿血者麻黃升麻湯方論並見前條下利十餘行胸中痛寸口脈滑者宜吐之則利止論見胸滿傷寒服湯藥下利不止心下痞硬服瀉心湯後以他藥下之利不止醫以理中與之利益甚理中者理中焦此利在下焦赤石脂禹餘糧湯主之復利不止者宜利其小便赤石脂禹餘糧湯赤石脂禹餘糧各四兩上銼碎每服五錢水煎溫服不瘥再服下後心下痞硬腹中雷鳴乾嘔而利者甘草瀉心湯方論見痞下後心下痞硬表裡不解而利者桂枝人參湯方論見痞下利脈促表不解喘汗而利者葛根黃芩黃連湯論見前下利有表條凡藥下後潮熱脅滿嘔而利者先用小柴胡湯解外後以柴胡加芒硝湯論見潮熱凡藥下後譫語脈調和小便利而下利不厥者調胃承氣湯論見譫語下後脈大浮革腸鳴而利者當歸四逆湯論見前下利脈治條下後脈數不解者必便膿血論見前便血條下後成陰症厥逆咽不利唾膿而利者麻黃升麻湯論見厥利條少陰病脈緊至七八日自下利脈暴微手足反溫脈緊反去者為欲解也雖煩下利必自愈傷寒脈浮緩手足溫至七八日忽暴煩下利日十餘行者必自止論見黃門發熱而厥七日下利者為難治傷寒六七日不利便發熱而利其人汗出不止者死有陰無陽故也少陰病但欲臥不煩至五六日忽自利煩躁不得寐者死論見但欲寐下利脈沉弦者下重也脈大者為未止脈微數者為欲自止雖發熱不死下利有微熱而渴脈弱今自愈下利脈數而渴者自愈設不瘥者必清膿血論見前下利脈數有微熱汗出今自愈設復緊為末解傷寒下利日十餘行脈反沉者死假令下利寸口關上尺中悉不見脈然尺中時一小見脈再舉頭者腎氣也若損脈來至為難治下利清穀不可攻表汗出必脹滿下利續法活寒毒入胃者臍下必寒腹滿脹大便黃白或青黑或下利清穀宜四逆湯理中湯白通加附子湯四逆加薤白散挾熱利者臍下必熱大便赤黃色及腸間津汁垢膩宜黃芩湯白頭翁湯三黃熟艾湯薤白湯赤石脂湯三黃熟艾湯治傷寒四日而大下熱利時作白通湯諸藥多不得止宜服此湯除熱止利黃芩黃連黃柏熟艾半雞子大上㕮咀水煎溫服薤白湯治傷寒下利如爛肉汁赤帶下伏氣腹痛諸熱悉主之豆豉半合綿裹薤白一握山梔七枚上㕮咀用水二升半先將梔子十沸下薤白煎至二升下豉煎取一升二合溫服赤石脂丸治傷寒熱利赤石脂一兩黃連當歸各二兩乾薑炮一兩上為末煉蜜丸如桐子大每服三十丸米飲下日三服濕毒氣盛者下利腹痛大便如膿血或如爛肉汁宜桃花湯地榆散黃連阿膠散地榆散治傷寒熱毒不解日晚即壯熱腹痛便利膿血地榆犀角屑黃連炒葛根各一兩梔子仁半兩黃芩一兩上㕮咀每服四錢水一盞入薤白五寸同煎溫服海阿膠湯治傷寒熱毒入胃下利膿血黃連炒二兩山梔半兩阿膠炒黃柏各一兩上㕮咀每服四錢水煎服云傷寒汗下後大小便利者腹中痛者宜燥腸丸附子炮一枚龍骨半兩乾薑一兩吳茱萸粟殼訶黎皮各半兩上為細末酒糊丸如桐子大每服三十丸溫水下利止勿服傷寒汗下後裹急後重下利者宜七宣丸大黃一兩桃仁去皮尖三十枚木香檳榔柴胡訶子皮甘草各半兩上為細末煉蜜丸如桐子大每服五十丸溫水下傷寒汗下後氣逆利不止者寒也宜枳實芍藥甘草湯芍藥甘草枳實炒乾薑炮各半兩上㕮咀每服五錢水煎服厥陰病氣上衝心厥陰之為病消渴氣上衝心心中疼熱飢不欲食食則吐蛔厥陰病渴欲飲水者少少與之愈厥陰中風脈微浮為欲愈不浮為未愈厥陰病欲解時從醜至卯上病如桂枝症頭不痛項不強寸脈微浮胸中痞硬氣上衝咽喉不得息者此為胸有寒也當吐之宜瓜蒂散瓜蒂炒黃赤小豆各一分上研為細末取一錢用豉一合湯七合先漬之須臾煎稀糜去渣取汁相和溫頓服不吐少少加得快吐乃止諸亡血虛家不可與服活瓜蒂散每服一錢匕藥下便臥欲吐且忍之良久不吐取三錢匕湯二合和服以手指探之便吐不吐復稍增之以吐為度若吐少病不除明日如前法再吐之不可令人虛也如藥力過時不吐飲熱湯一升以助藥力吐訖便可食無更服若服藥過多者飲水解之奔豚氣上衝胸腹痛往來寒熱奔豚湯主之方見積塊腎積氣條陰陽易少腹裡急引陰中拘攣熱上衝胸頭重不欲舉眼中生花者宜燒裩散論見陰陽易氣上衝胸口噤不得語欲作剛痓者宜葛根湯論見痓燒針令其汗針處被寒核起而赤者必發奔豚氣從少腹上衝心者灸其核各一壯與桂枝加桂湯桂枝二兩半芍藥生薑各一兩半甘草一兩大棗六枚上㕮咀每服五錢水煎溫服桂枝加桂以能泄奔豚氣也動氣發汗則氣上衝正在心端論見動氣太陽下後其氣上衝者可與桂枝湯方用前法若不上衝者不可與之傷寒吐下後心下逆滿氣上衝胸頭眩脈沉緊若發汗則動經身為振搖者茯苓白朮甘草湯論見戰振方見振搖傷寒吐下後發汗虛煩脈甚微八九日心下痞硬脅下痛氣上衝咽喉眩冒經脈動惕者久而成痿氣上衝心續法活李根湯治氣上衝正在心端半夏當歸芍藥生薑茯苓桂枝黃芩甘草甘李根白皮各等分上㕮咀每服五錢水煎溫服飢不飲食飢不欲食食則吐蛔者厥陰病論見氣上衝心手足厥冷脈乍緊心煩飢不能食者邪在胸中宜瓜蒂散吐之論見厥太陽病吐發汗出發熱不惡寒關脈細數腹中飢口不能食朝暮吐者此為小逆論見發熱陽明病下後心下懊憹飢不欲食但頭汗出者宜梔子豉湯論見煩吐蛔蟲氣上衝心疼飢不欲食吐蛔者厥陰病論見氣上衝靜而復煩須臾復止得食而嘔又煩吐蛔蟲者為蛔厥宜烏梅丸方論見厥病人有寒復發汗胃中冷必吐蛔活人云先服理中丸次服烏梅丸厥兩感於寒者三日少陽與厥陰俱病則耳聾囊縮而厥論見太陰注云耳聾者少陽病囊縮而厥者厥陰病傷寒一二日至四五日而厥者必發熱前熱者後必厥厥深者熱亦深厥微者熱亦微厥應下之而反發汗者必口傷爛赤成無己云若始得之手足便厥而不溫者是陰經受邪陽氣不足可用四逆湯溫之若手足自熱而至溫從四逆而至厥者傳經之邪也四逆散主之必須識此勿令誤也四逆湯方見下利四逆散方見欲寐又當外症別之豫嘗治一中年婦人惡熱身熱而渴脈數細弱先厥後熱用溫藥反劇後以四逆散兼參術各半服之厥愈脈出洪大而痊手足厥寒脈細欲絶者宜當歸四逆湯甘草通草各六錢當歸桂枝細辛芍藥各一兩上㕮咀每服五錢入棗子一枚同煎溫服若其人內有久寒者宜當歸四逆加茱萸生薑湯主之於原方內加吳茱萸二兩生薑二兩半嘔而脈弱小便復利身有微熱見厥者難治四逆湯主之傷寒脈滑而厥者里有熱也白虎湯主之傷寒脈促手足厥逆者可灸之脈經云可灸少陰厥陰主逆傷寒六七日脈微手足厥冷煩躁灸厥陰灸而不止者死病人手足厥冷脈乍緊者邪結在胸中心中滿而煩飢不能食者病在胸中當吐之宜瓜蒂散脈緊一作脈結者有理脈來數時一止復來曰促脈來緩時一止復來曰結結促二脈者脈為邪礙而歇止也灸之吐之所以逐去其邪也少陰病身痛手足寒脈沉者宜附子湯論見欲寐傷寒五六日頭汗出微惡寒手足冷心下滿口不欲食大便硬脈細者此為陽微結必有表復有里也脈沉亦在裡也汗出為陽微假令純陰結不得復有外症悉入在裡此為半在裡半在表也脈雖沉緊不為少陰病所以然者陰不得有汗今頭汗出故知非少陰也可與小柴胡湯設不了了者得屎而解本有人患傷寒五六日頭汗自出自頸以下無汗手足冷心下痞悶大便祕結或者見四肢冷又汗出滿悶以為陰症豫診其脈沉而緊豫曰此症誠可疑然大便結非虛結也安得為陰脈雖沉而緊為少陰症多是自利未有祕結者此症半在裡半在表投以小柴胡湯得愈仲景稱傷寒五六日頭汗出云云至得屎而解正此之謂也有人難曰脈陰陽俱緊反汗出者亡陽也此屬少陰不得有汗何也今頭汗出者故知非少陰何以頭汗出便知非少陰症豫曰此一段正是仲景議論處謂四肢冷脈沉緊腹滿全似少陰然大便硬頭汗出不得為少陰蓋頭者三陽同聚若三陰止胸而還有頭汗出自是陽虛故曰汗出為陽微是陰不得有汗也若少陰頭有汗則死矣故仲景平脈法云心者火也明少陰則無頭汗者可治有汗者死心為手少陰腎為足少陰相與為上下惟以意逆志者斯可得之傷寒厥而心下悸者宜先治水當服茯苓甘草湯卻治其厥不爾水漬入胃必作利也茯苓甘草湯茯苓桂枝各二錢生薑三錢甘草炙一錢上㕮咀水煎溫服少陰病四逆或悸者四逆散加桂枝主之方論見欲寐傷寒脈浮自汗出小便數心煩微惡寒腳攣急反與桂枝湯欲攻其表此誤也得之便厥咽中干煩躁吐逆者作甘草乾薑湯與之以復其陽若厥愈足溫者更作芍藥甘草湯與之其腳即伸若胃氣不和譫語者少與調胃承氣湯若重發汗復加燒針者四逆湯主之甘草乾薑湯甘草四兩乾薑二兩上㕮咀每服五錢水煎溫服芍藥甘草湯白芍藥甘草各二兩上㕮咀每服五錢水煎溫服調胃承氣湯方見發熱四逆湯方見下利問曰症象陽旦按法治之而增劇厥逆咽中干兩脛拘急而譫語師曰言夜半手足當溫兩腳當伸後如師言何以知此答曰尺寸浮而大浮則為風大則為虛風則生微熱虛則兩脛攣急症象桂枝因加附子參其間增桂令汗出附子溫經回陽故也厥逆咽中干煩躁陽明內結譫語煩亂更飲甘草乾薑湯夜半陽氣還兩足當熱脛尚微拘急重與芍藥甘草湯乃脛伸以承氣湯微溏則止其譫語故知病可愈少陰病食入則吐復不能吐手足寒脈弦遲者宜吐之論見吐下利而厥下重者四逆加薤白脈微者通脈四逆湯白通湯溫後無脈者白通加豬膽汁湯汗後拘急者四逆湯下後咽不利者麻黃升麻湯方論見下利吐利發熱惡寒汗出而厥者屬霍亂宜四逆湯吐利煩躁欲死而厥者屬少陰宜吳茱萸湯吐利止脈微欲絶而厥者通脈四逆加豬膽汁湯方論見吐利中暑口乾而渴治法見中暑門傷寒脈微而厥至七八日膚冷其人躁無暫安時者此為臟厥非為蛔厥也蛔厥者其人當吐蛔令病者靜而復時煩此為臟寒蛔上入膈故煩須臾復止得食而嘔又煩者蛔聞食臭出其人當自吐蛔蛔厥者宜烏梅丸主之烏梅七十五個細辛附子炮去皮人參黃柏桂枝各一兩乾薑二兩黃連四兩蜀椒炒去汗一兩當歸上十味共為細末以苦酒漬烏梅一宿去核蒸熟杵成泥和藥令相得納臼中加煉蜜杵三千下丸如桐子大食前服十丸日三服稍加至二十丸忌生冷滑物等凡厥者陰陽氣不相順接便為厥厥者手足逆冷是也傷寒厥四日熱反三日復厥五日其病為進寒多熱少陽氣退故為進也傷寒發熱四日厥反三日厥少熱多其病當自愈四日至七日熱不除者其後必便膿也傷寒始發熱六日厥反九日而利凡厥利者當不能食今反能食恐為除中食以索餅不發熱者知胃氣尚在必愈恐胃熱來而復去也後三日脈之其熱續在者期之旦日夜半愈所以然者本發熱六日厥反九日復發熱三日並前六日亦為九日與厥相應故期之旦日夜半愈後三日脈之而脈數其熱不罷者此為熱氣有餘必發癰膿也傷寒病厥五日熱亦五日設六日當復厥不厥者自愈厥終不過五日以熱五日故知自愈傷寒熱少厥微指頭寒默默不欲食煩躁數日小便利色白者此熱除也欲得食其病為愈苦厥而嘔胸膈煩滿者其後必便血少腹滿痛而厥為冷結關元論見少腹痛少陰四逆惡寒身蜷無脈不煩而躁死論見欲寐少陰病但厥無汗而強發之必動其血論見欲寐諸四逆厥者不可汗之諸虛家亦然傷寒五六日不結胸腹濡脈虛復厥者不可下此為亡血下之者死上厥逆皆忌下惟前條先熱者必厥厥應下之而反發汗者一法宜下忌汗之厥續法活冷厥者初得病日便四肢逆冷脈沉微而不數足多攣臥時惡寒或自引衣蓋覆不飲水或下利清穀或清便自調或小便數外症多惺惺而靜脈雖沉實按之遲而弱者知其為冷厥也四逆湯理中湯通脈四逆湯當歸四逆湯當歸四逆加茱萸生薑湯白通加豬膽汁湯隨症用之熱厥者初中病必身熱頭痛外別有陽症二三日至四五日方發厥兼熱厥者厥至半日卻身熱蓋熱氣深方能發厥須在二三日後也若微厥卻發熱者熱深故也其脈雖伏按之而滑者為裡熱其人或畏熱或飲水或揚手擲足煩躁不得眠大便祕小便赤外症多昏憒者知其熱厥也白虎承氣湯隨症用之又有下症悉具而見四逆者是失下後血氣不通四肢便厥醫人不識卻疑陰厥復進熱藥禍如反掌大抵熱厥須脈沉伏而滑頭上有汗其手雖冷時復指爪溫須便承氣湯下之不可拘忌也海厥陰症四肢厥冷爪甲青脈沉疾按之有力者為陽則當下宜大承氣湯如脈沉遲按之無力者為陰則當溫宜四逆湯更須速灸之羅省掾曹德裕男婦二月初病傷寒八九日請豫治之脈得沉細而微四肢逆冷自利腹痛目不欲開兩手常抱腋下昏昏嗜臥口舌乾燥乃曰前醫留白虎加人參湯可服否豫曰白虎雖云治口燥舌乾若只此一句亦未然今此症不可服白虎者有三傷寒症云立夏以前立秋以下不可妄用一也太陽症無汗而渴者不可用二也況病人陰症悉具其時春氣尚寒三也仲景云下利清穀急當救里宜四逆湯五兩人參一兩生薑十餘片連須蔥白九莖水五大盞同煎至三盞去渣分三服一日服之至夜則止手足溫翌日大汗而解繼之以理中湯數服而愈孫真人習業論云凡欲為太醫必須精讀甲乙素問黃帝針經明堂流注十二經絡三候九部本草藥性仲景叔和並須精熟如此方為太醫不爾猶無目夜遊動致顛殞執此用藥者再思可矣陽症治驗真定府趙吉夫年三十三至元五月間因勞役飲食失節傷損脾胃時發煩躁而渴又食冷物過度遂病身體困倦頭痛四肢逆冷嘔吐而心下痞醫人不察見其四肢逆冷嘔吐而心下痞乃用桂枝末三錢匕熱酒調下仍以綿衣覆之作陰毒傷寒治之須臾汗大出汗後即加口乾舌澀眼白時紅項強硬肢體不柔和小便淋赤大便祕澀循衣摸床如發狂狀問之則言語錯亂視其舌則赤而欲裂朝輕暮劇凡七八日家人輩悉謂危殆不望生全鄰人吉仲完舉豫治之診其脈七八至知其熱症明矣遂用大承氣湯苦辛大寒之劑一兩作一服服之利下三行折其勝勢翌日以黃連解毒湯大苦寒之劑二兩徐徐服之以去其熱三日後病十分中減五六更與白虎加人參湯約半斤服之瀉熱補氣前症皆退戒以慎起居節飲食月餘漸得平復內經曰凡用藥者無失天時無逆氣宜無冀其勝無贊其復是謂至治又云必先歲氣無伐天和當暑氣方盛之時聖人以寒涼急救腎水之原補肺金之不足雖有客寒傷人仲景云用麻黃湯內加黃芩知母石膏之類恐發黃發斑又用桂枝湯之戒況醫以桂末熱酒調服所謂差之毫釐謬以千里逆仲景之治法經云不伐天和不讚其復不翼其勝不失氣宜不然則故疾未已新病復起矣用熱遠熱從乎中治友人劉巨源年六十五歲至正夏月因勞役飲食失節又傷冷飲得疾醫者往往以為四時症治之不愈逮十日請豫治之曰右手三部脈沉細而微太陰症也左手三部脈微浮而弦虛陽在表也大抵陰多而陽少今所苦身體沉重四肢逆冷自利清穀引衣自覆氣難布息懶言語此脾受寒濕中氣不足故也仲景言下利清穀急當救里宜四逆湯溫之內經有用熱遠熱之戒口乾但漱水不咽早晨身涼而肌生粟午後煩躁不欲去衣昏昏睡而面赤隱隱紅癍見於皮膚此表實裡虛故也內虛則外症隨時而變詳內外之症乃飲食勞倦寒傷於脾胃非四時之症明矣治病必察其下今適當大暑之時而得內寒之病以標本論之時為標也病為本也用寒藥則順時而違本用熱藥則從本而逆時此乃寒熱俱傷必當從乎中治中治者溫之是也遂以錢氏白朮散加升麻就本方加葛根甘草以解其斑少加白朮茯苓以除濕而利小便人參藿香木香和脾胃進飲食㕮咀一兩煎服再服癍退而利止身溫而神出次服異功散治中湯辛溫之劑一二服五日得平止藥或曰病雖少愈勿藥可乎豫曰藥攻邪也內經曰治病以平為期邪氣既去強之以藥變證隨起不若以飲食調養待其真氣來復此不藥而藥不治而治之理旬日良愈必察其下者謙甫謂時下之宜也活若病人寒熱而厥面色不澤冒昧而兩手忽無脈或一手無脈者必是有正汗也多用綿衣裹手足令溫暖急服五味子湯或兼與麻黃細辛甘草湯之類服之晬時必有大汗而解矣五味子湯治傷寒喘促脈伏而厥人參一分五味子半兩麥門冬去心杏仁去皮尖生薑陳皮各一分棗子二枚上㕮咀水煎服摘治傷寒手足逆冷大都一分集傷寒六脈俱無復溜補大回六脈合谷中極支溝一寸半此穴和脈絶穴復溜順骨而下巨闕三寸三分氣衝灸七壯活諸手足逆冷皆屬厥陰不可汗下然有須汗須下者謂手足雖逆冷時有溫時手足掌心必暖非正厥逆也當消息之脈病若四肢厥逆脈反浮大而短者死少腹滿囊縮尺寸脈微緩者厥陰受病也當六七日發其症少腹煩滿而囊縮論見大法活人云脈沉短囊縮者承氣湯下之病者手足厥冷言我不結胸小腹滿按之痛者此冷結在膀胱關元也少腹硬滿小便利者為蓄血若兼身黃髮狂者抵當湯主之不身黃髮狂者抵當丸但少腹急結者宜桃仁承氣湯詳見蓄血門傷寒表不解乾嘔發熱而咳或小便不利少腹滿者小青龍去麻黃加茯苓湯主之論見咳不大便日晡潮熱從心至少腹硬滿而痛者宜大陷胸湯少腹滿囊縮續法活傷寒六七日煩滿囊縮其脈尺寸俱微緩者足厥陰肝經受病也厥陰病其脈微浮為欲愈不浮為未愈宜小建中湯脈浮緩者必囊不縮外症必發熱惡寒似瘧為欲愈宜桂枝麻黃各半湯若尺寸俱沉短者必是囊縮毒氣入腹宜承氣湯下之大抵傷寒病臟腑傳變陽經先受病故次傳入陰經以陽主生故太陽水傳足陽明土土傳足少陽木為微邪也陰主殺故木傳足太陰土土傳足少陰水水傳足厥陰木至六七日當傳厥陰肝木必移氣克於脾土脾再受邪則五臟六腑皆因而危殆榮衛不通耳聾囊縮不知人而死矣速用承氣湯下之可保五生一死古人云脾熱病則五臟危又土為木賊則死若第六七日傳厥陰脈得微緩微浮為脾胃脈也故知脾氣全不受克邪無所容否極泰來榮衛將復水升火降則寒熱作而大汗解矣海厥陰症者煩滿囊縮大小便不通發熱引飲腹滿尺寸脈微緩煩者火也滿者木也雖不吐蛔囊縮但急者亦木也火與木相合四肢厥逆而爪甲青大小便不通地道塞也發熱引飲邪氣在裡宜溫之下之以上諸症大小便俱通地道不塞不發渴不引飲邪不在裡則宜溫之灸之則裡外相接以復陽氣宜服正陽散麝香一錢細研性辛溫治腹急滿痞風毒乾薑炮甘草炙各二錢半附子一兩炮去皮臍味辛鹹溫治風利竅療腹滿囊縮皂角二兩酥炙去皮弦味鹹溫上為細末每服二錢白湯下溫服回陽丹硫黃半兩味酸溫大熱治心腹腫聚邪氣冷癖左脅氣咳上氣腳冷無力附子炮半兩乾薑炮二錢半木香半兩味辛溫療肌中偏寒主氣不足乏精全蠍半兩味甘辛治一切風蓽澄茄半兩味辛溫治皮風心腹氣脹吳茱萸半兩洗炒味辛溫大熱治中風逐邪諸食不消氣逆利五臟順氣上為末酒糊丸如桐子大生薑湯下三五十丸並二三服以熱投之衣被取汗陰氣毒盛變陰毒陰毒之為病面青身痛如被杖咽喉痛五日可治七日不可治升麻鱉甲湯去雄黃蜀椒主之升麻鱉甲湯方見陽毒陰毒續法活陰毒甘草湯治傷寒時氣初得病一二日便結成陰毒或服藥後六七日以上至十日變成陰毒身重背強腹中絞痛咽喉不利毒氣攻心心下堅強短氣不得息嘔逆唇青面黑四肢厥冷其脈沉細而疾身如被杖咽喉痛五六日可治七日不可治甘草炙升麻當歸各五錢雄黃二錢半桂枝去皮五錢蜀椒炒去汗並閉口者及子二分鱉甲酥炙一兩半上㕮咀水煎服如人行五里許更進一服覆取汗毒從汗出汗出即愈若未汗再服本陰毒本因腎氣虛冷因欲事或食冷物後傷風內既伏陰外又感寒或先感外寒而後伏陰內外皆陰則陽氣不守遂發頭痛腰重腹痛眼睛疼身體倦怠而不甚熱四肢逆冷額上及手背冷汗不止或多煩渴精神恍惚如有所失或可起行不甚覺重診之則六脈俱沉細而疾尺部短小寸口或無六脈俱浮大或沉取之大而不甚疾者非陰症也若服涼藥過多則渴轉甚躁轉急有此症者急服還陽退陰之藥即安惟補虛和氣而已宜服正元散退陰散五勝散陰症不宜發汗如氣正脈大身熱未瘥用藥發汗無妨正元散治傷寒如覺風寒吹著四肢頭目骨節疼痛急服此藥如人行五里許再服連進三服出汗立瘥若患陰毒傷寒入退陰散五分同煎或傷冷傷食頭昏氣滿及心腹諸疾服之無有不效麻黃去節陳皮大黃生甘草乾薑肉桂芍藥附子吳茱萸半夏制各等分上㕮咀麻黃加一半茱萸減一半同為末每服一錢水一盞薑三片棗一枚煎七分熱服以衣被蓋覆取汗切須候汗乾去之如是陰毒不可用麻黃免更出汗退陰散治陰毒傷寒手足逆冷脈沉細頭痛腰重連服三次小小傷冷每服一字入正元散同煎入鹽一捻陰毒傷寒咳逆煎一服細細熱呷病止川烏乾薑等分上為粗末炒令轉色放冷再搗為細末每服一錢水一盞鹽一捻煎至半盞去渣溫服五勝散治傷寒頭痛壯熱骨節疼痛昏沉困倦咳嗽鼻塞不思飲食兼治傷寒夾冷氣並慢陰毒神效白朮一兩半甘草五味子石膏各一兩乾薑三兩半上㕮咀每服五錢水一盞入鹽少許同煎服如冷氣相夾入薑棗煎或治陰毒病入艾葉少許煎服海白朮散治陰毒傷寒心悶煩躁四肢厥冷川烏炮去皮臍桔梗附子炮白朮細辛各一兩乾薑炮半兩上㕮咀或末之白湯調下一錢匕羅正陽丹治陰毒傷寒手足厥冷指甲青色體冷脈沉細而微神效用憨蔥四五枝陳蜂房四五個燒存性為細末用憨蔥搗和丸如彈子大手心內握定用手帕緊繫定須臾汗出以綿被覆蓋如手心熱甚休教解開如服藥先服升麻湯五錢連須蔥三莖生薑五片水二大盞煎至一盞去渣溫服被覆取汗則愈本陰毒漸深候積陰感於下則微陽消於上故其候四肢沉重逆冷腹痛轉甚或咽喉不利或心下脹滿結硬燥渴虛汗不止或時狂言爪甲面色青黑六脈沉細而一息七至以來有此症者速宜於氣海關元二穴灸二三百壯以手足溫暖為效仍服金液丹來蘇丹玉女散還陽散退陰散玉女散川烏去皮臍冷水浸七日薄切曬乾紙袋盛之有患者取研末一大錢入鹽一小錢水一盞煎至七分服壓下陰毒所注如豬血相似未已再進一服效還陽散治陰毒面青四肢逆冷心躁腹痛用硫黃末新汲水調下二錢良久或寒一起或熱一起更看緊慢再服汗出瘥活返陰丹治陰毒傷寒心神煩躁頭疼四肢逆冷硫黃五兩附子炮去皮臍乾薑炮桂心各半兩硝石另研太陰玄精石另研各二兩上用生鐵銚先鋪玄精末一半次鋪硝石末一半中間下硫黃末又著硝石一半蓋硫黃卻以玄精石末蓋上用小盞合著用三斤炭火燒令得所勿令煙出細研似面後三味搗羅為末與前藥同研令勻軟飯和丸如桐子大每服十五丸至二十丸煎艾湯下頻服汗出為度病重則三十丸此方甚驗喘促與吐逆者入口便住又服此藥三五服不退者更於臍下一寸灸之須是晝夜大段不住手灸不限多少壯數灸之艾炷勿令小小則不得力若其人手足冷少腹硬即於臍下兩邊各開一寸各安一道三處齊下火灸之仍與當歸四逆湯並返陰丹亦須頻服內外通透方得解若遲誤即死矣又若陰症加以少腹不通及陰囊縮入少腹絞痛欲死者更於臍下二寸石門穴急灸之仍須與返陰丹當歸四逆湯加吳茱萸生薑慎勿與尋常利小便冷滑藥火焰散治傷寒惡候舶上硫黃黑附子去皮生用新臘茶為細末各一兩上為細末先用好酒一升調藥攤入新碗中於火上蕩干合在瓦上每一碗下燒熟艾一拳大以瓦搘起無令著火直至姻盡候冷即括取研入瓷盒內盛每服二錢酒一盞共煎七分有火焰起勿訝傷寒陰毒者四肢冷脈沉細或吐瀉五心煩躁胸中結硬或轉早伏陰在內湯水不得下或無脈先吃一服如吐卻更進一服服後心中熱其病已瘥下至臟腑中表未解者渾身壯熱脈氣洪大便宜用發表藥或表解者更不發熱便得眠睡渾身有汗若少有痞結脈實方可用下膈行臟腑藥漸用調和元氣補治脾胃湯散服此藥三服不應者不可治也本陰毒沉困之候與前後漸染之候皆同而更加沉重六脈附骨取之方有按之即無一息八至以上或不可數至此則藥餌難為功矣但於臍下灼火艾如棗大三百壯以來手足不和暖者不可治也倘復和暖以前硫黃及熱藥助之若陰氣散陽氣來則漸減熱藥而和治之以取瘥也活治陰虛陽脫體冷無脈氣息欲絶不省人事及傷寒陰厥百方不效者用蔥以索纏如臂大切去根及葉惟存白長二寸許如大餅樣先以火協一面令通熱勿令著火乃以熱面尉病人臍上連臍下又以尉斗滿貯火尉之令蔥餅中熱氣鬱入肌肉中須更作三四餅一餅壞不可尉又易一餅良久病人當蘇手足溫有汗即瘥更服四逆湯以溫其內海治陰症諸藥不效並湯水不下身冷脈絶氣息短不知人用蔥白尉法莫若用釅醋拌麩皮炒熟注布袋中蒸尉比上法尤速代灸塗臍膏附子馬藺子蛇床子吳茱萸肉桂各等分上為細末可用白麵一匙藥末一匙生薑自然汁煨成膏攤紙上圓三寸許貼臍下關元氣海自晚至曉其火力可代灸百壯腰痛亦可貼之一法用丁香蓽茇乾薑牡蠣燒灰放手心中以唾津調如泥以手掩其陰至暖汗出為度陰毒傷寒四肢逆冷者用吳茱萸不拘多少為細末溫酒和勻生絹袋盛之熱尉腳心令通暢愈若以湯煎溫藥泄洗以接四肢亦可本治陰中伏陽破陰丹硫黃水銀各一兩陳皮青皮各半兩上將硫黃先入銚子內熔開次下水銀用鐵杖子打勻令無星傾入黑茶盞內細研入二味用麵糊丸如桐子大每服三十丸如煩躁冷鹽湯下陰症艾湯下良效有人初得病四肢逆冷臍下築痛身疼如被杖蓋陰症也急服金液破陰來復等丹其脈遂沉而滑沉者陰也滑者陽也病雖陰症而見陽脈有可生之理仲景所謂陰病見陽脈者生仍灸氣海丹田百壯手足溫溫陽回得汗而解或問滑沉之狀如何便有生理豫曰仲景云翕奄沉名曰滑何謂也沉為純陰翕為正陽陰陽和合故名曰滑古人論脈滑雖曰往來前卻流利旋轉替替然與數相似仲景三語而足也此三字極難曉翕合也言張而復合也故曰翕為正陽沉言忽降而下也故曰沉為正陰方翕而合俄降而沉奄為忽忽間仲景論滑脈可謂諦當矣其言皆有法故讀者難曉宜細思之
