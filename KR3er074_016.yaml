body:
  text: 卷之十六心小腸部心痛丹心痛即胃脘痛凡心痛必用溫藥此是鬱結不行阻氣不運故痛在下者多屬食宜溫利之大凡心膈痛須分新久若明知身受寒氣口吃寒物而得者於初得之日當與溫散或溫利之溫散謂治身受寒氣於外者如陳無擇麻黃桂枝湯治外因心痛之類是也方見表條溫利謂治口食寒物於裡者如仲景九痛丸潔古煮黃丸治大實心痛之類是也方見實條若曰病得之稍久則成郁久鬱則蒸熱熱久必生火原病式中備言之矣若欲行溫散溫利寧無助火添病耶由是方中多以山梔為熱藥之嚮導則邪易伏病易退正氣復而病安矣然病安之後若恣縱口味不改前非病復作時乃委咎於醫誤也大概胃口有熱而作痛非山梔不可須薑汁佐之多用臺芎開之用山梔炒去皮每十五枚煎濃湯一呷入薑汁令辣再煎少沸吞九枚加川芎一錢尤妙又方用山梔去殼炒黃為末以薑汁調粥丸有寒者加草豆蔻末丸服之又方治氣實心痛山梔去殼炒焦六錢香附一錢茱萸一錢上為末炊餅丸如花椒大以生地黃用酒洗淨同生薑煎湯下二十丸外用胡椒蓽茇各半兩為末以醋調捏成丸子吞之心痛方黃連炒山梔炒茱萸各五錢荔枝核燒存性為末三錢滑石上為末薑汁化炊餅為丸又方治心痛白朮白芍藥砂仁半夏當歸各三錢桃仁甘草黃連神麯炒陳皮吳茱萸各一錢半殭蠶人參各一錢又方二陳湯加川芎蒼朮倍加炒梔痛甚者加炒乾薑此從治反治之法保寒厥心痛者手足逆而通身冷汗出便利溺清或大便利而不渴氣微力弱急宜以朮附湯溫之寒厥暴痛非久病也朝發暮死宜急救之是知久病非寒暴病非熱也朮附湯治寒厥暴心痛脈微氣弱即仲景朮附湯也附子炮去皮臍一兩白朮四兩甘草炙一兩上粗末附子令勻每三錢水一盞半薑五片棗一枚煎至一盞去渣溫服食前羅胃脘當心而痛治驗漕運使崔君長男云卿年二十五體本豐肥奉養膏粱時時有熱證友人勸食寒涼物因服寒藥至元庚辰秋瘧發醫以砒霜等藥治之新汲水下禁食熱物瘧病未除反添吐瀉脾胃復傷中氣愈虛腹痛腸鳴時復胃脘當心而痛不任其苦屢醫未效至冬不瘥延至四月間勞役煩惱過度前證大作請豫治之診視脈得弦細而微手足稍冷面色清黃不澤情思不樂惡人煩冗飲食減少微飽則心下痞悶嘔吐酸水每發作冷汗時出氣促悶亂不安須人額相抵而坐少時易之豫思內經云中氣不足溲便為之變腸為之苦鳴下氣不足則為痿厥心冤又曰寒氣客於腸胃之間則卒然而痛得熱則已非甘辛大熱之劑則不能愈遂制一方名曰扶陽助胃湯附子炮去皮臍二錢乾薑炮一錢半草豆蔻益智仁揀參甘草炙官桂白芍藥各一錢吳茱萸陳皮白朮各五分內經曰寒淫於內治以辛熱佐以苦溫附子乾薑大辛熱溫中散寒故以為君草豆蔻益智仁辛甘大熱治客寒犯胃為佐脾不足者以甘補之炙甘草甘溫白朮陳皮苦溫補脾養氣水挾木氣亦來侮土故作急痛桂辛熱以退寒水芍藥味酸以瀉木來剋土吳茱萸苦熱泄厥氣上逆於胸中為使上銼如麻豆大都作一服水二盞薑三片棗二枚同煎至一盞去渣溫服食前三服大勢去痛減半至秋先灸中脘三七壯以助胃氣次灸氣海百餘壯生髮元氣滋榮百脈以還少丹服之喜飲食添肌肉皮膚潤澤明年春灸三里二七壯乃胃之合穴亦助胃氣引氣下行又以芳香助脾服育氣湯加白檀香平治之戒以懲忿窒欲慎言語節飲食一年而平復保熱厥心痛者身熱足冷痛甚則煩躁而吐額上自汗知為熱也其脈洪大宜灸太溪崑崙表裡俱瀉之是為熱病引熱下行汗通身出者安也灸後與金鈴子散痛止服枳實白朮丸去其餘邪也金鈴子散治熱厥心痛或作或止久不愈者金鈴子玄胡索各一兩上為末每服三錢酒調下痛止與枳朮丸外療峭心痛熊膽如大豆許和水服大效本草熊膽味苦寒仲心中寒者其人病心中如啖蒜狀劇者心痛徹背背痛徹心譬如蠱注其脈浮者自吐乃愈經云寒氣客於背俞之脈則血脈澀血脈澀則血虛血虛則痛其俞注於心故相引而痛按之則熱氣至熱氣至則痛止矣此亦寒氣客心背而痛也心痛徹背背痛徹心烏頭赤石脂丸主之蜀椒一兩烏頭炮一分附子炮半兩乾薑炮一兩赤石脂一兩上五味為末蜜丸如桐子大先食服一丸日服三不效稍加服胸痹不得臥心痛徹背者栝蔞薤白半夏湯主之栝蔞實一枚薤白三兩白酒一斗半夏半升上四味同煮至四升服一升日三服心胸中大寒痛嘔不能飲食腹中寒上衝皮起出見有頭足上下痛而不可觸近大建中湯主之蜀椒二合去汗乾薑四兩人參二兩上三味以水四升煮取二升去渣納膠飴一升微火煎取一升半分溫再服如一炊頃可飲粥二升後更服當一日食糜溫覆之心中痞厥逆心懸痛桂枝生薑枳實湯主之桂枝生薑各一兩枳實五個上三味以水六升煮取三升分溫三服聖治寒疝心痛四肢逆冷全不飲食用桂心二兩去皮搗羅為散不計時候熱酒調下一錢匕世果附湯治寒氣心痛附子草果良薑等分以酒煎服立效羅二薑丸養脾溫胃去冷消痰大治心脾疼寬胸下氣進飲食及一切冷物所傷並皆治之乾薑炮良薑上等分為細末麵糊丸如桐子大每服十五丸至二十丸食後陳皮湯妊娠婦人不宜服上方辛甘熱以散寒結世治心痛纍效冰梅一個去核生硫黃為末相和搗勻以可丸為度作一丸白湯下立愈病不再作上方酸熱以收散寒凡服辛劑反甚者改服酸劑立愈也丹客寒犯胃草豆蔻丸主之熱亦宜用止可一二服草豆蔻一錢四分麵裹煨熟去皮臍吳茱萸湯泡洗焙乾益智仁殭蠶炒歸身青皮各六分神麯薑黃各四分生甘草三分桃仁去皮七個半夏湯泡七次一錢澤瀉一錢小便利減半麥糵炒黃一錢半炙甘草六分柴胡四分詳脅下痛多少與之人參黃耆陳皮上一十八味除桃仁另研如泥外為極細末同研勻湯浸炊餅為丸如桐子大每服三十丸熱白湯送下食遠旋斟酌多少用之監縣之閣年五十餘春末心脾疼自言腹脹滿手足寒過肘膝須綿裹火烘胸襟畏熱卻喜掀露得風涼則快脈皆沉細而澀稍重則絶輕取似弦而短口渴干而喜熱飲穀肉全不食遂以草豆蔻丸三倍加黃連滑石炒神麯為丸白朮為君茯苓為佐陳皮為使作湯送下一百丸服至二斤諸證皆愈以物柱按而痛者挾虛以二陳湯加炒乾薑和之按之痛止者為虛治法並見寒心痛條丹溪云草豆蔻丸治氣餒弱人心痛方見寒熱通用條仲九痛丸治九種心痛附子三兩炮生狼牙一兩炙香巴豆一兩去皮心炒研如脂人參乾薑吳茱萸各一兩上六味為末煉蜜丸如桐子大酒下強人初服三丸日三服弱者二丸兼治卒中惡腹脹痛口不能言又治連年積冷流注心胸痛並冷腫上氣落馬墜車血疾等證皆主之忌口如常法潔煮黃丸治大實心痛方見飲食內傷藁本湯治大實心痛大便已利宜以此徹其痛也藁本半兩蒼朮一兩上銼每服一兩水二盞煎至半盞溫服上寒實仲按之心下滿痛者此為實也當下之宜大柴胡湯方見傷寒子和一將軍病心痛不可忍戴人曰此非心痛乃胃脘當心痛也內經曰歲木太過民病胃脘當心而痛乃與神佑丸一百餘粒病不減或曰此胃脘有寒宜溫補不宜與涼劑將軍素知戴人明瞭復求藥於戴人戴人復與神佑丸二百粒作一服大下六七行立愈神佑丸方見水腫門上熱實丹蔣氏子年十六久瘧方愈十日而心脾大痛兩手脈皆伏痛稍殺時氣口緊盛餘脈皆弦實而細豫曰此宿食也詢之因食冷油煎堆子遂以小胃丹津咽十餘粒仍斷飲食經三日凡與小胃丹十二次痛不作至晚下忽大痛連及兩脅豫曰此必與谷太早問之果然遂斷其飲食亦不與藥蓋宿積已因小胃而稍解其痛又因新谷與余積相併而復作若又攻擊必大傷胃氣所以不與藥又斷食三日其家大恐以為不救時有怨言豫曰六日不能思食強禁不與方成惡候待其索食與之又須較量方可至夜更余心嘈索食豫先用白朮黃連陳皮作丸子遂以熱湯下七八十丸以除其嘈雜若以為飢而與粥其痛必如前矣其家苦欲與豫詢病者膈間莫尚悶否答曰或才飢作必繼之薄悶今雖未甚快然亦未嘗思食過兩時許又索食豫以前丸與之如是者又一晝夜飢不再作人亦昏困思睡豫教以用稀粥減平日之半兩日禁其雜食調理半月而安小胃丹方見飲食內傷保心痛用小胃丹津下十五丸上漸除熱宿食積法世木香丸治食積心痛木香丁香三稜蓬朮青皮陳皮各二錢半檳榔二錢白豆蔻一錢巴豆肉十五粒用醋煮令無白心上末醋糊丸麻子大本治一切積聚有飲心痛硇砂丸硇砂三稜另末乾薑香白芷巴豆去油各半兩大黃另末乾漆各半兩木香青皮胡椒各一分檳榔肉豆蔻各一個上為細末釅醋二升煎五七沸後下三稜大黃末同煎五七沸入硇砂同煎成膏稀稠得所入諸藥和勻杵丸如緑豆大年深成塊生薑湯下四五丸食積熟水下白痢乾薑湯下赤痢甘草湯白痢當歸湯蔥酒亦得潔厚朴丸紫菀丸治積聚心痛厚朴丸方見翻胃紫菀丸方見積塊仲心傷者其人勞役即頭面赤而下重心中痛而自煩發熱臍跳其脈弦此為心臟所傷也丹心痛輕者散之麻黃桂枝重者加石鹼用川芎蒼朮炒山梔作丸服桂枝麻黃石鹼上為末薑汁浸炊餅為丸桐子大熱薑湯下十五丸如服丸數多又治痰飲無麻黃桂枝湯治外因心痛惡寒發熱內攻五臟拘急不得轉側麻黃去節湯浸焙桂心芍藥細辛去苗乾薑甘草炙各七錢半半夏香附各五錢上銼每五錢水盞半生薑五片煎七分去渣食前服大便祕入大黃量虛實加減世治心疼甚效檳榔桂心葛根甘草細辛半夏桔梗枳殼川芎防風上等分惟甘草半之水煎服有人心疼諸藥不效服此愈丹青岩劉山長子年三十六歲得心疼十八年矣因酒飲牛乳病發時飲食無礙得病八年後盛暑及沐浴飲食時皆無汗中間更醫不一悉以丁附諸丹等熱藥治之至是黃瘦食減若不勝衣痛作時須以一物拄之診其脈皆三至弦弱而澀未風先寒大便或閉或泄最苦是胸膈吞酸七月內遂以二陳湯加白朮黃連黃芩桃仁郁李仁澤瀉每旦用此藥飲而出之所吐皆苦黑水雜以如浸木耳片者此日卻再與兩帖飲而不出如此兩月近二百餘帖澀脈漸退至數漸添忽一日診其脈純弦漸有充滿之狀時正立冬後頗暄暖意其必欲作汗又意其血氣未充汗難以發以人參黃耆芍藥當歸陳皮半夏甘草調理二日此時痛雖緩每晝夜一二作至第三日與麻黃蒼朮當歸川芎甘草等藥才下咽目上視口噤面無神色豫呼之不應見其四肢不收急以左手抱其頭就坐於床以右手拇指捻其人中須臾而愈通體汗如雨自此痛不復作但人倦食未增耳續又大為咽酸所苦每一晝夜六七作其作時有一酸塊自胸膈間直衝上咽喉情狀極惡遂悉罷諸藥以黃連濃煎取冷俟酸塊欲上時以冷黃連汁數滴與之即回如此六七次半日許其塊亦除於是罷藥淡粥調養又近三個月時以立春節旬余中脘處微有脹急面帶青色氣息喘促時天氣尚寒意謂脾土因久病衰弱木氣行令此肝凌脾急以索矩三和湯與之至四日而安一婦人年四十餘歲因二十年憂患後心痛或可按或不可按食甚減口渴而不能飲水形瘦骨立心痛止則頭痛作其痛無常處頭痛止則心痛作夜間全不寐大便七八日一行堅小而黑而出亦難纍與四物加陳皮生甘草前後約百餘帖病雖不增卻無退減豫曰此肺久為火所郁氣不得行由是血亦蓄塞遂成汙濁氣壅則頭痛血濁不行則心痛通一病也治肺當自愈遂仿東垣方清空膏例片芩細切酒炒透令赤色為細末以熱白朮湯調下頭上稍汗如此十餘帖漸漸汗至通身及膝而止諸病皆愈因其膝下無汗形瘦病久小便數大便澀兩手皆見澀脈當議補血以防後患問其又思水而不飲遂與四物加陳皮生甘草桃仁酒芩以補之遂安裡實心痛並見按之滿痛為實條丹溪云心痛脈堅實不大便者下之羅化蟲丸鶴蝨檳榔胡粉炒苦楝根去厚皮各五十兩白礬飛十二兩上為末麵糊為丸桐子大小兒疾病多有諸蟲或因臟腑虛弱而動或因食甘肥而動動即腹中疼痛往來上下攻心痛則哭不休閣眼仰身撲手心神悶亂嘔噦涎沫或吐清水四肢羸困面青色黃飲食雖進不生肌肉或寒或熱沉沉默默不的知病處一歲兒服五丸溫漿下入香油一兩點打勻下之米飲亦得其蟲自下保妙香丸治男子婦人心痛強中搐熱如癇狀方見燥門風癇者羌活湯引下妙香丸羌活湯方見諸風條血癇者當歸湯引下妙香丸當歸湯方見諸血條丹蟲痛者面上白斑唇紅能食治用楝根錫灰之類脈堅實不大便者下之羅補金散治諸般蟲鶴蝨生雷丸定粉錫灰以上各等分上為末每服三錢空心少油調下又用豬肉一兩燒熟摻藥在上細嚼亦得用翎毛掃甘遂末一錢與前藥一處服之其蟲自下本治寸白蟲方黑鉛灰炒四錢一服先吃豬肉脯少許一時來卻用砂糖濃水半盞調灰五更服蟲盡下白粥將息一日良又療寸白蟲用錫灰蕪荑檳榔者極佳豫宣和中每覺心中多嘈雜意欲作飲又疑蟲漫依此方所説翌日下長蟲二條一長二尺五寸頭褊闊尾尖鋭每寸作一節斑如錦紋一條皆寸斷矣千金謂勞則生熱熱則生蟲心蟲曰蛔脾蟲曰寸白腎蟲如方截絲縷肝蟲如爛杏肺蟲如蠶皆能殺人惟肺蟲為急肺蟲居肺葉內蝕人肺系故成瘵疾咯血聲嘶藥所不到治之為難道藏中載諸蟲頭皆向下行唯自初一至初五以前頭上行故服藥多取月朏以前蓋為此也取寸白蟲方畫粉密陀僧各等分上為末每服二錢用麻油調服空心下頃刻成涎取下取寸白蟲錫灰一兩木鱉蘆薈二十文黃丹十文輕粉十文上為末豬膏油丸如桐子大先齋一日晚莫吃飯次早五更溫水調下分作二服制蟲制勞悅肌膚去勞熱檳榔一兩半龍膽草一兩乾漆半兩上為細末煉蜜丸如桐子大每服十丸至十五丸熟水吞下張仲文治寸白蟲熬胡粉令燥平旦作肉臛以藥方寸匕入臛中服之效丹治諸蟲楝皮細末米飲調下二錢匕斗門方千主脾胃有蟲食即痛面黃無色疼痛無時以石州蕪荑仁二兩和麵炒令黃色為末非時米飲調二錢匕瘥經治蛔蟲吐水心痛鶴蝨三兩為末蜜丸平旦漿水服二十丸愈千金方為末空心溫醋湯下蟲當出經胸宿食冷多寸白蟲每朝空心熱酒調山豆根末三錢服之其蟲自出簡治諸蟲在臟腑久不瘥檳榔半兩炮搗為末每服一錢至二錢蔥蜜煎湯空心調下外療蛔蟲心痛噁心吐水乾漆熬搗蜜丸服十五丸日再服範汪治寸白蟲方狼牙五兩搗末蜜丸麻子大隔宿不夜食明旦以漿水下一合服盡愈大治寸白蟲以酸石榴東引根一握淨洗細銼用水三升煎取半碗以下去渣五更初溫服盡至明日取下蟲一大團永絶根本一日吃粥補之本金櫻東行根治寸白蟲銼二兩入大米三十粒水二升煎五合空心服須臾瀉下千治寸白蟲茱萸根洗去土四兩切以水酒各一升漬一宿平旦分再服凡茱萸皆用細根東北陰者良若梢大如指以上者皆不任用食治蛔蟲心痛面青口中沫出取臨水萹蓄葉一斤細切以水三斗煮如餳去渣空心服一升蟲即下至重者再服仍通宿不食來日平明服之效本取寸白蟲苦絲瓜不以多少研為末每服二錢好酒二盞空心調服竹木香三稜散治腹中有蟲面色痿黃一切積滯黑牽牛半生半炒大腹子多檳榔雷丸錫灰醋炒三稜煨蓬朮煨木香大黃以上各一兩上為細末每服三錢空心用蜜水調下或砂糖水亦可須先將燒肉一片口中半嚼之休咽下吐出口中肉汁後服藥上方有攻性而下蟲者本崔元亮海上方治一切心痛無問新久以生地黃一味隨人所食多少搗取汁搜面作餺飥或冷淘食良久當利出蟲長一尺許頭似筆管後不復患至元十年通事舍人崔抗女患心痛垂氣絶遂作地黃冷淘食之便吐一物可方一寸如蝦蟆狀無目足等微似有口蓋為此物所苦自此頓愈面中忌用鹽丹治蛔蟲吐清水氣口刺痛取生艾汁隔宿勿食以肥香脯方寸片先吃令蟲聞香次即飲一升必下蛔蟲胸喉中覺有蟲上下偏喜聞蔥豉油食之香者兩三日不食開口而臥將油煎蔥豉令香放口邊蟲當自出引而去之但隨所喜物用之亦可世治心痛豨蘞草搗汁醋和服之效有人服此吐蟲二條終身不發子和酒官楊仲仁病心氣痛此人常好飲酒初飲二三杯必奔走三五十次其酒稍散方能復席飲至前量醉後至明旦嘔清黃水數口夜變魚腥臭六七日始安戴人曰宜吐乃吐蟲一條青黃色長六七寸口目鼻俱全二目膜瞞狀如蛇類楊醃干示人仲蛔蟲為病令人吐涎心痛發作有時毒藥不止甘草粉蜜湯主之甘草二兩粉一兩蜜四兩上三味以水三升先煮甘草取二升去渣納粉蜜攪令和煎如薄粥溫服一升瘥即止孫向大王宮中有一宮人七太尉所寵也忽患一疾凡噁心則吐蟲數條後乃頻作七太尉甚愍之纍治不瘥每用殺蟲藥則吐蟲愈多召孫診之孫曰六脈皆細非蟲脈也今雖吐蟲乃臟寒而蟲不安失居上膈因而吐出復用殺蟲藥蟲為藥所苦不能自安所以吐蟲愈多也孫遂用藥不三五服皆一色丸子蟲遂不吐明日再召孫至六脈漸大進前藥其病不作後求方乃硫黃附子各一兩並末粳米糊為丸每三十丸米飲下仲烏梅丸治蛔方見傷寒厥陰病河正氣天香散治心痛但忍氣則發者方見虛實法丹心痛脈澀者有死血又云作時飲湯水下作吃者有死血桃仁承氣湯下之方見傷寒凡治證必要先問起居何如假如心痛有因平日喜食熱物以致死血留於胃口作痛用桃仁承氣湯下之切記輕者用韭汁桔梗能開提其氣血藥中兼用之經失笑散治婦人心痛氣刺不可忍五靈脂淨好者蒲黃等分為末每二錢用黃醋一杓熬成膏再入水一盞煎至七分熱服效世手拈散治心脾疼極驗詩云草果玄胡索靈脂並沒藥酒調三二錢一似手拈卻又治心痛劉寄奴末六錢玄胡索末四錢薑汁熱酒調服妙簡治九種心痛腹脅積聚滯氣筒子乾漆二兩搗碎炒出煙細研醋煮麵糊和丸如桐子大每服五丸至七丸熱酒下醋湯亦得服無時外治心痛當歸為末酒調服方寸匕丹治心痛亦能治哮喘半夏研碎香油炒薑汁炊餅為丸薑湯下二十丸五味鹹耎堅條海蛤丸寒條栝蔞半夏薤白湯表條桂麻石鹼丸皆治痰飲心痛之妙劑也世治心痛纍效陳年白螄螺殼洗淨為末熱酒調下一錢半即愈丹一味牡蠣粉酒調下二錢氣實者可用治痰飲心痛海蛤丸海蛤燒為灰研極細過數日火毒散用之栝蔞仁蒂穰同研上以海蛤入栝蔞內乾溼得所為丸每服五十丸又方治脾疼海蛤粉佐香附末用川芎山梔生薑汁煎辣湯調服為佳鬥治血氣攻心痛不可忍以蓼根銼酒浸服之瘥世心痛枯礬辰砂少許每半錢人參湯調下一方用白礬辰砂糊丸好醋吞下神效又方辰砂一味研好酷調服效又方用白礬為細末每服一錢茶調下外黃連湯肘後龍膽湯並見卒心痛熱條仲粉蜜丸脾受肝制而急故蟲不安用粉蜜之甘緩以安之方見蟲條素少陽所謂心脅痛者言少陽盛也盛者心之所表也九月陽氣盡而陰氣盛故心脅痛也所謂不可反側者陰氣藏物也物藏則不動故不可反側也脈解篇瑞蠶砂散治男子婦人心氣痛不可忍者晚蠶砂不拘多少為細末用滾湯泡過濾淨取清水服之立止又方黃荊子炒焦為末米飲調下亦治白帶治心痛用洗淨玉簪花根搗濃汁雜和好酒一半熱服千治心腹俱痛以布裹椒薄注腹上火尉令椒汗出良運氣心痛凡熱風濕寒燥五氣之初皆能幹心而痛蓋心為五臟之主故也一曰熱邪干心經云少陰司天熱淫所勝病心痛肺䐜又云少陰之復暴喑心痛又少陽之勝熱客於胃煩心心痛又云陽明司天燥氣下臨暴熱至甚則心痛此在泉之熱為痛治皆以寒劑是也二曰寒邪干心經云太陽司天寒氣下臨甚則心痛又云陽明司天之政四之氣寒雨降病心痛又云歲水太過民病上下中寒煩心躁悸心痛又云歲金不及炎火乃行復則寒雨暴至心痛又云水鬱之發民病寒客心痛又云太陽司天寒淫所勝病厥心痛又云太陽之復心胃生寒心痛痞滿又云少陽在泉主勝則熱反上行而客於心心痛蓋終之氣寒勝其客也又云歲火不及寒乃大行病鬱冒矇昧心痛又云太陽之勝寒厥入胃則內生心痛皆治以熱劑是也三曰風邪干心傷胃經云少陽司天之政終之氣風乃至心痛又云少陽司天風行於地心痛胃脘痛鬲不通又云歲水不及濕乃大行復則暴風大發鬲中痛於心腹又云木鬱之發民病胃脘當心而痛鬲咽不通又云厥陰在泉風淫所勝心痛支滿又云厥陰司天風淫所勝胃脘當心而痛又云厥陰之復厥心痛又厥陰之勝胃脘當心而痛治皆以涼劑是也四曰濕邪干心經云土鬱之發心痛脅䐜又云太陰在泉濕淫所勝病飲積心痛又云太陰之勝火氣內郁心痛熱格治皆以熱劑是也五曰燥邪干心經云陽明之復善太息心痛痞滿治以溫劑是也六曰寒熱中於心經云少陰司天之政寒熱凌犯而爭於中寒厥入胃心痛三之氣大火行寒氣時至民病氣厥心痛治分寒熱多少調之是也厥心痛者他臟病干之而痛皆有治也真心痛者心臟自病而痛故夕發旦死旦發夕死無治也然心臟之經絡有病在標者其心亦痛而有治經云心手少陰之脈是動則病嗌乾心痛渴而欲飲又心主手少陰之脈所生病者心痛掌中熱皆視盛虛熱寒陷下取之又經云手心主之別名曰內關去腕二寸出於兩筋之間實則心痛取之兩筋間也又云邪在心則病心痛喜悲時眩僕視有餘不及調其俞是也靈厥心痛與背相控善瘈如從後觸其心傴僂者腎心痛也先取京骨崑崙髮針不已取然谷厥病篇下同心痛引背灸刺法有四其一取足太陽經刺節云取京骨崑崙者是其穴也蓋足太陽之正循膂當心入散絡故心痛引背取之也其二取足少陰經刺節云取京骨崑崙不已取然谷者是其穴也又經云腎足少陰經之脈所生病者煩心心痛視盛虛熱寒陷下取之也又經云心痛引腰脊欲嘔取足少陰者是也蓋足少陰脈貫脊絡心故亦治心痛引背也其三取足少陽經云心痛引背不得息刺足少陰不已取少陽者是也蓋手少陽之脈散絡心脈又三焦下俞曰委陽是足太陽絡足太陽循膂當心入散絡故亦治心痛引背也其四取督任脈經云背為心相控而痛所治天突與十椎及上紀上紀者胃脘也下紀者關元也又云心痛當九節刺之按已次按之立已不已上下求之得之立已者是也蓋十椎與九節者督脈也胃脘與天突者任脈也厥心痛腹脹胸滿心尤痛甚者胃心痛也取之大都太白心痛兼脹灸刺法有二其一取足太陰經云取大都太白者是其穴也又經云脾足太陰之脈是動則病胃脘痛腹脹所生病者煩心心下急痛者視盛虛熱寒陷下取之又云心痛腹脹嗇嗇然大便不利取足太陰者是也蓋足太陰脈從胃上膈注心中故心痛腹脹者取之也其二取足陽明經云胃病者腹脹胃脘當心而痛飲食不下取之三里者是也蓋胃脘當心痛者似心痛實非心痛也厥心痛如以錐針刺其心心痛甚者脾心痛也取之然谷太溪脾心痛而取然谷太溪者故孫真人張潔古謂之妄經也厥心痛色蒼蒼如死狀終日不得太息肝心痛也取之行間太衝心痛色蒼如死狀者取肝其兼小腸滿便溲難者亦取肝經云心痛引少腹滿上下無常處便溲難刺足厥陰是也厥心痛臥若徒居心痛間動作痛益甚色不變肺心痛也取之魚際太淵徒居謂間居間謂痛緩心痛臥與間居則痛緩動作則益甚者取肺其兼短氣者亦取肺經云心痛但短氣不足以息刺手太陰者是也心痛不可刺者中有盛聚不可取於腧腸中有蟲瘕及蛟蛔皆不可取以小針心腸痛憹作痛腫聚往來上下行痛有休止腹熱喜渴涎出者是蛟蛔也以手聚按而堅持之無令得移以大針刺之久持之蟲不動乃出針也集九種心痛間使靈道公孫太衝三里陰陵泉桑心氣痛巨缺鳩尾各取一寸興隆瀉之撮脾脊後心疼痛中渚瀉之忌補灸心痛背上穴心俞鬲俞潔心痛脈弦肝原穴脈沉腎原穴脈澀肺原穴脈浮心原穴脈緩脾原穴摘冷心痛巨缺燔針刺之如五臟氣相干而脅痛疝痛痃癖皆能痛至心宜審之玉心脾疼上脘二寸半瀉中脘二寸半補多瀉少甲心痛不可按煩心巨缺主之心痛有蟲多涎不得反側上管主之心痛上搶心不欲食支痛引鬲建里主之撮心胸痛並氣攻勞宮大陵各三分瀉之內關甲心痛善悲厥逆懸心如飢之狀心恆而驚大陵及間使主之心寒痛難以俯仰心疝氣衝胃死不知人中脘主之心痛衄噦嘔血驚恐畏人神氣不足郤門主之難陰維為病苦心痛內關穴通陰維甲脾逆氣寒厥急煩心善唾噦噫胸滿噭呼胃氣上逆心痛太淵主之針云肺脹胃逆心膨痛尺澤主之千金云心煩悶亂少氣不足以息心痛卒咳逆尺澤主之出血立已胸痹心痛肩內麻木天井主之胸脅背相引而痛嘔吐不食幽門主之胸痹心痛不得息痛無常處臨泣主之千金云不得反側丹心痛雖日數多不吃飯不死若痛止便吃物還痛必須三五服藥方可吃物心痛左手脈數熱多脈澀有死血右手脈實是痰積脈大必是久病兩手脈堅實不大便者下之痛甚者脈必伏多用溫藥附子之類不可用參朮心脈微急為心痛引背食不下全文見治虛實法仲問曰病腹痛有蟲其脈何以別之師曰腹中痛其脈當沉若弦反洪大故有蛔蟲脾脈微滑為蠱毒蝮蠍腹熱全文見治虛實法脈關上脈緊而滑者蛔毒脈沉而滑者寸白肘後粗以下三四寸熱者腸中有蟲全文見診真心痛手足青至節心痛甚旦發夕死夕發旦死卒心痛竹治急心疼方斑蝥七個頭翅全者胡椒四十九粒上將二味同炒令斑蝥焦碎吹去斑蝥不用卻將淨胡椒研為細末只作一服熱酒調下不拘時候治暴心痛不可忍者荔枝核丹溪云荔枝核屬金性燥熱上為末每服一錢水醋各半盞煎七分稍熱服外治卒心痛黃連八兩一味㕮咀水七升煮五升絞去渣溫飲五合日進三服肘卒心痛龍膽草四兩酒三升煮一升半頓服仲走馬湯治中惡心痛腹脹大便不通巴豆二枚去皮心炒杏仁二枚上二味以綿纏槌令碎熱湯二合捻取白汁飲之當下老少量服通治飛尸鬼擊等病竹海上方急救男子婦人心疼牙關緊欲死者用隔年陳蔥白三五根去皮須葉擂為膏將病人口斡開用匙將膏送入咽喉用香油四兩灌送下油不以多少但得蔥下喉其人必蘇少時將腹中所停蟲病等物化為黃水微得利為佳除根永不再發纍效一方用真香油頓服一盞亦妙肘治卒心痛白艾成熟者一升水二升煮取一升去渣頓服若為客氣中者當吐蟲丹溪云艾屬火而有水服多者有毒發治卒心痛東引桃枝一握切碎以酒一升煎去半升頓服大效經云邪客於足少陰之絡令人卒心痛暴脹胸脅支滿無積者刺然骨之前出血如食頃而已不已左取右右取左病新發者五日已摘卒心痛不可忍上脘八分先補後瀉覺針下氣行如滾雞子入腹為度次取後穴氣海湧泉無積者刺之如食頃而已有積者先飲藥利之刺之立已如不已再刺後穴間使支溝三里丹針灸經治卒心痛不可忍吐冷酸水及原臟氣少灸足大指次指內約文中各一壯如小麥大下火立瘥甲卒心痛瘛瘲互相引肘內廉痛心敖敖然間使主之卒心痛汗出大敦主之出血立已心腹中卒痛而汗出石門主之胎前心痛大治妊娠卒心痛氣欲絶川芎當歸茯苓厚朴各等分上水六升煎二升分二服白朮散治妊娠卒心痛欲死不可忍者白朮赤芍藥各二兩黃芩一兩半上水六升煮取二升半分三服半日令盡微下水令易産忌桃李雀肉産後心痛羅火龍散治産後心痛艾葉鹽炒一半茴香炒川楝子炒各一兩上為末水煎服大治婦人血崩心痛甚者名曰殺血心痛小産下血過多而心痛者亦然用烏賊魚墨炒為末醋湯調下此魚腹多有墨汁見人過必吐其墨以蔽身失笑散治心腹痛百藥不效服之即愈方見心痛汙血條救治産後血不盡心腹痛荷葉熬令香為末水煎下方寸匕大大岩蜜湯治産後血寒心痛熟地當歸獨活吳茱萸芍藥乾薑甘草桂心小草各一兩細辛半兩上為散每服半兩水三盞煎至一盞去渣稍熱服聖治産後惡血衝心痛氣悶欲絶用桂心三兩搗羅為散狗膽汁和丸如櫻桃大不拘時候熱酒磨下二丸諸般氣痛丹氣痛一身腔子裡氣痛少用木香於藥內行得開河正氣天香散治婦人一切諸氣或上湊心胸或攻築脅肋腹中結塊發渴刺痛月水不調或眩暈嘔吐往來寒熱減食方見治虛實氣血條丹調氣方香附四兩人參一兩烏藥三兩砂仁一兩甘草炙二兩上為細末熟湯調服本治脾積氣婦人諸般氣痛香附五兩炒蓬朮醋煮甘草各二兩上各淨研為細末每服二錢入鹽少許百沸湯空心熱服治一切氣疾丈夫婦人撞心冷氣並皆治之香附一斤炒去毛陳皮四兩去白甘草一兩生上為細末每服二錢空心鹽湯點服丹寬中丸枳殼為末酒糊丸婦人患氣痛喜食熱物二陳湯加木通薑五片煎下保和丸女子患氣痛要揉者曾服烏沉湯有效又再發陳皮六錢半半夏青皮半兩芍藥二錢木通川芎茱萸一錢甘草五分上分五帖薑三片煎服明五院君出外怒歸膈痞痛不思食脈沉弦稍數此氣抑不通也半夏三錢青皮枳殼各二錢黃芩芍藥各錢半木通甘草各一錢上薑三片煎取半盞下保和丸三十粒三七嫂怒後氣痛脈沉不思食青皮一錢柴胡半錢甘草炙二分半夏一錢黃芩五分木通三錢陳皮五分上薑三片煎服感村婦人五十七歲氣痛不可按漸漸痛至足青皮芍藥各三錢川芎陳皮各三錢黃柏炒木通各一錢甘草些炙上分三帖煎熱飲本治婦人室女血氣刺痛不可忍日夜叫喚可憐者一服效蕓薹子肉桂板桂也良薑沒藥各等分上焙乾為末每服三錢乳香湯調下熱服不拘時候孟詵心腹中結伏氣杏仁陳皮桂心訶黎勒皮為丸空心服三十丸本和氣散治男婦一切氣疾他藥不瘳者甘草炙半兩白芨一兩地骨皮山蜈蚣藿香半兩白芷一兩木香紅內消山慈菰各半兩上焙乾為末每服二大錢空心鹽湯點服余鄉村有一老醫數世習醫凡婦人氣疾惟憑此藥百發百中胸痛胸滿經云南風生於夏病在心俞在胸脅又云仲夏善病胸脅此則胸脅痛屬心故入心部肝虛則胸痛引背脅肝實則胸痛不轉側喜太息肝著則常欲蹈壓其胸經云春脈如弦其氣不實而微此謂不及令人胸痛引背下則兩脅脹滿此肝虛而其脈症見於春如此也仲肝中寒者兩臂不舉舌本燥喜太息胸中痛不得轉側食則吐而出汗也肝著其人常欲踏其胸上先未苦時但欲飲熱旋覆花湯主之方未考金匱婦人門有旋覆花湯方或云是此素陽明所謂胸痛短氣者水氣在臟腑也水者陰氣也陰氣在中故胸痛少氣也仲胸痹之病喘息咳唾胸背痛短氣寸口脈沉而遲關上小緊數者宜以栝蔞薤白白酒湯主之栝蔞實一個搗薤白半升白酒七升上三味同煮取二升分溫再服栝蔞薤白半夏湯治胸痹不得臥心痛徹背方見心痛門胸痹心中痞留氣結在胸胸滿脅下逆搶心枳實薤白桂枝湯主之人參湯亦主之枳實薤白桂枝湯枳實四枚厚朴四兩薤白半升桂枝一兩栝蔞實一個搗上五味以水五升先煮厚朴枳實取二升去渣納諸藥煮數沸分溫作三服人參湯白朮人參甘草乾薑各二兩上四味以水八升煮取三升溫服一升日三服孫主簿季述之母患胸中痞急不得喘息按之則痛脈數且澀曰胸痹也因與仲景三物小陷胸湯一劑知二劑愈方見傷寒仲支飲胸滿者枳朴大黃湯主之厚朴一兩大黃六兩枳實四枚上三味水五升煮取二升分溫再服脈寸口脈沉胸中引脅痛胸中有水氣宜澤漆湯及刺巨闕瀉之澤漆湯仲景方也見咳門杜壬治胸脅痛徹背心腹痞滿氣不得通及治痰咳大栝蔞去穰取子熟炒連皮研和麵糊為丸如桐子大米飲下五十丸鬥治胸腹壅滯去痰開胃用半夏洗淨焙乾搗羅為末生薑自然汁和為餅子用濕紙裹於慢火中煨令香熟水一盞用餅子一塊如彈丸大入鹽半錢煎取一盞溫服能去胸膈壅逆大壓痰毒及治酒食所傷其功效大矣丹鄭仲遊年二十有三鬲有一點相引痛吸氣皮覺急滑石一兩桃仁半兩枳殼一兩炒黃連半兩炒甘草炙二錢上為細末每錢半以蘿蔔根自然汁研煎熟飲之一日五六次仲本年二十七因吃熱補藥又妄自學吐納以致氣亂血熱嗽血消瘦遂與行倒倉法今嗽血消瘦已除因吃炒豆米膈間有一點氣梗痛似有一條絲垂映在腰與小腹亦痛大率偏在左邊此肝部有惡血行未盡也滑石一兩黃丹三錢炒枳殼一兩炒黃連五錢生甘草二錢紅花一錢柴胡五錢桃仁二兩上為細末每服一錢半以蘿蔔自然汁煎沸服之垣上清散清利頭目寬快胸中不利者悉利於表黃耆三錢甘草二錢人參三錢葛根一錢半防風根一錢蔓荊子半錢上㕮咀分作二服每服水一盞半煎至一盞去渣臨臥溫服以夾衣蓋覆面首不語須臾汗出為效未服藥預一日不語如服藥畢亦一日不語運氣胸痛有二其一火邪助心經云歲火太過甚則胸中痛脅支滿脅痛膺背肩胛兩臂內痛是也其二金邪傷肝經云歲金太過民病胸痛引背兩脅滿且痛引少腹又云歲土不及風乃大行民病體重腹痛金復則胸脅暴痛引少腹者是也內經灸刺胸痛有四其一取心經云心痛者胸中痛脅支滿脅下痛膺臂肩胛間痛兩肩臂內痛實則胸腹大脅下腰子相引而痛取其經少陰太陽舌下血者其變病刺郤中血者是也其二取腎經云腎虛則胸中痛大腹小腹痛取其經少陰太陽血者按刺法不分補瀉但言取血王注謂先去血脈後調虛實也其三取膽經云膽足少陽脈所生病者胸脅肋髁膝外皆痛詳盛虛熱寒陷下取之也其四取筋經云手心主之筋其病當取過者又轉筋前及胸痛息賁治在燔針劫刺以知為數以痛為輸又足太陽之筋足少陽之筋痛皆引胸痛治在燔針劫刺以知為數以痛為輸也灸刺胸滿有三法其一取氣海經云膻中者氣之海其輸上在手柱骨之上下前在於人迎氣海有餘者氣滿胸中悗息面赤審守其輸而調其虛實無犯其害是也手柱骨滑伯仁謂肩胛上際會處是穴也其二取肝經云肝足厥陰脈所生病者胸滿嘔逆飧泄狐疝遺溺閉癃詳盛虛熱寒陷下取之也其三取胃經云厥逆腹滿面腫唇漯漯然暴言難甚則不能言取足陽明是也集胸脅痛不堪期門四分章門六分灸七壯至七七壯行間丘墟湧泉東又法期門沿皮二寸支溝膽俞沿皮一寸五分甲胸滿痛璇璣主之胸脅搘滿痛引胸中華蓋主之胸脅搘滿痹痛骨疼飲食不下嘔逆上氣煩心紫宮主之胸中滿不得息脅痛骨疼喘逆上氣嘔吐煩心玉堂主之胸脅背相引痛心下胸中嘔吐多睡飲食不下幽門主之胸脅搘滿痛引膺不得息悶亂煩滿不得飲食靈墟主之胸脅搘滿劫引背痛臥不得轉側胸鄉主之大氣不得息息即胸脅中痛實則其身盡寒虛則百節盡縱大包主之胸滿善太息胸中膨膨然丘墟主之千金云胸背急胸中痛天容主之胸脅搘滿勞宮主之胸痹引背時寒間使主之胸滿不得息頸頷腫陽谷主之千金雲陽溪胸脅搘滿膈塞飲食不下嘔吐食後還出中庭主之胸脅搘滿瘛瘲引臍腹痛短氣煩滿巨闕主之胸脅搘滿不得息咳逆乳癰灑淅惡寒神封主之胸脅搘滿膈逆不通呼吸少氣喘息不得舉臂步廊主之胸脅搘滿惡聞人聲與木音巨虛上廉主之胸下滿痛膺腫乳根主之胸脅搘滿喘逆上氣呼吸喘息不知食味氣戶主之胸脅脹腸鳴切痛太白主之撮胸滿血膨期門一分沿皮向外一寸五分瀉甲傷食脅下滿不能展轉反側目青而嘔期門主之暴脹胸脅搘滿足寒大便難面唇白時時嘔血太衝主之胸中暴滿不得眠輒筋主之胸脅搘滿寒如風吹狀俠溪主之胸脅搘滿頭痛項內寒熱外丘主之多臥善唾胸滿腸鳴三間主之仲脈當取太過不及陽微陰弦即胸痹而痛所以然者極虛也今陽虛知在上焦所以胸痹心痛者以其陰弦故也白色粗理者肺大肺大則多飲善病胸痹全文見診下同脅偏疏者肺偏傾肺偏傾則胸偏痛胸痹短氣緩急仲胸痹胸中氣塞短氣茯苓杏仁甘草湯主之橘枳薑湯主之茯苓杏仁甘草湯茯苓二兩杏仁五十個甘草一兩上三味以水一斗煮取五升溫服一升日三服橘枳薑湯陳皮一斤枳實三兩生薑半斤上三味以水五升煮取二升分溫再服千治胸痹氣滿壅心膈不利枳實二兩麩炒微黃為末非時以清粥飲調下二錢聖惠方同仲胸痹緩急者薏苡仁附子散主之薏苡仁十五兩大附子十個炮上二味杵為散服方寸匕日三服煩躁垣煩躁發熱論黃帝針經五亂篇云氣亂於心則煩心密默俯首靜伏云云氣在於心者取少陰心主之俞又云咳喘煩冤者是腎氣之逆也又云煩冤者取足少陰又云煩冤者取足太陰仲景分之為二煩也躁也蓋火入於肺則煩入於腎則躁俱在於腎者以道路通於肺母也大抵煩躁者皆心火為病心者君火也火旺則金爍水虧惟火獨存故肺腎合而為煩躁又脾經絡於心中心經起於脾中二經相搏濕熱生煩夫煩者擾擾心亂兀兀欲吐怔忡不安躁者無時而熱冷汗自出少時則止經云陰躁者是也仲景以梔子色赤而味苦入心而治煩鹽豉色黑而味鹹入腎而治躁名梔子豉湯乃神藥也若有宿食而煩者梔子大黃湯主之運氣煩躁有二一曰熱助心火煩躁經云少陰之復燠熱內作煩躁鼽嚏又云少陽之復心熱煩躁便數憎風是也二曰寒攻心虛煩躁經云歲水太過寒氣流行邪害心火病身熱煩心躁悸陰厥是也成煩為擾而煩躁為憤躁之躁合而言之煩躁為熱也析而言之煩陽也躁陰也煩為熱之輕者躁為熱之甚者無內熱曰煩外熱曰躁謹按先賢治煩躁俱作有屬熱者有屬寒者治獨煩不躁者多屬熱惟悸而煩者為虛寒治獨躁不煩者多屬寒惟火邪者為熱蓋煩者心中煩胸中煩為內熱也躁者身體手足躁擾或裸體不欲近衣或欲在井中為外熱也內熱者有本之熱故多屬熱外熱者多是無根之火故屬寒也內外俱虛身體冷而汗出微嘔而煩擾手足厥逆體不得安靜者死熱病七八日其脈微細小便不利加暴口躁脈代舌焦乾黑者死虛煩活人云虛煩似傷寒非傷寒也成無己云傷寒有虛煩有心中煩有胸中煩二説不同考之於書成無己之言實出仲景活人無據然往往有非因傷寒而虛煩者今故兩存之立虛煩一門於此心部立傷寒煩一門於傷寒部無虛煩身不覺熱頭目昏疼口乾咽燥不渴清清不寐皆虛煩也保起臥不安睡不穩謂之煩宜梔豉湯竹葉石膏湯二方並見傷寒活但獨熱者虛煩也諸虛煩熱與傷寒相似但不惡寒身不疼痛故知非傷寒也不可發汗頭不痛脈不緊數故知非裡實也不可下病此者內外皆不可攻攻之必遂煩渴當與竹葉湯若嘔者與陳皮湯一劑不愈再與之孫真人云此法數用有效陳皮湯陳皮一兩半甘草炙五錢人參一分竹茹五錢上銼如麻豆大每服五錢水一盞半薑三片棗一枚煎至七分去渣食前服無淡竹茹湯治心虛悶頭疼短氣內熱不解心中悶亂及婦人産後心虛驚悸煩悶欲絶麥門冬去心小麥各二兩半甘草炙一兩人參白茯苓各一兩半半夏湯洗二兩上銼散每服四錢水二盞薑七片棗三枚淡竹茹一塊如指大煎至七分去渣食前服垣硃砂安神丸治心亂煩熱怔忡心神顛倒兀兀欲吐胸中氣亂而熱有似懊憹之狀皆膈上血中伏熱蒸蒸不安宜用權法以鎮陰火之浮行以養上焦之元氣用甘草之甘溫補之當歸生地又為長生陰血之聖藥黃連去心煩除濕熱硃砂納浮遊之火而安神明硃砂一錢研水飛黃連淨酒炒一錢半甘草炙五分生地當歸頭各一錢上為極細末蒸餅為丸如黃米大每服十丸津下仲下痢後更煩按之心下濡者為虛煩也梔子豉湯主之方見傷寒部煩門素帝曰有病身熱汗出煩滿煩滿不為汗解此為何病岐伯曰汗出而身熱者風也汗出而煩滿不解者厥也病名曰風厥帝曰願卒聞之岐伯曰巨陽主氣故先受邪少陰與其為表裡得熱則上從之從之則厥也帝曰治之奈何岐伯曰表裡刺之飲之服湯評熱論刺謂針足太陽少陰也飲之服湯謂仲景止逆下氣麥門冬湯之類也丹一女子年二十餘歲在室素強健六月間發煩悶困憊不食發時欲入井六脈皆沉細而弱數兩日後微渴衆以為病暑治不效四五日加嘔而人瘦手心極熱喜在陰處漸成伏脈時妄語豫急制局方妙香丸如桐子大以井水下一丸半日許大便藥已出病無退減遂以麝香水洗藥以針穿三竅次日以涼水送下半日許大便下稠痰數升是夜得睡困頓伏枕旬日而愈因記金匱云昔肥而今瘦者痰也遂作此藥治之妙香丸丹溪云疏決腸胃制伏木火藥也辰砂飛研五兩牛黃龍腦膩粉麝香研各一兩金箔九十片巴豆三百十五粒去尖膜炒熟研上令研勻煉黃蠟六兩入好蜜三分同煉令勻為丸每兩作三十丸如要此藥速行針刺一眼子冷水浸少時服效更速小兒百病丸如緑豆大無溫膽湯治大病後虛煩不得眠方見不得眠門仲酸棗湯治虛勞虛煩不得眠方見不得眠門上九法治熱煩前五法煩熱怔忡知熱在心肺也故用竹葉石膏辰砂鎮墜其熱使下行也第六法煩而下利知熱在上也故用梔豉湯吐之第七法煩而汗出不解知表裡有邪也故用表裡飲湯第八法脈沉口渴手心熱知熱不在表也故用妙香丸下之第九法溫膽酸棗治不得眠也凡心虛則煩心肝腎脾虛亦煩心經云夏脈者心也其不及者令人煩心又云肝虛腎虛脾虛皆令人體重煩冤者是知煩多生於虛也運氣煩有五一曰熱助心實而煩經云少陰司天熱淫所勝病胸中煩熱嗌乾又云少陽司天火淫所勝病煩心胸中熱又云少陽之勝煩心心痛治以鹹寒是也二曰心從制而煩經云太陽司天寒氣下臨心氣上從寒清時舉火氣高明心熱煩是也三曰金攻肝虛而煩經云歲金太過燥氣流行肝木受邪民病體重煩冤是也四曰土攻腎虛而煩經云歲土太過雨濕流行腎水受邪民病體重煩冤又云歲水不及濕乃大行民病煩冤足痿是也五曰木攻脾虛而煩經云歲木太過風氣流行脾土受邪民病體重煩冤蓋肝虛腎虛皆令人體重煩冤故金太過則肝虛土太過則腎虛木太過則脾虛凡此三太過之歲則肝腎脾受邪而虛皆病體重煩冤也灸刺煩心有四其一取心俞經云心主手厥陰心包絡之脈所生病者煩心心痛掌中熱詳盛虛熱寒陷下取之又云氣亂於心則煩心密默俯首靜伏取之手少陰心主之腧是也其二取腎膀胱俞經云腎足少陰之脈所生病者煩心心痛痿厥足下熱痛視盛虛熱寒陷下取之又云舌縱涎下煩悗取足少陰又云足少陰之別名曰大鐘當踝後繞跟別走太陽其病氣逆則煩悶取之所別也又汗出煩滿不解表裡取之巨陽少陰也其三取肺俞經云手太陰之脈所生病者煩心胸滿視盛虛熱寒陷下取之又云振寒灑灑鼓頷不得汗出腹脹煩冤取手太陰是也其四取脾俞經云脾足太陰之脈所生病者煩心心下急痛溏瘕泄水閉視盛虛熱寒陷下取之是也胎前虛煩大竹葉湯治妊娠苦煩悶名曰子煩防風黃芩麥冬去心各二兩白茯苓四兩上銼散每服四錢水二盞竹葉十數片煎七分去渣溫服之益母丸治子煩似虛不得臥者即知母丸但用棗肉為丸以人參湯嚼下方見日月數未足欲産門治子煩口乾不得臥用黃連去須為細末每服一錢粥飲調下産後虛煩大治産後余血不盡奔心煩悶生藕汁飲二升甚效竹瀝亦得治産後余血攻心或下血不止心悶面青冷氣欲絶羊血一盞頓服如不定更服立效産後血虛氣煩生地黃汁清酒各一盞相和煎一沸分二服服之治産後虛煩用蒲黃以東流水和服方寸匕極良治産後短氣欲絶心中煩悶竹葉湯竹葉切細麥門冬小麥各一升甘草一兩生薑二兩大棗十四個上切以水一斗煮竹葉小麥至八升去渣納余藥煮取三升去渣溫服虛悸加人參二兩少氣力加糯米五合云産後虛煩不得眠芍藥梔豉湯芍藥當歸梔子各五錢香豉半合上如梔子豉湯修服産後傷寒便同下後變證此方雖云岐法不若仲景酸棗湯穩當大竹葉湯方見虛條經治産後煩躁禹餘糧一枚狀如酸餡者入地埋一半四面緊築用炭一稱發頂火一斤煅去火三分耗二為度用濕沙土罨一宿方取出打去外面一重只使里內細研水淘澄五七度將紙襯干再研數千遍用甘草煎湯調二錢匕只一服立效仲三物黃芩湯婦人在草蓐自發露得風四肢苦煩熱頭痛者與小柴胡湯頭不痛但煩者此湯主之小柴胡湯方見傷寒黃芩一兩苦參二兩乾地黃四兩上三味以水八升煮取二升溫服一升多吐下蟲婦人産中虛煩亂嘔逆安中益氣竹皮大丸主之生竹茹二分石膏二分桂枝一分甘草七分白薇一分上五味末之棗肉和丸彈子大以飲服一丸日三夜二服有熱者倍白薇煩喘者加柏實一分躁諸躁狂越皆屬於火全文見診丹溪治一女子煩欲入井中口渴心熱脈伏者妙香丸下之愈此乃火之躁也陰盛發躁名曰陰躁欲坐井中宜以熱藥治之成無己云雖躁欲坐井中但欲水不得入口是也垣陰躁之極欲坐井中陽已先亡醫猶不悟復指為熱重以寒藥投之其死也何疑焉況寒涼之劑入腹周身之火得水則升走矣活霹靂散方見煩躁診躁法見煩躁懊憹懊憹虛煩之劇者治法並見虛煩門成無己云懊者懊惱之懊憹者鬱悶之貌即心中懊懊惱惱煩煩憹憹鬱郁然不舒暢憤然無奈比之煩悶而甚者懊憹也瞀悶瞀悶亦虛煩之甚者治法並與傷寒虛煩同蓋瞀者昏也悶者煩也凡瞀而不悶者名曰昏迷悶而不瞀者名曰虛煩今曰瞀悶者謂昏迷虛煩並病許學士所謂懊憹終夕不得臥心中無曉會處者是也運氣瞀悶者屬內熱經云火鬱之發民病瞀悶懊憹又云太陽司天之政三之氣寒氣行民病心熱瞀悶不治者死是也譫妄附中惡尸疰等症丹虛病痰病有似鬼祟論血氣者身之神也神既衰乏邪因而入理或有之若夫血氣兩虧痰客中焦妨礙升降不得運用以致十二官各失其職視聽言動皆有虛妄以邪治之其人必死籲哉冤乎誰執其咎憲幕之子傅兄年十七八時暑月因大勞而渴欲飲梅漿又連得大驚三四次妄言妄見病似鬼邪診其脈兩手皆虛弦而帶沉數豫曰數為有熱虛弦是大驚又梅漿之酸鬱於中脘補虛清熱導去痰滯病乃可安遂與人參白朮陳皮茯苓芩連等藥濃煎湯入竹瀝薑汁與旬日未效衆皆尤藥之不對豫脈之知其虛之未完與痰之未導也仍與前方入荊瀝又旬日而安外弟戚一日醉飽後亂言妄見詢之系伊亡兄附體言出前事甚的乃叔在邊叱之曰非邪乃食魚生與酒太過痰所為耳灌鹽湯一大碗吐痰一二升汗因大作歷一宵而安金氏婦壯年暑月赴筵歸乃姑詢其坐次失序遂赧然自愧因此成疾言語失倫其中多間一句曰奴奴不是脈大率皆數而弦豫曰此非邪乃病也但與補脾清熱導痰數日當自安其家不信邀數巫者噴水而咒之旬余而死或曰病非邪而以邪治之何遽至於死豫曰暑月赴宴外境蒸熱辛辣適口內境鬱熱而況舊有積痰加之愧悶其痰與熱何可勝言今乃驚以法尺是驚其神而血不寧也噴以法水是沉其體密其膚使汗不得泄汗不出則蒸熱內燔血不寧則陰消而陽不能獨立也不死何為或曰外臺祕要有禁咒一科庸可廢乎豫曰移精變氣乃小術耳可治小病若內有虛邪當用正大之法自有成式昭然可考然符水惟膈上熱痰一呷冷涼胃熱得之豈不暫快亦可取安若內傷而虛與冬令嚴寒符水下咽必冰胃而致害彼鬱熱在上熱邪在裡須以汗解卒得清冷膚腠固密熱何由解必致內攻陰陽離散血氣乖爭去死為近又何訝焉仲邪哭使魂魄不安者血氣少也血氣少者屬於心心氣虛者其人多畏合目欲眠夢遠行而精神離散魂魄妄行陰氣衰者為顛陽氣衰者為狂本治因驚言語顛錯不能服溫藥宜遠志丸硃砂半兩入麝少許同研金箔五片遠志南星人參白附子白茯苓酸棗仁各半兩上為細末煉蜜丸如桐子大硃砂為衣每服三十丸薄荷湯下食後臨臥服茯神散茯神乾地黃白芍藥川芎當歸桔梗白茯苓遠志以上各等分上為細末每服二錢水二盞燈心棗肉同煎至七分不拘時候貫明遠教授母七十四歲因戎為驚疾如上證服此二方得效運氣譫妄即傷寒家譫妄也其病有二一曰火邪助心經云歲火太過上臨少陰少陽病反譫妄狂越又云火太過曰赫曦其動炎灼妄擾又云少陰所至為譫妄又云少陰之復振栗譫妄又云少陽之勝心痛煩心善驚譫妄治以鹹寒是也二曰寒邪傷心經云歲水太過寒氣流行邪害心火病身熱煩心躁悸陰厥上下中寒譫妄上臨太陽渴而妄冒又云陽明司天之政四之氣寒雨降振栗譫妄治以甘熱是也無加減續命湯治中風或歌哭或笑語無所不至麻黃三兩人參桂枝白朮各二兩當歸防己黃芩甘草白芍藥芎藭杏仁各一兩上銼散每服四大錢水一盞半棗二枚煎七分去渣不以時服病者卒心腹脹滿吐利不行如干霍亂狀世所謂中惡是也由人精神不全心志多恐遂為邪鬼所擊或附著沉沉默默妄言譫語誹謗罵詈訐露人事不避譏嫌口中好言未然禍福及至其時毫髮未失人有起心已知其故登高陟險如履平地或悲泣呻吟不欲見人如醉如狂其狀萬端但隨方俗考驗治之羅八毒赤散治男子婦人染著神鬼謂之鬼疰病雄黃礬石硃砂牡丹皮附子炮藜蘆巴豆各一兩蜈蚣一條上八味為細末煉蜜為丸如小豆大每服十丸冷水送下無時本飛尸者發無由漸昏然而至其狀心腹刺痛氣息喘急脹滿遁尸者停遁在人肌肉血脈之間觸即發動亦令人心腹脹滿刺痛喘急攻脅衝心瘥後復發沉尸者發時亦心腹絞痛脹滿喘急雖歇之後猶沉痼在人腑臟令人無處不惡風尸者在人四肢循環經絡其狀冷躍去來沉沉默默不知痛處衝風則發伏尸者其病隱伏五臟積年不除未發身體都如無患發則心腹刺痛脹滿喘急又有諸尸注候者則是五尸內之尸注而挾外鬼邪之氣流注身體令人寒熱淋漓或腹痛脹滿喘急或磊塊踴起或攣引腰脊或舉身沉重精神雜錯恆覺昏謬每節氣改變輒致大惡積年纍月漸至頓滯以至於死死後復易傍人乃至滅門故為尸疰皆用忍冬藤葉銼數斛煮令濃取汁煎服日三瘥太乙神精丹蘇合香丸治此疾第一因喪驚憂悲哀煩惱感尸氣成諸證變動不已似冷似熱風氣觸則發用雄朱散雄黃硃砂桔梗羌活芍藥當歸炒升麻川烏龍腦川芎南星炮山梔陳皮木香莽草白朮枳殼檳榔黃芩各等分麻黃五分白殭蠶炒虎脛骨醋炙紫蘇子鬼箭羽炒等分蜈蚣二條酒炙上為細末每服二錢酒調下日三服頃在徽城日常修合神精丹一料庚申豫家一婦人夢中見二蒼頭一前一後手中持一物前者云到也未後應云到也擊下爆然有聲遂魘覺後心一點痛不可忍昏悶一時許豫忽憶神精丹有此一證取三粒令服之少頃已無病矣云服藥覺痛止神醒今如常矣日後相識稍有邪氣與一二服無不應驗方在千金中治中風之要藥但近世少得曾青磁石為難合爾無還魂湯治卒中惡奄忽氣絶口噤不開方見卒中暴厥門與仲景方同但加桂耳千五邪湯治邪氣啼哭或歌或笑禹餘糧防風桂心芍藥獨活甘草白朮人參石膏牡蠣秦艽各二兩防己菖蒲茯神雄黃蛇蛻皮各一兩上㕮咀每服五錢水三盞煎七分服之仲大棗湯治婦人悲傷欲哭象如神靈方見肺部悲門産後譫妄云奪命散治産後血暈入心經語言顛倒健忘失志沒藥血竭等分上研細為末産後用童便與細酒各半盞煎一二沸調下二錢良久再服其惡血自下行一婦人産後譫妄如有神靈諸藥不效用此服而愈又方治産後敗血衝心發熱狂言奔走脈虛大者乾荷葉生地黃牡丹皮等分上三味濃煎湯調蒲黃二錢匕一服即定郭氏論産後乍見鬼神者何答曰心主身之血脈因産耗傷血脈心氣虛則敗血得積上干於心心不受觸遂致心中煩躁臥起不安乍見鬼神言語顛倒醫人不識呼為風邪如此但服調經散每服加龍膽一捻得睡即安沒藥琥珀並細研桂心各一錢芍藥當歸各一分麝香細辛各三分上為末每服半錢生薑汁溫酒各少許調服大治方産一日見鬼言語顛倒用蘇合香丸一錢以童便調服即醒云治産後發熱狂言奔走脈虛大者四物湯加柴胡如不愈加甘草柴胡生地黃等分煎服亦可廣治産後血暈心悶不識神言鬼語氣急欲絶芍藥甘草丹參各一兩生地汁生薑汁各一升白蜜一合上水二升先煮三味取八合下地黃生薑汁蜜調分為二次服大治産後敗血及邪氣入心如見祟物顛狂用大辰砂一二錢研極細用乳汁三四茶匙許調仍握紫項活地龍一條入藥候地龍滾三滾取出地龍不用不令帶藥出但欲得地龍身上涎耳入無灰酒與前乳汁和合七八分盞重湯溫遇疾作分三二服柏子仁散治産後狂言亂語皆由內虛敗血挾邪攻心柏子仁遠志去心人參桑寄生防風琥珀另研當歸炒生地焙甘草等分上為粗末先用白羊心一個切片以水一大盞半先煮至九分去羊心入藥末五錢煎至六分去渣無時服循衣撮空海治婦人血風症因大脫血崩漏或前後失血因而枯燥其熱不除循衣撮空摸床閉目不省擲手揚視搖動不寧錯語失神脈弦浮而虛內燥熱之極也氣粗鼻乾不潤上下通燥此為難治宜生地黃黃連湯主之川芎生地黃當歸各七錢赤芍藥梔子黃芩黃連各三錢防風一兩上為粗末每服三錢水二盞煎至七分去渣取清飲無時徐徐與之若脈實者加大黃下之大承氣湯氣藥也自外而之內者用之生地黃黃連湯血藥也自內而之外者用之氣血合病循衣撮空證同自氣而之血血而復之氣大承氣湯下之自血而之氣氣而復之血地黃黃連湯主之二者俱不大便華病人循衣縫譫語者不可治病人陰陽俱絶掣衣撮空妄言者死喜笑不休喜笑皆屬心火經云心藏神神有餘則笑不休又云在藏為心在聲為笑在志為喜又云精氣並於心則喜又云火太過為赫曦赫曦之紀其病笑狂妄又云少陰所至為喜笑者是也河笑蕃茂鮮淑舒榮彰顯火之化也故喜為心火之志也喜極而笑者猶燔爍太甚而鳴笑之象也故病笑者心火之盛也子和路經古宅逢一婦病喜笑不止已半年矣衆人皆無術求治於戴人戴人曰此易治也以滄鹽成塊者二兩餘用火燒令通赤放冷研細以河水一大碗同煎至三五沸放溫分三次啜之以叉探於喉中吐出熱痰五升次服降火劑火主苦解毒是也不數日而笑定矣內經曰神有餘者笑不休也所謂神者心火是也火得風而焰故笑之象也五行之中惟火有笑常治一老男子笑不休口流涎黃連解毒湯加半夏竹葉竹瀝薑汁而笑止矣刺灸喜笑獨取心主一經經云心主手厥陰之脈是動則病面赤目黃喜笑不休詳盛虛熱寒陷下取之健忘丹健忘精神短少者多亦有痰者靈黃帝曰人之善忘者何氣使然岐伯曰上氣不足下氣有餘腸胃實而心氣虛虛則榮衛留於下久之不以時上故善忘也大惑論千孔子大聖枕中方龜甲即龜板自敗者龍骨遠志菖蒲上四味等分為末酒服方寸匕日三服常令人大聰明衍義云龜甲以其靈於物象用補心甚驗治多忘方菖蒲一分茯苓茯神人參各五分遠志七分上五味為末酒服方寸匕日三夜一五日效局定志丸治善忘安神定志方見驚門聖千金翼聖惠同補心虛治健忘令人耳目聰明用戊子日服開心不忘方菖蒲遠志各一分上搗為細末服方寸匕食後令人耳目聰明從外見里及千里外事令人長生去三百病毒不能為害肘治人心孔惛塞多忘喜誤丁酉日密自至市買遠志著巾角中為末服之勿令人知腎盛怒而不止則傷志志傷則喜忘其前言全文見診死生血並於下氣並於上亂而喜忘全文見刺虛實運氣喜忘皆屬心火虛經云火不及曰伏明伏明之紀其病昏或悲忘又云太陽司天寒氣下臨心氣上從善忘又云太陽之復甚則入心善忘善悲是也本草商陸花主人心惛塞多忘喜誤取花陰乾百日搗末日暮水服方寸匕臥思念所欲事即於眼中自覺集健忘列缺心俞神門中脘三里少海灸無𩩲骬者心高心高則滿於肺中悗而善忘難開以言全文見診諸痛門諸部分痛各入本門如痛風入痹門目痛入目門此特痛之大法耳素黃帝問曰豫聞善言天者必有驗於人善言古者必有合於今善言人者必有厭於己如此則道不惑而要數極所謂明也今豫問於夫子令言而可知視而可見捫而可得令驗於己而發蒙解惑可得而聞乎岐伯再拜稽首對曰何道之問也帝曰願聞人之五臟卒痛何氣使然岐伯對曰經脈流行不止環周不休寒氣入經而稽遲泣而不行客於脈外則血少客於脈中則氣不通故卒然而痛帝曰其痛卒然而止者或痛甚不休者或痛甚不可按者或按之而痛者或按之無益者或喘動應手者或心與背相引而痛者或脅肋與小腹相引而痛者或腹痛引陰股者或痛宿昔而成積者或卒然痛死不知人少間復生者或痛而嘔者或腹痛而後泄者或痛而閉不通者凡此諸痛各不同形別之奈何岐伯曰寒氣客於脈外則脈寒脈寒則縮綣縮綣則脈絀急絀急則外引小絡故卒然而痛得炅則痛立止因重中於寒則痛久矣炅古迥切熱也寒氣客於經脈之中與炅氣相搏則脈滿滿則痛而不可按也寒氣稽留炅氣從上則脈充大而血氣亂故痛甚不可按也寒氣客於腸胃之間膜原之下血不得散小絡急引故痛按之則血氣散故按之痛止寒氣客於俠脊之脈則深按之不能及故按之無益也寒氣客於衝脈衝脈起於關元隨腹直上寒氣客則脈不通脈不通則氣因之故喘動應手矣寒氣客於背俞之脈則血脈泣脈泣則血虛血虛則痛其俞注於心故相引而痛按之則熱氣至熱氣至則痛止矣治見心痛寒氣客於厥陰之脈厥陰之脈者絡陰器繫於肝寒氣客於脈中則血澀脈急故脅肋與小腹相引痛矣治見脅肋痛厥氣客於陰股寒氣上及小腹血泣在下相引故腹痛引陰股治見腹痛寒氣客於小腸膜原之間絡血之中血泣不得注於大經血氣稽留不得行故宿昔而成積矣治見積寒氣客於五臟厥逆上泄陰氣竭陽氣未入故卒然痛死不知人氣復反則生矣寒氣客於腸胃厥逆上出故痛而嘔也治見吐法寒氣客於小腸小腸不得成聚故後泄腹痛矣治見滯下熱氣留於小腸小腸中痛疸熱焦渴則堅幹不得出故痛而閉不通矣治見祕結帝曰所謂言而可知者也視而可見奈何岐伯曰五臟六腑固盡有部視其五色黃赤為熱白為寒青黑為痛此所謂視而可見者也帝曰捫而可得奈何岐伯曰視其主病之脈堅而血及陷下者皆可捫而得也俱舉痛論篇素氣傷痛形傷腫故先痛而後腫者氣傷形也先腫而後痛者形傷氣也陰陽應象論靈有形而不痛者陽之類也無形而痛者陰之類也無形而痛者其陽完而陰傷之也急治其陰無攻其陽有形而痛者其陰完而陽傷之也急治其陽無攻其陰陰陽俱動乍有形乍無形加以煩心命曰陰勝其陽此謂不表不里其形不久垣通則不痛痛則不通又云痛隨利減亦有當隨其經絡而通之則疼痛去矣如輕可去實麻黃葛根之屬是也謂如頭痛當用川芎細辛之類通之則無凝滯痛隨利減也海諸痛為實痛隨利減世多以下之為利也假令痛在表者實也痛在裡者實也痛在血氣者亦實也故在表者汗之則愈在裡者下之則愈在血氣者散之行之則愈豈可以利為下乎作通字訓則可得矣故經曰通則不痛痛則不通此之謂也運氣諸痛皆屬火經云諸疼痛皆屬於火是也一屬火實經云火鬱之發民病骨痛節乃有動是也一屬火虛經云火不及曰伏明伏明之紀其發痛是也丹諸痛皆屬火寒涼藥不可峻用必用溫散之藥諸痛不可用人參蓋補氣氣旺則不通而痛愈甚矣諸逆衝上逆氣象陽全文見五臟凡氣逆必見象陽症面赤脈洪當以法降其逆乃愈若以氣象陽盛而用寒藥攻之則不救矣氣上衝心咽不得息治法見傷寒厥陰病條垣如秋冬之月胃脈四道為衝脈所逆並脅下少腸脈二道而反上行病名曰厥逆經曰逆氣上行滿脈去形七神昏絶離去其形而死矣其證氣上衝咽不得息喘息有聲不得臥於調中益氣加吳茱萸半錢或一錢觀厥氣多少用之如夏月有此症為大熱也蓋此症隨四時為寒熱溫涼宜以酒黃連酒黃柏酒知母各等分為細末熟湯為丸如桐子大每服二百丸白湯空心下仍多飲熱湯服畢少時便以美飲食壓之使不得胃中停留直至下焦以瀉衝脈之邪也寒氣厥逆赤丸主之茯苓桂心各四兩細辛一兩烏頭附子各二兩射罔如大棗一兩上六味為末納真珠為色蜜丸如麻子大先食酒飲下三丸日三夜一服不知稍增之以知為度一方用半夏四兩不用桂逆氣五臟皆有一曰心小腸經云諸逆衝上皆屬於火又云少腹控睪引腰脊上衝心邪在小腸取之肓原以散之刺太陰以豫之取厥陰以下之取巨虛下廉以去之按其所過之經以調之是也二曰胃經云胃為氣逆是也胃逆有嘔有吐有噦故刺嘔吐取中脘三里也刺噦取乳下黑根盡處及臍下三寸皆大驗也治各有本門三曰肺大腸經云肺苦氣上逆急食苦以泄之又云腹中常鳴氣上衝胸喘不能久立邪在大腸刺肓之原巨虛下廉是也其肺逆曰咳喘取天突人迎泄之也治亦各有門四曰肝經云肝氣逆則耳聾不聰頄腫取血者是也五曰腎即奔豚氣逆腳氣衝心之類是也治亦各有門六曰腎經云督脈別絡生病從少腹上衝心而痛不得前後為沖疝是也治見疝門玉腎氣衝心關元二寸半補帶脈一分沿皮向外二寸半瀉摘腹有逆氣上衝心腹脹滿不得息氣衝右臍下七寸兩旁相去遠二寸動脈應手灸七壯忌針三里立愈運氣厥逆有三一曰風火經云少陽司天火氣下臨風行於地厥逆膈不通是也二曰寒經云水鬱之發善厥逆是也三曰濕經云太陰司天濕氣下臨厥逆是也噫飽氣也俗作噯氣仲上焦竭善噫何謂也師曰上焦受中焦氣未和不能消是故能噫耳經云衛出於上焦上焦不歸者噫而酢酸經云不歸不至也上焦之氣不至其部則物不能傳化故噫而酢吞噫屬心脾及二陽一陰經云心為噫又云太陰所謂上走心為噫者陰盛而上走於陽明陽明絡屬心為噫故曰上走心為噫也又云二陽一陰發病主驚駭背痛善噫欠也仲旋覆代赭湯治痞而噫方見傷寒痞門本心下蓄積痞悶或作痛多噫敗卵氣枳殼散主之枳殼白朮各半兩香附一兩檳榔二錢上為細末每服二錢米飲調下日三服不拘時候龐老方丹宣州人與前方證皆除氣上築心膈噫氣稍寬脈之右關弱短左關左尺長洪大而數此肝有熱宜瀉肝補脾青皮一錢白朮二錢半木通甘草二分煎下保和丸十五粒抑青丸二十粒噫氣胃中有火有痰南星制半夏軟石膏香附各等分水煎服運氣噫有三一曰熱助心實而噫經云少陰之復噫噦是也二曰寒攻心虛而噫經云太陽司天寒淫所勝善噫又云太陽之復唾出清水及為噦噫是也三曰風攻脾虛而噫又云厥陰在泉風淫所勝腹脹善噫是也針灸噫獨取脾經云脾足太陰之脈是動則病腹脹善噫視盛虛熱寒陷下取之也仲寸口脈弱而緩弱者陽氣不足緩者胃氣有餘噫而吞酸食卒不下氣填於膈上脈寸脈緊寒之實也寒在上焦胸中必滿而噫趺陽脈微而澀微無胃氣澀即傷脾寒在膈而反下之寒積不消胃微脾傷穀氣不行食已自噫寒在胸膈上虛下實穀氣不通為閉塞之病趺陽脈微澀及寸脈緊而噫者皆屬寒全文見診條太陰中者腹脹閉噫氣嘔逆下氣下氣屬心虛經云夏脈者心也心脈不及下為氣泄者是也河腸胃鬱結穀氣內發而不能宣通於腸胃之外故善噫而或下氣也診癲癇癆瘵若氣下泄不止者必死此真氣竭絶腸胃腠理閉塞穀氣不能宣通於腸胃之外故從腸胃中泄出也
