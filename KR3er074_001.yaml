body:
  text: 卷之一陰陽臟腑部陰陽素陰陽者天地之道也萬物之綱紀變化之父母生殺之本始神明之府也治病必求於本積陽為天積陰為地陰靜陽躁陽生陰長陽殺陰藏陽化氣陰成形陰陽應象論清陽為天濁陰為地地氣上為云天氣下為雨雨出地氣云出天氣故清陽出上竅濁陰出下竅清陽發腠理濁陰走五臟清陽實四肢濁陰歸六腑水為陰火為陽陽為氣陰為味味歸形形歸氣氣歸精精歸化精食氣形食味化生精氣生形味傷形氣傷精精化為氣氣傷於味陰味出下竅陽氣出上竅同上天食人以五氣地食人以五味五氣入鼻藏於心肺上使五色修明音聲能彰五味入口藏於腸胃味有所藏以養五氣氣和而生津液相成神乃自生六節臟象論靈人受氣於谷谷入於胃以傳與肺五臟六腑皆以受氣其清者為榮濁者為衛榮在脈中衛在脈外榮周不休五十而復大會陰陽相貫如環無端榮衛生會篇其浮氣之不循經者為衛氣其精氣之行於經者為榮氣衛氣篇素榮者水穀之精氣也和調於五臟灑陳於六腑乃能入於脈也故循脈上下貫五臟絡六腑也衛者水穀之悍氣也其氣慓疾滑利不能入於脈也故循皮膚之中分肉之間熏於肓膜散於胸腹痹論靈五穀入於胃也其糟粕津液宗氣分為三隧故宗氣積於胸中出於喉嚨以貫心脈而行呼吸焉榮氣者泌其津液注之於脈化以為血以榮四末內注五臟六腑以應刻數焉衛氣者出其悍氣之慓疾而先行於四末分肉皮膚之間而不休者也晝行於陽夜行於陰常從足少陰之分間行於五臟六腑邪客篇帝曰榮衛之行奈何岐伯曰谷始入於胃其精微者先出於胃之兩焦以溉五臟別出兩行榮衛之道其大氣之摶而不行者積於胸中名曰氣海出於肺循喉咽故呼則出吸則入天地之精氣其大數常出三入一故谷不入半日則氣衰一日則氣少矣五味篇丹溪天地屬金說邵子曰天依地地附天天地自相依附內經曰大氣舉地夫自清濁肇分天以氣運於外而攝水地以形居於中而浮於水者也是氣也即天之謂也自其無極者觀之故曰大氣至清至剛至健屬乎金者也非至剛不能攝其水非至健不能運行不息以舉地之重非至清其剛健不能長久上古而不老或曰子以天氣為屬金固周易乾卦取象之義何至遂以屬金言之乎善言天者必有證於人善言大者必取譬於小願明以告我曰天生萬物人為貴人形象天可以取譬肺主氣外應皮毛內經謂陽為外衛非外皮毛乎此天之象也其包裹骨肉臟腑於其中此地之象也血行於皮里肉腠晝夜周流無端此水之象也合三者而觀非水浮地天攝水地懸於中乎聖人作易取金為天氣之象厥有旨焉劉河間說脈者血氣之先斯論得之矣人身之脈血氣之所為而不知所以周流不息者正乾道乾乾之意也亦猶理之寓乎氣所以為血氣之先先之一字厥有旨焉靈黃帝曰願聞衛氣之行出入之合何如伯高曰歲有十二月日有十二辰子午為經卯酉為緯周天二十八宿而一面七星四七二十八宿房昴為緯虛張為經是故房至畢為陽昴至尾為陰陽主晝陰主夜故衛氣之行一日一夜五十周於身晝日行於陽二十五周夜行於陰二十五周周行五臟是故平旦陰盡陽氣出於目目張則氣上行於頭循項下足太陽循背下至小指之端其散者別於目鋭眥下手太陽下至手小指之間外側其散者別於目鋭眥下足少陽注小指次指之間以上以上二字衍文也其下當有其散者三字循手少陽之分側下至小指之間別者以上以上二字衍文也至耳前合於頷脈注足陽明以下行至胕上入五指之間其散者從耳下下手陽明入於大指之間入掌中其至於足也入足心出內踝下下當作上行陰分復合於目故為一周是故日行一舍人氣行於身一周與十分身之八日行二舍人氣行三周於身與十分身之六日行三舍人氣行於身五周與十分身之四日行四舍人氣行於身七周與十分身之二日行五舍人氣行於身九周日行六舍人氣行於身十周與十分身之八日行七舍人氣行於身十二周在身在身二字衍文也與十分身之六日行十四舍人氣二十五周於身有奇分與十分身之四陽盡於陰陰受氣矣其始入於陰常從足少陰注於腎腎注於心心注於肺肺注於肝肝注於脾脾復注於腎為周是故夜行一舍人氣行於陰臟一周與十分臟之八亦如行陽之二十五周而復合於目陰陽一日一夜合有奇分十分身之四與十分藏之二是故人之所以臥起之時有早晏者奇分之不盡故也衛氣行篇上衛氣之行晝行陽則目張而寤夜行陰則目瞑而寐謹按此節言平旦陽氣之出目而下行於手足三陽也皆一時分道並注非有先後次第也此經篇末言水下一刻人氣在太陽水下二刻人氣在少陽水下三刻人氣在陽明水下四刻人氣在陰分者則是先下太陽究竟然後下少陽候少陽究竟然後下陽明候陽明究竟方上行陰分大與此節矛盾蓋衍文也素陽氣者一日而主外平旦人氣生日中而陽氣隆日西而陽氣已虛氣門乃閉是故暮而收拒無擾筋骨無見霧露反此三時形乃困薄生氣通天論靈衛氣行於陰二十五度行於陽二十五度分為晝夜故氣至陽而起至陰而止故曰日中而陽隴為重陽夜半而陰隴為重陰故太陰主內太陽主外各行二十五度分為晝夜夜半為陰隴夜半後而為陰衰平旦陰盡而陽受氣矣日中為陽隴日西而陽衰日入陽盡而陰受氣矣夜半而大會萬民皆臥命曰合陰平旦陰盡而陽受氣如是無已與天地同紀榮衛生會篇黃帝曰余願聞五十榮奈何岐伯答曰天周二十八宿宿三十六分人氣行一周人氣行一周之下當有與十分身之八六字千八分千八分之上當有宿字下當有人氣行五十周下身八字蓋天周二十八宿宿三十六分人氣行一周於身與十分身之八宿三百六十分人氣行一十八周於身宿千八分人氣行五十周於身也日行二十八宿人經脈上下左右前後二十八脈周身十六丈二尺以應二十八宿漏水下百刻以分晝夜故人一呼脈再動氣行三寸一吸脈亦再動氣行三寸呼吸定息氣行六寸十息氣行六尺日行二分日行二分之上當有二十七息氣行一丈六尺二寸十二字二百七十息氣行十六丈二尺氣行交通於中一周於身下水二刻日行二十五分二十五分當作二十分五百四十息氣行再周於身下水四刻日行四十分二千七百息氣行十周於身下水二十刻日行五宿二十分一萬三千五百息氣行五十榮於身水下百刻日行二十八宿漏水皆盡脈終矣所謂交通者並行一數也故五十榮備得盡天地之壽矣凡行八百一十丈也五十榮篇黃帝曰榮氣之道內谷為寶谷入於胃乃傳之肺流溢於中布散於外精專者行於經隧常榮無已終而復始是謂天地之紀故氣從太陰出注手陽明上行注足陽明下行注足跗上注大指間與太陰合上行抵髀從脾注心中循手少陰出腋下臂注小指合手太陽上行乘腋出䪼內注目內眥上巔下項合足太陽循脊下尻下行注小指之端循足心注足少陰上行注腎從腎注心外散於胸中循心主脈出腋下臂出兩筋之間入掌中出中指之端還注小指次指之端合手少陽上行注膻中散於三焦從三焦注膽出脅注足少陽下行至跗上復從跗至大指間合足厥陰上行至肝從肝上注肺上循喉嚨入頏顙之竅究於畜門其支別者上額循巔下項中循脊入骶骨是督脈也絡陰器上過毛中入臍中上循腹裡入缺盆下注肺中復出太陰此榮氣之所行也逆順之常也榮氣篇頏苦琅切顙酥朗切額也東垣云十二經一脈也略為十二分而已肺手太陰之脈起於中焦下絡大腸還循胃口上膈屬肺從肺系橫出腋下下循臑內肩下臂上通名曰臑行少陰心主之前臑內廉凡有三脈太陰居前少陰居後厥陰居中也下肘中臂上臑下接處曰肘循臂內上骨下廉臑下掌上名曰臂臂有二骨今太陰脈循臂上骨之下廉也入寸口掌後陷中動脈太淵穴也寸口中動脈經渠穴也上魚循魚際魚際穴也散脈中是出大指之端少商穴也其支者從腕後直出次指內廉出其端大腸手陽明之脈起於大指次指之端商陽穴也循指上廉指上廉本節前陷中二間穴本節後陷中三間穴也出合谷兩骨間合谷穴也上入兩筋之中陽溪穴也循臂上廉入肘外廉曲池穴也上臑外前廉上肩出髃骨之前廉上出於柱骨之會上下入缺盆絡肺下膈屬大腸其支者從缺盆上頸貫頰入下齒中還出挾口交人中左之右右之左上挾鼻孔胃足陽明之脈起於鼻之交頞中旁約太陽之脈下循鼻外入上齒中還出挾口環唇下交承漿卻循頤後下廉出大迎循頰車上耳前過客主人循髮際至額顱其支者從大迎前下人迎循喉嚨入缺盆下膈屬胃絡脾其直者從缺盆下乳內廉下挾臍入氣街中其支者起於胃口下循腹裡下至氣街中而合以下髀關抵伏兔下膝臏中腿下脛上接處曰膝下循脛外廉謂脛骨之外廉也其外廉下膝三寸三里穴也又下三寸巨虛上廉也又下三寸巨虛下廉也直下至腕中解溪穴也下足跗衝陽穴也足面曰跗跗上陷中動脈是也凡足跗直下大指之間皆有動脈其大指之間足少陽脈也上入指本節後間動脈足厥陰脈也上跗上動脈足陽明脈也針經終始篇云陽明在上厥陰在中少陽在下者是也凡言間皆謂兩指中間也入中指內間中指內間本節後陷中陷谷穴也本節前陷中內庭穴也大指次指之端厲兌穴也其支者下廉三寸而別下入中指外間其支者別跗上入大指間出其端脾足太陰之脈起於大指之端隱白穴也在大指端內側循指內側白肉際大指內側本節後大都穴也過核骨後核骨下太白穴也核骨在足大指本節後約二寸內踝骨前約三寸如棗核橫於足內側赤白肉際者是也竇太師指為孤拐骨者非是也上內踝前廉內踝下前陷中商丘穴也上踹內循脛骨後交出厥陰之前上膝股內前廉膝輔骨下陷中陰陵泉穴也入腹屬脾絡胃上膈挾咽連舌本散舌下其支者復從胃別上膈注心中心手少陰之脈起於心中出屬心系下膈絡小腸其支者從心系上挾咽系目系其直者復從心系卻上肺下出腋下肺脈從肺系橫出腋下心脈從肺而出於腋下包絡脈從脅下抵腋下下循臑內後廉行太陰心主之後下肘內少海穴也循臂內後廉臂內後廉上脘一寸半靈道穴也抵掌後鋭骨之端神門穴也入掌內後廉掌內後廉小指本節陷中少府穴也循小指之內出其端少衝穴也在小指內廉之端小腸手太陽之脈起於小指之端少澤穴也循手外側小指本節前谷穴也本節後陷中後溪穴也上腕臂下掌上節處曰腕腕前起骨中陷中腕骨穴也當腕中陷處陽谷穴也出踝中直上循臂骨下廉出肘內側兩筋之間少海穴也上循臑外後廉出肩解繞肩胛交肩上入缺盆絡心循咽下膈抵胃屬小腸其支者從缺盆循頸上頰至目鋭眥卻入耳中其支者別頰上䪼抵鼻至目內眥斜絡於顴膀胱足太陽之脈起於目內眥上額交巔其支者從巔至耳上角其直者從巔入絡腦還出別下項循肩膊內挾脊抵腰中入循膂絡腎屬膀胱其支者從腰中下挾脊貫臀入膕中腿上踹上接處約文中央動脈曰膕中委中穴也其支者從膊內左右別下貫胛挾脊內過髀樞竇云髀骨節也循髀外從後廉下合膕中以下貫踹內足肚曰踹出外踝之後崑崙穴也循京骨京骨穴也至小指外側小指外側本節後陷中束骨穴也本節前通谷穴也小指端至陰穴也腎足少陰之脈起於小指之下斜走足心湧泉穴也出於然骨之下然骨穴也在內踝前起大骨下陷中循內踝之後內踝之後跟骨之上陷中動脈太溪穴也上大陵二寸復溜穴也別入跟中以上踹內出膕內廉陰谷穴也上股內後廉貫脊屬腎絡膀胱其直者從腎上貫肝膈入肺中循喉嚨俠舌本其支者從肺出絡心注胸中心主手厥陰心包絡之脈起於胸中出屬心包絡下膈歷絡三焦其支者循胸出脅下腋三寸上抵腋下循臑內行太陰少陰之間入肘中曲澤穴也下臂行兩筋之間兩節之上腕三寸間使穴也當腕中大陵穴也入掌中勞宮穴也穴有動脈循中指出其端中衝穴也其支者別掌中循小指次指出其端三焦手少陽之脈起於小指次指之端關衝穴也上出兩指之間兩指之間陷中腋門穴也上兩指本節後間陷中中渚穴也循手表腕陽池穴也出臂外兩骨之間兩骨之間上腕三寸支溝穴也上貫肘天井穴也循臑外上肩而交出足少陽之後入缺盆布膻中散絡心包下膈循屬三焦其支者從膻中上出缺盆上項系耳後直上出耳上角以屈下頰至䪼䪼頰骨也其支者從耳後入耳中出走耳前過客主人前交頰至目鋭眥膽足少陽之脈起於目鋭眥上抵頭角下耳後循頸行手少陽之前至肩上卻交出手少陽之後入缺盆其支者從耳後入耳中出走耳前至目鋭眥後其支者別鋭眥下大迎合手少陽抵於䪼下加頰車下頸合缺盆以下胸中貫膈絡肝屬膽循脅裡出氣街繞毛際橫入髀厭中其直者從缺盆下腋循胸過季脅下合髀厭中竇氏云腹下腿上節處是也以下循髀陽出膝外廉下外輔骨之前外輔骨之前膝之下一寸陽陵泉穴也伸足取之直下抵絶骨之端陽輔穴也下出外踝之前丘墟穴也循足跗上入小指次指之間小指次指之間本節前陷中俠溪穴也本節後陷中臨泣穴也小指次指之端竅陰穴也其支者別跗上入大指之間循大指歧骨內出其端還貫爪甲出三毛肝足厥陰之脈起於大指叢毛之際大敦穴也上循足跗上廉足跗上廉大指間陷中行間穴也大指本節後間陷中太衝穴也去內踝一寸上踝八寸交出太陰之後內踝前一寸中封穴也上膕內廉曲泉穴也循股陰入毛中過陰器抵小腹挾胃屬肝絡膽上貫膈布脅肋循喉嚨之後上入頏顙連目系上出額與督脈會於巔其支者從目系下頰裡環唇內其支者復從肝別貫膈上注肺經脈篇上榮氣之行自手太陰始至足厥陰終一周於身也詳其一周於身外至身體四肢內至五臟六腑無不周遍故其五十周無晝夜陰陽之殊衛氣之行則不然晝但周陽於身體四肢之外不入五臟六腑之內夜但周陰於五臟六腑之內不出身體四肢之外故必五十周至平旦方與榮大會於肺手太陰也黃帝曰脈行之逆順奈何岐伯曰手之三陰從臟走手手太陰從中焦注大指次指手少陰從心中注手小指手厥陰從胸中注手小指次指此手三陰從臟走手也手之三陽從手走頭足之三陽從頭走足足之三陰從足走腹黃帝曰願聞脈度岐伯曰手之六陽從手至頭長五尺五六三丈手之六陰從手至胸中三尺五寸三六一丈八尺五六三尺合二丈一尺足之六陽從足上至頭八尺六八四丈八尺足之六陰從足至胸中六尺五寸六六三丈六尺五六三尺合三丈九尺蹺脈從足至目七尺五寸二七一丈四尺二五一尺合一丈五尺督脈任脈各四尺五寸二四八尺二五一尺合九尺凡都合一十六丈二尺此氣之大經隧也脈度篇素督脈者起於少腹以下骨中央女子入系庭孔其孔溺孔之端也其絡循陰器合篡間繞篡後別繞臀至少陰與巨陽中絡者合少陰上股內後廉貫脊屬腎與太陽起於目內眥上額交巔上入絡腦還出別下項循肩膊內挾脊抵腰中入循膂絡腎自少陰股內至目十七字上下必有脫簡否則古注衍文也其男子循莖下至篡與女子等其少腹直上者貫臍中央上貫心入喉上頤環唇上系兩目之下中央骨空論上督脈始終行身之後東垣云督脈者出於會陰穴會陰即經文所謂篡根於長強穴上行脊裡至於巔附足太陽膀胱之脈膀胱者諸陽之首兼榮衛之氣系焉督脈為附督者都也能為表裡上中下十二經之病焉王注云自其少腹直上至兩目之下中央指任脈之行而言是督脈所繫由此言之則任脈督脈衝脈名異而同一體也謂之任脈者女子得之任養也謂之衝脈者以其上氣衝也謂之督脈者以其督領諸脈也任脈者起於中極之下以上毛際循腹裡上關元至咽喉上頤循面入目骨空論上任脈始終行身之前東垣云任脈起於會陰根於曲骨入前陰中出腹裡過臍上行附足厥陰之經為生化之元也貫穿諸經無所不繫焉衝脈者起於氣街並少陰之經挾臍上行至胸中而散骨空論靈衝脈任脈皆起於胞中上循背裡為經絡之海其浮而外者循腹右上行會於咽喉別而絡唇口五音五味篇上衝脈始終亦行身之前挾任脈兩傍東垣云衝脈分為二道起於會陰根於氣街為二道入腹中央挾臍兩傍上行附足陽明之脈至胸中而散一說上至腦耳上角下至足內踝絡跗上若搐如引繩之狀上下動之若一貫諸經之脈無所不到以其從胃脈故也十二經之海也旺為生化升降之主黃帝曰蹺脈安起安止何氣何榮岐伯答曰蹺脈者少陰之別起於然骨之後上內踝之上直上循陰股入陰上循胸裡入缺盆上出人迎之前入頄屬目內眥合於太陽陽蹺而上行氣並相還則為濡目氣不榮則目不合黃帝曰氣獨行五臟不榮六腑何也岐伯答曰氣之不得無行也如水之流如日月之行不休故陰脈榮其臟陽脈榮其腑如環之無端莫知其紀終而復始其流溢之氣內溉臟腑外濡腠理黃帝曰蹺脈有陰陽何脈當其數岐伯答曰男子數其陽女子數其陰當數者為經其不當數者為絡也脈度論頄音仇面顴也蹺渠洛切上蹺脈始終獨言陰蹺而不及陽蹺者有脫簡也當數謂當脈度一十六丈二尺之數也男子以陽蹺當其數女子以陰蹺當其數難經脈有奇經八脈者不拘於十二經何也然有陽維有陰維有陽蹺有陰蹺有沖有督有任有帶之脈凡此八脈者皆不拘於經故曰奇經八脈也經有十二絡有十五凡二十七氣相隨上下何獨不拘於經也然聖人圖說溝渠通利水道以備不然天雨降下溝渠溢滿當此之時雱霈妄行聖人不能復圖也此絡脈滿溢諸經不能復拘也二十七難其奇經八脈者既不拘於十二經皆何起何繼也然督脈者起於下極之俞並於脊裡上至風府入屬於腦任脈者起於中極之下以上至毛際循腹裡上關元至咽喉衝脈者起於氣街並足陽明之經挾臍上行至胸中而散也帶脈者起於季脅回身一周陽蹺脈者起於跟中循外踝上行入風池陰蹺脈者亦起於跟中循內踝上行至咽喉交貫衝脈陽維陰維者維絡於身溢蓄不能環流灌溉諸經者也故陽維起於諸陽會也陰維起於諸陰交也比於聖人圖設溝渠溝渠滿溢流於深湖故聖人不能拘通也而人脈隆盛入於八脈而不環周故十二經亦不能拘之其受邪氣蓄則腫熱砭射之也二十八難並步浪切上督任蹺脈岐伯謂在十二經榮氣周流度數一十六丈二尺之內扁鵲謂奇經八脈不拘於十二經二說矛盾以待賢者又衝脈虞庶注云素問曰衝脈並足少陰之經難經卻言並足陽明之經況少陰之經挾臍各五分陽明之經挾臍左右各二寸氣衝又是陽明脈氣所發如此推之則衝脈自氣街起在陽明少陰二經之內挾臍上行其理明矣靈黃帝曰經脈十二而手太陰足少陰陽明獨動不休何也岐伯曰足陽明胃脈也胃者五臟六腑之海其清氣上注於肺肺氣從太陰而行之其行也以息往來故人一呼脈再動一吸脈亦再動呼吸不已故動而不止黃帝曰氣之過於寸口也上十焉息下八焉伏何道從還不知其極岐伯曰氣之離臟也卒然如弓弩之發如水之下岸上於魚以反衰其餘氣衰散以逆上故其行微黃帝曰足之陽明何因而動岐伯曰胃氣上注於肺其悍氣上衝頭者循咽上走空竅循眼系入絡腦出顑下客主人循牙車合陽明並下人迎此胃氣別走於陽明者也故陰陽上下其動也若一故陽病而陽脈小者為逆陰病而陰脈大者為逆故陰陽俱靜俱動若引繩相傾者病黃帝曰足少陰何因而動岐伯曰衝脈者十二經之海也與少陰之大絡起於腎下出於氣街循陰股內廉邪入膕中循脛骨內廉並少陰之經下入內踝之後入足下其別者邪入踝出屬跗上入大指之間注諸絡以溫足脛此脈之常動者也動腧篇顑苦鹹切疑額字之誤陽脈人迎脈也陰脈寸口脈也經脈十二者伏行分肉之間深而不見其常見者足太陰過於外踝之上無所隱故也諸脈之浮而常見者皆絡脈也六經絡手陽明少陽之大絡起於五指間上合肘中飲酒者衛氣先行皮膚先充絡脈絡脈先盛故衛氣已平榮氣乃滿而經脈大盛脈之卒然動者皆邪氣居之留於本末不動則熱不堅則陷且空不與衆同是以知其何脈之動也雷公曰何以知經脈之與絡脈異也黃帝曰經脈者常不可見也其虛實也以氣口知之脈之見者皆絡脈也雷公曰細子無以明其然也黃帝曰諸絡脈皆不能經大節之間必行絶道而出入復合於皮中其會皆見於外故諸刺絡脈者必刺其結上甚血者雖無結急取之以瀉其邪而出其血留之發為痹也凡診絡脈脈色青則寒且痛赤則有熱胃中寒手魚際之絡多青矣胃中有熱魚際絡赤其暴黑者留久痹也其有赤有黑有青者寒熱氣也其青短者少氣也凡刺寒熱者皆多血絡必間日而一取之血盡乃止乃調其虛實其小而短者少氣甚者瀉之則悶悶甚則僕不得言悶急坐之也經脈篇素黃帝曰夫絡脈之見也其五色各異青黃赤白黑不同其故何也岐伯曰經有常色而絡無常變也帝曰經之常也何如岐伯曰心赤肺白肝青脾黃腎黑皆亦應其經脈之色也黃帝曰絡之陰陽亦應其經乎岐伯曰陰絡之色應其經陽絡之色變無常隨四時而行也寒多則凝泣凝泣則青黑熱多則淖澤淖澤則黃赤皆常色也謂之無病五色具見者謂之寒熱帝曰善經絡論篇靈經脈為里支而橫者為絡絡之別者為孫盛而血者疾誅之盛者瀉之虛者飲藥以補之脈度篇素目受血而能視足受血而能步掌受血而能握指受血而能攝五臟生成篇許昌滑壽著十四經發揮釋經脈為曲絡脈為直經為榮氣絡為衛氣乃所以惑亂來學也謹按經云經脈十二伏行分肉之間深而不見諸脈浮而常見者皆絡脈也又云諸絡脈不能經大節之間必行絶道而出入復合於皮又云當數者為經不當數者為絡今發揮謂手太陰脈其支從腕後出次指端交於手陽明者為手太陰絡手陽明脈其支從缺盆上挾口鼻交於足陽明者為手陽明絡凡十二經之支脈伏行分肉者皆釋為絡脈則是絡脈亦伏行分肉之間而不浮見亦能經大節而不行絶道亦當經脈一十六丈二尺內之數而非不當數也又按經云足少陽之脈起於目鋭眥上抵頭角下耳後未嘗言其脈有曲折也今發揮謂足少陽脈起目鋭眥作三折從目鋭眥至完骨是一折又自完骨至睛明是一折自睛明至風池是一折則是內經以經脈之曲折朦朧者為直行也又按經云水穀入於胃也其氣分為三隧故宗氣積胸中出喉嚨而行呼吸焉榮氣者泌其津液注之於脈化以為血以榮四末內注五臟六腑以應刻數焉衛氣者出其悍氣之慓疾而皆行於四末分肉皮膚之間而不休者也又云衛出於上焦常與榮俱晝行於陽二十五周夜行於陰二十五周故至平旦五十周復與榮氣大會於手太陰矣此言衛氣與榮氣相會未嘗及宗氣今發揮謂氣行一萬三千五百息脈行八百十丈適當寅時復會於手太陰則是將積於胸中呼吸與榮周相會之宗氣牽合作晝行陽夜行陰與榮五十周方會之衛氣也乖舛經義罪孰甚焉陽者天氣也主外陰者地氣也主內故陽道實陰道虛陰在內陽之守也陽在外陰之使也應象論陰者藏精而起亟也陽者衛外而為固也通天論靈內有陰陽外亦有陰陽在內者五臟為陰六腑為陽在外者筋骨為陰皮膚為陽壽天剛柔篇素足太陽與少陰為表裡少陽與厥陰為表裡陽明與太陰為表裡是為足之陰陽也手太陽與少陰為表裡少陽與心主為表裡陽明與太陰為表裡是為手之陰陽也血氣形志篇靈黃帝問於伯高曰脈度言經脈之長短何以立之伯高曰先度其節骨之大小廣狹長短而脈度定矣黃帝曰願聞衆人之度人長七尺五寸者其骨節之大小長短各幾何伯高曰頭之大骨圍二尺六寸胸圍四尺五寸腰圍四尺二寸發所覆者顱至項一尺二寸發以下至頤長一尺君子終折結喉以下至缺盆中長四寸缺盆以下至𩩲𩨗長九寸過則肺大不滿則肺小𩩲𩨗以下至天樞長八寸過則胃大不及則胃小天樞以下至橫骨長六寸半過則回腸廣長不滿則狹短橫骨長六寸半橫骨上廉以下至內輔之上廉長一尺八寸內輔之上廉以下至下廉長三寸半內輔下廉下至內踝長一尺三寸內踝以下至地長三寸膝膕以下至跗屬長一尺六寸跗屬以下至地長三寸故骨圍大則太過小則不及角以下至柱骨長一尺行腋中不見者長四寸腋以下至季脅長一尺二寸季脅以下至髀樞長六寸髀樞以下至膝中長一尺九寸膝以下至外踝長一尺六寸外踝以下至京骨長三寸京骨以下至地長一寸耳後當完骨者廣九寸耳前當耳門者廣一尺三寸兩顴之間相去七寸兩乳之間廣九寸半兩髀之間廣六寸半足長一尺二寸廣四寸半肩至肘長一尺七寸肘至腕長一尺二寸半腕至中指本節長四寸本節至其末長四寸半項發以下至背骨長二寸半膂骨以下至尾骶二十一節長三尺上節長一寸四分分之一奇分在下故上七節至於膂骨九寸八分分之七此衆人骨之度也所以立經脈之長短也骨度篇𩩲許竭切骬云居切唇至齒長九分口廣二寸半齒以後至會厭深三寸半大容五合舌重十兩長七寸廣二寸半咽門重十兩廣二寸半至胃長一尺六寸胃紆曲屈伸之長二尺六寸大一尺五寸徑五寸大容二斗五升小腸後附脊左環回周疊積其注於回腸者外附於臍上回運環十六曲大二寸半徑八分分之少半長三丈三尺回腸當臍左環回周葉積而下回運環反十六曲大四寸徑一寸寸之少半長二丈一尺廣腸傳脊以受回腸左環葉脊上下闢大八寸徑二寸寸之大半長二尺八寸腸胃所入至所出長六丈四寸四分回曲環反三十二曲也腸胃論難七衝門何在然唇為飛門齒為戶門會厭為吸門胃為賁門太倉下口為幽門大腸小腸會為闌門下極為魄門故曰七衝門也四十四難素腰以上為天腰以下為地難上焦者在心下下膈在胃上口主內而不出其治在膻中玉堂下一寸六分直兩乳間陷者是中焦者在胃中脘不上不下主腐熟水穀其治在臍傍下焦者在臍下當膀胱上口主分別清濁主出而不內以傳導也其治在臍下一寸三十一難靈黃帝曰願聞榮衛之所行皆何道從來岐伯答曰榮出於中焦衛出於上焦黃帝曰願聞三焦之所出岐伯答曰上焦出於胃上口並咽以上貫膈而布胸中走腋循太陰之分而行還至陽明上至舌下足陽明常與榮俱行於陽二十五度行於陰亦二十五度一周也故五十度而復大會於手太陰矣黃帝曰願聞中焦之所出岐伯答曰中焦亦並胃中出上焦之後此所受氣者泌糟粕蒸津液化其精微上注於肺脈乃化而為血以奉生身莫貴於此故獨得行於經隧命曰榮氣黃帝曰夫血之與氣異名同類何謂也岐伯答曰榮衛者精氣也血者神氣也故血之與氣異名同類焉故奪血者無汗奪汗者無血故人生有兩死而無兩生黃帝曰願聞下焦之所出岐伯答曰下焦者別回腸注於膀胱而滲入焉故水穀者常並居於胃中成糟粕而俱下於大腸而成下焦滲而俱下濟泌別汁循下焦而滲入膀胱焉黃帝曰善余聞上焦如霧中焦如漚下焦如瀆此之謂也榮衛生會篇海藏頭至心為上焦心至臍為中焦臍至足為下焦此三焦者足太陽之別也又靈樞經云臍下膀胱至足為足三焦右手尺脈為命門與包絡脈同診此包絡亦有三焦之稱為命門之火遊行於五臟之間主持乎內手三焦主持乎上足三焦主持乎下上中下三焦通為一氣衛於一身為外護既雲頭至心心至臍臍至足是有狀也呼為三焦是有名也以為無狀可乎經曰三焦者水穀之道路也卻是有形狀何以然上焦者主內而不出中焦者主腐熟水穀下焦者主出而不內故經曰上焦如霧中焦如漚下焦如瀆也手經者主持上也足經者主持下也命門者主持內也為衛者主持外也三焦真氣為父氣散於包絡相從母也並行而不相離母之真氣也故俱會於胸中經云膻中之分父母居之氣之海也如天地之尊不繫五行也清邪中於上焦名曰潔也頭項強腰脊痛濁邪中於下焦名曰渾也陰氣為栗便溺妄出表虛里急上焦下焦與中焦相混上焦怫鬱臟氣相熏中焦不治衛氣上衝榮氣不通血凝不流若衛氣前通者小便赤黃與熱相搏因熱作使遊於經絡出入臟腑陰氣前通陽氣後微陰無所使客氣內入嚏而出之聲嗢咽塞寒厥熱壅必下血陰陽俱厥脾弱液下下焦不固清便下重便數而難腹築湫痛命將難全此命門之脈診在右手尺也經曰五臟不和五液不下當闔不闔便溺俱脫生氣絶矣所以腹臍湫痛也故曰命將難全前三焦自外而入後三焦自內而出霧不收則為喘滿此出而不內也漚不利則為留飲留而不散久為中滿上不能內下不能出也瀆不利則為腫滿此因上內而下不出也此三焦之所不歸也三焦有臟而無腑在內則遊行是血也在外則固護是氣也上焦如霧者氣也中焦如漚者血也中焦者血氣之分也下焦在臍膀胱上口主分別清濁出而不納即傳道也治在臍下名曰三焦其腑在氣街中又云有臟無腑成氏云血室者血之所居也榮衛停止之所經脈流會之處衝脈是矣夫沖者奇經之一也起於腎下出於氣街並足陽明經挾臍上行至胸中而散焉為諸經之海也啓玄子云沖為血海諸經朝會男子則運而行之女子則停而止之是皆謂之血室內經云任脈通衝脈男既運行女既停止故運行者無積而不滿動也停止者有積而能滿靜也不滿者陽也氣也能滿者陰也血也故滿者以時而溢為之信有期者動也乾道成男坤道成女故運行者陽之象也停止者陰之象也血氣榮衛男女皆有內外諧和其脈同診脈者血之府也故為氣血之室為藏物之舍亦為府也三焦之府在氣街中為男女血海之府經又曰有臟而無腑從無形而言之也有臟而有腑從有形而言之也清邪濁邪所傷三焦齊病亦同兩感經云心包絡主之脈出胸中下膈歷絡三焦此其所以與相火併行與命門脈同診於右尺中也東垣云三焦有名無形主持諸氣以象三才之用故呼吸升降水穀往來皆待此以通達是以上焦在心下主內而不出中焦在胃脘主腐熟水穀下焦在臍下主分別清濁出而不內統而論之三才之用本於中焦中焦者胃脘也稟天五之沖氣陰陽清濁自此而分十二經絡自此而始或不得其平則寒熱偏勝虛實不同榮衛澀滯清濁不分而生諸病故曰氣會三焦手少陽脈通於膻中膻中者臣使之官為氣之海審此則知三焦者沖和之本也三焦相火及包絡之脈人之元氣也周身何處無之是名相火用事主持陰陽之氣神明之府也素夫自古通天者生之本此九字著意玩味王太僕云論天謂元氣即天真也本於陰陽天地之間六合之內其氣九州九竅五臟十二節皆通乎天氣其生五其氣三數犯此者則邪氣傷人此壽夭之本也蒼天之氣清淨則志意治順之則陽氣固雖有賊邪弗能害也此因時之序故聖人傳精神服天氣而通神明失之則內閉九竅外壅肌肉衛氣散解此謂自傷氣之削也陽氣者若天與日失其所則折壽而不彰故天運當以日光明是故陽因而上衛外者也陽主動凡人之知覺運動耳目視聽言嗅皆陽氣熏膚充身澤毛若霧露之溉而充之耳若陽氣一失其所則散解不行而熏充澤溉之道澀所以九竅閉塞於內肌肉壅滯於外而知覺運動視聽言嗅之靈皆失也故人之陽氣猶天之日光人失陽氣而知覺運動視聽言嗅之靈明隳壞不彰壽命易折猶天之失光明則萬物無以發生也因於寒欲如運樞起居如驚神氣乃浮丹溪云欲如運樞以下三句皆衍文也下文體若燔炭汗出而散兩句當移在此夫寒邪初傷客於肌表邪鬱而為熱有似燔炭得汗則解此仲景麻黃湯之類是也因於暑汗煩則喘喝靜則多言體若燔炭汗出而散丹溪云君火為病也火主動而散故自汗煩喘多言也因於濕首如裹濕熱不攘大筋緛短小筋弛長緛短為拘弛長為痿丹溪云濕者濁土之氣首為諸陽之會其位高而氣清其體虛故聰明得而系焉濁氣熏蒸清道不通沉重而不爽利似乎有物以蒙冒之失而不治濕鬱為熱熱留不去大筋緛短者熱傷血不能養筋故為拘攣小筋弛張者濕傷筋不能束骨故為痿弱因於濕首如裹各三字為句濕熱不攘以下各四字為句文整而意明王太僕謂反濕其首若濕物裹之以因於濕首為句如裹為句則濕首之濕如裹濕之濕皆是人為文義舛乖也因於氣為腫四維相代陽氣乃竭陽氣者煩勞則張精絶闢積於夏使人煎厥目盲不可以視耳閉不可以聽潰潰乎若壞都汨汨乎不可止闢偏也蓋陽者視聽動作之體也若煩勞而不清靜則視聽動作所張之精竭絶偏枯至夏月而劇故目盲耳閉而視聽失潰潰汨汨而動作廢正仲景所謂春夏劇秋冬瘥之病俗人名曰注夏者是也或曰鄭康成云口鼻之呼吸為魂耳目之聰明為魄夫魄者陰血也耳目之聰明乃陰血所為今經言陽氣煩勞則目盲耳閉者何也曰以耳目與口鼻對言則口鼻為陽耳目為陰以耳目口鼻與臟腑對言則耳目口鼻為陽臟腑為陰故陽氣行陽二十五度於身體之外則耳目口鼻皆受陽氣所以能知覺視聽動作而寤行陰二十五度於臟腑之內則耳目口鼻無陽氣運動所以不能知覺而寐聰明者豈非陽氣為之乎夫人之耳目猶月之質也月質必受日光所加始能明耳目亦必受陽氣所加始能聰明是故耳目之陰血虛則陽氣之加無以受之而視聽之聰明失耳目之陽氣虛則陰血不能自施而聰明亦失是故耳目之聰明必陰血陽氣相須始能視聽也陽氣者大怒則形氣絶而血菀於上使人薄厥有傷於筋縱其若不容汗出偏沮使人偏枯汗出見濕乃生痤痱膏粱之變足生大疔受如持虛勞汗當風寒薄為皶郁乃痤王注云菀積也皶曰粉刺形如米如針也痤小癤也陽氣者精則養神柔則養筋開闔不得寒氣從之乃生大僂榮氣不從逆於肉理乃生癰腫陷脈為瘻留連肉腠腧氣化薄傳為善畏及為驚駭榮氣不從逆於肉理乃生癰腫十二字舊本元誤在及為驚駭之下夫陽氣因失衛而寒氣從之為僂然後榮氣逆而為癰腫癰腫失治然後陷脈為瘻而陷留連於肉腠焉僂力主切背俯不能仰也魄汗未盡形弱而氣爍穴俞以閉發為風瘧故風者百病之始也清淨則肉腠閉拒雖有大風苛毒弗之能害此因時之序也故病久則傳化上下不並良醫弗為故陽蓄積病死而陽氣當隔隔者當瀉不亟正治粗乃敗之生氣通天論帝曰余知百病生於氣也怒則氣上喜則氣緩悲則氣消恐則氣下寒則氣收炅則氣泄驚則氣亂勞則氣耗思則氣結九氣不同何病之生岐伯曰怒則氣逆甚則嘔血及飧泄故氣上矣喜則氣和志達榮衛通利故氣緩矣悲則心系急肺布葉舉而上焦不通榮衛不散熱氣在中故氣消矣恐則精卻卻則上焦閉閉則氣還還則下焦脹故氣不行矣寒則腠理閉氣不行故氣收矣炅則腠理開榮衛通汗大泄故氣泄矣驚則心無所倚神無所歸慮無所定故氣亂矣勞則喘息汗出外內皆越故氣耗矣思則心有所存神有所歸正氣留而不行故氣結矣舉痛篇年四十而陰氣自半也起居衰矣陰陽應象論陰氣者靜則神藏躁則消亡飲食自倍腸胃乃傷痹論陰之所生本在五味陰之五宮傷在五味生氣通天論垣勞倦所傷論調經篇云陰氣生內熱岐伯曰有所勞倦形氣衰少穀氣不盛上焦不行下脘不通而胃氣熱熱氣熏胸中故內熱舉痛論云勞則氣耗勞則喘息汗出外內皆越故氣耗矣夫喜怒不節起居不時有所勞倦皆損其氣衰則火旺火旺則乘脾土脾主四肢故困熱無氣以動懶於語言動作喘乏表熱自汗心煩不安當病之時宜安心靜坐以養其氣以甘寒瀉其熱火以酸味收其散氣以甘溫調其中氣經言勞者溫之損者溫之是也仲景云平人脈大為勞脈極虛亦為勞夫勞之為病其脈浮大手足煩熱春夏劇秋冬瘥脈大者熱邪也極虛者氣損也春夏劇邪助時也秋冬瘥時勝邪也以黃耆建中湯補之此亦溫之也夫上古聖人飲食有節起居有常不妄作勞故能形與神俱而盡終其天年度百歲乃去謂治未病也中古以下去聖久遠飲食失節起居失宜妄作勞役形神俱傷故病而後以藥之是治已病也推其百病之源皆因飲食勞倦胃氣元氣散解不能滋榮百脈溉灌臟腑衛護周身之所致也故蒼天之氣貴清淨陽氣惡煩勞則飲食喜怒之間寒暑起居之際可不慎歟上東垣勞倦所傷論餘論見治虛實法補中益氣湯方條素夫邪之生也或生於陰或生於陽其生於陽者得之風雨寒暑其生於陰者得之飲食居處陰陽喜怒調經論此陰陽以內外言之而總諸陰陽形氣之傷東垣先生謂內外傷者是也謂男女飲食喜怒所傷者皆屬內為陰也諸寒溫風濕所傷皆屬外為陽也靈夫百病之始生也皆生於風雨寒暑陰陽喜怒飲食居處大驚卒恐則血氣分離陰陽破散經絡厥絶脈道不通陰陽相逆衛氣稽留經脈空虛血氣不次乃失其常口問篇素喜怒傷氣寒暑傷形暴怒傷陰暴喜傷陽厥氣上行滿脈去形喜怒不節寒暑過度生乃不固陰陽應象論寒傷形熱傷氣氣傷痛形傷腫故先痛而後腫者氣傷形也先腫而後痛者形傷氣也此上二節經旨似自相矛盾既曰喜怒傷氣又曰暴怒傷陰暴喜傷陽既曰寒暑傷形又曰寒傷形熱傷氣者何也蓋言雖不一而理則有歸夫喜怒之傷人從內出而先發於氣故曰喜怒傷氣也寒暑之傷人從外入而先著於形故曰寒暑傷形也分而言之則怒之氣從下上而先發於陰故曰暴怒傷陰喜之氣從上下而先發於陽故曰暴喜傷陽寒則人氣內藏氣內藏則寒之傷人先著於形故曰寒傷形暑則人氣外溢氣外益則暑之傷人先著於氣故曰熱傷氣也五臟靈五臟者所以藏精神血氣魂魄者也六腑者所以化水穀而行津液者也本藏論素五臟者藏精氣而不瀉也故滿而不實六腑者傳化物而不藏故實而不滿所以然者水穀入口則胃實而腸虛食下則腸實而胃虛故曰實而不滿滿而不實也五臟別論平旦至日中天之陽陽中之陽也日中至黃昏天之陽陽中之陰也合夜至雞鳴天之陰陰中之陰也雞鳴至平旦天之陰陰中之陽也故人亦應之夫言人之陰陽則外為陽內為陰言人身之陰陽則背為陽腹為陰言人身之臟腑中陰陽則臟者為陰腑者為陽肝心脾肺腎五臟皆為陰膽胃大腸小腸膀胱三焦六腑皆為陽背為陽陽中之陽心也背為陽陽中之陰肺也腹為陰陰中之陰腎也腹為陰陰中之陽肝也腹為陰陰中之至陰脾也此皆陰陽表裡內外雄雌相輸應也金匱真言論心者生之本神之變也其華在面其充在血脈為陽中之太陽通於夏氣肺者氣之本魄之處也其華在毛其充在皮為陽中之太陰通於秋氣腎者主蟄封藏之本精之處也其華在發其充在骨為陰中之少陰通於冬氣肝者罷極之本魂之居也其華在爪其充在筋以生血氣此為陽中之少陽通於春氣罷音疲脾胃大腸小腸三焦膀胱者倉廩之本榮之居也名曰器能化糟粕轉味而入出者也其華在唇四白其充在肌此至陰之類通於土氣東垣云四白當作四紅凡十一臟取決於膽也六節臟象論東方生風風生木木生酸酸生肝肝生筋筋生心肝主目其在天為玄在人為道在地為化化生五味道生智玄生神神在天為風在地為木在體為筋在臟為肝在色為蒼在音為角在聲為呼在變動為握在竅為目在味為酸在志為怒怒傷肝悲勝怒風傷筋燥勝風酸傷筋辛勝酸南方生熱熱生火火生苦苦生心心生血血生脾心主舌其在天為熱在地為火在體為脈在臟為心在色為赤在音為徵在聲為笑在變動為憂在竅為舌在味為苦在志為喜喜傷心恐勝喜熱傷氣寒勝熱苦傷氣酸勝苦中央生濕濕生土土生甘甘生脾脾生肉肉生肺脾主口其在天為濕在地為土在體為肉在臟為脾在色為黃在音為宮在聲為歌在變動為噦在竅為口在味為甘在志為思思傷脾怒勝思濕傷肉風勝濕甘傷肉酸勝甘西方生燥燥生金金生辛辛生肺肺生皮毛皮毛生腎肺主鼻在天為燥在地為金在體為皮毛在臟為肺在色為白在音為商在聲為哭在變動為咳在竅為鼻在味為辛在志為憂憂傷肺喜勝憂熱傷皮毛寒勝熱辛傷皮毛苦勝辛北方生寒寒生水水生咸咸生腎腎生骨髓骨髓生肝腎主耳其在天為寒在地為水在體為骨在臟為腎在色為黑在音為羽在聲為呻在變動為栗在竅為耳在味為咸在志為恐恐傷腎思勝恐寒傷血燥勝寒咸傷血甘勝咸天氣通於肺地氣通於嗌風氣通於肝雷氣通於心穀氣通於脾雨氣通於腎六經為川腸胃為海九竅為水注之氣以天地為之陰陽陽之汗以天地之雨名之陽之氣以天地之疾風名之暴風象雷逆氣象陽故治不法天之紀不用地之理則災害至矣陰陽應象論靈肺合大腸大腸者傳道之府心合小腸小腸者受盛之府肝合膽膽者中正之府脾合胃胃者五穀之府腎合膀胱膀胱者津液之府少陽屬腎腎上連肺故將兩臟三焦者中瀆之府水道出焉屬膀胱是孤之府也是六腑之所與合者本輸篇五臟常內閲於上七竅也故肺氣通於鼻肺和則鼻能知香臭矣心氣通於舌心和則舌能知五味矣肝氣通於目肝和則目能辨五色矣脾氣通於口脾和則口能知五穀矣腎氣通於耳腎和則耳能聞五音矣五臟不和則七竅不通六腑不和則留為癰脈度論難肝主色心主臭脾主味肺主聲腎主液鼻者肺之候而反知香臭耳者腎之候而反聞聲其意何也然肺者西方金也金生於巳巳者南方火也火者心心主臭故令鼻知香臭腎者北方水也水生於申申者西方金也金者肺主聲故令耳聞聲四十難素心之合脈也其榮色也其主腎也肺之合皮也其榮毛也其主心也肝之合筋也其榮爪也其主肺也脾之合肉也其榮唇也其主肝也腎之合骨也其榮發也其主脾也五臟生成篇五臟所主心主脈肺主皮肝主筋脾主肉腎主骨是謂五主宣明五氣篇五臟化液心為汗肺為涕肝為淚脾為涎腎為唾是為五液同上諸脈者皆屬於目諸髓者皆屬於腦諸筋者皆屬於節諸血者皆屬於心諸氣者皆屬於肺五臟生成篇難經言八會者何也府會太倉臟會季脅筋會陽陵泉髓會絶骨血會膈腧骨會大杼脈會太淵氣會三焦外一筋直兩乳內也熱病在內者取其會之氣穴也四十五難素心者君主之官也神明出焉肺者相傅之官治節出焉肝者將軍之官謀慮出焉膽者中正之官決斷出焉膻中者臣使之官喜樂出焉脾胃者倉廩之官五味出焉大腸者傳道之官變化出焉小腸者受盛之官化物出焉腎者作強之官伎巧出焉三焦者決瀆之官水道出焉膀胱者州都之官津液藏焉氣化則能出矣凡此十二官者不得相失也故主明則下安以此養生則壽歿世不殆以為天下則大昌主不明則十二官危使道閉塞不通形乃大傷以此養生則殃以為天下其宗大危戒之戒之靈蘭祕典論五臟所藏心藏神肺藏魄肝藏魂脾藏意腎藏志是謂五臟所藏宣明五氣篇五精所並精氣並於心則喜並於肺則悲並於肝則憂並於脾則畏並於腎則恐是謂五並虛而相併者也憂當作怒畏當作思同上帝曰脾不主時何也岐伯曰脾者土也治中央常以四時長四臟各十八日寄治不得獨主於時也脾臟者常著胃土之精也土者生萬物而法天地故上下至頭足不得主時也太陰陽明論篇靈黃帝曰願聞穀氣有五味其入五臟分別奈何伯高曰胃者五臟六腑之海也水穀皆入於胃五臟六腑皆稟氣於胃五味各走其所喜穀味酸先走肝穀味苦先走心穀味甘先走脾穀味辛先走肺穀味咸先走腎穀氣津液已行榮衛大通乃化糟粕以次傳下五味篇人之所受氣者谷也谷之所注者胃也胃者水穀氣血之海也海之所行雲氣者天下也胃之所出氣血者經隧也經隧者五臟六腑之大絡也食氣入胃散精於肝淫氣於筋經脈別論食氣入胃濁氣歸心淫精於脈脈氣流經經氣歸於肺肺朝百脈輸精於皮毛毛脈合精行氣於府府精神明留於四臟氣歸於權衡權衡以平氣口成寸以決死生飲入於胃遊溢精氣上輸於脾脾氣散精上歸於肺通調水道下輸膀胱水精四布五經並行合於四時五臟陰陽揆度以為常也同上丹溪相火論太極動而生陽靜而生陰陽動而變陰靜而合而生水火木金土各一其性惟火有二曰君火人火也曰相火天火也火內陰而外陽主乎動者也故凡動皆屬火以名而言形質相生配於五行故謂之君以位而言生於虛無守位稟命因其動而可見故謂之相天主生物故恆於動人有所生亦恆於動其所以常於動者皆相火助之也見於天者出於龍雷則木之氣出於海則水之氣也具於人者寄於肝腎二部肝屬木而腎屬水也膽者肝之腑膀胱者腎之腑心包絡者腎之配三焦以焦言而下焦司肝腎之分皆陰而下者也天非此火不能生物人非此火不能有生天之火雖出於木水而皆本乎地故雷非伏龍非蟄海非附地則不能鳴不能飛不能波也鳴也飛也波也動而為火者也肝腎之陰悉具相火人而同乎天地或曰相火天人之所同何東垣以為元氣之賊又曰火與元氣不兩立一勝則一負然則如之何而可使之無勝負乎曰周子言神發知矣五性感動而萬事出有知之後五者之性為物所感不能不動謂之動者即內經五火也相火易起五性厥陽之火相扇則妄動矣火起於妄變化莫測無時不有煎熬真陰陰虛則病陰絶則死君火之氣內經以暑與熱言之相火之氣經以火言之蓋表其暴悍酷烈有甚於君火者也故曰相火元氣之賊周子又曰聖人定之以中正仁義而主靜朱子亦曰必使道心常為一身之主而人心每聽命焉此善處乎火也人心聽命道心而又能主之以靜彼五火將寂然不作而相火惟有裨補造化以為生生不息之運用爾何賊之有或曰內經相火注言少陰少陽矣未嘗言及厥陰太陽而吾子言之何也曰足太陽少陰東垣嘗言之矣治以炒柏取其味辛能瀉水中之火是也戴人亦言膽與三焦尋火治肝和包絡俱無異此歷指龍雷之火也豫亦備述天人之火皆生於動如上文所云者實推廣二公之意或曰內經言火不一往往於六氣中見之言臟腑者未之見也二公豈自有所據邪子能為我言之乎經曰百病皆生於風寒暑濕燥火之動而為變者岐伯歷舉病機一十九條而屬火者五此非相火為病之出於臟腑者乎考諸內經少陽病為瘛瘲太陽病時眩僕少陰病瞀瘈暴喑鬱冒不知人非諸熱瞀瘈之屬火者乎手少陽病惡寒鼓栗膽病振寒少陰病灑淅惡寒振栗厥陰病灑淅振寒非諸振鼓栗如喪神守之屬火者乎少陽病嘔逆厥氣上行膀胱病沖頭痛太陽病厥氣上衝胸少腹控睪引腰脊上衝心少陰病氣上衝胸嘔逆非諸逆衝上之屬火者乎少陽病譫妄太陽病譫妄膀胱病狂顛疾非諸燥狂越之屬火者乎少陽病胕腫善驚少陰病瞀熱吐酸胕腫不能久立非諸病胕腫疼酸驚駭之屬火者乎又原病式曰諸風掉眩屬於肝火之動也諸氣憤郁病痿屬於肺火之升也諸濕腫滿屬於脾火之勝也諸痛癢瘡瘍屬於心火之用也是皆火之為病出於臟腑者然也注文未之發爾以陳無擇之通達且以暖熾論君火日用之火言相火而又不曾深及宜乎後人之不無聾瞽也悲夫東垣胃虛則臟腑經絡俱病論針經本輸曰手陽明大腸手太陽小腸皆屬足陽明胃小腸之穴在巨虛下廉大腸之穴在巨虛上廉此二穴皆在足陽明胃三里穴下也大腸主津小腸主液大腸小腸受胃之榮氣乃能行津液於上焦溉灌皮毛充實腠理若飲食不節胃氣不及大腸小腸無所稟受故津液涸竭焉內經曰耳鳴耳聾九竅不利腸胃之所生也此胃弱不能滋養手太陽小腸手陽明大腸故有此證然亦止從胃弱而得之故聖人混言腸胃之所生也或曰子謂混言腸胃所生亦有據乎豫應之曰經云脾不及令人九竅不通謂脾為至陰受胃之陽氣能上升水穀之氣於肺充溢皮毛散入四臟今脾無所稟不能行氣於臟腑故有此症此則脾虛九竅不通之謂也雖曰脾虛亦胃之不足所致耳或曰經云五臟不利則九竅不通此不言脾不言腸而言五臟何也豫曰此說與上二說無以異也蓋謂脾不受胃之稟命致五臟所主九竅不能上通天氣皆閉塞不利故以五臟言之此三者止是胃虛所致耳然亦何止於此胃虛則五臟六腑十二經十五絡四肢皆不得榮運之氣而百病生焉豈一端盡之乎真氣又名元氣乃先身生之精氣也非胃氣不能滋之胃氣者穀氣也榮氣也運氣也生氣也清氣也衛氣也陽氣也又天氣人氣地氣乃三焦之氣分而言之則異其實一也不當作異名異論而觀之飲食勞役所傷自汗小便數陰火乘土位清氣不生陽道不行乃陰血伏火況陽明胃土右燥左熱故化燥火而津液不能停且小便與汗皆亡津液津液至中宮變化為血者也血者脈之腑也血亡則七神何依百脈皆從此中變來也人之百病莫大於中風有汗則風邪客之無汗則陽氣固密腠理閉拒諸邪不能傷也或曰經雲陽不勝其陰則五臟氣爭九竅不通又脾不及則令人九竅不通名曰重強又五臟不和則九竅不通又頭痛耳鳴九竅不利腸胃之所生也請析而解之答曰夫脾者陰土也至陰之氣主靜而不動胃者陽土也主動而不息陽氣在於地下乃能生化萬物故五運在上六氣在下其脾長一尺掩太倉太倉者胃之上口也脾受胃稟乃能熏蒸腐熟五穀者也胃者十二經之源水穀之海也平則萬化安病則萬化危五臟之氣上通九竅五臟稟受氣於六腑六腑受氣於胃六腑者在天為風寒燥濕暑火此無形之氣也胃氣和平榮氣上升始主濕熱濕熱者春夏也行陽二十五度六陽升散之極下而生陰陰降則下行為秋冬行陰道為寒涼也胃既受病不能滋養故六腑之氣絶以致陽道不行陰火上行五臟之氣各受一腑之化乃能滋養皮膚血脈筋骨故言五臟之氣已絶於外是六腑生氣先絶五臟無所稟受而氣後絶矣肺本收下又主五氣氣絶則下流與脾土疊於下焦故曰重強胃氣既病則下溜經曰濕從下受之脾為至陰本乎地也有形之土下填九竅之源使不能上通於天故五臟不和則九竅不通胃者行清氣而上即地之陽氣也清陽成天曰清陽出上竅曰清陽實四肢曰清陽發腠理者也脾胃既為陰火所乘穀氣閉塞而下流即清氣不升九竅為之不利胃之一腑病則十二經元氣皆不足也氣少則津液不行津液不行則血虧故筋骨皮肉血脈皆弱是氣血俱羸弱矣勞役動作飲食飢飽可不慎乎凡有此病者雖不變易他疾已損其天年更加之針灸用藥差誤欲不夭枉得乎素凡陰陽之要陽密乃固兩者不和若春無秋若冬無夏因而和之是謂聖度故陽強不能密陰氣乃絶陰平陽祕精神乃治陰陽離決精氣乃絶因於露風乃生寒熱是以春傷於風邪氣留連乃為洞泄夏傷於暑秋為痎瘧秋傷於濕上逆而咳發為痿厥冬傷於寒春必溫病四時之氣更傷五臟生氣通天論黃帝問曰天有八風經有五風何謂岐伯對曰八風發邪以為經風觸五臟邪氣發病所謂得四時之勝者春勝長夏長夏勝冬冬勝夏夏勝秋秋勝春所謂四時之勝也東風生於春病在肝腧在頸項南風生於夏病在心腧在胸脅西風生於秋病在肺腧在肩背北風生於冬病在腎腧在腰股中央為土病在脾腧在脊故春氣者病在頭夏氣者病在臟秋氣者病在肩背冬氣者病在四肢故春善病鼽衄仲夏善病胸脅長夏善病洞泄寒中秋善病風瘧冬善病痹厥故冬不按蹺春不鼽衄春不病頸項仲夏不病胸脅長夏不病洞泄寒中秋不病風瘧冬不病痹厥飧泄而汗出也夫精者身之本也故藏於精者春不病溫金匱真言論按蹺二字非衍文其上下必有脫簡蓋即冬不藏精者春必溫病之義也五勞所傷久視傷血久臥傷氣久坐傷肉久立傷骨久行傷筋是謂五勞所傷宜明五氣篇多食鹹則脈凝泣而變色多食苦則皮槁而毛拔多食辛則筋急而爪枯多食酸則肉胝䐢而唇揭多食甘則骨痛而發落此五味之所傷也五臟生成篇靈黃帝曰酸走筋多食之令人癃何也少俞曰酸入於胃其氣澀以收上之兩焦不能出入也不出即留於胃中胃中和溫則下注膀胱膀胱之胞薄以懦得酸則縮綣約而不通水道不行故癃陰者積筋之所終也故酸入而走筋矣黃帝曰咸走血多食之令人渴何也少俞曰鹹入於胃其氣上走中焦注於脈則血氣走之血與咸相得則凝凝則胃中汁注之注之則胃中竭竭則咽路焦故舌本干而善渴血脈者中焦之道也故鹹入而走血矣黃帝曰辛走氣多食之令人洞心何也少俞曰辛入於胃其氣走於上焦上焦者受氣而榮諸陽者也姜韭之氣熏之榮衛之氣不時受之久留心下故洞心辛與氣俱行故辛入而與汗俱出黃帝曰苦走骨多食之令人變嘔何也少俞曰苦入於胃五穀之氣皆不能勝苦苦入下脘三焦之道皆閉而不通故變嘔齒者骨之所終也故苦入而走骨故入而復出知其走骨也黃帝曰甘走肉多食之令人悗心何也少俞曰甘入於胃其氣弱小不能上至於上焦而與谷留於胃中者令人柔潤者也胃柔則緩緩則蟲動蟲動則令人悗心其氣外通於肉故甘走肉五味論素天之邪氣感則害人五臟水穀之寒熱感則害人六腑地之濕氣感則害人皮肉筋脈陰陽應象論犯賊風虛邪者陽受之食飲不節起居不時者陰受之陽受之則入六腑陰受之則入五臟入六腑則身熱不時臥上為喘呼入五臟則䐜滿閉塞下為飧泄久為腸澼太陰陽明論靈黃帝問曰邪氣之中人也奈何岐伯答曰邪氣之中人高下也黃帝曰高下有度乎岐伯曰身半以上者邪中之也身半以下者濕中之也故曰邪之中人也無常中於陰則溜於府中於陽則溜於經黃帝曰陰之與陽也異名同類上下相會經絡之相貫如環無端邪之中人或中於陰或中於陽上下左右無有恆常其故何也岐伯曰諸陽之會皆在於面中人也方乘虛時及新用力若飲食汗出腠理開而中於邪中於面則下陽明中於項則下太陽中於頰則下少陽其中於膺背兩脅亦中其經黃帝曰其中於陰奈何岐伯曰中於陰者常從臂胻始夫臂與胻其陰皮薄其血淖澤故俱受於風獨傷其陰黃帝曰此故傷其臟乎岐伯曰身之中於風也不必動臟故邪入於陰經則臟氣實邪氣入而不能容故還之於腑故中陽則溜於經中陰則溜於腑黃帝曰邪之中人臟奈何岐伯曰愁憂恐懼則傷心形寒飲冷則傷肺以其兩寒相感中外皆傷故氣逆而上行有所墮墜惡血留內有所大怒氣上而不下積於脅下則傷肝有所擊僕若醉入房汗出當風則傷脾有所用力舉重若入房過度汗出浴水則傷腎黃帝曰五臟之中風奈何岐伯曰陰陽俱感邪乃得往邪氣臟腑病形篇黃帝曰有一脈生數十病者或痛或癰或熱或寒或癢或痹或不仁變化無窮其故何也岐伯曰此皆邪氣之所生也帝曰余聞氣者有真氣有正氣有邪氣何謂真氣岐伯曰真氣者所受於天與穀氣並而充身也正氣者正風也從一方來非實風又非虛風也邪氣者虛風之賊傷人也其中人也深不能自去正風者其中人也淺合而自去其氣來柔弱不能勝真氣故自去虛邪之中人也灑淅動形起毫毛而發腠理其入深內搏於骨則為骨痹搏於筋則為筋攣搏於脈中則為血閉不通則為癰搏於肉與衛氣相搏陽勝者則為熱陰勝者則為寒寒則真氣去去則虛虛則寒搏於皮膚之間其氣外發腠理開毫毛搖氣往來行則為癢留而不去則為痹衛氣不行則為不仁刺節真邪篇
