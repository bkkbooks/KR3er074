body:
  text: 卷之二十六肺大腸部咳嗽潔咳無痰而有聲肺氣傷而不清也嗽無聲而有痰脾濕動而為痰也若咳嗽有痰而有聲者因傷肺氣動於脾濕故咳而兼嗽也脾濕者秋傷於濕積於脾也故內經曰秋傷於濕冬必咳嗽大抵素秋之氣宜清而肅若反動之則氣必上衝而為咳嗽甚則動脾濕而為痰也是知脾無留濕雖傷肺氣亦不為痰若有痰而寒少熱多故咳嗽嗽非專主乎肺病以肺主皮毛而司於外故風寒先能傷之也內經曰五臟六腑皆能使人咳非獨肺也各以其時主之而受病焉非其時傳而與之也所病不等寒燥濕風火皆能令人咳惟濕病痰飲入胃留之而不行上入於肺則為嗽假令濕在心經謂之熱痰濕在肝經謂之風痰濕在肺經謂之氣痰濕在腎經謂之寒痰所治不同各宜隨症而治之若咳而無痰者以辛甘溫其肺故咳嗽者治痰為先治痰者下氣為上是以半夏南星勝其痰而咳嗽自安枳殼陳皮利其氣而痰自下痰而能食者大承氣湯微利之痰而不能食者厚朴湯治之夏月嗽而發熱者謂之熱嗽小柴胡四兩入石膏一兩知母五錢用之冬時嗽而發寒者謂之寒嗽小青龍湯加杏仁用之然此為大例更宜隨症隨時加減量其虛實此治法之大體也丹上半日嗽多屬胃中有火用貝母石膏降胃火午後嗽多屬陰虛必用四物湯加知母炒黃柏先降其火黃昏嗽多此火氣浮於肺不宜用涼藥五味子五倍子斂而降之春嗽是春升之氣夏是火炎上最重秋是濕熱傷肺冬是風寒外束治嗽藥大概多用生薑以其辛散也咳逆非蛤粉青黛栝蔞貝母不除大概有痰者加痰藥用藥發散之後必以半夏逐其痰庶不再來治嗽痰多用粟殼不必疑但要先去病根此乃收後藥也千凡上氣多有服吐藥得瘥亦有針灸得除者宜深體悟之仲咳而脈浮者厚朴麻黃湯主之厚朴五兩麻黃四兩石膏如雞子大杏仁半升半夏半升乾薑二兩細辛二兩小麥一升五味子半升上以水一斗三升先煮小麥熟去渣納諸藥煮取三升溫服一升日三服脈沉者澤漆湯主之半夏半升紫參五錢一作紫菀澤漆三斤以東流水五斗半煮取一斗五升生薑白前各五兩甘草黃芩人參桂枝各三兩上㕮咀內澤漆汁中煮取五升溫服五合至夜盡丹感冒風寒咳嗽者行痰開腠理二陳湯加麻黃杏仁桔梗局三拗湯治咳嗽感冒風寒鼻塞聲重甘草不炙麻黃不去節杏仁不去皮尖上㕮咀每服五錢水一盞半姜五片煎服丹巡檢舍人夜嗽多脈大而浮三拗湯加知母黃芩生薑煎一男子五十餘歲患咳嗽惡風寒口燥干咽微痛兩手脈浮緊胸脅痞滿而數左手大於右手大概表盛裡虛問其人平日好嗜酒肉素有食積後因汗房勞又往來涉寒水且冒微雨又忍飢歸後繼以飽食酒肉而病先用人參每帖四錢麻黃根節一錢半與二三服咳嗽止惡風寒除後改用厚朴枳實陳皮青皮栝蔞仁半夏為丸與二十餘帖用人參湯送下痞滿亦散而愈二十三嬸感冷嗽上有痰麻黃一錢蒼朮二錢栝蔞陳皮半夏各三錢枳殼炒三錢黃芩一錢桔梗二錢木通一錢甘草炙些上分二帖加姜三片煎服一婦人患嗽頭痛身膈痛陳皮二錢人參川芎麻黃枳殼各一錢分二帖水煎服婦人患身疼嗽而食少白朮黃芩芍藥各三錢川芎二錢木通紫蘇各一錢半甘草五分上四帖熱服夫咳之為病有一咳即出痰者脾勝濕而痰滑也有連咳十數不能出痰者肺燥勝痰濕也滑者宜南星半夏皂角灰之屬燥其脾若利氣之劑所當忌也澀者宜枳殼紫蘇杏仁之屬利其肺若燥肺之劑所當忌也治風痰嗽其脈弦面青四肢滿悶便溺閉澀必多躁怒宜以水煮金花丸主之南星半夏各一兩生用天麻五錢雄黃一錢白麵三兩寒水石一兩煅上為末水丸如桐子大每服五七十丸至百丸煎漿水沸下藥煮令浮為度淡漿水浸之以薑湯下羅化痰玉壺丸治風痰吐逆頭痛目眩嗽嘔吐天南星半夏生各一兩天麻半兩白麵三兩上為細末滴水為丸如桐子大每服三十丸水煮令藥浮漉出放溫薑湯下潔天麻丸治風痰天麻半夏天南星各一兩雄黃少許白麵三兩上以水丸每服五七十丸至百丸先煎水沸下丸煮十餘沸後用薑湯下食前小黃丸治熱痰咳嗽脈洪面赤煩躁心痛唇口乾燥多喜笑天南星洗半夏各一兩黃芩一兩半上為細末薑汁浸蒸餅為丸如桐子大每服五十丸至七十丸白朮丸治濕痰咳嗽脈緩面赤肢體沉重嗜臥不收腹脹而食不消天南星半夏各一兩白朮一兩半上為細末湯浸蒸餅為丸桐子大每服五七十丸薑湯下食後局方防己丸亦可用玉粉丸治氣痰咳嗽脈急面白氣上喘促淅灑寒熱悲愁不樂天南星半夏各一兩陳皮去白二兩上為細末湯浸蒸餅為丸如桐子大每服五七十丸人參生薑湯下食後服薑桂丸治寒痰咳嗽脈沉面色黧黑小便急痛足寒而逆心多恐怖天南星半夏各一兩官桂一兩去皮上為細末蒸餅為丸如桐子大每服五七十丸生薑湯下食後治嗽加減法如心下痞悶加枳實五錢如身熱甚加黃連五錢如體重加茯苓白朮各一兩如氣逆上者加苦葶藶五錢如氣促者加人參桔梗各五錢如氣浮腫者加郁李仁杏仁各五錢如大便秘者加大黃五錢羅太白丹治三焦氣澀破除余痰止嗽開胃半夏洗天南星炮寒水石炮白礬枯白附子炮乾薑炮各等分上為細末麵糊丸如桐子大每服三十丸溫生薑湯下食後世法制半夏用大半夏不拘多少湯洗七次去臍焙乾再洗七遍用米泔浸一日夜取出控干每半夏一兩用白礬一兩半研溫水化浸上留水兩指許頻攪冬月宜暖處頓放浸五日夜取出焙乾用鉛白霜一錢溫水化又浸二日夜通七日盡取出再用漿水於慢火內煮勿令滾候漿水極熟取出焙乾每服一二粒食後細嚼生薑湯下上九方治濕痰滑而易出潔古所謂南星半夏勝其痰而咳嗽自安者是也羅人參款花散治肺胃虛寒久嗽不已咽膈滿悶咳嗽痰涎嘔逆噁心腹脅脹滿腰背倦痛或虛勞冷嗽及遠年近日一切嗽病諸藥不效並皆治之款冬花人參五味子紫菀桑白皮各一兩杏仁八錢木香檳榔紫蘇葉半夏湯泡各五錢上為細末煉蜜為丸如雞頭仁大每服一丸食後細嚼淡薑湯送下紫蘇半夏湯治喘嗽痰涎寒熱往來紫蘇半夏紫菀茸陳皮五味子各五錢桑白皮一兩半杏仁去皮尖一兩麩炒黃上為粗末每服三錢生薑三片水煎日三服垣紫蘇飲子治脾肺虛實寒涎痰咳嗽紫蘇葉桑白皮青皮五味子麻黃杏仁陳皮人參半夏甘草炙各五錢上㕮咀每服五錢水二盞姜三片煎至七分溫服本治肺感風寒作嗽紫蘇散紫蘇桑白皮五味子杏仁麻黃甘草青皮各等分上為細末每服二錢水一盞煎七分溫服治嗽杏參飲杏仁款冬花前胡半夏制五味子麻黃柴胡桑白皮人參桔梗各等分上為細末每服三錢水一盞半生薑五片同煎七分通口服上利肺氣藥紫蘇麻黃表多者宜之潔利脅丸主胸中不利痰涎咳嗽喘促利脾胃壅滯調秘泄藏推陳致新化食治利膈氣之妙品也木香檳榔藿香各一錢甘草炙五錢人參當歸厚朴各三錢大黃酒炒枳實各一錢上為細末水丸桐子大每服三五十丸衍有婦人患肺熱久嗽身如炙肌瘦將成肺勞以枇杷葉木通款花紫菀杏仁桑白皮各等分大黃減半各如常制治訖同為末蜜丸如櫻桃大食後夜臥各含化一丸未終一劑而愈上利肺氣藥加大黃脾胃壅滯者宜之世杏仁煎治哮嗽寒熱喜少嗔多面色不潤食少脈強緊杏仁一兩去皮尖用童便浸一日一換夏月一日三換浸半月取出洗淨焙乾研令極細每服一棗大用薄荷一葉白蜜少許水一盞煎食後服甚不過兩劑永瘥千用童便浸杏仁七日漉出洗淨研成泥別入甕瓶中換小便煎成膏熱水下二錢瘥圖用童便一升浸杏仁三升春夏七日秋冬二七日並皮尖研細濾取汁煮令魚目沸候軟如麵糊即成用柳篦攪勿令著底即以粗布攤干為丸每服三五十丸茶酒任下丹肺郁痰嗽睡不安者貝母杏仁上為細末砂糖入薑汁蒸餅丸含化上童便浸杏仁利肺氣潤劑也津液枯少者宜之潤下丸治氣實有痰又治積氣並大腸經氣滯痰嗽陳皮去白八兩甘草食鹽各五錢上以水拌令鹽水乾焙燥為末蒸餅為桐子大或為末白湯點服立效衍有人患氣嗽將期或教以橘皮生薑焙乾神麯等分末為丸如桐子大食後夜以米飲服三五十丸兼舊患膀胱氣緣服此皆愈潔玉粉丸治氣痰脈澀方見前局桔梗湯除痰下氣胸脅脹滿痰逆噁心飲食不進陳皮去白半夏薑製桔梗炒各十兩枳實去穰麩炒黃三兩上末每服二錢水一盞生薑三片同煎七分去渣服上用陳皮枳實氣充形實者宜之寒者加薑桂些少後二方有星半痰澀甚者忌服夫形肥或有汗或脈緩體重嗜臥之人咳者脾濕勝也形瘦或夏月無汗或脈澀之人咳者肺燥勝也濕者宜白朮蒼朮茯苓之屬燥之是也燥者宜杏仁栝蔞之屬潤之是也白朮湯治咳嗽體重嗜臥脈緩前濕條白朮丸亦治此病白朮茯苓半夏各等分上為粗末作五分或半兩甚者加水二盞姜七片煎至一半取清水調神麯末二錢服之病甚者玉壺丸大妙永除根白朮散治夏暑大熱或醉飲冷酒痰濕不止膈不利白朮茯苓黃芩半夏各等分上為粗末每服五錢水二盞姜三片同煎去渣調陳皮神麯末各一錢食後服保酒性大熱不宜大飲蓋酒味熱而引飲冷與熱凝於胸中不散而成濕故痰作矣甚者吐之後與五苓甘露勝濕去痰之劑上三方白朮燥濕半星勝痰形肥痰滑者宜之潔防風丸治痰嗽胸中氣不清利者枳實丸亦治此症防風枳殼炒各半兩白朮一兩上為末煨飯丸每服六七十丸薑湯下丹仁十二孺人虛而有濕痰膈上有熱白朮滑石各一兩陳皮木通五錢黃芩三錢甘草炙一錢分六帖水煎服七九嬸嗽有痰蒼朮一兩半夏一錢半陳皮半錢甘草炙二分茯苓五分桔梗二分姜三片煎服治濕痰蒼朮三錢白朮六錢香附一錢芍藥酒二錢上蒸餅丸治肥人濕痰苦參半夏各一錢半白朮二錢半陳皮一錢上作一服姜三片竹瀝與水共一盞煎食遠吞三補丸十五丸羅皂角化痰丸治癆風心脾壅滯痰涎盛多喉中不利涕唾稠黏咽塞吐逆不思飲食或時昏瞶枳殼炒二兩天南星炮白附子炮半夏湯洗七次白礬枯人參去蘆赤茯苓去皮各一兩皂角木白皮酥炙一兩上為細末生薑汁麵糊為丸如桐子大每服三十丸溫水下食後丹白龍丸治酒積有痰半夏滑石茯苓白礬枯各等分上為末神麯糊為丸上七方白朮蒼朮白附子半夏燥濕枳殼陳皮利氣形肥痰澀者宜之宋徽宗妃苦痰面浮如盤李醫用蚌粉新瓦上炒令通紅放地上出火毒每半兩加青黛少許同淡齏水滴入麻油數點調服而愈本草治喘嗽汗多者忌用草烏五錢麻黃三錢上為末每服三大錢蘿蔔一個同煮令熟只吃蘿蔔妙千杏仁煎潤肺丸以上二方見燥痰條丹潤肺散貝母一兩栝蔞仁半兩青黛五錢上為末姜蜜調成膏噙抑痰丸栝蔞仁一兩半夏二錢貝母三錢上為末炊餅丸如麻子大咳逆上氣痰飲心痛海蛤燒為粉研極細過數日火毒散用之栝蔞仁帶穰同研上為丸如麻子大白湯下楊文治痰嗽利胸膈方栝蔞肥大者割開去子洗淨槌破刮皮細切焙乾半夏四十九個湯洗十遍槌破焙乾為末用洗栝蔞實熱水並穰同熬成膏為丸如桐子大生薑湯下二十丸千溫脾湯治食飽則咳甘草四兩大棗二十枚上二味㕮咀水五升煮水二升溫分三服若咽中痛而聲鳴者加乾薑一兩聖甘膽丸治吃醋搶喉因成咳嗽不止諸藥無效用甘草二兩去赤皮作二寸段中半掰開用豬膽汁五枚浸三日取出火上炙乾為細末煉蜜丸每服四十丸茶清吞下臥服神效曾有人患此諸藥不效用此方一服愈丹飲酒傷肺痰嗽以竹瀝煎入韭汁就吞栝蔞仁杏仁黃連丸治酒嗽青黛栝蔞仁用蜜姜丸含化散肺毒也食停積嗽非青黛栝蔞實不除有食積人面青白黃色不常面上如蟹爪路一黃一白者是也清金丸治食積嗽方見虛實條栝蔞丸治食痰壅滯喘咳栝蔞實半夏山楂神麯各等分為末栝蔞穰水為丸竹瀝薑湯送下又方治食積痰嗽杏仁蘿蔔子各二兩為末粥丸服食積痰作嗽發熱者半夏南星栝蔞實蘿蔔子為佐青黛石鹼為使隨症加減丸服之肺痿專在養肺養氣養血清金仲生薑甘草湯治肺痿咳吐涎沫不止咽燥而渴生薑五兩人參二兩甘草四兩大棗十五枚上四味以水七升煮取三升分溫三服炙甘草湯治肺痿涎唾多心中溫溫液液者用甘草一味以水三升煮半升分三溫服桂枝去芍藥加皂莢湯治肺痿吐涎沫桂枝生薑各三兩甘草一兩大棗十枚皂莢十枚去皮弦炙焦上五味以水七升微微火煮取三升分三溫服肺痿吐涎沫而不咳者其人不渴必遺尿小便數所以然者以上虛不能制下故也此為肺中冷必眩多涎吐甘草乾薑湯以溫之若服湯口渴者屬消渴甘草炙四兩乾薑二兩炮上㕮咀以水三升煮取一升五合去渣分溫再服上治肺痿症或咳沫或咳血今編咳沫者入此門咳血者入咳吐血門熱在上焦者因咳為肺痿肺痿之病從何得之師曰或從汗出或從嘔吐或從消渴小便利數或從便難又被快藥下利重亡津液故得之脈咳而口中自有津液舌上胎滑此為浮寒非肺痿也咳而上氣煩躁者為肺脹仲景云咳而上氣此為肺脹脈浮大者越婢加半夏湯主之又云肺脹咳而上氣煩躁而喘脈浮者心下有水小青龍湯加石膏主之二方並見喘門丹肺脹而咳者用訶子青黛杏仁訶子能治肺氣因火傷極遂成郁遏脹滿不得眠一邊取其味酸苦有收斂除火之功佐以海石香附栝蔞仁青黛半夏曲姜蜜調噙之香附用童便浸三日脈郁痰嗽睡不安宜清化丸貝母杏仁為末砂糖入薑汁蒸餅為丸噙化清化丸方見火熱條肺脹而嗽或左或右不得眠此痰夾瘀血礙氣而病宜養血以流動乎氣降火疏肝以清痰四物湯加桃仁訶子青皮竹瀝之類如血礙氣作嗽者桃仁大黃薑汁丸服一法灸但可一邊眠者可左側者灸右足三陰交可右側者灸左足三陰交立安經治氣嗽嗽久者亦主之生訶子一枚含之咽津瘥瘥後不知食味煎檳榔湯服之便有味丹定喘劫方訶子百藥煎荊芥各等分為末姜蜜丸含化治嗽劫方五味子半兩甘草二錢半五倍子一錢風化硝為末蜜丸干含化世治痰嗽並喘白礬飛五倍子等分為末每二錢豬肝蘸藥臨臥服本化痰涎方明礬二兩枯白殭蠶半兩炒去絲上為細末生研薄荷令爛和丸如綠豆大每服二十丸薄荷湯下日三服治遠年近日喘嗽用皂角不蛀者三大莖銼去黑皮切開去子每子倉內入巴豆肉一粒合就麻皮縛定用生薑自然汁和蜜塗令周匝慢火炙之又塗又炙以焦黃為度劈開去巴豆以好明礬一兩枯過蓖麻七個薑汁和蜜塗炙前三味為末卻以杏仁二兩去皮尖研成膏與前藥和勻每服一錢用柿餅炙過候冷蘸藥細嚼臨臥服忌魚鮓鮭鯗油麵酒米醋煎爆熱毒等物上訶子五味五倍白礬例丹溪云黃昏嗽者火浮於肺酸味斂而降之是也羅九仙散治一切咳嗽桑白皮人參桔梗阿膠五味子烏梅款冬花各一兩貝母半兩粟殼八兩去蒂蜜炒黃上為細末每服三錢白湯點服嗽住止後服款花清肺散治咳嗽喘促胸膈不利不得安臥人參去蘆甘草炒白礬枯烏梅和核杵碎款冬花各一兩甜葶藶生用一錢粟殼醋炒四兩上為細末每服二錢溫米飲湯調服食後忌油膩物多言語損氣人參清肺湯治男子婦人肺胃虛寒咳嗽氣急胸膈咽塞腹脅脹滿迫塞短氣喜欲飲冷咽嗌隱痛及療肺痿勞嗽吐血腥臭乾嘔煩熱聲音不出肌肉消瘦倦怠減食烏梅地骨皮人參甘草炙阿膠炮杏仁去皮炒桑白皮知母粟殼去頂蒂炒各一兩上㕮咀每服三錢水一盞半入烏梅一個同煎至一盞去渣溫服食後臨臥人參款花散治咳嗽久不愈者人參款冬花各五錢知母貝母半夏各三錢粟殼一兩炒黃色上為粗末每服五錢烏梅同煎臨臥服安肺散治痰嗽不問新舊麻黃二兩去節甘草二兩炒御米殼四兩去蒂炒黃色上為末每三錢水一盞入烏梅一個煎七分去渣溫服臨臥下人參理肺散治喘嗽不止麻黃去節炒黃色當歸木香各一兩御米殼三兩炒人參二兩杏仁二兩麩炒上㕮咀每服四錢水煎上御米殼烏梅例收澀藥也世治嗽貝母去心略炒知母去毛各一兩巴豆霜十四粒為末和勻老生薑切如錢厚兩面蘸藥末臥嚼嚼時開口勿咽千治咳嗽胸膈滿多喘上氣生薑汁一升半砂糖五兩上二味煎薑汁減半納糖更煎服咳嗽上氣厥在胸中過在手陽明太陰全文見治虛實法海肺咳喘息而有音甚則吐血麻黃湯太陽咳而遺矢赤石脂禹餘糧湯桃仁湯不止用豬苓分水散心咳心痛喉中介介鯁狀甚則咽喉痹用桔梗湯小腸咳咳而失氣氣與咳俱失芍藥甘草湯與夏脈不及病同蓋小腸為心之府故也肝咳兩脅下痛甚不可以轉轉則兩胠下滿小柴胡湯仲景云咳引脅痛為懸飲宜十棗湯丹溪云咳引脅痛宜疏肝氣用青皮枳殼香附子等實者白芥子之屬膽咳咳嘔膽汁黃芩加半夏生薑湯脾咳右脅下痛陰陰痛引肩背甚則不可以動動則咳劇升麻湯胃咳嘔嘔甚則長蟲出烏梅丸腎咳腰背相引而痛甚則咳涎麻黃附子細辛湯膀胱咳遺溺茯苓甘草湯三焦咳腹滿不欲飲食此皆聚於胃關於肺使人多涕唾而面浮腫氣逆錢氏異功散素咳嗽煩冤者是腎氣之逆也示從容篇一陽發病少氣善咳善泄夏脈不及則令人上見咳唾下為氣泄全文見治虛實法凡咳嗽面赤胸腹脅常熱惟於足乍有涼時其脈洪者熱痰在胸膈也宜小陷胸湯礞石丸之類清膈降痰甚而不已者宜吐下其痰熱也面白悲嚏或脅急脹痛或脈沉弦細遲而咳者寒飲在胸腹也宜辛熱去之世小陷胸湯治咳嗽膈有熱痰胸脅腹常熱者神效方見傷寒丹黃連化痰丸黃連吳茱萸一錢半煮去沫陳皮五錢半夏一兩半上為末麵糊丸如綠豆大每服百丸生薑湯下上黃連半夏治痰嗽例青礞石丸去痰或痞痛經絡中有痰皆能治之青礞石硝煅五錢半夏二兩風化硝二錢陳皮七錢半白朮一兩茯苓七錢半黃芩半兩上炒神麯姜糊丸又方礞石丸治痰礞石半兩煅半夏七錢半南星茯苓各五錢風化硝二錢上為末神麯糊丸定嗽化痰方黃芩一兩半酒洗滑石半兩貝母南星各一兩風化硝二錢半白芥子五錢去殼上為末湯浸蒸餅丸丹溪云脅下痰非白芥子不能除上風化硝佐礞石茯苓半夏治痰嗽例丹溪云礞石丸重在風化硝潔小黃丸治咳嗽面赤煩躁脈洪方見前濕痰條羅人參半夏丸化痰墜涎止嗽定喘或風痰茶痰食痰一切痰逆嘔吐厥頭痛或風氣偏正頭風疼或壅頭目昏眩耳聾鼻塞咽乾胸膈不利人參茯苓天南星各半兩半夏乾薑白礬寒水石各一兩蛤粉二兩薄荷五錢藿香二錢半上為細末水糊丸如桐子大每服三十丸生薑湯下食後日三服金珠化痰丸治痰熱安神定志除頭痛眩暈心怔忡恍惚胸膈煩悶涕唾稠黏痰實咳嗽咽膈不利生龍腦研細半兩皂莢仁炒黃一兩天竺黃一兩金箔二十片為衣白礬枯二兩半夏薑汁製四兩上皂角仁半為末與諸藥同拌勻生薑自然汁為丸如桐子大每服三十丸生薑湯下食後臨臥人參清金丸治熱止嗽消痰定喘柴胡人參各一兩黃芩甘草炙半夏各七錢麥門冬青黛陳皮各二錢五味子二十一粒上為細末水麵糊為丸如桐子大每服三十丸溫白湯下食後垣脾肺受寒痰嗽用藥法難經云肺太過則外症面白善嚏悲愁不樂欲哭其內症喘咳上暍逆氣煩心胸滿煩熱夜則涕出多嚏鼻塞不通肺金大實以子助母也心脾肺皆受寒邪涎出口甘水反侮土寡於畏也腹中大寒病名曰寒中痰白作泡肺中氣虛而為大寒子助母也當於肺中瀉腎水非辛熱之藥不退也口甘涎沫者胃中寒而不和以辛甘熱去之飲酒者多有此反化半夏溫肺湯治心腹中脘痰水冷氣心下汪洋嘈雜常多唾口中清水自出脅肋急脹痛不欲食此胃氣虛冷所致其脈沉弦細遲旋覆花人參細辛桂心甘草陳皮桔梗芍藥半夏制各半兩赤茯苓三分上㕮咀每服四錢姜三片煎食後服丁香半夏丸治心下停飲冷痰頭目眩暈睡臥口中多涎檳榔三錢丁香半夏各一兩細辛乾薑人參各五錢上為細末生薑汁糊為丸如桐子大每服二十丸薑湯下日三服食後羅溫胃化痰丸治膈間有寒脾胃停飲胸膈不快痰涎不已半夏炮三兩陳皮去白乾薑炮白朮焙各二兩上為細末生薑麵糊為丸如桐子大每服二十丸生薑湯下不拘時潔薑桂丸治咳嗽面黧黑足寒脈沉方見前濕痰條局胡椒理中丸治肺胃虛寒咳嗽氣急逆氣虛痞不能食嘔吐痰水款冬花去枝梗蓽茇陳皮乾薑炮良薑炒甘草炙細辛去苗胡椒各四兩白朮五兩上末煉蜜丸如桐子大每服三十丸溫湯下仲吳茱萸湯方見傷寒潔夏月嗽發寒熱者謂之熱嗽用小柴胡湯三兩加石膏七錢知母三錢治之柴胡湯方見傷寒冬月嗽而發寒熱者謂之寒嗽用小青龍湯加杏仁治之方見傷寒丹火嗽宜清金化痰丸清化丸與清金丸同用專治熱嗽及咽痛蓋苦能燥濕熱輕能治上取燈籠草葉為細末蒸餅為丸每服三五十丸燈籠草即苦耽草其結房如燈籠狀故以名之清金丸一名與點丸去肺火降膈上熱痰與清化丸同用黃芩一味炒為末水丸服痰因火動逆上作嗽者先治火次治痰用知母止嗽清肺金滋陰降火火鬱嗽用訶子海石栝蔞仁青黛半夏香附以開之喘嗽不拘老幼久近上壅等疾槐花為末滴水丸如桐子大熟水或薑湯下不拘時羅柴胡飲治虛勞羸瘦面黃無力減食盜汗咳嗽不止柴胡一兩五味子五錢地骨皮一兩半鱉甲一兩酥炙知母一兩上為細末每服二錢入烏梅二枚青蒿五葉水煎去渣服本又方治勞嗽虛症及鼻流清涕耳作蟬鳴眼見黑花一切虛症丈夫婦人皆可服少年亦不妨五味子二兩鱉甲三兩地骨皮三兩上為末煉蜜丸如桐子大空心食前溫酒或鹽湯任意服三五十丸婦人醋湯下此方乃曲江人家秘方余服之大有功效處方有理甚妙海易簡杏子湯治咳嗽不問外感風寒內傷生冷及虛勞咯血痰飲停積皆治療人參半夏茯苓細辛減半乾薑減半甘草桂枝減半芍藥五味子各等分上㕮咀每服四錢水一盞半杏仁去皮尖銼五枚姜三片煎至六分去渣溫服若感冒得之加麻黃等分若脾胃素實者用粟殼去筋膜銼碎以醋淹炒等分加之每帖加烏梅一枚煎服其效尤驗嘔逆噁心者不可用此若久年咳嗽氣虛喘急去杏仁人參倍加麻黃芍藥乾薑五味子各增一半一名小青龍湯潔古水煮金花丸治咳嗽多怒天麻丸羅氏化痰玉壺丸以上三方並見濕痰條丹搜風化痰丸人參殭蠶槐角白礬天麻陳皮去白荊芥各一兩半夏四兩汁浸辰砂半兩上為末薑汁研蒸餅為丸除辰砂為衣每四十丸薑湯下羅延壽丹治風壅痰嗽或寒痰咽膈不利天麻半兩枸杞一兩半明礬一兩半生半枯乾薑一兩半上為細末酒和成劑再用蒸餅裹定於籠內蒸熟去面搓為丸如桐子大每服三十丸溫水下食後臨臥局防風丸治風痰上攻頭痛惡心項急目眩旋暈痰涎壅滯昏憒天麻酒浸一宿甘草炙川芎洗防風各一兩硃砂五錢為衣上為末每兩作十丸硃砂為衣每服一丸荊芥湯化服茶亦得不拘時川芎丸消風壅化痰涎利咽膈清目頭痛旋暈川芎薄荷去土各七錢半桔梗半兩防風去蘆一兩半甘草三兩半上為末煉蜜為丸每兩半作五十丸每服一丸細嚼臘茶清下食後臨臥河間防風通聖散加半夏治風痰咳嗽方見癲癇千緡湯方見喘潔古治痰嗽不能飲食者厚朴湯治之方見大便秘山喘嗽白殭蠶為末薑汁清茶調服臨臥下潔治痰嗽能飲食者大承氣湯微下之方見傷寒丹陰虛咳嗽四物湯加竹瀝薑汁主之陰分嗽者多屬陰虛治之用知母止嗽勿用生薑以其辛散故也肺虛嗽甚此好色腎虛者有之人參膏以陳皮生薑佐之羅團參散治脈氣不利治咳喘止嗽紫團參款冬花紫菀茸各等分上為細末每服二錢水一盞烏梅一枚同煎七分去渣溫服食後人參款花膏治脾胃虛寒久嗽不已咽膈滿悶咳嗽痰涎嘔逆噁心腹脅脹滿腰背傷痛或虛勞冷嗽及遠年近日一切咳嗽諸藥不效者款冬花去枝人參去蘆五味子去枝紫菀去蘆桑白皮去粗枝各一兩上為細末煉蜜和丸如雞頭大每服一丸食後細嚼淡薑湯送下或一丸分作四服含化亦得食治咳嗽不瘥者黃明膠炙令半焦為末每服一錢匕人參末二錢匕用豆豉湯一盞八分蔥少許入銚子煎一兩沸後傾入蜜遇咳嗽時呷三五口本治十六般哮嗽黃明膠一兩炙馬兜鈴甘草炙半夏薑汁浸三日人參半兩杏仁去皮尖以上各一兩上為細末每服一大錢水一盞煎至七分臨臥食後服隨病有湯使為引心嗽面赤或汗流加乾葛煎早飯後服肝嗽眼淚出加烏梅一枚大米十四粒煎脾嗽不思飲食或一兩時噁心入生薑二片煎胃嗽吐逆酸水入蛤粉煎膽嗽令人不睡加茯神五分茶清調下肺嗽上喘氣急入桑白皮煎膈咳嗽出痰如圓塊生薑汁調藥嚥下勞嗽入秦艽末同煎冷嗽天曉嗽甚蔥白三寸同煎血嗽連頓不住當歸末棗子同煎暴嗽涕唾稠黏入烏梅生薑同煎產漱背胛疼痛甘草三寸黃蠟少許同煎氣嗽肚痛脹滿入青皮去白同煎熱嗽夜甚蜜一匕蔥白同煎哮嗽喉如拽鋸入半夏三枚同煎腎嗽入黃耆白飴糖同煎上件十六件般嗽痰依法煎服無不效驗此方乃京都一家專治此疾因中官厚賂方始得傳屢試有效上人參治嗽例丹有一子三十餘久瘧虛甚盜汗得嗽嗽來便熱夜甚甘草炙些白朮一錢半防風一錢黃連五分人參八分乾薑三分黃耆五分白水煎服里成人多嗽怠惰脈不數兩手脈大而長此勞症無熱白朮一錢半陳皮蒼朮茯苓各五分神麯七分炒川芎三分黃芩三分炒五味子七粒芍藥五分黃耆甘草各三分炙用生薑二片同煎陳孺人九十餘歲嗽或發或止發時有清痰寒熱作食少面虛浮淡黃色陳皮青皮白朮芍藥各五錢麻黃二錢木通乾薑黃芩各二錢半甘草炒防風各一錢分七帖五味子七粒煎三之一云補肺湯治勞嗽桑白皮熟地各三兩人參紫菀黃耆五味子各一兩上為末每服三錢水煎入蜜少許食後垣款花補肺湯治年高氣弱肌體瘦困短氣遇秋冬咳嗽大作夜間尤甚三五百聲不絕春夏稍緩黃耆半兩甘草炙一錢當歸七分佛耳草一錢款冬花二分陳皮七分丹皮三分黃柏酒浸三分蒼朮二錢曲末七分上㕮咀每三錢水煎去渣稍熱食後服清肺湯除濕熱治金火嗽黃耆四錢蒼朮防風歸身茯苓各一錢五味子三十粒陳皮一錢二分青皮五分澤瀉二錢黃柏六分上銼如麻豆每服五錢水煎去渣稍熱臨臥服瀉火補肺湯治金火嗽五六月間嗽五味子五錢黃耆二錢人參一錢甘草炙一錢陳皮去白一錢麥門冬青皮五分升麻一錢蒼朮一錢歸身一錢上銼如麻豆大每服五錢水煎去渣稍熱服上參耆術治嗽例後三方黃耆為君氣虛甚者宜之膈滿食少者忌服丹蛤蚧丸治肺臟內傷咳嗽氣急久不除漸羸瘦蛤蚧一兩炙去頭足訶子煨取肉細辛甘草炙阿膠蛤粉炒熟地麥門冬去心各五錢為末蜜丸每兩作十五丸每一丸食後含化上蛤蚧丸久嗽不愈者宜之羅大利膈丸治風痰實喘咳嗽風氣上攻牽牛四兩生用半夏湯洗木香五錢青皮去白二兩槐角檳榔大黃各三錢皂角去皮弦子酥炙各三兩上為細末生薑面為丸每服五十丸生薑湯下丹墜痰丸治痰飲枳實枳殼一兩半明礬三錢枯一半朴硝三錢風化黑牽牛半斤取頭末豬牙皂角二錢酒炒上為末蘿蔔子汁為丸每服四十丸雞鳴時服初有糞次有痰上下痰用大黃牽牛有熱者宜之世治久嗽痰積半夏二兩用江子五錢敲損同煮至半夏無白心去江子不用杏仁一兩用烏梅半兩同煮去烏梅不用止將半夏杏仁焙乾為末煉蜜丸如綠豆大量虛實服服後下痰積羅透羅丹治痰實咳嗽胸膈不利皂角酥炙去皮弦黑牽牛微炒半夏湯洗各二兩巴豆去油另研一錢大黃一兩水浸焙用杏仁麩炒去皮尖一兩上為細末生薑自然汁丸如桐子大食後生薑湯送下二十丸咳嗽甚者三四服必效丹治痰喘嗽南星二錢半夏滑石各三錢江子五粒去油輕粉少許上用皂角仁浸濃汁丸梧子大每服七十丸本治諸般痰嗽半夏薑汁浸一宿天南星白礬各半兩焰硝二錢杏仁去皮尖麩炒黃青黛各半兩豬牙皂角去黑皮並子各半兩巴豆二十一粒去殼生用上一處為末姜糊丸如綠豆大每服七丸臨臥薑湯下小兒五丸丹青金丸治食積火鬱嗽貝母知母各半兩巴豆霜五分上為末薑汁丸青黛為衣上下痰用巴豆有寒者宜之前一方但借巴豆之氣虛人亦可服潔款氣丸治久嗽痰喘肺氣浮腫青皮陳皮檳榔木香杏仁茯苓郁李仁去皮川歸廣朮馬兜鈐炮葶藶各三錢人參防己各四錢牽牛頭末二兩半上為細末薑汁麵糊丸如桐子大每服二十丸加至七十丸食後薑湯送下羅紫參散治肺氣虛咳嗽喘急胸膈痞痛腳膝微腫人參二錢半蛤蚧一對酥炙白牽牛炒甜葶藶炒木香苦葶藶炒檳榔各五錢上為末用熟棗肉丸每服四十丸煎人參湯下食後上下痰用檳榔木香佐牽牛葶藶郁李仁久嗽面浮足腫者宜之孫兆視雷道矩病吐痰頃間已及一升喘咳不已面色郁黯精神不快兆與服仲景葶藶大棗湯一服訖已覺胸中快利略無痰唾矣本治氣喘咳嗽大黃葶藶一兩淨瓦上炒上為末煉蜜丸如桐子大每服五七十丸桑白皮湯下上下痰用葶藶為效極速虛人忌用仲咳家其脈弦為有水十棗湯主之有支飲家咳煩胸中痛不卒死至一百日或一歲宜十棗湯丹伯溫年近四十滋味厚素患咳嗽有痰與通神丸神術丸和勻食前生薑湯下五六十丸後以津咽小胃丹十五丸日服六服上十棗湯下痰仲景法也虛人審之丹溪變十棗為小胃丹而少服徐徐法也脈咳而時發熱脈卒弦者非虛也此為胸中寒實所致也當吐之咳家其脈弦欲行吐藥當相人強弱而無熱乃可吐之其脈沉者不可發汗子和稀涎散三聖散仲景瓜蒂散以上三方並見治法門上吐熱痰法輕者但用芎茶梔仁蘿蔔子薑汁入酸齏汁探吐之局碧霞丹方見治法門本治遠年近日哮嗽妙方砒面海螵蛸各一錢上三味為末水調作餅子慢火炙黃再研令細每服一字用井花水調一大呷空心服良久吐出為度小兄加減與之忌食毒物上吐寒痰法丸用藜蘆瓜蒂吐不透者用附尖神效子和常仲明病寒熱往來時咳一二聲面黃無力懶思飲食夜多寢汗日漸瘦削諸醫作虛損治之用二十四味燒肝散鹿茸牛膝補養二年口中痰出下部轉虛戴人斷之曰上實也先以湧劑吐痰二三升次以柴胡飲子降火益水不月餘復舊此症何名乃經中雲二陽病也二陽之病發心脾不得隱曲心受之則血不流故女子不月脾受之則味不化故男子少精此二症名異而實同仲明之病味不化也馳口鎮一男子年二十餘歲病勞嗽數年其聲欲出不出戴人問曾服藥否其人曰家貧未嘗服藥戴人曰年壯不妄服藥可治先以苦劑湧之次服舟車浚川丸大下之又服重劑果瘥一田夫病勞嗽一湧一泄已減大半次服人參補肺湯臨臥更服檳榔丸以進食上吐下兼施以攻其痰也本治勞嗽青黛三錢辰砂雄黃白礬信各一錢生用上併為末淡豆豉一百粒湯浸去殼研如膏入前五味丸如桐子大每服一丸臨臥冷茶清下治遠年近日喘嗽蟬蛻一兩去頭足五靈脂生砒生雄黃生杏仁去皮尖各五錢輕粉一兩淡豆豉四十九粒馬兜鈴生一兩上研除出輕粉另研余為末用生薑葶藶自然汁合輕粉諸藥為丸如小彈大每服一丸臨臥細嚼生薑湯送下上用信劫痰例蓋為寒濕痰設也運氣咳有二一曰火經云少陽司天之政初之氣候乃大溫其病氣拂於上咳逆二之氣火反郁白埃四起其病熱鬱於上咳逆三之氣炎暑至民病咳終之氣風乃至其病陽氣不藏而咳是也二曰燥熱經云少陰司天之政水火寒熱持於氣交民病咳喘三之氣大火行寒氣時至民病咳喘此上熱下燥為咳喘也終之氣燥令行餘火內格咳喘此外燥包熱在內喘咳也本治諸嗽久不瘥貝母湯貝母一兩去心薑製黃芩半兩乾薑生一兩五味子陳皮各一兩桑白皮半兩半夏柴胡桂心各一兩木香甘草各一分上為粗末每服五錢水一盞半加杏仁七個去皮尖生薑七片煎去渣熱服有姓蔣者其妻積年嗽制此方授之一服瘥以治諸般嗽悉愈上方有寒有熱有收有散諸嗽通用也素黃帝問曰肺之令人咳何也岐伯對曰五臟六腑皆令人咳非獨肺也帝曰願聞其狀岐伯曰皮毛者肺之合也皮毛先受邪氣邪氣以從其合也此邪從外受之王注云邪謂寒氣其寒飲食入胃從肺脈上至於肺則肺寒寒邪從外受也肺寒則外內合邪因而客之則為肺咳所謂肺先受邪也五臟各以其時受病王注云時謂王月也非其時各傳以與之人與天地相參故五臟各以治時肝治春心治夏脾治長夏肺治秋腎治冬也感於寒則受病微則為咳甚則為泄為痛乘秋則肺先受邪乘春則肝先受之乘夏則心先受之乘至陰則脾先受之乘冬則腎先受之帝曰何以異之岐伯曰肺咳之狀咳而喘息有音甚則吐血取太淵穴也心咳之狀咳則心痛喉中介介如梗狀甚則咽腫喉痹取大陵穴也肝咳之狀咳則兩脅下痛甚則不可以轉轉則兩胠下滿取太衝穴也脾咳之狀咳則右脅下痛陰陰引肩背甚則不可以動動則咳劇取太白穴也腎咳之狀咳則腰背相引而痛甚則咳涎取太谿穴也帝曰六腑之咳奈何安所受病岐伯曰五臟之久咳乃移於六腑脾咳不已則胃受之胃咳之狀咳而嘔嘔甚則長蟲出取三里穴也肝咳不已則膽受之膽咳之狀咳嘔膽汁取陽陵泉穴也肺咳不已則大腸受之大腸咳狀咳而遺矢取巨虛上廉也心咳不已則小腸受之小腸咳狀咳而失氣氣與咳俱失取巨虛下廉穴也腎咳不已則膀胱受之膀胱咳狀咳而遺溺取委中穴也久咳不已則三焦受之三焦咳狀咳而腹滿不欲食飲此皆聚於胃關於肺使人多涕唾而面浮腫氣逆也取支溝穴也帝曰治之奈何岐伯曰治臟者治其俞治腑者治其合浮腫者治其經見咳論丹治嗽灸天突肺俞二穴泄火熱瀉肺氣千嗽灸兩乳下黑白際各百壯即瘥又以蒲當乳頭周匝圍身令前後正平當脊骨下解中灸十壯又以繩橫量口中折繩從脊灸繩兩頭邊各八十壯三報三日畢兩邊者是合度玉治咳嗽身柱三分瀉三吸至陽三分補三呼不已再取後穴肺腧寸一分沿皮向外一寸半瀉六吸寒痰紅痰俱是虛補實瀉又法風門一分沿皮向外一寸半心咳嗽喘滿氣急不食容顏黧黑鼻流清涕風門沿皮向外二寸半補之巨闕三寸三分瀉之太淵五分瀉之期門平之下脘五分瀉之亶中灸七壯中脘三寸瀉之絕骨三寸半退熱妙穴也支溝透間使兩脅脹滿妙穴也婦人咳嗽寒熱往來風寒嘔逆勞疸中滿喘急風門沿皮一寸半治感冒風寒太淵五分治咳嗽中脘三寸治嘔逆使氣往來為效絕骨曲池各一寸半治寒嗽血膈勞疸間使透支溝治中喘滿上氣甲咳逆上氣舌乾脅痛心煩肩寒少氣不足以息腹脹喘尺澤主之咳乾嘔煩滿俠白主之咳上氣喘不得息暴痹內逆肝肺相搏鼻口出血身脹逆息不得臥天府主之咳逆上氣喘不得息嘔吐胸滿不得飲食輸府主之咳逆上氣涎出多吐呼吸喘悸不得安彧中主之胸滿咳喘不得息嘔吐煩滿不得飲食神藏主之咳逆上氣魄戶及氣舍主之咳逆上氣噫嘻主之胸脅搘滿不得俯仰飲食不下咳唾沫膿周榮主之咳而泄不欲食者商丘主之悽悽寒咳吐血逆氣入心痛手陰郄主之咳而胸滿前谷主之咳逆上氣吐沫天容及行間主之咳逆不止三焦有水氣不能食維道主之咳面赤熱支溝主之咳逆上氣咽喉癰腫呼吸短氣喘息不通水突主之一作天突咳上氣喘暴喑不能言及舌下挾縫青脈頸有大氣喉痹咽中乾急不得息喉中鳴翕翕寒熱項痛肩痛胸痛腹皮熱衄氣短鯁心痛隱疹頭痛麵皮赤熱身肉盡不仁天突主之咳逆上氣喘不能言華蓋主之成無己云咳者謦咳之咳俗謂之嗽者是也肺主氣形寒飲冷則傷之使氣上而不下逆而不收衝擊膈咽令喉中淫淫如癢習習如梗是令嗽甚者續續不已連連不息坐臥不安言語不竟動引百脈咳聲聞四近矣謦枯鼎切咳聲也脈肺痿咳唾咽燥欲飲水者自愈自張口者短氣也丹咳嗽肺脹壅遏不得眠者難治仲人嗽十年其脈弱者可治實大數者死其脈虛者必苦冒其人本有支飲在胸中故也治屬飲家上氣面浮腫肩息其脈浮大不治又加利尤甚脈浮短者其人肺傷諸氣微少不過一年死法當嗽也咳嗽羸瘦脈形堅大者死咳而脫形身熱脈小堅急以疾是逆也不過十五日死全文見診脈上氣脈數者死謂其形損故也咳嗽脈沉緊者死浮直者生浮軟者生小沉伏匿者死丹咳嗽口燥咽乾有痰不用半夏用栝蔞貝母飲水者不用栝蔞恐泥膈不快乾咳嗽乾咳嗽者無痰有聲是也此症本於氣澀澀微者連咳十數聲方有痰出澀甚者雖咳十數聲亦無痰出是為乾咳嗽也丹乾咳嗽極難治此係火鬱之症乃痰鬱其火邪在中用苦桔梗以開之下用補陰降火之劑不已即成勞倒倉法好此不得志者有之宜用補陰方四物湯加竹瀝炒柏之類海甘桔湯此仲景少陰咽痛藥也孫真人治肺癰吐膿血用生甘草加減二十餘條甘桔湯方用桔梗三兩甘草一兩白水煎服咳逆氣者加陳皮咳嗽者加貝母知母咳發渴者加五味吐膿血者加紫菀肺痰者加阿膠面目腫者加茯苓嘔者加生薑半夏少氣者加人參麥冬膚痛者加黃耆目赤者加梔子黃連咽痛者加鼠黏子竹茹聲不出者加半夏桂枝疫毒頭腫者加鼠黏子大黃芒硝胸痛膈不利者加枳殼心胸痞者加枳實不得眠者加梔子發狂者加防風荊芥酒毒者加葛根陳皮一中年婦人乾咳寸脈滑動似豆狀余皆散大不浮左大於右每五更心躁熱有汗但怒氣則甚與桔梗不開諸藥不效遂以石膏香附為君芩連青黛門冬栝蔞實陳皮炒柏歸梗為臣五味砂仁川芎紫菀佐之凡二十餘帖而安潔古蜜煎生薑湯蜜煎陳皮湯與燒生薑胡桃方皆治無痰而嗽者以辛甘潤其肺也如但使青皮藥皆宜去白本草云陳皮味辛理上氣去痰氣滯塞青皮味苦治下氣二味俱用散三焦氣也故聖惠法治云陳皮去穰穰不除即生痰麻黃髮汗節不去則止汗本補肺法地黃二斤生淨洗杏仁二兩生薑蜜各四兩上搗如泥入瓦盆中置飯上蒸五七度每五更挑三匙嚥下千治久嗽方白蜜一斤生薑二斤取汁上二味先秤銅銚知斤兩訖納蜜復秤如數次納薑汁以微火煮令薑汁盡惟有蜜斤兩在則止旦服如棗大含一丸日三服忌一切雜食咳嗽喉中作聲一男子五十餘歲病傷寒咳嗽喉中聲如鼾與獨參湯一服而鼾聲除至二三帖咳嗽亦漸退凡服二三斤病始全愈梅治久患㗇呷咳嗽喉中作聲不得眠取白前搗為末溫酒調二錢匕衍義云白前保定肺氣仲咳而上氣喉中水雞聲射干麻黃湯主之射干三兩麻黃生薑各四兩細辛紫菀款冬花各三兩大棗七枚五味子半夏各半升上九味以水一斗二升先煮麻黃兩沸去上沫納諸藥煮取三升分溫三服千白前湯咳逆上氣身體浮腫短氣腫滿旦夕倚壁不得臥喉中水雞鳴白前紫菀半夏大戟各三兩上㕮咀以水一斗浸一宿明旦煮取三升分三服素陰爭於內陽擾於外魄汗未藏四逆而起起則熏肺使人喘鳴陰陽別論起居如故而息有音者此肺之絡脈逆也脈絡不得隨經上下故留經而不行絡脈之病人也微故起居如故而息有音也逆調論督脈生病其上氣有音治其喉中央在缺盆中者天突穴也其病上衝喉者治其漸漸者上俠頤也王注謂天迎穴甲咳喉中鳴唾血大鐘主之胸脅支滿不得俯仰㿉癰咳逆上氣喉咽喝喝有聲太谿主之咳逆上氣咽喉喝喝喘息扶突主之暴嗽千治暴熱嗽方杏仁紫蘇子一升陳皮一兩柴胡四兩上㕮咀以水一斗煮三升分三服山暴嗽白蜆殼洗淨研細粥飲下本治暴嗽砒霜一錢白礬一兩飛過細研上先將砒霜安放茶盞內卻將白礬末鋪蓋火煅為末烏梅肉丸如綠豆大硃砂為衣每服二丸紫蘇湯下千治暴嗽百部藤根搗自然汁和蜜等分沸煎成膏咽之久嗽丹肺受風寒久嗽非此不能除南星款花鵝管石佛耳草雄黃為末拌艾以姜一厚片留舌上次用艾上燒之須令煙入喉中一方無佛耳草有鬱金又方鵝管石雄黃各一分半另為末款花沸耳草各一分半另為末卻用紙一幅方方闊四五寸以雞子清塗其中央四旁各懸一寸許不塗然後以鵝管石雄黃摻於雞子清上又以款花佛耳草末摻其上覆之又以一箭筋從不塗紙旁捲起為一紙筒用糊黏牢其旁抽箭箸出焙乾用時將一紙筒含在口一頭火燒以口吸菸令滿咽之咽至燒筒盡為度卻吃茶二三口壓之崔療久嗽熏法每旦取款花好雞子少許蜜拌花使潤納一升鐵鐺中又用一瓦碗鑽一孔孔內安小竹筒或筆管亦得其筒稍長置碗鐺相合及插筒處皆麵糊塗之勿令泄氣鐺下著炭火少時款冬煙自竹管出以口含筒吸取咽之如胸中稍悶須舉頭即將指頭捻竹筒頭勿令漏煙氣出及煙盡止凡如是五日一為之至六日則飽食羊肉餛飩一頓永瘥一法不用鐺碗用有嘴瓦瓶燒藥蓋住瓶口卻以口於瓶嘴吸菸咽之尤捷潔枳殼湯治久痰嗽胸膈不利者多上焦發熱枳殼炒三兩桔梗二兩黃芩二兩半上為細末每早取二兩半水三盞煎至一盞日作三服午時一服申時一服臥時一服三日七兩半服盡又服半夏湯生半夏湯用半夏薑製切片每三錢半水盞半姜五片煎至一盞食後服一日二三服二三日服了再服枳殼丸盡其痰為度論曰先消胸中痰氣後去膈上痰再與枳朮丸謂首尾合治盡消其氣令痰不復作也丹久嗽丸子海蛤粉研細膽星臣杏仁臣訶子佐青黛佐皂角莢使上為末薑汁丸如桐子大薑湯下久嗽乃積痰久留肺脘黏滯如膠氣不能升降或挾濕與酒而作香附童便浸殭蠶炒海蛤粉栝蔞仁蜂房杏仁薑汁竹瀝神麯各等分上為末蜜調噙化謝老人形實夏月無汗成久嗽痰半夏薑製紫蘇葉各一兩上二味入莎末蜆殼末神麯末以栝蔞穰桃仁半兩和丸先服三拗湯三帖方服此丸子男子五十歲舊年因暑月入冷水作勞患瘧後得痰嗽次年夏末得弦脈而左手虛叩之必汗少而有痰身時時發熱痰如稠黃膠與下項方藥仍灸大椎風門肺俞五處半夏一兩白朮七錢茯苓六錢黃芩陳皮桔梗枳殼石膏煅各半兩殭蠶炒二錢半五味子一錢半上用神麯糊丸薑湯下三十丸先與三拗湯加黃芩白朮二帖夜與小胃丹十丸以攪其痰潔古款氣丸治久嗽浮腫羅氏紫參散用蛤蚧衍義云蛤蚧治久嗽有功馬兜鈴丸治多年喘嗽不止大有神功馬兜鈴去土半夏湯洗七次焙乾杏仁去皮尖麩炒各一兩巴豆二十一粒去皮油研以上除巴豆杏仁另研外余為細末用皂角膏子為丸如桐子大雄黃為衣每十丸臨臥煎烏梅湯下以利為度千治三十年咳嗽或飲或咳寒氣嗽雖不同悉治之細辛款冬花防風紫菀各三兩藜蘆二兩川椒五合上六味㕮咀取藜蘆先著銅器中次紫菀次細辛次款冬花次椒以大棗百枚間在諸藥中以水一斗二升微火煮令汁盡出棗曝令燥雞鳴時服半棗不知明旦服一枚以胸中溫溫為度若強人慾嗽吐者可少增服之便吐膿裹結痰吐後勿冷飲食咳愈止藥藥勢靜乃食不爾令人吐不已治久嗽不瘥方兔屎四十九粒硇砂一分胡桐淚一分上三味為末蜜和丸如桐子大每服三丸以粥飲下日三吐冷物盡即瘥丹蛤蚧丸治久嗽方見陽虛咳條又方衍義治久咳膿血胸膈噎痛蛤蚧阿膠生犀角鹿角膠羚羊角各一兩除膠外皆為屑次入膠河水三升煮半升臨臥細呷愈詳見咳血療三十年嗽以百部根二十斤搗絞取汁煎之如飴服方寸匕日三服驗百一治久咳嗽上氣十年諸藥治不瘥方以蝙蝠除翅足燒令焦為末飲服之妊娠嗽云馬兜鈴散治妊娠胎氣壅塞咳嗽喘息馬兜鈴桔梗人參甘草貝母各五錢陳皮去白大腹皮桑白皮紫蘇各一兩五味子五錢上㕮咀每服四錢姜三片水煎麻黃散治妊娠外傷風冷痰逆咳嗽不食麻黃去節陳皮去白前胡各一兩半夏洗炒人參白朮枳殼貝母甘草各半兩上㕮咀每服四錢蔥白五寸姜三片棗一枚水同煎紫菀湯治妊娠咳嗽不止胎不安紫菀天門冬各一兩桔梗半兩甘草杏仁桑白皮各二錢半上㕮咀每服三錢竹茹一塊水煎去渣入蜜半匙再煎二沸溫服桔梗散治妊娠肺壅咳嗽喘急天門冬去心一兩貝母人參甘草桑白皮桔梗紫蘇各半兩赤茯苓二兩麻黃去節七錢半上㕮咀每服四錢姜三片水煎
