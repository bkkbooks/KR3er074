body:
  text: 卷之二十心小腸部丹熛痤疹丹發斑屬風熱風熱挾痰而作自里而發於外通聖散中消息當以微汗散之下之非理防風通聖散方見顛癇門羅時毒疙瘩漏蘆散治臟腑積熱發為腫毒時疫疙瘩頭面洪腫咽嗌堵塞水藥不下一切危惡疫癘漏蘆升麻大黃黃芩各一兩藍葉玄參各二兩上為粗末每服二錢水煎腫熱甚加芒硝二錢半消毒丸治時毒疙瘩惡症大黃牡蠣燒白殭蠶炒各一兩上為細末煉蜜丸彈子大新水化下一丸無時內加桔梗鼠黏子湯尤妙丹治丹發疼痛扁竹汁服一升二合立瘥若未瘥再服效外臺祕要扁竹即萹蓄內傷斑者胃氣極虛一身之火遊行於外所致宜補以降之嘗治一中年男子癰潰後發熱乾嘔背發丹熛用諸般敷貼丹熛藥及用刀於個個丹頭出血丹皆不退後以半陳生薑加補劑治嘔不效遂純用參半兩歸術各錢半濃煎一帖嘔止二三帖丹漸緩熱漸減約五十餘帖熱始除神氣始復運氣丹熛皆屬火經云少陽司天客勝則丹疹外發及為丹熛是也無治諸腫丹毒伏龍肝不拘多少為末用雞子白和敷之日三次甚妙涓治一切丹毒金花散鬱金黃芩甘草山梔大黃黃連糯米上七味等分生為末用蜜和水調服本治煙火丹發從背起或兩脅及兩足赤如火景天草真珠末一兩搗和如泥塗之又方治螢火丹從頭起慎火草搗和苦酒塗之丹丹毒藍澱敷熱即易子母祕録肘丹者惡毒之瘡五色無常苧根三斤水三斗煮汁每日塗之世治赤丹用黃瓜種中穰水去子以器貯之用時以水塗患處又方用臘雪貯器中久化為水以水塗赤遊妙丹諸丹毒腫蚯蚓矢水和敷之聖惠方外臺同千療丹癮疹方酪和鹽煮以摩之手下消丹治赤遊風腫蕎麥苦酒調敷兵部手集楊治熱赤遊丹毒栝蔞末二大兩釅醋調塗之外凡丹走皮中浸淫名火丹本方取蠐螬敷之先刺破敷之良肘丹者惡毒之瘡五色無常治之煮栗皮有刺者洗之佳保治金絲瘡一云紅絲瘡其狀如線或如繩巨細不一經謂丹毒是也但比煙毒不甚廣闊人患此頭上有之下行至心則死下有之上行者亦然可於瘡頭截經刺之出血後嚼萍草根塗之自安無丹毒自腹內生出四肢者則易愈自四肢入腹者則難治丹人有病面上忽見紅點者多死丹毒風丹痛者為丹毒癢者為風丹賈宅小娘風癢黃精丸四十粒與白朮七分枳實炒黃芩四錢上分八帖下之食前遍身風癢癮疹凌霄花細末酒下一錢立止鮑允中年五十歲風丹癢甚腹微疼咽不利面身微腫五六日不退兩寸脈滑大實右浮大左浮弦小以炒芩炒連歸芎芍地桔草黍黏紫葳各一錢防風黃耆各半錢凡五六帖而安世河間神佑丸治風丹愈而復發或隔一月發或隔半年一年發者神佑丸下之百發百中方見水脹門丹一人患風丹遍身癢因酒得者浮萍半兩防風黃耆羌活三錢當歸二錢乾葛麻黃一錢生甘草半錢世治冷丹風防風甘草白殭蠶蟬蛻川芎白芷茯苓人參陳皮厚朴蒼耳子荊芥上為末豆淋酒調二錢世丹癢者用韭葉摻些鹽與香油以手摩熱于丹上揩之立愈出小兒門治風丹穿山甲洗去腥於瓦上炒過存性每一兩入甘草三錢為末米飲調服治血風疙瘩瘡癍瘡浮萍取自然汁豆淋酒下四物浸酒下亦得丹用羊蹄菜根於生鐵上以好醋磨旋旋刮取塗患處未瘥更入硫黃少許磨塗之聖惠方痤痤小癤世謂之熱癤是也王注云大如酸棗或如豆色赤而內有膿血也海汗出見濕乃生痤痱痱為瘡癤也勞汗當風寒薄為皶郁乃痤痤色赤䐜內有膿血旋覆花丸旋覆花三兩防風白芷甘菊南星半夏石膏川芎陳皮白附子各半兩蠍梢殭蠶炒各三錢上細末薑糊丸桐子大薑湯下三五十丸食後疹疹似傷寒暴發暴消世訛為瘄子者是也疥似疹而延歲月或乾溼癢痛不一經所謂癮疹是也癬亦延歲月干而不濕癢而不痛是也丹疹屬熱與痰在肺清肺火降痰或解散出汗亦有可下者疹在表者消毒飲子防風通聖散在裡者大柴胡湯四順飲子虛者補中益氣湯皆同傷寒施治也聖治風疹入腹身體強舌乾燥用蔓青子三兩為末每服溫酒下一錢匕運氣疹者有二一曰熱經云火鬱之發民病瘍痱又云歲木不及燥乃大行復則炎暑流火瘡瘍痱疹又云少陰之復民病痱疹是也二曰風經云歲水不及濕乃大行復則大風暴發肌肉疹發是也疥河防風通聖散治風熱瘡疥久不愈方見癇門丹朱院君三十餘久患癮疹身痹而紫色可與防風通聖散加牛蒡子為極細末每二錢水盞半入薑汁令辣煎食前熱飲之麻黃飲治上體生瘡或癢或痛黃水浸淫結痂堆起延蔓於三陽之分根窠小帶紅腫此是濕熱症麻黃半兩去根留節防風半兩羌活石膏六錢半煅黃芩四錢滑石一兩陳皮紫萍各七錢半鼠黏子七錢半縮砂二錢半蒼耳草三錢半蒼朮半兩生甘草三錢半薄荷葉一錢半荊芥二錢半上㕮咀每六錢重水一鍾半猛火煎取六分入好酒四五滴去渣熱服須得通身有汗其瘡自安甚者服至百服之後看汗出到何處若自上而下出過腳𦚼䐐其瘡自愈局消毒散丹溪云消毒散氣表藥也防風一兩甘草二兩荊芥穗三兩黍黏子四兩上為粗末每服三錢水一盞煎至七分去渣食後溫服初虞世治皮膚風熱遍身生癮疹牛蒡子浮萍等分以薄荷湯調下二錢日二服丹何小官生瘡小便黃用通聖散一錢半煎下黃精丸楊三哥女生瘡午後發熱日間惡寒形削食少白朮二錢連翹一錢煎下黃精丸三十粒垣每風瘡大風病相似好桑葉洗蒸一宿日乾末湯下二錢匕經驗方聖治風遍身癮疹疼痛成瘡用白殭蠶少許焙黃細研為末酒服立瘥子和穎皋韓吉卿自髀至足生濕𧈟大者如錢小者如豆癢則搔破水到則浸淫狀類蟲行袴襪愈而復生瘢痕成凹十餘年不瘥戴人哂之曰此濕𧈟瘡也由水濕而得故多在足下以舟車浚川大下十餘行一去如掃山癮疹入腹亦能殺人用蠶砂濃煎湯洗之衍有人病遍身風熱細疹癢痛不可任連腦脛臍腹及近隱處皆然涎痰亦多夜不得睡以苦參末一兩皂角二兩水一升揉濾取汁銀石器熬成膏和苦參為丸如桐子大食後溫水服二十丸次日便愈子和有樵夫來買苦參欲治疥不識藥性緩急但聞人言可治濃煎一碗服之須臾大吐涎一盆三二日疥作痂矣丹一上散治諸般疥瘡或痛或癢或喜湯火烘洗者蛇床子一兩略炒雄黃一兩另研硫黃二錢半另研白礬半兩黃連半兩黑狗脊一兩寒水石一兩另研斑蝥十四個去翅足吳茱萸三錢白膠香一兩銅銚溶過傾干石頭上放冷研上為細末香油調敷治疥瘡先用蒼耳草或羊不食草藤煎濃湯洗去瘡痂然後用前藥敷可一次愈小兒面瘡通面爛無全膚膿水流漓百藥不效者陳年臘豬油不入鹽者敷之神效出小兒門又諸般疥癬加減法腫多加白芷開鬱痛多加白芷方解石癢多加枯礬陰囊瘡加茱萸濕多香油調干癢出血多加大黃黃連豬脂調蟲多加蕪荑錫灰檳榔藜蘆斑蝥紅色加黃丹青色加青黛瘡在上多服通聖散在下多以藏用丸下腳腫出血加血分濕熱藥膿胞瘡治熱為主黃芩黃連大黃各三錢蛇床子寒水石二錢黃丹五分白礬一錢輕粉白芷無名異各少許木香少許痛者加上為細末麻油調塗又瘡藥膿窠治熱燥濕為主蟲瘡如癬狀退熱殺蟲為主乾疥瘡開鬱為主加吳茱萸蕪荑黑狗脊殺蟲樟腦一錢松香頭上多加之白礬雄黃硫黃水銀殺蟲黃連方解石一分蛇床子定癢殺蟲松皮灰膿腫濕多加之羅䕡茹散治疥經年不瘥水銀一錢好茶二錢䕡茹三錢輕粉少許上為細末每用不拘多少麻油調塗之世治疥癬以臘月豬脂不拘多少同生白礬杏仁加輕粉搗爛擦之陳無擇云杏仁輕粉最殺蟲甚妙本治疥不問新久方白蕪荑一兩檳榔吳茱萸各半兩硫黃二錢另研上為末麻油調抓破揩之丹砂瘡殺蟲為主蕪荑二錢剪草一錢蛇床子三錢白礬一錢飛明礬一錢吳茱萸一錢蒼朮厚朴雄黃各半錢寒水石二錢黃柏二錢輕粉十盝世治砂瘡山蟻窠黃荊葉雉雞毛等分燒存性為末香油調敷又方用陳年船底灰搗細篩過桐油調敷立效又方治砂瘡用水萵苣燒灰存性香油調敷立愈水多者干敷水萵苣如百合狀生水邊七八月結子又如野蘇狀丹疥癩瘡春天發瘡疥開鬱為主不宜抓破白礬吳茱萸各二錢樟腦五分輕粉十盝寒水石二錢半蛇床子二錢黃柏大黃各二錢硫黃一錢檳榔一個上為末豬脂油調搽治瘑疥濕瘡浸淫日久癢不可忍搔之黃水出瘥後復發取羊蹄根去皮細切熟熬以大酢和先洗淨敷上一時再以冷水洗之日一敷瘥若為末敷尤妙千金翼治疥取羊蹄根和豬脂塗上或著鹽少許即焦外臺祕要治遍身風癢生瘡疥茵陳煎湯濃洗立安千金翼衍有人患遍身生熱毒瘡痛而不癢手足尤甚至頸而止黏著衣被曉夕不得睡痛不可忍有下俚教以菖蒲三斗銼日乾之舂羅為末布席上使病瘡人恣臥其間仍以衣被覆之既不黏衣被又復得睡不五七日其瘡如失應手神驗丹浸淫瘡痛不可忍者發寒熱刺薊末水調敷瘡上干則易之簡要濟衆治疥癬滿身作瘡不可治者何首烏艾等分以水煎令濃於盆內洗之甚能解痛生肌博濟外元希聲侍郎治卒發疥祕驗方石灰隨多少和醋漿水調塗隨手即減一法用石灰炒紅出火氣香油調敷丹又方淋石灰汁洗之孫真人羅木香散治多時不斂一切惡瘡此藥能生肌肉止痛木香檳榔黃連各半兩白芷三錢以上同為細末先洗淨每日一遍干貼有水出勿怪未效又貼又方同上加地骨皮為細末先於瘡口上用溫漿水洗濕挹干後上藥治之效不可述暨治下疳瘡神效丹諸瘡癬久年者千年韭根炒存性末之豬油調敷三次經驗兵部手集多年惡瘡不瘥或痛癢生釁爛研馬糞並齒灰敷上不過三兩遍效武良相在蜀足脛有瘡痛不可忍得此方便瘥丹風瘡久不瘥燒菰蔣末以敷之按本草即野茭白山痱子茨菰葉陰乾為末敷之經患禿瘡以水研山豆根敷瘡上患麩豆等瘡以水研山豆根服少許丹連痂癢痛搗扁竹封痂落即瘥肘後方洗諸瘡疥取冬瓜藤皮煎湯妙日華子中風犯毒霧櫟木皮煎湯洗妙本草運氣浸淫皆屬火經云歲火太過甚則身熱膚浸淫是也玉手疥勞宮灸大陵灸世瘡疥頑癬絶骨三里各寸半瀉間使解溪各五分血郤三寸瀉集渾身生瘡疥曲池合谷三里絶骨行間委中甲癬疥陽溪主之少陰有餘病皮痹癮疹全文見諸症仲浸淫瘡從口流向四肢者可治四肢流來入口者不可治癬丹癬瘡用防風通聖散去硝黃加浮萍皂角刺又方治癬用浮萍一兩蒼耳蒼朮二兩苦參一兩半黃芩半兩香附二兩半上為末酒調服或酒糊丸羅苦參丸治肺毒邪熱生瘡生癬疥並宜服之以苦參一味為細末粟米飲丸如桐子大每服五十丸空心溫水飲湯送下本烏頭丸治風癬妙方見紫白癜風羅何首烏散治脾肺風毒攻腫遍身癬變成癮疹搔之成瘡或肩背拘急肌肉頑痹手足皴裂風氣上攻頭面生瘡及治紫癜白癜頑麻等風荊芥穗蔓荊子威靈仙何首烏甘草炙防風蚵蚾草上件各等分搗羅為末每服一錢食後溫酒調下沸湯亦得丹癬在頸項間後延上至耳成濕癬他治不應以蘆薈一兩研甘草末半兩和勻先用溫漿水洗癬拭上敷之神妙劉禹錫方癬瘡方槿樹皮不犯銅鐵每二兩又蘆薈三錢白芨三錢細研為末刮癬出血用好醋調敷雖痛卻一敷可愈一方用蘆薈大黃輕粉雄黃蛇床子槿樹皮檳榔上先刮破癬用醋調藥末塗之世頑癬用槿樹皮加巴豆斑蝥為細末又加生砒少許水調敷世治牛皮癬用清香油一兩入全蠍七枚巴豆二十枚斑蝥十枚同熬候色焦者先去之去了入黃蠟一錢候溶收起朝擦暮愈不損皮肉又方緑籬根不拘多少花椒一兩信些少防風半兩江子十五粒白芨半兩百部半兩白蘞半兩上各為末和緑籬根搗熱成團將藥於癬上擦之候痛過洗浴又方一味緑籬根去粗皮取細皮貼肉者搗爛用醋調塗癬上立愈丹乾癬積年生痂搔之黃水出每逢陰雨即癢用狼毒末塗之聖惠方外臺用斑蝥半兩炒為末蜜調敷上本治癬用藜蘆細搗為末生油和敷之丹治癬疥久不瘥羊蹄根搗絞取汁用膩粉少許調如膏塗敷患處三五遍即瘥如干即用豬脂調和敷之簡要濟衆羅柏脂膏治乾癬柏油一斤黃蠟半斤杏仁四十五粒銼碎朴硝一抄上件相和於鐵器內用老生薑蔥白三根一順攪五七次煎沸濾過成膏於瘡上搽之圖取楮皮枝中白汁塗癬甚妙聖治癬濕癢用楮葉半斤細切搗敷癬上經治五種瘡癬以韭根炒存性旋搗末以豬脂調敷之三五度瘥又方患癬瘡搗山豆根末臘月豬脂調塗之羅祛濕散治多年濕癬大有神效蠶砂四兩薄荷半兩上為細末每用不拘多少乾摻於瘡上或用生油調搽子和一女子年十五兩股間濕癬長三四寸下至膝發癢時爬搔湯火俱不解癢定黃赤水流又痛不可忍灸焫熏泄硫黃䕡茹白殭蠶羊蹄根之藥皆不效其父母求療於戴人戴人曰能從豫言則瘥父母諾之以扉針磨尖快當其癢時於癬上各刺百餘針其血出盡煎鹽湯洗之如此四次大病方除此方不盡以告後人恐為癬藥所誤濕淫於血不可不砭者矣紫白癜風白禿海龍蛇散治風虛頑麻遍身紫白癜風癮癢痛者白花蛇去骨焙黑梢蛇去骨焙萆薢天麻黃耆金毛狗脊自然銅骨碎補楓香研地龍草烏頭鹽水浸銼各一兩乳香沒藥各三錢麝香二錢上細末酒糊丸桐子大每服十五丸酒下食後為末酒調亦得羅加減何首烏散治紫白癜風筋骨疼痛四肢少力眼斷瞳人鼻梁崩塌皮膚疥癬手足皺裂睡臥不安行履艱難何首烏蔓荊子石菖蒲荊芥穗苦參威靈仙甘菊花枸杞子各一兩上為細末每服三錢蜜茶調下不拘時聖治白癩用馬鞭草不限多少為末每服食前用荊芥薄荷湯調下一錢匕本治宿患風癬遍身黑色肌體如木皮膚粗澀及四肢麻痹宜服烏頭丸草烏頭一斤入竹籮內以水浸用瓦片於籮內就水中瀧洗如打菱角法宜候瀧洗去大皮及尖控起令乾用麻油四兩鹽四兩入銚子內炒令深黃色傾出油只留鹽並烏頭再炒令黑色煙出為度取一枚劈破心內如米一點白恰好如白多再炒趁熱取羅為末用醋糊丸如桐子大每服三十丸空心晚食前溫酒下真州資福庵文雅長老有此疾服數年黑皯頓除腳力強健視聽不衰有一宗人遍身患紫癜風身如墨服逾年體悅澤豫服之一年諸風疥瘡瘍皆瘥性差熱雖云去毒要之五七日作烏頭粥啜之為佳粥法用豫章集中者佳世紫白癜風貝母為末以胡桃肉蘸洗浴後擦之神效又方以信石好者為上研極細用真香油調如薄粥過一宿取清油敷之愈又方用金獅草挪碎擦之纍效丹又方杜大黃飛礬上肥皂為丸擦之白禿松香制蕪荑黃丹光粉枯礬胡坯上末香油入薑汁少許調敷上又法直兩乳頭以篾量過當兩臑脈絡上灸之臑絡脈俗呼為蝦蟆穴也面瘡大治面部生瘡或鼻臉赤風刺粉刺用盡藥不效者惟有此藥可治神妙不可言每以少許臨臥時洗面令淨如面油用之數日間瘡腫處自平赤亦自消如風刺粉刺一夕見效仍塗藥勿近眼處生硫黃香白芷栝蔞仁膩粉各半錢全蠍七枚蟬蛻五枚洗芫青七枚去翅足上為細末麻油黃蠟約度如合面油法火熬溶取下離火入諸藥在內每用少許塗面上山面瘡水調平胃散塗之千治臉上熱瘡涎出以蒲黃敷上瘥東洗面藥方治面有皯點或生瘡及粉刺之類並去皮膚燥癢垢膩潤澤肌膚皂角三斤去皮弦子另搗糯米一升二合緑豆八合揀淨另搗楮實子五兩三奈子縮砂連皮半兩白芨二兩肥者銼甘松七錢升麻半兩白丁香五錢臘月收揀淨上七味同為細末訖和緑豆糯米粉及皂角末一處攪勻用之效面油摩風膏麻黃二分升麻根二錢去皮羌活去皮一兩防風二錢歸身一錢白芨一錢白檀五分上以綿裹定前藥於銀石器中用油五兩同熬得所澄清去渣以黃蠟一兩再煎熬為度瑩肌如玉散白丁香一兩香白芷七錢升麻半兩白芨一兩麻黃去節二錢白牽牛一兩當歸梢半兩白附子二錢半白蒺黎一兩楮實子四錢白茯苓三錢連翹一錢半白蘞一兩小椒一兩上為細末每用半錢多少洗之塗皯黯不令生瘡豬苓麻黃桂枝白蒺藜白附子連翹防風香白芷白蘞當歸身升麻根白芨上等分為細末洗面用之臨臥唾調少許塗面上肘療面多皯黯如雀卵色以羖羊膽一枚酒二升煮三沸塗拭之三日瘥治面上粉刺搗菟絲子絞汁塗之竹白附丹治男子婦人面上黑斑點白附子一兩白芨白蘞白茯苓密陀僧白石脂定粉各等分研上為細末用洗面藥洗淨臨睡用人乳汁如無用牛乳或雞子清調和丸如龍眼大窨干逐旋用溫漿水磨開敷之癩頭瘡丹防風通聖散為末酒浸焙乾凡三次食後白湯調服日三服至頭有汗效世濃煎鹽湯洗三五日一洗用一上散敷之久年不愈神效方見疥部丹用好紫霄炭燒通紅入水淬之又燒又淬以水熱為度取所淬之水日日洗之使熱毒宣發而愈外以胡荽子伏龍肝懸龍尾屋梁塵也黃連白礬為末調敷又服酒炒通聖散效一方單用黃連末敷之纍效口瘡唇瘡丹王四叔公口瘡舌強多痰白朮甘草梢一錢人參赤芍藥木通生地半錢黃連炒一錢栝蔞子十二枚上作一帖煎羅黃連升麻湯口舌生瘡升麻一錢半黃連三錢上為細末綿裹含津咽丹治口瘡黃柏炙同細辛各二錢研極細敷之噙少許當滿口有涎吐之少刻又敷又噙如是五七次立愈千金方此治靈氣方也羅緑袍散治大人小兒口瘡多不效者黃柏四兩甘草炙二兩青黛一兩上先取二味為末入青黛同研勻干貼衍黃柏皮蜜炙與青黛各一分同為末入生龍腦一字研勻治心脾熱舌頰生瘡當摻瘡上有涎即吐之垣蜜柏散治口瘡久不愈者用黃柏不計多少以蜜炙灰色為細末乾摻上臨臥忌酒醋醬犯之則瘡難愈丹好酒煮黃連呷下立愈本治膈上熱極口舌生瘡膩粉一匕杏仁七粒不去皮尖上二味臨臥時細嚼令涎出則吐之用溫湯漱口未痊可又用肘治口瘡以薔薇根避風處打去土煮濃汁溫含冷易之衍五倍子治口瘡以末搽之便可飲食本治口瘡以膽礬一塊用百沸湯泡開含漱一夕可瘥八分一方用白礬湯漱口亦妙凡口瘡用西瓜漿水瘡甚者以此徐徐飲之冬月無留皮燒灰噙之治口瘡以好墨研螻蛄極細敷之立效胡氏方螻蛄走小腸膀胱其效甚捷因力峻氣猛陰虛氣上致瘡者戒勿用惟體實有熱在上焦者用之如神子和治一男子病口瘡數年上至口中至咽嗌下至胃脘皆痛不敢食熱物一湧一泄一汗十去其九次服黃連解毒湯不十餘日皆釋丹口瘡服涼藥不愈者此中焦氣不足虛火泛上先用理中湯甚則加附子本治滿口生瘡此因虛壅上攻口舌生瘡草烏一個南星一個生薑一塊上焙乾為細末每服二錢臨臥時用醋調作罨子貼手足心來日便愈丹口瘡以遠志醋研鵝毛掃患處出涎本治口鼻生瘡用生薑一塊臨睡時細嚼含睡不得開口出氣眠著不妨睡覺咽下保治少陰口瘡半夏散聲絶不出者是寒遏絶陽氣不伸半夏制一兩桂烏頭各一字同煎一盞分作二服治太陰口瘡甘礬散以甘草二寸白礬栗子大含化咽津治赤口瘡乳香散以乳香沒藥各一錢白礬半錢銅緑少許研為末摻之治白口瘡沒藥散以乳香沒藥雄黃各一錢輕粉半錢巴豆霜少許為末摻之運氣口瘡有二一曰熱經云少陽司天火氣下臨肺氣上從口瘍是也二曰寒經云歲金不及炎火乃行復則寒雨暴至陰厥且格陽反上行病口瘡是也丹治口瘡豬蹄殼燒為末敷之立止張氏方治口瘡與走馬疳茄蒂中木去皮燒存性入少白梅灰與少礬細末敷之立安精要同羅紅芍藥散心病口瘡紫桔紅蒼三錢四兩五服安康上件紫菀桔梗紅芍藥蒼朮各等分為細末羊肝四兩批開摻藥末三錢用麻扎定火內燒令熟空心食之大效白湯送下聖主小兒口瘡通白者及風疳瘡蝕透者以白殭蠶炒令黃色拭去蠶上黃肉毛為末用蜜和敷之立效陳主口內熱瘡以古文錢二十文燒令赤投酒中服之立瘥聖口舌生瘡胸膈疼痛用炒豉細末含一宿便瘥聖治口瘡用縮砂不拘多少火煅為末摻瘡即愈又法用檳榔燒灰存性為末入輕粉敷之千治口瘡取桑樹汁先以發拭口即以汁敷之垣化毒法凡口瘡無問新舊遇夜臥將自己兩丸以手攊緊左右交手揉三五十遍但遇夜睡覺行之如此三五度因酒而生者一夜愈久病諸口瘡三二夜愈如鼻流清涕惡寒者攊二丸向上揉之數夜可愈世唇瘡以甑上滴下汗敷之纍效如神羅多效散治唇緊瘡及疹訶子肉五倍子各等分上為細末干貼上效丹唇黃泡腫烏頭炒灰研香油調敷之胡氏方唇上生瘡連年不瘥以八月藍葉一斤搗取汁洗之不過三日瘥千金方唇上生瘡用白荷花瓣貼之神效如開裂出血者即止集口瘡承漿合谷人中長強海泉三稜出血不已用後穴金津玉液各出血密又法委中瀉後溪補此二穴乃心火腎水二經之表垣又法膽俞小腸俞各灸七壯太衝五分勞宮牙疳瘡垣神功丸治多食肉人口臭不可近牙齒疳蝕斷肉將脫牙落血出不止黃連去須淨一兩酒洗縮砂仁半兩甘草三錢藿香葉一錢生地黃酒浸三錢木香一錢升麻二錢當歸身一錢蘭香葉如無藿香葉代之上為細末水浸蒸餅為丸緑豆大每服一百丸加至二百丸止白湯下食後服兼治血痢及下血不止血下褐色或紫黑色及腸澼下血空心米飲送下其脈洪大而緩及治麻木厥氣上衝逆氣上行腰間者治小兒走馬牙疳見小兒疳門耳內瘡垣黍黏子湯治耳內痛生瘡桔梗半兩柴胡三分連翹二分黃芩二分黍黏子二分紅花少許歸梢二分生地黃二分蒲黃一分甘草一分炙黃連二分草龍膽一分昆布一分黃耆三分蘇木一分桃仁一錢生甘草一分上件銼如麻豆大作一服水二大盞煎至一盞去渣稍熱服食後忌寒藥利大便羅治耳內生瘡者為足少陰是腎之經也其氣通於耳其經虛風熱乘之隨脈入於耳與氣相搏故令耳門生瘡也曾青散主之治耳內有惡瘡曾青散雄黃七錢曾青半兩黃芩二錢半上件搗為細末研勻每用少許納耳中有膿出即以綿杖子拭乾用之黃連散黃連半兩白礬枯七錢半上搗為細末每用少許綿裹納耳中腎臟風陰瘡無四生散治癩風上攻下注耳鳴目癢鼻赤齒浮或作口瘡下注陰濕四肢瘙癢通體生瘡及婦人血風等症白附子蒺藜擦去刺黃耆蜜炙羌活等分上為末每服二錢鹽酒調下有一人將豬腎破開入鹽摻藥煨亦妙癩屬宗筋胃陽明養之故有是證世治腎臟風凡指縫白者只一二服效黃耆一兩木通甘草黑牽牛各半兩上四味細銼用斑蝥七枚去翅同藥炒焦黑去斑蝥余為末蒸餅糊為丸如桐子大空心鹽湯下三十丸本治腎臟風上攻下注生瘡並癬烏頭丸川烏一兩草烏一兩二味以黑豆半升煮透軟去皮臍切曬乾天麻地龍去土白附子各半兩上為末酒糊為丸如桐子大每服二三十丸空心食前鹽酒鹽湯任下衍有一婦人患臍下腹上連二陰遍滿生濕瘡狀如馬刀他處並無熱癢而痛大小便澀出黃汁食亦減身面浮腫醫作惡瘡治用鰻鱺魚松脂黃丹之類塗瘡上愈熱痛甚治不對故也細問之此人嗜酒貪啖喜魚蟹發風等物急令用溫水洗拭去膏藥尋馬齒莧四兩研碎入青黛一兩再研勻塗瘡上即時熱減痛癢皆去仍服八正散日三服發散客熱每塗藥一時久即干又再塗新濕藥如此二日減三分之一五日減二自此二十日愈既愈乃問曰此瘡何緣至此曰中下焦蓄風熱毒熱氣若不出當作腸癰內痔仍須禁酒及發風物後不能禁酒果患內痔丹陰囊瘡蠟麵茶末之先以甘草煎水洗後敷上妙心鏡陰上濕泡瘡硫黃末敷之日三次梅師千治丈夫陰下濕癢蒲黃末敷之良丹陰瘡人屎燒灰敷之安祕要世腎臟風甘草節湯洗極效祕腎臟風癢不可當者吳茱萸蛇床子等分煎湯洗神效治腎臟陰汗生瘡用莧菜根莖葉燒灰存性研細抓破敷之立愈又蒼耳草蛇床子煎湯洗之良潔治男子婦人陰部濕淹瘡五倍子細研五分白礬一錢銅緑少許輕粉一字乳香五分上為極細末洗淨摻之世治陰瘡癢痛久不止銅錢百枚烏梅七枚鹽二錢上水一碗半煎至一碗洗之無不效驗世腎臟風瘡血郤即百蟲窠右膝內廉上膝三寸陷中者集腎臟風瘡血郤即百蟲窠針入寸半灸二七壯三陰交下疳瘡丹有一鄰人三十餘性狡而躁素患下疳瘡或作或止夏初患白痢膈上微悶醫與理中湯四帖昏悶若死片時而蘇豫脈之兩手皆澀重取略弦似數豫曰此下疳瘡之深重者與當歸龍薈丸去麝四帖而利減與小柴胡去半夏加黃連芍藥川芎生薑煎五六帖而安一男子近三十歲有下疳瘡雖屢求治以其不能忌口卻之忽一日頭痛發熱自汗衆作傷寒陽證治之反劇豫診其脈弦甚七至重按則澀豫曰此症在厥陰藥與症不相應遂作小柴胡湯加草龍膽黃連胡黃連帶熱服四帖而病脫然治男子恥瘡或痛在莖之竅或痛在莖之標皆手足太陽不利熱毒下傳入於足厥陰故變紫黑色作蝕瘡毀其莖而死宜以子和泄水丸散導其濕毒無不愈者若已成瘡先泄其根次從標而治外以蔥白黑豆汁泄洗拭乾以黃連木香密陀僧干胭脂之類細末搽之如內潰膿不出以追膿散上之又用子和泄水丸如後竅膿少可用黃連木香胭脂等貼之子和泄水丸一名大智丸大戟芫花甘遂海帶洗海藻洗郁李仁續隨子以上各半兩樟柳根一兩上為細末水煮棗肉為丸如小豆大每服五七十丸熟水下治下疳瘡先用張子和泄水丸去根後用此藥幹上黃連滑石各半兩定粉三錢輕粉少許乳香一錢密陀僧二錢上細末幹上或加干胭脂或加木香檳榔丹下疳散蛤粉蠟茶苦參青黛密陀僧上用臘脂調塗河水洗淨並治臁瘡世又方青黛海蛤密陀僧黃連上為末敷上丹一切熱毒惡瘡及下疳瘡用密陀僧黃柏皮末各一分半膩粉一錢麝香少許先洗瘡拭乾傳之甚者三四次治下疳瘡雄黃黃連等分為末濕者乾摻乾者油調敷先用荊芥射干煎湯洗卻敷之妙一方用地骨皮末敷神效海追膿錠子膿內潰不出以此藥追之雄黃二錢巴豆一錢半輕粉一字嘗治一男子下疳瘡每恣飲酒則發醫與小柴胡湯加黃連數帖不效又與玉燭散下之反劇豫以甘草節小建中各半煎湯服之下咽痛止後以四物湯建中甘草等分與之漸安丹陰頭瘡蜜煎甘草敷之安外臺祕要又方用頭髮以鹽水洗淨去油再用米泔洗淨又用清湯洗曬乾燒灰敷瘡上便結靨世蒼耳葉為末摻之治下疳瘡黑彤兔為末敷上神妙一名烏吊土一名孩兒沙海治下疳瘡久不愈橡斗子二個各盛黃丹令滿相合以亂髮纏定燒煙盡為度同研為末先以蔥白熱漿水洗瘡膿盡次上藥甚者不過三次如神肘療人陰生瘡膿出成坎取高昌白礬麻仁等分研煉豬脂相和成膏槐白皮作湯洗瘡拭令乾即塗膏然後以楸葉貼其上不過三五度瘥山下疳瘡用五倍子末敷之婦人陰瘡仲少陰脈滑而數者陰中即生瘡陰中蝕爛者狼牙湯洗之用狼牙二兩以水四升煮取半升以綿纏箸如繭浸湯瀝陰中日三遍大洗拓散治陰蝕瘡甘草一兩乾漆一兩黃芩當歸地黃芍藥各二兩龜甲五兩上細切以水七升煮取一半去渣以綿帛納湯中用拓瘡處良久即易日二度每拓湯可作十里許即挹干捻取甘濕散薄敷瘡上使遍可經半日又以湯拓拓訖如前敷藥有一婢生此疾蝕處作兩瘡深半寸用此洗拓湯並後甘濕散不經七日平復甚效甘濕散蚺蛇膽真者青木香石硫黃鐵精麝香各四分臨時入用緑麝闢蛇毒若先以相和蛇膽即無力也上各等分為末更研細有患取如三棋子大和井花水日再服訖先令便利了即以後方桃枝熏下部訖然後取藥如棋子安竹管里納入下部中日再度老少量減其熏法每日一度不可再桃枝熏法取東南桃枝五七枝輕打頭使散以綿纏之又搗石硫黃為末將此綿纏桃枝捻轉之令末少厚又截一竹筒先納下部中仍以所捻藥桃枝燒熱熏之丹女子陰瘡硫黃末敷之肘後仲蛇床子散溫陰中坐藥用蛇床子仁一味末之以白粉少許和令相得如棗大綿裹納之自然溫散運氣陰瘡皆屬寒經云太陽之勝陰中乃瘍隱曲不利治以苦熱是也臁瘡世治臁瘡極妙地骨皮一斤黃柏皮二兩銼為粗末用香油一斤半煎濾過藥油六七兩入淨松香二十兩黃丹二兩同煎候黃丹微黑色卻入輕粉七角光粉二角煎法皆如煎膏法用長條紙拖過挂乾用若此瘡紫黑先用三稜針去惡血以冷水洗淨隨瘡大小剪膏藥掩上用絹帛緊緊扎縛俟一周時再換膏藥換時須用冷水洗瘡不過數換不問新久即愈須忌日氣火氣陽氣倘換膏藥再看如有黑腫未盡可再出血以紫黑血盡為度治臁瘡用糯米泔漱口過洗瘡拭乾卻以地骨皮為細末蜜調敷瘡上又以油紙縛之丹治臁瘡白膠香一兩黃柏一兩軟石膏一兩另研青黛半兩龍骨五分上為細末以香油調敷患處又方羯羊屎二分石膏一分赤石脂半分為細末香油和之舊黑油傘紙作隔膏縛之除根羅翠玉膏治臁瘡瀝青四兩黃蠟銅緑各五錢沒藥三錢上件先將銅緑為細末入香油調勻又將黃蠟瀝青火上溶開次下油銅緑火上攪勻將沒藥等三味旋旋入攪勻用河水一碗將藥傾在內用手扯拔勻油紙裹看瘡大小分大小塊口嚼捻成餅子貼於瘡上紙封三日易之丹臁瘡用砂糖水煮冬青葉三五沸撈起石壓干將葉貼在瘡口上一日換二遍腳痛成瘡水蓼煎湯洗瘡候乾自安經驗方山臁瘡用韭汁洗淨挹干銼虎骨敷上丹二妙丸治下焦濕瘡但是下焦有瘡皆可服潛行散末蒼朮末各等分煉蜜為丸桐子大海治兩臁腳膝生瘡服黃耆丸立安局方虛損門黃耆丸川烏頭炮去皮臍川楝子地龍去土炒茴香炒杜蒺藜炒去刺赤小豆防風去蘆頭黃耆銼各一兩烏藥二兩上為細末酒煮麵糊為丸如桐子大每服十五丸溫酒下鹽湯亦得婦人醋湯下並空心服腳氣瘡足跟瘡世捷應散治腳濕氣成瘡癢不可當爬之流黃水用羯羊糞曬乾為末安於瓦上手把竹柴火燒作灰又研細先用蔥椒湯洗之次用香油調厚敷上以山茶花葉罨之帛縛四五日即可丹腳上爛瘡久不瘥先以酸漿豆腐水洗三二次尋懸鉤擔葉地暴扭葉搗細入鹽些少盦之地暴扭葉即覆盆子葉也海足跟瘡久不愈毒氣攻注用白朮為細末先以鹽漿水溫洗干貼二日一換可以負重涉險凍瘡子和經曰寒瘡流水俗呼為凍瘡或經年不愈者用野中淨土曬乾以大蒜研如泥捏作餅子如大觀錢厚薄量瘡口大小貼之以艾火加於餅上灸之不計壯數以泥干為度去幹餅子再換濕餅子灸不問多少直至瘡痂覺痛癢是瘡可治也然後口含漿水洗漬用雞翎二十莖縛作刷子於瘡上刷洗淨以此洗刷不致肌肉損傷也以軟帛拭乾用木香檳榔散敷之如夏月醫之更妙世足跟紅腫凍瘡足跟左足指面後跟赤白肉際骨下刺入三分彈針出血可灸二七壯足跟凍瘡潰破用椒蔥湯洗刮去腐肉用三稜針出血將馬屁勃入生牛骨髓調和敷之效治凍瘡用茄根燒灰洗了用雀兒腦髓塗之禹錫取臘月牡鼠死者一枚油一大升煎之使爛絞出渣再煎成膏塗凍瘡及折破瘡丹治凍瘡用煎熟桐油密陀僧敷山用五倍子煎湯洗羅如神散治凍瘡皮爛不可忍用川大黃不拘多少為細末新水調掃凍破瘡上痛止立效世治凍瘡痛者橄欖核燒存性為末用香油調塗患處其痛隨愈子和戴人女僮足有凍瘡戴人令服舟車丸浚川散大下之遂愈人或疑之戴人云心火降則寒消何疑之有手足皴裂腳縫爛羅潤肌膏治手足皴澀皮膚裂開疼痛不能見風珠子瀝青四兩白黃蠟八錢乳香二錢上三味於鐵器內用文武火熬下瀝青在鐺內隨手便下黃蠟乳香次入清芝麻油一二匙候瀝青盡溶開微微熬動放大淨水一盆於其傍以攪藥用匙取一二滴滴於水中試之如硬再入油如軟硬合宜用新綿攄淨入水中摺疊扯之以白為度油當旋旋入勿令軟了以瓷器內盛之或油紙裹亦得每用不拘多少先於火上炙裂子口卻捻合裂子藥亦火上炙軟塗於裂子上用紙少許貼之自然合矣東老人路次方城北獨樹店之客舍有推小車者皮膚皴裂甚痛兩手不能執轅足不能履地而車上宿制此藥敷之即效明日遂行自後屢用屢效故録於此世治手足皴裂春夏不愈者生薑汁紅糟白鹽豬膏臘月者佳上研爛炒熱擦入皴內一時雖痛少頃便皮軟皴合再用即安丹手足寒皴裂臺椒三四合煮浸半食頃須臾再浸又敷以羊豬髓腦甚妙梅師方世治腳跟皴裂用頭髮一大握桐油一碗於瓦器內熬候油沸頭髮溶爛出火攤冷以瓦器收貯不令灰入每用百沸湯泡洗皴裂令軟敷其上即安一方加水粉山腳裂爛蒸藕研成膏敷之世用五倍子為末用牛骨髓填縫內即好治腳指縫爛瘡撏鵝時取鵝掌黃皮焙乾燒存性為末濕則摻之反花瘡瘡有胬肉凸出者是也丹諸瘡胬肉如蛇頭出數寸者硫黃末敷之即縮聖惠方瘡有肉凸出烏梅燒灰為末敷之立盡鬼遺方又以白梅肉杵細入蜜捏成餅如錢大貼之妙聖惠方梅又方治反花瘡馬齒莧一斤燒灰細研豬脂調敷世瘡凸出寸許根如小豆或大如梅者用花腳蜘蛛絲纏其根則漸干而自脫落惡瘡羅乳香消毒散專治惡瘡大黃煨黃耆牛蒡子炒金銀花各五兩甘草三兩牡蠣鹽泥煨燒五兩乳香沒藥懸蔞各半兩上為粗末每服五錢水煎瘡在上食後在下食前海惡瘡入腹心嘔逆藥食不下豆粉半兩干胭脂三錢定粉二錢上細末新水調下神效碧霞挺子治惡瘡神效了不覺疼痛者銅緑硇砂各二錢蟾酥一錢上為細末燒飯和作麥糵挺子每刺不覺痛者須刺出血方紝藥在內以膏藥貼之蝕惡瘡方非奇異惡瘡不可用銅緑二錢硇砂一字石膽礬半錢並細研上為細末敷之治惡瘡或有小蟲膽礬一錢龍骨二錢半輕粉一錢虎骨白礬各二錢半麝香五分乳香一錢硇砂二錢腦子一字土蜂房二錢露蜂房二錢半雄黃二錢上細末刺破鹽水洗看緊慢上藥神效雜瘡世治葡萄瘡瘡頭如葡萄色四圍腫起先追膿盡次用冰梅當瘡頭罨之神效本江左有商人左膊上有瘡如人面亦無他苦商人戲滴酒口中其面亦赤色以物食之亦能食食多則覺膊肉脹起或不食之則臂痹有善醫者教其歷試諸藥無苦至貝母其瘡乃聚眉閉口商人喜曰此藥可治也因以小葦筒磨貝母水灌之數日成痂遂愈不知何疾也或曰此人面瘡丹天泡瘡通聖散及蚯蚓泥略炒蜜調敷妙從肚皮起者裡熱發外速服通聖散外天行斑瘡須臾遍身皆戴白漿此惡毒氣永徽四年此瘡自西域東流於海內但煮葵菜葉以蒜齏啖之即止孫卒得惡瘡不識者燒苦竹葉和雞子黃敷疣疣音休俗稱雞眼子是也手太陽之別名曰支正上腕五寸虛則生疣小者指痂疥取之所別也全文見針灸虛實丹手足生疣目鹽敷上舌舐之只三次瘥肘後世疣用雞胃中食揩疣上揩余者以石壓之驗痣世取痣餅藥糯米百粒石灰拇指大巴豆三粒去殼研上為末入瓷瓶同窨三日每以竹籤挑粟許點上自然蝕落潔取靨風化石灰一兩花鹼半兩上為細末上三次如天色冷濕用衍石灰水調一盞如稠粥揀好糯米全者半置灰中半置灰外經宿灰中米色變如水精若人手面上有黑靨子及紋刺者先微微以針頭撥動置少許於其上經半日許靨汁自出剔去藥不用且不得著水二三日愈又方用水蛭一條雞子一枚開雞子小頭納水蛭以皮兒蓋合封之直至水蛭食盡雞清幹盡自死乃用之攧撲傷損世凡攧傷皮破血出處疼不可忍乃風寒所著宜用蔥杵碎入鹽少許炒熱罨上其痛即住冷則再溫之本崔給事頃在澤潞與李抱真作判官李相方以球杖按球子其將軍以杖相格乘勢不能止因傷李相拇指並爪甲劈裂遽索金刀藥裹之強坐頻索酒飲至數杯已過量而面色愈青忍痛不止有軍吏言取蔥新折者入糖灰火煨熱剝皮擘開其間有涕取罨損傷處仍多煨蔥續續取熱者凡三易之面色卻赤斯須云已不痛凡十數度易用熱蔥並涕裹纏遂畢席笑語海治腦骨破及骨折蔥白爛研和蜜浮封損處立瘥筋斷骨折者以法接之世治攧撲筋斷骨折用粟米半升木鱉肉二十個半夏半兩婦人發一團蔥白鬚一小束同炒煙盡存性為末熱醋調敷神效治攧撲筋斷骨折用糯米一升皂角切碎半升銅錢百個同炒至半焦黑去銅錢為末用好酒調膏厚紙攤貼患處神效本打撲傷損及一切腫癰未破令內消方生地研如泥木香細末上以地黃膏隨腫大小攤於紙上摻木香末一層又再攤地黃膏貼腫上不過三五度即愈昔許元公入京師赴省試過橋墜馬右臂臼脫路人語其僕曰急與挪入臼中若血漬臼則難治矣僕用其説許以昏迷不覺痛遂僦轎舁歸邸或曰非録事巷田馬騎不能了此疾急召之至已日暮因秉燭視其面曰尚可治乃施藥封此處至中夜方蘇達旦痛止去其封損處已白其青瘀乃移在臼上自是日日易之腫直至肩背以藥下之瀉黑血三升五日復常遂得赴試蓋用此法云世走馬散治折傷接骨柏葉生用荷葉生皂角生用骨碎補去毛等分上為末先將折傷處揣定令入元位以薑汁調藥如糊攤紙上貼骨斷處用杉木片夾定以繩縛之莫令轉動三五日後開看以溫蔥湯洗後再貼藥復夾七日如痛再加沒藥本治腕打傷筋損骨疼痛不可忍生地一斤切藏瓜薑糟一斤生薑四兩切上都炒令勻熱以布裹罨傷折處冷則易之曾有人傷折宜用生龜尋捕一龜將殺患人忽夢見龜告曰勿相害吾有奇方可療於夢中授此方神效本骨碎補罨閃折筋骨折傷取根搗碎煮黃米粥和之裹傷處良潔接骨丹敷貼藥天南星四兩木鱉子四兩沒藥半兩官桂一兩乳香半兩上為細末薑一斤去皮爛研取自然汁入米醋少許白麵為糊同調攤紙上貼傷處以帛縛之用篦夾定麻索子纏山攧撲骨肉損醋搗肥皂爛厚罨之以帛縛之閃傷醋糟平胃散相和罨之丹治跌傷骨折及血黯方用益元散七分人參湯調之次用薑汁好醋二盞用獨子肥皂四個敲碎投於薑汁醋中調和以綿濾過去渣煎成膏藥貼之遍身亦可本又方柑桔葉白酒糟杵細縛痛處或大段痛用火燒地令紅用醋並米泔潑地上急鋪薦令患人薦上臥蒸出汗內則服藥外則貼罨易安勝金治破傷多用燈心草爛嚼和唾貼之用綿裹血立愈丹折傷接筋方旋覆花根杵汁滴傷處又將渣封瘡上十五日使斷筋自續矣蘇良仲方即金沸草根是也接骨用好無名異三兩為末丁乳檀沉木五香各半錢重為末先燒鐵銚紅以五香三之一彈入銚內候煙起則全下無名異待滾退火定後再上火炒熱又將五香彈三之一彈入銚內候滾又退火如此者凡三次訖出火毒即用骨碎補去毛約一斤與生薑等分搗爛以碗覆之候發熱先約取五之一入小蔥九莖連須去蒂同入沙盆擂細取其汁調前無名異末二錢沖老酒服之其渣罨患處即愈如老年氣衰者再作一劑多飲酒力助之為妙治擦落耳鼻用發入罐子鹽泥固濟煅過為末乘急以所擦落耳鼻蘸灰綴定以軟絹縛定效江懷禪師為驢所咬下鼻一僧用此綴之效山負重擔肩破者剪貓兒頭上毛不語唾黏之遠行腳打泡用調生面糊貼過夜即干不可擦破又法用飯黏貼過夜以紙蓋之次日平復神效海若登高下重物撞打箭鏃刃傷心腹胸中停積鬱血不散以上中下三焦分之別其部分上部易老犀角地黃湯中部桃仁承氣湯下部抵當湯之類下之亦有以小便酒同煎治之更有內加生地黃當歸煎者有大黃者又法虛人不禁下者以四物湯加穿山甲煎服妙亦有花蕊石散以童子小便煎或酒服之者此藥與前寒藥正分陰陽不可不辨也若瘀血已去用復元通氣散加當歸煎服亦可世接骨神效無比纍驗用當三錢一百零八個錢厚字連草者以鐵線穿定用活桑木一根作柴燒錢紅米醋一大碗末煎者不入鹽將所燒錢淬入醋中如此淬之以醋乾為度取醋中淬落銅錢末就用醋洗去灰曬乾為極細末再用黑雄雞一隻清湯煮熟去肉用骨一付以醋炙酥為末入乳香沒藥各一兩與銅錢末一處和勻每服一字臨服時用患人發在頂上者洗去垢燒灰入藥中無灰酒調服不吐只一服如吐出再服如痛止不可再服必須先夾縛所折骨端正用楊樹皮刮去肉糊並外粗皮敷之下咽便不痛五七日便能運動必終身忌荸薺一名地栗義門家傳方一方用五銖錢醋淬一兩二錢黑雞骨三兩研細勻每服病在下四錢疏服食前病在上二錢半頻服食後一方有乳香沒藥潔方用醋淬半兩錢蘇木定粉南硼砂各一錢為末作一服當歸酒二三服痛止勿服丹接骨散沒藥乳香各五錢自然銅一兩醋淬滑石二兩龍骨三錢赤石脂二錢麝香後入少許白石脂二錢上為細末以好醋浸沒煮多為上候乾就炒燥為度臨服入麝香少許挑小茶匙在舌上溫酒下病分上下食前後服若骨已接尚痛去龍骨石脂而多服盡好世又方接骨乳香沒藥蘇木降真節川烏去皮尖松明節各一兩自然銅米醋淬一兩地龍去土麻油炒半兩血竭三錢龍骨半兩生用水蛭油炒半兩土狗十個油浸炒上為細末每服五錢酒調下在上食後在下食前垣定痛乳香神應散治從高墜下疼痛不可忍腹中疼痛乳香沒藥雄黑豆桑白皮獨科栗子各一兩破故紙炒二兩當歸一兩水蛭半兩上為末每服五錢醋一盞沙石器內煎至六分入麝香少許溫服定痛接骨紫金丹麝香沒藥紅娘子各一錢半烏藥二錢半地龍去土二錢半川烏草烏炮各一兩五靈脂去皮半兩木鱉子去殼半兩茴香二錢半黑牽牛生用五分骨碎補威靈仙金毛狗脊防風去蘆自然銅醋淬七次各五錢禹餘糧四錢碎陳皮青皮各二錢半上為細末醋糊丸如桐子大每服十丸至二十丸溫酒送下病上食後病下食前服聖靈丹治一切打撲損傷及傷折疼痛不可忍者並宜服之乳香五錢烏梅去核五個白米一撮萵苣子一大盞炒取二兩八錢上為細末煉蜜和丸如彈子大每服一丸細嚼熱酒吞下食後一伏時痛不止再服經治折傷用水蛭新瓦上焙乾為細末熱酒調下一錢食頃痛更一服痛止便將接骨藥封以物夾定直候至好初虞世治從高至下墜及打擊內傷神效麝香水蛭各一兩銼碎炒煙出二件研為細末酒調二錢當下蓄血未止再服其效如神衍自然銅有人飼折翅雁後遂飛去今人打撲損傷研極細末飛過用當歸沒藥各半錢以酒調頻服仍以手摩痛處海治墜落車馬筋骨疼痛不止用玄胡索一兩搗羅為散不計時服以豆淋酒調下二錢本童便治卒血及心被打內有瘀血者煎服之一服一升山攧撲傷損松節煎酒吃攧撲重傷用生薑自然汁四兩香油四兩打勻無灰酒熱調下上乳香沒藥行汙血調氣例衍義云沒藥通滯血打傷撲損疼痛皆以酒化服血滯則氣壅瘀氣壅瘀則經絡滿急經絡滿急故痛且腫矣導而行之則痛腫消焉丹打損磕傷疼痛夜合花末服之酒下二錢匕效治打撲損傷折骨此藥專能接骨夜合樹即合歡花去粗皮炒黑色四兩芥菜子炒一兩上為細末酒調二錢澄清臨臥服以粗渣罨瘡上扎縛之又方用蔥白砂糖二味相等分爛研敷之痛立止且無瘢痕丹白蠟屬金金稟收斂堅凝之氣外科之要藥生肌止血定痛接骨續筋補虛與合歡皮同入長肉膏藥用極神效但未曾試可為藥餌否若合歡皮常試之炙服之大有妙理且有速效不可不知也本治打傷接骨方接骨木半兩本草名蒴藋乳香半兩赤芍藥當歸川芎自然銅各一兩上為細末用黃蠟四兩溶入前藥末攪令勻候溫軟衆手丸如龍眼大如打傷筋骨及閃抐著疼痛不可忍者用此藥一丸無灰熱酒一盞浸藥候藥潰開乘熱呷了痛便止若大段傷損碎折須先整骨用川烏草烏為末等分生薑汁調貼罨之又將帛縛定然後服此藥表裡兩治無不效者此二方是一副不可分開治打撲內損筋骨疼痛沒藥乳香芍藥川椒去子及閉目者川芎當歸各半兩自然銅三錢炭火燒上為細末用黃蠟四兩溶開入藥末不住手攪勻濕丸如彈子大每服一丸用好酒煎開消盡乘熱一服吃盡看那處痛向痛處臥霎時服三五丸立效濟治破傷見血酒一碗煎服半兩當歸蠟二錢合來捶碎酒同煎直須軟冷連渣吃一切傷瘡保萬全上夜合黃白蠟例接續筋骨補虛也垣破血消痛湯治乘馬損傷跌破脊骨惡血流下脅下甚痛苦楚不能轉側妨於飲食羌活一錢防風一錢蘇木一錢半柴胡連翹二錢當歸梢二錢官桂一錢麝香少許另研水蛭三錢炒去煙盡另研上為粗末只一服酒二大盞水一盞水蛭麝香另研如泥余藥煎至一大盞去火稍熱調二味服之兩服立愈靈中風有所墮墜惡血留內有所大怒氣上而不下積於脅下則傷肝又中風及有所擊僕若醉入房汗出當風則傷脾又頭痛不可取於腧者有所擊墮惡血在內若肉傷痛未已可側刺不可遠取之也邪氣臟腑及厥病篇夫從高墜下惡血流於內不分十二經絡醫人俱作中風肝經留於脅下以中風療之血者皆肝之所主惡血必歸於肝不問何經之傷必留於脅下蓋肝主血故也痛甚則必有自汗但人人有汗出皆屬風證諸風皆屬於肝木況敗血凝泣逆其所屬入於肝也從高墜下逆其上行之血氣非肝而何非傷寒無汗既曰汗必自風化之也故以破血行經藥治之復元羌活湯治從高墮下惡血流於脅下及疼痛不可忍者經云有所墮墜惡血留內有所大怒氣上而不下積於脅則傷肝肝膽之經俱行於脅下經屬厥陰少陽宜以柴胡為引用為君以當歸活血脈又急者痛也以甘草緩其急亦能生新血陽生陰長故也為臣穿山甲栝蔞根桃仁紅花破血潤血為之佐大黃酒製以蕩滌敗血為之使氣味相合各有所歸痛自去矣柴胡五錢當歸三錢甘草二錢穿山甲炮三錢大黃酒浸一兩桃仁去皮尖五十個紅花二錢栝蔞根三錢上件桃仁研爛余藥銼如麻豆大每服一兩水二鍾酒半盞煎至七分去渣大溫服食前以利為度得利後痛或不盡服乳香神應散乳香神應散見前無里證條潔巴戟湯治從高墜下及打撲內損昏冒嗜臥不能飲食此謂血閉臟腑不通巴戟去心半兩當歸地黃芍藥川芎各一兩大黃半兩上為末水煎以利為度垣當歸導滯散治打撲損傷落馬墜車瘀血大便不通紅腫青黯疼痛昏悶蓄血內壅欲死大黃一兩當歸一錢麝香少許上三味除麝香別研外為極細末入麝香令勻每服三錢熱酒一盞調下如前內瘀血去或骨節傷折疼痛不可忍以定痛接骨紫金丹治之嚴奪命散治刀刃所傷及從高墜下木石壓損瘀血凝積心腹疼痛大小便不通水蛭用石灰拌慢火炒令乾黃色半兩黑牽牛二兩上為末每服二錢用熱酒調下約行四五里再用熱酒調黑牽牛末二錢催之須下惡血成塊以盡為度無雞鳴散治從高墜下及木石所壓凡是傷損血瘀凝積氣絶欲死煩躁頭痛叫呼不得並以此藥利去瘀血治折傷神妙大黃一兩酒蒸桃仁二七粒去皮尖上研細酒一碗煎至六分去渣雞鳴時服次日取下瘀血即愈若便覺氣絶不能言取藥不及急掰口開用熱小便灌之即愈羅花蕊石散治一切金刃箭鏃傷及打撲傷損貓狗咬傷或至死血瘀傷處以藥摻之其血化為黃水再摻藥便活更不疼痛如內損血入臟腑煎童子小便入酒少許調一大盞服之立效若牛抵腸出不損者急納腸入用細系或桑白皮為線縫合肚皮縫上摻藥血止立活如無桑白皮用生麻縷亦得並不得封裹瘡口恐作膿血如瘡干以津液潤之然後摻藥婦人産後敗血不盡血迷血暈惡血奔心胎死腹中胎衣不下至死者但心頭覺暖急以童子小便調一盞取下惡物如肝片終身不患血風血氣證若膈上有血化為黃水即時吐出或隨大便出石硫黃四兩花蕊石二兩上二味相拌合勻先用紙筋和鹽泥固濟瓦罐子一個內可容藥候泥干入藥在內再用泥封口候乾安在四方磚上上書八卦五行字用炭一稱籠疊周匝自巳午時從下著火漸漸上徹直至經宿火冷炭盡又放經宿罐冷取出細研以絹羅子羅極細瓷盒盛之依法使用本治打撲墜損惡血攻心悶亂疼痛水仙散未展荷葉陰乾一味為末食前以童子熱小便一小盞調下三錢以利下惡物為度聖治撲打墜損惡血攻心悶亂疼痛以大幹荷葉五片燒令煙盡細研食前以童子熱小便一小盞調三錢匕日三服塞上方治墜傷損撲瘀血在內煩悶者用蒲黃末空心熱酒調下三錢瘥本宣和中有一國醫忽承快行宣押就一佛剎醫內人醫診視之已昏死矣問其從人皆不知病之由惶恐無地良久有二三老內人至下轎環而泣之方得其實云因蹴鞦韆自空而下墜死醫者云打撲傷損自屬外科欲申明又恐後時參差不測再視之微覺有氣忽憶藥篋中有蘇合香丸急取半兩於火上焙去腦麝用酒半升研化灌之至三更方呻吟五更下惡血數升調理數日方瘥仲治馬墜及一切筋骨損傷大黃一兩切湯浸或半兩緋帛亂髮如雞子大燒灰敗蒲席三寸久用炊單布一尺燒灰桃仁四十九個去皮尖甘草如中指節炙銼上七味以童子小便量多少煎湯或納酒一大盞次下大黃去渣分溫三服先銼敗蒲席半領煎湯浴以衣被蓋覆斯須通利數行通後立瘥利後浴水赤勿怪即瘀血也聖治搕撲損肌膚青腫用茄子種通黃極大者切作片如一指厚新瓦上焙乾為末欲臥酒調二錢匕一夜消盡無痕本療因傷損血瘀不散者取牡丹皮八分合虻蟲二十一枚煅過同搗篩每用溫酒和散方寸匕服血當化為水下丹治被打瘀血在骨節下出者生鐵一斤酒五升煎取一升飲之肘後本治從高墮下墜損惡血在骨節間疼痛蕓薹散荊芥藕節各二兩陰乾蕓薹子川芒硝馬齒莧各一兩陰乾上為細末用蘇木半兩酒一大盞煎至七分調下二錢服之不拘時服丹盛官人因上山惡血瘀入內損傷食少脈弦此須用活血和氣川芎三錢青皮二錢芍藥滑石各一錢牡丹皮五分炙甘草一錢桃仁七枚研上作一帖服之凡傷切不可飲冷水血見寒則凝但一系血入心即死素人有所墜墮惡血留內腹中滿脹不得前後先飲利藥此上傷厥陰之脈下傷少陰之絡刺足內踝之下然骨之前血脈出血刺足跗上脈動不已刺三毛上各一痏見血立已左刺右右刺左善悲驚不樂刺如右方繆刺論靈身有所傷血出多及中風寒若有所墜墮四肢懈惰不收名曰體惰取小腹臍下三結交三結交者陽明太陰也臍下三寸關元也寒熱病篇三結交者即關元穴是也脈從高撲損內有血腹脹滿其脈堅強者生小弱者死金瘡本治金瘡止血除疼痛闢風續筋骨生肌肉地黃散地黃苗地菘青蒿蒼耳苗生艾汁三合赤芍藥各五兩入水煎取汁上五月五七月七日午時修合以前藥汁拌石灰陰乾入黃丹三兩更杵為細末凡有金瘡傷折出血用藥包封不可動十日瘥不腫不膿世治金瘡風化石灰韭葉嫩者同搗入鵝血調和成餅乘風陰乾為末敷上無鵝血鴨血亦得治金瘡血不止用半夏石灰鬱金三物為末摻上傷處即住崔療金槍刀斧傷破血以石灰一升石榴花半斤搗取末少許捺少時血斷便瘥潔末藥散刀箭藥止血住痛定粉風化灰各一兩枯礬三錢另研乳香五分另研沒藥一字另研上件各研為細末同和勻再研摻之丹刀斧傷石灰包之痛止血住精勝金方治刀斧傷止血生肌蠶蛾散晚蠶蛾為末摻勻絹帛裹隨手瘡合血止一切金瘡亦治一法用生晚蠶蛾石灰二味同搗成餅陰乾為末敷之本治金瘡止疼痛劉寄奴散劉寄奴一味為末散摻金瘡口裡昔宋高祖劉裕微時伐荻見大蛇長數丈射之傷明日復至聞有杵臼聲往覘之見青衣童子數人於臼中搗藥問其故答曰我王為劉寄奴所射合藥敷之帝曰神何不殺之答曰寄奴王者不死不可殺帝叱之皆散收藥而去每遇金瘡敷之效寄奴高祖小字也此藥非止治金瘡治湯火瘡大妙經驗方云劉寄奴為末先以糯米漿雞翎掃著傷處後摻藥末在上並不痛亦無痕大凡湯火傷急用鹽水洗之護肉不壞世治金瘡打撲損傷用豨蘞草研細入鹽少許罨之愈金瘡血出不止挪小薊葉封之金瘡止血杵覆盆花苗敷瘡立止梅師方本治金瘡血不止兼痛用血竭末敷立止精治惡瘡金瘡刀斧傷見血方以好降真香為末貼之入水並無傷痕絶妙方見華他中藏治刀箭傷出血不止併骨折檳榔一個木香胡地黃各三錢上為末敷瘡口血立止又可接骨仲金瘡方王不留行散主之王不留行十分八月八日採蒴藋細葉十分七月七日採桑根用白皮根行東南者三月三日採甘草各十分黃芩二分川椒三分除目及閉口者出汗乾薑芍藥厚朴各二分上九味桑根皮以上三味燒灰存性勿令過各別研杵篩合治為散服方寸匕小瘡即粉之大瘡但服之産後亦可服如風寒桑東南根勿取之前三物皆陰乾百日用廣金瘡血不止痛白芍藥一兩熬令黃杵細為散酒後米飲下二錢並得初三服漸知鬼治金瘡出血肉瘻蝙蝠二枚燒煙盡以水調服方寸匕令一日服盡當下如水血消金瘡腸出欲入之磁石滑石各三兩為細末白米飲送下方寸匕日再用鬼遺方仲景問曰寸口脈微而澀法當亡血若汗出設不汗者云何答曰若身有瘡被刀斧所傷亡血故也脈金瘡血出太多其脈虛細者生數實者死金瘡在陰處出血不絶陰脈不能至陽者死接陽而復出者生金瘡出血脈沉小者生浮大者死斫瘡出血一二石脈來大者二十日死斫刺俱有病多少血出不自止斷者其脈止脈來大者七日死滑細者生杖瘡河鬼代丹治打著不痛無名異研沒藥研乳香研地龍去土自然銅醋淬研木鱉子去殼等分上為末煉蜜丸如彈子大溫酒下一丸打不痛精乳香散治杖瘡神效自然銅半兩醋淬七次乳香三錢沒藥三錢茴香四錢當歸半兩上為細末每服五錢溫酒調下雞鳴散下杖痛腹中惡血甚好方見攧撲傷損五黃散治杖疼定痛黃丹黃連黃芩黃柏大黃乳香以上各等分上為細末新水調成膏用緋絹帛上攤貼潔沒藥散治杖瘡止痛令瘡不移密陀僧沒藥乳香各一兩干胭脂一兩半膩粉半兩上細末次入龍腦少許若多更妙燒蔥與羊骨髓生用同研如泥攤在緋帛上貼之丹杖瘡痛用黃柏生地黃紫荊皮敷此皆要藥也只是血熱作痛用涼藥去瘀血為先須下雞鳴散之類雞鳴散方見攧撲傷損條本草紫荊破宿血又方用生地黃黃柏童便調敷或加韭汁不破者以韭菜蔥頭杵貼冷即易之膏藥用紫荊皮乳香沒藥生地黃大黃黃柏之類又方用木耳盛於木杓內用沸湯浸爛攪水令乾於砂盆內擂細敷瘡上又方用大黃黃柏為末生地黃汁調敷如干再敷又方用野苧根嫩者不拘多少洗淨同鹽並擂敷在瘡上神妙傷重多用鹽世杖瘡丹用劉寄奴末六錢馬鞭草末四錢蜜調敷如濕者乾摻馬鞭草即鐵筅帚此方甚妙湯火瘡世凡湯火傷急向火炙雖極痛強忍一時即不痛慎勿以冷物塌之及井底泥敷之使熱氣不出爛入肌肉丹火燒以好酒洗之又以鹽敷其上如皮塌者以酒熬牛皮膠敷之如湯傷以淋過第二次灰渣敷立安熱酒傷糯米粉炒黑末酒調敷之治湯火灼未成瘡者用艾白根燒灰雞子黃和敷之如成瘡用白蜜封之以竹中膜貼上日三世治湯火瘡麩皮炒黑灰為末敷上神妙此方有補性始終皆可用治湯火瘡取舊烹銀爐中燒過焦黃土研細如粉以生薑調於帛上貼之痛止一方用溶銀鍋子細末油調敷佳千治火瘡未起梔子仁燒灰麻油和封之厚乃佳已成瘡燒白糖灰粉敷之燥即瘥用白糖葛氏方垣保生救苦散治火燒熱油所損或至肌肉亦脫一切犬齧損傷並刀斧所傷用生寒水石不計多少為極細末調塗之或幹上然不如油調其痛立止並不作膿無分毫痛苦楚日近完復永無破傷風症精冰霜散治火燒皮爛大痛寒水石生牡蠣燒朴硝青黛輕粉各等分上為細末新水或小油調塗立止治湯火所傷赤爛熱痛赤石脂寒水石大黃各等分上為末以新汲水調塗傷處丹治火燒桐油水銀各等分上二件以柳條不住手攪成膏再入大黃末石膏末和以牛皮膠入少水溶開外用貓兒肚底毛細剪摻上貼之羅緑白散治湯尉火燒疼痛用苦參不拘多少為細末每用以小油調搽精凡被湯熱油痛不可忍取廁下黑淤泥量傷大小斟酌多少次以老薑汁麻油十分之一共研令勻搽傷處立愈世以青黛敷之妙丹治湯火瘡爛者以黃蜀葵花落者淨器收之入水些少待爛成水敷上神妙熱油澆外痛以蜜敷之立安梅師方本治火瘡敗壞用雲母粉同生羊髓和塗之經治湯火瘡至妙用劉寄奴為末先以糯米漿雞翎掃傷處後搽藥末在上並不痛亦無痕大凡湯傷先用鹽末摻之護肉不壞然後敷藥又方以榆白皮末豬脂油塗瘡愈世治火湯瘡先以酒洗次以楊梅樹皮為末香油調敷治湯火瘡用發一束香油煎以發盡為度放冷搽患處驗精治中熱油及火燒除外痛以丹參八兩細銼以水微調取羊脂二斤煎三上三下以敷瘡上愈梅師方同治湯火至聖膏用雞子黃十個入銀石器內熬自然油調好粉敷之愈竹木刺針入肉精凡諸竹木刺入肉中不出以蠐螬研敷立出又方用白茅根搗敷之立出又方嚼牛膝根罨之即出簡治竹木刺扎入深不得出用烏羊糞搗爛水和罨於傷處厚敷之曾有莊僕腳心中刺不得出苦痛欲死以此藥黃昏敷之至四更其刺出遂安山蘆葦刺入肉者細嚼栗子渣盦傷處木竹刺已出痛者螻蛄罨之妙簡治針入肉不出用螻蛄腦子同硫黃研細調敷以紙花貼定如覺癢時其針自出羅神聖膏取針誤入皮膚用車脂不拘多少成膏攤紙上如錢許二日一換三五次其針自出又取針誤入皮膚用烏鴉翎三五枚火炙焦黃色碾為細末好醋調成膏子塗在瘡上紙蓋一二時針出效簡治針入肉不出用雙仁杏仁搗爛以車脂調勻貼在瘡上其針自出世治繡針刺足已出痛者用黃泥罨之簡主小兒誤為諸骨及魚骨刺入肉不出者水煮白梅肉研爛調象牙末厚敷骨刺處自軟圖生象牙主諸物刺入肉刮取屑細研和水敷瘡上刺立出如咽中刺用水調飲之舊象梳屑尤佳孟魚骨在肉中不出者嚼吳茱萸封之骨當爛出丹破傷風血凝心針入肉遊走三症如神方用烏鴉翎燒灰存性研細調一錢服箭頭入肉精治箭鏃入骨不可拔者巴豆去殼微熬蜣螂並研勻塗所傷處須臾痛定又微癢忍之待極癢不可忍便撼動箭鏃拔之立出經驗方同潔出箭頭方蜣螂不拘多少全用麝香上為極細末撥動箭頭摻藥瘡口內羅踴鐵膏取箭頭一切針刺入肉盡皆治之鼷鼠頭一個或用入油汁內熬螻蛄四十九枚芫青一兩土消蟲十個巴豆馬肉內蛆焙乾信醬蛆焙乾夏枯草硇砂磁石黃丹地骨皮蘇木蜣螂各一兩石腦油三兩蒿柴灰汁三升上將石腦油蒿柴灰汁文武火熬成膏次下地骨皮等末令勻瓷器內放臨時用量瘡勢大小點藥良久箭頭自湧出萬全神應丹出箭頭魚骨針麥芒等遠近皆治之莨菪科即天仙子苗也於端午日前一日持不語戒遍尋上項科見即取酌中一科根枝葉實全者口道先生爾卻在這裡道罷用柴灰自東南為頭圍了用木篦子撅起周回土次日端午日日未出時依前持不語用木撅只一撅取出水洗淨不令婦人雞犬見淨室中石臼內搗為泥丸如彈子大以黃丹為衣以紙袋封懸在高處陰乾若有著箭不能出者以緋絹袋盛此藥一丸放臍中用綿裹肚系定先用象牙末貼瘡上後用此藥若箭瘡口生合用刀子微刮開以象牙未貼之隨出陝西行省出軍曾用有效精孫真人治箭鏃在咽喉胸膈及針刺不出方以螻蛄搗取汁滴上三五度箭頭自出本療鏃不出搗栝蔞根敷瘡日三易自出世李渤治箭鏃不出及惡刺以齒垽和鶴蝨敷之姚毒箭有二種交廣夷俚用焦銅作箭此一種才傷皮便悶膿沸爛而死若中之用飲屎汁並以敷之亦可惟此最妙又有一種用射菵以塗箭鏃人中之亦困若著寬處不死近腹亦宜急治今葛氏方治射菵者是葛氏方用藍汁大豆豬羊血解之漆瘡千療漆瘡方用湯浸芒硝冷洗之又礬石亦可丹漆瘡通身面目腫者亦治苦芺五月五日採曝乾食療云生食亦可漢椒湯洗之妙生薑真汁敷亦可芺音燠本草有世治漆瘡用生紫蘇摩擦之纍效又方用人乳汁敷之妙集治漆瘡取荷葉乾者一斤水一斗煮取二升洗瘡上日再即瘥山漆瘡無名異水調敷通治諸般惡蟲咬羅聖惠治蛇咬蠍螫蠶咬妙雄黃三錢信一錢皂角子巴豆各四十九粒耳塞麝香各少許上五月五日不聞雞犬婦人處不語搗為細末在杏子核內封之針挑出上痛處大有神效世治一切蛇蟲傷貝母末酒調服效詳見蛇咬聖治惡蟲咬以酥和鹽敷之瘥山諸般惡蟲咬以油浸紫草塗之丹治蛇咬蠶咬惡蟲咬豬膏莓搗汁敷陳藏器治狗咬海治蠍蜘蛛蛇毒雞卵輕敲一小孔合咬處即瘥勝治毒蛇並射工沙蝨等傷眼黑口噤手腳強直毒攻腹內成塊逡巡不救用蒼耳嫩葉一握研取汁溫酒和灌之將渣厚罨所傷處簡治毒蛇射工沙蝨等物傷著人眼黑口噤手足強直毒氣入腹白礬甘草等分上為細末每服二錢冷水調下毒蛇咬丹治毒蛇傷急以小便洗出血次取口中唾塗之又以牙垽封傷處敷而護之甚妙且不痛腫山居云用犬糞敷患處亦佳世路行卒被蛇咬當急扯裹腳帶扎縛傷處上下寸許使毒氣不能惔傷肌體又急用白礬安刀頭火上溶汁沸滴於傷處待冷以長篦子速挑去靨則毒血隨出黯腫尚未退更滴之以退為度村居山僻及途中夜行卒被蛇傷咬難求白礬處速作艾炷灸五壯以唾調鹽塗之如黯腫尚未消釋當更灸更搽毒涎自然流出且不透里傷人蜈蚣咬亦宜灸世治一切毒蛇咬用透明雄黃研細末以醇酒濃調厚搽傷處水流出如涎痛腫即消一方以萵苣汁和雄黃末作餅子候乾為末每用少許貼瘡口立效衍有人被毒蛇所傷已昏困有老僧以酒調藥二錢灌之遂蘇及以藥渣塗患處良久復灌二錢其苦皆去問之乃五靈脂一兩雄黃半兩同為末止此耳後有中毒者用之無不效驗世治毒蛇所傷細辛五錢香白芷五錢雄黃二錢上為末加麝香少許每服二錢溫酒調服效丹治一切蛇咬用香白芷嚼碎敷患處又用溫酒調服效世治一切蛇蟲所傷用貝母為末酒調令病人儘量飲之頃久酒自傷處為水流出候水盡卻以藥渣敷瘡上即愈治蛇咬腫毒悶欲死者用重苔六分續隨子六顆去皮同為細末以酒服方寸匕又以唾調少許敷患處立安崔氏海上方又方用白礬二錢服之防毒氣攻心又方金線重樓以水磨少許敷咬處又為細末酒服之又方用柏樹葉魚腥草地松節皺面草草決明共一處研細敷傷處極佳海治蛇虺咬人以獨頭蒜酸漿草搗汁敷咬處佳海治蛇咬男子陰毛口含二十莖咽其津毒不入腹世治諸般蛇咬此傳之於擒蛇者藥味不全亦可大青小青青木香烏桕葉火炊草山蕨草肌過山龍地蜈蚣天門冬白芍藥香薷上細末用白木香研細生白酒調服渣罨咬處纍效聖治蛇咬毒食茱萸一兩為細末冷水調分為三服立瘥丹治蛇毒吃菰蔣草根灰取以封之其草即野茭白是也廣濟方蛇咬作瘡暖酒浸日三次廣利方蛇入人口並七孔中者割豬母尾頭瀝血著口中並孔口上即出聖治因熱取涼睡有蛇入口中挽不出者用刀破蛇尾內生椒二三粒裹著即出世治卒為蛇繞不解以熱湯淋之無湯令人尿之蛇咬忌食酸物梅子犯之大痛蜈蚣咬世治蜈蚣咬生雞血敷上立愈纍效一男子為蜈蚣入咽喉中咬之垂死之際一醫令殺生雞血乘熱灌喉中蜈蚣即出而愈實良方也又方用雞糞塗之又方治蜈蚣諸毒蟲傷麻油點燈於瘡口上對口熏之登時愈又法大油紙燃燒燈吹滅以余煙淬之治蜈蚣咬竹葉青研汁敷之立愈又方用南星磨汁敷之纍效梅治蜈蚣咬痛不止獨頭蒜磨螫處立愈聖治蜈蚣咬方用蝸牛挎取汁滴入咬處孫蜈蚣咬取蜘蛛一枚安咬處當自飲毒如蜘蛛死而痛未止更易生者丹蜈蚣咬嚼鹽敷其傷處次以鹽湯洗之梅師方蜈蚣咬頭垢塞之不痛則癢治蜈蚣咬及諸蟲咬毒先用鞋底上擦之用大蒜小蒜桑葉罨傷處如無用油豉盦傷處或藍靛塗罨之亦效治蜈蚣毒蟲咬用桑枝汁同鹽擦痛處或溶黃蠟滴患處肉黑為度又方用皂角於咬處上用艾灸熱去之效蠼螋咬丹治蠼螋尿成瘡初如粟漸大如豆如火燒泡大痛者速以草茶細末生油調敷瘡上立止甚妙又方豬膏莓搗汁敷之草茶即茶茗也治雨點蠼螋瘡用百合搗爛入鹽少許敷之效千治蠼螋尿人影著便令人病瘡如粟粒纍纍痛似刺蟲所螫惡寒壯熱用犀角磨汁塗之則愈世蠼螋蟲又名八腳蟲隱壁間以尿射人遍身生瘡如湯火傷用烏雞翎毛燒灰雞子白塗之治小兒蠼螋咬繞腹匝即死用梨葉研爛敷之食蠼螋尿瘡鹽三升水一斗煮取六升以綿浸湯淹瘡上蠍咬蜂螫羅雄黃消毒膏治蠍螫不可忍雄黃信各半兩巴豆三錢白礬生一兩上為細末黃蠟半兩溶開入藥攪勻為錠子如棗子大用時將錠子簽於燈焰上炙開滴於螫著處其痛立止潔一上散治蠍螫痛半夏一字用生為細末雄黃一字另研巴豆一個去皮研如泥上三味同研和勻上之治蠍毒用溶化白礬乘熱滴傷處痛止毒出廣治蠍螫人研蜘蛛汁敷之瘥山蠍螫苦蕒汁塗之世治竭螫地磨生薑塗之又方南星米醋調擦之外治蜂螫薄荷貼之瘥又方蜂蠍螫人用人參嚼以封之聖治蜂螫人以酥敷之愈斑蜘蛛咬張薦昔在劍南為張延賞判官忽被斑蜘蛛咬項上一宿咬處有二道赤色細如箸繞項上從胸前至心經二宿頭面腫疼如數升碗大肚漸腫幾至不救張相素重薦因出家財五百千並薦家財五百千募能療者忽一人應召云可治張相初不甚信欲驗其方遂令目前合藥其人云不惜方當療人性命耳遂取大藍汁一瓷碗取蜘蛛投入藍汁長久方出甚困不能動又別搗藍汁復加麝香雄黃和之更取一蜘蛛投汁中隨化為水張相及諸人甚異之遂令點於咬處兩日內悉愈但咬處作小瘡痂落如舊海蜘蛛咬遍身成瘡用青蔥葉一莖小頭作一孔盛蚯蚓一條捏兩頭不令透氣搖動化為水點咬處瘥丹蜘蛛咬處嚼韭白敷之山蜘蛛等諸般蟲咬用葛粉生薑汁調敷經蜘蛛咬唾和山豆根末塗之狗咬蚍蜉瘡蛇咬並水研山豆根敷之蚍頻脂切蚍蜉火蟻也蟻即蟻又方蜘蛛咬一身生絲羊乳一件飲之沈存中秦皮一味治天蛇毒此瘡似癩而非癩也天蛇即草間黃花蜘蛛人被其螫仍為露所濡乃成此疾以秦皮煮汁一斗飲之瘥刺毛蟲蚯蚓螻蛄蠶咬世春夏月樹下牆塹間有一等雜色毛蟲極毒凡人觸著者則放毛入人手足上自皮至肉自肉至骨其初皮肉微癢以漸至痛經數日癢在外而痛在內用手抓搔或癢或痛必致骨肉皆爛有性命之憂此名中射工毒諸藥不效用好豆豉約一碗清油半盞拌豉搗爛厚傅痛癢處經一時久豉氣透骨則引出蟲毛紛紛可見取下豆豉埋在土中煎香白芷湯洗痛處如肉已爛用海螵蛸即烏賊魚骨為末敷之愈一方取蒲公英根莖白汁敷之立瘥又方用鍋底黃土為末以酸醋捏成團於癢痛處搓轉其毛皆出在土上痛癢立止神效無比黃土即伏龍肝也治蛐蟺吹用老茶葉細末調敷丹治蚯蚓咬如大風狀眉髯皆落夜則蚯蚓鳴於身上濃作鹽湯浸數次安傳信方衍昔有病腹大夜聞蚯蚓鳴於身有人教用鹽水浸之而愈聖治螻蛄咬用槲葉燒灰細研以泔水浸槲葉取洗瘡拭之納少許灰於瘡中又方治螻蛄咬人用石灰醋和塗之丹蠶咬人用麝香研蜜調敷廣濟方山居蠶咬用苧汁塗之馬虎熊咬人山馬咬細嚼栗子敷傷處聖治馬咬毒入心馬齒莧湯食之瘥世治虎咬用野生菜搗爛塞所傷孔中滿不必換自然新肉長出而愈曾有人被咬已死用此方治之丹熊虎傷毒痛煮生鐵令有味以洗之肘後虎傷人瘡取青布緊卷燒一頭納竹筒中射瘡口令煙燻入瘡口中佳梅師方世虎傷人瘡用莓子葉杵細塗之按本草莓子葉即豬膏莓能治虎犬咬傷丹熊傷人燒青布熏瘡中毒出仍煮葛根濃汁以洗之日十次並搗葛根為散煮葛根汁方寸匕日五服瘥世鼠咬用貓兒毛燒灰敷之立愈丹鼠咬用麝香敷包之經驗山人咬傷用龜板或鱉甲燒為灰末以香油調敷犬咬丹犬咬人尿敷之犬咬人以頭垢敷傷處又用熱牛糞塗於外肘後衍犬傷人用杏仁量所傷大小嚼爛沃破處以帛系定立瘥世治犬咬用杏仁去皮尖用馬藺根研細先以蔥湯洗後以此藥塗傷處效治犬咬傷用萆麻子五十粒去殼以井水研成膏先以鹽水洗咬處次以此膏敷貼一方用虎骨屑敷之治犬咬人不要洗用紅炭火以物擊細待冷取塗咬處即愈治犬咬用黃荊葉搗罨瘡上即安又方炙生薑乘熱擦之尤妙丹狗咬用紫蘇葉口嚼碎塗之犬咬破傷風腫以人參於桑柴火上燒成灰末敷之安羅蟬花散治夏月犬傷及諸般損傷蛆蟲極盛臭惡不可近者蛇蛻皮一兩火燒存性蟬殼半兩青黛半兩細辛二錢五分上為細末每服三錢酒調下如六畜損傷成瘡用酒灌下如犬咬傷用酵子和吃蛆皆化為水蠅子不敢再落又以寒水石末乾摻上癲犬咬羅定風散治瘋犬咬先口噙漿水洗淨用綿拭乾貼藥更不再發大有神效天南星生防風各等分上為細末幹上更不再發無膿效不可具述丹治犬咬梔子皮燒灰石硫黃等分研細敷瘥梅師方世治瘋狗咬用桃核殼半個將野人干糞填滿以榆皮蓋定罨於傷處又用艾於桃核上灸十四壯即愈永不再發或用野犬糞如前法灸之山瘋狗咬即用犬糞塗仍拔去頂上紅髮世癲狗咬方用斑蝥七枚去頭足翅以糯米少許於新瓦上同炒以米黃香為度去米不用以斑蝥研碎好酒調下能飲人再進酒一杯傷在上食後服在下空腹服當日必有毒物從小便出如小狗狀如未下次日再進亦不下又進以毒物出為度若進至七服雖不下毒亦不妨矣服藥後腹中必不安小便莖中刺痛者不必慮此毒受攻將下耳痛甚者以蕪菁一匙煎甘草湯送下即止如無蕪菁青黛亦可疾愈後急以香白芷多雄黃少許為末搗韭根自然汁湯酒調下去斑蝥毒以水淨漱口嚼生蔥白罨傷處留小竅子出毒氣不可用他草藥罨忌犬豬羊及發風毒物小兒量歲數加減斑蝥食癲狗肉致病者治同即愈或過二三年再發治如前治癲狗所傷用斑蝥二十一個去頭翅並足用糯米一勺先將七個入米內微火炒不令米赤去此斑蝥別用七個再於前米內炒令斑蝥色變復去之又別用七個如前法炒以米出青煙為度去斑蝥不用以米研為粉用冷水入清油少許空心調服頃又再進一服以小便利下惡物為度如不利再進一服利後腹肚疼痛急用冷水調青靛服之以解其毒否則有傷或煎黃連水亦可不宜便食熱物或以益元散水調服尢妙世瘋狗咬取小兒胎髮炒香敷野菊花研細酒調服盡醉止效世治癲犬所傷或經久復發無藥可療者用之極驗雄黃色極明者五錢麝香五分上研勻用酒調二錢服如不肯服者則捻其鼻而灌之服藥後必使得睡切勿驚起任其自醒候利下惡物再進前藥則見效矣丹癡犬咬人搗地黃汁飲之並塗瘡口愈又方煮地榆汁飲之兼細末敷瘡上服方寸匕日三忌酒若瘡瘥者搗生韭汁飲一二升梅師肘後同瘋犬咬後毒發如狗叫聲於化人壇拾頭頂骨燒末敷之瘋狗咬毒發如狗叫者百方不治以人骨燒末之水下方寸匕雖煩亂者亦治梅師驢涎馬汗瘡丹驢涎馬汗入瘡腫漸甚可急治之遲則毒深不治以生烏頭末敷瘡口上良久黃水出立安世治驢涎馬汗入瘡用遠志去心為末酒調塗又方用冬瓜青皮陰乾為末貼瘡上又方馬汗入肉毒氣引入如紅線者急用烏梅肉嚼爛塗瘡上一方用烏梅和核爛研用好醋和成膏先將瘡口針破出盡紫紅血拭乾敷上以帛縛定王氏治驢涎馬汗毒所傷白礬飛過黃丹炒令紫色各等分相裹合以貼患處盂馬齒莧又主馬毒瘡以水煎令服一升一半塗瘡上濕癬白禿以馬齒膏和灰塗效附豬馬畜瘡丹治豬畜瘡豬㾩方蛇床子剪草白礬苦參巴豆末加羯羊糞桐油和敷之陶氏垣馬老鼠瘡二方其瘡未詳黃耆一兩半甘草七錢黃芩酒炒半兩黃連生用一兩黃柏酒七錢連翹七錢蒼朮當歸梢升麻各一兩麻黃根八錢防風二錢澤瀉七錢羌活藁本各三錢上為細末水二大碗煎至一碗冷灌之神效馬老鼠出足陽明太陰經分野大渴小便多草墁升麻二錢半葛根一錢連翹二錢當歸身一錢甘草炙一錢蒼朮一錢半黃柏二錢半黃芩一錢紅花少許黃連五分杏仁五個黃耆二錢生地一錢琥珀三分麻黃冬月加五分豬苓柴胡一錢半白茯苓一錢半澤瀉上為細末每服半兩水二碗煎至一碗冷灌之
