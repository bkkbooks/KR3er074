body:
  text: 卷之三十七小兒部心主熱錢肝熱手尋衣領及亂捻物瀉青丸主之壯熱飲水喘悶瀉白散主之壯熱者一向熱而不已也肺熱手掐眉目日西熱甚咳嗽寒熱壯熱飲水甘桔湯主之若肺虛熱唇深紅色輕者瀉白散重者涼膈散主之心熱視其睡口中氣溫或合面臥及上竄搖頭咬牙皆心熱也導赤散主之心氣熱則心胸亦然欲言不能而有就冷之意故合面睡脾熱則目黃肚大怠惰嗜臥身熱飲水四肢不收瀉黃散主之腎虛則下竄畏明地黃丸主之頰赤由心臟邪熱上攻也宜服導赤散錢面上證左腮為肝右腮為肺額上為心鼻為脾頰為腎赤者熱也隨證治之目內眥赤者心熱導赤散主之淡紅者心虛熱生犀散主之青者肝熱瀉青丸主之淺淡者補之黃者脾熱瀉黃散主之無精光者腎虛地黃丸主之潔古云目中五色甚者瀉本臟色淺者宜補之又云白是寒小便青四逆湯黃赤是熱承氣湯瀉本臟青是腹痛捻頭散主之桂枝芍藥湯亦主之脈小兒脈沉而數者骨間有熱欲以腹按冷清也錢身熱不飲水者熱在外身熱飲水者熱在內海四順飲子治熱在內而不厥連翹散治熱在外而不厥丹小兒發熱手足伏熱痰熱必用吐法輕劑苦參赤小豆末重劑瓜蒂散淡齏汁調服之如不吐用鵝翎探之錢朱監簿子五歲忽發熱醫曰此心熱也腮赤而唇紅煩躁引飲遂用牛黃丸三服以一物瀉心湯下之來日不愈反加無力而不能食又下之便利黃沫錢曰心經虛而有留熱在內必被涼藥下之致此虛勞之病也錢先用白朮散生胃中津液次以生犀散治之朱曰大便黃沫如何曰胃氣正即瀉自止虛熱也朱曰醫用瀉心湯如何錢曰瀉心湯者黃連一物耳黃連性寒多服則利能寒脾胃也坐久衆醫至皆曰實熱錢曰虛熱若實熱何以瀉心湯下之不安又加面黃頰赤五心煩躁不食而引飲醫曰既虛熱何大便黃沫錢笑曰便黃沫者服瀉心湯多故也錢與胡黃連丸治愈鄭人齊郎中者家好收藥散施其子忽臟熱齊自取青金膏三服並一服餌之服畢至三更瀉五行其子困睡齊言子睡多驚又與青金膏一服又瀉三行加口乾身熱齊言尚有微熱未盡又與青金膏其妻曰用藥十餘行未安莫生他病否召錢氏至曰已成虛羸先用前白朮散時時服之後服香瓜丸十三日愈香瓜丸即香瓜散方見自汗條海風熱邪熱四君子湯加生薑荊芥煎云小兒客熱在內不思乳食先用導赤散次用益黃散實熱在內者四順飲之類在上者吐之方見表裡條丹小兒熱病六一散妙藥也食傷胃熱熏蒸白朮一兩半夏黃連各半兩加平胃散粥食後白湯下本治小兒驚熱全蠍天南星取心為末一錢人參三錢蛇蛻三錢上為末薄荷蜜湯調下錢風溫熱壯熱相似潮熱時間發熱過時即止來日依時又熱此欲發驚候也壯熱者一向熱而不已甚則發驚癇也風溫者身不熱而口中氣熱又有風溫症者但溫而不熱傷寒熱口熱呵缺頓悶項急治見傷寒部痘瘡熱噴嚏悸動耳尖冷治見痘瘡部變蒸熱唇上白泡珠起耳冷不必治疳熱面黃吃炭土羸瘦鼻下赤爛治見疳部驚風熱發搐悸癇脈數煩躁顛叫恍惚治見急驚部素帝曰乳子而病熱脈懸小者何如岐伯曰手足溫則生寒則死通評虛實論甲乙經謂婦人乳子者錢熱證疏利或解化後無虛證勿溫補熱必隨生潮熱熱有作止每日應時而發也錢地骨皮散治虛熱潮作亦治傷寒壯熱及餘熱知母甘草炙半夏洗七次銀柴胡去蘆人參地骨皮赤茯苓以上各等分如有驚熱加蟬蛻天麻黃芩若加秦艽名秦艽飲子上為細末每服二錢生薑三片水煎食後溫服量大小加減海藏云地骨皮散即小柴胡湯加減法自汗者地骨皮散無汗者柴胡湯三黃湯仲景所用錢氏改諸丸散加減並出古法生犀散治症同前生犀角銼末二錢地骨皮赤芍藥柴胡葛根各一兩甘草炙半兩上為粗末每服一二錢水煎食後溫服海藏云生犀湯即犀角地黃湯加減法此少陽陽明相合也田犀角散治小兒骨蒸肌瘦頰赤口乾晚潮熱夜有盜汗五心煩躁四肢困倦飲食雖多不生肌肉犀角末地骨皮麥門冬枳殼麩炒大黃蒸柴胡茯苓赤芍藥黃耆桑白皮人參鱉甲醋塗炙各等分上為粗末每二錢入青蒿少許水煎量兒大小加減一鍾煎八分食後溫服丹小兒潮熱盜汗胡黃連柴胡等為細末煉蜜丸芡實大每二丸酒化開入少水煎小沸服錢朱監簿子五歲夜發熱曉即如故衆醫有作傷寒治者有作熱治者以涼藥解之不愈其候多涎而喜睡他醫以鐵粉丸下涎其病益甚至五日大引飲錢曰不可下之乃取白朮散一兩煎藥汁三升使任意取足服朱生曰飲多不作瀉否錢曰無生水不作瀉縱多不足怪也但不可下耳朱生曰先治何病錢曰止瀉治痰退熱清神皆此藥也至晚服盡錢視曰更可服三升又煎白朮散三升服盡得稍愈第三日又服白朮散三升其子不渴無涎又投阿膠散二服而安錢秦艽散治潮熱減食蒸瘦秦艽去頭切焙甘草炙各一兩薄荷葉切焙半兩上為粗末每服二錢水一鍾煎八分食後溫服潔潮熱有時胸滿短氣者桃枝丸方見小兒積熱湯風痰熱晚熱早涼吃水無時此候乃痰作潮而生風熱即宜金星丸下之或氣弱者不可下宜奪命散以控下涎次服惺惺散加南星白附子奪命散方見驚風門惺惺散方見痘疹門金星丸治風熱結聚喉內痰鳴喘粗咳嗽面紅腮腫咽膈壅塞發熱狂躁多渴鬱金末雄黃另研各一分膩粉半分巴豆七枚去油上為末米醋糊丸麻子大薄荷臘茶下脈經云小腸有宿食常暮發熱明日復止此宿食夜熱也海藏云夜熱屬陰四順飲之類此血熱在夜也積熱久熱也疳熱亦久但兼面黃吃炭土鼻下爛也無小兒積熱者表裡俱熱遍身皆熱頰赤口乾小便赤大便焦黃先以四順清涼飲子利動臟腑則熱去既去復熱者內熱已解而表熱未解也當用惺惺散紅綿散加麻黃微發汗表熱乃去表熱去後又發熱者何也世醫到此盡不能曉或再用涼藥或再解表或以謂不可醫誤致夭傷者甚多此表裡俱虛氣不歸元而陽浮於外所以再發熱非熱證也只用六神散入粳米煎和其胃氣則收陽歸內身體便涼熱重者用銀白散清涼飲子每服二錢薄荷三錢同煎方見治寒熱法惺惺散方見痘疹門紅綿散白殭蠶炒二兩天麻生用一兩天南星切薄片油浸黃二兩蘇木節另研二兩半上為末每服一錢水一小盞入紅綿少許同煎至六分溫服凡小兒風熱頭目不清並宜服之若傷寒有表證發熱者每服入去節麻黃末五分有裡熱心燥渴者入滑石末半錢同煎服之六神散人參白茯苓乾山藥白朮白扁豆甘草炙各等分上為末每服一大錢水一小盞棗一枚姜二片同煎至五分服此藥用處甚多治胃冷加附子治風症加天麻治痢加罌粟殼銀白散乾山藥白朮白茯苓各半兩人參白扁豆知母甘草炙升麻各等分上為末每服一大錢水一小盞棗一枚生薑二片同煎溫服不拘時候錢桃枝丸疏取積熱及結胸又名桃符丸巴豆霜大黃黃柏各一錢輕粉硇砂各半錢上細末麵糊丸粟米大煎桃枝湯下一晬兒五七丸五七歲二三十丸未晬兒二三丸臨臥服梔豉飲子治小兒蓄熱在中身熱狂躁昏迷不食梔子仁七枚豆豉半兩上用水三盞煎至二盞看多少服之無時或吐不吐立效變蒸熱變蒸者陰陽水火蒸於血氣而使形體成就是五臟之變氣而七情之所由生也蓋兒生之日至三十二日一變每變蒸畢即覺性情有異於前何者長生臟腑意智故也何謂三十二日長骨添精神人有三百六十五骨以象天數以應期歲以分十二經絡故初生至三十二日一變生癸屬足少陰腎藏精與志六十四日二變一蒸生壬屬足太陽膀胱其發耳與骫冷至九十六日三變生丁屬手少陰心經心藏神其性為喜一百二十八日四變二蒸生丙屬手太陽小腸其發汗出而微驚一百六十日五變生乙屬足厥陰肝肝藏魂喜哭一百九十二日六變三蒸生甲屬足少陽膽其發目不閉而赤二百二十四日七變生辛屬手太陰肺肺藏魄生聲二百五十六日八變四蒸生庚屬手陽明大腸其髮膚熱而汗或不汗二百八十八日九變生己屬足太陰脾脾藏意智至三百二十日十變五蒸生戊屬足陽明胃其發不食腸痛而吐乳又手厥陰心包絡手少陽三焦此二經俱無形狀故不變而不蒸也前十變五蒸乃天地之數以生成之然後始生齒能言知喜怒故云始全也太倉云氣入四肢長碎骨於十變後六十四日為一大蒸計三百八十四日長其經脈手足手受血故能持握足受血故能行立經云變且蒸謂蒸畢而足一歲之日有餘也師曰不汗而熱者發其汗大吐者微止不可別治又六十四日為二大蒸計四百四十八日又六十四日三大蒸計五百一十二日共五百七十六日變蒸既畢兒乃成人也變者變生五臟也蒸者蒸養六腑也所以成人變者上氣蒸者體熱每經一變一蒸情能既異輕則發熱微汗其狀似驚重則壯熱脈亂而數或吐或汗或煩啼躁渴輕者五日解重者七八日解其候與傷寒相似亦有變蒸之餘續感寒邪者但變蒸則耳冷骫冷上唇發泡狀如泡珠若寒邪搏之則寒熱交爭腹中作痛而啼叫之聲日夜不絶變者易也蒸於肝則目眩微赤蒸於肺則嚏嗽毛聳凡五臟六腑筋脈骨節循環各有證應其治法和平之劑微表之熱實者微利之或不治亦自愈湯千金變蒸論云凡兒生三十二日一變六十四日再變變且蒸九十六日三變一百二十八日四變變且蒸一百六十日五變一百九十二日六變變且蒸二百二十四日七變二百五十六日八變變且蒸二百八十八日九變三百二十日十變變且蒸積三百二十日小蒸畢後六十四日大蒸蒸後六十四日復大蒸蒸後一百二十八日復大蒸凡小兒自生三十二日一變再變為一蒸凡十變而五小蒸又三大蒸積五百七十六日大小蒸都畢乃成人小兒所以變蒸者是榮其血脈改其五臟故一變竟輒覺情態有異其變蒸之候變上氣者蒸者體熱變蒸有輕重其輕者體熱而微驚耳冷尻冷上唇頭白泡起如魚目珠子微汗出重者體壯熱而脈亂或汗或不汗不欲食食輒吐哯目白睛微赤黑精微白又云目白者重赤黑者微變蒸畢自精明矣此其證也單變小微兼蒸小劇凡蒸平者五日而衰遠者十日而衰先期五日後期五日為十日之中熱乃除耳或違日數不歇切不可妄治及灸刺海藏云言變蒸通一十八次蓋前三百二十日為十小蒸後二百五十六日為十大蒸也哯乎典切不嘔而吐也無若身熱耳熱尻亦熱此乃他病可作別治紫霜丸治小兒變蒸發熱不解並挾傷寒溫壯熱汗後熱不渴及腹中有痰癖哺乳不進乳則吐哯食癇先寒後熱者代赭石醋淬一兩赤石脂一兩巴豆三十粒去油杏仁五十個去皮尖上先將杏仁巴霜細研為膏卻入二石相合更搗一二千杵當自相得若硬入少蜜同杵之密器中收三十日兒服如麻子大一粒與少乳汁令下食頃後與少乳勿令多至日中當小下除熱若未全除明日更與一粒百日兒服如小豆大一粒以此準定增減紫霜丸無所不治雖下亦不虛人心痛心痛當於大人心痛門參用之心痛吐水者蟲痛心痛不吐水者冷心痛錢靈礬散治小兒蟲咬心痛欲絶五靈脂二錢白礬火飛半錢上同研每服一二錢水一鍾煎至五分溫服無時當吐出蟲弄舌錢弄舌脾藏微熱令舌絡微緊時時舒舌治勿用冷藥及下之當少與瀉黃散漸服之田氏云若肥實者用牛黃散治之或欲飲水醫疑為熱用冷藥下之者非也飲水者脾胃津液少故也又加面黃肌瘦五心煩熱即為疳宜加胡黃連輩若大病未已用藥弄舌者凶重舌湯重舌附舌下近舌根生形如舌而小謂之重舌其著舌下如此者名重舌其著頰裡及上齶如此者名重齶其著齒齦上如此者名重齦皆刺之去血可也田重舌治法用苦竹瀝漬黃柏末點舌上如不愈後用真蒲黃敷之不過三次愈用真蒲黃微炒紙鋪地上出火氣研細每挑些糝舌下更以溫水蘸熟帛裹指輕輕按之按罷滲藥姚治小兒重舌馬牙硝塗舌下日三度世治小兒重舌木舌先用新水揉口並舌上下後用皂角針燒灰入腦子少許每用半字糝舌上下出涎立效子母治小兒重舌燒烏賊魚骨細研和雞子黃敷喉及舌上簡治小兒重舌欲死亂髮灰細研以半錢敷舌下日不住用之丹重舌桑白皮煮汁塗乳飲之祕録又以蜣螂燒末唾敷之木舌湯木舌者舌腫漸漸粗大滿口不急治即塞殺人也田木舌治法用局方中紫雪一分竹瀝半合和之時時抹入口中自消丹小兒木舌百草霜滑石芒硝為末酒調敷舌白胎丹舌上生如粥粒桑白皮汁敷之三兩次妙鼻衄湯地黃湯治榮中熱及肺壅鼻血生瘡一切丹毒生地赤芍藥當歸川芎各等分上㕮咀水煎去渣量大小加減服如鼻衄臨熟入生蒲黃少許生瘡加黃耆等分丹毒加防風等分同煎纍驗春冬衄者用生地黃研取汁加生蒲黃少許砂糖井花水浸服之愈秋夏衄者用車前草一握洗淨同生姜一處研取汁入生蜜一匙先拌渣塞鼻次用新汲水和蜜並車前草生薑汁飲之即愈又方生蘿蔔取根搗自然汁仰頭滴入鼻管中即止次以新汲水和蜜蘿蔔汁飲之良遲言錢菖蒲丸治小兒心氣不足五六歲不能言石菖蒲三分人參五錢丹參三錢天麥門冬去心各一兩赤石脂二錢直指有當歸川芎硃砂上為細末煉蜜丸如緑豆大溫水下十丸至二十丸日二三服久服效又有病後腎虛不語宜兼服六味地黃丸海藏云地黃丸足少陰也與菖蒲丸上下通經雞頭丸治小兒諸病後不能語雄雞頭炙一個鳴蟬炙焦三個大黃煨一兩甘草一兩當歸三分木通黃耆各半兩川芎遠志去心麥門冬去心各三分上同為細末煉蜜丸如小緑豆大平旦米飲下五丸空心日三四服兒大者加之久服取效雞蟬二物宜求死者用之不可旋殺孫真人所謂殺生求生去生更遠矣海百舌鳥今之鶯也名反舌主小兒不語炙食之又治蟲咬錢腎怯失音相似病吐瀉及大病後雖有聲而不能語此非失音為腎怯不能上接於陽故也當補腎地黃丸主之失音乃猝病耳口噤不止則失音聲遲亦同明五六歲不語者心腧三壯盜汗錢黃耆散治虛熱盜汗牡蠣煅黃耆生地各等分上為末煎服不拘時盜汗睡而自汗出肌肉虛也止汗散主之遍身汗香瓜丸主之止汗散用故蒲扇灰研細每服三錢溫酒調下無時如無以故蒲代之虎杖散治實熱盜汗虎杖水煎服量多少與之無時海晉郎中子自嬰至童盜汗凡七年矣諸藥不效豫與涼膈散三黃丸三日病已蓋腎為五液化為五濕相火逼腎腎水上行乘心之虛而入手少陰心火炎上而入肺欺其不勝己也皮毛以是而開腠理玄府不閉而為汗出也出於睡中者為盜汗以其覺則無之故經曰寢汗憎風是也先以涼膈散瀉胸中相火相火退次以三黃丸瀉心火以助陰則腎水還本臟玄府閉而汗為之自已世治小兒盜汗用鬱金末塗兩乳下立效自汗錢治病有等張氏三子病大者汗遍身次者上至頂下至胸小者但額有汗衆醫以麥煎散治之不效錢曰大者與香瓜丸次者與益脾散小者與石膏湯各五日而愈香瓜丸胡黃連大黃瓜黃色者一個大黃濕紙裹煨柴胡去蘆鱉甲醋炙黃黃柏黃連蘆薈青皮各等分上除黃瓜外同為細末將黃瓜割其頭填入諸藥至滿卻蓋口用杖子插定火內煨熟將黃瓜及藥同用麵糊丸如緑豆大每服二三丸食後冷漿或新水下大者五七丸不過十丸胃怯汗上至頂下至臍此胃虛當補胃益黃散主之錢六陽虛汗上至頂不過胸也不須治之喜汗厚衣臥而額汗出也止汗散主之癰癤湯凡癰癤未見之初微見有紅頭瘰子起隱疼者急用不語唾夜半頻頻塗之飲酒了不可用治發背癰癤方羌活一兩穿山甲炒焦半兩生人骨煅存性半兩麝香少許上末煎麻黃薄荷酒調如陰瘡頭平向內者服之即突出其功效不可盡述若小兒痘瘡黑陷者只一服而起萬不失一腮腫本治小兒毒氣攻腮赤腫可畏者皂角去核二兩天南星生用二錢糯米一合上為細末薑汁調塗立效惡核瘰癧湯小兒惡核生於項頸上遇風寒所折不消結成瘰癧久而潰膿生瘡也宜服四味大黃飲即四順清涼飲子是也瘰癧又方升麻射干連翹犀角屑大黃微泡朴硝各半兩上㕮咀水煎大小加減忌酒面炙爆物貼惡核方赤小豆豬牙皂角硝石黃藥子木鱉子各半兩上末雞子清調塗患處貼散瘰癧神效方白膠香降真香用心無土氣者海螵蛸上等分為末糝患處外以水紙掩之一夜而退赤丹田赤遊治法宜服犀角散一法先鐮去惡血服上藥犀角散方見潮熱湯小兒丹毒乃熱毒之氣極與血相搏而風乘之故赤腫及遊走遍身者又名赤遊風入腎入腹則殺人也大抵丹毒雖有多種病源一也有赤丹毒遍身癢者或女子十五六而脈未通者多發丹疹皆由血有風毒乘之宜服防己散漢防己半兩朴硝犀角黃芩黃耆升麻各一分上㕮咀竹葉煎大小加減丹小兒黑斑紅斑瘡癢癮疹並用防風通聖散治之荊芥散防風天花粉羌活生地黃當歸蟬蛻各等分水煎服解毒散寒水石滑石石膏辰砂上三石等分為末入辰砂少許量兒大小燈心湯下又方赤小豆木鱉子橡枓子南星大黃朴硝上為末用慈姑薄荷靛青和蜜水調塗患處外用雄黃圍之卻服荊芥解毒二散聖小兒發斑散毒氣用生葵菜葉絞取汁少少與服之千治小兒丹發慎火草生一握搗取汁敷之效祕録治小兒赤遊丹行於上下至心即死搗芭蕉根汁煎塗之兵部治孩子赤丹不止以胡荽汁敷瘥祕録小兒赤遊行於體上下至心即死以芒硝納湯中取濃汁以拭丹上錢丹瘤熱毒氣客於腠理搏於血氣發於外皮上赤如丹當以白玉散塗之白玉粉即滑石一分寒水石半兩上末之用米醋或新水調塗山火丹磨銅鐵水調廁上泥敷之小兒赤遊風用朝南燕巢泥雞子清調敷將腫處用針割破鮮魚血塗之尤妙丹小兒天火丹臍腰起者赤溜不妨用蚯蚓泥炒研細香油敷之田又法用牛膝一兩去苗甘草半兩生銼碎水煎一大盞去渣調伏龍肝塗之山小兒赤丹伏龍肝為末芭蕉油調敷又方用雉雞毛及鵝毛燒灰香油調敷湯又敷丹毒方只一夜消盡用花蕊石生薑薄荷自然汁調鵝毛刷上患處為妙張三太尉女十五歲病此諸醫百藥俱試而不能中召豫視之以生料四物湯加防風黃芩一日而愈生料四物湯治血熱生瘡遍身腫癢及脾胃常弱不禁大黃等冷藥尤宜服之生地赤芍藥川芎當歸防風各半兩黃芩一錢半上㕮咀水煎量大小加減忌酒面豬羊肉豆腐丹小兒赤溜主傷血熱宜生地黃木通荊芥苦藥帶發表之類外以芭蕉油塗患處世丹癢者用韭菜挨些鹽與香油以手摩熱于丹上揩之立愈丹小兒丹瘤萆麻子五個去皮研入面一匙水調塗之甚效本小兒十種丹瘤腫毒所起形候並方治法一飛灶丹從頂頭起先腫用蔥白研取自然汁塗二古灶丹從頭上紅腫痛用赤小豆末雞子清調塗談氏方同不拘何處皆治三鬼火丹從面起赤腫用灶心土雞子清調塗按不拘何處皆治妙四天火丹從背起赤點用桑白皮末羊脂調塗五天灶丹從兩腎赤腫黃色用柳葉燒灰水調塗腎一作臂六水丹從兩脅虛腫用生鐵屑為末豬糞調塗七胡火丹從臍上起黃腫用檳榔為末米醋調塗八野火丹從兩腳赤腫用乳香末羊脂調塗九煙火丹從兩腳有赤白點用豬槽下土麻油調塗十胡漏丹從陰上起黃腫用屋漏處土羊脂調塗上此十種丹毒變易非輕治之或緩則終不救故豫不惜是方能逐一仔細辨認依此方法治之萬不失一如經三日不治攻入臟腑則終不救不可緩也丹赤遊風於身上下至心即死蒴藋煎汁洗之子母祕録蒴藋即白花草藥也世百日內發必死不治疥癬海小兒經絡蘊熱頭面及身體生瘡四君子加栝蔞根桔梗各半錢煎服湯小兒惡瘡天氣溫和頻與澡洗更衣名曰外宣亦不宜服藥小兒不得已而服藥此乃下法若將養合宜何疾可侵更令乳哺有節勿令過飽其身乃如藥樹此養生之理也湯惡瘡方頻浴身安外宣無病春用柳條荊芥夏用棗葉槐枝秋冬用苦參煎湯洗敷瘡藥方剪刀草黃連苦參上等分為末先洗淨次用麻油輕粉調敷田瘡癬治法浸淫瘡宜用苦瓠散塗之乾癬宜用羊蹄根絞自然汁調膩粉塗之濕癬宜用青金散貼之苦瓠散治小兒浸淫瘡漸展不止苦瓠二兩蛇蛻皮燒灰半兩蜂房微炒半兩梁上塵一合上為細末生油調塗攤帛上貼青金散治小兒濕癬浸淫瘡白膠香研一兩輕粉半兩青黛二錢半上研為細末干糝瘡上祕録治小兒風疹不止白礬十二分暖熱酒投化用馬尾蘸酒塗之山小兒頭面爛瘡木耳舂細蜜調敷又冷水調平胃散敷俱干則易之眉煉田眉煉治法用青金散敷之如不愈燒小麥存性研細好油調塗耳瘡耳凍瘡丹小兒耳後月蝕瘡蚯蚓糞燒以豬油和敷之耳上生瘡竹葉燒末豬脂敷之妙楊氏以雞子白和敷立瘥耳月蝕方胡粉和上敷之耳後月蝕黃連末敷之安湯白蘞散治小兒凍耳成瘡或癢或痛黃柏白蘞各半兩上為末先以湯洗瘡後用生油調塗面瘡世治小兒面瘡通面爛無全膚膿水流漓百藥不效者陳年臘豬油不入鹽者敷之神效口瘡簡如聖散治小兒口瘡不能吃乳者江子一粒或二粒研爛不去油入硃砂黃丹敷紙絹上少許剃開小兒囟門貼在囟上如四邊起粟米泡便用溫水洗去藥恐成瘡更用菖蒲水洗便安其效如神世南星膏治口瘡小兒難用藥以大天南星去皮取中心龍眼大為末卻用酸醋調塗腳心甚妙千治小兒口瘡飲乳不得以白礬如雞子大置醋中塗兒足底二七次即愈無牡蠣散治小兒口瘡牡蠣煅通紅取出候冷研細以紙裹入土中七日出火氣三錢甘草炙為末一錢上和勻時時挑少許糝口中或吐皆無害田口瘡治法乳母同兒宜服洗心散瀉心湯然後用黃柏末研細糝之瀉心湯方黃連一味為末蜜水調不可煎湯治口瘡驗方黃柏蜜炙赤半兩青黛一分上二件為末頻糝口內愈鬥口瘡服涼藥不愈者此中焦氣不足虛火泛上宜附子理中湯癩頭瘡世治久癩頭用黃連細末敷之治年久癩頭內用苦參丸食後服之外用苦參末油敷之二月愈丹又方用防風通聖散酒製除大黃另研為末再用酒拌曬乾為末每一錢水煎服日四五服至三十帖見效又方川芎片芩酒芍藥酒陳皮各半兩白朮酒當歸酒各一兩天麻酒蒼耳七錢半黃柏酒粉草酒防風各三錢上㕮咀煎服四五次服之服過睡片時小兒癩頭用燒紅炭淬長流水令熱洗之仍用芫荽子煎豬脂去子用脂敷患處又法用胡荽子伏龍肝懸龍尾黃連白礬為末油調敷頭瘡方豬油一錢半生半熟雄黃水銀各二錢半上研和勻敷瘡上又方治小兒癩頭並身癩等證用松皮燒灰白膠香枯礬大黃黃柏油調敷患處又方用臘月馬脂油搽患處極妙簡頭瘡大筍殼燒為灰量瘡大小用灰調生油敷又加膩粉佳祕録小兒頭身諸瘡燒雞卵殼和豬脂敷之世治癩頭松香一兩干銚溶開安在石上俟冷取起輕輕研細黑龍尾三錢即屋塵垂掛者白芷半兩松樹皮燒灰二錢水銀二錢黃丹三錢雄黃白礬各二錢上為末以血餘入香油煎爛調敷患處腳凍瘡湯生附散治爛腳瘡用生附子為末面水調敷之愈痘瘡治法通論錢瘡疹惟用溫平藥治之不可妄下及妄攻發受風冷海藏云溫平者非熱劑如荊芥薄荷防風牛蒡子甘草之類活人鼠黏子湯潔古解毒防風湯相兼選用是也丹溪云鼠黏子連翹山楂甘草此四味痘瘡始終必用之藥錢診睦親宮中十大王瘡疹云瘡疹始終出未有他證不可下但當用平和藥頻與乳食不受風冷可也如瘡疹三日不出或出不快即微發之鼠黏子湯之類如瘡發後不多出即加藥如一日一帖即加至二帖加藥不出即大發之升麻葛根防風羌活獨活麻黃桂枝之類如發後不多及脈平無證即瘡本稀不可更發也有大熱者當利小便小熱者當解毒利小便四聖散之類若不快勿發勿下攻止用抱龍丸治之瘡疹若起能食者大黃丸下一二行即止有大熱者當利小便有小熱者宜解毒若黑紫干陷者百祥丸下之不黑者慎勿下身熱煩躁腹滿而喘大小便澀面赤悶亂大吐此當利小便不瘥者宣風散下之也若五七日痂不焦是內發熱氣蒸於皮中故瘡不得焦痂也宜宣風散導之用生犀角磨汁解之使熱不生必著痂矣潔論曰癍疹之病其為證各異瘡發焮腫於外屬少陽三焦相火也謂之癍小紅靨行皮膚中不出者屬少陽君火也謂之疹凡顯癍疹若自吐瀉者不可妄治而多吉謂邪氣上下皆出也大凡癍疹首尾皆不可下恐動則生變此謂少陽通表宜和之也當先安里解毒次微發之解毒須安五臟防風湯是也如大便不祕者須微發之藥宜錢氏方中選而用之如大便過祕宜微利之當歸丸棗變百祥丸是也初知癍疹若使之並出小兒難禁是以別生他症也首尾不可下者首曰上焦尾曰下焦若既吐利安可下便宜安里若不吐瀉者先與安里藥三五服如能食而大便祕結內實者宜疏利之若內虛而利者宜用安里藥一二服末後一服調以微發之藥要之安里之藥多發表之藥少祕則微疏之令邪氣勿壅並而能作番次出使兒易禁也身溫者順身涼者逆二者宜多服防風湯和之安里解毒防風湯防風一兩地骨皮黃耆芍藥荊芥枳殼鼠黏子各等分上為末水煎四五錢服若能食而大便實宜當歸丸微利之當歸丸棗變百祥丸二方並見痘瘡大便祕門海夫癍之為病皆由子在母腹中時浸漬食母血穢蘊而成毒皆太陰濕土壅滯君相二火之所作也因小兒真氣既盛正氣又旺邪無所容或遇天寒或因傷表或因傷里癍由是而出焉治當何如外者外治內者內治中外皆和其癍自出至於惡寒者發之表大熱者奪之渴者清之大便祕結者下之小便不通者利之驚者安之泄者分之可以執一為哉大抵傷寒同治隨經用藥最為高論假令五日以里諸病與癍疹不能別辨者不可疑作癍疹必須發之但各從其所傷應見治之皆不妨癍出若強發之其變不可勝數矣前人言首尾俱不可下者為癍未顯於表下則邪氣不得伸越此脈證有表而無里故禁首不可下也尾不可下者為癍毒已顯於外內無根蒂大便不實無一切里證下之則癍氣逆陷故禁尾不可下也又言溫暖蓋覆不令通風以癍未出或身表涼而惡寒或天令寒而惡冷溫暖蓋覆不令通風也癍若已出身熱天暄何必用蓋覆而不使之通風乎後人執此二句首尾俱不敢下溫燠不令通風不知天令之所加人身之所盛致使誤人多矣大抵前人之言隨時應變後之人不知其變故常執而不移也噫首尾俱不可下者以其始終臟腑元無凝滯也若有一切里證及大便結者安得不下溫暖不使之通風以其發在冬時故如此也若發在夏時癍雖未出亦不用此也癍之用藥大率以脈為主浮中沉之脈平舉按之候察其虛實定其中外則可以萬全矣如外傷升麻湯主之方見本門內傷枳實丸主之大便耎者枳朮丸主之若傷冷者溫之神應丸三方俱見內傷飲食惡寒者發之宜防風蒼朮湯方見本門前條表大熱者奪之此表者通言三陽也夫陽盛者氣必上行言奪者治之不令上行也是知無三陽表證有三陽里證染於有形也此言表總三陽之名也渴者清之大渴者白虎湯暑月用之小渴者涼膈散涼膈散去硝黃加甘桔者穩大便祕結者下之桃仁承氣湯四順飲子柴胡飲子選用察其在氣在血必內實能食而祕者可用但當微微潤之小便不通者利之導赤散八正散之類當求上下二焦何經而用之驚者安之涼驚丸重者瀉之瀉青丸泄者分之寒則異功散四君子湯熱則澤瀉茯苓湯小兒癍疹初發未能辨認間但求所出之由因內因外及不因外內隨其所傷如法服餌防其變故抑其盛氣比之他證尤不可緩或發或瀉或解其肌或化其毒求其所起之由涼血清肺調其臟腑平其飲食謹其禁忌嚴其養攝適其寒溫將理有法俾盡其道使出無不快之經成無不痂之潰既愈之後不致遊毒流汗虛腠目疾膜翳瘡癤癰瘤喉閉嗌腫潮熱汗泄此治癍之大略也凡未出而發搐者是外感風寒之邪內發心熱之所作也當用茶粉下解毒丸犀角地黃湯主之一發出便密如針頭形勢重者合輕其表而涼其內連翹升麻湯若癍已發密重微喘飲水者有熱證用去風藥微下之若出不快清便自調知其在表不在裡當微發升麻葛根湯若青乾黑陷身不大熱大小便澀則是熱在內煎大黃湯下宣風散若身表大熱者表證未罷不可下若癍已出見小熱小便不利當以八正散利之若已發後有餘毒未散復有身熱瘡腫之類當茶粉下解毒丸凡瘡疹已出後有聲音者乃形病而氣不病也瘡疹未出先聲音不出者乃形不病而氣病也若瘡疹出而聲音不出者是形氣俱病也當清其肺氣宜用八風湯並涼膈散去硝黃亦可丹小兒痘疹分氣血虛實以四君子四物酒炒芩連等服之氣虛參術加解毒藥血虛四物加解毒藥上加解毒者酒炒黃芩炒黃連是也海藏云解毒者三黃湯金花丸之類丹痘瘡分人之清濁就形氣上取勇怯痘瘡黑屬血熱涼血為主白屬氣虛補氣為主中黑陷而外白色起遲者則補氣中略帶涼血藥陳痘瘡未出已出之間或瀉渴或腹脹或氣促謂之裡虛速與十一味木香散治之如已出之間其瘡不光澤不起發根窠不紅謂之表虛速與十二味異功散治之如已出之間其瘡不光澤不起發根窠不紅或瀉渴或腹脹或氣促是表裡俱虛也速與十二味異功散送下七味肉豆蔻丸治之丹溪云木香異功散二藥治寒的當若虛而不寒者禍不旋踵如瘡始出一日至十日渾身壯熱大便黃是表裡俱實也其瘡必光澤必起發必飽滿必易靨而不致損傷若無他疾不宜服藥表裡俱實者易出易靨表裡俱虛者易出難靨表虛難出裡虛難靨隨症治之張巽之治痘要法吐瀉少食為裡虛陷伏倒靨灰白為表虛二者俱見為表裡俱虛全用異功散救之甚至薑附靈砂亦可用若止裡虛減官桂若止表虛減肉豆蔻不減官桂丁香若能食便祕而陷伏倒靨者為裡實當用錢氏及丹溪下法若不吐瀉能食為裡實裡實而補則結癰毒紅活綻凸為表實表實而用表藥則潰爛不結痂凡痘但見癍點便忌葛根湯恐發得表裡俱虛也丹讀前人之書當知其立言之意苟讀其書而不知其意求適於用不可得也痘瘡之論錢氏為詳歷舉源流經絡分明表裡虛實開陳施治之法而又證以論辨之言深得著書垂教之體學者讀而用之如求方員於規矩較平直於準繩引而伸之觸類而長之可為無窮之應用也今人不知致病之因不求立方之意倉卒之際據證驗方謾爾一試設有不應並其書而廢之不思之甚也近因局方之教久行素問之學不講抱疾談醫者類皆喜溫而惡寒喜補而惡解利忽得陳氏方論皆用燥熱補劑其辭確其文簡歡然用之翕然信之遂以為錢氏不及陳氏遠矣或曰子以陳氏方為不足歟曰陳氏方誠一偏之論雖然亦可謂善求病情者其意大率歸重於太陰一經蓋以手太陰屬肺主皮毛足太陰屬脾主肌肉肺金惡寒而易於感脾土惡濕而無物不受觀其用丁香官桂所以治肺之寒也用附朮半夏所以治脾之濕也使脾與肺果有寒與濕而兼有虛也量而與之中病則已何傷之有今也不然但見出遲者身熱者泄瀉者驚悸者氣急者渴思飲者不問寒熱虛實率投木香散異功散間有偶中隨手獲效設或誤投禍不旋踵何者古人用藥制方有嚮導有監製有反佐有因用若錢氏方固未嘗廢細辛丁香白朮參耆率有監製輔佐之藥不專務於溫補耳然其用寒涼者多而於補助一法略示端緒未曾深及癡人之前不可說夢錢氏之慮至矣亦將以候達者擴充推廣用之耳雖然渴者用溫藥癢塌者用補藥自陳氏發之迥出前輩然其多用桂附丁香辛芳燥熱恐未為適中也何者桂附丁香輩當有寒而虛者固是的當虛而未必寒者其為患當何如耶陳氏立方之時必有挾寒而用一偏之方寧不過於熱乎豫嘗會諸家之粹求其意而用之實未敢據其成方至正甲申陽氣早動正月間邑間痘瘡不越一家率投陳氏方童幼死者百餘人雖由天數吾恐人事亦或未之盡也錢傷寒男體重面黃女面赤喘息急各憎寒口中氣熱呵缺頓悶項急瘡疹則腮赤躁多噴嚏悸動昏倦四肢冷傷寒當發散之瘡疹當溫平之有大熱者宜解毒昏睡喜嚏悸者將發瘡疹垣辨癍證呵缺噴嚏睡中急驚耳尖冷眼澀辨傷寒口熱口中醋氣奶瓣不消腹中疼痛錢瘡疹候面燥腮赤目胞亦赤呵缺頓悶乍涼乍熱咳嗽嚏噴足稍冷夜臥驚悸多睡此瘡疹症天行之病也睦親宮十太尉瘡疹衆醫治之王曰疹未出屬何臟腑一醫言胃氣熱一醫言傷寒不退一醫言在母腹中有毒錢氏曰若言胃氣熱何以乍涼乍熱若言母腹中有毒屬何臟也醫曰在脾胃錢氏曰在脾胃何以驚悸皆無以對錢氏曰夫胎在腹中月至六七則已成形食母腹中穢液入兒五臟食至十月即穢液滿胃至生時兒口中猶有不潔産母以手拭淨則無疾病俗以黃連汞粉下其臍糞之穢此亦母之不潔餘氣入兒臟中本先因微寒入遇風寒邪氣相搏而成痘疹也未出欲作之時熱動五臟則五臟之症先見初欲病時先呵缺頓悶驚悸乍涼乍熱手足冷面腮頰赤燥咳嗽噴嚏此五臟症俱見也呵缺頓悶者肝也時發驚悸者心也乍涼乍熱手足冷者脾也面赤腮頰赤咳嗽噴嚏者肺也惟腎無候以在腑下不能食穢故也凡瘡疹乃五臟毒若出歸一症肝水疱肺膿疱心為癍脾為疹腎雖無症其候惡者瘡變倒靨而黑陷則歸腎也此由不慎風冷而不能食內虛所致也今太尉疹子無他證當用平和藥為治因用抱龍丸數服愈海藏云本先因微寒入一句並由不慎風冷而不能食內虛一句勿認作寒證用抱龍丸即知癍疹多熱也瘡疹始出之時五臟症見惟腎無候但見平症耳尻涼耳涼是也尻耳俱屬於腎其居北方主冷也垣癍疹始出之症必先見面燥腮赤目胞亦赤呵缺頓悶乍熱乍涼咳嗽噴嚏足稍冷多睡睡驚並瘡疹之症或生膿泡大癍或生小紅癍或生癮疹此三等不同何故俱顯上症而後乃出蓋以上諸症太陽寒水起於右腎之下煎熬左腎足太陽膀胱寒水夾脊逆流上頭下額逆手太陽丙火不得傳道逆於面上故顯是症蓋壬癸寒水克丙丁熱火故也諸癍症皆從寒水逆流而出也醫者當知此理乃敢用藥夫胞者一名赤宮一名丹田一名命門男子藏精施化婦人系胞有孕俱為生化之源非五行也非水亦非火此天地之異名也象坤土之生萬物也夫人之始生也血海始淨一日二日精勝其血則為男子三日四日五日血脈已旺精不勝血則為女子乃二物相搏長先身生謂之神又謂之精道與釋二門謂之本來面目是也其子在腹中十月之間隨母呼吸呼吸者陽氣也而生動作滋益精氣神飢渴皆隨母血兒隨日長筋骨皮肉血脈形氣俱足十月降生口中尚有惡血啼聲一發隨吸而下此惡血復歸命門胞中僻於一隅隱伏而不發直至兒因內傷乳食濕熱之氣下陷合於腎中二火交攻榮氣不從逆於肉理惡血乃發諸癍疹皆出於腎水其瘍後聚肉理歸於陽明故三番癍始顯之症皆足太陽壬膀胱克丙小腸其始出皆見於面終歸於陽明肉理熱化為膿者也二火熾盛反勝寒水遍身俱出此皆從足太陽傳變中來也錢始發潮熱三日以上熱暈入皮膚即發瘡疹而不甚多者熱留皮腠之間潮熱隨臟出如早食潮熱不已為水泡之類也巳午潮熱為癍申酉潮熱為膿疱辰戌丑未潮熱為疹也王驗癍法若三日未覺形跡當以生酒塗身上時時看之狀如蚤痕者是也或曰傷寒傷食潮熱與癍疹不能辨者宜以辛涼之劑調之五日已里發出即汗五日已外無者非癍也各隨應見而治之閻治小兒壯熱昏睡傷風風熱瘡疹傷食皆相似未能辨認間服升麻葛根湯惺惺散小柴胡湯甚驗蓋此數藥通治之不致誤也惟傷食則大便酸臭不消化畏食或吐宜以藥下之海藏云宜以藥下之者當察其所傷何物生硬寒熱不等不可遽以巴豆之類大毒之藥下之升麻葛根湯太陰陽明也惺惺散治風熱咽不利脾不和少陽渴小便不利也小柴胡湯治往來寒熱胸脅微痛少陽也然欲知其經當以脈別之小兒耳冷尻冷手足乍暖乍涼面赤時嗽時嚏驚悸此瘡疹欲發候也未能辨認間服升麻湯消毒散已發未發皆宜服仍用胡荽酒黃柏膏暑月煩躁食後與白虎湯玉露散熱盛與紫雪咽喉或生瘡與甘桔湯甘露散余依前說大人小兒同治法惟大小不同耳海藏云消毒散太陽藥也白虎湯治身熱目疼鼻乾不得臥陽明藥也甘露散肺腎藥也甘桔湯少陽藥也紫雪天冬麥冬黃芩生地為血劑玉露散肺腎藥也石膏寒水石為氣劑以上五方皆瀉時暑之藥升麻葛根湯治傷寒瘟疫風熱壯熱頭痛瘡疹已未發並宜服之升麻葛根芍藥甘草炙各等分上同為細末每服四錢水一盞半煎至一盞無時溫服海藏云升麻葛根湯太陽陽明之藥陳文中雲身熱腹痛者身熱泄瀉者身熱驚悸者身熱汗出者身熱足冷者俱不宜服升麻葛根湯張巽之云凡痘見癍點忌葛根湯恐發得表虛也惺惺散治小兒風熱瘡疹傷寒時氣頭痛壯熱目澀多睡咳唾氣壅鼻塞清涕白朮桔梗細辛栝蔞根人參茯苓甘草各等分上㕮咀每服二錢水一盞生薑三片入薄荷三葉煎至半盞時時與服活人云加防風川芎亦各隨經也海藏云惺惺散治風熱咽不利脾不和少陽渴小便不利也上二方發表平劑王朝奉四物解肌湯芍藥黃芩升麻葛根每服四錢水一盞煎至七分去渣服或云小兒傷寒疫癘潮熱瘡疹五日已衰疑似不能辨別者並皆辛涼之劑調之即以四物湯解肌之類海藏云此論即有表也若內傷腹中有物未得大便而發熱者當以食藥去其物則可若得便後仍發熱在表者亦宜此解肌湯比錢氏升麻葛根湯減甘草加黃芩以有表熱之意也田防風蒼朮湯治小兒邪熱在表惡風惡寒瘡疹未出可解表發癍疹防風半兩蒼朮石膏各一兩甘草炙半兩川芎黃芩各二兩上為粗末每服二錢生薑三片薄荷七葉水煎日二服此方惡寒者宜用之上二方辛涼之劑表有熱者宜之大便酸臭不消化畏食或吐乃內傷飲食宜枳朮丸傷冷食飲神應丸丹一男子年十六歲發熱而昏目無視耳無聞兩手脈皆豁大而略數知其為勞傷矣時里中多發痘者雖不知人與藥則飲與粥則食遂教以參耆當歸蒼朮陳皮大料濃與之飲至二十餘帖痘始出又二十帖則成膿疱身無全膚或曰病勞可畏何不用陳氏全方治之豫曰此但虛耳無寒也只前方守之又數十帖而安後詢其病因為先四五日恐有出痘之患遂極力採樵連日出汗甚多錢五臟各有一證肝臟水疱肺臟膿疱心臟癍脾臟疹歸腎變黑海肝臟水疱色或青肺臟膿疱色或白脾臟疹或如麩糠色心臟癍其色赤變歸腎則色黑矣此五色凡痘疹一色者善或二色三色相合而作者凶第一大小不等小兒在胎十月食五臟穢血生下則其毒當出故瘡疹之狀皆五臟之液肝主淚肺主涕心主血脾為裹血其瘡出有五名肝為水疱其液出如水其色青而小肺為膿疱以涕稠濁如膿其色白而大心為癍主血其色赤而小次於水疱脾為疹其色赤黃而小涕淚出多故膿疱水疱皆大血榮於內所出不多故癍疹皆小又病水疱膿疱者涕淚俱少以液從瘡出故也譬如泡中容水水去則泡瘦矣上水疱者俗謂之水痘也膿疱者俗謂之痘子也癍者俗謂之瘄子也疹者俗謂之麻子也痘之形狀最大水痘次之癍瘄又次之麻子最小隱隱如麻子也更看時月重輕大抵瘡疹屬陽出則為順故春夏病為順秋冬病為逆冬月腎旺又盛寒病多歸腎變黑又當辨春膿疱夏黑陷秋癍子冬疹子亦不順也凡瘡疹只出一般者善先發膿疱後發疹子者順先發水疱後發疹子者逆先發膿疱後水疱多者順少者逆先發水疱後發癍子多者逆少者順先發疹子後發癍子者順先發膿疱後發癍子者逆海藏云此一句足以知雜出者諸臟相合而不齊也用藥亦難矣前斷云五色各隨五臟亦有二色相合或有三色即無定也此與前後膿水癍疹大小不同先後逆順大意相若凡瘡疹若出辨視輕重若一發便出盡者必重也痘夾疹者半輕半重也出稀者輕裡外肥紅者輕外黑裡白者微重也外白里黑者大重也瘡端里黑如針孔者熱劇也青乾黑陷昏睡汗出不止煩躁熱渴腹脹啼喘大小便不通者困也凡瘡疹當乳母慎口不可令飢及受風寒必歸腎變黑難治海藏云或熱極反兼水化者亦能變黑當以涼藥主之不可不察以脈別之可也或有出色正者內素有熱頭反陷色或灰青似黑中有針眼下陷當急以青涼藥疏之便結者大黃牽牛之類便軟者金花丸之類主之陳輕者作三次出大小不一等頭面稀少眼中無根窠紅肥滿光澤重者一齊並出密如蠶種身熱腹脹瘡灰白色稠密無縫瀉渴不止頭溫足冷輕變重犯房室不忌口先曾瀉飲冷水餌涼藥重變輕避風寒常和暖大便稠不燥渴忌生冷忌外人上飲冷水甘涼藥若內有實熱者不須忌之二日三日痘瘡始見微微才出如粟米大或如黍米大或如緑豆大似水珠光澤明淨者佳不須服藥四日五日痘瘡大小不等根窠紅活光澤明淨者輕如稠密陷頂灰白色瀉渴者重六日七日痘瘡肥紅光澤者輕如身溫氣促口乾腹脹足指冷者重八日九日痘瘡長足肥滿蒼蠟色者輕如寒戰悶亂腹脹煩渴氣急咬牙者至重也十日十一日痘瘡當靨瘡痂欲落而愈如身熱悶亂腹脹泄瀉寒戰咬牙者重錢黃柏膏如瘡疹已出此藥塗面次用胡荽酒外治法黃柏一兩緑豆粉二兩甘草四兩紅花二兩上同為細末生油調從耳前至眼眶並厚塗之日三兩次如早塗瘡不至面縱有亦少彭氏云痘疹護眼人多用胭脂據亢醫云不如錢氏黃柏膏最好諸家護眼法無出此方也蕭痘瘡初出用鼠黏子為末水調敷囟門並無患眼亦妙胡荽酒胡荽一味細切四兩以好酒二盞煎一二沸入胡荽再煎少時用物合定放溫每吸一大口微噴從頂至足勻遍勿噴頭面病人左右常令有胡荽氣即能闢去汙氣瘡疹出快丹痘疹初出時或未出時見時人有患者宜預服此藥多者令少重者令輕以絲瓜近蒂三寸連皮子燒灰存性為末砂糖拌勻干吃入硃砂末更妙垣消毒救苦湯治癍症悉具消化便令不出若已出稀者再不生癍十一月立此方隨四時加減惟通造化明藥性者能之麻黃根羌活防風各五分柴胡川芎各二分細辛藁本二分升麻五分葛根黃芩酒炒各二分黃連三分黃柏酒炒五分紅花少許蘇木一分歸身三分吳茱萸半分白朮一分蒼朮二分甘草生橘皮各一分連翹半錢初出者減出大者加生地五分上㕮咀每服五錢水二大盞煎至一盞去渣稍熱服癍疹者因內傷必出癍乃榮氣逆故也大禁牽牛巴豆峻藥宜半夏枳實大黃益智仁之類去瀉止吐若耳尖冷呵缺睡驚嚏噴眼澀知必出癍也宜升麻葛根白芍藥甘草歸身連翹各等分上㕮咀水煎服此定法也後隨症加減如肺出膿癍先顯喘嗽或氣高而喘促少加人參黃芩以瀉伏火而補元氣如心出小紅癍必先見嗌乾驚悸身熱肌肉腫脈弦洪少加黃連如命門出癮疹必先骨痛身熱其疼痛不敢動搖少加生地黃柏諸癍疹皆為陰症瘡皆因內傷乳食脾胃不足榮氣逆行雖火勢內熾陰覆其外故錢氏制四物升麻湯發之如有傳變症依加減法服之世如疹痘則發於脾宜陳氏人參清膈散疹者皮膚隱隱如麻名曰麻子水疱者多因傷寒熱毒而發宜升麻散及羌活散丹瘡乾者宜退火濕者用瀉濕退火止用輕劑荊芥升麻葛根連翹之類瀉濕乃肌表間濕宜用風藥防風白芷之類痘初起時自汗不妨蓋濕熱熏蒸而起故也世痘瘡不治症有七一戛齒痘黑陷喉中涎喘因先受風冷血氣虛弱即變此症二憎寒困倦痘子縮伏三瘡作坑內無膿血或黑色泡或瘡跡作黑色四痘癰壅腫痘毒變疳口臭齦爛牙落五聲啞氣噎或咽藥腹中鳴六痘初出而半在皮膚帶紫黑色不出者七誤於疏轉氣啞者凡出前後心密及兩手心兩足心密者皆不可治陳論痘不治有五癢塌寒戰咬牙煩躁不止紫黑色喘渴不寧頭溫足冷悶亂欲飲水目睛上視齧齒氣促泄瀉不止灰白色陷頂腹脹喘渴不止活小兒瘡疹與傷寒相類頭痛身熱足冷脈數疑似之間只與升麻湯解肌兼治瘡子已發未發皆可服但不可疏轉此為大戒傷寒身熱固不可下瘡疹發熱在表猶不可轉世人不學乃云初覺以藥利之宣其毒也誤矣海藏云此論雖當在經則可若熱甚過極足冷或內傷腹熱足冷宜以寒藥如洗心調胃及化食藥通膈之類主之然當求責臟腑祕與不祕脈道何如耳許氏云上熱下冷傷食也癍疹初熱手足亦冷惟傷寒一身盡熱不與足冷相類此傷食非傷冷也若傷冷不宜用王德孚用感應丸治之痘瘡已出不可疏轉出得已定膿血太盛卻用疏利亦非也海藏云此言若在經而出不盡者為當若腹胃有垢膩便時後重如痢疾及脈滑在裡者亦當微下大抵瘡疹首尾皆不可下海藏云臟腑有凝滯者不可拘此小兒身耳尻冷咳嗽輒用利藥即害人海藏云此言里和而少陽之氣在經熱者故用化毒犀角湯為氣出里若氣未出里未盡求責疏利亦可凡治疹痘才瀉則令內陷決不可輕易轉下惟大小便多日不利宜微微利之及痘已靨尚有餘熱停留或作熱或作瘡痍或成癰宜四順飲下之不特消餘毒亦免生他症纍試纍驗每見疹痘者服發表麻黃藥出汗陽氣盡出膚表遂至癍爛臟虛虛則腹痛自利或作寒戰或作陰癇死者多矣陳痘瘡自初出至已愈之際父母切忌房事世凡痘瘡勿令親近狐臭漏腋者房中淫欲者及婦人經候醉酒葷穢硫黃蚊藥一切腥臊疫汙蒸濕誤燒油發五辛潑糞淋尿熬油煎卵俱當忌之海瘡疹忌外人及穢觸之物雖不受風冷亦不可擁遏常令衣服得中並溫涼處坐臥陳痘瘡發熱口乾煩渴不止者切不可與水吃亦不宜與蜜紅柿西瓜橘子等冷物食之若脈實中有實熱者不必忌生冷痘瘡欲靨已靨之間忽不能靨腹脹煩渴不可與水蜜等冷物食之或頭溫足指冷或瀉渴氣促亦不可與之十二日十三日瘡痂已落其瘢猶黯或凹或凸肌肉尚嫩不可澡浴亦不宜食炙爆物酸辣五辛有毒之物恐熱毒熏膈眼目多生翳障海世人徒知憐惜過愛信其俗而不藥病已成而方憂摩撫從容無所不從豈知愛之適足以害之惜之適足以棄之始不早治治不全終卒之殞斃勞而無功至是咎醫嗚呼其計亦謬矣痘出太密丹疏則無毒密則有毒用涼藥解之雖數十帖亦不妨無害眼之患潔一發便密如針頭形勢重者合輕其表而涼其內連翹升麻湯主之垣鼠黏子湯治癍疹已出稠密身表熱急與此藥防後青乾黑陷鼠黏子炒二錢當歸身酒浸甘草炙柴胡連翹黃芩黃耆各一錢地骨皮二錢上㕮咀每服二錢水煎去渣溫服空心服藥畢且勿與乳食田調肝散治瘡疹太盛宜服令瘡不入眼生犀二錢半草龍膽一錢黃耆半兩大黃二錢桑白皮炒黃半兩麻黃去節鉤藤子各一錢石膏半兩栝蔞仁去皮甘草炒各二錢上為粗末每服二錢水煎食後溫服微利效海出太多者犀角地黃湯地骨皮鼠黏子湯犀角地黃湯方見衄血地骨皮鼠黏子湯即地骨皮散加鼠黏子是也丹又解瘡毒藥絲瓜升麻芍藥酒炒甘草生山楂黑豆赤小豆犀角上㕮咀水煎服潔癍已發密重微喘飲水者有熱證用去風藥微下之丹治男子勞傷出痘昏不知人身無全膚者方見痘未愈痘出不快錢氏消毒散化毒湯活人鼠黏子湯以上三方並見本條中有鼠黏荊芥防風皆發痘之要劑也上三方發瘡痘皆溫平溫涼藥錢氏所謂三日不出或出不快即微發之者是也如微發不出者即就與前項藥該每服二錢者即加至三四錢該每日二服者即加至三四服如加藥又不出者即用升麻葛根麻黃桂枝大發之如大發後不多及脈平無事者即瘡稀不可更發如脈洪有熱有大熱者當用四聖導赤八正輩利小便有大熱者當用芩連及金花丸輩解毒若利小便解毒後又不快則勿發勿下止用抱龍丸治之此皆錢氏心法也丹勉奴痘已出第三日色淡不肯發此血氣俱虛與此方人參一錢白朮炒黃耆酒炙歸身酒洗各二錢陳皮二分甘草炙少許訶子煨一錢豆蔻煨一錢半上煎入好酒些飲之上治氣血俱虛彭疹痘發未透宜四君子湯加黃耆紫草糯米煎凡醫百病不可損胃氣故用四君子及糯米等助其胃氣出閻孝忠續錢氏方中世六一湯專發痘瘡之膿黃耆六錢甘草炙一錢上㕮咀每服二錢水六分煎入酒二分同煎至半盞溫服更加橄欖同煎尤好加山藥亦得上治氣虛活活血散治瘡子或出不快用白芍藥末酒調如欲止痛只用溫熱水調咽下海藏云張子和之治四肢出不快加防風大效此症乃太陰藥也世四物湯治痘瘡出不快不甚紅活不起根窠緣血虛故也此藥能活血調順痘疾無如此方自古及今用之如寶只加甘草服之上治血虛丹女子瘧後出痘血氣俱虛又值冬寒熱易退不出丁香五粒附子五分桂半錢甘草炙二分人參半兩黃耆一錢陳皮當歸酒洗各五分陳異功散治痘瘡已出之間不光澤不起發根窠不紅謂之表虛木香當歸各三錢桂枝白朮茯苓各二錢陳皮去白厚朴薑製人參去蘆肉蔻各二錢半丁香一錢半半夏薑製一錢半附子炮去皮一錢半上㕮咀每服二錢水一盞姜五片棗三枚煎服上治虛寒虛而不寒者宜用前方血氣俱虛之劑不宜用此必脈虛細四肢身體冷者方可用之錢藍根散治瘡疹出不快及倒靨一名二聖散救小兒垂死板藍根一兩甘草炙七錢半上末每服半錢取雄雞冠血三兩點同溫酒少許食後調下無時甚則三五服立效丹溪云藍能分散敗血潔若出不快清便自調知其在表不在裡當微發之宜升麻葛根湯錢消毒散治瘡未出或已出未能勻遍又治一切瘡涼膈去痰治咽喉痛牛蒡子炒三兩甘草炙半兩荊芥穗二錢半上同為粗末每服三錢水一盞半去渣溫服海藏云此藥皆溫平之劑一法加防風薄荷活鼠黏子湯治小兒痘瘡欲出未能得透皮膚熱氣攻咽喉眼赤心煩鼠黏子炒四兩荊芥穗甘草各一兩防風半兩上為細末沸湯點服臨臥大利咽喉化痰涎止嗽老幼皆宜海藏云太陽少陽之劑首論溫平者此也海又法用牛蒡子炒熟為末同荊芥煎服上三方消毒飲加減法也活化毒湯治小兒瘡痘已出未出並宜服之紫草茸升麻甘草炙各等分上㕮咀水二鍾粳米五十粒同煎此陽明之藥也海藏云出不快者化毒湯本事方用糯米去粳米丹亞玉痘出兩日不甚透食稍進汗微出熱略減但食物口中覺有惡味此出得遲發未透須微微表之升麻甘草炙紫草白朮陳皮芍藥炒半錢作一帖加少酒同煎白芍須炒見其大便雖出不多卻白帶溏滑世透肌湯治痘不透紫草白芍藥升麻秫米粉炒各半兩上三方皆化毒湯加減法也海太陽出不快身之後也荊芥甘草防己湯陽明出不快身之前也升麻加紫草湯聖惠方升麻葛根加紫草少陽出不快身之側也連翹防風湯即連翹散四肢出不快防風芍藥甘草湯痘疹煩不得眠者甘桔加梔子湯桔梗甘草梔子各等分煎服活治痘出不快煩躁不得眠者水解散麻黃黃芩湯升麻黃芩湯主之海藏云莫若定其氣血用石膏梔子之類尤佳麻黃黃芩湯升麻黃芩湯亦當求責的是太陽陽明方可用之水解散治天行頭疼壯熱一二日兼治疱瘡未出煩躁或出尚身體發熱者麻黃去節四兩大黃黃芩桂心甘草炙芍藥各二兩上為粗末患者以生熟湯浴訖以暖水調下二錢相次二服得汗利便瘥強人服二方寸匕風實之人三伏中亦宜用之若去大黃春夏通用升麻黃芩湯治痘瘡出不快煩躁不得眠麻黃黃芩湯治痘瘡出不快益煩躁昏憒或出尚身疼熱者以上二方見小兒傷寒門錢四聖散治瘡疹出不快及倒靨一方有黃耆紫草茸木通甘草炙枳殼麩炒上等分為粗末每服一錢水一鍾煎至八分溫服無時劉提點云疹痘最要大小分曉錢氏四聖散用木通枳殼極好若大小流利不必苦泥田紫草回癍散小兒痘疹出不快治倒靨毒氣入腹紫草茸黃耆桑白皮木通枳殼白朮各等分上為粗末每服三錢水酒各半盞麝香少許同煎服海紫草木通散治小兒瘡疹紫草木通人參茯苓粳米各等分甘草減半上為末每服四錢水煎此小便不利之劑也世人參蟬蛻散治小便不利瘡痘不散燥躁多渴戛牙咬齒氣粗喘滿人參蟬蛻白芍藥木通赤茯苓甘草紫草茸各等分水煎服錢紫草散發癍疹鉤藤鉤子紫草茸各等分上為細末每服一字或五分一錢溫酒調下無時海小兒瘡疹出未快可濃煎紫草汁服上紫草例為通利腠理要藥也瘡不綻黃狗蠅四五枚用常酒研細服之未綻再服冬月在耳內取之直絲瓜湯發瘡疹最妙絲瓜連皮燒灰存性百沸湯調下痘癢塌丹癢塌者於形色脈上分虛實實則脈有力氣壯虛則脈無力氣餒實癢則勢焮虛癢則氣怯虛癢以實表之劑加涼血藥實癢以大黃寒涼之藥少許與之下其結糞痘瘡癢塌不掩白朮一錢半黃耆炙半錢當歸陳皮各五分甘草炙些水煎溫服豫治一子七歲痘將出未出之際腹泄數行其泄色黑不髮根窠三日後癢塌抓即黑色口渴其根窠如水疥狀不紅澤不起發食少脈浮數有力按之虛遂用參耆歸朮陳皮肉豆蔻為君炙甘草訶子桂為佐使水煎熟好酒些少咽下癢立止食立進根窠紅澤而起發二服全愈丹輕者用淡蜜水調滑石末以雞羽潤瘡上陳痘癢難任搔之成瘡或膿或血出者敗草散治之切不可用牛糞灰貼則臭穢癍瘢多矣屋爛草屋上爛草也如無牆頭上爛草亦可用此草經霜雪雨露而感天地之氣善解瘡毒上一味為末每研碎篩末若渾身瘡破爛膿水不絶黏貼衣裳難以坐睡可用二三升攤於床褥上令兒坐臥其效如神小兒痘瘡癢難任誤搔成瘡及瘡痂欲落不落用上好白蜜一味塗於瘡上其痂易落可無紫黑瘢痕世傳痘靨落後痘毒不盡變成癩癬其癢難任用陳年臘脂油敷神妙又方用羊𩩅骨髓煉一二沸入輕粉少許研成白膏瓷合盛之塗瘡效痘灰白色丹爐灰白色靜者怯者作寒看躁者勇者焮發者作熱看凡痘疹白色將靨如豆殼者蓋因初起時飲水多其靨不齊俗呼倒靨不妨但服實表之劑如毒氣鬱里消息他大小便如大便閉通大便小便閉通小便無妨吳店小兒周歲痘瘡色白甚癢藥中每加參耆半兩白朮五分丁香兩個當歸一錢官桂三分黃耆一兩水煎服豫族侄女笄年出痘灰白色身熱喘嗽渴脈洪有力與八物湯加連翹桔梗犀角屑半夏木通紫草乾葛石膏杏枳連芩前胡栝蔞仁服之十帖後色紅活喘嗽緩減漸微但熱未除遂於前方減耆杏胡枳連芩蔞七味服三十餘帖而安安後發皆落月餘方起床虛之盛也又一男子二十餘歲出痘已破未破者灰白色又雜間以黑陷倒靨者發熱寒戰身痛脈洪或時弦亦與八物加木通紅花紫草陳皮連翹服十餘帖而安痘黑陷倒靨閻紫草散治瘡痘黑陷曾服此方愈亢錢皆云有枳殼難服紫草甘草糯米亢云此味極好助胃氣黃耆各等分水煎服丹痘瘡黑陷二種因氣虛而毒氣不能盡出者用黃耆人參酒炒紫草治之顏色正者如上治法參耆之補佐以紫草之通利也如將出成就之際卻色淡不正者屬血虛宜用補血藥當歸川芎白芍酒洗之類或加紅花如將成就之際卻色紫不正者屬熱宜用涼藥解毒升麻芩連桔梗連翹之類甚者用犀角屑如用後項諸藥色仍不正者宜兼用二法治之世回生散治瘡疹倒靨黑陷用人牙燒灰存性入麝香少許研細每服半錢用黃耆白芍藥煎湯調下立效錢氏方中用溫酒調下云岐方中用升麻紫草煎湯調下海藏云若平昔油膩腸垢者通膈丸下之硃砂為衣與宣風散相表裡彭氏云只用紫草湯自好錢氏方用麝香及酒蓋瘡痘最怕麝香與酒氣觸禁不可用湯治痘瘡黑陷藥不能發者有驗用穿山甲一味燒存性為細末入麝香當門子少許一歲五分三歲一錢溫酒調下一服取效雖半身黑陷欲絶者亦能暫蘇而發紅色但有目閉無魂者不復生矣此方雖驗回生散又佳今詳麝香恐不宜服衍麻黃湯用麻黃剪去根節五錢用蜜一匙同炒良久以水半升煎候沸去上沫再煎去三分之一不用渣病瘡疱倒靨黑者乘熱盡服之避風俟其瘡復出一法用無灰酒煎更速但小兒不能飲酒者難服以此藥入表也世傳此法纍用有效活瘡黑倒陷豬尾湯無比散龍腦膏子無不驗海藏云若用草藥下之似勝腦麝必不得已而後用之可也活豬尾膏治瘡倒靨用小豬尾尖刺血兩點入生腦子少許同研新汲水調下食後立效龍腦膏子治時疫發痘瘡及出瘡子未透心煩狂躁氣喘妄語或見鬼神或已發而陷伏皆宜速治不治其毒入臟決死用生龍腦一錢研細滴豬心血和丸如豆子大每服一丸心煩狂躁者用紫草湯化下若瘡子陷伏者用溫酒化下少時心神便定得睡瘡疹發透依常將息取安海藏云此一法證極而用故活人云不得已也海四糞散治癍瘡倒靨黑陷出御院藥方歌曰人貓豬犬臘辰燒每服三錢蜜水調選甚倒靨並黑陷萬兩黃金也合消臘月辰日合此藥甚驗子和人中黃臘月者最佳通風處以火煅成煤水調下三五錢陷者自出丹溪云子和黑陷甚者用燒人屎即此方也世治疹痘不透乾黑危困用山楂肉一味為末每服二錢紫草酒送下量兒大小加減徐徐進三四服即紅活海劉守真涼膈散治小兒癍疹黑陷亦妙然止能治大便結硬小便赤澀為當若大便小便已通不宜用此惟以易老去大黃硝者最為穩當錢凡痘疹重者猶十活四五黑者無問何如十難救一其候或寒戰咬牙或身黃腫紫宜急以百祥丸下之復惡寒不已身冷出汗耳尻反熱者死何以然腎氣大旺脾虛不能治故也下後身熱氣溫欲飲水者可治以脾氣生勝腎寒去而溫熱也治之宜解毒不可妄下妄下則內虛多歸於腎若能食而痂頭焦起或未焦而喘實者可下之宜四順飲瘡赤陷而耳尻反熱者為逆用百祥丸牛李膏各三服不愈者死百祥丸一名南陽丸治瘡疹黑陷寒戰咬牙戛齒身黃腫紫紅牙大戟不以多少陰乾漿水煮軟去骨日中曝乾復納汁煮汁盡焙乾為末上水丸如黍米大每服一二十丸研芝麻湯下吐利同無時此方治戛齒甚妙牛李膏用牛李子不以多少取汁石器內熬成膏牛李子生野道邊至秋結實黑子成穗如無生者以乾者為末水熬代用每服皂子大煎杏膠湯化下此藥須於九月中取之睦親宅一大王病瘡疹始用一李醫又召錢氏錢留與抱龍丸三服李以藥下之其疹稠密錢氏見大驚曰若非轉下則為逆病王曰李已用藥下之錢曰瘡疹始出未有他症不可下也但當用平和藥頻與乳食不受風冷可也瘡痂若起能食者大黃丸瀉一二行即止令先下之瘡疹未能出盡而稠密甚則難治此誤也縱得安其病有三一者疥二者癰三者目赤李氏不能治經三日黑陷後復召錢曰幸不發寒病未困也遂用百祥丸為主牛李膏為助各二大服至五日間瘡復紅活七日而愈蓋黑者歸腎水也腎旺勝脾土不剋水故脾虛寒戰則難治所用百祥丸者以瀉膀胱之腑腑若不實臟自不盛也何以不瀉腎由腎主虛不受瀉如二服不效即加寒而死矣子和治瘡疹黑陷鐵腳威靈仙為末炒一錢腦子一分用溫水調服取下瘡痂為效活無比散治小兒瘡疹惡候硃砂先研一兩牛黃麝香樟腦膩粉細研各一錢上同研細如有患者小兒一字大人五分入水銀少許用小豬尾上血三兩點新水同調服寧穩得睡者然後取轉下如爛魚腸葡萄穗之類涎臭惡物便安小兒用乳汁調妙海藏云此瀉內熱之極不能開發於外則宜此內雖過泄外亦開發即透肌膚之藥與至寶丹同云小兒癍疹黑陷方干胭脂三錢胡桃一個燒存性上為細末煎胡荽酒調下藥一錢立效上治死血黑陷凡前方用穿山甲及麝香等藥治黑陷皆為氣滯者設也云治癍疹黑陷用臘月禿梟腦子一個或二個以好酒調服若干者以好酒浸少時化開依上條服立效禿梟百勞鳥也無箬葉散治倒靨用箬葉一味燒灰為末麝香酒下錢瘡黑而忽瀉便膿血並痂皮者順水穀不消者逆何以然且瘡黑屬腎脾氣本強或舊服補脾藥脾氣得實腎雖用事脾可制之令瘡入腹為膿血及連痂皮得出是脾強腎退即病出而安也瀉米穀及瀉乳不化者是脾虛不能制腎故自泄也此必難治海藏云瀉出痂皮根在內也表裡俱病是為火鬱水穀化者順水穀不化者逆未綻一齊黑者為陷已綻而不齊黑者為將靨痘寒戰世憎寒困倦或發寒戰能令痘子縮伏宜用陳文中異功散方見痘出不快條錢寒戰咬牙黑陷者百祥丸下之方見黑靨條嘗治痘瘡寒戰用白朮耆歸加芩治之愈痘發熱丹胡宅痘瘡發熱此血少有餘毒也陳皮白朮歸身白芍藥各三錢牛蒡子研破炒二錢木通犀角生甘節川芎各一錢半分六帖水盞半煎食前稍熱服活連翹散治一切熱兼治瘡疹如神連翹防風梔子甘草各等分上為末水煎服海藏云治熱在外而不厥此少陽藥也易老云涼膈去大黃芒硝者能解六經中熱此不惟解熱治小兒癍疹熱候亦使發之則本藥與防風荊芥二物各半白水煎服河梔子金花丸黃芩黃連黃柏山梔炒各等分上末滴水丸如豆子大每服五丸白湯下錢三黃丸治諸熱黃芩半兩大黃煨黃連各二錢半上為細末糊丸緑豆大每服五七丸至十五二十丸食後米飲送下上錢氏云有小熱者解毒海藏謂解毒者三黃丸金花丸之類是也四聖散方見出不快海藏紫草木通湯方見同上導赤散方見治虛實八正散方見淋部丹有初起煩躁譫語狂渴引飲若飲水則後來靨不齊急以涼藥解其標如益元散之類可用上五方利小便退熱之劑錢氏云有大熱者利小便又云身熱煩渴腹滿而喘大小便澀面赤悶亂大吐此當利小便蓋此用導赤散之類是也錢宣風散檳榔兩個陳皮甘草各半兩牽牛四兩生半熟半上為細末三二歲蜜湯調下五分以上一錢食前易老加防風云通膈丸利上下氣血藥也大黃牽牛木通各等分上為細末滴水丸如粟粒大每服三五十丸量兒大小虛實加減上錢氏云有大熱利小便不瘥者宜宣風下之子和蔡河有舟師偶見敗蒲一束沿流而下漸泊舟次似聞啼聲而微開視之驚見一兒四五歲許瘡疱周匝密不容隙兩目皎然飢而索食因以粥食之其妻怒曰自家兒女多惹瘡疱傳染奈何私料蔡河流緩必不遠持兒一鞋逆流而上遍問皆曰無此兒行二十里又至一村落舟師呼於市曰有兒年狀如許瘡疱死棄河中今復活忽酒邸中有人出曰我某村某人也兒四五歲死於瘡疱舟師出其鞋其人泣曰是吾兒也奔往視驚見兒活流涕拜謝舟師抱兒歸今二十餘矣此兒本死得水而生第未諗其瘡疱之疾寒耶熱耶痘寒熱太和散治瘡痘後寒熱往來嗜臥頓悶躁亂生地當歸地骨皮人參甘草炙白芍藥各等分上㕮咀每服一錢水半盞煎至三分去渣溫服痘渴丹陳十妹年二十歲出痘而有孕七個半月大渴不甚出透寒熱交作血虛氣虛人參白朮黃耆陳皮甘草炙歸身各一錢姜三片酒水各半盞煎服海瘡疹大腸閉澀或發渴四君子加栝蔞根桔梗主之若身熱小渴者六味人參麥門冬散治之如不愈或身熱大渴者七味人參白朮散治之又不愈十一味木香散六味人參麥門冬散麥門冬去心一兩人參去蘆甘草炙陳皮白朮厚朴薑製各半兩上㕮咀每服三錢水一盞煎至六分去渣溫服虛人減厚朴七味人參白朮散方見消渴門以上四方四君子加減法也丹初起煩躁渴引飲者急以涼藥解其標錢身熱煩渴腹滿而喘大小便澀而赤悶亂大吐此當利小便不瘥者宣風散下之陳十一味木香散集驗方本治瘡痘身熱作渴方見後渴瀉條文中雲腹脹渴者瀉渴者足指冷渴者驚悸渴者身溫渴者身熱面㿠白色渴者寒戰渴不止者氣急咬牙渴者飲水轉水瀉不已者以上九證即非熱也乃津液少脾胃肌肉虛故也宜木香散治之如不愈更加丁香官桂此說必加審用之脹渴瀉渴驚悸渴寒戰渴咬牙渴亦多屬熱者不可不察痘渴瀉丹陳牙兒十九歲出痘有紅癍吐瀉而渴蒼朮一錢白朮三錢黃耆一錢半陳皮二錢茯苓甘草炙縮砂當歸各一錢半姜三片同煎服從子六七歲時患瘡痘發熱微渴自利一小方脈視之用木香散每帖又增丁香十粒豫竊疑焉觀其出遲因問自利而氣弱察其所下皆臭滯陳積因腸胃熱蒸而下也恐非有寒而虛遂急止之已投一帖矣繼以黃連解毒湯加白朮與十帖以解丁香之熱利止瘡亦出其後肌常有微熱而手足生癰癤與涼劑調補逾月而安一男子十餘歲出痘熱時出根腳密嘔吐不食腰背骨節痛大渴喉痛腹亦痛全不食者半月餘脈浮弦洪而數與參耆歸朮炙甘草陳皮半茯生薑煎服之至五日色淡又加桂些少歸耆再用酒製至七日癢甚加丁香三粒附子些少癢止至八日九日渴大作而腹泄瀉癢甚至十日寒戰遂用白朮為君耆陳苓炙甘芩歸為臣至十一日不靨或癢或譫語但守前藥半月後自吐出痰多而安陳十一味木香散治疹痘腹脹渴其效如神必須密察的是寒症六脈虛細身不甚熱或發寒或嘔吐肚腹痛或身體四肢俱冷者可用此方出集驗木香大腹皮人參官桂赤茯苓青皮去白前胡訶子皮半夏丁香甘草炙各三兩上㕮咀每服二錢水一盞姜三片煎空心溫服異功散集驗方瘡痘頭溫足冷腹脹瀉渴方見痘出不快張巽之云吐瀉渴少食為裡虛異功散減官桂主之此症瀉渴不可吃蜜水痘出之間不光澤不起發根窠不紅或瀉渴或腹脹或氣促是為表裡俱虛與異功散送下七味肉豆蔻丸治之異功散方見痘出不快痘瀉不渴海瘡疹不渴臟寒下利四君子加乾薑減半主之痘疹大便不固痘漸黑陷小兒乳母同服人參白茯苓肉豆蔻黃耆各半兩甘草炙二錢上㕮咀每服一錢水半盞姜五片棗二枚煎三分乳母倍服若大瀉手足厥冷加附子用驗陳豆蔻丸治痘疹泄瀉木香砂仁白龍骨訶子肉肉蔻麵裹煨各半兩赤石脂白礬枯各七錢半上為末糊丸如黍米大一歲三十丸三歲百丸溫米飲下瀉止勿服痘吐逆世痘瘡吐逆無痰益黃散有痰二陳湯或橘皮半夏湯不止者加丁香若吐而瀉者亦宜益黃散及陳氏木香散異功散吐而身熱煩渴腹滿喘大小便澀面赤者當利小便不瘥者宣風散下之全文見大法痘腹脹丹勉奴痘後渴肚急小便少發熱芍藥五分川芎三分白朮五分陳皮五分乾葛三分甘草炙一錢半木通二分水煎服寄子五歲痘後肚急白朮一錢陳皮木通各五分犀角川芎白芷各七分甘草炙三分水煎服陳文中木香散治痘瘡腹脹渴瀉方見痘渴瀉腹滿而喘大小便澀身熱面赤悶亂大吐者當利小便不瘥者宣風散下之全文見大法痘腹痛痘腹痛多是痘毒當臨證消息丹吳店子出痘瘡腹痛丁香二枚官桂芍藥各一錢白朮當歸各五分上作一帖服常治痘始出腹痛或身痛脈洪數者解表涼藥加芍藥甘草漸安痘喘世瘡痘出後喘急痰盛宜杏甘湯人參清膈散杏甘湯治瘡痘煩喘渴躁麻黃桑白皮杏仁甘草上等分為粗末每服三錢水一盞煎食後服海瘡疹肺不利紫草甘草枳殼湯陳人參清膈散人參桑白皮柴胡當歸芍藥知毋茯苓各半兩白朮黃耆紫地骨皮滑石各一兩半甘草桔梗各一兩黃芩半兩石膏一兩上㕮咀每服三錢水煎溫服痰實壯熱胸中壅悶臥則喘急前胡枳殼湯主之前胡枳殼赤茯苓甘草炙各五錢大黃量兒加減上㕮咀每服三錢水一盞煎六分旋服喘而腹滿大小便澀者利小便不瘥者宣風散下之錢氏法痘出之間或氣促者木香散主之痘大便祕海治瘡疹已出未出大便祕澀或時發渴四君子加栝蔞根桔梗治之當歸丸當歸半兩甘草一分黃連大黃各二錢半先將當歸熬膏子入藥末三味為丸加服之以利為度海棗變百祥丸治癍疹大便祕結紅牙大戟去骨一兩青州棗去核十枚上用水二盞同煎至水盡為度去大戟將棗焙乾可和作劑旋丸從少至多以利為度活洗心散治痘瘡壯熱大小便不利狂言多渴大黃甘草當歸麻黃去節白朮芍藥荊芥各等分上㕮咀量病輕重多少薑薄荷煎溫服則平熱服則溏陳四五日不大便者可用肥嫩豬脂一塊白水煮熟切如豆大與兒食之令臟腑滋潤瘡痂易落百無礙滯痘餘毒海癍瘡餘毒或肝虛入眼目或肺虛為癬疥或為癰癤發在骨節腎之虛也發在肌肉脾之虛也或在筋或在頭或在面或牙齒疳蝕或咽喉腫痛各隨經而見皆毒不散蘊積而成或病人始不早治或醫者失治遺於經絡其所由來蓋有自矣宜服解毒等劑世痘毒攻脾則泄瀉身浮攻肝則眼生翳膜攻心則煩躁啼哭攻腎則耳疼膿聚攻肺則咳嗽痰涎丹治小兒痘瘡餘毒未散食谷太早補住毒氣鼠黏子六錢甘草五分犀角三錢荊芥防風各一錢白朮三錢枳殼一錢水煎溫服痘入目丹如痘傷眼必用山梔赤芍決明歸鬚連翹防風桔梗升麻小劑末之調服如眼無光過百日後血氣完復則自明矣張炳治瘡疹後毒氣攻眼或生翳膜赤黑之類宜用四物湯加荊芥防風煎服兼用黑豆皮穀精草海蛤甘草等分為末用熟豬肝切片蘸服神妙一方治痘毒目翳用江西蛤粉黑豆皮甘草密蒙花等分為末調服丹痘後生翳數服效用威靈仙仙靈脾等分洗淨不見火與日為細末每服隨時宜第三次米泔下錢氏黃柏膏痘初出塗面護眼方見痘大法調肝散治瘡疹大盛服之不入眼方見痘密羊肝散即下密蒙散方見活人條蟬蛻散治癍瘡入眼半年已里者一月取效豬羊蹄甲二兩入罐子內鹽泥固封燒存性蟬殼去土取末一兩上二味研入羚羊角細末二分拌勻每服一字百日外兒一二分三歲三四分漿水或新水調下日三四夜一二食後一年以上者不治治瘡疹入眼馬屁勃半兩皂莢子十四粒蛇皮半兩上入小罐子內鹽泥封固燒存性研細溫酒調下三錢食後治瘡疹入眼或翳栝蔞根半兩蛇皮二錢上為細末用羊肝一個批開入藥末二錢麻線纏定米泔煮熟頻與食之兒未能食肝乳母多食之又方用蟬蛻末以水煮羊肝湯調服二三錢海地黃散治小兒心肝壅熱目赤腫痛生赤翳或白膜遮睛四邊散漫者尤易治若暴遮黑睛者多致失明宜速用此方亦治瘡疹入眼熟地當歸各一分黃連大黃煨各一錢生地去心木通各一錢半防風羌活生犀末蟬蛻去土木賊穀精草白蒺藜各一錢甘草一錢半玄參五分沙苑蒺藜一錢上為細末每服一字或五分量兒大小加減煎羊肝湯食後調下日三夜一忌口將息大人亦治垣治痘瘡風熱毒翳膜暈遮睛以瀉青丸治之大效初覺易治云用竹葉湯和砂糖水化下瀉青丸二丸漸至微利神效活癍入眼用決明撥雲密蒙花通聖蛤粉散之類然無出此書海藏云莫若病時隨經而取不使毒氣轉入眼中為尤妙然眼有五輪亦當求責此言為失治者說也決明散治瘡痘疹入眼海藏云此少陽太陰之劑決明子栝蔞仁各半兩赤芍藥甘草炙各一分上為細末入麝香少許令勻每服二錢生米泔調下臨臥服撥雲散治瘡痘入眼及生翳用桑螵蛸真者一兩炙令焦細研搗為末入麝香少許每服二錢米泔調下密蒙花散治小兒痘瘡入眼及無辜疳氣入眼密蒙花三兩青葙子決明子車前子各一兩上末拌勻用羊肝一大片薄批糝上濕紙裹煨熟量多少空心服之錢氏海藏云即羊肝散通聖散治疹痘瘡入眼及生翳白菊花如無甘菊代之然不如白菊好緑豆穀精草去根一兩上為細末每服一大錢柿幹一個米泔水一盞同煎候米泔盡只將柿干去核食之不拘時日三枚日近者五七日遠者半月取效蛤粉散治小兒瘡子入眼穀精草蛤粉各等分上為細末每一錢匕豬肝一兩許批開摻藥捲了用竹箬裹麻線縛定水一碗煮令熟入收口瓷瓶熏眼候溫取食之日作不過十日退明癍瘡入眼大杼一壯痘咽痛活如聖餅子治小兒瘡疹毒攻咽喉腫痛海藏云隨經此一方即是隨經牛蒡子炒甘草各一兩麥門冬去心半兩桔梗一兩上為末加竹葉同煎細細服之海藏云減門冬竹葉甘桔鼠子湯治咽喉不利鼠黏子湯消毒飲二方並見前痘出不快條云小兒癍出欲透皮膚身熱咽喉不利甘草桔梗升麻湯甘草半兩桔梗一兩升麻半兩上銼細每服一大錢水煎服錢甘露飲子治心熱咽喉痛口舌生瘡並瘡疹已發未發並可服之治熱上攻牙根腫痛動搖生地熟地天門冬去心麥門冬去心枇杷葉去毛枳殼炒黃芩去心石斛去苗甘草炒山茵陳上各等分為粗末每服二錢水一盞煎食後溫服牙齒腫痛則含漱並服海藏云甘露飲為血劑田地黃丸治小兒痘疹口瘡咽腫痛牙疳臭爛天門冬麥門冬玄參各三兩甘草薄荷各一兩上為細末生熟地黃汁和丸櫻桃大每服一丸溫蜜水化服痘風丹痘風分氣血虛實以日子守之多帶氣血不足虛則黃耆生血之劑助之略佐以風藥實則白芍黃芩為君連翹白芷續斷之類為佐若屬寒陳氏方可用楊氏女年十餘歲痘發不透靨落後骨節痛食少夜間或熱此餘毒在內虛甚難於疏導須在補中有通此方主之當歸白朮各一錢犀角二分陳皮一錢通草甘草根炙各三分牛膝五分蘇梗三分上㕮咀生薑三片水煎溫服男子七歲痘瘡初出不透毒氣攻內骨節作痛兩足不可直瘢痕缺紅活脈浮而和小便赤少歸身白朮各一錢陳皮木通犀角屑人參茯苓各五分甘草炙些上分二帖煎服痘癇搐錢瘡疹搐由風火相勝也惟癍疹能作搐疹為脾所生脾虛而肝旺乘之木來勝土熱氣相擊動於心神心喜為熱神氣不安因搐成癇癍子為心所生心生熱熱則生風風屬於肝二臟相搏風火相爭故發搐也治之當瀉心肝補其母栝蔞湯主之海藏云諸痛癢瘡皆屬於心火無論虛實皆從心火上說脾虛則肝乘之肝與心火相合故用栝蔞湯若脾土實火旺逆乘而成癇者此實邪也便結者瀉青丸便軟者瀉青湯亦當以脈別之栝蔞湯方見驚風潔凡未出而發搐者是外感風寒之邪內發心熱之所作也當用茶粉下解毒丸犀角地黃湯主之世治瘡痘欲出身熱煩躁忽發驚搐宜驅風膏小如聖飲小便不通八正散涎盛利驚丸抱龍丸量症施之丹欲發瘡疹先身熱驚跳搐搦此非驚風宜發散藥世麻痘風搐方人參羌活防風殭蠶醋炒南星薑製白附薑製甘草炙上等分生薑三片水煎服其搐立止錢癍疹病後欲發癇余瘡難發癇以木勝脾木歸心故也若涼驚用涼驚丸溫驚用粉紅丸即溫驚丸痘瘡痛活治痘瘡痛用溫驚丸水化下方見前驚搐條海治瘡出煩痛五物木香散青木香二兩丁香零凌香各一兩麝香一分白礬一兩每服四錢水一小盞半煎服之熱盛者加犀角一兩如無犀角以升麻代之輕者一服大效又方以芒硝和豬膽塗瘡上令動痂落無瘢仍用黃土抹之良此病小便澀有血者中壞瘡背黑靨不出膿者死不療世痘將結靨乾硬而痛宜塗酥潤之靨可揭去則去之如無酥用豬油煎汁代之此痛非服藥可免也痘膿而不痂痂居牙切瘡靨曰痂海癍疹膿而不焦此本治失清涼之氣有如五穀得陽氣而成熟非涼風至則不能實也天地嚴肅之氣一加則萬物秀而實矣與癍疹何異須察何經而清涼之或下而成嚴肅之氣則瘡氣必不至於膿而不痂矣要當知之餘毒不盡而疾作蓋出於此當是清涼飲子下之是也非陽和則苗不秀非嚴肅則秀不實劉洙瘡子訣云痘發如膿窠不肯靨者但調砂糖水與吃劉提點云亦曾試用但後來結瘢痕白錢五七日痂不焦是內發熱蒸於外故不得焦痂也宜宣風散導之用生犀磨汁解之必著痂矣陳痘已靨未愈之間忽被風邪搏之成疳瘡宜雄黃散綿繭散治之又不愈多漬骨傷筋殺人雄黃散治小兒牙齦生疳蝕瘡雄黃一錢銅緑二錢上二味同研極細每用量瘡大小干貼綿繭散治小兒因痘瘡身體及肢節上生疳蝕瘡膿水不絶用出蛾綿繭以生白礬捶碎入繭內令滿炭火燒令白礬汁盡取出研極細每用干貼瘡口上錢凡痘瘡方才著痂即用菜油不住潤之可揭則揭若不潤及遲揭瘡痂硬即隱成瘢痕矣陳痘痂雖落其瘢猶黯或凹凸肉起當用滅瘢藥塗之韶粉一兩輕粉一字上研細入煉過豬脂油拌和如膏塗瘢上痘後瘡癤世連翹散治小兒瘡疹癤痘疹餘毒作楚或生於頭面耳疼頰赤生瘡連翹黃芩瞿麥木通滑石柴胡荊芥牛蒡子防風羌活亦芍藥甘草各等分每服三錢水一盞煎半盞又入生薄荷尤好痘癰丹痘癰多是實毒血熱成癰分上下用藥一日不可緩成膿必用清熱涼血為主赤芍藥甘草節連翹桔梗之類上引用升麻葛根下引用檳榔牛膝更助以貝母忍冬草白芷栝蔞大便燥用大黃寒熱用芩柏此法纍效保木香散治小兒癍後生癰如神地骨皮一兩木瓜半兩穿山甲炙黃三錢半麝香一字上為末米飲下二錢丹痘癰敷藥用貝母南星殭蠶天花粉寒水石白芷草烏大黃豬牙皂角醋調敷患處效中惡楊小兒神守則強邪不干正若真氣衰弱則鬼毒惡氣中之其狀卒然心腹刺痛悶亂欲死是也凡中惡腹大而滿診其脈緊細而微者生脈大而浮者死即服蘇合香丸未醒以皂角末搐鼻次服沉香降氣湯加人參茯苓又能辟邪客忤亦宜服降真香白膠香沉香虎脛骨酥炙人參鬼箭草草龍膽各五錢上為末次入雄黃五錢麝香一錢煉蜜丸乳香湯化又令兒帶及燒臥內尤妙廣治中惡客忤唾化麝香一錢重研和醋二合服之即瘥海龍腦膏治小兒發熱在心胃卒不知人方見痘黑陷門即活人方湯凡中暑悶倒急扶在陰涼處切忌與冷若得冷即死當用補藥及熱湯尉臍腹間暖即瘥如無湯即掬熱土暈於臍上仍撥小窩子尿於中可代湯尉之良久嚼大姜一塊以水咽下續用解暑藥甲小兒口中腥臭脅膈氣滿勞宮主之客忤湯客忤者小兒神氣軟弱忽有非常之物或未經識見之人觸之或經歷神廟佛寺與鬼神氣相忤也故謂之客忤亦名中客其狀吐下青黃白色水穀將下時腹痛反倒面變五色其狀若癇但目不上插耳其脈數者是也亦宜服蘇合香丸並真珠散真珠散治客忤驚風鬼疰驚邪痰熱心舍不寧精神不定心常怔忡睡中驚跳時或咬牙五心煩熱有汗兼喘面赤舌白呵缺煩渴小便赤瀉或吐利黃沫常服辟邪安神真珠海螵蛸滑石各一錢白茯苓人參白附子甘草炙全蠍麝香腦子另研各五錢生朱另研一錢金銀箔金三十片銀二十片上末和勻半錢煎燈心麥門冬湯入蜜少許調服日午臨臥各一服田客忤因而驚忤者治法用灶中黃土研二兩雞子一枚去殼二件相和入少許水調先以桃柳枝湯浴兒後將此藥塗五心及頂門上陳無擇法用灶中黃土蚯蚓屎等分如此法塗之外治卒客忤噤口不能言細辛桂心等分納口中效
