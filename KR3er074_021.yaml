body:
  text: 卷之二十一脾胃門內傷飲食垣飲食傷論陰陽應象論云水穀之寒熱感則害人六腑痹論云陰氣者靜則神藏躁則消亡飲食自倍腸胃乃傷此乃混言之也分之為二飲也食也飲者水也無形之氣也因而大飲則氣逆形寒飲冷則傷肺肺病則為喘咳為腫為水瀉輕則當發汗利小便使上下分消其濕解酲湯五苓散生薑半夏枳實白朮之類是也如重而蓄積為滿者芫花大戟甘遂牽牛之屬利下之此其治法也食者物也有形之血也如生氣通天論云因而飽食筋脈橫解腸澼為痔又云食傷太陰厥陰寸口大於人迎兩倍三倍者或嘔吐或痞滿或下痢腸澼當分寒熱輕重治之輕則內消重則除下如傷寒物者半夏神麯乾薑三稜廣朮巴豆之類主之如傷熱物者枳實白朮青皮陳皮麥糵黃連大黃之類主之亦有宜吐者陰陽應象論云在上者因而越之瓜蒂散之屬主之然而不可過劑過則反傷腸胃蓋先因飲食自傷又加之以藥過故腸胃復傷而氣不能化食愈難消矣漸至羸困故五常政大論云大毒治病十去其六小毒治病十去其七常毒治病十去其八無毒治病十去其九不可過之此聖人之深戒也丹傷食惡食者胸中有物導痰補脾二陳湯加白朮山楂川芎蒼朮垣五苓散治煩渴飲水過多或水入即吐心中淡淡停濕在內小便不利肉桂一兩豬苓茯苓白朮各一兩五錢澤瀉二兩五錢上為細末每服二錢熱湯調下不拘時候服訖多飲熱湯取汗出愈治傷冷飲者煎五苓散送半夏枳朮丸治傷飲不惡寒胸中微覺夯悶身重飲食不化者或小便不利者五苓散去桂依前斟酌服之如瘀熱在裡身發黃疸食前濃煎茵陳湯調服愈除濕散治傷馬牛乳酪及冰水一切冷物半夏湯泡三錢車前子炒五錢甘草炙二錢紅花二錢茯苓七錢乾薑三錢澤瀉半兩上為細末每服三錢食前白湯調下丹導飲丸治水飲吳茱萸三錢白茯苓一兩黃連五錢蒼朮一兩獨活七錢上為細末神麯糊丸服丹茱萸丸治飲用六一散一料加吳茱萸一兩水丸服垣酒者大熱有毒氣味俱陽乃無形之物也若傷之止當發散汗出則愈矣其次莫如利小便乃上下分消其濕今之病酒者往往服酒症丸大熱之藥下之又有用牽牛大黃下之者是無形元氣受病反下有形陰血乖誤甚矣酒性大熱已傷元氣而復重瀉之亦損腎水真陰及有形血氣俱為不足如此則陰血愈虛真水愈弱陽毒之熱大旺反增其陰火是以元氣消爍折人長命不然則虛損之病成矣酒疸下之久則為黑疸慎不可犯宜以葛花解酲湯主之海治酒病宜發汗若利小便炎焰不肯下行故曰火鬱則發之以辛溫散之是從其體性也是知利小便則濕去熱不去若動大便尤為疏陋蓋大便者有形質之物酒者無形之水從汗而發之是為近理濕熱俱去故治以苦溫發其火也佐以苦寒除其濕也垣葛花解酲湯治飲酒太過嘔吐痰逆心神煩亂胸膈痞塞手足戰搖飲食減少小便不利青皮三分木香五分橘紅五分人參豬苓白茯苓各一錢神麯炒澤瀉乾薑白朮各二錢白豆蔻葛花砂仁各五錢上為細末每服三錢白湯調下但得微汗則酒病去矣此蓋不得已而用之豈可恃此酗飲成病自損元氣惟病酒者宜之聖治酒醉不醒用菘菜子二合研細井水調服丹烏梅丸治酒毒化痰消食烏梅一斤半夏白礬各八兩生薑二兩上搗為細末以新瓦兩片夾定火焙三晝夜為度次入神麯麥芽陳皮青皮蓬朮枳殼丁皮大腹子各四兩糊丸每服四五十丸薑湯下世烏梅丸治酒積神效方見積塊門潔百杯丸治酒停胸中膈氣痞滿面色黃黑將成癖疾飲食不進日漸羸瘦如欲飲者先服不醉生薑一斤去皮切片以鹽二兩淹一宿焙乾橘紅三兩廣朮炮三錢乾薑三兩益智仁二十粒丁香五十枚甘草炙二錢砂仁三十粒三稜炮二錢木香茴香炮各一錢白豆蔻三十粒上為末煉蜜丸每一兩作五丸硃砂為衣生薑湯下細嚼無時服丹解酒毒並熱毒柏若本草名枳枸北人名曰爛瓜杭州貨賣名蜜屈立春生秋熟冬間經霜後取食垣枳朮丸治痞積消食強胃海藏云本仲景枳朮湯也今易老改為丸治老幼虛弱飲食不化或臟腑軟弱者枳實去穰麩炒一兩白朮二兩上為末荷葉裹燒飯為丸如桐子大每服五十丸白朮湯下服白朮者本意不取其食速化但久服令人胃氣強實不復傷也曲糵枳朮丸治為人強食所致心胸滿悶不快神麯炒麥糵炒枳實炒各一兩白朮二兩上為末荷葉燒飯為丸每服五十丸木香枳朮丸破滯氣消飲食開胃進食木香枳實各一兩白朮二兩照前法為丸服又方開胃進食木香三錢人參乾薑各一錢半枳實一兩白朮二兩照前荷葉燒飯為丸食前白湯服三五十丸忌飽食檳榔丸消食破滯氣檳榔三錢木香二錢陳皮五錢甘草一錢人參二錢上為末蒸餅丸每服二三十丸食前白湯下羅木香檳榔丸疏三焦寬胸膈破痰飲快氣潤腸神麯皂角去皮酥炙郁李仁去皮各一兩杏仁去皮尖炒木香檳榔青皮去白枳殼麩炒各一兩上為末再用皂角四兩水一碗浸一日揉膏入熟蜜少許為丸桐子大每服五十丸淡薑湯下丹保和丸治食積酒積山楂肉一兩半夏薑製蘿蔔子炒各五錢神麯三錢麥芽炒三錢黃連炒半兩陳皮半兩上為末酒糊丸服或用神麯糊為丸尤妙大安丸脾經消導之劑虛者宜斟酌用之山楂二兩神麯炒半夏制茯苓各一兩陳皮五錢白朮二兩連翹五錢蘿蔔子炒半兩上為末神麯糊丸服一方無白朮三黃枳朮丸治傷肉食濕面辛辣厚味之物填塞悶亂胸膈不快黃芩二兩黃連酒炒大黃煨神麯炒白朮陳皮各一兩上為末湯浸蒸餅為丸如緑豆大每服五十丸白湯下垣除濕益氣丸治傷濕面心腹滿悶肢體沉重枳實炒白朮黃芩生神麯炒各一兩紅花三分蘿蔔子炒熟半兩上為末荷葉飯丸每服五十丸白湯下上二黃丸治傷熱食痞悶兀兀欲吐煩亂不安黃芩二兩黃連酒洗一兩升麻柴胡各三錢甘草二錢枳實炒半兩上為末湯浸蒸餅丸每服六七十丸白湯下枳朮導滯丸治傷濕熱之物不得旋化而作痞滿悶亂不安黃芩茯苓白朮黃連各三錢澤瀉二錢枳實炒神麯炒各五錢大黃二兩上為末湯浸蒸餅為丸白湯下五七十丸白朮丸治傷豆粉濕面油膩之物白朮一兩半夏制一兩橘紅七錢神麯炒枳實炒各一兩黃芩半兩枯白礬三分上為末湯浸蒸餅為丸量所傷多少加減服之如素食多用乾薑故以黃芩瀉之梅食狗肉不消心下堅或腹脹口乾發熱妄語煮蘆根汁飲之千食魚膾及生肉在胸膈不化必成癥瘕搗馬鞭草汁飲之飲生薑水亦易消垣半夏枳朮丸治因冷食內傷一方有澤瀉一兩有小便淋故也半夏薑製二兩枳實炒一兩白朮一兩上為末荷葉飯為丸如傷食寒熱不調每服加上二黃丸十丸白湯下木香乾薑枳朮丸破滯氣消寒飲食木香三錢乾薑炮五錢枳實炒一兩白朮一兩半上為末荷葉飯為丸食前白湯服四五十丸丁香爛飯丸治食傷太陰又治卒心胃痛丁香一錢丁皮三錢甘草炙一錢甘松淨砂仁益智仁各三錢三稜炮一錢廣朮炮一錢香附五錢木香一錢上為末湯浸蒸餅為丸白湯服或細嚼亦可丹小胃丹芫花好醋拌勻過一宿於瓦器內不住手攪炒令黑不令焦甘遂濕麵裹長流水浸半日洗曬乾一雲水浸冬七日春秋五日或用水煮亦可大戟水煮一時洗曬乾各半兩大黃濕紙裹煨勿焦切焙乾再以酒潤炒熟焙乾一兩半黃柏炒三兩上為末以白朮膏丸如蘿蔔子大臨臥津液吞下或白湯送下取其膈上濕痰熱積以意消息之欲利空心服一方加木香檳榔各半兩蒸餅丸每服七八十丸本治中酒不醒及傷食巴豆去油三粒烏梅二枚丁香三粒胡椒五粒上為末入飯同杵二三千下為丸如桐子大細嚼丁香湯下五七丸小兒一丸仲備急丸治尺寸俱盛填塞悶亂方見卒中門垣蠲飲枳實丸逐飲消痰導氣清膈枳實麩炒半夏制橘紅各二兩黑醜取頭末三兩上為末水煮麵糊為丸每服五十丸食後生薑湯下如所傷飲食在胸膈間兀兀欲吐返覆悶亂以物探吐之甚者用瓜蒂散仲人病有宿食何以別之曰寸口脈浮而大按之反澀尺中亦微而澀故知有宿食用大承氣湯下之方見傷寒脈數而滑者實也此有宿食下之愈宜大承氣湯下痢不飲食者宿食也亦宜大承氣湯下之脈緊如轉索無常者有宿食也脈經云寸口脈緊胸中有宿食不化藏金露丸治內傷心痞氣不升降水穀不消大黃一兩枳實炒五錢桔梗二兩牽牛二錢五分上為末荷葉飯為丸白湯下三五十丸食後常服減半一方薑糊丸垣木香見晛丸治傷生冷硬物心腹滿悶疼痛巴豆霜五分京三稜煨神麯炒石三稜去皮穰各一兩木香二錢香附半兩升麻三錢草蔻煨熟取心五錢柴胡三錢上為末湯浸炊餅為丸如緑豆大每服一二十丸白湯送下三稜消積丸治傷生冷硬物不能消化心腹滿悶京三稜炮七錢廣朮炮七錢青皮陳皮各五錢丁皮益智各五錢神麯炒七錢茴香炒半兩巴豆和米皮炒焦去米上為末醋麵糊為丸如桐子大每服十丸至二十丸溫薑湯下食前服量虛實加減得更衣止後服感應丸治中虛積冷氣弱有傷停積胃脘不能傳化或因氣傷冷或因飢飽傷食飲酒過多心下堅滿兩脅脹痛心腹大痛霍亂吐瀉大便頻數後重遲澀久痢赤白膿血相雜米穀不化愈而復發又治中酒嘔吐痰逆噁心喜睡頭旋胸膈痞滿四肢倦怠不思飲食不拘新舊冷積並皆治之木香肉豆蔻丁香各一兩半乾薑炮一兩巴豆七十個去皮心膜研出油杏仁一百四十粒湯泡去皮尖研百草霜二兩上前四味為末外入百草霜研與巴豆杏仁七味同和勻用好蠟六兩溶化成汁以重絹濾去渣更以好酒一升於銀石器內煮蠟數沸傾出候酒冷其蠟自浮於上取蠟稱用丸春夏修合用清油一兩銚內熬令香熟次下酒煮蠟同化成汁就銚內乘熱拌和前項藥末秋冬修合用清油一兩半同煎煮熟成汁和前藥末成劑分作小錠子油紙裹放旋丸服之每三十丸空心薑湯下神應丸治一切冷物冷水及乳酪傷小腹痛腸鳴米穀不化巴豆杏仁乾薑百草霜各半兩丁香木香各二錢黃蠟二兩上先將黃蠟用好醋煮去渣穢將巴豆杏仁同炒黑煙盡研如泥春夏入香油半兩秋冬八錢溶開下杏仁巴豆攪勻次下木香丁香等末研勻搓作錠子油紙裹旋丸桐子大每米飲下三五十丸食前日三服大有效雄黃聖餅子巴豆一百枚去油膜雄黃半兩白麵十兩炒又羅過上三味內除白麵余同為細末共面和勻用新水攪和做餅如手大以水再煮浮於湯上看硬軟捏作餅子每服五七餅加至十餅十五餅嚼食一餅利一行二餅利二行食前茶酒任下潔人之生也由五穀之精化五味之備故能生形經曰味歸形若傷於味亦能損形今飲食過節以致腸胃不能勝氣不及化故傷焉經云壯火食氣氣食少火壯火散氣少火生氣又云飲食自倍腸胃乃傷以失四時之調節故能成病脈在氣口經曰氣口脈盛傷於食心胃滿而口無味口與氣口同口曰坤者口乃脾之候故胃傷而氣口緊盛夫傷有多少有輕重如氣口一盛得脈六至則傷於厥陰乃傷之輕也枳朮丸之類主之氣口二盛脈得七至則傷於少陰乃傷之重也雄黃聖餅子木香檳榔丸枳殼丸之類主之氣口三盛脈得八至九至則傷太陰填塞悶亂則心胃大痛備急丸神保丸消積丸之類主之兀兀欲吐不已俗呼食迷風是也經曰上部有脈下部無脈其人當吐不吐者死瓜蒂散主之如不能吐是無治也經曰其高者因而越之此之謂也備急下之亦可檳榔丸治飲食過多心腹脹悶檳榔二錢半陳皮牽牛各一兩木香二錢半枳實炒一兩上為末醋糊丸生薑湯下三四十丸煮黃丸治飲食過多心腹脹滿脅肋走氣痃癖刺痛如神雄黃研一兩巴豆五錢去皮心研如泥上入白麵二兩同研勻滴水丸如桐子大滾漿水煮十二丸濾入冷漿水內令沉冷每用時用浸藥冷漿下一丸一日十二時盡十二丸以微利為度不必盡劑仲宿食在上脘當吐之宜瓜蒂散又云凡血虛者不可吐垣瓜蒂散治大滿大實氣上衝逆上部有脈下部無脈填塞悶亂者用之如尺寸俱盛者宜用備急丸瓜蒂炒赤小豆煮等分上為細末每服二錢溫漿水調下取吐為度仲景以香豉七合煮取汁和散一匕服之若不至兩尺脈絶者不宜便服此藥恐損元氣令人胃氣不復若止胸中窒塞悶亂不通以物探之得吐則已如探不去方以此劑吐之或曰盛食填塞胸中痞亂兩寸脈當用事今反兩尺脈不見其理安在曰胸中有食是木鬱宜達故探吐之食者物也物者坤土也是足太陰之號也胸中者肺也為物所塞肺者手太陰金也金主殺伐與坤土俱在於上而旺於天金能剋木故肝木發生之氣伏於地下非木鬱而何吐去上焦陰土之物木得舒暢則鬱結去矣食塞於上脈絶於下若不明天地之道無由達此至理水火者陰陽之徵兆天地之別名也故獨陽不生獨陰不長天之用在於地下則萬物生長地之用在於天上則萬物收藏此乃天地交而萬物通也此天地相根之道也故陽火之根本於地下陰水之源本於天上故曰水出高源故人五臟主有形之物物者陰也陰者水也右三部脈主之偏見於寸口食塞於上是絶五臟之源源絶則水不下流兩尺脈之絶此其理也何疑之有然必視所傷之物冷熱隨症加減如傷冷物一分熱物二分則用寒藥二停熱藥一停隨時消息經云必先歲氣無伐天和此之謂也海秦生好服三生茶及冷物成積而痼寒脈非浮非沉上下內外按舉極有力堅而不柔觸指突出膚表往來不可以至數名縱橫不可以巨細狀此陰症鼓擊脈也一身流行之火萃於胸中寒氣逼之故搏大有力與真武四逆理中等湯丸佐以芍藥茴香使不僭上每日服百丸夜八十丸至夜出汗而愈潔既有三陰可下之法亦必有三陰可補之法豫故云內傷三陰可用溫劑若飲冷內傷雖云損胃未知色脈各在何經若面色青黑脈浮沉不一弦而弱者傷在厥陰若面色紅赤脈浮沉不一細而微者傷在少陰若面色黃潔脈浮沉不一緩而遲者傷在太陰也如傷在厥陰肝之經當歸四逆湯加吳茱萸生薑湯之類主之方見傷寒傷在少陰腎之經宜服通脈四逆湯方見傷寒傷在太陰脾之經理中丸湯主之大便軟者宜湯結者宜丸方見傷寒海唐臣嗜冷食遂成陰症脈遲七八至一止後僅三至豫亟與溫劑數服四五日不解遂續進三服一日脈生大汗而解羅陰氣者靜則神藏躁則消亡飲食自倍腸胃乃傷謂食物無貪於多貴在有節所以保沖和而遂頤養也若貪多務飽飫塞難消徒積暗傷以召疾患蓋食物飽甚耗氣非一或食不下而上湧嘔吐以泄真元或飲不消而作痰咯唾以耗神水大便頻數而泄耗穀氣之化生溲便滑利而濁耗源泉之浸潤至於精清冷而下漏汗淋漓而外泄莫不由食物過傷滋味太厚如能節滿意之食省爽口之味當不至於飽甚即頓頓必無傷物物皆為益津液內蓄精華和凝邪毒不能犯疾疢無由作矣胎前傷食本治婦人有孕傷食宜服木香丸木香二錢三稜白茯苓人參各三錢上為末麵糊丸每服三十丸熟湯下治妊娠氣不和調飲食少味宜服白朮散白朮紫蘇各一兩白芷人參訶子皮川芎青皮各半兩甘草一錢上為末每服二錢水一盞薑三片煎至七分不拘時溫服妊娠傷食又當於前條傷飲食之輕劑參酌用之經云飲食自倍腸胃乃傷又云陰之所生本在五味陰之五宮傷在五味若妊婦飲食不節生冷毒物恣意食啖致脾胃之疾故妊娠傷食難得藥效惟此二方穩便百病皆生於痰仲有痰飲有懸飲有溢飲有支飲其人素盛今瘦水走腸間瀝瀝有聲謂之痰飲病痰飲者當以溫藥和之又云心下有痰飲者苓桂甘術湯主之飲後水流在脅下咳唾引痛謂之懸飲病懸飲者十棗湯主之方見傷寒留飲者脅下痛引缺盆咳嗽則轉甚胸中有留飲其人短氣而渴四肢歷節疼脈沉者有留飲飲水流行歸於四肢當汗出而不汗出身體疼重謂之溢飲病溢飲者當發其汗大青龍湯小青龍湯主之二方並見傷寒咳逆倚息短氣不得臥其形如腫謂之支飲人咳數年其脈弱者可治實大數者死其脈數者必苦冒眩其人本有支飲在胸中故也治屬飲家支飲亦喘而不能臥加短氣其脈平也水在心心下堅築短氣惡水不欲飲水在肺吐涎沫欲飲水水在脾少氣身重水在肝脅下支滿嚏而痛水在腎心下悸嘔吐是水飲在心脅仲景云嘔吐心下痞者胸中有水宜半夏茯苓湯主之又云嘔家本渴今反不渴心下有支飲故也小半夏湯主之又云先渴卻嘔者水停心下小半夏加茯苓湯主之羅謙甫云痰飲為患或嘔吐噁心或頭眩心悸或半身不快或為寒熱並二陳湯主之方見丹溪痰門眩悸是飲仲景云卒嘔吐心下痞眩悸者膈間有水半夏加茯苓湯主之方見嘔吐又云瘦人臍下有悸吐涎沫而癲眩者此水也五苓散主之方見嘔吐又云胸滿目眩者苓桂朮甘湯主之方見短氣又云心下有支飲其人苦冒眩澤瀉湯主之方見眩門仲膈上病痰滿喘咳吐發則寒熱背痛腰疼目泣自出其人振振身瞤劇必有伏飲治見振條脈大心下有留飲其人背寒冷病人臂不時疼痛其脈沉細非風也必有飲在上焦其脈虛者為微勞營衛氣不和故也久久自瘥脈虛茯苓丸不虛控涎丹胸滿是飲仲景云支飲胸滿者厚朴大黃湯主之方見脹滿又云心下有痰飲胸脅支滿目眩苓桂朮甘湯主之方見短氣渴燥是水飲在腸胃所生仲景云渴而小便不利宜五苓散主之又云先渴卻嘔者為水停心下小半夏加茯苓湯主之又云腹滿口舌乾燥此腸間有水氣防椒藶黃丸主之但因水所在之處不同而所兼之症不一也自利有飲故丹溪治久痢皆吐之去膠痰自愈又仲景云病者脈伏其人欲自利利反快雖利心下續堅滿此為留飲欲去故也甘遂半夏湯主之方見泄瀉又云小便不利四肢沉重疼痛自利者此為水氣宜用真武湯去芍藥加乾薑主之久病傷寒表不解嘔咳自利者此為水氣宜服小青龍湯去麻黃加芫花主之尺膚粗如枯魚之鱗者水飲候也全文見診色鮮明者有留飲素肝脈耎而散色澤者當病溢飲溢飲者暴渴多飲而易入肌皮腸胃之外也脈要精微論肝脈澀甚為溢飲全文見治虛實法仲脈雙弦者飲也皆大下後善虛脈偏弦者飲也肺飲不弦但苦喘短氣脈弦數有寒飲冬夏難治脈沉而弦者懸飲內痛脈浮而細滑者傷飲孫綵帛鋪劉員外患傷寒六七日晝夜不得眠方眠即起方起即倒未嘗少息看待厭倦召孫孫曰若言是氣必喘作今無此症非氣也時復身上冷汗出尺寸脈皆沉關中亦沉重診之鼓擊於指下此痰積寒聚於胸中也遂用陳皮半夏乾薑三物各一兩為飲薑半兩捶碎以水兩碗煎七分去渣分二服服藥經時遂睡經一晝夜不蘇既覺下痰一塊如雞子大其疾遂愈凡痰症皆有冷汗其症明矣丹風痰多見奇症凡風痰病必用風痰藥白附子天麻雄黃牛黃殭蠶皂角之類濕痰多見倦怠軟弱濕痰宜用蒼白二術又用油炒半夏痰清者屬寒用二陳湯之類半夏陳皮茯苓甘草每服四錢加生薑七片烏梅一個煎不拘熱服嘔吐甚者加丁香導痰湯半夏四兩南星橘紅枳殼赤茯苓各半兩甘草薑水煎服燥濕痰方南星制半夏制各半兩蛤粉二兩青黛為衣熱痰多挾風外症為多用青黛黃連天花粉大快膈上熱痰痰因火盛逆上者治火為先白朮黃芩石膏之類中氣不足加參朮黃芩假之以降其熱也食積痰神麯麥糵山楂欲吐食積痰用蘿蔔子油炒為末漿水調下探而吐之食積痰必用攻若氣虛者用補氣藥送老痰海石半夏栝蔞香附五倍子佐他藥大治頑痰郁痰殭蠶杏仁栝蔞訶子貝母五倍子痰而脾虛者清中氣二陳湯加白朮之類兼用升提藥內傷挾痰必用參朮耆之類多用薑汁傳送或加半夏之類虛甚加竹瀝眩暈嘈雜乃火動其痰用二陳湯加梔子芩連之類噫氣吞酸此係食鬱有熱火氣上動以黃芩為君南星半夏橘紅為臣熱多加青黛喉中如有物咯不出咽不下此老痰也重者吐之用瓜蒂散氣實用荊瀝仲景用半朴茯薑治之神驗痰結核在咽喉中燥不能出入化痰藥內加咸藥軟堅之味栝蔞仁杏仁海石桔梗連翹少佐以朴硝薑蜜丸噙化凡人身上中下有塊是痰問其平日好食何物吐下後方用藥痰之為物隨氣升降無處不到痰在腸胃間可下而愈痰在經絡中非吐不可出吐中就有發散意痰在膈上必用吐之瀉亦不出痰膠固者及脈浮者俱用吐法吐法見治法門上下條痰在脅下非白芥子不能達痰在皮裡膜外以薑汁竹瀝導之痰在四肢非竹瀝不能開二陳湯善治人一身有痰如在下加下引藥在上加上引藥潤下丸降痰最妙青礞石丸重在風化硝小胃丹能損胃食積痰用之然不宜多服蒼朮治痰飲成窠囊者極效海粉能治熱痰降濕痰軟結痰消頑痰最效可入丸子不可入煎藥枳實瀉痰能沖牆壁竹瀝能治膈間有痰或癲狂或健忘或風痰最效又能養血荊瀝治痰稍重用此二味效速且穩當二瀝治痰結在皮裡膜外及經絡者必佐以薑汁韭汁治血滯不行中焦有飲取自然汁冷飲三四盞必覺胸中煩躁不寧後自愈氣實熱痰吐難得出或成塊或吐咯不出及兼氣鬱者難治中焦有痰胃氣亦賴所養卒不便虛若攻之盡則虛矣凡治痰用利藥過多致脾氣下虛則痰反易生而多矣丹痰之為病方論少有細述之者近惟三因略言亦無加減法夫痰之源不一有因痰而生熱者有因熱而生痰者有因氣而生者有因風而生者有因驚而生者有積飲而生者有多食而成者有因暑而生者有傷冷物而成者有脾虛而成者有飲酒而成者其為病也驚痰則成心包痛顛疾熱痰則成煩躁頭風爛眼燥結怔忡懊憹驚眩風痰成癱瘓大風眩暈暗風悶亂飲痰成脅痛四肢不舉每日嘔吐食痰成瘧痢口出臭氣暑痰中暈眩冒黃疸頭疼冷痰骨痹四肢不舉氣刺痛酒痰飲酒不消但得酒次日又吐脾虛生痰食不美反胃嘔吐氣痰攻注走刺不定婦人於驚痰最多蓋因産內交接月事方行其驚因虛而入結成塊者為驚痰必有一塊在腹發則如身孕轉動跳躍痛不可忍凡人手臂或動不得或骨節遍身痛坐臥不寧此痰入骨也有人腳氣久不治骨節痛與腳氣藥不效此痰病也凡傷寒病後嘔吐藥不得入亦因初病膈中有涎痰也或因下之太早而遂議其非痰未為確論傷寒發黃亦是痰病蓋因熱搏而成凡大便祕者亦是痰結上前件諸症變生不一甚不易辨指下難求得此妙訣慎勿輕敷凡有痰者眼皮及眼下必有煙灰黑色舉目便知不待切脈眼黑而頰赤者熱痰也面大黃色亦熱痰也外症必煩滿膈熱口乾思冷大便祕結小便赤熱久必生風或眩暈耳鳴眼花多虛症治之而用熱藥服久必脈大實發大熱而中風可急下之眼黑而行步呻吟舉動艱難者入骨痰也其症遍體骨節疼痛眼黑而面帶土色四肢痿痹屈伸不便者風濕痰也眼黑而氣短促者驚風痰也左右關脈大者膈中有痰也可吐之怕吐者消息下之凡人每日背上一條如線而寒起者宜吐下之凡病百藥不效其關上脈伏而大者痰也用妙應丸加減法方見走注疼痛即控涎丹腳氣加明松脂一錢檳榔木瓜各一兩卷柏半兩先以鹽水煎半日次日白水煮半日同前藥為丸每服二十丸加至四五十丸再服下惡物立效驚痰加硃砂二錢又加全蠍每用八九丸當與之三五服去盡酒痰加雄黃全蠍各二錢每服十丸走注腰痛加核桃三個燒灰每服三十丸加至五十丸溫酒下腳氣走注於前方內加吳茱萸驚氣成塊者加穿山甲炒鱉甲燒各三錢玄胡索蓬朮各四錢每服五十丸加至七十丸以利為度腎痹痛加木鱉子去殼研一兩桂半兩熱痰加盆硝等分每服三兩丸寒痰加胡椒丁香蠍桂各等分每服二十五丸洞虛痰之為病成偏頭風成雷頭風成太陽頭痛眩暈如坐舟車精神恍惚或口眼瞤動或眉稜耳輪俱癢或頷腮四肢遊風腫硬似疼非疼或渾身燥癢搔之則隱疹隨生皮毛烘熱色如錦斑或齒頰似癢似痛而疼無定所滿口牙浮痛癢不一或噯氣吞酸鼻聞焦臭喉間豆腥氣心煩鼻塞咽嗌不利咯之不出咽之不下或因噴嚏而出或因舉動而唾其痰如墨又如破絮或如桃膠或如蜆肉或心下如停冰鐵閉滯妨悶噯嚏連聲狀如膈氣或寢夢刑戮刀兵劍戟或夢入人家四壁圍繞暫得一竇百計得出則不知何所或夢在燒人地上四面煙火枯骨焦氣撲鼻無路可出或不因觸發忿怒悲啼雨淚而寤或時郊行忽見天邊兩月交輝或見金光數道回頭無有或足膝痠軟或骨節腰腎疼痛呼吸難任或四肢肌骨間痛如擊戳乍起乍止並無常所或不時手臂麻疼狀如風濕或臥如芒刺不安或如毛蟲所螫或四肢不舉或手足重滯或眼如薑蜇膠黏癢澀開闔甚難或陰晴交變之時胸痞氣結閉而不發則齒癢咽痛口糜舌爛及其奮然而發則噴嚏連聲初則涕唾稠黏次則清水如注或眼前黑暗腦後風聲耳內蟬鳴眼瞤肉惕治之者或曰腠理不密風府受邪或曰上盛下虛或曰虛或曰寒或曰發邪惟洞虛子備此疾苦乃能治療病勢之來則胸腹間如有二氣交紐噎塞煩郁有如煙火上衝頭面烘熱眼花耳鳴痰涎涕淚並從肺胃間湧起凜然毛豎噴嚏千百然後遍身煩躁則去衣凍體稍止片時或春秋乍涼之時多加衣袋亦得暫緩或頓飲冰水而定或痛飲一醉而寧終不能逐去病根乃得神祕沉香丸方屢獲大效愈人數萬但不欲輕傳匪人故以隱語括之詩曰甑里翻身甲帶金於今頭戴草堂深相逢二八求斤正硝煅青礞倍若沉十七兩中沉半兩水丸梧子意須斟除驅怪病安心志水瀉雙身卻不任大黃蒸八兩黃芩八兩青礞石一兩硝煅如金色沉香半兩上為末水丸如梧子大白湯食後空心服一切新舊失心喪志或癲或狂等症每服一百丸氣盛能食狂甚者加二十丸臨時加減消息之一切中風癱瘓痰涎壅塞大便或通或結者每服八九十丸或加至百丸永無祕結之患一切陽症風毒腳氣遍身遊走疼痛每服八九十丸未效加至百丸一切無病之人遍身筋骨疼痛不能名者或頭疼牙痛或搖或癢風蛀等症風寒鼻塞身體或疼或不疼非傷寒症者服八九十丸痰盛氣實者加之一切吞酸噯逆膈氣及胸中疼悶腹中氣塊衝上嘔沫吐涎狀如翻胃心下恍惚如畏人捕怵惕不安陰陽關格變生乖症食飢傷飽憂思過慮心下嘈雜或痛或噦或晝夜虛飽或飢不喜食急慢喉閉赤眼每用加減服一切新舊痰氣喘嗽或嘔吐頭暈目眩加減服之一切腮頷腫硬若瘰癧者及口糜舌爛咽喉生瘡者每服六七十丸加蜜少許一處嚼碎噙化睡時徐徐咽之曾有口瘡者服二三十丸依前法噙之二三夜瘥一切男婦大小虛實心疼連腹身體羸瘦發時必嘔緑水黑汁冷涎乃至氣絶心下溫暖者量虛實加減服之若事屬不虞之際至於百丸即便回生未至頭危者虛弱疑似之間只服三十丸或五十丸立見生意然後續續進之以瘥為度兼服生津化痰溫中理氣之藥一切荏苒疾病凡男婦患非傷寒內外等症或酒色過度或吐血或月事愆期心煩志亂或腹脹脅痛勞倦痰眩或暴行日中因暑伏痰口眼喎斜目痛耳憒鼻塞骨節痠疼乾嘔噁心諸般內外疼痛百藥無效衆醫不識者依前法加減服之效大抵服藥須臨臥在床用熱水一口許咽下便臥令藥在喉膈間徐徐而下如日間病出不測疼痛不可忍必欲急除者須是一依前臥法服大半日不可食湯水及不可起身行坐言語直候藥丸除逐上焦痰滯惡物過膈入腹然後動作方能中病每夜須連進二次次日痰物既下三五次者仍服前數下五七吹或只下二三次而病勢頓已者次夜減二十丸頭夜所服並不下惡物者次夜加十丸人壯病實者多加至百丸惟候虛實消息之或服過仰臥咽喉稠黏壅塞不利者痰氣泛上乃藥病相攻之故也少頃藥力既勝自然寧帖往往病久結實於肺胃之間或只暴病全無泛濫者服藥下咽即仰臥頓然百骸安靜五臟清寧次早先去大便一次其餘遍數皆是痰涕惡物看甚麼糞用水攪之盡系痰片黏涎或稍稍腹痛腰腎拘急者蓋有一種頑痰惡物閉氣滑腸裡急後重者狀如痢疾片晌即已若有痰涎易下者快利不可勝言頓然滿口生津百骸爽快間有片時倦怠者蓋因連日病苦不安一時為藥力所勝氣體暫和如醉得醒如浴方出如睡方起此藥並不洞泄刮腸大瀉但取痰積惡物自腸胃次第而下腹中糟粕並不相傷其推下腸腹之糞則藥力所到之處是故先去其糞其餘詳悉不能備述服者當自知之黃連導痰湯二陳湯加黃連枳實是也垣黃芩利膈丸利胸中熱治膈上痰黃芩生炒各一兩南星三錢半夏五錢黃連三錢枳殼三錢白朮五錢陳皮三錢澤瀉五錢白礬五分上為末水浸蒸餅丸每服三四十丸白湯下食遠服丹中和丸蒼朮黃芩半夏香附各等分為末蒸餅糊丸垣小黃丸化痰止涎除濕和胃氣治胸膈不利黃芩一兩乾薑二錢白朮半兩半夏薑製五錢澤瀉三錢黃耆半兩上為末蒸餅糊丸白湯下羅祛風丸有人喜食酸鹹酒色過節滲注成痰飲聚於胸膈滿則嘔逆噁心涎流一臂麻木升則頭目昏眩降則腰腳疼痛深則左癱右瘓淺則厥然倒地此藥寬中祛痰搜風理氣和血駐顏延年益壽半夏曲荊芥各四兩槐角子炒白礬生橘紅硃砂各一兩上為末薑汁糊丸每服五六十丸生薑皂角子仁湯送下日三服玄導痰丸半夏六兩分作三處一分礬水浸一分肥皂角為末水浸一分用巴豆百粒同水煎上余藥在下半夏在上浸至十日半月時時動水令二藥相透次相合一處揀去巴豆皂角慢火煮乾取半夏切碎曬乾入甘遂制二兩百藥煎二兩殭蠶一兩全蠍二兩上為末同前半夏末一處合和用揀出皂角煉膏為丸如硬再入糊令得所每服十五丸實者二十五丸本膈上有痰川芎丸川芎二兩細銼慢火熬熟川大黃二兩蒸令乾上件焙乾為末用不蛀皂角五七挺溫水揉汁絹濾出渣瓦罐中熬成膏和前二味為丸如桐子大每服十五丸小兒三丸生薑湯下經治風痰用鬱金一分藜蘆十分各為末和勻每服一字用溫漿水調下以余漿水漱口仰服以食壓之海五飲湯治五飲最效旋覆花人參陳皮去白枳實白朮茯苓厚朴制半夏制澤瀉豬苓前胡桂心白芍甘草炙上等分每兩分四服薑十片水二盞煎去渣溫服無時忌肉食生冷等物因酒成飲加葛根葛花砂仁局倍術丸治五飲一曰留飲停水在心下二曰癖飲水在兩脅三曰痰飲水在胃中四曰溢飲水溢在膈五曰流飲水在脅間瀝瀝有聲皆由飲水過多或飲冷酒所致白朮桂心去皮乾薑炮各一兩上為末蜜丸每服二十丸溫米飲下加至三十丸食前本治心腹中脘痰水冷氣心下汪洋嘈雜腸鳴多唾口中清水自出脅肋急脹痛不欲食此因胃氣虛冷所致其脈沉弦細遲旋覆花湯細辛陳皮桂心人參甘草桔梗芍藥半夏旋覆花以上各半兩赤茯苓上為末每服四錢薑七片煎去渣溫服羅木香半夏丸治痰涎上壅心胸不利常服消痰寬膈木香七錢半夏一兩陳皮茯苓薑屑人參草蔻白附子各五錢上為末麵糊丸食後生薑湯下三五十丸降痰丸治三焦氣澀下痰飲消食利膈痞滿咳唾稠黏面熱目赤肢體倦怠不思飲食常服升降滯氣消化痰涎木香檳榔青皮陳皮京三稜枳殼麩炒半夏湯洗大黃黑牽牛各一兩上為末麵糊丸食後薑湯下運氣痰飲皆屬濕土經云太陰在泉濕淫所勝民病飲積又云歲土太過雨濕流行甚則飲發中滿又云土鬱之發飲發中滿又云太陰之勝腹背病滿飲發於中治以諸熱劑是也撮諸痰為病頭風喘嗽一切痰飲豐隆中脘心婦人年高風痰作楚脈沉實滑數痰在下則無力在中則胸膈閉悶在上則頭風喘嗽昏暈發則抽牽手足皆動風門沿皮二寸半巨闕三寸二分豐隆二寸半肩井五分甲溢飲脅下堅痛中脘主之痞痞者心下痞滿而不能食是也仲景云滿而不痛為痞滿而痛為結垣夫痞者心下滿而不痛是也太陰者濕也主壅塞乃土來心下為痞滿也傷寒下太早亦為痞乃因寒傷其榮榮者血也心主血邪入於本故為心下痞悶仲景立瀉心湯數方皆用黃連以瀉心下之土邪其效如響應桴故活人書云審知是痞先用桔梗枳殼湯非以此專治痞也蓋因先錯下必成痞症是邪氣將陷而欲過胸中故先用截散其邪氣使不致於痞先之一字早用之義也若已成痞而用之則失之晚矣不惟不能消痞而反損胸中之正氣則當以仲景痞藥治之經云察其邪氣所在而調治之正謂此也非止傷寒如此至於酒積雜病下之太過亦作痞傷蓋下多亡陰亡陰者謂脾胃水穀之陰亡也故胸中之氣因虛下陷於心之分野故致心下痞宜升胃氣以血藥兼之若全用氣藥導之則其痞益甚甚而復下之氣愈下降必變為中滿膨脹皆非其治也又有虛實之殊如實痞大便閉者厚朴枳實湯主之虛痞大便利者白芍陳皮湯主之如飲食所傷痞悶者當消導之去其胸中窒塞上逆兀兀欲吐者則吐之所謂在上者因而越之是也海治痞獨益中州脾土以血藥治之其法無以加矣傷寒痞者從血中來雜病痞者亦從血中來雖俱為血症大抵傷寒之症從外至內從有形至無形故無形氣症以苦泄之有形血症以辛甘散之中滿者勿食甘不滿者復當食也中滿者腹脹也如自覺滿而外無腹脹之形即非中滿乃不滿也不滿者病也當以甘治之可也無形氣症以苦泄之者枳實黃連之類是也有形血症以辛甘散之者仲景人參湯是也垣黃耆補中湯黃耆五分人參八分甘草白朮蒼朮各五分陳皮五分澤瀉豬苓茯苓各三分用水煎至七分溫服送下大消痞丸丹治一婦人因有大不如意事遂致膈滿不食因循纍月積成癥痞不能起坐至午巳間必發熱面赤酉戌後熱退面赤亦退至夜小便雖數每出數滴而已六脈沉澀而短小左右一般重取皆有經水雖按月亦數滴而已豫曰此志不遂而氣鬱胃有瘀血而血亦虛鬱氣成痰在中宮卻不食兼用補瀉之治法以白朮二錢人參茯苓各一錢紅花一豆大陳皮一錢煎取濃湯一呷食前熱服之少頃藥行後與半匙稀粥又少頃用減輕粉牽牛三花丸如芝麻大以津唾下十五丸一日一夜煎藥丸藥各服四遍至次日方食知味又次日食稍進第三日則熱退面亦不赤如此七日飲食起坐平復如初三嬸口渴食少氣痞脈弦白朮青皮半夏各二錢乾葛一錢半木通一錢甘草炙少許分二帖薑二片煎下與點丸三十丸保和丸二十丸葶藶丸治心下痞胸中不利苦葶藶酒浸炒人參各三錢甘草根炙羌活柴胡獨活各二錢黃芩三錢一半酒浸一半炒砂仁茵陳酒炒各一錢白豆蔻一錢青皮厚朴半夏各五分當歸身七錢上為末蒸餅丸篩內水發如米大臨臥白湯服一錢木香消痞湯治因憂氣鬱結中脘腹皮急微痛心下痞滿不思飲食食亦不散常覺痞悶柴胡七分陳皮八分甘草炙五分半夏一錢生薑一錢歸梢二錢紅花少許枳實一錢木香七分草蔻一錢作一服水煎去渣食前熱服忌酒面等物大消痞丸治一切心下痞滿及積年久不愈者黃芩黃連炒各六錢薑黃白朮各一錢人參二錢甘草炙砂仁各一錢枳實炒五錢半夏制四錢乾薑一錢陳皮二錢神麯炒一錢澤瀉三錢厚朴二錢豬苓一錢半上為末水浸蒸餅為丸每服六七十丸至百丸食遠白湯下黃連消痞丸治心下痞滿壅塞不散煩熱喘促不寧黃連一兩枳實炒七錢乾薑二錢半夏七錢黃芩一兩茯苓白朮甘草炙各三錢薑黃一錢澤瀉一兩豬苓上為末湯浸蒸餅為丸每服五七十丸白湯食前下失笑丸治右關脈浮弦心下濕痞惡食懶倦開胃進食枳實黃連各五錢乾薑二錢半夏曲三錢厚朴炙四錢人參五錢甘草炙二錢白朮三錢麥糵二錢上為末水浸蒸餅為丸每服三十丸白湯送下不拘時量虛實加減服丹小娘心頭痞悶口乾面微黃脈洪黃連半夏白朮青皮木通各三錢分三帖薑煎去渣熱服下保和丸十五丸回金丸瀉肝火行濕與熱能開痞結治肝邪補脾土黃連六兩吳茱萸一兩上為末水浸蒸餅為丸一方用黃連六兩吳茱萸半兩一名佐金丸海少陰面赤下痢心下痞瀉心湯加減例易老單用黃連瀉心湯用錢氏法後隨症加減煩者加山梔燥加香豉嘔加半夏滿加枳實厚朴腹痛加芍藥脈遲加附子下焦寒加乾薑大便硬加大黃如用薑附先煎令熟使熱不僭後加黃連同用羅枳實理中丸治中脘痞滿滯氣不消積寒停冷飲食不化方見傷寒仲人參湯治胸痹心痞方見胸痹半夏瀉心湯治痞滿關脈沉方見傷寒丹一女子在家因事不如意鬱結在脾半年不食每日食棗數枚適喜饅頭亦能少食惟深惡粥飯豫診其脾氣非枳實不能散遂以溫膽湯去竹茹與服經三月服二百帖而愈又一女子二十餘許婚後夫遠出二年不歸女子病重不食困臥如癡他無所苦諸醫不效豫往治之見女向里床而睡形體羸瘦豫思之此氣結病也藥不能治得怒可解豫往激其怒掌其面三且責以不得有外思女果大怒而哭待其哭一二時許令其父母解之進藥二帖即欲食矣豫謂其父母曰雖愈必得喜方可解若再思則結氣必復至矣其父因偽作其夫有書回約日成婚一月餘其夫果歸病得全愈飲食傷脾痞悶輕者大消痞丸枳朮丸回金丸之類甚者微下之吐之下之者檳榔丸煮黃丸吐之者二陳湯及瓜蒂散探吐之是也經治膈下冷氣及酒食飽滿常服用青皮四兩分作四分一分用湯浸一宿去穰餘三分用鹽二兩拌勻良久銚內微炒焦為末每服一錢半茶末五分水一盞煎七分放溫常服用沸湯點服尤妙寒痞辛甘散之枳實理中丸之類是也熱痞苦寒泄之大消痞丸之類是也丹治痞軟石膏研末醋糊丸服能瀉胃火食積痰火運氣痞有三一曰濕痞經云土平氣曰備化備化之紀其病痞又云太陰所至為蓄滿為積飲痞膈又云太陰司天之政民病寒濕痞逆又云土鬱之發痞堅腹滿又云土不及曰卑監卑監之紀其病留滿痞塞是也二曰寒痞經云水鬱之發民病痞堅腹滿又云太陽之復心痛痞滿是也三曰燥痞經云陽明之復甚則痞滿是也海問井主心下滿十二經皆有井當治何井假令善潔面青善怒是少陽經受病當治金井竅陰是也假令滿閉淋溲便難轉筋足厥陰肝經受病當治木井大敦是也假令頭項痛腰脊強發熱惡寒足太陽膀胱受病當治陽井至陰是也假令手足自溫自利不渴足太陰脾受病當治陰井隱白是也羅藥戒客有病痞者積於其中伏而不得下自外至者捍而不得納從醫而問之曰非下之不可歸而飲其藥既飲而暴下不終日而向之伏者散而無餘向之捍者柔而不支焦膈通達呼吸開利快然若未始有疾者不數日痞復作投以故藥其快然也亦如初自是不逾月而痞五作五下每下輒愈然客之氣一語而三引體不勞而汗股不步而栗肌革無所耗於前而其中柔然莫知其所來嗟夫心痞非下不可已豫從而下之術未爽也薾然獨何如聞楚之南有良醫焉往而問之醫笑曰子無怪是薾然者也凡子之術固為是薾然也坐吾語汝天下之理有甚快於吾心者其末也必有傷求無傷於其中則無望快於吾心夫陰伏而陽蓄氣與血不運而為痞橫乎子之胸者其纍大矣擊而去之不須臾而除甚大之纍和平之物不能為也必將搏擊震撓而後可夫人之和氣衝然而甚微泊乎其易危擊搏震撓之功成而子之和亦已病矣由是觀之則子之痞凡一快者則子之和亦一傷矣不逾月而快者五子之和平之氣不既索乎故薾然如不終日也且將去子之痞而無害於和也子歸燕居三月而後與之藥可為也客歸三月齋戒而復請之醫曰子之氣少復矣取藥而授之曰服之三月而疾少平又三月而少康終年而可復常且飲藥不得亟進客歸而行其説然其初使人悶然而遲之蓋三投藥而三反之也然日不見其所攻之效久較則月異而時不同終歲而疾平矣客謁醫再拜而謝之坐而問其故醫曰此醫國之説豈特施之於病哉子獨不見秦之治民乎悍而不聽令墮而不勤事放而不畏法令之不聽治之不變則秦之民常痞矣商君見其痞也厲以刑法威以斬伐悍厲猛鷙不毫髮少貸痛劃而力鉏之於是乎秦之政如建瓴流通四達無敢或拒而秦之痞常一快矣自孝公以至二世凡幾痞而幾快矣頑者已圮強者已柔而秦之民無懼心矣故猛政一快者歡心一亡積快而不已而秦之四肢枵然徒具其物而已民心日離而君孤立於上故匹夫大呼不終日而百姓皆起秦欲運其手足肩膂而漠然不我應故秦之亡也是好為快者之過也昔者先王之民其初亦嘗痞矣先王豈不知砉然擊去之以為速也惟懼其有傷於中也故不敢求快於吾心優柔而撫育之教以仁義道以禮樂陰解其亂而除去其痞旁視而悶然有之矣然月計之歲察之前歲之俗非今歲之俗也不擊不搏無所忤逆是以日去其戾氣而不嬰其歡心於是政成教達安樂久而後患除矣是故三代之治皆更數聖人歷數百年而後俗成則豫之藥終年而疾愈蓋無足怪也故曰天下之理有甚快於吾心者其末也必有傷求無傷於其終則無望快於豫心雖然豈特治天下為然哉客再拜而紀其説不能食心下不痞滿自不能食也經治大人小兒不進乳食和氣去痰用人參四兩半夏一兩薑汁浸一宿曝乾為末麵糊丸食後生薑湯下垣和中丸開胃進食乾薑一錢木瓜一枚甘草炙二錢陳皮一錢人參一錢白朮三錢上為末蒸餅糊丸食前白湯下三五十丸本七珍散開胃進食補脾養氣人參白朮黃耆蜜炙山藥白茯苓粟米微炒甘草等分上為末每服二錢薑棗煎服如故不思飲食加扁豆一兩名八珍散此方溫平不熱常服飲食自倍海六神湯治傷寒虛羸不思飲食人參白朮黃耆各一兩枳殼一方用枳實炒白茯苓各半兩甘草二錢上為末每服五錢薑棗同粳米合許煎食前服羅錢氏異功散治脾胃虛弱難任飲食異功散用人參白茯苓白朮甘草橘紅木香各等分薑棗煎服羅謙甫云脾胃弱而飲食難任者不可一概用克伐之劑宜錢氏異功散補之自然能食設或嗜食太過傷脾而痞滿嘔逆權用枳實丸一服慎勿多服豫嘗治翁氏久瘧食少汗多先用補劑加黃連枳實月餘食反不進汗亦不止因悟謙甫此言遂減去枳連純用補劑又令粥多於藥而食進又於原方內加附子三分半一服而愈垣寬中進食丸滋形氣喜飲食草蔻仁五錢砂仁一錢五分半夏曲七錢麥芽炒一兩枳實炒四錢神麯炒半兩甘草炙一錢半乾薑一錢陳皮三錢木香五分白朮白茯苓各二錢豬苓澤瀉人參青皮各一錢上為末湯浸蒸餅為丸每服三五十丸白湯下和中丸治病久虛弱厭厭不能食而臟腑或祕或溏常服和中理氣消痰進食去濕厚腸胃厚朴薑製一兩白朮一兩半半夏制一兩橘紅八錢檳榔四錢枳實麩炒三錢木香二錢半甘草炙三錢半上為末生薑汁浸蒸餅丸每服五六十丸食遠白湯下木香枳朮丸木香乾薑枳朮丸能開胃進食二方並見內傷飲食門交泰丸升陽氣瀉陰火調榮氣進飲食助精神寬腹脹除怠惰嗜臥四肢不收沉困懶倦知母四錢一半生一半酒炒春夏用秋冬減去柴胡一錢半厚朴去皮炒三錢秋冬加七錢人參一錢黃連六錢秋冬減一錢半苦楝酒煮三錢肉桂去皮一錢白茯苓三錢皂角去皮弦煨六錢紫菀去苗六錢小椒炒去汗並閉目者一錢半白朮二錢川烏頭四錢半乾薑炮三錢巴豆霜半兩吳茱萸湯洗半兩砂仁三錢上除巴豆霜另研入余俱為細末蜜丸每服三四十丸溫水下量虛實加減河人參半夏丸下痰進食方見咳嗽門丹治一男子因服熱藥多又性急形瘦多倦食少此時四月後與此方分作十四帖食後煎熱下大補丸十五粒白朮一兩半炒曲一兩陳皮七錢黃芩六錢人參知母炒麥門冬木通各半兩生甘草炙甘草各一錢又治勞苦不思飲食白朮三錢滑石白茯苓各一錢水煎服下保和丸三十丸治腳氣瘦倦不思飲食白朮二兩蒼朮陳皮黃連黃柏半夏各半兩扁柏七錢半香附一兩白芍藥一兩上為末薑汁糊丸憂抑傷脾不思飲食黃連炒芍藥酒炒香附青六散末方見滯下即六一散加紅曲二兩上薑汁浸炊餅為丸濕痰氣滯不思穀食三補丸加蒼朮倍香附本治脾氣久虛不進飲食停飲脅痛曲術丸神麯炒十兩白朮五兩乾薑官桂各二兩吳茱萸川椒各三兩上為末薄糊丸每服三五十丸食前薑湯下有飲加白朮二兩此方自試有效二神丸治脾腎虛弱全不進食破故紙炒四兩肉豆蔻生二兩上為末用肥棗四十九個生薑四兩切片同煮棗爛去薑取棗剝去皮核用肉研為膏入藥末和杵丸如桐子大每服三四十丸鹽湯下有人全不進食服補脾藥皆不效豫授此方服之頓能進食此病不可全作脾氣治蓋腎氣怯弱真元衰削是以不能消化飲食譬之鼎釜之中置諸米穀下無火力終日米不熟其何能化黃魯直嘗記服菟絲子淘淨酒浸曝乾日挑數匙以酒下之十日外飲啖如湯沃雪亦知此理也摘胃弱不思飲食腸鳴腹痛食亦不化三里三陰交東三焦停水氣攻不食身黃微熱胃中有寒故也維道中封胃俞腎俞撮三焦邪熱不嗜飲食關元一分沿皮向後三分灸東全不思食然谷出血立飢脈浮滑而疾者食不消脾不磨陽脈滑而緊滑則胃氣實緊則脾氣傷得食不消者此脾不和也枳朮丸之類治之仲寸口脈微而澀微者衛氣不行澀者榮氣不達榮衛不能相將三焦無所仰身體痹不仁榮氣不足則頭疼口難言衛氣虛則惡寒數欠三焦不歸其部上焦不歸者噫而吞酸中焦不歸者不能消穀引食下焦不歸者則為遺溲異功散之類治之飢不能食靈黃帝曰人之善飢而不嗜食者何氣使然岐伯曰精氣並於脾熱氣留於胃胃熱則消穀谷消故善飢胃氣逆上則胃脘寒故不嗜食也大惑論運氣飢不欲食皆屬濕邪傷腎經云太陰司天濕淫所勝民病心如懸飢不欲食治以苦熱是也針灸飢不欲食有二法其一清胃經云胃者水穀之海其腧上在氣衝下至三里水穀之海不足則飢不受谷審守其腧調其虛實是也其二取腎經云腎足少陰之脈是動則病飢不欲食心如懸若飢狀視盛虛熱寒陷下取之也東飢不能食飲食不下嘔而雷鳴大迎中極食竇又法期門章門冬脈不及為病在中令人心懸如飢全文見治虛實法仲寸口脈弱遲弱者胃氣微遲者榮中寒榮為血血虛則發熱胃為氣氣虛則發厥惡食素太陰所謂惡聞食臭者胃無氣故惡食臭也丹惡食者胸中有物導痰補脾二陳加白蒼楂芎湯白朮山楂川芎蒼朮半夏陳皮茯苓甘草垣失笑丸治虛痞惡食方見痞門妊娠惡食大治妊娠惡食人參四兩厚朴生薑枳殼甘草各一兩水煎服凡妊娠惡食者以所思食任意食之必愈消疸門渴而多飲為上消消穀善飢為中消渴而便數有膏為下消垣上消者舌上赤裂大渴引飲逆調論云心移熱於肺傳為膈消是也以白虎加人參湯主之潔古曰上消者上焦受病又謂之膈消多飲水而少食大便如常小便清利知其燥在上焦治宜流濕以潤其燥中消者善食而瘦自汗大便硬小便頻數叔和云口乾飲水多食亦飢虛疸成為消中者是也以調胃承氣湯及三黃丸主之潔古云中消者胃也渴而飲食多小便赤黃熱能消穀知其熱在中焦也宜下之下消者煩躁引飲耳輪焦乾小便如膏叔和云焦煩水易虧此腎消也以六味地黃丸主之潔古云腎消者病在下焦初發為膏淋謂淋下如膏油之狀至病成面色黧黑形瘦而耳焦小便濁而有脂液治宜養血以分其清濁而自愈矣上上消者經謂之膈消膈消者渴而多飲是也中消者經謂之消中消中者渴而飲食俱多或不渴而獨飲是也下消者經謂之腎消腎消者飲一溲二其溲如膏油即膈消消中之傳變王注謂肺臟消燥氣無所持是也蓋肺藏氣肺無病則氣能管攝津液而津液之清微者收養筋骨血脈余者為溲肺病則津液無氣管攝而精微者亦隨溲下故飲一溲二而溲如膏油也筋骨血脈無津液以養之故其病成漸形瘦焦乾也然肺病本於腎虛腎虛則心寡於畏妄行凌肺而移寒與之然後肺病消故仲景治渴而小便反多用腎氣丸補腎救肺後人因名之腎消及下消也或曰經既云肺消死不治仲景復用腎氣丸治之何也曰飲一溲二者死不治若飲一未至溲二者病尚淺猶或可治故仲景腎氣丸治飲水一斗小便亦一斗之症若小便過於所飲者亦無及矣病式服藥熬豬肚湯小承氣湯益火之源以消陰翳則便溺有節羊肉冬瓜湯腎氣丸地黃丸消渴手太陰大渴不止消中足陽明疸成消中而數小便胃熱消穀善飢腎消足少陰膏疸飲少溲多麥冬飲子內化丸鳳髓丹化水丹易老順氣散壯水之主以制陽光則渴飲不思垣論消渴末傳能食者必發腦疽背瘡不能食者必傳中滿鼓脹聖濟總録皆為必死不治之症潔古分而治之能食而渴者白虎加人參湯主之不能食而渴者錢氏白朮散倍加葛根主之上中既平不復傳下消矣前人用藥厥有旨哉或曰未傳瘡疽者何也此火邪勝也其瘡痛甚而不潰或赤水者是也經曰有形而不痛者陽之類也急攻其陽無攻其陰治在下焦元氣得強者生失強者死末傳中滿者何也以寒治熱雖方士不能廢繩墨而更其道也然臟腑有遠近心肺位近宜制小其服腎肝位遠宜制大其服皆適其所至所為故知過與不及皆誅罰無過之地也如膈消中消制之太急速過病所久而成中滿之疾正謂上熱未除中寒復生者非藥之罪失其緩急之宜也處方之際宜加審焉本總録論消渴有三種一者渴而飲水多小便數有脂似麩片而甜者消渴病也二者吃食多不甚渴小便少有似油而數者消中病也三者雖渴飲水不能多腿腳瘦小痿弱小便數此腎消病也特忌房勞千金云消渴病宜慎者有三一飲酒二房勞三鹹食及面能慎此三者雖不服藥亦自可愈消渴之人愈與未愈嘗須慮患大癰必於骨節間忽發癰疽而卒素帝曰夫子數言熱中消中不可服膏粱芳草石藥石藥發癲芳草發狂夫熱中消中皆富貴人也今禁膏粱是不合其心禁芳草石藥是病不愈願聞其詳岐伯曰芳草之氣美石藥之氣悍二者其氣急疾堅徑故非緩心和人不可以服此二者帝曰不可以服此二者何以然岐伯曰熱氣慓悍藥氣亦然二者相遇恐內傷脾脾者土也而惡木服此藥者至甲乙日更論腹中論王注云多飲數溲謂之熱中多食數溲謂之消中芳草即白芷石藥即鍾乳之類垣滑石治渴本為竅不利而用之以燥能亡津液也天令濕氣太過者當用之若無濕用之是犯禁也靈黃帝曰人之善病消疸者何以候之少俞答曰五臟皆柔弱者善病消疸黃帝曰何以知五臟之柔弱也少俞曰夫柔弱者必有剛強剛強多怒柔者易傷也黃帝曰何以候柔弱之與剛強曰此人薄皮膚而目堅固以深者長沖直揚其心剛剛則多怒怒則氣上逆胸中蓄積氣血逆留臗皮充肌血脈不行轉而為熱熱則消肌膚故為消疸此言其人暴剛而肌肉弱者也五變篇𩩲骬弱小以薄者心脆心脆則善病消疸熱中肩背薄者肺脆肺脆則善病消疸易傷脅骨弱者肝脆肝脆則善病消疸易傷唇大而不堅者脈脆脈脆則善病消疸易傷耳薄不堅者腎脆腎脆則善病消疸易傷全文見診法心脈微小為消疸滑甚為善渴肺脈微小為消疸肝脈微小為消疸小甚為多飲脾脈微小為消疸腎脈微小為消疸諸脈小者陰陽俱不足也勿取以針而調以甘藥全文見治虛實法凡治消疸肥貴人則膏粱之疾素心脈耎而散者當消環自已脈要精微論帝曰消疸何如岐伯曰脈實大病久可治脈懸小堅病久不可治虛實論難病若開目而渴心下牢者脈當得緊實而數反得沉澀而微者死也十七難脈消渴脈數大者生細小浮短者死渴而多飲為上消丹治消渴養氣降火生血為主栝蔞根治消渴之神藥心移熱於肺傳為膈消全文見診病傳變王注云心脅兩間中有斜膈膜膈膜下際內連於橫膈膜故心熱入肺久久傳化內為膈熱消渴而多飲也垣潔古云能食而渴者白虎倍加人參湯主之不能食而渴者錢氏白朮散加葛根大作湯劑廣服之保人參石膏湯治膈消上焦煩渴不欲多食人參五錢石膏一兩知母七錢甘草四錢每服五錢水煎食後溫服錢加減地骨皮散治上消知母柴胡甘草炙半夏地骨皮赤茯苓白芍藥黃耆石膏黃芩桔梗上為細末每服三錢薑五片水煎食遠溫服垣白朮散治虛熱而渴人參白朮白茯苓甘草各一兩乾葛二兩藿香一兩去土木香一兩上為末每服三錢煎溫服如飲水多多與服之海藏云四君子加減法治濕勝氣脫泄利太過海治脾胃虛弱大渴不止而食少小便不利大便不調精神短少腹窄狹如繩束之白茯苓去皮橘紅各一兩生薑半兩上為末煉蜜丸如彈子大每服二丸白湯化空心服忌生冷硬物怒發思慮過度如脈弦或腹中急甚者加甘草三錢易老門冬飲子治老弱虛人大渴人參枸杞子白茯苓甘草各三分五味子半兩麥門冬去心半兩薑水煎服羅門冬飲子治膈消胸滿心煩精神短少多為消病知母甘草炙栝蔞仁五味子人參葛根茯神生地麥門冬各一兩上為粗末每服五錢加竹葉十四片同煎垣小便不利而渴知內有濕也小便自利而渴知內有燥也濕宜泄之燥宜潤之仲脈浮小便不利微熱消渴者宜利小便發汗五苓散主之方見傷寒脈浮發熱渴欲飲水小便不利者豬苓湯主之方見傷寒本火府丹治消渴方見淋壬戌年一卒病渴日飲水三斗不食者三月心中煩悶時已十月豫謂心中有伏熱與此藥數服每服五十丸溫水下越二日來謝云當日三服渴止又次日三服飲食如故此方本治淋用以治渴效信乎藥要變通用之藏器石燕主消渴同水牛鼻和煮飲之渴而小便自利諸方並見下消燥熱條垣神效生津甘露飲子方見下消燥熱條丹消渴泄瀉先用白芍白朮各炒為末調服後隨症用藥垣止渴潤燥湯治消渴大便乾燥喜溫飲陰頭短縮舌上白燥唇裂口乾眼澀難開及於黑處如見浮雲升麻一錢半柴胡七分甘草梢五分杏仁六個桃仁研一錢麻仁研一錢歸身一錢紅花少許防風根一錢荊芥穗一錢熟地二錢小椒一分細辛一分黃柏一錢知母石膏各一錢水煎去渣食後熱服雜症有汗而渴者以辛潤之無汗而渴者以苦堅之太陽無汗而渴不宜服白虎湯若得汗後脈洪大而渴者宜服之陽明汗多而渴不宜服五苓散若小便不利汗少脈浮而渴者宜服之丹消渴病退後而燥渴不解此有餘熱在肺經可用參苓甘草少許生薑汁冷服虛者可用人參湯潔化水丹治手足少陰渴飲不止或心痛者本事治飲冷水多川烏臍大者四個炮去皮甘草炙一兩牡蠣生三兩蛤粉用厚者炮六兩上為細末醋浸蒸餅為丸每服十五丸新水下心痛者醋湯下立愈飲水一石者一服愈海藏云此藥能化停水垣太陽經渴其脈浮無汗者五苓散滑石之類主之陽明經渴其脈長有汗者白虎湯涼膈散之類主之少陽經渴其脈弦而嘔者小柴胡湯加栝蔞之類主之太陰經渴其脈細不欲飲縱飲思湯不思水者四君子理中湯之類主之少陰經渴其脈沉細自利者豬苓湯三黃丸之類主之厥陰經渴其脈微引飲者宜少少與之聖治時氣煩渴用生藕汁一盞入生蜜一合令勻分為三服蜜酒方好蜜三斤水一碗細曲一升好乾酵二兩上先熬蜜水去沫冷下曲酵每日攪三次熱服仲渴欲飲水不止者文蛤散主之文蛤五兩按本草云文蛤味鹹寒治消渴陳無擇以文蛤為五味子上一件捍為散以沸湯和服方寸匕經治一切渴用大牡蠣不拘多少於臘月或端午日黃泥裹煅通赤放冷取出為末用鯽魚煎湯下一錢匕小兒五分只兩服瘥本治渴疾飲水不止神效散白浮石蛤粉蟬殼等分上為末用鯽魚膽七個調三錢不拘時服又消渴方白浮石舶上青苔等分麝香少許上為末每服二錢溫湯下黃連丸即栝蔞根丸是也保上焦燥而渴蜜煎生薑湯用大器傾注時時呷之法曰心肺之病莫厭頻而少飲內經曰補上治上宜以緩又曰辛以潤之開腠理致津液通則肺氣下流故火氣降而燥衰矣其渴即止有人消渴引飲無度或令食韭苗日用三五兩不得入鹽但吃得十斤即效海千里漿一名水葫蘆木瓜紫蘇葉桂各一兩烏梅肉一兩赤茯苓一兩一方有神麯豆粉上為末煉蜜丸如彈子大噙化一丸咽下齒屬腎水故也又方百藥煎烏梅肉紫蘇葉人參甘草麥門冬上等分為細末煉蜜丸如彈子大噙化芷梅湯烏梅肉甘草各三分百藥煎一兩白芷半兩白檀三錢上為細末湯點服運氣渴有二一曰熱助心盛而渴經云少陽司天之政三之氣炎暑至民病渴又云少陰之復渴而欲飲又云少陽之復嗌絡焦稿渴引水漿治以諸寒劑是也二曰寒攻心虛而渴經云太陽司天寒氣下臨心火上從嗌乾善渴又云太陽司天寒淫所勝民病嗌乾渴而欲飲又云寒水太過上臨太陽民病渴而妄冒治以諸熱是也丹治消渴用繅絲湯飲之能引腎氣上行朝於口仲吐酸欲得水而貪飲者文蛤飲主之兼治微風脈緊頭痛文蛤五兩麻黃甘草生薑各三兩石膏五兩杏仁五十粒大棗十二枚上㕮咀以水七升煮取二升溫服一升汗愈垣甘草石膏湯治渴病全愈再劇舌白滑微腫咽喉咽唾覺痛嗌腫時渴飲冷白沫如膠飲冷乃止升麻一錢五分柴胡七分甘草根五分黃柏一錢石膏六分杏仁六個桃仁防風根荊芥穗生地各一錢熟地三分黃連三分知母一錢細辛一分紅花少許小椒三個歸身一錢上水煎去渣食後熱服針灸口渴咽乾有四法其一取心經云心手少陰之脈是動則病嗌乾心痛渴而欲飲隨盛虛寒熱陷下取之也其二取肺大腸經云大腸手陽明之脈所生病者目黃口乾隨盛虛寒熱陷下以施補瀉疾留之法也又云肺虛則少氣耳聾嗌乾取其經太陰太陽之外厥陰內血者是也其三取腎經云腎足少陰之脈所生病者口熱舌乾咽腫嗌乾隨盛虛寒熱陷下取之又云嗌乾口中熱如膠取足少陰是也其四取肝經云肝足厥陰之脈是動病甚則嗌乾面塵脫色隨盛虛寒熱陷下取之密消渴經百日以上者不可刺灸刺灸則瘡口病水不止玉液一分瀉見血訖取下穴三里瀉訖如前補玉液一分再取下穴關元瀉訖再取廉泉集又法金津玉液承漿不已再取海泉人中廉泉腎俞氣海東小腸俞陽池各灸之廉泉出惡血方已又法胃腧心腧膻中各灸之又法承漿然谷勞宮曲池意舍關元各灸之世口熱咽乾唾如黏膠口苦嗌中介介然太溪五分陽陵泉二寸半甲渴飲身體燥多噫隱白主之消渴嗜飲承漿主之消渴脘骨主之嗌乾腹瘈痛坐臥目䀮䀮善怒多言伏溜主之消穀善飢為中消疸成為中消全文見診經云五臟皆柔弱而脆者為消疸王注云疸為消熱病也已食而飢者胃疸平人氣象論一云注夏即疸勞病也谷入多而氣少得之有所脫血濕居下也全文見診生死靈胃中熱則消穀令人心懸善飢䏚以上皮熱師傅篇下同胃中熱腸中寒則疾飢小腹痛脹中熱則胃中消穀五癃津液篇素三陽結謂之消陰陽別論王注云胃及大腸俱熱結也熱則善消水穀垣消渴中消自古只治燥止渴誤矣殊不知三陽結謂之消三陽者陽明也手陽明大腸主津液所生病熱則目黃口乾是津液不足也足陽明主血所生病熱則消穀善飢血中伏火是血不足也結者津液不足結而不潤皆燥熱為病也此因數食甘美而多肥故其氣上溢轉為消渴治之以蘭除陳氣也不可服膏粱芳草石藥其氣悍烈能助熱燥也越人云邪在六腑則陽脈不和陽脈不和則氣留之氣留之則陽脈盛矣陽脈太盛則陰氣不得榮也故肌肉皮膚消削是也素帝曰有病口甘者病名為何何以得之岐伯曰此五氣之溢也名曰脾疸夫五味入口藏於胃脾為之行其精氣津液在脾故令人口甘也此肥美之所發也此人必數食甘美而多肥也肥者令人多熱甘者令人中滿故其氣上溢轉為消渴治之以蘭除陳氣也奇病論潔胃熱則善消水穀可飲甘辛降火之劑用黃連末生地白藕各自然汁牛乳各一升熬成膏和黃連末一斤丸如桐子大每服三五十丸少呷白湯下日進十服河豬肚丸治消渴豬肚一個黃連一兩栝蔞根四兩麥門冬去心四兩知母一兩為細末納豬肚中線縫置甑中蒸極爛乘熱於石臼中杵可丸為度如硬加少蜜為丸每服三十丸漸加至四五十丸渴則服之三因方多粱米杜仲本草云豬肚能補中益氣止渴垣調胃承氣湯治消中渴而飲食多方見傷寒此初起時宜服之三黃丸方見治發熱條潔順利散治中熱在胃而能食小便赤黃微利至不欲食為效不可多利厚朴枳實各一兩大黃煨四兩每服五錢水煎食遠服大腸移熱於胃善食而瘦又謂之食㑊全文見診病傳變食㑊者謂食移易而過不生肌膚亦易飢也東垣云善食而瘦者胃伏火邪於氣分則能食脾虛則肌肉削也胃移熱於膽亦名食㑊同上河參蒲丸治食㑊胃中結熱消穀善食不生肌肉人參赤茯苓菖蒲遠志地骨皮牛膝酒浸各一兩上為末煉蜜丸每服二十丸米飲下運氣消中皆屬熱經云少陰之勝心下熱善飢又云少陽之勝熱客於胃善飢治以寒劑是也針灸消中皆取於胃經云邪在脾胃陽氣有餘陰氣不足則熱中善飢取三里灸之又云胃足陽明之脈氣盛則身以前皆熱於胃則消穀善飢熱則清之盛則瀉之甲陰氣不足熱中消穀善飢腹熱身煩狂言三里主之腹中氣脹引脊痛飲食多而身羸瘦名曰食㑊每作先取脾俞後取季脅渴而便數有膏為下消羅張安撫藝夫年四十五歲病消渴舌上赤裂飲水無度小便數多先師以此藥治之良愈消渴多傳瘡瘍為不救之疾既效亦不成瘡瘍享年七十五而終名之曰生津甘露飲子治消渴上下齒麻舌硬赤爛腫痛食不下腹時脹滿疼痛渾身色黃目白睛黃甚則四肢萎弱無力面塵脫色脅下急痛善嚏善怒健忘臀肉腰背疼寒兩丸冷甚一方石膏用一兩二錢石膏一錢二分人參甘草生山梔白豆蔻白芷連翹甘草炙蓽澄茄黃連薑黃藿香各一錢白葵五分麥門冬杏仁各一錢歸身蘭香各五分黃柏酒炒錢半升麻根二錢木香一錢桔梗三分柴胡根五分知母酒二錢全蠍二個去毒上為末水浸蒸餅和勻成劑捏作餅子曬乾杵碎如黃米大每服二錢挑於掌內以舌舐之津液送下或白湯食後服之神效凡消渴為病燥熱之氣勝也內經云熱淫所勝佐以甘苦以甘瀉之熱則傷氣氣傷則無潤折熱補氣非甘寒之劑不能故以石膏之甘寒為君啓玄子曰滋水之源以鎮陽光故以柏連梔子知母之苦寒瀉熱補水為臣以當歸杏仁麥門冬全蠍連翹白葵蘭香甘草甘寒和血潤燥為佐升麻柴胡苦平行陽明少陽二經蓽澄茄白豆蔻木香藿香反佐以取之又用桔梗為舟楫使浮而不下也垣和血養氣湯治口渴舌乾小便數舌上赤裂此藥生津除燥生肌肉一名地黃飲子黃連酒七分桃仁六個生地七分紅花少許黃柏酒一錢當歸酒四分甘草炙三分升麻一錢知母酒五分防己酒三分羌活五分麻黃根二分口乾舌渴加杏仁六個甘草生三分小便數加石膏六分上㕮咀作一服水煎去渣稍熱服忌酒面房事清涼飲子治消中能食而瘦口舌乾自汗大便結小便數羌活梢一錢柴胡梢一錢升麻梢四分防風梢五分當歸六分甘草梢一錢石膏一錢半知母酒製一錢紅花少許防己五分龍膽草一錢半黃柏一錢半桃仁五個杏仁五個生地酒五分黃耆根一錢黃芩酒一錢甘草炙一錢上水二盞酒一小盞煎服甘露膏治消渴飲水極多善食而瘦自汗大便結燥小便頻數又名蘭香飲子石膏二錢知母一錢半甘草生一錢炙五分人參五分防風根一錢半夏制五分蘭香五分白豆蔻連翹桔梗升麻各五分上為末水浸蒸餅丸或捏劑作薄餅子曬乾碎如米大每用淡薑湯下二錢丹徐兄年四十歲口乾小便數春末得之夏來求治診其兩手左澀右略數而不弦重取似大而稍有力左稍沉略弱而不弦然澀卻多於右喜兩尺皆不甚起此由飲食味厚生熱謂之痰熱禁其厚味宜降火以清金抑肝以補脾用三消丸十粒左金阿魏丸各五粒以薑湯吞下一日六次又以四物湯加參朮陳皮生甘草五味子麥門冬煎服一日三次與丸藥間服一二日自覺清快小便減三之二口亦不幹止渴未除頭暈眼花久坐則腰疼遂以摩腰膏治腰疼仍以四物湯用參耆減川芎加牛膝五味子炒柏麥門冬煎飲調六一散服及覺便多遂去六一散仍服丸藥而安黃連末治消渴要藥加天花粉末人乳生地黃汁生藕汁二物為膏入山藥末搜和以薑汁和煉蜜為膏徐徐挑於舌上以白湯少許送下亦得能食加軟石膏治消渴以天花粉為末用人乳汁生韭汁煎膏丸如緑豆大每服百丸食後服肘治消渴小便多者煮栝蔞根汁飲之良世治消渴無方可治者用天花粉大烏頭炒等分為細末蒸餅丸每服百丸黑豆湯下以上四方栝蔞根為君本草云栝蔞根主消渴止小便通月水乳汁夫既能止小便又能通月水知其流濕潤燥治消渴之要藥也本千金地黃丸治腎渴黃連四兩為末生地半斤研取汁連渣拌黃連末和勻曬乾用上再為細末煉蜜為丸食後麥門冬湯下五六十丸羅黃連丸治消渴飲水無度小便頻數黃連淨半斤用無灰好酒浸一宿重湯蒸一伏時取出曬乾用上為細末滴水丸白湯下五七十丸又方治卒消渴小便多搗黃連細末蜜丸服三四十丸麥門冬湯治消渴日夜飲水無度飲下即溲麥門冬去心黃連冬瓜各二兩上為粗末每服五錢水煎八分去渣溫服若冬瓜無干者用新冬瓜肉三斤去穰分作十二片為十二服每服用瓜一片劈破水煎日三服冬瓜飲子治消渴能食而飲水多小便如脂麩片日夜無度冬瓜一枚黃連十兩為細末上先以冬瓜破開去穰摻黃連末在內卻用頂蓋定於熱灰中煨熟去皮切細爛研絞汁每服一盞至二盞日三夜一服本三消丸用好黃連治淨為細末不拘多少切冬瓜肉研取自然汁和成餅陰乾再為細末用汁浸和加至七次即用冬瓜末為丸每服三四十丸以冬瓜汁煎大麥仁湯送下尋常渴止一服效以上五方黃連冬瓜為君丹溪云冬瓜性走而急久病與陰虛者忌之又有黃連為佐用者審之食治消渴飲水不止小便數用田螺五升水一斗浸一宿渴即飲之每日一度易水換螺為妙又方以水煮取汁飲之螺亦任吃子和治飲水百杯尚猶未足小便如砂或如杏色服此方三五日小便大出毒注下十日除根此方子和自云此重劑試有驗水銀四錢錫二錢同水銀炒成砂子牡蠣密陀僧知母紫菀苦參貝母各一兩黃丹半兩栝蔞根半斤上為細末男子用不生兒豬肚婦人用獖豬肚一個納藥於內以麻線縫之用新瓦二片繩系一二遭別用米一升栝蔞根末半升於新水內煮熟取出放冷不用米及栝蔞只研豬肚並肚中藥末爛和為丸如硬加蜜食前米湯下三四十丸三因方無貝母河胡粉散治大渴百方不痊者亦治腎消黃丹胡粉各半兩栝蔞根二兩半甘草一兩澤瀉石膏赤石脂白石脂各半兩上㕮咀水煎服日二服如腹痛減之為丸服尤妙每服十丸多則腹痛葛根丸治消渴消腎日飲碩水者葛根三兩栝蔞根二兩黃丹二兩附子炮去皮臍一兩上為末煉蜜丸每服十丸日進三服春夏去附子垣六味地黃丸治腎消效方見治虛實法經治消渴不止下元虛者用牛膝五兩細銼為末生地黃汁五升晝曝夜浸以汁盡為度蜜丸空心溫酒下三十丸久服壯筋骨駐顏色黑鬚發生津液仲治男子消渴小便反多如飲水一斗小便亦一斗腎氣丸主之方見治虛實法子和治腎消以腎氣丸本方內加山藥一味外桂附從四時加減冬一兩春秋三錢夏一錢又法腎氣丸去附子加五味子一兩半本唐祠部李郎中治消渴者腎虛所致每發則小便甜醫者多不知其故亦缺而不言洪範曰稼穡作甘以物理推之淋餳醋酒作脯法須臾即甜足明人之食後滋味皆甜流在膀胱若腰腎氣盛則上蒸炎氣化成精氣下入骨髓其次為脂膏又其次為血肉其餘則為小便故小便色黃血之餘氣也五臟之氣咸潤者則下味也若腰腎既虛冷則不能蒸化穀氣盡下為小便故味甘不變其色清冷則肌膚枯稿也猶如乳母穀氣上泄皆為乳汁消渴病者下泄為小便皆精氣不實於內則小便數溲溺也又肺為五臟華蓋若下有暖氣蒸則肺潤若下冷極則陽不能升故肺干而渴易於否卦言之矣乾上坤下陽無陰不降陰無陽不升上下不交故成否也譬如釜中有水以火暖之又以板覆之則暖氣上騰故板能潤若無火力則水氣不能上升此板終不得潤火力者腰腎強盛也常須暖補腎氣飲食得火力則潤上而易消亦免乾渴之患故仲景云宜服腎氣八味丸此疾與腳氣雖同皆為腎虛所致其腳氣始發於二三月盛於五六月衰於七八月凡消渴始發於七八月盛於十一二月衰於二三月其故何也夫腳氣壅疾也消渴宣疾也春夏陽氣上故壅疾發則宣疾愈秋冬陽氣下故宣疾發則壅疾愈審此二者疾可理也猶如善為政者寬以濟猛猛以濟寬隨時變通耳和治諸虛不足胸中煩悸時常消渴唇口乾燥或先渴而欲發瘡或病癰疽而後渴者宜用黃耆湯多服之方見癰疽門凡消渴而小便反多有脂者皆腎氣不管攝津液也宜多服黃耆黃耆乃補氣之要藥保行氣丸治消渴五靈脂衍義云五靈脂入肝最遠能行經血不能生血烏頭去皮臍上等分為末每服三錢冬瓜湯下無瓜時苗葉亦可日三服渴止勿服再服八味丸去附子加五味子外治消腎小便數鹿角一具炙焦搗篩為末酒服方寸匕漸漸加之保茴香散治消病下焦渴症小便如膏茴香炒苦楝炒各等分炒為末食後酒調下一錢食治消渴舌焦口乾小便數野雉一隻以五味煮令極熟去肉取汁渴飲之肉亦可食肝疸者夜臥則驚多飲小便數全文見疸心移寒於肺消者飲一溲二不治全文見診病傳變王注云腎臟消爍氣無所攝故飲一溲二也仲寸口脈浮而遲浮即為虛遲即為勞虛則衛氣不足勞則榮氣竭跗陽脈浮而數浮則為氣數則消穀而大堅氣盛則溲數溲數則堅堅數相搏即為消渴跗陽脈數胃中有熱即消穀引飲大便必堅小便即數胎前渴云葛根散治婦人妊娠胸膈煩躁唇口乾裂四肢壯熱食少葛根黃芩人參蕤仁黃耆甘草麥門冬上各等分每服四錢加竹茹彈子大水煎服人參黃耆散治妊娠身熱煩躁口乾少食四肢壯熱人參黃耆葛根秦艽麥門冬各一兩知母七錢半甘草五錢赤茯苓一兩上㕮咀每服四錢薑三片淡竹葉十四片同水煎治妊娠壅熱心神煩躁口乾渴逆升麻黃芩人參麥門冬山梔柴胡茯神栝蔞根犀角鎊各一兩知母甘草各五錢上㕮咀每服四錢水煎服知母散治妊娠煩悶口乾胞胎臟熱知母麥門冬甘草各半兩黃耆黃芩赤茯苓各七錢半上㕮咀加竹茹同煎産後渴云竹葉湯治産後虛弱口渴竹葉三升甘草人參茯苓各一兩生薑半夏各三兩麥門冬五兩大棗十五個上㕮咀以水九升先用生薑竹葉大棗煎取七升去渣入藥煎取二升每服五合日三夜一玄胡索散治産後失血渴不止鬱金乾葛桂心青皮枳殼玄胡索上等分以好醋浸一宿焙乾為末每服二錢陳皮湯調下日三夜一本治産後出血太多虛煩發渴用真正蒲黃末二錢白湯調下如渴燥甚井花水下大治産後中風煩渴用紅花子五合微炒研碎以水煎濃徐徐呷之陳士良療血渴及産後渴疾用蓮子心生取為細末米飲調下二錢效保桃花散治産後不煩而渴新石灰一兩黃丹五錢上為細末渴時用井水調下一錢口燥咽乾垣飲食不節勞倦所傷以致脾胃虛弱乃血所生病主口中津液不行故口乾咽乾病人自以為渴醫以五苓散治之反加渴燥乃重竭津液以致危亡經云虛則補其母當於心與小腸中補之乃脾胃之根蒂也以甘溫之藥為之主以苦寒為之使以酸為之臣佐以辛心苦緩急食酸以收之心火旺則肺金受邪金虛則以酸補之次以甘溫及甘寒之劑於脾胃中瀉心火之亢盛是治其本也本黃耆湯治心中煩躁不生津液不思飲食黃耆熟地白芍藥五味子麥門冬各三兩甘草人參天門冬各五錢白茯苓一兩上㕮咀每服三錢薑棗烏梅同煎去渣食後服五味子湯桑枝煎治口乾方見癰疽燥熱咽乾忌南星半夏運氣口燥舌乾皆為熱燥二氣然分言之有四一曰熱經云歲火太過民病嗌燥又云少陰司天熱淫所勝病胸中煩熱嗌乾治以寒劑是也二曰燥經云金鬱之發嗌乾面塵又云陽明在泉燥淫所勝甚則嗌乾面塵治以溫劑是也三曰上熱下燥經云少陰司天之政水火寒熱之氣持於氣交民病嗌乾四之氣民病寒熱嗌乾是也四曰上燥下熱經曰陽明司天之政四之氣民病嗌乾引飲皆治以寒溫多少其制是也素督脈主病嗌乾骨空論黃疸丹五疸不要分同是濕熱如盦曲相似輕者小溫中丸重者大溫中丸熱多者加芩連濕多者茵陳五苓散加食積藥濕熱因倒胃氣服下藥大便下利者參耆加茵陳山梔甘草仲諸病黃家但利其小便假令脈浮當以汗解之宜桂枝加黃耆湯谷疸之為病寒熱不食食即頭眩心胸不安久久發黃為谷疸茵陳蒿湯主之黃疸病茵陳五苓散主之二方並見傷寒羅茯苓除濕湯治黃疸氣熱嘔吐而渴欲飲冷身體面目俱黃小便不利不得安臥亦不思食白茯苓五分澤瀉三分茵陳蒿六分豬苓三分黃芩生黃連山梔防己白朮蒼朮陳皮青皮各二分上㕮咀水煎空心服完顏正卿因官事勞役飲食不節心火乘脾脾氣虛弱更以恚怒氣逆傷肝心下痞滿四肢困倦身體麻木次傳身目俱黃微見青色顏黑心神煩亂怔忡不安兀兀欲吐口生惡沫飲食不化時下完穀小便癃閉而赤黑辰巳之間發熱日暮則止至四月尤甚豫診其脈浮而緩金匱云寸口脈浮為風緩為痹痹非中風四肢苦煩脾色必黃瘀熱已行跗陽脈緊食谷即眩為傷脾風寒相搏穀氣不消胃中苦濁濁氣不流小便不通陰被其寒熱流膀胱身體盡黃名曰谷疸宜服茵陳梔子湯茵陳一錢茯苓五分山梔仁蒼朮炒白朮各三錢黃芩生六分黃連枳實炒豬苓去皮澤瀉陳皮防己各二分青皮一分上㕮咀作一服長流水煎食前溫服二服可愈山梔茵陳能瀉濕熱而退黃故以為君枳實苦寒泄心下痞滿肺主氣今熱傷其氣故身體麻木以黃芩苦寒瀉火補氣為臣二術苦甘溫青皮苦辛溫能除胃中濕熱泄其壅滯養其正氣防己苦寒能去十二經滯濕澤瀉鹹平茯苓豬苓甘平導膀胱中濕熱利小便而去癃閉丹治疸脈虛便赤此後五方主之治虛者驗白朮一兩人參豬苓茵陳各半兩澤瀉七錢山梔炒木通三錢桂枝一婦人年二十八歲發黃脈澀經水自來不行身髓倦怠未曾生子陳皮白朮木通各一兩黃芩歸頭丹皮各半兩甘草一錢分作十二帖水煎食前熱服千治疸取小麥杵汁絞飲六七合晝夜飲三四次愈仲諸疸用豬膏半斤亂髮如雞子大三枚以發入膏中煎至發盡分再服病自從小便中出垣腎疸湯治腎疸目黃渾身金色小便赤澀升麻根半兩羌活根一錢防風根半錢獨活根半錢白朮柴胡根蒼朮一錢豬苓一分澤瀉三分白茯苓葛根半錢甘草根三分黃柏二分人參神麯各六分分作二帖水煎食前稍熱服仲桂枝加黃耆湯治黃疸脈浮而腹中和者宜汗之若腹滿欲嘔吐懊憹而不和者宜吐之不宜汗桂枝白芍藥各三兩甘草二兩生薑三兩大棗十二枚黃耆二兩白水煎熱服須臾飲熱粥以助藥力取微汗為度未汗更服丹治一人年二十歲因勞又冒雨得疸腳痠心悸口苦力弱尿黃脈浮而數病在表宜解外黃耆三錢白朮蒼朮各一錢陳皮蘇葉木通五分山梔炒二個甘草梢些白水煎服下保和十五丸與點抑青各十丸溫中二十丸仲麻黃醇酒湯治黃疸用麻黃三兩以好清酒五升煮取二升五合頓服盡冬月用酒煮春月用水煮酒疸或無熱清言了了腹滿欲吐鼻燥其脈浮者先吐之沉弦者先下之酒疸心中熱欲嘔者吐之愈如陰症欲吐者韓氏用陳皮湯理中湯類瓜蒂湯治諸黃用瓜蒂二七枚以水一升煮取五合去渣頓服百一治疸取藜蘆置灰內炮之少變色搗為末水服半錢匕小便不利數服子和蔡氏一女病黃遍身浮腫面目如金色困乏無力不思飲食惟喜食生物灰災之屬先以苦劑蒸餅為丸吐痰一碗又以舟車丸通經散下五七行如墨汁更以導飲丸磨食散氣不數日安好如初李七老病湧水症面黃而喘二足皆腫按之陷而復起行則濯濯有聲常欲飲水不能睡臥戴人令上湧去痰而汗之次以舟車丸浚川散下以益腎散復下之又以分陰陽利水道之劑復下之所苦皆瘥上脈浮而腹不和者吐之仲治酒疸心中憹懊或熱痛梔子大黃湯主之山梔十四枚大黃二兩枳實五枚豆豉一升上四味以水三升煎取二升溫作三服黃疸腹滿小便不利而赤自汗出此為表和裡實當下之宜大黃硝石湯主之大黃黃柏硝石各四兩梔子十五枚水煎將熟納硝石頓服師曰病黃疸發熱煩喘胸滿口燥者以病發時以火劫其汗兩熱所得然黃皆從濕得之一身盡發熱面黃肚熱熱在裡當下之羅黃連散治黃疸大小便祕澀壅熱纍效黃連二兩大黃醋拌炒二兩黃芩甘草炙各一兩上為極細末食後溫水調下二錢日三服先用瓜蒂散搐鼻取下黃水卻服此藥瓜蒂散見後雜方條孫治黃疸皮黃眼睛赤金色小便赤取秦艽五兩牛乳三升煮取一升去渣入芒硝一兩服之蕭炳云秦艽治酒疸子和安喜趙君玉病疸遍身發黃往問醫衆醫皆云乃陽明症公等與麻知幾皆受訓於張戴人是商議吃大黃者難與論病君玉不悅歸自揣無別病乃取三花神佑丸八十粒服之不動君玉乃自悟曰豫之濕熱甚矣此藥尚不動以舟車丸浚川散服之大下結糞一斗一夕而黃退君玉因此益信戴人之技上脈沉而腹不和者下之仲諸黃腹痛而嘔者宜小柴胡湯方見傷寒孫治黃疸用柴胡一兩去苗甘草一分細銼作一劑以水一碗白茅根一握同煎至七分去渣不拘服諸疸小便不利為裡實宜利小便或下之無汗為表實宜發汗或吐之治法並見表裡疸條男子黃大便自利當與虛勞小建中湯方見傷寒海內感傷寒勞役形體飲食失節中州變寒病生黃非外感而得只用建中理中大建中足矣不必用茵陳仲治一婦人年六十歲病振寒轉栗足太陽寒水也呵欠噴嚏足少陽膽也口中津液足陽明不足也心下急痛而疸手少陰受寒足少陰血滯也身熱又欲近火熱在皮膚寒在骨髓也臍下惡寒丹田有寒渾身黃及睛黃皆寒濕也餘症驗之知其為寒溺黃赤而黑又頻數者寒濕勝也病來身重如山便著床枕者陰濕盛也其脈右手關尺命門弦細按之洪而弦弦急為寒加之細者北方寒水雜以緩甚者濕盛出黃色脈洪大者心火受制也左手又按之至骨舉手來實者壬癸腎旺也六脈按之俱空虛者下焦無陽也用藥法先宜以輕劑去其寒濕兼退其洪大之脈以理中加茯苓湯投之按此症雖小便黃赤亦作寒治者蓋以餘症及脈別之也人參白朮甘草乾薑茯苓水煎熟以冰冷與之此熱因寒用以假寒對足太陽之假熱以乾薑辛熱瀉膀胱之真氣故曰真對真假對假若不愈當以朮附湯與之羅陰黃治驗至元丙寅六月時雨霖霪人多病濕疫真定韓君祥因勞役過度渴飲涼茶又食冷物遂病頭痛肢節亦疼身體沉重胸滿不食自以為外感用通聖散二服後添身體困甚方命醫治之醫以百解散發其汗越四日以小柴胡湯二服後加煩躁又六日以三乙承氣湯下之燥渴尤甚又投白虎加人參湯柴胡飲之類病愈增又易醫用黃連解毒湯硃砂膏至寶丹十七日後病勢轉增傳變身目俱黃肢體沉重背惡寒皮膚冷心下痞硬按之則痛眼澀不欲開目睛不了了懶言語自汗小便利大便了而不了命豫治之診其脈緊細按之虛空兩寸脈短不及本位此症得之因時熱而多飲冷加以寒涼藥過度助水乘心反來侮土先囚其母後簿其子經云簿所不勝乘所勝也時值霖雨乃寒濕相合此謂陰症發黃豫以茵陳附子乾薑湯主之經云寒淫於內治以甘熱佐以苦辛濕淫所勝平以苦熱以淡滲之以苦燥之附子乾薑辛甘大熱散其中寒故以為君半夏草蔻辛熱白朮陳皮苦甘溫健脾燥濕故以為臣生薑辛溫以散之澤瀉甘平以滲之枳實苦微寒瀉其痞滿茵陳微苦寒其氣輕浮佐以薑附能去膚腠間寒濕而退其黃故為佐使也煎服一劑前症減半兩服悉去又服理中湯數服氣得平復或難曰發黃皆以為熱今暑熱隆盛又以熱藥治之何也豫曰理當然也成無己云陰症有二一者始外傷寒邪陰經受之或因食冷物傷太陰經也二者始得陽症以寒治之寒涼過度變陽為陰也今君祥因天令暑熱冷物傷脾過服寒涼陰氣大勝陽氣欲絶加以陰雨寒濕相合發而為黃也仲景所謂當於寒濕中求之李思順云解之而寒涼過劑瀉之而逐寇傷君正謂此也聖賢之制豈敢越哉附子炮去皮三錢乾薑炮二錢茵陳一錢二分白朮四分草蔻煨一錢白茯苓三分枳實麩炒半夏制澤瀉各半錢橘紅三分上生薑五片水煎去渣涼服無養榮湯治五疸腳弱心忪口淡耳響微寒發熱氣急小便白濁當作虛勞治之黃耆當歸桂心甘草炙陳皮白朮人參各一兩白芍藥三兩熟地五味子茯苓各三錢遠志去心半兩上每服四錢薑棗煎空心服上法治虛寒黃疸丹治婦人久勞苦得面黃心悸口苦小便不黃自利食少右脈大於左此虛中受濕也白朮芍藥當歸各五錢黃耆黃芩茯苓人參各三錢陳皮一錢半黃連一錢甘草五分分六帖下保和溫中各二十丸垣補中湯治面黃多汗目眥赤四肢沉重減食腹中時痛咳嗽兩手左脈短右脈弦細兼澀右手關脈虛升麻柴胡各二錢歸身二分蒼朮五分澤瀉四分甘草炙八分五味子二十一粒黃耆二錢半神麯三分紅花少許大麥曲五分上作二服水煎食前上二方治虛熱黃疸仲黃疸小便色不變欲自利腹滿而喘不可除熱熱除必噦小半夏湯主之方見嘔吐小便色不變不可除熱者蓋中無熱故清白而不黃自無熱可除也諸疸小便色白不可除熱者無熱也若有虛寒症者當作虛勞治之諸疸小便黃赤色者為濕熱治法並見表裡虛疸條嚴谷疸丸專治谷疸苦參三兩龍膽草一兩牛膽一個上為末入牛膽汁加少蜜為丸空心薑湯或甘草湯下葛根湯治酒疸葛根一兩枳實炒山梔豆豉各一兩甘草炙半兩白水煎不拘時溫服外治黃疸以柳枝入水濃煎汁服之經患五色急黃以水調山豆根末二錢空心服之運氣黃疸皆屬濕熱經云少陰司天之政四之氣溽暑至民病黃疸又云厥陰司天之政四之氣溽暑濕熱相搏民病黃疸而為胕腫是也羅嗅鼻瓜蒂散治黃疸渾身如金色纍效瓜蒂二錢母丁香一錢黍米四十九粒赤小豆五分上為細末每夜臨臥時先含水一口卻於兩鼻孔嗅上半字便睡至明日取下黃水便服黃連散病輕者五日效重者半月效黃連散方見前大小閉條聖治遍身如金色用瓜蒂四十九個須是六月六日收者丁香四十九粒入甘鍋內燒煙盡為度研細小兒用半字吹鼻及揩牙大人用一字吹鼻內立瘥類要治黃疸用苦葫蘆瓤如大棗許四枚以童便浸三兩食頃取兩棗許分納兩鼻中黃水自出效令病人吸之又方治黃疸身眼皆如金色修合不可令婦人雞犬見之取東引桃枝一握細切用水二鍾煎至半空心服服後三五日其黃離離如薄雲漸散唯眼最後瘥百日方平復身黃漸散後可時飲清酒一盞使眼中黃易散忌食熱面豬魚等物針灸黃疸有二法其一取脾經云脾足太陰之脈所生病者黃疸視盛虛熱寒取之其二取腎經云腎足少陰之脈所生病者黃疸視盛虛熱寒取之玉黃疸腕骨三分灸七壯中脘補集黃疸發虛傷寒飲食過多腕骨一分湧泉三分灸百勞三里中脘膏肓甲黃疸善欠脅下滿欲吐脾俞主之千金云身重不可動消渴身熱面赤黃意舍主之消渴黃疸足一寒一熱舌縱煩滿然谷主之消疸善喘氣走咽喉不能言手足清溺黃大便難嗌中腫痛唾血口中熱唾如膠太溪主之黃疸熱中善渴太衝主之身黃時有微熱不嗜食膝內內踝前痛少氣身重中封主之黃疸身黃勞宮主之嗜臥四肢不欲動搖身黃灸手五里左取右右取左黃疸刺脊中千金云腹滿不能食素目黃者曰疸溺黃赤安臥者亦名黃疸靈身痛而色微黃齒垢黃爪甲上黃黃疸也論疾診尺篇仲脈沉渴欲飲水小便不利者皆發黃腹脹滿面痿黃躁不得睡屬黃家跗陽脈緊而數數則為熱熱則消穀緊則為寒食即為滿尺脈浮為傷腎跗陽脈緊為傷脾寒熱相搏食谷即眩穀氣不消胃中苦濁濁氣下流小便不通陰被其寒熱流膀胱身體俱黃名曰谷疸陽明病脈遲者食難用飽飽則發煩頭眩小便又難此欲作谷疸雖下之腹滿如故所以然者脈遲故也心中懊憹而熱不能食時欲吐名曰酒疸病酒黃疸必小便不利其候心中熱足下熱是其症也脈酒疸黃色心下結熱而煩仲額上黑微汗出手足中熱薄暮則發膀胱急小便自利名曰女勞疸腹如水狀不治治見黑疸黃疸之病當以十八日為期治之十日以上宜瘥反劇為難治疸而渴者難治疸而不渴者可治發於陰部其人必嘔發於陽部其人振寒而發熱脈凡黃家候其寸口脈近掌無脈口鼻冷並不可治産後發黃丹治一婦人四月內産發黃四肢倦怠食少經事不來時發熱脈弦白朮一兩人參秦艽丹皮生地木通柴胡芍藥各半兩川芎黃芩乾葛各一錢甘草分十二帖水煎食前熱服食勞疳黃一名黃胖夫黃疸者暴病也故仲景以十八日為期食勞黃者宿病也至有久不愈者故宜另立篇門丹大溫中丸治黃胖朱先生晚年定者香附一斤童便浸春夏一宿秋冬三宿甘草二兩針砂炒紅醋淬三次一斤苦參春夏二兩秋冬一兩厚朴薑製炒黑五兩芍藥五兩陳皮三兩山楂五兩蒼朮五兩泔浸白朮茯苓各三兩青皮六兩俱為細末醋糊丸如桐子面黑筋骨露氣實者米飲下五六十丸麵肥白與氣虛羸弱者白朮湯下三四十丸忌一切生冷油膩雞鵝羊鴨生硬並糍粽難化之物服過七日後便覺手掌心涼口唇內有紅暈起調理半月愈丈夫黃胖胃有宿積口淡腳痠氣急針砂淘炒淨醋煅用細末三兩蒼朮香附三稜各一兩陳皮黃連茱萸人參各半兩茯苓七錢上為末神麯醋糊丸每服五十丸若飽入保和十丸白湯下又小溫中丸治黃胖宜草野貧賤人服蓋其飲食無積但補陰燥濕而已針砂一斤以醋炒為末入糯米炒極黃為末亦用一斤醋糊丸如桐子大每米飲下四五十丸忌口同上輕者服五兩重者不過七兩愈六十嫂面黃口苦而渴此食積生濕熱白朮一錢半連翹一錢羌活通草煎熟吞下谷疸丸保和丸各四十粒阿魏丸五粒暖中丸治黃胖殺肝邪舒脾氣虛者不宜用陳皮蒼朮厚朴制三稜白朮青皮各五錢香附一斤甘草二兩針砂十兩醋炒紅上為末醋糊丸空心鹽薑湯下五十丸晚食前酒下亦可忌狗肉上五方附朴楂青稜蓬以磨積針砂酸醋以瀉肝白朮蒼朮以補脾重可去怯之劑唯溫中丸無補性虛者勿用世治黃胖緑礬六兩用米醋於鐵鍋內煮七次以干為度置地上出火氣為末南星末一兩炒麵一兩大皂角二斤水煮熟揉出濃膠去皮渣濾過再熬入棗子六兩蒸熟去皮核煎成濃膏搗勻和前藥末為丸如桐子大每服五丸早晚用薑湯各一服忌油膩煎爆如身上發紅斑時急煎棗湯服之斑自愈本治男婦患食勞氣勞遍身黃腫欲變成水及久患痃癖小腸膀胱面目忽黃宜服紫金丹膽礬三錢黃蠟二兩大棗五十枚上以砂鍋或銀石器內用好醋三升先下礬棗慢火熬半日取出棗去皮核次下蠟再慢火熬一二時如膏好入臘茶二兩同和丸如桐子大每服二三十丸茶酒任下如久患腸風痔漏陳米飲下日三服一日見效宗室趙彥材下血面如蠟不進食蓋酒病也授此方服之終劑血止面鮮潤食亦倍常新安一士人亦如是與三百粒作十服立愈羅棗礬丸治食勞黃目黃身黃皂礬不拘多少置砂鍋內燒通赤用米醋點之燒用木炭上為末棗肉丸每服二三十丸食後薑湯下一方用白礬不用皂世棗礬丸治黃胖皂礬五兩煅棗肉二兩蒸粉三兩上為末生薑汁丸每服二三十丸一日二次米飲下食前右三方礬醋之酸以瀉肝棗肉之甘以補脾若虛黃於前疸門小便自利自汗虛勞疸條下諸方選用之丹婦人年三十面黃腳痠弱口苦喜茶月經不勻且多倦怠黃耆三分白朮一分炒柏二分秦艽二分甘草三分木通五分陳皮五分芍藥人參各一錢當歸一錢一婦年六十面黃倦甚足酸口苦脈散而大此濕傷氣也白朮半兩陳皮四錢蒼朮木通黃芩各三錢砂仁人參川芎各二錢黃柏炒一錢甘草炙五分分六帖水煎食前服王官人痞後面黃腳痠弱倦怠食飽氣急頭旋黃耆二分蒼朮一錢白朮一錢半木通二分甘草炙二分黃柏炒三分厚朴制一錢陳皮一錢水煎服成庚五官面黃腳痠無力食不化脈虛而少弦口苦肚脹宜補之蒼朮半錢木通三分白朮一錢半當歸五分芍藥陳皮各五分甘草炙二分川芎五分人參三分水煎下保和丸四十丸經治食氣遍身黃胖氣喘食不進心胸渴悶用不蛀皂角去皮及子塗好醋炙令焦為末一錢巴豆七粒去油膜二件以淡醋研好墨為丸如麻子大每服三丸食後陳皮湯下日三服隔一日增一丸以利為度常服消酒食子和一男子作贅偶病疸善食而瘦四肢不舉面黃無力其婦翁欲棄之其女不肯婦翁乃農夫招壻意欲作勞見其病甚每日詬辱之人教之餌蠟礬丸三稜丸俱不效戴人見之不診而療使服湧劑去積痰宿水一斗又以泄水丸通經散下四五十行不止戴人命飲冰水一盞立止次服平胃散間服檳榔丸五十粒七日黃退力生蓋黃疸之症濕熱與宿谷故也俗謂之食勞黃世喜吃干茶石膏白芍藥黃芩水煎服更於積塊門茶疸條相參用之山酒面黃用絲瓜連皮子燒灰因面得病麵湯調下因酒得病酒調下黃汗黃汗汗出染衣黃如柏汁是也仲問曰黃汗之為病身體腫發熱汗出而渴狀如風水汗沾衣色正黃如柏汁脈沉何從得之師曰以汗出時入水中浴水從汗孔入得之宜耆芍桂酒湯主之黃耆白芍藥各五兩桂枝三兩上三味以苦酒一升水七升相和煮取三升溫服一升初發當心煩服至六七日乃解若心煩不止者以苦酒阻故也一方用好酒代苦酒黃汗之病兩脛自冷假令發熱此屬歷節食已汗出又身常暮盜汗出者此勞氣也若汗出已反熱者久久其身必甲錯若發熱不止者必生惡瘡若身重汗出已輒輕者久久身必瞤又胸前痛腰上有汗腰下無汗腰臗弛痛如有物在皮中狀劇者不能食身疼重煩躁小便不利者此為黃汗桂枝加黃耆湯主之方見本門表疸下脈浮而洪浮則為風洪則為氣風氣相搏風強則為隱疹身體為癢癢為泄風久為痂癩氣強則為水難以俯仰風氣相擊身體洪腫汗出乃愈惡風則虛此為風水不惡風者小便通利上焦有寒其口多涎此為黃汗目黃經云目黃者曰黃疸然亦有目黃而身不黃者故宜另立篇門風氣自陽明入胃循脈而上至目眥其人肥風氣不得外泄則為熱中而目黃全文見諸風條河青龍散治風氣傳化腹內疼結而目黃風氣不得泄為熱中煩渴引飲地黃威靈仙防風荊芥穗何首烏去黑皮米泔浸一宿竹刀切各二兩上為末每日三服食後沸湯調下一錢類治黃疸目黃不除用瓜丁為細末如豆大納鼻中令病人深吸取鼻中黃水出愈針灸目黃有五法其一取心經云心少陰之脈所生病者目黃脅痛云云其二取心主經云心主手厥陰之脈是動則病面赤目黃云云其三取小腸經云小腸手太陽之脈所生病者耳聾面黃云云其四取大腸經云大腸手陽明之脈所生病者目黃口苦云云其五取膀胱經云膀胱足太陽之脈所生病者目黃淚出雲云以上五法並視盛虛寒熱陷下取之黑疸黃疸久久變為黑疸身黃額黑或身面俱黃是也若身不黃口面黑於章門主之針灸經云神門亦治疸仲酒疸下之久久變為黑疸目青面黑心中如啖蒜虀狀大便正黑皮膚爪之不仁其脈浮弱雖黑微黃故知之黃家日晡時發熱而反惡寒此為女勞得之膀胱急少腹滿一身盡黃額上黑足下熱因作黑疸其腹脹如水狀大便黑或時溏此女勞之病非水也腹滿者難治硝石散主之硝石礬石燒各等分上為細末勻和以大麥面粥調服方寸匕日三服病隨大小便下小便去黃大便去黑是其候也聖治黑疸多死宜急治用土瓜根一斤搗碎絞汁六合頓服當有黃水隨小便出更服之面痝然浮腫脊痛不能正立其色炲黑多汗惡風者屬風治見諸風門
