body:
  text: 卷之二十九腎膀胱部耳聾保夫耳者以竅言之水也以聲言之金也以經言之手足少陽俱會其中也有從內不能聽者主也有從外不能入者經也有若蟬鳴者若鐘鳴者有若火熇熇狀者各隨經見之其間虛實不可不察也假令耳聾者何謂治肺肺主聲鼻塞者肺也何謂治心心主臭如推此法皆從受氣於始腎受氣於巳心受氣於亥肝受氣於申肺受氣於寅脾受氣於四季此治法皆生長之道也羅經曰精脫者則耳聾夫腎為足少陰之經乃藏精而氣通於耳耳者宗脈之所聚也若精氣調和則腎臟強盛耳聞五音若勞傷氣血兼受風邪損於腎臟而精脫者則耳聾也然五臟六腑十二經脈有絡於耳者其陰陽經氣有相併時並則藏氣逆名之曰厥厥氣相搏入於耳之脈則令聾其腎病精脫耳聾者其候頰顴色黑手少陽之脈動則氣厥逆而耳聾者其候耳內渾渾焞焞也手太陽厥而耳聾者其候聾而耳內氣滿也宜以燒腎散主之保命集云耳以竅言之腎水也經云腎主耳左臟為腎左竅為耳又云腎氣通於耳腎和則耳能聞五音矣又云精脫者耳聾故羅謙甫以精脫耳聾之候為顴頰色黑也燒腎散治耳聾寶鑑方無巴戟磁石一兩煅醋焠七次附子一兩炮去皮臍巴戟一兩川椒一兩去目及閉口者微炒去汗上為散每服用豬腎一枚去筋膜細切蔥白韭白各一錢入散藥一錢鹽花一字和勻用濕紙裹於煻灰火內煨熟空心細嚼酒解薄粥下之十日效衍義云磁石益腎氣腎虛而聾者用之嚴蓯蓉丸治腎虛耳聾或風邪入於經絡耳內虛鳴肉蓯蓉酒浸切焙山茱萸去核石龍芮石菖蒲菟絲子酒浸蒸焙羌活去蘆鹿茸去毛酒蒸焙石斛去根磁石煅醋焠水飛過附子炮去皮臍各一兩全蠍去毒七個麝香一字旋入上為末煉蜜丸桐子大每服一百丸空心鹽酒鹽湯任下聖治腎氣虛損耳聾用鹿腎一對去脂膜切於豉汁中入粳米二合和煮粥入五味如法調和空腹食之作羹及酒並得本地黃湯治腎熱聽事不真方見後風熱條上方用地黃磁石為君補腎虛有熱之劑也垣藏氣法時論云肺虛則少氣不能報息耳聾嗌乾注云肺之絡會於耳中故聾此說非也蓋氣虛必寒盛則氣血俱澀滯而不行也耳者宗氣也肺氣不行故聾也無蠟彈丸治耳虛聾白茯苓二兩山藥炒三兩杏仁炒一兩半去皮尖上三味研為末和勻用黃蠟一兩熔和為丸如彈子大鹽湯嚼下有人止以黃蠟細嚼點好建茶送下亦效山藥茯苓杏仁皆入於太陽山藥大補陰氣惟杏仁利氣乃補中有通也少氣嗌乾者門冬人參五味湯嚼下經云肝虛則目䀮䀮無所見耳無所聞善恐治法用四物湯加防風羌活柴胡菖蒲茯神等分煎湯服二十餘帖卻用杜壬姜蠍散開之本草云肝虛則生薑補之是也世治耳聾九節菖蒲去須切小塊十兩蒼朮十兩水合浸於瓦罐中七日取出去蒼朮單用菖蒲曬乾於糯米甑上蒸熟曬乾為末糯米飲調食後臨臥服效丹大病後耳聾須用四物降火陰虛火動耳聾者亦如之氣逆耳聾有三肝與手太陽少陽也經云肝氣逆則頭痛耳聾不聰頰腫又云太陽所謂浮為聾者皆在氣也羅謙甫云手太陽氣厥而耳聾者其候聾而耳內氣滿也手少陽氣厥而耳聾者其候耳內渾渾焞焞此皆氣逆而聾也治法宜四物湯吞龍薈丸降火及復元通氣散調氣是也丹耳聾必用四物龍薈養陰復元通氣散治氣澀耳聾方見腹癰丹耳聾有濕痰者檳榔神芎丸下之大黃黃芩各二兩牽牛滑石各四兩加檳榔滴水丸每服十丸每次加十丸白湯下耳聾皆屬於熱少陽厥陰熱多宜開痰散風熱通聖散滾痰丸之類耳因郁聾以通聖散內加大黃酒煨再用酒炒三次後入諸藥通用酒炒羅犀角散治風毒壅熱胸心痰滯兩耳虛聾頭重目眩神效犀角屑甘菊花前胡去蘆枳殼麩炒去穰菖蒲羌活澤瀉木通生地各半兩麥門冬二兩去心甘草一錢炙上為散每服三錢水煎食後溫服茯神散治上焦風熱耳忽聾鳴四肢滿急昏悶不利茯神一兩羌活柴胡蔓荊子薏苡仁防風去蘆菖蒲五味子黃耆各半兩甘草一分炙麥門冬一兩去心薄荷三錢上十二味為末每服三錢入生薑三片煎至五分食後溫服本治男子二十歲因瘡毒後腎經熱右耳聽事不真每心中拂意則轉覺重虛鳴疼痛地黃湯生地一兩半枳殼羌活桑白皮一兩磁石搗碎水淘三二十次去盡赤汗為度二兩甘草防風黃芩木通各半兩上為粗末每服四錢用水煎去渣日二三服不拘時候無姜蠍散治耳聾因腎虛所致十年內一服愈出杜壬方乾蠍四十九個去繭洗焙去風熱生薑切片如蠍大四十九片開痰上二味銀石器內炒至干為細末向晚勿食夜臥酒調作一服至二更以來徐徐儘量飲五更耳中聞百十攢笙響便自此有聞一法五更濃煎蔥白湯一盞服先二日服黑錫丹效又蠍先用糯米半升同炒又用姜四十九片放蠍上同炒去米姜不用千治耳聾酒三升漬牡荊子二升碎之浸七日去渣任性服盡雖三十年亦瘥素南方赤色入通於心開竅於耳藏精於心金匱真言論治腎虛寒煨腎散蓯蓉丸並見虛實條運氣耳聾有四一曰濕邪傷腎三焦聾經云太陰在泉濕淫所勝民病耳聾渾渾焞焞治以苦熱是也二曰燥邪傷肝聾經云歲余太過燥氣流行肝木受邪民病耳聾無所聞是也三曰火邪傷肺聾經云歲火太過炎暑流行肺金受邪民病耳聾是也四曰風火炎擾於上聾經云少陽司天之政風熱參布雲物沸騰民病聾瞑三之氣炎暑至民病熱中聾瞑治以寒劑是也本治耳聾用鼠膽一個滴入耳中三次立效勝治耳聾立效以乾地龍入鹽貯在蔥尾內為水點之千治耳聾以綿裹蛇膏塞耳中神效世治耳聾久不聞者緊磁石如豆大穿山甲燒存性為末一字上用新綿裹了塞於所患耳內口中銜少生鐵覺耳內如風雨聲即愈甘草甘遂各半寸綿裹包插入耳內又將甘草嚼之即通妙羅通神丹治耳聾阿魏巴豆仁七個安息香桑白皮各錢半硃砂五分大蒜蓖麻子仁各七個上為細末入二仁與蒜同搗爛為丸如棗核大每用一丸綿裹內耳如微痛則出世治耳聾久不效者大蒜一瓣一頭挖一坑子用巴豆一粒去皮膜慢火炮去極熱入在蒜內用新綿裹定塞耳中不過三次效治耳聾蓖麻子五十粒去皮棗子一個同搗丸如棗核大更入小兒乳汁和每用一丸綿裹塞耳中覺熱為度一日一換千治耳聾用骨碎補削作細條火炮乘熱塞耳本草云骨碎補破血治折傷有奇效外治耳聾以杏仁七個去皮拍碎三分以綿裹於中著顆鹽如小豆許以器盛於飯甄中蒸之候飯熟取出於患人側臥將一裹捻油汁滴入耳中久之又以一裹依前法捻滴之世又方用雄貓尿滴入耳中左滴左右滴右如貓不能放尿用姜擦其齒即有針灸耳聾有五法其一取手足少陽手陽明經云耳聾取手小指次指爪甲上與肉交者先取手後取足又云三焦手少陽之脈是動則病耳聾渾渾焞焞視盛虛熱寒陷下調之也又云聾而不痛者取足少陽聾而痛者取手陽明又云耳聾刺手陽明不已刺其通脈出耳前者其二取手陽明絡經云手陽明之別名曰偏歷去腕三寸別入太陰實則齲聾取之所別也又云邪客手陽明之絡令人耳聾時不聞者刺手大指次指爪甲上去端如韭葉各一痏立聞不已刺中指爪甲上與肉交者立聞其不時聞者不可刺也左刺右右刺左其三取手太陽經云手太陽之脈所生病者耳聾目黃頰腫視盛虛熱寒陷下調之也又云耳聾無聞取耳中是也其四取肝經云肝虛則目䀮䀮無所見耳無所聞善恐取其經厥陰少陽氣逆則頭痛耳聾不聰頰腫取血者是也其五取肺經云肺虛則少氣不能報息耳聾嗌乾取其經太陰足太陽之外厥陰內血者是也耳有膿不可刺經云耳痛不可刺者耳中有膿若有干膜耵聹耳無聞也竹治耳聾用蒼朮一塊長七分將一頭削尖一頭截平將尖頭插耳內於平頭上安箸頭大艾炷灸之聾輕者七壯重者十四壯如覺耳內有熱氣者效玉耳聾耳鳴或疼或癢或停耳聽會在耳珠前陷中口銜尺方可下針按入半寸瀉八吸翳風針入半寸瀉七吸合谷三里瀉摘又法翳風在耳後陷後按之引耳中令病人先以錢二十四文口咬側臥取之針透口令病人閉口搖頭其怒氣從耳出聽會法如前世又法中渚臨泣甲耳聾兩顳顬痛中渚主之耳焞焞渾渾無所聞外關主之頭重頷痛引耳中噥噥嘈嘈和窌主之聾耳中癲溲癲溲者若風狀聽會主之耳聾填填如無聞噥噥嘈嘈若蟬鳴聽宮主之聾翳風及會宗下空主之耳聾嘈嘈無所聞天容主之聾耳中不通合谷主之耳聾無聞天窗主之脈病若耳聾脈反浮大而澀者死千金翼云脈大者生沉逆細者難治少陽終者耳聾百節盡縱目系絕全文見診生死暴聾羅夫卒耳聾者由腎氣虛為風邪所乘搏於經絡隨其血脈上入耳正氣與邪氣相搏故令卒聾也暴聾皆是厥逆之氣經云暴厥而聾偏塞閉不通內氣暴薄也又云少陽之厥暴聾是也羅蒲黃膏治卒耳聾細辛蒲黃各二分曲末杏仁湯浸去皮尖雙仁各三分上為末研杏仁如膏和捻如棗核大綿裹塞耳中日一易以瘥為度又方龍腦膏龍腦半分研椒目半兩搗末杏仁一分湯浸去皮上件搗研合勻綿裹棗核大塞耳中日二易世蜀椒巴豆菖蒲松脂以蠟溶為筒子納耳中抽腎虛氣耳中如風水之鳴或如打鐘鼓之聲卒暴聾一日一易神效治耳暴聾雄黃一錢巴豆一個去殼上研細用蔥涎和作一錠子紙卷定塞耳中丹治耳暴聾凌霄花葉杵自然汁滴耳中瘥斗門云本草凌霄活閉血淤血丹溪云補陰甚捷靈暴聾氣蒙耳目不明取天牖寒熱病篇甲卒氣聾四瀆主之耳鳴與耳聾相參用之丹馮宮人左耳鳴此勞得之法當補陰而鎮墜之黃耆人參一兩當歸陳皮茯苓七分升麻五分酒柏三錢防風二錢半甘草一錢半芍藥酒製分十帖食前熱服飲了去眠一覺耳中哄哄然是無陰者上陰虛耳鳴經云液脫者腦髓消脛酸耳數鳴是也羅治腎虛耳鳴夜間睡著如打戰鼓覺耳內風吹更四肢抽掣痛黃耆丸黃耆去蘆一兩白蒺藜炒瓦擦搗細羌活去蘆各半兩黑附子大者一個羯羊腎一對焙乾上細末酒糊丸桐子大每服三四十丸空心食前煨蔥鹽湯下素太陽所謂耳鳴者陽氣萬物盛上而躍故耳鳴也脈解篇丹耳鳴因酒過者用大劑通聖散加枳殼柴胡大黃甘草南星桔梗青皮荊芥如不愈用四物湯耳聾必龍薈丸食後服氣實人檳榔神芎丸下之神芎丸方見前虛實法垣柴胡聰耳湯治耳中盯聹耳鳴耳聾柴胡三錢連翹四錢甘草一錢炙虻蟲三個去翅足水蛭炒五分各另研麝香少許另研歸身人參各一錢上除虻蟲蛭麝另研外用酒水煎熟去渣方下三末再上火煎一二沸稍熱食後服運氣耳鳴皆屬風火經云厥陰司天風行太虛雲物搖動目轉耳鳴三之氣天政布風乃時舉民病耳鳴又云厥陰之脈耳鳴頭眩又云少陽所至為耳鳴治以涼寒是也丹耳鳴無晝夜用烏頭燒灰菖蒲等分末之包裹綿塞耳中立效楊氏產乳千治耳鳴如流水聲耳癢及風聲不治久則成聾用生烏頭一味掘得乘濕削如棗核大塞耳中日夜一易不過三日愈肘治耳中常鳴生地截塞耳數易之以瘥為度靈黃帝曰人之耳中鳴者何氣使然岐伯曰耳者宗脈之所聚也故胃中空則宗脈虛虛則下溜脈有所竭者故耳鳴補客主人手大指爪甲上與肉交者也口問篇灸刺耳鳴補法有三此其一也又經云上氣不足耳為之苦鳴補足外踝下留之者二也又云腦為髓之海其輸上在百會下在風府髓海不足則腦轉耳鳴審守其輸調其虛實者也取法有二經云耳鳴取耳前動脈者一也又云耳鳴取手中指爪甲上左取右右取左先取手後取足者二也取謂視虛實調之也劫刺有一經云手太陽之筋其病肩髀引頸而痛耳中鳴其痛轉筋者治在燔針劫刺之以知為度以痛為輸者是也世耳虛鳴腎俞太谿甲耳痛聾鳴上關主之刺不可深耳聾鳴下關及陽谿關衝掖門陽谷主之耳聾鳴頸頷痛耳門主之耳鳴無聞肩貞及完骨主之耳中生風耳鳴耳聾時不聞商陽主之耳鳴百會及頷厭顱息天窗大凌偏歷前谷後谿主之心脈微澀為耳鳴癲疾全文見治虛實法耳腫痛丹金尚五郎耳腫痛黃水出而臭桔梗麻黃羌活大黃酒炒二錢木通甘草黃芩一錢半上分三帖熱服耳濕腫痛用涼膈散加酒炒大黃黃芩酒浸防風荊芥羌活服之更以腦多麝少濕加枯礬吹入耳中嚴犀角飲子治風熱上壅兩耳聾閉門外腫痛及膿水流出犀角鎊菖蒲木通玄參赤芍赤小豆甘菊花去梗各一兩甘草半兩炙上㕮咀每服四錢用水二盞生薑五片煎八分溫服不拘時無解熱飲子治氣虛熱壅耳內聾閉徹痛膿血流出赤芍白芍各半兩當歸甘草炙大黃蒸木鱉子上為銼散每服四錢水一盞煎七分食後臨臥服詳此方乃清涼飲子加木鱉也運氣耳痛皆屬熱經云少陽之勝耳痛治以辛寒是也羅菖蒲挺子治耳中痛菖蒲一兩附子炮去皮臍半兩上為細末每用不以多少油調滴耳內效一法用醋丸如杏仁大綿裹置耳中日三易一法搗菖蒲自然汁灌耳神效又方治耳痛用食鹽不以多少炒熱用棗面蒸熟青花布包定枕之立效如神世又用油胡桃肉為末狗膽汁和為丸如桐子大綿裹安耳中痛立止肘療耳內卒腫痛出膿水不止方礬石燒灰加麝香以筆管吹耳內日三四度停耳羅耳者宗脈之所聚腎氣之所通足少陰之經也若勞傷氣血熱風乘虛入於其經邪隨血氣至耳熱氣聚則生膿汁故謂之停耳也紅綿散治停耳出膿白礬二錢胭脂二字上研勻先用綿杖子纏去耳中膿及黃水盡即用別綿杖子引藥入耳中令到底摻之即干如壯盛之人積熱上攻耳中出膿水不瘥用無憂散送雄黃丸瀉三四五行瘥一方單用白礬灰吹入耳中日三次立效松花散治停耳膿水不絕宜用此方白礬燒灰半兩麻勃木香松脂花胭脂各一分上搗羅為末每用時先以綿子淨拭後用藥吹入耳內效白連散治停耳出膿汁白礬枯烏賊骨黃連去須龍骨各一兩上搗羅為末以綿裹如棗核大塞耳中日三易之無麝香散治停耳耳底膿出桑螵蛸慢火炙存性一個麝香一字另研上為末研令勻每用半字糝耳如有膿先用綿杖子捻干一法用麝香少黃丹多研勻入耳立效世治停耳膿出不止用五倍焙乾一兩及全蠍燒灰存性三錢為末摻耳中丹耳爛用貝母研末乾摻之羅禹餘糧丸治停耳有膿水塞耳余禹糧一兩燒醋焠七次烏賊魚骨釜底墨伏龍肝附子一枚去皮生用上件搗羅為末以綿裹如皂角子大納耳中日再易之如不瘥者內有蟲也世塞耳丹治氣道壅塞兩耳聾聵石菖蒲一寸巴豆一粒去皮全蠍一枚為末蔥涎和如棗核大綿裹塞耳中治耳熱出汁滑石爛石膏天花粉防風各一兩上用腦子少許同研為末摻耳中世立效散治停耳膿不止陳橘皮燈上燒灰為末麝香少許二味和勻每用少許先用綿拭耳中膿淨卻上藥又方杏仁泥治耳中病或有水出杏仁炒令黑為末蔥涎搜和如棗核大綿包塞耳蟲入耳肘治蟲入耳用椒末一錢醋半盞浸良久少少滴耳中蟲自出千金方世治蟲入耳不出桃葉搗爛塞耳蟲自出無治百蟲入耳用麻油灌之即效山諸般惡蟲入耳搗韭汁灌之本治諸蟲及蝨等入耳用白膠香一味燒煙燻入耳令耳孔內暖蟲自出妙羅治蟻入耳以大菲搗汁灌耳中又方以鯪鯉甲燒灰為末以水調濾過滴入耳中即出又方蜈蚣及蟻入耳用豬脂一指大炙令香安耳邊即出治蜈蚣入耳用炙豬肉掩兩耳即出本治飛蟲入耳用好酸米醋一味滴入耳內蟲必出不出即死曾有一人被焦蟲入耳其蟲口硬如鐵但身軟用此藥滴之立死而出羅治飛蛾入耳以鵝管極氣吸之出或擊銅器於耳邊即出本治蜒蚰入耳用半夏生為末麻油調塗耳門外蟲聞香即出羅治蜒蚰入耳方用濕生蟲研如泥攤紙上捻成紙條安耳內自出又方用蝸牛蟲去殼研爛滴水五七點再研勻灌耳內自出無活者尋乾者研亦可山蜒蚰及諸般蟲入耳麻油灌入或用生蔥汁生薑汁亦可食蜒蚰入耳以羊乳灌入即成水海蜒蚰入耳以牛酪灌耳中須臾出如入腹即飲酪二升自消為水千治耳中有物不出以細麻繩剪令頭散蘸好膠入耳中著物上黏之徐徐引出經治水入耳以薄荷汁點立效骨腎主骨在體為骨在藏為腎又云腎之合骨也其榮發也又云少陰者冬脈也伏行而濡骨髓者也一身骨度之長短見陰陽表裡條素髓空在腦後三分在顱際銳骨之下王注云是謂風府通腦中也一在斷基下王注云當頤下骨陷中容豆許一在項後中復骨下王注云喑門穴也一在脊骨上空在風府上王注云上謂腦戶穴也脊骨下空在尻骨下空林億云長強在脊骶端正在尻骨下數髓空在面俠鼻王注云顴髎等穴也或骨空在口下當兩肩王注云大迎穴也兩膊骨空在膊中之陽王注云近肩髃穴臂骨空在臂陽去踝四寸兩骨空之間王注云在支溝上同身寸之一寸是謂通間股骨上空在股陽出上膝四寸王注云在陰市上伏兔穴下在承捷也胻骨室在輔骨之上端王注謂犢鼻穴也股際骨空在毛中動下尻骨空在髀骨之後相去四寸王注云八髎穴也扁骨有滲理湊無髓孔易髓無空俱骨空篇王注云扁骨謂尻間扁戾骨也其骨上有滲灌文理歸腠無別髓孔也骨病忌食甘苦久立經云多食甘則骨痛而發落又云苦走骨骨病無多食苦又云久立傷骨是也骨病不屈經云手屈而不伸者病在筋伸而不屈者病在骨在骨守骨在筋守筋也牙齒痛垣夫齒者腎之標口者脾之竅諸經多有會於口者其牙齒是手足陽明之所過上斷隸於坤土乃足陽明胃之脈所貫絡也止而不動下斷嚼物動而不休手陽明大腸之脈所貫絡也手陽明惡寒飲而喜熱足陽明喜寒而惡熱故其病不一牙者腎之標亦喜寒寒者堅牢痛熱甚則齒動齦齗袒脫作痛不已故所治療不同也有惡熱而作痛者有惡寒而作痛者有惡寒又惡熱而作痛者有惡寒飲少熱飲多而作痛者有惡熱飲少寒飲多而作痛者有牙齒動搖而作痛者有齒袒而作痛者有齒斷為疳所蝕缺少血出而作痛者有齒斷腫起而作痛者有脾胃中有風邪但覺風而作痛者有牙上多為蟲所蝕其齒缺少而色變為蟲牙痛者有胃中氣少不能於寒袒露其齒作痛者有牙齒疼痛而穢臭之氣不可近者痛既不一豈可一藥而盡之哉丹牙大痛必用胡椒蓽茇能散其中浮熱監以升麻寒水石佐以辛涼薄荷荊芥細辛之類牙痛用清涼藥便痛甚者從治之蓽茇川椒薄荷荊芥細辛樟腦青鹽上為末擦牙上潔治牙寒疼露蜂房小椒去目炒各等分上為粗末煎漱禁語言垣牢牙地黃散治牙齒寒痛麻黃黃連羊脛骨灰各一錢升麻一錢半草豆蔻皮一錢二分吳茱萸一錢益智仁歸身各四分藁本二分防己生地人參熟地羌活各三分黃耆白芷各五分上為細末擦牙上先漱口淨然後用藥世治牙痛百藥不效用荔枝殼燒灰存性擦牙痛處累驗一云荔枝核亦可外治牙痛獨囊蒜煨乘熱截用頭以熨痛上轉易之亦治蟲痛丹齒痛茱萸酒煎含之食療垣馘鬼散治風熱牙惡昔劉經歷之內子年三十餘病齒痛不可忍須騎馬外行口吸涼風則痛止至家則痛復作家人以為祟祈禱於巫師而不能愈遂求治於先師問其故曰此病乃濕熱而邪也足陽明貫於上齒手陽明貫於下齒陽明多血多氣又加以膏粱之味助其濕熱故為此痛因立一方不須騎馬當令風寒之氣常生於齒間以黃連梧桐律之苦寒新薄荷葉荊芥穗之辛涼四味相合而作風寒之氣治其濕熱更以升麻之苦平引入陽明經為使牙齒骨之餘以羊脛骨灰補之為佐麝香少許入內為引用為細末擦之神妙又以調胃承氣去芒硝加黃連以治其本服之下三五行其病良愈不復作清胃湯治因服補胃熱藥致上下牙疼痛不可忍牽引頭腦滿面發熱大痛陽明之別絡入腦在本經十五絡中喜寒惡熱乃手陽明經中熱盛而作其齒喜冷惡熱地黃生三分升麻一錢牡丹皮五分歸身三分揀黃連六分不好加二分夏倍之上五味同為細末頓作一服水煎至一半去渣候冷細呷之即效丹陽明熱牙疼大黃燒灰存性香附燒存性上為末入青鹽少許無時擦之草淳于意醫齊中大夫病齲齒灸左手陽明脈苦參湯日漱三升五六日愈丹卒牙痛苦竹一莖燒一頭得汗多者揩痛處立安姚氏方經患牙痛含山豆根一片於痛處廣治牙齒疼痛取槐樹白皮一握切作一升煮去渣著鹽少許適溫寒含之日三易丹當歸龍膽散治寒熱牙痛升麻麻黃各一錢生地白芷羊脛骨灰各五分草龍膽黃連各一錢歸梢五分草豆蔻一錢上為細末擦之神效益智木律散治寒熱牙疼草豆蔻二錢二益智歸身熟地羊脛骨灰各五分木律二分升麻錢半黃連四分上細末擦之如寒牙疼不用木律草豆蔻散治寒多熱少牙齒疼痛草豆蔻一錢二黃連錢半升麻錢半細辛葉防風各二分熟地羊脛骨灰各五分歸身七分上件為細末牙痛處擦之立效散治牙齒痛不可忍及頭腦項背痛微惡寒飲大惡熱飲其脈上中下三部陽虛陰盛是五臟內盛六腑陽道脈微小小便滑數立效防風一錢升麻七分甘草炙三分細辛二分草龍膽酒洗四錢上㕮咀頓作一服水二大盞煎至一盞去渣以匙抄在口中炸痛處少時立止如多惡熱飲更加龍膽草一錢此法不定隨寒熱多少臨時加減如更惡風作痛加草豆蔻黃連各五分勿加龍膽草垣細辛散治寒邪風邪犯腦痛齒亦痛麻黃去節三錢桂枝羊脛骨灰各二錢半羌活錢半草豆蔻錢半柴胡升麻防風白芷各二分藁本蒼朮各三分歸身四分細辛少許上為細末先漱後擦之神效白芷散治大寒犯腦牙齒疼痛麻黃去節草豆蔻各一錢半黃耆桂枝各二錢半吳茱萸白芷各四分藁本三分羌活八分歸身熟地各五分升麻一錢上為細末先用水漱洗以藥擦之蠍梢散治大寒犯腦牙疼麻黃錢半去節桂枝歸身柴胡白芷各二分升麻防風藁本黃耆各三分羌活五分羊脛骨灰二錢半草豆蔻皮一錢蠍梢少許上為末用如前法垣神功丸牢牙散調胃承氣減硝加黃連諸方皆治平昔多食肉人口臭牙齒動搖欲落或血出不止乃內傷濕熱膏粱之疾也方見熱條及齒搖齦露子和澤州李繼之忽患牙痛皺眉不語欒景先曰曾記戴人云陽明經熱有餘也宜大下之乃付舟車丸七十粒服畢遇數知友留飲強飲熱酒數杯藥為鹽酒所發盡吐之吐畢而痛止李大服曰戴人神仙也不三五日又痛再服前藥百餘粒大下數行乃愈丹牙痛而腫軟石膏升麻細辛大黃白芷防風羌活連翹川椒青鹽龍膽荊芥香附各等分上為細末搽患處垣治蟲散治大寒犯腦牙齒疼痛及嗍風作痛蟲痛胃經濕熱腫痛麻黃去節羌活草豆蔻仁各五分吳茱萸八分藁本白芷各三分黃耆升麻各一錢歸身益智仁黃連各四分桂枝一分羊脛骨灰熟地各二分上細末先用溫水淨漱口搽之世獨活散治牙根腫痛川芎獨活羌活防風各半兩細辛荊芥薄荷生地各二兩上㕮咀每服二錢水一盞煎八分溫服無一婦人牙痛治療不效口頰皆腫以金沸草散大劑煎湯熏漱而愈方見舌門八味丸治虛壅牙痛浮腫方見治法腎虛條簡治牙齒腫痛用白礬一兩燒灰大露蜂房一兩微炙為散每服用二錢以水一盞半煎十餘沸乘熱炸牙冷即吐之運氣齒痛皆屬熱經云少陰在泉熱淫所勝齒痛䪼腫治以鹹寒是也世治牙齒痛用茄蒂燒灰存性為末敷痛處累驗如無茄蒂用糟茄亦可丹治牙齒痛常山大戟防風細辛荊芥枇杷葉何首烏薄荷蔥根鬚川椒上煎湯漱之極效竹追風散治諸般牙痛貫眾鶴蝨荊芥各等分上㕮咀每用二錢加川椒五十粒水一盞煎七分去渣熱漱吐去藥立效千治牙痛以蒼耳子五升水一斗煎五升熱含之疼即吐吐後復含不過三劑瘥莖葉亦得牙痛用胡荽子濃煎湯漱之丹齒痛省藤打碎含之咽津本草木部有省藤治齒疼世治牙齒疼痛蟾酥用銀硃摻和為丸如蘿蔔子大每用一丸搽上患處便不疼至三丸吐濃涎數口全愈定痛散治牙風疼痛立效細辛生半兩白芷生川烏頭生各一兩乳香三錢上為末每少許擦牙痛處引涎吐之須臾以鹽水灌漱一方無白芷川烏有全蠍草烏家藏雄黃定痛膏治牙齒疼痛大蒜二枚細辛去苗硼硝另研各二錢雄黃另研一錢豬牙皂角四錠上為末同大蒜一處搗為膏丸如桐子大每用一丸將綿子裹藥左邊牙疼放在左耳右邊牙疼放在右耳良久痛止一丸可治數人透關散治牙疼蜈蚣頭蠍梢去毒草烏尖如麥粒大者川烏底如錢薄者各七枚雄黃如麥大七粒另研胡椒七粒上細末用紙捻子蘸醋點藥少許於火上炙乾塞兩耳內閉口少時即效世又方治牙疼用巴豆一粒煨黃熟去殼用蒜一瓣切一頭作蓋剜去中心安巴豆在內以蓋合之用綿裹隨患處左右塞耳中上塞耳三法前一法治熱疼後二法治寒疼也無牢牙散去風冷蛀齲宣露用之甚效槐枝柳枝各長四寸四十九枝皂角不蛀者七莖鹽四十文重上同入瓷瓶內黃泥固濟糠火燒一夜候冷取出研細用如常法有庵主年七十餘云祖上多患齒疼脫落得此方效數世用之齒白齊密乃良方也垣白牙散升麻一錢羊脛骨灰二錢白芷七分石膏一錢半麝香少許上為細末先用溫水漱口擦之妙麝香刷牙散麝香一分升麻一錢黃連二錢白豆蔻羊脛骨灰草豆蔻各三錢半歸身防己酒浸人參各三分生地熟地各二分沒石子三枚五倍子一個上為細末用如前法擦之神效丹刷牙方羊脛骨灰一兩升麻一錢黃連一錢上為末擦之靈齒痛不惡清飲取足陽明惡清飲取手陽明針灸齒痛不惡清飲取足陽明上齒痛亦如之經云邪客於足陽明之絡令人鼽衄上齒寒刺足中指次指爪甲上與肉交者各一痏左刺右右刺左又云邪客五臟之間繆傳引上齒齒唇寒痛視其手背脈血者去之足陽明中指爪甲上一痏手大指次指爪甲上一痏立已左取右右取左王注謂足大指次指為中指也齒痛惡清飲取手陽明下齒痛亦如之經云大腸手陽明之脈入下齒中是動則病齒痛頸腫視盛虛熱寒陷下調之又云手陽明之別名曰偏歷去腕三寸別入太陰虛則齒寒痹隔取之所別也又云齒齲刺手陽明不已刺其脈入齒中者立已是也丹治齒痛金釵股火燒針痛處即止蜀本撮牙痛牙槽呂細即太谿穴補三呼灸之治上牙痛二間一分沿皮向後三分灸之治下牙痛委中六分瀉六呼世牙痛足內踝兩尖灸治上牙龍玄在列缺上青脈中灸之治下牙又法承漿風府摘又法合谷內庭不應取崑崙治上牙甲齒痛顴窌及三間主之上齒齲兌端及耳門主之口中下齒痛惡寒䪼腫商陽主之齒齲痛惡清三間主之齒齲痛合谷主之口齒痛溫溜主之齒齲痛聽會及衝陽主之失欠下齒齲下牙痛䪼腫下關主之上齒齲痛惡寒者上關主之下齒齲則上齒痛掖門主之齒痛四瀆主之上齒齲腫目窗主之上齒齲痛惡風寒正營主之牙齒齲痛浮白及完骨主之齒牙不可嚼齦腫角孫主之上齒牙齲疼陽谷主之齒齲痛少海主之撮風牙疼太淵一分灸七壯靈齲齒痛按其陽之來有過者獨熱在左左熱在右右熱在上上熱在下下熱論疾診尺篇齒搖齦露垣羌活散治風寒濕犯腦痛項筋急牙齒動搖內齦袒脫疼痛麻黃去根節白芷各三錢羌活根一錢半防風根三錢藁本歸身各三分細辛根柴胡根升麻蒼朮各五分羊脛骨灰二錢半草豆蔻桂枝各一錢上細末先用溫水漱口淨搽之其痛立止黃連散治冬天寒時分風寒濕腦痛項筋急牙齒動搖疼痛麻黃根草豆蔻皮龍膽草酒洗各二錢生地二錢羌活根二錢半防風根二分藁本三分羊脛骨灰歸身熟地各六分細辛根少許升麻根黃連各一錢上極細末依前搽之千治牙齒根欲動脫生地細銼綿裹著齒上咂之日三四並咽汁效錢甘露飲子治牙腫齒搖方見小兒痘腫咽痛垣牢牙散治牙根肉綻有根牙疳腫痛動搖欲落牙齒不長牙黃口臭宜用之妙夏月亦可升麻四兩羌活一兩羊脛骨灰二兩龍膽草一兩半酒洗上為極細末以紗羅子羅細羊脛骨灰末和勻臨臥擦牙妙羅牢牙散擦牙茯苓石膏龍骨各一兩寒水石白芷各半兩細辛三錢石燕大者一小者二上為細末早晚刷牙垣麝香散治熱多寒少牙露根肉斷脫血出齒動欲落大痛妨食忤寒少忤熱多麻黃歸身熟地生地人參酒防己各三分升麻一錢草豆蔻黃連各錢半益智仁二分半麝香少許羊脛骨灰二錢上細末依前法搽之垣還少丹常服牢牙齒方見治虛實法本治牙齒動搖髭髯黃赤一服妙生薑半斤生地一斤各洗淨研取自然汁渣留用上用不蛀皂角十莖刮去黑皮並筋將前藥汁蘸皂角慢火炙令黃以藥汁盡為度並前藥同入瓷罐用火煅留性為末牙齒動搖用藥揩齒齦上髭黃用銀器盛藥末三錢湯調將藥汁蘸須臨睡時用次早已黑三夜三次用之其黑如漆妙甚妙甚此方常用屢驗竹蒺藜散治打動牙齒蒺藜根燒灰貼動牙即牢千治牙齦宣露每旦以鹽水擦牙後用熱湯含漱百遍不過五日齒即牢密治齒齦宣露蚯蚓糞水和為泥燒令極赤研如粉臘月豬脂和敷上日三敷瘥本取蛀牙本分法硼砂成塊者硃砂各一錢硇砂二錢川烏七個砒二錢色黃白有光星者以上各為末蟾酥七個附子尖十四個各為末上和勻五月五日合者佳點藥於牙根上良久用手指揩下次用後敷藥防風荊芥各五文乳香十五文上為末揩牙落處並用些子塞牙落孔子內此二方余見一道人貨藥取牙一日常貨三兩貫余厚賂始傳得妙世落牙方用馬肉十兩信巴豆各等分銼馬肉片以信巴末拌勻用石器盛候出蟲焙乾研末於牙疼處出些血點上隨落妙本取牙落不犯手草烏蓽茇各兩半川椒細辛各三兩上細末每少許揩患處自落牙蛀牙不生海牙齒等齲數年不愈當作陽明蓄血治之用桃仁承氣湯為細末煉蜜丸桐子大服之好飲過者多得此疾屢服有效桃仁承氣湯方見傷寒丹治蛀牙痛納藜蘆細末於孔中勿咽津神妙又方用江子香油燈上燒過填入穴內世治蛀牙腫痛用不蛀皂角一錠去皮子卻用巴豆每於皂子處安巴豆一粒用鹽泥固濟燒灰研細末用剜耳子抄少許填入蛀牙內外療齒齲痛有蟲取雄雀糞以綿裹塞孔內日一二次易之良丹䘌齒用蘆薈四分炒研細先用鹽揩淨齒敷少許一方用蘆薈白膠香塞蛀孔內蛀牙取松脂銳如錐者塞孔中少頃蟲出脂上本治牙疼鶴蝨細辛白芷干茄各等分上件為末每用少許揩痛處如有蛀孔用飯丸藥末塞孔中立效世治牙蛀疼用鶴蝨枝插患處立愈羅麝香散麝香一錢銅綠五分白芨白礬各二錢半白蘞三錢半上細末每少許貼牙患處丹蟲蝕牙根肉腐用棘針燒取瀝敷十餘次又研雄黃末敷愈梅治牙蟲痛不可忍嚼薰陸香咽其汁立瘥即乳香之類丹又方治牙蟲腐爛用棘針二百枚用水二升煮一升含之妙張治齲齒以郁李根白皮水煮濃汁含之冷即易之效山蛀牙溫米醋漱出蟲自愈又風蛀牙疼用香白芷細辛煎漱之又絲瓜兒燒灰存性擦之竹蟲牙疼天仙子不以多少燒煙用竹筒抵牙引煙燻之其蟲即死永不再發世治蛀牙用小瓦片置油拌韭子燒煙閣在水碗上恰用漏斗覆之以蛀牙受漏斗口中煙其牙內蟲如針者皆落水碗中累效羅救苦散治一切牙痛及塞風蛀牙疼草烏川烏桂花良薑紅豆胡椒蓽茇細辛各五分石膏官桂各三錢上細末先漱淨裡外乾摻之出涎立愈蓽茇散治風蛀牙疼蓽茇二錢蠍梢高良薑各一分草烏尖五分上為細末每用半字先含水一口應痛處鼻內搐上吐了水用指黏藥少許擦牙疼痛處兼治偏正頭疼經治大人小兒多年牙齒不生用黑豆三十粒牛糞火內燒令煙盡細研入麝香少許一處研勻先以針挑不生牙處令血出用藥少許揩不得見風忌酸鹹物發黃白腎主發經云腎之合血也其榮發者是也海張天師草還丹此藥久服輕身隨風而去如列子之乘虛也若發白者從根而黑如未白者永不白有不信者將藥拌飯與白貓吃一月即黑地骨皮生地石菖蒲牛膝遠志去心菟絲子酒浸三宿炒黃上冬等分為細末煉蜜丸如桐子大每服三十丸空心溫酒送下鹽湯亦得修制忌女人雞犬見此上少陰下厥陰藥也垣青絲散補虛牢牙黑髭鬚香白芷白茯苓各五錢母丁香細辛當歸川芎甘草甘松各三錢升麻旱蓮草地骨皮生地熟地青鹽破故紙各二錢寒水石七錢煅香附米一兩生薑汁浸一宿炒何首烏一兩麝香五分高茶末上為細末庚日為始背東面西擦牙早不見日夜不見燈刷畢咽藥余津潤髭一月白者頓黑忌食蘿蔔本治髭發黃黑方見牙動搖雜門方條草李卿換白髮方云刮老生薑皮一大升於鐺中以文武火煎之不得令過沸其鐺惟得多油膩者尤佳更不須洗刮便以姜皮置鐺中密封固濟勿令通氣令一精細人守之地色未分時便須煎之緩緩不得令火急如其人稍疲即換人看火一伏時即成置於瓷缽中研極細李方雖曰一伏時若火候勻至日西即藥成也使時以小簪腳蘸取如麻子大先於白髮下點藥訖然後拔之再點以手指熟撚之令入肉第四日當有黑者生神效梅治年少發白拔去白者以白蜜塗毛孔中即生黑髮不生取桐子搗汁塗上必生黑者千療發黃熊脂塗髮梳之散頭入床底伏地一食頃即出便盡黑不一升脂驗發落不生垣脈弦氣弱皮毛枯槁發脫落黃耆建中湯主之發脫落及臍下痛四君子湯加熟地丹胡氏年十七八歲發脫不留一莖飲食起居如常脈微弦而澀輕重皆同予曰此厚味成熱濕痰在膈間又日多吃梅酸味收濕熱之痰隨上升之氣至於頭蒸熏髮根之血漸成枯槁遂一時盡脫遂處以補血升散之藥用防風通聖散去芒硝惟大黃三度酒炒兼以四物湯酒製合和作小劑煎以灰湯入水頻與之兩月餘後診其脈濕熱漸解停藥淡味調養又二年髮長如初而愈竹滋榮散長養髮發落最宜生薑焙乾人參一兩上細末每用生薑一塊切斷蘸藥末於發落處擦之二日一次用世三聖膏治髭發脫落能令再生黑附子蔓荊子柏子仁各半兩上為末烏雞脂和勻搗研干置瓦合內封固百日取出塗在髭發脫處三五日即生自然牢壯不脫本甜瓜葉治人無發搗汁塗之即生千治發落不生令長麻子一升熬令黑壓油以敷頭髮上妙聖治生眉毛用七月烏麻花陰乾為末生烏麻油浸每夜敷之烏麻即秋麻是也二陰素北方黑色入通於腎開竅於二陰金匱真言論前陰縮縱等疾屬肝經病見肝部後陰痔脫肛等疾屬大腸腑病見肺部欠嚏腎主欠嚏經云腎為欠為嚏是也運氣欠嚏有三一曰寒經云太陽司天寒氣下臨心氣上從寒清時舉鼽嚏喜悲數欠是也二曰火經云少陽司天之政三之氣炎暑至民病嚏欠是也三曰濕鬱其火經云陽明司天之政初之氣陰始凝民病中熱嚏欠是也欠伸二陽一陰發病主驚駭背痛善噫善欠全文見診病傳變王注云氣鬱於胃故欠生焉運氣欠伸皆屬風經云厥陰在泉風淫所勝病善伸數欠治以辛是也仲中寒家善欠靈黃帝曰人之欠者何氣使然岐伯曰衛氣晝日行於陽夜半則行於陰陰者主夜夜者臥陽者主上陰者主下故陰氣積於下陽氣未盡陽引而上陰引而下陰陽相引故數欠陽氣盡陰氣盛則目瞑陰氣盡陽氣盛則寤矣瀉足少陰補足太陽口問篇針灸欠伸有二法此篇經文取足少陰太陽是其一也其二取胃經云胃足陽明之脈是動則病振寒善伸數欠視盛虛實寒陷下調之也嚏河嚏鼻中因癢而氣噴作於聲也鼻為肺竅癢為火化心火邪熱干於陽明發於鼻而癢則嚏也或故以物擾之癢而嚏者擾癢屬火故也或視日而嚏者由目為五臟神華太陽真火晃曜於目心神躁亂而熱發於上則鼻中癢而嚏也運氣嚏有三一曰熱火經云少陰司天之政熱病生於上民病血溢鼽嚏又云少陰司天熱氣下臨肺氣上從病嚏鼽衄又云少陰之復燠熱內作煩躁鼽嚏又云少陽所至為鼽嚏又云少陽司天火氣下臨肺氣上從咳嚏鼽衄治以諸寒是也二曰金不及火乘之經曰金不及曰從革從革之紀其病嚏咳鼽衄從火化者是也三曰燥金經云陽明所至為鼽嚏是也靈黃帝曰人之嚏者何氣使然岐伯曰陽氣和利滿於心出於鼻故為嚏補足太陽榮眉本一曰眉上也口問篇眉本恐攢竹穴撮腠理不密噴嚏不已風門一分沿皮向後一寸半補一呼仲其人清涕出發熱色和者善嚏身體拘急運氣拘急屬寒及寒濕風濕經云諸寒收引皆屬於腎又云太陰司天之政民病寒厥拘急初之氣風濕相搏民病經絡拘強關節不利治法蓋小續命湯仲景三黃湯之類是也夢遺丹精滑專主濕熱用黃柏知母牡蠣蛤粉夢遺專主熱與帶下同治法本治夢遺有數種下元虛憊精不禁者宜服茴香丸年壯氣盛久節淫欲經絡壅滯者宜服清心丸有情欲淫動經謂所願不得名曰白淫宜良方茯苓散正如瓶中煎湯氣盛盈溢者如瓶中沸湯而溢欲動心邪者如瓶傾側而出憊虛不禁者如瓶中有罅而漏不可一概用藥也又有一說經曰腎氣閉即精泄素問云腎者作強之官伎巧出焉又曰腎藏精蓋腎能攝精氣以生育人倫者也或育或散皆主於腎今腎氣衰則一身之精氣無所管攝故妄行而出不時也豬苓丸一方正為此設內內傷氣血不能固守夢遺者當補以八物湯加減吞樗根皮丸垣面色白而不澤難經云肺太過則令人面白善嚏悲愁不樂欲哭面色白為寒脈沉厥急按之空虛色白脫氣又為脫血又為脫津又為脫液又為脫精又為脫神是元神漂浮乎外將離體之象也其脈按之不鼓猶為亡陽況虛空者乎病乃陰寒極矣若脈或盛大而澀猶為中寒之病也況虛空者乎宜峻補之巴戟丸治肝腎俱虛收斂精氣補其元陽充悅肌膚進美飲食五味子川巴戟去心肉蓯蓉酒洗菟絲子炒人參白朮熟地骨碎補去毛茴香牡蠣白龍骨覆盆子益智仁各等分上為末煉蜜丸桐子大每服三十丸空心食前米飲下日二三服補精止汗虛甚者用八物湯吞之本治遺精夢泄關鎖不固金鎖丹亦名茴香丸舶上茴香葫蘆巴破故紙白龍骨各一兩木香一兩半胡桃三十個研羊腎膏三對取開用鹽半兩擦炙熟研如膏上五味為末下二味同研成膏和酒浸蒸餅杵熟丸如桐子大每服三五十丸空心鹽湯下羅固真丹晚蠶蛾一兩肉蓯蓉白茯苓益智各一兩龍骨上用鹿角膠酒浸化開丸桐子大每服三粒空心溫酒下乾物壓之補真玉露丸治陽虛陰盛精脫淫濼脛酸一方無茯苓白茯苓去皮白龍骨水飛韭子酒浸炒菟絲子酒浸各等分火日修合上為末煉蜜丸如桐子大每服五十丸溫酒下鹽湯亦得空心食前服少時以美膳壓之梅師方止用龍骨四分韭子五合為散空心酒調服方寸匕治失精暫睡即泄聖惠方止用韭子微炒為散食前酒下二錢匕治夢中泄精外臺方用新韭子二升十月霜後枯者好酒八合浸一宿明日日色好令童子向南搗一萬杵平旦溫酒服方寸匕治虛勞尿精再服立瘥此龍骨韭子為泄精要藥也梅治精滑久不固牡蠣不拘多少砂鍋內醋淬七次細末醋糊丸桐子大每五十丸空心鹽湯下上龍骨牡蠣治夢遺例王元珪虛而泄精脈弦大累與加減八物湯吞河間秘真丸及珍珠粉丸其泄不止後用五倍子一兩茯苓二兩為丸服之良愈此則五倍子澀脫之功敏於龍骨蛤粉也河秘真丸治白淫小便不止精氣不固及有餘瀝或夢寐陰人通泄龍骨一兩另研大訶子皮五個硃砂一兩研細一分為衣縮砂半兩上為末麵糊丸綠豆大每服一二十丸空心溫酒下熟水亦得不可多服太秘本治虛損補精水壯筋骨益心智安魂魄令人悅澤駐顏輕身延年益壽閉固天癸八仙丹伏火硃砂真磁石赤石脂代赭石石中黃禹餘糧乳香沒藥各一兩上為末研勻極細糯米濃飲丸桐子大或豆大每服一粒空心鹽湯下有人年幾七旬夢漏羸弱氣惙惙然虛損得此方服之頓爾強壯精氣閉固飲食如故予常制自服良驗經云思想無窮所願不得意淫於外入房太甚宗筋弛縱發為白淫夢遺等症先賢治法有五上法用辰砂磁石龍骨之類鎮墜神之浮游是其一也其二思想結成痰飲迷於心竅而遺者許學士用豬苓丸之類導利其痰是也方見治郁條其三思想傷陰者潔古珍珠粉丸用蛤粉黃柏降火補陰是也方見熱條其四思想傷陽者謙甫鹿茸蓯蓉菟絲子等補陽是也方見白濁條其五陰陽俱虛者丹溪治一形瘦人便濁夢遺作心虛治用珍珠粉丸定志丸服之定志丸者遠志菖蒲茯苓人參是也年少壯節欲遺泄者宜清心丸珍珠粉丸清心方見熱條潔珍珠粉丸治白淫夢遺泄精及滑出不收黃柏皮一斤新瓦上炒赤真蛤粉一斤上為細末滴水丸如桐子大每服一百丸空心溫酒送下法曰陽盛乘陰故精泄也黃柏降火蛤粉咸而補腎陰丹精滑不禁方用海蛤粉青黛香附黃柏知母之類海大鳳髓丹治心火狂陽太盛補腎水真陰虛損心有所欲速於感動應之於腎疾於施泄此方固真元降心火益腎水大有神效黃柏炒二兩縮砂一兩甘草半兩半夏炒木豬苓茯苓紅蓮芯益智仁各三錢五分上為丸每服五七十丸若只用黃柏甘草縮砂三味為正鳳髓丹只用黃柏甘草二味為鳳髓丹古人云瀉心者非也乃瀉相火益腎水之劑本治經絡熱夢遺心忪恍惚膈熱清心丸用好黃柏皮一兩研為細末生腦子一錢同研勻煉蜜為丸如桐子大每服十丸至十五丸濃煎麥門冬湯吞下大智禪師云夢遺不可全作虛冷亦有經絡熱而得之也嘗治一男子至夜脊心熱夢遺用珍珠粉丸豬苓丸遺止終服紫雪脊熱始除又一男子脈洪腰熱遺精用沉香和中丸下之導赤散治其火而愈於此知身有熱而遺者皆熱遺也仲夫失精家少腹弦急陰頭寒目眩發落脈極虛芤遲為清穀亡血失精脈得諸芤動微緊男子失精女子夢交桂枝龍骨牡蠣湯主之桂枝芍藥生薑各三兩甘草二兩大棗十二枚龍骨煅牡蠣煅各三兩上七味水七升煮三升分溫三服天雄散方天雄炮龍骨各三兩白朮八兩桂枝六兩上四味杵為散酒服半錢匕日三服不止稍增之愚壯年得夢遺症每四十五日必一遺累用鳳髓丹河間秘真丸雖少效終不除根後改用菖蒲遠志韭子桑螵蛸益智酸棗仁牡蠣龍骨鎖陽等劑為丸服之良愈又一中年男子夢遺以珍珠粉丸等藥與服了無一效亦以遠志菖蒲等劑服之隨手而愈本豬苓丸用半夏一兩破如豆大豬苓末二兩先將一半炒半夏色黃不令焦出火毒取半夏為末糊丸桐子大候乾更用前豬苓末一半同炒微裂入砂瓶內養之空心溫酒鹽湯下三四十丸常服於申未間溫酒下此古方也今盛行於時而人多莫測其用半夏有利性而豬苓導水蓋腎閉導氣使通之意也予醫囊中嘗貯此藥緩急與人三五服皆隨手而驗林監丞庇民亦數服而愈詳此治夢遺方屬鬱滯者居大半庸醫不知其鬱但用龍骨牡蠣等澀劑固脫殊不知愈澀愈郁其病反甚常治一壯年男子夢遺白濁少腹有氣衝上每日腰熱卯作酉涼腰熱作則手足冷前陰無氣腰熱退則前陰氣耕手足溫又旦多下氣暮多噫時振隔一旬二旬必遺脈旦弦滑而大午洪大予知其有鬱滯也先用沉香和中丸大下之次用加減八物湯吞滋腎丸百粒若稍與蛤粉等澀藥則遺與濁反甚或一夜二遺遂改用導赤散大劑煎湯服之遺湯皆止漸安又一中年男子皆夢遺醫或與澀藥反甚連遺數夜愚先與神芎丸大下之卻制此豬苓丸服之皆得痊安又丹溪先生治鎮守萬戶蕭伯善便濁精滑不禁百藥不致與試倒倉法而安於此見夢遺屬鬱滯者多矣世治精滑不禁用局方青州白丸子用辰砂為衣服之神效海烏金散治夢泄精滑不禁九肋鱉甲每服二字用清酒半盞童便半小盞陳蔥白七八寸同煎七分和渣日兩服本草云鱉甲主心腹癥瘕堅積垣治男子夢與鬼交心神恍惚者刮鹿角屑三指撮日二服酒下食療同本草云鹿角屑逐惡氣惡血玉遺精白濁夜夢鬼交心俞一分沿皮向外一寸半先補後瀉灸不宜多白環俞一寸半瀉六吸補一呼撮又法白環俞一寸半灸五十壯與中極相平腎俞中極灸隨年壯集又法腎俞心俞膏肓關元三陰不已取下穴東腰脊冷溺多白濁失精脾募三七壯曲泉灸虛勞失精陰縮莖中痛大赫三七壯中封灸華遺精五臟虛竭東陽同曲骨端四七壯在陰橫骨中央曲如月中央是也東溺血精出列缺臥針五分甲丈夫失精中極主之男子精溢陰上縮大赫主之男子精溢脛酸不能久立然谷主之男子精不足太衝主之白濁丹便濁大概皆是濕痰流注宜燥中宮之濕用二陳湯加蒼朮白朮燥去其濕肥白人必多濕痰以二陳去其濕熱胃弱者兼用人參以柴胡升麻升其胃中之氣胃中濁氣下流必用二陳加蒼朮白朮柴胡升麻一婦人年近六十形肥奉養膏粱飲食肥美中焦不清積為濕氣流入膀胱下注白濁白濁即濕痰也用二陳去痰蒼朮白朮去濕補胃加升麻柴胡升胃中之清氣服四帖後濁減大半卻覺胸滿因柴胡升麻升動胃氣痰阻滿悶而然間用二陳湯加炒曲白朮香附以泄其滿若素無痰者雖升動胃氣不滿也兼用青黛樗皮蛤粉炒黃柏炒乾薑滑石為末炒神麯糊丸服之凡便濁服藥必兼服加減珠粉丸蛤粉青黛此二味主胃中濁氣下流降入膀胱樗皮末大燥濕熱滑石黃柏乾薑炒褐色味苦斂肺氣下降使陰血生乾薑鹽制上為末炒神麯為丸又方黃柏炒焦黃柏生蛤粉各一兩神麯半兩上為末滴水丸服白濁者濕熱傷氣久下不止此係火不守也知母黃柏炒附子各等分水丸服赤濁者濕熱傷血於二陳湯中加白芍藥仍用炒柏蛤粉椿皮滑石青黛以神麯為丸一方加乾薑炮褐色固而不走羅白淫諸症痿論曰思想無窮所願不得意淫於外入房太甚奈筋弛縱發為筋痿及為白淫夫腎臟天一以慳為事志意內治則精全而澀若思想外淫房室太甚則固有淫泆不守輒隨溲溺而下也然本於筋痿者以宗筋弛縱也內補鹿茸丸治勞傷思想陰陽氣虛益精止白淫鹿茸酥炙菟絲子酒浸蒺藜炒白蒺藜肉蓯蓉紫菀蛇床子酒浸黃耆桑螵蛸陽起石附子炮官桂各等分上為細末煉蜜為丸如桐子大每服二十丸食前溫酒送下茯苓丸治心氣不足思慮太過腎經虛損其陽不固溺有餘瀝小便白濁夢寐頻泄菟絲子酒浸五兩石蓮去殼三兩白茯苓去皮二兩上為細末酒糊為丸如桐子大每服三十丸鹽湯下常服鎮益心神補虛養血清小便金箔丸治下焦虛小便白淫夜多異夢遺泄蠶蛾破故紙炒韭子炒牛膝酒浸肉蓯蓉龍骨山茱萸桑螵蛸菟絲子酒浸各一兩上為細末煉蜜為丸如桐子大每服三十丸溫酒空心下王瓜散治小便自利如泔色此腎虛也王瓜根桂心各一兩白石脂菟絲子酒浸牡蠣鹽泥燒赤候冷去泥各二兩上為末每服二錢煎大麥粥湯調下日三服食前楊氏萆薢分清飲治白濁凝面如油光彩不定凝腳如糊益智仁川萆薢石菖蒲烏藥各等分上㕮咀每服四錢水一盞入鹽一捻煎七分食前溫服一方加茯苓甘草恐恐與驚悸相似實非驚悸也張子和云驚者為自不知故也恐者為自知也蓋驚者聞響即驚恐者自知如人將捕之狀及不能獨自坐臥必須人為伴侶方不恐懼或夜必用燈照無燈燭亦恐懼者是也臟腑恐有四一曰腎經云在臟為腎在志為恐又云精氣並於腎則恐是也條見虛條及針灸條二曰肝膽經云肝藏血血不足則恐戴人曰膽者敢也驚怕則膽傷矣蓋肝膽實則怒而勇敢肝膽虛則善怒而不敢也余見同上三曰胃經云胃為恐是也四曰心經云心怵惕思慮則傷神傷神則恐懼自失者是也丹周本心年六十歲形氣俱實因大恐正月間染病心不自安如人將捕之狀夜臥亦不安兩耳後亦見火光炎上食飲雖進而不知味口乾而不欲食以人參白朮當歸身為君陳皮為佐加鹽炒黃柏炙玄參各少許煎服自愈月餘而安經云恐傷腎丹溪用鹽炒黃柏炙玄參引參歸等入補腎足少陰絡也本治膽虛常多畏恐不能獨臥如人捕之狀頭目不利人參散人參枳殼五味子桂心甘菊花茯神山茱萸枸杞子各三分柏子仁熟地各一兩上細末每二錢溫酒調服治膽虛冷目眩頭疼心神恐畏不能獨處胸中滿悶茯神散茯神一兩遠志防風細辛白朮前胡人參桂心熟地甘菊花各三分枳殼半兩上為末每服三錢水一盞姜三片煎六分溫服不拘老幼皆宜服治膽虛目暗喉痛數唾眼目眩冒五色所障夢見被人爭訟恐懼面色變者補膽防風湯防風一錢人參七分細辛芎藭甘草茯苓獨活前胡各八分上粗末每四大錢水盞半棗二枚煎八分去渣食前服運氣善恐皆屬肝木虛經云木不及曰委和委和之紀其病淫動注恐是也內經針灸善恐有三其一取腎經曰腎足少陰之脈是動病氣不足則善恐心惕惕如人將捕之虛則補之寒則留之是也其二取肝經云肝虛則目䀮䀮無所見耳無所聞善恐如人將捕之取其經厥陰與少陽是也其三取膽經云膽病者善太息口苦嘔宿汁心下澹澹恐人將捕之取陰陵泉又云善嘔嘔有苦善太息心中憺憺恐人將捕之邪在膽逆在胃膽液泄則口苦胃氣逆則嘔苦故曰嘔膽取三里以下胃氣逆則少陰血絡以閉膽逆卻調其虛實以去其邪是也甲心如懸哀而亂善恐嗌內腫心惕惕恐如人將捕之多涎出喘少氣吸吸不足以息然谷主之澹澹而善驚恐心悲內關主之千金作曲澤
