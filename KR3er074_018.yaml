body:
  text: 卷之十八心小腸部癰疽腫瘍者癰疽未見膿而腫者也潰瘍者癰疽之膿已潰出者也丹溪云腫瘍內外皆壅宜以托裡表散為主設欲行大黃者宜審其虛實之原瘍潰內外皆虛宜以補接為主設欲行香散者宜防其虛虛之失由是言之則癰疽之腫時與潰時不同今分腫瘍潰瘍為二門腫瘍癰疽方腫未見膿者也潔瘡瘍者火之屬須分內外若其脈沉實當先疏其內以絶其原也其脈浮大當先托裡恐邪氣入內也有內外之中者邪氣至甚遏絶經絡故發癰腫經曰榮氣不從逆於肉理乃生癰腫此因失托裡及失疏通又失和榮衛也治瘡之大要須明托裡疏通行榮衛三法托裡者治其外之內疏通治其內之外行榮衛者治其中也內之外者其脈沉實發熱煩躁外無焮赤痛甚邪氣深於內也故先疏通臟腑以絶其原外之內者其脈浮數焮腫在外形證外顯恐邪氣極而內行故先托裡以防其內也內外之中者外無焮惡之氣內亦臟腑宣通知其在經當和榮衛也用此三法之後雖未瘥必無變證亦可使邪氣峻減而易痊也垣瘡疽之發其受之有內外之別治之有寒溫之異受之外者法當托裡以溫劑反用寒藥則是皮毛始受之邪引入骨髓受之內者法當疏利以寒劑反用溫劑托裡則是骨髓之病上徹皮毛表裡通潰共為一瘡助邪為毒苦楚百倍輕則危殆重則死矣豫聞潔古云瘡瘍之生也表裡不同或攻或發少有差舛變證隨能殺人甚於傷寒也針灸施治各隨其宜所用之藥又當明入五臟君臣是其法也潔內疏黃連湯治嘔啘心逆發熱而煩脈沉而實腫硬木悶而皮肉不變色根系深大病遠在內臟腑祕澀當急疏利之黃連芍藥當歸檳榔木香黃芩梔子薄荷桔梗甘草各一兩連翹二兩上除檳榔木香為末外並銼每服一兩水一盞半煎一盞先吃一二服次每服加大黃一錢再加二錢以利為度如有熱證止服黃連湯大便祕澀加大黃如無熱證止用復煎散時時呷之如此內外皆通榮衛和調則經絡自不遏絶矣內托復煎散治腫焮於外根盤不深形證在表其脈浮痛在皮內恐邪氣盛則必侵於內急須內托以救其里地骨皮黃耆防風各二兩芍藥黃芩白朮茯苓人參甘草當歸防己各一兩桂五錢上㕮咀先將蒼朮一斤用水五升煎至三升去蒼朮滓入前藥十二味再煎至三四盞絞取清汁作三四服終日服之又煎蒼朮滓為湯去滓再依前煎十二味藥滓服之此除濕散鬱熱使胃氣和平如或未已再作半料服之若大便祕及煩熱少服黃連湯如微利煩熱已退卻服復煎散半料如此使榮衛俱行邪氣不能內侵也當歸黃耆湯治瘡瘍臟腑已行而痛不可忍者當歸黃耆地黃川芎地骨皮芍藥各半錢上㕮咀水煎服如發熱加黃芩如煩躁不能睡臥者加梔子如嘔則是濕氣侵胃倍加白朮海奪命丹治惡瘡癰疽發背大黃為末置砂器中以水攪八十一遍飛過一兩牡蠣一兩生薑一兩沒藥乳香各一錢上為粗末轉作丸子一錢用好酒一升木炭火熬一沸分二碗盛之夜露一宿早晨去滓空心服治發背方蒼耳炒黃擦其刺再炒深黃不見風研細末每服五錢匕好熱酒調食前臨臥服一則用大黃牡蠣一則用蒼耳知有內外之別也前用奪命丹二藥表裡不同何以然乃膏粱之變脈沉而滑地之濕氣感則害人皮肉筋脈脈浮而滑所以有泄之發之之異也丹癰疽因積毒在臟腑非一朝夕今發於外宜以標本為治當先助氣壯胃使根本堅固而以行經活血為佐參以經絡時令使毒氣外發此正仲景解表用麻黃桂枝之意施治之早可以內消此乃內托之本意也垣通父家翟粳於尻臀上足太陽經生癰堅硬腫痛大作左右尺脈俱緊按之無力羌活黃柏酒洗各二錢防風藁本連翹各一錢肉桂七分甘草炙蒼朮陳皮各五分當歸一錢黃耆一錢半上作一服酒二大盞水一大盞煎至一盞去渣熱服空心以夾被蓋覆其癰使藥行罷去之一服愈丹王姑丈七十餘患項疽脈實而稍大此因憂悶而生太陽經治之歸頭二錢黃柏一錢半酒黃耆羌活地黃酒黃芩酒炒桔梗一錢黃連酒炒連翹防風甘草生人參陳皮防己澤瀉五分白水煎服垣淨腋湯治皮膚癢腋下瘡背上瘡耳聾耳鳴麻黃一錢桂枝二錢草蔻一錢當歸梢七分紅花少許羌活二錢防風一錢柴胡一錢升麻半分連翹桔梗五分甘草五分生地五分黃芩酒一錢蒼朮一錢上銼如麻豆大都作一服水二大盞煎至一盞去渣稍熱服尹老家素貧寒形志皆苦於手陽明經分出癰第四日忽腫幼有㿗疝其臂外皆腫痛先腫在陽明左右寸皆短中得之俱弦按之洪緩有力此癰得自八風之變以脈斷之邪氣在表然其症大小便如故飲食如常腹中和口知味知不在裡也不惡風寒止熱躁脈不浮知不在表也表裡既和知邪止在經脈之中凝滯為癰出身半以上風從生受之也故與卻寒邪和經脈中氣血使無凝滯也白芷升麻湯白芷七分升麻桔梗各五分甘草炙黃芩生歸梢生地各一錢酒黃芩黃耆連翹各二錢中桂少紅花少上水酒各一盞同煎至一盞臨臥熱服一服愈此症雖曰經脈之中然得之自八風之變其藥制度皆發表之意此方黃芩重用未免過之宜酌量婦人兩乳間出黑頭瘡瘡頂陷下作黑眼子其脈弦洪按之細小升麻連翹葛根各一錢半肉桂三分黃耆歸身甘草炙各一錢黍黏子五分黃柏二錢上作一服水一盞酒半盞煎至一盞二服愈羅汗之則瘡已丁巳年委豫從軍回住曹州有趙同知舅經歷病頭面赤腫耳前後尤甚疼痛不可忍發熱惡寒牙關緊急涕唾稠黏飲食難下不得安臥一瘍醫腫上砭刺四五百餘針腫赤不減其痛益甚不知所由然豫往診視其脈浮緊按之洪緩此寒覆皮毛郁遏經絡熱不得升聚而赤腫經云天寒地凍則水冰人氣在中皮膚致腠理閉汗不出血氣強內堅澀當是之時善行水者不能注冰善穿地者不能鑿凍善用針者亦不能取四厥必待天溫冰釋凍解而水可行地可穿人脈亦猶是也又曰冬月閉藏水冰地坼故用藥多而少針石也宜以苦溫之劑溫經散寒則已所謂寒致腠理以苦發之以辛散之也宜以托裡溫經湯麻黃苦溫發之者也防風辛溫散之者也升麻苦平葛根甘平解肌出汗專治陽明經中之邪故以為臣血流而不行者則痛以香白芷歸身辛溫以破血散滯濕熱則腫蒼朮苦甘溫體輕浮力雄壯能泄皮膚腠間濕熱人參甘草甘溫白芍藥酸微寒調中益氣使托其里也故以為佐各銼如麻豆大同稱水煮餌之以薄衣覆其手以厚被覆其身且臥於暖處則經血溫腠理開寒乃散陽氣伸大汗出腫減八九再服去麻黃防風加連翹黍黏子痛腫悉去經言汗出則瘡已信哉托裡溫經湯治寒覆皮毛郁遏經絡不得伸越熱伏榮中聚而赤腫痛不可忍惡寒發熱或相引肢體疼痛麻黃去根節白芷當歸各二錢防風去蘆葛根各三錢升麻四錢甘草炙白芍藥各一錢半人參蒼朮各一錢上銼如麻豆大每服稱一兩水二盞先煮麻黃令沸熟去沫再下余藥同煎至一盞去渣大溫服訖臥於暖處即以綿衣覆之得汗而散垣蒲津王世祥年七十感寒濕地氣二月間得附骨癰於左腿外側足少陽之分少侵足陽明分闊六七寸長一小尺堅硬漫瘇不辨肉色皮澤深以指按至骨大痛又行步作痛與藥下咽疼痛立止二日後柔軟而腫消矣柴胡黍黏子各錢半連翹肉桂各一錢黃耆當歸梢各二錢黃柏甘草炙各五分升麻七分作一帖好酒一盞半煎至一盞大溫空心食消盡服之少時以早膳壓之使不令大熱上攻犯上中二焦也賈德茂男十歲四月天氣大熱於左足大腿近膝股內足厥陰肝之經少侵足太陰脾之經分出附骨疽不辨肉色漫腫皮澤木硬痛勢甚大其脈在三部細弦按之洪緩略有力黃耆二錢柴胡梢一錢羌活五分連翹一錢二分肉桂三分土瓜根三分生地一錢黃柏酒洗二分當歸尾七錢半上作一服酒一盞水三盞煎至一盞空心熱服一服愈垣內托榮衛湯治風濕熱鬱其手足少陽致血脈凝逆使榮衛周身元氣消弱其風熱滯於下其面色必赫赤而腫微黯色風木之性上衝顏必忿色其人多怒其瘡之色亦赫赤腫硬微帶黯色其瘡之形勢亦奮然高起結硬而作痛其脈洪緩而弦宜發其汗而通其榮衛則邪氣去矣黃耆桂枝各五錢防風羌活黃芩當歸各一錢半連翹柴胡各二錢甘草炙人參各一錢蒼朮紅花各三錢上㕮咀只作一服水酒各一大盞同煎至一盞溫服上九方皆東垣及羅謙甫丹溪隨癰疽所發分野制之也其方皆以發表為先不過一二服而愈如癰疽發在太陽經分野必用防風羌活陽明經分野必用香白芷升麻少陽經分野必用柴胡太陰經分野必用芍藥升麻少陰經分野必用獨活厥陰經分野必用青皮柴胡皆以桂佐之身半以下者必用酒水多熟煎之空心服使藥下行身半以上者必用酒水少帶生煎之臨臥服使藥上行脈細小無力必於本經藥中加辛熱劑服洪大有力必於本經藥中加苦寒劑隨症加減活潑潑地其效如神真良醫也涓縮毒金粉散治但疼痛不急脹乾葛甘草鬱金川芎栝蔞根白芷上等分並生為末每一錢溫酒入蜜調下不拘時此藥大散五臟積毒凝滯日三服垣羌活當歸湯治腦疽黃芩酒炒黃連酒炒歸身酒浸甘草炙各一兩羌活黃柏酒浸連翹各五錢澤瀉獨活藁本各三錢防風梔子仁各五分上㕮咀分作四服水一小碗先浸一時許入酒一匙煎至八分去渣大溫服食後日二服和渣計六服三日服盡去渣清藥調下後檳榔散檳榔散用檳榔為細末將羌活當歸湯調下黃柏當歸湯治背疽黃柏炒七錢黃芩炒當歸身炒甘草炙各一兩黃連炒防風各五錢澤瀉山梔知母地骨皮各三錢連翹五分上㕮咀分作四服每服水一小碗浸一時許入酒一匙煎至八分去渣調下檳榔散大溫服與前藥同丹呂孺人惡寒發熱腹上有小疽此血少有熱與此藥白朮川芎三錢赤芍藥連翹二錢半陳皮防風黃芩二錢木通一錢半甘草五分分五帖水煎服丹治好酒婦人用酒煨大黃取汗法見膏粱條精要十宣散人參當歸黃耆各二兩川芎防風厚朴桔梗官桂甘草白芷各一兩上為細末每服二錢加至六錢止熱酒調下日數服以多為妙不飲酒者用木香濃煎湯下然不若酒力之勝也許學士云此方得於都下異人濟苦者不可計數陳無擇謂此藥在第四節服者非也早服中病者必消散羅千金托裡散治發背疔瘡方見疔瘡涓托毒散治癰疽初起高腫發痛不定喘息氣粗附子一枚炮去皮尖當歸麻黃甘草官桂川芎羌活石葦龍膽草上九味等分為末每服二錢水一大盞薑三片鹽少許同煎丹一男子年五十餘形實色黑背生紅腫近胛骨下痛甚脈數而洪緊食亦嘔正冬月與麻黃桂枝湯加酒黃柏生附子栝蔞子甘草節羌活青皮人參黃耆半夏生薑六帖而消此非內托之意歟精五香湯木香沉香麝香乳香丁香粉草人參黃耆犀角上每服四錢水二盞煎至一盞不拘時五香連翹湯乳香甘草木香沉香各三分丁香半兩連翹射干升麻黃耆木通桑寄生如無升麻倍之獨活各三分麝香一錢上㕮咀每服三錢水一盞煎至七分溫服大便祕者加大黃內托散一名護心散一日至三日之內宜連進十數服真緑豆粉一兩明乳香半兩慢火於銀石器中炒手指攪使干急傾出扇冷研極細上研令勻每服二錢至三錢濃煎甘草湯調下時時細呷要藥常在胸膈間若毒衝心有嘔逆之證大宜服此如有寒而嘔逆不宜服此當用辛熱丹溪云內托散緑豆解丹毒又治石毒味甘入陽明胃性寒能補為君乳香去惡腫入少陰性溫善竄為佐甘草性緩解五金八石及百藥毒為使此方專為服丹石而發疽者設若不因丹石而發疽恐非必用之劑又云內托散性涼治嘔有降火之理仲排膿湯方甘草二兩桔梗三兩生薑一兩大棗十枚上四味以水三升煮取一升溫服五合日再服本托裡排膿生犀散皂角刺不拘多少粗大黑紫者上置瓶中鹽泥固濟炭火燒過存性放冷出研為細末每服一錢薄酒微溫調下暑月陳米飲下潔保安湯治瘡托裡或已成者速潰栝蔞新者一個去皮火焙沒藥通明者一錢研金銀花甘草生薑各半兩上為細末用好無灰酒三升於銀石器內煎至一升分作三盞三次飲盡病微者只一服如服托裡藥不能發散又作瘡者用此精柞木飲子干柞木葉四兩半乾荷葉中心蒂干萱草根甘草節地榆各一兩上細銼每服半兩水二碗煎一碗分作二服早晚各一服未成者自消潰者自干其荷蒂去惡血萱根下水解毒利胸膈柞木有芒刺能驅逐地榆主下焦血病輕小證候或可倚仗精車螯散車螯一兩煅通赤本草云車螯解酒毒生甘草輕粉五分上一處為細末每服四錢濃煎栝蔞酒調下五更服轉下惡物為度未知再用效在五香之上本草云車螯大蛤也一名蜃又方車螯四個黃泥固濟火煅赤出火毒一宿栝蔞一個去皮瓦上炒香燈心三十莖甘草節五分上為粗末作一服酒二盞煎一盞去渣入蜜一大匙和勻每用酒八分盞車螯末二錢膩粉少許調勻空心溫服取下惡物黃涎為效丹云車螯散一以輕粉為佐一以燈心為佐其散腫消毒下積安詳穩重輕小症候可以倚仗治背瘡荊芥穗木鱉子仁大黃歸頭甘草節除荊芥穗為君外余各等分酒水各一碗煎至七分空心向東飲即下積與粥便止若結成者用川楝子七枚燒灰酒下次與十四枚又次與二十一枚三帖後雖結亦小之陶氏千漏蘆湯治癰疽丹痃惡肉時行熱毒赤腫漏蘆連翹黃芩白蘞枳殼升麻粉草麻黃朴硝各一兩大黃一兩半上除硝外每服二錢水一盞薑三片薄荷三葉同煎溫服取利為度精漏蘆湯生黃耆連翹沉香漏蘆各一兩粉草半兩大黃一兩上為細末每服二錢薑棗湯調下內消升麻湯治血氣壯實若患癰疽大小便不通升麻大黃各二兩黃芩一兩半枳實麩炒當歸芍藥甘草炙各一兩上㕮咀水煎食前羅內消丸治瘡腫初生及瘰癧結核熱毒鬱滯服之內消薄荷葉皂角不蛀者水煮至軟各半斤煎膏牽牛半斤取頭末青皮陳皮各一兩沉香半兩廣朮炮京三稜炮各三錢上為末入牽牛頭末用煎膏和丸如緑豆大每服三十丸煎連翹湯送下食後孫真人單煮大黃湯脈實沉而數膏粱食肉之輩大腑祕者詳審用之錦紋大黃酒洗去皮上一味銼如麻豆大水煮服精神仙追毒丸能解一切毒如被狐貍毒鼠惡菌河魨毒疫死牛馬肉毒蛇犬惡蟲所傷又治癰疽發背及療魚臍瘡人多不識喚作癰疽致命殺人者及治諸風癰疥赤腫瘤等五倍子捶破洗焙三兩山茨菰去皮淨焙一兩麝香二錢研入千金子即續隨子去殼研去油取霜一兩山豆根一兩紅牙大戟去蘆洗淨焙乾一兩半全蠍硃砂雄黃各一兩上除千金子麝香外七味為細末卻入研藥另勻用糯米飲為丸分四十丸每服一丸生薑薄荷汁井花水研服昔有一女子久年病瘵磨一丸服之一時吐下小蟲千餘條半月即無事丹溪云神仙追毒丸其五倍子消毒殺蟲解風為君山茨菰千金子大戟皆驅逐走泄之劑佐以麝香升散若用之固里以發表實非所宜苟能灼見臟腑有積毒異蟲深痼而體不虛者亦是快藥古人兵曰義兵刑曰祥刑戒勿輕於用也靈帝曰癰疽何以別之岐伯曰榮衛稽留於經脈之中則血泣而不行不行則衛氣從之而不通壅遏而不得行故熱大熱不止熱勝則肉腐肉腐則為膿然不能陷骨髓不為焦枯五臟不為傷故命曰癰劉涓子云癰之痛只在皮膚之上又云癰發如火焚茅初如黍米大三兩日如掌面大五七日如碗麵大即易治如腫冷發渴發逆治之難愈帝曰何謂疽岐伯曰熱氣淳盛下陷肌膚筋髓枯內連五臟血氣竭當其癰下筋骨良肉皆無餘故命曰疽劉涓子云疽發或如小癤觸則徹心痛四邊微起如橘皮孔色紅赤不全變膿水不甚出至七八日疼悶喘急不止又云始發腫高五指忽平陷者此內攻之候也精要云生疽處不熱不痛低陷者此為內發難治必死疽者上之皮夭以堅上如牛領之皮癰者其皮上薄以澤此其候也癰疽篇精要云小按乃痛者病勢淺大按乃痛者病勢深此辨癰疽之法也劉涓子云癰疽有三等毒氣浮淺屬腑猶傷寒陽症毒氣沉深屬臟猶傷寒陰症毒氣猛烈而行經絡或淺或深無定五臟六腑皆受五毒難為調理唯宜急切猶傷寒兩感於寒難治於癰發諸處不問虛實高腫起盛光澤疼痛只在皮膚之上熱急脹滿或有癢疼別無惡候初用溫藥平氣次用排膿發穴治癰所謂平氣者乃犀角飲之類其方用犀角連翹漏蘆甘草當歸肉桂皆發表之藥也所謂發穴者乃棘針丈類用皂角刺為君甘草川芎乳香為佐使亦托裡之藥也然不若潔古東垣諸方發表托裡為穩當疽發諸處不拘大小精要謂廣一尺二尺曰疽者非惟起在背廣一尺二尺三尺皮厚而紫黑高腫不常內疼如錐刺攻擊滿悶應四肢重疼前心亦痛余處發猶可唯虛處及近筋骨處若膿毒未潰即傷爛筋骨肉損為疽者屬五臟毒氣深沉多氣伏硬堅實而不宜緩慢治之須內實五臟外透皮膚令軟勻和即膿透宜用內托實臟氣之藥排膿勻氣乃可不比癰之毒氣浮淺也毋作一類治之凡一切瘡腫始覺患起高腫五七日忽平陷者此是內攻之候也急以內托散及內補湯藥補填臟腑令實最怕透膜膜穿十無一生矣癰之邪淺其稽留壅遏獨在經脈之中而專攻於外故初發時自表便發熱患處便如柁如盆高腫而痛甚者縱欲下陷緣正氣內固不肯受故或便祕或發渴發逆以拒之是以骨髓終不焦枯五臟終不傷也疽之邪深其稽留壅遏內連五臟而不專攻於外故身體或無熱患處或不腫痛甚者聲嘶氣脫眼黑眼小十指腫黑如黑多死也治之之法癰之初發當以潔古法為主表者散之里者下之火以灸之藥以敷之膿未成者必消膿已成者速潰也疽之初發當以涓子法為主補填臟腑令實勿令下陷之邪蔓延外以火灸引邪透出使有穴歸著而不亂則可轉死回生變凶為吉今世外科不分癰疽一例宣熱拔毒外以五香耗其氣內以大黃竭其血終不能自悟其藥之非惜哉治癰疽初覺腫結未成可以消散毒飲子黃耆二兩甘草炙天羅生山藥炒鬼腰帶葉半兩生竹籬陰濕石岸絡石而生者好絡木者無用其藤柔細兩葉相對形生三角上為粗末每服三錢水一盞煎至七分入酒三盞同煎一二沸去渣溫服精神效托裡散治癰疽發背腸癰奶癰無名腫毒焮赤疼痛憎寒發熱不問老幼虛弱並治之黃耆去蘆忍冬藤葉各五兩當歸一兩八錢粉草炙八錢上為細末每服二錢酒一盞半煎至一盞病在上食後服在下食前服少頃再進留滓外敷保諸瘡瘍痛色變黑紫者回毒金銀花湯金銀花並梗二兩黃耆四兩甘草一兩上用酒一升重湯煮三兩時去渣溫服本黃耆散綿黃耆一兩甘草半兩皂角刺揀紅紫者銼炒黃一兩上細末每服二大錢酒一盞乳香一塊煎至七分去渣服海黃耆湯與四物相和亦名托裡湯血氣齊補也黃耆四物湯人參黃耆白朮茯苓芍藥甘草生薑當歸地黃川芎多加金銀花煎服本內固黃耆湯綿黃耆人參各半兩上細末入真生龍腦一錢研細生藕汁和丸如緑豆大每服三十丸溫熱水下加至四十丸日三服丹五八嬸年六十歲背上瘡脈洪大數午後惡寒發熱食少連翹黃耆生二錢人參二錢陳皮茯苓五分砂仁三錢甘草炙白朮一錢分十帖煎服上方皆以黃耆為君甘草歸參為佐乃實內補虛之中兼托裡也精阿膠飲子明阿膠炒如珠粉草各一兩橘紅半兩上㕮咀分作三服再服以水一盞煎七分去渣溫服又方牛膠飲截癰疽惡瘡發險處服之使毒氣不攻於內牛膠通明者四兩用酒一碗入膠內重湯煮溶透攪勻傾出更浸酒隨意飲能飲者以醉為度此法活人甚多又方黃礬丸服過一兩以上無不取效最止疼痛不傷臟腑活人不可勝數白礬一兩黃蠟半兩上和丸如桐子大每服十丸漸加至五十丸溫酒送下如未破已消已破即合一日服百粒則有效能防毒氣內攻尤能護膜始終須服半斤瘡愈後服之尤佳治蛇咬溶化白礬乘熱滴傷處痛即止一方用明礬飛過研細以雞子二個取清調礬末稀稠如糊用無灰陳好酒放開服之膿未成者即消已成膿者從大小便出神效纍驗其功大勝黃礬丸國老膏治一切癰疽能消腫逐毒使毒不內攻其效不可具述甘草大者二斤槌碎河水浸一宿揉令漿汁濃去盡筋滓再用絹濾過銀石器內慢火熬成膏用器收之每服一二匙無灰酒或白湯亦可曾服燥藥丹劑者亦解之本事方每甘草一斤分作三服溫酒調下今云一二匙恐力少也遠志酒治一切癰疽發背癤毒惡候浸有死血陰毒在中則不痛敷之即痛有憂怒等氣積而內攻則痛不可忍敷之即不痛或蘊熱在內熱逼人手不可近敷之必清涼或氣虛血冷潰而不斂若七情內郁治之必愈遠志不以多少泔浸捶去心為末酒一盞調末三錢澄清飲之以滓敷於患處忍冬酒初發便當服此或貧乏中或居鄉僻田夫野老百發百中忍冬藤生取一把以葉入砂盆研爛入酒少許調和得所塗敷四圍中心留一口又取五兩用木槌碎不犯鐵器甘草一兩生銼上二味入砂瓶內用水二碗文武火煎至一碗入好酒一大碗煎十數沸去渣分為三服一日連夜進盡病勢重一日夜可二劑忍冬藤補血如氣虛及寒多人不宜用是故田夫野老百發百中也丹阿膠飲牛膠飲以牛皮屬金屬土補肺氣實大腸壯胃止泄黃礬丸以蠟味甘淡入大腸有補難化國老膏以甘草化毒行經遠志酒忍冬酒皆有補性歸心歸血用之頗切善用者以之配入治腫瘍之散結潰瘍之補虛亦奏捷功上丹溪實內補虛法皆以參朮歸耆又甚者獨參膏其法並見後分經條及散見潰瘍門虛實寒熱條真轉死回生之捷法也癰疽當分經絡論六陰經六陽經分布周身有多氣少血者有多血少氣者有多氣多血者不可一概論也若夫要害處近虛處怯薄處前哲已曾論及惟分經之言未聞也何則諸經惟少陽厥陰經之生癰疽理宜預防以其多氣少血也其血本少肌肉難長瘡久未合必成危證又云少陽經多氣少血與厥陰經同少陽有相火尤甚於厥陰經者其有不思本經少血遽用驅毒利藥以伐其陰分之血禍不旋踵矣請述一二成敗之迹以告來者豫族叔父平生多慮質弱神勞年近五十忽右膊外側廉上生結核身微寒熱而易怒食味頗厚脈之俱浮大弦數而重似澀豫曰此多慮而憂傷血時在初秋勿輕視之宜急補以防變證以人參一斤作膏下以竹瀝病者吝費招一外科以十宣五香散相間與服旬日後一日大風拔木病者發熱神思不佳急召豫視之核稍高大似有膿於中起一紅線延過肩後斜走繞背脊過入右脅下不痛覺肩背重而急迫食有嘔意脈同前但弦多耳急作人參膏入芎朮生薑汁飲之用人參三斤瘡潰膿干又與四物湯加參朮陳皮甘草半夏生薑百餘帖而安此等若在春令雖神仙不治也幸而在秋金之令不幸因時下暴風激起木中相火而致此自非參膏驟補何由得免此正涓子所謂補填臟腑之法也又一人腿外廉生紅腫一人脅下生紅腫皆由庸醫誤下之而死詳見後條或曰太陰經非多血少氣者乎何臀疽之生初無甚苦往往間有不救者吾子其能治之乎豫曰臀居小腹之後而又在其下此陰中之陰也其道遠其位僻雖曰多血氣運不到氣既不到血亦罕來中年以後不可生癰才有痛腫參之脈證但見虛弱便與滋補血氣無虧可保終吉若用尋常驅熱拔毒舒氣之藥虛虛之禍如指諸掌可不慎歟素帝曰諸癰腫筋攣骨痛此皆安生岐伯曰此寒氣之腫八風之變也帝曰治之奈何岐伯曰此四時之病以其勝治之愈也脈要精微論靈血脈榮衛周流不休上應星宿下應經數寒邪客之則血泣血泣則不通不通則衛氣歸之不得復反故癰腫寒氣化為熱熱勝則腐肉腐肉則為膿膿不瀉則爛筋筋爛則傷骨骨傷則髓消不當骨空不得泄瀉血枯空虛則筋骨肌肉不相榮經脈敗漏熏於五臟臟傷故死矣癰疽篇生氣通天論云勞汗當風寒薄為皶郁乃痤又云陽氣者開闔不得寒氣從之乃生大僂榮氣不從逆於肉理乃生癰腫是亦寒邪從勞汗之隙及陽氣開闔不得其理之隙久客之為癰腫也觀此數論則知癰疽之發皆得之於寒邪所客也獨運氣瘡瘍一歲老幼相似之病間有熱者不可不知詳見運氣條上經數節皆論癰疽乃因寒邪客之而發也治法則精要十宣散五香湯潔古蒼朮復煎散等發表之劑是也丹朱郎年四十餘惡寒發熱右腿內廉厥陰分生一腫毒此是冷折熱在肺經血分與此方栝蔞子黃藥子赤芍藥當歸頭條芩三錢青皮皂角刺桂枝二錢甘草節生一錢上分四帖煎取一盞入忍冬藤汁二蛤殼食前煎飲以忍冬藤渣敷腫上涓安神散治諸色瘡腫調氣順榮衛人參茯苓甘草炙枳殼去穰麩炒附子炮去皮尖白薑山藥陳皮上等分為末每服一錢水一盞生薑三片大棗一個煎至七分通口服垣膏粱之變亦是滋味過度榮氣不從逆於肉理乃生癰腫榮氣者胃氣也飲食入於胃中先輸於脾而朝於肺肺朝百脈次及皮毛先行陽道下歸五臟六腑而氣口成寸矣今富貴之人不知其節法酒肥羊雜以厚味積久太過其氣味俱厚之物乃陽中之陽不能走於空竅而先行陽道今反行陰道則濕氣大勝子令母實火乃大旺熱濕既盛必來克腎若不慎房事損其真水則水乏而濕熱之化上行其瘡必出背上及腦此為大疔之最重者若毒氣出肺或脾胃之部分毒之次也若出於他經又其次也濕熱之毒所止處無不潰爛故經言膏粱之變足生大疔受如持虛者如持虛器以受物則無不受矣治大疔之法必當瀉其榮氣以標本言之先受病為本非苦寒之劑為主為君不能除其苦楚疼痛也諸瘡瘍有痛往往多以乳香沒藥雜以芳香之藥止之必無少減之理此其誤也若使經絡流通臟腑中去其壅滯必無痛矣痛則以苦寒之劑除之無不愈者瘡瘍食肉與自殺無異法當瀉氣而反補之故也元好問飲酒太過脈候沉數九月間腦下項上出小瘡不痛不癢如白頭瘡凡四日後腦項麻木腫勢外散熱毒焮發又二日痛大作夜不得寐醫處以五香連翹湯後再邀東垣診視云膏粱之變不當投五香連翹湯已無及矣且疽已八日當先以火攻之然後用藥以火艾炷如兩核許者攻之百壯始覺痛次為處方云是足太陽膀胱之經其病逆當反治脈中得弦緊按之洪大而數又且有力必當伏其所主而先其所因其始則同其終則異必先歲氣無伐天和以時令言之可收不可汗經與病俱禁下法當結者散之咸以耎之然寒受邪而禁咸遂制黃連消毒飲治之黃連五分黃芩五分黃柏五分酒洗人參五分知母四分酒炒此以苦寒引用通經為君羌活一錢獨活五分防風五分藁本五分連翹一錢此以大辛解本經之結為臣黃耆一錢甘草炙五分此以甘溫配諸苦寒者三之一多則滋榮氣而補土當歸身一錢酒洗生地一錢酒洗此以辛溫之劑和血補血陳皮五分不去白補胃氣甘草梢五分生此以甘寒瀉腎火之邪補下焦元氣澤瀉七分滲淡導酒濕扶助秋令防己五分酒洗除膀胱留熱歸梢五分蘇木五分去惡寒桔梗一錢使諸藥不下沉為舟楫之用所用之藥用酒洗併入酒煎者用酒熱為因為使上俱作一服水三盞煎至半乾去渣入酒少許再煎食後溫服投劑之後大鼾日出乃寤瘡腫減七分精神旺飲啖漸進灸瘢漸膿出而痊服藥後不得飲水恐再作膿效遲初患三日者服之立效凡瘡皆陰中之陽陽中之陰二證而已東垣治疽陽藥七分陰藥三分名曰升陽益胃散老人宜之亦名復煎散或加沒藥乳香各一錢上東垣論膏粱肉食之變治宜苦寒不宜芳香者如解里條撮要內消升麻湯孫真人單煮大黃湯皆為富貴食肉之輩設也丹嘗治一婦人年將七十形實性急而好酒腦生疽十五日脈弦緊急且澀豫急用大黃酒煨細切酒拌炒為末又酒拌炒人參入薑煎調一錢重又兩時再與得睡而上半身汗睡覺病已此亦內托之意也仲排膿散方枳實十六枚芍藥六分桔梗二分上三味杵為散取雞子黃一枚以藥散與雞子黃相等揉和煎如薄粥溫服一升即瘥丹朱紹八官右腳腫生附骨癰吃草藥酒多生隔痰熱壅無力人參黃連茯苓一錢栝蔞子四十八粒分二帖入竹瀝熱飲保諸瘡腫已破未破焮腫者當歸散主之川芎黃耆栝蔞木香黃連各等分上為粗末水煎一兩服如痛而大便祕加大黃三錢涓凡癰疽外冷內疼者由陰氣外逼皮膚用熱物尉之大熱亦不覺者須用熱物前後尉令透隨手便用緊急潰膿毒藥使膿外出盡腫平即用生肉暖瘡和正氣藥令進飲食不倦治癰疽發背初腫時方風化石灰二兩細辛一兩上為粗末用熱醋敷患處干再敷三上其腫即消四虎散治發背初生筋脈緊急不舒附子生去皮一兩天南星泡半夏湯洗七次狼毒各半兩上四味為末熱酒調成膏攤上腫處以熟絹靨定覺患處如火燒不妨凡癰疽外熱內疼者是有客邪內有積毒欲作膿透之候治背瘡初發時小後五七日赤腫高即罨藥令內毒散減疼免牽引乳香膏乳香一兩青薄荷葉四兩洗干上研勻厚罨患處以青絹蓋之如干以新汲水潤之常令濕其熱毒自然消散如熱毒攻結可用氣毒攻結不可用貼癰毒令內消金黃散白芷白芨白蘞上等分為細末用新汲水調敷丹治陽症腫毒並金瘡大粉草銼細用竹一段刮去青兩頭留節開一小竅入草在內滿後卻用油灰塞竅從冬至日放糞缸內待立春日先一日取起豎在有風無日陰處二十一日驗兩竅好卻破竹取草為細末用水調敷世圍藥南星草烏黃柏白芨各二兩五倍子一兩炒上為末調如糊隨血圍匝如牆壁可移險處於不險處如神敷藥白蘞白芷南星白芨貝母各等分上為末水調敷外用圍藥束定內用敷藥提起制之有理藥性論甘蕉根搗敷一切癰腫上干即更敷無不瘥者梅治癰疽發背或髮乳房初起微赤不急治之即死速消方搗苧根敷之數易效濟諸瘡腫痛不可忍者以葵花根去黑皮搗爛若稠點井花水少許若不稠不須用水以紙攤如膏藥貼之立效經驗方用蜀葵敷之亦妙世又方芙蓉葉搗爛敷之立效曬乾為末水調敷亦妙發背蝸牛百個活者置淨瓶內新汲水一盞浸瓶中封閉自晚至曉其水如涎取水將真蛤粉不拘多少調之刷瘡上效丹治背癰與癤久年煙壁土黃柏等分細末生薑汁捏成膏敷之夏以茅香湯下一二錢妙經驗本治癰疽止痛拔毒七寶散乾荷葉心當中如錢片不計多少為粗末每用三匙水二盞慢火煎至一碗半放溫淋洗干以太白膏敷之太白膏寒水石飛用臘月豬脂調成膏隨瘡大小用薄紙攤貼之斂瘡內消方黃明膠一兩水半升熔消了入黃丹一兩再煮三五沸又放溫冷以雞毛掃在瘡口上如未成即塗腫處自消外凡癰不問已潰未潰者以膠一片水浸令軟隨腫大小貼當頭上開一孔若已潰合膿者當被膠急發之膿皆出盡未有膿者腫當自消矣海治發背祕法李北海云此方神授極奇祕以甘草三大兩生搗別篩末大麥面九兩於一盤中相和攪令勻取上好酥少許別捻入藥令勻百沸水搜和如餅劑方員大於瘡一分熱敷腫上以油紙隔令通風冷則換之已成者膿水自出未成者腫便內消丹隔皮取膿法治諸般腫毒驢蹄細切一兩炒蕎麥麵一兩白鹽半兩草烏四錢去皮上為末水調作餅子慢火炙黃出火毒研米醋調成膏用白紙攤貼患處毒自毛竅而出其腫自退保治瘡瘍焮腫木硬針頭散上以蟾酥乳香各一錢同研勻細以兒乳汁和如泥入磁石盒收之幹不妨每用以唾調撥少許於腫處上以膏藥貼之毒氣自消雖然有瘡亦輕濟萬應針頭丸治一切腦背疽惡毒大瘡欲死者一粒即愈麝香二錢血竭三錢如蠟者用散者不用非真輕粉三錢蟾酥三錢舌試辣者硇砂三錢片腦一錢蜈蚣一對全用上為極細末煉蜜和丸為劑如瘡有頭者用針頭挑破微有血出將藥一黍米大放挑開瘡內上用紙花周圍唾津濕貼瘡上不過時刻即愈如兩腋見無頭瘡即是暗疔即將兩手虎口內白土紋用針挑破如前法用藥封蓋忌雞鵝酒濕面一切發熱之物子和一省掾背項常有痤癤愈而復生戴人曰太陽血有餘也先令湧泄之次於委中排針出紫血病更不復作也豫男袞常喜熱火烘灼其背及兩足又食自死肉久而兩足常生癤毒愈而復生者半年餘豫以清涼飲子下之得紫黑血積於便中去者月餘其癤毒頓除是知積熱毒致癰腫者如此李世英患疽數日後根腳開大或腹疼泄瀉手足常冷脈沉微細或自汗出急用薑附之藥甚者於臍下關元著艾三五百壯待手足溫泄瀉止飲食知味方可為喜精憤郁不遂志欲之人多犯此疾無癰疽瘰癧不問虛實寒熱皆由氣鬱而成經云氣宿於經絡與血俱澀而不行壅結為癰疽不言熱之所作而後成癰者此乃因喜怒憂思有所鬱而成也遠志酒治七情內郁成癰疽方見虛實條精獨勝散治癰疽皆緣血滯氣凝而致者香附子去毛令淨以生薑汁淹一宿焙乾研極細上無時以白湯調二錢服之又云疽疾多因怒氣得之若有此疾必多怒但服香附進食寬氣自有效丹獨勝散治氣鬱血滯而諸瘡愈後常服半年尤妙此皆施於體實氣鬱之人豫見吳兄厚味氣鬱而形實性重年近六十患背疽醫與他藥皆不行惟香附末飲之甚快始終只此一味腫潰恃此以安然此等體實而又病實乃瘥千百而一見者也每思香附經不言有補惟不老湯一方乃言於老人有益用片子薑黃香附子甘草三味而以不老為名且引鐵甕先生與劉君為證夫豈無其故哉蓋於行氣中有補之之理耳天之所以為天者健而有常也因其不息所以生生無窮正如茺蔚子活血行氣有補陰之妙故名益母胎前産後所恃者氣血耳胎前無滯産後無虛以其行中有補也夏枯草治瘰癧亦然補遺謂婦人男子癰疽治法無異惟月閉血虛氣結三證有異耳愚謂婦人海滿則行月閉一證固異然婦人性情執著比之男子十倍雖有虛證宜補亦當以執著為慮向見樓氏婦早寡善飲啖形肥偉性沉毒年六十六七月間生背疽近正脊醫遂橫直裂開取血雜以五香十宣散與酒飲之月餘未嘗議其寡居之郁酒肉之毒執著之滯時令之熱卒至於平陷淹延兩三月而不救六脈不和則留為癰全文見五臟此則膏粱所變之癰也諸痛癢瘡瘍皆屬於心全文見診河間云人近火氣微熱則癢熱甚則痛附近則灼而為瘡皆心火之用也或癢痛如針輕刺者猶飛迸火星灼之然也上心火實則為熱癰心火虛則為寒癰脈肺乘肝即為癰腎移寒於肝癰腫少氣全文見診病傳變下同肝藏血肝病則血從之而榮氣逆於肉理生癰腫是也脾移寒於肝癰腫筋攣本治發背方草決明生用一升搗碎生甘草一兩亦碎水三升煮取一升溫分二服大抵血滯則生瘡肝為血之臟而決明和肝氣不損元氣也本草云決明除肝熱三陽為病發寒熱下為癰腫三陽小腸膀胱也下為癰腫獨指膀胱為病又腦疽背癰臀癰之類是也運氣癰疽有四一曰火熱助心為瘡瘍經云少陽所至為瘡疹又云少陰司天熱氣下臨肺氣上從甚則瘡瘍又云少陰司天之政初之氣寒乃始陽氣鬱炎暑將起中外瘡瘍又云少陽所至為瘡瘍又云少陽司天之政風熱參布太陰橫流寒乃時至民病寒中外發瘡瘍初之氣候乃大溫其病膚腠中瘡二之氣火反郁其病熱鬱於上瘡發於中三之氣炎暑至民病膿瘡又云太陽司天之政初之氣氣乃大溫肌腠瘡瘍此皆常化病之淺也又云少陰司天熱淫所勝甚則瘡瘍又云少陰司天客勝甚則瘡瘍又云少陰之復病痱疹瘡瘍癰疽痤痔又云火太過曰赫羲其病瘡瘍血流又云火鬱之發民病瘡瘍癰腫此是邪變病之甚也二曰寒邪傷心為瘡瘍經云太陽司天之政三之氣寒氣行民病寒反熱中癰疽注下又云太陽司天寒淫所勝血變於中發為癰瘍病本於心又云陽明司天之政四之氣寒雨降民病癰腫瘡瘍是也三曰燥邪傷肝為瘡瘍經云木不及曰委和上商與正商同其病支發癰腫瘡瘍邪傷肝也又云陽明司天燥淫所勝民病瘍瘡痤癰病本於肝是也四曰濕邪瘡瘍經云太陰司天濕氣變物甚則身後癰又云太陰之勝火氣內郁瘡瘍於中流散於外是也丹精要第一論曰凡有此病未要辨問是癰是疽是虛是實是冷是熱首先便服內托散五香連翹湯宜泄毒氣又云內托散五香連翹湯沉麝湯等諸方不冷不熱不問老幼少壯陰陽虛實多服為妙夫癰疽瘡癤臟腑陰陽有淺深虛實冷熱用藥有補瀉溫涼老幼少壯其稟受厚薄形志苦樂隨年歲而增損奈何欲以不冷不熱四五方而通治之又多服為妙此不能無疑者也學者當審經絡察病機而處治豈可仗此為通治之法丹東陽李兄年逾三十形瘦膚厚連得憂患又因作勞且過於色忽左腿外廉側上發一紅腫其大如栗一醫聞其大腑堅實與承氣湯二帖下之不效又一醫教與大黃硃砂生粉草麒麟竭又二三帖半月後召豫視之曰事去矣又一李兄四十餘面稍白神甚勞忽脅下生一紅腫如桃一人教用補劑衆笑且排於是以流氣飲十宣散雜進之旬余後召豫視之豫曰非惟不與補劑抑且多得解利氣血俱憊難矣已而果然此二者皆由不預防本經少陽少血遽猛浪用大黃攻裡而死之者也一男子年近六十形素肥初夏於左膊外廉側生一核方圓二寸余不甚痛召豫治診其脈息緩大而弱豫曰此因憂悶而生當氣升散之時須急與人參膏五六斤又看作何應病家召他外科以十宣散五六帖而瘡甚豫曰此大虛也勿以輕小視之病家不信一外科仍以十宣散進之又五六帖瘡平陷出清水而死此可為因虛而生癰疽者之例胡經歷女及笄性急而形實未許嫁厚味積毒已深髀骨中痛者年餘醫以氣藥雜治之愈而復發至秋冬令忽大痛發熱醫者方悟髀樞穴上生附骨疽在外廉側少陽之分其厚味性急自若自首至尾悉是五香湯十宣散服至瘡潰猶與五香湯者月餘忽一日惡寒發熱膈滿醫者不悟升散太多陰血已絶孤陽狂越於上猶恨服五香飲欠多致膈間有滯大服以進一夕喘汗而死此二者由不預防本經少陽血少遽猛浪用十宣五香表散而死之者也可不戒哉靈帝曰病之生時有喜怒不測飲食不節陰氣不足陽氣有餘榮氣不行乃發為癰疽陰陽不通兩熱相搏乃化為膿小針能取之乎岐伯曰聖人不能使化者為之邪不可留也故兩軍相當旗幟相望白刃陳於中野者此非一日之謀也能使其民令行禁止士卒無白刃之難者非一日之教也須臾之得也夫至使身被癰疽之病膿血之聚者不亦離道遠乎夫癰疽之生膿血之成也不從天下不從地出積微之所生也故聖人自治於未有形也愚者遭其已成也黃帝曰其已形不豫遭膿已成不豫見為之奈何岐伯曰膿已成十死一生故聖人弗使已成而明為良方著之竹帛使能者踵而傳之後世無有終時者為其不豫遭也黃帝曰其已有膿血而後遭乎不導之以小針治乎岐伯曰以小治小者功小以大治大者多害故其已成膿血者其惟砭石鈹鋒之所取也黃帝曰多害者其不可全乎岐伯曰其在逆順焉爾玉版篇逆順法見潰瘍疹條無治初生癰疽發背神效灸法纍試有驗江陵府紫極觀因掘得石碑載之凡人初覺發背欲結未結赤熱腫痛先以濕紙復其上立視候之其紙先干處則是結癰頭也取大蒜切成片如當三錢厚安頭上用大艾炷灸之三壯即換一蒜片痛者灸至不痛時住不痛者灸至痛時方住最要早覺早灸為上如有頭似麻豆大者不用濕紙覆法只消頭上灸之若有十數頭作一處生者即用大蒜研成膏作薄餅鋪頭上聚艾於餅上燒之一二日十灸十活三四日六七活五六日三四活海灸而不痛痛而後止其灸灸而不痛者先及其潰所以不痛而後及良肉所以痛也灸而痛不痛而後止其灸灸而痛者先及其未潰所以痛而次及將潰所以不痛也精癢者灸至不癢痛者灸至不痛大概以百壯為準又云譬如諸盜入主人之家必開門逐之使出萬一門不開無從而出必傷主後已本王蘧發背方序云元祐三年夏四月官京師疽發於背召國醫治之逾月勢益甚得徐州蕭縣人張生以艾火加瘡上自旦及暮凡一百五十壯知痛乃已明日鑷去黑痂膿盡潰肉理皆紅亦不復痛始別以膏藥貼之日一易焉易時旋剪去黑爛月許瘡乃平是歲秋夏間京師士大夫病疽者七人余獨生此雖司命自然固有料理不知其方遂至不幸者以人意論之可為慨然於是撰次前後所得方模板以施庶幾古人濟衆之意此即當頭隔蒜灸法但不用蒜耳精史源母氏背髀間微癢視之有赤半寸許方有白粒如粟黍乃急著艾灸其赤隨消二七壯而止信宿復覺微痛視之有赤下流長二寸闊如韭葉舉家皆以前灸為悔或云等慈寺尼智全者前病瘡甚大得灸而愈奔問之全云劇時昏不知但小師輩言範八奉議守定灸八百餘壯方蘇約艾一篩爾亟歸白之見從始以艾作炷如銀杏大灸其上十數殊不覺痛乃截四旁赤引其炷減四之三皆覺痛七壯後覺癢每一壯燼則赤隨縮入灸至二十餘壯赤暈收退病者不憚遂以艾作團大灸其上漸加至雞黃大約四十團方覺痛視火焦處已寸余蓋灸之遲而初發處肉已壞壞肉成隔直至好肉方痛四旁知痛肉未壞也病者六夜不寐至是食粥安寢至晚視之瘡如覆一甑突高三四寸上有百數小竅色正黑突然高者毒氣出外而聚也百數小竅者毒未聚而浮攻肌膚也色正黑者皮與肉俱壞也非灸火出其毒於壞肉之裡則五臟逼矣桑君當癰疽頭針而瀉之氣避筋骨垣地之濕氣自外而入者瘡瘍當先服藥而後用針針時先用溫衣覆蓋不令凝泣壅滯使血脈得溫小行則血出立已若不如此血脈凝滯便針邪毒不瀉反傷良肉益其瘡勢也嬰兒瘡亦然精騎竹馬灸法先令病人以肘憑几豎臂腕要直用篾一條自臂腕中曲處橫紋男左女右貼肉量起直至中指尖盡處截斷為則不量指甲卻用竹扛一條令病人脫衣騎定令身正直前後用兩人扛起令腳不著地又令二人扶定勿令僵仆卻將前所量臂腕篾從竹扛坐處尾骶骨盡處直向上貼脊背量至篾盡處為則用墨點定此只是取中非灸穴也卻用薄篾作則子量病人中指節相去兩橫紋為則男左女右截為一則就前所點處兩邊各量一則盡處即是灸穴兩穴各灸五壯或七壯止不可多灸不問癰疽生何處並用此法灸之無不愈者蓋此二穴心脈所通處此癰疽皆心火留滯而生灸則心火流通即見安愈可以起死救危有非常之效纍試纍驗詳臂腕中曲處橫紋即曲澤穴間橫紋非掌後腕之橫紋也丹凡癰疽之發或因內有積熱或因外寒鬱內熱若於生髮之際艾灸以散其毒治之於早可以移深為淺改重為輕諸項灸法皆好惟騎竹馬灸法尤為切要此消患於未形之策保凡瘡可灸刺者須分經絡部位血分多少腧穴遠近若從背而出者當從太陽五穴隨證選用或刺或灸泄其邪氣凡太陽多血少氣至陰通谷束骨崑崙委中從鬢而出者多從少陽五穴選用少陽少血多氣竅陰俠溪臨泣陽輔陽陵泉從髭而出者多從陽明五穴選用陽明多血少氣厲兌內庭陷谷衝陽解溪從腦而出初覺腦痛難忍欲生瘡也腦者髓之海當灸刺絶骨以泄邪氣髓者舍也故脈浮者從太陽經依前選用脈長者從陽明經依前選用脈弦者從少陽經依前選用論曰諸經各有井滎輸經合井主心下滿及瘡色青滎主身熱及瘡色赤俞主體重節痛及瘡色黃經主咳嗽寒熱及瘡色白合主氣逆而泄及瘡色黑各隨經病而見此證者或宜灸或宜針以泄邪氣經云邪氣內搐則壅熱宜砭射之也上保命集分經灸刺乃大綱耳今更取靈樞經脈篇及銅人等書毫分縷析出各經分野在針門十二經條列為之圖目之曰經絡分野圖使人視之心目燎然目無全牛矣夫癰疽初發必先當頭灸之以開其戶次看所發分野屬何經脈經脈既定卻內用所屬經脈之藥引經以發其表外用所屬經脈之俞穴針灸以泄其邪內外交治邪無容也針灸癰疽者更於針灸門十二經脈分野圖求之甲癰疽竅陰主之頭項癰腫不能言天窗主之垣邪氣不傷於腸胃大便如常慎不可下切禁之丹精要云大黃治癰疽之要藥以其宣熱拔毒又云瘡始作皆須以大黃等湯極轉利之且排日不廢繼又自言患癰疽者每有泄瀉皆是惡候此是不能無疑者也借曰前用大黃恐因病體實而大腑祕結有積熱沉痼之積者發也止可破結導滯推令轉動而已豈可謂極轉利之而且排日不廢乎若下利之後又與利藥恐非防微杜漸之意瘡之始作即周禮腫瘍之時也腫在肌肉若非大滿大實堅之證自當行仲景發表之法借五香湯為例散之於外何必遽以峻下之藥以奪其里自取其禍乎精要云大凡癰疽不可舍五香湯此又不能無言者也開卷便於第一論中詳言之吾不知良甫之時有許多大腑堅祕病氣鬱塞若是之頑厚可以驟散而大下者若果有之亦當開陳時之先後證之可否庶乎後人不敢孟浪殺人也或曰癰疽用大黃走泄以去毒自孫真人行千金方已言之矣良甫祖述其説何吾子病之深也曰大黃除諸實熱而性峻急孫以盛行奇術於公卿間時在晚宋民不知兵交遊於富貴之家肉食之輩固皆捷效今良甫不分貧富苦樂勞逸一概用之寧無孟浪之患乎況有房勞而虛者憂怒而虛者極意貪求而虛者強力動勞而虛者大醉過飽而虛者皆因氣弱而澀血少而濁生疽固是難治之病若大腑祕而稍安穀食肯守戒律甘心淡味者猶為可治但費補工夫耳苟因旬日半月大便祕實不知其氣不降也便以為實而行大黃些少寒熱不知其血氣不和也便以為有外感而行表散如此害人甚速垣瘡瘍及諸病面赤雖伏火熱禁不得攻裡為陽氣怫鬱邪氣在經宜發表以去之故曰火鬱則發之雖大便數日不見宜多攻其表以發散陽氣少加潤燥藥以潤之如見風脈風證只用發表風藥便可以通利大便若只乾燥祕澀尤宜潤之慎不可下也九竅不利皆不可下瘡瘍鬱冒俗呼昏迷是也慎不可下汗之則愈丹排膿內補十宣散若用之於些少癰疽與冬月儘可助內托之功若於冬月腫瘍用之亦可轉重就輕移深為淺若潰瘍與夏月用之其桂朴之溫散佐以防風白芷吾恐雖有參耆難為倚仗比見世人用此方者不分癰疽冬夏無經絡無先後如盲人騎瞎馬半夜臨深池危哉又云內補十宣散瀉衛燥血藥太多止可用於輕小證候虛之甚者恐難倚仗精要云內托散一日至三日之內進十數服治毒氣攻衝臟腑名護心散此方專為服丹石而發疽者若不因丹石而發恐非必用之劑若夫年老者病深者證憊者體重者緑豆雖補將有不勝重任之患矣仲瘡家雖身疼痛不可發汗汗之則痓發汗為大汗出非謂諸托裡之藥輕輕表散也李世英疽不熱不痛屬陰切不可用冷藥敷貼恐逼毒氣入內丹夫外施敷貼正與發表之意同經曰發表不遠熱大凡氣得熱則散冷則斂向見鄭經歷性嗜酒與煎爆年五十餘忽春末夏初在額絲竹空穴湧出一角長短大小如雞距稍堅求豫治豫曰此非膏粱所致而何宜斷厚味先解食毒針灸以開泄壅滯未易治也此少陽經所過氣多血少者鄭以憚煩召他醫以大黃朴硝腦子等冷藥罨之一夕豁開如醬蚶徑三寸一二日後血自蚶中濺出高數尺而死此冷藥外逼熱鬱不得發宜其發之暴如此也蜞針法謂開門放毒以為要捷恐可施於輕小證候耳愚謂蜞之所吮止膚間惡血若積毒於臟腑者徒竭之於外而不及於里恐未為得往見張兄之子甫二歲遍身赤疹如霞片豫向見其母久病痁謂毒熱在血所成者張曰誰不因母血所成何謂毒熱之血豫曰其母雖痁食肉如平時肉性熱與宿疾之熱相搏非毒歟張不之信自取五六大蜞吮其血疹頓消乳食起居如舊豫曰非其治也未可以為喜張怒越二三日大發熱而暴死非竭之於外血去而氣不能獨居乎精要云口乾與口渴不同不宜用丹藥鎮墜用之其禍如反掌用桑枝煎五味湯以救陰水甚妙方也而不言食味起火怒氣生火房勞激火吾恐渴未易除也精要謂頭上有發毒者不得灸恐因火氣拔起熱毒炎上動病邪而添病愚謂此言過矣火本以暢達拔引郁毒此從治之意也頭為諸陽所聚之處艾炷宜小壯數宜少小者如椒粒少者三五炷而已若孟浪如腹背上引痛灸至不痛不痛灸至痛為例斯為誤矣按東垣灸元好問腦疽以大艾炷如兩核許者至百壯始覺痛而痊由是推之則頭上發毒灸之痛者艾炷宜小壯數宜少如不痛者艾炷大壯數多亦無妨也又引陳日華之説謂於始發時用針灸十死八九此未之思也切詳因灸而死者必其血虛孤陰將絶無以承當火氣脈必浮數而大鼓與精神必短而昏豈可泛言始發不可灸以誤人保瘡疽已覺微漫腫硬皮不變色脈沉不痛者當外灸之引邪氣出而方止經曰陷者灸之如外微覺木硬而不痛者當急灸之是邪氣深陷也淺者不可灸慎之如有膿水亦不可灸當刺之按刺之膿出不腫痛者邪已去矣不宜灸若刺之膿出而痛腫不止者亦當於腫上灸之無妨又毒雖淺卻有十數頭腫痛者亦灸之無妨涓一有癰疽瘡癤須順時節春夏為正易為整理緣天氣溫和肌肉緩慢而暖故易治其有肉冷是患人氣虛所致但以溫藥調順氣血外即用溫暖潰膿膏藥貼之令穴候穴抽膿盡急用生肌長肉藥滿瘡口不宜緩慢恐至秋冬成漏瘡也或在秋冬發者乃春夏內先有發蒸熱毒遇一陰生後再有伏毒至秋冬間又因食毒物酒面房欲之事忽發初覺微小數日之間腫大疼不可忍初得大便五七日不通小便淋瀝者是其候也先調脾臟氣令實次服發穴排膿消毒去積之藥內托溫平不得用太熱澀之藥緣脾中臟要和暖如用熱藥恐氣澀而不流暢致榮衛不調也貼即用溫涼藥不得用冷藥恐逼入毒氣須引膿外透方漸安矣仲諸浮數脈應當發熱而反灑淅惡寒若有痛處當發其癰精陰滯於陽則發癰陽滯於陰則發疽而此二毒發無定處當以脈別之浮洪滑數為陽微沉緩澀為陰陰則熱治陽則冷治上陽脈當以癰法治之陰脈當以疽法治之不必拘於熱治冷治也垣身重脈緩濕勝者除濕身熱脈大心躁時腫乍來乍去者清熱諸痛眩暈動搖脈弦者去風氣澀氣滯乾燥亡津液脈澀者瀉氣補血寒勝則脈浮食不入便溺多惡寒脈緊者宜瀉寒水腎脈澀甚為大癰全文見虛實法涓夫人生最可憂者發背也其種有五一曰陽毒因風熱而有或患熱毒消渴或先患傷寒余有陽毒觸處蓄積起於背脊膂之間不問椎數但從兩夾脊起止腰上滿背焮熱如炊之狀赤紫或紅如焰膿毒難成成後不止止後痛不除驀忽數日之間復平如舊將謂腫消此是內攻肉陷不可療矣二曰陰毒發背是氣冷而作初如黍米粒起情緒不快愔愔而痛直應前心心忪怔頭目昏重寒熱如瘧五七日後始發引攻腫開闊難收內積有膿深沉遲緩未透宜急以補氣湯藥內托外以抽膿藥貼之宜急見膿無膿即平愈未期三曰有人多服金石燒煉之藥毒惡流滯成發背者初起如丹疹之狀漐漐漸開如湯火瘡面色如朱心膈煩躁多渴嗜冷其瘡難起起即驚人猶勝於陰陽二毒者緣此有解金石藥毒湯散治其內也賴有根底分明亦須急療方安四曰人有患酒食毒發背者此疾非近得之乃臟腑久積乘飢乘困食之便睡或多食酒肉冷熱黏滑肥鮮熾膩未下胸膈房室不禁恣意當風取快脾臟氣虛不能受乘發毒攻背兩夾脊不問椎數初起癰頭如小彈子後大如拳堅如石痛遍四肢加之拘急口苦舌乾腹急大小便澀十數日後頭面手足虛腫及臟腑通泄如利內急痛者是其症也喜方腫引急用收腫發穴潰膿湯藥內實外泄膿水不可放縱遲緩則皮肉腐壞傷骨爛筋漸成膿多因而感邪內敗者死矣五曰人有冒山嵐瘴氣發背毒氣先在臟腑年月浸遠氣血虛損衰弱初起腫色青黑如靴皮頑痹痛深附筋骨徹髓按之如木石引手加深方覺似有痛處至五七日毒氣浮淺腫高色變青白有如拳打之狀寒戰似瘧及有風候頭動口偏手足厥逆眼黑睛小白多而慢此內有邪氣相搏急破出清血三五升方有黃膿白汁相和發泄其皮不寬不慢亦急脹痛亦不住直至色退熱疼方愈亦宜急急追趕膿與毒氣外出無害初患腫三日內灸者生八日內膿成針烙導引者生未瘥慎勞力者生慎忌食者生慎喜怒者生懼腫猛療者生急療者生不諱發背者生待膿自出不導引者死未內攻而針烙用藥導引者生內攻後導引針烙者死瘇焮熱痛方盛以前療者生如過此後已內攻者死膿成後不出不導引但敷藥者死如赤白痢氣急者是已內攻醫療無益必死癰不救十得五生疽不療十全死輕腫怕痛者必死不遇良方者死節候不依法者必死愚執恣意用性逸情者死有發背癰有發背疽如毒氣勇猛而發如火焚茅易於敗壞初發即可如黍米粒大三兩日漸赤引腫如手掌面大五七日如碗麵大即易為攻焮熱赤引如火燒之狀浮面漸潰爛闊開內發腫如炊之狀外爛皮肉如削去紫瘀膿汁多而腫不退疼亦不止發渴發逆飲食不下嘔吐氣急浮淺開闊者尤宜發膿托毒湯藥用之必愈陽證實也其間有隻如盞面大者此非不大緣為毒氣深沉內虛毒氣近膜也此必內攻近入臟腑卻外入四肢先攻頭面虛浮後攻手面次攻兩足面腫名曰毒氣散入四肢其人聲嘶氣脫眼睛黑小十指腫黑乾焦不治陰證虛也精凡癰疽初發腫硬高者而毒氣卻淺此乃六腑不和為癰其證屬陽勢雖急而易治若初發如粟粒甚則如豆許與肉俱平或作赤色時覺癢痛癢時慎勿抓破此乃五臟不調為疽其證屬陰蓋毒氣內蓄已深勢雖緩而難治始發一粒如麻豆大身體便發熱生疽處腫大熱痛此為發於外雖大如盆治之百可百活陽症實也或身體不熱自覺倦怠生疽處亦不熱數日後漸大不腫不痛低陷而壞爛此為發於內雖神仙無如之何陰症虛也保木香散治小兒斑後生癰如神出小兒門地骨皮一兩木香半兩穿山甲炙黃二錢五分麝香一字上末米飲下三錢潰瘍癰疽已潰膿出者也仲諸癰疽欲知有膿無膿以手掩腫上熱者為有膿不熱為無膿精凡癰疽按之牢𩊅未有膿也按之半軟半𩊅已有膿也宜急破之𩊅未詳何切半軟謂中央膿熟處半𩊅謂四旁無膿腫肉也凡瘡腫以手指從瘡旁按至四畔上赤黑者按之色不變膿已結成又按之隨手赤色此亦有膿按之白良久方赤遊毒已息可就赤白色盡處灸斷瘡肉平實久而方消夫癰則皮薄腫高疽則皮厚腫堅初發並宜灼艾惟癰膿成則宜針疽膿成則宜烙切宜熟視詳審候其潰熟膿透於外其勢盈盈欲出只用替針丸自瘡頭咬開不半日許其膿自出切不用針刀也丹溪云精要論戒用針刀業外科者當拳拳服膺替針丸治癰疽已潰未破或破後膿出不快者白丁香一字硇砂一字以上沒藥一字乳香一字石灰餅藥納種糯米十四粒其法用石灰五升爐灰三升以水五升淋取清汁入大鍋內熬濃汁至三五升用瓦器盛貯臨用時以小青盞盛取半盞濃汁卻用皮紙貼盞中濃汁面上安定然後取糯米十四粒種在皮紙面上一宿即是上為細末糯米飯丸如麥粒大每用一粒未破用津貼瘡頭薄處即破膿滯不快則用一粒納瘡口內使膿不滯好肉易生無替針丸雄雀糞二十粒硇砂陳倉米沒藥各一字上研勻以米飯丸如粟大每用一粒貼瘡口眼中即潰膿出梅治諸癰不消已成膿懼針不得破令速決取雄雀糞塗頭上干即易之雀糞中豎者為雄本治癰疽已有瘡眼未出膿痛不可忍用此藥紝即膿出巴豆一個去皮膜不去心油鹽豉十四個口中含去皮令軟同研爛真麝少許如難丸入少稀糊捏作餅子如鼠糞大大小臨時看瘡口紝之只以紙捻子送入藥須臾必痛忍之良久膿遂出丹出一切瘡口出蛾繭殼燒存性無灰酒調下每服一枚服下一個時辰便有瘡口一個若服兩枚出瘡口兩枚精癰成膿宜針其鐵用馬銜鐵為之形如韭葉兩面皆利可以橫直裂開五六分許取其毒血如覺病輕須先灸而後裂按癰如椒眼數十粒或如蜂窠蓮房而膿出痛不除宜用針者以針橫直裂之則毒血挾膿出而愈如無椒眼之類只消直入取膿不必裂之也又法當椒眼上各各灸之亦佳不必裂也鈹針者末如劍鋒以取大膿全文見針灸門素夫癰氣之息者宜以針開除去之病能篇王注云息瘜也死肉也今世用刀割去死肉者是也治腐腫者刺腐上視癰小大深淺刺刺大者多血小者深之必端內針為故正長刺節論大者多血小者深之八字衍文也大小深淺刺七字取膿之法盡矣備矣精疽成膿宜烙可用銀篦大二分長六寸火上燒令赤急手尉烙毒上得膿為效涓凡癰覺在虛處及眼不見處皆是惡症如發高腫紫赤皮薄光澤覺里有膿毒諸藥貼㶸不破者宜用熟銅針於油火上燎透先用墨筆點定卻當頭以針淺刺入隨針出膿者順也有不隨針膿出當用白紙作紝紝入針孔引出膿毒當時腫退可及三分如腫不退是一逆也腫不退疼不除但膿出二逆也膿疼不退患人不覺瘡輕三逆也雖用針破出膿亦無所濟須急用引膿托裡湯藥以助其勢力可也更有癰生實處不問深淺如有膿即用針烙無害稍遲緩即恐傷筋骨內疼凡近筋脈骨節處不得亂行針烙反致他病也患疽初生赤硬或在處處毒氣淺或在實處毒氣深切須仔細辨認仍問患人疼痛覺淺覺深其患處瘡頭不拘多少其間須有一個最大者即是大膿竅當用熟鐵大針頭如叉腳者於麻油燈上燒令熱透以大頭處按定插入一寸或至二寸膿當下恐未有膿毒出卻用白紙作紝子紝入直候次日取出其膿即隨紝下矣膿色黃白即好若赤黑色防復有鮮血出即患人寒戰不禁其有虛處不得亂行針烙凡患發背覺似有膿成便用大熟鐵烙當正頭上烙之其烙並用麻油燈上燒令通紅烙入可二寸許初入肉即須橫插入不得正入恐烙透膜也如已有破處皮爛潰熟更不得用針烙如是橫長赤引開闊當須兩頭下火針令膿毒隨針引出肥人膿汁多瘦人膿汁少如肥人卻少瘦人卻多多是肉敗壞成膿少是肉不腐爛變氣實也猶宜審詳不可造次便行針烙亦看患者氣脈勻和榮衛氣不節滯血脈不致凝澀即行針烙無畏切須仔細患者氣虛脈氣大者亦不可亂行針烙針烙之法不可容易先看皮紋緊慢厚薄紫赤色大光澤者即可用針烙如皮肉未變不可用針針亦無濟大抵用針只欲引膿如針刺無膿是氣伏也不可用針烙丹或問烙法如何曰膿或汪洋欲出奈何皮厚肉深難穴者既前無內托之藥先致力於內後又不用烙以開竅脈膿何由出膿本肉腐所成皆挾毒熱之氣若久留肉腠間則毒氣浸淫好肉亦化為膿腐此所以烙法有功於潰瘍也彼根淺而皮薄者何必假此以賣弄假法恐嚇而脅取利也靈帝曰願聞身形應九野奈何岐伯曰請言身形之應九野左足應立春其日戊寅己丑左脅應春分其日乙卯左手應立夏其日戊辰己巳膺喉首頭應夏至其日丙午右手應立秋其日戊申己未右脅應秋分其日辛酉右足應立冬其日戊戌己亥腰尻下竅應冬至其日壬子六腑膈下五臟應中州其大禁太乙所在之日及諸戊己凡此九者善候八正所在之處所主左右上下身體有癰腫者欲治之無以其所直之日潰治之是謂天忌日也涓十歲二十二歲三十三歲七十三歲以上四人百神在上部不可患癰疽發背見血者死申子辰年血忌餘年不妨男女同二十五歲三十一歲六十八歲七十四歲以上四人百神在額不可患瘡腫見血者死十八歲二十四歲三十五歲四十五歲五十六歲六十七歲七十二歲八十九歲以上八人百神在兩肩隅不宜患癰疽瘡腫見血者死十二歲二十七歲三十六歲五十九歲六十六歲九十七歲以上六人百神在中部不可患癰疽發背見血者死巳西丑年血忌餘年不妨男女同三十二歲四十二歲五十五歲六十一歲以上四人百神在肩背不可患癰疽見血者死十九歲二十六歲四十九歲五十六歲五十七歲六十二歲八十歲九十一歲以上八人百神在肝肺俞不宜患癰腫見血者死十一歲二十三歲二十四歲五十八歲九十六歲以上五人百神在脅肋不可患癰疽見血者死十四歲二十九歲三十九歲四十六歲五十二歲六十歲六十九歲七十六歲八十一歲八十八歲九十五歲以上十一人百神在下部不可患瘡漏疾見血者死下部尤忌見勞瘵人不宜下部出膿難瘥十一歲十五歲二十七歲六十三歲七十五歲以上五人百神在尻尾間不可患癰疽見血者死十三歲二十八歲五十二歲七十二歲九十三歲以上五人百神在足下不可患癰疽見血者死二十一歲三十八歲四十一歲五十歲以上四人百神在遍身不可患瘡腫見血者不治凡發背及癰疽皆在背上不問大小有疼無疼或熱或不熱或冷或不冷但從小至大腫起至一尺以上者其赤腫焮熱者即用緊急收赤腫藥圍定不令引開中心即用抽膿聚毒散貼之急令散毒外透內服排膿縮毒內托湯藥候膿成相次破穴看瘡大小深淺內發其膿汁膿水大泄急須托裡內補雖破穴膿汁不多再須排膿拔毒透後慎不令再腫須疼止腫消患人自覺輕便即是順疾也最宜節慎飲食其熱毒方盛或發大渴多飲冷水及冷漿之類此是毒氣攻心令口乾煩渴但以心氣藥內補臟腑即止矣內補謂參耆之屬排膿謂皂角刺之屬丹精要云凡疽疾勿食羊雞牛鵝魚面煎爆炙炒法酒等味犯之必發熱只有梔子黃芩湯用之取效夫梔芩苦參犀角輔佐人參固可解食毒之熱若寒月與虛人寧無加減乎內經謂膏粱之變足生大疔此原癰疽之因也禁戒厚味蓋以厚味能引起宿火之熱此誠富貴豢養口腹者所宜謹守若素貧者大不然矣豫治章兄背疽徑尺家貧待死而已視瘡穴黑深似有近內之意急作參耆歸術膏飲三日略以艾芎湯洗氣息奄奄不可支持幸其身不發熱而可進飲食每日作餛飩大碗與之盡藥膏五斤餛飩多肉者三十碗瘡口漸合以其因肉與餛飩助氣之有益也羅凡治病必察其下豫從軍戊午年冬於武城縣有賈倉使父年逾六旬冬至後數日疽發於背五七日腫勢約七寸許不任其痛瘍醫曰視之膿成可開矣公懼不從越三日醫曰不開恐變證生矣遂以燔針開之膿泄痛減以開遲之故逮二日變證果生覺重如負石熱如焫火痛楚倍常六脈沉數按之有力此膏粱積熱之變也邪氣酷熱故宜寒藥治之時月嚴凝復有用寒遠寒之惑乃思內經曰有假者反之雖違其時以從其證可也與瘍醫議急作清涼飲子加黃連一兩五錢與之利下兩行痛減七分翌日復用前藥其證悉除月餘平復陳録判母年七十餘歲忽冬至後腦出疽形如甌面大命瘍醫診視俟瘡熟以針出膿因怒笞侍妾瘡即內陷凹一韭葉許面色青黃不澤四肢逆冷汗出身清時復嘔吐脈極沉細而遲蓋緣衰老之年嚴寒之時病中苦楚飲食淡薄已滌肥膿之氣獨存憔悴之形加之暴怒精神愈損故有此寒變也病與時同與瘍醫議遂制五香湯一劑加丁香附子各五錢劑盡瘡復大發隨證調治而愈內經曰凡治病必察其下謂察時下之宜也諸痛癢瘍瘡皆屬心火言其常也如瘡盛形羸邪高痛下始熱終寒此反常也固當察時下之宜而權治故曰經者常也法者用也醫者意也隨所宜而治之可收十全之功矣至元壬午五月二十八日王伯祿年五十有七右臂膊腫盛上至肩下至手指色變皮膚涼六脈沉細而微脈證俱寒豫舉瘍醫孫彥和視之曰此附骨癰開發已遲以燔針啓之膿清稀解次日肘下再開之加厄逆不絶彥和以丁香柿蒂散兩服稍緩次日厄逆尤甚自利臍腹冷痛腹滿飲食減少時發昏憒於左乳下黑盡處灸二七壯又處托裡溫中湯用乾薑附子木香沉香茴香羌活等分㕮咀一兩半欲與服或者曰諸痛癢瘡瘍皆屬心火又當盛暑之時乾薑附子可乎豫應之曰理所當然不得不然內經曰脈細皮寒瀉利前後飲食不進此謂五虛況厄逆者胃中虛寒極也諸痛癢瘡瘍皆屬心火是言其定理也此證內外相反須當舍時從證非大方辛熱之劑急治之則不能愈矣遂投之諸症悉去飲食倍進瘡勢溫膿色正彥和又與五香散數服月餘平復噫守常者衆人之見知變者智者之事知常而不知變因而取敗者亦多矣況醫乎哉守常知變豈可同日而語托裡溫中湯治瘡瘍為寒變而內陷者膿出清解皮膚涼心下痞滿腸鳴切痛大便微溏食則嘔逆氣短促厄逆不絶不得安臥時發昏憒羌活乾薑炮各三錢黑附子四錢炮去皮臍益智仁一錢茴香甘草炙丁香沉香各一錢木香一錢半陳皮一錢按經曰寒淫於內治以辛熱佐以苦溫附子乾薑大辛熱溫中外發陽氣自里之表以為君羌活味苦辛溫透關節炙甘草甘溫補脾胃行經絡通血脈胃寒則嘔吐厄逆不下食益智仁沉香丁香大辛熱以散寒邪為佐瘡氣內攻氣聚而為滿木香茴香陳皮苦辛溫治痞散滿為使也上㕮咀都作一服水三盞生薑五片煎至一盞去渣溫服無時忌一切冷物丹一老人年七十患背疽徑尺余已雜與五香十宣數十帖膿血腥穢嘔逆不食者旬余病人自去吃內托散隔中不安且素有淋病三十年今所苦者淋之痛與嘔吐不得睡而已急以參耆歸術煮膏以牛膝湯入竹瀝飲之三日後盡藥一斤半淋止思食七日後盡藥四斤膿自湧出而得睡又兼旬而安一男子年六十餘性好酒肉背疽見膿嘔逆發熱蓋其得內托十宣多矣醫以嘔逆於嘉禾散中加丁香以溫胃行氣時七月大熱脈洪數有力豫因謂此脈症在潰瘍尤為忌然形氣實只與人參膏和竹瀝飲之盡藥十五斤竹百餘竿而安豫曰此病幸安也不薄味必再作仍厚味自若夏月醉後坐水池中又年餘左脅旁生一軟塊如餅二年後軟塊為疽本人見膿血淋漓而脈洪數有力又嘔逆食少遂自以人參膏入竹瀝飲之又百餘竿而安令八十歲強健如舊此病兩以老年血氣弱專服人參竹瀝而愈若與內托十宣散恐未能若是之安全也膿潰之後腫退肌寬痛必漸減而反痛者此為虛也宜補之亦有穢氣所觸者宜和解之亦有風寒逼者宜溫散之補者歸耆之類和解者乳香芍藥之類溫散者防風桂枝之類權小娘瘧後右腿股生癤破後筋吊疼脈虛而澀詢之小便時疼處亦相應宜與生血導熱川芎歸頭條芩生地赤芍牛膝黃柏甘草炙二分青皮炒檳榔五分通草三分桂皮一錢上煎食前熱飲之五香湯即五香連翹湯去射干大黃升麻連翹加參犀角若用於腫瘍猶可借其飛走以攻散其毒使不延蔓若用於潰瘍雖多有參耆草草之緩補而走泄太多寧不犯仲景已有得汗復汗得下復下重虛之戒可不省乎精要云血氣聞香則行聞臭則逆又言飲食調令香美益其脾土養其真氣夫甘而淡者可養脾土若香美者但能起火經以熱傷脾熱傷氣為戒今曰益脾養氣若施之於腫瘍者似有暢達之益潰瘍後用香美恐有發濕熱損真陰之患矣精要云熱盛脈數與漏蘆湯單煮大黃等湯不甚熱脈緩弱只投五香連翹湯夫熱盛脈數若腫瘍時臟腑祕而體實者猶可與大黃若潰瘍後膿血出多者熱盛脈數去死為近其可下乎緩弱之脈古人皆以為邪毒已散五香之飛走升散其可用乎精要云初成膿宜用烙得膿利為效亦服神仙追毒丸此又不能無疑者也夫追毒丸下積取毒之藥決無取膿之效今用烙而得膿若在裡之氣血壯實則膿自出如推矣何不以和氣活血之藥佐參耆補劑使膿自托出乎精要云瘡作渴甚急與神仙追毒丸取下惡毒與清膻湯萬金散五香連翹湯六味車螯散千金漏蘆湯皆可選用下利以後渴尚未止宜用生津補氣藥則津液生氣血完渴自止矣夫大渴而與利藥非明示脈證何以知其當下後又言下利後渴又不止卻用補藥又不明言脈證恐是但有大渴必與峻下下後尚渴方與補藥夫醫者治未病如此用藥可乎況渴屬上焦當腫瘍時猶或可用若潰瘍時渴恐因血氣之虛何以待下利後方議其虛哉精要論疽疾咽喉口舌生瘡歸罪於不得內托以致熱毒衝心與琥珀犀角膏夫於腫瘍時用之猶或近理若於潰瘍後用之彼犀角腦子之升散寧不助病邪致虛以速其死也耶後有犀角散以大黃佐黃耆用黃耆則知其虛用大黃又似疑其有實熱夫瘡潰體虛縱有舊熱將自漸因膿血而消何必以峻冷利動臟腑若在秋冬何異用刀劍耶精要論癰疽發寒熱多汗或先寒後熱或先熱後寒或連日作或間日作必先嘔痰然後寒熱寒熱解大汗出不可專以為有熱亦有氣虛而得者亦有因怒而得者又有先感寒邪脾氣不正而有此證者夫氣虛者當以補氣藥補之因怒者當以順氣藥和之脾氣不正者當以調脾藥養之今用不換金正氣散悉是溫散瀉衛之藥而欲以一兩人參收拾十四兩之瀉衛可乎若用於腫瘍時感寒邪者猶或庶幾彼氣虛者因怒者脾氣不正者此方能兼治乎又未知用於腫瘍耶潰瘍耶涓穴有孔慎風仍慎再合如再合者為風濕邪氣攻搏而再生膿宜如前以通和湯藥依次第用不可急性恐傷氣害人之命也無瘡瘍未合風入為破傷風濕入為破傷濕二者害人最急食卒不知其因甚難認治癰疽瘰癧潰後尤宜謹之精加味十全湯治癰疽愈後補氣血進飲食黃耆蒸地黃蒸當歸川芎人參茯苓芍藥炒白朮陳皮各一兩粉草炙桂心五味各五錢烏藥七錢上㕮咀每服一兩用水一碗生薑五片棗二枚同煎分作二服留渣曬乾為末服之丹溪云加味十全湯須看年之老壯資之強弱證之緩急時之寒熱加減用之丹加味十全湯治癰疽後補氣血進飲食實為切要蓋膿血出多陰陽兩虛非此藥何以回生起死惜其不分經絡不載時令又在識者觸類而長之今之外科於瘡瘍腫平痛寬遂以為安漫不加省往往於結痂後兩三日或半年虛證乃見醫者不察病者不悟無補接調養之功因而轉成他病者惜哉豫治一士夫因腳弱求診兩手俱浮洪稍鼓飲食如常惟言問不答肌上起白屑如麩片時在冬月豫作極虛處治詢其弟乃知半年前曾於背臂腿三處自夏至秋冬節次生疽率用五香連翹湯十宣散與之今結痂久矣豫屬作參耆白朮當歸膏以二陳湯化飲之三日後盡藥一斤白屑沒者大半病者自喜呼吸有力補藥應效以漸而病家反怨藥不速應自作風病論治煉青礞石二錢半以青州白丸作料煎飲子頓服之豫諫止不聽因致不救書以為警云運氣癰自潰者惟土不及歲有之經曰土不及曰卑監卑監之紀其動瘍湧分潰癰腫蓋土不及則肉腐為癰腫故木化啓折乘之而膿湧分潰其癰腫也東垣癰疽用藥加減法如發背疔腫膿潰前後虛而頭痛者於托裡藥內加五味子恍惚不寧加人參茯神虛而發熱者加地黃栝蔞根潮熱者加柴胡地骨皮渴不止者加知母赤小豆虛煩者加枸杞天門冬自利者加厚朴膿多者加當歸川芎痛甚者加芍藥乳香肌肉遲生者加白蘞官桂有風邪者加獨活防風心驚悸者加丹砂口目瞤動者加羌活細辛嘔逆者加丁香藿葉痰多者加半夏陳皮精麥飯石膏在膿潰後圍瘡口麥飯石火煅醋淬十次研數日鹿角煅煙盡白蘞上用麥飯石末二兩白蘞末二兩鹿角灰四兩要研極細如不細反痛用好米醋入銀石器內煎令魚眼沸卻入三味藥末用竹篦子不住手攪熬一二時稀稠得所傾出候冷以紙蓋每用時先以豬蹄湯洗去膿血挹干以鵝翎拂藥塗四圍凡赤處盡塗之但留一小口如錢大以出膿血凡用瘡藥上久則藥干勿令繃急須常用醋拂濕其藥初便一日洗換藥十日後兩日一換肉冷惡寒者不宜用豬蹄湯治一切腫破消毒氣去惡肉凡瘡有口便用此湯濯洗白芷生甘草羌活露蜂房黃芩赤芍藥川歸等分上為粗末看疽大小用藥如疽大獖豬蹄兩隻只用白水三升煮軟將汁分為兩次澄去面上油並下面渣卻將藥末投其中再煎十數沸去渣以故帛蘸藥湯溫洗薄揩惡血惡肉隨洗而下洗訖仍避風忌人口氣吹之又忌狐臭人月經人癰疽有死肉不去者用白丁香霜梅深則紝之淺則乾摻於膏藥上甚妙海又方膏藥內入雄黃巴豆少許不傷好肉止去惡肉不惟惡瘡凡癰毒有惡肉者俱可去又方雄黃散以雄黃一錢另研巴豆不去皮研如泥入乳香沒藥少許再研細少上惡肉自去保治惡瘡有死肉者及追膿白丁香輕粉粉霜雄黃麝香各一錢巴豆霜三個上細末新飯和作錠子用之丹治瘡疽攻腫瘜肉突出烏頭五枚苦酒三升漬三日洗之日夜三四次古今録驗諸癰疽有肉凸出數寸者更於凸出瘡門求之精神異膏治諸般惡毒瘡癤發背癰疽其妙如神露蜂房要用蜂兒多者為妙細剪淨一兩全蛇蛻以鹽水洗淨焙乾半兩玄參半兩去蘆綿黃耆三兩黃丹五兩研細後入真麻油一斤杏仁去皮尖切小片一兩男子亂髮洗淨烙干如雞子大上件藥先將麻油入銀銚中同亂髮於風爐上慢慢文武火熬候發焦熔盡以杏仁投入候杏仁色變黑好綿濾去渣再將所熬清油入銀銚內然後入黃耆玄參二味慢火熬一二時取出銚子安一冷風爐上候半時久火力稍息旋入露蜂房蛇蛻二味將柳枝急攪移銚於火上不住手攪慢火熬至黃紫色用綿濾過後復入清油在銚內乘冷投黃丹急攪片時又移銚於火上文武火慢慢熬不住手用柳枝攪千餘轉候藥油變黑色滴於水中凝結成珠子則是膏成就矣若珠子稀再熬少時必候得所然後用瓷器內封收待用或恐偶然熬火太過稍硬難用卻入少蠟熬添麻油在內瓷器盛封蓋於甑上蒸乘熱攪勻收而用之膏藥熬成了須用所盛瓷器置淨水盆中出火毒一晝夜歇三日方可用熬此膏藥極難於火候須耐煩看火緊慢火猛即藥中火發千萬謹戒膏藥方甚多效無出於此垣熱瘡寒膏藥當歸身水洗焙乾一兩杏仁湯浸去皮尖一百個黃丹研細六兩肥嫩柳枝三兩半切如寸許水洗干肥嫩桃枝一兩切作如寸洗淨干麻油一斤上件先熬麻油熱下桃柳枝熬令半焦以綿裹當歸杏仁同煎至柳枝黑焦為度去藥渣濾油澄淨抹去銚中渣滓令淨再上令沸旋旋入黃丹熬成滴水中不散為度寒瘡熱膏藥與寒膏藥同只將當歸身改作當歸梢桃柳枝分兩倒過便是劉氏貼發背癰疽膿盡四面皮黏恐有膿毒攻起宜用逼毒散方黃藥子白藥子各一兩赤小豆二兩雄黃一錢上為末水調敷治發背癰疽膿盡生肉平滿宜用緊瘡口生肌青散子槿花葉盛時收陰乾取四兩為末青赤小豆白芨各二兩為末臨時用槿花末三錢匕白芨小豆末各一錢匕相和新汲水調攤紙上貼四畔中心瘡口不用貼垣斂瘡口方木香檳榔散用之決無疼痛以蠟油塗覆瘡上生肌斂肉甚速必無惡血瘡口疾合易取平復惟膏粱熱瘡所宜用也貧人害地之寒濕外來寒瘡者禁不可用木香檳榔黃連各等分上為極細末依前調用濕則干貼治寒瘡斂瘡口藥當歸身一錢洗淨曬乾青皮二分去白木香一分黃連五分上四味為極細末蠟油調塗取效甚速保瘡口大者乳香散寒水石煅滑石各一兩乳香沒藥各半兩腦子少許上各研細和勻少許摻瘡口上撮桃紅散斂瘡口定痛闢風邪滑石四兩乳香輕粉各二錢小豆粉一兩寒水石三兩煅上為細末乾摻口上一方改小豆粉為定粉精有人患背疽已潰如碗麵大視五臟僅膈膜耳自謂必死用大鯽魚一枚去腸臟以羯羊糞入其中烘焙焦黑極燥為細末乾摻之瘡口遂收至今無恙此方纍用有效須候膿少欲生肌肉時用之保又方治瘡口久不收小椒去目炒黑一錢定粉風化硝二錢白礬二錢半乳香沒藥各一錢上為末摻之精生肌散寒水石銼滑石烏魚骨龍骨各一兩定粉密陀僧白礬灰干胭脂各半兩上為細末乾摻用之平肌散治諸瘡久不斂密陀僧煅花蕊石煅白龍骨各一兩乳香另研輕粉各一錢上為細末和勻乾摻丹精要論癰疽久而瘡口不合其肉白而膿血少此為瘡口冷滯乃病氣血枯竭不潮於瘡遂致如此用北艾葉一把入瓦器內濃煎湯避風處乘熱用艾湯澆洗瘡口四圍淨肉以絹帛兜艾葉乘熱澆沃一日一次洗了須避風仍燒松香以煙燻瘡口良久用神異膏貼之不可與厭穢之人見若不能禁忌瘡口難安藥亦無效夫以血氣枯燥不知補接於內惟務熱洗於外不揣其本而齊其末而乃歸罪於冷滯大抵潰瘍宜洗若非行補接之藥以實其內竊恐淋洗有一時之快少頃恐病體自覺疲憊有不耐煩之意非虛而何可不先議補接乎補接即參耆歸術之類是也蘇亂髮蜂房蛇蛻皮各燒灰存性每味取一錢匕酒調服治瘡久不合神驗丹溪云發補陰之功甚捷丹收斂瘡口止有柳皮白蘞煎湯飲之靈眼白青黑眼小是一逆也納藥而嘔者是二逆也腹痛渴甚是三逆也肩項中不便是四逆也音嘶色脫是五逆也除此五者為順矣玉版篇精癰疽破潰之後其形候有逆有順眼白青黑而緊小一惡也不能下食納藥而嘔食不知味二惡也腹痛渴甚三惡也肩背不便四肢沉重四惡也聲嘶色脫唇鼻青黑面目四肢浮腫五惡也煩躁時嗽腹痛渴甚泄利無度小便如淋六惡也膿血大泄焮痛尤甚膿色敗臭氣不可近七惡也喘粗短氣恍惚嗜臥八惡也未潰先黑久陷面青唇黯便汙者九惡也更有氣噫痞塞咳嗽身冷自汗無時瞪目耳聾恍惚驚悸語言顛錯皆是惡證動息自寧飲食知味一善也便利調勻二善也神彩精明語聲清朗三善也膿清腫消色鮮不臭四善也體氣和平五善也五善見三則吉諸惡見四必危癰疽所兼諸證涓熱毒方盛或發大渴此是毒攻心臟令舌乾煩渴也但以補心氣藥內補即止羅竹葉黃耆湯治發背發渴通治諸瘡大渴淡竹葉二兩生地八兩黃耆麥門冬去心當歸川芎甘草黃芩芍藥人參半夏湯洗石膏各三兩上為粗末每服五錢水一盞半竹葉五七片同煎至一盞去渣溫服無時虛渴者忌用石膏半夏黃芩金銀花散金銀花四兩去土甘草一兩炒上為細末每服四錢水酒各一盞同煎至一盞去渣熱服丹外科精要云疽向安後發渴與加減八味丸夫當此時血氣兩虛當用參耆補氣當歸地黃養血渴當自止何必澤瀉茯苓導水佐以肉桂若忍冬丸黃耆六一湯等方切當忍冬養血黃耆補氣渴何由作精忍冬丸大能止渴及療渴疾既愈之後須預防外癰疽大宜服此忍冬草不以多少根莖花葉皆可用上入瓶內以無灰好酒浸以粳火煨一宿取出曬乾入甘草少許研為細末以所浸酒打麵糊丸如桐子大每服五十丸至百丸無時酒飲任下黃耆六一湯大治渴疾補虛乏常服此藥終身可免癰疽之疾綿黃耆去蘆六兩一半生用一半鹽水潤蒸三次焙乾粉草一兩一半生一半炙黃用上為細末每服二錢早晨日午以白湯點服若飲初杯用酒調尤妙桑枝湯大治口乾取桑枝一小升細切炒香以水三大升煎取二升一日服盡五味子湯大治口燥舌乾此是腎水竭也五味黃耆去蘆生用人參去蘆麥門冬去心粉草炙半兩上㕮咀每服半兩水一盞半煎至八分去渣溫服無時候一日二夜五七服妙丹外科精要云嘔逆有二證一證謂初發時不曾服內托散伏熱在心一證謂氣虛脾氣不正而嘔伏熱在心與內托散三兩帖氣虛而嘔宜嘉禾散有寒熱宜家傳正氣散兼與山藥丸以補腎謹按病機諸逆衝上嘔越皆屬於火其內托散性涼固有降火之理若嘉禾散群隊以為補虛之劑補力已少徒有溫暖助火耳山藥丸補腎以壯下焦之陰粗為近理然治嘔須分先後腫瘍時當作毒氣上攻治之潰瘍後當作陰虛補之若年老因疽潰發嘔不食者宜用參耆白朮膏峻補取效佐藥隨時隨證加減恐用山藥丸緩急未易得力河間謂諸病瘡瘍如嘔者濕氣侵於胃也藥中宜倍加白朮丹溪治一老人背疽嘔逆用補藥效方見潰瘍門豫治一男子腫瘍嘔諸藥不止用獨參湯一服嘔即愈精犀角膏治咽喉口舌生瘡昔有一貴人因疽而生此證醫者以為心臟絶盡皆辭退愚進此藥一日而安真琥珀研生犀角各一錢辰砂研茯神去木各二錢真腦子研一字人參去蘆酸棗仁去皮研各二錢上人參茯神犀角為細末入乳鉢內別研藥味和勻用煉蜜搜為膏子以瓷瓶收貯俟其疾作每服一彈子大以麥門冬去心濃煎湯化服一日連服五服取效此方潰瘍不宜用涓治發背癰疽膿潰後氣虛脾臟滑泄並四肢逆冷宜用和氣散蒼朮四兩米泔浸三日洗淨曬乾再以米醋炒令香黃色甘草炙青皮去穰各一兩良薑炒肉桂乾薑炮各半兩陳粟半升上七味為末每服一錢用炒茴香末半錢相和溫酒調下不拘時垣聖愈湯治諸惡瘡血出不止以寒水石細末摻之立止或瘡時間作黑色不可潰也藥力去盡卻紅和如血出多而心煩不安不得眠睡此亡血也此湯主之熟地生地各三錢歸身一錢半川芎二錢黃耆五分人參三分上㕮咀如麻豆大都作一服水盞半煎至一盞去渣稍熱服無時梅治背瘡肉長疾皮不及裹見風即成僵以寒水石燒研為細末敷瘡上再用銅緑細末上之肉即不作僵矣圖經古方療惡瘡癰腫或連陰髀間疼痛急攣牽入小腹不可忍一宿則殺人者用茴香苗葉搗取汁一升服之日三四用其滓以貼腫上冬中根亦可用此外國方永嘉以來用之起死神效久漏瘡丹漏瘡須先服補藥以生氣血即參耆朮歸芎為主大劑服之外以附子末唾和作餅如錢厚艾炷灸炷隨漏之大小便灸令微熱不可令痛干則易之乾者再研為末再和再灸如困則止來日再灸宜至肉平為效亦有用附片灸仍用前血氣藥作膏藥貼之經云肉之大會為谷肉之小會為溪肉分之間溪谷之會以行榮衛以會大氣邪溢氣壅脈熱肉敗榮衛不行必將為膿內銷骨髓外破大膕留於節湊必將為敗積寒留舍榮衛不養肉縮筋肋肘不得伸內為骨痹外為不仁命曰大寒留於溪谷也此用附子灸者蓋此義也梅師云腎移寒於脾發為癰疽少氣脾移寒於肝發為癰腫拘攣又云諸癰腫此皆安生岐伯曰生於八風之所變也又云地之濕氣感則害人皮肉筋脈聖濟云衣服之表易著寒所得之源大抵如此或發不變色或堅硬如石或捻之不痛久則然後變色疼痛漸耎而成膿如泔而稀久不能瘥瘡口不合變易為疳漏敗壞肌肉銷損骨髓以致痿跛宜以此骨碎補丸主之骨碎補補骨脂熟地當歸續斷石楠石斛牛膝杜仲萆薢附子芍藥川芎菟絲子沙參羌活防風獨活天麻黃耆此方與大僂方相表裡各等分為末煉蜜丸空心鹽湯服陽氣者精則養神柔則養筋開闔不得寒氣從之乃生大僂宜用羌活防風細辛附子甘草川芎續斷白芍白朮當歸桂心麻黃黃耆熟地此方與前骨碎補丸相表裡營氣不從逆於肉理乃生癰腫陷脈為瘻留連肉腠腧氣化薄傳為善畏及為驚駭全文見陰陽門精桂附丸治氣漏諸瘡桂心附子炮裂米醋中浸再炮三五次去皮臍厚朴薑製粉草炙白朮各一兩木香一分乳香研二錢上為細末煉蜜丸如桐子大空心米飲下二三十丸丹溪云精要治冷漏諸瘡與桂附丸此冷只因瘡久不合風冷乘之血氣不潮而成也厚朴雖溫其瀉衛尤速恐不若參耆佐以陳皮庶乎與病情相得此方治冷漏瘡若寒而虛者只以加味十全湯隨時令經絡加減用之為當又虛甚者宜參耆歸術膏陷脈散治漏瘡及二三十年癭瘤或大如杯盂久久不瘥致有漏潰令人骨肉消盡或堅或軟或潰令人驚惕臥寐不安體中掣痛愈而復作乾薑炮琥珀研大黃附子炮去皮各一兩丹參三分石硫黃研白石英研鍾乳粉研烏賊骨研各半兩上為末貯以瓷合韋囊勿令泄氣若瘡濕即敷無汁即煎豬脂和敷之以干為度或死肌不消加芒硝二兩益佳一法胡燕巢一枚子和小渠袁三因強寇入家傷其兩脛外廉作瘡數年不已膿汁常涓涓然但飲冷則瘡間冷水浸淫而出延為濕瘡求治戴人曰爾中焦當有緑水二三升涎數掬袁曰何也戴人曰當被盜時感驚氣入腹驚則膽傷足少陽經也兼兩外廉皆足少陽之部此膽之甲木受邪甲木色青當有緑水少陽在中焦如漚既伏驚涎在中焦飲冷水咽為驚涎所阻水隨經兩旁入瘡中故飲水瘡中水出乃上湧寒痰汗如流水次下緑水果二三升一夕而痂干真可怪也嘗治足膝下至踝漏瘡通足腫大於好足二倍行步不全用五龍丸大下之者六番每番皆五七行下後用黃柏蒼朮耆芍地草升葛星半牛膝活石桂調之近三四個月而安丹治漏瘡川芎半兩細辛二錢半白芷梢二錢半甘草細末上每日作湯服上瘡食後下瘡食前看瘡孔大小用隔年黃麻根刮去粗皮槌軟捻成繩子捻入孔中至不可入則止日淺一日瘡用好膏藥貼之本草治瘻有頭出膿水不止以啄木鳥一隻燒灰酒調服一錢匕立瘥世神應膏治久漏瘡此宋褚防禦治理宗久漏瘡諸方不效獨此膏愈之如腸毒胃毒為丸服之神效當歸一兩一錢赤芍藥大黃各一兩五錢香白芷官桂各一兩玄參一兩三錢川續斷一兩二錢莪朮一兩生地一兩二錢上九味細銼用真香油二斤浸春五日夏三日秋七日冬十日入鍋內以文武火煎令黑色濾去渣如熱天用黃丹二十兩冷月十五兩旋旋下丹不住手攪試水中沉為度不可令婦人雞犬見如漏有孔者以膏送入孔內外仍以膏攤貼之海檳榔散治癰疽瘡癤膿潰之後外觸風寒腫焮僵硬膿水清稀出而不絶肉腠空虛惡汁臭敗瘡邊干及好肌不生及療疳瘻惡瘡浸潰不斂方見瘡瘍斂瘡口藥即木香檳榔黃連等分為末敷貼也丹治漏外寒藥爐甘石童便煅牡蠣粉上為極細末敷之濟烏金散貼惡瘡疳瘻橡枓子二個內一個實黃丹一個實白礬末相合定用黑俏麻皮纏了火內燒研細加麝香少許洗淨瘡貼之垣截疳散治年深疳瘻瘡黃連半兩白蘞白芨黃丹各一兩輕粉一錢龍腦麝香另研各半兩密陀僧一兩上為細末和勻乾摻在紝上以膏貼之丹取朽骨久疽及痔漏中有者取黑骨雞脛骨上等砒霜實之鹽泥固濟火煅通紅取出地上出火毒去鹽泥用骨研細飯丸如粟米大以紙捻送入孔竅內更用膏藥貼之本雄黃治瘡瘍尚矣周禮瘍醫凡療瘍以五毒攻之鄭康成注云今醫方有五毒之藥作之用黃蝥置石膽丹砂雄黃礬石磁石其中燒三日三夜其煙上著以雞羽取之以注創惡肉破骨則盡出楊大年嘗記其事族人楊偶年少時有瘍於頰連齒輔車外腫若覆甌肉潰出膿血不輒吐之痛楚難忍療之百方彌久不瘥人語鄭法依法制藥成注之瘡中少頃取朽骨連兩牙潰出遂愈信古方攻病甚速也黃蝥即瓦盒也東久漏瘡足內踝上一寸灸三壯六壯如在上者肩井鳩尾肺脈微緩為痿瘻緩者多熱全文見治虛實法垣瘡醫自幼至老凡所經驗必須寫之嘗記疳瘻惡瘡諸藥不效者取蠐螬剪去兩頭安瘡口上以艾炷灸之七壯一易不過七枚無不效者又法用乞火婆蟲兒灸之同前法纍驗神效人皆祕之往往父子不傳
