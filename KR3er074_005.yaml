body:
  text: 卷之五陰陽臟腑部治寒熱法素陰勝則陽病陽勝則陰病陽勝則熱陰勝則寒重寒則熱重熱則寒陰陽應象論下同陽勝則身熱腠理閉喘粗為之俯仰汗不出而熱齒乾以煩冤腹滿死能冬不能夏陰勝則身寒汗出身常清數栗而寒寒則厥厥則腹滿死能夏不能冬垣諸有過切之澀者陽氣有餘也滑者陰氣有餘也陽氣有餘為身熱無汗陰氣有餘為多汗身寒陰陽有餘則無汗而身寒陰陽不足則有汗而身熱豫補此句為病之重者莫大於此如刀削肌肉危之甚不能久矣按經曰邪生於陽者得之風雨寒暑又曰陽虛生外寒陽受氣於上焦以溫皮膚分肉之間今寒氣在外則上焦不通上焦不通則寒氣獨留於外故寒栗又曰陽盛生外熱上焦不通利則皮膚緻密腠理閉塞玄府不通衛氣不得泄越故外熱經曰邪生於陰者得之飲食居處陰陽喜怒又曰陰虛生內熱有所勞倦形氣衰少穀氣不盛上焦不行下脘不通胃氣熱熱氣熏胸中故內熱又曰陰盛生內寒厥氣上逆寒氣積於胸中而不瀉不瀉則溫氣去寒獨留則血凝血凝則脈不通其脈盛大以澀故中寒余見針灸門靈視其顏色黃赤者多熱氣青白者少熱氣黑色者多血少氣五音五味篇經曰凡診絡脈脈色青則寒且痛赤則有熱胃中寒手魚際之絡多青胃中有熱魚際絡赤其暴黑者留久痹也其有赤有黑有青者寒熱氣也其青短者少氣也浮絡多青則痛多黑則痹黃赤則熱多白則寒五色皆見其寒熱也余見陰陽通論難經云數則為熱遲則為寒諸陽為熱諸陰為寒全文見診法通論經曰人迎盛則為熱虛則為寒氣口盛則脹滿寒中食不化虛則熱中出糜少氣溺色變全文見針灸虛實寒者熱之熱者寒之微者逆之甚者從之逆者正治從者反治從少從多觀其事也帝曰反治何謂岐伯曰熱因寒用寒因熱用塞因塞用通因通用必伏其所主而先其所因其始則同其終則異可使破積可使潰堅可使氣和可使必已全文見治法通論微者調之其次平之盛者奪之汗之下之寒熱溫涼衰之以屬隨其攸利全文見治法虛實王注曰假如小寒之氣溫以和之大寒之氣熱以取之甚寒之氣則下奪之奪之不已則逆折之折之不盡則求其屬以衰之小熱之氣涼以和之大熱之氣寒以取之甚熱之氣則汗發之發之不已則逆制之制之不盡則求其屬以衰之難陽盛陰虛下之則愈汗之則死此熱病也陽盛生外熱陰虛生內熱用寒藥下之仲景云桂枝下咽陽盛則斃陰盛陽虛汗之則愈下之則死此寒病也陰盛生內寒陽虛生外寒用熱藥汗之非止發汗也為助陽也仲景云承氣入胃陰盛以亡東垣云用甘藥以助升浮生長之氣素帝曰論言治寒以熱治熱以寒方士不能廢繩墨而更其術也有病熱者寒之而熱有病寒者熱之而寒二者皆在新病復起奈何岐伯曰諸病寒之而熱者取之陰熱之而寒者取之陽所謂求其屬也王注云益火之源以消陰翳壯水之主以制陽光帝曰善服寒而反熱服熱而反寒其故何也岐伯曰治其王氣是以反也帝曰不治王而然者何也岐伯曰悉哉問也不治五味屬也夫五味入胃各歸所喜故酸先入肝苦先入心甘先入脾辛先入肺咸先入腎久而增氣物化之常也氣增而久夭之由也至真要大論下同王注云入肝為溫入心為熱入肺為清入腎為寒入脾為至陰而四氣兼之皆為增其味而益其氣故久服黃連苦參而反熱者此其類也故曰久而增氣物化之常也氣增不已則臟氣偏勝氣有偏勝則臟有偏絶臟有偏絶則有暴天者故曰氣增而久夭之由也海問寒病服熱藥而寒不退熱病服寒藥而熱不退何也答曰啓玄子云熱不得寒是無水也寒不得熱是無火也寒之不寒責其無水熱之不熱責其無火經云滋其化源源既已絶藥之假焉能滋其真水火也帝曰脈從而病反者何如岐伯曰脈至而從按之不鼓諸陽皆然王注云言病熱而脈數按之不鼓動乃寒盛格陽而致之非熱也此一節言症屬陽脈亦從症雖屬熱而病反寒也諸陽皆然謂三陽緊數而不鼓太陽標本不同之脈也帝曰諸陰之反何如岐伯曰脈至而從按之鼓盛而甚也王注云形症皆寒按之而脈氣鼓擊於指下盛此為熱盛拒陰而生病非寒也此一節言症屬寒脈亦從症雖屬寒而病反熱也是故百病之起有生於本者有生於標者有生於中氣者有取本而得者有取標而得者有取中氣而得者有取標本而得者有逆取而得者有從取而得者逆正順也若順逆也故曰知標與本用之不殆明知逆順正行無問此之謂也不知是者不足以言診足以亂經故大要曰粗工嘻嘻以為可知言熱未已寒病復始同氣異形迷診亂經此之謂也夫標本之道要而博小而大可以一言而知百病之害言標與本易而勿損察本與標氣可令調明知勝復為萬民式天之道畢矣六氣之病標本相反者唯太陽少陰之病為最蓋太陽標陽本寒少陰標陰本熱王注釋諸陽脈至而從為病熱脈數者太陽之標也按之不鼓為寒盛格陽者寒水之本與標相反也釋諸陰脈至而從為脈證是寒者少陰之標也按之鼓甚為熱甚拒陰者君火之本與標相反也是故不知相反者逆標氣之陰陽而正治則順本氣之寒熱而病加知相反者順標氣之陰陽而反治則逆本氣之寒熱而病愈故曰逆正順也知標與本用之不殆明知逆順正行無問也右脈從病反言症似陽者脈亦從症似陽而其病反是寒也症似陰者脈亦從症似陰而其病反是熱也故皆反其脈症施治如身熱微熱煩躁面赤其脈沉而微者陰症似陽也身熱者裡寒故也煩躁者陰盛故也面戴陽者下虛故也若醫者不知脈誤為實熱反與涼藥則氣消成大病矣外臺祕要云陰盛發躁名曰陰躁欲坐井中宜以熱藥治之故仲景少陰症面赤者四逆湯加蔥白治之東垣云寒涼之藥入腹周身之火得水則升走陰燥之極故欲坐井中是陰已先亡醫猶不悟復認為熱重以寒藥投之其死也何疑焉逆氣象陽全文見五臟垣或因吐因嘔因嗽而發躁蒸蒸身熱如坐甑中欲得去衣居寒處或飲寒水則便如故振寒復至則氣短促速胸中滿悶欲絶甚則口開目瞪聲聞於外而淚涕涎痰大作其發躁須臾而已如前六脈細弦而澀按之而虛此大寒症也以辛甘寒甘溫之劑大瀉南方北方則愈活手足逆冷大便祕小便赤或大便黑色脈沉而滑者陽症似陰也輕者白虎湯重者承氣湯傷寒失下血氣不通令四肢逆冷此是伏熱深故厥亦深速以大承氣湯加膩粉下之汗出立愈蓋熱厥與陰厥自不同熱厥者微厥即發熱陰厥即不發熱四肢逆冷惡寒脈沉細大小便滑泄上二節言症似陽而脈病屬陰症似陰而脈病屬陽故反其症而治之蓋症似陽而脈病屬陰者世尚能辨若脈症俱是陰而病獨屬陽者舉世莫辨而致夭折者滔滔皆是許學士云熙寧中邠守迪因其猶子病傷寒見其煩渴而汗多以涼藥治之遂成陰毒數日卒迪痛悼之遂著陰毒形症訣三篇蓋傷世之意深矣垣足太陽膀胱之經乃熱因寒用且膀胱本寒其經老陽也太陽為標有陽之名無陽之實謂其將變陰也其脈緊而數按之不鼓而空虛是外見虛陽而內有真寒也故仲景以姜附湯久久熟煎不溫服而寒服之亦是寒治也薑附氣味俱陽加之久久熟煎取重陽之熱瀉純陰之寒是治其本也不溫服而寒服此以假寒治太陽標之假陽也故為真假相對之治法因藥處治者當知其脈之空虛則是內伏陰寒之氣外顯熱症大渴引飲目赤口乾面赤身熱四肢熱如火者此浮陽將絶於外而內則為寒所拒也手少陰心之經乃寒因熱用且少陰之經真陰其心病根本是真火也故曰少陰經標陰本熱是內則心陽為本外則真陰為標其脈沉細按之洪大緊甚而盛者心火在內則緊甚洪大真陰為標則得脈之沉細寒水之體也故仲景以大承氣湯酒製大黃煎成熱服之以除標寒用大黃芒硝辛苦大寒之氣味以瀉本熱以此用藥可以為萬世法矣素治熱以寒溫而行之五常政大論即寒因熱用之類如前大黃芒硝大寒之藥熱服是已丹溪治色目婦人惡寒用八物湯去芎加炒柏治之反劇知其病熱深而藥無反佐之過也仍取前藥熟炒與之而愈此治熱以寒借火之力溫而行之也垣治熱以寒溫而行之有三皆因大熱在身止用黃耆人參甘草此三味者皆甘溫雖表裡皆熱燥發於內捫之肌熱於外能和之汗自出而解矣此溫能除大熱之至理一也熱極生風乃左遷入地補母以虛其子使天道右遷順行諸病得天令行而必愈二也況大熱在上其大寒必伏於內溫能退寒以助地氣地氣者在人乃胃之生氣使真氣旺三也素治寒以熱涼而行之即熱因寒用之類如用乾薑附子大熱之藥須冷服是已仲景治少陰病下痢脈微者與白虎湯痢不止厥逆無脈乾嘔煩熱白通加豬膽汁湯主之此治寒以熱借膽汁之涼而行之也東垣治寒以熱涼而行之有三北方之人為大寒所傷其足脛脹乃寒勝則浮理之然也若火炙湯浴必脫毛見骨須先以新汲水浴之則時見完復矣更有大寒凍其面或耳若近火湯必脫皮成瘡須先於涼房處浴之少時以溫手尉烙必能完復此涼而行之除其大寒之理一也大寒之氣必令母實乃地道左遷入肺逆行於天以涼藥投之使天道右遷而順天令諸病得天令行而必愈二也況大寒在外其大熱伏於地下者乃三焦包絡天真之氣所居之根蒂也熱伏於中元氣必傷在人之身乃胃也以涼藥和之則元氣充盛而不傷三也丹惡寒非寒惡熱非熱論經曰惡寒戰栗者皆屬於熱又曰戰栗如喪神守皆屬於火惡寒者雖當炎月若遇風霜重綿在身如覺凜凜戰栗如喪神守惡寒之甚也原病式曰病熱症而反覺自冷此為病熱實非寒也或曰往往見有服熱藥而可愈者何也病熱之人其氣炎上郁為痰飲抑遏清道陰氣不升病熱尤甚積痰得熱亦為暫退熱勢助邪其病益深或曰寒勢如此誰敢以寒涼藥與之非殺而何豫曰古人遇戰栗之症有以大承氣湯下燥糞而愈者惡寒戰栗明是熱症但有虛實之分耳經曰陰虛則發熱夫陽在外為陰之衛陰在內為陽之守精神外馳嗜欲無節陰氣耗散陽無所附遂致浮散於肌表之間而惡熱實非有熱當作陰虛治之而用補養之法可也或曰傷寒惡寒惡熱者亦是耶豫曰若病傷寒者自外入內先賢論之詳矣愚奚庸贅治發熱丹火鬱當看熱在何經輕者可降重者則隨其性而升之人虛火盛顛者用生薑湯若投以冰水正治之立死實火可瀉小便降火極速有補陰即火自降炒柏地黃之類凡氣有餘便是火急甚者必緩之生甘草兼瀉兼緩參術亦可凡火盛者不可驟用寒涼藥必兼溫散之左金丸治肝火用黃連六兩吳茱萸一兩陰虛火動難治吃酒人發熱難治不飲酒人因酒發熱者難治一男子二十三歲因酒發熱用青黛栝蔞仁入薑汁每日數匙入口中三兩月而愈垣小兒癍後餘熱不退痂不收斂大便不行是謂血燥則當以陰藥治之因而補之用清涼飲子通大便而瀉其熱潔古云涼風至而草木實夫清涼飲子乃秋風徹熱之劑也此甘寒瀉火也傷寒表邪入於裡日晡潮熱大渴引飲譫語狂躁不大便是胃實乃可攻之夫胃氣為熱所傷以承氣湯瀉其上實元氣乃得周流承氣之名於此具矣此苦寒瀉濕熱也今世人以苦泄火故備陳之除熱瀉火非甘寒不可以苦寒瀉火非徒無益而反害之故有大熱脈洪大服苦寒劑而熱不退者加石膏如症退而脈數不退洪大而病有加者宜減苦寒加石膏如大便軟或泄者加桔梗食後服之此藥誤用則其害非細用者旋旋加之如食少者不可用石膏石膏善能去脈數如病退而脈數不退者不治海大熱而脈反細小不可下者瀉心湯主之脈有力可用之骨肉筋血皮毛陰足而熱反勝之是謂實熱垣能食而熱口舌乾燥大便難者實熱也以辛苦大寒之劑下之瀉熱補陰經云陽盛陰虛下之則愈脈洪盛而有力者是已丹人壯氣實火盛顛狂者可用正治芒硝冰水之類飲之海骨痿肉燥筋緩血枯皮聚毛落陰不足而有熱疾是謂虛熱垣不能食而熱自汗氣短者虛熱也以甘寒之劑瀉熱補氣經云治熱以寒溫而行之脈虛弱無力者是已當歸補血湯治婦人肌熱大渴引飲目赤面紅晝夜不息其脈洪大而虛重按全無內經曰脈虛血虛脈實血實又云血虛發熱是也症象白虎惟脈不長實難辨也誤服白虎湯必死此病得於飢困勞役黃耆一兩當歸二錢酒洗上銼作一服水二盞煎至一盞去渣稍熱空心服之補中益氣湯治飲食勞倦所傷始為熱中蓋人受水穀之氣以生所謂清氣營氣運氣衛氣春升之氣皆胃氣之別名也夫胃氣為水穀之海飲食入胃遊溢精氣上輸於脾脾氣散精上歸於肺通調水道下輸膀胱水精四布五經並行合於四時五臟陰陽揆度以為常也若飲食失節寒溫不適則脾胃乃傷喜怒憂恐損耗元氣脾胃氣衰元氣不足而心火獨盛心火者陰火也起於下焦其繫系於心心不主令相火代之相火包絡之火元氣之賊也火與元氣不兩立一勝則一負脾胃氣虛則下流於腎陰火得以乘其土位故脾症始得則氣高而喘身熱而煩其脈洪大而頭痛或渴不止其皮膚不任風寒而生寒熱蓋陰火上衝則氣高喘而煩熱為頭痛為渴而脈洪脾胃之氣下流使穀氣不得升浮是春生之令不行則無陽以護其營衛故不任風寒乃生寒熱此皆脾胃之氣不足所致也然與外感風寒之症頗同而實異內傷脾胃乃傷其氣外感風寒乃傷其形傷其外則有餘有餘者瀉之傷其內則不足不足者補之汗之下之吐之克之之類皆瀉也溫之和之調之養之之類皆補也內傷不足之病苟誤認作外感有餘之症而反瀉之則虛其虛也實實虛虛如此死者醫殺之耳然則奈何唯當以辛甘溫劑補其中而升其陽甘寒以瀉其火則愈矣經曰勞者溫之損者溫之又曰溫能除大熱大忌苦寒之藥損其脾胃脾胃之症始得則熱中今立法治始得之症黃耆病甚熱甚者一錢人參三分有嗽去之甘草五分炙當歸身二分酒製橘皮二分升麻二分柴胡二分白朮三分上㕮咀作一服水二盞煎至一盞量氣弱氣盛臨病斟酌水盞大小去渣食遠稍熱服如傷重者不過二服而愈若病久者以權立加減法治之如腹中痛者加白芍五分炙甘草三分惡寒冷痛者加中桂去皮二分如惡熱喜寒而腹痛者於已加芍藥甘草中更加生黃芩三分或二分或夏月腹痛而不惡熱者亦然治時熱也若天涼惡熱而痛於加白芍甘草黃芩中更加桂少許天寒腹痛去芍藥味酸寒故也加益智仁三分或加半夏五分生薑三片如頭痛加蔓荊子三二分痛甚者加川芎二分頂痛腦痛加藁本三分或五分若苦頭痛者加細辛二分諸頭痛者並用此四味足矣若頭上有熱則此不能治別以清空膏治之如臍下痛者加真熟地五分其痛立止如不止者乃大寒也更加肉桂去皮三分或二分內經所說小腹痛皆寒症從復法相報中來也經曰大勝必大復從熱病中變而作也非傷寒厥陰之症也仲景用抵當湯並丸主之乃血結下焦膀胱也如胸中氣壅滯加青皮二分氣促少氣者去之如身有疼痛者屬濕若身重者亦濕加去桂五苓散一錢如風濕相搏一身盡痛加羌活防風各五分升麻藁本根蒼朮各一錢勿用五苓散所以然者為風藥已能勝濕故別作一服與之如病去勿再服以治風之藥大損元氣而益其病故也如大便祕澀加當歸梢一錢如閉澀不行煎成正藥先用一口調玄明粉半錢或一錢得行則止此病不宜下下之恐變成凶症也如久病痰嗽者去人參初病者勿去冬月春寒或秋涼時各宜加不去節麻黃半錢如春令大溫則加佛耳草三分款冬花二分如夏月病嗽加五味子三分去心麥冬二分或三分如舌上白滑苔是胸中有寒勿用之如夏月不嗽亦加人參三二分並五味子麥冬各等分救肺受火邪也如病人能食而心下痞加黃連二分或三分如不能食而心下痞勿用如脅下痛或急縮者俱加柴胡甘草上一方加減是飲食勞倦喜怒不節始病熱中則可用之若末傳寒中則不可用也蓋甘酸適足益其病耳如黃耆人參甘草芍藥五味之類是也垣氣運衰旺圖濕胃化熱小腸長風膽生皆陷下不足先補則用黃耆甘草當歸升麻柴胡人參乃辛甘發散以助春夏生長之用者也土脾形火心神木肝血皆大盛上乘生長之氣後瀉則用甘草梢之甘寒瀉肺火逆於胸中傷氣者也黃芩之苦寒以泄胸中之熱喘氣上奔者也紅花以破惡血用黃芩大補腎水益肺氣瀉血中火燥者也寒膀胱藏氣燥大腸收氣皆大旺後瀉則用黃耆之甘溫止自汗實表虛使不受寒邪當歸之辛溫能潤燥更加桃仁以通幽門閉塞利其陰路除大便之難燥者也水腎精金肺氣皆虛衰不足先補則用黃柏之苦寒除濕熱為痿乘於腎救足膝無力亦除陰汗陰痿而益精甘草梢黃芩補肺氣泄陰火之下行腎苦氣上逆急食苦以泄之也此初受熱中常治之法也非權也權者臨病制宜之謂也海晝熱則行陽二十五度大抵柴胡飲子夜熱則行陰二十五度大抵四順飲子又云一身盡熱或日晡潮熱或夜則行陰發熱者皆血熱也四順飲子或桃仁承氣湯選而用之當視其由表入里腹痛血刺痛腹中有無轉矢氣之異平旦發熱熱在行陽之分肺氣主之故用白虎湯以瀉氣中之火又云白虎治脈洪故抑之使秋氣得以下降也日晡潮熱熱在行陰之分腎氣主之故用地骨皮以瀉血中之火又云地骨皮散治脈弦故舉之使春氣得以上升也按地骨皮散治虛熱方也氣分熱柴胡飲子白虎湯血分熱清涼飲子即四順散桃仁承氣湯垣牽牛味辛烈能瀉氣中之濕熱不能除血中之濕熱防己味苦寒能瀉血中之濕熱又通血中之滯塞柴胡飲子方見勞熱白虎湯方見傷寒地骨皮散方見骨蒸門清涼飲子大黃蒸甘草炙當歸洗芍藥洗各等分上㕮咀每服五錢薄荷十葉水一盞半同煎至七分去渣溫服桃仁承氣湯方見傷寒丹人病脈虛氣鬱發熱芍藥酒炒一兩二錢五分香附一兩蒼朮半兩沙參三錢甘草一錢五分上炊餅丸服脈滑腸有宿食常暮發熱明日復止者於宿食門求之濕痿夜熱以三補丸加白芍藥為丸三補丸方黃芩黃柏黃連為末粥糊為丸潔有表而熱者謂之表熱無表而熱者謂之裡熱故苦者以治五臟五臟屬陰而居於內辛者以治六腑六腑屬陽而在於外故曰內者下之外者發之又宜養血益陰身熱自除以脈言之浮數為外熱沉數為內熱浮大有力為外熱沉大有力為內熱仲熱在上焦者因咳為肺痿熱在中焦者為堅熱在下焦者為尿血亦令淋閉不通肘前熱者腰以上熱手前獨熱者腰以下熱肘前獨熱者膺前熱肘後獨熱者肩背熱臂中獨熱者腰腹熱肘後以下三四寸熱者腸中有蟲掌中熱者腹中亦熱全文見診法海三焦熱用藥大例上焦熱梔子黃芩中焦熱小便不利黃連芍藥下焦熱黃柏大黃上焦熱清神散連翹防風湯涼膈散龍腦飲子犀角地黃湯中焦熱小承氣湯調胃承氣湯洗心散四順清涼飲桃仁承氣湯下焦熱大承氣湯五苓散立效散八正散石葦散四物湯身熱脈洪無汗多渴者熱在上焦宜桔梗湯桔梗連翹山梔薄荷黃芩甘草各等分上為粗末竹葉白水煎溫服汗之熱服春倍加防風羌活夏倍加黃芩知母季夏淫雨倍加羌活秋加桂五錢冬加桂一兩亦可以意消息隨症增損而用之局清神散消風壅化痰涎治頭目眩面熱檀香挫人參去蘆羌活去苗防風去蘆各一兩薄荷去土甘草荊芥穗各二兩石膏研四兩細辛去苗焙五錢上為末每服二錢沸湯點服或入茶末點服此方虛熱可用龍腦飲子治蘊積邪熱咽喉腫痛眼赤口瘡心煩鼻衄丹溪云上中二焦藥也砂仁栝蔞根各三兩藿香葉二兩四錢石膏四兩甘草蜜炙六兩梔子微炒十二兩上為末每服二錢至三錢用新汲水入蜜調下無擇加減涼膈散退六經熱丹溪云涼膈散心肺脾胃藥也易老涼膈散減大黃芒硝加桔梗甘草一法加防風同為舟楫之劑浮而上之治胸膈中與六經之熱以手足少陽之氣俱下膈絡胸中三焦之氣同相火遊於身之表膈與六經乃至高之分此藥浮載亦至高之劑故施於無形之中隨高而走去胸膈中及六經之熱也涼膈散梔子仁一兩五錢芒硝半兩連翹薄荷黃芩甘草各一兩半大黃五錢上為粗末每一兩水二盞竹葉七片同煎至一盞去渣入蜜少許食後服加姜煎亦得去六經熱減大黃芒硝加桔梗甘草人參防風治肺經邪氣咳嗽有痰加半夏涼膈與四物湯各半服能益血泄熱名雙和散錢氏去連翹加藿香石膏為瀉黃散本事方治大人小兒五臟積熱煩躁多渴唇裂喉閉目赤鼻頷結硬口舌生瘡陽明症傷寒發狂見鬼譫語大小便閉一切風壅並皆治之山梔仁甘草赤芍藥各一兩大黃朴硝連翹薄荷淨葉乾葛各二兩上為散每服二錢水一盞入竹葉七片蜜三匙同煎至七分去渣食後服唯陽明症傷寒忌下此藥局方亦載緣味數與用藥大段不同豫一侄婦忽患熱病欲死付之一服立效後來纍服纍驗幸毋忽又方白朮荊芥赤芍藥各三兩大黃車前子生用木通甘草當歸各二兩上為細末大便祕結米泔調空心服三錢上膈壅熱或生赤丹或生癰癤用水二盞煎六分若小便結如淋狀用蘆根打碎洗淨煎湯下五心煩熱用生薑一片同煎服效小承氣湯方見傷寒調胃承氣湯方見傷寒四順飲子方見前氣血桃仁承氣湯方見傷寒大承氣湯方見傷寒立效散治下焦結熱小便黃赤淋閉疼痛或出血山梔炒半兩瞿麥穗一兩甘草炙三分上為末每服五錢水一碗入連須蔥根七個燈心五十莖生薑七片同煎至七分溫服石葦散治膀胱有熱水道淋澀或尿如豆汁及出砂石石葦木通滑石王不留行各二兩甘草梢一兩當歸白朮瞿麥芍藥葵子各三兩黃耆二兩上為細末每服煎湯調下空心服經云胃足陽明之脈氣盛則身以前皆熱當取足三里等穴全文見刺灸素帝曰人有四肢熱逢風寒如炙如火者何也岐伯曰是人者陰氣虛陽氣盛四肢者陽也兩陽相得而陰氣虛少少水不能滅盛火而陽獨治獨治者不能生長也獨勝而止耳逢風如炙如火者是人當肉爍也見逆調論爍消削也仲三物黃芩湯治婦人四肢煩熱方見産煩丹治手足心熱用東垣火鬱湯方見後火鬱熱條治手足心熱此方神妙梔子香附蒼朮白芷半夏川芎上用神麯糊丸垣身熱有五不同論五臟有邪各有身熱其狀各異以手捫摸有三法以輕手捫之則熱重按之則不熱是熱在皮毛血脈也重按至筋骨之分則熱蒸手極甚輕摸之則不熱是熱在筋骨間也輕手捫之則不熱重手加力按之亦不熱不輕不重按之而熱是熱在筋骨之上皮毛血脈之下乃熱在肌肉也此謂三法以三黃丸通治之細分之則五臟各異矣肺熱者輕手乃得微按全無瞥瞥然見於皮毛上為肺主皮毛故也日西尤甚乃皮毛之熱也其症必見喘咳灑淅寒熱輕者瀉白散重者涼膈散白虎湯之類治之及地黃地骨皮散心熱者心主血脈微按至皮膚之下肌肉之上輕手乃得微按至皮毛之下則熱少加力按之則全不熱是熱在血脈也日中太甚乃心之熱也其症煩心心痛掌中熱而噦以黃連瀉心湯導赤散硃砂丸安神丸清涼散之類治之脾熱者輕手捫之不熱重按至筋骨又不熱不輕不重在輕手重手之間此熱在肌肉遇夜尤甚其症必怠惰嗜臥四肢不收無氣以動以瀉黃散調胃承氣湯治實熱用之人參黃耆散補中益胃湯治中虛有熱者用之肝熱者按之肌肉之下至骨之上乃肝之熱寅卯間尤甚者其脈弦其病四肢滿悶便難轉筋多怒多驚四肢困熱筋痿不能起於床瀉青丸柴胡飲之類治之兩手脈弦者或寅申發者皆肝熱也俱宜用之腎熱者輕按之不熱重按之至骨其熱蒸手如火如炙其人骨蘇蘇然如蟲蝕其骨困熱不任亦不能起於床滋腎丸六味地黃丸主之以脈言之則輕按之如三菽之重與皮毛相得而數者肺熱也如六菽之重與血脈相得而數者心熱也如九菽之重與肌相得而數者脾熱也如十二菽之重與筋相得而數者肝熱也按之至骨舉指來疾而數者腎熱也黃連瀉心火木通瀉小腸火黃芩瀉肺火黃芩瀉大腸火柴胡瀉肝火黃連佐之柴胡瀉膽火亦佐以黃連白芍藥瀉脾火石膏瀉胃火知母瀉腎火黃柏瀉膀胱火一曰瀉龍火海皮膚如火燎而以手重取之不甚熱肺熱也目白睛赤煩躁引飲單與黃芩一物湯丹清金丸伐脾肺火黃芩為末粥丸又名與點丸上二方瀉肺中血分之火瀉白散瀉肺中氣分之火錢瀉白散方見治虛實法五臟條涼膈散白虎湯方俱見前瀉心湯瀉丁方見治虛實法五臟條丹抑青丸伐心經之火須審虛實用之黃連為末粥丸本事方治心熱千金地黃丸黃連四兩為粗末生地半斤研取汁連渣並二味拌勻曬乾上為細末煉蜜丸如桐子大每服三十丸食後門冬湯下門冬丸治心經有熱麥冬一兩黃連半兩上為細末蜜丸如桐子大食後熟水下三十丸海清心丸治熱黃柏二兩生麥冬一兩黃連一兩龍腦一錢煉蜜丸如桐子大每服十丸臨臥門冬酒下或薄荷湯亦得錢導赤散瀉丙方見治虛實法五臟條海火府丹丙丁俱瀉黃芩一兩黃連一兩生地二兩木通三兩為細末煉蜜如梧子大每服二三十丸臨臥溫水下錢瀉黃散方見治虛實法五臟條調胃承氣湯方見傷寒瀉青丸方見治虛實五臟條當陽龍薈丸當歸焙草龍膽山梔黃連黃柏黃芩各一兩大黃蘆薈青黛各半兩木香二錢半麝香半錢另研上為末煉蜜丸如小豆大小兒如麻子大生薑湯下二三十丸忌發熱諸物兼服防風通聖散丹回金丸伐肝經火亦審虛實用之黃連六兩吳茱萸一兩上為末粥丸佐金丸佐肺金以伐肝木之邪片芩六兩吳茱萸一兩上為末蒸餅丸垣滋腎丸黃柏二兩酒洗焙知母二兩酒洗焙肉桂二錢上為末熟水丸如雞頭大每服百丸加至二百丸白沸湯下空心服治腎熱諸方並見勞瘵靈胃中熱則消穀令人懸心善飢臍以上皮熱腸中熱則出黃如糜臍以下皮熱師傳篇胃居臍上故胃熱則臍以上熱腸居臍下故腸熱則臍以下熱如肝膽居脅肝膽熱則當脅亦熱肺居胸背肺熱則當胸背亦熱腎居腰腎熱則當腰亦熱可類推也潔暴熱者病在心肺積熱者病在腎肝暴熱者宜局方雄黃解毒丸積熱者宜局方妙香丸暴者上喘也病在心肺謂之高喘宜木香金鈴子散上焦熱而煩者宜牛黃散有病久憔悴發熱盜汗謂之五臟齊損此熱勞骨蒸之病也瘦弱虛損煩喘腸澼下血皆蒸勞也治法宜養血益陰熱能自退此謂不治而治也錢氏地黃丸主之雄黃解毒丸治上膈壅熱痰涎不利咽喉腫痛赤眼癰腫方見喉痹保木香金鈴散治暴熱心肺上喘不已大黃五錢金鈴子去核木香各三錢輕粉少許朴硝二錢上為末柳白皮煎湯調下食後三四錢以利為度牛黃散治上焦熱而煩不能臥睡山梔大黃鬱金各半兩甘草上為末每五錢水煎溫服微利則已局妙香丸丹溪云疏決腸胃制伏木火之劑辰砂水飛八兩龍腦膩粉研麝香研各八兩牛黃半兩金箔九十片研巴豆三百十五粒去皮心膜炒熟研如泥去油上合研勻用淨黃蠟六兩入白礬七錢半同煉蜜勻為丸每兩作三十丸米飲吞下如要藥速行即用針刺一眼入冷水浸少時服之久熱屬勞瘵治法見瘵門諸熱分而言之則有氣血表裡上下五臟之異合而言之則氣熱表熱上焦熱心肺熱皆屬陽而治相類血熱裡熱下焦熱腎肝熱皆屬陰而治亦相類中焦與脾熱亦然羅通治熱氣用黃連解毒湯治大熱甚煩躁錯語不得眠黃連七錢半黃柏山梔各半兩黃芩一兩上㕮咀每服五錢水煎去渣熱服如未效再服海前方中加防風連翹為金花丸治風熱加柴胡治小兒潮熱與四物相合各半為湯治婦人潮熱垣三黃丸治丈夫婦人三焦積熱上焦有熱攻衝眼目赤腫頭項腫痛口舌生瘡中焦有熱心膈煩躁飲食不美下焦有熱小便赤澀大便祕結五臟俱熱即生癰癤瘡痍及治五般痔疾糞門腫痛或下鮮血丹溪云此三焦藥也黃連淨黃芩去蘆大黃各十兩上為細末煉蜜丸如桐子大每服三十丸熟水吞下視臟腑虛實加減服之小兒積熱亦宜服本事紫雪治腳氣毒遍內外煩熱不解口中生瘡狂易叫走瘴毒及解諸熱藥毒卒黃等毒並蠱魅野道熱毒又治小兒驚疳熱病丹溪云此心脾肝腎胃經之藥寒水石石膏磁石滑石以上四味各三斤搗為細末用水一石煎至五斗去渣入後藥玄參一斤洗焙切沉香羚羊角犀角青木香升麻各五兩丁香一兩甘草八兩以上八味搗為末入前藥汁中再煮取一斗五升去渣入下項二味藥朴硝硝石好者二斤以上二味入前藥汁中微火煎不住手將柳木棍攪候七八升許投在盞中半日後欲凝方入下項二味藥辰砂三兩細研麝香真者一兩二錢乳研以上二味入前藥汁中拌調令勻合成後窨二日每服一錢或二錢冷水食後調服大人小兒子細加減局方又用黃金一百兩垣陰覆乎陽火不得伸宜汗之經曰體若燔炭汗出而散者是也脈弦而數者此陰氣也宜風藥升陽以發火鬱則脈數峻退矣凡治此病脈數者當用黃柏少加黃連柴胡蒼朮黃耆甘草更加升麻得汗則脈必下乃火鬱則發之意也柴胡升陽湯治男婦四肢發熱肌肉熱筋痹熱骨髓中熱發如火燎火燒捫之令人亦熱四肢主屬脾脾者土也熱伏地中此病多因血虛而得又因胃虛過食冷物冰水無度郁遏陽氣於脾土之中經曰火鬱則發之升麻葛根獨活羌活各半兩防風二錢半甘草生二錢柴胡五錢炙甘草二錢人參半兩白芍藥半兩上㕮咀每服半兩水三大盞煎至一盞去渣稍熱服忌冷物冰水月餘垣火鬱湯治五心煩熱是火鬱於地中四肢土也心火下陷在脾土之中故宜升發火鬱丹溪云治手足心熱用東垣火鬱湯又手足心熱方見前手足心熱條升麻葛根防風柴胡根炙甘草白芍藥各五錢上㕮咀每服三四錢水二大盞入連須蔥白三寸煎去渣稍熱服運氣發熱有三一曰火熱助心實而熱經曰歲火太過炎暑流行病甚則身熱骨痛而為浸淫又曰少陽所至為瘍疹身熱又曰少陰司天客勝則頭痛是少陽之發熱治以諸寒是也二曰寒邪攻心虛而熱經曰歲水太過寒氣流行民病身熱煩心躁悸陰厥又曰歲金不及炎火乃行寒復則陰厥且格陽反上行發熱又曰少陽在泉主勝則熱反上行熱發格中而嘔蓋主勝者謂冬寒勝少陽之客熱治以諸熱是也三曰風扇火及寒濕鬱火而熱經曰太陽司天之政初之氣氣乃大溫民病身熱頭痛是風扇陽而熱也治宜清之又云四之氣風濕交爭民病大熱少氣又云少陽司天之政二之氣火反郁白埃四起民病頭痛身熱是寒濕鬱火而熱治視寒熱少多其制是也靈黃帝曰刺節言徹衣夫子乃言盡刺諸陽之奇輸未有常處也願卒聞之歧伯曰是陽氣有餘而陰氣不足陰氣不足則內熱陽氣有餘則外熱內熱相搏熱於懷炭外畏綿帛近不可近身又不可近席腠理閉塞則汗不出舌焦唇槁臘干嗌燥飲食不讓美惡帝曰善取之奈何岐伯曰取之於其天府大杼三痏又刺中膂以去其熱補手足太陰以去其汗熱去汗稀疾於徹衣刺節真邪篇臘思亦切火熱在上推而下之從下上者引而去之甲身熱胸脅痛不可反側顱息主之嗜臥身體熱不能動搖大濕三陽絡主之海兩手太熱為骨厥如在火中可灸湧泉穴三壯立安撮要手心發熱魚際臥針向後三分少府三分腳心發熱濕癢束骨先瀉後補灸足底發熱腳核疼公孫半寸瀉素脈浮而澀澀而身有熱者死通評虛實論熱而脈靜者難治玉機真藏論脈盛汗出不解者死脈虛熱不止者死詳見傷寒發熱勞瘵骨蒸熱玄虛者皮毛肌肉筋脈骨髓氣血津液不足也若男女終日勞役神耗力倦飢飽越常喜怒憂思形寒飲冷縱欲恣情素問曰今人未及半百而衰者以酒為漿以妄為常醉以入房以欲竭其精以耗散其真根源從此而虛竭矣五臟六腑如何不弱五勞六極七傷從此而始何謂五勞心勞血損肝勞神損脾勞食損肺勞氣損腎勞精損六極謂筋脈肉皮毛骨瘁損是謂六極七傷難經言之甚詳傷形與氣謂之七傷總而言之為虛是也大抵五行六氣水特五之一耳夫一水既虧豈能勝五火哉虛勞等症蜂起矣其體虛者最易感於邪氣當先和解微利微下之從其緩而治之次則調之醫者不知邪氣加之於身而未除便行補劑邪氣得補遂入經絡致死不治如此誤者何啻千萬良可悲哉內經中本無勞症之說其曰勞者溫之溫者溫存之義不足者補之以味穀肉菜果百味珍羞無非補也今之醫者不通其法唯知大補之道輕則當歸鹿茸雄附重則乳石丹砂加之以灼艾補燥其水水得熱愈涸生火轉甚少而成嗽痰血潮熱煩渴喜冷此則熱症明矣重則失音斷不可救猶且峻補不已如此死者醫殺之耳及遇良工治驗而以清劑解之不合病人之意反行怪責及聞發表攻裡之說畏而不從甘死於庸工熱補之手雖死不悔深可憫也夫涼劑能養水清火熱劑能燥水補火天下之事無出乎理理既明何患疾之不安勞為熱症明矣還可補乎惟無邪無熱無積之人脈舉按無力而弱者方可補之又必察其胃中及右腎二火虧而用之心虛則動悸恍惚憂煩少色舌強宜養榮湯琥珀定神丸之類以益其心血脾虛面黃肌瘦吐利清冷腹脹腸鳴四肢無力飲食不進宜快胃湯進食丸之類以調其飲食肝虛目昏筋脈拘攣面青恐懼如人將捕之狀宜牛膝益中湯虎骨丹之類以養助其筋脈肺虛呼吸少氣喘乏咳嗽嗌乾宜枳實湯加人參黃耆阿膠蘇子以調其氣腎虛腰背脊膝厥逆而痛神困耳鳴小便頻數精漏宜八味丸加五味子鹿茸去附子用山藥等丸以生其精丹勞瘵主陰虛痰與血病虛勞漸瘦屬火陰火消鑠即是積熱宜照後法治之草還丹治陰虛骨蒸用青蒿一斗五升童便三斗文武火熬約童便減至二斗去蒿再熬至一升入豬膽七個再熬數沸用甘草末收和為丸梧子大每服五十丸治勞病四物湯加竹瀝入小便陰虛發熱四物湯加黃柏降火補陰甚者加龜板張文仲治骨蒸方生地黃一升搗取汁盡分再服利則減之以身涼為度上丹溪論勞瘵主乎陰虛者蓋自子至巳屬陽自午至亥屬陰陰虛則熱在午後子前寤屬陽寐屬陰陰虛則汗從寐時盜出也升屬陽降屬陰陰虛則氣不降氣不降則痰涎上逆而連綿吐出不絶也脈浮屬陽沉屬陰陰虛則浮之洪大沉之空虛也此皆陰虛之症用四物竹瀝又加炒柏龜板皆補陰降火之劑又須遠嗜欲薄滋味靜心調養以助之也丹陰虛發熱四物湯加黃柏兼氣虛者加參耆白朮御院瓊玉膏滋血補氣延年益壽人參三十六兩去蘆須研為淨末白茯苓二十四兩去皮研為細末生地黃十六斤搗取汁以盡為度去渣蜜六斤上和勻入銀石器瓶中內用油紙外用竹箬包以軟篾縛緊瓶口入重湯內懸胎煮之用桑柴文武火不住手三晝夜入井中浸一日夜出火毒又煮一日出陰毒取出每早空心用酒或白湯調下羅清神甘露丸治男子婦人虛勞不足大骨枯大肉陷皆治之生地汁白蓮藕汁生乳汁生用上三味等分用砂石器內以文武火熬成膏子用後藥人參白朮黃連黃耆五味子胡黃連上各等分為細末以前膏子和劑丸如桐子大每服五十丸人參湯下海黃耆膏子煎丸人參白朮各一兩半柴胡黃芩各一兩白芷知母各半兩甘草半兩炒鱉甲一兩手大者酥炙黃耆半斤為粗末用水二斗熬一斗去渣再熬令不住手攪成膏至半斤入白蜜一匙餳一兩再熬令熟放冷丸藥上為末用黃耆膏和勻丸每早白湯服下呼吸少氣懶言語無力動作目無睛光面色㿠白皆兼氣虛也丹補天丸治陰虛骨蒸發熱形羸瘦者紫河車洗淨用布絞乾用補腎丸藥末搗細焙乾再碾為末酒煮米糊為丸梧子大每服七八十丸熱湯下夏月加五味子紫河車即初生男子胞衣也補腎丸治陰虛有痰膈不清者龜板一兩半酥炙黃柏一兩半炒牛膝二兩乾薑二錢陳皮半兩上為末薑汁打糊丸每服七八十丸治酒色過傷少陰黃柏一兩半炒黃芩半兩炒地黃一兩龜板五兩酒炒夏加砂仁三錢五味五錢冬加乾薑炒黑三錢用炊餅為丸食前白湯服三五十丸丹溪心法以地黃作黃柏潔地黃丸治久新憔悴寢汗發熱五臟齊損瘦弱虛煩腸澼下血骨蒸痿弱無力不能運動東垣云治脈沉而虛者熟地八兩山茱萸淨肉山藥各四兩牡丹皮茯苓澤瀉各三兩上為細末煉蜜丸桐子大空心溫酒服五十丸垣或問錢氏地黃丸補腎又曰補肝何也曰然手厥陰心主包絡足厥陰肝經俱治在下焦經云不足者滋其化源故肝腎之病同一治法此地黃丸補二經之意也海藏云若加五味為腎氣丸此滋肺之源以生腎水保黑地黃丸加五味子為腎氣丸治陽盛陰衰脾胃不足房室虛損形瘦無力面多青黃而無常色此補氣益胃蒼朮一斤油浸熟地一斤五味子半斤乾薑秋冬一兩夏半兩春七錢上為細末棗肉丸梧子大食前米飲或酒服百丸治血虛久痔甚妙經曰腎苦燥急食辛以潤之此藥開腠理生津液通氣又五味子酸以收之此雖陽盛而不燥熱乃是五臟虛損於內故可益血收氣此藥類象神品方也治陽盛心肺不足宜八味丸四肢弱無力多困未知陰陽先損夏可用地黃丸春秋宜腎氣丸冬宜八味丸云岐雞蘇丸治嗽血方見咳唾血上治肺腎虛蓋肝心屬陽肺腎屬陰陰虛則肺腎虛矣腎虛者從房室中來其症或腰痠腰痛或足酸足痿足熱或遺精白濁是也肺虛者或咳嗽或吐血是也治腎虛四方前二方龜扳黃柏為君有痰無痰皆可用後二方地黃為君無痰可用痰多而膈不清者宜審之治肺虛咳嗽唾血者方法浩大另立咳嗽唾門也丹虛勞皆積熱做成始健時可用子和法後日羸憊四物湯加減送消積丸使熱不作也蒸蒸發熱積病最多小陷胸湯治濕痰發熱極妙方見傷寒部結胸門退實熱勞積痰鱉甲龜板側柏栝蔞仁半夏黃連黃柏上為末炊餅丸又濕痰發熱黃芩炒黃連炒香附生蒼朮上為末栝蔞穰為丸青檬石丸方見咳嗽河間人參半夏丸方見咳嗽丹治施官人年三十餘不可勞動勞動則發熱脈洪而大在右手短而澀在左手豫謂此必酒痰成濕傷血又問之遇少勞則喘乏力小便或赤或白當歸黃耆人參各五分芍藥一分白朮二分半川芎五分木通三分黃芩三分陳皮五分厚朴五分炙甘草二分煎湯下青礞石丸羅柴胡飲子解一切肌骨蒸熱寒熱往來及傷寒發汗不解或汗後餘熱勞復或婦人經病不快産後但有如此之症並宜服之黃芩甘草炙大黃芍藥柴胡人參當歸各半兩上㕮咀姜三片煎熱服保防風當歸飲子治煩熱皮膚索澤食後煎服空心宜以此飲下地黃丸柴胡人參黃芩甘草防風大黃當歸芍藥各半兩滑石二錢上㕮咀每服五錢水一盞半姜三片煎七分溫服如痰嗽加半夏如大便黃米穀完出驚悸溺血淋閉咳血衄血自汗頭痛積熱肺痿後與大金花丸大金花丸黃柏黃芩黃連山梔各八兩上為細末水丸小豆大每服一百丸溫水下日二三服或大便實加大黃自利如中外熱者此藥作散煎服名解毒湯或腹痛嘔吐欲作痢者每服解毒湯半兩加半夏茯苓厚朴各三錢姜三片如白膿後重下痢後重者加大黃三錢麥煎散治少男室女骨蒸婦人風血攻疰四肢赤茯苓當歸乾漆鱉甲醋炙常山大黃煨柴胡白朮生地石膏各一兩甘草半兩上為末每服三錢小麥五十粒水煎食後臨臥服若有虛汗加麻黃根一兩東坡云此黃州吳判官療骨蒸黃瘦口臭肌熱盜汗極效吳君寶之不肯妄傳當歸龍薈丸治肝有積痰汙血結熱而勞瘵者其太衝脈必與衝陽脈不相應宜以補陰藥吞此丸神效方見前上勞瘵兼痰積其症腹脅常熱手足頭面則於寅卯時分乍有涼時者是也若頑痰膠固難治者必以吐法吐之或沉香滾痰丸透膈丹之類下之又甚者或用倒倉法若痰積閉塞經脈則太衝脈與衝陽寸口脈數而不相應者極難治自陰虛條至此凡六法但患勞者罕能脫此六法自此以後數法宜審而行之無其病莫妄施也世治骨蒸熱神效前胡一錢柴胡二錢胡黃連一錢豬脊髓一條豬膽一個上水煎入豬膽汁服之石地骨皮枳殼散治骨蒸壯熱肌肉消瘦少力多困夜多盜汗地骨皮秦艽柴胡枳殼知母當歸鱉甲醋炙黃上等分為末水一盞桃柳枝頭各七個姜三片烏梅一個去渣臨臥服羅秦艽鱉甲散治骨蒸壯熱肌肉消瘦舌紅頰赤目倦盜汗柴胡地骨皮各一兩秦艽知母當歸各半兩鱉甲一兩去裙襽醋炙上為粗末每服五錢水一盞入烏梅一個青蒿五葉同煎至七分去渣溫服臨臥空心各一服人參地骨皮散治臟中積冷營中熱按之不足舉之有餘陰不足而陽有餘也茯苓半兩知母石膏各一兩地骨皮人參柴胡生地各一兩五錢上㕮咀每服一兩生薑三片水煎細細服人參柴胡散治邪熱客於經絡肌熱痰嗽五心煩躁頭目昏痛夜有盜汗及婦人虛勞骨蒸尤宜白茯苓人參白朮柴胡當歸半夏曲乾葛甘草炙赤芍藥以上各一兩上為細末每服三錢姜四片棗三枚水煎帶熱服許學士云但有勞熱症皆可服熱退即止大抵透肌葛根第一柴胡次之其方多黃芩半兩上四方治虛損復受邪熱皆宜用柴胡衍義云柴胡本經並無一字治勞今人方中治勞鮮有不用者誤人甚多常原病勞有一種真臟虛損復受邪熱因虛而致勞故曰勞者牢也當斟酌之如經驗方治勞熱青蒿煎丸用柴胡正宜服之無不效熱去即須急已若無邪熱得此愈甚雖至死人亦不怨王海藏云苟無實熱醫取用之不死何待後之用柴胡者宜審諸又大忌芩連柏驟用純苦寒藥反瀉其陽但當用瓊玉膏之類大助陽氣使其復還寅卯之位微加瀉陰火之藥是也火鬱湯方見前柴胡升陽湯方見前上二方治重陰覆其陽火不得伸或灑灑惡寒或志意不樂或脈弦數或四肢五心煩熱是也病去即已不可過劑服寒涼藥症雖大減脈反加數者陽郁也大忌寒涼宜升宜補犯之死速海問兩手寸關弦病脾弱火勝木旺土虧金鑠當作何治答曰不治標本從乎中治木標也土本也火中也爍金虧土旺木者皆火也錢仲陽安神丸主之山蕷麥冬益金之氣金益則氣旺而木自平寒水石牙硝火中添水使化為濕熱也濕熱為季夏之令非土而何故用硃砂以墜火下行將退與子權行濕令也故脈弦得除而土自旺秋喘加人參丹砂等夏則不加養氣者加沉香欲發汗者臨臥先與白粥一盞後藥之則汗也寒熱神少振搖小便淋或多或大便走完穀不化口乾舌縮唇吻有瘡心下痞大渴引飲惡干喜濕目花四肢無力怠惰嗜臥食不入皮膚燥澀面色黧黑肌肉消鑠胸腹中急額上汗者法宜泄火益濕補氣脈弦浮沉者同治以安神丸主之方見治虛實氣不化小便不利濕潤肌滑熱蒸陰少氣不化氣走小便利自汗肌燥澀為迫津液不能停離珠丹主之方見虛實弦數者陽陷於內從外而之內也弦則帶數甲經於乙緊則帶洪壬經於丙若弦虛則無火細則有水此二脈從內之外不宜離珠丹火令速行而土虛土虛則長夏不至難經曰虛則補其母資其化源當瀉火於金中補土是也上寸顯弦數脈是東方實乃乘子勢也既瀉其子火木自虛矣以寒藥瀉火是補北方水木既乘火勢而來侮金當金中瀉火火退則木無所恃而自退是實則瀉其子也仲五勞虛極羸瘦腹滿不能飲食食傷憂傷飲傷房室傷飢傷勞傷經絡榮衛氣傷內有乾血肌膚甲錯兩目黯黑緩中補虛大黃䗪蟲丸主之結在內者手足脈必相失宜此方然必兼大補劑瓊玉膏之類服之大黃十兩蒸黃芩二兩甘草三兩桃仁一升杏仁一升芍藥四兩地黃半兩乾漆一兩炒虻蟲一升水蛭百枚蠐螬一升䗪蟲半斤上十二味為末煉蜜丸如小豆大日三服酒下五丸陳大夫傳張仲景百勞丸治一切勞瘵積滯疾不經藥壞症者宜服當歸炒乳香沒藥各一錢人參一錢大黃四錢虻蟲十四枚去翅足水蛭十四枚制上為細末煉蜜丸如桐子大都作一服可百丸五更百勞水下取惡物為度服白粥十日百勞水用杓揚百遍仲景甘瀾水是也外臺治骨蒸桃仁一百二十枚去皮並雙仁留尖杵和為丸平旦井花水服令盡服訖量性飲酒仍須吃水多效隔日又服一劑百日不得食肉仲炙甘草湯一名復脈湯治虛勞不足汗出而悶脈結悸行動如常不出百日急者十一日死方見傷寒海四物加減湯治婦人骨蒸當歸白芍藥川芎地黃以上補血地骨皮瀉腎火牡丹皮瀉包絡火各等分上㕮咀水煎服羅逍遙散治血虛勞倦五心煩蒸頰赤盜汗室女血弱陰虛營衛不和月水不調痰嗽潮熱肌體羸瘦漸成骨蒸茯苓白朮當歸芍藥柴胡甘草炙上㕮咀生薑一塊煨切破薄荷少許同煎上二方治婦人骨蒸大法若夫要處並同於前陰虛法取之蒸病治者宜隨各經虛實內外淺深用藥加減可也古今録驗五蒸湯茯苓甘草人參竹葉地黃葛根知母黃芩石膏粳米二合上㕮咀以水三盞煎小麥二合至二盞去麥煎藥至一盞溫服隨症加減於後忌海藻菘菜蕪荑大醋實熱加黃芩黃連黃柏大黃虛熱氣加烏梅秦艽柴胡血加青蒿鱉甲蛤蚧小麥牡丹皮肺蒸鼻乾加烏梅天冬麥冬紫菀大腸右鼻孔干痛加大黃芒硝皮蒸舌白唾血加石膏桑白皮膚蒸昏昧嗜臥加丹皮氣蒸鼻乾喘促遍身氣熱加人參黃芩山梔心蒸舌乾加黃連生地小腸下唇焦加赤茯生地木通血蒸發焦加生地當歸桂心童便脈蒸唾白浪語脈絡溢脈緩急不調加當歸生地脾蒸唇焦加白芍木瓜苦參胃蒸舌下痛加石膏粳米大黃芒硝乾葛肉蒸食無味而嘔煩躁不安加白芍肝蒸眼黑加川芎當歸前胡膽蒸眼白失色加柴胡栝蔞筋蒸甲焦加當歸川芎三焦蒸乍熱乍寒加石膏竹葉腎蒸兩耳焦加生地石膏知母寒水石膀胱蒸右耳焦加澤瀉茯苓滑石腦蒸頭眩熱悶加生地防風羌活髓蒸髓枯骨中熱加生地當歸天門冬骨蒸齒黑腰痛足逆冷疳蟲食藏加鱉甲地骨皮丹皮生地當歸臀蒸肢細趺腫腑臟皆熱加石膏黃柏胞蒸小便赤黃加澤瀉茯苓生地沉香滑石凡此諸症皆熱病後食肥甘油膩房事飲酒犯之而成久蒸不除變成疳病死期近矣牡丹皮治無汗之骨蒸能瀉陰中之火知母治有汗之骨蒸衍義治骨蒸勞用薄荷汁與衆藥熬成膏經驗治患勞人燒香法玄參一斤甘松六兩為末煉蜜一斤和勻入瓷瓶內封閉地中埋窨半日取出更用炭末六兩煉蜜六兩和勻入瓶內封窨五日取出燒使鼻中常聞香氣疾自愈矣撮要治骨蒸勞熱膏肓在四椎下五椎上各開二寸灸百壯詳見刺法門三里摘英熱勞上氣喘滿肺俞五分留七呼灸七壯尺澤崔氏治骨熱傳尸勞灸四花穴兼治赤白帶第一次取二穴令患人正立取一蠟繩從足大拇指端男左女右貼肉量至後跟上腨至委中橫紋絶斷為則子復令患人解發分兩邊令見頭縫卻平身正坐取前則子從鼻端貼肉上至頭縫下至項脊骨以則子盡處為記用墨點之且不是穴又另取一繩令患人合口將繩兩頭至口吻當中鉤起至鼻柱根如人字齊兩吻截斷卻展直於前則子盡頭墨記處橫量開取兩平頭是穴須左右當半高下相平第二次取二穴令平身正坐又取一繩繞項向前雙垂與乳頭齊截斷卻背翻繩頭向項後以繩中停於結喉上其下雙垂繩頭盡處當背骨中用墨點之亦不是穴又取一繩令病人合口橫量二吻截斷移於前脊中記處橫量取平須左右當中上下相半兩頭是穴連前第一次通取共計四穴同時上火七壯至二十壯灸至百壯候灸瘡瘥卻取三次穴第三次取二穴將前第二次量口吻繩子於第一次雙繩頭盡處墨點記上當脊骨直上下豎點令繩子中停中心在墨點處於上下繩盡處是穴灸如前法標幽體熱勞嗽魄戶瀉潔治骨蒸熱不可治者或前板齒乾燥大椎撮要又法鳩尾灸二七壯補之上背俞取膏肓肺俞四花穴大椎等穴治勞瘵者皆為陽氣下陷而寒熱往來也若灸之早百發百中纍試有效玉龍傳尸勞湧泉第二足指端量至根盡折中是針三分瀉六吸傷寒及勞瘵之症有血可治無血必危凡欲出血刺入二分便須彈指豐隆此穴治痰針入一寸瀉十吸丹田此穴治氣喘針入三分補二呼仲男子婦人脈大為勞極虛亦為勞男子面色薄者主渴及亡血卒喘悸脈浮者裡虛也勞之為病其脈浮大手足煩春夏劇秋冬瘥陰寒精自出酸削不能行脈弦而大弦則為減大則為芤減則為寒芤則為虛虛寒相搏此名為革婦人則半産漏下男子則亡血失精趺陽脈浮而芤浮者衛氣衰芤者榮氣傷其體瘦肌肉甲錯浮芤相搏榮氣衰微四屬斷絶上診脈浮而大或大而弦皆為虛勞者蓋陽盛陰虛之症也暮多見之仲男子婦人脈虛鈿弱者勞也男子脈虛沉弦無寒熱短氣裡急小便不利面色白時目瞑兼衄少腹滿此為勞使之然脈沉小遲名脫氣其人疾行則喘喝手足逆寒腹滿甚則溏泄食不消化也上診脈虛微細弦為虛勞者蓋陰陽俱虛之症也晨多見之玄珠骨蒸之極聲嘎咽痛面黧脈躁直視汗出如珠喘乏氣促出而無入毛焦唇反此皆不治之症雖有神醫亦無如之何矣傳尸勞熱華他治傳尸勞太乙明月丹其病肌瘦面黃嘔吐咳嗽不安先燒安息香令煙出病人吸之不嗽非傳尸也不可用此藥若煙入咳嗽不止乃傳尸也宜用此藥雄黃木香各半兩天靈蓋炙一兩輕粉一分鱉甲酥炙一兩兔屎二兩上為末用法酒一大升大黃末半分熬膏入前藥為丸彈子大硃砂為衣五更初服勿令人知以童便和酒化一丸服如人行十里許必吐出蟲狀如燈心細長久如爛瓜子又如蝦蟆狀各不同未效次日再服以應為度紫庭治傳尸伏尸皆有蟲須用乳香薰病人之手乃仰手掌以帛覆其上熏良久手背上出毛長寸許白而黃者可治紅者稍難青黑者即死最驗若熏之良久無毛者即非此症乃屬勞瘵虛損即用前參耆溫補之藥選取傳尸伏尸勞蟲法天靈蓋十字解者酥炙為末三分安息香半兩虎糞骨人骨為上獸骨次之醋炙半兩鱉甲九肋大者醋炙一兩桃仁去皮尖二錢半麝香另研檳榔一錢為末青蒿梢六兩豉三百粒蔥頭一百二十根童便半碗楓葉二十一葉桃柳東南枝如箸大者每七條各七寸上先將青蒿桃柳楓葉蔥頭用水二官升煎半乾去渣入天靈虎糞骨鱉甲安息香童便煎取汁去渣約有四五合將檳榔麝香研勻調作一服早辰空腹服以被蓋汗恐汗內有細蟲以白紙拭之投火中須臾必下如有蟲以大火焚之棄流水中所用藥勿令病者知之半月後氣血復完再進一服依前法三次無蟲乃止以美飲食調理其病自愈此方必有阿魏半錢無又方桑枝柳枝石榴枝桃枝梅枝各七莖長四寸青松一小握上用童便一升半蔥白七莖去頭葉煎及一半去渣別入安息香阿魏各一分煎至一鍾濾去渣調辰砂末半錢檳榔末一分麝香一字分作二服調下五更初一服五更三點時一服至巳牌後取下蟲色紅者可治青者不治見有所下即進稀粥飲溫暖將息不可食粉面生冷毒物合時須擇良日不得令貓犬孝服穢惡婦人見之濟生神人阿魏散治骨蒸傳尸等寒熱羸勞困倦喘嗽阿魏三錢青蒿一握研東北方桃枝一握細切甘草如病人中指許大男左女右細銼上以童便二升半隔夜浸藥明旦煎取一大升空心溫服分為三服每次調入檳榔末三分如人行十里再進一服男病女煎女病男煎合藥時忌孝子孕婦病人及腥穢雞犬等物服後忌油膩濕面生冷硬物服至一二劑即吐出蟲子或瀉出更不須服余藥若未吐利即當盡服病在上則吐在下則利皆出蟲如馬尾人發即愈服藥後覺五臟虛弱魂魄不安即以白茯苓湯補之白茯苓一錢人參五錢遠志二錢去心龍骨防風各二錢甘草三分生地四錢麥冬四錢去心犀角末五錢大棗七枚上以水二大盞煎作八合分三服溫服如人行十里一服仍避風寒若覺未安隔日更作一劑以上藥餌須連服之羅犀角紫河車丸治傳尸勞三月必效其餘勞症只消數服紫河車一具米泔浸一宿洗淨焙乾鱉甲酥炙桔梗胡黃連白芍大黃敗鼓皮心醋炙貝母去心龍膽草黃藥子知母以上各二錢半芒硝犀角蓬朮各一錢半硃砂二錢上為細末煉蜜丸如梧子大硃砂為衣空心溫酒服三四十丸本事葛洪云鬼疰者是五尸之一疰又按諸鬼邪為害其變動乃有三十六種至九十九種大略使人淋漓沉沉默默的不知其所苦而無處不惡纍年積月漸就頓滯以至於死傳於旁人乃至滅門覺知是候者急治獺肝一具陰乾取末水服方寸匕日三服效未知再服此方神良天慶觀一法師行考校極精嚴時一婦人投狀述患人有所附須臾乃附語云非我所禍別是一鬼亦自病人命衰為祟耳今已成形在患人肺中為蟲食其肺系故令吐血聲嘶師掠之曰此蟲還得長生否久而無語再掠之良久云唯畏獺爪屑為末以酒服之則去矣患家如其言得愈此豫所目見也究其患亦相似獺爪者獺肝之類歟肘後治尸疰鬼疰病用桃仁五十枚研碎以水煮取四升作一服盡當吐如病不盡二三日再服玄治傳尸蠱瘵之症父子兄弟互相傳染甚者絶戶此乃祖父冤債或風水所繫雖有符文法水下蟲之法然蟲去人亡亦未為全美若能平素保養則自愈矣産後發熱大全人參湯治産後諸虛不足發熱盜汗人參當歸等分上為末以豬腰子一具去脂膜切小片子以水三升糯米半合蔥白二條煮米熟取清汁一盞入藥末二錢煎至八分不拘時溫服羅犀角飲子治産後亡津液虛損時自汗出發熱困倦唇口乾燥犀角麥冬白朮各半兩柴胡一兩枳殼麩炒地骨皮生地甘草炒當歸人參茯苓黃芩黃耆各七錢上㕮咀入浮麥七十粒姜三片同水煎每服四錢産後發熱多屬虛寒惟乾薑加入補藥中神效此丹溪法也
