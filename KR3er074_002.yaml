body:
  text: 卷之二陰陽臟腑部診法通論難經言望而知之謂之神聞而知之謂之聖問而知之者謂之工切脈而知之者謂之巧何謂也望而知之者望見其五色以知其病聞而知之者聞其五音以別其病問而知之者問其所欲五味以知其病所起所在也切脈而知之者診其寸口視其虛實以知其病在何臟腑也經言以外知之曰聖以內知之曰神此之謂也素診法當以平旦陰氣未動陽氣未散飲食未進經脈未盛絡脈調勻氣脈未亂故乃可診有過之脈切脈動靜而視精明察五色觀五臟有餘不足六腑強弱形之衰盛以此參伍決死生之分脈要精微論丹經曰診脈之道觀人勇怯肌肉皮膚能知其情以為法也凡人形長不及短大不及小肥不及瘦人之色白不及黑嫩不及蒼薄不及厚而況肥人濕多瘦人火多白者肺氣虛黑者腎氣足形色既殊臟腑亦異外證雖同治法迥別所以肥人責脈浮瘦人責脈沉躁人責脈緩緩人責脈躁不可一概觀之仲景云肥人當沉今反浮瘦人當浮今反沉故責之素善診者察色按脈先別陰陽審清濁而知部分視喘息聽音聲而知所苦觀權衡規矩而知病所主按尺寸觀浮沉滑澀而知病所生以治無過以診則不失陰陽應象論閉戶塞牖系之病者數問其情以從其意得神者昌失神者亡移精變氣論必審問其所始病與今之所方病而後各切循其脈視其經絡浮沉以上下逆從循之三部九候論凡未診病者必問嘗貴後賤雖不中邪病從內生名曰脫榮嘗富後貧名曰失精五氣留連病有所並醫工診之不在臟腑不變軀形診之而疑不知病名身體日減氣虛無精病深無氣灑灑然時驚病深者以其外耗於衛內奪於榮良工所失不知病情疏五過論東垣百病晝則增劇夜則安靜是陽病有餘乃氣病而血不病也夜則增劇晝則安靜是陰病有餘乃血病而氣不病也晝則發熱夜則安靜是陽氣自旺於陽分也晝則安靜夜則發熱煩躁是陽氣下陷入陰中也名曰熱入血室晝則發熱煩躁夜亦發熱煩躁是重陽無陰當亟瀉其陽峻補其陰夜則惡寒晝則安靜是陰血自旺於陰分也夜則安靜晝則惡寒是陰氣上溢於陽中也夜則惡寒晝亦惡寒是重陰無陽當急瀉其陰峻補其陽晝則惡寒夜則煩躁飲食不入名曰陰陽交錯者死矣丹肺主氣其脈居右寸脾胃命門三焦各以氣為變化運用故皆附焉心主血其脈居左寸肝膽腎膀胱皆精血之隧道管庫故皆附焉男以氣成胎則氣為之主女挾血成胎則血為之主男子病右脈充於左者有胃氣也病雖重可治女子病左脈充於右者有胃氣也病雖重可治反此者虛之甚也素脈有陰陽知陽者知陰知陰者知陽凡陽有五五五二十五陽所謂陰者真藏也見則為敗敗必死也所謂陽者胃脘之陽也別於陽者知病處也別於陰者知死生之期三陽在頭三陰在手所謂一也別於陽者知病忌時別於陰者知死生之期陰陽別論王注曰頭謂人迎脈在結喉兩傍一寸五分手謂氣口脈在手魚際之後一寸兩者相應俱往俱來若引繩小大齊等者曰平人故言所謂一也別於陽者知病從來別於陰者知死生之期玉機真藏論靈氣口候陰人迎候陽四時氣論素謹熟陰陽無與衆謀所謂陰陽者去者為陰至者為陽靜者為陰動者為陽遲者為陰數者為陽陰陽別論諸浮不躁者皆在陽則為熱其有躁者在手但浮不躁則病在足陽脈之中其有躁者病在手陽脈之中諸細而沉者皆在陰則為骨痛其有靜者在足脈要精微論沉細而躁者病生於手陰脈之中靜者病生於足陰脈之中也脈經無擇浮脈按之不足舉之有餘沉脈舉之不足按之有餘遲脈呼吸三至去來極遲數脈去來促急一息六七至虛脈遲大而軟按之不足指下豁豁然空實脈大而長微強按之隱指愊愊然一曰舉按有力緩脈去來亦遲小駃於遲一曰浮大而軟緊脈數如切繩狀一曰如轉索之無常洪脈極大在指下細脈小甚似無而有滑脈往來前卻流利展轉替替然與數相似一曰漉漉如欲脫仲景云翕奄沉為滑沉為純陰翕為正陽陰陽和合故名曰滑許學士云仲景此三字論滑脈是也翕合也言張而復合也奄沉言忽降而下也方翕而合俄降而下奄謂奄忽之間仲景論滑脈可謂諦矣澀脈細而遲往來難且散或一止復來一曰短而止脈訣云如刀刮竹痕陳無擇云如雨沾沙弦脈舉之無有按之如弓弦狀弦而不大為弦弦而大為革革脈有似沉伏實大而長微弦陳無擇云如按鼓皮仲景云弦而大軟脈極軟而浮細軟一作濡弱脈極軟而沉細按之欲絶指下結脈往來緩時一止復來仲景云脈來動而中止更來小數中有還者反動名曰結陰也脈來動而中止不能自還因而復動名曰代陰也得此脈難治促脈來去數時一止復來芤脈浮大而軟按之中央空兩邊實微脈極細而軟或時欲絶若有若無動脈見於關上無頭尾大如豆厥厥然動搖伏脈極重指按之著骨乃得散脈大而散散者氣實血虛有表無里代脈來數而中止不能自還因而復動脈結者生代者死上陰陽相反脈狀者以王氏經文之脈形狀移置如陳氏三因云脈偶也蓋浮沉相反浮主表病屬陽沉主裡病屬陰也遲數相反遲主寒並病及陽氣虛數主熱並病及血虛也虛實相反虛主血氣虛實主血氣實也洪細相反洪主血氣多細主血氣少也滑澀相反滑主血實氣虛澀主氣實血虛也緩緊相反熱主緩縱寒主緊縮也強革與濡弱相反強革主虛寒濡弱主虛熱與緩緊同法推也結促相反結主陰盛促主陽盛也浮數實緊洪滑強革芤散屬陽沉遲虛緩細澀軟弱結微動伏代屬陰後賢因別陽脈為七表陰脈為八里也浮與芤相類弦與緊相類滑與數相類革與實相類沉與伏相類微與澀相類軟與弱相類緩與遲相類海藏氣證則飲水血證不飲水氣病則麻血病則痛無陽則厥無陰則嘔陰證身靜重語無聲氣難布息目睛不了了鼻中呼不出吸不入往來口與鼻中氣冷水漿不入大小便不禁而止惡寒有如刀刮陽證身動輕語有聲目睛了了鼻中呼吸出入能往能來口與鼻中氣皆熱診兩手脈浮之俱有陽沉之俱有陰陰陽皆實盛者此為沖督之脈也沖督之脈者十二經之道路也沖督用事則十二經不復朝於寸口其人皆苦恍惚狂癡不者必當猶豫有兩心也兩手陽脈浮而細微綿綿不可知俱有陰脈亦復細微綿綿此為陰蹺陽蹺之脈也此家曾有病鬼魅風死苦恍惚亡人為禍也尺寸脈俱浮直上直下此為督脈腰背強痛不得俯仰大人癲病小兒風癇疾尺寸脈俱牢一作芤直上直下此為衝脈胸中有寒疝也難奇經之為病何如然陽維維於陽陰維維於陰陰陽不能自相維則悵然失志溶溶不能自收持陰蹺為病陽緩而陰急陽蹺為病陰緩而陽急沖之為病逆氣而裡急督之為病脊強而厥素問作脊強反折任之為病其內苦結男子為七疝女子為瘕聚帶之為病腹滿腰溶溶若坐水中陽維為病苦寒熱陰維為病苦心痛此奇經八脈之為病也二十九難丹陽滯於陰陰滯於陽論精要云陽滯於陰脈浮洪弦數陰滯於陽脈沉細弱澀陽滯以寒治之陰滯以熱治之竊詳其意陽滯陰滯當作熱滯寒滯求之寒熱固可作陰陽論能於陰於陽分明是於氣血他無可言也熱滯於氣固矣獨無寒滯耶寒滯於血固矣獨無熱滯耶何寒不能傷氣何熱不能傷血耶以愚觀之氣為陽行脈外血為陰行脈內相併分派周流循環一身無停止謂之脈一呼脈行三寸一吸脈行三寸呼吸定息脈共得六寸一身通七尺五寸行得八百一十丈得熱則行速為太過得寒則行遲為不及五味之偏七情之過氣為疑滯津液稠厚積而久之為飲為痰滲入脈內血為所亂因而凝濁運行泣沍或為沸騰此陰滯於陽也正是血滯於氣也氣病矣或以藥助邪病上生病血病日增溢出脈外隧道隘塞升降有妨運化失令此陽滯於陰也正是氣滯於血也病分寒熱者當是稟受之索偏虛邪之雜合豈可專以陽為熱陰為寒耶浮洪弦數氣病之脈也豈可遽作熱論沉細弱澀血病之脈也豈可遽作寒論此萬病之根本豈止疥癬瘡瘍癰疽而已幸相評其是否沍胡故切閉塞也素寸口脈沉而堅者曰病在中寸口脈浮而盛者曰病在外平人氣象論下同海藏云脈浮為表浮之實大沉之損小是為表也浮之實大沉之亦然即非表也邪已入深矣脈盛滑堅者病在外脈小實而堅者病在內靈氣口主中人迎主外禁服篇人迎盛堅者傷於寒氣口盛堅者傷於食五色篇上氣口脈謂兩手掌後手太陰之脈也人迎脈謂挾喉兩傍足陽明之脈也海辨內外傷傷風鼻中氣出粗合口不開肺氣通乎天地傷食口無味津液不納鼻息氣勻脾氣通乎地也外傷一身盡熱先太陽也從外而之內者先無形也內傷手足不和兩脅俱熱先少陽也從內之外者先有形也內外俱傷人迎氣口俱盛或舉按皆實大表發熱而惡寒腹不和而口渴此內外兩傷也凡診則先捫手心手背手心熱則內傷手背熱則外傷次以脈別之難脈有三部九候各有所主之然三部者寸關尺也九候者浮中沉也上部法天主胸以上至頭有疾中部法人主膈下至臍上有疾下部法地主臍以下至足有疾宜審刺之十八難活人凡初下指先以中指端按得關位掌後高骨為關乃齊下前後二指為三部脈前指寸口也後指尺部也若人臂長乃疏下指臂短則密下指若先診寸口浮按消息之次中按消息之次重按消息之次上竟消息之次下竟消息之次推指外消息之次推指內消息之凡診脈以氣息平定方下指以一呼一吸為一息其一息之間脈息四至或五至不大不小與所屬部分四時相應者為平和脈矣過則為至不及則為損損至之脈難經詳言之矣仲景曰吸而微數其病在中焦實也當下之即愈虛者不治在上焦者其吸促在下焦者其吸遠此皆難治呼吸動搖振振者不治素五臟不平六腑閉塞之所生也通評虛實論難何以別知臟腑之病也然數者腑也遲者臟也數則為熱遲則為寒諸陽為熱諸陰為寒故以別知臟腑之病也九難病有欲得溫者有欲得寒者有欲得見人者有不欲得見人者而各不同其病在何臟腑然病欲得寒而欲得見人者病在腑也病欲得溫而不欲得見人者病在臟也何以言之腑者陽陽病欲得寒又欲見人臟者陰陰病欲得溫又欲閉戶獨處惡聞人聲故以別知臟腑之病也五十一難臟腑發病根本等不然不等也奈何然臟病者止而不移其病不離其處腑病者倣佛賁響上下行流居處無常五十二難素帝曰夫百病之生也皆生於風寒暑濕燥火以之化之變也經言盛者瀉之虛者補之余錫以方士而方士用之尚未能十全余欲令要道必行桴鼓相應猶拔刺雪汙功巧神聖可得聞乎岐伯曰審察病機無失氣宜此之謂也帝曰願聞病機何如岐伯曰諸風掉眩皆屬於肝諸寒收引皆屬於腎諸氣膹郁皆屬於肺諸濕腫滿皆屬於脾諸熱瞀瘈皆屬於火諸痛癢瘡皆屬於心諸厥固泄皆屬於下諸痿喘嘔皆屬於上諸禁鼓栗如喪神守皆屬於火諸痙項強皆屬於濕諸逆衝上皆屬於火諸脹腹大皆屬於熱諸躁狂越皆屬於火諸暴強直皆屬於風諸病有聲鼓之如鼓皆屬於熱諸病胕腫疼酸驚駭皆屬於火諸轉反戾水液混濁皆屬於熱諸病水液澄徹清冷皆屬於寒諸嘔吐酸暴注下迫皆屬於熱故大要曰謹守病機各司其屬有者求之無者求之盛者責之虛者責之必先五勝疏其血氣令其調達而致和平此之謂也至真要大論上病機一十九條實察病之要旨而有者求之無者求之盛者責之虛者責之一十六字乃答篇首盛者瀉之虛者補之之旨而總結病機一十九條之義又其要旨中之要旨也河間原病式但用病機一十九條立言而遺此一十六字猶有舟無操舟之工有兵無將兵之帥不免臨病之際湯劑誤投致人夭折今負僣逾引經傳之旨證其得失其補大矣夫諸風病皆屬於肝也風木盛則肝太過而病化風如木太過發生之紀病掉眩之類俗謂之陽痓急驚等病治以涼劑是也燥金勝則肝為邪攻而病亦化風如陽明司天燥氣下臨病掉振之類俗謂之陰痓慢驚等病治以溫劑是也諸火熱病皆屬於心也熱甚則心太過而病化火熱如歲火太過病譫妄狂越之類俗謂之陽躁譫語等病治以攻劑是也寒水勝則心為邪攻而病亦化火熱如歲水太過病躁悸煩心譫妄之類俗謂之陰躁鄭聲等病治以補劑是也諸濕病皆屬於脾也濕土甚則脾太過而病化濕如濕勝則濡泄之類仲景用五苓等劑去濕是也風木勝則脾為邪攻而病亦化濕如歲木太過病飧泄之類錢氏用宣風等劑去風是也諸氣膹郁皆屬於肺也燥金甚則肺太過而病化膹郁如歲金太過甚則喘咳之類東垣謂之寒喘治以熱劑是也火熱勝則肺為邪攻而病亦化膹郁如歲火太過病咳喘之類東垣謂之熱喘治以寒劑是也諸寒病皆屬於腎也寒水甚則腎太過而病化寒如太陽所至為屈伸不利之類仲景用烏頭湯等劑是也濕土氣勝腎為邪攻而病亦化寒如濕氣變物病筋脈不利之類東垣用復煎散健步丸等劑是也其在太過而化之病為盛盛者真氣也其在受攻而化之病為虛虛者假氣也故有其病化者恐其氣之假故有者亦必求之無其病化者恐其邪隱於中如寒勝化火之類故無者亦必求之其病之化似盛者恐其盛之未的故盛者亦必責之其病之化似虛者恐其虛之未真故虛者亦必責之凡一十九條病機皆用此一十六字為法求之庶幾補瀉不瘥也今河間損此一十六字但以病化有者為盛無者為虛而不復究其假者虛者為未備此實智者之一失也素五氣所病心為噫肺為咳肝為語脾為吞腎為缺為嚏胃為氣逆為噦為恐大腸小腸為泄下焦溢為水膀胱不利為癃不約為遺溺膽為怒是為五病宣明五氣論色味當五臟白當肺辛赤當心苦青當肝酸黃當脾甘黑當腎咸故白當皮赤當脈青當筋黃當肉黑當骨五臟生成篇靈目赤色者病在心白在肺青在肝黃在脾黑在腎黃色不可名者病在胸中論疾診尺篇素五脈應象肝為弦心脈鉤難經改鉤作大脾脈代難經改代作緩肺脈毛難經改毛作澀腎脈石難經改石作沉靈色青者其脈弦也赤者其脈鉤也黃者其脈代也白者其脈毛黑者其脈石見其色而不得其脈反得相勝之脈則死矣得其相生之脈則病已矣邪氣臟腑病形篇難經言見其色而不得其脈反得相勝之脈者即死得相生之脈者病即自已色之與脈當參相應為之奈何然五臟有五色皆見於面亦當於寸口尺內相應假令色青其脈當弦而急色赤其脈浮大而散色黃其脈中緩而大色白其脈浮澀而短色黑其脈沉濡而滑此所謂五色之與脈當參相應也脈數尺之皮膚亦數脈急尺之皮膚亦急脈緩尺之皮膚亦緩脈澀尺之皮膚亦澀脈滑尺之皮膚亦滑五臟各有聲色臭味當於寸口尺內相應其不相應者病也假令色青其脈浮澀而短若大而緩為相勝浮大而散若小而滑為相生也十三難假令得肝脈其外證善潔面青善怒其內證臍左有動氣按之牢若痛其病四肢滿閉淋溲便難轉筋有是者肝也無是者非也假令得心脈其外證面赤口乾善笑其內證臍上有動氣按之牢若痛其病煩心心痛掌中熱而啘有是者心也無是者非也啘之曰切假令得脾脈其外證面黃善噫善思善味其內證當臍上有動氣按之牢若痛其病腹脹滿食不消體重節痛怠墮嗜臥四肢不收有是者脾也無是者非也假令得肺脈其外證面白善嚏悲愁不樂欲哭其內證臍右有動氣按之牢若痛其病喘咳灑淅寒熱有是者肺也無是者非也假令得腎脈其外證面黑善恐數缺其內證臍下有動氣按之牢若痛其病逆氣小腹急痛泄如下重足脛寒而逆有是者腎也無是者非也十六難有正經自病有五邪相干以上經文皆診正經自病其五邪相干診法附在治法門海藏相合脈變脈之相合各有虛實不可作一體觀之假令洪弦相合洪客弦主也子能令母實也弦洪相合弦客洪主也母能令子虛也洪弦相合見於春為子能令母實也弦洪相合見於夏為母能令子虛也又如沉澀相合見於秋亦子能令母實也澀沉相合見於冬亦母能令子虛也余皆仿此至於手足之經亦相合假令傷寒膀胱脈浮堅而洪者即手足經合也余仿此海脈不勝者挾其子之勢也脈弦而入金之分非火之勢則不敢侵金之分弦而帶數甲經於申也緊而帶洪壬經於丙也素五病所發陰病發於骨陽病發於血陰病發於肉陽病發於冬陰病發於夏是五發也五邪所亂凡邪入於陽則狂邪入於陰則痹搏陽則為癲疾搏陰則為喑陽入之陰則靜陰出之陽則怒是為五亂宣明五氣篇難脈有陰陽之法何謂也然呼出心與肺吸入腎與肝呼吸之間脾受穀味也其脈在中浮者陽也沉者陰也故曰陰陽也心肺俱浮何以別之然浮而大散者心也浮而短澀者肺也腎肝俱沉何以別之然牢而長者肝也按之濡舉指來實者腎也脾者中州故其脈在中是陰陽之法也四難脈有輕重何謂也然初持脈如三菽之重與皮毛相得者肺部也如六菽之重與血脈相得者心部也如九菽之重與肌肉相得者脾部也如十二菽之重與筋平者肝部也按之至骨舉指來疾者腎部也故曰輕重也五難上以脈之輕重候五臟素尺內兩傍則季脅也尺外以候腎尺裡以候腹兩尺脈也脈經左尺脈以候腎膀胱右尺脈以候命門三焦凡言外者皆指臂之外側凡言內者皆指近臂筋也中附上左外以候肝內以候膈左關脈也脈經左關脈以候肝膽右外以候胃內以候脾右關脈也脈經右關脈候脾胃與經文同上附上右外以候肺內以候胸中右寸脈也脈經右寸脈以候肺大腸左外以候心內以候膻中左寸脈也脈經左寸脈以候心小腸前以候前後以候後上竟上者胸喉中事也下竟下者少腹腰股膝脛足中事也脈要精微論內經以寸關尺脈候臟腑者止於如此至難經始定寸關尺為三部浮中沉為九候至後世但診寸關尺之三部湮晦其足手面之三部為大失也無擇心部在左手寸口屬手少陰經與小腸手太陽經合肝部在左手關上屬足厥陰經與膽足少陽經合腎部在左手關後尺中屬足少陰經與膀胱足太陽經合肺部在右手關前寸口屬手太陰經與大腸手陽明經合脾部在右手關上屬足太陰經與胃足陽明經合右腎部在右手尺中屬手厥陰心包絡與三焦手少陽經合難脈有三部部有四經手有太陰陽明足有太陽少陰為上下部何謂也然手太陰陽明金也足太陽少陰水也金生水水流下行而不能上故在下部也足厥陰少陽木也生手太陽少陰火火炎上行而不能下故為上部手心主少陽火生足太陰陽明土土主中宮故在中部也此皆五行子母更相生養者也十八難東垣兩手攙抄於前俱仰其手掌左手居外右手居里則木火土金水五行相序而經綸四時之令無差忒矣六微旨大論曰顯明之右君火之位也君火之右退行一步相火治之復行一步土氣治之復行一步金氣治之復行一步水氣治之復行一步木氣治之復行一步君火治之是次列五行相生之理也素帝曰何謂三部岐伯曰有下部有中部有上部部各有三候三候者有天有地有人也必指而導之乃以為真上部天兩額之動脈王注云在額兩傍動脈應手是也上部地兩頰之動脈王注云在鼻孔下兩傍近於巨髎之分動脈應手上部人耳前之動脈王注云在耳前陷者中動應於手是也中部天手太陰也王注云在掌後寸口中是謂經渠動脈應手中部地手陽明也王注云在手大指次指岐骨間合谷之分動應於手中部人手少陰也謂掌後鋭骨之端神門之分下部天足厥陰也王注云在足大指本節後二寸陷中太衝之分下部地足少陰也王注云在足內踝後跟骨上陷中太溪之分動應於手下部人足太陰也王注云在魚腹上越筋間直五里下箕門之分沉取動應於手候胃氣者當取足跗之上衝陽之分動應於手是也故下部之天以候肝地以候腎人以候脾胃之氣中部天以候肺地以候胸中之氣人以候心上部天以候頭角之氣地以候口齒之氣人以候耳目之氣九候之相應也上下若一不得相失一候後則病二候後則病甚三候後則病危所謂後者應不俱也王注曰俱猶同也手心主少陽火生足太陰陽明土足太陰陽明土生手太陰陽明金手太陰陽明金生足太陽少陰水足太陽少陰水水流下而不能上生足厥陰少陽木足厥陰少陽木生手太陽少陰火手太陽少陰火炎上行而不能下生手心主少陽火三部九候皆相失者死上下左右之脈相應如參舂者病甚上下左右相失不可數者死中部之候雖獨調與衆臟相失者死察九候獨小者病獨大者病獨疾者病獨遲者病獨熱者病獨寒者病獨陷下者病以上並三部九候論上以三部九候候五臟靈庭者首面也關上者咽喉也闕中者肺也下極者心也直下者肝也肝左者膽也下者脾也方上者胃也中央者大腸也挾大腸者腎也當腎者臍也面王以上者小腸也面王以下者膀胱子處也顴者肩也顴後者臂也臂下者手也目內眥上者膺乳也挾繩而上者背也循牙車以下者股也中央者膝也膝以下者脛也當脛以下者足也巨分者股里也巨屈者膝臏也此五臟六腑肢節之部也庭者額中也關中者兩眉之間也下極者兩目之間也直下者兩鼻而下也方者鼻隧也面王者鼻柱之端也蓋自額而下闕上屬首咽喉之部分也自闕中循鼻而下鼻端屬肺心肝脾腎五臟之部分也自目內眥挾鼻而下至承漿屬膽胃大腸小腸膀胱六腑之部分也自顴而下頰則屬肩臂手之部分也自牙車而斜下頤屬股膝脛足之部分也經云五臟次於中央六腑挾其兩側首面上於陽庭王宮在於下極者正謂此也各有部分有部分用陰和陽用陽和陰當明部分萬舉萬當能別左右是謂大道男女異位故曰陰陽審察澤夭謂之良工沉濁為內浮澤為外黃赤為風青黑為痛白為寒黃而膏潤為膿赤甚者為血痛甚為攣寒甚為皮不仁五色各見其部察其浮沉以知淺深察其澤夭以觀成敗察其散搏以知遠近視色上下以知病處積神於心以知往今故相氣不微不知是非屬意勿去乃知新故色明不粗沉夭為甚不明不澤其病不甚其色散駒駒然未有聚其病散而氣痛聚未成也腎乘心心先病腎為應色皆如是男子色在於面王為小腹痛下為卵痛其圜直為莖痛高為本下為首狐疝㿉陰之屬也女子在於面王為膀胱子處之病散為痛搏為聚方圓左右各如其色形其隨而下至胝為淫有潤如膏狀為暴食不潔左為左右為右其色有邪聚散而不端面色所指者也色者青黑赤白黃皆端滿有別鄉別鄉赤者其色亦大如榆莢在面王為不日其色上鋭首空上向下鋭下向在左右如法以五色命藏青為肝赤為心白為肺黃為脾黑為腎肝合筋心合脈肺合皮脾合肉腎合骨也五色篇鼻者肺之官也目者肝之官也口唇者脾之官也舌者心之官也耳者腎之官也故肺病者喘息鼻張肝病者眥青脾病者唇黃心病者舌卷短顴赤腎病者顴與顏黑五閲五使篇色起兩眉薄澤者病在皮唇青黃赤白黑者病在肌肉榮衛濡然者病在血氣目色青黃赤白黑者病在筋耳焦枯受塵垢病在骨衛氣失常篇黃帝曰五臟之氣閲於面者余已知之矣以肢節知而閲之奈何岐伯曰五臟六腑者肺為之蓋巨肩陷咽喉見其外五臟六腑者心為之主缺盆為之道䯏骨有餘以候𩩲𩨗肝者主為將使之候外欲知堅固視目大小脾者主為衛使之迎糧視唇舌好惡以知吉凶腎者主為外使之遠聽視耳好惡以知其性黃帝曰善願聞六腑之候岐伯曰六腑胃為之海廣骸大頸張胸五穀乃容鼻隧以長以候大腸唇厚人中長以候小腸目下裹大其膽乃橫鼻孔在外膀胱漏泄鼻柱中央起三焦乃約此所以候六腑者也師傳論赤色小理者心小粗理者心大無𩩲𩨗者心高𩩲𩨗小短舉者心下𩩲𩨗長者心下堅𩩲𩨗弱小以薄者心脆𩩲𩨗直下不舉者心端正𩩲𩨗倚一方者心偏傾也心小則安邪弗能傷易傷以憂心大則憂不能傷易傷於邪心高則滿於肺中悗而善忘難開以言心下則藏外易傷於寒易恐以言心堅則藏安守固心脆則善病消疸熱中心端正則和利難傷心偏傾則操持不一無守司也白色小理者肺小粗理者肺大巨肩反膺陷喉者肺高合腋張脅者肺下好肩背厚者肺堅肩背薄者肺脆背膺厚者肺端正脅偏疏者肺偏傾也肺小則少飲不病喘喝肺大則多飲善病胸痹喉痹逆氣肺高則上氣肩息咳肺下則居賁迫肺善脅下痛肺堅則不病咳上氣肺脆則苦病消疸易傷肺端正則和利難傷肺偏傾則胸偏痛也青色小理者肝小粗理者肝大廣胸反骹者肝高合脅兔骹者肝下胸脅好者肝堅脅骨弱者肝脆膺腹好相得者肝端正脅骨偏舉者肝偏傾也肝小則臟安無脅下之病肝大則逼胃迫咽迫咽則苦膈中且脅下痛肝高則上支賁切脅悗為息賁肝下則逼胃脅下空脅下空則易受邪肝堅則藏安難傷肝脆則善病消疸易傷肝端正則和利難傷肝偏傾則脅下痛也黃色小理者脾小粗理者脾大揭唇者脾高唇下縱者脾下唇堅者脾堅唇大而不堅者脾脆唇上下好者脾端正唇偏舉者脾偏傾也脾小則臟安難傷於邪也脾大則苦湊䏚而痛不能疾行脾高則䏚引季脅而痛脾下則下加於大腸下加於大腸則臟苦受邪脾堅則臟安難傷脾脆則善病消疸易傷脾端正則和利難傷脾偏傾則善滿善脹也黑色小理者腎小粗理者腎大高耳者腎高耳後陷者腎下耳堅者腎堅耳薄不堅者腎脆耳好前居牙車者腎端正耳偏高者腎偏傾也腎小則臟安難傷腎大則善病腰痛不可以俯仰易傷以邪腎高則苦背膂痛不可以俯仰腎下則腰尻痛不可以俯仰為狐疝腎堅則不病腰背痛腎脆則善病消疸易傷腎端正則和利難傷腎偏傾則苦腰尻痛也五臟皆小者少病苦焦心大愁憂五臟皆大者緩於事難使以憂五臟皆高者好高舉措五臟皆下者好出人下五臟皆堅者無病五臟皆脆者不離於病五臟皆端正者和利得人心五臟皆偏傾者邪心而善盜不可以為人平反覆言語也肺應皮皮厚者大腸厚皮薄者大腸薄皮緩腹裡大者大腸大而長皮急者大腸急而短皮滑者大腸直皮肉不相離者大腸結心應脈皮厚者脈厚脈厚者小腸厚皮薄者脈薄脈薄者小腸薄皮緩者脈緩脈緩者小腸大而長皮薄而脈衝小者小腸小而短諸陽經脈皆多紆屈者小腸結脾應肉肉䐃堅大者胃厚肉䐃麼者胃薄肉䐃小而麼者胃不堅肉䐃不稱身者胃下胃下者管約不利肉䐃不堅者胃緩肉䐃無小里纍者胃急肉䐃多少里纍者胃結胃結者上管約不利也肝應爪爪厚色黃者膽厚爪薄色紅者膽薄爪堅色青者膽急爪濡色赤者膽緩爪直色白無約者膽直爪惡色黑多紋者膽結也腎應骨密理厚皮者三焦膀胱厚粗理薄皮者三焦膀胱薄疏腠理者三焦膀胱緩皮急而無毫毛者三焦膀胱急毫毛美而粗者三焦膀胱直稀毫毛者三焦膀胱結也出本藏篇黃帝問余欲無視色持脈獨調其尺以言其病從外知內為之奈何岐伯曰審其尺之緩急小大滑澀肉之堅脆而病形定矣視人之目窠上微癰如新臥起狀其頸脈動時咳按其手足上窅而不起者風水膚脹也尺膚滑其淖澤者風也尺肉弱者解㑊安臥脫肉者寒熱不治尺膚滑而澤脂者風也尺膚澀者風痹也尺膚粗如枯魚之鱗者水泆飲也尺膚熱甚脈盛躁者病溫也其脈盛而滑者病且出也尺膚寒其脈小者泄少氣尺膚炬然先熱後寒者寒熱也尺膚先寒久大之而熱者亦寒熱也肘所獨熱者腰以上熱手所獨熱者腰以下熱肘前獨熱者膺前熱肘後獨熱者肩背熱臂中獨熱者腰腹熱肘後粗以下三四寸熱者腸中有蟲掌中熱者腹中熱掌中寒者腹中寒魚上白肉有青血脈者胃中有寒尺炬然熱人迎大者當奪血尺堅大脈小甚少氣悗有加立死論疾診尺篇仲鼻頭色青腹中痛舌冷者死鼻頭色微黑者有水氣色黃者胸上有寒色白者亡血也設微赤非時者死其目正圓者痓不治又色青為痛色黑為勞色赤為風色黃者便難也鮮明者有留飲言遲者風也搖頭言者其里痛也行遲者其表彊也坐而伏者短氣也坐而下一膝者必腰痛也裡實護腹而懷卵者必心痛也師持脈病人缺者無病也脈之因伸者無病也假令向壁臥聞師到不驚起而目盼視若三言三止脈之咽唾此為詐病假令脈自和更言此病大重當須服吐下藥針灸數十百處乃愈病者素不應食而反暴思之必發熱也師曰息搖肩者心中堅息引胸中上氣者咳息張口短氣者肺痿吐沫師曰病人語聲寂然善驚呼者骨節間病語聲喑喑然不徹者心膈間病語聲啾啾細而長者頭中病脈經脈一來而久住者病在心主中治脈二來而久住者病在肝支中治脈三來而久住者病在脾下中治脈四來而久住者病在腎間中治脈五來而久住者病在肺支中治五脈病虛羸人得此者死所以然者藥不得而治針不得而及盛人可治氣全故也診虛實法診寒熱法俱入治法診病傳變診病將死期入診生死條素帝曰病成而變何謂岐伯曰風成為寒熱疸成為消中厥成為癲疾久風為飧泄脈風成為癘病之變化不可勝數脈要精微論曰二陽之病發心脾有不得隱曲女子不月其傳為風消其傳為息賁者死不治曰三陽為病發寒熱下為癰腫及為痿厥腨㾓其傳為索澤其傳為頽疝曰一陽發病少氣善咳善泄其傳為心掣其傳為膈二陽一陰發病主驚駭背痛善噫善缺名曰風厥二陰一陽發病善脹心滿善氣三陽三陰發病為偏枯痿易四肢不舉陰陽別論黃帝問曰五臟六腑寒熱相移者何岐伯曰腎移寒於肝癰腫少氣脾移寒於肝癰腫筋攣肝移寒於心狂膈中心移寒於肺肺消肺消者飲一溲二死不治肺移寒於腎為湧水湧水者按腹不堅水氣客於大腸疾行則鳴濯濯如囊裹漿水之病也脾移熱於肝則為驚衄肝移熱於心則死心移熱於肺傳為膈消肺移熱於腎傳之柔痓腎移熱於脾傳為虛腸澼死不可治胞移熱於膀胱則癃溺血膀胱移熱於小腸膈腸不便上為口糜小腸移熱於大腸為慮瘕為沉大腸移熱於胃善食而瘦又謂之食㑊胃移熱於膽亦曰食㑊膽移熱於腦則辛頞鼻淵鼻淵者濁涕下不止也傳為衄衊瞑目故得之氣厥也氣厥論診病愈劇靈黃帝曰夫百病者多以旦慧晝安夕加夜甚何也岐伯曰朝則人氣始生病氣衰故旦慧日中人氣長長則勝邪故安夕則人氣始衰邪氣始生故加夜半人氣入臟邪獨居於身故甚也黃帝曰其時有反者何也岐伯曰是不應四時之氣臟獨主其病者是必以臟氣之所不勝時者甚以其所勝時者起也一日分為四時篇素肝主春足厥陰少陽主治其日甲乙病在肝愈於夏夏不愈甚於秋秋不死持於冬起於春禁當風肝病者愈在丙丁丙丁不愈加於庚辛庚辛不死持於壬癸起於甲乙肝病者平旦慧下晡甚夜半靜心主夏手少陰太陽主治其日丙丁病在心愈在長夏長夏不愈甚於冬冬不死持於春起於夏禁溫食熱衣心病者愈在戊己戊己不愈加於壬癸壬癸不死持於甲乙起於丙丁心病者日中慧夜半甚平旦靜脾主長夏足太陰陽明主治其日戊己病在脾愈在秋秋不愈甚於春春不死持於夏起於長夏禁溫食飽食濕地濡衣脾病者愈在庚辛庚辛不愈加於甲乙甲乙不死持於丙丁起於戊己脾病者日昳慧日出甚下晡靜肺主秋手太陰陽明主治其日庚辛病在肺愈在冬冬不愈甚於夏夏不死持於長夏起於秋禁寒飲食寒衣肺病者愈在壬癸壬癸不愈加於丙丁丙丁不死持於戊己起於庚辛肺病者下晡慧日中甚夜半靜腎主冬足少陰太陽主治其日壬癸病在腎愈在春春不愈甚於長夏長夏不死持於秋起於冬禁犯焠㶼熱食溫炙衣腎病者愈在甲乙甲乙不愈甚於戊己戊己不死持於庚辛起於壬癸腎病者夜半慧四季甚不晡靜夫邪氣之客於身也以勝相加至其所生而愈至其所不勝而甚至其所生而持自得其位而起必先定五臟之脈乃可言間甚之時死生之期也臟氣法時論上以五臟時日占病愈甚極准錢仲陽深得此理學者究心而又擴充之靈病在臟沉而大者其病易已小為逆病在腑浮而大者其病易已脈口滑小緊以沉者病益甚在中人迎氣大緊以浮者其病益甚在外脈口滑以沉者病日進在內人迎脈滑盛以浮者病日進在外脈口浮滑者病日進人迎沉而滑者病日損五色篇診生死素凡治病察其形氣色澤脈之盛衰病之新故乃治之無後其時形氣相得謂之可治色澤以浮謂之易已脈從四時謂之可治脈弱以滑是有胃氣命曰易治取之以時形氣相失謂之難治色夭不澤謂之難已脈實以堅謂之益甚脈逆四時為不可治必察四難而明告之所謂逆四時者春得肺脈夏得腎脈秋得心脈冬得脾脈其至皆懸絶沉澀者命曰逆四時玉機真臟論氣實形實氣虛形虛此其常也反此者病谷盛氣盛谷虛氣虛此其常也反此者病脈實血實脈虛血虛此其常也反此者病刺志論氣虛身熱此謂反也谷入多而氣少此謂反也谷不入而氣多此謂反也脈盛血少此謂反也脈少血多此謂反也氣盛身寒得之傷寒氣虛身熱得之傷暑谷入多而氣少者得之有所脫血濕居下也谷入少而氣多者邪在胃及與肺也脈少血多者飲中熱也脈大血少者脈有風氣水漿不入此之謂也同上形盛脈細少氣不足以息者危形疲脈大胸中多氣者死形氣相得者生參互不調者病三部九候皆相失者死上下左右之脈相應如參舂者病甚上下左右相失不可數者死中部之候雖獨調與衆臟相失者死中部之候相減者死目內陷者死全文見前上下條下同形肉已脫九候雖調猶死靈熱病脈靜汗已出脈盛躁是一逆也病泄脈洪大是二逆也著痹不移䐃肉破身熱脈偏絶是三逆也淫而奪形身熱色夭然白及後下血衃血衃篤重是謂四逆也寒熱奪形脈堅搏是謂五逆也五禁篇䐃渠損切肘膝後肉如塊者腹脹身熱脈大是一逆也腹鳴而滿四肢清泄其脈大是二逆也衄而不止脈大是三逆也咳且溲血脫形其脈小徑是四逆也咳脫形身熱脈小以疾是謂五逆也如是者不過十五日而死矣其腹大脹四末清脫形泄甚是一逆也腹脹便血其脈大時絶是二逆也咳溲血形肉脫脈搏是三逆也嘔血胸滿引背脈小而疾是四逆也咳嘔腹脹且飧泄其脈絶是五逆也如是者不及一時而死矣工不察此者而刺之是謂逆治玉版篇搏蒲谷切素熱而脈靜泄而脫血脈實病在中脈虛病在外脈堅澀者皆難治平人氣象論仲脈曰脈病人不病名曰行尸以無旺氣卒眩僕不識人者短命則死人病脈不病名曰內虛以有正氣雖困無苦左有病而右痛右有病而左痛下有病而上痛上有病而下痛此為逆逆者死不可治肥人脈細小如絲欲絶者死羸人脈躁者死人身澀而脈往來滑者死人身小而脈往來大者死人身大而脈往來小者死人身短而脈往來長者死人身長而脈往來短者死人身滑而脈往來澀者死素五臟者中之守也中盛臟滿氣勝傷恐者聲如從室中言是中氣之濕也言而微終日乃復言者此奪氣也衣被不斂言語善惡不避親疏者此神明之亂也倉廩不藏者是門戶不要也水泉不止者是膀胱不藏也得守者生失守者死脈要精微論五臟者身之強也頭者精神之府頭傾視深精神將奪矣背者胸中之府背曲肩垂府將壞矣腰者腎之府轉搖不能腎將憊矣膝者筋之府屈伸不能行則僂俯筋將憊矣骨者髓之府不能久立行則振掉骨將憊矣得強者生失強者死同上五臟之氣故色見青如草茲者死黃如枳實者死黑如炲者死赤如衃血者死白如枯骨者死此五色之見死也五臟生成篇衃芳杯切凝血也青如翠羽者生赤如雞冠者生黃如蟹腹者生白如豕膏者生黑如烏羽者生此五色之見生也同上生於心如以縞裹朱生於肺如以縞裹紅生於肝如以縞裹紺生於脾如以縞裹栝蔞實生於腎如以縞裹紫此五臟所生之外榮也同上夫精明五色者氣之華也赤欲如白裹朱不欲如赭白欲如鵝羽不欲如鹽青欲如蒼璧之澤不欲如藍黃欲如羅裹雄黃不欲如黃土黑欲如重漆色不欲如地蒼脈要精微論華他病人面目俱等者不死素面黃目青面黃目赤面黃目白面黃目黑者皆不死也面青目赤面赤目白面青目黑面黑目白面赤目青皆死也王注云凡色見黃者為有胃氣故不死五臟以胃為本故無黃色皆自死焉五臟生成篇華他病人面青目白者死病人面青目黃者五日死病人著床心痛短氣脾竭內傷百日後愈能起倣徨因坐於地其立倚床能治此者可謂神良病人面赤目白者十日死憂恚思慮心氣內索面色反好急求棺槨病人面赤目青者六日死病人面黑目白者八日死腎氣內傷病因留積病人面黑目直視惡風者死病人面白目黑者死此謂榮華已去血脈空虛赤色出兩顴大如母指者病雖小愈必卒死全文見暴死顴額骨也東垣曰脈訣言面赤如妝不久居面顯赤色於兩頰若塗胭脂之狀而又且圓也病至於此不可久居於世譬猶根本已竭枝葉未即衰落赤如紅霞滿天者是也扁鵲華他病人耳目及顴頰赤者死在五日中黑色出於庭大如母指必不病而卒死全文見暴死額中也病人黑出於額上髮際下直鼻脊兩顴上者亦死在五日中病人黑氣出天中下至年上顴上者死病人及健人或黑色及白色起入目及鼻口者死在三日中病人耳目鼻口有黑色起入於口者必死病人面黑兩脅下滿不能自轉反者死病人面黑唇青者死病人面青唇黑者死病人及健人面忽如馬肝色望之如青近之如焦黑者死病人面無精光若土色不受飲食者四日死病人目無精光及牙齒黑色者不治素五邪所見春得秋脈夏得冬脈長夏得春脈秋得夏脈冬得長夏脈是謂五邪皆同命死不治宣明五氣篇仲景云二月得毛脈何以言至秋當死答曰二月之時脈當濡弱反得毛浮者故知至秋死二月肝用事肝脈屬木應濡弱反得毛脈者是肺脈也肺屬金金來剋木故知死是也春胃微弦曰平弦多胃少曰肝病但弦無胃曰死胃而有毛曰秋病毛甚曰今病藏真散於肝肝藏筋脈之氣也平肝脈來耎弱招招如揭長竿末梢曰肝平春以胃氣為本病肝脈來盈實而滑如循長竿曰肝病死肝脈來急益徑如新張弓弦曰肝死夏胃微鉤曰平鉤多胃少曰心病但鉤無胃曰死胃而有石曰冬病石甚曰今病藏真通於心心藏血脈之氣也平心脈來纍纍如連珠如循琅玕曰心平夏以胃氣為本病心脈來喘喘連屬其中微曲曰心病死心脈來前曲後居如操帶鉤曰心死秋胃微毛曰平毛多胃少曰肺病但毛無胃曰死毛而有弦曰春病弦甚曰今病藏真高於肺以行榮衛陰陽也平肺脈來厭厭聶聶如落榆莢曰肺平秋以胃氣為本病肺脈來不上不下如循雞羽曰肺病死肺脈來如物之浮如風吹毛曰肺死冬胃微石曰平石多胃少曰腎病但石無胃曰死石而有鉤曰夏病鉤甚曰今病藏真下於腎腎藏骨髓之氣也平腎脈來喘喘纍纍如鉤按之而堅曰腎平冬以胃氣為本病腎脈來如引葛按之益堅曰腎病死腎脈來發如奪索辟辟如彈石曰腎死長夏胃微耎弱曰平弱多胃少曰脾病但代無胃曰死耎弱有石曰冬病弱甚曰今病藏真濡於脾脾藏肌肉之氣也平脾脈來和柔相離如雞踐地曰脾平長夏以胃氣為本病脾脈來實而盈數如雞舉足曰脾病死脾脈來鋭堅如烏之啄如鳥之距如屋之漏如水之流曰脾死以上並見平人氣象論真肝脈至中外急如循刀刃責責然如按琴瑟弦色青白不澤毛折乃死仲景云肝死藏浮之弱按之如索不來或曲如蛇形者死真心脈至堅而搏如循薏苡子纍纍然色赤黑不澤毛折乃死仲景云心死藏浮之脈實如豆麻擊手按之益躁疾者死真肺脈至大而虛如以毛羽中人膚色白赤不澤毛折乃死仲景云肺死藏浮之虛按之弱如蔥葉下無根者死真腎脈至搏而絶如指彈石辟辟然色黑黃不澤毛折乃死仲景云腎死藏浮之堅按之亂如轉丸益下入尺中者死真脾脈至弱而乍疏乍數色黃青不澤毛折乃死仲景云脾死藏浮之大堅按之中如覆杯潔潔然如搖者死諸真藏脈見皆為死不治也黃帝曰見真藏曰死何也岐伯曰五臟者皆稟氣於胃胃者五臟之本也臟氣者不能自致於手太陰必因於胃氣乃至於手太陰也故五臟各以其時自為而至於手太陰也故邪氣勝者精氣衰也故病甚者胃氣不能與之俱至於手太陰故真臟之氣獨見獨見者病勝藏也故曰死以上並玉機真藏篇人以水穀為本故人絶水穀則死脈無胃氣亦死所謂無胃氣者但得真藏脈不得胃氣也平人氣象論所謂陰者真藏也見則為敗敗必死也所謂陽者胃脘之陽也陰陽別論凡持真脈之藏脈者肝至懸絶急十八日死心至懸絶九日死肺至懸絶十二日死腎至懸絶七日死脾至懸絶四日死同上仲寸脈下不至關為陽絶尺脈上不至關為陰絶此皆不治決死也若計其餘命死生之期以月節克之也王注云陽絶死於春夏陰絶死於秋冬此言甚應靈所謂五十榮者五臟皆受氣持其脈口數其至也五十動而不一代者五臟皆受氣四十動一代者一臟無氣脈經云卻後四歲春草生而死三十動一代者二臟無氣脈經云卻後三歲麥熟而死二十動一代者三臟無氣脈經云卻後二歲桑椹赤而死十動一代者四臟無氣脈經云歲中死得節不動出清明日死遠不出穀雨死矣不滿十動一代者五臟無氣脈經云卻後五日死豫之短期要在終始所謂五十動而不一代者以為常也以知五臟之期豫之短期者乍數乍疏也根結篇難經云脈不滿五十動而一止一臟無氣者何臟也然人吸者隨陰入呼者因陽出今吸不能至腎至肝而還故知一臟無氣者腎氣先盡也仲按脈之來緩而時一止復來者名曰結陰也又脈來動而中止更來小數中有還者及動名曰促陽也脈來動而中止不能自還者動而中止復來如前名曰代陰也得此脈者必難治自還者動而中止復來數於前動也不能自還者動而中止復來如前動同而不數也活有結脈有促脈有代脈結者陰也陰盛則結脈來緩時一止復來曰結主胸滿煩躁促者陽也陽盛則促脈來數時一止復來曰促主積聚氣痞憂思所成大抵結促之脈雖時一止為病脈非死脈也唯代脈者真死矣往來緩動中止不能自還因而復動名曰代也代者死也仲景傷寒脈結代心動悸炙甘草湯主之脈熱病脈四至三日死脈四至者平人一至病人脈四至也熱病脈五至一日死時一大至半日死忽忽悶亂者死熱病脈六至半日死忽忽疾大至有頃死熱病脈四損三日死所謂四損者平人四至病人脈一至名曰四損熱病脈五損一日死所謂五損者平人脈五至病人脈一至名曰五損熱病脈六損一時死所謂六損者平人脈六至病人脈一至名曰六損若絶不至良久乃至立死脈平人不病脈來如屋漏雀啄者死此脾真藏脈也王注云屋漏者其來既絶而止時時復起而不相連屬也雀啄者如啄米甚數頻來是也脈來如彈石去如解索者死此腎真藏脈也王注云彈石者辟辟急也解索者動數而隨散亂無復次第也病人脈如蝦之遊如魚之翔者死王注云蝦游者冉冉而起尋復退沒不知所至久乃復起起輒遲而沒去速者是也魚翔者似魚不行而但掉尾動頭身搖而久住者是也脈如轉豆者死脈如偃刀者死脈湧湧不去者死脈忽去忽來暫止復來者死脈分絶者死轉豆者心真臟脈偃刀者肝真臟脈忽去忽來者脾真臟脈也三部脈如釜中湯沸朝得暮死半夜得日中死日中得半夜死難寸口脈平而死者何謂也然諸十二經脈者皆繫於生氣之原所謂生氣之原者謂十二經之根本也謂腎間動氣也此五臟六腑之本十二經脈之根呼吸之門三焦之原一名守邪之神故氣者人之根本也根絶則莖葉枯矣寸口脈平死者生氣獨絶於內也八難謂兩手寸關尺脈皆平而難也素五臟相通移皆有次五臟有病則各傳其所勝不治法三月若六月若三日若六日傳五臟而當死風者百病之長也今風寒客於人使人毫毛畢直皮膚閉而為熱當是之時可汗而發也或痹不仁腫痛當是之時可湯尉及火灸刺而去之弗治病入舍於肺名曰肺痹發咳上氣弗治肺即傳而行之肝病名曰肝痹一名曰厥脅痛出食當是之時可按若刺耳弗治肝傳之脾病名曰脾風發疸腹中熱煩心出黃當此之時可按可藥可浴王注云出黃謂黃色出於便瀉之所是也弗治脾傳之腎病名曰疝瘕少腹冤熱而痛出白一名曰蠱當此之時可按可藥弗治腎傳之心病筋脈相引而急病名曰瘈當此之時可灸可藥弗治滿十日者法當死腎因傳之心心即復反傳而行之肺發寒熱法當三歲死此病之次也然其卒發者不必治於傳或其傳化有不以次不以次入者憂恐悲喜怒令不得以其次故令人有大病矣因而喜大虛則腎氣乘矣怒則肝氣乘矣悲則肺氣乘矣恐則脾氣乘矣憂則心氣乘矣此其道也故病有五五五二十五變及其傳化傳乘之名也玉機真藏論上邪初入表蓋傳之緩者也夫病傳者心病先心痛一日而咳心火傳肺金也三日脅支痛肺金傳肝木也五日閉塞不通身痛體重肝木傳肺金也三日不已死冬夜半夏日中肺病喘咳三日而脅支滿痛肺金傳肝木也一日身重體痛五日而脹肝木一日傳脾土脾五日傳胃也十日不已死冬日入夏日出肝病頭目眩脅支滿三日體重身痛五日而脹肝木三日傳脾土脾五日傳胃也三日腰脊少腹痛脛酸脾胃土傳腎水也三日不已死冬日入夏早食脾病身痛體重一日而脹脾自傳胃二日少腹腰脊痛脛酸三日背𦛗筋痛小便閉脾土三日傳腎水腎三日傳膀胱也十日不已死冬人定夏晏食腎病少腹腰脊痛胻酸三日背𦛗筋痛小便閉腎傳膀胱也三日腹脹膀胱水傳小腸火也三日兩脅支痛小腸傳心也兩脅恐錯二日不已死冬大晨夏晏晡胃病脹滿五日少腹腰脊痛胻酸胃土傳腎水也三日背𦛗筋痛小便閉腎傳膀胱也五日身體重膀胱水傳心火身體重亦錯簡六日不已死冬夜半後夏日昳膀胱病小便閉五日少腹脹腰脊痛胻酸膀胱傳腎也一日腹脹腎水傳小腸火也二日身體痛小腸傳心也身體痛亦錯簡二日不已死冬雞鳴夏下晡諸病以次是靈樞無是字相傳如是者皆有死期不可刺間一臟止靈樞無止字及至三四臟者乃可刺也標本病傳論上靈樞謂之大氣入臟蓋傳之急者也王注云有緩傳者有急傳者緩者或一歲二歲三歲而死其次或三月若六月而死急者一日二日三日四日或五六日而死則此類也王氏此言甚能推廣經意然不能驗日數者但驗病之次傳如心先病心痛次傳於肺或咳或喘次傳於肝或脅痛或頭眩次傳於脾胃或閉塞不通或身痛體重或脹或泄次傳於腎膀胱或少腹腰脊痛脛酸或背𦛗筋痛小便閉如此曰必死無疑纍驗有準鄰人趙氏始肝病脅痛半載次傳之脾腹脹而死又卜叔英嫂氏始肺病咳喘次傳之肝頭眩不寐次傳之脾腹脹而死又楊白鹿師始脾病腹痛次傳之膀胱小便淋閉次傳之心胸痹痛通身青脈而死矣蓋心主血脈故也難經言七傳者死間臟者生何謂也然七傳者傳其所勝也間臟者傳其子也何以言之假令心病傳於肺肺傳於肝肝傳於脾脾傳於腎腎傳於心一臟不再傷故言七傳者死也間臟者傳其所生也假令心病傳脾脾傳肺肺傳腎腎傳肝肝傳心是母子自相傳周而復始如環之無端故言生也五十三難經言者素問靈樞二經之病傳論所言也七傳當作次傳次傳者死即素靈二經病傳論言諸病以次相傳皆有死期不可刺者是也心火傳所勝之肺金肺金傳所勝之肝木故曰傳其所勝也間臟者生即素靈二經病傳論言間一臟及至三四臟乃可刺者是也蓋心病本傳肺肺本傳肝肝本傳脾今心病間肺一臟傳肝或間肺肝二臟傳脾肝木生心火心火生脾土故曰傳其所生也難經諸證惟呂廣釋七傳為次傳為得經旨虞庶父非是注而穿鑿釋之實秦越人呂廣之罪人也活傷寒入里見標脈則生假令胃病下之脈浮而汗出是也雜病出表見標脈則死假令脾病補之脈弦而面青者是也素九候之脈皆沉細懸絶者為陰主冬故以夜半死盛躁喘數者為陽主夏故以日中死寒熱病者以平旦死熱中及熱病者以日中死病風者以日夕死病水者以夜半死脈乍疏乍數乍遲乍疾者日乘四季死三部九候論肝見庚辛死心見壬癸死脾見甲乙死肺見丙丁死腎見戊己死是謂真藏見皆死平人氣象論五臟受氣於其所生傳之於其所勝氣舍於其所生死於其所不勝病之且死必先傳行至其所不勝病乃死此言氣之逆行也故死同下肝受氣於心傳之於脾氣舍於腎至肺而死緩者秋死急者庚辛日及日晡死是也心受氣於脾傳之於肺氣舍於肝至腎而死緩者冬死急者壬癸日及夜半死也脾受氣於肺傳之於腎氣舍於心至肝而死緩者春死急者甲乙日及朝死也肺受氣於腎傳之於肝氣舍於脾至心而死緩者夏死急者丙丁日及日中死也腎受氣於肝傳之於心氣舍於肺至脾而死緩者長夏死急者戊己日及戌辰丑未死也此皆逆死也一日一夜五分之此所以占死生之早暮也玉機真藏論甲乙經死生作死者一日一夜五分之謂朝主肝晝主心辰戌丑未主脾晡主肺夜主腎也大骨枯槁大肉陷下胸中氣滿喘息不便其氣動形期六月死真臟脈見乃豫之期日王注云皮膚幹著骨間肉陷謂人骨枯槁大肉陷下也真臟脈形見前按脈條大骨枯槁大肉陷下胸中氣滿喘息不便內痛引肩項期一月死真臟見乃豫之期日大骨枯槁大肉陷下胸中氣滿喘息不便內痛引肩項身熱脫肉破䐃真臟見十月之內死王注云䐃謂肘膝後肉也如塊者䐃渠損切大骨枯槁大肉陷下肩髓內消動作益衰真臟未見期一歲死見其真臟乃豫之期日王注云肩髓內消謂缺盆深也動作衰謂交接微也大骨枯槁大肉陷下胸中氣滿腹內痛心中不便肩項身熱破䐃脫肉目眶陷真臟見目不見人立死其見人者至其所不勝之時則死急虛身中卒至五臟絶閉脈道不通氣不往來譬於墮溺不可為期其脈絶不來若人一息五六至其形肉不脫真臟雖不見猶死也林注云一息當作一呼以上並玉機真臟論靈是故怵惕思慮者則傷神神傷則恐懼流淫而不止因悲哀動中者竭絶而失生喜樂者神憚散而不藏愁憂者氣閉塞而不行盛怒者迷惑而不治恐懼者神蕩憚而不收本神篇下同心怵惕思慮則傷神神傷則恐懼自失破䐃脫肉毛悴色夭死於冬脾憂愁而不解則傷意意傷則悗亂四肢不舉毛悴色夭死於春肝悲哀動中則傷魂魂傷則狂忘不精不精則不正當人陰縮而攣筋兩脅骨不舉毛悴色夭死於秋肺喜樂無極則傷魄魄傷則狂狂者意不存人皮革焦毛悴色夭死於夏腎盛怒而不止則傷志志傷則喜忘其前言腰脊不可以俯仰屈伸毛悴色夭死於季夏恐懼而不解則傷精精傷則骨酸痿厥精時自下是故五臟主藏精者也不可傷傷則失守而陰虛陰虛則無氣無氣則死矣素瞳子高者太陽不足戴眼者太陽已絶此決死生之要不可不察三部九候論下同足太陽氣絶者其足不可屈仲死必戴眼太陽之脈其終也戴眼反折瘛瘲其色白絶汗乃出出則死矣診要經終篇下同凡癇痓亦戴眼灸崑崙穴即隨下不戴也若灸崑崙仍眼戴不下者是為太陽終也王注絶汗謂出汗如珠不流復旋干也少陽終者耳聾百節皆縱目睘絶系絶系一日半死其死也色先青白乃死矣睘音瓊王注云目睘謂直視如驚貌陽明終者口目作動善驚妄言色黃其上下經盛不仁則終矣王注云經盛謂面目頸額足跗腕脛皆躁盛而動也不仁謂不知善惡也少陰終者面黑齒長而垢腹脹閉上下不通而終矣面黑者手少陰絶齒長者足少陰絶太陰終者腹脹閉不得息善噫善嘔嘔則逆逆則面赤不逆則上下不通不通則面黑皮毛焦而終矣厥陰終者中熱嗌乾善溺心煩甚則舌卷卵上縮而終矣此十二經之所敗也靈手太陰氣絶則皮毛焦太陰者行氣溫於皮毛者也故氣不榮則皮毛焦皮毛焦則津液去皮節津液去皮節者則爪枯毛折毛折者則毛先死丙篤丁死火勝金也經脈篇下同手少陰氣絶則脈不通脈不通則血不流血不流則髦色不澤故其面黑如漆柴者血先死壬篤癸死水勝火也足太陰氣絶者則脈不榮肌肉唇舌者肌肉之本也脈不榮則肌肉軟肌肉軟則舌痿人中滿人中滿則唇反唇反者肉先死甲篤乙死木勝土也足少陰氣絶則骨枯少陰者冬脈也伏行而濡骨髓者也故骨不濡則肉不能著也骨肉不相親則肉軟卻肉軟卻故齒長而垢發無澤發無澤者骨先死戊篤己死土勝水也足厥陽氣絶則筋絶厥陰者肝脈也肝者筋之合也筋者聚於陰器而脈絡於舌本故脈弗榮則筋急筋急則引舌與卵故唇青舌卷卵宿則筋先死庚篤辛死金勝木也五陰氣俱絶則目系轉轉則目運目運者為志先死志先死則遠一日半死矣六陽氣絶則陰與陽相離離則腠理發泄絶汗乃出故旦占夕死夕占旦死仲脈浮而洪身汗如油喘不休水漿不下體形不仁乍靜乍亂者此為命門絶也又未知何臟先受其災若汗出發潤喘不休者此為肺先絶也陽反獨留形體如煙煤直視搖頭者此為心絶也唇吻反青四肢漐漐汗出者此為肝絶也環口黧黑柔汗發黃者此為脾絶也溲便遺屎狂言目反直視者此為腎絶也又未知何臟陰陽相絶若陽氣前絶陰氣後竭者其人死身色必青陰氣前絶陽氣後竭者其人死身色必黃腋下溫心下熱也六腑氣絶於外者手足寒上氣腳縮五臟氣絶於內者利不禁下甚手足不仁脈病人肝絶八日死何以知之面青但欲伏眠目視而不見人汗出如水不止一云二日死也病人膽絶七日死何以知之眉為之傾病人筋絶九日死何以知之手足爪甲青呼罵不休一云八日死病人心絶一日死何以知之肩息回視立死一云目停停二日死病人腸絶六日死何以知之髮直如干麻不得屈伸自汗不止一云小腸絶病人脾絶十二日死何以知之口冷足腫腹熱臚脹泄利不覺出無時度一云五日死病人胃絶五日死何以知之脊痛腰中重不可反覆一曰腓腸平九日死病人肉絶六日死何以知之耳干舌背腫溺血大便赤泄一曰足腫九日死病人肺絶三日死何以知之口張但氣出而不還一曰鼻口虛張短氣病人大腸絶不治何以知之泄痢無度痢絶則死病人腎絶四日死何以知之齒為暴枯面為正黑目中黃色腰中欲折自汗出如流水一云人中平七日死病人骨絶齒黃落十日死諸浮脈無根者皆死以上五臟六腑為根也扁鵲華他病人五臟已奪神明不守聲嘶者死病人循衣縫譫語者不可治陽明絶病人陰陽俱絶掣衣掇空妄言者死病人妄語錯亂及不能語者不治熱病者可治以上三條皆陽明絶病人陰陽俱絶失音不能言者三日半死病人臥遺尿不覺者死陽明絶病人尸臭者不可治病人面晃白直視肩息者一日死膽肺絶病人陰結陽絶目精䀮䀮者死病人陰陽絶竭目眶陷者死病人目系傾者七日死病人口如魚口不能復閉而氣出多不反者死病人口張者三日死病人唇青人中反者死脾肝絶下同病人唇反人中滿者死病人唇口忽乾者不治未詳病人唇腫齒焦者死肝腎絶病人陰陽俱竭其齒如熟小豆其脈駃者死病人齒忽變黑者十三日死少陰絶病人舌卷卵縮者必死厥陰絶病人汗出不流舌卷黑者死太陰厥陰絶病人髮直者十五日死少陰絶病人發如干麻善怒者死少陰絶病人發與眉衝起者死同上病人爪甲青者死病人爪甲白者不治病人手足爪甲下肉黑者八日死病人榮衛竭絶面浮腫者死病人卒腫其面蒼黑者死病人手掌腫無文者死病人臍腫反出者死臍反出者此為脾先絶病人陰囊莖俱腫者死病人脈絶口張足腫五日死病人足跗上腫兩膝大如斗者十日死諸脈診病雜法諸脈診病雜法者竅恐迷亂診病大綱故以雜法名之也凡前篇脈之浮沉遲數虛實洪細滑澀所指陰陽表里寒熱血虛氣實之病者皆診病之大綱學者常須識此勿令誤也故內經論脈主病必以陰陽相對言之或以五臟分配言之未嘗雜他法者欲人識其綱也故診病先定大綱然後雜究諸病如診得浮脈大綱主表也沉脈大綱主裡也然後雜究其或屬寒屬風屬氣等病之類是也余見如左方無擇浮為在表為風為氣為熱為痛為嘔為脹為痞為喘為厥為內結為滿不食浮大為鼻塞浮緩為不仁浮大長為風眩癲疾浮滑疾為宿食浮大而澀為宿食滯氣浮短為肺傷諸氣浮滑為飲為走刺浮細而滑為傷飲浮滑疾緊為百合病浮數為大便堅小便數浮緊為淋為癃閉東垣辨脈浮所主病不同浮者沉之反也瞥瞥然見於皮毛上與皮毛相得微按之則絶無有如空中之浮雲所主病一則為風一則為虛古人云浮而有熱者虛也浮而無熱者風也豫謂此未盡善蓋風有八風寒熱溫涼各各不同其中有風熱止言脈浮雖不能分別八面之風兼見脈候止說浮而已須兼見的證單在一臟或兩臟相合亦足以分何臟之病言風無熱則非也況八風之脈皆見於左手寸脈外側若右手行陰道脈中受虛邪賊邪之風亦於氣口外側顯見推而內之外而不內者是也其虛勞脈雖有傳變必顯於內側六脈互傳皆為不足之病則是五臟傳變必從四時傳變於外六腑乃受之如是則勝復之作不能相過此之謂也若浮而弦者風也見於左關浮而澀者虛也見於右寸無擇寸芤為吐血微芤為衄血關芤為更血為腸癰尺芤為下焦虛小便血出滑為吐為滿為熱為伏痰為宿食為蓄血為經閉為咳為血氣俱實滑而浮散為癱瘓滑數為結熱滑實為胃熱滑利為妊娠滑而大小不勻必吐為病進為泄利滑而浮大小腹痛溺則陰中痛大便亦然又滑為鬼疰素脈滑曰風無擇實為熱為嘔為痛為氣塞為喘咳為大便不禁實緊為陰不勝陽為胃寒為腰痛弦為寒為痛為飲為瘧為水氣為中虛為厥逆為拘急為寒癖弦緊為惡寒為疝瘕為癖弦而鉤為脅下刺痛弦長為積隨左右上下為瘀血仲弦則衛氣不行無擇緊為寒為痛為咳為喘為滿浮緊為肺有水緊滑為蛔動急為遁尸緊數為寒熱又為宿食為吐逆素盛而緊曰脹本事記有人患傷寒六七日心煩昏睡咽燥小便白色自汗豫診之寸口尺中俱緊豫曰寒中少陰之經是以脈緊仲景云脈緊而汗出者亡陽也屬少陰法當咽痛而復下痢蓋謂此也有難之曰脈訣緊脈屬七表仲景以緊脈屬少陰然則緊脈屬陽耶屬陰耶豫言仲景云寸口脈俱緊者清邪中於上焦濁邪中於下焦又云陰陽俱緊者口中氣出唇口乾燥蜷臥足冷鼻中涕出舌上滑苔勿妄治也又云緊則為寒又云諸緊為寒又曰曾為人所難緊脈從何而來師云假令亡汗若吐以肺裡寒故令脈緊假令咳者坐飲冷水故令脈緊假令下痢以胃虛故令脈緊又云寸口脈微尺脈緊其人虛損多汗由是觀之則是寒邪之氣久客經脈所致皆虛寒之脈也其在陽經則浮而緊在陰經則沉而緊故仲景云浮緊名為傷寒又曰陽明脈浮而緊者必潮熱此在陽則浮而緊也在陰則沉而緊故仲景云寸口脈微尺脈緊其人虛損多汗則陰當先絶而不見陽又云少陰緊至七八日自下痢脈暴微手足反溫脈緊反去者此欲解也此在陰則沉而緊也仲景云浮為在表沉為在裡數為在腑遲為在臟欲知表裡臟腑先以浮沉遲數為定然後兼於證而別陰陽也無擇洪為脹為滿為痛為熱為煩洪實為癲洪緊為癰疽為喘急亦為脹洪浮為陽邪大為祟素粗大者陰不足陽有餘為熱中也脈要精微論大則病進丹溪云大洪之別名其病得之於內傷者陰虛為陽所乘故脈大當作虛治之其病得之於外傷者邪客於經脈亦大當作邪勝治之合二者觀之皆病方長之勢也謂之病進不亦宜乎海藏云君侵臣是也仲平人脈大為勞大則為虛無擇數為熱為虛為吐為痛為煩渴為煩滿促經無文釋曰其促有五一曰氣二曰血三曰飲四曰食五曰痰但臟熱則脈促以氣血痰飲留滯不行則止促非惡脈也散經無文釋曰六腑氣絶於內則手足寒上氣五臟氣絶於內則下痢不禁甚者不仁其脈皆散散則不聚病亦危矣革為滿為急為虛寒相搏婦人為半産漏下釋曰革者革也固結不移之狀三部應之皆危脈也微為虛為弱為衄為嘔為泄為亡汗為拘急微弱為少氣為中寒沉為在裡為實為水為寒為喘為瘕癥沉弱為寒熱沉細為少氣臂不能舉沉滑為風水為下重沉緊為上熱下冷沉重而直前絶者為瘀血沉重而中散者為寒食成癥沉重不至寸細絶者為遁尸沉緊為懸飲沉遲為痼冷沉重為傷暑發熱緩為在下為風為寒為弱為痹為疼為不仁為氣不足為眩暈緩而滑為熱中緩而遲虛寒相搏食冷則咽痛澀為少血為亡汗熱氣不足為逆冷為下痢為心痛澀而緊為痹為寒濕素脈澀曰痹丹脈之狀不一大率多兼見之人之病有四曰實曰熱曰寒曰虛故學者診亦必浮沉遲數為之綱以察病情初學者又以浮數為熱為有餘沉遲為寒為不足其間最難體認者澀脈也最難調治者弦脈也澀脈細而遲往來難且散又曰短而止得此脈者固為寒為濕為血虛為汙血為氣多然亦有病熱與實者或者得脈之帶澀徒見其有細有遲又散皆是不足之象便以為虛而寒猛浪用藥寧不誤人若夫或因多怒或因憂鬱或因厚味或因補劑燥劑或因表裡無汗氣騰血沸清化為濁老痰凝血膠固雜揉脈道澀滯亦見澀狀參之形證病情斯得先賢曰澀而堅按之不減有力為中焦實有伏結脾肺氣寒實熱在胃中可不慎歟弦為春令之脈非春時而見者木為病也五臟更相制伏以防其太過木為病則肝邪盛矣肝之盛金之衰也金之衰火之炎也火之炎水之弱也金不足以制木則土病矣考之諸家則曰弦者虛也為反胃為痛痹沉弦為疝瘕弦長為積病雙弦為寒飲雙弦而遲為心下堅偏弦飲也弦急為腹痛弦而鉤主蜚尸弦緊而微細主寒積微弦而伏主癥不治弦而大主半産漏下亡血失精弦而小主寒痹弦在左寸頭痛弦在右寸水走腸胃弦在左關怒而血聚弦在右關寒痛四肢拘急弦在趺陽腸痔下血弦在尺中小腹痛白腸挺核木邪風氣上極土敗為病先哲蓋常言之矣惟金因火伏木寡於畏之論猶未發明倘非滋水以降火厚土以養金而又以行濕散風導郁為之輔佐邪何由去病何由安況弦脈為病甚多而治法又有隔二隔三之異故不容於自默也若曰不然何弦屬陽而仲景列沉澀弱微弦為五陰之數至於敗散殘賊之脈又以弦為之首澀為之中其意可見蜚扶滑切無擇遲為寒為痛遲而澀為癥瘕咽酸伏為霍亂為疝瘕為水氣為溏泄為停痰為宿食為諸氣上衝為惡膿死肌濡為虛為痹為自汗為氣弱為下重濡而弱為內熱外冷自汗為小便難弱為虛為風熱為自汗細為血氣俱虛為病在內為積為傷濕為後泄為寒為神勞為憂傷過度為腹滿細而緊為癥瘕積聚為刺痛細而滑為僵仆為發熱為嘔吐動為痛為驚為痹為泄為恐虛為寒為腳弱為虛為食不消化為傷暑結為痰為飲為血為積為氣釋曰氣寒脈緩則為結氣熱脈數則為促雖緩數不同亦當如促脈分別可也代者一臟絶他臟代至釋曰代真死脈不分三部隨應皆是脈經寸浮則中風寸芤則胸中積血寸滑則嘔逆寸實則胸中熱寸弦則胸中急痛寸緊則頭項急寸洪則熱甚於胸中寸微則陽虛寸沉則陰中伏陽胸中痰寸緩則太陽中濕寸澀則中氣虛寸遲則陰溢於上寸伏則胸中積氣寸濡則多自汗寸弱則陽氣虛微關浮則腹脹滿關芤則腸中積血關滑則胃寒不能食關實則胃中切痛關弦則胃寒不能食關緊則腹中鬱結關洪則番胃吐食關微則氣結於心下關沉則心下痛關緩則腰痛難伸關澀則血少而留停關遲則粥漿不入關伏則腸癖瞑目關濡則少氣精神散關弱則胃氣虛尺浮則大便乾澀尺芤則小便有血尺滑則下焦停寒尺實則小腹脹小便不禁尺弦則下焦停水尺緊則臍腹痛尺洪則陰絶尺微則臍下有積尺沉則腰腳重尺緩則飲食不消尺澀則逆冷傷血尺遲則寒甚於腰腳尺伏則飧泄穀不化尺濡則骨肉不相親尺弱則陰氣內絶素夫脈者血之府也長則氣治短則氣病數則煩心大則病進上盛則氣高下盛則氣脹代則氣衰細則氣少澀則心痛渾渾革至如湧泉病進而色敝綿綿其去如弦絶者死脈要精微論寸口之脈中手短者曰頭痛寸口脈中手長者曰足脛痛寸口脈中手促上擊者曰肩背痛脈小弱以澀者謂之久病脈滑浮而疾者謂之新病以上平人氣象論徵其脈小色不奪者新病也徵其脈不奪其色奪者此久病也徵其脈與五色俱奪者此久病也徵其脈與五色俱不奪者新病也推而外之內而不外有心腹積也王注云脈附臂筋取之不審推筋令遠使脈外行而不出外者心腹積也推而內之外而不內身有熱也王注云脈遠臂筋推之令近遠而不近身有熱也推而上之上而不下腰足清也上而不下甲乙經作聚而不上治宜舉之也推而下之下而不上頭項痛也下而不上甲乙經作上而不下用宜抑之也按之至骨脈氣少者腰脊痛而身有痹也以上脈要精微論孫按開寶寺僧衣鉢甚厚常施惠於人孫重之與往還一日謂孫曰某有一事於翁約賞罰為戲可否孫曰如何為賞罰僧曰若診吾脈若知某病賞三十千為一筵若不中罰十千歸小僧孫曰諾與之診左手無脈右手有脈遂尋左手之脈乃轉左臂上動遙如常孫曰此異脈也醫書不載脈行常道豈有移易之理往昔少年為驚撲震動心神脈脫舊道乍移臂外復遇驚撲不能再歸年歲長大氣血已定不能復移目下無病爾僧曰某襁褓而撲皆幾死固宜脈失所某亦平生無病亦不曾診脈聞公神醫試驗之果神醫也診一歲病證相同一歲病證相同者五運六氣所為之病也五運六氣之病有常有變難診另詳於運氣類證今但取常而不變者編之立秋二玄委西南方秋分七倉果西方立冬六新洛西北方夏至九上天南方招搖中央冬至一葉蟄北方立夏四陰洛東南方春分三倉門東方立春八天留東北方靈太乙常以冬至之日居葉蟄之宮四十六日明日居天留四十六日明日居倉門四十六日明日居陰洛四十五日明日居天宮四十六日明日居玄委四十六日明日居倉果四十六日明日居新洛四十五日明日復居葉蟄之宮曰冬至矣太乙日遊以冬至之日居葉蟄之宮數所在日從一處至九日復反於一常如是無已終而復始太乙移日天必應之以風雨以其日風雨則吉歲美民安少病矣先之則多雨後之則多旱太乙在冬至之日有變占在君太乙在春分之日有變占在相太乙在中宮之日有變占在吏太乙在秋分之日有變占在將太乙在夏至之日有變占在百姓所謂有變者太乙居五宮之日疾風折樹木揚沙石各以其所主占貴賤因視風所從來而占之風從其所居之鄉來為實風主生長養萬物從其沖後來為虛風傷人者也主殺主害謹候虛風而避之故聖人曰避虛邪之道如避矢石然邪弗能害此之謂也是故太乙入徙立於中宮乃朝八風以占吉凶也風從南方來名曰大弱風其傷人也內舍於心外在於脈其氣主為熱風從西南方來名曰謀風其傷人也內舍於脾外在於肌其氣主為弱風從西方來名曰剛風其傷人也內舍於肺外在於皮膚其氣主為燥風從西北方來名曰折風其傷人也內舍於小腸外在於手太陽脈脈絶則溢脈閉則結不通善暴死風從北方來名曰大剛風其傷人也內舍於腎外在於骨與肩背之膂筋其氣主為寒風從東北方來名曰凶風其傷人也內舍於大腸外在於兩脅腋骨下及肢節風從東方來名曰嬰兒風其傷人也內舍於肝外在於筋紐其氣主為身濕風從東南方來名曰弱風其傷人也內舍於胃外在肌肉其氣主體重此八風皆從其虛之鄉來乃能病人三虛相搏則為暴病卒死兩實一虛病則為淋露寒熱犯其雨濕之地則為痿故聖人避風如避矢石焉其有三虛而偏中於邪風則為擊僕偏枯矣九宮八風篇中宮之日立春立夏立秋立冬四日屬四維中央之土也太乙入徙立於中宮當作立於五宮黃帝曰願聞歲之所以皆同病者何因而然少師曰此八正之候也黃帝曰候之奈何少師曰候此者當以冬至之日太乙立於葉蟄之宮其至也天必應之以風雨風雨從南方來者為虛風賊傷人者也其夜半至者萬民皆臥而弗犯故其歲民少病其以晝至者萬民懈惰而皆中於虛風故萬民多病虛邪入客於骨而不發於外至其立春陽氣大發腠理開因立春之日風從西方來萬民又皆中於虛風此兩邪相搏經氣結代者矣故諸逢其風而遇其雨者命曰遇歲露焉因歲之和而少賊風者民少病而少死歲多賊風邪氣寒溫不和則民多病而死矣黃帝曰虛邪之風其所傷貴賤何如候之奈何少師答曰正月朔日太乙居天留之宮其日西北風不雨人多死矣正月朔日平旦北風春民多死正月朔日平旦北風行民病多者十有三也正月朔日日中北風夏民多死正月朔日夕時北風秋民多死終日北風大病死者十有六也正月朔日風從南方來命曰旱鄉從西方來命曰白骨將國有殃人多死亡正月朔日風從東方來髮屋揚沙石國有大災正月朔日風從東南方行春有死亡正月朔天和溫不風糴賤民不病天寒而風糴貴民多病此所謂候歲之風賤傷人者也二月醜不風民多心腹病三月戌不溫民多寒熱四月巳不暑民多疸病十月申不寒民多暴死諸所謂風者皆髮屋折樹木揚沙石起毫毛發腠理者也歲露論
