body:
  text: 卷之十三肝膽部驚悸怔忡驚者心卒動而不寧也悸者心跳動而怕驚也怔忡亦心動而不寧也丹怔忡大概屬血虛與痰有慮便動者屬虛時作時止者痰因火動瘦人多是血虛肥人多是痰飲真覺心跳者是血少宜四物安神之類治勞役心跳大虛症硃砂一錢歸身白芍側柏川芎各五錢陳皮甘草黃連各三錢上用豬心血為丸垣六脈俱大按之空虛必面赤善驚上熱乃手少陰心之脈也此氣盛多而亡血以甘寒鎮墜之劑瀉火與氣以墜氣浮以甘辛溫微苦峻補其血熟地黃生地黃柴胡升麻白芍藥牡丹皮川芎黃耆之類以補之以防血溢上竭甘寒鎮墜之劑謂丹砂之類杜林學士本南人歷內地為官有一子甚端嚴而聰敏父母愛之居常喜食海蛤飲食之頃未嘗不設至十八年忽面色頓青形體瘦削夜多驚悸皆謂勞瘵之疾百療不瘳遂召杜脈之杜曰非病何以知之蓋雖瘦削麵青精神不減問學院子秀才好食甚物曰多食南海中味杜曰但多服生津液藥病當自愈如是經兩月面色漸有紅潤意夜亦無驚悸林學士延杜而問曰醫師之驗久聞世名願聞此病所以杜曰王冰素問曰鹽發渴乃勝血之證海味皆咸物既多食海味使心血漸衰則夜驚悸今既去咸用生津液之藥人且少壯血液易生面色漸有紅潤此疾去乃安矣衆醫以為勞瘵非其治也仲食少飲多水停心下甚者則悸微者短氣飲水多必心下悸無五飲停蓄閉於中脘最使人驚悸屬飲家溫膽湯治心膽虛怯觸事易驚或夢寐不祥遂致心驚膽懾氣鬱生涎涎與氣搏變生諸症或短氣悸乏或復自汗膽虛不能致脾則脾之水飲作矣半夏湯洗竹茹枳實炒各二兩橘皮二兩去白甘草炙一兩白茯苓一兩五錢上為銼散每服四大錢水一盞半薑五片棗一枚煎七分去渣食前服仲心下悸者半夏麻黃丸主之半夏麻黃等分上二味為末煉蜜和丸如小豆大飲服三丸日三服茯苓甘草湯方見傷寒悸素東方青色入通於肝其病發驚駭金匱真言論脾移熱於肝則為驚衄全文見診病傳變一陽一陰發病主驚駭背痛善噫善欠者名曰風厥全文見診三陽一陰太陽脈勝一陰不得止內亂五臟外為驚駭陰陽類論本珍真丸獨活丸並治臥驚悸多魘二方並見不得臥經云臥則血歸於肝今血不靜臥不歸肝故驚悸於臥也東羌活勝濕湯治臥而多驚悸多魘溲者邪在少陽厥陰也加柴胡五分如淋加澤瀉五分此下焦風寒二經合病也經曰腎肝之病同一治為俱在下焦非風藥行經不可也羌活勝濕湯方見腰痛諸病疼酸驚駭皆屬於火全文見診丹病自驚而得者則神出其舍舍空得液則成痰也血氣入舍則痰拒其神不得歸焉控涎丹加辰砂遠志無驚悸因事有所大驚而成者名曰心驚膽寒病在心膽經其脈大動動脈如豆厥厥動搖無頭尾者也東垣朱砂安神丸方見煩躁門東垣云外物驚宜鎮平以黃連安神丸是也無鎮心丹治驚悸辰砂用黃松節酒浸龍齒用遠志苗醋煮上只取辰砂龍齒各等分為末豬心血為丸如芡實大每服一丸以麥門冬葉緑豆燈心白蜜水煎豆熟為度臨臥咽下小兒磨化半丸量歲數與之世密陀僧散治驚氣入心絡不能語者昔有為狼及大蛇所驚皆以此而安用密陀僧研極細末茶調一錢匕一服即愈無寒水石散治因驚心氣不行鬱而生涎結為飲遂為大疾忪悸隕戄不自勝持少遇驚則發尤宜服之寒水石煅滑石水飛各一錢生甘草一錢上為末每服二錢熱則新汲水下怯寒則薑棗湯下加龍膽少許尤佳子和衛德新之妻旅宿樓上夜值盜劫人燒舍驚墜床下自後每聞有響則驚倒不知人家人輩躡足而行莫敢冒觸有聲諸醫作心病治之人參珍珠及定志丸皆無效戴人見而斷之曰驚者為陽從外入也恐者為陰從內出也驚者為自不知也恐者為自知也足少陽膽經屬肝木膽者敢也驚怕則膽傷矣乃命侍女執其兩手按於高椅上坐當面前下置一小几戴人曰娘子當視此一木猛擊之其婦人大驚戴曰我以木擊幾何必驚乎伺少停擊之驚少緩又斯須連擊三五次又以杖擊門又暗遣人擊背後之窗徐徐驚定而嘆曰是何治法戴人曰內經云驚者平之平者常也常見必無驚是夜使人擊其門窗自昏暮達曙熟臥不聞夫驚者神上越也從下擊幾使之下視所以收神也一二日雖聞雷亦不驚德新素不喜戴人至是終身敬服仲炙甘草湯治脈結代而悸方見傷寒丹驚悸定志丸加琥珀鬱金無定志丸治心氣不足驚悸恐怯菖蒲炒遠志去心茯苓各二兩人參一兩辰砂為衣上為末蜜丸如桐子大每服五十丸米湯下一方去茯神名開心散服二錢匕不時本安神鎮心治驚悸消風痰辰砂遠志丸石菖蒲遠志人參茯神川芎山藥鐵粉麥門冬天麻半夏南星白茯苓生各一兩細辛辰砂各半兩上為細末生薑五兩取汁入水煮糊丸如緑豆大另以硃砂為衣每服二十五丸夜臥服生薑湯下小兒減服茯苓丸石菖蒲辰砂人參遠志茯苓真鐵粉茯神南星牛膽制半夏曲等分上為細末生薑四兩取汁和水煮糊丸如桐子大別用細末為衣干之每服十粒加至二十粒夜臥生薑湯下上二方療驚良驗胃足陽明之脈是動則病聞木音則惕然而驚欲動素陽明所謂甚則惡人與火聞木音則惕然而驚者陽氣與陰氣相搏水火相惡故惕然而驚也脈解篇黃帝問曰足陽明之脈病惡人與火聞木音則惕然而驚鐘鼓不為動聞音而驚何也岐伯曰陽明者胃脈也胃者土也故聞木音而驚者土惡木也陽明脈解篇痰飲驚悸屬脾土見前痰飲條運氣驚悸有三一曰肝木不及金來乘之經曰木不及曰委和委和之紀其發驚駭又云陽明之復則入肝驚駭筋攣是也二曰火邪助心經云少陽所至為驚惑又云少陽所至為驚躁又云少陽之勝善驚是也三曰寒邪傷心經云歲水太過寒氣流行病煩心躁悸是也按經云陽氣者開闔不得寒氣從之乃生大瘻陷脈為瘻留連肉腠俞氣化薄傳為善畏及為驚駭者是痿瘡所為之驚駭也蓋俞則瘻瘡之俞竅其痛氣留連肉腠之間恐人觸著而痛故化惕惕然之心內薄而傳為善畏驚駭之疾也撮心爍爍跳動少衝瀉之灸立效甲驚善悲不樂如墮墜汗不出面塵黑病飢不欲食照海主之膽寒怯寒厥手臂痛善驚妄言面赤泣出液門主之善驚悲不樂厥脛足下熱面盡熱嗌乾渴行間主之素肝脈騖暴有所驚駭大奇論王注云騖謂馳騖言迅急也二陽急為驚同上白脈之至也喘而浮上虛下實驚有積氣在胸中名曰肺痹寒熱全文見積塊下同陽明澀則病積而善驚仲寸口脈動而弱動即為驚弱即為悸脈驚主病者其脈止而復來其人目睛不轉不能呼氣仲病有奔豚有吐膿有驚怖有火邪此四病皆從驚發得之産驚悸大七寶散産後服之安神壓驚辰砂研桂心當歸川芎人參白茯苓羚羊角燒存性各二錢乾薑一錢炮上為末每服一錢用羌活豆淋酒調下如不飲酒漬米水飲調下如心煩熱悶以麥門冬去心煎湯調下減薑桂如心下煩悶而痛用童便酒調下如腹痛加當歸如心悶加羚羊角如心虛氣怯加桂心不下食或噁心加人參虛顫加茯苓海大效牡丹皮散治血藏虛風及頭目不利不思飲食手足煩熱肢節拘急疼痛胸膈不利大腸不調陰陽相干心驚怯悸或時旋運牡丹皮川芎枳殼麩炒各一兩陳皮玄胡索甘草羌活半夏湯洗各半兩木香三分訶子肉三分芍藥三分三稜炒半兩乾薑五錢炮當歸一兩半白朮炒三錢桂心五錢上為細末每服二錢水一盞半煎五七沸食前溫服益血海退血風勞攻注消寒痰實脾胃理血氣攻刺及氣虛惡寒潮熱證至妙大治産後中風心忪悸志氣不定恍惚語言錯亂人參六分羚羊角屑麥門冬茯神各八分茯苓白蘚皮甘草各四兩石膏二分淡竹瀝兩大合上㕮咀用水二升煎至七合下竹瀝分三服心憺憺動憺憺因痰動也心憺憺動者謂不怕驚而心自動也驚恐亦曰心中憺憺恐謂怕驚而心亦動也其憺憺自動之病屬二經一屬心主手厥陰病經云心主手厥陰之脈是動則病心中憺憺大動面赤目黃喜笑不休視盛虛熱寒陷下取之是刺灸之法也又曰太陽司天寒淫所勝病心憺憺大動胸脅胃脘不安治以甘熱是運氣之寒傷心主也其二屬少陽病經云一陽發病少氣善咳善噫其傳為心掣是也掣尺制反曳也怒怒在陰陽為陰閉遏其陽而陽不得伸也經云陰出之陽則怒又云血並於上氣並於下心煩冤善怒東垣云多怒者風熱陷下於地是也怒在臟腑所屬經在臟為肝在志為怒又云肝藏血血有餘則怒又云膽為怒是也丹治怒方香附末六兩甘草末一兩上和勻白湯調服五錢運氣怒皆屬木太過經云木太過曰發生發生之紀其病怒又云歲木太過風氣流行甚則善怒又云歲土不及風反大行民病善怒是也怒在禁忌多生厥逆經云陽氣者大怒則形氣絶而血菀於上使人薄厥又云暴怒傷陽又云怒則氣逆甚則嘔血及餐泄是也善太息運氣善太息皆屬燥邪傷膽經云陽明在泉燥淫所勝病善太息又云陽明之勝太息嘔苦又云少陰司天地乃燥悽愴數至脅痛善太息是也內經灸刺善太息皆取心膽二經經云黃帝曰人之太息者何氣使然岐伯曰思憂則心系急心系急則氣道約約則不利故太息以出之補手少陰心主足少陽留之也又曰膽病者善太息口苦嘔宿汁視足少陽脈之陷下者灸之又云膽足少陽之脈是動則病口苦善太息視盛虛實寒熱陷下取之是也甲色蒼蒼然太息如將死狀振寒溲白便難中封主之脾虛令人病寒不樂好太息商丘主之凡好太息不嗜食多寒熱汗出病至則善嘔嘔已乃衰即取公孫及井腧實則腸中切痛厥頭面腫起煩心狂飲多不嗜臥虛則腹脹腸中氣大滿熱痛不嗜食霍亂公孫主之目疾門經云瞳子黑眼法於陰白眼赤脈法於陽故陰陽合傳而精明此則眼具陰陽也全文見視歧亂見又曰五臟六腑之精氣皆上注於目而為之精精之窠為眼骨之精為瞳子筋之精為黑眼血之精為絡其窠氣之精為白眼肌肉之精為約束裹擷筋骨氣血之精而與脈併為系上屬於腦後出於項中此則眼具五臟六腑也全文見視歧亂見後世以內外皆屬心上下兩瞼屬脾白眼屬肺黑眼屬肝瞳子屬腎謂之五輪蓋本諸此也又有八廓之説無義無據今不得刪入焉臟腑主目有二一曰肝經云東方青色入通於肝開竅於目藏精於肝又云入臥血歸於肝肝受血而能視又云肝氣通於目肝和則目能辨五色也二曰心經云心合脈諸脈者皆屬於目是也至東垣又推之而及於脾如下文所云東垣五臟生成篇云諸脈者皆屬於目目得血而能視針經九卷大惑論云心事煩冗飲食失節勞役過度故脾胃虛弱心火太盛則百脈沸騰血脈逆行邪害孔竅天明則日月不明也夫五臟六腑之精氣皆稟受於脾土而上貫於目脾者諸陰之首也目者血氣之宗也故脾虛則五臟之精氣皆失所司不能歸明於目矣心者君火也主人之神宜靜而安相火代行其令相火者胞絡也主百脈皆榮於目既勞役運動勢乃妄行及因邪氣所並而損其血脈故諸病生焉凡醫者不理脾胃及養血安神治標不治本不明正理也陽主散陽虛則眼楞急而為倒睫拳毛陰主斂陰虛不斂則瞳子散大而為目昏眼花靈目眥外決於面者為鋭眥在內近鼻者為內眥上為外眥下為內眥癲狂篇診目痛赤脈從上下者太陽病從下上者陽明病從外走內者少陽病太陽病宜溫之散之陽明病宜下之寒之少陽病宜和之也論疾診尺篇保論云眼之為病在腑則為表當除風散熱在臟則為里當養血安神暴發者為表而易療久病者為里而難治除風散熱者瀉青丸主之養血安神者定志丸主之婦人熟地黃丸主之或有肥體氣盛風熱上行目昏澀槐子散主之此由胸中濁氣上行也重則為痰厥亦能損目常使胸中氣清自無此病也又有因目疾服涼藥多則損氣者久之眼漸昏弱乍明乍暗不能視物此則失血之驗也熟乾地黃丸消氣定志丸相須而養之或有視物不明見黑花者此之謂腎氣弱也宜補腎水駐景丸是也或有暴失明者謂眼居諸陽交之會也而陰反閉之此風邪內滿當有不測之病也目赤腫痛目疼有二一謂目眥白眼痛一謂目珠黑眼疼蓋目眥白眼疼屬陽故晝則疼甚點苦寒藥則效經所謂白眼赤脈法於陽故也目珠黑眼疼屬陰故夜則疼甚點苦寒則反劇經所謂瞳子黑眼法於陰故也簡補肝散治肝虛目睛疼冷淚不止筋脈痛及羞明怕日夏枯草五錢香附子一兩共為末每服一錢臘茶調下無時候服上夏枯草治目珠疼至夜則疼甚者神效或用苦寒眼藥點上反疼甚者亦神效蓋目珠者連目本目本又名目系屬厥陰之經也夜甚及用苦寒點之反甚者夜與寒亦陰故也丹溪云夏枯草有補養厥陰血脈之功其草三四月開花遇夏至陰生則枯蓋稟純陽之氣也故治厥陰目疼如神者以陽治陰也豫周師目珠疼及連眉稜骨痛並頭半邊腫痛遇夜則作用黃連膏子點上則反大疼諸藥不效灸厥陰少陽則疼隨止半月又發又灸又止者月餘遂以夏枯草二兩香附二兩甘草四錢同為細末每服一錢五分用茶清調服下咽則疼減大半至四五日良愈又一男子年六十歲亦目珠連眉稜骨疼夜甚用苦寒劑點亦甚與前證皆同但有白翳二點在黑目及外眥為翳藥皆不效亦以此藥間東垣選奇湯又加四物黃連煎服並灸厥陰少陽而安本治睛疼難忍者川歸防風細辛薄荷各等分上為末每服二錢麥門冬熟水調下食後日午夜臥各一服保止痛散治兩額角痛目睛痛時見黑花及目赤腫痛脈弦作內障也得之於飢飽勞役柴胡一兩半甘草炙七錢半栝蔞根二兩當歸黃芩四兩一半酒一半炒生地黃一兩上為粗末每三錢水一盞半薑三片棗一枚臨臥熱服小便不利加茯苓澤瀉各五錢治太陽經衛虛血實目腫赤瞼重頭中濕淫膚翳睛痛肝風盛眼黑腎虛桔梗丸桔梗一斤牽牛頭末二兩上細末每服四五十丸至一百丸食前溫水下日二次衍暴赤眼無瘡者以古銅錢刮淨薑上取汁於錢唇點目熱淚出隨點隨愈但小兒甚懼不須疑已試良驗有瘡者不可用又以此治癢驗張仲文治眼暴赤腫痛不得開又淚出削附子赤皮末如蠶屎著眥中以瘥為度本治丈夫女人室女小兒諸般赤眼針頭丸川烏尖七枚懷干白殭蠶七枚去嘴懷干硼砂十文上為末用豬膽取汁調藥不令稀用成軟塊攤在碗內荊芥艾各一兩皂角小者一莖燒將藥碗覆熏之常將藥膏攪勻轉又攤又熏以皂角荊芥艾盡為度再搜成塊用油紙裹入地中出火毒冬兩日夜夏一夜春秋一日夜取出丸如針頭大每一丸點眼中妙丹治目中百病乳汁煎黃連點之衍人乳汁治目中功多何也人心主血肝藏血肝受血則能視蓋水入於經其血乃成又曰上則為乳汁下則為月水故知乳汁即血也用以點目豈不相宜者哉治眼痛小黃和皮一名小柏子以粗布揩去粗皮刮取柔細黃屑以手急捏成團如雞子大以苧絲縛之次以蘿蔔葉包之又用苧絲縛之置灰火內煨去外二三層有灰者急用紗絞出黃汁收之點眼甚妙一方用乳汁拌小黃柏皮同煨點之又勝世傳信方眼風淚癢或生翳或赤眥一切皆主之宣州黃連搗為細末蕤核仁去皮碾為膏緣此性稍濕末不得故耳與黃連等分相合取不蛀干棗三枚割頭少許留之去核以二物填於中卻取割下棗頭依前合定以少綿裹之惟薄綿為佳以水半碗於銀器中文武火煎取一雞子殼以綿濾待冷點眼萬萬不失前後試驗數十人皆應保點眼藥除昏退翳截赤定痛當歸二錢黃連二錢防風一錢五分細辛五分甘草一錢上銼如麻豆大水一大碗文武火煎滴水中不散為度入熟蜜少許點眼丹暴赤眼痛枸杞汁點妙手集目卒痛荊芥燒汁點之肘後保救苦丸治眼暴赤發嗔痛甚者黃連一兩川歸二錢甘草一錢上銼細水半碗浸一宿以火熬約至一半綿絞去渣令淨再熬作稠膏攤在碗上倒合以物蓋之用熟艾一大塊如彈子大底下燃之熏膏子令艾盡為度下下項藥硃砂一錢飛腦子五分乳香沒藥研各等分上研入膏和丸如米大每用二丸點眼兩角仰面臥藥化方起世點藥方黃連五錢去須槌碎用水三碗浸夏月三日冬五日以古文錢百二十個同煎取汁半碗又將渣再煎凡三次取綿濾過以瓷器熬成膏子如砂糖樣卻將爐甘石黃連芽茶小便煅過者入麝香少許同研細入前膏子再熬可丸為度如桐子大化點一方不用爐甘石只將膏子入麝少許點尤妙一方陰陽寒熱通用以生薑自燃汁重綿濾過證薑泥曬乾卻用黃連膏入蜜少許以薑泥為丸餅如錢厚或水化或乾點神效薑汁點法見前黑睛痛條治目痛惡寒脈浮者效治目眥白眼痛諸法並見後表裡寒熱虛實等條東垣選奇湯防風飲子治眉骨痛不可忍方見眉痛門芎辛湯治兩目晝夜隱澀難開羞明畏日目赤視物昏暗芎藭蔓荊子各五分細辛二錢防風一錢五分甘草白芷各一錢上作一服水一大盞八分煎至一盞去渣稍熱臥服之極佳明目細辛湯治兩目發赤微痛羞明畏日怯風寒怕火眼睫成細眵糊多隱澀難開眉攢痛悶鼻涕唾極多如稠膿大便微硬喜食冷物麻黃羌活各三錢藁本一錢川芎五分細辛少許白茯苓一錢蔓荊子六分荊芥穗一錢二分當歸梢一錢川椒八粒生地黃六分桃仁二十枚紅花少許防風二錢上並銼如麻豆大分作四服每服水二大盞煎至一盞去渣稍熱服食後忌酒濕面及風寒處行走本治肝腎風毒氣上衝眼痛菊花散甘菊花牛蒡子炒各八兩防風三兩白蒺藜去刺一兩甘草一兩五錢上為細末每服二錢熱水調下食後臨臥凡目赤痛或大腑祕或脈實有力者為有里證宜微利之實熱條瀉青丸洗肝散之類是也海目赤暴作雲翳疼痛不可忍宜四物龍膽湯四物各五錢羌活防風各三錢草龍膽防己各二錢上水煎服丹丈夫患眼赤腫痛連翹黃芩歸鬚陳皮蒼朮各二錢木通一錢半甘草炙一錢分三帖薄荷葉五片水二盞煎一半入些好酒熱飲之保槐子散治體肥氣盛風熱上行目昏澀槐子黃芩木賊蒼朮各等分上細末食後茶送下川芎散治風熱目眩熱腫及胸中不利川芎槐子各一兩上為末氣滯下痢薑湯調目疾茶清調熱上攻㕮咀一兩煎服潔治眼赤暴發腫散熱飲子防風羌活黃芩黃連各一兩上切每半兩水二盞煎食後溫服如大腑祕加大黃一兩如痛甚加川歸地黃煩躁不得臥加梔子一兩治目暴發赤腫除風散熱瀉青丸方見治法門局洗肝散風毒上攻暴作赤目腫痛難開隱澀多淚薄荷去梗當歸羌活防風各去蘆梔子仁甘草炙大黃川芎各二兩上為末每服二錢食後熱水調下本事治目暴亦澀腫疼痛木賊半兩去節細辛半兩淨洗草烏一分去尖龍膽草半兩去根上為銼散每服三大錢水一大盞黑豆半合煎至一二沸入砂糖一塊如大彈子大煎至八分去渣食後溫服一應諸眼患並用忌煎爆油麵酢醬熱物及不得嗔怒房色等事則便易獲痊矣治腎經虛冷水候不升不能上滋肝木致令眼目昏暗或痛或癢須用此藥方調治之川芎荊芥天麻萆薢川烏炮烏藥羌活黑牽牛炮川歸金叉石斛各等分上為末煉蜜丸如豆大硃砂為衣每服一丸薄荷湯嚼下目赤腫足寒者必用時時溫洗其足並詳赤脈處屬何經灸三里臨泣崑崙等穴立愈海藏四物龍膽湯方見熱條保地黃湯治眼小昏澀因發而久不能瘥防風當歸黃芩黃連人參茯神羌活地黃各等分上粗末每服五七錢水一盞半煎至一盞溫服丹赤眼癢痛煎枸杞汁服救急方垣助陽和血補氣湯治眼發上熱壅白睛紅眵多淚無疼痛而隱澀難開此服寒藥太過而真氣不能通九竅也故眼昏花不明宜助陽和血補氣防風七分黃耆一錢甘草炙五分蔓荊子歸身洗五分白芷二分升麻七分柴胡上㕮咀作一服水一盞半煎至一盞去渣熱服臨臥避風及忌食冷物碧天丸治目疾纍服寒涼不愈兩目蒸熱有如火熏赤而不痛紅系血脈滿目貫睛瞀悶昏暗羞明畏日或上下瞼赤爛或不伏風土而內外鋭眥皆洗破之瓦粉炒一兩銅緑七分為末枯白礬二分是一錢中五分之一上研銅緑白礬令細旋旋入瓦粉銅緑勻熱水和之共為丸每用一丸熱湯半盞浸一二個時辰洗至覺微澀為度少閣眼半時辰許臨臥更洗了瞑目就睡尤神妙一丸可洗十日如再用重湯內燉令熱此藥治其標為裡熱治已去矣裡實者不宜用此當瀉其實熱諸方見前大腑祕堅條子和清州王正之子年十五歲目赤多淚衆工無效戴人見之曰此兒病在目睘當得之母腹中被驚其父曰妊娠時在臨清被圍戴人令服瓜蒂散加鬱金上湧下泄各去涎沫數升人皆笑之其母曰兒腹中無病何以吐瀉如此至明日其目輝然爽明一小兒名得孫眼發赤其母買銅緑欲洗兒目煎成家人誤與兒飲之須臾大吐吐訖立開安慶趙君玉目暴亦腫點洗不退偶思戴人法曰凡病在上者皆宜吐乃以茶調散湧之一湧亦腫消散君玉嘆曰法之妙其迅如此乃知法不遠人人自遠耳孫仁廟朝中衛才人忽患眼疼衆醫皆不能療或投寒藥或投補藥加之臟腑不安上乃問孫孫曰臣非眼科乞不全責於臣降旨有功無過孫乃診之肝脈弦滑非熱壅也乃才人年壯血盛肝血並不通遂問及宮人月經已二月不通衆醫曰有孕孫曰此正為疾耳遂下通血藥其經既通不日眼疾亦愈上賜錢三十萬才人贈金一囊宮人謠曰神醫不來雙目難開丹治風赤眼干蚯蚓十個炙為末冷清茶下二錢臨臥與服聖惠方點藥諸方分陰陽並見前眼痛分黑白條世治眼暴赤腫大田螺以清水漾去泥掰去掩入黃連末一錢麝些少在內將一盞子安少濕泥仰安田螺在泥上黏定露一宿次日早盡化為水以雞翎刷眼痛處則瘥外治赤眼及睛上瘡秦皮一兩清水一升於白碗中浸春夏一食時以上看碧色出即以箸頭纏綿仰臥點所患眼乃先從大眥中滿眼點微痛不畏良久三五飯頃即側臥瀝卻熱汁每日十度以上不過二日瘥治赤目癢痛地骨皮三升水三斗煮取三升去渣納鹽二兩煎取二升敷目或加乾薑二兩博濟治風毒上攻眼腫癢澀痛不可忍者或上下瞼眥赤爛浮翳瘀肉侵睛神效驅風散五倍子一兩蔓荊子一兩五錢上同杵為末每用二錢水二盞銅瓦器內煎及一盞澄渣熱淋洗留滓二服又依前煎淋洗大能明眼目去澀癢潔眼梢赤爛黃連三錢白礬三錢飛銅緑密陀僧各一錢輕粉少上為極細末少少點之東碧雲散搐藥青黛一錢半蔓荊子一錢半川芎一錢二分薄荷二錢鬱金一錢石膏一錢細辛一錢紅豆一粒芒硝一錢上為細末口噙水鼻孔內搐之治赤眼頭風等症此方名為神聖散乳香沒藥川芎石膏雄黃各二錢盆硝半兩上為細末治赤眼冷淚頭風耳聾耳癢鼻塞聲重一搐牙根便住保眼發赤腫毒氣侵睛脹痛宜拔毒散盆硝乳香雄黃沒藥各等分上為細末研以少許搐鼻中治眼風毒發腫鼻中欲嚏嚏多鼻損而生瘡宣風散川芎甘菊各二錢乳香沒藥各一餞上為末少許搐鼻中本治赤腫眼以白薑末水調貼腳心又以土朱蜜調紙貼眼上山赤眼用九節黃連秦皮粗末加滑石一塊煎湯洗又方用熱湯豁洗或濃煎冬青葉湯入鹽熱洗丹治火眼艾燒細煙以碗蓋之候煙上成煤取下以溫水調洗之入黃連尤妙斗門垣廣大重明湯治兩目瞼赤爛熱腫疼痛並稍赤及眼瞼癢及癢極抓至破爛赤腫眼楞生瘡痂目多眵痛隱澀難開草龍膽梢防風甘草根細辛各等分上銼如麻豆大內甘草不銼只作一梃先以水一大碗半煎草龍膽一味幹一半再入餘三味煎至一小半碗去渣用清汁帶熱洗以重湯坐令極熱日用五七次洗畢少閣眼須臾即去胬肉縱長及癢亦減矣運氣目赤有三一曰風助火鬱於上經云少陰司天之政二之氣陽氣布風乃行寒氣時至民病目瞎目赤氣鬱於上而熱又云少陽司天之政初之氣風勝乃淫候乃大溫其病氣怫於上目赤是也二曰火盛經曰火太過曰赫曦赫曦之紀其病目赤又云火鬱之發民病目赤心熱又曰少陽司天之政三之氣炎暑至目赤又云少陽之勝目赤是也三曰燥邪傷肝經云歲金太過燥氣流行民病目赤又云陽明司天燥氣下臨肝氣上從脅痛目赤是也內經灸刺白眼痛有四法其一取足太陽經云目痛赤脈從上下者太陽病故知取之也其二取足陽明經云目痛赤脈從下上者陽明病故知取之也其三取足少陽經云目痛赤脈從外走內者少陽病又手足少陽之脈所生病者皆目鋭眥病故知取之也其四取蹺脈經云邪客足陽蹺之脈令人目痛從內眥始刺外踝之下半寸所左刺右右刺左又云目中赤痛從內眥始取之陰蹺也灸刺黑珠痛有三法其一取足太陽經云足太陽有過項入於腦者正屬目本名曰眼系頭目若痛取之在項中兩筋間是也其二取足厥陰經云肝足厥陰之脈上入頏顙連目系故取之也其三取少陰經云手少陰之別名曰通里屬目系取之掌後一寸也又足少陽之正陽明之正皆系目系經無取法也子和余嘗病目赤或腫或翳作止無時偶至新息帥府百餘日羞明隱澀腫痛不已忽眼科薑仲安云宜刺上星至百會速以扉針刺四五十刺攢竹穴絲竹空穴上兼眉際二十刺及鼻兩孔內以草莖彈子出血如前約二升許來日愈大半三日平復如初潔眼痛睛欲出者須八關大刺十指間出血須十指縫心眼暴赤腫神庭內庭囟門前頂百會各出血立愈世眼眶腫二間行間摘眼疼不可忍風池合谷立愈玉眼紅腫羞明怕日並昏睛明斜飛向鼻不可直針忌灸童子窖針入一分沿皮內透魚腰太陽眥脈上三稜針出血竇眼癢痛光明第五各瀉之行間集羞明怕日攢竹合谷灸小骨空灸如前二間張風眼卒生翳膜疼痛中指本節尖上灸三壯小麥大左灸右右灸左集諸障睛明四白在珠下一分太陽百會商陽厲兌光明各出血合谷三里命門肝腧光明各灸之撮要眼赤腫疼痛陽谷一分瀉之灸至陰甲內眥赤腫目䀮䀮無所見眥癢痛淫膚白翳睛明主之目䀮䀮赤痛天柱主之目痛泣出甚者如脫前谷主之眼痛下廉主之白膜覆珠子無所見解溪主之青盲無所見遠視䀮䀮目中淫膚白膜覆瞳子目窗主之目痛口僻戾目不明四白主之目痛引眥少腹偏痛眥一作脊嘔瘛瘲視昏嗜臥照海主之瀉左陰蹺取足左少陰前先刺陰蹺後刺少陰氣在橫骨上目中白翳然谷取之目視不明振寒目翳瞳子不見腰兩脅痛腳痠轉筋丘墟主之目赤目黃顴窖主之目眩無所見偏頭痛引目外眥張急頷厭主之目中痛不能視上星主之先取譩嘻後取天牖風池目痛不明齦交主之桑眼痛久不愈魚際灸七壯外障在睛外遮暗經云診目痛赤脈從上下者太陽病從下上者陽明病從外走內者少陽病按此論表裡之翳明矣用以治症如鼓應桴也凡赤脈翳初從上而下者屬太陽以太陽主表其病必連眉稜骨痛或腦項痛或半邊頭腫痛是也治法宜溫之散之溫則臘茶鹽川附等分煎服立愈戴立齋嘗以此證用川附一錢作一服隨愈散則簡要夏枯散東垣選奇湯之類是也一方附子半兩芽茶一大撮白芷一錢細辛川芎防風羌活荊芥各半錢煎服神效簡夏枯草治眉稜痛目翳從上下者纍效必與退云丸相兼服夏枯草方見目珠痛條垣選奇湯治眉稜骨痛目翳從上下者妙方見眉痛條羌活除翳湯治太陽寒水翳膜遮睛不能視物麻黃根一分羌活一兩半防風一兩藁本七錢細辛少許薄荷葉二錢荊芥穗七錢煎成藥加之川芎三錢小椒五分當歸根三錢生地酒一錢黃柏四錢知母五錢酒製上㕮咀每服三錢水三大盞煎至一盞半入荊芥穗再煎至一盞去渣稍熱服後忌酒濕面本又方防風一兩白蒺藜一兩羌活一兩半甘菊二兩上為細末每服二錢入鹽少許百沸湯點服食後赤脈翳初從下而上者或從內眥出外者皆屬陽明以陽明主裡其症多熱或便實是也治法宜下之寒之下則局方流氣飲錢氏瀉青丸局方溫白丸加黃連黃柏之類纍用纍驗寒則一味黃連羊肝丸之類也局流氣飲治目生翳障大黃炮牛蒡子炒川芎菊花去枝白蒺藜炒去梗細辛去苗防風去苗玄參去苗山梔去皮黃芩去蘆甘草炙蔓荊子荊芥去梗木賊去根節各一兩草決明一兩半蒼朮二兩上為末每服二錢臨臥用冷酒調下羅撥雲散治因眼發濕熱不退而作翳膜遮睛昏暗羞明隱澀難開川芎草龍膽楮實薄荷羌活荊芥穗石決明草決明蒼朮大黃甘草木賊密蒙花連翹川椒甘菊桔梗石膏地骨皮白芷白蒺藜檳榔各一兩石燕一對上件搗羅為細末每服三錢溫茶清一盞調下食後一日三服忌雜魚烏諸肉海藏東垣先生治斑後風熱毒翳膜氣暈遮睛以瀉青丸子瀉之大效初覺易治保命集云斑後翳膜亦能治之瀉青丸減大黃一半用之妻侄女形肥笄年時得目疾每一月或二月一發發時紅腫澀痛難開如此者三年服除風散熱等劑及尋常眼藥則左目反有頑翳從鋭眥來遮瞳人右目亦有翳從下而上經云從內外走者少陽病從下上者陽明病豫謂此少陽陽明二經有積滯也脈短滑而實晨則似短潔古云短為有積滯遏抑臟腑宜下之遂用溫白丸減川芎附子三之二多加龍膽黃連如東垣五積法從二丸每日加一丸加至大利然後減丸又從二丸加起忽一日於利中下黑塊血若干如墨大而硬堅從此漸覺痊而翳盡去矣世黃連羊肝丸治目翳從下上者從內眥出外者神效方見內障赤脈翳初從外眥入內者為少陽以少陽主半表半裡治法宜和解之神仙退云丸之類是也垣神仙退云丸治一切翳暈內外障昏無睛者纍效妙方也川芎當歸各一兩半犀角酒洗枳實川楝蟬殼甘菊薄荷葉不見火以上各半兩栝蔞仁生者六錢蛇蛻密蒙花荊芥穗各二錢此三味與甘草同焙乾去甘草不用地骨皮洗白蒺藜微炒去刺羌活生地酒洗焙乾各一錢川木賊一兩半去節童便浸一宿焙乾上為細末煉蜜為丸每一兩分作十丸米泔湯調服日進二三丸食後婦人當歸湯下有氣者木香湯下使之在人消息本治諸眼患因熱病後毒氣攻眼生翳膜遮障服此藥逐旋消退不犯刀針青葙子防風枳殼各一兩茺蔚子細辛各半兩枸杞子澤瀉生地黃石決明各一兩半黃連半兩車前子川當歸麥門冬去心各二兩上各如法修事焙乾為末煉蜜丸如桐子大每服三十丸飯飲吞下忌一切熱毒物垣羌活退翳湯羌活二錢防風一錢半黃芩半兩酒炒柴胡三錢黃連二錢五味子二錢黃柏五錢酒炒芍藥五錢草龍膽五錢酒洗黃耆三錢甘草升麻二錢歸身二錢石膏二錢半上件銼如麻豆大水二盞分作二服煎至一盞入酒少許去渣臨臥熱服忌言語消翳散一名龍膽飲子青蛤粉半兩羌活龍膽草黃芩炒各三錢蟬蛻五分一云蛇蛻麻黃一錢半穀精草半兩川鬱金半兩甘草根炙五分升麻二錢上為細末每服二錢食後溫茶調下以上四方熱多者宜之又方川芎羌活旋覆花防風各二兩甘草蒼朮泔浸一夕去皮日乾不見火楮實楮葉並八月採陰乾以上各一兩甘菊枳實蟬蛻木賊各一兩上木臼中治為末茶清調下二錢早食後臨臥各一服治暴赤眼忌濕面及酒楮實須真無實者取葉不爾諸藥無效合時不得焙及犯鐵器豫觀此方取楮葉必無實者蓋陰陽二合相匹配耳有實者陽也無實取葉者陰也所以不得真楮實者悉無效羅五秀重明丸治眼翳膜遮睛隱澀昏花常服清利頭目甘菊花開頭五百個荊芥五百穗木賊去節五百節川椒開口者五百粒楮實五百枚上為細末煉蜜為丸如彈子大每服一丸細嚼時時咽下食後噙化無時臨臥大忌酒面熱物以上二方無熱者宜之翳膜者風熱重則有之或癍入眼此肝氣盛而發在表也翳膜已生在表明矣宜發散而去之若反疏利則邪氣內搐為翳益深邪氣未定謂之熱翳而浮邪氣已定謂之冰翳而沉邪氣牢而深者謂之陷翳當以焮發之物使其邪氣再動翳膜乃浮佐之以退翳之藥而能自去也病久者不能速效宜以歲月除之新翳所生表散方東垣羌活除翳湯有熱血虛者退云丸之類是也保治冰翳久不去者羚羊角散羚羊角升麻細辛各等分甘草半錢上為末一半煉蜜為丸每服五七十丸用一半為散以泔水煎吞丸子食後焮發陷翳亦羚羊角散之類用之在人消息若陰虛有熱者兼服神仙退云丸垣補陽湯治陽不勝其陰乃陰盛陽虛則九竅不通令青白翳見於大眥乃足太陽少陰經中郁遏足厥陰肝經氣不得上通於目故青白翳內阻也當於太陽少陰經中九原之下以益肝中陽氣沖天上行此當先補其陽後於足太陽少陰標中瀉足厥陰肝經陰火乃次治也內經曰陰盛陽虛則當先補其陽後瀉其陰此治法是也每日清晨以腹中無宿食服補陽湯臨臥服瀉陰丸若天色變大寒大風並大勞役預日飲食不調精神不足或氣弱俱不得服候體氣和平天氣如常服之先補其陽使陽氣上升通於肝經之末利空竅於眼目矣羌活獨活當歸身去蘆頭用梢截酒洗焙乾甘草梢熟地黃人參去蘆黃耆白朮以上各一兩澤瀉陳皮去白各一兩生地黃炒二錢白茯苓去皮知母炒黃色各五錢柴胡去苗二兩防風去蘆半兩白芍藥半兩肉桂去皮一錢上同為粗末每服半兩水二大盞煎至一盞去渣溫服空心使藥力行盡方許食連柏益陰丸羌活獨活甘草根炒當歸身依前制防風五味子各半兩黃連酒洗或拌銼炒火色一兩石決明燒存性五錢草決明黃芩黃柏知母各一兩上為細末煉蜜丸如緑豆大每服五十丸漸加百丸止臨臥清茶送下常以助陽湯多服少服此藥以此藥一則妨飲食二則力大如升陽湯不可多服升陽泄陰丸羌活獨活甘草根歸身熟地各一兩人參黃耆白朮各半兩澤瀉三錢陳皮三錢白芍藥一兩白茯苓防風各三錢肉桂半錢生地酒洗炒五錢知母酒炒三錢如大暑加一錢楮實酒拌半兩柴胡去苗一錢半上㕮咀每服五錢水煎熱服另合一料煉蜜丸如桐子大食遠茶清送下五十丸每日與前藥各一服不可飽服如天氣熱甚加五味子三錢或半兩天門冬去心半兩枳實亦加半兩上三方合治一病空心補陽湯臨臥連柏丸食遠升陽泄陰丸滋陰地黃丸治內障兼右目小眥青白翳瞳子散大方見內障丹丈夫因勞力後兩眼上星右邊獨昏此熱傷血白朮歸身尾生地木通黃連酒浸黃芩炒黃柏炒各二兩甘草炙一錢分三帖煎服大熱加白芍藥翳從下而上諸方瀉青之類並見表裡上條翳除盡至期年月日期復發者或間一月或二月一發皆為積治如脈滑者宜溫白丸加黃連草龍膽如東垣五積法服之百點膏張濟民眼翳以至遮瞳人視物不明如覺雲氣遮障以此方治之黃連二錢以水一碗煎至半碗再入後藥當歸六分甘草根六分防風根八分蕤仁去皮尖三分上銼如麻豆大蕤仁另研如泥同熬滴入水中不散去渣沫入好蜜少許再煎少時為度極要病人心淨點之點至目微痛為度一日點五七次臨臥點尤妙名曰百點膏但欲多點使藥力相續羌活退翳膏治足太陽寒水膜遮左睛白翳上視物不明椒樹東南根西北根各二兩麻黃去節根三分羌活七分黃連三分歸身六分防風三分柴胡三分生甘草四分升麻三分生地黃三分漢防己二分蕤仁六個藁本二分上淨水一碗先煎漢防己黃連生甘草當歸身生地黃煎至一盞入余藥再煎至一盞去渣入銀瓷器內熬稀膏點之有力為度退翳膏子治黑白翳荊芥穗一錢黃連三錢生地黃一錢半甘草五分歸身六分連翹四分柴胡梢五分升麻三分防風四分蕤仁三分青皮四分細辛一分上先用水半盞浸荊芥一處次將黃連生地甘草三味用水一大碗煎至半碗再下餘七味同煎至一盞去渣更上火熬至半盞入荊芥水二匙入蜜少許再煎令勻點之神效圓明膏治內障生翳及瞳子散大皆勞心過度飲食失節柴胡去苗五錢麻黃去蘆五錢歸身三錢生地半兩黃連去須五錢甘草二錢訶子皮濕紙裹煨二錢上七味先以水二碗熬麻黃至一碗去沫外六味各㕮咀如豆大篩去沫子稱入內同煎滴水中不散去渣沫入蜜少許再熬點之上點方四皆東垣先生所制乃隨證立法非如泛常通用之方如瞳子散大用訶子收之之類也保金絲膏點眼生薑取汁四兩白蜜煉去沫一斤豭豬膽汁三錢黃連四兩截碎用水一斗煎至五升上先煎黃連水後入薑汁次入蜜同煎去沫淨入下項腦子硇砂熊膽各四錢麝香青鹽各三錢輕粉少許硼砂二錢上研細攪勻同煎合稀膏用之羅金露膏蕤仁槌碎黃丹各一兩黃連半兩蜜六兩上件先將黃丹入鍋中炒黃至紫入蜜攪勻下長流水四升以嫩柳枝頭七莖把定攪之次下蕤仁候滾十數沸又下黃連用柳枝不住手攪熬至二升罩籬內傾藥在紙上慢慢滴之無令塵汙如有瘀血加硇砂一錢上火煨開入前膏子內用夜光丸治赤眼翳目昏花宣黃連訶子去核各二兩當歸一兩銅緑一錢上㕮咀用河水三升同浸兩晝夜入銀瓷器熬取汁再入文武火熬槐柳枝攪滴水成珠為度豭豬胰子二個先去脂以水洗換水無度令淨入黃連膏內煮黑色取出用之爐甘石一兩童便一碗燒紅淬盡為度黃連四兩河水浸去渣焙乾研細用青鹽六兩細研蜜一斤澄去查蠟梨十枚去皮核絞取汁上將梨汁甘石入膏子內熬五七沸次入青鹽用槐柳枝攪褐色傾入瓷甕冷水內拔去火毒臘月合為妙正月十一月次之余月皆不可濟蟾光膏治遠年目病不通道路去翳膜須用臘月成開日合白沙蜜四兩色白者炒隔年蔥一枝去須皮短切與蜜一同熬去白膜覷蔥軟熟為度以綿濾滓放定用紙收取蠟面黃丹三錢水飛生用密陀僧三錢水飛生用爐甘石煅過五錢淨水飛以上三味研極細傾入前蜜中用桃柳各一枝攪勻放下當歸赤芍藥杏仁湯泡去皮尖以上三味各三錢黃連去蘆頭淨二兩川芎半兩秦皮訶子皮防風石膏玄精石井泉石無名異玄參代赭石石決明以上十五味各三錢㕮咀或雪水或長流河水五升銀瓷器內熬至三升濾去渣淨再熬至一升將十五味藥水傾入前放下藥蜜一同慢火熬藥紫金色時再添入後藥勿令火急乳香沒藥琥珀硃砂另研蕤仁紙槌去油用仁以上五味各三錢前四味先研爛後入蕤仁水飛一同研細澄有渣再水飛矴清再水飛方傾入前紫金藥內一同復熬一二沸以藥滴於水中不散為度大抵勿令過與不及取下土中埋七日取出置銀器中如法收貯再添入後細藥傾入藥時亦用桃柳枝攪勻南硼砂珍珠龍腦珊瑚枝四味各一錢麝香五分上件五味研極細亦以桃柳枝攪勻傾入前藥中復攪勻然後以紙封器盒口旋取用如有取不盡藥用淨水斟酌洗碗卻將碗藥水熬三五沸另行收拾或洗眼或膏子藥稠了時傾入些少調解上用桑柴燒共計二十九味肘療目熱生膚赤白膜取雀屎細直者人乳和敷目上消爛盡烏賊骨主目中一切浮翳細研和蜜點之又骨末治目中熱有效丹治眼翳樗白皮索為繩日乾燒為灰研細點之自漸退妙又方豬膽皮去汁捻為繩燒灰點之亦妙東碧雲散治外障搐藥麻黃根一兩歸身一錢乳香少麝香如少加乳香上將當歸麻黃為粗末炒黑色入乳麝研極細噙化搐入鼻中搐鼻散薄荷三錢石膏一錢芒硝川芎各五分細辛二錢蔓荊子三錢青黛一錢上為末鼻內搐之丹楊生娘患赤眼生膜似白星秦皮滑石黃連荊芥歸頭赤芍藥各三錢上分四帖煎洗仍教其莫洗浴止可洗腳千治法以鵝翎截之近黑睛及當白睛嗍之膜自聚上以針鉤挽之割去即見物以綿當眼著血斷三日瘥東垣醫魏邦彥夫人目翳暴生從下而起其色緑腫痛不可忍先師曰翳從下而上病從陽明是也緑非五方之正色殆肺腎合為病邪乃就畫家以墨膩粉合成色諦視之與翳同色肺腎為病無疑矣乃瀉肺腎之邪而入陽明之藥為之使既效而他日病復作者三其所從來之經與翳色各異乃以意消息之曰諸脈皆屬於目脈病則從之此必經絡不調則目病未已也問之果然因視所不調者治之病遂不作針灸外障並見目赤門內障在睛里昏暗與不患之眼相似唯瞳人里有隱隱青白者無隱隱青白者亦有之丹一老人病目暴不見物它無所苦起坐飲食如故豫曰大虛急煎人參膏二斤服二日目方見一醫與青礞石藥豫曰今夜死矣不悟此病得之氣大虛今不救其虛而反用礞石不出此夜必死果至夜半死一男子四十餘歲形實平生好飲熱酒忽目盲脈澀此因熱酒所傷胃氣汙濁之血死在其中而然也遂以蘇木作湯調人參膏飲之服二日鼻內兩手掌皆紫黑豫曰此病退矣滯血行矣以四物加蘇木桃仁紅花陳皮煎調人參末服數日而愈一男子五十五歲九月間早起忽開眼無光視物不見急就睡片時卻能見人物竟不能辨其何人何物飲食減平時之半神思極倦脈之緩大四至之上重按則散而無力豫作受濕治詢之果因臥濕地半個月得此證遂以白朮為君黃耆茯苓陳皮為臣附子為佐十餘帖而安上三方治目不明皆為氣脫而用參術追回者也經云上焦開發宣五穀味熏膚充身澤毛若霧露之溉是謂氣脫者目不明即其證也人參補胃湯治勞役飲食不節內障眼病此方神效黃耆根一兩人參一兩甘草炙八錢蔓荊子二錢白芍藥三錢黃柏三錢酒淬四次炒四次上㕮咀每服三四錢水一大盞煎至一盞去渣稍熱服臨臥三五服兩目廣大視物如常惟覺兩腳踏地不知高下蓋火伏升發故也病減住服七日再服此藥宜春間服之益氣聰明湯治飲食不節勞傷形體脾胃不足內障耳鳴或多年視物昏暗令目廣大久服無內障耳鳴耳聾之患又令精神倍常飲食增倍身輕體健耳目聰明黃耆半兩甘草根炙六錢人參半兩升麻根三錢葛根三錢蔓荊子一錢半白芍藥一錢黃柏一錢酒洗四次炒黃色上㕮咀稱二錢水二鍾煎至一鍾去渣熱服臨臥服五更再煎服之得睡更妙如煩亂或有熱春月漸加黃柏夏月倍之如脾胃弱去之熱減亦少用但有熱或麻木或上壅頭目三兩服後其熱皆除又治老人腰以下沉重疼痛此藥久服治人上重反有精神兩足輕浮不知高下空心服之或少加黃柏輕浮自減小兒減服多則壅滯若治倒睫去黃柏芍藥忌煙火酸物圓明內障升麻湯治內障得之脾胃元氣衰弱心火與三焦俱盛為此疾劉舜卿因南征飲食失節形體勞役心不得休息眼疾復作今擬此方服之效柴胡根七錢羌活根一兩半防風根半兩白朮甘草炙歸根酒洗升麻根各一兩白芍六錢乾薑一錢五味子二錢人參葛根黃耆各一兩白茯苓三錢上㕮咀每服五六錢水三大盞煎至二盞入黃芩黃連湯二錢同煎數沸去渣煎至一盞食後熱服黃芩黃連湯一方有升麻五錢柴胡一兩黃芩酒洗炒一兩黃連去須酒洗炒七錢草龍膽一兩酒洗炒四次生地一兩酒洗上㕮咀每服二錢入水二盞煎數沸去渣再煎至一盞熱服午後晚間俱不可服唯午飯時服之方效復明散治內障黃耆一錢半川芎五分柴胡連翹甘草炙各一錢歸身二錢蒼朮五分生地一錢陳皮五分黃柏三分上銼如麻豆大每作一服水二大盞煎至一盞去渣稍熱服食後忌酒濕面辛熱大料之物上四方治目不明皆氣虛而未脫故可與參耆中微加連柏若氣即脫則黃柏等涼劑不可施經云陽氣者煩勞則張精絶目盲不可以視耳閉不可以聽之類是其證也內障瞳子散大論並方腎主骨之精為瞳子散大者因腎水虛骨枯而心包絡之火得以乘之也凡心包絡之脈出於心中代心君行事也與少陽為表裡瞳子散大者少陰心之脈挾目系厥陰肝之脈連目系心主火肝主木此木火之勢盛也其味則宜苦宜酸宜涼大忌辛辣熱物是瀉木火之邪也飲食中常知此理可也以諸辛主散熱則助火故不可食諸酸主收心氣瀉木火也諸苦瀉火熱則益水也尤忌食冷水大寒之物此物能損胃氣胃氣不行則元氣不生元氣不生緣胃氣下陷胸中三焦之火及心火乘於肺上入胸灼髓火主散溢瞳子之散大者以此大熱之物直助火邪尤為不可食也藥中去茺蔚子以味辛及主益肝是助火也故去之加黃芩半兩黃連三錢黃連瀉中焦之火黃芩瀉上焦肺火以酒洗之乃寒因熱用也亦不可用青葙子為助陽火也更加五味子三錢以收瞳人之散大也且火之與氣勢不兩立故經曰壯火食氣氣食少火少火生氣壯火散氣諸酸物能助元氣孫真人云五月常服五味子助五臟氣以補西方肺金又經云以酸補之以辛瀉之則辛瀉氣明矣或曰藥中有當歸其味亦辛甘而不去何也此一味辛甘者以其和血之聖藥也況有甘味又欲以為鄉導為諸藥之使故不去也熟地黃丸治血弱氣虛不能養心致火旺於陰分瞳子散大少陰為火君主無為不行其令相火代之與心包絡之脈出心系分為三道少陽相火之體無形其用在其中矣火盛則能令母實乙木肝旺是也其心之脈挾目系肝之脈連目系況手足少陽之脈同出耳中至耳上角斜起終於目外小眥風熱之盛亦從此道來上攻頭目致偏頭腫悶瞳子散大視物昏花血虛陰弱故也法當養血涼血益血收火散火而除風熱則愈矣熟地一兩歸身酒洗五錢柴胡去苗八錢天門冬去心焙三錢人參去蘆二錢甘草炙二錢地骨皮三錢黃芩半兩枳殼炒二錢五味子三錢生地黃七錢半酒浸焙黃連三錢上為細末煉蜜丸如緑豆大每服一百丸茶湯送下食後日二服制之緩也大忌辛辣物而助火邪及食寒冷物損其胃氣藥不上行也又一論云瞳子黑眼法於陰由食辛熱之物助火乘於胸中其睛故散散則視物亦大也益陰腎氣丸此壯水之主以鎮陽光也山茱萸取皮一兩茯神去皮心二錢半五味五錢熟地二兩乾山藥五錢澤瀉二錢半牡丹皮五錢生地酒洗焙乾一兩歸梢酒洗五錢上為細末煉蜜丸如桐子大硃砂為衣每服五七十丸淡鹽湯送下滋陰地黃丸治內障右眼小眥青白翳大眥亦微顯白翳腦痛瞳子散大上熱惡熱大便澀後痞難小便如常遇熱暖處頭疼暗脹能食日沒後天陰暗則昏此症可服熟地黃丸翳在大眥加葛根升麻翳在小眥加柴胡羌活熟地八錢生地酒洗半兩歸身酒洗半兩知母酒洗炒三錢丹參半兩黃柏酒浸焙半兩芍藥一兩三錢防己酒洗焙二錢茺蔚子半兩牡丹皮三錢寒水石一錢生用柴胡半兩黑附一錢川芎二錢上為細末煉蜜丸如小豆大空心五十丸白湯下如宿食未消候飢時服之餌後忌言語隨後食壓之保當歸湯治翳補益瞳子散大歸身黃芩各一錢黃連地黃各三錢柴胡一錢芍藥二錢甘草炙三錢上水煎臨臥服羅甘菊花丸治男子腎臟虛弱眼目昏暗或見黑花常服明目暖水臟活血駐顏壯筋骨甘菊花去土二兩枸杞四兩熟地三兩乾山藥半兩上為細末煉蜜丸如桐子大每服三四十丸空心食後各一服溫水下瑞竹四神丸治腎經虛損眼目昏花補虛益損及兩眼雲翳遮睛甘州枸杞一斤揀去白醭青燒者一味分作四分一兩四錢用川椒一兩炒一兩四錢用乳香茴香各一兩炒一兩四錢用芝麻一合炒炒時先用好酒一盞將枸杞淘過上件炒過將川椒等四味篩去不用止用枸杞子加熟地白朮茯苓各一兩同為細末煉蜜為丸如桐子大每服五七十丸空心溫酒送下加甘菊一兩尤妙上地黃枸杞補腎例按瞳子散大不當用茺蔚川芎附子今東垣滋陰地黃丸兼用者蓋有外障大小眥之翳故也保柴胡散明目益腎水柴胡羌活防風生地芍藥甘草各等分上為粗末水煎臨臥服東垣云肝木旺則火之勝無所畏懼而妄行也故脾胃先受之或病目而生內障者脾裹血胃主血心主脈脈者血之腑也或曰心主血又云脈主血肝之竅開於目也治法亦前熟地黃丸之類是也河目昧不明熱也然玄腑者無物不有人之臟腑皮毛肌肉筋膜骨髓牙爪至於世之萬物盡皆有之乃氣出入升降之道路門戶也人之眼耳鼻舌身意神識能為用者皆升降出入之通利也有所閉塞者不能為用也若目無所見耳無所聞鼻不聞臭舌不知味筋痿骨痹爪退齒腐毛髮墮落皮膚不仁腸胃不能滲泄者悉由熱氣怫鬱玄腑閉密而致氣液血脈榮衛精神不能升降出入故也各隨鬱結微甚而為病之輕重故知熱鬱於目則無所見也故目微昏者至近則轉難辨物由目之玄腑閉小如隔簾視物之象也或視如蠅翼者玄腑有所閉合者也或目昏而見黑花者由熱氣甚而發之於目亢則害承乃制而反出其泣氣液眯之以其至近故雖微而亦見如黑花也誠哉河間斯言也目盲耳聾鼻不聞臭舌不知味手足不能運用者皆由其玄腑閉塞而神氣出入升降之道路不通利故先賢治目昏花如羊肝丸用羊肝引黃連等藥入肝解肝中諸郁蓋肝主目肝中郁解則目之玄腑通利而明矣故黃連之類解鬱熱也椒目之類解濕熱也茺蔚之類解氣鬱也芎歸之類解血鬱也木賊之類解積鬱也羌活之類解經郁也磁石之類解頭目郁墜邪氣使下降也蔓菁下氣通中理亦同也凡此諸劑皆治氣血鬱結目昏之法而河間之言信不誣矣至於東垣丹溪治目昏用參耆補血氣亦能明者又必有説通之蓋目主氣血盛則玄腑得利出入升降而明虛則玄腑無以出入升降而昏此則必用參耆四物等劑助氣血運行而明也羊肝丸三方又散一方並見肝條治肝中諸郁目昏如神本治久年眼生黑花不明者椒目炒一兩蒼朮炒二兩上件為末醋糊丸如桐子大每服二十丸醋茶送下不過十日取效丹溪云椒目行滲道不行也外補肝散治三十年失明蒺藜子七月七日收陰乾搗散飲食後水服方寸匕崔但瞳子不壞者療十得九愈蔓菁子六升蒸之看氣遍用甑下釜中熱湯淋暴乾還淋如是三遍即取杵篩為末食上清酒調二錢送下日再服本草云蔓菁子下氣利五臟又利大便通中益氣經治虛勞目暗昧三月蔓菁花陰乾為末以井花水空心調下二錢匕久服長生世五福還瞳丹治目白翳赤石脂川椒二味同炒辰砂茯神乳香棗肉為丸如桐子大空心溫酒下百丸十服見效按內障先患一目次第相引兩目俱損者皆有翳在黑睛內遮瞳子而然今詳通黑睛之脈者目系也目系屬足厥陰足太陽手少陰三經蓋此三經臟腑中虛則邪乘虛入經中鬱結從目系入黑睛內為翳龍木諭所謂腦脂流下作翳者即足太陽之邪也所謂肝氣衝上成翳者即足厥陰之邪也故治法以針言之則當取三經之腧穴如天柱風府太衝通里等穴是也其有手巧心審諦者能用針於黑眼裡撥其翳為效尤捷也以藥言之則當補中疏通此三經之鬱結使邪不入目系而愈今集龍木諭並方於後龍木論羚羊角飲子治圓翳內障不痛不癢羚羊角三兩細辛知母車前子人參黃芩各二兩防風二兩半上為末每一錢以水一盞煎至五分食後去渣溫服之補肝散治肝風內障不痛不癢眼見花發黃白黑赤或一物二形羚羊角防風各三兩羌活車前子各一兩人參茯苓各二兩細辛玄參黃芩炒各一兩上為末食後調服一錢米飲湯下羚羊角散治緑風內障頭旋目痛眼內痛澀者羚羊角防風知母人參茯苓各一兩玄參黃芩桔梗各一兩細辛三兩車前子一兩上為末以水一盞散一錢煎五分食後去渣溫服羚羊角湯治青風內障勞倦加昏重頭旋腦痛眼內痛澀者羚羊角人參玄參地骨皮羌活各一兩車前子一兩半上為末以水一盞散一錢煎至五分食後去渣溫服上四方皆羚羊角玄參細辛羌活防風車前子為君蓋羚羊角厥陰經藥也丹溪云羚羊角入厥陰經甚捷是也玄參細辛行少陰經藥也海藏云玄參治空中氤氳之氣無根之火為聖藥也羌活防風車前子行太陽經藥也如筋脈枯澀者諸方中更加夏枯草能散結氣有補養厥陰血脈之功嘗試之有驗然此諸方又當悟邪之所在若氣脫者必與參膏相半服之氣虛者必與東垣補胃人參湯益氣聰明湯之類相半服之血虛者必與熟地黃丸之類相兼服之更能內觀靜守不幹塵纍使陰氣平伏方許作效蘆薈丸黑水凝翳內障不痛不癢微有頭旋脈澀者蘆薈甘草各一分人參牛膽各半兩柏子仁細辛各一兩羚羊角二兩蜜炙上為末煉蜜為丸如桐子大空心茶下十丸墜翳丸治偃月翳束花翳等病微有頭旋額痛者青羊膽青魚膽鯉魚膽各七個熊膽一分牛膽半兩麝香少許石決明上為末麵糊丸如桐子大空心茶下十丸除風湯治五風變成內障頭旋偏腫痛瞳人結白者羚羊角車前子芍藥人參茯苓大黃黃芩芒硝各一兩上為末水一盞散一錢煎至五分食後去渣溫服磁石丸治雷風內障頭旋噁心嘔吐磁石燒赤醋淬二次五味子牡丹皮乾薑玄參各一兩附子炮半兩上為末煉蜜丸如桐子大食前茶下十丸治目之方用黃連多矣而羊肝丸尤奇異用黃連末一兩白羊肝一具去膜同於瓷盆內研令極細衆手捻為丸如桐子大每服以溫水下三十丸連作五劑但是諸眼目疾及障翳青盲皆治忌豬肉冷水唐崔承元為官治一死囚出活之後數年以病目致死一旦崔為內障所苦喪明逾年後半夜獨坐自嘆忽聞階除窸窣之聲崔問是誰徐曰昔年蒙恩活囚也今來報恩遂將此方告訖而沒依此合服不數月眼復得明又方治內障白羯羊肝只用子肝一片薄切新瓦上焙熟地一兩半菟絲子蕤仁車前子麥門冬地膚子去殼澤瀉防風黃芩白茯苓五味子桂心杏仁炒細辛枸杞子茺蔚子苦葶藶青葙子各一兩上為細末煉蜜丸如桐子大每服三四十丸溫水下日三服不拘時候張臺卿嘗苦目暗京師醫者令灸肝俞遂轉不見物因得此方眼目遂明一男子內障醫治無效因以余劑遺之一夕燈下語其家曰適偶有所見如隔門縫見火者及旦視之眼中翳膜俱裂如線張云此藥靈勿妄與人忽之則無驗豫益信之且欲廣其傳也經云肝虛則目䀮䀮無所見耳汩汩無所聞善恐如人將捕之狀海藏六目瞑肝氣不治也又鎮肝明目羊肝丸羯羊肝一具新瓦盆中爆了更焙之肝大止用一半甘菊羌活柏子仁細辛官桂白朮五味子各半兩黃連三分上為細末煉蜜丸如桐子大空心食前溫水下三四十丸千補肝散治目失明方青羊肝一具去膜薄切之以新瓦瓶子未用者入肝於中炭火炙之為極細末蓼子一合炒令香上為末食後服方寸匕日二加至三匕不過一二劑能一歲服可夜讀細書治目䀮䀮無所見方用青羊肝一具細切以水一斗銅器中煮以麵餅覆上上鑽兩孔如人眼大以目向就熏不過再熏即瘥濟養肝丸治肝血不足眼目昏花或生眵淚當歸酒洗車前子酒蒸焙防風去蘆白芍藥蕤仁另研熟地酒蒸焙川芎枳實各等分上為末煉蜜丸如桐子大每服七十丸熟水送下不拘時本素問云久視傷血血主肝故勤書則傷肝主目昏肝傷則自生風熱氣上騰致目昏亦不可專服補藥但服益血鎮肝明目藥自愈熟地黃丸熟地一兩半黃連決明子各一兩沒藥半兩甘菊花二兩防風羌活各一兩桂心五錢硃砂五錢上為細末煉蜜丸如桐子大每服三十丸熟水下食後日三服千明目發不白落方用牛膽浸槐子陰乾百日食後每日吞一枚十日身輕三十日白髮再黑百日通神膽移熱於腦則辛頞鼻淵傳為衄衊瞑目全文見診病傳變經云腎足少陰之脈是動則病坐而欲起目䀮䀮如無所見又云少陰所謂起則目䀮䀮無所見者陰內奪故目䀮䀮無所見也此蓋房勞目昏也治瞳子散大諸方並見前陰虛睛散大視物花條東益本滋腎丸必與前陰虛睛散大條相兼服黃柏去皮挫碎酒洗炒知母去毛挫碎酒洗炒各等分上為極細末滴水丸如桐子大每服百五十丸熱湯送下空心服服後以乾物壓之濟補腎丸治腎氣不足眼目昏暗瞳人不明漸生內障磁石煅醋淬七次水飛過菟絲子酒蒸二次各二兩五味子熟地酒蒸焙枸杞子楮實子覆盆子酒浸肉蓯蓉酒浸焙車前子酒蒸石斛去根各一兩沉香青鹽二味另研各半兩上為末煉蜜丸如桐子大每服七十丸空心鹽湯下千神麯丸主明目百歲可讀細書神麯四兩磁石煅醋淬七次一兩光明砂水飛一兩上為末煉蜜丸如桐子大每服五丸米飲下食前日三服常服益眼力此方神驗不可具述外治積年目失明不識人決明子二升杵散食後以粥飲服方寸匕本草云決明子微寒助肝氣益精水千白瓜子七升絹袋盛攪沸湯中三遍暴乾以酢五升浸一宿暴乾為末酒調方寸匕服日三服之至百日可夜讀書本草云白瓜子平寒外臺名補肝散主五勞七傷酢酸入肝運氣目昏有四一曰風熱經六少陰司天之政風熱參布雲物沸騰太陰橫流寒乃時至往復之作民病聾瞑此風熱參布目昏也二曰熱經云少陰在泉熱淫所勝病目瞑治以針寒此熱勝目昏也三曰風又云歲水不及濕乃大行復則大風暴發目視䀮䀮此風勝目昏也四曰燥經云陽明司天燥淫所勝目昧眥瘍治以苦熱是也本讀書之苦傷肝損目誠然晉範寧嘗苦目痛就張湛求方湛戲曰古方宋陽子少得其術以授魯東門伯次授左丘明遂世世相傳以及漢杜子夏晉左太衝凡此諸賢並有眼目疾此方用損讀書一減思慮二專內視三簡外觀四宜起晚五宜早眠六凡六物熬神火下以氣簇蘊於胸中七日然後納諸方寸修之一年近能數其目睫遠視尺箠之餘長服不已洞見牆壁之外非但明目乃亦延年審如是而行非可謂嘲戲亦奇方也羅省郎中張子敬年六十七歲病眼目昏暗微黑色皮膚不澤六脈弦細而無力一日出示治目二方問豫可服否豫曰此藥以黃連大苦之藥為君諸風藥為使且人年五十膽汁減而目不明內經云土位之主其瀉以苦瀉風藥亦能瀉土年六十脾胃虛而皮肉枯重瀉其土使脾胃虛而不能營運榮衛之氣滋養元氣胃氣不能上行膈氣吐食諸病生矣又況年高衰弱此藥不可服只宜慎言語節飲食懲忿窒欲此不治之治也子敬以為然明年春除關西路按察司三年致仕還精神清勝脈遂平和此不服寒涼之劑也內經云誅伐無過是謂大惑解之可也靈黃帝曰人之哀而涕泣者何氣使然岐伯曰心者五臟六腑之主也目者宗脈之所聚也上液之道也口鼻者氣之門戶也故悲哀愁憂則心動心動則五臟六腑皆搖搖則宗脈感宗脈感則液道開液道開故涕泣出焉液者所以灌精濡空竅者也故上液之道開則泣泣不止則液竭液竭則精不灌精不灌則目無所見矣故命曰奪精補天柱經俠頸俠頸謂頭中分也針灸內障有四法此篇是其一也其二取肝經曰肝虛則目䀮䀮無所見善恐取其經厥陰與少陰取血者是也其三取腎經云腎足少陰之脈是動則病目䀮䀮無所見視寒熱虛實取之也其四取陽蹺經云邪之所在皆為不足上氣不足目為之瞑補足外踝下留之是也玉眼久病昏花肝俞一分沿皮向外一寸半補三呼三里一寸瀉十吸瞳子窖子和戴人女僮至西華具急暴盲不見物戴人曰此相火也太陽陽明氣血俱盛乃刺其鼻中攢竹穴與項前五穴大出血目立明甲青盲遠視不明承光主之瞳子癢遠視昏䀮䀮夜無見目瞤動與項口相參引喎噼口不能言刺承泣目瞑身汗出承漿主之撮要眼無光商陽一分沿皮向後三分瀉之灸甲青盲商陽主之𥌰目目䀮䀮偏歷主之𥌰目目䀮䀮少氣灸手五里左取右右取左目瞑遠視䀮䀮目窗主之青盲䐴目惡風寒上關主之龍木論內障根源歌不疼不痛漸昏蒙薄霧輕煙漸漸濃或見蠅飛花亂出或如絲絮在虛空此般狀樣因何得肝臟停留熱與風大叫大啼驚與恐腦脂流入黑睛中初時一眼先昏暗次第相牽與一同苦口何須陳逆耳只緣肝氣不相通此時服藥宜鎮定將息多乖即沒功日久既應全黑暗時名內障障雙瞳名字隨形分十六龍師聖者會推窮靈藥這回難得效金針一撥日當空強修將息依前説莫遣依前病復蹤針內障眼法歌內障由來十六般學醫人子審須看分明一一知形狀下針方可得安然若將針法同圓翳誤損神光取瘥難冷熱先明虛與實調和四體待令安不然氣悶違將息嘔逆勞神翳卻翻咳嗽震頭皆未得多驚先服鎮心丸若求涼藥銀膏等用意臨時體候看老翳細針初復嫩針形不可一般般病虛新産懷娠月下手才知將息難不雨不風兼皓月清齋三日在針前安心定意行醫道念佛親姻莫雜喧患者嚮明盤膝坐提撕腰帶得心安針者但行賢哲路惻隱之情實善緣有血莫驚須住手裹封如舊再開看忽然驚振醫重卜服藥三旬見朗然七日解封難見物花生水動莫它言還睛丸散堅心服百日分明覆舊根針內障後法歌內障金針針了時醫師言語要深知綿包黑豆如球子眼上安排日系之臥眠頭枕須安穩仰臥三朝莫厭遲封后忽然微有痛腦風牽動莫它疑或針或烙依經法痛極仍將火尉之擬吐白梅含咽汁吐來仰臥卻從伊起則恐因遭努損雖然希有也須知七朝豉粥溫溫食震著牙關事不宜大小便時須緩緩無令自起與扶持高聲叫喚言多後驚動睛輪見雪飛如此志心三十日漸行出入認親知狂心莫憶陰陽事夫婦分床百日期一月不須臨洗面針痕濕著痛微微五腥酒面周年斷服藥平除病本基上龍木諭金針開內障大法謹按其法初患眼內障之時其眼不痛不澀不癢頭不旋不痛而翳狀已結成者宜金針撥去其翳如撥雲見日而光明也今具其略於後開內障圖圓翳初患時見蠅飛花發垂蟻薄煙輕霧先患一眼次第相牽俱圓翳如油點浮水中陽看則小陰看則大金針一撥即去滑翳翳如水銀珠宜金針撥之澀翳翳如凝脂色宜針撥之浮翳藏形睛之深處細看方見宜針深撥之橫翳橫如劍脊兩邊薄中央厚宜針於中央厚處撥之以上五翳皆先患一目向後俱損初患之時其眼痛澀頭旋額痛雖有翳狀亦難針撥獨偃月翳棗花翳黑水凝翳微有頭旋額痛者宜針輕撥之冰翳初患能遠視不能近視能近視不能遠視東能遠視不能近視者陽氣有餘陰氣不足也乃血虛氣盛血虛氣盛者皆火有餘元氣不足火者元氣穀氣真氣之賊也元氣之來也徐而和細細如線邪氣之來也緊而強如巨川之水不可遏也海目能遠視責其有火不能近視責其無水法當補腎東地芝丸治目不能近視能遠視及大厲風成癩悉皆治之生地焙四兩天門冬去心四兩枳殼炒二兩甘菊花去皮二兩上同為細末煉蜜丸如桐子大每服一百丸茶清送下溫酒亦下食後六味地黃丸亦治此症能近視不能遠視者陽氣不足陰氣有餘乃氣虛而血盛也血盛者陰火有餘也氣虛者元氣衰弱也此老人桑榆之象也海目能近視責其有水不能遠視責其無火法宜補心東定志丸出局方治眼不能遠視能近視者遠志去苗心二兩人參一兩白茯苓去皮一兩菖蒲二兩上為末煉蜜丸硃砂為衣每服十丸加至二十丸雀目日落即不見物無蛤粉丸治雀目日落不見物蛤粉細研黃蠟等分上溶蠟搜粉為丸如棗大每用豬肝一片二兩許批開裹藥一丸麻線纏入甕內水一碗煮熟取出乘熱熏目至溫吃肝以愈為度神效千雀目方地膚子五錢決明子一升上二味為末以米飲汁和丸食後服二十丸至三十丸日日服至瘥止世治雀目用蒼朮四兩米泔水浸一宿切作片焙乾為末每服三錢豬肝二兩批開糝藥在內用麻線系定粟米一合水一碗砂鍋內煮熟熏眼候溫臨臥服之大效聖治雀目眼不計時月用蒼朮一兩搗羅為末每服一錢不計候心雀目不能夜視神庭上星前頂百會各出血以鹽塗之立愈又法照海肝俞目淚不止素厥則目無所見夫人厥則陽氣並於上陰氣並於下陽並於上則火獨光也陰並於下則足寒足寒則脹也夫一水不勝五火故目眥盲是以氣衝風泣下而不止夫風之中目也陽氣內守於精是火氣燔目故見風則泣下也有以比之夫火疾風生乃能雨此之類也解精微論子和凡風沖淚出俗言作冷淚者非也風衝於內火發於外風熱相搏由是淚出內外皆治可愈治外以貝母一枚白膩者加胡椒七粒不犯銅鐵研細臨臥點之治內以當歸飲子服之當歸大黃柴胡人參黃芩甘草芍藥各一兩滑石半兩上切碎每服三錢至五錢水一盞生薑三片同煎七分去渣溫服肝為淚全文見五臟垣水附木勢上為眼澀為眵為冷淚此皆由肺金之虛而肝木寡於畏也孫英宗朝國婆婆患眼冷淚眼科醫官治二三年不能療上召孫孫至曰臣非眼科但有藥耳容進方用石決明一兩赤小豆一兩半半夏五錢生斑蝥二十一粒炒去頭足木賊五錢為末薑汁丸如桐子大每服二十丸薑湯下方進聖旨下眼科詳定眼科醫官奏曰此方於眼科甚不相涉斑蝥有毒恐傷臟腑不敢用合再取聖旨國婆婆聞之曰眼科醫官不惟不能亦不願使我治也但合此藥縱傷無怨上聞之孫自進藥服經十餘日愈八分二十日全愈時眼科並降兩官孫賞錢三十萬銀海止淚方蒼朮米泔浸一兩半木賊去節二兩香附子炒去毛上為末煉糊丸如桐子大食後鹽湯下三丸經云風氣與陽明入胃循脈而上至目內眥則寒中而泣出此中風寒淚出也河當歸湯治風邪所傷寒中目淚自出肌瘦汗不止當歸人參各三兩官桂一兩乾薑炮白朮白茯苓甘草川芎細辛白芍藥各半兩陳皮一兩上為末每服二錢水一盞生薑三片棗二枚同煎至八分去渣熱服不計時並三服本治頭風冷淚龐安常二方甘菊決明子各二錢白朮羌活川芎細辛白芷荊芥穗各半兩上為細末每服一錢溫湯調下食後日三服又方川芎甘菊細辛白朮白芷以上各等分上為末蠟丸如黍米大夜臥服一丸日中一時辰換一丸本治風盛膈壅鼻塞清涕熱氣攻眼下淚多眵齒間緊急作頭痛川芎丸川芎柴胡各一兩半夏曲甘草炙甘菊人參前胡防風各半兩上每服四錢水一盞生薑四片薄荷五葉同煎七分去渣溫服靈五臟六腑心為之主耳為之聽目為之視肺為之相肝為之榮脾為之衛腎為之主外故五臟六腑之津液盡上滲於目心悲氣並則心系急心系急則肺舉肺舉則液上溢夫心系與肺不能常舉乍上乍下故咳而泣出矣丹婦人患眼眵不思食四物湯加白朮陳皮黃芩連翹分六帖煎食前熱服又灸合谷肘治眼淚出不止用黃連濃漬綿干拭目山風淚眼九節黃連和槐樹皮灰粗末熬湯澄清頻洗垣神效明目湯連翹飲子治淚不止二方並風倒睫拳毛運氣淚出皆從風熱經曰厥陰司天之政三之氣天政布風乃時舉民病泣出是也集迎風冷淚眵䁾黑花大骨空小骨空如上法灸之吹火滅二間一分沿皮向後刺五分灸之合谷針灸風沿爛眼丹風沿眼系上膈有積熱自飲食中挾怒氣而成頑痰痞塞濁氣不降清氣不上升由是火益熾而水益降積而久也眼沿因膿漬而腫於中生細小蟲絲遂年久不愈而多癢者是也用紫金膏以銀叉腳揩去油膩點之試問若果癢者又當去蟲以絶根本蓋紫金膏止是去濕與去風涼血而已若前所謂飲食挾怒成痰又須更與防風通聖散去硝黃為細末以酒拌勻曬乾依法服之禁諸厚味及大料物方盡諸法之要紫金方未詳即蘭室祕藏眼目門還睛紫金丹是也防風通聖散方見癇世爐甘石散治爛風眼以爐甘石不拘多少先用童便煅七次次用黃連濃煎汁煅七次次用穀雨前茶清濃煎煅七次又並三汁余者一次再煅三次然後安放地上一宿出火氣細細研入冰片麝香點上神妙爐甘石煅時須用好紫霄炭極大者鑿一穴以安爐甘石丹治風沿爛眼二蠶砂用香油浸月餘重綿濾過點之愈久愈妙世紫金膏用水飛過虢丹蜜多水少文武火熬以器貯點之保治眼赤瞎以青泥蛆淘淨曬乾末之仰臥合目用藥一錢放眼上須臾藥行待少時去藥赤瞎自無東垣目眶赤爛歲久俗呼赤瞎是也常以三稜針刺目外以泄濕熱立愈撮要風弦爛眼大骨空在手大指第二節尖灸九壯以口吹火滅小骨空在手小指二節尖灸七壯亦吹火滅倒睫拳毛眼睫毛倒入眼中央是也垣神效明目湯治眼楞緊急致倒睫拳毛損目及上瞼皆赤爛睛亦疼痛昏暗日則冷淚長流夜則眼眵滿眼葛根一錢半甘草根炙二錢防風根一錢蔓荊子五分細辛根三分又一方加黃耆根一錢上㕮咀作一服水一盞八分煎至一盞去渣稍熱臨臥服效防風飲子治倒睫拳毛黃連炒甘草炙人參各一錢葛根防風各五分歸身一錢半細辛葉蔓荊子各三分上銼如麻豆大都作一服水二大盞煎至一盞去渣溫服食後避風寒濕熱處眠之神效黃耆湯治渾身麻木不仁及兩目緊急縮小羞明畏日或隱澀難開或視物無力睛痛昏花手不得近或目少睛光或目中熱如火服五六次神效黃耆二兩人參去蘆一兩甘草炙一兩蔓荊子銼二錢白芍藥一兩陳皮去白半兩上㕮咀每服四五錢水一盞八分煎至一盞去渣臨臥稍熱服如小便淋澀加澤瀉五分如有大熱證加黃柏三錢酒浸四次炒如麻木不仁雖有熱不用黃柏再加黃耆一兩如眼縮小去芍藥忌酒醋濕面大料物蔥韭蒜及淡滲生冷硬物如麻木重甚者加芍藥一兩木通一兩撥雲湯戊申六月徐總管患眼疾於上眼皮下出黑白翳二個隱澀難開兩目緊急而無疼痛兩手寸脈細緊按之洪大無力知足太陽膀胱為命門相火煎熬逆行作寒水翳及寒膜遮睛與下項一服神效外證呵欠善悲健忘嚏噴時自淚下面赤而白能食不大便小便數而欠氣上而喘黃耆七分細辛葉五分柴胡七分生薑荊芥各一錢防風一錢半羌活一錢半藁本一錢甘草梢一錢升麻一錢葛根五分川芎五分知母一錢黃柏一錢半歸身一錢上銼如麻豆大作一服水二大盞煎至一盞稍熱服連翹飲子治目中溜火惡日與火隱澀小角偏緊久視昏花迎風有淚蔓荊子甘草連翹各三分柴胡二分酒黃芩五分生地三分防風五分人參三分黃耆五分紅葵花三分升麻一錢歸身二分羌活五分上㕮咀每服五錢水二盞煎至一盞去渣稍熱食後服前一方治倒睫拳毛後三方治眼楞緊急縮小眼楞緊縮小者倒睫拳毛之漸也故以其方附於後蓋陽虛則眼楞緊急陰虛則瞳子散大故東垣治眼楞緊急用參耆補氣為君佐以辛味疏散之而忌芍藥五味子之類酸收是也治瞳子散大用地黃補血為君佐以酸味收斂之而忌茺蔚子青葙子之類是也治倒睫眼方以無名異末摻卷在紙中作捻子點著至藥末處吹殺以煙燻之自起本治倒睫爛弦蠶砂一兩虢丹五錢上二味慢火熬成膏入輕粉五分熬黑色逐時湯泡洗瑞青黛散治眼倒睫極效蝟刺棗棘針白芷青黛上各等分為細末左眼倒睫口噙水左鼻內搐之右眼倒睫右鼻內搐之山眼毛倒睫摘去拳毛用蝨子血點入眼內數次即愈垣眼生倒睫拳毛由目緊急皮縮之致也蓋內伏熱攻陰氣外行當去其內熱併火邪使眼皮緩則眼毛立出翳膜亦退用手法攀出內瞼向外刺以三稜針針出熱血以左爪甲迎住針縫立愈胬肉攀睛羅還睛散治眼翳膜昏澀淚出瘀血胬肉攀睛川芎草龍膽草決明石決明荊芥枳實野菊花野麻子白茯苓去皮甘草炙木賊白蒺藜川椒炒去子仙靈脾茵陳以上各半兩上為細末每服二錢食後茶清調下一日三服忌食魚肉及熱面蕎麥等物一方有楮實子無仙靈脾茵陳枳實三味圖治卒患赤目胬肉生內痛者取好梨一個搗絞汁黃連三枚碎之以綿裹漬令色變仰臥注目中外主目翳及胬肉用礬石最白者納一黍米於翳上及胬肉上即冷淚出綿拭之令惡汁盡其疾日減翳自消薄便瘥礬石須真白者方效千治目中生瘜肉翳滿目閉瞳子及生珠管方貝齒七枚燒為末真珠等分上為細末如粉以注翳肉上不過五度即瘥集胬肉攀睛睛明風池太陽出血期門飛絲塵垢入目世治飛絲入目者用頭垢點入眼中即出神效飛絲入眼用柘樹漿點了綿裹箸頭蘸水於眼上繳拭涎毒治飛絲入目以火麻子一合杵碎井花水一碗浸攪卻將舌浸水中涎沫自出神效一方用茄子葉碎杵如麻子法尤妙丹飛絲落眼眼腫如眯痛澀不開鼻流清涕用京墨濃磨以新筆塗入目中閉目少時以手張開其絲自成一塊看在眼白上卻用綿輕輕惹下則愈如未盡再塗此方纍效治眯目鹽與豉置水中浸之視水其渣立出孫真人方千治稻麥芒入眼取蠐螬以新布覆目上蠐躋螬從布上摩之其芒出著布上山物落眼中用新筆蘸繳出又方濃研好墨點眼立出視歧亂見靈帝曰余嘗上清泠之臺中階而顧匐匍而前則惑余私異之竊內怪之獨瞑獨視安心定氣久而不解獨搏獨眩被髮長跪俯而視之後久之不已也卒然自上何氣使然岐伯曰五臟六腑之精氣皆注於目而為之精精之窠為眼骨之精為瞳子筋之精為黑眼血之精為絡其窠氣之精為白眼肌肉之精為約束裹擷筋骨血氣之精而與脈併為系上屬於腦後出於項中故邪中於項因逢其身之虛其入深則隨眼系以入於腦入於腦則腦轉腦轉則目系急目系急則目眩以轉矣邪中其精其精所中不相比也則精散精散則視歧故見兩物大惑論本荀牧仲頃年嘗謂豫曰有人視一物為兩醫作肝氣盛故見一為二服瀉肝藥皆不驗此何疾也豫曰孫真人曰靈樞有云目之繫上屬於腦後出於項中雲云則視歧故見兩物也令服驅風入腦藥得愈靈目者五臟六腑之精也榮衛魂魄之所常營也神氣之所生也故神勞則魂魄散志意亂是故瞳子黑眼法於陰白眼赤脈法於陽也故陰陽合轉而睛明也目者心之使也心者神之舍也故神精亂而不轉卒然見非常處精神魂魄散不相得故曰惑也帝曰余疑其然余每之東苑未曾不惑去之則復余唯獨為東苑勞神乎何其異也岐伯曰不然也心有所喜神有所惡卒然相感則精氣亂視誤故惑神移乃復是故間者為迷甚者為惑大惑篇素夫精明者所以視萬物別白黑審長短以長為短以白為黑如是則精衰矣右目亂見治法東垣益氣聰明之類是也目閉不開足太陽之筋為目上綱足陽明之筋為目下綱熱則筋縱目不開全文見筋眴條睊目直視睊胃者目睛斜倒不正小兒謂之通睛甲睊目者水溝主之集直視者視物而目睛不轉動者是也若目睛動者非直視也傷寒直視者邪氣壅盛冒其正氣使神氣不慧臟腑之氣不上榮於目則目為之直視傷寒至於直視為邪氣已極證候已逆多難治經曰衄家不可發汗發汗則額上陷脈緊急直視不能眴不能眠以肝受血而能視亡血家肝氣已虛目氣已弱又發汗亡陽則陰陽俱虛所致也此雖錯逆其未甚也逮狂言反目直視又為腎絶直視搖頭又為心絶皆臟腑氣脫絶也直視譫語喘滿者死下痢者亦死又劇者發狂則不識人循衣摸床惕而不安微喘直視脈弦澀者死皆邪氣盛而正氣脫也少陽終者其百節縱目睘絶系全文見診生死條目系絶故目不動而直視王注云睘謂直視如驚貌睘音瓊目上視瞳子高者太陽不足戴眼者太陽已絶全文見診生死戴眼者目直視不能轉動也太陽之脈其終也戴眼反折瘛瘲針灸目上視見中風上
