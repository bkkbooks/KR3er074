body:
  text: 卷之十二肝膽部諸痹素黃帝曰痹之安生岐伯對曰風寒濕三氣雜至合而為痹也其風勝者為行痹行痹者行而不定也稱為走注疼痛及歷節之類是也寒氣勝者為痛痹痛痹者疼痛苦楚世稱為痛風及白虎飛屍之類是也濕氣勝者為著痹著痹者著而不移世稱為麻木不仁之類是也凡麻木不仁必著而不移河間所謂氣之道路著而麻者得矣或痛著一處始終不移者是也帝曰其有五者何也岐伯曰以冬遇此者為骨痹以春遇此者為筋痹以夏遇此者為脈痹以至陰遇此者為肌痹以秋遇此者為皮痹凡風寒濕所為行痹痛痹著痹之病冬遇此者為骨痹春遇此者為筋痹夏遇此者為脈痹長夏遇此者為肌痹秋遇此者為皮痹皆以所遇之時所客之處命名非此行痹痛痹著痹之外又別有骨痹筋痹脈痹肌痹皮痹也帝曰內舍五臟六腑何氣使然岐伯曰五臟皆有合病久而不去者內舍於其合也故骨痹不已復感於邪內舍於腎筋痹不已復感於邪內舍於肝脈痹不已復感於邪內舍於心肌痹不已復感於邪內舍於脾皮痹不已復感於邪內舍於肺所謂痹者各以其時重感於風寒濕之氣也凡痹之客五臟者肺痹者煩滿喘而嘔心痹者脈不通煩則心下鼓暴上氣而喘嗌乾善噫厥氣上則恐肝痹者夜臥則驚多飲數小便上為引如懷腎痹者善脹尻以代踵脊以代頭脾痹者四肢解墮發咳嘔汁上為大塞腸痹者數飲而出不得中氣喘爭時發飧泄治見飧泄門胞痹者少腹膀胱按之內痛若沃以湯澀於小便上為清涕治見淋門淫氣喘息痹聚在肺淫氣憂思痹聚在心淫氣遺溺痹聚在腎淫氣乏竭痹聚在肝淫氣肌絕痹聚在脾王注云淫氣謂氣之妄行者各隨臟之所主而入為痹也諸痹不已亦益內也其風氣勝者其人易已也帝曰痹其時有死者或疼久者或易已者其故何也岐伯曰其入臟者死其留連筋骨間者疼久其留皮膚間者易已帝曰其客於六腑者何也岐伯曰此亦其食飲居處為其病本也六腑亦各有俞風寒濕氣中其俞而食飲應之循俞而入各舍其腑也帝曰以針治之奈何岐伯曰五臟有俞六腑有合循脈之分各有所發各隨其過則病瘳也見痹論篇冬感風寒濕者為骨痹久不已則內入於腎病腎脹足攣尻以代踵身蜷脊以代頭取太谿委中春感風寒濕者為筋痹久而不已則內入於肝病臥則驚多飲數小便取太衝陽陵泉夏感風寒濕者為脈痹久而不已則內入於心病心下滿暴喘嗌乾善噫恐懼取大陵小海長夏感風寒濕者為肉痹久而不已則內入於脾病四肢解墮發咳嘔汁取太白三里秋感風寒濕者為皮痹久而不已則內入於肺病煩滿喘嘔取太淵合谷帝曰榮衛之氣亦令人痹乎岐伯曰榮者水穀之精氣也和調於五臟灑陳於六腑乃能入於脈也故循脈上下貫五臟絡六腑也衛者水穀之悍氣也其氣慓疾滑利不能入於脈也故循皮膚之中分肉之間熏於肓膜散於胸腹逆其氣則疾從其氣則愈不與風寒濕氣合故不為痹帝曰善痹或痛或不痛或不仁或寒或熱或燥或濕其故何也岐伯曰痛者寒氣多也有寒故痛也治見痛痹其不痛不仁者病久入深榮衛之行澀經絡時疏故不通皮膚不營故為不仁治見著痹其寒者陽氣少陰氣多與病相益故寒也治見痛風條酒漬巾熨其熱多陽氣多陰氣少病氣勝陽乘陰故為痹熱其多汗而濡者此為逢濕甚也陽氣少陰氣盛兩氣相感故汗出而濡也帝曰夫痹之為病不痛何也岐伯曰痹在骨則重在於脈則血凝而不流在於筋則屈而不伸在於肉則不仁在皮則寒故具此五者則不痛也凡痹之類逢寒則急逢熱則縱帝曰善俱痹論河升麻湯治熱痹肌肉熱極體上如鼠走唇口反縱皮色變諸風皆治升麻三兩茯神去皮人參防風犀角鎊羚羊角鎊羌活各一兩官桂半兩上為末每服四錢水二盞生薑二塊碎竹瀝少許同煎至一盞溫服不計時候素少陰有餘病皮痹癮疹不足病肺痹太陰有餘病肉痹寒中不足病脾痹陽明有餘病脈痹身時熱不足病心痹太陽有餘病骨痹身重不足病腎痹少陽有餘病筋痹脅滿不足病肝痹四時刺逆從論肺脈微大為肺痹引胸背起惡日光心脈微為心痹引背善淚出全文見診靈黃帝曰何以候人之善病痹者少俞答曰粗理而肉不堅者善病痹黃帝曰痹之高下有處乎少俞答曰欲知高下者各視其部五變論闕中薄澤為風沖濁為痹五色篇浮絡多青則痛黑則痹全文見皮絡脈暴黑者留久痹也全文見陰陽素脈澀曰痹平人氣象論行痹即走注疼痛仲諸肢節疼痛身體尫羸腳腫如脫頭眩短氣兀兀欲吐桂枝芍藥知母湯主之桂枝四兩芍藥三兩甘草二兩麻黃二兩生薑五兩白朮五兩知母四兩防風四兩附子二兩炮上以水七升煮取二升溫服七合日三服病歷節不可屈伸疼痛烏頭湯主之麻黃芍藥黃耆各三兩甘草炙川烏五枚㕮咀以蜜二升煎取一升即去烏頭上五味㕮咀以水三升煮取一升去渣納蜜再煎服七合不時盡服之河防風湯治行痹走注無定防風甘草當歸赤茯苓去皮杏仁去皮炒熟桂以上各一兩黃芩秦艽葛根各三錢升麻去節半兩上為末服五錢水酒各二盞棗三枚姜五片煎至一盞去渣溫服本治濕傷腎腎不養肝肝自生風遂成風濕流注四肢筋骨或入左肩髃肌肉疼痛漸入左指中薏苡仁散薏苡仁一兩當歸小川芎乾薑茵芋甘草官桂川烏防風人參羌活白朮麻黃獨活各半兩上為細末每服二錢空心臨臥酒調下日三服治白虎歷節諸風疼痛遊走無定狀如蟲齧晝靜夜劇及一切手足疼痛麝香丸川烏大八角者三個用生全蠍二十一個生用黑豆二十一個生用地龍半兩上為細末入麝香半字同研勻糯米糊為丸如綠豆大每服七丸甚者十丸夜臥令膈空溫酒下微出冷汗一身便瘥予得此方凡得歷節及不測疼痛一二服便瘥在歙州日有一貴家婦人遍身走注疼痛至夜則發如蟲齧其肌多作鬼邪治予曰此正歷節病也三服愈歙屍葉切丹龍虎丹治走注疼痛或麻木不遂或半身疼痛草烏蒼朮白芷各一兩上研為末水拌發熱過再入乳香二錢當歸牛膝各半兩酒糊丸如彈子大酒化下無附子八物湯治歷節風四肢疼痛如錘鍛不可忍附子炮去皮臍乾薑炮芍藥茯苓半夏桂心各三兩白朮四兩人參三兩上銼散每服四錢水二盞煎至七分去渣食前服丹痛風走注疼痛黃柏酒炒蒼朮酒炒各二錢上作一服煎就調酒威靈仙末羚羊角灰臣蒼朮佐芥子使用姜一片入藥末一錢擂碎以前藥再溫服東和血散痛湯治兩手十指一指疼了一指疼疼後又腫骨頭裡痛膝痛左膝痛了右膝痛發時多則五日少則三日晝輕夜重痛時覺熱行則痛輕腫卻重解云先血後氣乃先痛後腫形傷氣也羌活身升麻麻黃去節各錢半桃仁十個柴胡二錢紅花一分歸身一分防風一錢甘草炙二分獨活五分豬苓五分黃柏一錢防己六分知母酒一錢黃連酒上㕮咀分作四服每服水一大盞煎至一半去渣空心熱服羅真定府張大素好嗜酒五月間病手指節腫痛屈伸不利膝髕亦然心下痞滿身體沉重不欲飲食食即欲吐面色痿黃精神減少至六月間求予治之診其脈沉而緩緩者脾也難經云俞主體重節痛俞者脾之所主四肢屬脾蓋其人素飲酒加之時助濕氣大勝流於四肢故為腫痛內經云諸濕腫滿皆屬脾土仲景云濕流關節肢體煩痛此之謂也宜以大羌活湯主之內經云濕淫於內治以苦溫以苦發之以淡滲之又云風勝濕羌活獨活苦溫透關節而勝濕故以為君升麻苦平威靈仙蒼朮防風苦辛溫發之者也故以為臣血壅而不流則痛當歸辛溫以散之甘草甘溫益氣澤瀉鹹平茯苓甘平導濕而利小便以淡滲之使氣味相合上下分散其濕也羌活升麻各一錢獨活七分蒼朮防風甘草威靈仙茯苓當歸澤瀉各半兩上銼作一服水二盞煎至一盞溫服食前一服食後一服忌酒面生冷硬物本麻黃湯治歷節麻黃一兩羌活一兩黃芩三分細辛黃耆各五錢上為粗末每服五錢水二盞煎至八分去渣溫服接續三四日有汗慎風治風熱成歷節攻手指作赤腫麻木其則攻肩背兩膝遇暑熱或大便秘即作牛蒡子散牛蒡子新豆豉炒羌活各三兩生地二兩半黃耆一兩半上為細末湯調二錢服空心食前日三服此病胸膈生痰久則赤腫附著肢節久久不退遂成癘風此孫真人預戒也宜早治之河大豆糵散治周痹注五臟留滯胃中結聚益氣出毒潤澤皮毛補腎用大豆糵一升炒香熟為末每服半錢溫酒調下空心加至一錢日三服本草云大豆消瘀血破婦人惡血治熱痹筋攣膝痛古人多用酒沃豆糵取汗蓋表藥也無控涎丹凡人忽胸背手腳頸項腰胯隱痛不可忍連筋骨牽引釣痛坐臥不寧時時走易不定俗醫不曉謂之走注便用風藥及針灸皆無益又疑是風毒結聚欲為癰疽亂投藥帖亦非也此乃是痰涎伏在心膈上下變為疾或令人頭痛不可舉或神思昏惓多睡或飲食無味痰唾稠黏夜間喉中如鋸聲口流唾涎手腳重腿冷痹氣不通誤認為癱瘓亦非也凡有此疾但用是藥不過數服其疾如失甘遂去心紫大戟去皮白芥子真者各等分上為末煮糊丸如桐子大曬乾臨臥淡薑湯或熟水下五七丸至十丸痰猛氣實加丸數不妨其效如神千犀角湯治熱毒流入四肢歷節腫痛犀角二兩羚羊角一兩前胡黃芩梔子仁射干大黃升麻各四兩豉一升上九味㕮咀每服五錢水二盞煎服本茵芋丸治歷節腫滿疼痛茵芋硃砂薏苡仁各一兩牽牛一兩半郁李仁半兩上細末煉蜜杵丸如桐子大輕粉滾為衣每服十丸至十五丸或二十丸五更溫水下到晚未利可二三服快利為度白粥將息子和治一稅官風寒濕痹腰腳沉重浮腫夜則痛甚兩足惡寒經五六月間猶綿脛靴足膝皮膚少有跣露則冷風襲之流入經絡其病轉劇走註上下往來無定其痛極處便攣急而腫起肉色不變腠理如蟲行每遇風冷病必轉增飲食減肌體瘦乏須人扶稍能行立所服者烏附薑桂種種燥熱燔針著灸莫知其數前後三年不愈一日予脈之其兩手皆沉滑有力先以導水丸通經散各一服是夜瀉三十餘行痛減半漸服赤茯苓湯川芎湯防風湯此三方在宣明論中治痹方是也日三服煎七八錢漐漐然汗出余又作玲瓏灶法熏蒸血熱必增劇諸汗法古方多有之惟以吐發汗者世罕知之故予嘗曰吐法兼汗良以此夫千治遊風行走無定或如盤大或加甌或著腹背或著臂或著腳悉主之海藻茯苓防風獨活附子白朮各三兩大黃五兩鬼箭羽當歸各二兩上九味㕮咀以水二斗漬五日初服二合漸加以知為度丹控涎散治身及脅走痛痰挾死血加桃仁泥丸治走注疼痛威靈仙一錢川芎七錢梔子炒一錢當歸一錢肉桂一分蒼朮一錢桃仁七個甘草五分上用生薑五片水二盞煎半乾入童便半盞竹瀝半盞沸熱服忌肉面雞定痛方治一切風濕痹痛乳香沒藥地龍去土木鱉去皮金星石五靈脂上等分蜜丸如彈子大每服一丸臨臥酒下外治歷節諸風百節痠疼不可忍用松脂三十斤煉四五十遍以煉酥三升溫和松脂三升熟攪令極調勻每旦空腹以酒服方寸匕日二服數日食麵粥為佳慎勿食血腥生冷鮓物果子百日瘥松節酒治歷節風四肢疼痛松節二十斤酒五斗漬三七日服一合日五六服丹溪云松屬金能滲血中之濕千松葉酒治歷節松葉三十斤酒二石五斗漬三七日服一合日服五六度寒走注疼痛治法及熱走注疼痛治法並見表寒表熱條垣身體沉重走注疼痛濕熱相搏而風熱鬱不得伸附著於有形也宜蒼朮黃柏之類李絳兵部手集方治臂脛痛不計深淺皆效用虎脛骨二大兩粗舂熬黃羚羊角一大兩屑新芍藥二大兩細切三物以無灰酒浸之春夏七日秋冬倍日每旦空腹飲一杯冬月速要服即以銀器物盛火爐中暖養之三兩日即可服也經治風毒骨髓疼痛芍藥二分虎骨一具塗酥炙黃槌碎絹袋盛用清酒三升漬五日每服二合日三服聖治歷節風百節疼痛不可忍用虎頭骨一具塗酥炙黃槌碎絹袋盛用清酒二斗浸五宿隨性多少緩飲之妙靈黃帝問於岐伯曰周痹之在身也上下移徙隨脈其上下左右相應間不容空願聞此痛在血脈之中邪將在分肉之間乎何以致是其痛之移也間不及下針其搐痛之時不及定治而痛已止矣何道使然願聞其故岐伯答曰此眾痹也非周痹也黃帝曰願聞眾痹岐伯曰此各在其處更發更止更居更起以右應左以左應右非能周也更發更休也帝曰善此痛安生何因而有名岐伯曰風寒濕氣客於外分肉之間迫切而為沫沫得寒則聚聚則排分肉而分裂也分裂則痛痛則神歸之神歸之則熱熱則痛解痛解則厥厥則它痹發發則如是此內則不在臟而外未發於皮獨居分肉之間真氣不能周故命曰周痹周痹當作眾痹夫周痹邪在分肉血脈今云邪獨居分肉之間而命曰周痹者是眾痹之誤為周痹也明矣神歸之則熱熱則痛解者所謂更止更居也痛解則厥厥則它痹發者所謂更發更起也自黃帝曰善此痛安生至此一百十四字原誤在後刺其下以脫之上今移於此黃帝曰善刺之奈何岐伯曰刺此者痛雖已止必刺其處勿令復起帝曰善願聞周痹如何岐伯曰周痹者在於血脈之中隨脈以上隨脈以下不能左右各當其所黃帝曰刺之奈何岐伯曰痛從上下者先刺其下以過之後刺其上以脫之痛從下上者先刺其上以過之後刺其下以脫之故刺痹者必先切循其下之六經視其虛實及大絡之血結而不通及虛而脈陷空者而調之熨而通之其瘈堅轉引而行之帝曰善余已得其意矣周痹篇大絡血結不通為實脈陷空為虛過字一作遏下同按繆刺論云凡痹往來行無常處者在分肉之間痛而刺之以月死生為數用針者隨氣盛衰以為痏數針過其日數則脫氣不及日數則氣不瀉左刺右右刺左病已止不已復刺之如法月生一日一痏二日二痏漸多之十五日十五痏十六日十四痏漸少之詳此亦刺眾痹於所痛之法當與前眾痹法相參用之刺五臟六腑痹法見諸痹條千治歷節但於痛處灸三七壯佳怪白虎歷節風痛兩踝尖在內外兩踝尖灸之渾身疼痛往來上下無常陽輔如足跟不得履地風池如膝蓋腫起曲池一寸半陽陵泉一寸半心婦人四旬因小產成病百節痛無常處臥床不起八字五分環跳四寸半五樞三寸半曲池液門各寸半絕骨二寸半如脊背痛者人中大椎節下各五分委中七分見血立效無附骨疽與白虎飛屍歷節皆相類歷節痛則走注不定白虎飛屍痛淺按之則便止附骨疽痛深按之亦無益又一說白虎飛屍亦能作膿著骨而生及其腐漬碎骨出盡方愈如是則附骨與白虎飛屍同是一病但淺深不同耳仲寸口脈沉而弱沉即主骨弱即主筋沉即為腎弱即為肝汗出入水中如水傷心歷節黃汗出故曰歷節少陰脈浮而弱弱則血不足浮則為風風血相搏則疼痛如掣盛人脈澀小短氣自汗出歷節疼不可屈伸此皆飲酒汗出當風所致痛痹即痛風丹痛風論氣行脈外血行脈內晝行陽二十五度夜行陰二十五度此平人之造化也得寒則行遲而不及得熱則行速而太過內傷於七情外傷於六氣則氣血之運或遲或速而疾作矣彼痛風者大率因血受熱已自沸騰其後涉於冷水或立濕地或扇風取涼或坐臥當風寒涼外搏熱血得寒汙濁凝澀所以作痛夜則痛甚行於陰也治法以辛熱之劑流散寒濕發腠理其血得行與氣相和其病自安然亦有數種治法各異謹書一二以證予言一治東陽傅丈腿痛一治朱宅閫內痛攣一治鄰鮑子痢後風皆數十帖半年安詳見後丹溪先治內熱條或問比見鄰人用草藥研酒飲之不過數帖亦有安者如子之言類皆經久取效無乃太緩乎予曰此劫病草藥石上採絲為之君過山龍等佐之皆性熱而燥者不能養陰卻能燥濕病之淺者濕疾得燥則開熱血得熱則行亦可取效彼病深而血少者愈劫愈虛愈劫愈深若朱之病是也子以我為迂緩乎朱之病即朱閫攣痛醫十月不應而丹溪起之也潛行散治痛風黃柏一味酒浸焙乾為末生薑汁和酒調服必兼四物等湯相間服之妙二妙散治筋骨疼痛因濕熱者如有氣加氣藥如血虛加補血藥如痛甚以薑汁熱辣服之黃柏炒蒼朮炒制去皮上為粗末生薑研入湯煎沸調服此二物皆有雄壯之氣如表實氣實者少酒佐之一法二妙為君加甘草羌活各二錢陳皮芍藥各一錢酒炒威靈仙半錢為末服之佳一男子家貧多勞秋涼忽渾身發熱兩臂膊及腕兩足及胯皆疼痛如鍛晝輕夜劇醫與風藥則愈痛與血藥則不效惟待斃而已予脈之兩手俱澀而數右甚於左問其飲食則如平時形瘦則如削盡蓋大痛而瘦非病也用蒼朮一錢半酒黃柏一錢半生附一片生甘草三分麻黃五分研桃仁九個作一帖煎入薑汁些少令辣熱服至四帖後去附子加牛膝一錢至八帖後來告急云氣上喘促不得睡痛似微減此時昏黑不能前去診視予意其血虛因服麻黃過劑陽虛被髮動而上奔當與補血鎮墜帶味酸之藥以收之遂以四物湯加川芎芍藥人參二錢五味子十二粒作一帖與二帖服之喘促隨定是夜遂安三日脈之數減大半澀脈如舊問其痛則曰不減然呻吟之聲卻無察其起居則疲弱無力病人卻自謂不弱遂以四物湯加牛膝白朮人參桃仁陳皮甘草檳榔入姜三片煎服如此藥與五十帖而安一月後因負重擔痛復作飲食亦少再與此藥每帖加黃耆三分又二十帖方全愈東陽傅丈年逾六十性急作勞患兩腿痛動作則痛甚予視之曰此兼虛證當補血虛病自安遂與四物湯加桃仁陳皮牛膝生甘草煎入生薑研潛行散熱飲三四十帖而安何縣長年四十餘形瘦性急因作勞背疼臂痛骨節疼足心發熱可與四物湯帶熱下大補丸保和丸共六十粒食前服婦人腳疼腳怕冷夜劇日輕生地白芍歸尾各五錢黃柏炒黃芩白朮陳皮各三錢牛膝二錢蒼朮三錢甘草梢一錢上分六帖煎服食前熱飲之鄰人鮑子年二十餘因患血痢用澀藥取效後患痛風號叫撼鄰里予視之曰此惡血入經絡證血受濕熱久為凝濁所下未盡留滯隧道所以作痛經久不治恐成枯細遂與四物湯桃仁紅花牛膝黃芩陳皮甘草煎生薑汁研潛行散入少酒飲之數十帖又與刺委中出黑血近三合而安痢後風系血入腑腑下未盡復還經絡不得行故也松明節一兩以乳香一錢炒焦存性蒼朮一兩紫葳一兩半甘草半兩黃柏一兩桃仁去皮不去尖一兩俱為末每服三錢生薑同杵細水蕩起二三沸服朱宅閫內年三十食味甚厚性亦躁急患痛風攣縮數月醫不應予視之曰此挾痰與氣症當和血疏痰導氣病自安遂以潛行散入生甘草牛膝枳殼通草陳皮桃仁薑汁煎飲半年而安陸郎左腿肞骨舊痛小便赤少此積憂痰涎所為白朮枳殼赤芍一錢條芩連翹通草甘草梢三分六安人腳肞骨痛蒼朮白朮陳皮芍藥三分木通二錢甘草五分分四帖煎下大補丸四十粒上丹溪治痛風法主於血熱血虛血汙或挾痰皆不離四物潛行黃柏牛膝生甘草桃仁陳皮蒼朮生薑汁而隨症加減發前人之所未發醫世俗之所不醫其有功於世也大矣本王檢正患鼻額間痛或麻痹不仁如是數年忽一日連口唇頰車髮際皆痛不開口雖言語飲食亦妨在額與頰上常如糊手觸之則痛予作足陽明經絡受風毒傳入經絡血凝滯而不行故有此症或者以排風小續命透髓丹之類與之皆不效制此犀角升麻湯贈之數日而愈犀角一兩一錢升麻防風羌活各三兩川芎白附白芷黃芩各半兩甘草一分上粗末每服四大錢水一盞半煎至八分去渣通口食後服臨臥一服日三四服足陽明胃也經云腸胃為市又云陽明多血多氣胃之中腥膻五味無所不納如市廛無所不有也六經之中血氣俱多腐熟飲食故飲食之毒聚於胃此方以犀角為主解飲食之毒也陽明經絡環唇挾舌起於鼻合頞中循頰車上耳前過客主人循髮際至額顱王公所患皆一經絡也故以升麻佐之余藥皆滌除風熱升麻黃芩專入胃經稍通者自能曉海四物蒼朮各半湯治肢腫不能舉動四物湯蒼朮各半兩同煎服效與活血丹相表裡活血丹與四物蒼朮各半湯相表裡治遍身骨節疼痛如神熟地黃三兩當歸白朮白芍續斷人參各一兩上細末酒糊丸如桐子大東垣蒼朮復煎散治寒濕相合腦戶痛惡寒項筋脊強肩背胛卵痛膝臏痛無力行步能食身沉重其脈沉緩洪上急蒼朮四兩水二碗煎至二大盞去渣入下藥羌活一錢升麻柴胡藁本澤瀉白朮各五分黃柏三分紅花少許上為粗末用蒼朮湯二盞煎至一大盞去渣溫服空心微汗為效忌酒面緩筋湯治目如火腫痛兩足及伏兔骨筋痛膝少力身重腰痛夜惡寒痰嗽項頸筋骨皆急痛目多眵淚食不下羌活二錢獨活二錢藁本三分麻黃三分蘇木一分升麻三分甘草炙二分草蔻三分生地黃芩黃柏各三分蒼朮五分歸身三分柴胡三分熟地二分生甘草根二分上為粗末都作一服水二盞煎至一盞去渣熱服食遠仲桂枝芍藥知母湯河間防風湯以上二方治痛風神妙並見行痹表條世治痛風草烏四兩去尖木鱉子三兩去殼自然銅一兩煅香白芷三兩沒藥二兩另研南星二兩威靈仙二兩地龍三兩糊為丸每服十五粒羅活血應痛丸治風濕客於腎經血脈凝滯腰背腫疼不能轉側皮膚不仁遍身麻木上攻頭目虛腫耳內常鳴下注腳膝重痛少力行履艱難項背拘急不得舒暢常服和血脈壯筋骨使氣脈宣通狗脊去毛六兩蒼朮泔浸一宿十兩香附炒十二兩陳皮九兩沒藥一兩二錢草烏二兩半炮威靈仙三兩上為細末酒煮麵糊為丸如桐子大每服十五丸溫酒或熱湯送下不拘時候久服忌桃李雀鴿諸血物丹八珍湯治一切痛風腳氣頭風乳香沒藥代赭石穿山甲生用三錢川烏不去皮尖生用一兩草烏不去皮尖生用五錢羌活半兩全蠍二十一個用頭尾全者上醋糊丸如桐子大每服十一丸羅烏靈丸治久患風寒麻木痛行步艱難五靈脂二兩川烏一兩炮去皮臍上為細末酒煮麵糊為丸如桐子大每服十丸加至五十丸空心溫酒下忌一切冷物史丞相遇仙方治諸般痛風手足艱難筋骨疼痛口眼喎斜言語謇澀附子炮去皮臍川烏炮去皮臍當歸酒浸焙川芎羌活肉蓯蓉酒浸炮杜仲去皮炒去絲薑汁製黃耆白蒺藜炒去刺白朮人參川牛膝酒浸焙去蘆防風天麻去苗白茯苓萆薢狗脊炒去毛續斷獨活肉桂去粗皮赤芍各一兩虎脛骨二兩半酥炙上二十二味切細以生絹袋盛之用無灰酒浸密封瓶口春三日夏二日秋七日冬十日取出曬焙乾為末酒糊丸如桐子大用浸藥酒一盞送下五十丸空心服忌生冷油膩豆腐麵食發風之物世五加皮酒治風濕遍身疼痛俗名痛風或腫或癱或腳氣不能步履者用五加皮不拘多少入白曲內同釀白酒飲之或入在曲內造好酒尤妙丹治環跳痛不已防生附骨癰方以蒼朮佐黃柏之辛行以青皮冬加桂枝夏加黃芩體虛者加杜仲牛膝以甘草為使大料煎入酒深者恐朮柏桂枝十數帖發不動以少麻黃一二帖又不動者恐癰將成撅地成坑以火煅紅沃以小便赤體坐其上以被席圍抱下體使熱蒸腠理間血氣暢而愈時行熱毒攻手足大痛欲死作地坑深三尺可容則止卻燒令熱以酒沃之乘熱著履坐其上包裹勿泄氣立安若手痛者暖酒浸之傷寒類要衍用三升醇酒拌蠶屎五升甑蒸熱於暖室中鋪於油單上令患風冷氣閉及近感癰風人就所患一邊臥著溫熱處厚蓋覆汗出為度若虛人須在左右防大熱昏冒仍令頭面壅覆未全愈間再作外治風痛腫白虎病以三年釅醋五升熱煎三四沸切蔥白二三升煮一沸濾出布帛熱裹當病上熨之瘥為度靈寒痹之為病也留而不去時痛而皮不仁黃帝曰刺寒痹內熱奈何伯高答曰刺布衣者以火淬之刺大人者以藥熨之黃帝曰藥熨奈何伯高答曰用醇酒二十斤蜀椒一升乾薑一斤桂心一斤凡四種皆㕮咀漬酒中用綿絮一斤細白布四丈並納酒中置酒馬矢熅中蓋封塗勿使泄五日五夜出布綿絮曝乾之干復漬以盡其汁每漬必晬其日乃出干之並用滓與綿絮復布為復巾長六七尺為六七巾則用之生桑炭炙巾以熨寒痹所刺之處令熱入至於病所寒復炙巾以熨之三十遍而止汗出以巾拭其身亦三十遍而止起步內中無見風每刺必熨如此病已矣此所謂內熱也內音納壽夭剛柔篇羅拈痛散治肢節疼痛熨烙藥羌活獨活細辛肉桂防風白朮良薑麻黃不去節天麻去苗川烏生去皮吳茱萸乳香研小椒去目全蠍生當歸各一兩川薑五錢葛根一兩上為粗末入乳香研勻每抄藥一十錢甚者十五錢同細鹽一升炒令極熱絹袋盛熨烙痛處不拘早晚頻用藥冷再炒一次用畢甚妙仲婦人六十二種風及腹中血氣刺痛紅藍花酒主之用紅藍花一味以酒一大升煎減半頓服一半頃之再服濟虛骨丸治經絡凝滯骨節疼痛筋脈攣急遇陰寒愈痛乳香沒藥各另研赤芍熟地虎脛骨酥炙黃當歸各一兩血竭五錢上為末用木瓜一枚切破去子入乳香末在內以麻線纏定勿令透氣好酒六升煮酒盡取木瓜去皮研和泥更入熟蜜少許杵和為丸如桐子大每服五十丸病在上食後在下食前溫酒下羅木瓜虎骨丸治風寒濕合而成痹腳重不仁疼痛少力足下癮痛不能踏地腳膝筋拳不能屈伸及項背拘急手足無力耳內蟬鳴頭眩目運諸證腳氣行步艱難並皆治之木瓜麒麟竭研虎脛骨酒炙木香自然銅醋淬七次楓香脂龜板醋炙骨碎補去毛甜瓜子桂皮當歸沒藥各一兩乳香研半兩地龍去土安息香重湯酒煮入藥各二兩上件十五味除沒藥外為細末拌勻酒麵糊為丸如桐子大每服三十丸溫酒送下煎木瓜湯送下亦得漸加至五十丸空心食前服濟麒麟竭散治寒濕傳於經絡疼痛不可忍血竭南乳香沒藥白芍當歸各六錢水蛭杵碎炒令煙盡麝香各三錢虎脛骨酥炙黃五錢上八味為細末和勻每服三錢食前溫酒下丹趁痛散乳香沒藥桃仁紅花當歸地龍五靈脂牛膝酒浸羌活酒浸香附便浸生甘草如痰熱加酒芩酒柏痛風大法蒼朮南星川芎白芷當歸酒芩在上者加羌活威靈仙桂枝在下者加牛膝防己木通黃柏薄桂治痛風無味而薄者獨此能橫行手臂領南星蒼朮等至痛處上中下痛風方南星二兩臺芎一兩白芷五錢桃仁五錢桂枝三錢橫行手臂漢防己半兩下行龍膽草半兩下行蒼朮米泔浸一宿二兩黃柏二兩酒炒紅花一錢半酒洗神麯一兩炒羌活三錢通身走骨節威靈仙二錢去蘆上下行上為末麵糊丸食前服一百丸世茯苓丸治臂痛如神方見補遺控涎丹治肩背臂痛如神方見行痹控涎丹加去油木鱉子一兩桂五錢治臂痛每服二十丸加至三十丸妙丹治臂痛半夏一錢陳皮半錢茯苓五分蒼朮二錢威靈仙三分酒芩一錢白朮一錢南星一錢香附一錢甘草少許世治臂痛紅花炒神麯炒黃俱為末調服之薑黃散治臂痛非風非痰薑黃四兩甘草羌活各一兩白朮二兩腰以下痛者加海桐皮當歸芍藥垣臂痛有六道經絡究其痛在何經絡之間以行本經藥行其氣血血氣通則愈矣若表上諸疼痛便下之則不可當詳細辨之上東垣云臂痛有六道經絡以行本經藥行其氣血者蓋以兩手伸直其臂貼身垂下大指居前小指居後而定之而其臂臑之前廉痛者屬陽明經以升麻白芷乾葛行之後廉痛者屬太陽經以藁本羌活行之外廉痛者屬少陽以柴胡行之內廉痛者屬厥陰以柴胡青皮行之內前廉痛者屬太陰以升麻白芷蔥白行之內後廉痛者屬少陰以細辛獨活行之並用針灸法視其何經而取之也足痛新病以痛風法治之久病非腳氣以鶴膝風治之各自有門痛風多屬血虛然後寒熱得以侵之治法並見血熱血虛條丹張子元氣血虛有痰小便白濁陰火間起痛風時作人參一兩白朮二兩熟地二兩川黃柏炒各二兩山藥海石好者一兩炒鎖陽乾薑煨半兩南星一兩敗龜板二兩炙上粥為丸如梧子大淡鹽湯下痛風有痰帶熱先以舟車丸或導水丸神芎丸下之後以趁痛散調血如痰熱趁痛散加酒芩酒柏治痛風方糯米一盞黃躑躅根一把黑豆半盞上件用酒水各一碗煎半乾徐徐服之大吐大瀉一服住便能行動子和一男子六十餘病腰尻脊胯皆痛數歲不愈晝靜夜躁大痛往來屢求自盡天旦則定夕則痛作必令人手槌擊至五更雞鳴則漸減向曙則痛止戴人診其脈兩手皆沉滑堅勁有力如張弓弦謂之曰病雖瘦難任然腰尻脊胯皆痛者必大便堅燥其左右曰有五七日或八九日見燥屎一兩塊如彈丸結硬不可言渾身燥癢皮膚皺揭枯澀如麩片戴人既得病之虛實陰用大承氣以薑棗前之加牽牛頭末二錢不敢言是瀉劑蓋病者聞暖則悅聞寒則懼說補則從說瀉則逆此弊非一日也而況一齊眾楚於是藥煎成使稍熱咽之從少至多累至三日天且晚臟腑下泄四五行約半盆以燈視之皆燥屎硬塊及瘀血雜臟腑穢不可近須臾痛減九分昏睡鼻息調如常人睡至明日始覺飢而索粥溫涼與之又困睡一二日其痛盡去次令飲食調養日服導飲丸甘露散滑利便溺之藥四十餘日及復常仲明之妻每遇冬寒兩手熱痛戴人曰四肢諸陽之本也當時散越而不痛及乎秋冬收斂則痛以三花神祐丸大下之熱遂去運氣痹有二一曰濕經云太陰司天濕淫所勝病胕腫骨痛陰痹陰痹者按之不得治以苦熱是也二曰燥經曰陽明所至為尻陰股膝髀腨胻足痛又云歲金太過燥氣流行甚則尻陰股膝髀腨胻足皆痛是也內經刺灸諸痛法先明經脈次別淺深蓋經脈者為手足十二經脈也手前廉痛屬陰明經云手陽明脈所生病者肩前臑痛大指次指痛不用後廉痛屬太陽經云手太陽脈是動則病肩似拔臑似折所生病者肩臑肘臂外後廉痛外廉痛取少陽經云手少陽脈所生病者耳後肩臑肘臂外皆痛小指次指不用又云邪客手少陽之絡令人臂外痛手不及頭刺手中指次指爪甲上去端如韭葉各一痏左取右右取左內廉痛取厥陰經云手厥陰脈是動則病手心熱肘臂攣急腋腫內前廉痛屬太陰經云手太陰脈所生病者臑臂內前廉厥掌中熱內後廉痛屬少陰經云手少陰所生病者臑臂內後廉痛厥掌中熱痛足前廉痛屬陽明經云足陽明脈所生病者膝臏腫痛循膺乳氣街股伏兔骭外廉足跗上皆痛中指不用後廉痛屬太陽經云足太陽脈是動則病頭痛目似脫項似拔脊痛腰似折髀不可以曲膕如結腨如裂是謂踝厥所生病者項背腰尻膕腨腳背痛小指不用外廉痛屬少陽經云足少陽所生病者胸脅肋髀膝外至脛絕骨外踝前及諸節皆痛小指次指不用又云足髀不可舉側而取之在樞閤中以員利針大針不可刺又云邪客於足少陽之絡令人留於樞中痛髀不可舉刺樞中以毫針寒則久留針以月死生為數立已內廉痛屬太陰經云足太陰脈所生病者股膝內腫厥足大指不用內後廉痛屬少陰經云足少陰脈所生病者脊股內後廉痛足下熱而痛內前廉痛屬厥陰經云足厥陰脈是動則病腰痛不可以俯仰此十二經手足脈痛皆視虛實寒熱陷下而施補瀉疾留灸之法也以上全文並見針灸門十二經條盛則瀉之虛則補之熱則疾之寒則留之陷下則灸之也淺深者謂皮脈內筋骨之淺深也病在皮調之皮蓋取血絡也病在脈調之脈即取前手足十二經之血脈也病在肉調之分肉內經云病在肌膚肌膚盡痛名曰肌痹傷於寒濕刺大分小分多髮針而深之以為熱故無傷筋骨傷筋骨癰發若變諸分盡熱病已止病在筋調之筋經云病在筋筋攣節痛不可以行名曰筋痹刺筋上為故刺分肉間不可中骨也病在骨調之骨經云病在骨骨重不可舉骨髓痠痛寒氣至骨名曰骨痹深者刺無傷脈肉為故其道大分小分骨熱病已止又云邪在腎則病骨痛陰痹陰痹者按之不得取之湧泉崑崙有血者盡取之又云骨痹舉節不用而痛汗注煩心取三陽之經補之一作三陰此皮脈肉筋骨之淺深隨其處取之也又久痹不去身者視其血絡盡出其血痛痹久而入臟腑為病刺法見諸痹條玉渾身疼痛但於痛處針不拘經穴須避筋骨穴名天應穴撮臂膊疼痛肩髃手三里外關摘臂膊疼痛並麻痹肩髃肩井曲池集臂膊麻痹疼痛肩髃曲池手上廉合谷不應再取肩井列缺玉臂痛連腕液門沿皮向後透陽池瀉中渚沿皮透腕骨瀉撮臂內廉痛經渠一分忌灸靈道一分臥針向前三分少海五分東臂酸攣肘窌竅陰尺澤前谷後谿甲手臂不得上頭尺澤主之臂不可舉頭項痛咽腫不可咽前谷主之肘臂腕中痛頸腫不可以顧頭項急痛眩淫濼肩胛小指痛前谷主之肘痛不能自帶衣起頭眩頷痛面黑惡風肩痛不可顧關衝主之肘痛引肩不可屈伸寒熱頸項肩背痛痿痹不仁天井主之千金云肩肉麻木肘中濯濯臂內廉痛不可及頭外關主之肘痛尺澤主之撮腕痛陽谿曲池玉腕無力並痛腕骨橫針入三分痛則瀉無力則補曲池補瀉同上撮五指拘攣三間一分先瀉後補炙之前谷一分瀉之灸五指皆痛陽池外關合谷胯痛腿支風環跳在髀樞中側臥伸下足屈上足方可針可入三寸半補少瀉多留八吸居窌一寸二分留八吸瀉之委中出血標幽胯痛蹶足環跳懸鐘摘英作丘墟針五分留三呼灸三壯集胯痛腿支風不能轉側舉動艱難環跳三寸半灸七七壯風市灸二七壯居窌三寸半灸五七壯委中崑崙三里陽陵泉不已取下穴五樞陽輔腰腳痛委中崑崙人中桑側腳風絕骨太衝東脾樞痛足脛寒熱足外廉皮骨痛臨泣一分足三陰寸半陽輔甲髀樞中痛不可舉以毫針寒留之以月死生為痏數一作息數立已長針亦可腰脅相引痛急痹筋瘈脛痛不可屈伸痹不仁環跳主之東髀筋急脛痛縱緩痿痹腨疼膝冷外廉不可屈伸濕痹流腫風市中瀆陽關懸鐘腿痛陽陵泉三里伏兔陰市腿膝拘攣痛引脅或青或焦或黧或枯如腐木狀風市灸陽陵泉曲泉崑崙腿膝外廉痛股腫胻酸轉痿痹或膝脛熱不能行動俠谿五分髀關光明各一寸髀痹引膝股外廉急痛脛酸搖動有聲諸節酸不能行陰陵泉絕骨中封甲膝外廉痛熱病汗不出目外眥赤痛頭眩兩額痛逆寒泣出耳鳴多汗目癢胸中痛不可反側痛無常處俠谿主之膝外廉痛不可屈伸脛痹不仁陽關主之髀痹引膝股外廉痛不仁筋急陽陵泉主之膝內廉痛引髕不可屈伸連腹引咽喉痛膝關主之東腿膝內廉痛引髕不可屈伸連腹引咽喉痛太衝五分中封膝關脛酸寒足下熱不能久立濕痹不仁中都衝陽承山承筋脛寒四肢重少氣難言不得臥至陽三陰交甲痹脛重足胕不收跟痛巨虛不廉主之脛痛足緩失履濕痹足下熱不能久立條口主之脛苕苕苦痹膝不能屈伸不可以行梁丘主之玉草鞋風崑崙瀉留六呼太谿瀉留六呼申脈五分補少瀉多留二吸忌灸撮草鞋風足腕痛崑崙透太谿丘墟商丘各寸半瀉灸集又法崑崙丘墟商丘照海不已取後穴太衝解谿足腕不用痿躄坐不起髀腳痛光明沿皮五分丘墟直五分腕緩不收覆足不任脛酸然谷浮白崑崙撮外踝紅腫痛申脈半寸瀉摘繞踝風曲池如繞外踝痛兼刺孫絡足少陽小指間三分如繞內踝痛兼刺大都三分如腕前廉痛刺行間六分玉腳背紅腫太衝丘墟衝陽彈針出血臨泣集又法太衝臨泣行間內庭不已取下穴崑崙丘墟撮大拇指本節前骨疼太衝彈針出血足五指盡痛不得踐地湧泉二分然谷一分甲風寒從足小指起脈痹上下帶胸脅痛無常處至陰主之足下熱痛不能久坐濕痹不能行三陰交主之骨痹煩滿商丘主之膚痛痿痹外丘主之寒氣在分肉間痛上下痹不仁中瀆主之著痹即麻木不仁靈衛氣不行則為麻木刺真節邪篇垣神效黃耆湯治渾身麻木不仁或左或右半身麻木或面或頭或手臂或腳腿麻木不仁並皆治之方見目門倒睫拳毛芍藥補氣湯治皮膚間有麻木此肺氣不行也潔古老人立效神方黃耆一兩白芍藥兩半橘皮一兩澤瀉半兩甘草一兩炙上㕮咀每服一兩水二大盞煎至一盞去渣溫服如肌肉麻必待瀉營氣而愈如濕熱相合四肢沉痛當瀉濕熱垣杜彥達患左手右腿麻木右手大指次指亦常麻木至腕已三四年矣諸醫不效求治明之明之曰麻者氣之虛也真氣弱不能流通填塞經絡四肢俱虛故生麻木不仁與一藥決三日夜遂制人參益氣湯服二日便覺手心熱手指中間如氣滿脹至三日後又覺兩手指中間皮肉如不敢觸者似癢痛滿脹之意指上瑟瑟不敢用手擦傍觸之明之云真氣遍至矣遂於兩手指甲傍各以三稜針一刺之微見血如黍黏許則痹自息矣又為處第二第三服之人參益氣湯治五六月間兩手麻木四肢困倦怠墮嗜臥乃濕熱傷元氣也以此藥治之黃耆八錢人參甘草各五錢生甘草炙二錢五味子一百二十粒升麻二錢柴胡二錢半芍藥三錢上㕮咀每服稱半兩水五盞煎一盞去渣空心溫服服後令少臥於麻痹處按摩屈伸少時午飯前又一服日二服第二次藥煎服如前黃耆八錢紅花五分陳皮一錢澤瀉第三次服藥黃耆六錢黃柏一錢二分橘皮三錢澤瀉升麻各二錢白芍五錢生甘草四錢五味一百粒生芩八錢炙甘草一分上㕮咀分作四服煎服如前法稍熱服秋涼去五味冬月去黃芩服之大效除濕補氣湯治左腿麻木沉重黃耆八錢甘草梢六錢五味一百二十粒升麻梢當歸柴胡梢澤瀉各二錢紅花二錢半陳皮一錢青皮四錢上㕮咀分作四服水三大盞煎至一盞去渣稍熱食前服仲血痹病從何得之師曰夫尊榮人骨弱肌膚盛重困疲勞汗出臥不時動搖加被微風遂得之形如風狀但以脈自微澀在寸口關上小緊宜針引陽氣令脈和緊去則愈血痹陰陽俱微寸口關上微尺中小緊外證身體不仁如風痹狀黃耆桂枝五物湯主之黃耆芍藥桂枝各三兩生薑六兩大棗十二枚上五味以水六升煮取二升溫服七合日三服一方有人參羅中書左丞張仲謙至元戊辰春正月在大都患風證半身麻木一醫欲下之未決可否命予決之予曰治風當通因通用汗之可也然此地此時雖交春令寒氣猶存汗之則虛其表必有惡風惡寒之證仲謙欲速瘥遂汗之身體輕快後數日再來邀予視之曰果如君言官事繁劇不敢出行當如之何予曰仲景云大法夏宜汗陽氣在外故也今時陽氣尚弱初出於地汗之則使衛氣亟奪衛氣失守不能肥實腠理表上無陽見風必大惡矣內經曰陽氣者衛外而為固也又云陽氣者若天與日失其所則折壽而不彰當此之時猶有過汗之戒況不當汗而汗之者乎遂與黃耆建中湯加白朮服之滋養脾胃生髮榮衛之氣又以溫粉撲其皮膚待春氣盛表氣漸實即愈矣內經曰化不可伐時不可違此之謂也黃耆建中湯方見治虛實條垣戊申春節使趙君年七旬病體熱麻股膝無力飲食有汗妄喜笑善飢痰涎不利舌強難言聲嗄不鳴身重如山求治於先師診得左手脈洪大而有力是邪熱客於經絡中也兩臂外有數瘢遂問其故對以燃香所致先師曰君之病皆此也夫人之十二經灌溉周身終而復始蓋手之三陽從手表上行於頭加之以火邪陽並於陽勢甚熾焉故邪熱毒行流散於周身而熱麻針經云胃中有熱則蟲動蟲動則胃緩胃緩則廉泉開故涎下熱傷元氣而沉重無力飲食入胃慓悍之氣不循常度故多汗心火盛則妄喜笑脾胃熱則消穀善飢肺金衰則聲嗄不鳴仲景云微數之脈慎不可灸焦枯傷筋血難復也君奉養以膏粱之味無故加以火毒熱傷於經絡而為此病明矣內經曰熱淫所勝治以苦寒佐以苦甘以甘瀉之以酸收之當以黃柏知母之苦寒為君以瀉火邪壯筋骨又腎欲堅急食苦以堅之黃耆生甘草之甘寒瀉熱補表五味子酸止汗補肺氣之不足以為臣灸甘草當歸之甘辛和血潤燥柴胡升麻之苦平行少陽陽明二經自地昇天以苦發之者也以為佐㕮咀同煎取清汁服之更繆刺四肢以瀉諸陽之本使十二經絡相接而泄火邪不旬日而良愈遂名其方曰清陽補氣湯蒼朮四錢藁本二錢升麻六錢柴胡三錢五味一錢半黃柏酒製三錢知母酒二錢陳皮二錢半甘草生二錢當歸二錢黃耆三錢上㕮咀每服五錢水一盞半煎至一盞去渣空心服之待少時復以美膳壓之補氣升陽和中湯李正臣夫人病診得六脈中俱弦洪緩相合按之無力弦在其上是風熱下陷入陰中陽道不行其症閉目則渾身麻木晝減而夜甚覺而目開則麻木漸退久則絕止常開其目此症不作懼其麻木不敢閤眼故不得眠身體皆重時有痰嗽覺胸中常是有痰而不利時煩燥氣短促而喘肌膚充盛飲食大小便如常惟畏麻木不敢閤眼為最苦觀其色脈形病相應而不逆內經曰陽盛瞑目而動輕陰病閉目而靜重又云諸脈皆屬於目靈樞曰開目則陽道行陽氣遍布周身閉目則陽道閉而不行如晝夜之分知其陽衰而陰旺也且麻木為風雖三尺之童皆以為然細校之則非如久坐而起亦有麻木假為繩繫縛之人釋之覺麻木作而不敢動久則自已以此驗之非有風邪乃氣不行也不須治風當補其肺中之氣則麻木自去矣知其經脈陰火乘其陽分火動於中為麻木也當兼去陰火則愈矣時痰嗽者秋涼在外濕在上作也當實其皮毛以濕劑身重脈緩者濕氣伏匿而作也時見燥作當升陽助氣益血微瀉陰火去濕通行經脈調其陰陽則已非五臟六腑之本有邪也補氣升陽和中湯主之黃耆五錢人參三錢甘草炙四錢陳皮二錢當歸身二錢生草根一錢去腎熱佛耳草四錢白芍三錢草豆蔻錢半益陽退寒黃柏一錢酒洗除濕瀉火白朮二錢蒼朮錢半除熱調中白茯苓一錢除濕導火澤瀉一錢用同上升麻一錢行陽明經柴胡一錢上㕮咀每服三錢水二大盞煎至一盞去渣稍熱服早飯後午飯前服之至八服而愈溫經除濕湯李夫人十月二十日得立冬嚴霜作時病四肢無力乃痿厥濕熱在下焦也醋心者是濁氣不降欲滿也閤眼麻木者陽道不行也開目不麻木者目開助陽道故陰寒之氣少退也頭旋眩運者風氣下陷於血分不伸越而作也羌活七分獨活三分柴胡二分黃耆二分人參一錢甘草炙一錢白芍三錢陳皮二錢白朮一錢蒼朮二錢澤瀉一錢豬苓一錢黃柏三分黃連木香各二分草豆蔻二分神麯二分麻黃去節三分升麻五分當歸三分上銼如麻豆大作二服水二大盞煎一盞去渣稍熱服食遠治肢節沉重疼痛無力之聖藥也濕氣風症不退眩運麻木不已除風濕羌活湯主之羌活一兩防風一兩柴胡五分藁本三分獨活五分蒼朮米泔制一錢茯苓二錢澤瀉二分豬苓去皮二分甘草炙五分黃耆一錢陳皮三分黃柏三分黃連去須一分升麻七分川芎三分去頭痛上㕮咀每服三錢或五錢水二盞煎至一盞去渣稍熱服量虛實施用如不盡證候依加減法用之丹手足木者是濕痰死血十指麻是胃中有濕痰死血子和郾城梁賈人年六十餘忽曉梳髮覺左手指麻斯須半臂麻又一臂麻斯須頭一半麻比及梳畢從脅至足皆麻大便二三日不通往問他醫皆云風或藥或針皆不解求治於戴人戴人曰左手三部脈皆伏比右手小三倍此枯澀痹也不可純歸之風亦有火燥相兼乃命一湧一泄一汗其麻立已後以辛涼之劑調之潤燥之劑濡之惟小指次指尚麻戴人云病根已去此餘烈也可針溪谷溪谷者骨空也一日晴和往針之用靈樞中雞足法向上臥針三進三引訖復卓針起向下臥針送入十指間皆然手熱如火其麻全愈濟茯苓湯治停蓄支飲手足麻痹多睡眩冒半夏湯泡赤茯苓去皮陳皮各一兩枳實去穰麩炒桔梗去蘆甘草炙半兩上㕮咀每服四錢水一盞姜七片煎服不拘時形數驚恐經絡不通病生於不仁治之以按摩醪藥全文見治法衍一法五靈脂二兩沒藥一兩乳香半兩川烏頭一兩半炮去皮同為末滴水丸如彈大每服一丸生薑溫酒下治風冷氣血閉手足身體疼痛冷麻風論云風氣行諸脈俞散於分肉之間與衛氣相干其道不利故使肌肉憤䐜而有瘍衛氣有所凝而不行故其肉有不仁也全文見諸風又氣穴論云肉分之間溪谷之會積寒留舍榮衛不居內為骨痹外為不仁命曰大寒留於溪谷此亦風寒相干衛氣故衛氣不行而不仁也全文見氣穴論仲黃耆五物湯方見本門衛氣條世傳惡風而麻木者烏附最驗本治風寒濕痹麻木不仁粥法川烏生為末上用白米作粥半碗藥末四錢同米用慢火熬熟稀薄不要稠下薑汁一茶匙許蜜三大匙攪勻空心啜之溫為佳如是濕更入薏苡仁二錢增米作一鍾服此粥治四肢不隨痛重不能舉者有此證預宜防之左氏曰風淫末疾謂四肢為四末也脾主四肢風邪客於肝則淫脾脾為肝克故疾在末穀氣引風濕之藥徑入脾經故四肢得安此湯劑極有力予常用此方以授人服者良驗治風濕四肢浮腫肌肉麻痹甚則手足無力筋脈緩急宜續斷丸川續斷萆薢當歸微炒附子防風天麻各一兩乳香沒藥各半兩川芎三分上為細末煉蜜丸如桐子大每服三四十丸酒或飲下空心食前服丹溪劉河間作原病式嘗以麻為澀同歸於燥門中真能識病機者也河前胡散治榮虛衛實肌肉不仁致令㿏重名曰肉苛前胡白芷細辛官桂白朮川芎各三兩附子炮吳茱萸湯炮炒當歸各二兩川椒去目並閉目者生用二兩上銼以茶酒三升拌勻同窨一宿以煉成豬脂膏五斤入藥煎候白芷黃紫色漉去渣成膏病在處摩之凡大癥瘕瘡痍皆治並去諸風瘡癢痛傷折墜損內經針灸著痹分新久新者湯熨灸之經云風寒客入皮膚或痹不仁腫痛可湯熨及火灸刺而去之是也全文治法見師傳條久者淬針刺之經云著痹不去久寒不已淬取三里是也四時氣篇垣陝帥郭巨濟偏枯二指著痹足不能伸迎先師治之以長針刺委中至深骨而不知痛出血一二升其色如墨又且繆刺之如是者六七次服藥三月病良愈甲膝寒痹不仁不屈伸髀關主之著痹不移膕肉破身熱脈偏絕是逆也全文見診生死著痹久而入臟腑者為逆刺法見諸痹素榮氣虛則不仁衛氣虛則不用榮衛俱虛則不仁且不用肉如故也人身與志不相有曰死逆調論脈診人被風不仁痿蹙其脈虛者生緊急疾者死鶴膝風即歷節之類羅蛜𧌴丸治鶴膝風腰膝風縮之疾蛜𧌴頭尾全者一條桃仁生白附阿魏桂心安息桃仁同研白芷各一兩乳香沒藥各三分以上九味用童便酒二升炒熟另處北漏蘆當歸白芍牛膝羌活地骨皮威靈仙各一兩為末上蜜為丸彈子大空心溫酒化下一丸胡楚望博士病風痓手足指節皆如桃李痛不可忍服之悉愈丹一丈人年七十歲患腳膝疼稍腫生地歸頭白芍蒼朮炒柏三錢川芎桂二錢木通一錢半分四帖煎取小盞食前熱服一男子年近三十滋味素厚性多焦怒秋間髀樞左右一點發痛延及膝晝靜夜劇痛劇惡寒口或渴或不渴或痞或不痞醫多用風藥兼用補血至次年春其膝漸腫痛愈甚食漸減形瘦贏至春末膝腫如桃不可屈伸診其脈左弦大頗實寸澀甚大率皆數知其小便必數而短遂作飲食痰積在太陽陽明治之炒柏一兩生甘草梢犀角屑蒼朮鹽炒各三錢川芎二錢陳皮牛膝木通芍藥各五錢遇暄熱加條芩三錢為細末每三錢重與生薑自然汁同研細多少以水蕩起煎令沸帶熱食前飲之一晝夜四次與至半月後數脈漸減痛漸輕去犀角加牛膝敗龜板半兩當歸半兩如前服又與半月腫漸減食漸進不惡寒唯腳膝痠軟未能久立久行去蒼朮黃芩時當夏熱加炒黃柏至一兩半予依本方內加牛膝春夏用莖葉冬用根杵取汁用之效尤速須斷酒肉濕曲胡椒當仲夏加生地黃半兩冬加茱萸桂枝世換骨丹通治風兼治鶴膝風防風牛膝當歸虎骨酥炙各一兩枸杞二兩半羌活獨活敗龜板秦艽萆薢松節蠶砂各一兩茄根二兩洗蒼朮四兩酒浸或酒糊丸皆可食腳筋急痛煮木瓜令爛研作粥漿樣用裹痛處冷即易一宿三五度熱裹便瘥煮木瓜時入一半酒煮之子和嶺北李文卿病兩膝臏屈伸有聲剝剝然或以為骨鳴戴人曰非也骨不戛焉能鳴此筋濕也濕則筋急緩者不鳴急者鳴也若用予之藥一湧一泄上下去其水則自無聲矣李文卿從其言既而果然素蹇膝伸不屈治其楗骨空論下同經云輔骨上橫骨下為楗王注云髀輔骨上橫骨下股外之中側立搖動取之筋動應手滑壽云楗骨之下為髀樞蓋楗即兩骨相接處為楗也坐而膝痛治其機經云挾髖為機王注云髖骨兩傍相接處滑壽云髖骨挾腰兩傍髖骨為機機後為臂立而暑解治其骸關經云膝解為骸關王注云暑熱也若膝痛起立而膝骨解中熱者治其骸關經云起而引膝骨解之中也滑壽云挾膝解中為臏膝痛痛及拇指治其膕經云輔上為膕王注云膕為膝解之後曲腳之中委中穴坐而膝痛如物隱者治其關經云膕上為關王注云關在膕上當楗之後背立按之動搖筋應手膝痛不可屈伸治其背內王注云大杼穴也連胻若折治陽明中俞髎王注云若膝痛不可屈伸連胻痛如折者則針陽明脈中俞髎三里穴也膝痛若別治巨陽少陰滎王注云若痛而膝如別離者則治足太陽滎通谷穴足少陰滎然谷穴也淫濼脛酸不能立久治少陽之維在外上五寸外上當作外踝上王注淫濼謂似痠痛而無力也外踝上五寸光明穴也右楗機骸關諸穴更參訂之靈膝中痛取犢鼻以員利針之發而間之針大如氂刺膝無疑雜病篇玉鶴膝風腫及腿痛髖骨在膝蓋骨上一寸梁丘穴兩傍各五分針入五分留一吸瀉之膝關在膝蓋骨下犢鼻內傍橫針透膝眼在犢鼻外傍禁灸留八呼瀉之集又法膝關委中三寸半但紫脈上出血為妙三里不已取下穴陽陵泉中脘豐隆通膝腫行間撮要陽陵泉橫透陰陵泉補生瀉成陰陵泉橫透陽陵泉補生瀉成膝關法見前玉龍下世腳拗痛委中出血桑腳膝痛筋急風池三間三陰交三里攣熱攣者經所謂肝氣熱則筋膜乾筋膜乾則筋急而攣全文見痿門又云因於濕首如裹濕熱不攘大筋緛短小筋弛長緛短為拘弛長為痿之類是也全文見陰陽丹溪云大筋緛短者熱傷血不能養故為拘攣小筋弛長者濕傷筋不能束骨故為痿弱丹王秀濕熱大作腳痛後手筋拘攣足乏力生地當歸川芎白朮各二錢蒼朮一錢半甘草炙三分木通煎湯下大補丸三十丸大補丸須炒暖心薏苡仁散治筋脈拘攣久風濕痹薏苡仁一升搗散以水二升取末數匙作粥空腹食之衍義云筋急拘攣有兩等素問大筋受熱熱則縮而短故攣急不伸則可用薏苡仁若素問言因寒筋急不可用也寒攣者經所謂寒多則筋攣骨痛者是也本同官歙丞張德操常言其內子昔患筋攣腳不得屈伸逾年動則令人拘持求醫於泗水楊吉老云此筋病宜服下三方一年而愈治筋極養血地黃丸春夏服之熟地一分蔓荊一分山茱萸五分黑狗脊炙地膚子白朮乾漆蠐螬炒天雄車前子各三分萆薢山芋即山藥澤瀉牛膝各一兩上細末煉蜜和杵丸如桐子大每服五十丸溫酒下空心食臥服治筋痹肢節束痛羚羊湯秋服之羚羊角肉桂附子獨活各一兩三錢半白芍防風芎藭各一兩上為粗末每服五大錢水一盞半生薑三片同煎至八分取清汁服日可二三服治寒冷濕痹留於筋脈縮不能轉側烏頭湯冬服之大烏頭細辛川椒甘草秦艽附子官桂白芍各七分乾薑白伏防風炙當歸各一兩獨活一兩三錢半上為粗末每服三錢水一盞半棗二枚同煎至八分去渣空心食前服千薏苡仁湯治筋攣不可屈伸白蘞薏苡仁芍藥桂心酸棗仁乾薑牛膝甘草各一兩附子三枚上九味㕮咀以醇酒三斗漬一宿微火煎三沸每服一升日三扶杖起行不耐酒服五合垣活血通經湯靈壽縣董監軍癸卯年十二月間大雪初霽時因事到真定忽覺有風氣暴僕診候得六脈俱弦甚按之洪實有力其症手攣急大便閉澀面赤熱此風寒始至加於身也四肢者脾也以風寒之邪傷人則搐急而攣痹乃風淫末疾而寒在外也內經云寒則筋攣正此謂也本人素多飲酒內有實熱乘於腸胃之間故大便閉澀而面赤熱內則手足陽明受邪外則足太陰脾經受風寒之邪用桂枝甘草以卻其寒邪而緩其急搐用黃柏之苦寒滑以瀉實而潤澡急救腎水用升麻葛根以升陽氣行手足陽明之經不令遏絕更以桂枝辛熱入手陽明之經為引用潤燥復以芍藥甘草專補脾氣使不受風寒之邪而退木邪專益肺金也加人參以補元氣為之輔佐加當歸身去裡急而和血潤燥名之曰活血通經湯升麻一錢葛根一錢桂枝二錢當歸一錢人參一錢芍藥五分甘草炙一錢酒柏二錢上銼如麻豆大都作一服水二盞煎至一盞去渣熱服令暖房中近火摩搓其手乃愈虛攣者經所謂虛邪搏於筋則為筋攣又云脈弗榮則筋急全文見診生死門又仲景云血虛則筋急此皆血脈弗榮於筋而筋成攣故丹溪治攣用四物加減本事治筋急極用養血地黃丸蓋本乎此也靈黃帝曰人有八虛各何以候岐伯曰以候五臟黃帝曰候之奈何岐伯曰心肺有邪其氣留於兩髀腎有邪其氣留於兩膕凡此八虛者皆機關之室真氣之所遇血脈之所遊氣血固邪不住留住留則傷經絡骨節機關不得屈伸故病攣也丹一村夫背傴僂而足攣已成廢人予診其脈兩手皆沉弦而澀遂以戴人煨腎散與之上吐下瀉過月餘久吐瀉交作如此凡三帖然後平復煨腎散用甘遂末三錢獖豬腰子細批破少鹽椒淹透滲藥末在內荷葉包裹燒熱溫酒嚼服之攣皆屬肝經云肝主身之筋故也又云陽明之復甚則入肝驚駭筋攣又云脾移寒於肝癰腫筋攣心除一切風濕痹四肢拘攣蒼耳子三兩搗末水一升半煎取七合去渣呷食酒煮木瓜粥裹筋急痛處佳方見鶴膝風門內經針灸法取攣有筋攣脈攣之異取筋攣者經云病在筋筋攣節痛不可以行名曰筋痹刺筋上為故刺分肉間不可中骨也病起筋筋炅病已止者是也全文見痛痹門取筋脈者經云手厥陰脈是動則病手心熱肘腕攣急腋腫辨虛實寒熱陷下取之是取筋脈之攣也全文見針灸門十二經條又曰少陽之別名曰外關去腕二寸則肘攣取之所別也全文見針灸門十五絡條又曰邪客於足太陽之絡令人拘攣背急引脅而痛刺之從項始數脊椎俠脊疾按之應手如痛刺之傍三痏全文見針灸門繆刺絡條是取絡脈之攣也千灸筋急不能行內踝筋急灸內踝四十壯外踝筋急灸外踝三十壯立愈玉兩肘俱攣曲池九分先瀉後補補四呼瀉九吸尺澤手如弓方可針五分先補後瀉標筋攣骨痛魂門補張仲文禪山灸法治腳筋攣急見腰痛門兩腳內外曲交尖撮膝曲筋急不能舒曲泉一寸半怪膝筋拘攣不開兩膝外曲交尖灸二十七壯即委陽穴甲兩手攣不收伸及掖偏枯不仁手瘈偏小筋急大陵主之掖拘攣暴脈急引脅而痛內引心肺譩譆主之一身盡痛一身盡痛其病暴似傷寒屬濕痹並見傷寒太陽症門其留連難已者於此求之寒而一身痛苦甘草附子湯熱者拈痛湯甘草附子湯方見傷寒身疼門垣拈痛湯治濕熱相搏肩背沉重疼痛上熱胸膈不利及遍身疼痛羌活半兩人參二錢甘草五錢防風三錢去頭苦參三錢酒炒升麻二錢去蘆葛根二錢知母二錢酒炒黃芩二錢酒炒澤瀉三錢豬苓三錢茵陳五錢酒白朮錢半當歸三錢酒蒼朮二錢上為細末每服一兩水二盞煎至一盞食遠或空心日一服丹婦人患身痛食少脈澀略沉重取弦實此氣滯也白朮二錢青皮黃芩芍藥木通陳皮半兩神麯炒一兩桂二錢甘草五分蘇梗二分上分十帖煎垣麻黃桂枝升麻湯李夫人患渾身麻木睡覺則少減開目久則全已閉目則麻復至此症用藥已全去又因家事不和心中煩惱遍身骨節疼身體沉重飲食減少腹中氣不轉運麻黃不去節五分桂枝三分升麻人參五分白朮三分甘草炙三分黃耆五分半夏二分生薑一分陳皮二分厚朴二分木香一分茯苓三分澤瀉二分黃柏二分附子二分草豆蔻二分上㕮咀水二大盞煎至一盞去渣稍熱食遠服本治遍身皆痛如勞證者若傷寒身體痛者不可服但少年虛損冷憊老人諸疾並皆治之黃耆人參甘草附子炮羌活木香知母芍藥川芎前胡枳殼桔梗白朮當歸茯苓半夏制以上各五錢柴胡鱉甲醋炙各一兩桂心酸棗仁三分杏仁半兩炒上為末每服二錢水一盞姜三片棗二個烏梅三枚蔥白三寸同煎至七分空心溫服脾之大絡名曰大包出淵腋下三寸實則身盡痛此脈若羅絡之血皆取之脾之大絡脈也全文見針灸潔百節痛實無所知絕骨三稜針出血產後身痛云趁痛散治產後氣弱血滯遍身疼痛及身熱頭疼牛膝當歸桂心白朮黃耆獨活生薑各半兩甘草薤白各三錢半上㕮咀每服半兩水三盞煎至一盞半去渣食前服五積散加酒煎治感寒頭痛身疼方見傷寒門恐與四物各半服之穩當加桃仁煎治腰痛逐敗血去風濕大治產後遍身青腫疼痛及眾疾牛膝大麥糵等分上為細末以新瓦罐子中填一重麥糵一重牛膝如此填滿用鹽泥固濟火煅過赤放冷研為散但是產後諸疾熱酒調二錢下風痹雜合病風痹風與痹雜合病也蓋風痹痿厥四者多雜合如風痹風痿痿厥痹厥風厥之類是也風痿風痱病今集中風門痿厥痹厥即腳氣病今集入厥門風厥痿痹散見各門風痹今入痹門焉靈樞病在陽者命曰風壽夭剛柔篇東垣云此病在陽因十二經各受風邪以高言之氣分也故身半以上風之中也用針當引而去之也又曰散而去之用藥以辛溫發散通因通用又熱因熱用是也靈樞病在陰者命曰痹東垣云身半以下濕之中也命曰痹飲食自倍腸胃乃傷得之勞倦脾胃氣虛而下陷運氣榮氣不得升浮經營心肺也陰陽俱病命曰風痹言陰陽氣血俱病也尺膚澀者風痹也全文見診法靈樞云風痹淫濼病不可已足如履冰時如入湯中股脛淫濼煩心頭痛傷腎脾時嘔時悗眩已汗出傷心久則目眩傷肝悲以善恐短氣不樂傷肺不出三年死也一云三日死
