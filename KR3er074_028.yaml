body:
  text: 卷之二十八腎膀胱部腰痛垣六元正紀論云太陽所至為腰痛又云巨陽即太陽也虛則頭項腰背痛足太陽膀胱之脈所過還出別下項循肩膊內挾脊抵腰中故為病項如拔挾脊痛腰似折髀不可以曲是經氣虛則邪客之痛病生矣夫邪者是風熱濕燥寒皆能為病大抵寒濕多而風熱少然有房室勞傷腎虛腰痛者是陽氣虛弱不能運動故也經云腰者腎之府轉搖不能腎將敗矣宜腎氣丸茴香丸之類以補陽之不足也膏粱之人久服湯藥醉以入房損其真氣則腎氣熱腎氣熱則腰脊痛而不能舉久則髓減骨枯發為骨痿宜六味地黃丸滋腎丸封髓丹之類以補陰之不足也靈樞云腰痛上寒取足太陰陽明上熱取足厥陰不可俯仰取足少陽蓋足之三陽從頭走足足之三陰從足走腹經所過處皆能為痛治之者當審其何經所過分野循其空穴而刺之審何寒熱而藥之假令足太陽令人腰痛引項脊尻背如重狀刺其郤中太陽二經出血余皆仿此彼執一方治諸腰痛者固不通矣丹如久腰痛必用官桂以開之方止腹脅痛亦然保煨腎丸治肝腎損及脾損穀不化腰痛不起者神效方見治虛實法無立安丸治五種腰痛補腎又治腳氣破故紙續斷乾木瓜牛膝酒浸杜仲去皮銼薑汁炒絲斷各一兩萆薢二兩上為細末蜜丸如桐子大每服五十丸鹽湯或酒任下本又方治五種腰痛狗脊萆薢菟絲子各一兩酒浸三日焙乾別研上為細末煉蜜丸如桐子大每服三十丸用萆薢二兩酒浸三日取酒服藥空心食前無杜仲酒治風冷傷腎腰痛不能屈伸並補腎虛取杜仲一斤切薑汁製炒斷絲用好酒二升浸十日每服三四合日四五服一方為末溫酒調一錢空心服驗治腰痛用破故紙炒為末溫酒下三錢上杜仲牛膝萆薢破故紙治腰例本治腎虛腰痛不能轉側麋茸丸麋茸一兩鹿茸亦可菟絲子取末一兩舶上茴香半兩上為末以羊腎二對用酒浸煮爛去膜研如泥和丸如桐子大陰乾如羊腎少入酒糊佐之每服三五十丸溫酒或鹽湯下戊戌年八月淮南大水城下浸灌者連月豫忽臟腑不調腹中如水吼數日調治得愈自此腰痛不可屈折雖洗面亦相妨服遍藥不效如是凡三月豫後思之此必水氣陰盛腎經感此而得乃灸腎腧三七壯服此藥瘥千治腰痛鹿角去上皮取白者熬令黃為末酒服方寸匕日三特禁生魚余不禁新者良陳不佳角心中黃處亦不中服大神良鹿角去惡血治腰痛羊腎為末酒服二方寸匕日三服本草云羊腎補腎氣益精髓上麋茸鹿茸羊腎治腰痛例丹補腎丸治腎虛腰痛纍效烏藥葉本草云烏藥嫩葉補中益氣側柏葉上酒蒸曬乾為末粥為丸如桐子大經治腎虛腳無力生栗子入袋盛懸干每日平明吃十餘顆次吃豬腎粥瘥丹腰痛脈大者腎虛杜仲龜板黃柏知母枸杞五味各等分上為末豬脊髓為丸補陰丸治陰虛性急腰痛者龜板黃柏知母側柏葉上為末地黃膏為丸腰腿濕痛龜板酒炙五錢黃柏酒炒四錢青皮三錢生甘草一錢五分上為末研姜一大片次入前藥末一錢研細以蒼耳汁蕩起煎令沸服之腰腿疼痛敗龜板酒炙二兩黃柏酒炒蒼朮蒼耳各一兩扁柏半兩威靈仙酒浸二兩上為丸以黑豆汁兼四物湯加陳皮生甘草生薑一片煎吞下又方龜板一兩半黃柏炒白芍各一兩陳皮威靈仙知母蒼朮蒼耳各半兩上為末蜜丸服濕熱腰痛大便泄龜板一兩炙楮皮炒蒼朮滑石各半兩芍藥酒炒香附各四錢上為末粥丸如內傷白朮山楂湯下垣蒼朮湯治濕熱腰腿疼痛蒼朮三錢去濕止痛柴胡二錢行經防風一錢黃柏一錢始得之時寒久不愈寒化為熱除濕止痛上作一服水煎空心服上龜板黃柏知母治腰痛例無牛膝酒治腎傷風毒攻刺腰痛不可忍者牛膝川芎羌活地骨皮五加皮薏苡仁甘草各一兩海桐皮二兩生地十兩上銼以絹袋裹入好酒二斗浸二七日夏三五宿每服一杯日三四杯長令酒氣不絶為佳一法入杜仲一兩炒絲斷垣六味地黃丸治腎虛腰痛方見治法丹婦人患腰痛此血分有熱白芍五錢生地四錢當歸尾三錢黃柏一錢半炒白朮二錢黃芩一錢半木通一錢甘草梢五分川芎一錢上分四帖煎取食前熱服上地黃治腰痛例千治腰痛萆薢杜仲枸杞根各半斤上三味㕮咀好酒三斗漬之納罐內密封投於銅器中煮一日服之無節取醉為度丹義一侄婦瘧疾初安因衝風又發腰痛白濁已與參朮檳榔半夏等補方又教以煅牡蠣一錢木通五分炒柏三分粗末入前方同煎痢後腰痛兩腳無力陳皮半夏白芍一錢茯苓蒼朮當歸黃芩酒五分白朮二錢甘草炙一錢上作一服姜三片食前服婦人月經行後腰痛為虛詳氣血虛於補氣血藥中加杜仲側柏葉等藥仲虛勞腰痛少腹拘急小便不利八味腎氣散主之方見治虛實法世治腰痛用威靈仙丹溪云威靈仙治痛之要藥為細末每服二錢豬腰子一隻批開摻藥在內濕紙煨熟五更細嚼熱酒下千金方用威靈仙末一錢溫酒調下逐日以微利為度病人稍虛禁用本治腰腿痛氣滯藥棋子牽牛不以多少用新瓦火燒赤便以牽牛頓在瓦上自然一半熟一半生不得撥動取頭末一兩入硫黃一分同研勻分三服每用白麵一匙水和捏作棋子五更初以水一盞煮熟連湯送下痛住即止未住隔日再作豫嘗有此疾每發只一服痛止世治腰痛不可忍用牽牛不以多少研取頭末去滓不用取大蒜每一瓣擘開入巴豆肉一粒在內用濕紙裹定煨令蒜熟去巴豆將蒜研細和牽牛為丸如桐子大每服五丸醋湯茶空心食前量虛實服本治五般腰痛胡桃肉五個去皮研為膏五靈脂黑牽牛炒白牽牛炒各三錢狗脊半兩微炒萆薢三錢炒沒藥三十文巴豆五粒用濕紙裹煨取肉去油上研為末將前胡桃膏醋糊丸如桐子大每服十五丸風腰疼豆淋無灰酒下氣腰疼煨蔥白酒下血腰疼當歸酒下打撲腰疼蘇木酒下子和趙進道病腰疼一年不愈診其兩手脈沉重有力以通經散下五七行次以杜仲去粗皮細切炒斷絲為末每服三錢豬腰子一枚薄批五七片先以椒鹽淹去腥水摻藥在內裹以荷葉以濕紙數重封文武火燒熟臨臥細嚼溫酒送下每旦以無比山藥丸一服數日而愈通經散用陳皮當歸甘遂為末每三錢臨臥溫酒調下羅獨活寄生湯治腎氣虛弱冷臥濕地腰腿拘急筋骨攣病或當風取涼過度風邪流入腳膝為偏枯冷痹緩弱疼痛或腰痛牽引腳重行步艱難獨活桑寄生杜仲牛膝細辛秦艽茯苓桂心防風芎藭人參甘草以上各一兩半當歸芍藥乾地黃各二兩一方用續斷三兩上為粗末每服三錢水二大盞生薑五片同煎至七分食前服海防風湯治傷寒後腰痛或皮肉𤸷痹腿膝疼痛行履艱難不可俯仰防風一兩麻黃去節桂枝去皮杜仲炙各七錢半牛膝五加皮丹參各半兩芎藭附子炮去皮臍一兩當歸芍藥羌活續斷各一兩上㕮咀每服五錢水一盞半姜二錢同煎食前服垣川芎肉桂湯丁未年冬曹通甫自河東來有役人小翟宿於寒濕之地腰痛不能轉側兩脅搐急作痛月餘不愈腰痛論中所說皆為足太陽足少陰血絡中有凝血作痛間有一二症屬少陽膽經外絡脈病皆宜去血絡之凝乃愈其內經有云冬三月禁不得針只宜服藥通其經絡破其血絡中敗血以此方主之羌活一錢半柴胡一錢獨活五分肉桂蒼朮各一錢防風漢防己各三分桃仁五個去皮另研如泥歸梢甘草炙各一錢炒曲五分川芎一錢上㕮咀水酒煎去渣食遠熱服無小續命湯加炒去皮桃仁治風腰痛最妙方見中風五積散加桃仁治寒濕腰痛最效方見傷寒發熱千杜仲酒治腎脈逆小於寸口膀胱虛寒腰痛胸中動通四時用之方杜仲地黃各四兩萆薢羌活天雄蜀椒芎藭桂心防風秦艽烏頭各三兩五加皮石斛各五兩細辛三兩栝蔞根地骨皮續斷炒桔梗甘草各一兩上十九味㕮咀以酒四斗漬四宿初服五合加至七八合日再本治久患腰痛石甜瓜一兩出蜀中附子炮五錢冬瓜皮冬瓜仁檳榔沒藥烏藥各五錢上為細末每服四錢溫酒調下臨臥時服服日只午後申時先可晚食申時後不可食專候臨臥服平日膏粱厚味之人腰痛皆是濕熱陰虛治見前陰虛垣如身重腰沉沉然乃經中有濕熱也於羌活勝濕湯中加黃柏一錢附子五分蒼朮二錢羌活勝濕湯方見腎條獨活湯治因勞役得腰痛如折沉重如山羌活二錢防風獨活肉桂各三錢甘草炙二錢歸梢五錢桃仁五十連翹五錢漢防己黃柏酒各一兩澤瀉大黃煨各三錢上㕮咀每服五錢如麻頭大酒半盞水一盞去渣熱服立愈羌活湯治腰膝無力沉重羌活三錢防風一錢五分甘草生熟各五分草豆蔻黃柏葛根各五分砂仁一錢陳皮六分知母二錢五分黃耆二錢蒼朮升麻獨活柴胡各一錢上為粗末作二服水二盞煎至一盞去渣空心熱服仲腎著湯治身重腰冷如冰痛重如帶千錢方見身重丹脈澀者瘀血用補陰丸中加桃仁紅花補陰丸方見脈大條世橘核散治腰痛諸般滯氣山楂子一兩橘核五錢破故紙二兩乳香五錢玄胡索菴䕡沒藥五加皮紅曲各一兩上為末酒調下云如神湯治男子婦人腰痛玄胡索當歸桂心杜仲各等分上為末溫酒調下三錢甚者不過數服無桃仁酒治腎虛風勞所傷毒腫掣痛牽引小腹連腰痛用桃仁麩皮炒去皮尖研細每服一錢匕熱酒調下有汗即愈垣地龍湯治腰脊痛或打撲傷損從高墜下惡血在太陽經中令人腰脊痛或脛腨臂膊中痛不可忍鼻壅塞不通中桂四分桃仁六個羌活二錢獨活甘草黃柏各一錢麻黃五分地龍四分蘇木六分歸梢一錢上為粗末每服五錢水二盞煎至一盞去滓食遠熱服無橘核酒治打撲腰痛惡血瘀蓄痛不可忍用橘核炒去皮研細每服二錢匕酒調服或用豬腰子一個去筋膜破開入藥同蔥白茴香鹽濕紙裹煨熟細嚼溫酒下熟大黃湯治墜墮閃挫腰痛不能屈伸大黃切如指大生薑切各半兩上同炒令焦黃以水一盞浸一宿五更去渣服天明取下如雞肝者即惡物也丹徐質夫年六十因墜馬腰痛不可轉側六脈散大重取則弦小而長稍堅豫以為惡血雖有未可驅逐且以補接為先遂令煎蘇木人參黃耆川芎當歸陳皮甘草服至半月後漸散大飲食亦進遂與前藥調下自然銅等藥服一月而安治老人因攧撲腰痛蘇木一錢人參五分歸頭身一錢黃耆五分陳皮一錢木通五分木香五分上研桃仁九枚下接骨藥食積腰腿痛龜板酒炙柏葉酒製香附五錢辣芥子凌霄花一錢半上酒糊丸煎四物湯加陳皮甘草一分吞下痰積腰痛二陳湯加南星食積痰積如脈有力者宜下之山挫氣腰痛香茶內滴入菜油數點頓服素北風生於冬病在腎腧在腰金匱真言論少陰所謂腰痛者少陰者腎也十月萬物陽氣皆傷故腰痛也太陽所謂腰脽痛者正月太陽寅寅太陽也正月陽氣出在上而陰氣盛陽未得自次故腫腰脽痛也脈解篇腰痛皆屬腎虛治法並見前陰陽虛條垣脊痛項強腰似折項似拔沖頭痛乃足太陽經不行也羌活勝濕湯主之羌活獨活各一錢藁本防風各一錢蔓荊子三分川芎二分甘草炙五分上件㕮咀都作一服水二盞煎去一半去渣溫服食後運氣腰痛有五一曰寒經云水鬱之發民病腰脽痛大關節不利屈伸不便又云太陽所至為腰痛又云太陽之復腰脽反痛屈伸不便治以熱劑是也二曰濕經云太陰司天濕氣下臨腎氣上從當其時反腰脽痛動轉不便又曰太陽在泉濕淫所勝病腰似折亦治以熱劑是也三曰寒濕雜合經云太陰司天之政終之氣寒大舉濕大化病關節禁固腰脽痛治以燥熱是也四曰燥經云陽明司天燥淫所勝病腰痛治以苦溫是也五曰燥熱風寒雜合經云少陰司天之政水火寒熱持於氣交民病腰痛初之氣寒乃始陽氣鬱民反周密關節禁固腰脽痛治以濕熱多寒清少也丹摩腰丹治老人腰痛婦人白帶附子尖烏頭尖南星各二錢半硃砂樟腦丁香各一錢半乾薑一錢雄黃一錢半麝香五粒大者小則加之上為末蜜丸如龍眼大每一丸用生薑汁化開如厚粥火上烘熱放掌上摩腰中候藥盡貼腰上即烘綿衣縛定腰熱如火間二日用一丸世皂角膏治諸腰腳疼痛用好酒二大碗皂角一斤去皮弦搗碎熬至一半濾去渣再用前汁入銀石器內熬為膏子隨痛處貼之聖治風腳腰冷痹疼痛川烏頭三分去皮臍生為末好醋調塗於布帛上貼之痛即止山腰疼用牛皮膠化開生薑汁打勻貼痛處素足太陽脈令人腰痛引項脊尻背如重狀刺其郤中太陽正經出血春無見血見刺腰痛篇下同王注云郤中委中穴也腰背俠脊而痛至頭𠘧𠘧然目䀮䀮欲僵仆刺足太陽郤中出血𠘧音殊引頸之貌項背強也刺腰痛引項脊尻背三法此二法取足太陽出血也經云邪在腎腹脹腰痛大便難肩背頸項痛時眩取之湧泉崑崙視有血者悉取之此則足太陽少陰俱取血也又云足太陽之脈是動則病沖頭痛目似脫項似拔脊痛腰似折此則視太陽盛虛熱寒陷下刺施補瀉疾留灸以調之也足少陰令人腰痛痛引脊內廉刺少陰於內踝上二痏春無見血出血太多不可復也王注云復溜穴也刺腰痛引脊內廉此法出足少陰經血也經曰足少陰之別名曰大鐘當踝後繞踝別走太陽其病虛則腰痛取之所別也此補足少陰絡也少陽令人腰痛如以針刺其皮中循循然不可以俯仰不可以顧刺少陽成骨之端出血成骨在膝外廉之骨獨起者夏無見血王注云成骨謂膝外近下腳骨上端兩起骨相併陷間容指者是按此謂陽陵泉穴陽明令人腰痛不可以顧顧如有見者善悲刺陽明於胻前三痏上下和之出血秋無見血王注云三里穴也衡絡之脈令人腰痛不可以俯仰仰則恐僕得之舉重傷腰衡絡絶惡血歸之刺之在郤陽筋之間上郤數寸衡居為二痏出血王注謂郤陽之間衡居二痏為委陽殷門二穴者非也今詳委陽正在郤外廉橫故盡處是穴非上郤也殷門上郤一尺是穴非數寸也蓋郤陽筋者按郤內外廉各有一大筋上結於臀今謂外廉之大筋故曰陽筋也上郤數寸者謂上郤數寸於外廉大筋之兩間視其血絡盛者橫居為二痏出血刺腰痛不可俯仰四法上三法皆出血也經云肝足厥陰之脈是動則病腰痛不可以俯仰瘕疝少腹腫此則視虛實寒熱陷下施補瀉疾留灸以調之也腰痛引少腹控䏚不可以仰刺腰尻交者兩髁胂上以月生死為痏數髮針立已左取右右取左王注云此邪客於足太陰之絡也控通引也䏚謂季脅下之空軟處也腰尻交者謂髁下尻骨兩傍四骨空左右八穴俗呼此骨為八髎骨也此腰痛取腰髁下第四髎即下髎穴也足太陰厥陰少陽三脈左右交結於中故曰腰尻交者也兩髁胂謂兩髁骨下堅起肉也胂上非胂之上巔正當刺胂肉夾直處即脾上也何者胂之上巔別有中膂肉俞白環俞雖並主腰痛考其形經症不相應矣髁骨即腰脊兩傍起骨也狹脊兩傍腰髁之下各有胂肉隴起而斜趣於髁骨之後內承其髁故曰兩髁胂也下承髁胂肉左右兩胂各有四骨空故曰上髎次髎中髎下髎上髎當髁骨下陷者中餘三髎少斜下按之陷中是也四空悉主腰痛唯下髎文與經同即太陰厥陰少陽所結者也胂舒仁反髁若瓦反刺腰痛引少腹控䏚不可以仰取腰尻分間經文三出此其一也繆刺諭云腰痛引少腹控䏚不可以仰息刺腰尻之解兩胂之上是腰腧以月死生為痏數髮針立已左刺右右刺左又骨空論云腰痛不可以轉搖急引陰卵剌八髎與痛上八髎在腰尻分間此三節經文大同小異通一法也又足厥陰之脈是動則病腰痛不可以俯仰㿉疝少腹腫視盛虛熱寒陷下調之此則證同法異陽維之脈令人腰痛痛上怫然腫刺陽維之脈脈與太陽合腨下間去地一尺所林桂云承山穴也飛陽之脈令人腰痛痛上怫怫然甚則悲以恐刺飛陽之脈在內踝上五寸少陰之前與陰維之會築賓穴也築賓穴在內踝上腨肉分間是穴同陰之脈令人腰痛痛如小錘居其中怫然腫刺同陰之脈在外踝上絶骨之端為三痏王注云陽輔穴也解脈令人腰痛痛引肩目䀮䀮然時遺溲刺解脈在膝筋肉分間郤外廉之橫脈出血血變而止王注云膝外兩筋之間橫文之處胬肉高起則郤中之肉分也當取郤外廉有血絡橫見迢然紫黑而盛滿者乃刺之當見黑血必候其血色變赤乃止愚按膝外廉筋肉分間即委陽穴是也散脈令人腰痛而熱熱甚生煩腰下如有橫木居其中甚則遺溲刺散脈在膝前骨肉分間絡外廉束脈為三痏王注謂地機穴者非也既云膝前骨肉分間絡外廉束脈噹噹三里陽陵泉二穴上之骨上與膝分間是穴橫刺三痏也昌陽之脈令人腰痛痛引膺目䀮䀮然甚則反折舌卷不能言刺內筋為二痏在內踝上大筋前太陰後上踝二寸所王注云交信穴也在內踝上二寸少陰前太陰筋骨間陰蹺之郤也刺腰痛目䀮䀮有三此其一也若痛引肩遺溲者刺解脈在郤外廉筋肉分間委陽穴也若痛引項脊欲僵仆者刺足太陽委中出血也解脈令人腰痛如引帶常如折腰狀善恐刺解脈在郤中結絡如黍米刺之血射以黑見赤血而已王注云郤中即委中穴也會陰之脈令人腰痛痛上漯漯然汗出汗乾令人欲飲飲已欲走刺直陽之脈上三痏在蹺上郤下五寸橫居視其盛者出血王注云承筋穴也禁不可刺可灸三壯今云剌者謂剌其血絡之盛滿者也肉裡之脈令人腰痛不可以咳咳則筋縮急刺肉裡之脈為二痏在太陽之外少陽絶骨之後王注云分肉穴也在足外踝直絶骨之端如後同身寸之二分筋肉分間陽維脈氣所發也甲乙經作陽輔穴也厥陰之脈令人腰痛腰中如張弓弩弦刺厥陰之脈在腨踵魚腹之外循之纍纍然乃刺之其病令人善言默默然不慧刺之三痏王注云蠡陽穴分也腰痛上寒刺足太陽陽明上熱刺足厥陰不可以俯仰刺足少陽中熱而喘刺足少陰刺郤中出血靈樞云膕中血絡腰痛上寒不可顧刺足陽明上熱刺足太陰刺腰痛篇取足太陽郤膕中間六法郤膕者膝後屈處兩筋之間橫文膕內也太陰正經二法刺郤中央出血解脈二法刺郤中橫文出血衡絡一法刺郤上數寸出血會陰一法刺郤中下五寸出血也羅張仲文傳神仙灸法療腰重痛不可轉側起坐艱難及冷痹腳筋攣急不可屈伸灸曲瞅兩文頭左右腳四處各三壯每灸一腳二火齊下艾炷才燒至肉初覺疼便用二人兩邊齊吹至火滅午時著灸至人定已來臟腑自動一二行或轉動如雷聲其疾立愈此法神效卒不可量也玉腎虛腰痛腎腧取法以杖量與臍平去脊各一寸半灸二七壯人中委中撮腰強痛命門灸二七壯十四椎節下間伏取之崑崙瀉之灸亦瀉摘忽然氣滯腰疼不可俯仰志室五分得氣即瀉行間腰脊內引痛不可屈伸近上痛合谷近下痛崑崙復溜腰脊俱痛不可忍風池合谷崑崙桑又法風池承山合谷呂細三間東腰脊如痓湧泉一分陰谷一寸半京骨一分行間五分集腰閃挫氣痛尺澤忌灸委中人中陽陵泉束骨崑崙下窖羅腰痛不可俯仰轉側難身寒熱食倍多身羸面黃黑足冷不仁腰重如石腎腧灸五壯中膂腧灸五壯腰腧灸五壯摘腎虛腰痛久不已肩井腎腧五分七呼灸隨年壯腰痛刺之不定者刺八髎見前針灸上條大虛腰痛刺而復發腰重不能舉體可刺委中動脈出血潔腰痛在身之前足陽明原穴身之後足太陽原穴身之側足少陽原穴甲腰痛脊急脅中滿小腹堅急志室主之腰脊痛惡寒少腹滿堅癃閉下重不得小便胞肓主之腰痛骶寒俯仰急難陰痛下重不得小便秩邊主之腰脊痛強引背少腹俯仰難不得仰息腳痿重尻不舉溺赤腰以下至足清不仁不可以坐起膀胱腧主之腰痛不可以俯仰中膂內腧主之腰脊痛尻脊股臀陰寒大痛虛則血動實則並熱痛痔痛尻脽中腫大便直出扶承主之腰痛頸頂痛歷節汗出而步履蹇復不仁腨中痛飛陽主之大腸實則腰背痹寒轉筋頭眩痛虛則鼻衄巔疾腰痛濈然汗出令人飲食欲走承筋主之腰痛不可舉足跟中踝後痛腳痿僕參主之腰痛不能舉足少坐若下車躓地脛中矯矯然申脈主之腰痛如小錘居其中怫然腫痛不可以咳咳則筋縮急諸節痛上下無常寒熱陽輔主之腰痛控睪少腹及股卒俯不得仰刺氣街腸䐜肘寒腰痛不得臥手三里主之腰痛大便難湧泉主之腰痛不可轉側章門主之腰痛少腹痛陰包主之腰痛不可以久立俯仰京門及行間主之腰痛少腹滿小便不利如癃羸瘦意恐懼氣不足腸中悒怏太衝主之腰足痛而清泄善嘔睪跳搴上窖主之腰痛怏怏不可以俯仰腰以下至足不仁入脊腰背寒次窖主之腰痛大便難飧泄腰尻中寒中窖主之腰痛小腹痛下窖主之腎腰痛不可俯仰陰陵泉主之摘閃著腰疼氣海肥人一寸瘦人五分三補三瀉令人覺臍上下痛停針候二十五息左手重按其穴右手進針三息又停二十五息依前進針令人覺從外腎熱氣上入小腹出針神效腰痛上寒實則脊急長強主之素腎脈搏堅而長其色黃而赤者當病折腰脈要精微論帝曰有病厥者診上脈沉而緊左脈浮而遲不然病主安在岐伯曰冬診之上脈固當沉緊此應四時左脈浮而遲此逆四時在左當主病在腎頗關在肺當腰痛也病能篇不然二字衍文按之至骨脈氣少者腰脊痛而身有痹也脈要精微論黑色粗理及耳後陷耳偏一邊高者善病腰痛經云黑色粗理者腎大腎大則善病腰痛不可以俯仰又云耳偏高者腎偏傾腎偏傾則苦腰尻痛是也腎憊及盛怒傷志則腰失強不能轉搖而死經云腰者腎之府轉搖不能腎將憊矣得強者生失強者死又云腎盛怒而不止則傷志志傷則善忘其前言腰脊不可以俯仰屈伸毛悴色夭死於季夏是也胎前腰痛云通氣散治妊娠腰痛狀不可忍此藥神效用破故紙不以多少瓦上炒香熟為末嚼胡桃肉一個空心溫酒下三錢五加皮散治妊娠腰痛不可忍或胯痛先服此散杜仲四兩炒五加皮阿膠炙防風狗脊川芎白芍細辛萆薢各三兩杏仁八十個去皮麩炒上㕮咀以水九升煮取二升去渣下膠作三服五加皮丸治妊娠腰痛不可忍者次服此丸續斷炒杜仲各二兩半芎藭獨活各三兩五加皮狗脊萆薢芍藥訶子肉各四兩上為細末煉蜜丸如桐子大空心酒下四十丸日三丹仁六嫂有胎腰痛白朮四錢陳皮三錢黃柏炒二錢半人參條芩川芎地黃歸尾二分甘草炙些上分四帖水酒煎服大紫酒治妊娠腰痛如折用大黑豆二臺炒令香熟以酒一大盞煮取七分去豆空心頓服本治胎動腰痛搶心或下血取蔥白不拘多少濃煮汁飲之大治妊娠腰背痛反覆不得産寶治妊娠卒腰痛俱用鹿角長六寸燒令赤酒中淬再燒再淬以角碎為度取酒飲之鹿角為末服方寸匕肘卒腰痛不安或腰痛胎轉搶心下血不止用菖蒲汁酒一升服之妊娠卒胎動不安或但腰痛或胎轉搶心或下血不止艾葉一把如雞子大以酒四升煮取二升分為二服良産後腰痛保治血癖腹乃刺刺腰痛用四物湯細末三兩加酒煮玄胡索細末二兩每服三錢酒下云紫金丸治産後惡寒不快腰痛小腹如刺寒熱腹痛久有瘀血月水不調亦可治心痛與失笑散同五靈脂炒為末真蒲黃各等分上以好米醋調五靈脂末慢火熬成膏子次以蒲黃末搜和丸如櫻桃大每服一二丸水與童便各半盞煎至七分至藥化溫服之少頃再進一服惡露即下及有瘀血成塊月信不利者並用酒磨下生地黃湯治産後腰疼腹中余血未盡流為足腫不食生地汁一升芍藥甘草各二兩丹參四兩生蜜一合生薑汁半合上切以水三升煮取一升去渣入地黃汁蜜薑汁微火煎一二沸一服三合日二夜三利一二行愈大産後惡露方行忽然漸少斷絶不來腰中重痛者此由血滯宜桃仁湯如有大痛處必作癰疽當以癰疽法治之桃仁湯方桃仁蘇木生地各半兩虻蟲去足翅炒水蛭上為粗末每服三錢水一盞煎至六分去渣溫服無時候惡露下即住服脊痛脊強灸刺脊痛脊強有三法其一取督脈經云督脈之別名曰長強別走太陽實則脊強取之所別也其二取足太陽經曰厥挾脊而痛者至項頭沉沉然目䀮䀮然腰脊強取足太陽膕中血絡是也其三取小腸經云小腹控睪引腰脊上衝心邪在小腸取之肓原以散之刺太陰厥陰以下之取巨虛下廉以去之是也玉脊膂並腰疼人中口含水突處針入三分略向上些但瀉無補留三吸委中二寸半忌灸又於四畔紫脈上去血如藤塊者不可出血出血血不止令人夭三里瀉五樞甲腰脊強不得俯仰刺脊中睪脊內廉痛便難陰痿不用少腹急引陰及腳內廉內陰谷主之男子脊急目赤支溝主之腰脊強四肢解惰善怒咳少氣郁然不得息厥逆肩不可舉陽乃痿身瞤章門主之耳高者腎高腎高則苦背膂痛不可以俯仰全文見診腎脈緩甚為折脊全文見治虛實法厥王太僕云厥者氣逆上也世謬傳為腳氣讀此始知其病上古稱之為腳氣也經曰寒厥者手足寒也曰熱厥者手足熱也曰痿厥者痿病與厥雜合而足弱痠軟無力也曰痹厥者痹病與厥病雜合而腳氣頑麻腫痛也曰厥逆者即前寒厥熱厥痿厥痹厥風厥等氣逆上而或嘔吐或迷悶或脹或氣急或小腹不仁或暴不知人世所謂腳氣衝心者是也寒熱二厥丹治厥因痰者用白朮竹瀝因氣虛血虛者用四物四君子熱厥用承氣湯外感用雙解散加姜竹瀝素黃帝曰厥之寒熱者何也岐伯對曰陽氣衰於下則為寒厥陰氣衰於下則為熱厥帝曰熱厥之為熱也必起於足下者何也岐伯曰陽氣起於足五指之表陰脈者集於足下而聚於足心故陽氣勝則足下熱也帝曰寒厥之為寒也必從五指而上於膝者何也岐伯曰陰氣起於五指之裡集於膝下而聚於膝上故陰氣勝則從五指至膝上寒其寒也不從外皆從內也帝曰寒厥何失而然也岐伯曰前陰者宗筋之所聚甲乙經前陰作厥陰宗筋作衆筋太陰陽明之所合也春夏則陽氣多而陰氣少秋冬則陰氣盛而陽氣衰此人者質壯以秋冬奪於所用下氣上爭不能復精氣溢下邪氣因從之而上也氣因於中陽氣衰不能滲榮其經絡陽氣日損陰氣獨在故手足為之寒也帝曰熱厥何如而然也岐伯曰酒入於胃則絡脈滿而經脈虛脾主為胃行其津液者也陰氣虛則陽氣入陽氣入則胃不和胃不和則精氣竭精氣竭則不榮其四肢也此人必數醉若飽以入房氣聚於脾中不得散精氣壯則能消磨飲食而輸散於四肢今醉飽入房則精氣耗不能消磨邪氣聚於脾中不得散於四肢也酒氣與穀氣相搏熱盛於中故熱遍於身內熱而溺赤也夫酒氣盛而慓悍腎氣日衰陽氣獨勝故手足為之熱也厥論寒熱二厥腎之精氣內竭而成也子和西華李政之病寒厥其妻病熱厥前後十餘年其妻服逍遙散十餘劑終無可效一日命豫診之二人脈皆浮大而無力政之曰吾手足之寒時時漬以熱湯漬而不能止吾婦手足之熱終日沃以冷水沃而不能已者何也豫曰寒熱之厥也此皆得之貪飲食縱嗜欲遂出內經厥論證之政之喜曰內經真聖書也十年之疑今而釋然縱不服藥愈過半矣僕曰熱厥者寒在上也寒厥者熱在上也寒在上者以溫劑補肺金熱在上者以涼劑清心火分取二藥令服之不輒不旬日政之詣門謝曰寒熱厥者皆愈矣靈厥逆為病也足暴清胸若將裂腸若將以刀切之煩而不能食脈大小皆澀暖取足少陰清取足陽明清則補之溫則瀉之顛狂篇寒厥手足冷寒厥脈沉數實為熱東垣治中書貼合公腳膝尻臀背冷脈沉數有力用黃柏滋腎丸再服而愈又治中書左丞姚公茂上熱下寒用既濟解毒湯良愈丹溪治呂宗信腹有積塊足冷至膝用大承氣加減下之愈此皆寒厥有熱也羅徵南副元帥大忒木兒年六十秋七月徵南豫從之過揚州千里時仲冬病自利完穀不化臍腹冷痛足胻寒以手搔之不知痛癢常燒石以溫之亦不得暖豫診之脈沉細而微豫思之年高氣弱深入敵境軍務煩冗朝夕形寒飲食失節多飲乳酪履於卑濕陽不外固由是清濕襲虛病起於下故胻寒而逆內經云感於寒而受病微則為咳盛則為泄為痛此寒濕相合而為病也法當急退寒濕之邪峻補其陽非灸不能病已先以大艾炷於氣海灸百壯補下焦陽虛次灸三里各三七壯治胻寒而逆且接引陽氣下行又灸三陰交以散足受寒濕之邪遂處方云寒淫所勝治以辛熱濕淫於外平以苦熱以苦發之以附子大辛熱助陽退陰溫經散寒為君乾薑官桂大熱辛甘亦除寒濕白朮半夏苦辛溫而燥脾濕故以為臣人參草豆蔻甘草大溫中益氣生薑大辛溫能散清濕之邪蔥白辛溫能通上焦陽氣故以為佐又云補下治下制以急急則氣味厚故大作劑服之不數服瀉止痛減足胻漸漸溫調其飲食十日平復明年秋過襄陽值霖雨閲旬余前症復作再依前灸添陽輔各灸二七壯再以前藥投之數服愈加減白通湯治形寒飲冷大便自利完穀不化臍腹冷痛足胻寒而逆附子炮去皮乾薑炮各一兩官桂去皮甘草炙草豆蔻麵裹煨半夏湯泡七次人參白朮各半兩上銼每服五錢水二盞半生薑五片蔥白五莖煎一盞三分去渣空心宿食消盡溫服寒厥皆屬腎虛經云腎藏志志不足則厥又云腎虛則清厥意不樂又云下虛則厥又云諸厥固泄皆屬於下是也靈黃帝曰少陰之脈獨下行何也岐伯曰不然夫衝脈者五臟六腑之海也五臟六腑皆稟焉其上者出於頏顙滲諸陽灌諸精其下者注少陰之大絡出於氣衝循陰股內廉入膕中伏行骭骨內下至內踝之後屬而別其下者並於少陰之經滲三陰其前者伏行出跗屬下循跗入大指間滲諸絡而溫肌肉故別絡結則跗上不動不動則厥厥則寒矣逆順肥瘦篇經云經絡堅緊火所治之蓋灸以治之或湯酒漬之也運氣寒厥有二一曰寒經云水平氣曰靜順靜順之紀其病厥又云歲水太過寒氣流行邪害心火火燥悸陰厥又云歲金不及炎火乃行復則病陰厥且格是也二曰寒濕經云太陰司天之政天氣下降地氣上騰民病寒熱是也千治丈夫腳腰冷不隨不能行方上醇酒三斗水三斗合著甕中溫漬至膝三日止冷則甕下常著灰火勿令冷靈厥而寒甚骨廉陷下寒過於膝下陵三里陰絡所過得之留止寒入於中推而行之經陷下者火則當之經絡堅緊火所治之不知所苦兩蹺之下男陰女陽良工所禁針論畢矣官能篇兩蹺之下照海申脈二穴寒厥取足陽明少陰於足皆留之寒熱病篇上灸刺寒厥二法補虛也經云足少陽之別名曰光明去踝五寸別走厥陰下絡足跗實則厥取之所別此法瀉實也又經云亂於臂脽則為四厥取之先去血脈後取其陽明少陽之滎輸此法治亂氣不補不瀉但徐出入導氣也垣經云厥在於足宗氣不下脈中之血凝而留止非火調弗能取之潔身熱如火足冷如冰可灸陽輔穴又云胻酸冷絶骨取之甲厥甚取太陰陽明動者之經足厥喘逆足下清至膝湧泉主之寒厥及熱煩心少氣不足以息陰濕癢痛不可以食飲肘攣支滿喉中焦乾渴魚際主之膝以下至足清不仁不可以坐起尻不舉腰腧主之熱厥手足熱丹司丞叔平生腳自踝以下常覺熱冬不可加綿於上常自言曰我資稟壯不怕冷豫曰此足三陰虛宜斷欲事以補養陰血庶乎可免笑而不答年方十七患痿半年而死千手足煩者小便三升盆中溫漬手足靈熱厥取足太陰少陽皆留之寒熱病篇産後寒厥摘産後手足冷逆肩井立愈腳氣頑麻腫痛為痹厥垣腳氣之疾實水濕之所為也蓋濕之害人皮肉筋脈而屬於下然亦有二焉一則自外而感一則自內而致其治法自應不同故詳而論之其為病也有證無名腳氣之稱自晉蘇敬始關中河朔無有也惟南方地下水寒其清濕之氣中於人必自足始故經曰清濕襲虛則病起於下或者難曰今茲北方其地則風土高寒其人則腠理致密而復多此疾者豈是地濕之氣感之而為邪答曰南方之疾自外而感者也北方之疾自內而致者也何以言之北方之人常食湩乳又飲酒無節過傷而不厭且湩乳之為物其氣味則湩乳其形質則水也酒醴亦然人之水穀入胃胃氣蒸騰其氣與味宣之於經絡化之為血氣外榮四末內注五臟六腑周而復始以應刻數焉是謂天地之紀此皆元氣充足脾胃之氣無所傷而然也苟元氣不充則胃氣之本自弱飲食既倍則脾胃之氣有傷既不能蒸化所食之物其氣與味亦不能宣暢旁通其水濕之性流下而致之其自外而入者止於下脛腫而痛自內而致者乃或至於手節也經云足脛腫曰水太陰所至為重跗腫此但言其自外者也所治之法前人方論備矣自內而致者治法則未有也楊大受云腳氣是為壅疾治以宣通之劑使氣不能成壅也壅既成而盛者砭惡血而去其重勢經曰蓄則腫熱砭射之後以藥治之按東垣論南方腳氣外感清濕作寒治北方腳氣內傷酒醴作濕熱治此實發前人之未發者以人論之不必以南北分寒熱凡外感寒濕者皆屬寒濕不必南方為然凡內傷酒醴者皆屬濕熱不必北方為然但隨脈症及詢其病之由來而施治可也素臥出而風吹之血凝於膚者為痹凝於脈者為泣凝於足者為厥此三者血行而不得反其空故為痹厥也五臟生成篇冬苦病痹厥全文見五厥垣孫真人云凡四時之中皆不得久坐久立濕冷之地亦不得因酒醉汗出脫衣洗足當風取涼皆成腳氣若暑月久立濕冷之地者則濕熱之氣蒸人經絡病發必熱則四肢皆痠疼煩悶若寒月久坐久立濕冷之地者則濕冷之氣上入經絡病發則四肢皆酷冷轉筋世有勤工力學之士久坐久立於濕地不得動靜冷風來入經絡不覺成病也若欲使之不成病者初覺則灸患處二三十壯則愈不復發熱黃帝云當風取涼醉以入房能成此病又云婦人産後取涼多有此疾深宜慎之內經論南方者其地下水土弱霧露之所蒸也江東嶺南大率如此春夏之交山林蒸郁風濕毒氣為甚足或感之遂成瘴毒腳氣其候則腳先屈弱漸至痹疼脛微腫小腹不仁頭痛煩心痰壅吐逆時作寒熱便溲不通甚者攻心而勢逼治之誠不可緩支法存所以留意經方偏善此術者豈非江右嶺表此疾得之多歟千外臺總録所録皆謂南方卑濕霧露所聚之地其民腠理疏陽氣不能外固因而履之則清濕襲虛病起於下此因血虛氣弱受清濕之邪氣與血並行於膚腠邪氣盛正氣少故血氣澀澀則痹虛則弱故令痹弱也後人名曰腳氣針經云有道以來有道以去治之多以灸焫為佳以導引濕氣外出及飲醪醴以通經散邪所制之方寒藥少熱藥多多用麻黃川烏薑附之屬內經云濕淫於外以苦發之麻黃苦溫發之者也川烏辛熱走而不能守通行經絡薑附辛甘大熱助陽退陰亦能散清濕之邪又察足之三陰三陽是何經絡所起以引用藥為主治復審六氣中何氣當之治以佐使之藥孫真人云醫者意也隨時增損初無定方真知言哉千風毒之氣入人體中脈有三品內外證候相似但脈有異耳若脈大而緩宜服續命湯二劑立瘥若風盛宜作越婢湯加白朮二兩若脈浮大而緊轉快宜作竹瀝湯又云脈浮大而緊駃此最惡脈也若細而駃者同是惡脈浮大者病在外沉細者病在內治亦不同病人脈微而弱宜服風引湯此人脈多是因虛而得之若大虛短氣力乏可間作補湯隨病冷熱而用之若未愈更服竹瀝湯即止活治腳氣屬冷者小續命湯煎成旋入生薑自然汁服之最快續命方見前中風門仲越婢加白朮湯見後痿厥門千第一竹瀝湯治兩腳痹弱或轉筋皮肉不仁腹脹起如腫按之不陷心中惡不欲食或患冷方竹瀝五升甘草蓁艽葛根黃芩麻黃防風細辛桂心乾薑各一兩防己升麻各一兩半茯苓三兩附子二枚杏仁五十枚上㕮咀以水七升合竹瀝煮取三升分三服取汗千金冀方無茯苓杏仁有白朮一兩第二大竹瀝湯治卒中風口噤不能言四肢縱緩偏痹攣急風經五臟恍惚恚怒無常手足不隨方竹瀝一升四合獨活芍藥防風茵芋甘草白朮葛根細辛黃芩芎藭各二兩桂心防己人參石膏麻黃生薑茯苓各一兩烏頭一枚上㕮咀竹瀝每服四升分六服先未汗者取汗一服相當即止第三竹瀝湯治風毒入人五臟短氣心下甚熱手足煩疼四肢不舉皮肉不仁口噤不語方竹瀝一斗二升防風茯苓秦艽各三兩當歸黃芩千金翼作白芍人參芎藭千金作防己細辛桂心甘草升麻千金作通草麻黃白朮各二兩附子二枚蜀椒一兩葛根五兩生薑八兩上㕮咀以竹瀝煮取四升分五服初得病即須摩風膏日再痹定止千金翼無麻黃蜀椒生薑風引湯麻黃石膏獨活茯苓各二兩吳茱萸附子秦艽細辛桂心人參防風芎藭防己甘草乾薑以上各一兩白朮三兩杏仁六十枚上㕮咀以水一斗六升煮取三升分三服取汗為度上六方表劑竹瀝湯若不及熱服輒停在胸膈更為人患每服當使極熱若服竹瀝湯得下者必佳也若加服數劑病及脈勢未折而苦脹滿者可以大鱉甲湯下之湯勢盡而不得下可以丸散助湯令下下後更服竹瀝湯令脈勢折將息料理乃佳大鱉甲湯治腳弱風毒攣痹氣上及傷寒惡風濕毒山水瘴氣熱毒四肢痹弱方鱉甲二兩防風麻黃白朮石膏知母升麻茯苓橘皮芎藭杏仁去皮尖人參半夏當歸芍藥葳蕤甘草麥門冬各一兩羚羊角六銖大黃一兩半犀角雄黃青木香各半兩大棗二十枚貝齒烏頭七枚生薑一兩薤白十四枚麝香二銖赤小豆三合吳茱萸五合上㕮咀以水二斗煮取四升分六服去渣食前溫服如人行十里久得下則止一方用大黃半兩煨畏下可止用六銖一方用羚羊角五錢毒盛可用六銖胡治有山茱萸半升千金翼無知母升麻橘皮芎藭人參當歸葳蕤上治寒濕屬裡仲烏頭湯治腳氣疼痛不可屈伸方見歷節注疼痛千麻黃湯治風惡毒氣腳弱無力頑痹四肢不仁失音不能言毒氣衝心有人病者但一病相當即服此第一服次服第二第三第四方麻黃大棗二十枚茯苓三兩杏仁三十枚防風白朮當歸升麻芎藭芍藥黃芩桂心麥門冬甘草各二兩上㕮咀以水九升清酒二升合煮取二升半分四服日三夜一覆令小汗粉之莫令見風第二服獨活湯方獨活四兩熟地三兩生薑五兩葛根桂心甘草芍藥麻黃各二兩上㕮咀以水八升清酒二升合煎取二升半分四服日三夜一腳弱時忌瓠子蕺菜犯之一世治不愈第三兼補厚朴湯並治諸氣咳嗽逆氣嘔吐方厚朴芎藭桂心熟地芍藥當歸人參各二兩黃耆甘草各三兩吳茱萸二升半夏七兩生薑一斤上㕮咀以水二斗煮豬蹄一具取汁一斗二升去上肥內入清酒三升合煮取三升分四服相去如人行二十里久更進服第四服風引獨活湯兼補方獨活四兩茯苓甘草各三兩升麻一兩半人參桂心防風芍藥當歸黃耆乾薑附子各二兩大豆二升上㕮咀以水九升清酒三升合煮三升半分四服相去如人行二十里久更進服本益氣血補肝腎祛風濕壯腳膝地黃丸熟地一兩牛膝石斛各三兩肉蓯蓉茵芋防風川芎桂心五味子附子薏苡仁各半兩上為末煉蜜丸如桐子大每服三四十丸酒吞下空心食前服治腰腳走注痛此是腳氣宜薏苡丸薏苡仁茵芋白芍藥牛膝川芎防風獨活各半兩熟地側子一枚桂心橘紅上細末煉蜜丸如桐子大每服三四十丸酒下食前日三服木瓜湯下亦得三因勝駿丸治元氣不足真氣虛弱及諸虛寒濕氣進襲手足拳攣腳指連腳面拘急走注疼痛筋脈不伸行步不隨常服益真氣壯筋骨黑髭鬚滑皮膚及去一切足弱鶴膝風附子一枚炮去皮臍當歸酒浸一宿天麻酒浸牛膝酒浸酸棗仁炒熟地酒浸防風各二兩木瓜四兩乳香半兩別研全蠍去毒一兩麝香二錢別研木香沒藥另研羌活甘草炙各半兩上件為細末用生地黃三斤洗淨研爛如泥無灰酒四升煮爛如膏以前藥勻和杵令堅每兩作十丸每服用一丸細嚼臨睡酒下如冬月無地黃煉蜜丸如桐子大每服五十丸鹽湯下酒亦可服此藥五七日或半月見效甚速行履如飛千里可至故名勝駿一方加檳榔萆薢蓯蓉破故紙巴戟木瓜各一兩減當歸地黃各一兩尤妙云蒼朮丸治乾溼腳氣筋脈拘攣疼痛不能行乳香沒藥各二兩另研牛膝青鹽各半兩熟艾四錢川烏三錢全蠍炒二錢蒼朮米泔浸炒四兩上為細末共研藥和勻以木瓜一個大者切一頭留作蓋去穰入上件藥於內將蓋拴定安木瓜於黑豆中蒸令極爛取出去皮連藥研成膏卻入生蒼朮末拌勻丸如桐子大每服五十丸空心木瓜湯下以溫鹽酒亦可日三服忌血與蒜本治腰腳筋骨酸無力酒浸牛膝丸牛膝三兩炙黃川椒半兩去子併合口者附子一兩炮去皮臍虎脛骨真者半兩醋炙黃上㕮咀用生絹作袋入藥扎口用煮酒一斗春秋浸十日夏浸七日冬浸十四日每日空心飲一大盞酒盡出藥為末醋糊為丸每服二十丸空心溫酒鹽湯任下忌動風等物丹腳氣須用提起其濕之在下者藥隨氣血用治腫痛方生地黃柏酒炒蒼朮鹽炒白朮防風檳榔川芎犀角甘草梢木通黃連熱加芩連痰加竹瀝薑汁及時令熱加石膏大便祕加桃仁小便澀加牛膝有食積流注者蒼朮黃柏防己南星川芎白芷犀角檳榔血虛加牛膝龜板有如常腫者專主濕熱肥人加痰藥一婦人足腫生地黃柏蒼朮南星牛膝酒洗草龍膽川芎腳弱筋痛牛膝二兩白芍一兩半龜板酒炙黃柏炒一兩知母炒一兩甘草炙半兩上為末酒糊為丸垣異法方宜論云北方者其地高陵居風寒冷洌其俗飲湩酪而肉食凡飲湩酪以飲多飲速者為能經云因而大飲則氣逆又云食入於陰長氣於陽今乃反行陽道是為逆也夫乳酪醇酒者濕熱之物飲之屬也加以奉養太過亦滋其濕水性潤下氣不能詬故下疰於足陘積久而作腫痛此飲食下流之所致也通評虛實論云谷入多而氣少濕居下也況湩酪醇酒之濕熱甚於谷者也至真要大論云太陰之勝火氣內郁流散於外足脛胕腫飲發於中胕腫於下此之謂也故飲入於胃遊溢精氣上輸於脾脾氣散精上歸於肺通調水道下輸膀胱水精四布五經並行合於四時五臟陰陽揆度以為常也若飲食自倍脾胃乃傷則胃氣不能施化脾氣不能四布故下流乘其肝腎之位疰於足脛加之房事不節陰盛陽虛遂成痼疾孫真人云古人少有此疾自永嘉南渡衣纓士人多有之亦此意也當歸拈痛湯治濕熱為病肢節煩疼肩背沉重胸膈不利兼遍身疼痛流注手足足脛腫痛不可忍羌活甘草炙黃芩酒炒茵陳各半兩酒炒人參苦參酒洗升麻葛根蒼朮歸身各二錢知母酒洗三錢澤瀉三錢豬苓三錢白朮一錢半防風三錢水煎不拘時候本草十劑云宣可去壅通可去滯內經云濕淫所勝治以苦溫羌活苦辛透關節勝濕防風甘草溫散經絡中留濕故以為君水性潤下升麻葛根苦辛平味之薄者陰中之陽引而上行以苦發之也白朮苦甘溫和平除濕蒼朮體輕浮氣力雄壯能除膚腠間濕故以為臣夫血壅而不流則為痛當歸身辛溫以散之使血氣各有所歸人參二十草甘溫補脾養正氣使苦藥不能傷脾胃仲景云濕熱相合肢節煩疼苦參黃芩知母茵陳苦寒乃苦以泄之者也凡酒製炒以為因用治濕不利小便非其治也豬苓甘溫平澤瀉鹹平淡以滲之又能導其留飲故以為佐氣味相合上下分流其濕使壅滯之氣得宣通也上㕮咀每服一兩水二盞半浸藥少時煎至一大盞去渣溫服空心待少時以美膳壓之臨臥一服不須飯壓羅中書黏合公年四旬有一體干魁梧丙辰春從徵至揚州腳氣忽作遍身肢體微腫其痛手不能近足脛尤甚履不任穿跣以騎馬控兩蹬而以竹器盛之以困急來告豫思內經有云飲發於中胕腫於上又云諸痛為實血實者宜決之以三稜針數刺其腫上血突出高二尺余漸漸如線流於地約半升許其色黑紫頃時腫消痛減以當歸拈痛湯一兩半服之是夜得睡明日再服而愈肘風毒腳氣若脛已滿捻之沒指但勤飲烏牸牛溺二三升使小便利漸漸消當以銅器取新者為佳純黃者亦可用垣楊大受云腳氣之疾自古皆尚疏下為疾壅故也然不可太過太過則損傷脾胃使營運之氣不能上行反下注為腳氣又不可不及不及則使壅氣不能消散今立三方於後詳虛實而用之羌活導滯湯治腳氣初發一身盡痛或肢節腫痛便溺阻隔先以此藥導之後用當歸拈痛湯除之羌活獨活各半兩防己三錢大黃酒煨一兩當歸三錢枳實麵炒二錢上㕮咀每服五錢或七錢水二盞煎至七分溫服微利則已量虛實加減開結導飲丸飲食不消心下痞悶陳皮白朮澤瀉茯苓曲麥蘖半夏制各一兩枳實炒青皮乾薑各半兩如有積塊者加巴豆霜一錢半上為末湯浸蒸餅為丸如桐子大每服三五十丸至七十丸溫湯下食遠服又方治濕熱並諸濕客搏腰膝重痛足脛浮腫檳榔甘遂赤芍威靈仙澤瀉葶藶乳香研各二兩沒藥研一兩牽牛半兩大戟炒三兩陳皮四兩上為末麵糊為丸如桐子大每服五十丸加至七八十丸食前溫水送下得更衣止後服前藥忌酒二日又忌面及甘草三兩日食溫淡粥補胃乙巳春廉平章年三十八身體充肥腳氣始發頭面渾身肢節微腫皆赤色足脛赤腫痛不可忍不敢扶策手著皮膚其痛轉甚起而復臥臥而復起晝夜苦楚難以名狀求豫治之平章以北土高寒故多飲酒積久傷脾不能運化飲食下流之所致投以當歸拈痛湯一兩二錢其痛減半再服腫痛悉除止有右手指末微赤腫以三稜針刺於爪甲端多出黑血赤腫全去不數日因食濕面肢體覺痛再以枳實大黃湯治之羌活一錢半當歸一錢枳實五分大黃酒煨三錢夫腳氣之疾皆水濕之為也面滋其濕血壅而不行故肢節煩疼內經曰風能勝濕羌活辛溫透關節去濕故以為主血留而不能行則痛當歸之辛溫散壅止痛枳實之苦寒治痞消食故以為臣大黃苦寒以導面之濕熱並治諸老血留結取其峻快故以為使也上㕮咀只作一服水一盞半煎至一盞去渣溫服空心食前利下兩行痛止世腳氣控涎丹加胭脂一錢檳榔木瓜各一兩卷柏半兩先以鹽水煮半日次日白水煮半日同前藥為丸每三十丸加至四五十丸服下惡物立效控涎丹方見走注疼痛衍有人嗜酒日須五七十杯後患腳氣甚危或教以巴戟半兩糯米同炒米微轉色不用米大黃一兩銼炒同為末熟蜜為丸溫水下五七十丸仍禁酒遂愈本治風氣積滯成腳氣常覺微腫發則或痛茵芋丸茵芋炒薏苡仁各半兩郁李仁一兩牽牛子三兩生取末一兩半上細末煉蜜丸如桐子大每服二十丸薑棗湯下未利加至三十丸日三快利為度白粥補之治腎臟風攻注腳膝方連珠甘遂一兩木鱉子一雌一雄去殼上為末獖豬腰子二個批開用藥末一錢摻勻濕紙裹數重火煨熟放溫五更初細嚼米飲下積水多則利多少則利少宜軟飯將息若息一腳須看左右如左腳用左邊腰子右腳用右邊腰子藥末止許一錢壬子年在毗陵有姓馬人鬻酒久不見因問其子云宿患腎臟風今一足發腫如瓠自腰以下巨細通為一律痛不可忍欲轉側兩人挾持方可動或者欲以鈹刀決之豫曰不可吾有藥當合以贈如上法服之辰巳間下膿水數升即時痛止腫退一月後尚拄拐而行豫再以赤烏散令塗貼其膝方愈後十年至毗陵率其子列拜以謝云向腳疾至今不復作雖積年腎臟風並已失去今健步自若矣草有人重病足不履地者十年良醫殫技莫能治所親置之道傍以求救者遇一遊僧見之告曰此疾一藥可治但不知此土有否因為之入山求索果得乃威靈仙也使服之數日能步履其後山人鄧思濟知之遂著其法云探得陰乾月餘搗篩溫清酒和二錢匕空心服之加人本性殺藥可加及六錢匕利過兩行則減之病除乃停服其性甚善不觸諸藥但惡茶及麵湯以甘草梔子代飲可也集治腎臟風壅積腰膝沉重威靈仙末蜜和丸如桐子大初服酒下八十丸平明微利惡物如青膿桃膠即是風毒積滯也如未動夜再服一百丸取下後吃粥補之一月仍當服溫補藥子和息帥腰股沉痛行步坐馬皆不便或作腳氣寒濕治之或作虛損治之烏附乳沒活血壯筋骨之藥無不用之至六十餘日目赤上熱大小便俱澀腰股之病如故戴人診其兩手脈皆沉遲沉者在裡也宜泄之以舟車丸浚川散各一服去積水二十餘行至早辰服齏白粥一二頓與之上馬已能矍鑠矣棠溪李十八郎病腰腳大不伸偃僂跛躄而行已數年矣服藥無功止藥卻愈因秋暮涉水病復作醫氏使服四斤丸其父李仲安乃乞藥於戴人戴人曰近日服何藥仲安曰四斤丸曰目昏赤未其父驚曰目正暴發戴人曰宜速來不來則喪明矣始來策杖而行目腫無所見戴人先令湧之藥下忽走二十行兩目頓明策已棄去比再湧泄能讀宮歷日調一月令服當歸丸健步而歸矣仲味酸則傷筋筋傷則緩名曰泄咸則傷骨骨傷則痿名曰枯枯泄相搏名曰斷泄榮氣不通衛不得獨行榮衛俱微三焦無所稟四續斷絶身體羸瘦獨足腫大黃汗出脛冷假令發便為歷節桂枝加黃耆湯之類治之丹恂妳腳底如錐刺痛或胕腫手腕亦痛而腫大便泄滑裡急此血少又下焦血分受濕氣為病健步丸主之手腕恐是足腕生地一兩半蒼朮芍藥陳皮各一兩大腹子三錢牛膝半兩歸尾茱萸黃芩各一兩桂枝三錢上為丸每服百丸白朮通草煎湯食前下之三因十全丹治腳氣上攻心腎相擊足心隱痛小腹不仁煩渴小便祕或利關節攣皮疼痛神效不可具述肉蓯蓉酒浸石斛酒浸狗脊去毛萆薢茯苓牛膝酒浸地仙子遠志去心炒各一兩熟地三兩杜仲去皮炒三兩上為末蜜丸如桐子大每服五十丸溫酒鹽湯任下本治肝腎風虛氣弱腳不可踐地腰脊疼痛風毒流注下經行止艱難小便餘瀝此藥補五臟內傷調中益氣涼血強筋骨益智輕身耐老續斷丸思仙木五兩即杜仲五加皮防風薏苡仁羌活川續斷各三兩萆薢四兩生地五兩牛膝酒浸三兩上為末好酒三升化青鹽三兩用木瓜半斤去皮子以鹽酒煮木瓜成膏和杵丸如桐子大每服三五十丸空心食前溫酒鹽湯下本療丈夫腰腳痹緩急行履不穩者以萆薢二十四分合杜仲八分搗篩每日溫酒和服三錢匕增至五錢忌食牛肉活薏苡仁酒治腳痹薏苡仁牛膝各二兩海桐皮五加皮獨活防風杜仲各一兩熟地一兩半白朮半兩上銼為粗末散入生絹袋內用好酒五升浸春秋冬二七日夏月盛熱分作數帖逐帖浸酒每日空心溫服一盞或半盞日三四服常令酒氣醺醺不絶久服覺皮膚下如數百條蟲行即風濕氣散本去風補血益氣壯筋骨強腳力虎骨酒虎脛骨真者萆薢仙靈脾薏苡仁牛膝熟地各二兩上細銼絹袋盛浸酒二斗飲了一盞入一盞可得百日婦人去牛膝丹六七叔婆血少氣多大便後腳痛而麻當歸二錢半芍藥白朮二錢陳皮青皮一錢地黃一錢半川芎五分甘草少些桃仁十八個分二帖煎腳氣壅腫便溺阻隔心下痞滿飲食不消宜微利之方見內傷濕熱條腳氣多屬肺氣實經云肺病者汗出尻陰股膝髀腨胻足皆痛故戴人治腳氣用湧法者良由此也又千金方多汗之者亦瀉肺之法也今集疏肺氣之方於左子和魏德新因赴冬選犯寒而行真元氣衰加之坐臥冷濕飲食失節以冬遇此遂作骨痹骨屬腎也腰之高骨壞而不用兩胯似折面黑如炭前後臁痛痿厥嗜臥遍問諸醫皆作腎虛治之豫先以玲瓏灶尉蒸數日次以苦劑上湧寒痰三二升上實下虛明可見矣次以淡劑使白朮除脾濕茯苓養腎水又刺腎腧太溪二穴二日一刺前後一月平復如故孫少府監韓彥正暴得疾手足不舉諸醫皆以為風針手足亦不知痛遂召孫診之孫曰此腳氣耳用檳榔末三錢生薑三片乾紫蘇七葉陳皮三錢水一大盞煎至七分去渣熱服數次而愈治腳腫者檳榔散主之陳皮一大握蒼朮炒一握酒半盞同以上藥煎上煎數沸調檳榔末二錢食後服聖治腳氣及風寒濕四肢攣急腳疼不可踐地用紫蘇二兩搗碎水三升研取汁以蘇子汁煮粳米粥二合和蔥豉椒姜食之即止上檳榔紫蘇例世治一切腳氣奇方用穿山甲前兩足者燒存性研細入麝香當門子少許多少隨人斟酌要服此藥須去他事至晚不可進飲食候至夜深腹空時調服坐臥隨意及雞鳴又一服痛立止過一二日便能步履如常極妙如神千治腳氣十二風痹不能行松葉酒用松葉六十斤細銼㕮咀以水四石煮取四斗九升以釀五斗米如常法另煮松葉汁以漬米並饙飯泥釀封頭七日後澄飲之取醉得此酒力者甚衆本虎骨酒治腰腳痛疼攣急不得屈伸及腿膝冷麻用虎骨一具及脛骨二莖酥炙黃捶碎無灰酒三斗密封七日空心晚食酒隨意飲崔治腰腳蒸法取黃荊葉不限多少蒸熟熱置於甕中其下著火溫之以病人置於葉中須臾汗出葉中旋旋吃飯稍倦即止以綿衣蓋避風仍進蔥豉酒以瘥為度世治諸般腳氣一服除根防風三錢去蘆羌活蟬蛻各三分薄荷五分紫蘇四分上曬乾為末每服五錢以無灰酒半碗熱調服訖服至一時久即煎後藥湯傾桶內披厚衣於桶上坐勿令走了藥氣將腳腿熏之當自下而上汗出直至頂門其出如水盡為度熏洗用紫蘇半斤忍冬花四兩木饅頭七個蘇木二兩上為粗末水一中樣桶煎藥味出分三度添用只一用永除根垣腳氣泄洗法活人書曰凡腳氣服補藥及用湯泄洗皆醫之大禁也為南方外感濕氣乘虛襲人為腫痛而言非為北方內受濕氣注下腫痛而言也蓋濕氣不能外達宜淋泄開導泄越其邪名曰導氣除濕湯威靈仙防風荊芥穗當歸地骨皮升麻白芍蒴藋葉上等分銼細水二斗煮取一斗五升去渣熱淋洗無時世治腳赤腫杉皮煎濃湯洗數次立愈本草云用杉節殊效千治嶺南腳氣從足至膝脛腫滿連骨疼者用萆麻子葉切蒸薄裹三二易即消治嶺南腳氣從足至膝脛腫滿連骨疼者蒴藋根銼碎和酒醋共三分根一分合蒸熟封裹腫上二三日即消亦治不仁簡治腳氣連腿腫滿久不瘥方黑附子一兩去皮臍生用搗為散生薑汁調如膏塗敷腫上藥干再塗之候腫消為度山治腳氣用無名異化牛皮膠調勻貼患處世治遠行腳腫用之可行千里輕便甚妙防風細辛草烏上等分為末摻內鞋底內如著前鞋即以水微濕過然後摻藥食療腳氣風痹不仁五緩筋急熊肉半斤於豉汁中和薑椒蔥白鹽醬作醃臘空腹食之玉針腳氣腫痛三里絶骨各二寸半丘墟針入一寸瀉之行間五分留八吸瀉之解溪留十吸瀉之針入五分商丘針入五分瀉十吸撮治腳氣諸穴隨經選用之陷谷三分瀉之行谷五分瀉之灸中封瀉之灸俠溪先瀉後補灸陽輔絶骨各二寸半瀉之灸通谷一分瀉之灸東陽腳氣針灸大法此法與千金同兼服藥風市百壯三報穴正身平立垂手指盡處大筋上是伏免病人端坐離膝蓋上七寸以左右指按捺上有肉起如兔狀是穴可灸五十壯三報穴犢鼻五十壯三報穴膝眼二十壯三里上廉下廉絶骨各五十壯凡上項諸穴不必一頓灸盡壯數可日日報灸之三日令盡壯數為佳凡一腳病即灸一腳兩腳病灸兩腳弱者看輕重加減不可執一靈驗不可述也扁鵲又腳氣腎氣臍傍相去各四寸肩井三里氣海交龍撮寒濕腳氣紅腫生瘡中封五分瀉之陽輔絶骨各二寸半瀉之灸集又法行間三里照海崑崙絶骨京骨委中三陰交玉兩足麻足腿膝無力風市在腿外廉垂手中指點到處是穴針五分補多瀉少留五呼先瀉成後補生集又足不能行丘墟行間崑崙太衝陽輔三陰交復溜三里大治足不行本風有一百二十四種氣有八十種唯腳氣頭風上氣當須藥不絶余則隨其發動臨時消息但有風氣之人春末夏初及秋暮得通泄則不困劇所謂通泄者如麻黃牽牛郁李仁之類是也不必苦寒利藥也垣外臺云第一忌嗔嗔則心煩煩則腳氣發第二禁大語大語則傷肺肺傷亦發動又不得露足當風入水以冷水洗腳兩腳脛尤不宜冷雖暑月常須著綿褲至冬寒倍令兩脛溫暖得微汗大佳依此將息氣漸薄損每至寅丑日割手足甲割少侵肉去氣夏時腠理開不宜當風臥睡睡覺令人按挼勿使邪氣稽留數勞動關節常令通暢此並養生之要拒風邪之法也尋常有力每食後行三五百步疲倦便止腳中惡氣隨即下散雖浮腫氣不能上也羅凡治此疾每旦早飯任意飽食午飯少食晚飯不食彌佳恐傷脾胃營運之氣失其天度況夜食則血氣壅滯而陰道愈增腫痛矣垣第一凡飲食酒及湩酪勿使過度過則傷損脾胃下注於足脛跗腫遂成腳疾第二欲不可縱嗜欲多則腳氣發凡飲食之後宜緩行二三百步不至汗出覺困則止如此則不能成壅也經云逸者行之又云病濕痹忌溫食飽食濕地濡衣千凡腳氣之病極須忌房室牛羊魚肉蒜韭菜菘菜蔓菁瓠子酒面酥油浮糜豬雞鵝鴨並忌大怒惟得食粳粱粟米醬豉蔥椒姜橘皮又不得食諸生果子酸酢之食犯者皆不瘥凡腳氣之病始起甚微多不令人識也食飲嬉戲氣力如故惟卒起腳屈弱不能動有此為異耳凡腳氣之候或見食嘔吐憎聞食臭或有腹痛下利或大小便閉澀不通或胸中衝悸不欲見光明或精神昏慣或喜迷忘語言錯亂或壯熱頭痛或身體極冷疼煩或覺轉筋或腫或不腫或䏶腿頑痹或時緩縱不隨或復百節攣急或小腹不仁此皆腳氣狀貌也腳氣有腫者有不腫者其小腹頑痹不仁者多不腫小腹頑後不過三五日即令人嘔吐者名腳氣入心如此者死在旦夕其人黑瘦者易治肥大肉厚赤白者難愈黑人耐風濕赤白不耐風濕瘦人肉硬肥人肉軟肉軟則受病難愈凡腳氣覺病候有異即須大怖畏決意急治之稍緩則氣上入胸脅逆滿氣上肩息急者死不旋踵寬者數日必死不可不急治也但見心下急氣喘不停或自汗數出或乍寒乍熱其脈促短而數嘔吐不止者死足痿軟不收為痿厥痿厥有二一屬腎膀胱經云恐懼不解則傷精精傷則骨酸痿厥精時自下是腎傷精脫也又云三陽為病發寒熱下為癰腫及為痿厥腨㾓是膀胱在下發病也二屬腎脾濕傷腎經云凡治痿厥發逆肥貴人則膏粱之疾又云秋傷於濕上逆而咳發為痿厥是也垣補益腎肝丸治目中溜火視物昏花耳聾耳鳴困倦乏力寢汗憎風行步不正兩腳欹側臥而多驚腳膝無力腰以下消瘦柴胡羌活生地苦參炒防己炒各五分附子炮肉桂各一錢當歸二錢上細末熟水丸如雞頭大每服五十丸溫水送下此藥如在冬天中寒或心肺表寒目中溜火嚏噴鼻流清涕咳嗽痰涎者止可服一丸須與姜附御汗湯等藥相兼服之不可單服此表藥也健步丸治膝中無力伸不能屈屈而不能伸腰脊腿腳沉重行步艱難羌活柴胡各五錢防風三錢川烏一錢滑石炒半兩澤瀉三錢防己酒洗一兩苦參酒洗一錢肉桂甘草炙栝蔞根酒製各半兩上為細末酒糊為丸如桐子大每服十丸煎愈風湯空心送下愈風湯在中風門腿腳沉重無力者於羌活勝濕湯中加酒洗漢防己五分輕則附子重則川烏少許以為引用而行經也上羌活柴胡伸提氣升防己苦參去濕熱桂附反佐之也肅神龜滋陰丸治足痿用酒炙龜板四兩炒黃柏知母各二兩枸杞五味鎖陽各一兩乾薑半兩為丸每服七十丸相兼服方見舌縱涎下丹痢後腳弱漸細用蒼朮一兩白芍龜板酒炙二兩半黃柏酒半兩上粥丸以四物湯加陳皮甘草煎湯吞之中書貼合公年三十二歲病腳膝痿弱臍下尻陰皆冷陰汗臊臭精滑不固請醫黃道寧主以鹿茸丸十旬不減至戊申春始求治於東垣遂診其脈沉數而有力乃曰公飲醇酒食以膏粱滋火於內逼陰於外醫見其症蓋不知陽強不能密緻皮膚冷而溢泄以為內實有寒投以熱劑反瀉其陰而補陽真所謂虛虛實實也其不增虛者猶為幸也復何望獲效耶即處以滋腎大苦寒之劑制之以急寒因熱用飲入下焦適其病所瀉命門相火之盛再服而愈公以厚禮送之更求前藥方師固辭不收或問之曰物不受義也藥既大驗不復與方何為也曰大寒大熱之藥非常服者藉以從權可也今公之病相火熾盛以乘陰位故用此大寒之劑以瀉相火而復真陰陰既復其位則皮里之寒自消矣內經云陰平陽祕精神乃治如過用之則故病未已新病復起矣此豫之意也上龜扳黃柏例嘗治一老人痿厥纍用虎潛丸不愈後於虎潛丸加附子立愈如神蓋附反佐之功也本治後生丈夫酒色過多下焦虛憊足膝軟乏小便滑數外腎濕癢菟絲子五兩依法研石蓮肉二兩白茯苓一兩山藥茴香各二兩五味子五兩上為末糊丸如桐子大每服四十丸溫酒或鹽湯下空心服如腳氣及腳膝無力者木瓜酒空心下五十丸晚食前再服立效丹鄭安人年六十虛而有痰脈緩足弱與半夏天麻白朮湯下酒芩丸愈東陽吳子萬年五十形肥味厚且多憂怒脈常沉澀自春來痰氣病醫認為虛寒率與燥熱香竄之劑至四月兩足弱氣上衝飲食減召豫治之豫曰此熱鬱而脾虛痿厥之證作矣形肥而脈沉未是死證但藥邪火盛當此火旺實難求生且與竹瀝下白朮膏盡二斤氣降食進一月後大汗而死書此以為諸賢覆轍之戒云垣黃耆人參湯治夏天氣熱盛損傷元氣兩腳痿軟清燥湯治六七月濕令大行濕熱相合痿厥病作腰以下痿軟癱瘓不能行動以上二方並見痿注夏條仲越婢加朮湯治肉極熱則身體津脫腠理開汗大泄厲風氣下焦腳弱成無己云外臺作越婢湯麻黃六兩石膏半斤生薑甘草各二兩白朮四兩大棗十五枚上六味以水六升先煮麻黃去上沫納諸藥煮取三升分溫三服如惡風加附子一枚炮鬥治腳軟用商陸根細切如小豆大煮令熟更入緑豆同爛煮為飯每日煮食以瘥為度其功最效本治筋骨諸疾手足不遂行動不得遍身風瘡左經丸草烏白大者去皮臍木鱉去殼白膠香五靈脂以上各二兩半斑蝥五個去頭足翅醋炙上為末用黑豆去皮生杵取粉一升醋糊共搜杵為丸如雞頭大每服一丸溫酒磨下治筋骨疾但未曾針傷損者三五服立效此藥曾醫一人軟風不能行不十日立效專治心腎肝三經通小便除淋瀝通營衛滑經絡此方因淨聖寺僧得之大有奇功治兩腳軟弱虛羸無力及小兒不能行續骨丹天麻明淨者酒浸白附子牛膝木鱉子各半兩烏頭一錢炮川羌活半兩地龍去土一分乳香沒藥各二錢硃砂一錢上以生南星末一兩無灰酒煮糊為丸如雞頭大硃砂為衣薄荷湯磨一丸食前服丹人參酒浸服之治風軟腳弱可逐奔馬故曰奔馬草曾用有效運氣痿厥皆屬水虛經云水不及曰涸流涸流之紀其病痿厥堅下是也針灸痿厥有五法其一取腎經云腎足少陰之脈所生病者痿厥嗜臥足下熱而痛視盛虛熱寒陷下調之也其二補膀胱與肝經云邪之所在皆為不足下氣不足則為之痿厥心悗補足外踝下留之又云刺大指間上二寸留之是神申脈太衝二穴是也其三補足陽明絡經云足陽明之別名曰豐隆去踝八寸別走太陰其病虛則足不收脛枯取之所別也其四補足少陽絡經云足少陽之別名曰光明去踝五寸別走厥陰虛則痿躄坐不能起取之所別也其五束縛四末經云痿厥為四末束悗乃疾解之日二不仁者十日而知無休病已是也兩足癱瘓兩腿無力鶴頂在膝蓋骨尖上灸七次撮腳弱無力行步艱難太衝厲兌補灸風市灸玉又法太衝五分瀉八吸忌灸中封五分瀉八吸三里一寸瀉十吸集又法公孫灸半寸三里絶骨申脈不已取下穴崑崙陽輔甲痿厥風頭重額痛髀樞股腨外廉骨節痛瘛瘲痹不仁振寒時有熱四肢不舉跗陽主之痿厥寒足腕不收躄坐不能起髀樞腳痛丘墟主之足不收痛不可以行天泉主之足陽明之下血氣皆少則下毛無有則稀枯瘁善痿厥足痹全文見虛實法下毛陰毛也脾脈緩緩甚為痿厥全文見治虛實法腳氣衝心為厥逆丹腳氣衝心宜四物湯加炒柏再宜湧泉穴用附子末津唾調敷上以艾灸泄引其熱下行仲八味丸治腳氣上攻入少腹不仁方見治虛實法本草載唐柳宗元腳氣方方論俱見前積塊條腳氣衝心用白檳榔一個如雞心大者為末用童便生薑汁溫酒共半盞調作一服廣利方不用薑汁酒但用童便五合調服日再服治衝心悶亂不知人外若腳氣非冷非熱老人弱人脹滿者檳榔為末以檳榔殼汁或茶飲或豉汁調服方寸匕甚利上檳榔童便例活三脘敝治腳氣衝心腹氣飽悶大便祕滯者最良獨活一兩白朮木瓜焙乾一兩甘草炙半兩大腹皮一兩炙黃紫蘇一兩陳皮湯侵去白三分沉香木香川芎檳榔麵裹煨熟各七錢半上同一處杵為粗散每服二錢半水二盞同煎至一盞去渣分三服熱服取便利為效大腹子散治風毒腳氣肢節煩疼心神壅悶大腹子紫蘇木通桑白皮羌活木瓜荊芥赤芍藥青皮獨活各一兩枳殼一兩上㕮咀每服四錢水一盞姜五片蔥白七寸去渣空心溫服上檳榔紫蘇例桑白皮散治腳氣盛發兩腳浮腫小便赤澀腹脅脹滿氣急坐臥不得桑白皮郁李仁各一兩赤茯苓二兩木香防己大腹子各一兩半紫蘇子木通檳榔青皮各七錢半上㕮咀每服三錢姜三片水煎薏菽仁散治腳氣弱痹腫滿心下急大便澀薏苡仁防風豬苓川芎防己郁李仁檳榔大麻仁各一兩枳實七錢桑白皮二兩甘草半兩羚羊角屑一兩上為細末每服二錢熟水調下韋宙療腳氣浮腫心腹滿大小便不通氣急喘息者以郁李仁十二分搗碎水研取汁薏苡仁搗碎如粟米取三合以米作粥空腹食之佳上檳榔郁李仁防己例仲礬石湯治腳氣衝心用礬石二兩以漿水一斗五升煎三五沸浸腳食理腳腫滿轉上入腹殺人赤小豆一升水五升煮令極熟去豆適寒溫浸腳冷重暖之廣治腳氣衝心煩悶亂不識人大豆一升水三升濃煎取汁頓服半升如未定可更服孫主腳氣及上氣取鯽魚一尺長者作鱠食一兩頓服瘥素帝曰願聞六經之厥狀病能也岐伯曰巨陽之厥則腫首頭重足不能行發為眴僕陽明之厥則癲疾欲走呼腹滿不得臥面赤而熱妄見妄言少腸之厥則暴聾頰腫而熱脅痛胻不可以運甲乙經云厥四逆喘氣滿臨泣主之太陰之厥則腹滿䐜脹後不利不欲食食則嘔不得臥少陰之厥則口乾溺赤腹滿心痛厥陰之厥則少腹腫痛腹脹涇溲不利好臥屈膝陰縮腫胻內熱甚則瀉之虛則補之不盛不虛以經取之太陰厥逆胻急攣心痛引腹治主病者王注云候其有過者當發取之故言治主病者少陰厥逆虛滿嘔變下泄清治主病者厥陰厥逆攣腰痛虛滿前閉譫語治主病者三陰俱逆不得前後使人手足寒三日死太陽厥逆僵仆嘔血善衄治主病者少陽厥逆機關不利機關不利者腰不可以行項不可以顧發腸癰不可治驚者死陽明厥逆喘咳身熱善驚衄嘔血手太陰厥逆虛滿而咳善嘔沫治主病者手心主少陰厥逆心痛引喉身熱死不可治手太陽厥逆耳聾泣出項不可以顧腰不可以俯仰治主病者手陽明少陽厥逆發喉痹嗌腫痓治主病者厥論靈厥逆腹脹滿腸鳴胸滿不得息取之下胸二脅咳而動手者與背俞以手按之立快者是也癲狂篇厥痹者厥氣上及腹取陰陽之絡視主病者瀉陽補陰經也寒熱篇産腳氣大産後熱悶氣上轉而腳氣其狀熱悶掣瘈驚悸心煩嘔吐氣上皆其候也可服小續命湯二三劑必愈又云寒中三陽所患必冷小續命加生薑汁最快暑中三陰所患必熱小續命湯去附子減桂心一半大煩躁者紫雪最良如無紫雪用真薄荷煎冷水嚼下諸方必與四物湯各半服之
