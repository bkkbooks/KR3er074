body:
  text: 卷之三陰陽臟腑部治法通論垣醫之可法自伏羲神農黃帝而下名醫雖多可法者有數人至於華氏之剖腹王氏之針法術非不神也後人安得而效之非若岐伯之聖經雷公之炮炙伊摯之湯液箕子之五行越人之問難仲景之傷寒論叔和之脈訣士安之甲乙啓玄子之述作錢仲陽之議論潔古之方書皆活法所可學者豈千方萬論印定後人眼目者所能比哉其間德高行遠奇人異士與夫居縉紳隱草莽者雖有一法一節之可觀非百世可行之活法皆不取也豫豈好辨哉欲使學者觀此數聖賢而知所向慕而已或有人焉徒欲廣覽泛涉自以為多學而用之無益者豈為知本海錢氏活人王朝奉王德孚所論皆宋人易老守真皆金人所用之劑寒熱之不同者蓋本諸此讀此數書而用之亦當以地方世代所宜責之然莫若取法於潔古折衷於仲景湯液則萬世不易之大法也素邪風之至疾如風雨故善治者治皮毛其次治肌膚其次治筋脈其次治六腑其次治五臟治五臟者半死半生也病之始起也可刺而已其盛可待衰而已故因其輕而揚之因其重而減之因其衰而彰之形不足者溫之以氣精不足者補之以味其高者因而越之其下者引而竭之中滿者瀉之於內其有邪者漬形以為汗其在皮者汗而發之其慓悍者按而收之其實者散而瀉之審其陰陽以別柔剛陽病治陰陰病治陽定其血氣各守其鄉血實宜決之氣虛宜掣引之並見陰陽應象論仲大法春宜吐夏宜汗秋宜下冬宜溫及灸海病在天之無形當汗病在天之有形當吐病在地之無形當利小便病在地之有形當利大便脈夫欲治病當先知其證何起乃可攻之耳垣假令治病無問傷寒蓄血結胸發黃等諸證並一切雜證等各當於六經中求責之如發黃症或頭痛腰脊強惡寒即有太陽證或身熱目痛鼻乾不得臥即有陽明證余仿此不獨六經中求責五臟求責尤急務也假令面青脈弦善怒淋溲便難轉筋即有肝證也或面赤脈洪善笑口乾身熱煩心心痛掌中熱而啘即有心證也余仿此丹治病必求其本病之有本猶草木之有根也去葉不去根草猶在也治病猶去草病在臟而治腑病在表而攻裡非惟戕賊胃氣抑且資助病邪醫云乎哉一法治瘧積下痢吐痰而愈一法治汙血哽噎用韭汁開汙血而愈一法治下疳瘡自痢用龍薈丸柴胡湯而愈其詳分見各門海治病必求其本假令腹痛桂枝加芍藥大實痛桂枝加大黃何為不只用芍藥大黃等而於桂枝內加之要從太陽中來以太陽為本也又如結胸證自高而下脈浮者不可下故先用麻黃湯解表表已脈沉後以陷胸湯下之是亦求其本也至於蓄血下焦血結膀胱是從太陽中來侵盡無形之氣乃侵膀胱中有形血也素先病而後逆者治其本先逆而後病者治其本先寒而後生病者治其本先病而後生寒者治其本先熱而後生病者治其本先熱而後生中滿者治其標先病而後泄者治其本先泄而後生他病者治其本必且調之乃治其他病先病而後生中滿者治其標先中滿而後煩心者治其本人有客氣有同氣小大不利治其標小大利治其本病發而有餘本而標之先治其本後治其標病發而不足標而本之先治其標後治其本謹察間甚以意調之間者並行甚者獨行先小大不利而後生病者治其本標本病傳論仲夫病痼疾加以卒病當先治其卒病後乃治其痼疾也海初治之道法當峻猛者謂所用藥勢疾痢猛峻也緣病得之新暴感雖輕得之重皆宜以疾痢之劑急去之中治之道法當寬猛相濟為病得之非新非久宜以緩疾得中之藥養正去邪相濟而治之假令如見邪氣多正氣少宜以去邪藥多養正藥少凡加減法如此之類更宜臨證消息增減用之仍依時令行之無妄也更加針灸其病即愈末治之道法宜寬緩寬者察藥性平和緩者廣服無毒以養氣血安中蓋為病證已久邪氣伏潛至深而正氣微少故以善藥廣服養正氣而邪氣自去更加針灸其效必速治病之道有五法和取從折屬也一治各有五五五二十五如火之屬衰於戌金之屬衰於辰是也一治曰和假令小熱之病當以涼藥和之和之不已次用取二治曰取為熱勢稍大當以寒藥取之取之不已又用從三治曰從為勢已甚當以溫藥從之為藥氣溫也味隨所用或以寒因熱用或以熱因寒用或以汗發之發之不已又用折四治曰折為病勢極甚當以逆制之制之不已當以下奪之下奪之不已又用屬五治曰屬為求其屬以衰之緣熱深陷在骨髓間無法可出針藥取之不能及故求其屬以衰之求屬之法同聲相應同氣相求經曰陷下者衰之夫衰熱氣之法同前所云火衰於戌金衰於辰之類是也如或又不已當廣其法而治之譬孫子之用兵若在山谷則塞淵泉有水則把渡口在平川廣野當清野千里塞淵泉者刺腧穴把渡口者奪病發時前清野千里者如肌羸瘦弱宜廣服大藥以養正氣夫病有中外治有緩急在內者以內治法和之在外者以外治法和之氣微不和以調氣法調之其次大者以平氣法平之盛甚不已則奪其氣令其衰也故經曰調氣之方必別陰陽定其中外各守其鄉內者內治外者外治微者調治其次平治盛者奪之汗之下之寒熱溫涼衰之以屬隨其攸利難臟病難治腑病易治何謂也然臟病所以難治者傳其勝也腑病易治者傳其子也與七傳間臟同法也海脈之不病其神不言當自有也脈之即病當求其中神之有與無焉謂如六數七極熱也脈中有力即有神也三遲二敗寒也脈中有力即有神也熱則有神也當泄其熱則神在焉寒則有神也當去其寒則神在焉寒熱之脈無力無神將何藥以泄熱去寒乎苟不知此而遽泄去之將何依以生所以十亡八九素形樂志苦病生於脈治之以灸刺形樂志樂病生於肉治之以針石形苦志樂病生於筋治之以尉引形苦志苦病生於咽嗌治之以百藥形數驚恐經絡不通病生於不仁治之以按摩醪藥是謂五形志也血氣形志篇海緩急辨經云治主以緩治客以急所當知也諸有表證當汗脈浮急汗之脈沉緩汗之諸有里證當下脈浮緩下之脈沉急下之三陽汗當急而下當緩三陰汗當緩而下當急主為病則緩去之客為病則急去之胸中氣病自病也為主治當緩胸中血病他病也為客治當急上無形下入腹中即為客也治當急下有形上入胸中即為主也治當緩歲之六氣主也司天在泉間氣客也補上治上制以緩不犯血藥便謂之緩非緩慢之緩也補下治下制以急不犯氣藥便謂之急非急速之急也熱在至高之分故用輕劑從高而按治從緩也若急服之上熱未退而中寒復生矣若入有形當下之者從其急從其急者從其權也大腸滑泄治以收之服藥當以一物壓之欲其及於下部也故服在空心食前若在食後非徒無益而又害之此謂治之緩也近者奇之先急而後緩遠者偶之先急而後緩下者奇之先緩而後急汗者偶之先緩而後急靈樞奇偶汗從九地之下下從九地之上東垣諸病四時用藥之法不問所病或溫或涼或熱或寒如春時有疾於所用藥內加清涼風藥夏月有疾加大寒之藥秋月有疾加溫氣藥冬月有疾加大熱藥是不絶生化之源也錢仲陽醫小兒深得此理內經曰必先歲氣無伐天和是為至治又曰無違時無伐化又曰無伐生生之氣此皆常道也用藥之法若反其常道而變生異證則當從權施治假令病人飲酒或過食寒或過食熱皆可以增疾如此以權衡應變治之權變之藥豈可常用乎權變之藥於時禁藥禁有不暇顧者矣故不可輕用丹愚閲張子和書惟務攻擊其意以正氣不能自病因為邪所客所以為病也邪去正氣自安因病有在上中下深淺之不同立為吐汗下三法以攻之初看其書將謂醫之法盡於是矣復因思內經有言謂之虛者精氣虛也謂之實者邪氣實也夫邪所客必因正氣之虛然後邪得而客之苟正氣實邪無自入之理由是於子和之書不得不致疑於其間又思內經有言陰平陽祕精神乃治陰陽離決精氣乃絶又思仲景有言病當汗解診其尺脈澀當與黃耆建中湯補之然後汗之於是知張子和之書非子和之筆也子和馳名中土其法必有過於同輩者何其書之所言與內經仲景之意若是之不同也於是決意於得明師以為之依歸發其茅塞遂遊江湖但聞某處有某醫便往而拜問之連經數郡無一人焉後到真定始得原病式東垣藁乃大悟子和之孟浪然終未得的然之議論將謂江浙間無可為師者泰定乙丑夏始得聞羅太無於陳芝岩之言遂往拜之蒙叱罵者五七次趦趄二閲月始得降接因觀羅先生治一病僧黃瘦倦怠羅詢其病因乃蜀人出家時其母在堂又遊浙右經七年忽一日念母之心不可遏欲歸無腰纏徒爾昕夕西望而泣以是得病時僧二十五歲羅令隔壁宿泊每日以牛肉豬肚甘肥等煮糜爛與之凡經半月餘且時以慰論之言勞之又曰我與銀拾錠作路費我不望報但欲救汝之死命耳察其形稍蘇脈稍充與桃仁承氣一日三帖下之皆是血塊痰積方止次日乃與熟菜稀粥將息又半月其人遂如舊又半月餘與銀遂行因大悟攻擊之法必其人充實稟受素壯乃可行也否則邪去而正氣傷小病必重重病必死羅每日有求醫者必令某診視其脈狀回稟羅但臥聽口授用某藥治某病以某藥監某藥以某藥為引經往來一年半並無一定之方至於一方之中有攻補兼施者亦有先攻後補者有先補後攻者又大悟用古方治今病焉能吻合隨時取中此之謂歟其時羅又言用古方治今病正如拆舊屋補湊新屋其材木非一一再經匠氏之手其可用乎由是又思許學士發微論曰豫讀仲景書用仲景法然未嘗守仲景之方乃為得仲景之心也遂取東垣方稿手自抄録乃悟治病人當如漢高祖繼暴秦周武王繼商之後自非散財發粟與三章之法其受傷之氣倦憊之人何由而平復也於是知陰易乏陽易亢攻擊宜審正氣須保護以局方為懲戒哉海藏許先生論梁寬父症右脅肺部也咳而吐血舉動喘逆者肺診也發熱脈數不能食者火來刑金肺與脾俱虛也肺與脾俱虛而火乘之其病為逆如此者例不可補瀉蓋補金則慮金與火持而喘咳益增瀉火則慮火不退位而痃癖反盛止宜補中益氣湯先扶元氣少以治病藥和之聞已用藥而未獲效必病勢苦逆而藥力未到也當與寬父熟論遠期秋涼庶可平復蓋肺病者惡春夏火氣至秋冬則退正宜於益氣湯中隨四時陰陽升降浮沉溫涼寒熱及見有症增損服之升降浮沉則順之溫涼寒熱則反之順其理和其氣為治之大方也或覺氣壅間與加減枳朮丸或有飲間服局方枳朮湯數月後庶逆氣少回逆氣回則治法可施但恐已至色青色赤脈弦脈洪則無及矣近世論醫有主河間劉氏者有主易州張氏者張氏用藥依準四時陰陽升降而增損之正內經四氣調神之義醫而不知此是妄行也劉氏用藥務在推陳致新不使少有怫鬱正造化新新不停之意醫而不知此是無術也然主張氏者或未盡張氏之妙則瞑眩之劑終莫敢投至失幾後時而不救者多矣主劉氏者或未極劉氏之妙則取效目前陰損正氣遺害後日者多矣能用二子之長而無二子之弊其庶幾乎史副使病不見色脈不能懸料以既愈復發言之則恐亦宜取張氏依準四時陰陽升降用藥以扶元氣庶他日既愈而不發也寬父病後初感必深所傷物恐當時消導不盡停滯淹延變生他症以至於今恐亦宜效劉氏推陳致新之法少加消導藥於益氣湯中庶可以取效也倒倉法丹溪倒倉論經曰腸胃為市以其無物不有而谷最為多故謂之倉若積穀之室也倒者傾去舊積而滌濯使之潔淨也胃居中屬土喜容受而不能自運者也人之飲食遇適口之物寧無過量而傷積者乎七情之偏五味之厚寧無傷於沖和之德乎糟粕之餘停痰瘀血互相糾纏日積月深鬱結成聚甚如桃核之穰諸般奇形之蟲中宮不清矣土德不和矣誠於中形於外發為癱瘓為癆瘵為蠱脹為癩疾為無名奇病先哲製為萬病丸溫白丸等劑攻補兼施寒熱並用期中病情非不功巧然不若倒倉之為便捷者也以黃牡牛擇肥者買一二十斤長流水煮爛融入湯中為液以綿濾出渣滓取淨汁再入鍋中文武火熬至琥珀色則成矣每飲一鍾少時又飲如此者積數十鍾寒月則重湯溫而飲之病在上者欲其吐多病在下者欲其利多病在中者欲其吐下俱多全在活法而為之緩急多寡也須先置一室明快而不通風者以安病人視所出之物可盡病根則止吐利後或渴不得飲湯其小便必長取以飲病者名曰輪回酒與一二碗非惟可以止渴抑且可以滌濯余垢睡一二日覺肌甚乃與粥淡食之待三日後始與小菜羹自養半月覺精神渙發形體輕健沉疴悉安矣其後須五年忌食牛肉吾師許文懿公始病心痛用熱燥香辛如丁附桂薑輩治數年而足攣痛甚且惡寒而多嘔甚而至於靈砂墨錫黃芽穢丹繼之艾火十餘萬又雜治數年而痛益甚自度為廢人矣衆工亦技窮矣如此者又數年困甚煩渴惡食者一月已服通聖散半月餘而大腑逼迫後重肛門熱氣如燒始時下積滯如五色爛錦者又如桕燭油膩者近半月而病似退減又半月而略思谷唯兩足難移計無所出至次年三月遂作此法節節如應因得為全人次年再得一男又十四年而壽終又一婦人久年腳氣吐利而安又臨海林兄患久嗽吐血發熱消瘦衆以瘵治之百方不應召豫視之脈兩手弦數日輕夜重計無所出亦因此而安時冬十月也第三年得一子又鎮守百戶蕭伯善公以便濁而精不禁親與試之有效夫牛坤土也黃土之色也以順為德而效法乎健以為功者牡之用也肉者胃之樂也熟而為液無形之物也橫散入肉經由腸胃而滲透膚腠毛竅爪甲無不入也積聚久則形質成依附腸胃回薄曲折處以為棲泊之窠臼阻礙津液氣血熏蒸燔灼成病自非倒腸刮骨之神妙孰能去之又豈以合勺銖兩之丸散所能窺犯其藩牆戶牖乎切詳肉液之散溢腸胃受之其厚皆倍於前有似乎腫其回薄曲折處非復向日之舊肉液充滿流行有如洪水泛漲其浮莝陳朽皆推逐蕩漾順流而下不可停留表者因吐而汗清道者自吐而湧濁道者自泄而去凡屬滯礙一洗而空牛肉全重厚和順之性盎然渙然潤澤枯稿補益虛損寧無精神渙發之樂乎正似武王克商之後散財發粟以賑殷民之望也其方出於西域之至人於中年後可行一二次亦卻疾養壽之一助也與戴肅齋書倒倉法非敢吝也志於學者不多也然患者往往狃於苟安而靠後功夫全藉自飲輪回酒十餘杯以祛逐余垢迎接調勻新布榮衛使臟腑肓膜生意敷暢有脫胎換骨之功者也多嫌其穢而不肯吃若非明物理通造化者其肯視為美醞良藥乎前日相見時失議此一節蓋有數人曾因此成中輟者寧不功虧一簣徒爾跋涉且是暴殄天物敢此詳告又中間飲到七八鍾後藥力經涉經絡骨節中搜逐宿垢正邪寧不抵牾必有急悶似痛非痛有一段惡況此皆好消息邪不勝正將就擒耳尤須忍耐而受又於欲吐未吐欲泄未泄或吐瀉交作時自有惱聒意思皆須歡喜樂受一聽醫者以靜待之況此等又有大半日景象必先説知使方寸瞭然庶臨時可以安守也倒倉治癰勞蠱癩等症推陳致新扶虛補損可吐可下用黃色肥牯牛腿精肉二十斤順取急長流水於大鍋內煮候水耗少再添湯不可添冷水以肉爛成渣為度濾去渣用肉湯再熬如琥珀色隔宿不吃晚飯如大便祕者隔宿服神功丸不祕者不用五更以密室不通風處溫服一鍾候膈間藥行又服陸續至七八鍾如病人不欲服強再與之必身體皮膚間皆痛方見吐下如病在上欲吐多者須緊服又不可太緊恐其不納病在下欲利多者須疏服又不可太疏恐其下遠臨時消息大抵先見下方可使吐須極吐下使其上下積俱盡出大便中須見核桃肉狀無臭氣則止得睡覺氣定與吃還魂酒一二鍾即病人溲溺也粥食將息無有不愈未行此法前一月不可近婦人已行此法後半年不可近婦人三年不吃牛肉如性急好色不守禁忌者不可行此法也倒倉全在初三鐘慢飲最緊要能行經隧中去藥性不同素厚味者為陰薄為陰之陽氣厚者為陽薄為陽之陰味厚則泄薄則通氣薄則發泄厚則發熱陰陽應象論東垣風升生味之薄者陰中之陽味薄則通防風升麻羌活柴胡葛根威靈仙細辛獨活白芷桔梗黍黏子藁本川芎蔓荊子秦艽天麻麻黃荊芥薄荷前胡熱浮長氣之厚者陽中之陽氣厚則發熱附子烏頭乾薑生薑良薑肉桂桂枝草豆蔻丁香厚朴木香益智白豆蔻川椒吳茱萸茴香玄胡索縮砂紅花神麯濕化成其兼氣味氣溫涼寒熱在人則以胃應之味甘辛鹹苦在人則以脾應之黃耆人參甘草當歸熟地半夏蒼朮白朮陳皮青皮藿香檳榔莪朮三稜阿膠訶子杏仁麥芽桃仁紫草蘇木燥降收氣之薄者陽中之陰氣薄則發泄茯苓澤瀉豬苓滑石瞿麥車前子木通燈草五味子桑白皮犀角白芍藥天門冬烏梅牡丹皮地骨皮枳殼琥珀連翹枳實麥門冬寒沉藏味之厚者陰中之陰味厚則泄大黃黃柏黃芩黃連石膏草龍膽生地黃知母防己茵陳牡蠣栝蔞根朴硝玄參山梔川楝子香豉地榆脾不主時於四季末各旺一十八日乃坤土也生化一十一藏受胃之稟乃能生化天有陰陽溫涼寒熱四氣是也溫熱者天之陽也寒涼者天之陰也地有陰陽辛甘淡酸苦鹹六味是也辛甘淡地之陽也酸苦鹹地之陰也輕清成象味薄細茶之類本乎天者親上重濁成形味厚大黃之類本乎地者親下味之薄者為陰中之陽味薄則通酸苦鹹平是也味之厚者為陰中之陰味厚則泄酸苦鹹寒是也氣之厚者為陽中之陽氣厚則發熱辛甘溫熱是也氣之薄者為陽中之陰氣薄則發泄辛甘淡平涼寒是也清陽發腠理清之清者也清陽實四肢清之濁者也濁陰歸六腑濁之濁者也濁陰走五臟濁之清者也粥淡陽中之陰所以利小便茶苦陰中之陽所以清眼目苦藥平升微寒平亦升甘辛藥平降甘寒瀉火苦寒瀉濕熱苦甘寒瀉血熱素壯火之氣衰少火之氣壯壯火食氣氣食少火壯火散氣少火生氣陰陽應象論壯火薑附之屬少火升麻葛根之屬帝曰五味陰陽之用如何岐伯曰辛甘發散為陽酸苦湧泄為陰鹹味湧泄為陰淡味滲泄為陽六者或收或散或緩或急或燥或潤或軟或堅以所利而行之調其氣使其平也至真要大論垣辛能散結潤燥苦能燥濕堅軟咸能軟堅酸能收緩收散甘能緩急淡能利竅五辣蒜辣心薑辣頰蔥辣鼻芥辣眼蓼辣舌素五味所入酸入肝辛入肺苦入心鹹入腎甘入脾是謂五入宣明五氣篇東垣引經藥太陽經手羌活足黃柏陽明經手白芷升麻足石膏少陽經手柴胡足青皮太陰經手桔梗足白芍藥少陰經手獨活足知母厥陰經手柴胡足青皮手太陰肺南星款冬花升麻桔梗山藥檀香粳米五味子白茯苓天門冬麥門冬阿膠桑白皮蔥白杏仁麻黃益智丁香白豆蔻砂仁檀香豆蔻為使知母梔子黃芩石膏足太陰脾草豆蔻茱萸砂仁人參益智為使防風當歸益智黃耆蒼朮白朮膠飴代赭石茯苓麻子甘草半夏通入手足太陰肺脾升麻芍藥木瓜藿香白芍藥玄胡索砂仁手陽明大腸升麻白芷麻子秦艽薤白白石脂砂仁白石脂為使肉豆蔻石膏足陽明胃丁香草豆蔻砂仁防風石膏知母白朮神麯葛根烏藥半夏蒼朮升麻白芷蔥白通入手足陽明麻黃酒大黃酒連翹升麻白朮葛根石膏檀香佐以他藥白芷手少陽三焦川芎大黃酒柴胡青皮白朮熟地黃耆地骨皮石膏細辛附子足少陽膽半夏草龍膽柴胡通入手足少陽青皮川芎柴胡連翹手厥陰心包絡沙參白朮柴胡熟地牡丹皮敗醬足厥陰肝草龍膽蔓荊子阿膠瞿麥桃仁山茱萸代赭石紫石英當歸甘草青皮羌活吳茱萸白朮通入手足厥陰青皮熟地柴胡川芎皂角苦茶桃仁手太陽小腸白朮生地黃羌活赤茯苓赤石脂砂仁赤石脂為使足太陽膀胱蔓荊子滑石茵陳白茯苓豬苓澤瀉桂枝黃柏羌活麻黃通入手足太陽防風羌活藁本蔓荊子茴香黃柏白朮澤瀉防己大黃酒手少陰心麻黃桂心當歸生地黃連代赭石紫石英梔子獨活赤茯苓足少陰腎知母黃柏地骨皮阿膠豬膚牡丹皮玄參敗醬牡蠣烏藥山茱萸天門冬豬苓澤瀉白茯苓檀香甘草五味子吳茱萸益智丁香獨活或用梢桔梗或用梢砂仁黃柏茯苓為使通入手足少陰細辛熟地五味子澤瀉地榆附子知母白朮命門附子沉香益智黃耆制方大法垣藥有寒熱溫涼之性酸苦辛咸甘淡之味各有所能不可不通也藥之氣味不比同類之物味皆咸其氣皆寒之類是也凡同氣之物必有諸味同味之物必有諸氣互相為用各有厚薄性用不等制其方者必宜明其為用經曰味為陰味厚為純陰味薄為陰中之陽氣為陽氣厚為純陽氣薄為陽中之陰味厚則泄薄即通氣薄則發泄厚則發熱又曰辛甘發散為陽酸苦湧泄為陰鹹味湧泄為陰淡味滲泄為陽凡此之味各有所能辛能散結潤燥苦能燥濕軟堅咸能軟堅酸能收緩收散甘能緩急淡能利竅若用其味必明其氣之可否若用其氣必明其味之所宜識其病之標本臟腑寒熱虛實微甚緩急而用其藥之氣味隨其症而制其方可也是故方有君臣佐使輕重緩急君臣大小反正逆從之制也主治病者為君佐君者為臣應臣者為使用此隨病之所宜而又贊成方而用之君一臣二奇之制也君二臣四偶之制也君二臣三奇之制也君二臣六偶之制也去咽嗌近者奇之遠者偶之汗者不奇下者不偶補上治上制之以緩補下治下制之以急急者氣味厚也緩者氣味薄也薄者少服而頻食厚者多服而頓食又當明五氣之郁木鬱達之謂吐令條達也火鬱發之謂汗令疏散也土鬱奪之謂下無壅滯也金鬱泄之謂解表泄小便也水鬱折之謂制其沖逆也通此五法乃治病之大要也素帝曰非調氣而得者治之奈何有毒無毒何先何後願聞其道岐伯曰有毒無毒所治為主適大小為制也帝曰請言其制岐伯曰君一臣二制之小也君一臣三佐五制之中也君一臣三佐九制之大也寒者熱之熱者寒之微者逆之甚者從之堅者削之客者除之勞者溫之結者散之留者攻之燥者濡之急者緩之散者收之損者益之逸者行之驚者平之上之下之摩之浴之薄之劫之開之發之適事為故帝曰何謂逆從岐伯曰逆者正治從者反治從少從多觀其事也帝曰反治何謂岐伯曰熱因寒用寒因熱用塞因塞用通因通用必伏其所主而先其所因其始則同其終則異可使破積可使潰堅可使氣和可使必已至真要大論下同此言內氣失調而得病之治法也帝曰氣調而得者何如岐伯曰逆之從之逆而從之從而逆之疏氣令調則其道也此言內氣本調因感外邪得病之治法也蓋內氣失調之病根本不固惟病邪微者可逆治之苟病邪甚者逆治之則病邪格拒必變危矣故反從其病勢而治之也如元氣本調之病根本堅固則不分微甚皆可逆從而治之也帝曰方制君臣何謂也岐伯曰主病之謂君佐君之謂臣應臣之謂使非上下三品之謂也帝曰三品何謂岐伯曰所以明善惡之殊貫也垣為君者最多為臣者次之佐者又次之藥之於症所主同者各等分凡藥之所用者皆以氣味為主補瀉在味隨時換氣主病者為君假令治風防風為君治上焦熱黃芩為君治中焦熱黃連為君治濕防己為君治寒附子之類為君兼見何症以佐使藥分治之此制方之要也如仲景治表虛制桂枝湯方桂枝味辛熱發散助陽體輕本乎天者親上故桂枝為君甘草芍藥為佐陽脈澀陰脈弦法當腹中急痛制小建中湯方芍藥味酸寒主收補中本乎地者親下故芍藥為君桂枝甘草佐之一則治表虛一則治裡虛各言其所主用也後之用古方者觸類而長之庶不至差誤矣凡解利傷風以防風為君甘草白朮為佐經云辛甘發散為陽風宜辛散防風味甘辛又治風通用故防風為君甘草白朮為佐凡解利傷寒以甘草為君防風白朮為佐是寒宜甘發也或有別症於前隨症治病藥內選用其分兩以君臣論凡眼暴熱赤腫以防風黃芩為君以瀉火以黃連當歸根和血為佐兼以各經藥用之凡眼久病昏暗以熟地黃當歸根為君以羌活防風為臣甘菊甘草之類為佐凡痢疾腹痛以白芍藥甘草為君當歸白朮為佐見血先後以三焦熱論凡水瀉茯苓白朮為君芍藥甘草為佐凡諸風以防風為君隨症治病藥為佐凡嗽以五味子為君有痰者以半夏為佐喘者以阿膠為佐有熱無熱以黃芩為佐但分兩多寡不同耳凡小便不利黃柏知母為君茯苓澤瀉為佐凡下焦有濕草龍膽防風為君甘草黃柏為佐凡痔漏以蒼朮防風為君甘草芍藥為佐詳別症加減凡諸瘡以黃連當歸為君甘草黃芩為佐凡瘧以柴胡為君隨所發時所屬經分用引經藥佐之以上皆用藥之大要更詳諸病症於後隨症治病藥內逐一加減用之隨症用藥仲夫諸病在臟欲攻之當隨其所得而攻之如渴者與豬苓湯余皆仿此垣頭痛須用川芎如不愈各加引經藥太陽川芎陽明白芷太陰蒼朮少陰細辛少陽柴胡厥陰吳茱萸頂巔痛須用藁本去川芎一本作項頸腦痛肢節痛須用羌活去風濕亦宜用之腹痛須用芍藥惡寒而痛者加桂惡熱而痛者加黃柏心下痞用枳實黃連肌熱及去痰者須用黃芩肌熱亦用黃耆腹脹用薑製厚朴虛熱須用黃耆止虛汗亦用脅下痛往來寒熱日晡潮熱須用柴胡脾胃受濕沉困無力怠墮好臥去痰用白朮破滯氣用枳殼高者用之夫枳殼者損胸中至高之氣三二服而已破滯血用桃仁蘇木補血不足須用甘草去痰須用半夏熱痰加黃芩風痰加南星胸中寒痰痞塞用陳皮白朮多用苦寒則瀉脾胃腹中窄狹須用蒼朮調氣須用木香補氣須用人參和血須用當歸凡血受病者皆當用當歸也去下焦濕腫及痛並膀胱有火邪者必須酒洗防己草龍膽黃柏知母去上焦濕及熱須用黃芩瀉肺火故也去中焦濕熱與痛用黃連瀉心火故也去滯氣用青皮勿多服多服則瀉人真氣渴者用乾葛茯苓禁半夏嗽者用五味子喘者用阿膠宿食不消用黃連枳實胸中煩熱須用梔子仁水瀉須用白朮茯苓芍藥氣刺痛用枳實看何部分以引經藥導使之行則可血刺痛用當歸詳上下用根梢瘡痛不可忍者用苦寒藥如黃柏黃芩詳上下根梢用及引經藥則可眼痛不可忍者用黃連當歸根以酒浸煎小便黃者用黃柏數者澀者或加澤瀉腹中實痛兼熱用大黃芒硝小腹痛用青皮莖中痛用生甘草梢飲水多致傷者用白朮茯苓豬苓胃脘痛用草豆蔻凡用純寒純熱藥必用甘草以緩其力也寒熱相雜亦用甘草調和其性也中滿禁用經曰中滿者勿食甘潔古非白朮不能去濕非枳實不能消痞非天雄不能補上焦陽之虛非附子不能補下焦陰之虛垣如脈緩怠惰嗜臥四肢不收或大便泄瀉此濕勝從平胃散若脈弦氣弱自汗四肢發熱或大便泄瀉或皮毛枯稿發脫落從黃耆建中湯脈虛而血弱於四物湯中摘一味或二味以本顯症中加之或真氣虛弱及氣短脈弱從四君子湯或渴或小便祕澀赤黃多少從五苓散去桂摘一二味加正藥中假令表虛自汗春夏加黃耆秋冬加桂如腹中急縮或脈弦加防風急甚加甘草腹中窄狹或氣短者亦加之腹滿氣不轉者勿加雖氣不轉而脾胃中氣不和者勿去但加厚朴以破滯氣然亦不可多用於甘草五分中加一分可也腹中夯悶此非腹脹乃散而不收可加芍藥如肺氣短促或不足者加人參白芍中焦用白芍則於脾中升陽使肝膽之邪不敢犯也腹中窄狹及縮急者去之及諸酸澀藥不可用腹中疼痛者加甘草芍藥稼穡作甘甘者己也曲直作酸酸者甲也甲己化土此仲景妙法也腹痛兼發熱加黃芩惡寒或腹中覺寒加桂怠惰嗜臥有濕胃虛不能食或沉困或泄瀉加蒼朮自汗加白朮小便不利加茯苓渴亦加之氣弱者加白茯苓人參氣盛者加赤茯苓縮砂仁氣復不能轉運有熱者微加黃連心煩亂亦加之小便少者加豬苓澤瀉汗多津液竭於上勿加之是津液還入胃中欲自行也不渴而小便祕塞加炒黃柏知母小便澀者加炒滑石小便淋澀者加澤瀉且五苓散治渴而小便不利無惡寒者不得用桂不渴而小便自利妄見妄聞乃瘀血症用炒黃柏知母以除腎中燥熱竅不利而淋加澤瀉炒滑石只治竅不利者六乙散中加木通亦可心藏熱者用錢氏導赤散中滿或但腹脹者加厚朴氣不順加橘皮氣滯加青皮一橘皮三氣短小便利者四君子湯中去茯苓加黃耆以補之如腹中氣不轉者更加甘草一半腹中刺痛或周身刺痛者或裡急者腹中不寬快是也或虛坐而大便不得者皆血虛也血虛則裡急或血氣虛弱而目睛痛者皆加當歸身頭痛加川芎苦頭痛加細辛此少陰頭痛也發脫落及臍下痛者加熟地黃如皮毛肌肉之不伸無大熱不能食而渴者加葛根半兩燥熱及胃氣上衝為衝脈所逆或作逆氣而裡急者加炒黃柏知母覺胸熱而不渴加炒黃芩如胸中結滯氣澀或有熱者亦各加之如食少而小便少者津液不足也勿利之益氣補胃自行矣如氣弱氣短者加人參只升陽之劑助陽之勝多加參惡熱發熱而燥渴脈洪大者白虎湯主之或喘者加人參如渴不止寒水石石膏各等分少少與之即錢氏方中甘露散主身大熱而小便數或上飲下溲此燥熱也氣燥加白葵花血燥加赤葵花如小便行病增者此內燥津液不能停當致津液少加炒黃柏赤葵花如心下痞悶者加黃連一黃芩三減諸甘藥不能食心下軟而痞者甘草瀉心湯則愈痞有九種治有五方見仲景瀉心為的如喘滿者加炙厚朴小便不利者加之如利為禁藥如胃虛弱而痞者加甘草喘而小便不利者加苦葶藶如氣短氣弱而腹微滿者不去人參去甘草加厚朴然不若苦味泄之而不令大便行如腹微滿而氣不轉者加之如中滿者去甘草倍黃連加黃柏更加三味五苓散少許此病雖宜升宜汗如汁多亡陽加黃耆四肢煩熱肌熱與柴胡羌活升麻葛根甘草則愈如鼻清涕惡風或項背脊膂強痛羌活防風甘草等分黃耆倍加臨臥服之脈熱身熱加減法見發熱門禁服篇云約方猶約囊也囊滿弗約則輸泄方成弗約則神與氣弗俱未滿而知約之可以為工不可以為天下師此聖人所以退太過而進不及以平為期也大凡氣味者有毒無毒固宜常制矣是以大毒治病十去其六常毒治病十去其七小毒治病十去其八無毒治病十去其九余以穀肉菜果食養盡之無使過之傷其正也至如君一臣二奇之制也君二臣四偶之制也近而奇偶制小其服遠而奇偶制大其服大則數少小則數多多則九之少則二之補上治上制以緩補下治下制以急急則氣味厚緩則氣味薄下不以偶汗不以奇隨其邪之所在高下淺深輕重虛實影響無間萬舉萬全是謂中行故可為師也假如證大而湯劑小則邪氣少屈故藥力已乏欲不復治其可得乎猶一杯水救一輿薪之火火竟不滅是謂不及故不可以為師而可以為工矣證小則湯劑大而邪服邪已盡而藥餘力欲不傷正何所容哉猶火炎昆岡玉石俱焚莫之能止是謂太過此又不可以為工是為粗醫也三者之論惟中而已過與不及皆為偏廢然而太過猶甚於不及何以明之蓋失於姑息邪復勝正者止於勞而無益猶可勉而適中或失苛暴則血氣被傷因致羸替者有之危殘者有之滅亡者有之非徒無益而又害之此所謂猶甚也可不戒哉嘗考仲景之書於承氣湯下攻裡則曰若更衣止後服於桂枝方後發表乃云漐漐微汗益佳不可令如水淋漓皆本乎軒岐之微旨也仲言銼如麻頭與㕮咀同意夫㕮咀古之制也古者無鐵刃於口咬細令如麻頭為粗末煎之使藥水清飲於腹中則易升易散也此所謂㕮咀也今人以刀器銼如麻頭大此㕮咀之易成也若一概為細末不分清濁矣經云清陽發腠理濁陰走五臟果何謂也又曰清陽實四肢濁陰歸六腑㕮咀之藥取汁易行經絡故也若治至高之病加酒煎去濕以生薑補元氣以大棗發散風寒以蔥白去膈上痰以蜜細末者不循經絡止去胃中及臟腑之積氣味厚者白湯調氣味薄者煎之和渣服去下部之疾其丸極大而光且圓治中焦者次之治上焦者極小用稠麵糊取其遲化直至下焦或酒或醋取其收其散之意也如半夏南星欲去濕者以生薑汁稀糊為丸取其易化也水浸宿炊餅者易化滴水丸者又易化煉蜜丸者取其遲化而氣循經絡也蠟丸者取其難化而旋旋取效也大抵湯者蕩也去久病者用之散者散也去急病者用之丸者緩也不能速去之取用藥之舒緩而治之意也病在心上者先食而後藥病在心下者先藥而後食病在四肢者宜飢食而在旦病在骨髓者宜飽食而在夜古之方劑錙銖分兩與今不同云一升者今之大白盞也云銖者六銖為一分即二錢半也二十四銖為一兩也三兩者今之一兩二兩者今之六錢半也料例大者合三分之一足矣大黃恐寒則損胃氣須煨至於川烏附子須炮以製毒也黃柏知母下部藥也久弱之人須合用之酒浸曝乾恐寒傷胃氣也熟地黃酒洗亦然當歸酒浸助發散之意也垣至元庚辰六月許伯威年五十四中氣本弱病傷寒八九日醫者見其熱甚以涼藥下之又食梨三四枚痛傷脾胃四肢冷時發昏憒余診其脈動而中止有時自還乃結脈也心亦悸動吃噫不絶色變青黃精神減少目不欲開倦臥惡人語笑以炙甘草湯治之成無己云補可去弱人參大棗之甘以補不足之氣桂枝生薑之辛以益正氣五臟痿弱榮衛涸流濕劑所以潤之故用麻仁阿膠麥門冬地黃之甘潤經益血復脈通心是也加以人參桂枝急扶正氣生地黃減半恐傷陽氣銼一兩劑服之不效豫再候之脈證相對莫非藥有陳腐故不效乎再市藥之氣味厚者煎服其證減半再服而安凡藥之昆蟲草木産之有地根葉花實採之有時失其地則性味少異失其時則氣味不全又況新陳之不同精粗之不等倘不擇而用之其不效者醫之過也內經曰司歲備物氣味之精專也修合之際宜加謹焉病人服藥必擇人煎熬製度令親信恭誠至意者為之煎藥銚器除油垢腥穢必用新淨甜水為上量水多少斟酌以慢火煎熬分數用紗濾去渣取清汁服之無不效也
