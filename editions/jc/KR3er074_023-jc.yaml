body:
  text: 卷之二十三脾胃部泄瀉滯下潔論曰臟腑瀉利其證亦多大抵從風濕熱論之是知寒少熱多寒則不能久也故曰暴泄非陰久泄非陽論曰春宜緩形形緩動則肝木乃榮反靜密則是行秋令金能制木風氣內藏夏至則火盛而金去獨火木旺而脾土損矣輕則飧泄身熱脈洪谷不能化重則下利膿血稠黏裡急後重故曰諸泄稠黏皆屬於火經云溲而便膿血知氣行而血止也宜大黃湯下之是為重劑黃芩芍藥湯是為輕劑是實則瀉其子木能自虛而脾土實矣故經曰春傷於風夏為飧泄此逆四時之氣人所自為也此一節熱泄所謂滯下也有自太陰經脾受濕而為水泄虛滑微滿身重不知穀味假令春宜益黃散補之夏宜泄之法曰宜補宜泄宜和宜止和則芍藥湯止則訶子湯久則防變為膿血是脾經傳受於腎謂之賊邪故難愈也若先利而後瀉謂之微邪故易安此皆脾土受濕天之所為也雖聖智不能逃口食味鼻食氣從鼻而入留積於脾而為水泄也此一節濕泄所謂泄瀉也有厥陰經動下痢不止其脈沉而遲手足厥逆涕唾膿血此症難治宜麻黃湯小續命湯汗之法云為有表邪縮於內當散之而自愈此一節風泄所謂久泄也有暴下無聲身冷自汗小便清利大便不禁氣難布息脈微嘔吐急以重藥溫之漿水散是也此一節寒泄所謂暴泄也故法曰後重者宜下腹痛者宜和身重者宜除濕脈弦者去風膿血稠黏者以重藥竭之身冷自汗者以毒藥溫之風邪內縮者宜汗之則愈鶩溏為痢宜溫之而已又曰在表者發之在裡者下之在上者湧之在下者竭之身表熱者內疏之小便澀者分利之又曰盛者和之去者送之過者止之兵法曰避其來銳擊其惰歸此之謂也凡病泄而惡寒太陰傳少陰為土來剋水也用除濕白朮茯苓安脾芍藥桂皮黃連破血火邪不能勝水太陰經不能傳少陰而反助火邪上乘肺經而痢必白膿也加當歸芍藥之類是已又裡急後重脈大而洪實為裡實症而痛甚是有物結墜也宜下之若脈浮大甚不可下雖裡急後重脈沉細而弱者謂寒邪在內而氣散也可溫養而自安裡急後重閉者大腸氣不宣通也宜加檳榔木香宣通其氣若四肢慵倦小便少或不利大便走沉困飲食減少宜調胃去濕白朮芍藥茯苓三味水煎服白朮除脾胃之濕芍藥除胃之濕熱四肢困倦茯苓能通水道走濕如發熱惡寒腹不痛加黃芩為主如未見膿而惡寒乃太陰欲傳少陰也加黃連為主桂枝佐之如腹痛甚加當歸倍芍藥如見血加黃連為主桂枝當歸佐之如煩躁或先便白膿後血或發熱或惡寒非黃連不能止上部血也如惡寒脈沉先血後便非地榆不除下部血也如惡寒脈沉或腰痛或臍下痛非黃芩不除此中部血也如便膿血相雜而脈浮大慎勿以大黃下之下之必死謂氣下竭也而陽無所收凡陰陽不和惟以分陰陽之法治之又曰暴泄非陰久泄非陽有熱者脈疾身動聲亮暴注下迫此陽也寒者脈沉而細身困鼻息微者姜附湯主之身重不舉朮附湯主之渴引飲者是熱在膈上水多入則自胸膈入胃中胃本無熱因不勝其水胃受水攻故水穀一時下此症當灸大椎三五壯立愈乃督脈瀉也如用藥使車前子雷丸白朮茯苓之類五苓散亦可又有寒泄者大腹滿而泄又有鶩溏者是寒泄也鶩者鴨也大便如水其中有少結糞者是也如此者當用天麻附子乾薑之類又法曰泄有虛實寒熱虛則無力不及拈衣未便已泄出謂不能禁固也實則數至圊而不便俗云虛坐努責是也裡急後重皆依前法進退大承氣湯主之太陽病為挾熱痢涼膈散主之表症誤下因而下痢不止為挾熱利陽明為痼瘕進退大承氣湯主之太陰濕勝濡瀉不可下而可溫四逆湯主之少陰蟄風不動禁固可澀赤石脂丸乾薑湯主之厥陰風泄以風治宜小續命湯消風湯主之少陽風氣自動大柴胡湯主之保五泄傷寒乃分三部初說暴次說中後說久泄此說在難經五十七難是三節內該十五法初治以暴藥中以的對症藥得中治也末治久泄仲景論厥陰經治法是也垣胃氣和平飲食入胃精氣則輸於脾上歸於肺行於百脈而養榮衛也若飲食一傷起居不時損其胃氣則上升精華之氣反下降是為飧泄久則太陰傳少陰而為腸澼假令傷寒冷飲食䐜滿而脹傳為飧泄者宜溫熱之劑以消導之傷濕熱之物而成膿血者宜苦寒之劑以內疏之風邪下陷者升舉之濕氣內盛者分利之裡急者下之後重者調之腹痛者和之洞泄腸鳴無力不及拈衣其脈細微而弱者溫之收之膿血稠黏數至圊而不能便其脈洪大而有力者下之寒之大抵治病當求其所因察何氣之勝取相剋之藥平之隨其所利而利之以平為期此治之大法也諸瀉痢久不止或暴下者皆太陰受病不可離甘草芍藥若不受濕則不痢故須用白朮是以聖人立法若四時下痢於芍藥白朮內春加防風夏加黃芩秋加厚朴冬加桂附然更詳外證寒熱處之如裡急後重須加大黃如身困倦須用白朮若自汗逆冷氣息微加桂附以溫之如或後重膿血稠黏雖在盛冬於溫藥內亦加大黃難有胃泄有脾泄有大腸泄有小腸泄有大瘕泄名曰後重胃泄者飲食不化色黃飧泄也保命云承氣湯下之又有脾泄者腹脹滿泄注食即嘔吐逆保命云建中理中湯主之大腸泄者食已窘迫大便色白腸鳴切痛保命云乾薑附子湯主之小腸泄者溲而便膿血少腹痛保命云承氣湯下之大瘕泄者裡急後重數至圊而不能便莖中痛保命云胃小腸大腸三症皆清涼飲子主之其泄自止厥陰症莖中痛加甘草少陰症裡急後重加大黃此治五泄之法也丹泄瀉之症水穀或化或不化並無努責惟覺困倦若滯下則不然或膿或血或膿血相雜或腸垢或無糟粕或糟粕相雜雖有痛不痛之異然皆裡急後重逼迫惱人仲大腸有寒者多鶩溏有熱者便腸垢靈腸中寒則腸鳴飧泄腸中熱則出黃糜師傳篇仲下利脈微弱數者為欲自止雖發熱不死下利有微熱而渴脈弱者亦自愈下利脈數而渴者令自愈設不瘥必圊膿血以有熱故也下利脈數有微熱汗出令自愈設脈緊為未解下利脈反弦發熱身汗者自愈下利脈沉而遲其人面少赤身有微熱下利清穀者必鬱冒汗出而解病人必微厥所以然者其面戴陽下虛故也素胃脈虛則泄脈要精微論脈脈滑按之虛絕者其人必下痢肺脈小甚為泄全文見治虛實法經云小者氣血皆虛腎脈小甚為洞泄小者血氣皆少腎主閉藏今血氣虛少無以閉藏故泄素尺寒脈細謂之後泄平人氣象論尺膚寒其脈小者泄少氣全文見評虛實論仲下利脈沉弦者下重下利寸口反浮數尺中自澀者必圊膿溲病若腹大而泄者脈當細微而澀反緊大而滑者死脈泄注脈緩時小結者生浮大數者死素泄而脈大者難治玉機真藏論病泄脈洪大是逆也全文見診生死仲下利脈大者為不止下利日十餘行脈反實者死靈大便赤瓣飧泄脈小者手足寒難已飧泄脈小手足溫泄易已論疾診尺篇腹鳴而滿四肢清泄其脈大是逆也如是者不過十五日死矣全文見診生死腹大脹四末清脫形泄甚是逆也如是者不及一時死矣仲六腑氣絕於外者手足寒上氣腳縮五臟氣絕於內者利不禁下甚者手足不仁下利手足厥冷無脈者灸之不溫若脈不還反微喘者死少陰負跗陽者為順也下利後脈絕手足厥冷晬時脈還手足溫者生脈不還者死病者痿黃燥而不渴胸中寒而利不止者死假令下利寸口關上尺中悉不見脈然尺中時一小見脈再舉頭者腎氣也若見損脈來為難治丹下痢如魚腦者半死半生下痢如塵腐色者死純血者死下如屋漏者死下痢如竹筒注者不可治五虛者不治五虛者經云脈細皮寒氣少泄痢前後飲食不入此謂五虛五虛者死其漿粥入胃泄注止則虛者活予嘗治數人在下則泄瀉不止在上則吐痰不已者皆死證氣脫無所管攝故也若用參朮膏救之早者十活二三泄瀉下痢水穀不入裡急後重是泄瀉也世胃苓湯一名對金飲子治脾濕太過泄瀉不止平胃散五苓散各等分上銼水煎服極效羅內經曰濕勝則濡泄甲乙經云寒氣客於下焦傳為濡泄夫脾者五臟之至陰其性惡寒濕令寒濕之氣內客於脾故不能裨助胃氣腐熟水穀致清濁不分水入腸間虛莫能制故洞泄如水隨氣而下謂之濡泄法當除濕利小便也治之以對金飲子平胃散五錢五苓散二錢半草豆蔻麵裹煨熟半兩上相和作四服水一盞半生薑三片棗二枚煎至一盞去渣溫服食前垣加減平胃散治脾胃不和不思飲食心腹脅肋脹滿刺痛口苦無味胸滿短氣嘔噦噁心噫氣吞酸面色痿黃肌體瘦弱怠惰嗜臥體重節痛常多自痢或發霍亂及五噎八噫膈氣反胃等症厚朴去皮薑製炒三兩二錢蒼朮去粗皮米泔浸五兩陳皮三兩二錢甘草銼炒二兩上為細末每服二錢水一盞生薑三片棗二枚同煎至七分去渣溫服或去薑棗帶熱服空心食前入鹽一捻沸湯點服亦得常服調氣暖胃化宿食消痰飲闢風寒冷濕四時非常之氣如小便赤澀加白茯苓澤瀉如米穀不化飲食傷多加枳實如胃中氣不快心下痞氣加枳殼木香如脾胃困弱不思飲食加人參黃耆如心下痞悶腹脹者加厚朴甘草減半如遇夏加炒黃芩如遇雨水濕潤時加茯苓澤瀉如有痰涎加半夏陳皮凡加時除蒼朮厚朴依例加之如一服五錢有痰用半夏一兩如嗽飲食減少脈弦細加歸身黃耆如脈洪大緩加黃芩黃連如大便硬加大黃三錢芒硝二錢先嚼麩炒桃仁爛以藥送下海加減平胃散例若泄瀉脾濕加茯苓丁香白朮為調胃散一法加藿香半夏若加乾薑為厚朴湯若溫疫時氣二毒傷寒頭痛壯熱加連須蔥白五寸豆豉三十粒煎二三服取微汗出愈若五勞七傷腳手心熱煩躁不安百節痠疼加柴胡若痰嗽瘧痢加薑製半夏若小腸氣痛加茴香若水氣腫滿加桑白皮若婦人赤白帶下加黃耆若酒傷加丁香若飲冷傷加高良薑若滑脫泄瀉加肉豆蔻若風痰四肢沉困加荊芥若腿膝冷痛加牛膝若渾身虛腫拘急加地骨皮若腿膝濕痹加菟絲子若白痢加吳茱萸若赤痢加黃連若頭風加藁本若轉筋霍亂加樟木皮若七邪六極耳鳴夢泄盜汗四肢沉重腿膝痿婦人宮臟久冷月事不調者加桂枝若胃寒嘔吐多加生薑一法加茯苓丁香各三兩若氣不舒快中脘痞塞加砂仁香附三兩生薑煎服若與五苓散相半為對金飲子若與六一散相合為黃白散若與錢氏異功散相合為調胃散若飲食進退加神麯麥芽冬月加吳茱萸川椒乾薑桂為吳茱萸湯若加藁本桔梗為和解散治傷寒吐利若加藿香半夏為不換金正氣散若瘧疾寒熱者加柴胡若小腸氣痛者加苦楝茴香丹或曰平胃散之溫和可以補養胃氣吾子以為何如予曰蒼朮性燥氣烈行濕解表甚為有功厚朴性溫散氣非脹滿實急者不用承氣用之可見矣雖有陳皮甘草之甘緩甘辛亦是決烈耗散之劑實無補土之利經謂土氣太過曰敦阜亦能為病況胃為水穀之海多氣多血故因其病也用之以瀉有餘之氣使之平耳又須察其挾寒氣得寒物者而後投之胃氣和平便須卻藥謂之和平者初非補之之謂豈可以為補劑而常用之乎或曰謂胃承氣亦治胃病謂之調者似舉平胃之平意義相近何用藥之相遠也予曰調胃承氣治熱中下二焦藥也經云熱淫於內治之鹹寒佐以苦甘功在乎導利而行之以緩平胃散止治濕上焦藥也經曰濕上甚而熱治以苦溫佐以甘辛以汗為故而止或曰治濕不利小便非其治也此非仲景法耶何子言之悖也予曰淡滲治濕因有濕在中下二焦今濕在上宜以微汗而解不欲汗多故不用麻黃葛根輩耳五苓散治泄瀉水多者方見傷寒瀉濕四苓散加蒼朮白朮甚者二術必用炒白朮三分加至兩半澤瀉一兩茯苓豬苓蒼朮各五錢本治水瀉用草烏半生半燒灰存性為末醋丸空心井花水下七丸河益元散治身熱泄瀉小便不利滑石六兩甘草炙一兩上為末每服三錢蜜湯調下日三服如解寒發汗煎蔥白豆豉湯調下四錢並三服以效為度丹參萸丸治濕熱滯氣者濕熱甚者用為嚮導上可治吞酸下可治自利六一散七兩即益元散吳茱萸二兩煮過一方去茱萸加乾薑一兩名溫六丸本歐陽文忠公嘗得暴下國醫不能愈人云市人有此藥三文一帖甚效夫人買進之一服而愈後召賣藥者問其方但用車前子一味為末米飲下二錢匕此藥利水道丹黃芩木通入四苓散煎服治火多泄瀉水煮金花丸治泄不止乾嘔方見乾嘔而利門世木香和中丸腹痛泄瀉脈滑者神效累驗方見治虛實法仲下利脈遲而滑者實也利未欲止急下之宜大承氣湯方見傷寒下利脈反滑者當有所去下乃愈宜大承氣湯下利脈中堅者當下之下利後三部皆平按之心下堅者宜大承氣急下之病者脈伏其人慾自利利反快雖利心下續堅滿此為留飲欲去故也甘遂半夏湯主之甘遂大者三枚半夏十二枚以水一升煮取半升去渣芍藥五枚甘草指大一枚炙上四味以水二升煮取半升去渣以蜜半升和藥汁煎取八合頓服之丹仁七侄之子肚泄有積與小胃丹二十粒作二次吞之小胃丹方見內傷飲食積熱作泄亦宜下之保治寒積痢男婦小兒各不同或赤白或清痢如水不後重者寒也經曰澄澈清冷皆屬於寒此為虛寒中有積也宜附子巴豆輩下之見利則愈空心服仲下痢氣者當利其小便潔治太陰脾經受濕水瀉注下體重微滿困弱無力不欲飲食暴泄無數水穀不化先宜白朮芍藥湯白朮芍藥各一兩甘草五錢俱用炒黃效速上細末每一兩水二盞煎至盞半溫服如腹痛甚者宜蒼朮芍藥湯主之蒼朮芍藥各一兩黃芩半兩上銼每一兩入淡桂半錢水盞半煎至一盞溫服如脈弦頭痛者宜蒼朮防風湯主之蒼朮防風各二兩上銼同前法煎服如下血宜蒼朮地榆湯主之方見滯下以上症如心下痞每服加枳實一錢如小便不利每服加茯苓二錢如腹痛漸已泄下漸少宜訶子散止之方見後丹氣虛泄瀉人參白朮炒芍藥升麻主之垣異功散治脾胃虛冷腸鳴腹痛自利不思飲食方見小兒吐瀉人參白朮茯苓甘草陳皮各等分為末每五錢薑棗煎服丹女人肚泄左手脈弱此自來欠血面帶黃多年當作虛濕治之滑石六錢白朮半兩陳皮當歸各三錢厚朴木通芍藥各一錢甘草炙五分分六帖姜一片煎四八官患泄小便赤少食少倦怠脈弱此受濕為病當補脾涼肺白朮滑石各一兩黃芩人參芍藥各五錢木通陳皮各三錢乾薑一錢甘草炙一錢分八帖煎服五兒腹泄此受寒涼為病白朮蒼朮各二錢乾薑茯苓厚朴各一錢甘草三分上為末每服二錢白湯調下一丈夫腹瀉胸痞不渴半夏一錢蒼朮白朮青皮各二錢木通紫蘇各一錢良薑半錢甘草少許分三帖姜三片水二盞煎服輝五孺人瘰癧已好止是食少乏力肚泄自汗牡蠣一錢半白朮二錢乾薑三錢陳皮五分黃耆二分當歸一分白水煎服賈宅女人六十八歲腹泄面黃乏力脈浮大而數此有熱積滑石白朮炒各一兩茯苓神麯炒陳皮各五錢黃連黃芩乾薑各一錢上為末粥為丸山楂湯食前下五十粒一丈夫病熱退未盡食太早口渴倦甚腹泄心煩腳冷人參滑石柴胡白朮陳皮各一錢木通一錢半甘草五分分四帖煎七分下保和十五丸上九方丹溪東垣治泄瀉之法大率皆用白朮滑石補脾行濕其餘隨症加減第一二方專治泄也第三方治泄之挾熱也第四五六方治泄之挾寒也第七八方治泄之挾飲食積也垣予病脾胃久衰視聽半失此陰盛乘陽加之氣短精神不足此由弦脈令虛多言之過也皆陽氣衰弱不得舒伸伏匿於陰中耳癸卯歲六七月間淫雨陰寒逾月不止致人多病泄痢濕多成五泄故也一日予體重肢節疼痛大便泄並下者三而小便閉塞思其治法按內經標本論大小不利無問標本先利小便又云在下者引而竭之亦是先利小便也又云諸泄利小便不利先分別之又云治濕不利小便非其治也皆言當利小便必用淡味滲泄之劑以利之是其法也噫聖人之法雖布在方冊其不盡者可以意求耳今客邪寒濕之淫從外而入里以暴加之若從以上法度用淡滲之劑以除之病雖即已是降之又降是復益其陰而重竭其陽則陽氣愈削而精神愈短矣是陰重強陽重衰反助其邪之謂也故必用升陽風藥即瘥以羌活獨活柴胡升麻各一錢防風根半錢炙甘草半錢同㕮咀水二鍾煎至一盞去渣稍熱服大法云濕寒之勝助風以平之又曰下者舉之得陽氣升騰而去矣又法云客者除之是因曲而為之直也夫聖人之法可以類推舉一而知百者也若不達升降浮沉之理而一概施治其愈者幸也升陽除濕湯治脾胃虛弱不思飲食泄瀉無度小便黃四肢困弱自下而上引而去之升麻柴胡羌活防風各半錢蒼朮甘草炙三分神麯澤瀉豬苓陳皮各五分麥蘖三分上㕮咀水二盞煎去渣空心服如胃寒腸鳴加益智半夏各五分薑棗同煎非腸鳴不用人參升胃湯治一日大便三四次溏而不多有時泄瀉腹鳴小便黃黃耆二錢甘草炙一分升麻六分柴胡陳皮歸身益智各二錢紅花少許人參六分上銼作二服水二盞煎至一盞去渣稍熱食前服丹止瀉姜曲丸神麯六兩茴香半兩生薑二兩上為丸每服五七十丸痰積泄瀉海石青黛黃芩神麯上為丸每服三五十丸病少者必用吐法吐之方愈上積滯泄瀉腹必耕痛方泄者是也或肚腹滿按之堅者亦是也受病泄者宜神麯之類消導之病深而頑者必用滯下門後重多熱條進退承氣之類下之方安丹固腸丸樗皮四兩滑石二兩上為末粥丸丹溪云固腸丸性燥若滯氣未盡者不可遽用保訶子散治泄久腹痛漸已瀉下漸少宜此藥止之訶子一兩半生半熟木香半兩甘草二錢黃連三錢上為細末每服二錢以白朮芍藥湯調下如止之不已宜因其歸而送之於訶子散內加厚朴一兩竭其邪氣也虛滑久而不止者多傳變為痢太陰傳少陰是為鬼邪先以厚朴枳實湯防其傳變厚朴枳實各一兩訶子一兩半生半熟木香半兩黃連二錢甘草炙二錢大黃三錢上為細末每服三錢或五錢水一盞半煎至一盞去渣溫服以上皆治熱滑瀉丹補脾丸白朮半兩白芍藥二錢上為細末飯丸冬月去芍藥加肉豆蔻澤瀉服之又不止者於內加飛礬一錢半氣痢訶黎勒散主之訶黎勒十枚煨上一味為散粥飲和頓服林億云疑非仲景方也垣扶脾丸治脾胃虛寒腹中痛溏泄無度飲食不化白朮茯苓甘草炙訶子皮烏梅肉各二錢紅豆乾薑肉桂各半錢麥蘖神麯炒各四錢陳皮一錢半夏二錢上為末荷葉裹燒飯為丸如桐子大每服五十丸溫水食前下一方加藿香一錢治痢久臟腑虛滑去積不已用蒼朮湯下桃花丸蒼朮二兩防風一兩上銼水一碗煎至一大盞下桃花丸或赤石脂丸小便利則安桃花丸即滯下門桃花湯為丸赤石脂乾薑二味是也衍有一人病大腸寒清小便精出諸熱藥服及一斗二升未效後教服赤石脂乾薑各一兩胡椒半錢同為末醋糊為丸如桐子大空心及食前米飲下五七十丸終四劑遂愈本治脾胃不和泄瀉不止諸藥不效訶子丸訶子皮川薑肉豆蔻龍骨木香赤石脂附子各等分上細末糊丸如桐子大每服四十丸米飲下赤石脂禹餘糧湯方治大腸泄瀉赤石脂制禹餘糧各四錢制上銼碎每服五錢水一盞半煎至八分去渣溫服孫治氣虛傷冷暴作水瀉日夜二三十行腹痛不止夏月路行備急朝真丹用硫黃一兩半研令極細枯白礬五錢同細研勻水浸蒸餅去水和丸如桐子大硃砂為衣每服十五丸溫米飲鹽湯下以上止寒泄治暴水泄不止肉豆蔻三個用濕麵裹之置火內煨令面焦去面丹溪云肉豆蔻屬金屬土溫中補脾為有力日華子稱其下氣以脾胃得補而善運化氣自下也非若香附陳皮之駃泄上將肉豆蔻為細末只作一服陳米飲調食前服之神驗潔暴泄如水周身汗出一身盡冷脈沉而弱氣少而不能語甚者加吐此謂緊病宜以漿水散治之漿水散半夏二兩良薑二錢半乾薑肉桂甘草附子炮各五錢上細末每服三五錢水二盞煎至一盞熱服甚者三四服若太陽經傷動傳太陰下痢為鶩溏大腸不能禁固卒然而下中有硬物欲起而又下欲了而又不了小便多清此寒也宜溫之春夏桂枝湯秋冬白朮湯謙甫云鶩溏者大便如水其中有少結糞是也桂枝湯桂枝芍藥白朮各半兩甘草炙二錢上切每服半兩水一盞煎至七分去渣溫服白朮散白朮芍藥各三錢乾薑炮半兩甘草炙二錢上粗末如前服之甚則除去乾薑加附子三錢謂辛能發散也羅曲術丸治時暑暴泄壯脾胃及治飲食所傷胸膈痞悶神麯蒼朮泔浸一宿各等分上為細末麵糊為丸如桐子大每服三十丸溫米飲送下止泄丸肉豆蔻五兩滑石制上為末擂飯丸惟滑石夏三兩半秋二兩春冬一兩一錢半羅中寒治驗參政商公時年六旬有二原有胃虛症至元己巳夏上都住時值六月霖雨大作連日不止因公務勞役過度飲食失節每日臍腹作痛腸鳴自利須去一二行少定不喜飲食懶於言語身體困倦召予視之予診其脈沉緩而弦參政以年高氣弱脾胃宿有虛寒之症加之霖雨及勞役飲食失節重虛中氣難經云飲食勞倦則傷脾不足而往有餘隨之歲火不及寒乃大行民病鶩溏今脾胃正氣不足腎水必挾木勢反來侮土乃薄所不勝乘所勝也此疾非甘辛大熱之劑則不能瀉水補土雖夏暑之時有用熱遠熱之戒又云有假者反之是從權而治其急也內經云寒淫於內治以辛熱乾薑附子辛甘大熱以瀉寒水以為君脾不足者以甘補之人參白朮甘草陳皮苦甘溫以補脾土胃寒則不欲食以生薑草豆蔻辛溫治客寒犯胃厚朴辛溫厚腸胃白茯苓甘草助薑附以導寒濕芍藥酸微寒補金瀉木以防熱傷肺氣為佐不數服即愈附子溫中湯治中寒腹痛自利米穀不化脾胃虛弱不喜飲食懶言困倦嗜臥附子炮去皮臍乾薑炮各七錢人參甘草炙白芍藥白茯苓去皮白朮各五錢厚朴薑製草豆蔻麵裹煨去皮陳皮各三錢上銼每服五錢或一兩水二盞半姜五片煎一盞食前溫服簡理中湯治泄瀉加橘紅茯苓各一兩名補中湯若溏泄不已者於補中湯內加附子一兩不喜飲食水穀不化者再加砂仁一兩共成八味理中湯方見傷寒本治脾胃中風濕臟腑泄滑鞠藭丸芎藭神麯白朮附子各等分炮上為細末麵糊丸如桐子大每服三五十丸米飲下左氏述楚子圍蕭蕭將潰無社告申叔展曰有曲乎有山鞠藭乎鞠藭芎藭也意欲令逃水中以避禍是知芎藭能除濕當加朮附以制之若脾濕而泄者萬無不中亦治飧泄無桂香丸治臟腑虛為風寒所搏冷滑注下不禁老人虛人危篤累效附子炮去皮臍肉豆蔻炮白茯苓各一兩桂心乾薑炮木香炮各半兩丁香一分上為末糊丸如桐子大米湯下五十丸空心服孫治水瀉無度乾薑末粥飲調一錢服立效泄而身熱小便不利口渴者益元五苓若火多四苓加木通黃芩方見濕熱條泄而困倦不便者及脈數者虛熱者宜參朮滑石苓通方見補脾行濕條泄而脈滑堅者實熱宜大承氣湯方見實條丹玉龍丸治一切伏暑泄瀉神效方見傷寒部暑門仲下痢不止醫以理中與之利益甚理中者理中焦此利在下焦赤石脂禹餘糧湯主之復痢不止者當利小便下痢腹脹滿身體疼痛者先溫其里乃攻其表溫里宜四逆湯攻表宜桂枝湯大腸小腸為泄全文見診一陽發病少氣善咳善泄全文見診病傳變運氣泄瀉有六一曰土助脾濕盛而泄瀉經云歲土太過雨濕流行病溏泄腸鳴又曰歲水不及濕乃下行民病身重濡泄又云歲火不及寒乃大行土復則病鶩溏腹痛腸鳴泄注又云土鬱之發民病飲發注下又云濕勝則濡瀉治以苦溫是也二曰風木攻脾虛而泄瀉經云厥陰司天風淫所勝民病冷泄溏泄又云春傷於風邪氣留連乃為洞泄治以辛涼是也三曰熱瀉經云少陽所主為暴注又云少陰之勝腹滿溏泄又云火鬱之發民病注下治以寒劑是也四曰寒泄經云歲水太過寒氣流行病腸鳴溏泄又云太陽所至為流泄禁止又云太陽之勝寒入下焦傳為濡泄治以熱劑是也五曰熱中寒中泄經云太陽司天之政三之氣寒氣行民病寒反熱中注下者是外寒內熱泄也又云長夏善病洞泄寒中者是外熱內寒泄也治以寒熱兼施是也六曰燥泄經云歲木不及燥乃大行民病腸鳴溏泄又云陽明司天燥淫所勝民病腹中鳴注泄鶩溏又云陽明之勝清發於中溏泄又云陽明之復腹脹而泄治以溫劑是也子和昔聞山東楊先生者治府主洞泄不止楊初未對病人與眾人談日月星辰纏度及風雷雲雨之變自辰至未而病者聽之忘其圊楊嘗曰治洞泄不已之人先問其所愛之事好棋者與之棋好樂者與笙笛勿輒針灸泄瀉獨取大腸一經經云大腸病者腸中攻痛而鳴濯濯冬日中於寒即泄當臍而痛取巨虛上廉羅治水漬入胃為溢飲滑泄渴能飲水水下復泄泄而大渴此無藥症當灸大椎脈諸下痢皆可灸足大都五壯商丘陰陵泉皆三壯甲溏泄不化食寒熱不節陰陵泉主之玉治久泄瀉內天樞穴撮要摘英同天樞二寸半灸摘英五分留十呼灸百壯集自痢不止天極中極世又法合谷三里陰陵泉不應取下穴中脘關元天樞神闕東泄痢不禁小腹絞痛丹田灸百壯三報之泄痢不嗜食長谷五十壯三報之在脅臍傍相去五寸一名循元穴衍石硫黃今人用治下元虛冷元氣將絕久患寒泄胃脾虛弱垂命欲盡服之無不效中病當便已不可盡劑世人蓋知用而為福不知用而為禍此物損益兼行若俱棄而不用當倉卒之間又可闕乎產後泄瀉丹治產後泄瀉惡露不行此余血滲入大腸為瀉洞泄不禁下青白黑色用荊芥大者四五穗於盞內燒灰不得犯油火入麝香研湯三呷調下此藥雖微能治大病方名的奇散產後泄方茯苓川芎黃芩白朮乾薑滑石陳皮芍藥炒上水煎服之飧泄飧泄米穀不化而完出是也素清氣在下則生飧泄陰陽應象論王注云熱氣在下則穀不化故飧泄東垣云清氣在下者乃人之脾胃氣衰不能升發陽氣故用升麻柴胡助甘辛之味以引元氣之升不令下陷為飧泄也羅內經曰清氣在下則生飧泄又曰久風入胃中則為腸風飧泄夫脾胃土也氣衝和以化為事今清氣下降而不升則風邪久而干胃是木賊土也故沖和之氣不能化而令物完出所以謂之飧泄或飲食太過腸胃所傷亦致米穀不化此俗呼水穀利也法當下者舉之而消克之也以加減木香散主之木香良薑升麻檳榔人參各二錢半肉豆蔻煨吳茱萸泡乾薑炮各五分神麯炒二錢陳皮五分砂仁五分上十一味為細末每服四錢水盞半煎至一盞去渣食前溫服宜加白朮河白朮湯治飧泄風冷入中泄利不止脈虛而細日夜數行口乾腹痛不已厚朴薑製當歸去苗龍骨各五錢白朮一兩艾葉半錢炒熟上為末每服三錢水一盞生薑三片同煎至八分去渣空心溫服垣凡泄則米穀不化謂之飧泄是清氣在下乃胃氣不升上古聖人皆以升浮藥扶持胃氣一服而愈知病在中焦脾胃也脈訣曰濕多成五泄濕者胃之別名也病本在胃真氣弱真氣者穀氣也不能克化飲食乃濕盛故也以此論之正以脾胃之弱故也初病奪食或絕不食一二日使胃氣日勝泄不作也今已成大泄矣經云治濕不利小便非其治也又云下焦如瀆又云在下者引而竭之唯虛症不宜此論其病得之於胃氣下流清氣不升陽道不行宜升宜舉不宜利小便靈樞云頭有疾取之足謂陽病在陰也足有疾取之上謂陰病在陽也經曰陽病在陰陰病在陽此之謂也中有疾傍取之傍者少陽甲膽是也中者脾胃也脾胃有疾取之足少陽甲膽者甲風是也東方春也胃中谷氣者便是風化也作一體而認故曰胃中濕勝而成泄瀉宜助甲膽風勝以克之又是升陽助清氣上行之法也又一說中焦元氣不足溲便為之變腸為之苦鳴亦緣胃氣不升故令甲氣上行又云風勝濕也大抵此症本胃氣弱不能化食奪食則一日而可止夫奪食之理為胃弱不能克化食則為泄如食不下何以作泄更當以藥滋養元氣令和候泄止漸與食胃勝則安矣若食不化者於升陽風藥內加炒曲同煎兼食入頓至心頭者胃之上口也必口沃沫或食入反出皆胃土停寒其右手關脈中弦按之洪緩是風熱濕相合穀氣不行清氣不升為弦脈之寒所隔故不下也曲之熱亦能去之若翻胃者更加半夏生薑入於風藥內同煎奪食少食欲使胃氣強盛也若藥劑大則胃不勝藥泄亦不止當漸漸與之今病既久已至衰弱當以常法治之不可多服餌也人之肉如地之土豈可人而無肉故肉消盡則死矣消瘦人有必死者八內經有七外經有一又病肌肉去盡勿治之天命也如肌肉不至瘦盡當急療之宜先奪食而益胃氣便與升陽先助真氣次用風藥勝濕以助升騰之氣病可已矣余皆勿論此治之上法也治用升陽除濕湯之類是也羅加減木香散方見正條仲下利清穀裡寒外熱汗出而厥者通脈四逆湯主之方見傷寒河白朮散治飧泄脈細方見上條垣治泄痢飧泄身熱脈弦腹痛而渴及頭痛微汗宜防風芍藥湯防風芍藥黃芩各等分上粗末每服半兩或一兩水二盞煎至一半溫服梅治水穀痢久不瘥厚朴三兩黃連三兩銼細水三升煎取一升空心服素春傷於風夏生飧泄生氣通天論久風為飧泄全文見診法久風入中為腸風飧泄風論上久風入中為飧泄經云虛邪之中人也始於皮膚留而不去傳舍於絡脈留而不去傳舍於經留而不去傳舍於輸留而不去傳舍於伏沖之脈留而不去傳舍於腸胃在腸胃之時賁響腹脹多寒則腸鳴飧泄食不化此久風入中為飧泄之義同也潔古云大渴飲水多因致水穀一時下者宜灸大椎三五壯或用車前子雷丸白朮茯苓及五苓散等藥滲之詳見大法條又如久風為飧泄者則不飲水而谷完出治法當以宣風散導之後服蒼朮防風湯宣風散方見小兒痘發熱條服之大便利服後藥蒼朮防風湯蒼朮去皮四兩麻黃一兩防風五錢上粗末每一兩生薑七片水一盞煎至一半去渣溫服如止後服後藥補本丸蒼朮小椒去目炒各一兩上為細末醋糊丸如桐子大每服五十丸食前溫水下治寒泄痢久不效者彌佳小兒丸如米大子和趙明之米穀不消腹作雷鳴自五月六月不愈諸醫以為胃受大寒故並與聖散子豆蔻丸雖止一二日藥力盡而復作諸醫不知藥之非反責明之不忌口戴人至而笑曰春傷於風夏必飧泄飧泄者水穀不化而直過下出又曰米穀不化熱氣在下久風入中中者脾胃也風屬甲乙脾胃屬戊己甲乙能克戊己腸中有風故鳴經曰歲木太過風氣流行脾土受邪民病飧泄診其兩手脈皆浮數為病在表也可汗之直斷曰風隨汗出以火二盆暗置床下不令病人見火恐憎其熱詒之入室更服湧劑以麻黃投之乃閉其戶從外鎖之汗出如洗待一時許開戶減火一半須臾汗止泄亦止內經曰春傷於風夏生飧瀉此以風為根風非汗不出者有病此者腹中雷鳴泄注米穀不分小便澀滯皆以脾胃虛寒故耳服豆蔻烏梅粟殼乾薑附子曾無一效中脘臍下灸已數千燥熱轉甚津液涸竭瘦削無力飲食減少命予視之余以應象論曰熱氣在下水穀不分化生飧泄寒氣在上則生䐜脹而氣不散何也陰靜而陽動故也診其脈兩手皆浮大而長身表微熱用桂枝麻黃湯以薑棗煎大劑連進三服汗出終日至旦而愈次以胃風湯和其臟腑調養陰陽食進而愈河木香丸治腸痹多飲不泄上氣喘爭時發飧泄腹痛木香白朮官桂蕪荑訶子皮良薑附子炮去皮厚朴薑製肉豆蔻各一兩乾薑六錢半甘草五錢上為末麵糊丸如桐子大每服二十丸薑湯空心下運氣飧泄皆屬風木攻脾經云歲木太過風氣流行脾土受邪民病飧泄食減又云歲土不及風乃大行民病飧泄體重腹痛又云土不及曰卑監卑監之紀上角與正角同其病飧泄治以涼劑是也刺灸飧泄有三法其一取脾經云脾虛則腹滿腸鳴泄食不化取其經足太陰陽明又云飧泄取三陰之上補陰陵泉皆久留之熱行乃止又云飧泄取三陰者是也三陰者太陰也其二取腎經云腎藏志志有餘腹脹飧泄瀉然筋血者是也然筋謂然骨視血絡盛則泄之其三取肝經云肝足厥陰之脈所生病者胸滿嘔逆飧泄是也視盛虛寒熱陷下施法也渴飲水多水穀一時下者灸大椎三五壯立已詳見大法條甲飧泄大腸痛巨虛上廉主之又太衝主之遺尿大治產後遺尿取故燕巢中草燒灰研細酒調服五分男子亦治又方白礬枯牡蠣煅上等分為末酒服方寸匕日三男女同治華病人臥遺屎不覺者死滯下丹痢初得時一二日間以利為法有熱先退熱後重者當利氣木香檳榔腹痛用溫散藥薑桂之屬下血當涼血和血當歸桃仁之屬下痛發熱惡寒身首俱痛此為表證宜微汗和解用蒼朮川芎陳皮芍藥甘草生薑三片煎下痢身發熱者有外感用小柴胡去參下痢發熱久不止者屬陰虛用寒涼藥必兼升散藥並熱藥用下痢初發熱必用大承氣下後看症用藥發熱不惡寒脈洪者宜大承氣若惡寒者忌下下痢腹痛後重小水短下積此為里症宜和中疏氣用陳皮芍藥滑石枳殼厚朴之類潔芍藥湯治下血調氣經曰溲而便膿血知氣行而血止也行血則便自安調氣則後重自除芍藥一兩當歸黃連各半兩檳榔木香各二錢甘草炙一錢大黃三錢黃芩五錢桂二錢半上粗末每服半兩水二盞煎至一盞食後溫服如血前則漸加大黃如清後臟毒加黃柏半兩同煎服丹一老人年七十面白脈弦數獨胃脈沉滑因飲白酒作痢下血淡水膿腹痛小便不利裡急後重以參術為君甘草滑石檳榔木香蒼朮為佐下保和丸二十五丸第二日前症俱減獨小便不利以益元散服之安河益元散治身發熱下痢赤白小便不利蕩胃中積聚方見泄瀉丹痢初得之必用調胃承氣及大小承氣實者用此下之下婁男子五十餘下痢晝有積淡紅色夜無積食自進先吃小胃丹兩服再與四十丸次六十丸去積卻與斷下羅玄青丸治下痢勢惡頻並窘痛或久不愈諸藥不能止須吐下之以開除瀉熱痞悶積滯而使氣液宣行者宜此逐之兼宣利積熱酒食積黃瘦中滿水氣腫腹脹兼療小兒驚疳積熱乳癖諸症黃連黃柏大黃甘遂芫花醋拌炒大戟各五錢輕粉二錢青黛一兩牽牛四兩取頭末二兩上為末研勻水丸小豆大初服十丸每服加十丸空心日午臨臥三服以快利為度後常服十五丸數日後得食力如利尚未痊再加取利利後卻常服以意消息病去為度後隨症止之小兒丸如黍米大退驚疳積熱不須下者常服十丸玄利積丸黃連四兩天水末八兩當歸二兩乳香一兩蘿蔔子炒四兩巴豆一兩去油同黃連一處炒上為末醋糊丸如桐子大弱者十五丸實者二十五丸治下痢赤白腹滿脹痛裡急上渴引飲小水赤澀此積滯也宜泄其熱中用清腸丸導氣丸推其積滯而痢自無矣凡治積聚之症輕則溫而利之清腸丸是也重者天真散舟車丸下之下後切勿便補之其或力倦自覺氣少惡食此為挾虛症宜加白朮當歸身尾甚者加人參若又十分重者止用此藥加陳皮補之虛回而痢自止矣予族叔年近六十夏間患滯下病腹微痛所下褐色後重頻並飲食大減時有微熱察其脈皆弦而澀似數稍長卻喜不甚浮大兩手相等視其神氣大減予曰此非滯下乃憂慮所致心血虧脾氣弱也與參術為君歸身陳皮為臣川芎炒白芍茯苓為佐使如熱加黃連為使與兩月而安金氏婦年近四十秋初尚熱患滯下腹但隱痛夜重於晝全不得睡食亦稍減口乾不飲已服治痢靈砂兩帖矣予視之兩手脈等澀且不勻神思倦甚飲食全減因與四物湯倍加白朮以陳皮佐之數帖而安義一侄患瘧間日作兼痢脈虛甚身痛宜活血補胃待虛稍回卻又推積人參五分白朮一錢半蒼朮陳皮各一錢白芍藥炒五分川芎五分滑石炒一錢甘草炙少許桃仁研七分藥後病退惟脈少弦身倦用此方調補人參九分蒼朮三錢半夏九分川芎一錢陳皮一錢木通二錢半甘草少煎服三之一飲之可淡粥少少塞飢又靜坐養之葉先生患滯下後甚逼迫正合承氣症但氣口虛形雖實而面黃積白此必平昔食過飽而胃受傷寧忍二三日辛苦遂與參朮陳皮芍藥等補藥十餘帖至三日後胃氣稍完與承氣二帖而安苟不先補完胃氣之傷而遽行承氣恐病安之後寧免瘦憊乎世治痢煙蠟丸黃蠟不拘多少用銀篦挑於真香油燈上燒熏落下水碗內凡如此者七次為丸如蘿蔔子大每二十丸白痢甘草湯下赤痢烏梅湯下本草云蜜蠟主下利膿血補中又云白蠟主後重白膿葛治重下此即赤白痢火熬豉令少焦杵服一合日三效無比又熬豉令焦水一升淋取汁冷服治淋日三服有效食治脾胃氣虛下痢久不已腸滑不進食用野雉一隻如食法細斫著陳皮蔥椒調和鹽醬作餛飩熟煮空心食之丹噤口痢胃中熱甚大虛大熱故也用人參二錢黃連姜炒一錢濃煎汁終日細細呷之如吐再吃但一呷下咽便開又宜封臍引熱下行用田螺肉搗碎罨臍中入麝香少許世痢疾不納飲食者俗謂之噤口痢以脈症辨之如脾胃不弱問而知其頭疼心煩手足溫熱未嘗多服涼藥者此乃毒氣上衝心肺所以嘔而不食宜用敗毒散每服四錢陳倉米一百粒姜三片棗一枚水一盞半煎八分溫服若其脈微弱或心腹膨脹手足厥冷初病則不嘔因服罌粟殼烏梅苦澀涼藥太過以致聞食先嘔者此乃脾胃虛弱用山藥一味銼如小豆大一半入銀瓦銚內炒熟一半生用同為末飯飲調下又方用石蓮槌去殼留心並肉碾為末每服二錢陳米飲調下此疾蓋是毒氣上衝心肺藉此以通心氣便覺思食效暴注下迫皆屬於熱全文見診局香連丸治下痢赤白裡急後重黃連去蘆二十兩用吳茱萸十兩同炒令赤去茱萸不用木香四兩八錢不見火上為細末醋糊丸如桐子大每服三十丸空心飯飲下錢豆蔻香連丸治泄瀉不問寒熱赤白陰陽不調腹脹攻痛可用如神黃連三錢炒肉豆蔻木香各一錢上為細末粟米飯丸米粒大每服米飲下十丸至二三十丸日夜各四五服食前杜治氣痢瀉裡急後重神妙方宣連二兩乾薑半兩各為末每用連二錢姜半錢和勻空心溫酒下羅黃連阿膠丸治脾胃氣冷熱不調下痢赤白狀如魚腦裡急後重臍腹疼痛口燥煩渴小便不利黃連三兩去須茯苓二兩去皮阿膠上各為末水調阿膠和藥眾手丸如桐子大每服二十丸溫米飲湯下仲熱利下重者白頭翁湯主之方見傷寒仲下痢膿血裡急後重日夜無度宜導氣湯芍藥二錢當歸五錢大黃黃芩各二錢半黃連木香檳榔各一錢上為細末每服三錢水一盞煎至七分去渣溫服如未止再服下後重則止潔大瘕泄者裡急後重數至圊而不能便莖中痛用清涼飲子主之其泄自止莖中痛者屬厥陰加甘草裡急後重多者屬少陰加大黃令急推去舊物則輕矣內經曰因其重而減之又云在下者引而竭之清涼飲子方見治發熱裡急後重數至圊而不得便皆宜進退大承氣湯主之進承氣法治太陰症不能食是也當先補而後瀉乃進藥法也先銼厚朴半兩薑製水一盞煎至半盞服若二三服未已胃有宿食不消加枳實二錢同煎服二三服泄又未已如不加食尚有熱毒又加大黃三錢推過泄未止者為腸胃久有塵垢滑黏加芒硝半合垢去盡則安矣後重兼無虛症者宜之若力倦氣少脈虛不能食者不宜此法蓋厚朴枳實大瀉元氣故也退承氣法治陽明症能食是也當先瀉而後補乃退藥法也先用大承氣五錢水一盞依前法煎至七分稍熱服如瀉未止去芒硝減大黃一半煎二服如熱氣雖已其人心腹滿又減去大黃但與枳實厚朴湯又煎二三服如腹脹滿退泄亦自安後服厚朴湯數服則已垣感應丸治下痢赤白後重遲澀方見內傷飲食門丹或曰治後重疏通之劑羅謙甫水煮木香膏東垣白朮安胃散等方已盡矣又有用御米殼等固澀之劑亦可愈何也曰後重本因邪壓大腸墜下故大腸不能升上而重是以用大黃檳榔輩瀉其所壓之邪今邪已瀉其重仍在者知大腸虛滑不能自收而重是以用御米殼等澀劑固其滑收其氣用亦愈也然大腸為邪墜下之重其重至圊後不減大腸虛滑不收之重其重至圊後隨減以此辨之百發百中也其或下墜異常積中有紫黑血而又痛甚此為死血症法當用擂細桃仁滑石行之或口渴及大便口燥辣是名挾熱即加黃芩或口不渴身不熱喜熱手熨蕩是名挾寒即加乾薑八嬸將產患痢脈細弦而稍數後重裡急滑石三錢研芍藥二錢枳殼炒錢半木通二錢甘草五分白朮二錢茯苓一錢桃仁每帖九枚研同前青田人肚痢紅紫血下墜逼迫不渴不熱白朮芍藥各一兩陳皮枳殼炒歸身滑石各半兩甘草二錢炙桃仁三十六個分八帖下實腸丸三十粒一丈夫因酒多下血肚疼後重成痢滑石半兩連翹黃芩木通芍藥枳殼白朮各二錢甘草五分桃仁二十一枚分四帖服後重積與氣墜下服升消藥不愈者用秦艽皂角子煨大黃當歸桃仁枳殼黃連等劑若大腸風盛可作丸服自古治裡急後重但用檳榔木香調氣及大黃下積至丹溪始用桃仁滑石活死血如鼓應桴實發前人之所未發也其或下墜在血活之後此為氣滯症宜前藥加檳榔一枚後重當和氣積與氣墜下者當兼升兼消升謂升麻之類消謂木香檳榔之類仲泄痢下重者以水五升煮薤白三升至二升去渣以四逆散方寸匕內湯中煮取一升半分溫再服東垣云薤白泄滯氣食主赤白痢下薤白一握切煮作粥食丹其或氣行血和積少但虛坐努責此為亡血症倍用當歸身尾卻以生地黃生芍藥生桃仁佐之復以陳皮和之血生自安垣虛坐而不得大便皆因血虛也血虛則裡急加當歸身凡後重逼迫而得大便者為有物而然今虛坐努責而不得大便知其血虛也故用當歸為君生血藥佐之凡諸用承氣等藥推積之後仍後重者乃陽不升也藥中當加升麻升其陽其重自去也垣升陽除濕防風湯治裡急後重數至圊而不能便或少有白膿或少血者慎勿利之升陽除濕防風湯方見下血丹其或在下則纏滯在上則嘔食此為毒積未化胃氣未平症當認其寒則溫之熱則清之虛則用參術補之毒解積下食自進矣治痢方蒼朮白朮茯苓當歸白芍藥青皮生地黃連滑石甘草作一服水煎裡急後重加黃連滑石桃仁檳榔甚者大黃嘔者加半夏薑汁世仲景建中湯治痢不分赤白久新但腹中大痛者神效其脈弦急或澀浮大按之空虛或舉按皆無力者亦效方見傷寒丹婁長官年三十餘奉養厚夏秋間患滯下腹大痛有人教服單煮乾姜與一帖痛定少頃痛作又與又定由是服乾薑三斤八日後召予視之左脈弦大似數右脈弦而大稍減亦似數重取之似緊予曰此必醉飽後吃寒涼太過當作虛寒治之因其多服乾薑遂教與四物湯去地黃加人參白朮陳皮酒紅花茯苓桃仁煎生薑汁飲之一月而安丹溪云下痢腹痛用薑桂溫散之法乃乾薑並建中湯加桂是也聖治冷痢腹中不能食肉豆蔻一兩去皮以醋麵裹煨熱搗非時粥飲下二錢匕上下痢腹痛必溫散而愈者蓋本於內經所謂寒氣客於小腸小腸不得成聚故腹痛後泄及所謂太陽病冬日感寒即泄當臍而痛之病也垣芍藥黃芩湯治泄痢腹痛或後重身熱久不愈脈洪疾者及下痢膿血稠黏黃芩芍藥各一兩甘草五錢上㕮咀每服一兩水一盞半煎至一盞溫服無時如痛加桂少許當歸導氣湯治膿血痢無度小便不通腹中痛當歸一錢甘草一錢半芍藥一錢青皮槐花炒各七分木香檳榔各三錢澤瀉五分生地黃錢半或二錢酒浸陰乾上為末水煎食前溫服如小便利去澤瀉仲下痢腹痛紫參湯主之紫參半斤甘草三兩上二味以水五升先煮紫參取三升內甘草煮取一升半分三次溫服潔厚朴丸治處暑秋冬間腹痛下痢大效方見反胃世治痢疾定痛黑子丸黃蠟五錢杏仁江子砂仁各二十一枚上三件香油燈上燒存性熔蠟和勻加乳香些少丸如米大每服十餘粒本治積痢定痛靈砂丹硇砂硃砂各等分研極細上用黃蠟五錢巴豆三七粒去殼皮膜同於銀石器內重湯煮一伏時候巴豆紫黑為度去二七粒止用一七粒與前藥二味同研極勻再熔蠟和藥旋丸綠豆大每服二丸至五丸水瀉生薑湯下白痢艾湯赤痢烏梅湯下服時須極空心服畢一時不可吃食臨臥尤佳次食淡粥一日瘧疾乳香湯面東不發日晚間服此藥不動氣服之瀉者止痢者斷疼者愈有積者內化亦不動臟腑大凡痢有沉積者不先去其積雖暫安後必為害常記陳侍郎經中庚戌秋過儀真求診初不覺有疾及診視肝脈沉弦附骨取則牢予曰病在左脅有血積必發痛陳曰誠如是前某守九江被召冒暑涉長江暨抵行朝血痢已數日矣急欲登對醫者以剛劑燥之雖得止數日臍下一塊大如杯旬日如碗大痛發則不可忍故急請公祠以歸耳奈何予曰積痢不可強止故積血結於臍脅下非抵當丸不可渠疑而不肯服次年竟以此終羅陳曲丸治腹中冷痛磨積止痢陳曲一兩半炒乾薑炮官桂白朮當歸厚朴人參甘草炙各半兩上為細末煉蜜丸如桐子大每服三五十丸酒送下或淡醋湯亦得食前一日三服發時不拘增數上久病漸推其積方脈下痢而腹滿為實當下之丹初下痢腹痛不可用參術然氣虛胃虛者可用初得之亦可用大承氣調胃承氣下之看其氣病血病然後加減用藥氣用參術血用四物因積作後重者保和丸主之五日後不可下脾胃虛故也腹痛者肺經之氣郁在大腸之間者以苦梗發之然後用治痢藥氣用氣藥血用血藥其或痢後糟粕未實或食粥稍多或飢甚方食肚中作疼切不可驚恐當以白朮陳皮各半煎湯和之自安粥多及食肉作痛者宜奪食奪食者減其粥食絕其肉味也垣茯苓湯治因傷冷水瀉變作赤白痢腹痛減食熱燥四肢困倦無力茯苓六分澤瀉歸身各四分芍藥一錢半蒼朮二分生薑二錢肉桂五分黃芩三分生豬苓六分甘草五分炙升麻柴胡各一錢一本無升麻柴胡上㕮咀作二服水煎稍熱食前服羅神效越桃散治下痢之後小便利而腹中滿痛不可忍此名陰陽反錯不和之甚也大梔子良薑各三錢上為末米飲或酒調下三錢內經膿血稠黏皆屬相火夫太陰主瀉少陰主痢是先泄亡津液而火就燥腎惡燥居下焦血分其受邪者故便膿血然赤黃為熱青白為寒治須兩審治熱以堅中丸豆蔻丸香連丸治寒白膠香散或多熱少寒水煮木香膏虛滑頻數宜止宜澀宜養臟湯木香養臟湯並見虛滑條白膠香散未考堅中丸治脾胃受濕滑泄注下黃連黃柏赤茯苓澤瀉白朮各一兩陳皮肉豆蔻白芍藥人參官桂半夏曲各五錢上為末湯浸蒸餅為丸桐子大每服五七十丸溫米飲送下食前丹下血用四物為主當涼血和血當歸桃仁之屬潔溲而便膿血者小腸泄也脈得五至以上洪大者宜七宣丸脈平和者立秋至春分宜香連丸春分至立秋宜芍藥柏皮丸四時皆宜加減平胃散如有七宣丸症者亦宜服此藥去其餘邪兼平胃氣芍藥柏皮丸方芍藥黃柏各等分上為細末醋糊丸如桐子大每服五十丸食前溫湯下加減平胃散經云四時皆以胃氣為本久下血則脾胃虛損血水流於四肢卻入於胃而為血痢宜服此滋養脾胃白朮厚朴陳皮各一兩檳榔三錢甘草七錢木香三錢桃仁人參黃連阿膠茯苓各五錢上㕮咀每服五錢姜三片棗一枚水煎溫服無時血多加桃仁熱泄加黃連小便澀加茯苓澤瀉氣不下後重加檳榔木香腹痛加官桂芍藥甘草膿多加阿膠濕多加白朮脈洪大加大黃丹下血多主食積與熱或有用朴硝者蒼朮白朮黃芩芍藥滑石茯苓甘草陳皮神麯炒煎下保和丸世治痢食積附米神麯川芎梔子滑石山楂紅曲青黛桃仁為末丸服丹青六丸去三焦濕熱治泄瀉多與清化丸同服並不單服兼治產後腹痛或自利者能補脾補血亦治血痢效六一散三兩即益元散紅曲炒半兩活血上飯為丸一方酒糊丸二十九官肚痢食少下墜赤積身熱木通二錢半芍藥炒陳皮白朮滑石各五錢甘草五分分四帖煎下保和丸與點丸各十丸潔蒼朮地榆湯治脾經受濕下血痢蒼朮三兩地榆一兩上銼每一兩水二盞煎一盞溫服槐花丸治血痢久不止腹中不痛不裡急後重青皮槐花荊芥穗各等分上為末水煎空心溫服仲小腸有寒者其人下重便血集治血痢神效乾薑於火上燒黑不令成灰瓷碗合放冷為末每服一錢米飲調下垣大便後有白膿或只便白膿因勞役氣虛傷大腸也以黃耆人參補之如裡急頻見汙衣者血虛也更加當歸如便白膿少而滑頻見汙衣者氣脫加附子皮甚則加御米殼如氣澀者只以甘藥補氣當安臥不言以養其氣氣澀忌御米殼但服甘藥安臥不言丹丈夫辛苦勞役肚痢白瀉滑石一兩陳皮白朮六錢芍藥五錢黃芩三錢甘草五分炙桃仁三十個分六帖水二盞半煎取一盞食前服孫郎中因飲水過多腹脹瀉痢帶白蒼朮厚朴白朮茯苓滑石下保和丸又云加炒曲甘草治痢熱多者大黃黃連黃柏黃芩枳殼白芍藥當歸滑石甘草桃仁白朮上等分為末麵糊丸世不問赤白痢用苦蕒根不拘生干搗取汁生薑蜜水調服未效再進半碗許立愈集患赤白痢山豆根搗末蜜丸空心煎水下二十丸三服止千治下痢冷熱諸治不瘥方烏頭黃連各一升上二味為末蜜和丸如桐子大下二十丸日三夜二神妙世治似痢非痢挾熱者用苦楝根皮去粗皮曬乾上為末粳米飲為丸米飲下羅至元乙亥廉臺王千戶領兵鎮漣水此地卑濕因勞役過度飲食失節至秋深瘧痢並作月餘不愈飲食全減形容羸瘦時已仲冬求治於予具陳其由診得脈弦細而微如蛛絲身體沉重手足寒逆時復麻痹皮膚痂疥如癘風之狀無力以動心腹痞悶嘔逆不止皆寒濕為病久淹真氣衰弱形氣不足病氣亦不足陰陽皆不足也針經云陰陽皆虛針所不為灸之所宜內經云損者益之勞者溫之十劑云補可去弱先以理中湯加附子溫養脾胃散寒濕澀可去脫養臟湯加附子固腸胃止泄痢仍灸諸穴以併除之經曰府會太倉即中脘也先灸五七壯以溫養脾胃之氣進美飲食次灸氣海百壯生髮元氣滋榮百脈充實肌肉復灸足三里胃之合也三七壯引陽氣下交陰分亦助胃氣後又灸陽輔二七壯接續陽氣令足脛溫暖除清濕之邪迨月餘病退平復理中湯方見傷寒部加附子名附子理中湯海六脈沉緊按之不鼓膀胱勝小腸也或瀉痢不止而腹脹或純便赤血或雜以血膿小便不多而不渴精神短少或面白色脫此失血之故也或面黃氣短此本氣損少之故也小腸者手太陽丙火也膀胱者足太陽壬水也是壬水乘丙小腸之位小腸被壬所克而外走也諸手經短而足經長兼五行相剋論之又足經來克手經此火投於水大寒水之症宜溫之可安其與難經一症寒熱相反亦名曰小腸瀉此病火投於水變為寒症又外傷足太陽膀胱經左脈俱浮表陽之候也忽變為內寒亦旺火投盛水而屈丙就壬化脈反不浮而微沉此內病與外病俱有此火投水例非精於脈診者孰能辨之石脂神砂丹生附子乾薑各五錢赤石脂兩半水飛硃砂一兩細研上細末酒糊丸黑豆大每服十五丸米白湯下太平廣記貞觀中太宗苦於氣痢眾醫不效詔問群臣中有能治者當重賞之有術士進以乳汁煎蓽茇服之立瘥世治水泄並赤白痢用草烏大者一兩半將一半燒灰一半生用為細末醋糊丸如綠豆大每服七丸赤痢甘草湯下白痢乾薑湯下水瀉井花水下並空心服忌腥臊熱毒諸冷物世俗治夏中暑痢疾用黃連香薷飲加甘草芍藥生薑神效者蓋夏月之痢多屬於暑潔古治處暑後秋冬間下痢用厚朴丸大效者蓋秋冬之痢多屬於寒經所謂必先歲氣毋伐天和者是也厚朴丸方見膈氣反胃初病大腸閉塞裡急後重治法並見前後重多熱條丹其或纏滯退減十之七八穢積未盡糟粕未實當以炒芍藥炒白朮炙甘草陳皮茯苓煎湯下固腸丸三十粒然固腸丸性燥恐尚有滯氣未盡行者但當單飲此湯固腸丸未宜遽用蓋固腸丸者雖有去濕實腸之功其或久痢體虛氣弱滑泄不止又當以訶子肉豆蔻白礬半夏等藥澀之甚者添牡蠣可擇用之然須以陳皮為佐恐太澀亦能作疼又甚者灸天樞氣海此穴大能止泄仲下痢便膿血者桃花湯止之方見傷寒若一服愈勿再服丹溪云桃花湯主病屬下焦血虛且寒非乾薑之溫石脂之澀且重不能止血用粳米之甘以引入腸胃羅水煮木香膏治脾胃受濕臟腑滑泄腹中疼痛日夜無度腸鳴水聲不思飲食每欲痢時裡急後重或下赤黃或便膿血並宜服之木香丁香各一兩枳實麩炒五錢當歸乳香訶子皮各一兩肉豆蔻砂仁各一兩半藿香黃連炒白芍藥青皮陳皮去白厚朴制甘草炙各一兩乾薑炮五錢御米殼蜜水炒六兩上為細末煉蜜丸彈子大每服一丸水一大盞劈破煎至六七分和渣稍熱食前服海易簡斷下湯治下痢赤白無問新久長幼白朮茯苓各一錢甘草五分草果連皮一個上㕮咀用罌粟殼十四枚去筋膜並萼蒂剪碎用醋淹為粗末用作一服水一大碗姜七片棗子烏梅各七個煎至一大盞分二服服之赤痢者加烏豆二粒白痢者加乾薑五錢罌粟殼治痢服之如神但性緊澀多令人嘔逆既以醋製加以烏梅不致為害然嘔吐人則不可服大率痢疾古方謂之滯下多因腸胃素有積滯而成此疾始得之時不可遽止先以巴豆感應丸十餘粒白梅湯下令大便微利仍以前藥服之無不應手作效若脾胃素弱用豆蔻橘紅罌粟殼各等分為末醋煮麵糊為丸桐子大每服五十丸烏梅湯下兼治泄瀉暴下不止一服即愈更令藥力相倍為佳如覺噁心卻以理中湯四物湯加豆蔻木香輩調其胃氣仍以二陳湯煮木香丸定其嘔逆大凡痢疾乃腹心之患尊年人尤非所宜若果首尾用平和之劑決難作效必致危篤雖欲服此則已晚矣其秦艽地榆黃柏木通之類其性苦寒卻難輕服血痢當服胃風湯並膠艾湯之類白者宜服附子理中湯震靈丹之屬更宜審而用之若五色雜下泄瀉無時當用熟烏頭一兩厚朴乾薑甘草各一分生薑煎服今之治痢多用駐車丸黃連阿膠丸之類其中止有黃連肥腸其性本冷若所感積輕及余痢休息不已則服之取效若病稍重則非此可療世治痢側柏葉一錢甘草三錢御米殼去頂穰湯洗三次曬乾蜜拌炒黃一錢久者倍之上㕮咀水煎熟澄清入蜜呷服之先服木香檳榔丸後服此妙本又方黑豆五十粒陳皮半兩罌粟殼十四個甘草上四味半生半炒水煎空心服盡此一劑無不效者垣白朮安胃散治一切瀉痢無問膿血相雜裡急窘痛日夜無度又治男子小腸氣痛及婦人臍下虛冷併產後兒枕痛虛弱寒熱不止者御米殼三兩去頂穰蒂醋煮一宿茯苓白朮各一兩烏梅取肉一錢炒車前子一兩五味子半兩上為末每服五錢水煎溫服經治腸滑久痢神妙以石榴一個劈破炭火簇燒令煙盡急取出不令作白灰用碗蓋一宿出火毒為末用酸石榴一個煎湯調二錢聖治痢久不止腸垢已出以烏梅二個水一盞煎取六分去渣食前分為二服山治痢用五倍子為丸赤痢甘草湯下白痢乾薑湯下各十丸垣訶子皮散癸卯歲冬十月小雪天冷應時樞密院白家一老僕面塵脫色神氣特衰長跪於前曰病脫肛日久服藥未驗近日復下赤白膿痢作裡急後重白多赤少不任其苦求予治療予曰此非肉食膏粱者也必多蔬食或飲食不節天氣已寒衣蓋又薄寒侵形體不禁而腸頭脫下者寒也滑也真氣不禁形質不收乃血脫也此乃寒滑氣泄不固故形質下脫也當以澀去其脫而除其滑以大熱之劑除寒補陽以補氣之藥升陽益氣以微酸之味固氣上收名之曰訶子皮散御米殼五分去花萼蜜炒乾薑六分炮陳皮五分訶子皮七分煨去核上㕮咀水煎服或為白湯調服亦可若空心一服減半再服全愈羅養臟湯治大人小兒腸胃虛弱冷熱不調臟腑受寒下痢赤白或便膿血有如魚腦裡急後重臍腹疼痛日夜無度胸膈痞悶脅肋脹滿全不思食及脫肛墜下酒毒濕毒便血諸藥不效者並宜服之人參當歸各六錢木香一兩四錢肉桂八錢肉蔻麵裹煨半兩白芍藥一兩二錢甘草炙六錢白朮六錢御米殼蜜炙三兩訶子皮去核一兩二錢上㕮咀每服二大錢水煎去渣食前溫服老人孕婦小兒暴瀉急宜服之立愈忌酒面生冷魚腥油膩物臟腑滑泄夜起久不瘥者可加附子四片煎服此藥神效不可具述保治泄痢膿血乃至脫肛者宜地榆芍藥湯蒼朮八兩地榆卷柏芍藥各三兩上㕮咀每服二兩水煎溫服病退勿服世治痢大便不禁其大孔開如空洞不閉者用蔥和花椒末搗爛塞穀道中並服酸澀固腸之劑收之如御米殼訶子皮之類是也神效丹陳伯夫年二十歲性急好酒色奉養厚適有事多憂恐患久瘧寒熱無時忽一日大發熱大便所下皆是積滯極臭大孔極痛呻吟不絕其孔陷下囑付後事予曰此大虛也脈皆弦大而浮遂以瓦片令敲圓如銅錢狀燒紅投童子小便中急取起令乾以紙裹安痛處其時寒恐外寒乘虛而入也以人參當歸陳皮作濃湯飲之食淡味至半月而安久下赤白大孔痛不可忍炒鹽熨之又炙枳實熨之肘後痢久大孔急痛亦有寒熱者熟艾黃蠟訶子燒熏之妙日華子下痢大孔痛因熱流於下檳榔木香黃連黃芩加乾薑運氣下血有二其一熱助心血盛而血下經云少陰司天熱淫所勝民病血泄溺色變又云少陽在泉火淫所勝民病溺赤甚則便血又云歲金不及炎火乃行民病血便注下又云厥陰司天風氣下臨火縱其暴赤沃下注治以鹹寒是也其二寒攻心血虛而下經云太陰司天寒淫所勝血變於中民病血泄又云太陽之勝血脈凝泣或為血泄又云陽明司天之政四之氣民病血便治以諸熱是也運氣下白皆屬火經云少陽司天客勝甚則下白溺血是也運氣下赤白有三其一屬火經云少陽司天火淫所勝民病泄注赤白又云少陽在泉火淫所勝民病泄注赤白少腹痛注下赤白治以甘清是也其二屬風經云厥陰之勝腸鳴飧泄少腹注下赤白治以酸澀是也其三屬風濕經云太陽司天之政四之氣風濕交爭民病注下赤白是也運氣裡急後重有二其一濕助脾盛而重經云太陰之勝少腹滿腰脽重強內不便善注泄是也其二風攻脾虛而重經云厥陰司天風淫所勝民病溏泄瘕水閉是也瘕謂後重也本救命延年丸治丈夫女人一切重痢黃連乾薑當歸阿膠上三件為末用米醋煮阿膠令消盡不可剩卻將藥搜醋丸如桐子大每服三十丸飯飲吞下甚妙又方茱萸黃連阿膠白朮等分同炒黃上為細末麵糊為丸如桐子大每服三十丸陳米飲送下小兒十丸陳無擇無阿膠名戊己丸羅阿膠梅連丸治下痢無問新久赤白青黑疼痛諸症阿膠炒研極細烏梅肉炒黃柏炒黃連當歸赤芍藥乾薑炮赤茯苓各等分上為末入阿膠末研勻水丸桐子大米飲下黃連丸治赤白痢吳茱萸黃連上用好酒同浸三日各自為末各自丸白痢茱萸丸赤痢黃連丸甘草湯下赤白痢二丸相合服上四方寒熱兼施收散兼用之劑寒熱滑滯雜合為痢者宜之崔治痢方以生薑切如麻粒大和好茶一二碗任意呷之愈若熱痢則留姜皮冷則去皮炒又方用陳皮艾葉濃煎湯服滯下獨取足太陰一經經云脾足太陰之脈所生病者溏瘕泄水視盛虛熱寒陷下取之也東泄痢不禁小腹痛後重便膿血丹田一寸半復溜小腸俞灸七壯不已取天樞腹哀胃下一寸五分冷痢腹痛泄注赤白關元窮谷各灸五十壯泄痢及下失氣膿血下腰五十壯穴在八魁正中央脊骨上灸名三宗骨三報之便膿血久痢下重小腸俞灸世裡急後重合谷外關甲便膿血寒中食不化腹中痛腹哀主之溏瘕腹中痛臟痹地機主之丹予族叔形色俱實痎瘧又患痢自恃強健能食絕無忌憚一日召予曰卻健而能食但苦汗出耳汝能止此汗否予曰痎瘧非汗不能愈可慮者止健與能食耳此非痢也胃熱善消脾病不化食與積勢已甚矣此時宜節擇飲食以養胃氣省出入以避風寒候汗透而安叔曰世俗謂無飽死痢疾我今能食何謂可慮予曰痢而能食者知胃氣未病也故言不死非謂恣食不擇節者不從所言恣口大嚼過多又啖水果如此者月餘後強求治不可著手矣淹淹又月而死內經以驕恣不倫於理為不治之病信哉又周其姓者形色俱實患痢善食而易飢大嚼不擇者五月矣予責之曰病中當調補自養豈可恣味戕賊遂教其只用熟蘿蔔吃粥且少與調治半月而安羅如瀉痢止脾胃虛難任飲食者不可一概用克伐之劑宜補養充足自然能飲食也宜錢氏方中異功散設或因嗜飲食太過有傷脾胃而心腹痞滿噁心嘔逆不拘此例當權用橘皮枳朮丸一服得快勿再服若飲食調節不致有傷則胃氣自和平矣丹下痢久甚者寒涼藥中必兼升散並熱劑初下痢不可用參術唯氣虛者用之衍有一男子暑月患血痢醫妄用寒藥逆制專用木香黃連阿膠治之此藥始感便用則可倘病久腸虛者不宜服切宜戒之地榆性沉寒苦惟下焦熱血痢則可用若虛寒人及水瀉白痢未可輕使丹古方用厚朴專為瀉積滯之氣然厚朴性大溫而散氣久服大能虛人滯氣稍行即去之余滯未盡宜炒枳殼陳皮然枳殼亦能耗氣比厚朴雖少緩比陳皮亦為重若滯氣退一半亦當去之只用陳皮以和眾藥然陳皮去白用有補瀉之兼能若為參術之佐亦純作補藥用久泄久痢丹予族叔年七十稟壯形瘦夏末患泄痢至秋百方不應予視之病雖久而神不瘁小便澀少而不赤兩手脈俱澀而頗弦自言胸微悶食亦減因悟曰此必多年沉積癖在腸胃詢其平生喜食何物曰我甚喜食鯉魚三年無日不用予曰積痰在肺肺為大腸之臟宜大腸之不固也當與澄其源而流自清以茱萸陳皮青蔥蔍苜根生薑煎濃湯和以砂糖飲一碗許自以指探喉中至半時吐痰半升如膠其夜減半次早又服又吐半升而痢止又與平胃散加白朮黃連旬日而安朱仲符年近七十右手風攣多年七月患泄瀉百藥不愈診其脈右手浮滑而洪數予曰此必太陰分有積痰肺氣壅鬱不能下降大腸虛而作泄當治上焦遂用蘿蔔子加漿水蜜探之而吐得痰一塊大如碗色如琥珀稠黏如膠痢遂止不服他藥蔍苜一本作鹿目無考子和東門一男子病泄痢不止腹鳴如雷不敢冷坐坐則下注如傾諸醫例斷為寒症官桂乾薑丁香豆蔻枯礬龍骨之屬皆服之矣針灸無效遷延已二十載矣一日問於戴人戴人曰兩手寸脈皆滑予不以為寒然其所以寒者水也以茶調散湧寒水五七升又以無憂散泄積水數十行乃通因通用之法也次以五苓散淡劑滲泄利水道又以甘露散止渴不數日而冷食寒飲皆如故此法王啟玄言之矣奈無人用之何哉太康劉倉使大便少而頻日七八十次常於兩股間懸半枚瓠蘆戴人見而笑之曰便既頻而少欲通而不得通也何不大下之此通因通用也止宜一服藥之力乃與藥大下二十餘行頓止潔治泄痢久不安膿血稠黏裡急後重日夜無度宜大黃湯用大黃一兩銼用好酒兩大盞浸半日同煮至一盞半去渣分為二次頓服之痢止停服未止再服以利為度又服芍藥湯以和之所以徹其毒也芍藥湯方見滯下和里條保白朮黃芩湯服前藥痢已除宜以此和之白朮一兩黃芩七錢甘草三錢上㕮咀水煎去渣溫服丹有人每早須大瀉一行或腹痛或不腹痛空心服熱藥亦無效有人教以夜食前又進熱藥一服遂安後如此常服愈蓋暖藥雖平旦服之至夜力已盡無以敵一夜陰氣之故也本治腎泄五味子散五味子二兩吳茱萸半兩上二味炒香熟研為細末每服二錢陳米飲下有一人每五更將天明時必溏痢一次如是數月有人云此名腎泄腎感陰氣而然服此頓愈每日早起瀉一二行俗謂之受肚瀉是也其症有二一屬寒積在內即前二條之症是也一屬食積在脾嘗治翁仲政久泄早必泄一二行泄後便輕快脈滑而少弱先與厚朴和中丸五十丸大下之後以白朮為君枳殼茯苓半夏為臣厚朴炙甘芩連川芎滑石為佐吳茱萸十餘粒為使生薑煎服十餘帖而愈仲下痢已瘥至其年月日時復發者以病不盡故也當下之宜大承氣湯本治痼冷在腸胃間頻年腹痛泄瀉休作無時服諸熱藥不效宜先取去然後調治不可畏藥以養病也厚朴乾薑甘草桂心附子生各二錢大黃生細切水一盞浸半日煎汁用之上㕮咀水二升半煎八合後下大黃汁再煎六合去渣分三溫服服自夜至曉令盡否則更以乾薑丸佐之乾薑丸乾薑巴豆去心研炒黃大黃人參各一兩上除巴豆余為末同研煉蜜丸如桐子大食前用湯吞下一丸陳米飲亦得有人因憂愁中傷食結積在腸胃欲發吐利自冬後至暑月積傷發暴下數日不已玉函云下痢至隔年月日應期而發者此為有積宜下之止用溫脾湯尤佳如難下可佐以乾薑丸後服白朮散白朮木香附子人參各等分上細末每服二錢水一盞生薑三片棗子一個煎六分溫服丹東陽胡兄年四十歲患痢百餘日百法治不效時正九月初旬予診其六脈促急沉弦細弱芤左手為甚晝夜十行視之穢物甚少雖下清涕中有紫黑血絲食全不進予曰此非痢也當作瘀血治之其兄問瘀血何事而致予曰飽食急走極力叫罵毆打顛撲多受疼痛盛怒不泄補塞太過大酒大肉皆能致之彼云去歲枉受責杖經涉兩年恐非此等瘀血予曰服吾藥得瘀血下則生矣以桃仁乳香沒藥滑石佐以檳榔木香用神麯糊為丸以米飲下五十粒至夜半又不動又依前法下二百粒至天明下穢如爛魚腸者二升半困頓終日漸與粥食而安久泄是風邪內縮先煎小續命湯以發其汗使邪氣不能侵於外然後治其痢秋冬間下痢並治翻胃加減厚朴丸大妙此症系風邪縮於內其症下痢不止寸脈沉而遲手足厥逆下部脈不至咽喉不利或涕吐膿血為難治宜麻黃升麻湯或小續命湯以發之法曰表邪縮於內當散邪於四肢布於絡脈外無其邪臟腑安矣有食積者加枳實五錢如酒入而泄瀉此熱也加黃芩五錢麻黃升麻湯見傷寒小續命湯見中風子和李德卿妻因產後病泄一年餘四肢瘦乏諸醫皆斷為死症求治戴人戴人曰兩手脈皆微小乃痢病之生脈況洞泄屬肝經肝木剋土而成此疾亦是腸澼澼者腸中有積水也先以舟車丸四五十粒又以無憂散三四錢下四五行人皆駭之病羸如此尚可通耶眾人雖疑然未敢誚且更看之復以導飲丸又通之渴則調飲五苓散向晚使人伺之已起而緝麻前後約三四十行以胃氣湯調之半月而能行一月而安健劉德源病洞泄逾年食不進肌瘦力乏行步欹傾面色黧黑舉世治痢之藥皆用之無效戴人先以舟車丸無憂散下十餘行殊不困已頗喜食後以檳榔丸磨化其滯待數日病已大減戴人以為去之未盡當再服前藥德源亦欣然請下之又下五行次後數日更以苦劑越之往問其家彼云已下村中收索去也丹一丈夫酒多病泄久不愈又自進附椒等食不進泄愈多滑石黃芩半兩乾薑黃連樗皮粥為丸每服一百丸予治方憲可二三年久泄下積但食肉則甚脈右關滑左沉細先以厚朴丸三四十粒下之次奪其食用補劑加二陳及樸連楂榔等消導藥煎湯下厚朴丸五粒阿魏丸二十五丸服之五六日漸得下氣多而泄不止遂間服固腸丸泄漸止即安是知固腸丸之苦寒治酒肉積之要藥也厚朴丸方見翻胃垣聖餅子治瀉痢赤白臍腹撮痛久不愈者黃丹密陀僧各二錢輕粉少許定粉硫黃各三錢上為細末入白麵四錢和水丸如桐子大捻作餅子陰乾食前溫漿水磨服以大便黑色為效衍義云黃丹治久積丹脾泄當大補脾氣而健運之潔肉蔻丸治腎泄久不愈脈沉細無力者效破故紙肉豆蔻麵裹煨各等分上為末棗肉丸如桐子大米飲空心下世固中丸治脾久泄去後與氣不快者蒼朮肉豆蔻煨各一兩上粥丸桐子大每服五十丸於固中丸內加破故紙一兩名固下丸治腎久泄丹泄瀉丸治久病大腸氣泄熟地五錢芍藥炒知母各三錢升麻乾薑各二錢生甘草一錢上為末白湯調服再灸百會三五壯又方白朮神麯芍藥俱炒或散或丸子服愈垣治老人奉養太過飲食傷脾常時脾泄白朮炒二兩白芍藥酒炒一兩神麯炒一兩半山楂二兩半夏制一兩黃芩炒半兩上為末青荷葉燒飯丸本治腎泄宜五味子散方見早瀉條訶黎勒丸治休息痢晝夜無度臍腹撮痛諸藥不效椿根白皮二兩訶子半兩去枝母丁香三十粒上為細末醋糊丸如桐子大每服五十丸陳米飲湯入醋少許一日三服效椿根乃樗根俗所謂虎眼樹是也本木香散治隔年痢不止並治血痢尤捷木香銼用黃連半兩同炒罌慄殼銼用生薑半兩同炒甘草炙一兩上為細末入麝香少許每服一錢陳米飲下世治久瀉不止用百草霜研細以粥糊為丸白湯下張文仲治痢久下經時不愈者此名休息痢取大蟲骨炙焦搗末調服日三匕效千治赤白痢積年不瘥飲湯調雲母末方寸匕兩服效又治血痢用千年石灰五升熬黃以水一斗攪令澄清一服日三升胎前下痢本治婦人胎前產後赤白痢生薑年少者百錢老者二百錢重取自然汁鴨子一個打碎入薑汁內攪勻上二味煎至八分入蒲黃三錢煎五七沸空心溫服立效無妊娠下痢赤白絞刺疼痛雞子一枚烏雞者佳傾出清留黃用黃丹一錢入雞子殼內打令勻以厚紙糊牢鹽泥固濟火上煨焙乾研為細末上每服二錢米飲調下一服愈者是男二服愈者是女大治妊娠素弱頻並下痢腹痛羸瘦面色痿黃不進飲食厚朴一兩半白朮川芎白芍藥熟地當歸乾薑人參各一兩訶子三錢甘草一錢上㕮咀每服四錢姜三片同煎又方治妊娠下痢腹痛小便澀當歸黃耆各一兩糯米一合上細切和勻水煎分四服羅大寧散治妊娠下痢赤白灰色泄瀉疼痛垂死者黑豆三十五粒粟殼二兩半生半炒甘草二兩半生半炒上為粗末都作一服生薑三片同煎食前服神效大治妊娠挾熱下痢亦治男子常痢黃連黃柏各一升山梔仁二十枚上㕮咀每服五錢水二盞浸二時久煮十沸頓服若嘔加陳皮一兩半姜三兩黃連湯治妊娠下痢赤白膿血不止黃連八分厚朴制阿膠炙當歸乾薑各六分艾葉黃柏各四分上為細末空心米飲調下方寸匕日三服厚朴散治妊娠下痢黃水不絕厚朴姜炙三兩黃連三兩肉豆蔻一枚連皮用上為粗末水煮頓服草果飲治妊娠臟氣本虛脾胃少弱臟腑虛滑腹臍疼痛日夜無度厚朴薑製二兩肉豆蔻一個麵裹煨上㕮咀每服三錢姜三片同煎產後痢云救急散治產後赤白痢腹中絞痛芍藥阿膠艾葉熟地各一兩甘草當歸各三兩上㕮咀水煎分二服空心飲大當歸芍藥散治妊娠腹中絞痛心下急痛及療產後血暈崩中久痢方見婦人血崩門楊療妊娠血痢用阿膠二兩以酒一升半煮取一升頓服大產後諸痢煮薤白食之又方羊腎脂炒薤白空心食之甚佳經治產後胎前痢疾敗龜甲一枚米醋炙研為末醋湯調下丹溪云龜甲大補陰治勞倦丹婦人患墮胎後膈滿食少痢不止脈虛左手尤甚滑石白芍藥炒蒼朮各五錢白朮二錢五分乾薑四錢茯苓一錢訶子二錢煨上為細末調下保和丸四五十粒云產後血痢臍腹疼痛四物湯加槐花黃連御米殼等藥黃連丸治產後赤白痢腹中攪痛不忍黃連四兩阿膠蒲黃梔子仁各一兩當歸二兩半黃芩黃柏各二兩上為末煉蜜丸如桐子大每服六七十丸米飲調下日三夜一仲產後下痢虛極白頭翁加甘草阿膠湯主之脈經作熱痢重下新產虛極者白頭翁阿膠各二兩黃連黃柏秦皮各三兩甘草二兩上以水七升煮取二升半納膠令消盡分三服溫服婦人臨產痢疾山梔不拘多少燒灰為細末空心熟水調下一錢甚者不過五服產後血痢小便不通臍腹疼痛用生馬齒莧搗汁二大合煎一沸下蜜一合調頓服梅治產後血泄不禁余血作痛兼塊桂心乾薑等分為末空心酒調服方寸匕大療產後痢日五十行者取木里蠹蟲糞炒黃急以水沃之令稀稠得所服之即瘥聖產後諸痢方取蒼耳葉搗汁半盞日三四溫服大便不通垣津液耗而燥者以辛潤之腎主五液津液盛則大便如常若飢飽勞役損傷胃氣及食辛熱厚味之物而助火邪伏於血中耗散真陰津液虧少故大便結燥又有年老氣虛津液不足而結者腎惡燥急食卒以潤之是也潤腸丸並加減法治胃中伏火大便閉澀或乾燥不通全不思食乃風結血秘皆令閉塞須潤燥和血疏風則自然通矣羌活歸梢大黃煨各半兩麻仁桃仁泡去皮尖各一兩上為末除麻仁桃仁另研如泥外為細末煉蜜為丸如桐子大每服三五十丸空心白湯下如病人不小便因大便不通而澀其邪盛者急加酒洗大黃以利之如血燥者加桃仁酒洗大黃如風結燥者加麻仁大黃如風澀者加煨皂角仁大黃秦艽以利之如脈澀覺身癢氣澀者加郁李仁大黃以除氣躁如寒陰之病為寒結閉者以局方中半硫丸或加煎附子生薑湯冰冷與之其病雖陰寒之症當服陽藥補之若大便恆不甚通者亦當十服中與一服利藥微通其大便不令閉結乃治之大法也若病人雖是陰症或是陰寒之症其病顯躁脈堅實亦宜陽藥中少加苦寒之劑以去熱躁躁止勿加如陰躁欲坐井中者其二腎脈按之必虛或沉細而遲此為易辨如有客邪之病亦從權加藥以去之上一方加減法隨寒熱虛實及血秘氣秘風秘用藥至為詳盡余方皆不出此也垣活血潤腸丸治大便風秘血秘時常結燥當歸梢一錢防風梢二錢羌活一兩大黃煨一兩麻子仁二兩半桃仁二兩研如泥皂角仁炮存性去皮秤二兩其性得濕則滑滑則燥結自除上除麻仁桃仁另研如泥外為極細末煉蜜為丸桐子大每服五十丸白湯下三二服後須以蘇子麻子粥每日早晚食之大便日久再不結燥以瓷器盛之紙封勿令見風當歸潤腸湯升麻二錢當歸梢一錢熟地一錢生地二錢紅花五分大黃煨甘草梢生桃仁麻仁各一錢研如泥上銼如麻豆大作一服水三盞入桃麻仁煎一盞空心稍熱服導滯通幽湯治大便難幽門不通上衝吸門不開噎塞不便燥閉氣不得下治在幽門以辛潤之當歸身升麻梢桃仁泥甘草炙各一錢紅花少許熟地生地各五分上㕮咀作一服水二大盞煎至一盞調檳榔細末五分稍熱服之海許學士治年老虛秘麻仁蘇子各半合研取汁分二服煮粥服之不藥而愈羅潤腸橘杏丸降氣潤腸服之大腸自無澀滯橘皮杏仁去皮尖並雙仁者麵炒黃各等分本草云杏仁能潤氣燥上等分為末煉蜜丸如桐子大每服五十丸空心溫水下亦不損胃氣上乃潤燥法蓋桃仁麻仁治血燥杏仁郁李仁治氣燥皂角仁治風燥也丹楊淳三哥大便秘澀小便如常咽塞不通食下便有痰出脈澀左右手同此血虛腸燥為脾約病甚者人參散主之人參黃耆各一錢厚朴八分炒地黃七分桃仁枳殼炒各一錢甘草少許炙煎入竹瀝薑汁飲之又與鎖陽蓯蓉二錢桃仁一錢煮粥入竹瀝名潤腸散婦人腸秘補血和氣以通之肉蓯蓉一兩半麻仁白芍藥陳皮當歸身各一兩上為末曬乾炒神麯糊為丸如桐子大食前白湯下五十丸二次服世蓯蓉潤腸丸治發汗過多耗散津液大腑秘結蓯蓉酒浸焙二兩沉香另研一兩上為末用麻仁汁打糊丸如桐子大每服七十丸米飲下海益血丹治大便燥久虛亡血當歸酒浸焙熟地各等分上為末煉蜜丸如彈子大細嚼酒下丹大腸虛秘而熱者白芍藥一兩半陳皮生地當歸身各一兩條芩甘草上粥為丸白湯下上蓯蓉當歸地黃潤燥法蓋積血枯竭而虛甚者宜之垣有物有積而結者當下之食傷太陰腸滿食不化腹響響然不能大便者以苦泄之仲景麻仁局方七宣丸皆以大黃為君之類是也垣治注夏大便澀滯者血少血中伏火也黃耆人參湯加生地黃當歸身桃仁泥麻仁泥潤之黃耆人參湯方見注夏如潤之大便久不快利者少加煨大黃微利之如加大黃久不快利者非血結血秘是熱則生風病必濕風症止當服黃耆人參湯只用羌活半兩防風半兩水四盞煎至一盞去渣空心服之其大便必大走也丹脾約丸論成無己曰約者結約之約又束約之約胃強脾弱約束津液不得四布但輸膀胱故小便數而大便硬故曰脾約與此丸以下脾之結燥潤腸結化津液入胃則大便利小便少而愈矣愚竊有疑者既曰脾約脾弱不能運也脾弱則土虧矣必脾氣之散脾血之耗原其所由久病大下大汗之後陰血枯槁內火燔灼熱傷元氣又傷於脾而成此症傷元氣者肺金受火克氣無所攝傷脾者肺為脾之子肺耗則津竭必竊母氣以自救金耗則木寡於畏土欲不傷不可得也脾失轉輸之令肺失傳送之官宜大便秘而難下小便數而無藏蓄也理宜滋養陰血使孤陽之火不熾而金行清化木邪有制脾土清健而運行津液津液入胃則腸潤而通矣今以大黃為君枳實厚朴為臣雖有芍藥之養血麻仁杏仁之溫潤為之佐使用之熱甚而氣實者無有不安愚恐西北二方地氣高厚人稟壯實者可用若用之東南之人內熱自甚而血氣不實者雖得暫通將見脾愈弱而燥矣後之用此方者須知在西北以開結為主在東南以潤燥為主慎勿膠柱而鼓瑟可也潔臟腑之秘不可一概治療有虛秘有實秘胃實而秘者能飲食小便赤當以麻仁丸七宣丸之類主之仲景麻仁丸方見傷寒陽明病每服二十丸未知加至五十丸日三服以利為度局七宣丸柴胡五兩桃仁去皮尖炒六兩枳實麩炒五兩甘草炙四兩訶子皮木香各五兩大黃麵裹煨十五兩上為細末煉蜜丸如桐子大每服二十丸米飲送下漸加四五十丸以利為度鬥治大便不通用烏桕木皮方一寸劈破以水煎取小半盞服之立通不用多服其功神聖兼能取水或以此湯調下五苓散二錢空心更妙潔胃虛而秘者不能飲食小便清利厚朴湯主之陳皮一兩甘草炙二兩厚朴制二兩白朮三兩半夏曲一兩枳實炒一兩上粗末每用三五錢水盞半姜三片棗一枚煎至一盞去渣空心溫服實秘者物也虛秘者氣也世檳榔散治腸胃受濕大便秘澀用檳榔不拘多少為末每服二錢蜜湯點服不拘時海桃杏仁俱治大便秘當以血氣分之年老虛人大便燥秘者脈浮在氣杏仁陳皮主之脈沉在血桃仁陳皮主之所以俱用陳皮者以其於陽明病與手太陰為表裡也又云盛則難便行陽氣也敗則便難行陰血也仲問曰脈有陽結陰結者何以別之曰其脈浮而數能食不大便者此為實名曰陽結也期十七日當劇其脈沉而遲不能食身體重大便反硬名曰陰結也期十四日當劇垣有陽結有陰結陽結者散之陰結者熱之熱氣留於小腸腸中痛臍熱焦渴則堅幹不得出故痛而閉不通矣全文見諸痛膀胱移熱於小腸膈腸不便全文見診病傳變保大黃牽牛散治相火之氣遊走臟腑大便秘結大黃一兩牽牛頭末半兩上為細末每服三錢有厥冷合用酒調無厥冷而手足煩熱者蜜湯調下食後以微利為度此謂不時而熱者濕熱也凡用大黃半兩至一兩而大便不通利者加麝少許調於藥中則大便必大走也上熱秘皆陽結之屬仲景大小承氣及麻仁丸之類是也方見傷寒陽明病世治後分閉塞用萱草根一捻同生姜搗碎取自然汁服之立愈局半硫丸治年高冷秘虛秘硫黃研細生用半夏為末上等分和勻生薑自然汁打麵糊為丸桐子大每服五十丸空心溫酒薑湯任下垣麻黃白朮湯治大便不通五日一遍小便黃赤渾身腫面上及腹尤甚色黃麻木身重如山沉困無力四肢痿軟不能舉動喘促唾清水吐穢痰白沫如膠時躁熱發欲去衣須臾而過振寒頂額有時如冰額寒尤甚頭旋眼黑目中溜火冷淚鼻不聞香臭小腹急痛當臍有動氣按之堅硬而痛麻黃不去根節五分桂枝三分杏仁四個吳茱萸四分白豆蔻五分厚朴三分炒曲五分升麻二分柴胡白朮蒼朮各三分甘草生一分澤瀉白茯苓各四分橘紅二分青皮去穰黃連酒浸黃柏酒浸黃耆人參豬苓各三分熟甘草一分上㕮咀分作二服每服水二大盞半先煎麻黃沸去沫再入諸藥同煎至一盞去渣稍熱食遠服此症宿有風濕熱伏於榮血之中其水火乘於陽道而上盛元氣短少上喘為陰火傷其氣四肢痿在腎水之間乃所勝之病今正遇冬寒得時乘其肝木又實其母肺金剋木凌火是大勝必有大復其症善怒欠多嚏鼻中如有物不聞香臭目視䀮䀮多悲健忘少腹急痛遍身黃腹大脹面目腫尤甚食不下痰唾涕有血目眥瘍大便不通只二服皆愈運氣大便閉有三一曰熱經云熱至則淋閉又云少陰之復膈腸不便是也二曰寒經云太陽所至為禁止是也三曰濕經云太陰司天濕淫所勝病大便難是也仲蜜煎導法方見傷寒胃實丹溪云潞公夏中病泄有人與石脂龍骨乾薑等藥痢雖止而勢甚苦公又不樂大黃藥遂一夕用蜜煎三下結糞五十枚遂安若虛人秘者難下藥宜用此法海霹靂煎用鹽與蜜乘熱捻如蜜煎法上頭銳用十許納穀道中少許化開即通一法用蜜煎不通者純用鹽吹入穀道中亦妙海蜜煎與鹽相合如用草烏頭末相合亦可蓋鹽能軟堅潤燥草烏能化寒消結可隨症陰陽所宜用之急提盆散治雜病非陰候者用草烏頭不拘多少為極細末每用蔥一枝肥者削去須圓頭上有汁濕蘸之納穀道中仲豬膽汁方方見傷寒胃實孟大便不通氣奔欲死者以烏梅十個置湯中須臾挪去核杵為丸如棗大納下部少時即通又方治大小便不通江子肉杏仁皂角上為末作餅置臍上艾灸自通世通關散治卒閉不通用鹽入臍中灸即通去之本宣積丸手心握藥便通巴豆乾薑韭子良薑硫黃甘遂白檳榔各等分上為細末研飯為丸如龍眼大早朝先用椒湯洗手麻油塗手掌口握藥一粒移時便瀉欲止以冷水洗手針灸大便閉有二法其一取胃經云腸中不便取三里盛瀉之虛補之是也其二取腎經云邪在腎病大便難取之湧泉崑崙視有血者盡之玉大便秘塞照海五分補二呼瀉六吸立通支溝半寸瀉三吸撮又法照海瀉之立通太白瀉之灸亦可集又法照海半寸灸二十壯瀉之章門灸二七壯太白半寸灸五壯以上諸穴看虛實補瀉之虛結補則通熱結瀉則通寒結先瀉後補熱結先補後瀉之摘又法氣海八分令病人覺便三五次為度出針時記令人挾臍揉之卻刺三里三里五分覺腹中鳴三五次即透世又法合谷東大便閉背七椎兩傍相去各一寸灸三壯承筋灸三壯陽繞挾玉泉相去二寸隨年壯針灸書無此穴或云非正穴也又法石門寸半大都五分摘治大便不通並傷寒水結三間沿皮下向至合谷穴三補三瀉候腹中通出針承山七分瀉之甲大便難中渚及太白主之又大鐘主之丹予觀古方通大便皆用降氣品劑蓋肺氣不降則大便難傳送用杏仁枳殼沉香訶子等是也又老人虛人風人津液少而秘者宜以藥而滑之用胡麻麻仁阿膠等是也如妄以峻利藥逐之則津液走氣血耗雖暫通而即秘矣必更生他病昔王少府患此疾有人以快藥利之者累矣後為肺痿咯膿血卒至不通而死產後大便不通本婦人產後有三種疾鬱冒則多汗汗多則大便秘故難於用藥惟麻子蘇子粥最為穩當一用紫蘇子大麻子二味各半合洗淨研極細用水再研取汁一盞分二次煮粥啜下此粥不唯產後可服大抵老人諸虛風秘皆宜服之嘗有一人母年八十四忽爾腹痛頭疼噁心不食召醫數十議皆用補脾進食治風清利頭目等藥數日雖愈全不入食其家憂惶予辨說前藥皆誤矣此症正是老人風秘臟腑壅滯聚於胸中則腹脹噁心不思飲食又上至於顛則頭痛神不清也若臟腑流暢諸疾悉去矣予令作此粥兩啜而氣泄先下結糞如胡椒者十餘枚後漸得通利不用藥而自愈矣丹產後秘結不通膨滿者氣急難坐臥用麥蘖末酒下一合神效出兵部手集大小便不通丹一婦人脾疼後患大小便不通此是痰隔中焦氣聚上焦二陳加木通初服後吐渣再服山大小便不通燒皂角灰為末粥清調下本車狗散治大小便經久不通欲死者用推車客七個土狗七個在土名土狗在水名水狗二物新瓦上焙乾為末以虎目樹皮向東南者濃煎湯服之經驗如神虎目即虎杖其性大能利小便又解暑毒一說男子病推車客用頭土狗用身女人病土狗用頭推車客用身效海回生神膏治陰症大小便不通及諸雜病陰候大小便不通者宜用此治法數日不通危急者用之非急不用牡蠣陳粉乾薑炮各一兩上為細末男病用女人唾調手內擦熱緊掩二卵上得汗出愈女病用男子唾調手內擦熱緊掩二乳上得汗出愈蓋卵與乳乃男女之根蒂坎離之分屬也脈盛皮熱肚脹前後不通瞀悶此謂五實全文見治虛實法丹掩臍法治大小便不通用連根蔥一二莖帶土生薑一塊淡豆豉二十一粒鹽二匙同研爛作餅烘熱掩臍中以帛扎定良久氣透自通不通再換一餅桑大小便不通大都七分東大小便難環岡在小腸俞下二寸橫紋間灸取之水道二十壯榮衛在背脊四面各一寸八分腰眼下三寸挾脊相去四寸兩邊各四穴灸十壯至百壯或云此穴未詳甲三焦約大小便不通水道主之產後大小便不通云療產大小便不利下血車前子黃芩蒲黃牡蠣生地芍藥各一兩五錢上為細末空心米飲服方寸匕忌面蒜心治婦人產後忽小腹脹如蠱大小便不通氣海三里關元三陰交陰谷主之
