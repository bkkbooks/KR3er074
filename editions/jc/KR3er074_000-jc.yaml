body:
  text: 內經運氣類注序文夫運氣之道上古聖人所以參天地贊化育者也蓋氣流行於天地間有化有變其化也在人為生育其變也在人為疾死故贊其化育以濟其生者必先制其疾以拯其死此則醫道之所由設使有生者無夭折享壽考而其德業可與天地參矣然其道載諸內經者廣大精微非淺學所可易知是以後世悉皆湮晦今姑舉其大略言之五運屬陰守於地內六氣屬陽周於天外其化生於人也五運化生五臟屬內六氣化生六腑十二經屬外其變疾於人也五運內變病於五臟甚則兼外六氣外變病於六腑十二經甚則入內內外變極然後死也五運有平氣太過不及之殊六氣有常化淫勝反勝相勝之異五運平氣者其歲化生皆當本位如木平氣敷和之紀其色蒼其味酸之類是也其變病皆在本臟如木平氣之病在肝也太過者歲變平氣為太過其化生皆兼非位如太過發生之紀其色青黃白其味酸甘辛如兼非位之土金是也其變病皆在己所勝之臟如木太過則木勝脾土而脾病也其勝乃本氣有餘而勝故不為他氣報復間有復者是不務其德暴虐失常也不及者歲變平氣為不及其化生亦兼非位如木不及委和之紀其果棗李其味酸辛亦兼非位之土金是也其變病皆己所不勝者乘虛勝之而本臟病勝極則己所生者報復其勝而勝者之臟亦病如木不及則金勝之而肝病勝則火復金讎而肺亦病也其勝乃乘我之虛而勝勝之根本不固故為他氣報復凡此五運之氣皆有定紀者也六氣常化者天地六位之化各守常位生病各當本處其天地之常化如厥陰司天少陽在泉之歲風化居上火化居下風病行於上熱病行於下之類而不出他位也其六位之常化如厥陰司天之歲初之氣化風燥民病寒於右之下二之氣化寒熱民病熱於中之類而不雜他氣也凡此六氣之常化皆有定紀猶五運平氣也淫勝者天地之氣變常內淫而勝也天氣內淫而上勝於下則己所勝之臟經受邪而病甚如厥陰司天風淫所勝其病在足太陰脾經也地氣內淫而外勝於內其病在足陽明胃經也凡此六氣之淫勝猶五運太過皆有勝無復其勝之盛雖有定紀其勝之動否則無定紀而不可必也反勝相勝者六位之左右變常乘虛而勝也其乘天地之虛而勝者為反勝左右自有相勝乘虛而勝者為相勝皆視所虛之氣侮不勝己者勝之勝極則仍為虛者之子復之如所虛之氣屬太陰則所勝之氣屬厥陰而病在脾胃經所復之氣屬陽明而病在肝膽經也蓋天地歲氣猶王也左右步氣猶諸侯也左右勝天地猶諸侯僣亂故曰反勝左右自相勝猶諸侯自相征伐故曰相勝也凡此六氣之反勝相勝五運不及故皆有勝有復其氣其動皆無定紀但隨虛而勝隨勝而復也諸五運皆有定紀者陰靜有常也六氣少有定紀者陽動多變也五運之平氣之常化為常其化生為常之常變病為常之變五運之太過不及與六氣之淫勝反勝相勝為變其化生為變之常變病為變之變太過淫勝為變之盛不及反勝相勝為變之虛察其常變以定生死詳其虛實以斷補瀉謹道如法萬舉萬全也然其經奉行於世惟唐太僕令王冰氏篤好之大為詮註而其昭彰道要開示玄微者於功為大但千慮一失而不得經旨者亦或有之為未盡善也於是不分常變釋六氣勝復無定紀之變為有定紀之常不分盛虛釋左右乘虛之相勝為司天之淫勝是則運氣之義不明自此始矣後雖有林氏校正孫氏考誤與夫託名所著玄珠密語天元玉冊及諸家運氣圖說之類然皆不能出王氏之右而救其失反使運氣之義愈晦而書愈繁至於河間所注病機其形容病化之情狀推究火熱之眾多真有發前人未發之妙奈何又以運氣之所屬皆為盛而不察其所屬各有盛虛以盛虛所兼非位之化皆為似而不察其所兼之盛者似虛者是為重失矣夫王氏釋變氣為常氣相勝為淫勝則人不識變而占運氣不應年辰河間釋運氣之所屬皆為盛所兼非位之化皆為似則人不識虛而施治法不對病證遂使世俗皆愀然不信而棄之也其不知變者曰某氣司天屬陰寒今反炎熱某運合太過令反不及此乃上古之天道非可占之於今世也其不知虛者曰某病屬熱投寒劑不痊某證當瀉施瀉法反劇此乃北方之治法非可用之於南人也惟戴人云病如不是當年氣看與何年氣運同便向某年求活法方知都在至真中之歌似能破世之惑又引而不發嗚呼有定紀之年辰與無定紀之勝復相錯常變今獨求年辰之常不求勝復之變豈得運氣之真哉六氣之盛寒盛熱與虛寒虛熱同其所屬今獨求寒熱之所屬不求寒熱之盛虛豈得寒熱之情哉苟以常變盛虛觀運氣寒熱則古今南北皆可一以貫之而所謂參天地贊化育如視之掌也僕自早歲留志是書鑽研既久似得二三爰據所知挈其宏綱開以節目而類編集之使常變必分盛虛必著或前賢之注未備者間以己意附之庶幾運氣之義燦然復明目之曰運氣補註雖僣逾之罪莫逃然濟生一念自有不容己者凡吾同志幸改正云運氣占候補遺序夫五運六氣上古聖人所以參三才而贊化育者也故位天者天文也位地者地理也通乎人氣之變化者人事也然天道有陰陽多少之殊地理有高下氣至有先後之異人之壽夭生化之期則損益盛虛之變也此其上下參錯而不可以定數求者焉若夫五六之會終期之日刻漏而分數之亦陳其梗概焉耳至於氣至之先後勝復之郁發安可預擬乎故曰數之可數者人中之陰陽也天地之陰陽不可以數推以象見者也夫象者占候之所始道之所生不可不通也今夫天垂象地成形七曜緯虛五行麗地地者所以載生成之形類也虛者所以列應天之精氣也形精之動猶根本之與枝葉也故形盛則精盛形衰則精衰五星明大減小即五運之太過不及可得而占也今夫地道實天道虛實者氣之所寓虛者色之所因也五氣應於下則五色彰於上五天之經緯成而後五氣之至可得而占也地為人之下太虛之中大氣舉之也燥以干之暑以蒸之風以動之濕以潤之寒以堅之火以溫之故風寒在下燥熱在上濕氣在中火遊行其間寒暑六入故令虛而化生也故煙埃雲物之態山川草木之容皆可得而占焉至於地理有高下陰陽有多少至高之地陰氣常在至卑之地陽氣常在則高下異占也又春氣始於東夏氣始於南秋氣始於西冬氣始於北行有逆順至有遲速則上下左右異占也是皆形精之必效微而顯信而不爽者歟是故古之至人仰以觀於天文俯以察乎地理中以通乎人事然後所以定神明之紀而成變化之用也世之學者求陰陽於支幹配合之間論勝負於主客加臨之位不效則以為古書不足信也是豈書之罪也哉間因讎校樓氏醫學綱目書覽其後有運氣補註一篇惜其用意甚勤而尚遺古人占候之法是以取諸內經之旨列占候十五篇命曰運氣占候補遺以續樓氏之後云嘉靖乙丑季春日婁東玄沙邵弁偉元識運氣占候五運氣至之占帝曰余聞五運之數於夫子不合陰陽其故何也岐伯曰是明道也此天地之陰陽也夫數之可數者人中之陰陽也然所合之數可得者也夫陰陽者數之可十推之可百數之可千推之可萬天地陰陽者不以數推以象之謂也丹天之氣經於牛女戊分黅天之氣經於心尾己分牛女癸也戊癸化火又癸與子同屬戊與午連位皆火分也心尾甲也甲己化土又甲與醜連位巳與未同屬皆土分也蒼天之氣經於危室柳鬼危室壬地柳鬼丁地壬與亥同屬丁與巳連位齊化木也素天之氣經於氐亢昂畢氐亢乙地昴畢庚地乙與卯同屬庚與酉連位同化金也玄天之氣經於張翼婁胃張翼丙地婁胃辛地丙與辰連位辛與戌同屬齊化水也所謂戊己分者奎壁角軫則天地之門戶也戊己位木火金水中間在天地為門戶在四時為長夏南連午西連申故戊己無方位而經獨言戊分己分也戊火連申夾未土於中癸火連寅夾醜土於中者蓋濕土在中火遊行其間在天居土前在地居土後而土火常相混也夫候之所始道之所生不可不通也五氣之至各有五色經於分野氣太過則先天而至氣不及則後天而至常以寅卯前候之自然可見此占候之所始道之所生不可不通也五運行大論五運太過之占諸壬歲木太過風氣流行脾土受邪上應歲星歲星光明逆守宿屬分有災也化氣不政生氣獨治雲物飛動草木不寧甚而搖落上應太白星木余土鬱化政不布於萬物故生氣獨治也風氣動甚草木不寧甚而搖落金來復之也故太白逆守屬星者危也諸戊歲火太過炎暑流行金肺受邪上應熒惑星收氣不行長氣獨明雨水霜寒上應辰星火氣獨行水氣折之辰星逆凌乃寒災於物也占辰星者常在日之前後三十度其災之發當至南方諸甲歲土太過雨濕流行腎水受邪上應鎮星變生得位謂土旺時月也藏氣伏化氣獨治之泉湧河衍涸澤生魚風雨大至土崩潰鱗見於陸上應歲星土不務德木來折之也諸庚歲金太過燥氣流行肝木受邪上應太白星收氣峻生氣下草木斂蒼干凋隕上應熒惑星金勝而火復之也諸丙歲水太過寒氣流行邪害心火上應辰星大雨至埃霧朦郁上應鎮星水勝土復也上臨太陽雨冰雪霜不時降濕氣變物上應熒惑辰星辰戌天符之歲水勝而火絕熒惑減燿辰星明瑩逆守宿分有災也氣交變大論五運不及之占諸丁歲木不及燥乃大行生氣失應草木晚榮肅殺而甚則剛木闢著悉萎蒼干上應太白星金侮木之不勝也上臨陽明生氣失政草木再榮化氣乃急上應太白鎮星其主蒼早丁卯丁酉歲陽明上臨是謂天刑運也木氣既少土氣無制故化氣生成急速鎮星太白潤而明蒼色之物早凋落也復則炎暑流火濕性燥柔脆草木焦槁下體再生華實齊化上應熒惑太白火復其金太白減燿也白露早降收殺氣行寒雨害物蟲食甘黃脾土受邪赤氣後化心氣晚治上勝肺金白氣乃屈上應熒惑太白星熒惑益明太白芒減諸癸歲火不及寒乃大行長政不用物榮而下凝慘而甚則陽氣不化乃折榮美上應辰星水盛火衰也復則埃郁大雨且至黑氣乃辱上應鎮星辰星土復於水也諸己歲土不及風乃大行化氣不令草木茂榮飄揚而甚秀而不實上應歲星鎮星水盛土抑也復則收政嚴峻名草蒼凋蒼谷乃損上應太白歲星金復木也上臨厥陰流水不冰蟄蟲來見藏氣不用白乃不復上應歲星己巳己亥歲也厥陰上臨火司於地故流水不冰蟄蟲不藏歲星如常也諸乙歲金不及炎暑乃行生氣乃用長氣專勝庶物以茂燥爍以行上應熒惑星收氣乃後上應太白星火盛金衰也復則寒雨暴至乃零冰雹霜雪殺物陰厥且格陽反上行上應辰星水復火也諸辛歲水不及濕乃大行長氣反用其化乃速暑雨數至上應辰星土盛水衰也上臨太陰則大寒數舉蟄蟲早藏地積堅冰陽光不治上應鎮星辛丑辛未歲也土氣專盛木不得復故鎮星明也復則大風暴發草晏木零生長不鮮黃氣乃損其谷不登上應歲星木復土也凡五星之變應常不應卒氣有卒然而動者星亦不為之變也氣交變大論復氣應時占木不及春有鳴條律暢之化則秋有霧露清涼之政春有慘淒殘賊之勝則夏有炎暑燔爍之復火不及夏有炳明光顯之化則冬有嚴肅霜寒之政夏有慘淒凝凓之勝則不時有埃昏大雨之復土不及四維有埃云潤澤之化則春有鳴條鼓拆之政四維發振拉飄騰之變則秋有肅殺霖霪之復金不及夏有光顯鬱蒸之令則冬有嚴凝整肅之應夏有炎爍燔燎之變則秋有冰雹霜雪之復水不及四維有湍潤埃云之化則不時有和風生髮之應四維發埃昏驟注之變則不時有飄蕩振拉之復夫五運之政猶權衡也高者抑之下者舉之化者應之變者復之氣之常也故曰天地之變化神明為之紀陰陽之往復寒暑彰其兆此之謂也氣交變大論五星應化占帝曰夫子之言歲候太過不及而上應五星今夫德化政令災眚變易非常而有也卒然而動其亦為之變乎岐伯曰承天而行之故無妄動無不應也卒然而動者氣之交變也其不應焉故曰應常不應卒此之謂也帝曰其應奈何岐伯曰各從其氣化也如歲星之化以風應之熒惑之化以熱應之之類是也帝曰其行之徐疾逆順何如岐伯曰以道留久逆守而小是謂省下以道謂順行留久謂過應留之日數也省下察天下人主之善惡也以道而去去而速來曲而過之是謂省遺過也已去復來逆行而速委曲經過是謂遺其過而省察之久留而環或離或附是謂議災與其德也如環之繞盤旋不去也火議罪金議殺木水土議德也應近則小應遠則大近謂犯星猶在遠謂犯星去久大小謂禍福之應芒而大倍常之一其化甚大常之二其眚即也小常之一其化減小常之二是謂臨視省下之過與其德也德者福之過者伐之是以象之見也高而遠則小下而近則大故大則喜怒邇小則禍福遠歲運太過則運星北越北越謂背而行也運氣相得則各行以道無克伐之嫌故守常而各行於中道也故歲運太過則畏星失色而兼其母如木太過則土星色赤也不及則色兼其所不勝如木不及則木星色白也天氣制勝已地氣制己勝天制色地制形色兼其所不勝則制勝己之謂也帝曰其災應何如岐伯曰亦各從其化也故時至有盛衰凌犯有逆順五星所至之時王相為盛囚死為衰東行凌犯為順災輕西行凌犯為逆災重也留守有多少留守日多則災深留守日少則災淺形見有善惡星喜潤則為見善星怒躁憂喪則為見惡宿屬有勝負徵應有吉凶矣二十八宿十二辰有相剋相生之勝負則吉凶亦異故五星凌犯遇宿屬剋制則災不成帝曰其善惡何謂也岐伯曰有喜有怒有憂有喪有澤有燥此象之常也必謹察之光色圓明不盈不縮怡然瑩然人見之而喜星之喜也光色勃然臨人芒彩滿溢人見之畏星之怒也光色微燿乍明乍暗星之憂也光色迥然不彰不瑩不與眾同星之喪也澤洪潤也燥枯燥也氣交變大論五氣動亂占帝曰夫子之言五氣之變四時之應可謂悉矣夫氣之動亂觸遇而作發無常會卒然災合何以期之岐伯曰氣之動變固不常在而德化政令災變不同其候也東方生風風生木其德敷和其化生榮其政舒啟其令風其變振發其災散落南方生熱熱生火其德彰顯其化蕃茂其政明曜其令熱其變銷爍其災燔焫中央生濕濕生土其德溽蒸其化豐備其政安靜其令濕其變驟注其災霖潰西方生燥燥生金其德清潔其化緊斂其政勁切其令燥其變肅殺其災蒼隕北方生寒寒生水其德淒滄其化清謐其政凝肅其令寒其變凓烈其災冰雪霜雹是以察其動也有德有化有政有令有變有災而物由之而人應之也氣交變大論五氣鬱發占五運之氣鬱極乃發待時而作太過不及其發異也太過者其數成不及者其數生土常以生也土鬱之發岩谷震驚雷殷氣交埃昏黃黑化為白氣飄驟高深擊石飛空洪水乃從川流漫衍田牧土駒化氣乃敷善為時雨始生始長始化始成云奔雨府雨府太陰所在也霞擁朝陽山澤埃昏其乃發也以其四氣云橫天山浮游生滅怫之先兆也金鬱之發天潔地明風清氣切大涼乃舉草樹浮煙燥氣以行霿霧數起殺氣來至草木蒼干金乃有聲山澤焦枯土凝霜滷怫乃發也其氣五夜零白露林莽聲淒怫之先兆也水鬱之發陽氣乃闢陰氣暴舉大寒乃至川澤嚴凝寒雰結為霜雪甚則黃黑昏翳流行氣交乃為霜殺水乃見祥陽光不治空積沉陰白埃昏暝而乃發也其氣二火前後太虛深玄氣猶麻散微見而隱色黑微黃怫之先兆也木鬱之發太虛埃昏雲物以擾大風乃至屋發折木木有變太虛蒼埃天山一色或氣濁色黃黑郁若橫云不起雨而乃發也其氣無常木發無時長川草偃柔葉呈陰松吟高山虎嘯岩岫怫之先兆也火鬱之發太虛腫翳大明不彰炎火行大暑至山澤燔燎材木流津廣廈騰煙土浮霜滷止水乃減蔓草焦黃風行惑言濕化乃後刻終大溫汗濡玄府其乃發也其氣四動復則靜陽極反陰濕令乃化乃成華髮水凝山川冰雪焰陽午澤怫之先兆也有怫之應而後報也皆觀其極而乃發也木發無時水隨火也水發在二火前後亦猶辰星之隨日也氣有多少發有微甚微者當其氣甚者兼其下徵其下氣而見可知也六元正紀大論五氣所兼之化如水發而雹雪土發而飄驟木發而毀折金髮而清明火發而曛昧皆兼下之承氣也地理高下左右占帝曰四時之氣至有早晏高下左右其候何如岐伯曰行有逆順至有遲速故太過者化先天不及者化後天帝曰願聞其行何謂也岐伯曰春氣西行夏氣北行秋氣東行冬氣南行故春氣始於下秋氣始於上夏氣始於中冬氣始於標春氣始於左秋氣始於右冬氣始於後夏氣始於前此四時正化之常故至高之地冬氣常在至下之地春氣常在六元正紀大論六氣正變占黃帝問曰六化之正六變之紀何如岐伯對曰夫六氣正紀有化有變有勝有復有用有病不同其候夫氣之所至也厥陰所至為和平少陰所至為暄太陰所至為埃溽少陽所至為炎暑陽明所至為清勁太陽所至為寒雰時化之常也厥陰所至為風府為璺啟少陰所至為火府為舒榮太陰所至為雨府為圓盈少陽所至為熱府為行出陽明所至為司殺府為庚蒼太陽所至為寒府為歸藏司化之常也厥陰所至為生為風搖少陰所至為榮為形見太陰所至為化為雲雨少陽所至為長為蕃鮮陽明所至為收為霧露太陽所至為藏為周密氣化之常也厥陰所至為風生終為肅少陰所至為熱生中為寒太陰所至為濕生終為注雨少陽所至為火生終為蒸溽陽明所至為燥生終為涼太陽所至為寒生中為溫德化之常也厥陰所至為毛化少陰所至為羽化太陰所至為裸化少陽所至為羽化陽明所至為介化太陽所至為鱗化德化之常也厥陰所至為生化少陰所至為榮化太陰所至為濡化少陽所至為茂化陽明所至為堅化太陽所至為藏化布政之常也厥陰所至為飄怒大涼少陰所至為大暄寒太陰所至為雷霆驟注烈風少陽所至為飄風燔燎霜凝陽明所至為散落溫太陽所至為寒雪冰雹白埃氣變之常也厥陰所至為撓動為迎隨少陰所至為高明焰為曛太陰所至為沉陰為白埃為晦暝少陽所至為光顯為彤雲為曛陽明所至為煙埃為霜為勁切為淒鳴太陽所至為剛固為堅芒為立令行之常也凡此十二變者報德以德報化以化報政以政報令以令氣高則高氣下則下氣後則後氣前則前氣中則中氣外則外位之常也六元正紀大論在泉淫勝占歲厥陰在泉風淫所勝則地氣不明平野昧草乃早秀少陰在泉熱淫所勝則焰浮川澤陰處反明太陰在泉濕淫所勝則埃昏岩谷黃反見黑少陽在泉火淫所勝則焰明郊野寒熱更至陽明在泉燥淫所勝則霿霧清瞑太陽在泉寒淫所勝則凝肅慘慄俱至真要大論司天淫勝占厥陰司天風淫所勝則太虛埃昏雲物以擾寒生春氣流水不冰少陰司天熱淫所勝怫熱至火行其政大雨且至太陰司天濕淫所勝則沉陰且布雨變枯槁少陽司天火淫所勝則溫氣流行金政不平陽明司天燥淫所勝則木乃晚榮草乃晚生名木斂生菀於下草焦上首太陽司天寒淫所勝則寒氣反至水且冰俱至真要大論佔六氣之勝厥陰之勝大風數舉裸蟲不滋少陰之勝炎暑至木乃津草乃萎太陰之勝雨數至燥化乃見少陽之勝暴暑消爍草萎水涸介蟲乃屈陽明之勝大涼肅殺華英改容毛蟲乃殃太陽之勝凝凓且至非時水冰羽乃後化至真要大論佔六氣之復厥陰之復偃木飛沙裸蟲不榮少陰之復赤氣後化流水不冰熱氣大行介蟲不復太陰之復大雨時行鱗見於陸少陽之復大熱將至枯燥燔焫介蟲乃耗陽明之復清氣大舉森木蒼干毛蟲乃厲太陽之復水凝雨冰羽蟲乃死至真要大論釋亢則害承乃制經曰亢則害承乃制制則生化外列盛衰害則敗亂生化大病此數句前人解說極多能會經旨者殊少詳其文意當云亢則害害則敗亂生化大病承乃制制則生化外列盛衰只作兩下解之為是夫天地之間五類生化互有所勝互有所制地氣制己勝天氣制勝己此以地氣之制己勝者言之也夫六氣之用各歸其所不勝而為化故太陰雨化施於太陽太陽寒化施於少陰少陰熱化施於陽明陽明燥化施於厥陰厥陰風化施於太陰此地之四方分為六步以應天外六節氣令之治者也天地之氣互為盈虛惡所不勝歸所同和同者盛之異者衰之當其位則盛非其位則衰地氣左遷於中天氣右行於外內外相因盛衰相倚故曰外列盛衰也若夫亢則傷害己勝不受勝己者之施化於是有勝則有復勝復更作敗亂生化之常故上勝則天氣降而下下勝則地氣遷而上甚則易位氣交易則大變生而病作矣所謂害則敗亂生化大病者是也此一勝一制一正一變之異化也河間云亢則害承者之母氣於是承者乃起而制之是知有非位之勝復而不知制則生化外列盛衰為當位之正化也樓氏云火亢則害水承乃制之制生則化至冬著盛是以夏之暑生冬之寒化以冬之寒制夏之暑亢恐不相反之甚是知有當位之正化而不知害則敗亂生化大病為非位之勝復也安可即以今日既亢之乖氣復為後日得制之平氣耶殊不知亢制字義甚明言亢則非平言制則非亢矣生化盛衰乃當位之常敗亂生化乃非位之變也二家全不分別何也釋病機十九條天有五行御五位以生寒暑燥濕風人有五臟化五氣以生喜怒憂思恐故五運之氣內應人之五臟諸風掉眩皆屬於肝諸寒收引皆屬於腎諸濕腫滿皆屬於脾諸氣膹郁皆屬於肺諸痛癢瘡皆屬於心是也諸厥固泄皆屬於下謂下焦腎肝之疾也諸痿喘滿皆屬於上謂上焦心肺之疾也此皆五臟之疾病機由於內動者也天之三陰三陽化六氣以生寒暑燥濕風火內應人之六腑外引十二經絡諸熱瞀瘈皆屬於火手少陽三焦經也諸禁鼓慄如喪神守皆屬於火手少陰心經也諸逆衝上皆屬於火手厥陰心包經也諸痙項強皆屬於濕足太陽膀胱經也諸腹脹大皆屬於熱足太陰脾經也諸躁狂越皆屬於火足陽明胃經也諸暴強直皆屬於風足厥陰肝經也諸病有聲鼓之如鼓皆屬於熱手太陰肺經也諸病胕腫疼酸驚駭皆屬於火手陽明大腸經也諸轉反戾水液渾濁皆屬於熱手太陽小腸經也諸病水液澄澈清冷皆屬於寒足少陰腎經也諸嘔吐酸暴注下迫皆屬於熱足少陽膽經也此皆十二經絡之邪病機由於外入者也劉河間以此著書漫然不分所屬殊不深考何也樓氏但糾其治法之偏而未及乎此故併為正之云爾邵跋莊生有言為善無近名為惡無近刑可以事親可以養生可以盡年其惟醫之謂乎余家世賴茲為事親養生之業庶幾免近名近刑之累雖未明莊生言是醫與否然以余家觀之則醫實有類乎莊生之言矣比部履齋曹先生恬然仕宦獨好方書讎校精苦余輩不及也是書篇帙浩博傳寫日久訛缺殆半微先生幾能成書哉先生薄軒冕而顧鄭重於醫之名耶若夫養生盡年則仕途與山林所得不翅多矣玄沙邵弁偉元甫跋
