body:
  text: 卷之三十傷寒部傷寒通論仲凡傷於寒則為病熱熱雖甚不死若兩感於寒而病者必死尺寸俱浮者太陽受病也當一二日發以其脈上連風府故頭項痛腰脊強尺寸懼長者陽明受病也當二三日發以其脈俠鼻絡於目故身熱目疼鼻乾不得臥尺寸俱弦者少陽受病也當三四日發以其脈循脅絡於耳故胸脅痛而耳聾此三經皆受病未入於腑者可汗而已尺寸俱沉細者太陰受病也當四五日發以其脈布胃中絡於嗌故腹滿而嗌乾尺寸俱沉者少陰受病也當五六日發以其脈貫腎絡於肺系舌本故口燥舌乾而渴活人云經云一二日少陰者謂初中病時便入少陰不經三陽也大抵傷寒發於陽則太陽也發於陰則少陰也凡病一日至十二三日太陽症不能罷者俱治太陽有初得病便見少陰症者宜攻少陰亦不必先自巨陽蓋寒入太陽即發熱而惡寒入少陰即惡寒而不熱尺寸俱微緩者厥陰受病也當六七日發以其脈循陰器絡於肝故煩滿而囊縮煩滿謂少腹煩滿也下文云十二日厥陰病陰囊縮少腹微下謂曏者囊之縮者今復病少腹之煩滿故令微下也此三經皆受病已入於腑可下而已若兩感於寒者一日太陽受之即與少陰俱病則頭痛口乾煩滿而渴二日陽明受之即與太陰俱病則腹滿身熱不欲食譫語三日少陽受之即與厥陰俱病則耳聾囊縮而厥水漿不入不知人者六日死若三陰三陽五臟六腑皆受病則榮衛不行臟腑不通而死矣傷寒一日太陽受之脈若靜者為不傳頗欲吐若躁煩脈微急者為欲傳也傷寒二三日陽明少陽症不見者不傳也傷寒三日三陽為盡三陰當受邪其人反能食而不嘔此為三陰不受邪也問曰傷寒三日脈浮數而微病人身溫和者何也答曰此為欲解也以夜半脈浮而解者濈然汗出也脈浮而解者必能食也脈不浮而解者必大汗出也三日少陽脈小欲已也論見口苦舌乾其不兩感於寒更不傳經不加異氣者至七日太陽病衰頭痛少愈也八日陽明病衰身熱少歇也九日少陽病衰耳聾微聞也十日太陰病衰腹減如故則思飲食十一日少陰病衰渴止舌乾已而嚏也十二日厥陰病衰囊縮少腹微下大氣皆去病人精神爽慧也太陽病頭痛至七日以上自愈者行其經盡故也若欲再傳經者針足陽明使不傳則愈六七日脈至皆大煩而口噤不言躁擾者必欲解也論見後條傷寒六七日無大熱其人躁煩此為陽去入陰故也若過十三日以上不間間瘳也尺寸陷者大危若更感異氣變為他病者當依舊壞症而治之若脈陰陽俱盛重感於寒者變為溫瘧陽脈浮滑陰脈濡弱者更遇於風變為風溫陽脈洪數陰脈實大者遇溫熱變為溫毒為病最重也陽脈濡弱陰脈弦緊者更遇溫氣變為溫疫以冬傷於寒發為溫病脈之變症方治如說見後條凡發汗欲令手足皆周至漐漐然一時間許益佳不可令如水流漓耳若病不解當重發汗汗多則亡陽陽虛不得重發汗也活人云發汗必須如常覆蓋腰以上厚衣覆之腰以下蓋之若腰以上淋滿而腰以下至足心微潤病終不解凡云可發汗而無湯者丸散亦可用要以汗出為解然不如湯隨症良驗凡發汗溫服湯藥其方雖言日一二服若病劇不解當促其服可半日間盡一二服若與病相值即便有所覺重病者一日一夜當睟時觀之如服一劑病症猶在故當復作本湯服之至有不肯汗出服三劑乃解若汗不出者死病也凡服湯藥發汗中病即止不必盡劑吐下亦如之許學士云記一鄉人傷寒身熱大便不通煩渴鬱冒醫者用巴豆下之頃得溏利宛然如舊予觀之陽明結熱在裡非大柴胡承氣不可巴豆止去積不能盪滌邪熱蘊毒亟進大柴胡等三服得汗而解嘗謂仲景一百一十三方為丸者有五理中陷胸抵當烏梅麻仁是以理中陷胸抵當皆大如彈子煮化而服與湯散無異至於麻仁治脾約烏梅治濕䘌皆用小丸以達下部其他逐邪毒破堅癖導淤血潤燥糞之類皆憑湯劑未聞用巴豆小丸藥以下邪氣也既下而病不除不免重以大黃芒硝下之安能無損也哉凡傷寒之病多從風寒得之始表中風寒入里則不消矣擬欲攻之猶當先解表乃可下之若表已解而內不消大滿大實堅有燥屎者自可除下之雖四五日不能為禍也服桂枝湯大汗出脈洪大者復與桂枝湯如前法論見瘧發汗解半日許復煩脈浮數者可更發汗活人云凡發汗病症仍在者三日內可二三汗之令腰以下周遍為度凡病若發汗若吐若下若亡津液陰陽自和者必自愈重亡津液則不能作汗故必待自和乃愈太陽病三日已發汗若吐若下若溫針仍不解者此為壞症桂枝不中與也觀其脈症知犯何逆當隨證治之夫病陽多者熱下之則硬無陽陰強大便硬者下之則必清穀腹滿脈師持脈病人欠者無病也脈之呻者病也言遲者風也搖頭言者里痛也行遲者表強也坐而伏者氣短也坐而下一腳者腰痛也裡實護腹如懷卵物者心痛也寸口諸微亡陽諸濡亡血諸弱發熱諸緊為寒諸乘寒者則為厥鬱冒不仁以胃無穀氣脾澀不通口急不能言戰而慄也微脈極細而軟濡脈極軟而浮細弱脈極軟而沉細病六七日手足三部脈皆至大煩而口噤不能言其人躁擾必欲自解者必當先煩乃有汗而解何以知脈浮故知汗出解也若脈和平其人大煩目重瞼內際黃者皆為欲解也問曰脈病欲如愈未愈者何以別之答曰寸口關上尺中三處大小浮沉遲數同等雖有寒熱不解者此脈為陰陽和平雖劇當愈針經禁服篇云寸口人迎兩者相應若引繩大小齊等者名曰平人言手之寸口脈與喉旁之人迎脈等齊為平人後條云六脈陰陽俱停必先振慄汗出而解者是也凡得病厥脈動數服湯藥更遲脈浮大減小初躁後靜此皆愈症也脈浮數而微病人身溫和者欲解也論見前條凡病反能飲水者為欲愈論見腹渴太陰中風脈陽微陰澀而長者為欲愈論見腹滿少陰中風脈陽微陰浮者欲愈論見欲寐厥陰中風脈微浮者欲愈不浮未愈太陽病巳至未解見發熱陽明病申至戌解見胃實少陽病寅至辰解見口苦太陰病亥至醜解見腹滿少陰病子至寅解見欲寐厥陰病醜至卯解見氣上撞心問曰凡病欲知何時得何時愈答曰假令日中得病夜半愈者以陽得陰則解也夜半得病日中愈者以陰得陽則解也病家人請云病人苦發熱身體疼病人自臥師到診其脈沉而遲者知其瘥也何以知之表有病者脈當浮大今反沉遲故知愈也假令病人云腹內卒痛病人自坐師到脈之浮而大者知其瘥也何以知之若里有病者脈當沉而細今脈浮大故知愈也問曰病有戰而汗出者因得解者何也答曰脈浮而緊按之反芤此為本虛故當戰而汗出也其人本虛是以發戰以脈浮故當汗出而解也若脈浮而數按之不芤此人本不虛若欲自解但出汗耳不發戰也問曰病有不戰而汗出解者何也答曰脈大而浮數故知不戰汗出而解也問曰病有不戰不汗出而解者何也答曰其脈自微此以曾經發汗若吐若下若亡血以內無津液待陰陽自和必自愈故不戰不汗出而解也上海藏云戰而後解者太陽也不戰有汗而解者陽明也不戰無汗而解者少陽也太陽病未解脈陰陽俱停必先戰慄汗出而解陽微者汗解陰微者下解論見發熱篇凡脈大浮數動滑此名陽也沉澀弦弱微此名陰也凡陰病見陽脈者生陽病見陰脈者死陰陽俱盛大汗出不解者死陰陽俱虛熱不止者死又診生死詳法並見診法門服藥不如方法縱意違師不須治之脈沉為在裡而反發其汗則津液越出大便難表虛里實久則譫語也論見譫語脈浮緊者法當身疼痛宜以汗解之假令尺中遲者不可發汗何以知之以榮氣不足血少故也活人云先以小建中湯加黃耆如尺脈尚遲再作一劑卻服柴胡桂枝二越婢一湯其湯分小劑和解之愈許學士云一鄉人丘生者病傷寒發熱頭疼煩渴脈雖浮數無力尺以下遲而弱予曰此雖麻黃症而尺遲弱仲景云尺中遲者榮氣不足血氣微少未可發汗予於建中湯加當歸黃耆令飲翌日脈尚爾其家煎迫日夜督發汗藥幾不遜矣予忍之但只用建中調榮而已至五日尺部方應遂投麻黃湯啜二服發狂須臾稍定略睡已中汗矣信知此事誠難仲景雖云不避晨夜即宜便治醫者亦須顧其表裡虛實待其時日若不循次第暫時得安損虧五臟以促壽限何足貴哉昔南史載範云傷寒恐不得預武帝九錫之慶召徐文伯診視以實懇之曰可便得愈乎文伯曰便瘥甚易只恐二年後不復起耳云曰朝聞道夕死猶可況二年乎文伯以火燒地布桃葉設席置云於其上頃刻汗解撲以溫粉翌日果愈云甚喜文伯曰不足喜也後二年果卒夫取汗先期尚促壽限況不顧表裡不待時日便欲速效乎每見病家不奈病未三四晝夜促汗醫者隨情順意鮮不敗事予故書此為戒脈浮大應發汗醫者反下之此為大逆諸外實者不可下下之則發微熱脈厥者當臍握熱諸虛者不可下下之則大渴求水者易愈惡水者劇太陽症表未解不可下下之為逆論見發熱脈濡而弱弱反在關濡反在巔微反在上澀反在下微則陽氣不足澀則無血陽氣反微中風汗出而反躁煩澀則無血厥而且寒陽微發汗躁不得眠陽微不可下下之則心下痞硬陽微不可下當是復不可下之脈浮熱甚反灸之此為實以虛治因火而動必咽燥唾吐微數之脈慎不可灸因火為邪則為煩逆追虛逐實血散脈中火氣雖微內攻有力焦骨傷筋血難復也脈浮且汗反用火灸之邪無從出腰以下必重而痹論見下重桂枝本為解肌若其脈浮緊發熱無汗者不可與也常須識此勿令誤也脈浮自汗小便數微惡寒腳攣急忌桂枝湯攻表論見厥酒客病不可與桂枝湯得湯則嘔以酒客不喜甘故也凡用梔子湯病人舊微溏者不可與服之若不宜下而便攻之內虛熱入挾熱遂利煩躁諸變不可勝數輕者困篤重者必死矣太陽病下之其脈促不結胸者此為欲解也脈浮者必結胸也脈緊者必咽痛脈弦者兩脅必拘急脈細數者頭痛未止脈沉緊者必欲嘔脈沉滑者挾熱利脈浮滑者必下血續傷寒通論活發熱惡寒身體痛而脈浮者表證也表證者惡寒是也惡寒者屬太陽宜汗之成惡寒一切屬表雖里症悉具而微惡寒者亦是表未解也猶當先解其外候不惡寒為外解乃可攻裡也不惡寒反惡熱手掌心並腋下濈濈汗出胃中乾燥結聚潮熱大便硬小便如常腹滿而喘或譫語脈沉而滑者里症也里症者內熱是也內熱者屬陽明宜下之傷寒始發熱惡寒今汗後不惡寒但倍發熱而躁始脈浮而大今脈洪實或沉數細始惺靜今狂語此為胃實陽盛再汗即死須下之則愈亦有始得病便變陽盛之症須便下之不可拘以日數更有心胸連腹臍大段疰悶腹中痛坐臥不安冒悶喘急極者亦不問他症便下之若失下則氣血不通四肢便厥醫人不知反疑是陰厥復進熱藥禍如反掌不可不察也成邪之客於表者為寒邪與陽相爭則為寒矣邪之入於裡者為熱邪與陰相爭則為熱矣邪在半表半裡外與陽爭而為寒內與陰爭而為熱是以往來寒熱邪居表多則多寒邪居里多則多熱邪半在表半在裡則寒熱亦半矣邪在表者必漬形以為汗邪在裡者必盪滌以取利其餘不外不內半表半裡又非發汗之所宜亦非吐下之所對是當和解則可矣小柴胡為和解之劑也活傷寒表症當汗里症當下不易之法也發表攻裡本自不同甘遂神丹不可合飲桂枝承氣安可並進然而假令病人脈浮而大是表症當汗其人發熱煩渴小便赤卻當下此是表裡俱見五苓散主之假令傷寒不大便六七日頭痛有熱者是里症當下其人小便清者知不在裡仍在表也當鬚髮汗此是兩症俱見即未可下宜與桂枝湯假令病人心下滿口不欲食大便硬脈沉細是里症當下其人頭汗出微惡寒手足冷卻當汗此兩症俱見者仲景所謂半在表半在裡也小柴胡主之假令太陰病表症未除而醫數下之遂挾熱而利不止心下痞硬仲景謂之表裡不解桂枝人參湯主之本太陽病醫反下之因爾腹痛是有表復有里仲景用桂枝加芍藥湯痛甚者桂枝加大黃又云太陽病桂枝症醫反下之利遂不止脈促者表未解也喘而汗出者葛根黃芩湯主之此皆仲景治傷寒有表復有里之法也海大柴胡湯治表裡內外俱熱之症治有表者或脈浮或頭痛或惡風或惡寒四症中或有一二尚在者乃十三日過經不解是也治有里者或譫語或妄語或擲手揚視此皆里之急者也若欲汗之則里症已急欲下之則表症尚在通宜大柴胡湯傷寒四五日後以至過經無表症又於裡症未可下者皆可用小柴胡隨證加減用之以至十餘日亦可用十餘日外用小柴胡不愈者若大便硬看症可下則用大柴胡下之以過經其人稍虛當下者用大柴胡湯則穩當恐承氣太緊病人不禁也仲景云六七日目中不了了睛不和無表裡症大便難身微熱此為實也當下之宜大承氣湯又云病人無表裡症發熱七八日脈雖浮數可用大柴胡下之假令已下脈數不解至六七日不大便者有瘀血也屬抵當湯治傷寒須分表裡若表裡不分汗下差誤豈為上工且如均是發熱身熱不渴為表有熱小柴胡加桂枝主之厥而脈滑為里有熱白虎加人參主之均是水氣乾嘔微利發熱而咳為表有水小青龍加芫花主之體涼表症罷咳而脅下痛為里有水十棗湯主之均是惡寒有熱而惡寒者發於陽也麻黃桂枝小柴胡主之無熱而惡寒者發於陰也附子四逆主之均是身體痛脈浮發熱頭痛身體痛者為表未解麻黃湯主之脈沉自利身體痛者為里不和四逆湯主之以此觀之仲景表裡之法甚詳學者宜深究心也海半表半裡者有幾夫邪在榮衛之間謂之半表半裡也太陽陽明之間少陽居身之半表半裡也五苓散分陰陽膀胱經之半表半裡也理中湯治吐泄上下之半表半裡也活太陽陽明少陽皆屬陽症也太陽者膀胱也發熱惡寒頭疼腰痛而脈浮也陽明者胃也不惡寒反惡熱濈濈汗出大便秘潮熱而脈長也少陽者膽也口苦咽乾脅下滿發熱而嘔或往來寒熱而脈弦也麻黃湯大青龍湯桂枝湯治太陽傷風寒也大柴胡湯調胃承氣湯小承氣湯大承氣湯治陽明傷寒也小柴胡湯治少陽傷寒也其他藥皆發汗吐下後症也若陽氣獨盛陰氣暴絕即為陽毒必發躁狂走妄言面赤咽痛身斑斑如錦紋或下利黃赤脈洪實或滑促當以酸苦之藥投之令陰氣復而大汗解矣古人云酸苦湧泄為陰謂苦參大青葶藶苦酒之類皆復其陰氣也微用苦甚則兼用酸苦折熱復陰若熱極發厥陽症似陰者學者當以脈別之太陰少陰厥陰皆屬陰症也何謂太陰症太陰脾之經主胸膈䐜脹何謂少陰症少陰腎之經主脈細心煩但欲寐或自利而渴何謂厥陰症厥陰肝之經主消渴氣上衝心心中疼熱飢不欲食食則吐蛔下之利不止也三陰中寒微則理中湯稍厥或中寒下利即乾薑甘草湯大段重者用四逆湯無脈者用通脈四逆湯若陰氣獨盛陽氣暴絕則為陰毒其症四肢逆冷臍腹築痛身如被杖脈沉實病或吐或利當急灸臍下服以辛熱之藥令復陽氣而大汗解矣古人云辛甘發散為陽謂桂枝甘草乾薑附子之類能復其陽氣也微用辛甘甚則用辛苦苦陰極熱躁陰症似陽者學者亦當以脈別之羅陰症陽症辨靜江府提刑李君長子年十九歲四月病傷寒九日醫者作陰症治之與附子理中丸數服其症增劇別易一醫又作陽症議論差互不敢服藥李君邀予往視坐間有數人予不欲直言其症但細為分解令自忖度之凡陽症者身大熱而手足不厥臥則怛然起則有力不惡寒反惡熱不嘔不瀉瀉而飲水煩躁不得眠能食而多語其脈浮大而數者陽症也凡陰症者身不熱而手足厥冷惡寒蜷臥惡聞人聲或自引衣蓋覆不煩渴不飲食小便自利大便反快其脈沉細而微遲者陰症也今診其脈數得六七至其母云夜來叫呼不絕全不睡又喜飲冰水予聞其言知陽症悉具且三日不見大便宜急下之予遂以酒煨大黃六錢甘草炙二錢芒硝五錢煎服至夕下數行燥糞二十餘塊是夜汗大出明日又往視之身涼脈靜矣予思素問熱論云治之各通其臟腑故仲景述傷寒論云六經各異傳變不同活人亦云凡治傷寒先須明經絡其義一也昧者不學經絡不問病源按寸握尺妄意病症不知邪氣之所在動致顛覆真盲醫哉昔韓子云醫之病病在少思真理致之言也學者審之陰症似陽陽症似陰並見陰陽臟腑部發寒熱反治條活未滿三日可汗而已滿三日者可泄而已此大略言之耳凡病人有虛有實邪氣傳受遲速不同豈可拘以日數仲景云日數雖多但有表症而脈浮者猶宜發汗日數雖少若有里症而脈沉者即宜下之正應隨脈治之又況六氣之邪乘虛之經皆自背得之則入太陽或入少陰自面感之則入陽明之類不必皆始於太陽也兼寒邪有首尾止在一經或間傳一二經不可以一理推但視脈與外症治之此活法也假令有人脈浮頭項強痛發熱而惡寒每日如此不以日數多少正是太陽經受之其餘經皆仿此大抵傷寒惟憑脈與外症以汗下之若過日多脈尚大浮數按之不足者尚責太陽也可發汗而愈若按之實者汗之必死須下之而愈也若始病脈沉細數外症或腹滿咽乾或口燥舌乾而渴為熱正責屬裡可下之而愈若無此症表熱脈沉誤下者必死須用麻黃附子甘草麻黃細辛附子湯少發汗以治之此皆仲景之確論也傷寒脈浮而緊身體拘急惡寒無熱寒多熱少面色慘而不舒腰脊疼痛手足四末微厥此麻黃症也傷寒脈浮而緩寸大而尺弱自汗體熱頭疼惡風寒多熱少其面光而不慘煩躁手足不冷此桂枝症也傷寒者脈緊而澀傷風者脈浮而緩傷寒無汗傷風有汗傷寒畏寒不畏風傷風畏風不畏寒大抵太陽病者必脈浮發熱惡風惡寒惡寒者不當風而自憎寒惡風者當風而憎寒也六經皆有傷風傷寒其症各異太陽脈浮有汗為中風脈緊無汗為傷寒陽明善飢為中風不食為傷寒少陽兩耳聾目赤胸滿而煩為中風口苦咽乾目眩為傷寒苦三陰傷風無變異形症但四肢煩疼餘症同三陽也傷風見寒脈者發熱惡風煩躁手足溫而脈反浮緊蓋發熱惡風煩躁手足溫為中風候脈浮緊為傷寒候也傷寒見風脈者寒多熱少不煩躁手足微厥而脈反浮緩蓋寒多熱少不煩躁手足微厥為傷寒候脈浮緩為中風候也傷風見寒傷寒見風大青龍症也傷寒發表須當隨病輕重而汗之故仲景有發汗者有和解者發汗如麻黃湯桂枝湯大青龍湯是也和解如小青龍湯桂枝麻黃各半湯白虎湯桂枝二越婢一湯柴胡桂枝之類是也後人不能深究寒邪淺深藥性緊慢一概用藥因致夭傷其聞縱或生全往往汗後虛乏遂至勞復或變成百病淹引歲月卒至不救此皆由汗下過度陰陽並竭血氣羸損以致此禍如遇病輕但當和解之所謂調和則榮衛以通津液令其自解可也丹溪治傷寒表症用補中益氣湯發散海藏用神術湯白朮湯九味羌活散發散此皆和解之意不使真氣散失也傷寒連服湯劑而汗不出者如中風法蒸之使溫熱之氣於外迎之無不得汗其法用薪火燒地良久掃去以水灑之取蠶砂柏葉桃葉糠麩皆鋪燒地上可側手厚上鋪席令病人當上臥溫覆之移時汗立至候周身至腳心漐漐乃用溫粉撲之汗止上床最得力者蠶砂桃柏葉也糠麩乃助其厚多少隨用衍治傷寒汗不出搐腳法用海蛤粉烏頭各二兩穿山甲三兩為末酒糊和丸大一寸許捏扁置患人足心下擘蔥白蓋藥以帛纏定於暖室取熱湯浸腳至膝下久則水溫又添熱水候遍身汗出為度凡一二日一次浸腳以和為度活傷寒里症須看熱氣淺深故仲景有直下之者如大承氣小承氣十棗大柴胡湯是也有微和其胃氣者如調胃承氣湯脾約丸少與小承氣微和之之類是也金匱虛者十補勿一瀉強實者瀉之虛實等者雖瀉勿大泄之故王叔和序傷寒有承氣之戒垣治大便燥結用通幽湯潤腸湯丸皆為血氣津液不足者設也藥用大承湯最緊小承湯次之調胃承氣又次之大柴胡湯又次之海大承氣湯治大實大滿滿則胸腹脹滿狀若合瓦大實則不大便也痞滿燥實四症俱備則用之雜病則進退用之大黃治大實芒硝治燥糞此二味治有形血藥也厚朴治大滿枳實治痞此二味治無形氣藥也小承氣湯治痞實而微滿狀如飢人食飽飯腹中無轉矢氣即大承氣湯只去芒硝心下痞大便或通熱甚須可下宜此方調胃承氣湯治實而不滿者腹如仰瓦腹中有轉矢氣有燥糞不大便而譫語堅實之症宜用之上以上三法不可差差則無者生之有者遺之假令調胃承氣症用大承氣下之則愈後元氣不復以其氣藥犯之也若大承氣症用調胃承氣下之則愈後神癡不清以其無氣藥也小承氣症若用芒硝下之則或利不止變而成虛矣垣三一承氣湯辨實則瀉之人所共知如緩急輕重之劑則臨時消息焉如不惡寒反惡熱發渴譫語腹滿而喘手足濈然汗出急下之宜大承氣湯如邪未深恐有燥糞少腹痛小承氣湯試之腹中轉矢氣者有燥糞也乃可攻之不轉矢氣者初硬後溏尚未可攻攻之則腹滿不能食若腹不通止與小承氣湯微和胃氣勿令大泄如發汗不惡寒但實者胃實也當和胃氣調胃承氣湯主之成大熱結實者與大承氣湯小熱微結者與小承氣湯以熱不大甚故於大承氣湯中去芒硝又以結不至堅故減厚朴枳實如不至大堅然邪熱已甚而須攻下者亦未可投大承氣湯必以輕緩之劑攻之於大承氣湯中減厚朴枳實加甘草乃輕緩之劑以調胃也設若大承氣湯症反用調胃承氣湯下之則邪氣不伏小承氣湯症反用大承氣湯下之則過傷正氣而腹滿不能食故有勿大泄之戒此仲景所以分而治之未嘗越聖人之制度後之醫者以此三藥合而為一且云通治三藥之症及傷寒雜病內外一切所傷若如此說與仲景之方甚相背戾且失軒岐緩急之旨由是紅紫亂失迷惑世人一唱百和使病者暗受其弊將何所咎哉倘有公心審是者當於內經仲景方中求之責使藥症相對以聖賢之心為心則方之真偽自可得而知矣潔傷寒之法先言表裡及有緩急三陽表當急里當緩三陰表當緩里當急又曰脈浮當汗脈沉當下脈浮汗急而下緩謂三陽表也脈沉下急而汗緩謂三陰里也麻黃湯謂之急麻黃附子細辛湯謂之緩內經云有漬形以為汗謂汗之緩里之表也又云在皮者汗而發之謂汗之急表之表也急汗者太陽緩汗者少陰是臟腑之輸應也假令附子麻黃細辛湯是少陰症始得發熱脈沉里和無汗故漬形為汗今麻黃湯是太陽症頭項痛腰脊強脈浮無汗里和是也在皮者汗而發之可也經曰治主以緩治客以急此之謂也麻黃湯方見傷寒表裡上條假令得肝脈其外症善潔面青善怒其三部脈俱弦而浮惡寒里和清便自調麻黃湯內加羌活防風各三錢謂肝主風是膽經受病也大便秘或泄下赤水無數皆里不和也假令得心脈其外症面赤口乾善笑其尺寸脈俱浮而洪惡寒里和清便自調麻黃湯內加黃芩石膏各三錢謂心主熱是小腸受病也假令得脾脈其外症面黃善噫善思善味尺寸脈俱浮而緩里和惡寒麻黃湯內加白朮防風各三錢謂脾主濕是胃經受病也假令得肺脈其外症面白善嚏悲愁不樂欲哭其尺寸脈俱浮而澀里和惡寒麻黃湯內加桂枝生薑各三錢謂肺主燥是大腸受病也假令得腎脈其外症面黑善恐欠尺寸服俱沉而里和惡寒麻黃湯內加附子生薑各三錢謂腎主寒是膀胱受病也以上五症皆表之表也謂在皮者急汗而發之皆腑受病也表之裡者下之當緩謂隨臟表症外顯尺寸脈俱浮而復有里症謂發熱飲水便利赤色或泄下赤水其脈浮按之內實或痛麻黃湯方去麻黃杏仁隨臟元加藥同煎分作五服每下一症初一服加大黃五分如邪未盡又加大黃一錢未盡再加大黃一錢半直候邪盡則止此先緩而後急是表之裡宜下之當緩也麻黃附子細辛湯方見下少陰但欲寐條假令得肝脈其內症滿悶淋溲便難轉筋其尺寸脈俱沉而弦里和惡寒肝經受病麻黃附子細辛湯內加羌活防風各三錢假令得心脈其內症煩心心痛掌中熱而噦其尺寸脈俱沉洪里和惡寒心經受病於前湯內加黃芩石膏各三錢假令得脾脈其內症腹滿脹食不消怠惰嗜臥其尺寸脈俱沉緩里和惡寒脾經受病加白朮防已各三錢假令得肺脈其內症喘嗽灑淅寒熱其尺寸脈俱沉澀里和惡寒肺經受病加生薑桂枝各三錢假令得腎脈其內症泄瀉下重足脛寒而逆其尺寸脈俱沉里和惡寒此腎經受病加薑附各三錢以上五症里之表也宜漬形以為汗皆臟受病也里之裡者下之當急謂隨臟內症已顯尺寸脈俱沉而復有里症謂小便赤大便秘澀或瀉下赤水或瀉或咳不能飲食不惡風寒發熱引飲其脈俱沉按之內實而痛此謂裡實宜速下之麻黃附子細辛湯內去麻黃隨臟元加藥同煎分作三服每下一症初一服加大黃三錢邪盡即止加邪未盡第二服加大黃二錢又未盡第三服加大黃一錢此先急而後緩是里之裡也宜速下之云太陽症非頭痛項強不可發汗非身熱惡寒不可發汗非脈浮不可發汗活其脈微弱或尺脈遲者不可表其人當汗而衄血者不可表壞病者不可表婦人經水適來者不可表風溫者不可表濕溫者不可表虛煩者不可表病人腹間左右上下有築觸動氣者不可表曾經發汗若吐若下若溫病仍不解者為壞病脈尺寸俱浮頭痛身熱常自汗體重其息必喘其形不仁默默但欲眠者為風溫兩脛逆冷胸腹滿頭目痛苦妄言必多汗者為濕溫與傷寒症相似但不惡寒身不疼痛脈不緊者為虛煩臍上下左右有動氣按之牢若痛者為動氣太陽咽乾鼻衄淋漓小便不利皆不當汗已經發汗不得重發如無以上忌症雖經發汗邪氣未盡亦當重發之當汗不汗則生黃其症為風寒所傷陽氣下陷入內而與寒水上行於經絡之間本當發汗以徹其邪醫失汗之故生黃也脾主肌肉四肢寒濕與內熱相合故生黃也不當汗而汗為蓄血之症燥火也當益津液為上而反汗以亡之其毒擾陽之極則侵陰也故燥血蓄於胸中也當汗而發汗過多腠理開泄汗漏不止故四肢急難以屈伸也云非陽明之本病不可下陽明本病胃家實故也非痞滿燥實不可下非潮熱發渴不可下非罵詈親疏不可下非脈沉數不可下非棄衣而走登高而歌如見鬼狀不可下活脈浮者不可下脈虛者不可下惡寒者不可下嘔吐者不可下不轉矢氣者不可下轉矢氣者下泄也小便清者不可下大便堅小便數不可用承氣湯攻之乃脾約丸症也大便硬小便少者未可攻陽明病自汗出若發汗小便自利者不可下宜用蜜煎導之云非往來寒熱者不可和非脅肋急痛者不可和非胸滿而嘔者不可和海太陽傳陽明其中或有下症陽明症反退而無熱與不渴卻顯少陽症是知可解也太陽症知可解者為頭不痛項不強肢節不痛則知表易解也陽明症知可解者為無發熱惡熱則知里易解也少陽知可解者寒熱日不移時而作邪未退也若用柴胡而移其時早移之於晏晏移之於早氣移之於血血移之於氣是邪無可容之地知可解也可解之脈浮而虛不可解之脈浮而實浮而虛者只在表浮而實者知已在裡也汗多不解者轉屬陽明也傷寒不頭痛知邪不在經若頭痛知邪在經也六經傳足傳手經則愈陽中之陰水太陽是也為三陽之首能巡經傳亦能越經傳陽中之陽土陽明是也陽明為中州之主主納而不出如太陽傳至此名曰巡經傳也陽中之陽木少陽是也上傳陽明下傳太陰如太陽傳至此為越經傳陰中之陰土太陰是也上傳少陽為順下傳少陰為逆如傳少陰為上下傳也如太陽傳太陰為誤下傳也陰中之陽火少陰是也上傳太陰為順下傳厥陰為逆如太陽至此乃表傳裡也陰中之陰木厥陰是也上傳少陰為實再傳太陰為自安太陽六傳太陽者巨陽也為諸陽之首膀胱經病若渴者自入於本也名曰傳本太陽傳陽明胃土者名曰巡經傳為發汗不盡利小便餘邪不盡透入於裡也太陽傳少陽膽木者名曰越經傳也為元受病脈浮自汗宜用麻黃湯而不用故也太陽傳太陰脾土者名曰誤下傳為元受病脈緩有汗當用桂枝而反下之所致也當病腹痛四肢沉重太陽傳少陰腎水名曰表傳裡為病急當下而反不攻不發所以傳裡也太陽傳厥陰肝木者為陰不至於首惟厥陰與督脈上行太陽相接名巡經得度傳本有人病傷寒無汗惡風項既屈而且強予曰項強𠘧𠘧葛根湯症或問曰何謂𠘧𠘧予曰𠘧𠘧者如𠘧疾屈而強也謝復古謂病人羸弱須憑𠘧而起誤也蓋仲景論中極有難曉處振振欲擗地心中懊憹外氣怫鬱鬱冒不仁膈內拒痛如此之類甚多成無己云𠘧音殊𠘧為短羽鳥不能飛騰動先伸引其頭項背強者動亦如之非若𠘧案之𠘧而可偃屈也甚得仲景之旨太陽病太陽之為病脈浮頭項強痛而惡寒太陽病發熱汗出惡風脈緩者為中風太陽中風陽浮而陰弱陽浮者熱自發陰弱者汗自出嗇嗇惡寒淅淅惡風翕翕發熱鼻鳴乾嘔者桂枝湯主之太陽病頭痛發熱汗出惡風者桂枝湯主之太陽病發熱汗出者此為榮弱衛強故使汗出欲救邪風者宜桂枝湯病人臟無他病時發熱自汗出而不愈者此衛氣不和也先其時發汗則愈宜桂枝湯桂枝湯方桂枝芍藥生薑各三兩甘草二兩大棗十二枚上㕮咀每服五錢水煎去渣溫服須臾歠熱稀粥一盞以助藥力令一時許遍身漐漐微汗者佳不可令如水淋漓若一服便得汗勿再服或無汗或小便數手足冷者不可服活人云桂枝麻黃若夏月用加黃芩知母石膏總不如陶尚文用羌活沖和湯為最穩上桂枝湯許學士云有人病發熱惡寒自汗脈微弱而浮三服湯而愈此方在仲景一百十三方內獨冠其首今人全不用何也仲景云太陽中風陽浮而陰弱陽浮者云云至翕翕發熱宜桂枝湯此脈與症仲景說得甚明後人看不透所以不敢用也假令寸口脈微名曰陽不足陰氣上入陽中則灑淅惡寒也尺脈弱名曰陰不足陽氣下陷入陰中則發熱也此謂元氣受病而然也又曰陽微則惡寒陰微則發熱醫既汗之使陽氣微又大下之令陰氣弱此謂醫所使也大抵陰不足陽往從之故內陷而發熱陽不足陰往乘之故陰上入陽中則惡寒舉此二端明白易曉何憚而不用桂枝湯哉太陽病頭痛發熱身疼腰痛骨節疼痛惡風無汗而喘者麻黃湯主之麻黃去節先煮去汗焙三兩桂枝二兩杏仁七十個去皮尖甘草一兩上㕮咀每服五錢水煎溫服覆取微汗不須歠粥有汗者勿服太陽中風脈浮緊發熱惡寒身疼痛不汗出而煩躁者大青龍湯主之若脈微弱汗出惡風者不可服服之則厥逆筋惕肉瞤此為逆也傷寒脈浮緩身不疼但重乍有輕時無少陰症者大青龍湯發之大青龍湯方麻黃去節炮去汗三兩桂枝去皮石膏碎甘草炙各一兩生薑切一兩半大棗六枚杏仁二十個去皮尖上㕮咀每服五錢水煎溫服取汗為度若汗周身潤止後服未汗可停待相次服盡不欲汗多恐亡陽故也若汗不止用溫粉撲之溫粉方白朮藁本川芎白芷各等分上研為細末每末一兩入米粉三兩和勻撲周身止汗若汗過多恐亡陽遂厥逆惡風煩躁不得眠故宜以此粉止之上中風脈當浮緩今反浮緊緩者大青龍症也活發熱惡風煩躁手足溫為中風候脈浮緊為傷寒脈是中風見寒脈也寒多熱少不煩躁手足微厥為傷寒候脈浮緩為中風脈是傷寒見風脈也蓋脈似桂枝反無汗病似麻黃反煩躁是也許學士云仲景治傷寒一則桂枝二則麻黃三則青龍桂枝治中風麻黃治傷寒青龍治中風見寒脈傷寒見風脈三者如鼎立人皆能言之而不曉前人處方用藥之意故醫遂多不用無足怪也且脈緩而浮者中風也故嗇嗇惡風淅淅惡寒翕翕發熱仲景以桂枝對之脈浮緊而澀者傷寒也故頭痛發熱身疼腰痛骨節疼痛惡寒無汗而喘仲景以麻黃對之至於中風脈浮緊傷寒脈浮緩仲景皆以青龍對之何也予嘗深究三旨若症候與脈相對無不應手而愈何以言之風傷衛衛氣也寒傷榮榮血也榮行脈中衛行脈外風傷衛則風邪干陽陽氣不固發越而為汗是以自汗是表虛故仲景用桂枝以發其邪芍藥以和其血蓋中風則病在脈之外其病稍輕雖同曰發汗特解肌之藥耳故仲景於桂枝症云令遍身漐漐微似有汗不可如水淋漓病必不除是知中風不可大發汗汗過則反動榮血邪氣乘虛襲之故病不除也寒傷榮則寒邪入陰血而榮行脈中者也寒邪居脈中非特榮受病邪自內作則並與備氣犯之久之浸淫及骨是以汗不出而熱齒乾而煩冤仲景以麻黃髮其汗又以桂枝甘草助其發散欲滌除內外之邪榮衛之病爾大抵二藥皆發汗以桂枝則發其衛之邪麻黃並榮與衛治之亦自有淺深也何以驗之仲景桂枝第十九症云病當自汗出者此為榮氣和榮氣和者外不諧以衛氣不共榮氣諧和故爾以榮行脈中衛行脈外復發其汗榮衛和則愈宜桂枝湯又四十七症云發熱汗出此為榮弱衛強故使汗出者欲救邪風宜桂枝湯是知中風汗出者榮和而衛不和又第一卷云寸口脈浮而緊浮則為風緊則為寒風則傷衛寒則傷榮榮衛俱病骨節煩疼當發其汗是知傷寒浮緊者榮衛俱病也麻黃湯中並用桂枝此仲景之言也至於青龍雖治傷風見寒脈傷寒見風脈之病然仲景又云汗出惡風者不可服之服之厥逆便有筋惕肉瞤之症故青龍一症尤難用藥須是形症諦當然後可行故王實夫症止用桂枝麻黃各半湯治之蓋慎之也太陽病項背強𠘧𠘧反汗出惡風者桂枝加葛根湯主之桂枝加葛根湯方桂枝葛根各二兩芍藥甘草各一兩生薑一兩半大棗六枚上㕮咀每服五錢水煎溫服覆取汗太陽病項背強𠘧𠘧無汗惡風葛根湯主之葛根湯方葛根四兩麻黃生薑各三兩桂枝芍藥甘草各二兩大棗十二枚上㕮咀每服五錢去渣溫服覆取微汗為度太陽病發熱惡寒熱多寒少脈微弱者此無陽也不可發汗宜桂枝二越婢一湯桂枝二越婢一湯桂枝芍藥麻黃去節泡甘草各三錢生薑半兩石膏一兩半碎大棗六枚上㕮咀每服五錢水煎溫服太陽病得之八九日如瘧狀發熱惡寒熱多寒少又其人不嘔清便欲自可一日二度脈微緩者為欲愈也脈微而惡寒者此陰陽俱虛不可更發汗更下更吐面色反有熱色者未欲解也以其不能得小汗出身必癢宜桂枝麻黃各半湯桂枝麻黃各半湯桂枝一兩芍藥生薑甘草炙麻黃各半兩去節煮大棗六枚杏仁十二粒去皮尖上㕮咀每服五錢水煎溫服凡仲景稱太陽病者皆表症發熱惡寒頭項強痛也若脈浮大則與症相應宜發汗今見表症而脈反微不與症應故不可發汗但用一二各半湯等和之可也若太陽中暍發熱惡寒脈微弱手足逆冷而渴者白虎加人參湯方論見中暑太陽六七日表症仍在脈微而沉反不結胸其人發狂者以熱在下焦少腹當硬滿小便自利者下血乃愈所以然者以太陽隨經瘀血在裡故也抵當湯主之抵嘗湯方水蛭炒去子杵虻蟲各十枚炒去足翅大黃二兩桃仁七枚去皮尖上作一服水一盞煎溫服太陽病身黃脈沉結小腹硬小便不利者為無血也小便自利其人如狂者血症諦也亦抵當湯主之凡仲景稱太陽症脈沉得皆謂發熱惡寒頭項強痛而脈反沉也其症兼發在小腹硬者為蓄血此條抵湯當是也兼關節痛小便不利身黃者為濕痹論見濕痹兼卒口噤背反張者為痓若無汗惡寒名剛痓宜葛根湯若有汗不惡寒名柔痓宜栝蔞桂枝湯方論見痓病發熱頭痛脈反沉若不瘥身體疼痛當救其里宜四逆湯方見下利少陰病但欲寐始得之發熱脈沉者麻黃附子細辛湯論見欲寐麻黃附子細辛湯方麻黃去節泡細辛各二兩附子一枚炮去皮上㕮咀每服五錢水煎溫服凡仲景稱太陽病不惡寒者皆謂發熱頭項強痛脈浮而反不惡寒也其證兼渴者為溫病兼汗出者為柔痓方論見溫病柔痓傷寒六七日發熱微寒肢節煩疼微嘔心下支結外症未去者柴胡加桂枝湯主之柴胡加桂枝湯方柴胡一兩桂枝黃芩人參芍藥生薑各半兩半夏四錢大棗三枚甘草炙三錢上㕮咀每服五錢水煎溫服凡仲景稱表不解者皆謂太陽病發熱惡寒頭項強痛脈浮也蓋病雖屬太陽表症而有里症兼之者則不言太陽病但稱表不解也其兼心下支結者此條柴胡桂枝湯是也論見脅痛兼心下有水氣乾嘔而咳者小青龍也方論見效兼脅痛手足溫而渴者小柴胡也兼心下痞者先用桂枝解表後以瀉心攻痞也方論見痞兼下利腹滿脹者先以四逆溫里後以桂枝攻表也方論見下利太陽病欲解時從巳至未解太陽病未解脈陰陽俱停必先振慄汗出而解但陽脈微者先汗出而解陰脈微者下之而解若欲下之調胃承氣湯主之下之而解疑衍文太陽病脈浮緊發熱身無汗自衄者愈太陽外症未解不可下之下之為逆欲解外者宜桂枝湯主之海大小調胃三承氣湯必須脈浮頭痛惡風惡寒表症盡罷而反發熱惡熱譫語不大便方可用之若脈浮緊下之必結胸苦脈浮緩下之必痞氣許學士云嘗記一親戚病傷寒身熱頭痛無汗大便不通已四五日予訊問之醫者治大黃朴硝等欲下之予曰子姑少待予為視之脈浮緩居密室中自稱甚惡風予曰表症如此唯大便不通數日腹且不脹別無所苦何遽便下之大抵仲景法須表症罷方可下不爾則邪乘虛而入不為結胸必為熱利也予作桂枝麻黃各半湯繼以小柴胡漐漐汗出大便亦通而解仲景云凡傷寒之病多從風寒得之始則表中風寒入里則不消矣擬欲攻之當先表解乃可下之若表已解而內不消大滿大堅實有燥糞者自可除下之雖四五日不能為禍也若不宜下而便攻之內虛熱入為挾熱自利煩躁之變不可勝數輕者困篤重者必死矣原本正文重疊予刪正此段其理甚明大抵風寒入里不消必有燥糞或大便堅秘須是脈不浮不惡風表症罷乃可下之大便雖四五日不通亦無害若不顧表而下遂為挾熱利也表裡發熱發熱惡寒脈浮者屬表即太陽症也方論見前太陽病條發熱汗出不惡寒反惡熱者屬裡即陽明症也方論見陽明自汗發熱脈弦細頭痛者屬半表半裡即少陽症也論見口苦咽乾發熱而嘔者小柴胡湯論見嘔發熱咳嗽表不解者小青龍湯兼脅痛喜嘔者小柴胡加乾薑五味子湯方論見效發熱而喘表不解者小青龍去麻黃加杏仁湯兼胸滿者麻黃湯方論見喘發熱口渴有屬表者有屬裡者治法方論甚眾並見渴門發熱汗解半日許復煩躁脈浮數大者可更發汗宜桂枝湯論見煩方見上發汗後惡風寒者虛故也不惡寒但惡熱者實也當和胃氣宜調胃承氣湯太陽病三日發汗不解蒸蒸發熱者屬胃也調胃承氣湯主之海藏云大黃泄實芒硝軟堅甘草和中必燥實堅三症全者可用之調胃承氣湯方大黃一兩海藏云宜酒浸蓋邪氣居高非酒不到譬如物在高巔人跡所不及則射而取之故用酒浸引而上之若生用苦泄峻下則遺高分之邪熱所以愈後或目赤或喉閉或頭腫膈上反生熱症矣甘草半兩炙海藏云甘以緩之芒硝九錢海藏云辛以潤之咸以軟之上㕮咀水一盞煮大黃甘草至七分去渣入芒硝更上火微煮令沸溫服發熱汗出不解心下痞硬嘔吐而利者大柴胡湯論見痞發汗後身灼熱脈浮汗出身重多眠鼻鼾者風溫論見風熱發汗後仍發熱心悸頭眩身瞤動振振欲擗地者宜真武湯論見下利汗出熱不去內拘急四肢疼下利厥逆惡寒者宜四逆湯論見下利大汗出脈陰陽俱盛不解者死論見大法內經云溫病汗徹復熱而脈躁疾不為汗衰狂言不能食謂之陰陽交者必死也太陽病先發汗不解而復下之脈浮者不愈浮為在外而反下之故令不愈今脈浮故知在外當須解外則愈桂枝湯主之汗下後仍頭痛發熱心下滿小便不利者桂枝去桂加茯苓白朮湯論見結胸大下後身熱不去心中結痛者梔子豉湯主之論見心痛大下後身熱不去微煩者梔子乾薑湯方論見煩陽明病下之其外有熱手足溫心中懊憹飢不能食但頭汗出者梔子豉湯論見煩太陽病當惡寒今自汗出不惡寒發熱關脈細數者以醫吐之過也一二日吐之者腹中飢口不能食三四日吐之者不喜糜粥欲食冷食朝食暮吐以醫吐之所致為小逆瘥後更熱者小柴胡湯脈浮者以汗解脈沉者以下解論見勞復傷寒脈浮滑此表有熱里有寒白虎湯主之白虎湯方知母三兩甘草一兩炙粳米三合石膏八兩捶碎上㕮咀每服五錢水煎溫服脈浮而遲表熱裡寒下利清穀者四逆湯論見下利下利厥逆汗出熱不去者四逆湯少陰病下利清穀厥逆裡寒外熱者通脈四逆湯方論見下利身熱手足逆冷而脈虛當夏月發者為中暑論見中暑傷寒表不解乾嘔發熱而咳下利者小青龍去麻黃加芫花湯論見咳太陽與陽明合病必下利其症頭痛腰疼身熱鼻乾脈浮大而長者宜葛根湯論見合病發熱下利脈微遲厥逆者通脈四逆湯太陽與少陽合病自下利其症頭痛胸滿往來寒熱脈浮大而弦者宜黃芩湯論見合病下利清穀脈沉遲其人面赤微熱而厥者必鬱冒汗出自解發熱下利厥逆躁不得臥者死發熱而利汗不止者死二論俱見下利發熱吐利心下痞硬者大柴胡湯渴者五苓散不渴者理中湯論並見痞及吐利門發熱經水適來適斷小柴胡湯刺期門論見譫語瘧狀發熱脈數消穀不大便者有瘀血宜抵當湯論見蓄血素病甚者為五十九刺穴見溫病門太陽病發熱續法此篇集丹溪海藏諸賢治傷寒皆以補養兼發散之法實本經成敗倚伏生於動動而不已則變作及風雨寒熱不得虛邪不能獨傷人之旨也蓋凡外傷風寒者皆先因動作煩勞不已而內傷體虛然後外邪得入故一家之中有病者有不病者由體虛則邪入而病體不虛則邪無隙入而不病也是故傷寒為病屬內傷者十居八九後學無知舉世皆謂傷寒無補法但見發熱不分虛實一利下汗而致夭橫者滔滔皆是此實醫門之罪人也今集此法於仲景之後其應如響使人遵之不犯虛虛實實之戒也丹傷寒主乎溫散有卒中天地之寒氣者有口食生冷之物者故傷寒為病必須身犯寒氣口食寒物者是以從補中益氣湯加發散藥屬內傷者十居八九其法邪之所湊其氣必虛只用補中益氣湯中從所見之症出入加減氣虛甚者少用附子以行參朮之氣補中益氣湯方見治發熱內傷之病專主東垣內外傷辨甚詳世之病此者為多但有挾痰挾外邪者鬱熱於內而發者皆以補元氣為主宜看其所挾而兼用藥一男子素嗜酒因暴風寒衣薄遂覺倦怠不思飲食半日至睡後大發遍身疼痛如被杖微惡寒天明診之六脈浮大按之豁然左為甚予作極虛受風寒治之人參為君黃耆白朮歸身為臣蒼朮甘草木通乾葛為佐使大劑與之至五帖後通身汗如雨凡三易被得睡覺來諸症悉除白朮陳皮乾葛蒼朮各三錢人參川芎各錢半黃耆歸身木通各一錢甘草五分上分三帖水煎服盧兄年四十九歲自來大便下血脈來沉遲澀面黃神倦者二年矣九月間因勞倦發熱自服參蘇飲二帖熱退早起小勞遇寒兩手背與面紫黑昏僕少時卻醒身大熱妄語口乾身痛至不可眠脈之三部不調微帶數重取虛豁左手大於右手以人參二錢半帶節麻黃黃耆各一錢白朮二錢當歸五分與三五帖得睡醒來大汗如雨即安兩日後再發脅痛咳嗽若睡時嗽不作而妄語且微惡寒診其脈似前而左略帶緊予曰此體虛再感寒也再以前藥加半夏茯苓至十餘帖再得大汗而安後身倦不可久坐不思飲食用補中益氣去涼藥加神麯半夏砂仁五七十帖而安一丈夫因勞倦發熱甚倦不可以傷寒治之用人參四錢白芍藥陳皮當歸各三錢黃耆三錢半蒼朮二錢木通一錢甘草少上分三帖水煎溫服一丈夫發熱五日倦甚略渴得洪脈不甚數略重則散大此內傷症也用白朮二錢人參陳皮柴胡各錢半黃耆蒼朮各一錢木通六分甘草少上分二帖水煎服一大夫倦甚口乾發熱汗不出用陳皮三錢人參白朮蒼朮各二錢乾葛錢半黃耆木通各一錢上分二帖水煎服一丈夫發熱振瞤倦怠口渴人參白朮白芍柴胡各二錢陳皮三錢黃耆一錢木通錢半甘草少上分四帖水煎熱飲王孺人因辛苦發熱芍藥五錢白朮三錢半人參當歸各二錢陳皮一錢川芎甘草木通各錢半上分四帖水煎溫服第四女發熱冒風冷麻黃人參各五分蒼朮一錢甘草少上水煎溫服上十方皆補養中氣兼發散之劑杭州葉君章臘月因齋素中飢而冒寒作勞遂患發熱頭痛醫與小柴胡湯遂自汗神昏耳聾目不見物予診其脈大如指似有力熱不退與人參黃耆白朮熟附炙甘草作大劑之一日而汗少二日而熱減半耳微有聞目能視物初用藥至四帖前藥中加蒼朮與兩服再得汗而熱除本日遂去蒼朮附子又與前藥作小劑服三日而安呂仲修年六十六歲正月間因忍飢冒寒作勞頭疼惡寒發熱骨節皆疼無汗至次日妄語熱愈甚而妄語時止時作熱亦不為十分自服參蘇飲兩帖汗不出又再進一服以衣覆取汗大出而熱不退至第四日予診其脈兩手皆洪數而上為甚此因飢而冒寒加之作勞陽明經雖受寒氣不可攻擊當急以大劑補之以回其虛俟胃氣充實自能出汗而解遂以參耆白朮歸身陳皮炙甘草每帖加熟附子一片一晝夜服五帖至第三日口稍干言語有次諸症雖解而熱未退遂去附子加白芍又兩日思食卻作肉羹間與之又三日精神全二日許自汗出而熱退診其脈不數洪脈卻尚有些洪脈作大脈論年高而誤汗此後必有虛症見又與前藥至次日言我大便自病來不曾更衣今穀道逼痛坐努責狀如不堪醫者必欲投大黃巴豆等劑予謂大便非實秘為是氣因誤汗而虛不得充腹無力可努仍與前補藥以肉粥及蓯蓉與之一日半煎濃蔥椒湯浸下體方下大便軟塊者五六枚診其脈仍舊大未斂此因氣血未得回覆又與前藥兩帖經兩日小便不通少腹下妨悶頗為所苦但仰臥則點滴而出予曰補藥服之未盡於前藥內倍加參耆大劑服兩日小便方利而安陶明節年十九歲不憚勞勩不息農作忽一日因勞倦大發熱而渴恣飲冷泉水數碗次日熱退目不識人言語謬誤自言肚痛不能轉側飲食不進身戰掉不自持又二日求予診之兩手澀而大而上為甚遂於氣海灸三十壯用白朮二錢黃耆二錢熟附一片陳皮五分與十帖不效又增發熱微渴餘症仍在卻可進二匙稀粥予曰此氣欲利而血未應也於前藥內去附子加當歸以和血因有熱加人參一錢半服三十帖而安海黃耆湯治傷寒兩感拘急三焦氣虛自汗及手足汗出或手背偏多或肢體振搖腰腿沉重面赤目紅但欲睡眠頭面壯熱兩脅熱甚手足自溫兩手心熱自利不渴大便或難或如常度或口乾咽燥或渴欲飲湯不欲飲水或少欲飲水嘔噦間作心下滿悶腹中疼痛或時喜笑或時悲哭或時太息或時語言錯亂疑作譫言狂語者非也神不守舍耳始得病於寤寐之間或恐悸頭項不甚痛行步只如舊此陰盛陽虛之故也兩手脈浮沉不一或左或右往來不定有沉澀弱微弦五種陰脈形狀按之全無力浮之損小沉之亦損小皆陰脈也宜先緩而後急緩宜用黃耆湯黃耆湯方人參生薑黃芩白茯苓白朮白芍藥各一兩甘草七錢嘔者加藿香陳皮各五錢甚者加乾薑炮一錢上㕮咀水煎量症加減多少用之如大便秘結者調中丸主之調中丸方人參白朮白茯苓乾薑甘草各等分上為末煉蜜丸每兩作十丸或五丸每服一二丸水少許煎服若病急者黃耆湯每服加乾薑一錢大便結者理中丸主之理中丸方人參白朮乾薑炮恐熱以生薑代之甘草炙上等分為末煉蜜丸每兩作五丸白湯化下先緩後急也若尤急者無汗宜附子乾薑甘草湯若自汗者宜白朮附子甘草湯量脈症可於四逆湯或真武湯或通脈四逆湯選用之垣馮內翰侄櫟年十六病傷寒目赤而煩渴脈七八至醫欲承氣湯下之已煮熟矣偶東垣從外來馮告之故東垣切脈大駭曰幾殺此兒彼以脈數為熱今脈七至是極熱也殊不知至真要大論云病有脈從而病反者何岐伯對曰脈至而從按之不鼓諸陽脈皆然此陰盛格陽於外非熱也取姜附來吾以熱因寒用之法治之治藥未就而病者爪甲已青頓服八兩汗漸出而愈上七法補兼發散隨所見症加姜附甚者熟附微者乾薑又甚者姜附兼施皆反治法也丹盛孺人年四十歲外冷內熱身疼頭痛倦怠脈虛微澀川芎柴胡芍藥各半兩羌活黃柏各二錢炒南星一錢甘草炙三分上分兩帖生薑三片水煎熱服沈材妻年五十餘滿身骨節痛半日以後發熱黃昏至半夜卻退蒼朮陳皮羌活各一錢白朮錢半木通炒柏通草各五分上㕮咀水煎溫服丁親家於久瘧後暑月涉水又勞苦腿肞痛漸漸渾身痛脅亦痛發熱脈卻澀不甚數予曰此勞倦乏力治用白朮黃耆蒼朮陳皮各一錢人參黃柏酒炒各五分木通三分甘草炙二分上㕮咀水煎下龍薈丸小阿婆午後發熱遍身痛血少月經黑色大便閉用芍藥五錢黃芩蒼朮各三錢黃柏酒炒木通各二錢上㕮咀水煎服上四方兼補發散隨所見脈症加炒柏龍薈皆正治法也陳小娘年二十發熱目閉開口則熱甚渴思水解脈澀而濁溷此食痰也治用黃芩甘草木通各五分陳皮白朮乾葛各一錢黃連桔梗各六分上㕮咀水煎下保和丸二三十丸一丈夫因恐發熱心不安用南星白茯苓各五錢硃砂二錢以上為六帖再用人參當歸柴胡各三錢黃芩川芎木通各二錢甘草紅花各五分上分四帖水二盞半入金銀器同煎至一盞去渣熱調服上二方兼補發散隨所見症加食積痰藥海神術湯治內傷冷飲外感寒邪無汗者蒼朮制防風各二兩甘草一兩炒上㕮咀加蔥白生薑同煎服如太陽症發熱惡寒脈浮而緊者加羌活二錢如太陽症脈浮緊中帶弦數者是兼少陽也加柴胡二錢如太陽症脈浮緊中帶洪者是兼陽明也加黃芩二錢婦人服者加當歸或加木香湯或加藁本湯各二錢如治吹奶煎成調六一散三五錢神效又神術湯六氣加減例太陽寒水司天加羌活桂枝餘歲非時變寒亦加冬亦加陽明燥金司天加白芷升麻餘歲非時變涼濕亦加秋亦加少陽相火司天加黃芩地黃餘歲非時變雨濕亦加夏亦加太陰濕土司天加白朮藁本餘歲非時變熱濕亦加夏末秋初亦加少陰君火司天加細辛獨活餘歲非時變熱亦加春末夏初亦加厥陰風木司天加川芎防風餘歲非時變溫和亦加春亦加以上神術湯六氣加減法非止為司天之氣設也至於歲之主氣與月建日時同前應見者皆當隨所見依上例加減之按海藏此論與戴人云病如不是當年氣看與何年運氣同便向此中求妙法方知皆在至真中之歌相表裡實發前人之所未發也蓋海藏此論所謂某氣司天加某藥者治常氣之法也所謂隨所應見加減者治變氣之法也戴人所謂看與何年同氣求治法者亦治變氣之法也能將二公之法擴充行之則內經運氣之本義燦然矣夫內經論運氣有常氣有變氣常氣者有定紀如某年屬某氣司天當寒某年屬某氣司天當熱是也變氣者無定紀如某年屬某氣司天當寒反變熱當熱反寒是也王氏註文釋以經無定紀之變氣作有定紀之常氣使後學皆以年歲占運氣而其應者十無一二是以人莫之信而其道湮晦久矣二公生於數千百年之後復啟其端而續之與程朱續孔孟不傳之緒同功也今僕謹於海藏逐年司天加藥之後伸餘歲變常之義其意有不盡者別述運氣類注定之同志之士幸究心焉白朮湯治內傷冷物外感風寒有汗者白朮三兩防風二兩甘草一兩炙上㕮咀每服三錢水一盞姜三片煎至七分溫服一日止一二服待二三日漸漸汗少為解又白朮湯治傷寒上解三陽下安太陰白朮如汗之改用蒼朮防風各一兩上㕮咀水煎至七分溫服用後方加減若發熱引飲者加黃芩甘草頭疼惡風者加羌活散三錢羌活一兩半川芎七錢細辛二錢半去蘆若身熱目痛者加石膏湯四錢石膏二錢知母半兩白芷七錢腹中痛者加芍藥湯三錢芍藥一兩桂枝半兩往來寒熱而嘔者加柴胡散三錢柴胡一兩半夏半兩心下痞者加枳實一錢若有里症加大黃一錢量虛實加減之邪去止服潔有汗不得服麻黃無汗不得服桂枝然春夏汗孔疏雖有汗不當服桂枝宜用黃耆湯和解之秋冬汗孔閉雖無汗不當服麻黃宜用川芎湯和解之春夏有汗脈微而弱惡風惡寒者乃太陽症秋冬之脈也宜用黃耆湯無汗亦用川芎湯秋冬有汗脈盛而浮發熱惡熱者乃陽明症春夏之脈也宜用黃耆湯無汗亦用川芎湯大抵有汗皆宜黃耆湯無汗皆宜川芎湯主之黃耆湯有汗則能止之白朮黃耆防風各等分上㕮咀每服五七錢至一兩水煎溫服汗多惡風甚者加桂枝川芎湯無汗則能發之川芎蒼朮羌活各等分上㕮咀每服五七錢至一兩水煎熱服無汗惡風甚者加麻黃一二錢法云五臟之脈寸關尺也今止言寸尺陰陽也若陽緩而陰急表和而里病陰緩而陽急里和而表病本黃耆建中加當歸湯治發熱頭疼脈浮數而尺中遲弱者宜先服此藥補血卻與麻黃桂枝輩黃耆當歸各兩半白芍桂枝甘草各一兩上㕮咀每服五錢姜三片棗一枚水煎日三夜二服如脈尚沉遲再進一服潔有汗不得服麻黃無汗不得服桂枝若未瘥則其變不可勝言故立此法使不犯三陽禁忌解表神方九味羌活湯陶尚節注云不問四時但有頭疼骨節痛發熱惡寒無汗脈浮緊者宜用此湯以代麻黃為穩當如頭疼發熱惡風自汗脈緩者宜用加減沖和湯即羌活湯中減蒼朮加白朮細辛加黃耆是也羌活一兩半治太陽肢骨痛之主藥也然非無為之主乃是撥亂反正之君也故大無不通小無不入關節痛者非此不降防風一兩半治一身盡痛乃卒伍卑賤之下職一聽君命將令而行隨所使引至之細辛半兩治少陰腎經頭痛川芎一兩治厥陰頭痛在腦蒼朮雄壯上行之藥能除濕下氣及安太陽使邪氣不至傳足太陰脾也白芷一兩治陽明經頭痛在額生地一兩治少陰心熱在內甘草一兩能緩裡急調和眾藥故有國老之稱也黃芩一兩治太陰肺熱在胸以上九味雖為一方然亦不可執執中無權猶執一也當視其經絡前後左右之不同從其大小輕重之不一增損用之其效如神用㕮咀水煎服若急欲汗者須熱服以羹粥投之若緩欲汗者溫服而不用湯粥投之脈浮而不解者先急後緩脈沉而不解者先緩後急九味羌活湯不獨解利治雜病神效如中風行經者加附子中風秘澀者加大黃中風並三氣合痹等症者各隨十二經絡上下內外寒熱溫涼四時六氣加減補瀉用之煉蜜丸亦可加生地各半治傷寒兩感如神用豆淋酒治破傷風保和解四時傷寒混解六經不犯禁忌大白朮湯白朮石膏防風羌活各二錢黃芩五錢白芷錢半知母七錢甘草一錢枳實半兩細辛三錢上㕮咀每服半兩水煎溫服未解更一服春倍加防風羌活夏倍加黃芩石膏季夏淫雨倍加白朮白芷秋加桂五錢冬加桂八錢或一兩海五積散治陰經傷寒脾胃不和及感寒邪白茯苓厚朴芍藥當歸麻黃去節半夏薑製各三兩乾薑炮兩半人參川芎各二兩甘草兩半白芷四兩枳殼五兩陳皮蒼朮新者二十四兩桔梗十二兩肉桂一兩上除枳殼肉桂外余併為粗末於大鍋內文武火炒令黃熟不至焦用紙攤在板上候冷入枳殼肉桂末和勻入瓷盒內每服二錢水一盞姜三片同煎服若傷寒蔥白一莖豆豉七粒同煎連服取汗若脾胃不和內傷冷物渾身疼痛頭昏無力胸膈不利飲食不下氣脈不和四肢覺冷或睡裡虛驚至晚心躁困倦即入鹽少許同煎若陰經傷寒手足逆冷及虛汗不止脈細疾面青而嘔更宜加附子同煎加減多少並在臨時消息之袖珍方無人參參蘇飲治內外感一切發熱主藥又云前胡葛根自能解肌枳殼陳皮自能寬膈大治中焦滿痞凡有熱不得拘其所見小兒室女尤宜服之前胡枳殼陳皮甘草桔梗木香各一錢人參紫蘇乾葛半夏茯苓各八分上㕮咀每服四錢用水一盞生薑五片棗一枚煎服不拘時若素有痰者候熱退以二陳六君子湯間服上方治痰飲停積中脘閉塞眩暈嘈煩忪悸嘔逆及痰飲中人停留關節手腳嚲曳口眼歪斜半身不遂食已則嘔頭疼發熱狀如傷寒者悉治之一法用此藥三兩加四物湯二兩合和名茯苓補心湯大治男子婦人虛勞發熱或五心煩熱並衄血吐血便血及婦人下血過多致虛熱者並宜服之或因用心太過發虛熱者及往來寒熱者用之神效柴胡散治邪入經絡體瘦肌熱推陳致新解利傷寒時疫中暍伏暑柴胡四兩甘草一兩上㕮咀水煎食後熱服此藥冬月可以潤心肺止咳嗽除壅熱春夏可以御傷寒時氣解毒居常不可缺者且倉卒可以易得長幼皆宜服之山冒感用帶根蔥煎湯嚼生薑得汗愈上六方通詳諸表方元氣不虛者服效第二方熱多者宜服之第三方寒多者宜服之第四方痰飲者宜服之第五六方倉卒宜備之海治傷寒外症全是下症大熱而脈反細不可下者瀉心湯主之方見傷寒脈有力者黃連瀉心湯無力者半夏瀉心湯云人參散治傷寒汗下後餘熱不退或煩或渴面赤者人參山梔藍葉甘草白蘚皮各等分上㕮咀每服五錢水煎服丹絮矩新書謂有雜合邪者當以雜合法治之譬如惡寒發熱得之感冒明是外合之邪已得浮數之脈而氣口又緊盛明為食所傷病者又倦怠脈重接俱有豁意而胸膈痞滿間引兩脅其脈輕取又似乎弦此又平昔多怒肝邪之所為也細取左尺大細沉弱此又平時房勞之過也治法宜以感冒一節且放後先視其形色之強弱厚薄且以補中化食行滯清涼胃火而以薑辣行之則中氣稍回傷滯稍行津液得和通體得汗外感之邪自解醫者不肯詳審求之只顧表散外邪又不推究兼見之邪脈亦不窮問所得之病因與性情之執著巧施雜合治法將見正氣自虛邪氣愈固皆拙工之過也本發熱惡寒近似傷寒者有五種脈浮而緊其人發熱而惡寒者傷寒之候也脈浮而數其人發熱惡寒或有痛處是欲為癰癤也脈浮按之反澀其人發熱惡寒或膈實而嘔吐者此是傷食也脈浮而滑其人發熱惡寒或頭眩而嘔吐此是風痰之症也脈浮而弦其人發熱惡寒或思飲食此是欲化瘧疾也能辨其脈又能驗其症斯無誤矣海傷寒與雜症相似藥不可差夫傷寒表症發熱惡熱而渴與下雜症同但頭痛身熱目痛鼻乾不得臥白虎主之乃陽明經病也正陽陽明氣病脈洪大先無形也雜病里症發熱惡熱而渴但目赤者病臟也手太陰氣不足不能管領陽氣也宜以枸杞生地熟地之類主之脈洪大甚則嘔血先有形也氣病在裡誤用血藥無傷也為安血而益陰也血病在裡誤用氣藥如白虎湯者非也為瀉肺而損陰也垣辨誤服白虎變症昔西臺掾葛君瑞二月中病傷寒發熱以白虎湯主之病者面黑如墨本症遂不復見脈沉細小便不禁東垣初不知也及診之曰此立夏以前誤服白虎白虎大寒非行經之藥止能寒臟腑不善用之則傷衛氣本病曲隱於經絡之間或投以大熱之藥求以去陰邪他症必起非所以救白虎也可用溫藥升陽行經有難者曰白虎大寒非大熱何以救君之症奈何東垣曰病隱經絡間陽道不行而本症見矣又何難哉果如其言而愈潔大煩熱不止晝夜無度用八關大刺法見赤眼熱無度不可止宜陷谷出血密遍身發熱如火狂言妄語氣虛者補手三里氣實者瀉足三里摘傷寒胸熱不已大杼五分瀉風門五分留七呼中府乳上三肋間動脈應手刺入三分缺盆三分傷寒胃熱不已中脘瀉上廉三分下廉八分三里氣衝傷寒四肢熱不已雲門三分灸五壯肩髃委中腰腧在二十一椎節下間宛宛中以挺伏地舒身兩手相重支額縱四體然後取其穴針入五分留七呼灸七十壯集傷寒大熱不退曲池瀉絕骨補傷寒熱退後再發熱風門合谷行間絕骨惡寒病有發熱惡寒者發於陽也無熱惡寒者發於陰也發於陽者七日愈發於陰者六日愈以陽數七陰數六故也發熱惡寒脈浮屬太陽方論甚眾並見發熱門太陽病條惡寒脈微而複利者亡血也四逆加人參湯主之王叔和原入霍亂門四逆加人參湯人參乾薑甘草各一兩附子一枝去皮煨上㕮咀每服五錢水煎溫服日三少陰病惡寒身倦而利若利止手足溫者可治利不止手足逆冷者不可治方論見下利少陰病惡寒身倦時煩欲去衣被者可治四逆無脈不煩而躁者死方論見但欲寐惡寒手足逆冷若兼大汗拘急下利四逆湯方論見下利若兼頭汗心下滿脈沉細大便硬者小柴胡湯方論見厥若夏月中暑脈虛而渴背惡寒者白虎加人參湯方論見中暑若口中和但欲寐者灸之宜附子湯發汗後惡寒者虛也論見發熱發汗病不解反惡寒者虛故也芍藥甘草附子湯主之芍藥甘草附子湯方芍藥白朮各二兩甘草三兩桂枝四兩附子一枚炮去皮上㕮咀每服五錢水煎溫服太陽病下後脈促胸滿者桂枝去芍藥湯主之桂枝去芍藥湯方桂枝去皮生薑各兩半切甘草一兩炙大棗六枚上㕮咀每服五錢水煎溫服若微惡寒者去芍藥加附子湯主之活人云芍藥味酸脈促胸滿恐成結胸故去芍藥單用辛甘之味發散毒氣也桂枝去芍藥加附子湯方桂枝生薑各兩半甘草一兩大棗六枚附子半個去皮炮上㕮咀水煎溫服每服五錢傷寒汗下後心下痞而惡寒者表未解也先用桂枝湯解表用大黃黃連瀉心湯攻痞若痞而汗出惡寒者表已解也附子瀉心湯主之方論見痞陽明病胃家實若汗多發熱惡寒者表未解也未可與承氣湯方論見潮熱傷寒脈浮汗出微惡寒小便數腳攣急者忌服桂枝湯方論見厥惡寒續法活大抵太陽病必發熱而惡寒不可過覆衣被及近火氣恐寒熱相搏脈道沉伏愈令病人寒不可遏但去被徹火兼飲以和表之藥自然不惡寒矣若婦人惡寒尤不可近火恐寒氣入腹血室結聚針藥所不能治矣惡風發熱惡風為表虛屬太陽病方論見發熱太陽病條發汗後遂汗漏不止其症似風濕相搏症背惡風汗出小便不利四肢難屈伸但心下不滿者身不痛用桂枝加附子湯方見自汗風濕相搏者骨節煩疼掣痛用甘草附子湯方見體痛身熱惡風項強脅滿手足溫而渴者用小柴胡湯方論見脅痛惡風續法成惡風者見風至則惡矣必居密室之內幃帳之中則坦然自舒惡寒者則不待風而自寒雖身大熱而不欲去衣者是也活人云惡寒者不當風而自憎寒惡風者當風而憎寒也頭痛發熱頭痛惡風者屬太陽方論見發熱太陽病大便不利六七日頭痛身熱小便赤者宜承氣湯若小便利者知不在裡仍在表也宜桂枝湯論見胃實頭痛發熱脈弦細者屬少陽宜小柴胡湯論見口苦若脈反沉者當救里宜四逆湯論見發熱頭痛兼心下痞硬滿痛苦眩冒時如結胸者刺大椎第一間肺俞肝俞論見項強若下後仍發熱無汗小便不利者桂枝去桂加茯苓白朮湯方論見項強若表解汗出脅痛乾嘔者宜十棗湯方論見脅痛頭痛乾嘔吐涎沫者用吳茱萸湯方論見吐若表解汗出心下硬引脅痛者用十棗湯若陽明胃實反無汗而小便利嘔咳手足厥者為寒邪方論見胃實頭痛發熱吐利者為霍亂方論見吐利濕家病身痛發熱面黃而喘頭痛鼻塞而煩其脈大能食者納藥鼻中則愈方論見身痛濕痹條太陽病下之復脈細數者頭痛未止頭痛續法丹一丈夫因浴冷水發熱頭痛脈緊此有寒濕也宜溫藥汗之蒼朮麻黃乾葛各錢半甘草炙些陳皮川芎各二錢分二帖服得汗後知病退又與下補藥芍藥半兩陳皮半夏各三錢白朮蒼朮人參木通各二錢甘草五分分四帖姜水煎服一婦人頭痛發熱而渴白朮半兩陳皮川芎各三錢乾葛二錢木通錢半甘草炙些上分四帖水煎溫服活若已發汗或未發汗頭痛如破者用連須蔥白湯連須蔥白湯方蔥白連須切半升生薑二兩上以水二升煮取一升分二次溫服再不止者宜服後方葛根蔥白湯方葛根芍藥知母各半兩蔥白川芎生薑各一兩上以水三升煎至一升熱服若非次頭疼胸中滿及發寒熱脈緊而不大者即是膈上有涎宜用瓜蒂末一錢暖水調下吐涎立愈云傷寒汗下後頭痛起目眩者宜獨活湯防風獨活旋覆花當歸各七錢上㕮咀姜水同煎服傷寒熱病後頭痛不止者用石膏川芎湯石膏川芎各一兩上㕮咀每服五錢水煎服海太陽頭痛有汗桂枝湯無汗麻黃湯陽明頭痛白虎湯少陽頭痛小柴胡湯太陰頭痛脈浮桂枝湯脈沉理中湯少陰頭痛小柴胡湯厥陰頭痛外傷本經桂枝麻黃各半湯嘔而微吐苦水者吳茱萸湯垣太陰頭痛者必有痰也少陰頭痛者足寒而氣逆也蓋太陰少陰二經雖不至頭然痰與氣逆壅於膈中則頭上氣不得暢降而為痛也云如脈浮而頭痛過在手足太陽刺完骨京骨如脈浮而長過在手足陽明刺合谷衝陽如脈浮而弦過在手足少陽刺陽池丘墟風府風池此刺頭痛之法也集傷寒頭痛刺合谷攢竹項強發熱惡風項強者屬太陽方論見發熱太陽病條項強脅下滿苦身熱惡風手足溫而渴者小柴胡湯若下後不能食身黃小便難者與柴胡湯必反重方論俱見脅痛太陽與少陽並病頭項強痛或眩冒時如結胸心下痞鞭者當刺大椎第一間肺俞肝俞慎勿發汗如發汗則譫語脈弦五六日譫語不止當刺期門太陽與少陽並病心下硬頭項強而眩者當刺大椎肺俞慎勿下之宜服桂枝湯或下之仍頭項強痛翕翕發熱無汗心下滿微痛小便不利者桂枝去桂加茯苓白朮湯主之注云心下滿痛小便利者成結胸小便不利為停飲故加苓術以行之桂枝去桂加茯苓白朮湯方芍藥生薑茯苓白朮各兩半甘草一兩大棗六枚上㕮咀每服五錢水煎溫服小便利即愈結胸亦項強如柔痓狀者大陷胸丸主之項強卒口噤背反張為痓方論見痓身體痛發熱惡寒身體痛者屬太陽病麻黃湯大青龍湯是也若兼心下支結者柴胡桂枝湯若兼下利清穀腹脹者先以四逆溫里後以桂枝發表方論見發熱太陽病條若尺脈遲者血少榮氣不足活人先以黃耆建中湯養其血俟尺脈回卻用柴胡等湯和解之身體疼痛脈沉發熱頭痛不瘥者四逆湯方論見發熱若少陰但欲寐手足寒者附子湯方論見但欲寐發汗後身體痛脈沉遲者桂枝加芍藥生薑人參新加湯主之桂枝人參各兩半芍藥生薑各二兩甘草一兩大棗六枚上㕮咀每服五錢水煎溫服身體痛下利方論見下利條身體痛吐利為霍亂方論見吐利條身體痛手足寒若脈沉但欲寐者附子湯方論見但欲寐若大汗出熱不去內拘急自利惡寒者四逆湯方論見下利若夏月中暑脈虛而渴者白虎加人參湯方論見中暑身痛如被杖面目青咽痛者為陰毒升麻鱉甲去雄黃蜀椒湯方論見陰毒太陽病關節疼痛而煩脈沉而細者此名濕痹濕痹之候小便不利大便反快但當利其小便活人脈沉細作沉緩濕家之為病身盡痛發熱而煩身黃如熏可與麻黃加朮湯發其汗慎不可以大劑攻之麻黃加朮湯方麻黃三兩去節桂枝二兩甘草一兩炙杏仁十個去皮尖白朮四兩上㕮咀先以水煮麻黃去沫入諸藥煎溫服覆取微汗濕家病身上疼痛發熱面黃而喘頭痛鼻塞而煩其脈大自能飲食腹中和無病病在頭中寒濕故鼻塞納藥鼻中則愈納鼻藥方見發熱濕家其人但欲汗出背強欲得被覆向火若下早則噦胸滿小便不利舌上如胎者以丹田有熱胸中有寒渴欲得水而不能飲則口煩躁也濕家下之額上汗出微喘小便利者死若下利不止者亦死上濕痹活人書為中濕脈沉細為沉緩小便自利者朮附湯小便不利者甘草附子湯五苓散而不及麻黃加朮湯並納鼻藥蓋麻黃納鼻皆是表藥而非脈沉緩之劑故也風濕相搏骨節煩疼掣痛不能屈伸近之則痛劇汗出短氣小便不利惡風不欲去衣或身微腫者甘草附子湯主之甘草白朮各一兩桂枝二兩附子一枚炮上㕮咀水煎溫服作四劑活人云身腫者加防風一兩悸氣小便不利者加白茯苓一兩半傷寒八九日風濕相搏身疼體煩不能轉側不嘔不渴脈浮虛而澀者桂枝附子湯主之若其人大便硬小便自利者去桂加白朮湯主之桂枝附子湯方桂枝一兩二錢附子一枚炮甘草六錢炙大棗四枚生薑切一兩上㕮咀每服五錢水煎溫服白朮附子湯方白朮三兩附子一枚炮去皮甘草二兩炙生薑兩半大棗六枚上㕮咀水三升煮一升分三服溫服一服覺身癢半日許再服三服都盡其人如冒狀勿怪即是朮附並走皮中逐水氣未得除故耳病者一身盡疼發熱日晡而劇者多風濕此病傷於汗後當風或久傷取冷所致也可與麻黃杏仁薏苡湯麻黃杏仁薏苡湯方薏苡仁麻黃各半兩去節湯泡甘草一兩炙杏仁十枚去皮尖上㕮咀每服四錢水煎溫服有微汗者避風風濕身重脈浮汗出惡風者防己黃耆湯方見身重問曰風濕相搏一身盡疼痛法當汗出而解值天陰雨不止醫云此可發汗汗之病仍不愈者何也答曰發其汗汗大出者但風氣去濕氣在故不愈也若治風濕者發其汗但微微自欲汗出者風濕俱去也體痛續法垣風濕相搏一身盡痛者補中益氣湯加羌活防風升麻藁本蒼朮治之如病去勿再服以諸風藥損人元氣而益其病故也海神術湯治風濕惡寒脈緊無汗白朮湯治風濕惡風脈緩有汗俱見續傷寒發熱條上二術湯治風濕又當隨症加減其詳並見痓條及白朮神術二湯後活杏仁湯療風濕身體疼痛惡風微腫桂枝二兩麻黃去節湯泡干芍藥天門冬去心各一兩生薑兩半杏仁二十五枚去皮尖炒上㕮咀每服五錢水煎溫服垣麻黃復煎湯治陰室中汗出懶語四肢困倦乏力走疰疼痛乃下焦伏火不得伸浮而躁熱汗出一身疼痛蓋風濕相搏也以麻黃髮汗漸漸發之在經者亦宜發汗況值季春之月脈緩而遲尤宜發之令風濕去而陽氣升困倦乃退血氣俱得生旺也麻黃去節用水五盞先煎令沸去沫渣再煎至三盞方入下藥黃耆各二錢白朮人參柴胡根防風生地各五分甘草三分羌活黃柏各一錢杏仁三個去皮尖上㕮咀作一服入麻黃湯煎至一盞臨臥服勿飽服當歸拈痛湯治濕熱為病身體疼痛方見諸痹門一身盡痛條
