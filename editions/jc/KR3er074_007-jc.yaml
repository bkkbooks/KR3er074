body:
  text: 卷之七陰陽臟腑部刺灸通論刺虛實刺寒熱入治寒熱法靈小針之要易陳而難入針解云易陳者易言也難入者難著於人也粗守形上守神粗守形者守刺法也上守神者守人之血氣有餘不足可補瀉也神乎神客在門神客者正邪共會也神者正氣也客者邪氣也在門者邪循正氣之所出入也未睹其疾惡知其原未睹其疾者先知邪正何經之疾也惡知其原者先知何經之病所取之處也刺之微在速遲速遲者疾徐之意也粗守關上守機粗守關者守四肢而不知血氣正邪之往來也上守機者知守氣也機之動不離其空知氣之虛實用針之疾徐也空中之機清淨以微針以得氣密意守氣勿失也其來不可逢氣盛不可補也其往不可追氣虛不可瀉也知機之道者不可掛以發言氣易失也不知機道叩之不發言不知補瀉之意血氣已盡而氣不下也知其往來要與之期知其往來者知氣之逆順盛虛也要與之期者知氣之可取之時也粗之暗乎冥冥不知氣之微密也妙哉上獨有之者盡知針意也往者為逆言氣之虛而小小者逆也來者為順言氣之平平者順也明知逆順正行無問言知所取之處也迎而奪之惡得無虛追而濟之惡得無實迎之隨之以意和之針道畢矣迎而奪之者瀉也追而濟之者補也難經云所謂迎隨者知榮衛之流行經脈之往來隨其逆順而取之故曰迎隨又云迎而奪之者瀉其子也追而濟之者補其母也假令心病瀉手心主俞是謂迎而奪之也補手心主井者是謂隨而濟之也凡用針者虛則實之氣口虛而當補之也素云針下熱也氣實乃熱也謹按針下猶言針後也滿則泄之氣口盛而當瀉之也素云針下寒也氣虛乃寒也宛陳則除之去血脈也素云出惡血也邪盛則虛之諸經有盛者皆瀉其邪也素云出針勿按大要曰徐而疾則實徐內而疾出也素云徐出針而疾按之疾而徐則虛疾內而徐出也素云疾出針而徐按之言實與虛若有若無言實者有氣虛者無氣也素云言實與虛者寒溫氣多少也有若無者疾不可知也察後與先若亡若存言氣之虛實補瀉之先後也察其氣之已下與常存也為虛與實若得若失言補者佖然若有得也瀉則恍然若有失也難經云氣未實牢者為得濡虛者為失故曰若得若失素云為虛與實者工勿失其法若得若失者離其法也虛實之要九針最妙素云為其各有一宜也補瀉之時以針為之素云補瀉之時者與氣開閉相合也瀉曰迎之必持而內之放而出之排陽得針邪氣得泄按而引針是謂內溫血不得散氣不得出也補曰隨之意若忘之若行若按如蚊虻止如留如還去如弦絕令左屬右其氣故止外門已閉中氣乃實必無留血急取誅之持針之道堅者為寶正指直刺無針左右神在秋毫屬意病者審視血脈者刺之無殆方刺之時必在懸陽及與兩衛神屬勿去知病存亡血脈者在腧橫居視之獨澄切之獨堅刺之而氣之不至無問其數刺之而氣至乃去之勿復針針各有所宜各不同形各任其所為刺之要氣至而有效效之信若風之吹雲明乎若見蒼天刺之道畢矣邪氣來也緊而疾穀氣來也徐而和並見九針十二原並小針解凡刺之屬三刺至穀氣邪僻妄合陰陽易居逆順相反浮沉異處四時不得稽留淫泆須針而去故一刺則陽邪出再刺則陰邪出三刺則穀氣至穀氣至而止所謂穀氣至者已補而實已瀉而虛故以知穀氣至也所謂三刺則穀氣出者先淺刺絕皮以出陽邪再刺則陰邪出者少益深絕皮致肌肉未入分肉間也已入分肉之間則穀氣出故刺法曰始淺刺之以逐邪氣而來血氣後刺深之以致陰氣之邪最後刺極深之以下穀氣此之謂也故用針者不知年之所加氣之盛衰虛實之所起不可以為工也並見終始官針二篇上候氣有二一曰邪氣二曰穀氣凡刺氣至則候邪氣盡盡則穀氣至至則止針矣所謂邪氣者曰緊而疾曰補而未實瀉而未虛也所謂穀氣者曰徐而和曰補而已實瀉而已虛也睹其色察其目知其散復一其形聽其動靜上工知相五色於目有知調尺寸小大緩急滑澀以言所病也知其邪正者知論虛邪與正邪之風也右主推之左持而御之者言持針而出入也氣至而去之言補瀉氣調而去之也以上見針解凡將用針必先診視脈氣之劇易乃可以治也素五臟已定九候已備後乃存針王注云先定五臟之脈次循九候之診然後乃存意於用針之法黃帝問曰經言氣之盛衰左右傾移以上調下以左調右有餘不足補瀉於滎俞余知之矣此皆榮衛之傾移虛實之所生非邪氣從外入於經也余願聞邪氣之在經也其病人何如取之奈何岐伯對曰夫聖人之起度必應於天地故天有宿度地有經水人有經脈天地溫和則經水安靜天寒地凍則經水凝泣天暑地熱則經水沸溢卒風暴起則經水波湧而隴起夫邪之入於脈也寒則血凝泣暑則氣淖澤虛邪因而入客亦如經水之得風也經之動脈其至也亦時隴起其行於脈中循循燃其至寸口中手也時大時小大則邪至小則平其行無常處在陰與陽不可為度從而察之三部九候卒然逢之早遏其路帝曰候氣奈何岐伯曰夫邪去絡入於經也舍於血脈之中其寒溫未相得如湧波之起也時來時去故不常在故曰方其來也必按而止之止而取之無逢其沖而瀉之真氣者經氣也經氣太虛故曰其來不可逢此之謂也靈樞云其來不可逢者氣盛不可補也故曰候邪不審大氣已過瀉之則真氣脫脫則不復邪氣復至而病益蓄故曰其往不可追此之謂也靈樞云其往不可追者氣虛不可瀉也不可掛以發者待邪之至時而髮針瀉矣不可掛以發者言氣易失也若先若後者血氣已盡其病不可下故曰知其可取如發機不知其取如叩錐故曰知機道者不可掛以發不知機者扣之不發此之謂也帝曰補瀉奈何岐伯曰此攻邪也疾出以去盛血而復其真氣此邪新客溶溶未有定處也推之則前引之則止逆而刺之溫血也刺出其血其病立已邪之新客來也未有定處推之則前引之則止逢而瀉之其病立已俱離合真邪論上候邪氣新客經脈而取之之法也言邪之初客經脈其寒溫未相搏如湧波之起也時來時去故不常在欲取之者必於三部九候之間診察以待之儻於一部一候見其如湧波之來則按而止之然後取之不可逢其衝來便瀉之故曰其來不可逢其或候氣不審至於湧波之大氣已過去而瀉之則真氣脫邪氣復至而病益蓄故曰其往不可追也凡診三部九候而待邪至之機以發刺者必專心致意故曰知機道者不可掛以發也所謂湧波者脈浮大也三部九候非寸關尺乃面有三部手有三部足有三部合三部為九部也帝曰善然真邪已合波隴不起候之奈何岐伯曰審捫循三部九候之盛虛而調之察其左右上下相失及相減者審其病藏以期之不知三部者陰陽不別天地不分地以候地天以候天人以候人調之中府以定三部故曰刺不知三部九候病脈之處雖有大過且至工不能禁也誅罰無過命曰大惑反亂大經真不可復用實為虛以邪為真用針無義反為氣賊奪人正氣以從為逆榮衛散亂真氣已失邪獨內著絕人長命予人夭殃不知三部九候故不能長久因不知合之四時五行因加相勝釋邪攻正絕人長命離合真邪論上候邪客已久真邪已合而取之之法也言取邪之新容者但候波隴之脈來處取之今其邪已合波隴不起而不知邪客之處也故又必當捫循三部九候之盛虛視其盛處瀉之虛處補之左右相失而左大右細者瀉左補右上下相失而上大下小者瀉上部補下部上小下大者補上部瀉下部左右上下皆相減而細者審其何臟之減以其減臟日時之衰者補其所減經減臟日時之盛者瀉其所勝經候邪去真復而止故曰刺不知三部九候病脈之處則誅罰無過反亂大經用實為虛以邪為真真氣已失邪獨內著絕人長命也上工救其萌芽必先見三部九候之氣盡調不敗而救之故曰上工下工救其已成救其已敗救其已成者言不知三部九候之相失因病而敗之也知其所在者知診三部九候之病脈處而治之故曰守其門戶莫知其情而見邪形也八正神明論難言上工治未病中工治已病者何謂也然所謂治未病者見肝之病則知肝當傳之於脾故先實其脾氣無令得受肝之邪也故曰治未病焉中工見肝之病不曉相傳但一心治肝故曰已病也七十七難自篇首至此乃察病用針切要之旨學者當潛心體認之醫而不知此非工也噫今世稍知穴法便自驕滿由不知粗守形上守神之論也可慨哉靈夫氣之在脈也邪氣在上針解云言邪氣之中人也高故邪氣在上也濁氣在中言水穀皆入於胃其精氣上注於肺濁溜於腸胃若寒暑不適飲食不節而病生於腸胃故命曰濁氣在中也清氣在下言清濕地氣之中人也必從足始故曰清氣在下針陷脈則邪氣出取之上針中脈則邪氣出取之陽明合也針大深則邪氣反沉言浮淺之病不欲深刺也深則邪氣從之入故曰反沉皮肉筋脈各有所處言經絡各有所主也病各有所宜甲乙經宜字作合各不同形各以任其所宜見小針解及九針十二原素病有浮沉刺有深淺各至其理無過其道過之則內傷不及則生外壅壅則邪從之淺深不得反為大賊內動五臟後生大病故曰病有在毫毛腠理者有在皮膚者有在肌肉者有在脈者有在筋者有在骨者有在髓者云云刺要論病在脈調之血病在血調之絡病在氣調之衛病在肉調之分肉病在筋調之筋病在骨調之骨燔針劫刺其下及與急者王注云調筋法也病在骨焠針藥熨調骨法也病不知所痛兩蹺為上身形有痛九候莫病則繆刺之刺絡脈也痛在於左而右脈病者巨刺之刺經脈也見調經論篇靈手屈而不伸者其病在筋伸而不屈者其病在骨在骨守骨在筋守筋終始篇難言刺榮無傷衛刺衛無傷榮何謂也然針陽者臥針而刺之刺陰者先以左手攝按所針榮俞之處氣散乃納針是謂刺榮無傷衛刺衛無傷榮也見七十一難素刺骨者無傷筋刺筋者無傷肉刺肉者無傷脈刺脈者無傷皮刺皮者無傷肉刺肉者無傷筋刺筋者無傷骨刺骨無傷筋者針至筋而去不及骨也刺筋無傷肉者至肉而去不及筋也刺肉無傷脈者至脈而去不及肉也刺脈無傷皮者至皮而去不及脈也林注云此謂淺深不至所當刺之處也所謂刺皮無傷肉者病在皮中針入皮中無傷肉也刺肉無傷筋者過肉中筋也刺筋無傷骨者過筋中骨也此之謂反也戒其太深也刺齊論靈凡針之要官針最妙九針之宜各有所為長短大小各有所施也不得其用病弗能移疾淺針深內傷良肉皮膚為癰病深針淺病氣不瀉反為大膿病小針大氣瀉太甚疾必為害病大針小氣不泄瀉亦復為敗失針之宜大者瀉小者不移已言其過請言其所施官針篇靈一曰鑱針長一寸六分頭大末銳去瀉陽氣九針十二原鑱鋤街切潔古云平半寸長一寸六分其頭大末銳主熱在頭分宜此甲一者天天者陽也五臟之應天者肺也肺者五臟六腑之蓋也皮者肺之合也人之陽也故為治鑱針鑱針者取法於巾針去末半寸卒銳之長一寸六分大其頭銳其末令無得深入而陽氣出主熱在頭身者故曰病在皮膚無常處者取之鑱針於病所膚白勿取靈二曰員針長一寸六分針如卵形揩摩分間不得傷肌肉以瀉分氣九針十二原潔古云其身長針針如卵形肉分氣病宜此甲二者地地者土也人之所以應土者肉也故為之治員針員針者取法於絮針必筩其身而員其末其鋒如卵長一寸六分以瀉肉分之氣令不傷肌則陽氣得瀉故曰病在分肉間取以員針靈三曰鍉針長三寸半鋒如黍粟之銳主按脈勿陷以致其氣九針十二原潔古云脈氣虛少者宜此甲三者人也人之所以成生者血脈也故為之治鍉針鍉針者取法於黍粟大其身而員其末如黍粟之銳長三寸五分令可以按脈勿陷以致其氣使邪氣獨出故曰病在脈氣少當補者取以鍉針針於井滎分輸靈四曰鋒針長一寸六分刃三隅以發痼疾九針十二原潔古云瀉熱出血發泄痼疾甲四者時也時者四時八風之客於經絡之中為瘤病者也故為之治鋒針鋒針者取法於絮針筩其身而鋒其末刃三隅長一寸六分令可以瀉熱出血發泄痼疾故曰病在五臟固居者取以鋒針瀉於井滎分輸取以四時也靈五曰鈹針長四寸廣二分半末如劍鋒以取大膿九針十二原鈹音皮潔古云一名破針用以破癰腫血膿甲五者音也音者冬夏之分分於子午陰與陽別寒與熱爭兩氣相搏合為癰膿者也故為之治鈹針鈹針者取法於劍令其末如劍鋒廣二分半長四寸可以取大膿出血故曰病大膿血取以鈹針靈六曰員利針長一寸六分大如氅且員且銳中身微大以取暴氣九針十二原潔古云尖如毫且員且利身中微大調陰陽除暴氣甲六者律也律者調陰陽四時而合十二經脈虛邪客於經絡而為暴痹者也故為之治員利針員利針者取法於氂針且員且銳身中為微大長一寸六分以取癰腫暴痹令尖如氂微大其末反小其身令可深內也故曰病痹氣暴發者取以員利針靈七曰毫針長三寸六分尖如蚊虻喙靜以徐往微以久留之而養以取痛痹九針十二原潔古云尖如蚊虻喙調經絡去痛痹甲七者星也星者人之七竅邪之所客於經舍於絡而為痛痹者也故為之治毫針毫針者取法於毫毛長一寸六分令尖如蚊蟲喙靜以徐往微以久留正氣因之真邪俱往出針而養主以治痛痹在絡也故曰痹病氣通而不去者取之毫針靈八曰長針長七寸鋒利身薄可以取遠痹九針十二原沽古云鋒利痹深居骨解腰脊節腠之間者甲八者風也風者人之股肱八節也八正之虛風傷人內舍於骨解腰脊節腠之間為深痹也故為之治長針長針者綦針也長七寸長其身而鋒其末令可以取深邪遠痹故曰病在中者取以長針綦巨其切九曰大針長四寸尖如挺其鋒微員以瀉機關之水也九針十二原潔古云一名焠針針風虛合於骨解皮膚之間者甲九者野也野者人之節解皮膚之間也淫邪流溢於身如風水之狀而溜不能過於機關大節者也故為之治大針大針者取法於鋒針其針微員長四寸以瀉機關內外取大氣之不能過於關節者也故曰病水腫不能過關節者取以大針黃帝問曰刺有五邪何謂五邪伯高曰病有持癰者有容大者有狹小者有熱者有寒者是謂五邪刺五邪法未詳凡刺癰刺用鈹針無迎隴易俗移性不得膿脆道更行去其鄉不安處所乃散亡諸陰陽過癰者取之其輸瀉之凡刺大邪用鋒針日以小泄奪其有餘乃益虛剽其通針其邪肌肉親視之無有反其真刺諸陽分肉之間凡刺小邪用員針日以大補益其不足乃無害視其所在迎之界遠近盡至其不得外侵而行之乃自費刺分肉之間凡刺熱邪用鑱針越而蒼出遊不歸乃無病為開通闢門戶使邪得出病乃已凡刺寒邪用毫針日以溫徐往徐來致其神門戶已閉氣不分虛實得調其氣存也刺節真邪論靈凡刺有九以應九變一曰輸刺輸刺者刺諸經滎輸藏腧也二曰遠道刺遠道刺者病在上取之下刺府輸也三曰經刺經刺者刺大經之結絡經分也四曰絡刺絡刺者刺小絡之血脈也五曰分刺分刺者刺分肉之間也六曰大寫刺大寫刺者刺大膿以鈹針也七曰毛刺毛刺者刺浮痹皮膚也八曰巨刺巨刺者左取右右取左九曰焠刺焠刺者刺燔針則取痹也凡刺有十二節以應十二經一曰偶刺偶刺者以手直心若背直痛所一刺前一刺後以治心痹刺此者傍針之也二曰報刺報刺者刺痛無常處也上下行者直內無拔針以左手隨病所按之乃出針復刺之也三日恢刺恢刺者直刺傍之舉之前後恢筋急以治筋痹也傍之舉之者謂直刺入郄轉針頭從傍挑舉其筋也四曰齊刺齊刺者直入一傍入二以治寒氣小深者或曰三刺三刺者治痹氣小深者也五曰揚刺揚刺者正內一傍內四而浮之以治寒氣之博大者也六曰直針刺直針刺者引皮乃刺之以治寒氣之淺者也七曰輸刺輸刺者直入直出稀髮針而深之以治氣盛而熱者也八曰短刺短刺者刺骨痹稍搖而深之致針骨所以上下摩骨也九曰浮刺浮刺者傍入而浮之以治肌急而寒者也十曰陰刺陰刺者左右率刺之以治寒厥中寒厥足踝後少陰也十一曰傍針刺傍針刺者直刺傍刺各一以治留痹久居者也十二曰贊刺贊刺者直入直出數髮針而淺之出血是謂治癰腫也凡刺有五以應五臟一曰半刺半刺者淺內而髮針無針傷肉如拔毛狀以取皮氣此肺之應也二曰豹文刺豹文刺者左右前後針之中脈為故以取經絡之血者此心之應也三曰關刺關刺者直刺左右盡筋上以取筋痹慎無出血此肝之應也或曰淵刺一曰豈刺四曰合谷刺合谷刺者左右雞足針於分肉之間以取肌痹此脾之應也五曰輸刺輸刺者直入直出深內之至骨以取骨痹此腎之應也見官針篇標幽賦拯救之法妙用者針察歲時於天道定形氣於予心春夏瘦而淺刺秋冬肥而刺深不窮經絡陰陽多逢刺禁既論臟腑虛實須向經尋原夫起自中焦水初下漏太陰為始至厥陰而方終穴出雲門抵期門而最後正經十二別絡走三百餘支正側偃伏氣血有六百餘候手足三陽手走頭而頭走足手足三陰足走腹而胸走手要識迎隨須明逆順況夫陰陽血氣多少為最厥陰太陽少氣多血太陰少陰少血多氣又有氣多血少者少陽之分氣盛血多者陽明之位先詳多少之宜次察應至之氣輕滑慢而未來沉澀緊而已至既至也量寒熱而留疾未至也據虛實而痏氣氣之至也若魚吞釣餌之浮沉氣未至也似閉處幽堂之深邃氣速至而效速氣遲至而不治觀夫九針之法毫針最微七星可應眾穴主持本形金也有蠲邪扶正之道短長水也有決凝開滯之機定刺象木或斜或正口藏比火進陽補羸循機捫而可塞以象土實應五行而可知然而一寸六分包含妙理雖細擬於毫髮同貫多歧可平五臟之寒熱能調六腑之實虛拘攣閉塞遣八邪而去矣寒熱痛痹開四關而已之凡刺者使本神朝而後入既刺也使本神定而氣隨神不朝而勿刺神已定而可施定腳處取氣血為主意下手處認水土是根基天地人三才也湧泉同璇璣百會上中下三部也大包與天樞地機陽蹺陽維並督脈主肩背腰腳在表之疾陰蹺陰維任帶沖主心腹脅肋在裡之危二陵二蹺二交似續而交五大兩間兩商兩井相依而列兩支足見取穴之法必有分寸先審自意次觀肉分或屈伸而得之或平直而安定在陽部筋骨之側陷下為真在陰分郄膕之間動脈相應按五穴定一穴而必端取三經用一經而可正頭部與肩部詳分督脈與任脈異定明標探本論刺深刺淺之經住痛移疼取相交相貫之逕豈不聞臟腑病而求門海俞募之微經絡滯而求原別交會之道更窮四根三結依標本而刺無不痊但用八法五門分主客而針無不效八脈始終連八會本是紀綱十二經絡十二原是為樞要若一日刺六十六穴之法方見幽微一時取十二經之原始知要妙詳夫補瀉之法非呼吸而在手指速效之功要交正而識本經交經繆刺左有病而右畔取瀉絡遠針頭有病而腳上針巨刺與繆刺各異微針與妙刺相通觀部分而知經絡之虛實視浮沉而辨臟腑之寒溫且夫先令針耀而慮針損次藏口內而欲針溫目無外視手如握虎心無外慕如待貴人左手重而切按欲令氣散右手輕而徐入不痛之因空心恐怯直立側而多暈背目沉搯坐臥平而勿昏至推於十干十變定孔穴之開闔論其五行五臟察時日之旺衰伏如橫努應若發機陽交陰別而定血暈陰蹺陰維而下胎衣痹厥偏枯迎隨裨經絡接續漏崩帶下溫補使氣血依歸靜以久留停針候之必准者取照海治喉中之閉塞端的處用大鐘治心性之呆癡大抵疼痛實瀉癢麻虛補體重節痛而俞居心下痞滿而井主心脹咽痛針太衝而立除脾痛胃疼瀉公孫而立愈胸滿腹痛刺內關脅疼肋痛針飛虎筋攣骨痛而補魂門體熱勞嗽而瀉魄戶頭風頭痛刺申脈與金門眼癢眼疼瀉光明與地五瀉陰郄止盜汗並小兒骨蒸刺偏歷利小便兼大人水蠱中風環跳而宜刺虛損天樞而可取由是午前卯後太陰生而疾溫離左西南月死朔而速冷循捫彈努留吸母以堅長爪下伸提疾呼子而噓短動退空歇迎奪右而瀉涼推內進搓隨濟左而補暖慎之大凡危疾色脈不順而莫針寒熱風陰飢飽醉勞而切忌望不補而晦不瀉弦不奪而朔不濟精其心而求其法無灸艾而壞其肌正其理而求其源免投針而失其位避灸處而和四肢四十有九禁刺處而除六俞三十又二抑又聞高皇抱疾而未瘥李氏刺巨闕而得蘇太子暴死為屍厥越人針維會而復醒肩井曲池甄權刺臂痛而復射懸鐘環跳華佗刺躄足而立行秋夫刺腰俞而鬼免沉疴王纂針交俞而妖精立出刺肝俞與命門使瞽士視秋毫之末刺少陽與交別俾聾夫聽夏蚋之聲嗟夫去聖逾遠斯道漸墜或不得意而散其學或眩其能而犯禁忌庸愚智淺難契於玄言至道淵深得之者有幾偶述斯言不敢示諸明達者焉庶幾乎童蒙之心啟通玄賦必欲治病莫如用針巧運神機之妙工開聖理之深外取砭金能蠲邪而扶正中含水火善回陽而倒陰原夫絡別支殊經交錯綜或溝渠溪谷以歧異或山海丘陵而隙共斯流派以難揆在條綱而有統理繁而味縱補瀉以何功法捷而明自迎隨而得用且如行步難移太衝最奇人中除脊膂之強痛神門去心性之呆癡風傷項急始求於風府頭眩目暈要覓於風池耳閉須聽會而治也眼痛則合谷以推之胸結身黃取湧泉而即可腦昏目赤瀉攢竹以偏宜但見若兩肋之拘攣仗曲池而平掃治半身之不遂作環跳以長驅牙齒痛呂細堪治頭項強承漿可保太白宣導於氣衝陰陵開通於水道腹膨而脹奪內庭以休遲筋轉而疼瀉承山之在早大抵腳腕痛崑崙解愈股膝疼陰市能醫癇發顛狂兮憑後谿而療理瘧生寒熱兮仗間使以扶持期門罷胸滿血崩而可用勞宮退胃翻心痛以何疑考夫大敦去七疝之偏疼王公謂此三里卻五勞之羸瘦華老言斯固知腕骨祛黃然谷瀉腎行間治膝腫腰疼尺澤去肘疼筋緊目昏無見二間宜取鼻塞不聞迎香可引肩井除兩臂之難任攢竹療頭疼之不忍咳嗽寒痰列缺堪治眵䁾冷淚臨泣尤准完骨將腿痛以祛殘腎俞把腰疼而瀉盡以見越人治屍厥於維會隨手而蘇文伯瀉死胎於三陰交應針而隕聖人於是察麻與痛分實與虛實則自外而入也虛則自內而出之是故濟母以裨其不足奪子而平其有餘觀二十七之經絡一一明辨據四百四之疾症件件皆除故得夭枉都無躋斯民於壽域幾微已判彰往古之玄書抑又聞心胸病求掌後之大陵肩背患責肘前之三里冷痹腎俞取足陽明之土連臍腹痛瀉足少陰之水脊間心後者針中渚而立痊脅下肋邊者刺陽陵而即止頭項痛擬後谿以安然腰腳疼在委中而已矣夫用針之士於此理苟明者焉收祛邪之功而在乎捻指海兩脅痛少陽丘墟心痛少陰太谿湧泉足厥陰原穴腰痛崑崙及委中出血喘滿痰實口中如膠足少陰太谿嘔噦無痰手厥陰大陵熱無度不可止陷谷出血骨節疼痛實無所知三稜刺絕骨出血小腸疝氣足厥陰太衝血衄不止大小便血婦人血不足刺足太陰井喉閉手足少陽井並少商手足太陰井大煩熱不止晝夜無度刺十指間出血謂八關大刺陰頭中痛不可忍卒疝痛婦人陰中痛俱刺足厥陰井眼大眥痛刺手太陽井小眥痛刺少陰井骨熱不可治者板齒乾燥灸骨會大維接經手足經同經曰留瘦不移節而刺之使十二經無過絕假令十二經中是何經絡不通行當刺不通凝滯俱令氣過節無問其數以平為期如諸經俱虛補十二經如諸經俱實瀉十二經補當隨而濟之瀉當迎而奪之又補母亦各隨而濟之瀉子亦名迎而奪之又隨呼吸出納亦名迎隨也上大接經從陽引陰從陰引陽皆取十二經井穴並見中風門針灸條脈之所居深不見者刺之微內針而久留之以致其脈氣也脈淺者勿刺接絕其脈乃刺之無令精出獨出其邪氣耳病痛者陰也痛而以手按之不得者陰也深刺之癢者陽也淺刺之病在上者陽也在下者陰也病先起於陰者先治其陰而後治其陽病先起於陽者先治其陽而後治其陰春氣在毛夏氣在皮秋氣在分肉冬氣在筋骨此病各以其時為齊故刺肥人者秋冬之齊瘦人者春夏之齊難言春夏刺淺秋冬刺深者何謂也然春夏者陽氣在上人氣亦在上故當淺取之秋冬者陽氣在下人氣亦在下故當深取之春夏各致一陰秋冬各致一陽者何謂也然春夏溫必致一陰者初下針沉之至腎肝之部得氣引持之陰也秋冬寒必致一陽者初內針淺而浮之至心肺之部得氣推內之陽也是謂春夏必致一陰秋冬必致一陽七十難垣夫陰病在陽者是天外風寒之邪乘中而外入在人之背上腑俞臟俞是人之受天外寒邪亦有二說中於陽則流於經此病始於外寒終歸外熱故以治風寒之邪治其各臟之俞非止風寒而已六淫濕暑燥火皆五臟所受乃筋骨血脈受邪各有背上五臟俞以除之傷寒說從仲景中八風者有風論中暑者治在背上小腸腧中濕者治在胃腧中燥者治在大腸腧此皆六淫客邪有餘之病皆瀉其背之腑腧若病久傳變有虛有實各隨病之傳變補瀉不足只治在背府腧陽病在陰者病從陰引陽是水穀之寒熱感則害人六腑又曰飲食失節及勞役所傷陰火乘於坤土之中致穀氣榮氣清氣胃氣元氣不得上升滋於六腑之陽氣是五陽之氣先絕於外外者天也下流伏於坤土陰火之中皆先由喜怒悲憂恐為五賊所傷而後胃氣不行勞役飲食不節繼之則元氣乃傷當從胃腧合三里穴中推而揚之以伸元氣故曰從陰引陽若元氣愈不足治在腹上諸府之募穴若傳在五臟為九竅不通隨各竅之病治其各臟之募穴於腹故曰五臟不平乃六腑元氣閉塞之所生也又曰五臟不和九竅不通皆傷氣不足陰氣有餘故曰陽不勝其陰凡治腹之募皆為元氣不足從陰引陽勿誤也若錯補四末之俞錯瀉四末之俞皆非也錯瀉者差尤甚矣按岐伯所說只取穴於天上天上者人之背上五臟六腑之俞不當瀉而瀉豈有生者乎興言及此寒心徹骨若六淫客邪及上熱下寒筋骨皮肉血脈之病苟錯取穴於胃之合及諸腹之募者必危亦岐伯之謂下工可不慎哉刺虛實素曰刺法言有餘瀉之不足補之何謂有餘何謂不足岐伯對曰神有有餘有不足氣有有餘有不足血有有餘有不足形有有餘有不足志有有餘有不足夫心藏神肺藏氣肝藏血脾藏肉腎藏志而此成形志意通內連骨髓而成身形五臟五臟之道皆出於經隧以行血氣血氣不和百病乃變化而生是故守經隧焉神有餘則笑不休神不足則悲血氣未並五臟安定邪客於形灑淅起於毫毛未入於經絡也故命曰神之微神有餘則瀉其小絡之血出血勿之深斥斥推也小絡孫絡也針經曰經脈為里支而橫者為絡絡之別者為孫絡也無中其大經神氣乃平神不足者視其虛絡按而致之刺而利之無出其血無泄其氣以通其經神氣乃平帝曰刺微奈何曰按摩勿釋著針勿斥移氣於不足神氣乃得復氣有餘則喘咳上氣不足則息利少氣血氣未並五臟安定皮膚微病命曰白氣微泄氣有餘則瀉其經隧無傷其經無出其血無泄其氣不足則補其經隧無出其氣問曰刺微奈何對曰按摩勿釋出針視之曰我將深之適人必革精氣自伏邪氣散亂無所休息氣泄腠理真氣乃相得血有餘則怒不足則恐血氣未並五臟安定孫絡水溢則經有留血血有餘則瀉其盛經出其血不足則視其虛經內針其脈中久留而視脈大疾出其針無令血泄問曰刺留血奈何對曰視其血絡刺出其血毋令惡血得入於經以成其疾形有餘則腹脹涇溲不利不足則四肢不用血氣未並五臟安定肌肉蠕動命曰微風形有餘則瀉其陽經不足則補其陽絡問曰刺微奈何對曰取分肉間無中其經無傷其絡衛氣得復邪氣乃索志有餘則腹脹飧泄不足則厥血氣未並五臟安定骨節有動志有餘則瀉然筋血者不足則補其復溜然筋即然谷穴問曰刺未並奈何對曰即取之無中其經邪所乃能立虛問曰虛實之形不知其何以生對曰血氣已並陰陽相傾氣亂於衛血逆於經血氣離居一實一虛夫五臟之虛實皆生於血氣之離並耳有餘者血氣併入其募盛而實也不足者血氣離去其臟衰而虛也經氣未並五臟安定者五臟之血氣未併為實未離為虛者安定其所而陰陽均平久留者一邪初客之時故當即治若其初不治則漸並漸離而虛臟所離之血氣有並歸於實臟所以陰陽相傾而不均乎衛亂榮逆而三候不一實臟自實虛臟自虛而一實一虛也然所謂一盛一虛者不獨五臟也凡陰陽表裡上下經絡皆然也故病有陽盛陰虛陰盛陽虛者有表盛裡虛里盛表虛者有上盛下虛下盛上虛者有經滿絡虛絡滿經虛者所謂無實實虛虛損不足益有餘者海藏所謂上熱未除中寒復生之類皆治一實一虛之戒學者宜究心焉血並於陰氣並於陽故為驚狂血並於陽氣並於陰乃為炅中炅即熱也血並於上氣並於下心煩惋善怒血並於下氣並於上亂而善忘問曰血並於陰氣並於陽如是血氣離居何者為實何者為虛對曰血氣者喜溫而惡寒寒則泣不能流溫則消而去之是故氣之所併為血虛血之所併為氣虛間曰人之所有者血與氣耳今夫子乃言血併為虛氣併為虛是無實乎對曰有者為實無者為虛故氣並則無血血並則無氣今血與氣相失故為虛焉絡之與孫脈俱輸於經血與氣並則為實焉血之與氣並走於上則為大厥厥則暴死氣復反則生不反則死問曰實者何道從來虛者何道從去虛實之要願聞其故對曰夫陰與陽皆有俞會陽注於陰陰滿之外陰陽均平以充其形九候若一命曰平人夫邪之生也或生於陰或生於陽其生於陽者得之風雨寒暑其生於陰者得之飲食居處陰陽喜怒問曰風雨之傷人也奈何對曰風雨之傷人也先客於皮膚傳入於孫脈孫脈滿則傳入於絡脈絡脈滿則輸於大經脈血氣與邪並客於分腠之間其脈堅大故曰實實者外堅充滿不可按之按之則痛問曰寒濕之傷人也奈何對曰寒濕之中人也皮膚不收肌肉堅緊榮血泣衛氣去故曰虛虛者聶闢聶謂聶皺闢謂闢疊也氣不足按之則氣足以溫之故快然而不痛問曰陰之生實奈何對曰喜怒不節則陰氣上逆上逆則下虛下虛則陽氣走之故曰實矣問曰陰之生虛奈何對曰喜則氣下悲則氣消消則脈虛空因寒飲食寒氣充滿則血泣氣去故曰虛矣問曰陽虛則外寒陰虛則內熱陽盛則外熱陰盛則內寒予已聞之矣不知其所由然也對曰陽受氣於上焦以溫皮膚分肉之間今寒氣在外則上焦不通上焦不通則寒氣獨留於外故寒慄問曰陰虛生內熱奈何對曰有所勞倦形氣衰少穀氣不盛上焦不行下脘不通胃氣熱熱氣熏胸中故內熱問曰陽盛生外熱奈何對曰上焦不通利則皮膚緻密腠理閉塞玄府不通衛氣不得泄越故外熱問曰陰盛生內寒奈何對曰厥氣上逆寒氣積於胸中而不瀉不瀉則溫氣去寒獨留則血凝泣凝則脈不通其脈盛大以澀故中寒問曰陰與陽並血氣以並病形以成刺之奈何對曰刺之者取之經隧取血於營取氣於衛用形哉因四時多少高下問曰血氣以並病形以成陰陽相傾補瀉奈何對曰瀉實者氣盛乃內針針與氣俱內以開其門如利其戶針與氣俱出精氣不傷邪氣乃下外門不閉以出其疾搖大其道如利其路是謂大瀉必切而出大氣乃屈問曰補虛奈何對曰持針勿置以定其意候呼內針氣出針入針空四塞精無從去方實而疾出針氣入針出熱不得還閉塞其門邪氣布散精氣乃得存動氣候時近氣不失遠氣乃來是謂追之調經論素帝曰不足者補之奈何岐伯曰必先捫而循之切而散之推而按之彈而怒之抓而下之通而取之外引其門以閉其神呼盡內針靜以久留以氣至為故如待所貴不知日暮其氣以至適而自護候吸引針氣不得出各在其處推闔其門令神氣存大氣留止故命曰補吸則內針無令氣忤靜以久留無令邪布吸則轉針以得氣故候呼引針針盡乃去大氣皆出故命曰瀉離合真邪論補法左手掐穴右手置針於穴上令病人咳嗽一聲捻針入透於腠理後令病人呼氣一口隨呼針至分寸待針沉緊時轉針頭向病所以手循捫經絡覺氣至卻因針頭向下覺針沉緊令病人吸氣一口急出其針急閉其穴虛羸氣弱癢麻者補之瀉法先以左手掐穴右手置針於穴上令病人咳嗽一聲捻針入於腠理復令病人吸氣一口隨吸氣入針至分寸覺針沉緊轉針頭向病所若覺氣退便轉針頭向下以手循取經絡覺針沉悶令病人吹氣一口徐出其針不閉其穴命之曰瀉豐肥堅硬疼痛者瀉之上以病人氣之呼吸醫人針之出納分補瀉令病人吸氣而入針氣與針同入為補令呼氣出針針與氣同出為瀉呼氣氣出而入針為瀉吸氣氣入而出針為補也難何謂補瀉當補之時何所取氣當瀉之時何所置氣然當補之時從衛取氣當瀉之時從榮置氣其陽氣不足陰氣有餘當先補其陽而後瀉其陰陰氣不足陽氣有餘當先補其陰而後瀉其陽榮衛通行此其要也七十六難針有補瀉何謂也然補瀉之法非必呼吸出內針也然知其為針者信其左不知為針者信其右當刺之時必先以左手壓按其所針榮腧之處彈而努之抓而下之其氣之來如動脈之狀順針而刺之得氣因推而內之是謂補動而伸之是謂瀉不得氣乃與男外女內不得氣是謂十死不治也七十難上以針之推內動伸分補瀉也從衛取氣者謂淺內針待衛氣至漸漸推內進至深也從榮置氣者謂深內針待榮氣至卻漸動伸退至淺也蓋補者針入腠理得氣後漸漸作三次推內進至分寸經所謂徐內疾出世所謂一退三飛熱氣榮榮者是也瀉者宜針入分寸得氣後漸漸作三次動伸退出腠理經所謂疾內徐出世所謂一飛三退冷氣沉沉者是也經言能知迎隨之氣可令調之調氣之方必在陰陽何謂也然所謂迎隨者知榮衛之流行經脈之往來也隨其逆順而取之故曰迎隨調氣必在陰陽者知其內外表里隨其陰陽而調之故曰調氣之方必在陰陽七十二難上以迎隨分補瀉也然迎隨之法有三此法以針頭迎隨經脈之往來一也又瀉子為迎而奪之補母為隨而濟之二也又隨前法呼吸出納針亦名迎隨三也又針頭之隨者調榮衛之流行經脈之往來手之三陰從胸走手手之三陽從手走頭足之三陽從頭走足足之三陰從足走腹也迎者以針頭斜迎三陰三陽之來處針去也隨者以針頭斜隨三陰三陽之往處針去也夫行針者當刺之時口溫針暖先以左手揣按其所針滎俞之氣彈而努之抓而下之捫而循之通而取之隨病人咳嗽一聲右手持針而刺之春夏二十四息秋冬三十六息徐出徐入氣來如動脈之狀補者隨經脈推而內之左手閉針孔徐出針而疾按之瀉者迎經脈動而伸之左手閉針孔疾出針而徐按之隨而濟之是謂補迎而奪之是謂瀉上合迎隨推內動靜二法言補瀉也靈補須一方實深取之稀按其痏以極出其邪氣一方虛淺刺之以養其脈疾按其痏毋使邪氣得入脈實者深刺之以泄其氣脈虛者淺刺之使精氣無得出以養其脈獨出其邪氣終始篇上以淺深分補瀉淺為補深為瀉也竇凡補瀉非必呼吸出內而在乎手指何謂也故動搖進退搓盤彈捻指循捫攝按抓切者是也動者如氣不行將針伸提而已退者為補瀉欲出針時各先退一頭許然後卻留針方可出之此謂之退也搓者凡令病人覺熱外向臥針似搓線之狀勿轉太緊治寒向里臥依前轉法以為搓也進者凡不得氣男外女內者及春夏秋冬各有進退之理此謂之進也盤者為如針腹部於穴內輕盤搖而已此謂之盤也搖者凡瀉時欲出針必須動搖而出者是也彈者凡補時用大指甲輕彈針使氣疾行如瀉不可用也捻者以手捻針也務要記左右左為外右為內也循者凡下針於所部分經絡之處用手上下循之使氣血往來經云推之則行引之則止捫者凡補者出針時用手捫閉其穴是也攝者下針時如氣澀滯隨經絡上用大指甲上下切其氣血自得通行也按者以手按針無得進退如按切之狀也抓者凡下針用手指作力置針有準也切者凡欲下針必先用大指甲左右於穴切之令氣血宣散然後下針是不傷榮衛故也問穴各有兩如補瀉只刺病所耶兩穴俱刺耶曰不然隨病左右而補瀉之左則左補右則右補問針經云灸幾壯針訖而後灸何也曰針則針灸則灸若針而弗灸若灸而弗針難言有見如入有見如出者何謂也曰謂左手見氣來至乃內針針入見氣盡乃出針是謂有見加入有見如出也王注謂此法取有其經者未然見八十難靈所謂氣至而有效者瀉則益虛虛者脈大如其故而不堅也堅如其故者適雖言故病未去也補則益實實者脈大如其故而益堅也大如其故而不堅者適雖言快病未去也故補則實瀉則虛痛雖不隨針病必衰去終始篇素刺虛者須其實刺實者須其虛針解云刺實須其虛者為針陰氣隆至針下寒乃去針也刺虛須其實者為針陽氣隆至針下熱乃去針也王注云要以氣至而有效也靈三脈動於足大指之間必審其實虛虛而瀉之是謂重虛重虛者病益甚凡刺此者以指按之脈動而實且疾者疾瀉之虛而徐者則補之反此者病益甚其動也陽明在上衝陽脈也厥陰在中太衝脈也少陰在下太谿脈也難言東方實西方虛瀉南方補北方何謂也然金木水火土當更相平東方木也西方金也木欲實金當平之火欲實水當平之土欲實木當平之金欲實火當平之水欲實土當平之東方者肝也則知肝實西方者肺也則知肺虛瀉南方火補北方水南方火火者木之子也北方水水者木之母也水勝火子能令母實母能令子虛故瀉火補水欲令金不得平木也經曰不能治其虛何問其餘此之謂也七十五難金不得平木不字衍文素上實下虛切而從之索其經絡脈刺出其血以見通靈一經上實下虛而不通者此必有橫絡盛加於大經令之不通視而瀉之此所謂解結也邪之所在皆為不足故上氣不足胸為之不滿耳為之苦鳴頭為之苦傾目為之瞑中氣不足溲便為之變腸為之苦鳴下氣不足則乃為痿厥心俯補足外踝下留之上氣不足推而揚之下氣不足積而從之陰陽皆虛火自當之甲內傷不足三陽絡主之靈陰陽不相移虛實不相傾取之其經終始篇難言虛者補之實者瀉之不實不虛以經取之何謂也曰虛者補其母實者瀉其子當先補之然後瀉之不實不虛以經取之者是正經自生病不中他邪也當自取其經故言以經取之也六十九難上自篇首分陰陽臟腑虛實而施補瀉法者皆謂陰陽相移虛實相傾而血氣所離之經為虛所並之經為實故一實一虛而用針補虛瀉實矣若陰陽不相移虛實不相傾則血氣未離並無虛經無實經但取本經自病不於他經補瀉也靈帝曰經脈十二者別為五行分為四時何失而亂何得而治岐伯曰五行有序四時有分相順則治相逆則亂帝曰何謂相順對曰經脈十二者以應十二月十二月者分為四時四時者秋冬春夏其氣各異榮衛相隨陰陽已和清濁不相干如是則順之而治帝曰何謂逆而亂對曰清氣在陰濁氣在陽榮氣順脈衛氣逆行清濁相干亂於胸中是為大悗故氣亂於心則煩心密嘿俯首靜伏亂於肺則俯仰喘喝接手以呼亂於腸胃則為霍亂亂於臂脛則為四厥亂於頭則為厥逆頭重眩僕帝曰五亂者刺之有道乎岐伯曰氣在於心者取之手少陰心主之輸氣在於肺者取之手太陰滎足少陰輸氣在於腸胃者取之足太陰陽明不下者取之三里氣在於頭者取之天柱大抒不知取足太陽滎輸氣在於臂足取之先去血脈後取其陽明少陽之滎輸帝曰補瀉奈何對曰徐入徐出謂之導氣補瀉無形謂之同精是非有餘不足也亂氣之相逆也五亂篇靈邪在肝則兩脅中痛寒中惡血在內行善掣節時腳腫取之行間以引脅下補三里以溫胃中取血脈以散惡血取耳間青脈以去其掣素肝病者兩脅下痛引少腹令人善怒虛則目䀮䀮無見耳無所聞善恐如人將捕之取其經厥陰與少陽氣逆則頭痛耳聾不聰頰腫取血者脅者肝之野怒者肝之用肝實則氣並其經故脅痛靈邪在心則病心痛喜悲時眩僕視有餘不足而調之其輸也素心病者胸中痛脅支痛脅下痛膺背肩甲間痛兩臂內痛虛則胸腹大脅下與腰相引而痛取其經少陰太陽舌下血者其變病刺郄中血者胸脅者心之野背肩胸者心之府小腸經所過心實故氣並其經也靈邪在脾胃則病肌肉痛陽氣有餘陰氣不足則熱中善飢陽氣不足陰氣有餘則寒中腸鳴腹痛陰陽俱有餘若俱不足則有熱有寒皆調於三里素脾病者身重善飢內痿足不收行善瘈腳下痛虛則腹滿腸鳴飧泄食不化取其經太陰陽明少陰血者靈邪在肺則病皮膚痛寒熱上氣喘汗出咳動肩背取之膺中外俞背三節五臟之傍以手疾按之快然乃刺之取之缺盆中以越之素肺病者喘咳逆氣肩背痛汗出尻陰股膝髀腨胻足皆痛虛則少氣不能報息耳聾嗌乾取其經太陰足太陽之外厥陰內血者靈邪在腎則病骨痛陰痹陰痹者按之而不得腹脹腰痛大便難肩背脛項痛時眩取之湧泉崑崙視有血者盡取之素腎病者腹大脛腫喘咳身重寢汗出憎風虛則胸中痛大腹小腹痛清厥意不樂取其經少陰太陽血者以上靈出五邪篇素出藏氣法時篇靈大腸病者腸中切痛而鳴濯濯冬日重感於寒即泄當臍而痛不能久立與胃同候取巨虛上廉邪氣臟腑病形篇腹中腸鳴氣上衝胸喘不能久立邪在大腸刺盲之原巨虛上廉三里四時氣篇胃病者腹䐜脹胃脘當心而痛上支兩脅膈噎不通飲食不下取之三里同上邪氣篇飲食不下膈塞不通邪在胃脘在上脘則刺抑而下在下脘則散而去之同上四時篇小腸病者小腹痛腰脊控睪而痛時窘之後當耳前熱若寒甚若獨肩上熱甚及手小指次指之間熱若脈陷者此其候也手太陽病也取之巨虛下廉同上邪氣篇小腹控睪引腰脊上衝心邪在小腸者連睪系屬於脊貫肝肺絡心系氣盛則厥逆上衝腸胃熏肝散於肓結於臍故取之肓原以散之刺太陰以予之取厥陰以下之取巨虛下廉以去之按其所過之經而調之同上四時篇膀胱病者小腹偏腫而痛以手按之即欲小便而不得肩上熱若脈陷及足小指外廉及脛踝後皆熱若脈陷取委中央同上邪氣篇三焦病者腹氣滿小腹尤堅不得小便窘急溢則水留即為脹候在足太陽之外大絡大絡在太陽少陽之間亦見於脈取委陽小腹痛腫不得小便邪在三焦約取之太陽大絡視其脈絡與厥陰小絡結而血者腫上及胃脘取三里同上四時篇膽病者善太息口苦嘔宿汁心下澹澹恐人將捕之嗌中吤吤然數唾在足少陽之本末亦視其脈之陷下者灸之其寒熱者取陽陵泉同上邪氣篇善嘔嘔有苦長太息心中澹澹恐人將捕之邪在膽逆在胃膽液泄則口苦胃氣逆則嘔苦故曰嘔膽取三里以下胃氣逆則刺少陽血絡以閉膽逆卻調其虛實以去其邪同上四時篇靈寸口主中人迎主外兩者相應俱往俱來若引繩大小齊等春夏人迎微大秋冬寸口微大如是者名曰平人人迎大一倍於寸口病在足少陽一倍而躁病在手少陽人迎二倍病在足太陽二倍而躁病在手太陽人迎三倍病在足陽明三倍而躁病在手陽明盛則為熱虛則為寒緊則為痛痹代則乍甚乍間盛則瀉之虛則補之緊痛則取之分肉代則取血絡且飲藥陷下則灸之不盛不虛以經取之名曰經刺人迎四倍且大且數者名曰溢陽溢陽為外格死不治必審按其本末察其寒熱以驗其臟腑之病禁服篇人迎一盛瀉足少陽而補足厥陰二瀉一補日一取之必切而驗之疏取之上氣和乃止人迎二盛瀉足太陽而補足少陰二瀉一補二日一取之必切而驗之疏取之上氣和乃止人迎三盛瀉足陽明而補足太陰二瀉一補日二取之必切而驗之疏取之上氣和乃止終始篇靈寸口大於人迎一倍病在足厥陰一倍而躁在手心主寸口二倍病在足少陰二倍而躁在手少陰寸口三倍病在足太陰三倍而躁在手太陰盛則脹滿寒中食不化虛則熱中出糜少氣溺色變緊則痛痹代則乍痛乍止盛則瀉之虛則補之緊則先刺而後灸之代則取血絡而後調之陷下則徒灸之陷下者脈血結於中中有著血血寒故宜灸之不盛不虛以經取之寸口四倍者名曰內關內關者且大且數死不治必審察其本末之寒溫以驗其臟腑之病通其滎輸乃可傳於大數大數曰盛則徒瀉之虛則徒補之緊則灸刺且飲藥陷下則徒灸之不盛不虛以經取之所謂經治者飲藥亦曰刺灸脈急則引脈大以弱則欲安靜用力無勞也禁服篇脈口一盛瀉足厥陰而補足少陽二補一瀉日一取之必切而驗之疏而取之上氣和而止脈口二盛瀉足少陰而補足太陽二補一瀉二日一取之必切而驗之疏而取之上氣和乃止脈口三盛瀉足太陰而補足陽明二補一瀉日二取之必切而驗之疏而取之上氣和乃止所以日二取之者太陽主胃大富於穀氣故可日二取之也終始篇人迎與脈口俱盛三倍以上命曰陰陽俱溢如是者不開則血脈閉塞氣無所行流淫於中五臟內傷如此者因而灸之則變易為他病矣同上肺手太陰之脈是動則病肺脹滿膨膨而喘咳缺盆中痛甚則交兩手而瞀此為臂厥是主肺所生病者咳嗽上氣喘渴煩心胸滿臑臂內前廉痛厥掌中熱氣盛有餘則肩背痛風寒汗出中風小便數而欠氣虛則肩背痛寒少氣不足以息為此諸病盛則瀉之虛則補之熱則疾之寒則留之陷下則灸之不盛不虛以經取之盛者寸口大三倍於人迎虛者則寸口反小於人迎也脾足太陰之脈是動則病舌本強食則嘔胃脘痛腹脹善噫得後與氣則快然如衰身體皆重是主脾所生病者舌本痛體不能動搖食不下煩心心下急痛寒瘧溏瘕泄水閉黃疸不能臥強立股膝內腫厥足大指不用為此諸病盛則瀉之虛則補之熱則疾之寒則留之陷下則灸之不盛不虛以經取之盛者寸口大三倍於人迎虛者寸口反小於人迎也大腸手陽明之脈是動則病齒痛䪼腫是主津液所生病者目黃口乾鼽衄喉痹肩前臑痛大指次指不用氣有餘則當脈所過者熱腫虛則寒慄不復為此諸病盛則瀉之虛則補之熱則疾之寒則留之陷下則灸之不盛不虛以經取之盛者人迎大三倍於寸口虛者人迎反小於寸口也胃足陽明之脈是動則病洒洒振寒善呻數欠顏黑病至則惡人與火聞木音則惕然而驚心動欲獨閉戶塞牖而處甚則欲上高而歌棄衣而走賁響腹脹是為骭厥是主血所生病者狂瘧溫淫汗出鼽衄口喎唇胗頸腫喉痹大腹水腫膝臏腫痛循膺乳氣街股伏兔骭外廉足跗上皆痛中指不用氣盛則身以前皆熱其有餘於胃則消穀善飢溺色黃氣不足則身以前皆寒慄胃中寒則脹滿為此諸病盛則瀉之虛則補之熱則疾之寒則留之陷下則灸之不盛不虛以經取之盛者人迎大三倍於寸口虛者人迎反小於寸口也心手少陰之脈是動則病嗌乾心痛渴而欲飲是為臂厥是主心所生病者目黃脅痛臑臂內後廉痛厥掌中熱痛為此諸病盛則瀉之虛則補之熱則疾之寒則留之陷下則灸之不盛不虛以經取之盛者寸口大再倍於人迎虛者寸口反小於人迎也腎足少陰之脈是動則病飢不欲食面如漆柴咳唾則有血喝喝而喘坐而欲起目䀮䀮如無所見心如懸苦飢狀氣不足則善恐心惕惕如人將捕之是為骨厥是主腎所生病者口熱舌乾咽腫上氣嗌乾及痛煩心心痛黃疸腸澼脊酸股內後廉痛痿厥嗜臥足下熱而痛為此諸病盛則瀉之虛則補之熱則疾之寒則留之陷下則灸之不盛不虛以經取之灸則強食生肉緩帶被髮大杖重履而步盛者寸口大再倍於人迎虛者寸口反小於人迎也小腸手太陽之脈是動則病嗌痛頷腫不可以顧肩似拔臑似折是主液所生病者耳聾目黃頰腫頸頷肩臑肘臂外後廉痛為此諸病盛則瀉之虛則補之熱則疾之寒則留之陷下則灸之不盛不虛以經取之盛者人迎大再倍於寸口虛者人迎反小於寸口也膀胱足太陽之脈是動則病沖頭痛目似脫項如拔脊痛腰似折髀不可以曲膕如結踹如裂是為踝厥是主筋所生病者痔瘧狂顛疾頭囟項痛目黃淚出鼽衄項背腰尻膕腨腳皆痛小指不用為此諸病盛則瀉之虛則補之熱則疾之寒則留之陷下則灸之不盛不虛以經取之盛者人迎大再倍於寸口虛者人迎反小於寸口也心主手厥陰心包絡之脈是動則病手心熱臂肘攣急腋腫甚則胸脅支滿心中憺憺大動面赤目黃喜笑不休是主脈所生病者煩心心痛掌中熱為此諸病盛則瀉之虛則補之熱則疾之寒則留之陷下則灸之不盛不虛以經取之盛者寸口大一倍於人迎虛者寸口反小於人迎也肝足厥陰之脈是動則病腰痛不可以俯仰丈夫㿉疝婦人少腹腫甚則嗌乾面塵脫色是主肝所生病者胸滿嘔逆飧泄狐疝遺溺閉癃為此諸病盛則瀉之虛則補之熱則疾之寒則留之陷下則灸之不盛不虛以經取之盛者寸口大一倍於人迎虛者寸口反小於人迎也三焦手少陽之脈是動則病耳聾渾渾焞焞嗌腫喉痹是主氣所生病者汗出目銳眥痛頰痛耳後肩臑肘臂外皆痛小指次指不為用為此諸病盛則瀉之虛則補之熱則疾之寒則留之陷下則灸之不盛不虛以經取之盛者人迎大一倍於寸口虛者人迎反小於寸口也膽足少陽之脈是動則病口苦善太息心脅痛不能轉側甚則面微有塵體無膏澤足外反熱是為陽厥是主骨所生病者頭痛頷痛目銳眥痛缺盆中腫痛腋下腫馬刀挾癭汗出振寒瘧胸脅肋髀膝外至脛絕骨外踝前及諸節皆痛小指次指不用為此諸病盛則瀉之虛則補之熱則疾之寒則留之陷下則灸之不盛不虛以經取之盛者人迎大一倍於寸口虛者人迎反小於寸口也俱見經脈篇難言脈有是動有所生病一脈輒變為二病者何也然經言是動者氣也所生病者血也邪在氣氣為是動邪在血血為所生病氣主呴之血主濡之氣留而不行者為氣先病也血滯而不濡者為血後病也故先為是動後所生也二十二難上十二經為病通表裡而言若其病或見於表或為疼痛或為癰癤者但當於其所痛之分野求其經脈屬何經而針灸之也另立經脈分野圖於左頭部巔足太陽厥陰督脈頭角直耳上中是少陽中行前直鼻上巔後直鬢中上巔督脈第二行足太陽一寸五分各開兩傍為頭第三行第三行足少陽面部額足少陽陽明鼻手陽明太陽足陽明督脈人中督脈手足陽明唇足陽明唇內足厥陰承漿足陽明任脈上齒足陽明下齒手陽明舌足太陰少陰目內眥手足陽明手足太陽目銳眥手太陽手足少陽眉至額直鼻而上督脈直目內眥而上足太陽直目瞳子而上足少陽直銳眥而上手足少陽頰直目內眥而下足陽明直目瞳子而下足陽明頰車足少陽陽明耳手足少陽手太陽目系手少陰足太陽頸項部項中間拔項大筋中足太陽當完骨下手少陽項大筋之前耳之後也當耳下足少陽當曲頰下手太陽曲頰前一寸手陽明挾喉兩旁動脈足太陽陽明缺盆中任脈咽手太陰少陰足太陰喉嚨足少陰陽明喉嚨後足厥陰肩前廉手陽明後廉手太陽上廉手足少陽背部中行督脈第二行足太陽第三行足太陽膺輸部中行任脈第二行足少陰第三行足陽明第四行足太陰腹部中間行任脈第二行足少陰第三行足陽明第四行足太陰腋下中間手厥陰前手太陽後手太陰脅部腋直下髀樞足少陽臑部自肩至肘曰臑前廉手陽明後廉手太陽外廉手太陽內廉手少陰內前廉手太陰內後廉手少陰臂部上廉手陽明下廉手太陰外廉手少陽內廉手厥陰內上廉手太陰內下廉手少陰股脛部前廉足陽明後廉足太陽外廉足少陽內廉足厥陰內前廉足太陰靈手太陰之別名曰列缺起於脘上分間並太陰之經直入掌中散入於魚際其病實則手銳掌熱虛則欠㰦小便遺數取之去脘半寸別走陽明也足太陰之別名曰公孫去本節之後一寸別走陽明其別者入絡腸胃厥氣上逆則霍亂實則腸中切痛虛則鼓脹取之所別也手少陰之別名曰通里去腕一寸半別而上行循經入於心中系舌本屬目系其實則支膈虛則不能言取之掌後一寸別走太陽也足少陰之別名曰大鐘當踝後繞跟別走太陽其別者並經上走於心包下外貫腰脊其病氣逆則煩悶實則閉癃虛則腰痛取之所別也手心主之別名曰內關去腕二寸出於兩筋之間循經以上繫於心包絡心系實則心痛虛則為頭項強取之兩筋間也足厥陰之別名曰蠡溝去內踝五寸別走少陽其別者徑脛上睪結於莖其病氣逆則睪腫卒疝實則挺長虛則暴癢取之所別也手太陽之別名曰支正上脘五寸內注少陰其別者上走肘絡肩髃實則節弛肘廢虛則生肬小者如指痂疥取之所別也足太陽之別名曰飛陽去踝七寸別走少陰實則鼽窒頭背痛虛則鼽衄取之所別也手陽明之別名曰偏歷去腕三寸別入太陰其別者上循臂乘肩髃上曲頰偏齒其別者入耳合於宗脈實則齲聾虛則齒寒痹隔取之所別也足陽明之別名曰豐隆去踝八寸別走太陰其別者循脛骨外廉上絡頭項合諸經之氣下絡喉嗌其病氣逆則喉痹瘁喑實則狂顛虛則足不收脛枯取之所別也手少陽之別名曰外關去腕二寸外繞臂注胸中合心主病實則肘攣虛則不收取之所別也足少陽之別名曰光明去踝五寸別走厥陰下絡足跗實則厥虛則痿躄坐不能起取之所別也任脈之別名曰尾翳下鳩尾散於腹實則腹皮痛虛則癢搔取之所別也督脈之別名曰長強挾膂上項散頭上下當肩胛左右別走太陽入貫膂實則項強虛則頭重取之所別也脾之大絡名曰大包出淵腋下三寸布胸脅實則身盡痛虛則百節盡皆縱此脈若羅絡之血者皆取之脾之大絡脈也凡此十五絡者實則必見虛則必下視之不見求之上下人經不同絡脈異所別也俱出經脈篇素黃帝曰余聞繆刺未得其意敢問何也岐伯對曰夫邪之客於形也必先舍於皮毛留而不去入舍於孫脈留而不去入舍於絡脈留而不去入舍於經脈內連五臟散於腸胃陰陽俱感五臟乃傷此邪之從皮毛而入極於五臟之次也如此則治其經焉今邪客於皮毛入舍於孫絡留而不去閉塞不通不得入於經流溢大絡而生奇病也夫邪客大絡者左注右右注左上下左右與經相干而布於四末其氣無常處不入於經俞命曰繆刺帝曰願聞繆刺以左取右以右取左奈何其與巨刺何以別之岐伯曰邪客於經左盛則右病右盛則左病亦有移易者左痛未已而右脈先病如此者必巨刺之必中其經非絡脈也故絡病者其痛與經脈繆處故命曰繆刺調經篇云身形有痛九候莫病則繆刺之痛在於左而右脈病者巨刺之蓋身形有痛邪在絡脈故繆刺絡脈於井穴也病在於左而右脈病則知邪偏入半邊經服而半邊經脈偏盛並引其無病者半邊亦痛故宜刺經脈於左邊偏盛者之滎俞也帝曰願聞繆刺奈何取之何如岐伯曰邪客於足少陰之絡令人卒心痛暴脹胸脅支滿無積者刺然骨之前出血如食頃而已不已左取右右取左病新發者取五日已邪客於手少陽之絡令人喉痹舌卷口乾心煩臂外廉痛手不及頭刺手中指次指爪甲上去端如韭葉各一痏壯者立已老者有頃已左取右右取左此新病數日已邪客於足厥陰之絡令人卒疝暴痛刺足大指爪甲上與肉交者各一痏男子立已女子有頃已左取右右取左邪客於足太陽之絡令人頭項肩痛刺足大指爪甲上與肉交者一痏立已不已刺外踝下三痏左取右右取左如食頃已邪客於手陽明之絡令人氣滿胸中喘息而支胠胸中熱刺手大指次指爪甲上去端如韭葉各一痏左取右右取左如食頃已邪客於掌臂之間不可得屈刺其踝後先以指按之痛乃刺之以月死生為數月生一日一痏二日二痏十五日十五痏十六日十四痏邪客於足陽蹺之脈令人目痛從內眥始刺外踝之下半寸所各二痏左取右右取左如行十里頃而已人有所墮墜惡血留內腹中滿脹不得前後先飲利藥此上傷厥陰之脈下傷少陰之絡刺足內踝之下然骨之前血脈出血刺足跗上動脈不已刺三毛上各一痏見血立已左刺右右刺左邪客於手陽明之絡令人耳聾時不聞音刺手大指次指爪甲上去端如韭葉各一痏立聞不已刺中指爪甲上與肉交者立聞其不時聞者不可刺也耳中生風者亦刺之如此數左刺右右刺左凡痹往來行無常處者在分肉間痛而刺之以月死生為數用針者隨氣盛衰以為痏數針過其日數則脫氣不及日數則氣不瀉左刺右右刺左病已止不已復刺之如法月生一日一痏二日二痏漸多之十五日十五痏十六日十四痏漸少之邪客於足陽明之絡令人鼽衄上齒寒刺足中指次指爪甲上與肉交者各一痏左刺右右刺左邪客於足少陽之絡令人脅痛不得息咳而汗出刺足小指次指爪甲上與肉交者各一痏不得息立已汗出立止咳者溫衣飲食一日已左刺右右刺左病立已不已復刺如法邪客於足少陰之絡令人嗌痛不可內食無故善怒氣上走賁上刺足下中央之脈各三痏凡六刺立已左刺右右刺左嗌中腫不能內唾時不能出唾者刺然骨之前出血立已左刺右右刺左邪客於足太陰之絡令人腰痛引少腹控䏚不可以仰息刺腰尻之解兩胛之上是腰俞以月死生為痏數髮針立已左刺右右刺左邪客於足太陽之絡令人拘攣背急引脅而痛刺之從項始數脊椎挾脊疾按之應手如痛刺之傍三痏立已邪客於足少陽之絡令人留於樞中痛髀不可舉刺樞中以毫針寒則久留針以月死生為數立已治諸經刺之所過者不病則繆刺之耳聾刺手陽明不已刺其通脈出耳前者齒齲刺手陽明不已刺其脈入齒中者立已邪客於五臟之間其病也脈引而痛時來時止視其病繆刺之於手足爪甲上視其脈出其血間日一刺一刺不已五刺已繆傳引上齒齒唇寒痛視其手背脈血者出之足陽明中指爪甲上一痏手大指次指爪甲上各一痏立已左取右右取左邪客於手足少陰太陰足陽明之絡此五絡皆會於耳中上絡左角五絡俱竭令人身脈皆動而形無知也其狀若屍或曰屍厥刺其足大指內側爪甲上去端如韭葉後刺足心後刺足中指爪甲上各一痏後刺手大指內側去端如韭葉後刺手心主少陰銳骨之端各一痏立已不已以竹管吹其兩耳鬄其左角之發方一寸燔治飲以美酒不能飲者灌之立已凡刺之數先視其經脈切而從之審其虛實而調之不調者經刺之有痛而經不病者繆刺之因視其皮部有血絡者盡取之此繆刺之數也俱出繆刺論靈黃帝曰願聞奇邪而不在經者岐伯曰血絡是也帝曰刺血絡而僕者何也血出而射者何也血少黑而濁者何也血出清而半為汁者何也髮針而腫者何也血出若多若少而面色蒼蒼者何也髮針而面色不變而煩悗者何也多出血而不動搖者何也願聞其故岐伯曰脈氣盛而血虛者刺之則脫氣脫氣則僕血氣俱盛而陰氣多者其血滑刺之則射陽氣蓄積久留而不瀉者其血黑以濁故不能射新飲而液滲於絡而未和於血也故血出而汁別焉其不新飲者身中有水久則為腫陰氣積於陽其氣因於絡故刺之血未出而氣先行故腫陰陽之氣其新相得而未和合因而瀉之則陰陽俱脫表裡相離故脫色而蒼蒼然刺之血出多色不變而煩悗者刺絡而虛經經虛之屬於陰者陰脫故煩悶陰陽相得而合為痹者此為內溢於經外注於絡如是者陰陽俱有餘雖多出血而弗能虛也帝曰相之奈何岐伯曰血脈者盛堅橫以赤上下無常處小者如針大者如筋則其瀉之萬全也故無失數矣失數而反各如其度黃帝曰針入而肉著者何也岐伯曰熱氣因於針則針熱熱則肉著於針故堅焉血絡論經脈篇云諸刺絡脈者必取其結上甚血者雖無結急取之以瀉其邪留之發為痹也又云其小而短者少氣甚者瀉之則悶悶甚則僕不得言悶則急坐之也上刺臟腑經絡四病各不同十五絡病至淺在表也十二經病次之六腑病又次之五臟病至深在裡也故治法有難易焉至於絡又各不同十五絡之絡乃陰經別走陽經陽經別走陰經而橫貫兩經之間所謂橫者為絡與經相隨上下者也繆刺之絡乃病邪流溢大絡不得入貫經俞而其痛與經脈繆也乃絡病經不病者也血絡之絡及皮膚所見或赤或青或黑之絡而小者如針大者如筋也以淺深言之血絡至淺繆刺者次之十五絡近里而貫經俞也胃者水穀之海其輸上在氣衝下在三里水穀之海有餘則腹滿不足則飢不受穀食衝脈者為十二經之海其輸上在於大杼下出於巨虛之上下廉血海有餘則常想其身大怫然不知其所病血海不足亦常想其身小狹然不知其所病膻中者氣之海其輸上在於柱骨之上下前在於人迎氣海有餘者氣滿胸中悗息面赤氣海不足則氣少不足以言腦為髓之海其輸上在於其蓋下在風府髓海有餘則輕勁多力自過其度髓海不足則腦轉耳鳴脛酸眩冒目無所見懈怠安臥審守其輸而調虛實刺寒熱入治寒熱法
