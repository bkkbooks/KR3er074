body:
  text: 卷之三十三傷寒部勞復門大病瘥後勞復者枳實梔子豉湯主之枳實四枚炒梔子十四枚豉一兩上三味以清漿水二盞空煮退一盞內枳實梔子煮取八分下豉更煮五六沸去渣溫服覆令取微汗若有宿食內大黃量虛實加減傷寒瘥後更發熱者小柴胡湯主之脈浮者以汗解之沉實者以下解之大病瘥後從腰以下有水氣者牡蠣澤瀉散主之牡蠣熬澤瀉蜀漆洗去腥商陸熬海藻洗栝蔞根葶藶各等分上為散水服方寸匕小便利止後服日二大病瘥後喜睡久不了了者胃上有寒當以丸藥溫之宜理中丸傷寒解後虛羸少氣氣逆欲吐者竹葉石膏湯主之淡竹葉二把石膏半斤捶碎半夏三兩人參三兩麥門冬四兩去心甘草一兩炙嘔者加生薑一兩半上㕮咀每服五錢水一盞半入粳米百餘粒煮取八分米熟湯成去渣溫服風家表解而不了了者十二日愈勞復續法海大抵勞者動也動非一種有內外血氣之異焉若勞乎氣則無力與精神者法宜微舉之若勞乎血與筋骨者以四物之類補之若勞在脾內為中州調中可已此為有形病也但見外證則謂之復病非為勞也如再感風寒是已本記有人患傷寒得汗數日忽身熱自汗脈弦數心不得寧真勞復也予診之曰勞心之所致神之所舍未復其初而又勞傷其神榮衛失度當補其子益其脾解其勞庶幾得愈授以補脾湯佐以小柴胡湯解之或者難曰虛則補其母今補其子何也予曰子不知虛勞之異乎難經曰虛則補其母實則瀉其子此虛當補母人所共知也千金曰心勞甚者補脾氣以益之脾王則感之於心矣此勞則當補子人所未聞也蓋母生我者也子繼我而助我者也方治其虛則補其生我者與錦囊所謂本骸得氣遺體受蔭同義方治其勞則補其助我者與荀子言未有子富而父貧同義此治虛與勞所以異也補脾湯治傷寒得汗瘥後脾胃傷冷物胸膈不快尋常血氣不和人參白朮甘草橘皮去白皮青皮去白皮乾薑各等分上為末每服三錢水一盞煎數沸熱服入鹽點亦得海治勞復麥門冬湯氣欲絕者用之有效能起死回生麥門冬一兩甘草二兩炙粳米十合上麥門冬去心為細末水二盞煎粳米令熟去米約湯一小盞半入藥五錢匕棗二枚去核新竹葉一十五片同煎至一盞去渣溫服不能服者綿滴口中又治小兒不能灌藥者宜用此綿滴法此方不用石膏以其三焦無火熱也兼自欲死之人陽氣將絕者故不用石膏若加人參大妙外大病後不足病虛勞補虛取七歲以下五歲以上黃牛乳一升水四升煎至一升如人飢稍稍飲不得多期十日服不住佳肘治篤病新起早勞食飲多致勞復欲死燒鱉甲服方寸匕活雄鼠屎湯治勞復梔子十四個雄鼠屎二七枚兩頭尖者是枳殼三枚炒上為細末每服四錢水一盞半入蔥白二寸香豉三十粒同煎一盞分二服勿令病人知鼠屎七味蔥白湯治傷寒或因起動勞復或因吃食稍多皆成此候若復甚者一如傷寒初有此證宜服此方蔥白連須乾葛新豉半合生薑切一合麥門冬去心熟地三錢流水四升以杓揚之上七味用清水煎三分減二去渣分二服漸漸服之取汗上傷寒勞復莫若仍用丹溪以參耆歸術加發散之劑汗之為的當也陰陽易傷寒陰陽易之為病其人身體重少氣少腹裡急或引陰中拘攣熱上衝胸頭重不欲舉眼中生花膝脛拘急者燒裩散主之燒裩散取婦人中裩近隱處剪燒灰以水和服方寸匕日三服小便即利陰頭微腫則愈婦人病取男子裩襠燒灰用嘗治傷寒病未平復犯房室死者命在須臾用獨參湯調燒裩散凡服參一二斤余得愈者三四人信哉用藥不可執一也陰陽易續法治傷寒病新瘥陰陽未和因合房室則令人陰腫入腹絞痛婦人則裡急腰胯連腹內痛名為陰陽易也其男子病新瘥未平復而婦人與之交接得病名曰陽易婦人病新瘥未平復而男子與之交接得病名曰陰易若二男二女並不自相易所以呼為易者以陰陽相感動其毒著於人如換易然其病之狀身熱沖胸頭重不能舉眼中生花四肢拘急小腹絞痛手足拳則死亦有不即死者病苦少腹裡急熱上衝胸頭重不欲舉百節解離經脈緩弱血氣虛骨髓竭便恍恍翕翕氣力轉小著床不能動搖起止仰人或牽引歲月方死宜燒裩散豭鼠糞湯竹茹湯青竹茹湯乾薑湯當歸白朮湯選用之海藏云熱者燒裩散竹皮湯寒者豭鼠糞湯當歸白朮湯至於校正方妙香丸條下治雜病陰陽易中有牛黃腦麝之類是治其熱症也竹皮湯療交接勞復卵腫腹中絞痛欲絕竹皮青刮一升用水三升煮取一升絞去渣分二服立愈青竹茹湯婦人病未平復因有所動致熱氣衝胸手足拘急搐搦如中風狀宜此湯栝蔞根一兩青竹茹刮半升淡竹是上以水二升煮取一升二合去渣分二三服妙香丸方見積熱條百一治交接勞復陰卵腫或縮入腹腹絞痛或便絕蚯蚓數條絞取汁服之良海若陰陽易果得陰脈當隨症用之若脈在厥陰當歸四逆湯送下燒裩散若脈在少陰通脈四逆湯送下燒裩散若脈在太陰四順理中丸送下燒裩散所用之藥各隨其經而效自速也豭鼠糞湯療傷寒病後男子陰易韭白根一把豭鼠糞十四粒兩頭尖者是上二味以水五升煮取半升去渣再煎三沸溫服得效未汗再服亦理諸般勞復當歸白朮湯治婦人未平復因有所動小腹急痛腰胯四肢不任舉動無力發熱者白朮當歸桂枝附子生甘草芍藥黃耆人參各二錢半生薑半兩上㕮咀水煎服食頃再服溫覆取微汗瘥李良佐子病太陽症尺寸脈俱浮數按之無力余見其內陰虛與神術加乾薑湯愈後再病余視之見神不舒垂頭不欲語疑其有房過問之犯房過乎必頭重目眩曰唯與大建中三四服外陽內收脈反沉小始見陰候又與已寒加芍藥茴香等丸五六服三日內約服丸六七百丸脈復生又用大建中接之大汗作而解山因女色病陰證傷寒者用陳皮熱鍋內炒焦以酒烹下濾酒飲之四時傷寒不同冬為傷寒春為溫病夏為暑病秋為瘧一歲長幼病相似為溫疫多眠多汗脈浮為風溫一身盡痛為濕身反張為痓陰陽大論曰春氣溫和夏氣暑熱秋氣清涼冬氣冷冽此四時正氣之序也冬時嚴寒萬類深藏若能固密則不傷於寒觸冒之者乃名傷寒耳其傷於四時之氣皆能為病惟傷寒為毒者以其最為殺厲之氣也中而即病者為傷寒不即病者為寒毒藏於肌膚中至春變為溫病至夏變為暑病暑病者熱極重於溫也是以辛苦之人春夏多溫熱病皆由冬時觸寒所致非時行之氣也凡時行者春時應暖而反大寒夏時應熱而反大涼秋時應涼而反大熱冬時應寒而反大溫此非其時而有其氣是以一歲之中長幼之病多相似者此則時行之氣也從春分以後至秋分節前天有暴寒者皆為時行寒疫也三月四月或有暴寒其時陽氣尚弱為寒所折病熱猶輕五月六月陽氣已盛為寒所折病熱則重七月八月陽氣已衰為寒所折病熱亦微其病與溫病及暑病相似但治有殊者要在辨其病原寒熱溫三者之異則用藥冷熱之品味判然矣其冬有非節之暖者名冬溫冬溫之毒與傷寒大異冬溫復有先後更相重沓亦有輕重治亦不同冬溫應常紀者有三歲少陰司天之政五之氣陽明司天之政終之氣厥陰司天之政終之氣皆病冬溫其不應常紀而反常者則不可候之而隨時變易也氣候亦有應至而不至者或有未應至而至者或有至而太過者皆成病氣也凡四時傷寒通宜補散故丹溪治傷寒多用補中益氣湯氣虛者四君子湯加發散劑血虛者四物湯加發散劑東垣治風濕用補中益氣加羌活防風升麻藁本蒼朮海藏治風濕無汗者用神術湯有汗者用白朮湯治剛痓用神術湯加羌活麻黃治柔痓用白朮湯加桂心耆術治風濕用白朮湯隨證加藥治中暍脈弦細芤遲者用黃耆湯此皆與仲景所謂辛苦之人觸冒之病傷寒同意也丹仲景論傷寒而未及乎中寒先哲治冒大寒昏中者用附子理中湯其議藥則得之矣曰傷曰中未有議其異同者夫傷寒有即病有不即病因其舊有鬱熱風寒外束肌腠自密郁發為熱病邪循經而入以漸而深初用麻黃桂枝輩微表而安以病體不甚虛也若中寒則倉卒感受其病即發而暴因其腠理疏豁一身受邪難分經絡無熱可發溫補自解此氣大虛不急治則死矣傷寒傷暑傷濕亦如傷寒之漸入也中風中暑中濕亦如中寒之暴受也中寒治法見卒中暴厥門冬為傷寒從霜降以後至春分以前凡有觸冒霜露體中寒即病者謂之傷寒也治法除濕暑瘧疾外皆傷寒法也春為溫病從立春節後其中無暴寒又不冰雪而人有壯熱為病者此屬春時陽氣發於外冬時伏寒變為溫病春溫應常紀者有四歲少陽司天之政初之氣太陽司天之政初之氣陽明司天之政終之氣太陰司天之政二之氣皆病溫其不應常紀而反常者不可候之而隨時變易也冬傷於寒春必溫病全文見五臟太陽病發熱而渴不惡寒者為溫病治見冬溫陽脈洪數陰脈實大者遇溫熱變為溫毒論見大法治見發癍活人云初春發癍咳嗽為溫毒發汗不解身灼熱為風溫其證脈浮汗出身重多眠蓋其病不獨見於春間故另立風溫門尺膚熱甚脈盛躁者病溫也全文見診夫精者身之本也故藏於精者春不病溫凡治溫病可刺五十九穴成注云所謂五十九穴者刺兩手內外側各三凡十二痏五指間各一凡八痏足亦如之頭入髮際一寸傍三分各三凡六痏巔上一囟會一髮際一廉泉一風池二天柱二內經云氣口靜人迎躁者取之若氣口人迎皆靜者勿刺也人迎謂結喉動脈也王太僕注素問五十九刺云刺頭上五行五行者以越諸陽之熱逆也謂頭中行上星囟會前頂百會後頂五穴頭第二行兩傍五處承光通天絡郄玉枕十穴第三行兩傍臨泣目窗正營承靈腦空十穴也大杼膺俞缺盆背俞此八者以瀉胸中之熱也氣街三里巨虛上下廉此八者以瀉胃中之熱也雲門髃骨委中髓空此八者以瀉四肢之熱也五臟俞傍五此十者以瀉五臟之熱也謂背第五行兩傍魄戶神堂魂門意舍志室十穴也溫病續法活夏至前發熱惡寒頭疼身體痛其脈浮緊者溫病也春月傷寒謂之溫病冬傷於寒輕者夏至以前發為溫病蓋因春溫暖之氣而發也治溫病與冬月傷寒夏月熱病不同蓋熱輕故也升麻解肌湯最良熱多者小柴胡湯主之不渴外有微熱者小柴胡加桂枝嗽者小柴胡加五味子煩躁發渴脈實大便秘澀者大柴胡湯微利之虛煩用竹葉湯次第服之仲景謂溫病壯熱不惡寒活人謂溫病發熱惡寒各不同當以仲景為正升麻解肌湯治傷寒溫病天行頭痛壯熱葛根一兩黃芩芍藥各半兩甘草炙桂心各一分麻黃三分去節湯泡上㕮咀每服五錢水一盞半棗子一枚煮八分日三服三四日不解脈浮者宜重服取汗脈沉實者宜下之云傷寒汗下不愈而過經其證尚在而不除者亦溫病也經曰溫病之脈行在諸經不知何經之動隨其經所在而取之如太陽症汗下後過經不愈診得尺寸俱浮者太陽溫病也如身熱目疼汗下後過經不愈診得尺寸脈俱長者陽明溫病也如胸脅痛汗下後過經不愈診得尺寸脈俱弦者少陽溫病也如腹滿嗌乾診得尺寸脈俱沉細過經不愈者太陰溫病也如口燥舌乾而渴診得尺寸俱沉過經不愈者少陰溫病也如煩滿囊縮診得尺寸俱微緩過經不愈者厥陰溫病也是故隨其經而取之隨其症而治之如發斑乃溫毒也夏為暑病太陽中暍者發熱惡寒身重而頭痛其脈弦細芤遲小便已洒洒然毛聳手足逆冷小有勞身即熱口開前板齒燥若發汗則惡寒甚加溫針則發熱甚數下之則淋甚太陽中熱暍者其人汗出惡寒身熱而渴白虎加人參湯主之活人云夏月自汗惡寒身熱而渴面垢手足冷脈微無力者中暑也白虎湯主之太陽中暍者身熱疼重而脈微弱此由夏月傷冷水水行皮中所致也一物瓜蒂湯主之一物瓜蒂湯用瓜蒂二十七個以水一升煮取五合去渣頓服上瓜蒂湯後賢罕用蓋其劑緩故也若果疼痛不退者亦宜用之暑病續法活中暑與熱病外證相似但熱病者脈盛中暑者脈虛以此別之甲乙經云脈盛身寒得之傷寒脈虛身熱得之傷暑蓋寒傷形而不傷氣所以脈盛熱傷氣而不傷形所以脈虛又有濕溫與中暑同但身涼不渴為異耳丹暑熱病用黃連香薷飲挾痰者加半夏挾虛者加參耆或用清暑益氣湯活夏月發熱惡寒頭疼身體肢節痛重其脈洪盛者熱病也冬傷於寒因暑氣而發為熱病治熱病與傷寒同有汗宜桂枝湯無汗宜麻黃湯如煩躁者宜大青龍湯然夏月藥性須帶涼不可大溫桂枝麻黃大青龍須用加減夏至前桂枝加黃芩半兩夏至後桂枝麻黃大青龍加知母一兩石膏二兩或加升麻半兩蓋桂枝麻黃湯性熱及暖處非西北之比夏月服之必有發黃斑出之失熱病三日外與前湯不瘥脈勢仍數邪氣猶在經絡未入臟腑者桂枝石膏湯主之此方夏至後代桂枝證用若加麻黃半兩可代麻黃青龍證用也若三月至夏為晚發傷寒梔子升麻湯亦可選用之桂枝石膏湯治法見前論有汗脈緩為桂枝證無汗脈緊為麻黃青龍證桂枝半兩去皮石膏一兩碎黃芩半兩甘草炙一兩梔子三錢白芍藥升麻乾葛生薑以上各三分上㕮咀每服五錢半水一盞半煮至八分去渣食頃再服若得汗即停後服梔子升麻湯治晚發傷寒三月至夏為晚發生地半斤切碎梔子十個升麻一兩半柴胡石膏各二兩半上㕮咀每服五錢水一盞半煎至八分頓服病不解更作垣靜而得之為中暑中暑者陰證當發散也或避暑熱納涼於深堂大廈得之者曰中暑其病必頭痛惡寒身形俱急肢節疼痛而煩心肌膚大熱無汗為房室之陰寒所遏使周身陽氣不得伸越世多以大順散主之是也海藏云靜而傷暑惡寒脈沉細靜而濕勝傷形者白虎加蒼朮湯主之大順散見局方甘草一錢半乾薑杏仁肉桂各一錢是也動而得之為中熱中熱者陽證為熱傷原氣非形體受病也若行人或農夫於日中勞役得之者名曰中熱其病必苦頭疼發躁熱惡熱捫之肌膚大熱必大渴引飲汗大泄無氣以動乃為天熱外傷肺氣蒼朮白虎湯主之海藏云動而傷暑身熱脈洪大動而火勝傷氣者白虎加人參湯主之活中暑背寒面垢手足微冷煩渴口燥倦怠四肢不痛重其脈微弱按之無力白虎湯主之方見發熱本有人頭痛身熱心煩燥渴診其脈大而虛予授以白虎湯數服愈仲景云脈虛身熱得之傷暑又云其脈弦細芤遲何也素問曰寒傷形熱傷氣蓋傷氣不傷形則氣消而脈虛弱所謂弦細芤遲者皆虛脈也仲景以弦為陰朱龐亦云中暑脈微弱則虛可知海脈虛身熱自汗惡寒者中暑也白虎加桂湯主之方見瘧活酒蒸黃連丸治暑毒深伏累取不瘥無藥可治伏暑發渴者黃連四兩以無灰酒浸蒸干上為末糊丸熟水下三十丸胸膈涼不渴為驗橘皮湯治中暑痰逆惡寒橘皮二兩去白生薑一兩棗子五枚去核甘草炙半兩人參一錢竹茹半升上分五服每服水一盞二分煮取八分去渣熱服竹葉石膏湯治中暑不惡寒方見勞復五苓散治中暑頭痛噁心煩躁心下不快方見渴海若先飲冷後傷暑者五苓散主之此必心下痞憹生薑湯調服佳或四君子湯調中亦可中和後或小便不利或莖中痛宜服下方蒲黃三錢滑石五錢生甘草一錢中暍脈弦細芤遲黃耆湯主之人參黃耆白朮甘草茯苓芍藥各等分上㕮咀每服三錢水一大盞生薑三片煎至六分去渣溫服丹徐三官六月間發熱大汗惡寒戰慄不自禁持且煩渴予曰此暑病脈之皆虛微細弱而數其人好賭致勞而虛遂以人參竹葉作湯調辰砂四苓散八帖而安云口開前板齒乾燥者牙乃骨之精今燥者骨熱也針藥不能治當灸大椎穴活濕溫者兩脛逆冷胸腹滿多汗頭痛妄言其人常傷於濕因而中暑濕熱相搏則發濕溫其脈陽濡而弱陰小而急治在太陽不可發汗汗出必不能言耳聾不知痛所在身青面色變名曰重暍如此死者醫殺之耳白虎加蒼朮湯主之本癸丑年故人王彥龍作毗陵倉官季夏時病胸項多汗兩足逆冷譫語醫者不曉雜進藥已經旬日予診之其脈關前濡關後數予曰當作濕溫治之蓋先受暑後受濕暑濕相搏是名濕溫先以白虎加人參湯次白虎加蒼朮湯頭痛漸退足漸溫汗漸止三日愈此名賊邪誤用藥有死之理有人難曰何名賊邪予曰難經云五邪有實邪虛邪正邪微邪賊邪從後來者為虛邪從前來者為實邪從所不勝來者為賊邪從所勝來者為微邪自病者為正邪又曰假令心病中暑為正邪中濕得之為賊邪今心先受暑而濕邪勝之水剋火從所不勝斯謂之賊邪五邪之中最逆也難經曰濕溫之脈陽濡而弱陰小而急濡弱見於陽部濕氣搏暑也小急見於陰部暑氣蒸濕也故經曰暑濕相搏名曰濕溫是謂賊邪也不特此也予素有停飲之疾每至暑月兩足汗漐漐未嘗干每服此藥二三盞即愈海濕溫汗少者白虎加蒼朮汗多者白虎加桂枝白虎加桂枝方見瘧孫保慶門外有酒家姓姜者善歌唱孫愛之忽數日不見使人問之則曰病久將命絕孫診之遍身皆潤兩足冷至膝下腹滿不省人事六脈皆小弱而急問其所服藥取而視之皆陰病藥也孫曰此非受病重藥能重病耳遂用五苓散白虎湯十餘帖病少蘇再服全愈姜氏既安詣孫謝因請問曰某得病劇蒙尚藥一治而蘇願聞治法孫曰汝病傷暑也始則陽微厥而脈小無力眾醫謂陰病遂用陰藥其病愈厥予用五苓散大利小便則腹減白虎解利邪熱則病愈凡陰病脛冷則臂亦冷汝今脛冷臂不冷則非下厥上行所以知是陽微厥也保立夏之後至立秋處暑之間傷寒者身多微涼自汗四肢沉重謂之濕溫蒼朮石膏湯主之即白虎加蒼朮湯是也蒼朮半兩石膏三錢知母二錢半甘草一錢上㕮咀水一盞煎至一半溫服謂內有濕也多不欲飲水如身熱脈洪無汗多渴者熱在上焦積於胸中宜桔梗散此非濕溫證乃熱病也桔梗散薄荷黃芩甘草梔子各一錢桔梗三錢連翹二錢上銼每服五錢水煮加竹葉如大便澀加大黃半兩海消暑丹半夏一斤茯苓半斤生甘草半斤上以醋五升煮半夏盡醋熬干薑汁作糊無見生水為丸每服五十丸熟水嚥下精意修治用之極效中暑為患藥下即蘇傷暑發熱頭痛服之尤妙夏月常服止渴利小便雖飲水多亦不為害應是暑藥皆不及此若痰飲停節並用生薑湯下入夏之後不可缺此又方消暑丸治頭疼噁心煩躁消渴霍亂綠豆粉四兩石膏四兩白礬枯硫黃各一兩水浸蒸餅為丸彈子大辰砂為衣用薑汁醋點新汲水化開服之丹暑風挾痰挾火實可用吐法玉龍丸治一切暑毒伏暑腹脹疼痛神效硫黃硝石滑石明礬各一兩用無根水調丸秋為瘧夏傷於暑秋必病瘧治法見瘧門脈陰陽俱盛重於陰者變為溫瘧一歲長幼症狀相似為溫疫春應暖反寒夏應熱反涼秋應涼反熱冬應寒反溫此非其時而有其氣是以一歲之中長幼之病多相似者為時行瘟疫病也論見傷寒溫疫續法活一歲之中病無長幼率相似此則時行之氣俗謂之天行是也老君神明散務成子螢火丸聖散子敗毒散不拘日數淺深吐下隨症施行所以聖散子不問陰陽表裡也老君神明散治瘟疫白朮一錢桔梗一分細辛一兩附子一兩炮去黑皮烏頭四兩炮去皮尖上五味為粗末縫絹袋盛帶之居閭里皆無病若有疫癘者溫酒服方寸匕覆取汗得吐則瘥若經三四日抄三寸匕以水一碗煮令大沸分三服聖散子蘇內翰序全文見活人書時毒流行用聖散子者一切不問陰陽之感連服取瘥不可與傷寒比也若疾疫之行平旦輒煮一釜不問老幼良賤各一大盞即時氣不入草豆蔻十個麵裹煨去皮豬苓去皮石菖蒲茯苓良薑獨活去蘆附子炮製去皮臍麻黃去根厚朴去皮薑製藁本芍藥枳殼炒去穰柴胡澤瀉細辛防風去蘆白朮藿香半夏吳茱萸湯洗蒼朮甘草各半兩上㕮咀每服五錢水一盞半煮取八分去渣熱服余渣再煎空心服之上二方治疫雖不分陰陽然亦寒多表多者宜之丹眾人病一般者是謂天行時疫有宜補宜散宜降方大黃黃芩黃連人參桔梗防風人中黃滑石香附蒼朮上曲糊為丸每服五七十丸分氣血痰作湯使送下氣虛者四君子湯送下血虛者四物湯送下痰多者二陳湯送下熱甚者用童便和前藥同送下本糞清臘月截淡竹去青皮浸滲取汁治天行熱狂熱疾中毒並惡瘡蕈毒取汁浸皂角甘蔗治天行熱疾丹解一切災病用粉草五兩細切微炒量病人吃得多少酒取無灰酒一處研去渣溫服須臾大瀉毒亦隨出雖十分渴亦不可飲水飲水難救上三方熱多里多者宜之潔雄黃丸治疫不相染雄黃一兩研赤小豆炒熟丹參鬼箭羽各二兩上為細末煉蜜為丸如桐子大每日空心以溫水下五丸可與病同床共衣亦不相染矣活務成子螢火丸主闢疫疾惡氣百鬼虎狼蛇虺蜂蠆諸毒五兵白刃盜賊凶害皆闢之螢火鬼箭羽去皮蒺藜各一兩雄黃雌黃各二兩礬石一兩燒汁盡羚羊角鍛灶灰鐵錘柄入鍛處燒焦用一分半上九味搗為散以雞子黃並雄雞冠一具和之如杏仁大作三角縫囊盛五丸帶左臂上仍可掛於戶上春應暖而清氣折之則實邪在肝升麻解肌湯主之方見溫病夏應暑而寒氣折之則實邪在心調中湯射干湯半夏桂枝甘草湯選用之調中湯治夏月初秋忽有暴寒折於盛熱結於四肢則壯熱頭痛寒傷於胃則下利或血或水或赤壯熱暈悶脈數宜下之大黃去皮三分黃芩芍藥葛根桔梗茯苓去皮藁本擇真者無則川芎代之白朮甘草炙以上各半兩上㕮咀每服五錢水一盞半煮取一盞移時再服之得快利便止小兒減與服虛冷不壯熱但下利或霍亂者不宜服此射干湯方見啞半夏桂枝甘草湯方見咽痛秋應涼而反大熱抑之則實邪在肺白虎加蒼朮湯茵陳汁調五苓散白虎蒼朮湯見暑五苓散見渴丹冬溫為病非其時而有其氣者冬時嚴寒君子當閉藏而反發泄於外專用補藥帶表藥作人中黃方以竹筒兩頭留節一節中作一竅內甘草於中仍以竹木釘塞其竅置大糞缸內浸一月取出曬乾用治瘟毒用此藥一味入補藥帶表同煎服之活冬應寒而反大溫抑之則實邪在腎宜葳蕤湯方見風濕多眠多汗脈浮為風溫陽脈浮滑陰脈濡弱更遇於風變為風溫論見大法發汗已身灼熱者名曰風溫風溫為病脈陰陽俱浮自汗出身重多眠睡鼻息必鼾語言難出若被下者小便不禁直視失溲若被火者微發黃色劇則如驚癇時瘛瘲若火熏之一逆而引日再逆促命期經云傷寒發汗已則身涼若發汗已身灼熱者非傷寒乃風溫也風溫續法活風溫者脈尺寸俱浮頭疼身熱常自汗出體重其息必喘四肢不收嘿嘿但欲眠治在少陰厥陰不可發汗發即譫言獨語內煩躁不得臥若驚癇目亂無精如此死者醫殺之耳風溫忌發汗宜葳蕤湯身灼熱者知母乾葛湯如渴甚者栝蔞根湯脈沉身重汗出者漢防己湯葳蕤湯治風溫兼療冬溫及春月中風傷寒發熱頭眩痛喉咽干舌強胸內疼痞腰背強葛根半兩葳蕤三分石膏一兩杵碎白芷半兩麻黃用沸湯泡半兩羌活去蘆一兩川芎三錢甘草炙半兩杏仁去皮尖雙仁者半兩青木香一錢上㕮咀每服五錢水一盞半煎半鍾日三四服知母乾葛湯治風溫身體灼熱甚者知母三錢葛根八錢石膏六錢甘草黃芩木香升麻各一錢葳蕤三錢南星二錢生人參川芎各一錢麻黃去節防風杏仁羌活各二錢上㕮咀每服五錢水一盞半煎至一鍾去渣服防己湯治風溫脈浮身重汗出一方無人參防己四錢甘草黃耆各一兩生薑二兩白朮三兩人參一兩上㕮咀每服五錢水一盞半煮取一中盞去渣飲訖仍坐被中汗出如蟲行或被臥取汗出許學士云風溫誤汗用防己黃耆湯救之海治風溫活人本方葳蕤湯以有麻黃不敢用宜白朮湯主之方見前太陽病發熱續法若頭眩汗出筋惕肉瞤者加牡蠣若腰背強硬者加羌活若舌乾發渴者加人參若身灼熱甚者加知母若身體重多汗者加黃耆若內傷冷者不加一身盡痛為濕痛而發黃為中濕痛不得轉側為風濕活人又以身痛脈沉為中濕脈浮為風濕亦通治法見太陽病體痛門身反張為痓有汗為柔痓無汗為剛痓治法見柔痓門婦人傷寒熱入血室婦人中風發熱惡寒經水適來得之七八日熱除而脈遲身涼胸脅下滿如結胸狀譫語者此為熱入血室也當刺期門隨其實而瀉之東垣云妄見妄聞夜夢亡人皆肝木火盛而為邪也刺期門與此義同許學士云有婦人患熱入血室證醫者不識用補血調氣藥延養數日遂成血結胸或勸用前藥予曰小柴胡已遲不可行也無已則有一焉刺期門穴斯可矣予不能針請善針者治之如言而愈或問曰熱入血室何謂而成結胸也予曰邪氣傳入經絡與正氣相搏上下流行或遇經水適來適斷邪氣乘虛而入血室血為邪迫上入肝經肝受邪則譫語而見鬼復入膻中則血結於胸也何以言之婦人平居水當養於木血當善於肝方未受孕則下行之以為月水既妊則中蓄之以養胎及已產則上壅之以為乳皆此血也今邪氣蓄血並歸肝經聚於膻中結於乳下故手觸之則痛非湯劑可及故當刺期門也婦人傷寒發熱經水適來晝日明瞭夜則譫語如見鬼狀者此為熱入血室無犯胃氣及上二焦必自愈活人云小柴胡和之犯胃氣謂下之犯上二焦謂發汗也衍有一婦人溫病已十二日診之其脈六七至而澀寸稍大尺稍小發寒熱頰赤口乾不了了耳聾問之病數日經水乃行此屬少陽熱入血室也若治不對病則必死乃按其證與小柴胡湯服之二日又與小柴胡湯加桂乾薑一日寒熱遂止又云我臍下急痛又與抵當丸微利臍下痛痊身漸涼脈漸勻尚不了了仍復與小柴胡湯次日又云我但胸中熱躁口鼻乾又少與調胃承氣湯不得利次日又云心下痛又與大陷胸丸半服利三行次日虛煩不樂時亦有所見時復狂言雖知其尚有燥屎以其極虛不敢攻之遂與竹葉湯去其煩熱其夜大便自通至曉兩次中有燥屎數枚而狂言虛煩盡解但咳嗽唾此肺虛也恐乘虛而成肺痿遂與小柴胡去人參大棗生薑加乾薑五味子湯一日咳減二日而病悉愈以上皆用張仲景方婦人中風七八日續得寒熱發作有時經水適斷者此為熱入血室其血必結故如瘧狀發作有時小柴胡湯主之熱入血室續法云婦人傷寒中風治法與男子無異惟熱入血室妊娠傷寒則不同也宜以四物安養胎血佐以汗下之藥治之婦人傷寒中風自汗頭痛項背強發熱惡寒脈浮而緩恐熱入血室故倍加芍藥桂枝加芍藥湯桂枝一兩半赤芍藥三兩半生薑一兩半大棗六枚上銼細每服五錢水煎婦人傷寒脈浮而緊頭痛身熱惡寒無汗發汗後恐熱入血室宜麻黃加生地黃湯麻黃二兩半桂枝一兩半甘草半兩生地黃一兩杏仁二十五個去皮尖上㕮咀每服五錢水煎活婦人傷寒經脈方來初斷寒熱如瘧狂言見鬼宜用乾薑柴胡湯柴胡四兩栝蔞根桂枝一兩半牡蠣一兩乾薑甘草炙各一兩上㕮咀每服五錢水一盞半煎至七分去渣溫服初服微煩再服汗出而愈羅小柴胡加地黃湯治婦人室女傷寒發熱經水適來適斷晝日明瞭夜則譫語如見鬼神亦治產後惡露方來忽間斷欲死柴胡一兩二錢半人參黃芩甘草炙半夏湯洗七次生地各七錢上為粗末生薑三片棗二枚同煎云婦人傷寒身熱脈長而弦屬陽明少陽往來寒熱夜躁晝寧如見鬼狀經水適斷熱入血室不實滿者小柴胡加牡丹皮主之大實滿者桃仁承氣主之小柴胡加牡丹皮湯柴胡二兩黃芩七錢半人參二兩半夏六錢大棗三枚甘草生薑各七錢半牡丹皮二兩上銼細每服一兩生薑同煎桃仁承氣湯方見蓄血婦人傷寒頭痛脈浮醫反下之邪氣乘虛而傳於裡經水閉而不行心下結硬口燥舌乾寒熱往來狂言如見鬼狀脈沉而數者當下之宜小柴胡加芒硝大黃湯主之柴胡二兩黃芩七錢半半夏制一兩五錢甘草五錢半大黃芒硝各七錢大棗三枚生薑七錢半上銼每服一兩生薑同煎去渣下芒硝再沸溫服若脈不沉數即不可下本辛亥中寓居毗陵學官王仲禮其妹病傷寒發寒熱遇夜則如鬼物所憑六七日忽昏塞涎響如引鋸牙關緊急瞑目不知人病勢極危召予視之予曰得病之初曾值月經來否其家曰月經方來病作而經遂止一二日發寒熱晝雖靜夜則有鬼祟從昨日涎生不省人事予曰此熱入血室之證也仲景云婦人中風發熱惡寒經水適來晝則明瞭夜則譫語如見鬼狀發作有時此名熱入血室醫者不曉以剛劑與之遂致胸膈不利涎潮上脘喘急息高昏冒不知人事當先化其痰後除其熱予急以一呷散投之兩時頃涎下得睡省人事次授以小柴胡加地黃湯三服而熱除不汗而自解矣云婦人傷寒表虛自汗身涼四肢拘急脈沉而遲太陽標病少陽本病經水適斷桂枝加附紅花湯桂枝二兩半芍藥生薑各一兩半甘草一兩炙附子炮紅花各五錢上銼細各每服一兩水三盞煎服婦人傷寒太陽標病汗解表除邪熱內攻熱入血室經水過多無滿實者甘草芍藥湯甘草芍藥生地川芎各一兩上㕮咀每服一兩水三盞煎至一盞半去渣入發灰五錢調勻溫服不止者刺隱白續增妊娠傷寒潔黃耆解肌湯治婦人妊娠傷風自汗人參黃耆當歸川芎甘草炙五錢芍藥六錢加蒼朮生地亦可上為粗末每服五錢水煎溫服無時海若妊娠傷寒中風表虛自汗頭痛項強身熱惡寒脈浮而弱太陽經病宜表虛六合湯四物湯四兩桂枝地骨皮各七錢若妊娠傷寒頭痛身熱無汗脈緊太陽經病宜表實六合湯四物湯四兩麻黃細辛各半兩若妊娠傷寒中風濕之氣肢節煩疼脈浮而熱頭痛者太陽標病也宜風濕六合湯四物湯四兩防風蒼朮制各七錢若妊娠傷寒下後過經不愈濕毒發斑如錦紋宜升麻六合湯四物湯四兩升麻連翹各七錢若妊娠傷寒胸脅滿痛而脈弦少陽症也宜柴胡六合湯四物湯四兩柴胡黃芩各七錢若妊娠傷寒大便硬小便赤氣滿而脈沉數陽明太陽本病也急下之宜大黃六合湯四物湯四兩大黃五錢桃仁去皮尖十個麩炒若妊娠傷寒汗下後咳嗽不止者宜人參六合湯四物湯四兩人參五錢五味子五錢若妊娠傷寒後虛痞脹滿者陽明本虛也宜厚朴六合湯四物湯四兩厚朴枳實麩炒各五錢若妊娠傷寒汗下後不得眠者宜梔子六合湯四物湯四兩梔子黃芩各五錢若妊娠傷寒大渴蒸蒸而煩脈長而大者宜石膏六合湯四物湯四兩石膏知母各五錢若妊娠傷寒小便不利太陽本病宜茯苓六合湯四物湯四兩茯苓澤瀉各五錢若妊娠傷寒太陽本病小便赤如血狀者宜琥珀六合湯四物湯四兩琥珀茯苓各五錢若妊娠傷寒汗下後血漏不止胎氣損者宜膠艾六合湯四物湯四兩阿膠艾各五錢一方加甘草同上一方加甘草乾薑黃耆若妊娠傷寒四肢拘急身涼微汗腹中痛脈沉而遲少陰病也宜附子六合湯四物湯四兩附子炮去皮臍桂各五錢若妊娠傷寒蓄血證不宜墮胎藥下之宜四物大黃湯下之四物湯四兩生地大黃酒浸各五錢婦人妊娠或蓄血抵當桃仁勿妄施要教子母俱無損大黃四物對服之丹施孺人傷風未解兩足下脛冷嗽多不吐痰頭眩蓋其性急又當臨月黃芩半錢陳皮白朮各一錢蘇梗三分木通枳殼炒各五分麻黃三分甘草炙二分桔梗蒼朮各半錢水煎服無時云婦人有孕傷寒脈浮頭重腹中切痛宜桂枝芍藥當歸湯桂枝芍藥當歸各一兩上銼細末服一兩水煎婦人妊娠傷寒自利腹中痛食飲不下脈沉者太陰病也宜芍藥湯芍藥白朮甘草茯苓各一兩上如前修服活治妊娠傷寒安胎宜阿膠散人參白茯苓阿膠炒桑寄生白朮各等分上搗羅為細末糯米飲調下二錢日二服治妊娠傷寒安胎宜白朮散白朮黃芩各等分新瓦上炒香上為末每服三錢水一鍾生薑三片大棗一枚劈破同煎至七分去渣溫服但覺頭疼發熱便可服二三服即瘥惟四肢厥冷陰症見者未可服治妊娠傷寒憎寒發熱當發其汗宜蔥白湯蔥白十莖生薑二兩切上銼水二盞煎至一盞連服取汗海蔥白一物湯用蔥白二把以水一升煮熟取汁令食盡亦主安胎若胎死須臾即出治婦人傷寒妊娠服藥例若發熱惡寒不離桂枝芍藥若往來寒熱不離柴胡前胡若大渴者不離知母石膏五味子麥門冬若大便泄者不離桂附乾薑白朮若大便燥結者不離大黃黃芩若月經適來適斷者不離小柴胡若胎不安者不離人參阿膠白朮黃芩若發汗者不離蔥豉生薑麻黃旋覆若頭痛者不離石膏山梔前胡若傷暑頭痛者不離柴胡甘草石膏若滿悶者不離枳實陳皮若胎氣不安者不離黃芩麥門冬人參若斑發黑者不離黃芩梔子升麻大治妊娠時氣身大熱令子不落護胎方伏龍肝研令極細末調塗臍下三寸干即易瘥即止又方井中泥塗干即易之二方出本事有效又方浮萍朴硝蛤粉藍根大黃微炒上為末水調敷臍上安胎解熱極妙治妊娠霍亂二方附少陰吐利門治妊娠發斑變為黑色宜梔子大青湯黃芩升麻梔子仁各二兩大青杏仁各半兩上㕮咀每服五錢水一盞半細切蔥白三寸煎至一盞去渣溫服產後傷寒產後中風數十日不解頭微痛惡寒時時有熱心下悶乾嘔汗出雖多陽旦證耳可與陽旦湯即桂枝湯方見太陽病產後中風發熱面赤喘而頭痛竹葉湯主之竹葉一把葛根三兩防風桔梗桂枝人參甘草各一兩附子一枚炮上㕮咀每服五錢棗一枚姜五片水一盞半煎一盞去渣服溫覆使汗出若頭項強用大附子半錢煎藥揚去沫嘔者加半夏一錢產後傷寒續法丹產後發熱惡寒皆屬血氣虛左手脈不足補血右手脈不足補氣惡寒發熱又腹痛當去惡血惡寒發熱乳汁不通及膨者無子當消用麥芽二兩炒研細清湯作四服調下有子當下用木通通草豬蹄汁調煎服產後才見身熱不可發表並一切苦寒藥必用乾薑治之大發其熱輕則用茯苓淡滲其熱大凡產後發熱頭痛身疼不可便作感冒治之此等多是血虛或敗血作梗宜以平和之劑與服必效如玉露散或四物加北柴胡等分煎服若便以小柴胡湯及竹葉石膏之類竟不救者多矣玉露散治產後乳脈不行身體壯熱疼痛頭目昏痛大便澀滯悉治之涼膈壓熱下乳人參茯苓甘草各半兩苦梗炒川芎白芷各一兩當歸一分芍藥三分上㕮咀每服五錢水一盞煎至七分溫服如煩熱甚大便秘者加大黃二錢半續增小兒傷寒潔傷寒表裡攻發有表證惡風惡寒者當發表海藏云惡風者白朮散惡寒者神術湯如氣盛能食不大便無表證者可攻裡春主生屬木身溫當發汗海藏云神術湯夏主長屬火身熱而煩躁合大發散海藏云神術加黃耆湯長夏主化屬土及居四季同當調其飲食海藏云四君子湯秋主收屬金身涼內溫合微下海藏云通膈丸金花丸冬主藏屬水身熱而惡寒是熱在外而寒在內身寒而惡熱是熱在內而寒在外海藏云熱在內者調胃承氣湯寒在內者調中湯丸潔凡傷寒宜依四時陰陽升降逆順剛柔而施治法氣升浮則順發之氣收藏則下之有汗發熱惡風脈浮緩者風傷衛桂枝湯無汗發熱惡寒不當風而自憎寒脈浮緊者寒傷榮麻黃湯有汗發熱惡風脈浮緊無汗發熱惡寒脈浮緩謂之榮衛俱傷青龍桂枝麻黃各半湯無汗發熱不惡風寒脈沉洪者可下之更詳認其厥與不厥量寒熱淺深而治之有汗四肢厥脈沉微者名陰厥四逆湯無汗四肢厥脈沉微者名陽厥大承氣湯加膩粉如四肢不厥身熱內外皆陽不動三焦宜涼藥三五服下之黃芩甘草湯黃芩白朮湯黃芩蒼朮湯黃芩梔子湯連翹飲子小柴胡湯八正散涼膈散白虎湯五黃散此上中下三焦藥宜選用之中暑脈虛皆惡寒自汗而渴者白虎湯身涼脈緊熱在內者急下之口燥咽乾不大便是也無汗身大熱者可發汗升麻湯大青膏天麻膏有汗身大熱者桂枝湯惺惺散解肌湯小柴胡湯白朮防風湯可選用之發汗者量四時暄暑燥濕風寒各宜春涼夏寒秋溫冬熱而發之錢傷風貪睡口中氣熱呵欠煩悶當發散與大青膏表證也潔古補遺云小兒外感於風寒拘急呵欠煩悶皮毛澀口中氣熱者當發散秋冬用溫熱藥春夏用涼寒藥大青膏天麻一錢白附子生一錢半蠍尾去毒生半錢硃砂研一字匕青黛一錢研天竺黃一字匕研麝香一字匕烏梢蛇肉酒浸焙乾取末半兩上同研細生蜜和成膏每服半皂子或一皂子大月中兒粳米大同牛黃膏薄荷水化一處服之五歲以上同甘露散服雄黃膏治傷風溫壯熱引飲雄黃小棗大研蘿蔔根水並醋一大盞煮盡甘草末川甜硝各三錢寒水石研細五錢匕腦子一字匕硃砂五分上研勻煉蜜成膏薄荷湯化下半皂子大上大青膏發散貪睡口氣熱呵欠煩悶表症者蓋為三歲以下小兒未能言者設也活尋常風壅發熱鼻涕痰嗽煩渴惺惺散主之方見瘧海傷寒時氣風熱痰壅咳嗽及氣不和者四君子加細辛栝蔞桔梗各一分生薑薄荷煎或加防風川芎各一分內有寒及遇天寒欲發散者則去栝蔞加桔梗多虛汗夜啼者加麥門冬傷風身熱頭痛氣促者四君子加川芎防風等分細辛羌活減半同煎活咽喉不利痰實咳嗽鼠黏子湯云人參羌活散治小兒寒邪及瘟氣時疫瘡疹頭痛體疼壯熱多眠不語潮熱煩渴痰實咳嗽羌活獨活柴胡人參芎藭枳殼炒甘草炙各二兩前胡桔梗天麻酒浸炙地骨皮各半兩白茯苓去皮二兩上為散每服二錢水一盞入薄荷少許同煎去渣溫服不拘時候七寶散治時氣頭昏體熱小兒同乳母服大人亦可紫蘇葉香附炒各三兩陳皮甘草炙桔梗白芷川芎各一兩上㕮咀薑棗煎服海麻黃黃芩湯治小兒傷寒無汗頭痛身熱惡寒麻黃赤芍黃芩半兩甘草桂枝各二錢半上為粗末水煎服升麻黃芩湯治傷風有汗頭疼發熱惡風升麻葛根黃芩芍藥各五錢半甘草一錢半上㕮咀每服二錢水煎溫服上惺惺散等藥發散頭痛發熱惡風寒表證者蓋為三歲以上小兒能言者設也能言故頭疼惡風寒可問而知也前五方通治有汗無汗惡風惡寒第五方治無汗惡寒第六方治有汗惡風錢與大青膏不解散有下證當下大黃丸主之大熱飲水不止而善食者可微下余不可下也此里症也潔古補遺云大熱飲水能食不大便用大黃丸作散子與服之如清便自調慎不可妄下恐外熱逐於內而變結胸危證多矣大黃丸治風熱裡實口中氣熱大小便秘赤飲水不止有下證者宜服之川芎半兩黑牽牛半兩半生半熟炒大黃一兩酒蒸甘草二錢半炙上為細末稀糊和丸麻子大二歲每服十丸溫蜜水下乳後服以溏利為度未利加丸數活頭額痛身體發熱大便黃赤腹中有熱四順散連翹飲三黃丸主之四順飲連翹飲三黃丸並見痘門身體潮熱頭目昏痛心神煩躁小便赤大便秘此熱劇也洗心散調胃承氣湯主之洗心散見痘門頭額身體溫熱大便白而酸臭者胃中有食積雙聖丸主之方見食癖門潔如身表無大熱而小便不利是有濕熱結膀胱仍用勝濕藥白朮茯苓之類利小便則其熱自退云小兒傷寒煩熱小便赤澀大便褐色面赤熱者導赤散錢傷風兼藏兼心則驚悸兼肺則悶亂喘息哽氣長出氣嗽兼腎則畏明各隨補母藏虛見故也傷風手足冷脾臟怯也當先和脾後發散和脾益黃散發散大青膏主之此治陰厥有汗脈沉微者若陽厥無汗脈沉滑者不宜此法宜大承氣湯而加膩粉傷風自利脾臟虛怯也當補脾後發散補脾益黃散發散大青膏主之未瘥調中丸主之有下證大黃丸下之後服溫驚丸傷風腹脹脾臟虛也當補肺必不喘後發散仍補脾也去脹塌氣丸主之發散大青膏主之傷風吐瀉治見吐瀉門治吐瀉用益黃散白朮散發散用大青膏湯治夾驚傷寒熱極生風薄荷散薄荷葉半兩羌活全蠍麻黃去節甘草半分天竺黃殭蠶白附子炮各一分上為細末每服一錢水小半盞煎至三分加竹瀝少許妙云小兒表傷寒則皮膚閉而為熱盛即生風欲為驚搐血氣未實不能勝邪故發搐也大小便依度口中氣熱當發之宜大青膏肺盛復有風冷則胸滿短氣氣急喘嗽上氣當先散肺後發散風冷散肺瀉白散散風大青膏主之若止傷寒則不胸滿腎虛則畏明宜補腎地黃丸有表者間用大青膏發散之傷風下後虛熱以藥下之太過胃中虛熱飲水無力當生胃中津液多服白朮散小兒結熱於內口乾而渴身黃體重者宜白朮散湯傷寒發渴宜白虎湯潔大熱飲水能食不大便用大黃丸作散服之上三方白朮散治虛渴為下後而食少胃虛者設也白虎湯大黃丸治實渴為未經下而能食不大便者設也潔傷寒咳嗽吐清水哽氣長出氣是肺之不足也合用阿膠散面白如枯骨者死不治身熱咳嗽吐痰者當用褊銀丸方見咳嗽門上二方治咳嗽阿膠散治虛嗽為哽氣長出氣者設也褊銀丸治實嗽為痰盛喘滿者設也若有表證惡風寒而嗽者當用惺惺散加減四君子湯鼠黏子湯之類是也陰厥陽厥見大法條潔身大熱吐逆不止者茯苓半夏湯即小半夏加茯苓湯方見嘔門湯傷寒嘔者枳殼半夏湯枳殼半夏各半兩上水一碗姜十片煎至小半碗十歲以下作五服藿香正氣散治傷寒發嘔藿香葉厚朴制半夏制甘草炙陳皮蒼朮米泔浸淘各等分上㕮咀每服二錢水半盞姜三片棗一枚煎至二分去渣溫服潔大吐者當下之白餅子珍珠丸消積丸三方俱見癖門潮熱有時胸滿短氣嘔吐者桃枝丸方見小兒積熱門上七方治傷寒嘔吐前二方治痰飲而吐中一方治有表而吐後四方治有里而吐其桃枝丸治裡熱而吐餘二方治表寒而吐也湯傷寒自汗當補虛和陰陽小建中湯減桂加黃耆人參地黃黃耆一兩白芍三兩甘草人參熟地各半兩上㕮咀每二錢水半盞煎至三分去渣服小兒傷寒形症頭痛體痛鼻塞或流涕喉內喘息兩手脈洪數頰赤眼澀身上寒毛起口鼻出水眼赤黃口乾澀咳嗽山根青色噴嚏活頭目疼痛而畏人惡寒者此傷寒證也云設令小兒卒暴身壯熱惡寒四肢冷或耳尻冷鼻氣熱為斑疹也與傷寒表證相似此胎氣始發自內之外若與傷寒表證同治者誤也當作斑疹治之溫病溫病者春月之溫病而不熱也田春日溫病未滿三日先用惺惺散二服後四五日不解煩渴嘔用白朮散如自汗口燥用制白虎湯至六七日大便燥結用四順飲子下心腹大實大滿牛黃通膈丸下初覺之時疑是瘡疹只用葛根升麻湯解肌傷寒拾遺治中風自汗用桂枝湯治傷寒無汗用麻黃湯此仲景表散之法百世不易者也若元氣暴虧者以參耆與桂枝麻黃等藥表散此丹溪補仲景之法亦百世不易者也至於韓祗和戒桂枝而以中風傷寒通作一法治之者此當時之權變非百世之常行也王海藏云仲景用桂枝當漢之末也韓祗和戒桂枝當宋之隆也時世之異不可不知今編祗和之法於篇末以廣後學之見云韓氏和解因時法傷寒病有可汗者論中但統言其可汗症及可汗脈或云脈浮而數或云脈浮緊或云脈浮無汗而喘或云脈浮為在表今略舉數條後人但憑其脈之大概並不分脈浮有陰陽虛盛之理又不知有可汗不可汗之症誤投發表藥則多變成陽毒之患矣今舉病人有汗惡風無汗惡寒分二等及據立春以後立秋以前氣候輕重各立方治之庶學者易為開悟耳病人二三月以前兩手脈浮數或緩或緊按之差軟寸關尺若力齊等其力不甚大不甚小者亦未可便投解表藥此是見里證未見表脈也宜候寸脈力小如關尺即可投解表藥大抵治傷寒病見證不見脈未可投藥見脈未見證雖少投藥亦無害也凡治雜病以症為先脈為後治傷寒病以脈為先證為後病人兩手脈浮數而緊名曰傷寒若關前寸脈力小關後尺脈力大雖不惡風不自汗出此乃陰氣已盛先見於脈也若不投藥和之後必惡風及自汗出若立春以後至清明以前宜調脈湯主之清明以後至芒種以前宜葛根柴胡湯主之芒種以後至立秋以前宜人參桔梗湯主之調脈湯葛根一兩防風前胡去苗三分甘草炙半兩上為粗末每服二錢水一盞生薑一塊如小指大劈破煎至七分去渣溫服如寸脈依前力小加棗三個同煎葛根柴胡湯葛根一兩半柴胡去蘆一兩芍藥桔梗甘草炙各三分上㕮咀每服二錢水一盞生薑二片煎至七分去渣熱服如寸脈依前力小加蔥白三寸同煎服人參桔梗湯人參桔梗各三分麻黃去節一兩石膏三兩甘草炙三分上每服二錢水一盞荊芥五穗煎至七分去渣熱服如寸脈依前力小加麻黃二分去節同煎服病人兩手脈浮數而緩名曰中風若寸脈力小尺脈力大雖不惡風不自汗此乃陰氣已盛先見於脈若不投藥和之後必惡風自汗出若立春以後清明以前宜薄荷湯主之清明以後芒種以前宜防風湯主之芒種以後至立秋以前宜香芎湯主之薄荷湯薄荷一兩葛根半兩人參二分甘草炙半兩防風去蘆一兩上㕮咀每服三錢水一盞煎至七分去渣熱服如三五服寸脈力尚小加薄荷二分同煎防風湯防風去蘆一兩桔梗三錢甘草半兩炙旋覆花半兩厚朴三分上㕮咀每服三錢水二盞姜一塊同煎熱服如三五服寸脈力尚小加荊芥五七穗同煎香芎湯川芎一分石膏二兩升麻三兩甘草炙半兩厚朴制半兩上㕮咀每服二錢水二盞煎七分溫服如三五服後寸脈力尚小加細辛二分同煎前二段文將中風傷寒各立法者何蓋謂病人始得病三日以前或因中風脈緩或因傷寒脈緊然脈雖先見而症猶未見尚可以藥解之故立方耳病人兩手脈浮數或緊緩寸脈短反力小於關尺脈者此名陰盛陽虛也若自汗出惡風是邪氣在表陰氣有餘也素問云陰氣有餘為多汗身寒即可投消陰助陽表劑以治之若立春以後清明以前宜六物麻黃湯主之清明以後芒種以前宜七物柴胡湯主之芒種以後立秋以前宜發表湯主之六物麻黃湯麻黃去節一兩葛根七錢半人參五錢甘草炙五錢蒼朮七錢半上㕮咀每服三錢水一盞棗二枚煎七分熱服如三五服後汗未止惡風者加荊芥三分三五服後不惡風猶汗者加丁香皮半兩一方又加荊芥七錢七物柴胡湯柴胡二兩蒼朮荊芥麻黃各一兩甘草炙七錢上㕮咀每服三錢水一盞姜一塊棗二枚同煎七分熱服如三五服後汗未止惡風者入蔥白三寸如三五服後汗未止者加當歸一兩同煎發表湯麻黃去節一兩蒼朮二兩人參當歸各半兩甘草炙三分丁香皮三分上㕮咀每服三錢水一盞入姜一塊棗三枚同煎至七分去渣熱服如三五服汗未止猶惡風者加桂枝三分如汗未止更加細辛半兩以汗止為度病人脈浮數或緊或緩其脈上出魚際寸脈大於關尺者此名陽盛陰虛也若發冒悶口燥咽乾者乃是邪氣在表陽氣獨有餘也素問曰陽氣有餘為身熱無汗是也可投消陽助陰藥以解表若立春後至清明以前宜人參湯主之清明以後至芒種以前宜前胡湯主之芒種以後至立秋以前宜石膏湯主之人參湯人參半兩芍藥三分石膏二兩柴胡甘草炙三分上㕮咀每服三錢水一盞姜一塊煎七分熱服如三五服後熱不解者入豉三十粒同煎服前胡湯方缺宜尋祗和方補之傷寒便覽有前胡湯方用石膏一兩前胡半兩竹茹黃芩知母山梔大青各三兩薑蔥煎服疑即是此石膏湯石膏三兩芍藥一兩升麻三分黃芩三分柴胡一兩甘草炙三分上㕮咀每服三錢水一盞半豆一合煎八分熱服如三五服後熱未解者加知母一兩又未解加大黃一兩病人兩手脈浮數或緊或緩三部俱有力無汗惡風者此是陰陽氣俱有餘素問曰陰陽有餘則無汗而寒是也可用藥平之若立春以後至清明以前宜解肌湯主之清明以後至芒種以前宜芍藥湯主之芒種以後至立秋以前宜知母湯主之解肌湯石膏二兩麻黃去節三分甘草炙升麻各半兩上㕮咀每服三錢水一盞入豉半合煎至八分去渣熱服如三五服後猶惡風者加麻黃半兩石膏一兩芍藥湯甘草炙半兩芍藥一兩石膏三兩荊芥穗一兩上㕮咀每服三錢水一盞生薑一塊煎至七分去渣熱服如三五服後猶惡風者每服加生薑一塊同煎服知母湯知母石膏麻黃升麻各一兩甘草炙半兩上㕮咀每服三錢水一盞入生薑一塊同煎至七分去渣溫服如三五服後猶惡風者加麻黃半兩升麻半兩前三段文將中風傷寒一法治者因病人始得病後脈症俱見若投解劑必不能愈故立前方同法治之仲景云傷寒為病脈緩者名中風脈緊者名傷寒今分此二端何也始因冬寒毒之氣中人其內伏之陽沉潛於骨髓之內每至春夏發時或因外傷寒而引內邪出或因外傷風而引內邪出及乎內邪既出而為病一也古人云立此二端恐後人疑其緊脈與緩脈治別也若中風與傷寒脈異何故仲景無別法治之此乃後人不究仲景之心也病人始得病一二日至五六日尚有表脈及表症亦可依脈症投藥凡投解表及發表藥每一日可飲三服病症甚可至五服外不可頓服藥也如症未解次日依前再投如症依前未解可作熱粥投之粥內加蔥白亦可如有汗出勿厚衣蓋覆恐汗出太過作亡陽症也海藏云韓氏微旨可汗一篇有和解因時法言傷寒之脈頭小尾大傷風之脈頭大尾小李思訓保命新書亦分尺寸與仲景同之非若前人總言尺寸脈俱浮而緊尺寸脈俱浮而緩緊則為傷寒無汗緩則為傷風自汗又有傷寒有汗者傷風無汗者脈亦互差與症不同前人已盡之矣惟韓李所言頭小尾大即為傷寒尾小頭大即為傷風人病間有脈症未顯於尺寸者故韓李述為和解因時法也又恐後人疑其不與前聖合遂於本方內又立加減法數條亦不越前人之意何其當哉蓋二公者當宋全盛之時故又戒麻黃桂枝不可輕用改用石膏升麻葛根柴胡之平劑當時則可非百代常行之道時世遷移之法也可汗一篇若隨湯液隨症應見自有定規雖明哲不可逾也又寸口脈小飲冷與霧露所傷同作中焦治今韓李云傷寒寸小者勿認與飲冷霧露同傷一體也飲冷霧露所傷寸口舉按全無是陰氣在胃不和陽氣不能升越也傷寒寸口小者只於關部下至膀胱本部見之寸口雖小只是舉之微小沉得之有也非若飲冷舉按全無也若果寸口舉按全無即不可解表只宜溫中不可不知韓氏溫中法夫傷寒之說始自黃帝以開其端至於仲景方陳其條目自後膚淺之學莫知其數立言者只云病在表可發汗病在裡可下或云不可汗不可下未嘗有溫中之說仲景傷寒例云尺寸俱沉細太陰受病也尺寸俱沉少陰受病也尺寸俱微緩厥陰受病也又辨太陰症云太陰病脈浮可發汗宜桂枝湯又手足溫自利不渴者宜四逆湯又腹滿時痛桂枝加芍藥湯辨少陰證云少陰病始得之發熱脈沉者麻黃附子細辛湯又少陰病二三日麻黃附子甘草湯又少陰病手足寒身體痛骨節疼脈沉者附子湯又厥陰病吐利手足逆冷煩躁欲死者吳茱萸湯又少陰病脈沉急溫之宜四逆湯今舉仲景論中數條最是三陰病之良法於今世用之尚有未盡證者愚常校之自至和初歲迄於今三十餘年不以歲之太過不及為則每至夏至以前有病傷寒人十中七八兩手脈俱沉細數多是胸膈滿悶或嘔逆或氣塞或腸鳴或腹痛與仲景三陰病說理同而證不同因茲不敢妄投仲景三陰藥方才見脈沉及胸膈滿便投下藥下之往往不救常斟酌仲景理中丸與服之其病勢輕者胸中便快其病勢重者半日許滿悶依然或有病人脈沉細遲投仲景四逆湯溫之多藥力大熱後必發煩躁因校量此形證今別立方以治之藥多對證不可不傳焉病人但兩手脈沉細數或有力或無力或關脈短及力小胸膈塞滿氣短不能相接者便可隨脈證投溫中藥以治之病人兩手脈沉遲或緊皆是胃中寒也若寸脈短及力小於關尺者此陰盛陽虛也或胸膈滿悶腹中脹滿身體拘急手足逆冷急宜溫之若立春以後至清明以前宜溫中湯主之清明以後至芒種以前宜陳皮湯主之芒種以後至立秋以前宜七物理中丸主之溫中湯丁皮一兩乾薑炮白朮陳皮丁香各二錢厚朴一兩制上為細末每服二錢水一盞蔥白三寸荊芥五穗煎至七分去渣熱服如未快手足尚逆嘔吐者加丁香乾薑各二錢陳皮湯陳皮一兩藿香三錢白朮葛根各二錢厚朴一兩制上為末每服二錢水一盞姜一塊同煎至七分去渣熱服如三服未快手足尚逆嘔吐不定者加半夏丁香桂枝各半兩每服加蔥白三寸煎服七物理中丸白朮五錢乾薑二錢半人參七錢半桔梗七錢乾葛七錢半藿香葉五錢甘草二錢炙上為細末煉蜜為丸如彈子大每服一丸水一盞煎八分和渣熱服如三服未快手足尚逆嘔者加半夏生薑各半兩病人兩手脈沉細無力雖三部脈力停等亦是陰氣盛也更不須候寸脈短治之或胸脅滿悶身體拘急疼痛手足逆冷速宜溫中藥和之若立春以後至清明以前宜厚朴丸主之清明以後至芒種以前宜白朮湯主之芒種以後至立秋以前宜橘皮湯主之厚朴丸當歸半兩丁皮半兩厚朴一兩制細辛二錢半人參七錢半甘草半兩炙乾薑半兩炮上為末煉蜜為丸彈子大每服一丸煎至六分和渣熱服三服後脈尚細及寸脈尚細無力者每服加蔥白三寸同煎服白朮湯白朮半夏當歸厚朴制乾薑炮各半兩丁香七錢上為末每服三錢水一盞姜一大片煎至七分去渣熱服三五服後脈未有力寸脈尚小者加細辛半兩每服加蔥白三寸同煎服橘皮湯橘皮半兩藿香葛根各三錢半夏厚朴制各半兩上為末每服三錢水一盞生薑如棗大同煎至七分去渣熱服三五服後脈尚小手足逆冷者加細辛半兩病人胸膈滿悶時時嘔逆肢節痛兩脅下痛腹中鳴此是停飲宜二苓湯赤茯苓木豬苓白朮各半兩滑石一兩通草白豆蔻各二錢半丁香皮七錢半陳皮半兩桂枝五錢上為末每服三錢水一盞煎至七分去渣熱服小便未快加瞿麥七錢半嘔未止加半夏半兩淅淅惡寒甚每服加蔥白三寸灰包熨法病人服前藥胸膈不滿悶者此上焦有陽也或藥力太過上焦有熱腹滿虛鳴時時疼痛此是被陽藥消逐得上焦陰氣併入下焦也雖是下焦積寒冷奈上焦陽盛更難用溫下焦藥也當用灰包熨之其法用稻草灰或桑柴灰二三升許入好醋拌和乾溼得所銚內炒令灰熱以帛包裹置臍下熨之頻先炒灰包常更換令常熱以腹不滿痛為度初熨時病人不受者勿聽但令亟熨之不住可也如灰包熨後得下利三兩行或小便二三升或微似有汗此是陰氣外出或下泄也勿疑之病輕者乃得愈後出餘氣而解病人三部脈沉寸脈小於關尺此為陰盛當溫中藥以消陰氣宜厚朴丸厚朴丸人參白朮厚朴陳皮藿香當歸細辛神術湯亦同治陰躁而渴不可誤用涼藥若熱藥冷服內有伏陽則可若脈已虛按之全無力或病人素無食養者只可溫服
