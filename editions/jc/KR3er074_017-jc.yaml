body:
  text: 卷之十七心小腸部諸見血門垣衄血出於肺以犀角升麻梔子黃芩芍藥生地紫參丹參阿膠之類主之咯唾血者出於腎以天門麥門貝母知母桔梗百部黃柏遠志熟地黃之類主之如有寒者乾薑肉桂之類主之痰涎血者出於脾葛根黃耆黃連芍藥甘草當歸沉香之類主之嘔血出於胃實者犀角地黃湯主之虛者小建中湯加黃連主之榮之生病也寒熱少氣血上下行方見寒熱素帝曰有病胸脅支滿者妨於食病至則先聞腥臊臭出清液先唾血四肢清目眩時時前後血病名為何何以得之岐伯曰病名血枯此得之年少時有所大脫血若醉入房中氣竭肝傷故月事衰少不來也帝曰治之奈何復以何術岐伯曰以四烏鰂骨一蘆茹二物併合之丸以雀卵大如小豆以五丸為後飯飲以鮑魚汁利腸中及傷肝也腹中論潔諸見血無寒衄血吐血溺血皆屬於熱但血家症宜服生地黃散主之生地熟地枸杞子地骨皮甘草天門冬黃耆芍藥黃芩上銼每一兩水盞半煎一盞去滓溫服脈微身涼惡風每一兩加桂半錢吐血者多有此證海龍腦雞蘇丸治上焦熱除煩解勞去肺熱咳衄血熱驚悸脾胃熱口甘吐血肝膽熱泣出口苦腎熱神志不定上而酒毒膈熱消渴下而血滯五淋血崩等疾薄荷一斤麥冬去心二兩甘草一兩半生地六兩黃耆新蒲黃炒阿膠炒二兩黃連一兩人參二兩以上俱末木通二兩銀柴胡二兩銼同木通沸湯浸一日夜絞汁上為細末好蜜二斤先煎一二沸然後下生地黃末不住手攪時加木通柴胡汁浸熬成膏勿令火緊焦了然後加前藥末和丸如豌豆大每服二十丸白湯下虛勞虛煩梔子湯下肺熱黃芩湯下心熱悸動恍惚人參湯下唾咳吐衄四血去心麥門冬湯下肝熱防風湯下腎熱黃柏湯下以上並食後臨臥服治五淋及婦人漏下車前子湯下痰嗽者生薑湯下莖中痛者蒲黃滑石水一鐘調下氣逆者橘皮湯下室女虛勞寒熱潮作柴胡人參湯下梅治吐血下血並婦人漏下雞蘇莖葉煎取汁飲之海胸中聚集之殘火腹裡積久之太陰上下隔絕脈絡部分陰陽不通用苦熱以定於中使辛熱以行於外升以甘溫降以辛潤化嚴肅為春溫變凜冽為和氣汗而愈也然餘毒土苴猶有存者周身陽和尚未泰然胸中微躁而思涼飲因食冷物服涼劑陽氣復消余陰再作脈退而小弦細而遲激而為衄血唾血者有之心肺受邪也下而為便血溺血者有之腎肝受邪也三焦出血色紫不鮮此重沓寒濕化毒凝泣水穀道路浸漬而成若見血證不詳本源便用涼折變乃生矣陽證溢出鮮血陰證下如豚肝上而血者黃耆桂枝湯白芍當歸湯中而血者當歸建中湯增損胃風湯下而血者芎歸朮附湯桂附六合湯若三血證在行陽二十五度見黃耆四君子湯主之若三血證在行陰二十五度見當歸四逆加吳茱萸主之玄血證吐血衄血便血其人陰虛陽走其脈沉而散其外證虛寒無熱候宜烏金丸散止之法宜上用散下用丸次以木香理中湯加大七氣湯入川芎煎調蘇合香丸溫之運氣上下出血有四一曰熱助心火甚而血湧沸也經云歲火太過炎暑流行肺金受邪民病血溢血泄又云少陽之復火氣內發血溢血泄王注謂血上七竅為血溢泄利便血為血泄者是也二曰寒攻心火虛而血逃亡也經云太陽司天寒淫所勝血變於中民病嘔血血泄鼽衄善悲又云太陽在泉寒淫所勝民病血見是也三曰濕勝血亡經云太陰在泉濕淫所勝民病血見是也四曰寒熱凌犯血亡經云少陰司天之政水火寒熱持於氣交熱病生於上冷病生於下寒熱凌犯而爭於中民病血溢血泄是也丹血餘散治血淋兼治內崩吐血舌上出血小便出血用亂髮皂角水淨洗曬乾燒灰為末每二錢以茅草根車前草煎湯調下本草謂發灰消瘀血通關格利水道破癥瘕血衄有人生血瘤大如慄常被衣擦破則血出不止用此血餘灰敷之愈一人刀傷血流不止用胎髮灰敷之亦愈海孫真人九竅出血方荊葉搗取汁酒和服之丹九竅出血以刺薊一握絞汁以酒半盞和服之如無生者搗乾者為末冷水調三錢舌上無故出血如線用槐花炒研末用手摻之肘舌上忽出血如簪孔者香薷汁服一升日三服無用發灰二錢米醋二合調服或敷舌上血出孔處文蛤散治熱壅舌上出血如泉五倍子洗白膠香牡蠣粉各等分上為末每用少許摻患處或燒熱鐵烙孔上丹治陰虛牙出鮮血氣鬱以四物加牛膝香附生甘草側柏羅牙疼腫癢動搖牙齦潰爛宣露出血口氣等疾當歸藁本地骨皮防風白芷槐花川芎甘草炙升麻細辛各等分上為細末每用少許擦牙痛甚者取三錢水一盞半黑豆半合生薑三斤煎至一盞去渣熱漱冷吐之孫治滿口齒有血枸杞根為末煎湯漱後吃又治膈上吐血妙衍齒縫中多出血當以鹽湯漱又能益齒走血之驗也丹齒痛齦出血夜以鹽厚敷齦上有涎瀝盡乃臥涎出時叩齒勿住十夜瘥忌魚肉熱物肘齒間出血不止苦竹茹以醋浸一宿含之千濃煎竹葉湯入鹽少許含之止濃煎茶含漱亦妙治牙血用附米白芷大黃三物燒灰以青鹽和擦之本治一切牙疼風熱齦常出鮮血以至崩落口臭不可近人者宜服之大黃米泔浸令軟生地黃大者薄切上二味旋切各用一片二片合定貼所患牙上一夜即愈未全可則再如前法用忌說話恐引風毒津液漬痛處世無故牙動牙宣血出香附米用薑汁浸一宿曬乾為末漱口揩齒令白且堅而不動無血矣又方以楊梅樹皮濃煎湯漱口勿咽神妙千治齒齦間津液出血不止以礬石一兩燒水三升煮取一升先拭齒乃含之衍有人病齒縫中血出以紙捻蘸蟾酥少許於血出處按之立止靈苑治虛氣攻牙齒痛血出牙齦癢痛骨碎補二兩細銼炒令黑色杵末依常盥漱後揩齒齦下良久吐之臨臥後咽之無妨無治耳中出血以龍骨末吹入即止病者汗出汙衣名曰汗血皆由大喜傷心喜則氣散血隨氣行婦人產蓐有此證治以葎草汁葎草不拘多少俗名葛勒蔓也蔓生葉似蓖麻而小薄有細刺花黃白子如麻子上搗汁二升醋二合和空腹飲一盞或煮濃飲亦治淋瀝尿血上九竅血舌血牙血汗血不愈又當於衄血吐血條相參用之潔衄血吐血下血婦人下血不止隱白五分灸東又法隱白大陵神門各五分太谿七分心婦人經脈妄行鑽心脅疼妄行於上則衄血中則吐血下則下血啞門一分治衄血巨闕一分治吐血氣海五分治崩血中極三分補三陰交五分海血證與黃證俱頭汗出垣血溢上行或唾或嘔或吐皆凶也若變而行下為惡利者順也血上行為逆其治難下行為順其治易故仲景云蓄血症下血者當自愈意同若無病之人忽然下利者其病進也今病血症上行而復下行惡利者其邪欲去是知吉也脈沉為在裡榮衛內結胸滿必吐血仲尺脈浮目睛暈黃衄未止暈黃去目睛慧了知衄今止病人面無血色無寒熱脈沉弦者衄也浮弱手按之絕者下血煩咳者必吐血心脈微澀為血溢全文見診下同肺脈滑甚為唾血肺脈微滑為上下出血仲脈弦而大弦則為減大則為芤減則為寒芤則為虛虛寒相搏此名曰革婦人則半產漏下男子則亡血失精素脫血而脈實者難治玉機真藏論衄而不止脈大而逆也全文見診生死難病若吐血復鼽衄脈當沉細反浮大而牢者死吐血衄血脈滑弱小者生實大者死汗出若衄其脈滑小者生大躁者死嘔血胸滿引背脈小而疾者逆也全文見診生死素脈至而搏血衄身熱者死大奇論仲吐血咳逆上氣其脈數而有熱不得臥者死垣諸見血身熱脈大者難治難治者邪勝也身涼脈靜者易治易治者正氣復也衄血者若但頭汗出身無汗及汗出不至足者死素咸走血血病無多食鹹宣明五氣篇衄血無止衄散黃耆六錢赤茯苓白芍藥各三錢當歸生地阿膠炒各三錢上為細末煎黃耆湯調下三錢未止再服垣治血衄不愈以三稜針於氣衝上出血立愈更服此藥尤妙五味子十粒麥門冬去心五分當歸五分黃耆一錢生地三分人參五分上㕮咀作一服水二盞煎一盞空心熱服丹鼻血不止諸方不效糯米炒微黃為末新水下二錢此方甚妙梅治鼻衄出血眩冒欲死燒亂髮細研水服方寸匕須臾吹鼻中瘥保衄血先服硃砂蛤粉次服木香黃連大便結者下之用大黃芒硝甘草生地溏軟者梔子黃芩黃連可選用之丹衄血以涼血行血為主犀角地黃湯入鬱金同用丹溪云犀角性走散血虛者用之禍至虞世治咯血衄血白芍藥一兩犀角一分為末新水服一錢匕衄止為限竹畫粉散治鼻衄血不止一二服除根白土即畫匠所用畫粉研極細每服五錢新井水調服立止世人中白為末白湯調服治衄累效羅生地黃湯治鼻衄昏迷不省生地三五斤不暇取汁使患人生吃呷汁三斤許又以其渣塞鼻須臾血止取汁尤佳保衄血不止麥門冬飲子麥門冬去心生地黃上切水煎服孫凡治鼻衄及膈上熱盛乾地黃龍腦薄荷等分為末冷水下丹鼻衄脈數有熱人參三分黃柏炒二分黃連五分地黃一錢歸尾五分甘草二分黃芩五分芍藥一錢玄鼻衄血者初出多不能止用黃丹吹入鼻中乃肺金受相火所制然也宜生料雞蘇散治之雞蘇葉黃耆去蘆生地阿膠白茅根各一兩麥門冬去心桔梗蒲黃炒貝母去心甘草炙各五錢上㕮咀每服四錢姜三片水煎服衍治大熱衄血用萱草根洗淨研汁一大盞生薑汁半盞相和時時細呷丹溪云萱草屬水性下行陰分丹鼻血貫眾根細末水調一錢匕立止羅寸金散治鼻衄不止黃藥子五錢土馬鬃半兩有足者生甘草炙一錢上為細末每服二錢新水調下未止再服立瘥本草云土馬鬃即苔與垣衣之類垣衣生牆垣之側土馬鬃生垣牆之上背陰古牆上多有之簡治鼻衄不止黃藥子為末每服二錢匕煎薄荷湯下良久以新汲水調面末二匙頓服之山衄飛面二錢鹽一錢新汲水調下世衄血用蛀竹末米飲調服驗膽移熱於腦則辛頞鼻淵傳為衄衊全文見診病傳變河定命散治膽受熱熱血妄行鼻中衄衊並血汗不止硃砂寒水石麝香上為末每服半錢新汲水調下不計時候看老幼虛實加減脈寸口脈微苦寒為衄宜服五味子湯磨茱萸膏令汗出方未考予男衄寸口脈微小用寒涼藥不止後用小建中湯加梔仁黃芩黃柏一服立愈丹七叔婆鼻塞時有血些少出羌活獨活防風升麻乾葛蒼朮陳皮一錢甘草炙白芷麻黃黃耆分二帖入開口紅椒七粒棗二枚去核蔥白三根水二盞煎取淺盞稍熱飲之春善病鼽衄全文見五臟仲從春至夏衄者太陽從秋至冬衄者陽明丹衄血不止以養胃湯一帖煎服效一方治衄血妄行用百藥煎半燒半生和水酒調服本茜梅丸治衄血無時茜草根艾葉各一兩烏梅肉焙乾半兩上為細末煉蜜丸如桐子大烏梅湯下三十丸運氣衄有三一曰熱助心火而血溢為衄經云少陰所至為衄衊又云少陰司天熱氣下臨肺氣上從鼽衄鼻窒又云少陰司天熱淫所勝民病鼽衄又云少陽司天三之氣炎暑至其病血溢鼽衄又云少陽司天火氣下臨肺氣上從鼽衄鼻窒又云少陽司天火淫所勝病甚則鼽衄又云少陽之復大熱將至咳衄必也二曰寒攻心火而血逃為衄經云太陰司天寒淫所勝嘔血血泄鼽衄善悲時眩僕也三曰寒熱相逼而衄經云陽明司天之政初之氣陰始凝氣始肅民病中熱鼽衄此外寒鬱內熱而衄也又云少陰司天之政四之氣寒熱互至民病鼽此下寒迫上熱而衄也世衄血白芨末新汲水調下神妙御院麝香散治鼻衄不止白礬枯過另研白龍骨黏舌者另研各半兩麝香另研半字上三味杵和勻每用一字先將冷水洗淨鼻內血涕然後吹藥於鼻中或以濕紙蘸藥塞鼻尤妙廣治鼻中衄血及咯吐血不止五色龍骨作末吹一豆許於鼻中立止圖榴花百葉者主心熱吐血及衄血等干之作末吹鼻中立瘥以上皆澀劑亂髮微溫主咳嗽五淋大小便不通小兒驚癇止血鼻衄燒之吹鼻內立已發灰破活血補陰本山梔不拘多少燒存性為末搐入鼻中立愈蔡子渥傳云同官趙無疵其兄衄血甚已死入殮血尚未止偶一道人過聞其家哭詢問其由道人云曾服丹或燒煉藥予有藥用之即出此藥半錢匕吹入鼻中良久得活並傳此方世治鼻衄人中白系尿缸結者燒灰少許吹入鼻中以上寒劑本鼻衄過多昏冒欲死用香墨濃研點入鼻中丹鼻血龍腦葉研塞立止入豉尤妙勝金治衄血以蔥白一握搗汁投酒少許抄三四滴入鼻中瘥無白芨散治鼻衄立效白芨不拘多少為末冷水調用紙花貼鼻窊中一方用黃膠湯浸令軟貼鼻窊中鼻窊山根也垣治鼻衄久不止或素有熱而暴作者諸藥不效神法以大白紙一張作十數折於冷水內浸濕置頂中以熱熨斗熨之至一重或二重紙干立止簡治鼻血不止服藥不應宜用蒜一枚去皮細研如泥攤一餅子如錢大厚一豆許左鼻血出貼左腳心右鼻血出貼右腳心如兩邊俱出貼兩腳心即瘥血止即以溫水洗去之一法用紙丸兒右衄塞左耳左衄塞右耳又冷水調白麵飲之治衄不止百藥不效因心憂慮得者急縛兩手中指上立止針灸衄取四經其一取足手太陽經云衄而不止血流取足太陽大衄衃血取手太陽不已取腕骨下不已刺膕中出血又云膀胱足太陽之脈所生病者鼽衄項背腰尻膕端痛視盛虛熱寒陷下取之又云足太陽之別名曰飛陽去踝七寸別走少陰虛則鼽衄取之所別也其二取足手陽明經云胃足陽明之脈所生病者鼽衄又云大腸手陽明之脈所生病者目黃口乾鼽衄皆視盛虛熱寒陷下取之又云邪客於足陽明之絡令人鼽衄上齒寒刺足中指次指爪甲上與肉交者各一痏左刺右右刺左摘衄血喑門三分合谷內庭密又法喑門三里瀉照海五分世又法三里外關瀉重者風府集又法風府上星百勞合谷不已取後穴迎香人中印堂口鼻出血不止上星灸三報之甲頭腦中寒鼻衄目泣出神庭主之衄血不止承漿及委中主之鼽衄腰脊腳腨酸重戰慄不久立腨如裂腳跟急痛足攣引少腹痛咽喉痛大便難䐜脹承山主之頭重鼻鼽反瘛瘲汗不出煩心足下熱不欲近衣項痛目翳及小便皆不利至陰主之診衄法見諸見血門久衄世久衄炒糯米為末水調服神妙詳見衄垣黃耆芍藥湯治鼻衄血面多黃眼澀多眩手麻木張彥明男衄血多歲不效用此方黃耆一兩甘草炙二兩升麻一兩葛根羌活各半兩白芍藥二錢上為粗末每服半兩水二盞煎至一盞去滓溫服二十五帖而愈六脈細弦而澀按之空虛其色必白而夭不澤者脫血也此大寒證以辛溫補之以養血以甘溫潤之劑佐之即愈此脫血傷精氣之證也六脈俱大按之空虛心動面赤善驚上熱乃手少陰心之脈也此因氣盛多而亡血以甘寒鎮墜之劑瀉火與氣以墜浮氣以辛溫微苦峻補其血再用三黃補血湯三黃補血湯熟地二錢生地三錢當歸柴胡各錢半白芍藥五錢川芎二錢牡丹皮升麻黃耆各一錢補之治血溢者上竭上為粗末每服半兩水二盞煎五沸去渣溫服食前兩手脈芤兩頭則有中間全無而虛曰芤血至胸中或衄血吐血以犀角地黃湯主之羅地黃散治衄血往來久不愈生地熟地枸杞子地骨皮各等分上為細末每服二錢蜜湯調下日三服世治鼻血常發者於發時用生薑杵碎合額上一日如癢就搔之永不再發肘治人少小鼻衄小勞輒出桑耳無多少炒令焦搗末每衄發以杏仁大塞鼻中數度可大病瘥後小勞便鼻衄牡蠣一分石膏五分搗末酒服方寸匕日三四服亦可蜜丸如桐子大服之產後衄大產後口鼻黑氣起及鼻衄者名曰胃絕肺敗此證不可治遇有此疾急取緋線一條併產婦頂心發兩條緊繫中指節即止治產後鼻衄中風以荊芥為末童便調下神驗此方氣虛人勿用吐血丹治吐血以人參一味為末雞子清投新汲水調下一錢服之千金方垣人參救肺湯治吐血亦用人參升麻柴胡歸梢蒼朮各一錢熟地白芍藥黃耆各二錢陳皮蘇木甘草各五分上為粗末作一服水二盞煎一盞去滓稍熱食前服局必勝散治血妄流溢或吐或衄小薊並根用人參去蘆蒲黃炒當歸熟地川芎烏梅去核各等分上㕮咀每服四錢水一盞煎七分溫服不拘時保雞蘇散治虛損氣逆吐血不止雞蘇葉黃芩刺薊生地阿膠黃耆各一兩當歸赤芍藥各半兩伏龍肝二兩上為粗末每服四錢姜三片竹茹彈子大水同煎丹朱富六因辛苦吐血或衄夜間發熱口乾身疼食少當作虛勞治白朮六錢半人參青皮炒生地芍藥陳皮歸尾甘草炙半兩川芎三錢紅花五分分十帖水二盞煎至三之一食前稍熱飲下保和丸十四粒與點丸十粒一婦人年五十餘嘗吐血今又作面黃身蠕動食少青皮半兩人參三錢半白朮陳皮各三錢白芍藥木通各二錢黃連炒乾薑黃芩炒川芎各錢半黃柏炒一錢生甘草生地各錢半歸頭二錢分七帖水二盞煎至三分之一去滓入藕汁半盞再煎沸通口飲之夫口鼻出血皆系陽盛陰虛有升無降血隨氣上越出上竅法當補陰抑陽氣降則血歸經也大補血丸治陰虛吐血當歸一錢生地一錢半上以杜牛膝汁浸三日取起酒洗淨入臼內杵千杵為丸桐子大白湯下梅治吐血神效方生地黃汁一升二合白膠香二兩以瓷器盛入甑蒸令膠消服妙一方獨用生地黃汁半升飲之立止神妙云五神湯治婦人熱毒上攻吐血不止生藕汁刺薊汁生地汁各二盞生薑汁半盞白蜜一盞上和煎三兩沸無時以一小盞調炒麵一錢食前服聖惠治心熱吐血口乾獨用刺薊搗絞取汁一小盞服大四生丸治吐血衄血陽乘於陰血熱妄行生荷葉生艾葉生柏葉生地黃各等分上研爛丸如雞子大每服一丸水三盞煎一盞濾過溫服經驗治吐血咯血一味荷葉焙乾為末米湯下二錢匕亦佳又山居治吐血一味側柏葉研細酒調服妙丹經血逆行或血腥或吐血用韭菜汁服立效簡治吐血咯血蒲黃一兩搗為散每服三錢溫酒或冷水調服妙治吐血茜草一兩生搗羅為散每服三錢水一盞煎七分放冷食後服世治內損吐血飛羅面不以多少微炒濃磨細墨一匙茶調下二錢立效又方治吐血用松煙墨磨汁服立效衍治大吐血好墨細末二錢以白湯化阿膠清稠稀得所頓服熱多者尤相宜丹先見紅後見痰多是陰虛火逆痰不下降四物湯加痰火藥治火血上錯經妄行四物湯加炒山梔童便薑汁此後諸方用童便薑汁雖無痰亦吐血要藥也治吐血衄血用鬱金為末以童便薑汁好酒調服一方不用酒治吐血紅山茶花陰乾為末每服一錢用童便半鍾生薑汁少許調服本治吐血鼻紅生薑二分絞汁並壯健丈夫小便一升乘熱頓飲瘥丹又方以童便一分酒半分擂柏葉溫飲之吐血挾痰積方可下若一碗兩碗吐者只補陰降火用四物大劑之類挾痰若用血藥則泥而不行只治火其血自止山梔最清胃脘血玄吐血者由憂思諸氣鬱極方散而生熱則心血妄行宜玄明粉加黃丹服之次用四物解毒加藕節治之如前症之熱並宜清之仲心氣不足吐血衄血瀉心湯主之亦治霍亂大黃二兩黃連黃芩各一兩上三味以水三升煮取一升頓服之海云岐子犀角地黃湯治寸芤血在上焦生地二兩黃芩一兩半黃連一兩大黃半兩上㕮咀秤一兩水二盞煎去滓食後服之簡治吐血川大黃一兩搗為散每一錢生地黃汁一合水半盞煎三五沸無時服丹吐血覺胸中氣塞上吐紫血桃仁承氣湯下之馮舅氣上奔吐血心膈疼枳殼三錢青皮二錢生地木通牡丹皮一錢半桃仁二十八個川芎黃芩黃連一錢甘草少生乾薑桔梗分四帖煎服或暴吐紫血一碗者無事吐出好此熱傷血死肝中宜服四物解毒之類千治墜馬積血心胃唾血無數乾荷花根為末酒服方寸匕日三服無加味芎歸湯治打撲傷損敗血流入胃脘嘔吐黑血或如豆羹汁川芎當歸白芍藥百合水浸半日荊芥穗各等分上銼散每四錢水一盞酒半盞煎七分去滓不拘時候仲夫酒客咳者必致吐血此因極飲過度所致也此即肺疽之屬千吐血有三種有內衄有肺疽有傷胃內衄者出血如鼻衄但不從鼻孔出是近從心肺間津液出還流入胃中或如豆羹汁或如切𧗐血凝停胃中因即滿悶便吐或去數斗至一石者是也得之於勞倦飲食過常也肺疽者或飲酒之後毒滿悶吐之時血從吐後出或一合半升一升是也傷胃者因飲食太飽之後胃中冷不能消化便煩悶強嘔吐使所食之物與氣共上衝蹙因傷裂胃口吐血色鮮正赤腹亦絞痛自汗出其脈緊而數者為難治也𧗐韻書音戡凝血也無理中湯能止傷胃吐血以其方最理中脘分利陰陽安定血脈海藏亦云飲冷傷脾吐血以理中湯理治中脘分利陰陽此亦理治內衄之法也方見傷寒二合灰散治因啖辛熱嘔吐出血一合或半升許名曰肺疽紅棗和核燒存性百藥煎煅各等分上為細末每服二錢米飲調下除濕湯治冒雨著濕鬱於經絡血溢作衄及血溢流入胃胃滿吐血茯苓乾薑各四錢甘草炙白朮各二錢上銼每服四錢水一大盞煎八分去滓服頭疼加川芎二錢最止浴室中發衄此方治冒雨吐血理中湯治傷胃吐血皆用乾薑為君丹溪治大吐血不止亦用乾薑一味炮為末童便調服從治之者可見乾薑亦為吐血要藥也丹男子年十七家貧而多勞十一月得寒病時吐三兩口血六脈緊澀一日食減中痞醫投溫膽湯枳桔湯三日後發微熱口乾不渴口中有痰此感寒也詢知云因十日前霜中曾渡三四次溪水心下有悲泣事腹亦飢遂以小建中湯去芍藥加桔梗陳皮半夏四帖而安又方治吐血以交趾桂五錢為末冷水調服亦小建湯治感寒吐血之義經云太陽司天寒淫所勝血變於中嘔血泄血鼽衄平以辛熱者即理中建中用乾薑桂枝治吐血之類皆同也吐血挾熱者治法並見血虛隨火上行條經治嘔血黃柏好者以蜜塗炙乾杵末用麥門冬熱水調下二錢匕立瘥廣治心熱吐血不止生葛根搗汁半大升頓服立瘥吐血挾寒者多是口食寒物身受寒氣之病治法並見內傷飲食外感風寒條仲吐血不止柏葉湯主之柏葉乾薑各二兩艾三把上三味以水五升取馬通汁一升合煮取一升分溫再服馬通即馬屎淋汁廣治吐血鼻衄不止伏龍肝半升以新汲水一大升淘取汁和蜜頓服運氣血溢有五一曰熱助心血沸而溢經云少陽司天之政初之氣候乃大溫其病氣沸於上血溢又云少陰司天客勝甚則血溢又云少陽司天客勝則血溢又云火鬱之發民病血溢治以鹹寒是也二曰寒攻心血逃而溢經云太陽司天之政寒濕之氣持於氣交民病血溢治宜苦以燥之溫之也三曰內火格拒外寒壅遏而血溢經云少陰司天之政終之氣燥令行餘火內格甚則血溢是也四曰風濕相搏血溢及下寒相搏蒸熱於上而血溢經云太陰司天之政初之氣風濕相搏民病血溢此風濕相搏血溢也四之氣畏火臨溽蒸化地氣騰天氣痞隔寒風曉暮蒸熱相搏民病腠理熱血暴溢此地氣之寒相搏天氣蒸熱於上而血溢也五曰燥邪攻肝血溢經云歲金太過燥氣流行病反側咳逆甚而血溢是也素夫傷肺者脾氣不守胃氣不清經氣不為使真藏壞決經脈傍絕五臟漏泄不衄則嘔示從容論傷肺即傷氣當於氣虛不能攝血條參治之羅門冬飲子治脾胃虛弱氣促氣弱精神短少衄血吐血五味子五個甘草芍藥黃耆各一錢紫菀一錢半人參歸身麥門冬上為粗末作二服水煎食後服本天門冬丸治吐血咯血能潤肺止嗽天門冬甘草杏仁炒貝母白茯苓阿膠各半兩上為細末煉蜜丸如彈子大每服一丸咽津含化日夜十丸丹酒色過度飢飽吐血痰血神妙枇杷葉款花北紫菀杏仁去雙仁皮尖鹿茸炙如法桑白皮木通各一兩大黃半兩上煉蜜丸臨臥含化經云怒則氣遂甚則嘔血故氣上矣又云陽氣者大怒則形氣絕而血菀於上使人薄厥此皆怒則傷肝氣而嘔血以黃連香附青黛柴胡甘草平其肝自愈矣宜服赤茯苓瀉心湯世治嘔血咯血衄血肝損白芨為末米飲調服神妙簡治吐血槲葉搗末每服二錢水一盞煎七分和滓服中蠱毒吐血見下血門刺灸吐血有二其一取肺經云暴痹內逆肝相搏血溢鼻口取天府是也其二取筋經云手太陰筋病當所過者支轉筋痛甚成息奔脅急吐血治在燔針劫刺以知為數以痛為腧是也密吐血風府大椎鬲俞肝俞各五分瀉之立愈東又法胃脘亶中肝俞各沿皮二寸半集又法亶中中脘氣海三里乳根支溝不已取下穴肺俞腎俞心俞膏肓關元東嘔血脅痛口乾不可咳引腎痛不容傍刺向外上脘三寸半大陵郄門神門甲嘔血大陵及郄門主之嘔血上氣神門主之心下有膈嘔血上脘主之嘔血肩急脅下痛口乾心痛與背相引不可咳咳則肩痛不容主之肝脈太甚為內癰善嘔衄全文見治虛實法診吐血法見前諸見血門咳唾血丹咳血痰盛身熱多是血虛丹七傷散治勞嗽吐血痰黃藥子白藥子各一兩半赤芍藥七錢半知母玄胡索各半兩鬱金二錢半當歸半兩山藥乳香沒藥血竭各二錢上為末每服二錢茶湯下本草云黃藥子白藥子治肺熱有功一法紅花當歸煎湯下羅恩袍散治咯血吐血及治煩躁真生蒲黃薄荷各一兩上研勻細每服三錢濃煎桑白皮湯調下地黃散治一切吐血咯血能解一切毒及諸熱煩躁茜草根四錢大豆子黃藥子甘草各二兩上為細末每服二錢新汲水調下加人參二兩治痰嗽有血丹痰帶血絲出童便竹瀝主之又方用韭汁童便二物合和加鬱金細研入內服之其血自消經血逆行或血腥吐血唾血韭汁服立效咯血用薑汁童便青黛入血藥中加四物湯牛膝膏地黃膏之類千治一切肺病咳嗽膿血及唾膿血不止方好酥三十斤煉取凝當中醍醐服一合日三升即止一切藥皆不及此方海甘桔加阿膠紫菀湯治肺痿唾膿血方見傷寒咽痛門梅肺疾膿血取薏苡仁十兩杵碎以水三升煎取一升入酒少許服之本草云薏苡仁下氣利腸胃消水腫羅大阿膠丸治嗽血唾血阿膠微炒卷柏生地熟地大薊獨根者曬乾雞蘇葉五味子各一兩柏子仁另研茯苓百部遠志人參麥門冬防風各半兩乾山藥一兩上為細末煉蜜丸如彈子大煎小麥麥門冬湯嚼下一丸食後上方保養精血純補劑也血虛者宜之丹治上氣喘息咳嗽吐血咯血人參細末雞子清調三錢五更初服便去枕睡仰臥只一服愈年深再服忌酸鹹酢醬面等物及過醉飽須好將息一男子三十歲因連夜勞倦不得睡成一痰嗽出白黃膿嗽聲不出時初春大寒醫與青龍湯四帖遂覺咽喉有血絲腥氣逆上兩日後血腥氣多遂有血線一條自口中右邊出直上如此每晝夜十餘次診其脈弦大而散弱左大為甚人倦而苦於嗽予作勞倦感寒強以甘辛燥熱之劑以動其血不宜急治恐成肺痿遂與人參黃耆當歸身白朮芍藥陳皮炙甘草生甘草不去節麻黃煎熟入藕汁與之兩日而病減嗽止卻於前藥去麻黃又與四日而血症除脈之散大者未收斂人亦倦甚遂於前藥中除藕汁加黃芩縮砂半夏至半月而安大劫勞散治肺痿痰嗽痰中有紅線盜汗發熱熱過即冷飲食減少白芍藥六兩黃耆甘草人參當歸半夏白茯苓熟地五味子阿膠炒各二兩上㕮咀每服三錢水盞半生薑二片棗三枚煎九分無時溫服日三陳日華云有女及笄病甚危一歲之間百藥無效偶得此方只一料除根羅五味子黃耆散治嗽咯血成勞眼睛疼四肢困倦腳膝無力麥門冬熟地黃耆桔梗各半兩甘草一分白芍藥五味子二分人參二錢上為粗末每服四錢水煎日三服云岐子芩散涼心肺解勞熱黃耆一兩白芍藥黃芩人參白茯苓麥門冬桔梗生地各半兩上為粗末先用竹葉一握小麥七十粒水三盞姜三片煎一盞半入藥末三錢煎七分去滓溫服席延賞治虛中有熱咳嗽膿血口苦咽乾又不可服涼藥好黃耆四兩甘草一兩為末每服三錢如茶點羹粥中亦可服上參耆例純補劑也丹溪云脈大發熱為氣虛此氣血俱虛者宜之若血虛而氣不虛者不宜當用前阿膠丸之類及汙血條求之丹婦人五十六歲盛夏吐紅痰有一二聲嗽人參一錢防風五分白朮錢半陳皮茯苓各二錢乾薑三分生甘草一分桔梗半錢上煎二之一入藕汁二大蛤再煎帶熱下三黃丸王二十四丈發熱脅痛咳嗽紅痰口渴大便秘倦怠脈稍數而虛詢之發熱曾飲水一碗病因飲食不節成積痰發又飲冷水傷胃成虛傷肺成痰白朮一錢半人參陳皮川芎各一錢芍藥茯苓桔梗甘草各五分炙上作二帖煎取八分入竹瀝二分再煎沸熱飲下龍薈丸二十丸如嗽三十丸上丹溪參朮藕汁竹瀝法也脈大發熱喉中痛者是氣虛用參耆蜜炙黃柏荊芥地黃當歸韭汁童便薑汁磨鬱金飲之其血自消上參耆加鬱金韭汁童便補中解鬱也羅黃耆鱉甲散治虛勞客熱肌肉消瘦四肢倦怠五心煩熱口燥咽乾頰赤心忡日晚潮熱夜有盜汗胸脅不利食減多渴咳嗽稠黏時有膿血黃耆一兩桑白皮半夏黃芩甘草炙知母赤芍藥紫菀各五錢秦艽白茯苓焙生地柴胡地骨皮各六錢六分肉桂人參桔梗各三錢二分鱉甲去裙酥炙天門冬去心焙各一兩上為粗末每服二大錢水一大盞食後煎服人參黃耆散治虛勞客熱肌肉消瘦四肢倦怠五心煩熱咽乾頰赤心忡潮熱盜汗減食咳嗽膿血人參一兩秦艽茯苓各二兩知母二錢半桑白皮一兩半桔梗一兩紫菀柴胡二兩半黃耆三兩半半夏湯洗一兩半鱉甲去裙酥炙二兩上為粗末每服三錢去渣服上參耆鱉甲例補中有通也羅人參蛤蚧散治三二年間肺氣上喘咳嗽咯唾膿血滿面生瘡遍身黃腫蛤蚧一對全者河水浸五宿逐日換水洗去腥氣酥炙黃色杏仁去皮尖炒五兩甘草炙三兩人參茯苓貝母知母桑白皮各二兩上為細末瓷器內盛每日如茶點服神效海蛤蚧補肺勞虛嗽有功治久嗽不愈肺間積虛熱久則成瘡故嗽出膿血曉夕不止喉中氣塞胸膈噎痛用蛤蚧阿膠生犀角鹿角膠羚羊角各一兩除膠外皆為屑次入膠分四服每服用河水三升於銀石器內慢火煮至半升濾去渣臨臥微溫細細呷之其渣候服盡再捶都作一服以水三升煎至半升如前服病人久虛不喜水當減水上蛤蚧例亦補中有通久嗽不愈者宜之麥門冬湯治傷寒後傷肺咳唾膿血胸脅脹滿上氣羸瘦麥門冬去心桑白皮生地各一兩半夏湯洗七次紫菀桔梗炒淡竹茹麻黃去根節各七錢五分五味子甘草炙各半兩上為粗末每服五錢水二盞生薑二錢半棗三枚掰破同煎去渣食後溫服羅續斷散治骨蒸勞熱傳屍瘦病潮熱煩躁喘嗽氣急身疼盜汗兼治咳嗽唾膿血續斷紫菀桔梗青竹茹五味子各三錢生地桑白皮各五兩甘草炙二兩赤小豆半升上為粗末每服三錢入小麥五十粒水煎去渣日三服海紫菀散治咳嗽唾血虛勞症肺痿變癰紫菀人參知母貝母桔梗甘草五味子茯苓阿膠上為粗末生薑水煎服上門冬五味例亦補中有通也外療傷唾血方用茅根一味服方寸匕日三服亦可絞汁飲之主熱渴丹治勞療傳屍寒熱交攻久嗽咯血日漸羸瘦先服三拗湯與蓮心散萬不失一三拗湯麻黃不去節甘草生杏仁不去皮尖上銼碎薑棗煎服蓮心散當歸黃芩甘草炙枳殼炒鱉甲醋炙前胡柴胡防己阿膠蓮肉去心南星各一錢川芎一兩芫花醋炒十分乾黑上十三味㕮咀合和獨芫花另包每服二錢半水一小盞半生薑三片棗一枚入芫花一撮煎八分服無時須吐有異物後芫花漸減蓋芫花反甘草多之所以殺蟲少之所以去寒熱妙處在此方與纂要不同宜考之本治勞療吐血損肺及血妄行神傳膏用剪草一斤婺台州皆有惟婺州者可用狀如茜草又如細辛每用一斤淨洗為末加入生蜜一斤和為膏以器盛之不得犯鐵九蒸九曝日一蒸曝病人五更起面東坐不得語用匙挑藥如粥服每服四兩良久用稀粟米飯壓之藥冷服粥飲亦不可太熱或吐或下皆不妨如久病肺損咯血只一服愈尋常咳嗽血妄行每服一兩可也有一貴人其國封病瘵其尊人常以此方畀之九日而藥成前一夕病者夢人戒令翌日勿亂服藥次日將服之為屋上土墜器中不可服再合既成又將服之為貓覆器又不得服又再合未就而是人卒矣此藥之異如是若小小血妄行一啜而愈或云是陸農師夫人鄉人艾孚先嘗親說此事渠後作大觀本草亦收入集中但人未識不肯信爾外療咳逆唾膿血雞子湯雞子一個甘草炙二分甘遂一分大黃二分黃芩二分上用水六升煮取二升去渣納雞子攪令調盡飲之良忌海藻菘菜子和㶏陽劉氏一男子年二十餘歲病勞嗽咯血吐唾黏臭近不可聞秋冬少緩春夏則甚寒熱往來日晡發作狀如痎瘧寢汗如水累服麻黃根敗蒲扇止汗汗自若也又服寧神散寧肺散止嗽嗽自若也戴人先以獨聖散湧其痰痰狀如雞黃汗隨湧出昏憒三日不省時時飲以涼水精神稍開飲食加進又與人參半夏丸桂苓甘露散服之不數日愈丹台州林德方年二十餘歲得嗽而咯血發熱肌體漸瘦眾醫以補藥調治數年其症愈甚予診其六脈皆澀予曰此好色而多怒精血耗少又因補塞藥太多榮衛不行汙血內積肺氣壅遏不能下降治肺壅非吐不可精血耗少非補不可惟倒倉二者俱備但使之吐多於瀉耳兼灸肺俞五次而愈云雞蘇丸治虛熱昏憒倦怠下虛上壅嗽血衄血雞蘇葉半斤黃耆一兩甘草川芎各半兩防風一兩桔梗半兩荊芥二兩甘菊三錢生地半兩腦子半錢上為細末煉蜜丸如彈子大每服一丸麥門冬去心煎湯嚼下若肺損吐血日漸乏力瘦弱行步不得喘嗽痰涎或發寒熱小便赤澀加車前子二錢用桑枝銼炒香煎湯嚼下脈浮大者作虛治宜虛條下參耆諸方主之若浮大而上壅甚者宜此雞蘇丸方脈沉滑有力者作實治宜實條諸方主之丹先痰嗽後見紅多是痰積熱降痰火為急痰涎帶血出此胃口熱血蒸而出重則山梔輕則藍實荊芥能散喉管痰血咳血方青黛栝蔞實訶子海石山梔上為末薑汁蜜調噙服嗽甚加杏仁後以八物湯加減調理垣鄭仲本年二十三歲因心痛服丹附等藥得上氣病膈兩脅急迫脹觸不快便時嗽咯出血病形漸瘦大便燥而難脈弦數夜間略熱食稍減因與燈籠草和節麻黃細末以白朮桔梗木通甘草湯調下十餘服病減半又與通聖散去石膏為丸以桃仁湯下之經治咯血黃藥子漢防己各一兩為末每服一錢匕水一盞小麥二十粒同煎食後溫服羅珠砂膏鎮心安神解熱及肺損嗽血等疾蒼朮二錢半硃砂另研生犀人參玳瑁甘草炙珍珠末各一兩牛黃麝香龍腦南硼砂琥珀另研羚羊角安息香醋煮另研赤茯苓去皮遠志去心各半兩鐵粉蘇合香油和藥亦得各一兩上為末煉蜜破蘇合香油劑諸藥為小錠子更以金箔裹之瓷器收貯每服一皂子大食後噙化衛尉葉丞得效並阿膠丸相雜服此藥治血安神更勝至寶丹每兩作五錠子肺熱咳唾血惟七傷散用黃藥子白藥子最有效方見血鬱血汙條又脈浮數忌灸若誤灸之必唾血仲景云脈浮熱甚反灸之必咽燥唾血是也孫兆因博士王珣患咽喉噎塞胸膈不利時發寒熱夜多盜汗忽心胸塞悶咳血三數日即止晚後脈數口乾涎唾稠黏咳嗽一二聲不透肩背微痛嘗於關元氣海中脘三里等穴著艾不詳病得之肺虛其狀中客熱症皆因誤灸服暖藥所致遂與外臺第一廣濟紫菀湯為丸合服之立效方未考千百部丸主諸咳不得氣息唾血方百部根二兩升麻半兩桂心五味子甘草炙紫菀乾薑各一兩上七味蜜丸桐子大每服三十丸日三次知為度忌生蔥海藻菘菜外療肺偏損胸中虛肺偏痛唾血氣咳款冬散款冬花當歸各六分桂心芎藭五味子附子炮各七分細辛貝母各四分乾薑生地各八分白朮甘草炙杏仁去皮尖各五分紫菀三分上共為末清酒服方寸匕日二服忌生蔥生菜桃李雀肉海藻菘菜豬肉蕪荑按唾血咳血屬寒者少今此二方用姜附熱劑蓋為腎足少陰脈是動病咳唾血者設也用者審之脈肺傷者其人勞倦則咳唾血其脈細緊浮數皆吐血此為躁擾嗔怒得之脈傷氣壅所致經云肺脈不及則令人喘呼吸少氣而咳上氣見血下者此病皆肺虛咳唾血之症治法並見氣虛條治虛勞久嗽咯血用五倍子焙為細末每服一錢用溫茶一大口許調勻食後米飲半盞調服玄肺經嘔咳諸血及痰中有血初用生蘿蔔汁半盞入鹽少許服之立效如無生蘿蔔用蘿蔔子一錢蘇葉一錢同煎服次用雞蘇散加阿膠治之本草云蘿蔔大下氣氣下則血亦下也經治咳嗽甚者或有吐血鮮桑白皮一斤米泔浸三宿淨刮上黃皮銼細入糯米四兩焙乾一處搗為末每服一二錢米飲調下此方神效本治久嗽咯血成肺痿及吐白涎胸膈滿悶不食扁豆散扁豆生薑各半兩枇杷葉去毛半夏人參白朮各一分白茅根三分上銼水三升煎一升去渣下檳榔末一錢和勻分四服不拘時候千治上氣咳嗽喘息喉中有物唾血方生薑汁杏仁各二升糖蜜各一升豬膏二合上五味先以豬膏煎杏仁色黃出之以紙拭令淨搗如膏又和薑汁蜜糖等合煎令可丸每服如杏仁一枚日夜六七服漸次增加上後二方生薑多肺虛及汗多亡陽與血下便者忌用素少陰所謂咳唾則有血者陽脈傷也脈解篇運氣咳唾血有二一曰熱傷肺經云少陰司天熱淫所勝民病唾血又云少陽司天火淫所勝病咳唾血治以鹹寒是也二曰濕傷腎經云太陰司天濕淫所勝咳唾則有血治以苦熱是也丹治咯血用白芨一兩藕節半兩為細末每一錢湯調服神效或云芨下咽至血竅則竅為芨末填而血止也山咯血新棉灰半錢酒調下針灸唾嗽血毒取足少陰一經經云腎足少陰之脈是動則病咳唾有血視盛虛熱寒陷下取之也東吐血內損地五會三分灸五壯魚際五分瀉尺澤一寸補甲唾血時寒熱瀉魚際補尺澤唾血振寒嗌乾太淵主之內傷唾血不足外無膏澤地五會灸胸脅脹滿咳逆上氣呼吸及唾濁沫膿血庫房主之外治上氣唾膿血灸兩乳下黑肉際各一十壯仲寸口脈數其人咳口中反有濁唾涎沫者何師曰此為肺痿之病若口中辟辟燥咳即胸中隱隱痛脈反滑數此為肺癰咳唾膿血脈數虛為肺痿數實為肺癰上肺痿唾膿血治法散見本門諸方若肺痿但唾涎沫無膿血者見咳嗽門肺脈微急為肺寒熱怠惰咳唾血引腰背胸若鼻瘜肉不通經云急者多寒全文見治虛實法素肺脈搏堅而長當病吐血王注云肺虛極則咯逆故唾血脈要精微篇脈唾血脈緊強者死滑者生手少陰筋病內急心承伏梁下為肘網其成伏梁唾膿血者死不治全文見筋伏梁心之積在臍上心脈微緩為伏梁在心唾血全文見虛實法羅肺痿辨華嚴寺何上座年未四十四月間因澡浴大汗出還寺剃頭傷風寒頭疼四肢困倦就市中撮取通聖散服之又發汗頭疼少減再日復作又以前藥發之汗數次四肢添勞重喘促自汗惡風咳而有血懶於言語飲食減少求醫治之與藥又多以生薑為引至六月間精神愈困飲食減少形體羸瘦或咳或唾經血極多請予治之具說前由診其脈浮數七八至按之無力予曰不救矣或曰何為不救予曰血之與汗異名同類奪汗者無血奪血者無汗金匱要略云肺痿之病從何得之師曰或從汗出或被快藥下利重亡津液故得之今肺氣已虛又以辛藥瀉之重虛其肺不死何待藏氣法時論云肺欲收急食酸以收之以酸補之以辛瀉之蓋不知內經之旨仲景云醫術淺狹懵然不知病源為治乃誤發汗吐下之相反其禍至速世人但務彼翕習之榮而莫見此傾危之習惟明者居然能護其本近取諸身夫何遠之有焉其僧不數日果亡妊孕咳唾血心妊孕寒熱往來咳嗽血痰或嘔吐不食無力或喘滿乳脊相應痛或口中唾如霜雪出語無聲或耳鳴或痰涎日夜數碗誤用熱藥之故也風門魂戶各五分支溝間使各相透如寒熱未解百節瘛瘲昏憒再取絕骨五分太谿三分如脈氣未平瀉太淵太白各二分中府以上穴實瀉虛補治產前病立效此病安後半年必有一變四肢消瘦單腹腫脹即取陰交一穴去其惡物也溲血無玉屑膏治尿血並五淋砂石疼痛不可忍受者黃耆人參各等分上為末用蘿蔔大者切一指厚三指大四五片蜜淹少時蘸蜜炙乾復蘸復炙盡蜜二兩為度勿令焦至熟蘸黃耆人參末吃不以時仍以鹽湯送下外療虛尿血方干膠三兩炙搗末酒二升和溫服無發灰散治小便尿血發灰本草云發灰能消瘀血通關格利水道破癰疽血衄丹溪云發補陰甚捷上一味每用二錢以米醋二合湯少許服井花水調亦得一法茅草根車前子煎湯調下尤妙兼治肺疽心衄內崩吐血一兩口或舌上出血如針孔若鼻衄吹內立已葛治小便出血當歸四兩細銼酒三升煮取一升頓服丹有血虛四物湯加牛膝膏悲哀太甚則胞絡絕胞絡絕則陽氣內動發則心下崩數溲血也全文見痿姚氏治小便出血龍骨末方寸匕水調溫服日三服瘥肘治淋下血麻根十枚水五升煮取二升一服取血神效經治尿血不止以鬱金一兩搗為末蔥白一握相和水一盞煎三合去渣溫服日三服濟鹿角膠丸治房室勞傷小便尿血鹿角膠半兩沒藥另研油頭髮灰各三錢上為末用茅根汁打麵糊丸如桐子大每服五十丸鹽湯下胞移熱於膀胱則癃溺血全文見診病傳變仲熱在下焦者則尿血亦令淋閟不通丹溺血屬熱山梔炒水煎或用小薊琥珀玄小便出血是心伏熱在於小腸宜鏡面草自然汁加生蜜一匙服之以八正散加麥門冬蔥煎服如小便澀痛以海金沙細末調治之八正散見淋條外治尿血車前草搗取汁五合空心服之濟小薊飲子治下焦結熱尿血成淋生地四兩小薊根滑石通草蒲黃炒藕節淡竹葉當歸去蘆酒浸山梔仁甘草炙各半兩上㕮咀每服四錢水一盞煎八分空心溫服無葎草汁法方見淋丹尿血實者可用當歸承氣湯下之後以四物加山梔當歸承氣湯即調胃承氣加當歸脈尺脈滑氣血實婦人經脈不利男子尿血宜服朴硝煎大黃湯下去經血針關元瀉之丹冬榮散治小便出血及腸風下血用夏枯草燒灰存性為末米飲下一方用涼水調下少陰澀則病積溲血又見積塊咳而且溲血脫形其脈小勁是逆也全文見診生死咳溲血形肉脫脈搏是逆也同上凡脈曰勞曰強曰勁曰搏者皆謂有力而實也妊娠尿血聖治妊娠尿血用阿膠炒黃為散每食前以粥飲調下二錢匕大治妊娠尿血阿膠熟地各等分上為末空心粥飲調二錢下血丹下血不可用純寒涼藥必於寒涼藥中加辛味為佐久不愈者後用溫劑必兼升舉藥中加酒浸炒涼藥如酒煮黃連丸之類凡用血藥不可單行單止腸風獨在胃與大腸出治用黃芩秦艽槐角升麻青黛定腸風痛用蒼朮滑石當歸生地黃黃芩甘草下血屬虛者當溫散之四物加乾薑升麻便血過多者四物加蝟皮有熱者四物加山梔升麻秦艽阿膠有兼風者蒼朮秦艽芍藥香附胃清血非藍實不除本如下清血色鮮者腸風也血濁而色黯者藏毒也肛門射如血線者蟲痔也亦是一種下部虛陽氣不升血隨氣而降者仲景云脈弦而大者弦為緊大為芤緊則為寒芤則為虛寒虛相搏此名為革婦人則半產漏下男子則亡血失精此下部虛而下者也若得革脈須宜服溫補藥蟲痔宜熏千金用蝟皮艾者佳予嘗用有效方見痔垣升麻補胃湯治宿有腸血症因五月大熱吃杏腸澼下血遠三四尺散漫如篩腰沉沉然腹中不痛血色紫黑病名濕毒腸澼是陽明少陽經血症升陽湯主之升麻一錢半羌活一錢獨活五分柴胡防風各錢半葛根三分肉桂少許白芍藥五分牡丹皮半錢黃耆一錢熟地生地各五分歸身三分甘草炙五分上銼如麻子大作二服水二盞煎一盞去渣稍熱食前服和中益胃湯治太陰陽明腹痛大便常溏泄若不泄即秘而難見在後傳作濕熱毒下鮮紅血腹中微痛脅下急縮脈緩而洪弦中指下得之按之空虛熟地三錢歸身酒洗三分升麻五分柴胡五分蘇木一分藁本二分甘草炙三分益智三分上作一服水三大盞煎至一盞去渣午食前溫服一帖愈升陽除濕和血湯治腸澼下血另作一泒其血𣹜出有力而遠射四散如篩下春二月中旬日下二行腹中大作痛乃陽明氣衝熱毒所作也當升陽去濕熱和血脈不兩服而愈生地牡丹皮甘草各五分白芍藥一錢半熟地黃耆一錢升麻七分歸身蒼朮秦艽肉桂各三分陳皮二分甘草炙五分上㕮咀作一服水四大盞煎一盞稍熱空心服立效益智和中湯治腸澼下血紅或深紫黑色腹中痛腹皮惡寒右三部脈中指下得之俱弦按之無力關脈甚緊肌表陽明分涼腹皮熱而喜熱物熨之內寒明矣升麻一錢葛根五分白芍藥錢半甘草炙一錢桂枝四分益智五分半夏五分肉桂一分歸身一錢黃耆一錢乾薑少許牡丹皮柴胡各五分上為粗末作一服水三盞煎一盞食後溫服丹婦人年六十性多沉怒大便下血十餘年不止食減形困心搖動或如煙燻情性極惡早起面微浮急此時便血尤未盡絕中間若得一二日不來則意思稍清但遇稍不如意事則血復作百法不治左三部脈浮大稍重手則無久取之又似滯澀而至數不勻右三部沉澀細弱寸脈沉絕予謂氣鬱生涎涎郁胸中清氣不升經脈壅遏不降心血絕少不能自養所以有如熏之狀非開涎不足以行氣非氣行則血不能歸隧道以壯脾為君諸藥佐之遂以二陳湯加酒紅花升麻當歸身酒黃連青皮貝母澤瀉黃耆人參白朮酒芍藥每帖生附子一小片煎服四帖後血止遂去附子加乾葛牡丹皮山梔子而如熏之狀亦除去又於前方加縮砂炒神麯熟地木香倍參術服半月而全愈治下血蒼朮地黃同擂細末為丸不用鐵器玄大便下血曰腸風切勿止澀究其本末症狀先清其表後攻其里其血自止如脈洪大宜後方四物合解毒湯調治解毒湯方見發熱本治腸風瀉血牽牛五兩牙皂三兩不蛀者捶碎上二味水浸三日後除皂角不用將酒一升煮令乾焙為末煉蜜丸如桐子大每服七丸溫酒送下空心日午夜臥各一服或轉下黃物不妨病可後每日常服五丸飯飲送下潔黃連湯治大便後下血腹中不痛者謂之濕毒下血黃連當歸各五錢甘草炙二錢半上㕮咀每服五錢水煎芍藥黃連湯治大便下血腹中痛者謂熱毒下血芍藥黃連當歸各半兩大黃一錢淡桂五分甘草炙二錢上㕮咀每服五錢水煎如痛甚者調木香檳榔末一錢服之垣夫腸澼者為水穀與血另作一泒如𣹜桶湧出也夏濕熱太甚正當客氣盛而主氣弱故腸澼之病甚也以涼血地黃湯主之黃柏去皮知母炒各一錢青皮炒槐子炒當歸熟地各五分上㕮咀俱作一服水一盞煎七分溫服如小便澀臍下悶或大便前後重調木香檳榔細末各半錢稍熱於食前空心服如裡急後重又不去者當下之如腹中動搖有水聲而小便不調者停飲也診是何臟以去水飲藥瀉之假令脈洪大用瀉火利小便之類是也如胃虛不能食而大渴不止不可用淡滲之藥止之乃胃中元氣少故也與七味白朮散補之方見消渴如發熱惡熱煩躁大渴不止肌熱不欲近衣其脈洪大按之無力或無目痛鼻乾者非白虎湯症也此血虛發躁當以黃耆一兩當歸二錢㕮咀水煎服如大便秘塞或裡急後重數至圊而不能便或少有白膿或少有血慎勿利之利之則必致病重反鬱結不通以升陽除濕防風湯升其陽則陰氣自降矣升陽除濕防風湯蒼朮酒浸炒去皮淨四錢白朮一錢白茯苓白芍藥各一錢防風二錢上㕮咀除蒼朮另作片水一碗半煮至二大盞納諸藥同煎至一大盞去渣稍熱空心食前服如飧泄不禁以此藥導其濕如飧泄及泄不止以風藥升陽蒼朮益胃去濕脈實腹脹閉塞不通宜從權以苦多甘少藥泄之如得通復以升陽湯助其陽或不便以升陽湯中加泄藥通之當歸和血散治腸澼下血或濕毒下血槐花青皮荊芥熟地白朮各六分當歸升麻各一錢川芎四分上為末每服二三錢清水飲湯調食前下本治腸風臟毒槐花散槐花炒柏葉搗爛焙荊芥枳殼上等分為末每服二錢米飲調空心食前服經驗治下血槐花荊芥等分為末酒調下一錢玄大便下血者肺與大腸受熱宜四物同解毒藥入艾煎下三黃丸調治之丹治便血久久傷血並麻風症癬瘡見面者用龜板二兩升麻香附各半兩白芍藥一兩半側柏葉一兩椿皮七錢半上為末粥丸先用四物加白朮黃連廿草陳皮等藥作湯送下積熱便血蒼朮陳皮各二錢半黃柏黃芩各七錢半連翹半錢生地膏六兩上為末以地黃膏搜為丸脈緩大口渴便血月經紫色勞挾濕熱白朮五錢地黃黃柏炒白芍藥各三錢地榆二錢黃芩一錢香附二錢上為末炊餅為丸孫用和治腸風瀉血黃耆黃連等分為末酒糊丸如綠豆大每服三十丸米飲下羅結陰丹治腸風下血臟毒下血諸大便血疾枳殼麩炒威靈仙黃耆陳皮去白椿根白皮何首烏荊芥穗各半兩上為末酒糊丸如桐子大每服五七十丸陳米飲入醋少許煎過放溫送下本椿皮丸臭椿皮刮去粗皮焙十四兩蒼朮枳殼各二兩上為末醋糊丸如桐子大空心食前米飲下三四十丸治腸風瀉血久不止玉屑丸槐根白皮去粗皮苦楝根去皮各三兩椿根白皮四兩三味於九月後二月前取軟者曬乾天南星半夏各半兩並生用威靈仙一兩寒食麵三兩上為末滴水丸如桐子大每服三十丸以水一盞煎沸下丸子煮令浮以匙抄起溫溫送下不嚼空心食前服頃年有人下血幾盈盆頓爾疲萎諸藥不效予曰此正腸風令服玉屑丸三服而愈經治臟毒下血以苦楝子炒黃為末蜜丸米飲下十丸至二十丸甚妙鬥治腸風痔瀉血羊蹄根葉蒸爛一碗食之立瘥外治卒下血不止龍膽草一虎口以水五升煮取二升半分為五服瘥本蕨菜花不以多少文武火焙乾為末每服三錢飯飲調下子和一男子臟毒下血當六月熱不可堪自甘於死忽思蜜水猛舍性命飲一大盞痛止血住素結陰者便血一升再結二升三結三升駱龍吉云結陰之病陰氣內結不得外行血無所稟滲入腸間故便血也其脈虛澀者是也因血結不行故下陰陽別論血泄者脈急血無所行也從容篇羅真定總管史侯男年四十二歲形體本瘦因勉強飲酸酒得腹痛次傳泄瀉十餘日便後見血或紅或紫腸鳴腹痛醫以諸見血皆熱治以芍藥柏皮湯之類前證如故仍不欲食食則嘔酸形體愈瘦面色青黃不澤心下痞惡冷物口乾時有煩躁不得安臥請予治之診得脈弦細而微遲手足稍冷內經曰結陰者便血一升再結二升三結三升又曰邪至五臟則陰脈不和陰脈不和則血留之結陰之病陰氣內結不得外行血無所稟滲入腸間故便血也以平胃地榆湯主之蒼朮一錢白朮陳皮茯苓厚朴各五分甘草炙乾薑當歸炒曲白芍藥益智仁人參各三分地榆七分升麻一錢葛根五分黑附子炮一錢上作一服水二盞生薑三片棗二枚煎至一盞去渣食前溫服此藥溫中散寒除濕和胃數服病減大半又灸中脘二七壯引胃氣上升次灸氣海百壯生髮元氣灸則強食生肉以還少丹服之至春再灸三里二七壯溫脾壯胃生髮元氣次服芳香之劑慎言語節飲食而愈海楊師大醉醒發大渴飲水三大盞又飲冰茶三碗後病便鮮血四次約一盆先與吳茱萸丸翌日又與平胃五苓各半散三大服血止後自利又與神應丸四服自利乃止或問曰何不用黃連之類以解毒予曰若用寒藥其疾大變難治寒飲內傷復用寒藥非其治也況血為寒所凝入大腸間而便下血溫之乃行所以得熱則自止楊氏飲冷酒瀉血服對金散止亦理中脘分利陰陽安定血脈之意也唐生病因飲酪水及食生物下利紫黑血十餘行脾胃受寒濕毒與六神平胃散半兩加白朮三錢以利腰臍間血一服愈易胃風湯治大人小兒風冷乘虛入客腸胃水穀不化泄瀉注下及腸胃濕毒下如豆汁或下瘀血日夜無度人參茯苓川芎官桂當歸芍藥白朮各等分上㕮咀每服二錢水一大盞粟米百餘粒同煎七分去渣稍熱空心服小兒量力增減若加熟地黃耆甘草等分為十味名十補湯若虛勞嗽加五味子若有痰加半夏若發熱加柴胡若有汗加牡蠣若虛寒加附子若寒甚加乾薑皆依本方等分若骨蒸發熱飲食自若者用十補湯加柴胡一兩若氣弱加人參若小便不利加茯苓若脈弦澀加川芎若惡風加官桂若脈澀加當歸若腹痛加白芍藥若胃熱濕盛加白朮潔治血下防風為上使黃連為中使地榆為下使若血瘀色紫者陳血也加熟地黃若血鮮色紅者新血也加生地黃若寒熱者加柴胡若肌熱者加地骨皮若脈洪實痛甚者加酒浸大黃治腸風烏荊丸川烏頭一兩炮去皮尖荊芥穗二兩上為末醋丸桐子大每服二十丸溫酒送下熟水亦得有病發時食前日三服無病時日一服仲下血先便後血者此遠血也黃土湯主之甘草熟地白朮附子炮阿膠黃芩各三兩灶中黃土半升上七味以水八升煮取三升分溫二服下血先血後便者此近血也赤小豆當歸散主之赤小豆五兩浸令芽出曝乾當歸一兩上杵為末漿水服方寸匕日三服梅師云治熱毒下血或因食熱物發動以赤豆杵末水調吞下方寸匕又方治腸風赤小豆炒黑為末每服二錢米飲調下食飲不節起居不時者陰受之陰受之則入五臟入五臟則腹滿閉塞下為飧泄久為腸澼全文見五臟素因而飽食筋脈橫解腸澼為痔生氣通天論上飲食不節腸澼如羅謙甫治真定總管史侯男飲酸酒下血法及海藏治楊師飲冰茶下血法治唐生飲酪水下血法是也並見寒濕條世治酒積下血不止糞後見諸藥不效神麯一兩半白酒藥二丸上同為末用清水調捏作餅子慢火上炙黃為細末每服二錢白湯調下亦治泄瀉神效靈春傷於風夏生飧泄腸澼論疾診尺篇易胃風湯治風冷乘虛入客腸胃下血方論寒濕條丹治腸風下血及血崩用五靈脂炒去火毒每服二錢世腸風下血馬鞭草葉研碎扭汁服丹臟毒下血車前草連根一握生薑一小塊新水研碎去渣候血欲下時腰間必覺重便服此藥一盞少坐漸覺冷下腹中即登廁已不見血矣甚者不過再服本治腸風臟毒酒痢下血黃連生薑上二味煎湯下二氣丸次服五槐丸方列於後又方金星草三兩草味苦寒大解丹石毒陳乾薑上為末每服一錢新汲水調空心服孫真人治糞後有血濃煎艾葉湯和生薑汁三合服之本治臟毒蒜連丸鷹爪黃連末用獨頭蒜一顆煨香熟研和丸如桐子大每服三四十丸陳米飲下衍患暴下血以葫五七枚去梗皮量多少入豆豉搗為膏可即丸如桐子大以米飲下五六十丸無不愈者葫即蒜也本草稱其能清血垣烏梅丸治腸風下血服之立效真殭蠶一兩烏梅肉焙乾一兩上為末薄糊丸如雞頭肉大每服百丸食前白湯送下日三服本五槐丸治臟毒五倍子槐花陳者百藥煎好者各等分上焙乾為末酒糊丸如桐子大每服二十丸空心米湯下一日三服丹治下血用白芷五倍子為末丸服本治腸風五倍子白礬各五錢上為末順流水丸如桐子大每服七丸米飲下忌酒上酸寒之劑千糞前有血令人面黃石榴皮取末茄子枝湯下丹治腸風下血百藥不效有一良醫獨用山裡棗俗名鼻涕團又名酸棗最治下血之疾試取乾者為末服之應手而安藥苟對症其效若此烏可以賤而忽之哉衍義云酸棗微熱上酸熱之劑本丈夫傷血婦人血崩漬入大腸出血草豆蔻檳榔各炒紫色罌粟殼燒灰上等分為末每服二錢空心米飲調下世冬榮散治腸風下血方見溲血博治遠年日久腸風下血不止枳殼燒灰存性羊脛炭為末和勻用濃米飲一中盞調下空心五更初一服如人行五里再服立效每服枳殼灰五錢炭末七錢本治腸風炒赤小豆散方見上下血條赤豆當歸散下注又方栝蔞三個燒灰存性每服三錢空心米飲調下靈苑治腸風下血久不止茄蒂燒存性為末每服三錢匕食前米飲調下丹溪云茄蒂燒灰存性山梔炒等分為末丸之米飲下百丸本治腸風絲瓜燒灰存性空心溫酒調服二錢食療治下鮮血梔子燒灰水和一錢匕服之量其大小多少服之廣治瀉血不止桑耳一兩熬令黑水一大升三合煎取六大合去渣空心分溫三服本治腸風下血核桃殼繭蛻皮鞋底赤雞冠花等分上燒灰為末每服一錢空心溫酒下又方治臟毒當歸枳殼側柏葉陳槐花子百草霜芍藥各一兩上銼碎一處炒令煙微起為末每服二錢空心溫酒調下日午米湯下各食前服甚妙丹一方治腸澼用陳年棕櫚燒灰百藥煎為丸服本又方皂角樹上蕈新瓦上焙乾為末每服一錢溫酒下山臟毒便血生藕節切片清早蘸平胃散嚼下丹治腸痔大便常血取蔥白三五斤煮作湯盆中坐立瘥灸刺腸澼下血有二法其一取肝經云病注下血取曲泉是也其二取腎經云腎足少陰之脈所生病者黃疸腸澼視盛虛熱寒陷下而施補瀉疾留灸也脈關脈芤大便出血數斗者以鬲俞傷故也宜灸鬲俞若下重去血者宜針關元垣治腸風下血灸二十椎下隨年壯三報穴立愈甲腸中有寒熱注下腸澼便血會陽主之腸鳴澼泄下窌主之腸澼泄切痛四滿主之腸澼中郄主之一名中都怪穴治腸風下血肘內曲澤下一寸集又法三間商陽大陵內關命門扶承海血症與黃證俱頭汗出惡風口飲酒便褐色或黑色者亦同血症治之素腎脈小搏沉為腸澼下血血溫身熱者死大奇論淫而奪精身熱色夭然及酒後下血血篤重是逆也全文見診生死素心肝澼亦下血二臟同病者可治其脈小沉澀為腸澼其身熱者死熱見七日死大奇論帝曰腸澼便血何如岐伯曰身熱則死身寒則生帝曰腸澼下膿血何如岐伯曰脈懸絕則死滑大則生帝曰腸澼之屬身不熱脈不懸絕何如岐伯曰滑大者曰生懸澀者曰死以臟期之俱通評虛實論脾脈外鼓沉為腸澼久自已肝脈小緩為腸澼易治俱大奇論腹脹便血脈大時絕是逆也如此者不及一時而死矣全文見診生死絕謂斷絕而不相續也脈腸澼下膿血脈沉小留連者生數疾且大有熱者死腸澼筋攣其脈小細安靜者生浮大緊者死素陰陽虛腸澼死陰陽別論胃移熱於脾傳為虛腸澼死不可治全文見診病傳變中蠱下血唾水沉者心腹絞痛下血如爛肉者俱為蠱千治中蠱下血如雞肝出其餘四臟俱壞惟心未毀或鼻破待死取馬藺根末水服方寸匕隨吐則出極神此苗似葛蔓綠紫生子似橘子梅治卒中蠱毒下血如雞肝晝夜不絕臟腑敗壞待死用白蘘荷葉密安病人席下勿令病人知覺自呼蠱主姓名百一治中蠱毒或吐下血者若爛肝取蚯蚓十四枚以苦酒三升漬之蚓死但服其汁已死者皆可治千金翼治蠱毒下血蝟毛燒末水服方寸匕當吐蠱毒肘療中蠱毒吐血下血皆如爛肝者苦瓠一枚水二升煮取一升服之吐即愈又方用苦酒一升煮瓠令消服之神效諸痿痿者手足痿軟而無力百節緩縱而不收也丹痿屬濕熱有濕痰者有氣虛者有血虛者有食積妨礙不降者有死血者素黃帝問曰五臟使人痿何也岐伯曰肺主身之皮毛心主身之血脈肝主身之筋膜脾主身之肌肉腎主身之骨髓故肺熱葉焦則皮毛虛弱急薄著則生痿躄也心氣熱則下脈厥而上上則下脈虛虛則生脈痿樞折挈脛縱而不任地也肝氣熱則膽泄口苦筋膜乾筋膜乾則筋急而攣發為筋痿脾氣熱則胃干而渴肌肉不仁發為肉痿腎氣熱則腰脊不舉骨枯而髓減發為骨痿帝曰何以得之岐伯曰肺者臟之長也為心之蓋也有所失亡所求不得則發肺鳴鳴則肺熱葉焦故曰五臟因肺熱葉焦發為痿躄此之謂也悲哀太甚則胞絡絕胞絡絕則陽氣內動發則心下崩數溲血也故本病曰大經空虛發為肌痹傳為脈痿思想無窮所願不得意淫於外入房太甚宗筋弛縱發為筋痿及為白淫故下經曰筋痿者生於肝使內也有漸於濕以水為事若有所留居處相濕肌肉濡漬痹而不仁發為肉痿故下經曰肉痿者得之濕地也有所遠行勞倦逢大熱而渴渴則陽氣內伐內伐則熱舍於腎腎者水臟也今水不勝火則骨枯而髓虛故足不任身發為骨痿故下經曰骨痿者生於大熱也帝曰何以別之岐伯曰肺熱者色白而毛敗心熱者色赤而絡脈溢肝熱者色蒼而爪枯脾熱者色黃而肉蠕動腎熱者色黑而齒槁帝曰論言治痿者獨取陽明何也岐伯曰陽明者五臟六腑之海主潤宗筋宗筋主束骨而利機關也衝脈者經脈之海也主滲灌溪谷與陽明合於宗筋陰陽總宗筋之會會於氣街而陽明為之長皆屬於帶脈而絡於督脈故陽明虛則宗筋縱帶脈不引故足痿不用也帝曰治之奈何岐伯曰各補其榮而通其俞調其虛實和其逆順筋脈骨肉各以其時受月則病已矣帝曰善痿病論或問曰治痿之法取陽明之一經此引而未發之言願明以告我予曰諸痿生於肺熱只此一句便見治法大意經曰東方實則西方虛瀉南方補北方此固就生克言補瀉而大經大法不外於此東方木肝也西方金肺也南方火心也北方水腎也五方之中惟火有二腎雖有兩水居其一陽常有餘陰常不足故經曰一水不勝二火理之必然金體燥而居上主氣畏火者也土性溫而居中主四肢畏火者也火性炎上若嗜欲無節則水失所養火寡於畏而侮所勝肺得火邪則熱矣木性剛急肺受熱則失所養木寡於畏而侮所勝脾得木邪而傷矣肺熱則不能管攝一身脾傷則四肢不能為用而諸痿之病作瀉南方則肺金清而東方不實何脾傷之有補北方則心火降而西方不虛何肺熱之有故陽明實則宗筋潤能束骨而利機關矣治痿之法無出於此駱龍吉亦曰風火既熾當滋腎水東垣先生取柏皮為君黃耆等補藥輔佐以治諸痿而無一定之方有兼痰積者有濕多者有熱多者有濕熱相半者有挾氣者臨病制方其善於治痿者乎雖然藥中肯綮矣若將理失宜醫不治也天產作陽氣厚發熱先哲格言但是患痿之人若不淡薄食味吾知其必不能安也垣清暑益氣湯黃耆人參湯清燥湯三方並見注夏丹補益丸治痿龜板酒炙一兩鎖陽酒浸一兩生地酒浸兩半歸身酒浸一兩陳皮一兩杜牛膝酒浸一兩白朮二兩乾薑七錢半黃柏炒半兩虎脛骨酒炙半兩五味子二錢茯苓半兩白芍藥酒浸一兩甘草炙一錢菟絲子酒蒸熟研如糊入余藥末曬乾諸藥為末紫河車為丸如無紫河車豬腦骨髓亦得龍虎丹治痿敗龜板酒炙虎骨酒炙黃柏酒炙乾薑二錢半鎖陽七錢半金箔十片神麯如懶言語加山藥末七錢上為末糯粉糊為丸空心白湯服虎潛丸龜板四兩知母二兩黃柏四兩熟地二兩牛膝三兩半鎖陽一兩虎骨炙一兩當歸一兩芍藥兩半陳皮七錢半乾薑半兩上為末酒糊丸加附子治痿厥如神濕熱痿東垣健步丸加芩柏蒼朮東垣補益腎肝丸治腳膝無力二方並見痿厥蕭炳神龜滋陰丸方見涎下丹溪氣虛病痿四君子加蒼朮芩柏血虛病痿四物湯加蒼朮黃柏下補陰丸保命集治脾虛四肢不用以十全散者蓋治氣血俱虛者也無加減四斤丸治腎肝虛熱淫於內致筋骨痿弱不自勝持起居須人足不任地驚恐戰掉潮熱時作飲食無味不生氣力諸虛不足肉蓯蓉酒浸牛膝酒浸木瓜菟絲子酒浸另研鹿茸燎去毛切酥炙熟地天麻五味子酒浸等分上為末蜜丸如桐子大每服五十丸溫酒米湯食前下王啟玄傳玄珠耘苗丹三方序曰張長沙戒人妄服燥烈之藥謂藥勢偏有所助勝克流變則真病生焉猶憫苗不長而揠之者也若稟氣血不強合服此而不服是不耘苗者也故名耘苗丹此丹養五臟補不足秘固真元均調二氣和暢榮衛保神守中五味子半斤巴戟去心遠志去心枸杞子山藥白茯苓肉蓯蓉酒浸百部酒浸一宿焙杜仲炒斷絲蛇床子防風去蘆柏子仁另研菟絲子酒浸另研各二兩上為末蜜丸桐子大食前溫酒鹽湯任下三十丸春干棗湯下夏加五味子四兩四季月加蓯蓉六兩秋加枸杞子六兩衛生湯補虛勞強五臟除煩熱養真元退邪熱順血脈當歸白芍藥各四兩甘草炙一兩黃耆八兩年老加酒半盞同水煎蕭炳治腳軟丹參酒方見痿厥經治骨軟風腰膝疼行履不得遍身搔癢何首烏大而有花紋者同牛膝銼各一斤以好酒一升浸七宿焙乾於木臼搗末蜜丸每日空心食前酒下三五十丸保四肢不舉俗曰癱緩故經所謂脾太過則令人四肢不舉又曰土太過則敦阜阜高也敦厚也既厚而又高則令除去此真所謂膏粱之疾其治則瀉令氣弱陽衰土平而愈或三化湯調胃承氣湯選而用之若脾虛則不用也經所謂土不及則卑陷卑下也陷坑也故脾病四肢不舉四肢皆稟氣於胃而不能至經必因於脾方得稟受今脾病不能與胃行其津液四肢不得稟水穀氣氣日以衰脈道不利筋骨肌肉皆無氣以生故不用焉其治可十全散加減四物去邪留正脾實病痿者經云脾病者肉痿足不收又云脾脈太過則令人四肢不舉又云其犯雨濕之地則為痿者是也丹濕痰病痿二陳湯加蒼朮白朮黃芩黃柏之類入竹瀝鬥商陸飯治腳軟方見痿厥子和陳下一武卒宋子玉因駐軍息城六月間暴得痿病腰膝兩足皆不任用躄而不行求治於予予察其兩手脈俱滑大而有力予思內經火淫於內治以鹹寒以鹽水越其膈間寒熱宿痰新者為熱舊者為寒或宿食宿飲在上脘者可以湧之宿痰既盡因而下之節次間行覺神志日清飲食日美兩足漸舉腳膝漸伸心降腎升又繼以黃連解毒湯加當歸等藥及瀉心湯涼膈散柴胡飲子大作劑煎時時呷之保心熱盛則火獨亢火炎上腎之脈常下行今火盛而上炎用事故腎脈亦隨火炎爍而逆上行陰氣厥逆火復內焰陰上隔陽下不守位心氣通脈故生脈痿膝腕樞如折去而不相提挈經筋縱緩而不任地故也可下數百行而愈丹痿病食積妨礙不得降者亦有死血者俱宜下之素帝曰脾病而四肢不用何也岐伯曰四肢皆稟氣於胃而不得至經必因於脾乃得稟也今脾病不能為胃行其津液四肢不得稟水穀氣氣日以衰脈道不利筋骨肌肉皆無氣以生故不用焉帝曰脾與胃以膜相連耳而能為之行其津液何也岐伯曰足太陰者三陰也其脈貫胃屬脾絡嗌故太陰為之行氣於三陰手足三陰之經也陽明者表也五臟六腑之海也亦為之行氣於三陽手足三陽之經也臟腑各因其經而受氣於陽明故為胃行其津液四肢不得稟水穀氣日以益衰陰道不利筋骨肌肉無氣以生故不用焉太陰陽明篇調經篇云脾藏肉不足則四肢不用示從容論云四肢懈惰此脾精之不行也脾虛四肢不用治法並見前肺熱條諸痿喘嘔皆屬於上全文見診此即諸痿皆生於肺熱之義王注云上謂上焦心肺氣也運氣痿有三一曰熱痿經云少陰之復少氣骨痿又云少陽之復少氣脈痿是也二曰濕痿經云歲土太過甚則病肌肉痿足痿不收又云土太過曰敦阜敦阜之紀其病四肢不舉又云太陽司天之政寒濕之氣持於氣交民病寒濕發肌肉痿足痿不收四之氣風濕交爭風化為雨民病大熱少氣肌肉痿足痿又曰陽明司天之政四之氣寒雨降民病骨痿是也三曰風制脾痿經云厥陰司天風氣下臨脾氣上從而土且隆體重肌肉痿是也靈陽明根於厲兌結於顙大顙大者鉗耳是也顙大謂額角入髮際頭維二穴也以其鉗束於耳上故名鉗耳也陽明為闔闔折則氣無所止息而痿疾起矣故痿疾者取之陽明視有餘不足無所止息者真氣稽留邪氣居之也足陽明根於厲兌溜於衝陽注於下陵入於人迎豐隆也下陵三里穴也手陽明根於商陽溜於合谷注於陽谿入於扶突偏歷也盛絡皆當取之根結篇刺痿經文見前熱條今概舉其略肺熱葉焦則肺喘鳴生痿躄色白而毛敗者補其滎魚際通其俞太淵至秋病已心熱生脈痿數溲血樞折不相提挈脛縱不能任用於地色赤而絡脈溢者補其滎勞宮通其俞大陵至夏病已肝熱生筋痿下白淫口苦筋急攣色蒼而爪枯者補其滎行間通其俞太衝至春病已脾熱生肉痿乾渴肌肉不仁色黃而蠕動者補其滎大都通其俞太白至長夏病已腎熱生骨痿足不任身腰脊不舉骨枯髓減色黑而齒槁者補其滎然谷通其俞太谿至冬病已又痿躄足不收取之少陽陽明之別經云足少陽之別名曰光明去踝五寸別走厥陰虛則痿躄坐不能起取之所別也又云淫濼脞痿不能久立治少陽之維在外踝上五寸又云足陽明之別名曰豐隆去踝八寸別走太陰其病虛則足不收脛枯取之所別者是也骨酸懈惰取足少陰髓海經云少氣身漯漯也言吸吸也骨酸懈惰不能動補足少陰又云腦為髓之海其俞上在於其蓋下在風府髓海不足則腦轉耳鳴脛酸懈怠安臥審守其俞而調其虛實者是也百節弛縱取脾手太陽之絡經云脾之大絡名曰大包出淵腋下腋三寸布胸脅虛則百節盡皆縱此脈若羅絡之血者取之脾之大絡也又云手太陽之別名曰支正上脘五寸實則節弛肘廢取之所別者是也甲痿不相知太白主之一云身重骨痿不相知足下緩失履衝陽主之足緩不收痿不能行不能言語手足痿躄不能行地倉主之腎脈微滑為骨痿坐不能起起則目無所見全文見治虛實法丹斷不可作風治而用風藥注夏子和痿之作也皆五月六月七月之時午者少陰君火之位未者濕土庚金伏火之地申者少陽相火之分故痿發此三月之內為熱也故病痿之人其脈浮大丹注夏屬陰虛元氣不足補中益氣中去柴升加黃柏炒挾痰者用南星垣刺志論云氣虛身熱得之傷暑熱傷氣故也痿論曰有所遠行勞倦逢大熱而渴渴則陽氣內伐內伐則熱舍於腎腎者水藏也今水不能勝火則骨枯而髓虛足不任身發為骨痿故下經曰骨痿者生於大熱也此濕熱成痿令人骨乏無力故治痿獨取於陽明時當長夏濕熱大勝蒸蒸而熾人感之多四肢困倦精神短少懶於動作胸滿氣促肢節沉疼或氣高而喘身熱而煩心下膨痞小便黃而數大便溏而頻或痢出黃如糜或如泔色或渴或不渴不思飲食自汗體重或汗少者血先病而氣不病也其脈中得洪緩若濕氣相搏必加之以遲遲病雖互換少瘥其天暑濕令則一也宜以清燥之劑治之內經曰陽氣者衛外而為固也熱則氣泄今暑邪干衛故身熱自汗以黃耆甘溫補之為君人參陳皮當歸甘草甘微溫補中益氣為臣蒼朮白朮澤瀉滲利而除濕升麻葛根苦甘平善解肌熱又以風勝濕也濕勝則食不消而作痞滿故炒曲甘辛青皮辛溫消食快氣腎惡燥急食辛以潤之故以黃柏苦寒借甘味瀉熱補水虛者滋其化源以人參五味子麥門冬酸甘微寒救天暑之傷於庚金為佐名曰清暑益氣湯黃耆一錢汗少減五分人參去蘆五分升麻一錢澤瀉五分甘草炙三分蒼朮泔浸去蘆一錢葛根二分五味子九粒白朮五分神麯炒黃五分黃柏酒浸去皮三分麥門冬去心三分歸身三分陳皮五分青皮去皮二分半上件同㕮咀作一服水二大盞煎至一盞去渣大溫服食遠劑之多少臨時斟酌此病皆由飲食勞倦傷其脾胃乘天暑而病作也但藥中犯澤瀉豬苓茯苓燈心通草木通淡味滲利小便之類皆從時令之旺氣以泄脾胃之客邪而補金水之不及也此正方已是從權而立之若於其時病濕熱脾旺之症或小便已數腎肝不受邪者誤用之必大瀉真陰竭絕腎水先損其兩目也復立變證加減法於後如心火乘脾乃血受火邪而不能升發陽氣伏於地中地者人之脾也必用當歸和血少用黃柏以益真陰如脾胃不足之證須少用升麻乃足陽明太陰引經之藥也使行陽道自脾胃中右遷少陽行春令生萬物之根蒂也更少加柴胡使諸經右遷生髮陰陽之氣以滋春之和氣也如脾虛緣心火亢盛而乘其土也其次肺氣受邪為熱所傷必須用黃耆最多甘草次之人參又次之三者皆溫甘之陽藥也脾始虛肺氣先絕故用黃耆之甘溫以益皮毛之氣而閉腠理不令自汗而損元氣也上喘氣短懶語須用人參以補之心火乘脾須用炙甘草以瀉火熱而補脾胃中元氣甘草最少恐資滿也若脾胃之急痛並脾胃大虛腹中急縮腹皮急縮者卻宜多用經曰急者緩之若從權必加升麻以引之恐左遷之邪堅盛卒不肯退反致項上及臀尻肉消而反行陰道故使引之以行陽道使清氣出地右遷而上行以和陰陽之氣也若中滿者去甘草咳甚者去人參如口乾嗌乾者加乾葛如脾胃既虛不能升浮為陰火傷其生髮之氣榮血大虧榮氣伏於地中陰火熾盛日漸煎熬血氣虧少且心包與心主血血減則心無所養致使心亂而煩病名曰悗悗者心惑而煩悶不安也是由清氣不升濁氣不降清濁相干亂於胸中使周身血氣逆行而亂經云從下上者引而去之故當加辛溫甘溫之劑生陽陽生而陰長也已有甘溫三味之論或曰甘溫何能生血又非血藥也曰仲景之法血虛以人參補之陽旺則能生陰血也更加當歸和血又宜少加黃柏以救腎水蓋甘寒瀉熱火火減則心氣得平而安也如煩亂猶不能止少加黃連以去之蓋將補腎水使腎水旺而心火自降扶持地中陽氣也如氣浮心亂則以硃砂安神丸鎮固之得煩減勿再服以防瀉陽氣之反陷也如心下痞亦少加黃連氣亂於胸為清濁相干故以陳皮理之能助陽氣之升而散滯氣又助諸甘辛為用故長夏濕土客邪火旺可從權加蒼朮白朮澤瀉上下分消其濕熱之氣濕氣大勝主食不消化故食減不知穀味加炒曲以消之復加五味子麥門冬人參瀉火益肺氣助秋損也此三伏中長夏正旺之時藥也脾胃虛弱隨時為病隨病制方夫脾胃虛弱必上焦之氣不足遇夏天氣熱甚損傷元氣怠惰嗜臥四肢不收精神不足兩腳痿軟遇早晚寒厥日高之後陽氣將旺復熱如火乃陰陽氣血俱不足故或熱厥而陰虛或寒厥而氣虛口不知味目中溜火而視物䀮䀮無所見小便頻數大便難而秘結胃脘當心而痛兩脅痛或急縮臍下周圍如繩束之急甚則如刀刺腹難舒伸胸中閉塞時顯嘔噦或有痰嗽口沃白沫舌強腰背腹皆痛頭痛時作食不下或食入即飽全不思食自汗尤甚若陰氣覆在皮毛之上皆天氣之熱助本病也乃庚大腸辛肺金為熱所乘而作當先助元氣治庚辛之不足黃耆人參湯主之黃耆一錢如自汗過多加一錢人參去蘆五分甘草炙二分白朮五分蒼朮半錢無汗一錢橘皮二分不去白黃柏酒洗二分以救腎水之源神麯炒三分五味子九粒麥門冬去心二分歸身酒洗二分升麻六分上㕮咀俱作一服水二盞煎至一盞去渣稍熱食遠或空心服之忌酒濕面大料物之類及過食冷物如心下痞悶加黃連二三分如胃脘當心痛減大寒藥加草豆蔻仁五分如脅下痛或縮急加柴胡二三分如頭痛目中溜火加黃連二三分川芎三分如頭目不清利上壅上熱加蔓荊子三分藁本二分細辛一分川芎三分生地黃二分如氣短精神少如夢寐間困乏無力加五味子九粒如大便澀滯隔一二日不見者致食少食不下血少血中伏火而不得潤也加當歸身生地黃各五分桃仁三個去皮尖另研麻子仁研泥五分如大便通行所加之藥勿再服如大便又不快利勿用別藥少加大黃煨半錢如不利者非血結血秘而不通也是熱則生風其病人必顯風症單血藥不可復加止常服黃耆人參湯藥只用羌活半兩防風半兩二味㕮咀以水四盞煎至一盞去滓空心服之大便必大走也一服便止如胸中氣滯加青皮並去白陳皮倍之去其邪氣此病本元氣不足惟當補元氣不當瀉之如氣滯太甚或補藥太過或人心下有憂滯鬱結之事更加木香二分或三分砂仁二分或三分白豆蔻仁二分與正藥同煎服如腹痛不惡寒者加白芍藥半錢黃芩二分卻減五味子夫脾胃虛弱至六七月間河漲霖雨諸物皆潤人汗沾衣身重短氣甚則四肢痿軟行步不正腳欹眼黑欲倒者此腎水與膀胱俱竭之狀也當急救之滋肺氣以補水之上源又使庚大腸不受邪熱不令汗大泄也汗泄甚則亡津液亡津液則七神無所依經云津液相成神乃自生津者庚大腸所主三伏之義為庚金受囚也若亡津液汗大泄濕令亢甚則清肅之氣亡燥金受囚風木無可以制故風濕相搏骨節煩疼一身盡痛亢則害承乃制是也孫思邈曰五月常服五味子是瀉丙火補庚金大腸益五臟之元氣壬膀胱之寒已絕於巳癸腎水已絕於午今更逢濕旺助熱為邪西方北方之寒清絕矣聖人立法夏月宜補者補天元之真氣非補熱火也令人夏食寒是也為熱傷元氣以人參麥門冬五味子生脈脈者元氣也人參之甘補元氣瀉熱火也麥門冬之苦寒補水之源而清肅燥金也五味子之酸以瀉火補庚大腸與肺金也當此之時無病之人亦或有二症況虛損脾胃有宿疾之人遇此天暑將理失所違時伐化必困乏無力懶語氣短氣弱氣促似喘非喘骨乏無力其形如夢寐朦朦如煙霧中不知身所有也必大汗泄若風犯汗眼皮膚必搐項筋皮枯毛焦身體皆重肢節時有煩疼或一身盡疼或渴或不渴或小便黃澀此風濕相搏也頭痛或頭重上熱壅盛口鼻氣短氣促身心煩亂有不樂生之意情思慘淒此陰勝陽之極也病甚則傳腎肝為痿厥厥者四肢如在火中者為熱厥四肢寒冷者為寒厥寒厥則腹中有寒熱厥則腹中有熱為脾主四肢故也若肌肉濡漬痹而不仁傳為肉痿證證中皆有肺疾用藥之人當以此調之氣上衝胸皆厥證也痿者四肢痿軟而無力也其心煩冤不止心神撩亂者是也厥者氣逆也甚則大逆故曰厥逆其厥痿多相須也於前已立黃耆人參五味子麥門冬湯中每加白茯苓二分澤瀉四分豬苓白朮各一分如小便快利不黃澀者只加澤瀉二分與二術上下分消其濕如行步不正腳膝痿弱兩足欹側已中痿邪者加酒洗黃柏知母三分或五分令二足湧出氣力如汗大泄者津脫也急止之加五味子六粒炒黃柏五分炒知母三分不令妨其食當以意斟酌若妨食則止候食進再服取三里氣街以三稜針出血若汗不減不止者於三里穴下三寸上廉穴出血禁酒濕面夫痿者濕熱乘於腎肝也當急去之不然則下焦元氣竭盡而成軟癱必腰下不能動心煩冤而不止也若身重減氣不短小便如常及濕熱之令退時或所增之病氣退者不用五味子澤瀉豬苓茯苓黃柏知母蒼朮白朮之藥只依本病中證候加減常服藥亦須用酒黃柏二分或三分六七月之間濕令大行子能令母實而熱旺濕熱相合而刑庚大腸故用寒涼以救之燥金受濕熱之邪絕寒水生化之源源絕則腎虧痿厥之病大作腰以下痿軟癱瘓不能動矣步行不正兩足欹側以清燥湯主之黃耆錢半黃連一錢去須蒼朮一錢白朮一錢陳皮五分五味子九粒人參白茯苓升麻各三分當歸一錢二分澤瀉五分柴胡麥門冬生地神麯炒豬苓黃柏酒製甘草炙各二分上銼如麻豆大每服半兩水二盞煎至一盞去渣稍熱空心服丹宋某勞傷發熱當作注夏治之黃柏炒升麻各三分黃耆人參木通白芍藥各五分白朮錢半陳皮甘草炙各二分婦人患注夏手足痠軟而熱白朮一錢黃柏炒白芍藥陳皮當歸一錢蒼朮五分甘草生姜二片解㑊即痿類解㑊之證懈倦困弱似痿故附痿後冬脈大過為病在外則令人解㑊春脈痛而少氣不欲言全文見治虛實法王注云寒不寒熱不熱弱不弱壯不壯佇不可名謂之解㑊也素尺脈緩澀謂之解㑊平人氣象論王注云尺為陰部腹腎主之緩為熱中澀為無血故解名謂之解㑊也尺內弱者解㑊安臥脫肉者寒熱不治全文見診生死刺骨無傷髓髓傷則消爍胻酸體解㑊然不去矣全文見禁刺足少陽之瘧令人身體解㑊寒不甚熱不甚惡見人見人心惕惕然熱多汗出甚刺足少陽全文見瘧舌舌屬心脾二臟經云心主熱又云在臟為心在竅為舌又云心氣通於舌心和則舌能知五味是舌屬心也又曰中央黃色入通於脾開竅於口藏精於脾故病在舌本屬脾也舌腫痛無金沸草湯治風寒傷於心脾令人憎寒熱齒浮舌腫痛荊芥穗四兩旋覆花前胡麻黃去節各三兩赤芍藥半夏各一兩上銼散每五錢水一盞半姜七片棗二枚煎七分去渣漱口吐一半吃一半世醫用此發散傷寒傷風及加杏仁五味子治咳嗽皆效獨未知用之舌腫牙疼辛未年有人患舌腫滿塞粥藥不入其勢危甚大煎此一劑乘熱以紙籠氣熏之遂愈世烏犀膏治重舌木舌方見咽喉痛本治心脾壅熱木舌腫脹玄參升麻大黃犀角各三分甘草半兩上為細末每服三錢水一盞煎至五分溫服不拘時世舌腫脹出口硼砂細末切生薑蘸藥揩舌腫處即退又云蓖麻取油蘸紙捻燒煙燻之愈又治牛舌出亦好丹重舌用好膽礬研細敷之無黑散子治舌忽然腫破用釜底煤研細以醋調敷舌上下脫去更敷能先決出血竟敷之尤佳一法用鹽等分調敷山舌腫亂髮燒灰水調下丹飛絲入口喉舌間生泡紫蘇嚼白湯下立效針灸舌痛獨取脾脈經云脾足太陰之脈所生病者舌本痛視盛虛熱寒陷下取之也摘治舌下腫難言口瘡舌縱涎出及舌根急縮廉泉三分得氣即瀉灸三壯集治舌腫廉泉三分灸金津玉液各用三稜針出血天突少商東又法廉泉然谷風府天突關元垣廉泉一穴一名舌本在頷下結喉上治舌下腫難言舌縱涎出口噤舌根急縮下食難刺瘧論云舌下兩脈者廉泉也刺禁論云刺舌下中脈太過血不止為喑刺節真邪論云取廉泉穴血變而止以明宜出血禁用針或問取廉泉穴二說不同一說取頷下結喉上一說取舌下兩脈何者為當答曰舌本者乃舌根蒂也若取舌下兩脈是取舌梢也舌標也此法誤也當取頷下者為當此舌根也況足陽明之脈根於厲兌結於廉泉頷下乃足陽明之所行也若取舌下兩脈非足陽明經也戊與癸合廉泉足少陰也治涎下解云胃中熱上溢廉泉開放涎下當出血瀉胃中熱又知非舌下兩脈也頷下結喉上者為準矣脹論曰廉泉玉英者津液之道路也按針經云少陽結於廉泉今曰陽明者誤也子和南鄰朱老翁年六十餘歲身熱數日不已舌根腫起和舌尖亦腫腫至滿口比元舌大三倍一外科以燔針刺其舌兩旁下廉泉穴病勢轉凶將至顛嶻戴人曰血實者宜決之以䤵針磨令鋒極尖輕砭之日砭八九次出血約一二盞如此者三次漸覺血少痛減腫消夫舌者心之外候也心主血故血出則愈又諸痛癢瘡瘍皆屬心火燔針艾火皆失此義也無凡舌腫下必有噤蟲狀如螻蛄臥蠶有頭尾小白可燒鐵烙烙頭上即消舌強舌卷無礬石散治風濕寒舌強不能語枯礬桂心各等分上為末每服一錢安舌下針灸舌卷獨取手少陽絡與筋經云邪客手少陽之絡令人喉痹舌卷口乾心煩臂外廉痛手不及頭刺手中指次指爪甲上去端如韭葉各一痏又云手陽明之筋其病支痛轉筋舌卷治在燔針劫刺以知為數以痛為輸是也診舌卷若唇青卵縮者必死經云厥陰絡者甚則舌卷卵上縮經又云肝者筋之合也肝脈弗榮則筋急筋急則引舌與卵故唇青舌卷卵縮則筋先死庚篤辛死也舌縱涎下多唾蕭治口角流涎不止口目喎邪手足痿軟方如下流涎者自然流出也神龜滋陰丸治足痿龜板炙四兩知母酒炒二兩鎖陽酒洗一兩黃柏炒赤二兩枸杞子五味子各一兩乾薑炮半兩上為末清水丸如桐子大每服七十丸空心鹽湯下通天愈風湯人參一錢威靈仙去蘆半錢南星湯泡貝母去心各一錢連翹防風去蘆各五分栝蔞仁十五粒白朮一錢半桔梗三錢甘草荊芥穗各五分生薑三片上水一鍾半煎七分去渣入荊瀝一呷薑汁些少半飢時服吞下清心導痰丸五十粒日一服清心導痰丸白附一兩南星薑汁二兩半夏薑汁二兩黃連炒七錢半天花粉一兩白殭蠶炒去絲嘴半兩川烏鹽制二錢鬱金七錢半天麻羌活各半兩上為末薑汁糊為丸如桐子大每服五十丸用通天愈風湯吞下清心牛黃丸膽星一兩牛黃二錢黃連一兩歸身甘草辰砂各半兩上為末湯浸蒸餅為丸綠豆大每服五十丸臨臥時唾津嚥下嘗治宣文炳口流涎不止喜笑舌喑脈洪大用連芩柏梔白朮蒼朮半夏竹瀝薑汁服之五日涎止笑息仲云大病瘥後喜唾久不了了者胃上有寒當以丸藥溫之宜理中丸東垣云多唾或唾白沫者胃口上停寒也藥中加益智仁此多唾者用力吐方出也靈舌縱涎下煩悗取足少陰寒熱病篇黃帝曰人之涎下者何氣使然岐伯曰飲食者皆入於胃胃中有熱則蟲動蟲動則胃緩胃緩則廉泉開廉泉開故涎下補足少陰口問篇甲舌縱涎下煩悶陰谷主之自齧舌靈黃帝曰人之自齧舌者何氣使然岐伯曰此厥逆走上脈氣輩至也少陰氣至則齧舌少陽氣至則齧頰陽明氣至則齧唇矣視主病者則補之舌苔舌黑二條見傷寒汗素陽氣有餘為身熱無汗陰氣有餘為多汗身寒陰陽有餘則無汗而寒脈要精微論飲食飽甚汗出於胃驚而奪精汗出於心持重遠行汗出於腎疾走恐懼汗出於肝搖體勞苦汗出於脾經脈別論自汗素陽之汗以天地之雨名之全文見五臟陽加於陰謂之汗陰陽別論陽氣入內加於陰氣也凡傷寒始病脈浮至汗出則沉入內加於陰也垣表虛自汗秋冬用桂枝春夏用黃耆能治虛勞自汗脈證有寒者亦用桂枝無寒者用黃耆無牡蠣散治諸虛不足及新病暴虛津液不固體常自汗許學士方亦治盜汗不止黃耆麻黃根牡蠣煅研上銼散每服三錢水一盞半小麥一百粒煎至八分不拘時服垣周衛湯治濕勝自汗補衛氣虛弱表虛不任外寒黃耆麻黃根各一錢生甘草五分豬苓羌活各七分麥門冬三分歸梢五分生地三分生黃芩五分五味子七粒蘇木紅花各一分半夏湯洗七次五分上㕮咀如麻豆大作一服水二盞煎至一盞去渣稍熱服中風症必自汗汗多不得重發汗故禁麻黃而用根節也張芸夫己酉四月天寒陰雨寒濕相雜因官事飲食失節勞役所傷病解之後汗出不止沾濡數日惡寒重添厚衣心胸悶躁時躁熱頭目昏憒壅塞食少減此乃胃外陰火熾甚與夫雨之濕氣挾熱兩氣相合令濕熱大作汗出不休兼見風邪以助東方甲乙以風藥去其濕以甘藥瀉其熱羌活勝濕湯主之甘草炙三錢黃耆七分生甘草五分生黃芩三分防風三分酒黃芩三分人參三錢以助氣益胃以上藥瀉胸中熱藁本三分獨活二分升麻五分川芎三分柴胡五分以上風藥勝其濕細辛蔓荊子各三分薄荷一分以上清利頭目上作一服水二盞煎一盞半後入細辛等四味再熬至一盞去渣熱服一服而止諸症悉去丹人參黃耆少佐桂枝湯甚者附子亦可用嚴耆附湯治氣虛陽弱虛汗不止肢體倦怠黃耆去蘆蜜炙附子炮去皮臍各等分上㕮咀每服四錢水一盞姜十片煎八分食前溫服本補精氣止肝邪平補五臟虛羸六腑怯弱充肌膚進飲食人參丸人參山藥白朮白茯苓石斛黃耆取頭末五味子各一兩上為細末蜜丸如桐子大每服三十丸空心食前飲下久服不熱尤宜少年平人氣象論云尺澀脈滑謂之多汗王注謂尺膚澀而尺脈滑也膚澀者榮血內涸又針經云腠理發泄汗出溱溱是謂津脫津脫者腠理開汗大泄按此二經論自汗多而血涸津脫者其治法乃東垣正陽湯用炒黃柏知母及當歸六黃湯之類是也汗以臟腑言之皆屬心經云心為汗難云腎邪入心為汗出不可止者是也垣或問濕之與汗陰乎陽乎予應之曰西南坤土也在人則為脾胃陽之汗以天地之雨名之濕主淋淫驟注者濕勝也陰滋其濕為露為雨此陰寒隔熱火也隔者解也陰濕寒下行地之氣也仲景云汗多則亡陽陽去則陰勝也重虛則表陽虛極矣甚為寒中濕勝則音聲如從甕中出若中水也相家有言土音如居深甕里言其壅也遠也不出也其為濕也審矣又知此二者亦為陰寒內經云氣虛則外寒雖見熱中蒸蒸為汗終傳大寒知始為熱中者表虛無陽不任外寒終傳為寒中者多成痹寒矣夫色以候天脈以候地形者乃候地之陰陽也故以脈氣候之皆有形之可見者也上濕勝自汗治法並見陰虛條丹痰症亦有汗火氣上蒸胃中之濕亦能作汗可用涼膈散素帝曰有病身熱懈惰汗出如浴惡風少氣此為何病岐伯曰病名酒風帝曰治之奈何岐伯曰以澤瀉術各十分麋銜五分合以三指撮為後飯病能篇麋銜一名薇銜俗名吳風草河白朮散治飲酒中風汗多不可單衣食則汗出如洗久不治必為消渴症牡蠣煅三錢白朮一兩二錢防風二兩半上為末每服一錢溫水調下不計時如惡風倍防風白朮如多汗面腫倍牡蠣酒風一名漏風經云飲酒中風則為漏風漏風之狀或多汗常不可單衣食則汗出甚則身喘息惡風衣裳濡口乾善渴不能勞事此即酒風同治也凡五臟風皆自汗惡風經文見風門丹周師脈弦左大於右不數身易得汗小便赤口燥此為虛白朮陳皮歸尾青皮各半兩白芍藥人參各七錢黃芩川芎各三錢木通二錢甘草炙五錢分九帖煎三之一稍熱飲之煎藥下保和丸二十粒動而汗出有虛者有熱者垣安胃湯治因飲食汗出日久心中虛風虛邪令人半身不遂見偏風痿痹之病先除其汗慓悍之氣按而收之黃連去須五味子烏梅去核生甘草各五分熟甘草三分升麻梢二分上㕮咀分作二服每服水二盞煎一盞去渣溫服食遠忌濕面酒五辛大料物之類刺灸汗出有二其一取肺經云邪在肺則病皮膚痛寒熱上氣喘汗出咳動肩背取之膺中外輸背三節五椎之傍以手疾按之快然乃刺之取之缺盆中以越之者是也其二取手足少陽經云三焦手少陽之脈所生病者汗出目銳眥痛頰痛耳後痛膽足少陽之脈所生病者汗出振寒瘧皆視盛虛熱寒陷下而施補瀉疾留灸也素肺脈耎而散者當病灌汗至今不復發散也脈要精微論灌汗謂汗多如灌洗之狀病能論云汗出而浴亦此義也肺脈緩甚多為汗全文見治虛實法頭汗海頭汗出劑頸而還血證也額上偏多何謂也曰首者六陽之所會也故熱熏蒸而汗出也額上偏多以部分左頰屬肝右頰屬肺鼻屬中州頤屬腎額屬心三焦之火涸其腎水溝渠之餘迫而上入於心之分故發為頭汗而額上偏多者屬心之部而為血證也飲酒飲食頭汗出者亦血證也至於雜證相火迫腎水上行入於心為盜汗或自汗傳而為頭汗出者或心下痞者俱同血證例治之無問傷寒雜病酒積下之而心下痞者血證也何以然曰下之亡陰亡陰者則損脾胃而亡血氣在胸中以亡其血陷之於心之分也故心下痞世人以為血病用氣藥導之則痞病愈甚而又下之故變而為中滿彭脹非其治也如此然當作何治獨益中州脾土以血藥治之其法無以加矣手足汗一男子手足汗醫用芩連柏並補劑皆不效又足汗常多後以八物半苓為君白附川烏佐使其汗即無本治腳汗白礬乾葛各等分上二味為末每半兩水三碗煎十數沸洗逐日一次纏三五日自然無汗無汗靈奪血者無汗奪汗者無血榮衛生會篇垣真氣已虧胃中火盛汗出不休胃中真氣已竭若陰火已衰無汗反燥乃陰中之陽陽中之陽俱衰四時無汗其形不久濕衰燥旺理之常也其形不久者秋氣主殺生氣乃竭生氣者胃之穀氣也乃春少陽生化之氣也丹盛夏浴食無汗者為表實見心痛表裡條楊順二官子患脈澀而短重取而弱此久受濕傷血多年無汗遇勞身熱倦怠如沙病狀蒼朮白朮芍藥各半兩陳皮六兩歸身二兩甘草紅花各半兩分六帖姜三片煎服謝老形實夏月無汗成久嗽病半夏蘇葉二味為末入莎末枕流末仁陷末以栝蔞穰桃仁泥半兩為丸先服三拗湯三帖卻服此丸子詳枕流末蜆殼灰蛤粉之類仁陷末神麯也甲汗不出曲差主之盜汗垣當歸六黃湯治盜汗之聖藥也當歸生地熟地黃柏黃芩黃耆黃連各等分上為粗末每服二三錢水一盞半煎七分去渣溫服小兒用半錢正氣湯治盜汗黃柏炒一錢知母炒一錢半甘草炙五分上粗末作一服水二大盞煎一盞去渣臨臥服丹當歸龍薈丸治盜汗見治法門本治盜汗外腎濕人參苦參龍膽草麻黃根各三錢上件為末煉蜜丸如桐子大每服三十丸燒麩湯下嚴氏黃耆湯治喜怒驚恐房室虛勞致陰陽偏虛發厥自汗或盜汗不止並宜服之黃耆去蘆蜜炙兩半白茯苓去皮熟地酒蒸桂枝不見火天門冬去心麻黃根龍骨各一兩五味子小麥炒防風去蘆當歸酒蒸甘草炙各兩半上㕮咀每服四錢水一盞姜五片煎七分溫服不拘時發厥自汗加熟附子發熱自汗加石斛山盜汗臨夜吃淡煮麥丸子空心服妙香散本戢陽氣止盜汗進飲食退經絡熱柏子仁丸柏子仁半夏曲各二兩牡蠣坩鍋子內火煅用醋淬七次焙乾人參麻黃根慢火炙拭去汗白朮五味子各一兩淨麩炒半兩上八味為末棗肉丸桐子大空心米飲下三五十丸日二服得效減一服將愈即住作散調服亦可丹白朮湯治盜汗用白朮四兩分作四處一兩用黃耆同炒一兩石斛同炒一兩牡蠣同炒一兩麩皮同炒各味炒黃色余藥不用只用白朮研末每服三錢用粟米煎湯送下盡四兩為效世治盜汗出山藥一味為末臨臥酒調下三錢效本牡蠣散治盜汗方見前自汗門世黃耆散治盜汗黃耆木通葛根上為粗末水煎服衍治盜汗尤切將椒目微炒搗細末用半錢匕以生豬上唇煎湯一合調臨睡服無不效蓋椒目能行水又治水蠱世五仙丸治盜汗天仙子五靈脂上為末水糊丸桐子大三十丸白湯臨臥服本草云天仙子一名莨菪子性甘寒有毒服者審之本治盜汗威靈仙甘草各半錢水煎服臟腑盜汗皆屬腎經云腎病者盜汗出憎風是也運氣盜汗皆屬寒水經云歲水太過寒氣流行甚則勞汗出憎風又云太陽所至為寢汗痓是也世治盜汗桑葉為末茶服之諸藥不應者累驗出醫說孟豆豉能治久盜汗患者以一升微炒令香清酒二升漬兩三日取汁任人服之不瘥更作三兩劑即止衍牡蠣煅過麻黃根等分同研極細粉治盜汗及陰汗世盜汗陰都五里間使扁盜汗中極氣海虛損盜汗勞熱百勞三分瀉三吸肺俞四分補三呼成盜汗者謂睡而汗出者也不睡則不能汗出方其睡也溱溱然出覺則止而不復出矣卒中暴厥卒中者卒然不省人事全如死屍但氣不絕脈動如故或脈無倫序或乍大乍小或微細不絕而心胸暖者是也仲屍蹶脈動而無氣氣閉不通故靜而死也菖蒲屑納鼻孔中吹之令人以桂屑著舌下又方剔取左角發方寸燒末酒和灌之立起此即內經法也詳見後素邪客於手足少陰太陰足陽明之絡此五絡皆會於耳中上絡左角五絡俱竭令人身脈皆動而形無知也其狀若屍或曰屍厥刺其足大指內側爪甲上去端如韭葉後刺足心後刺足中指爪甲上各一痏後刺手大指內側去端如韭葉後刺手心主少陰銳骨之端各一痏立已不已以竹管吹其兩耳鬄其左角之發方一寸燔飲以美酒一杯不能飲者灌之立已全文見繆刺論鬄音易玉氣昏暈奪命在曲澤上針入三分先補候氣回後瀉不可離手忌灸如不蘇取濟中臍中灸七壯忌針此二穴能起死回生摘屍蹷玉泉八分補十呼得氣即瀉隱白三分先補後瀉補生瀉成更於兩脅頻頻熨之鬼擊支溝二分先補後瀉補生瀉成三里補十呼瀉五呼此二穴刺之氣不至無問其數刺之氣至去之勿復刺中惡人中中脘氣海仲少陰脈不止腎氣微少精血奔氣促迫上入胸膈宗氣反聚血結心下陽氣退下熱歸陰股與陰相動令人不仁此為屍蹶當刺期門巨闕恍惚屍蹶煩痛中極及僕參主之甲屍蹶死不知人脈動如故隱白及大敦主之屍蹶暴死金門主之孫仁宗最寵貴妃一日食次忽仆倒遍身卒冷急奏帝上乃急召孫杜即至奏曰不妨此乃氣厥爾少頃吐即復甦也御坐良久果吐而蘇上問因何而得二人並奏曰此貴妃方食因憂怨氣上遂與食相併故如此者吐即氣透故復甦也上問妃有何事如此妃對曰陛下無嗣臣妾不能為陛下生皇嗣所以自怨氣忽上逆而至驚動聖駕上嘆曰朕亦自責乃勞汝致病耶因嘉獎孫杜之能良久曰醫道如此豈非良醫也耶上暴厥不知人不治自愈經云帝曰厥或令入腹滿或令人暴不知人或至半日遠至一日乃知人者何也岐伯曰陰氣盛於上則下虛下虛則腹脹滿陽氣盛於上則下氣重上而邪氣逆逆則陽氣亂陽氣亂則不知人也又云血之與氣並走於上則為大厥厥則暴死氣復反則生不反則死者是也丹嘗治一人陰先虧而陽暴絕者浦江鄭兄年近六十豢養受用之人也仲夏久患滯下而又犯房勞忽一晚登廁間兩手疏散兩眼開而無光尿自出汗如雨喉如鋸呼吸甚微其脈大而無倫次無部位可畏之甚予適在彼急令煎人參膏且先與灸氣海穴壯如小指大至八十壯右手能動又三壯唇微動參膏亦成遂與一盞至半夜後盡三盞眼能動盡二斤方能言而索粥五斤而痢止至數十斤而安仲救卒死而四肢不收失便者方馬屎一升水三斗煮取二斗以洗之又取牛洞稀糞也一升溫酒灌口中灸心下一寸臍上三寸臍下四寸各一壯瘥救卒死而張口反折者方灸手足兩爪後十四壯飲以五毒諸膏散方未考救小兒卒死而吐利不知是何病方狗屎一丸絞取汁以灌之無濕著水煮乾者取汁救卒死客忤死還魂湯主之麻黃去節三兩杏仁去皮尖七十個炙甘草一錢千金有桂二兩上三味以水八升煮取三升去渣分令咽之通治諸感忤千金方云主卒忤鬼擊飛屍諸奄忽氣絕無復覺或已無脈口噤拗不開去齒下湯湯下口不下者分病人發左右提㩉肩引之藥下復增服一升須臾立蘇局蘇合香丸治卒中惡忤疰蘇合香油入安息香膏內薰陸香另研龍腦研各一兩青木香白朮白檀香丁香硃砂研水飛沉香香附炒去毛犀角鋸屑蓽茇安息香另為末調無灰酒一升熬膏麝香研訶梨勒煨取皮各二兩上為細末入研藥勻用安息香膏並煉白蜜和劑每丸桐子大清晨新汲水溫冷任意化服四丸老人小兒一丸溫酒化服亦得用蠟紙裹一丸如彈子大縫袋帶之陳無擇云病自內作不曉其名者服之皆效最治氣厥氣不和吐利關格甚有神效肘扁鵲中惡與卒死鬼擊亦相類為治皆宜相參用之已死搗菖蒲生根絞汁灌之立瘥仲救卒死而目閉者搗韭汁灌耳中吹皂莢末鼻中效無治魘卒死諸暴絕症用半夏不拘多少湯泡七次為末每用少許吹入鼻中心頭溫者可治倉卒無方急於人中穴及兩腳大拇指離甲一韭葉許各灸三五壯即活和一夫病痰厥不知人牙關緊急諸藥不能下候死而已戴人見之問侍病者口中曾有涎否曰有戴人先以防風藜蘆煎湯調瓜蒂末灌之口中不能下乃取長蛤甲磨去刃以紙裹其尖灌於右鼻竅中嘓然下咽有聲復灌其左竅亦然戴人曰可治矣良久涎不出遂以砒石一錢又投之鼻中忽偃然仰面似覺有痛斯須吐穢及膠涎數升頓蘇砒亦尋常勿用以其病大非此莫能動然無瓜蒂亦不可使用宜消息之凡卒中屍厥鬱冒中風中暑之類皆當發表也仲景云鬱冒欲解必是大汗出還魂湯用麻黃桂枝清魂湯用荊芥及諸卒中用皂角半夏搐鼻取嚏用藜蘆砒霜折齒取痰皆所以開發上焦使表邪流通也中暑忌冷水閉表亦此意本解毒雄黃丸治卒中仆地不知人事方見喉痹仲三物備急丸大黃乾薑巴豆各一兩去皮尖心外熬研如脂上藥各須精新先搗大黃乾薑為末研巴豆內中合搗千杵蜜和丸器中貯之主心腹諸卒暴百病若中惡客忤心腹脹滿卒痛如錐刺氣急口噤停屍卒死者以熱苦酒服大豆許三四丸或不下捧頭起灌令下咽須臾當瘥如未瘥更與三丸當腹中鳴即吐下便瘥若口噤亦須折齒灌之無中暑悶倒急扶在陰涼處切不可與冷水當以布中衣物等蘸熱湯熨臍中及氣海續以湯淋布上令徹臍腹暖即漸醒如倉卒無湯處掬道上熱土於臍以多為佳冷即易之古法道塗無湯即掬熱土於臍上仍撥開作窩子令人更溺於中以代湯續與白虎竹葉石膏湯凡覺中暑急嚼生薑一大塊冷水送下如已迷亂悶嚼大蒜一大瓣冷水送下如不能嚼即用水研灌之醒路中倉卒無水渴甚急嚼生蔥二寸許津同咽可抵飲水二升中暑之病即內經熱至則瞀郁是也大黃龍丸治中暑眩暈昏不知人或身熱惡寒頭痛狀如傷寒或往來寒熱渴甚嘔吐泄瀉常服去暑毒分陰陽硫黃硝石各一兩雄黃透明者白礬滑石各半兩寒食麵四兩上為末滴水丸如桐子大每服五丸至七丸加至二十丸新汲水下昏塞不知人則以井水開口灌之中暑忌冷此藥以冷水下之乃熱因寒用本又方解一切暑毒欲死者便服之立蘇半夏四兩醋一升半煮盡焙乾甘草一兩肉桂赤茯苓各半兩白茯苓一兩上為末用生薑汁麵糊丸如桐子大每服五十丸熱水下予夏日登途常蓄此藥於篋笥中防諸緩急及僕價門每日一服無伏暑之疾奇驗不一山中暑發昏以新汲水滴兩乳以扇扇之重者以地漿灌之則醒若與水飲則死仲諸乘寒者則為厥鬱冒不仁以胃無穀氣脾不通口急不能言戰而慄也無附子理中湯治五臟中寒口噤四肢強直失音不語昔有武士守邊大雪出帳外忽然暈倒時灌以此藥兩劑遂醒大附子炮去皮臍人參乾薑炮甘草炙白朮各等分上銼為散每服四大錢水一盞半煎七分去滓空心服口噤則斡開灌之乾薑附子湯治中寒卒然暈倒或吐逆涎沫如暗風手腳攣搐口噤四肢厥冷或復躁熱方見傷寒世治凍死法四肢直口噤只有微氣者用大釜炒灰令暖以囊盛熨心上冷即易之目開氣出然後以粥清稍稍進之若不先溫其心便將火灸則冷氣與火爭必死矣垣瘡瘍鬱冒俗呼昏迷慎不可下汗之則愈此因出膿血至多而鬱冒之也仲鬱冒欲解必大汗出本人平居無疾忽如死人身不動搖默默不知人目閉不能開口啞不能言或微知人惡聞人聲但如眩冒移時方寤此由汗過多血少氣並於血陽獨上而不下氣壅塞而不行故身如死氣過血還陰陽復通故移時方寤名曰鬱冒亦名血厥婦人多有之宜白薇湯倉公散白薇湯白薇當歸各一兩人參半兩甘草一分上粗末每服五錢水二盞煎一盞去渣溫服倉公散藜蘆瓜蒂雄黃礬石煅上等分為細末少許吹入鼻中脈問曰婦人病經水適下而發其汗則鬱冒不知人何也師曰經水下故為裡虛而發其汗則表亦虛此為表裡俱虛故令鬱冒也垣婦人半產誤用寒涼藥有損論治法婦人分娩及半產漏下昏冒不省瞑目無所知覺蓋因血暴亡此有形血去之後則心神無所養心與包絡者君火相火也得血則安亡血則危火上熾故令人昏冒火乘肺瞑目不省人事是陰血暴亡不能鎮撫也故血已虧損往往用滑石甘草石膏之類乃辛甘大寒之藥能瀉氣中之熱是血虧瀉氣乃陰虧瀉陽使二者俱傷反為不足虛勞之病昏迷不省者上焦心肺之熱也此無形之熱用寒涼之藥驅令下行豈不知上焦之病悉屬於表乃陰證也汗之則愈今反下之倖免不死暴虧氣血生命豈能久活又不知內經有云病氣不足宜補不宜瀉瞑目閤眼之病悉屬於陰宜汗不宜下又不知傷寒鬱冒得汗則愈是禁用寒涼藥也分娩半產本氣不病是暴去有形之血亡血補血又何疑焉補血則神昌常時血下降亡今當補而升舉之心得血則能養神不昏矣血暴降下是秋冬之令大旺今舉而升之以助其陽則目張神不昏迷矣今立一方補血養血生血益陽以補手足厥陰之不足以全生活血湯主之全生活血湯諸陽既陷何以知之血下脫故也紅花蔓荊子細辛各五分生地夏月倍加熟地各一錢藁本川芎各一錢五分防風羌活獨活甘草炙柴胡葛根歸身各二錢白芍藥升麻各三錢上㕮咀每服五錢水煎去渣食前稍熱服當歸附子湯治臍下冷痛赤白帶下當歸二分炒鹽三分蠍梢升麻各五錢甘草柴胡各七分黃柏少許附子乾薑良薑各一錢上㕮咀每服半兩水煎去渣稍熱服或為細末酒麵糊丸亦可鬥治婦人血風攻腦痛旋悶絕忽死倒地不知人事者用喝起草取其嫩心不限多少陰乾為末以常酒服一大錢不拘時候其功大效服之多達腦蓋善通頂門今蒼耳是也大治妊娠因外感風如中風狀不知人用熟艾為末醋炒令極熱乘熱以絹帛裹熨臍下良久開省奔豚氣上衝咽喉發作亦似死狀往來寒熱是也治見積聚卒中仆地半身不遂者為中風治見中風卒中仆地口吐涎沫者為癲癇治見癲癇運氣鬱冒有二其一屬熱經云少陰之復鬱冒不知人惡寒振慄又云少陽所至為瞀昧又云諸熱瞀瘈皆屬於火治以鹹寒是也其二屬寒經云歲火不及寒乃大行民病鬱冒矇昧心痛又太陽司天與太陽之復皆病善悲眩僕又陽明司天之政四之氣寒雨降病眩僕治以甘熱是也山中惡客忤卒死者灸臍中百壯以皂角末搐鼻或研韭汁灌耳中仲救卒死韭根烏梅二七個吳茱萸半升炒上三味以水一斗煮之以病櫛內中三沸櫛浮者生沉者死煮取三升去滓分飲之救卒死方雄雞冠割取血以管吹納鼻中豬脂如雞子大苦酒一升煮沸灌喉中雞肝及血塗面上以灰圍四旁立起大豆二七粒以雞子白並酒和盡吞之救卒死而壯熱者方用礬石半斤以水一斗半煮消以浸腳令沒踝世驚怖死者以溫酒灌之丹痰中後心下迷悶汪洋食少倦怠白朮二錢半川芎半錢蒼朮半夏茯苓各一錢姜三片水煎服四六嫂因食生菜青梅痰發昏冒不知人口渴脈滑今已能言但說心下痞痛乏力陳皮白朮各一錢蒼朮半錢滑石一錢半木香三分甘草炙些少半夏七分半水煎服婦人三十餘歲因產後能食半月後忽頭暈僕不知人醒後至今食少白朮二錢川芎黃芩茯苓各一錢姜三片上煎取三之一下保和丸三十粒本世言氣中者雖不見於方書然暴喜傷陽暴怒傷陰憂愁拂意氣多厥逆往往多得此疾便覺涎潮昏塞牙關緊急若概作中風候用藥非止不相當多致殺人元祐庚午母氏親遭此禍至今飲恨母氏平時食素氣血羸弱因先子捐館憂惱忽一日氣厥牙禁涎潮一里醫便作中風以大通丸三粒下之大下數行一夕卒予嘗痛恨每見此症急化蘇合香丸灌之便醒然後隨其寒熱虛實而調理之無不愈者經云無故而喑脈來乍大乍小乍短乍長者為祟滑者鬼疰緊而急者遁屍素脈至如喘名曰暴厥暴厥者不知與人言大奇論脈浮而散者為眴僕王注云浮為虛散為不足脈要精微論急虛身中卒至五臟絕閉脈道不通氣不往來譬於墮溺不可為期其脈絕不來若人一息五六至其形肉不脫真藏雖不見猶死也玉機真藏論無中暑脈陽弱陰虛微遲似芤脈問曰婦人病如癲疾鬱冒一日二十餘發師脈之反言帶下皆如師言其脈何類何以別之師曰寸口脈濡而緊濡則陽氣微緊則榮中寒陽微衛氣虛血竭凝寒陰陽不和邪氣舍於榮衛疾起年少時經水來以合房室移時過度精感命門開經下血虛百脈皆張中極感陽動微風激成寒因虛舍榮衛令積于丹田發動上衝奔在胸膈津液掩口入涎唾湧溢出眩冒狀如厥氣衝髀裡熱粗醫名為癲灸之因大劇問婦人病苦氣上衝胸眩冒吐涎沫髀裡氣沖熱師脈之不名帶下其脈何類何以別之師曰寸口脈沉而微沉則胃氣伏微則榮氣絕陽伏則為疹陰絕則為亡血病當小便不利津液閉塞今反小便通微汗出沉變為寒咳逆嘔沫其肺成痿津液竭少亡血損經絡因寒為血厥手足苦痹氣從丹田起上至胸脅沉寒怫鬱於上胸中窒塞氣歷陽部面翕翕如醉形體似肥此乃浮虛醫反下之長針復重虛榮衛久發眩冒故知為血厥也仲問曰寸口脈沉大而滑沉則為實滑則為氣實氣相搏血氣入臟即死入腑即愈此為卒厥何謂也師曰唇青身冷為入臟即死如身溫和汗自出為入腑即愈脈人病屍厥呼之不應脈伏者死脈大反小者死卒中惡腹大四肢滿脈大而緩者生緊大而浮者死緊細而微者亦生五絕丹治五絕一自縊二摧壓三溺水四魔魅五產乳用半夏一兩末為丸豆大納鼻中愈心溫者一日可治出子母秘錄仲救自縊死自旦至暮雖已冷必可治暮至旦則難恐此當言陰氣盛故也然夏時夜短於晝又熱猶應可治又云心下若微溫者一日以上猶可治之當徐徐抱解不得截繩上下安被臥之一人以腳踏其兩肩手挽其發常令弦急勿使縱緩一人以手按據胸上數摩動之一人摩捋臂脛屈伸之若已僵直但漸漸強屈之並按其腹如此一炊頃雖得氣從口出呼吸眼開仍引按莫置亦勿勞之須臾可少與桂湯及粥清含與之令喉潤漸漸能咽乃止更令兩人以管吹其兩耳此法最善無不活者山自縊者切不可割斷繩子以膝蓋或用手厚裹衣物緊頂穀道抱起解繩放下揉其項痕搐鼻及吹其兩耳待其氣回方可放手若便泄氣則不可救矣肘自縊死安定心神徐緩解之慎勿割繩斷抱取心下猶溫者刺雞冠血滴口中即活男雌女雄又方雞屎白如棗大酒半盞和灌及鼻中尤妙千金方以藍汁灌之余法同上山卒墮攧壓倒打死心頭溫者皆可救將本人如僧打坐令一人將其頭髮控放低用半夏末吹入鼻內如活卻以生薑汁香油打勻灌之仲救溺死方取灶中灰兩石埋之從頭至足水出七孔即活山溺水者放大凳上睡著將腳後凳腳站起二磚卻蘸鹽擦臍中待其水自流出切不可倒提出水此數等但心頭微熱者皆可救治又方溺水死一宿者尚活搗皂角綿裹納下部須臾出水即活世治鬼魘不寤中惡者皂角為末如綠豆大許吹入鼻中得嚏即氣通山魘死不得近前喚但痛咬其腳跟及唾其面不省者移動些少臥處徐徐喚之元有燈則存無燈切不可點燈及用皂角搐兩鼻肘臥忽不寤勿以火照之殺人但痛齧大拇指甲際而唾其面則活取韭搗汁吹鼻孔冬月用韭根取汁灌口中集治卒魘雄黃搗末細篩以管吹入鼻孔中暴死暴病暴死乃真死也皆死於片晌半日或一日二日如非卒中可再醒也靈黃帝曰其有卒然暴死暴病者何也少師答曰三虛者其死暴疾也得三實者邪不能傷人也黃帝曰願聞三虛少師曰乘年之衰逢月之空失時之和因為賊風所傷是為三虛故論不知三虛工反為粗帝曰願聞三實少師曰逢年之盛遇月之滿得時之和雖有賊風邪氣不能危之歲露篇三虛相搏則為暴病卒死全文見診歲為病運氣暴死暴病有四一曰虛經云六位之氣盈何如岐伯曰大少異也大者之至徐而常少者之至暴而亡是也蓋暴雖謂所至之氣然病氣皆在其中也二曰火經曰火鬱之發甚則悶懊憹善暴死又云少陰所至為暴死又云少陽司天之政三之氣炎暑至民病暴死又云陽明司天之政二之氣榮厲大至民善暴死又云少陽所至為暴病是也三曰風火經云少陽司天火氣下臨風行於地其主暴速又云厥陰司天風氣下臨其發機速主所謂變化卒急其為疾病速在發機是也四曰金經云金太過曰堅成堅成之紀其動暴折瘍疰是也此金兼火化之氣金主折火主暴也靈雷公曰人不病而卒死何以知之黃帝曰火氣入於臟腑者不病而卒死矣雷公曰病小愈而卒死者何以知之黃帝曰赤色出兩顴大如拇指者病雖小愈必卒死黑色出於庭大如拇指必不病而卒死赤色出兩顴即脈訣所謂暴病如妝不久居者是也五色篇太陽根於至陰結於命門命門者目也太陽為開開折則肉節瀆而暴病起矣故暴病者取之太陽視有餘不足瀆者皮肉宛膲而弱也根結篇
